name: Cleany CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleany-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: build-and-unit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: ros:humble-ros-base-jammy@sha256:7bea3d9aa2483d3ca34c8e30d921b79273b0913bd7dc64bebf51d082b5d107e4
    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_DOMAIN_ID: "42"
      ROS_HOME: /tmp/cleany-ros
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false

      - name: Trust checkout workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install CI bootstrap dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip \
            xauth \
            xvfb

      - name: Verify CI environment
        run: |
          set -eo pipefail
          source /etc/os-release
          test "${VERSION_ID}" = "22.04"
          test "$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.10"
          test -f /opt/ros/humble/setup.bash
          source /opt/ros/humble/setup.bash
          test "${ROS_DISTRO}" = "humble"
          command -v git
          command -v make
          command -v pip3
          command -v ros2
          command -v colcon
          command -v rosdep
          command -v xvfb-run

      - name: Register Cleany rosdep rules
        run: |
          set -euo pipefail
          rule_file="${GITHUB_WORKSPACE}/ros2_ws/rosdep/cleany.yaml"
          test -f "${rule_file}"
          echo "yaml file://${rule_file}" \
            > /etc/ros/rosdep/sources.list.d/10-cleany.list
          rosdep update --rosdistro humble

      - name: Install workspace dependencies
        run: make deps

      - name: Verify Gazebo baseline
        run: make check-gazebo-env

      - name: Build and test workspace
        run: xvfb-run -a -s "-screen 0 1280x1024x24" make test
