name: Cleany CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: cleany-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: build-and-unit
    runs-on: ubuntu-22.04
    # Image creation is a cold path; ordinary runs reuse the dependency image.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false

      - name: Prepare phone UI build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ros2_ws/src/cleany_teleop/ui/package-lock.json

      - name: Build and test phone UI
        id: ui
        continue-on-error: true
        run: |
          python3 tools/ci/check.py --root "${RUNNER_TEMP}/cleany-builds/checks" run ui --kind contract --timeout 180 -- \
            bash -c 'make build-teleop-ui && node --test ros2_ws/src/cleany_teleop/ui/test_hold_input.cjs'

      - name: Test CI tools
        run: make test-ci-tools

      - name: Identify dependency image
        id: dependencies
        run: |
          python3 tools/ci/dependency_image.py \
            --context "${RUNNER_TEMP}/ci-context" \
            --repository "${GITHUB_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/cleany-ccache
          key: cleany-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependencies.outputs.key }}-${{ github.sha }}
          restore-keys: |
            cleany-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependencies.outputs.key }}-
            cleany-ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Authenticate dependency image registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Prepare dependency image
        id: image
        env:
          IMAGE: ${{ steps.dependencies.outputs.image }}
          COMPATIBLE_IMAGE: ${{ steps.dependencies.outputs.compatible_image }}
          DEPENDENCY_KEY: ${{ steps.dependencies.outputs.key }}
        run: |
          set -euo pipefail
          if docker pull "${IMAGE}"; then
            echo 'hit=true' >> "${GITHUB_OUTPUT}"
          elif [[ -n "${COMPATIBLE_IMAGE}" ]] && tools/ci/reuse-dependencies \
            "${COMPATIBLE_IMAGE}" "${IMAGE}" "${RUNNER_TEMP}/ci-context" \
            "${DEPENDENCY_KEY}" "${GITHUB_REPOSITORY}"; then
            echo 'hit=false' >> "${GITHUB_OUTPUT}"
            echo "Reused dependency image after current manifest and version checks: ${COMPATIBLE_IMAGE}" \
              >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'hit=false' >> "${GITHUB_OUTPUT}"
            timeout --signal=TERM --kill-after=30s 15m docker build --pull --platform linux/amd64 \
              --build-arg "DEPENDENCY_KEY=${DEPENDENCY_KEY}" \
              --build-arg "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" \
              --tag "${IMAGE}" --file "${RUNNER_TEMP}/ci-context/containers/ci/Dockerfile" \
              "${RUNNER_TEMP}/ci-context"
          fi
          docker image inspect "${IMAGE}" --format '{{.Id}}' >> "${GITHUB_STEP_SUMMARY}"

      - name: Start CI environment
        env:
          IMAGE: ${{ steps.dependencies.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cleany-builds" "${RUNNER_TEMP}/cleany-ccache"
          # Bound package-level and compiler-level parallelism together.
          compile_jobs=$(( $(nproc) / 2 ))
          test "${compile_jobs}" -ge 1 || compile_jobs=1
          docker run --detach --name cleany-ci --entrypoint sleep \
            --workdir "${GITHUB_WORKSPACE}" \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --volume "${RUNNER_TEMP}/cleany-builds:/ci-builds" \
            --volume "${RUNNER_TEMP}/cleany-ccache:/ci-ccache" \
            --env CLEANY_BUILD_ROOT=/ci-builds \
            --env CCACHE_DIR=/ci-ccache --env CCACHE_MAXSIZE=2G \
            --env CCACHE_COMPILERCHECK=content --env "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" \
            --env "CMAKE_BUILD_PARALLEL_LEVEL=${compile_jobs}" \
            --env "MAKEFLAGS=-j${compile_jobs} -l${compile_jobs}" \
            --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            --env LIBGL_ALWAYS_SOFTWARE=1 --env ROS_DOMAIN_ID=42 \
            --env ROS_HOME=/tmp/cleany-ros "${IMAGE}" infinity
          docker exec cleany-ci git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          tools/ci/run ccache --zero-stats

      - name: Verify CI environment
        id: environment
        run: |
          tools/ci/run python3 tools/ci/check.py --root /ci-builds/checks run environment --kind environment --timeout 120 -- bash -c '
            set -eo pipefail
            source /etc/os-release
            test "${VERSION_ID}" = "22.04"
            test "${ROS_DISTRO}" = "humble"
            test "$(python3 -c '\''import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")'\'')" = "3.10"
            for command in git make pip3 ros2 colcon rosdep xvfb-run ccache; do
              command -v "${command}"
            done
            python3 -m pytest --version
            git rev-parse HEAD
            python3 tools/ci/preflight.py
            env ROS_HOME=/root/.ros rosdep check --from-paths ros2_ws/src --ignore-src --rosdistro humble --skip-keys "sllidar_ros2 micro_ros_agent"
            python3 containers/ci/verify-versions.py
            make check-gazebo-env
          '

      - name: Publish dependency image
        if: success() && steps.image.outputs.hit == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          IMAGE: ${{ steps.dependencies.outputs.image }}
        run: |
          docker push "${IMAGE}" || echo '::warning::Image publication failed; subsequent runs will build dependencies locally.'

      - name: Prepare geometry test dependencies
        run: |
          tools/ci/run python3 -m pip install --no-deps --requirement tests/requirements-geometry.txt
          tools/ci/run bash -c 'python3 -m pip freeze > /opt/cleany-ci/pip-packages.txt'

      - name: Test host camera initialization
        continue-on-error: true
        run: tools/ci/run python3 tools/ci/check.py --root /ci-builds/checks run camera --kind contract --timeout 120 -- make test-camera-orientation

      - name: Build workspace
        id: build
        continue-on-error: true
        run: tools/ci/run python3 tools/ci/check.py --root /ci-builds/checks run build --kind build --timeout 1200 -- make build COLCON_BUILD_ARGS=--cmake-force-configure

      - name: Test Navigation contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: tools/ci/run python3 tools/ci/check.py --root /ci-builds/checks run navigation --kind contract --timeout 600 -- bash -c 'source /ci-builds/install/setup.bash && cd ros2_ws && xvfb-run -a python3 ../tools/ci/workspace_tests.py navigation'

      - name: Test manipulation contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: tools/ci/run python3 tools/ci/check.py --root /ci-builds/checks run manipulation --kind contract --timeout 900 -- bash -c 'source /ci-builds/install/setup.bash && cd ros2_ws && xvfb-run -a python3 ../tools/ci/workspace_tests.py manipulation'

      - name: Test remaining workspace contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: tools/ci/run python3 tools/ci/check.py --root /ci-builds/checks run workspace-rest --kind contract --timeout 900 -- bash -c 'source /ci-builds/install/setup.bash && cd ros2_ws && xvfb-run -a python3 ../tools/ci/workspace_tests.py workspace-rest'

      - name: Test motor core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: tools/ci/run python3 tools/ci/check.py --root /ci-builds/checks run motor --kind contract --timeout 180 -- make test-motor-core

      - name: Test common navigation runtime without Gazebo
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          tools/ci/run python3 tools/ci/check.py --root /ci-builds/checks run ros-runtime --kind integration --timeout 600 -- \
            make -o build-navigation test-navigation-runtime \
            NAVIGATION_BUILD_BASE=/ci-builds/build \
            NAVIGATION_INSTALL_BASE=/ci-builds/install \
            NAVIGATION_LOG_BASE=/ci-builds/log

      - name: Test Gazebo navigation runtime
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: |
          tools/ci/run python3 tools/ci/check.py --root /ci-builds/checks run gazebo-runtime --kind simulation --timeout 600 -- \
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 +extension GLX" make -o build-gazebo test-gazebo-nav-runtime

      - name: Require all checks and summarize failures
        if: always()
        run: |
          python3 tools/ci/check.py --root "${RUNNER_TEMP}/cleany-builds/checks" summary \
            ui environment camera build navigation manipulation workspace-rest motor ros-runtime gazebo-runtime

      - name: Collect diagnostics and compiler cache statistics
        id: diagnostics
        if: always()
        run: |
          if docker inspect cleany-ci >/dev/null 2>&1; then
            tools/ci/run ccache --show-stats | tee "${RUNNER_TEMP}/cleany-builds/ccache.txt"
            docker cp cleany-ci:/opt/cleany-ci/dpkg-packages.txt "${RUNNER_TEMP}/cleany-builds/"
            docker cp cleany-ci:/opt/cleany-ci/pip-packages.txt "${RUNNER_TEMP}/cleany-builds/"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/cleany-ccache"
            echo 'cache-ready=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Save compiler cache
        if: always() && steps.diagnostics.outputs.cache-ready == 'true' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/cleany-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Upload test results and environment
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cleany-builds/build/**/test_results/**/*.xml
            ${{ runner.temp }}/cleany-builds/build/**/pytest.xml
            ${{ runner.temp }}/cleany-builds/log/**/stdout_stderr.log
            ${{ runner.temp }}/cleany-builds/build/**/Testing/**
            ${{ runner.temp }}/cleany-builds/checks/**
            ${{ runner.temp }}/cleany-builds/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop CI environment
        if: always()
        run: docker rm --force cleany-ci || true
