name: Cleany CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: cleany-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: build-and-unit
    runs-on: ubuntu-22.04
    # Image creation is a cold path; ordinary runs reuse the dependency image.
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: false

      - name: Test CI tools
        run: make test-ci-tools

      - name: Identify dependency image
        id: dependencies
        run: |
          python3 tools/ci/dependency_image.py \
            --context "${RUNNER_TEMP}/ci-context" \
            --repository "${GITHUB_REPOSITORY}" >> "${GITHUB_OUTPUT}"

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/cleany-ccache
          key: cleany-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependencies.outputs.key }}-${{ github.sha }}
          restore-keys: |
            cleany-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependencies.outputs.key }}-
            cleany-ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Authenticate dependency image registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Prepare dependency image
        id: image
        env:
          IMAGE: ${{ steps.dependencies.outputs.image }}
          DEPENDENCY_KEY: ${{ steps.dependencies.outputs.key }}
        run: |
          set -euo pipefail
          if docker pull "${IMAGE}"; then
            echo 'hit=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'hit=false' >> "${GITHUB_OUTPUT}"
            docker build --pull --platform linux/amd64 \
              --build-arg "DEPENDENCY_KEY=${DEPENDENCY_KEY}" \
              --build-arg "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" \
              --tag "${IMAGE}" --file "${RUNNER_TEMP}/ci-context/containers/ci/Dockerfile" \
              "${RUNNER_TEMP}/ci-context"
          fi
          docker image inspect "${IMAGE}" --format '{{.Id}}' >> "${GITHUB_STEP_SUMMARY}"

      - name: Start CI environment
        env:
          IMAGE: ${{ steps.dependencies.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/cleany-builds" "${RUNNER_TEMP}/cleany-ccache"
          # Bound package-level and compiler-level parallelism together.
          compile_jobs=$(( $(nproc) / 2 ))
          test "${compile_jobs}" -ge 1 || compile_jobs=1
          docker run --detach --name cleany-ci --entrypoint sleep \
            --workdir "${GITHUB_WORKSPACE}" \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --volume "${RUNNER_TEMP}/cleany-builds:/ci-builds" \
            --volume "${RUNNER_TEMP}/cleany-ccache:/ci-ccache" \
            --env CLEANY_BUILD_ROOT=/ci-builds \
            --env CCACHE_DIR=/ci-ccache --env CCACHE_MAXSIZE=2G \
            --env CCACHE_COMPILERCHECK=content --env "CCACHE_BASEDIR=${GITHUB_WORKSPACE}" \
            --env "CMAKE_BUILD_PARALLEL_LEVEL=${compile_jobs}" \
            --env LIBGL_ALWAYS_SOFTWARE=1 --env ROS_DOMAIN_ID=42 \
            --env ROS_HOME=/tmp/cleany-ros "${IMAGE}" infinity
          docker exec cleany-ci git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          tools/ci/run ccache --zero-stats

      - name: Verify CI environment
        run: |
          tools/ci/run bash -c '
            set -eo pipefail
            source /etc/os-release
            test "${VERSION_ID}" = "22.04"
            test "${ROS_DISTRO}" = "humble"
            test "$(python3 -c '\''import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")'\'')" = "3.10"
            for command in git make pip3 ros2 colcon rosdep xvfb-run ccache; do
              command -v "${command}"
            done
            python3 -m pytest --version
            git rev-parse HEAD
          '
          tools/ci/run rosdep check --from-paths ros2_ws/src --ignore-src --rosdistro humble
          tools/ci/run make check-gazebo-env

      - name: Publish dependency image
        if: success() && steps.image.outputs.hit == 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          IMAGE: ${{ steps.dependencies.outputs.image }}
        run: |
          docker push "${IMAGE}" || echo '::warning::Image publication failed; subsequent runs will build dependencies locally.'

      - name: Build and test workspace
        run: tools/ci/run xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 +extension GLX" make test

      - name: Test motor core
        run: tools/ci/run make test-motor-core

      - name: Test common navigation runtime without Gazebo
        run: |
          tools/ci/run make -o build-navigation test-navigation-runtime \
            NAVIGATION_BUILD_BASE=/ci-builds/build \
            NAVIGATION_INSTALL_BASE=/ci-builds/install \
            NAVIGATION_LOG_BASE=/ci-builds/log

      - name: Test Gazebo navigation runtime
        run: tools/ci/run xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 +extension GLX" make -o build-gazebo test-gazebo-nav-runtime

      - name: Collect diagnostics and compiler cache statistics
        id: diagnostics
        if: always()
        run: |
          if docker inspect cleany-ci >/dev/null 2>&1; then
            tools/ci/run ccache --show-stats | tee "${RUNNER_TEMP}/cleany-builds/ccache.txt"
            docker cp cleany-ci:/opt/cleany-ci/dpkg-packages.txt "${RUNNER_TEMP}/cleany-builds/"
            docker cp cleany-ci:/opt/cleany-ci/pip-packages.txt "${RUNNER_TEMP}/cleany-builds/"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/cleany-ccache"
            echo 'cache-ready=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Save compiler cache
        if: always() && steps.diagnostics.outputs.cache-ready == 'true' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/cleany-ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Upload test results and environment
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cleany-builds/build/**/test_results/**/*.xml
            ${{ runner.temp }}/cleany-builds/build/**/pytest.xml
            ${{ runner.temp }}/cleany-builds/log/latest_test/**/stdout_stderr.log
            ${{ runner.temp }}/cleany-builds/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop CI environment
        if: always()
        run: docker rm --force cleany-ci || true
