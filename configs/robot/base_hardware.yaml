# User-supplied geometry: 127 mm wheel diameter; 350 mm front/rear and 610 mm
# left/right wheel-center distances (center-to-center).
mode: hardware
geometry:
  # 127 mm diameter -> 63.5 mm radius.
  wheel_radius_m: 0.0635
  wheelbase_m: 0.350
  wheel_separation_m: 0.610
limits:
  linear_x_mps: null
  linear_y_mps: null
  angular_z_rad_s: null
  wheel_rad_s: null
  command_timeout_s: null
protocol:
  counts_per_revolution: 3172
  watchdog_ms: 250
