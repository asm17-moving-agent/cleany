# Contact criteria shared by physical grasp execution and the evidence node.
schema_version: 1
decision: motor_resistance_contact
runtime_activation: hardware_contact_evidence
units:
  position: encoder_tick
  current: decoded_absolute_raw
  current_ma_per_raw_nominal: 6.5
  load: decoded_pwm_magnitude_raw
  voltage_v_per_raw: 0.1
criteria:
  output_limit_raw: 200
  window_sec: 0.4
  maximum_gap_sec: 0.1  # 미만
  maximum_age_sec: 0.1  # 온라인 연결 시 신선도 요구; 과거 끝 구간 재생으로 검증되지 않음
  residual_threshold_ticks: 28  # 접촉은 초과; 빈 상태는 절댓값 이하
  current_threshold_raw: 9  # 창 중앙값 이상; 명목 58.5 mA
  current_stop_raw: 250  # 시험 당시 EEPROM 28과 앱 보호 기준; 한 샘플이라도 이상이면 UNKNOWN
  load_threshold_raw: 130  # 창 최솟값 이상
  voltage_min_raw: 90
  voltage_max_raw: 140
  temperature_limit_c: 80  # 미만; operational 드라이버 요청값과 동일
arms:
  left:
    motor_id: 6
    closed_goal_raw: 1358
    opening_direction: 1
  right:
    motor_id: 12
    closed_goal_raw: 1372
    opening_direction: 1
states:
  CONTACT: position_residual_and_sustained_current_and_load
  EMPTY: near_closed_goal_and_low_current_and_low_load
  UNKNOWN: missing_stale_faulted_out_of_profile_or_conflicting_signals
scope:
  object_supported: true
  lift_retention_validated: false
  high_output_threshold_validated: false
  current_to_force_or_torque_calibrated: false
  # CONTACT는 기계적 저항의 증거. 목표 물체 식별과 상승 후 동행 관측이 별도로 필요하다.
