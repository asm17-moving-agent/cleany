# Operator-supervised normal-motion profile. Only right IDs 7-12 are commandable.
status: operator_supervised_operational
command_joints:
  - right_shoulder_yaw_joint
  - right_shoulder_pitch_joint
  - right_elbow_pitch_joint
  - right_wrist_pitch_joint
  - right_wrist_roll_joint
  - right_gripper_joint
update_rate: 50
arm_endpoint_margin_ticks: 20
arm_endpoint_load_raw: 300
serial_timeout_ms: 20
max_state_age_s: 0.1
temperature_limit_c: 80
temperature_macd_fast_tau_s: 0.1
temperature_macd_slow_tau_s: 0.5
temperature_macd_signal_tau_s: 0.1
joint_defaults:
  max_velocity: 1.0
  max_acceleration: 2.0
  tracking_error: 0.0
  speed_raw: 800
  acceleration_raw: 254
  torque_limit_raw: 800
joint_overrides:
  right_gripper_joint: {torque_limit_raw: 400, temperature_limit_c: 80, acceleration_raw: 1, speed_raw: 75, max_velocity: 0.06, max_acceleration: 0.1}
controller:
  trajectory_tolerance: 0.0
  goal_tolerance: 0.03
  goal_time: 5.0

# 2026-10-06: calibration and measured wrist range about the manual CAD reference.
# 2026-10-09: pitch bounds use the calibrated raw ranges; EEPROM is unchanged.
calibrated_joint_position_bounds:
  - right_shoulder_yaw_joint
  - right_shoulder_pitch_joint
  - right_elbow_pitch_joint
  - right_wrist_pitch_joint
  - left_wrist_roll_joint
  - right_wrist_roll_joint
  - right_gripper_joint
joint_position_bounds: {}
