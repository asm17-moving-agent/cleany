<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">같은 점도 기준에 따라 숫자가 달라집니다</title><desc id="desc">base_link 축은 X 전방 Y 좌측 Z 위, optical 축은 X 우측 Y 아래 Z 전방</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#333333"/></marker></defs><rect width="900" height="340" fill="#fff"/><g font-family="system-ui, sans-serif"><text x="32" y="40" fill="#242424" font-size="22" text-anchor="start" font-weight="700">같은 점도 기준에 따라 숫자가 달라집니다</text><rect x="35" y="75" width="400" height="232" rx="12" fill="#fafafa" stroke="#dedede"/><rect x="465" y="75" width="400" height="232" rx="12" fill="#fafafa" stroke="#dedede"/><text x="235" y="110" fill="#242424" font-size="18" text-anchor="middle" font-weight="650">로봇 기준 · 위에서 보기</text><text x="665" y="110" fill="#242424" font-size="18" text-anchor="middle" font-weight="650">카메라 optical 기준</text><rect x="182" y="175" width="105" height="85" rx="12" fill="#e0e0e0" stroke="#333333"/><path d="M234 216V130" fill="none" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)" /><path d="M234 217H110" fill="none" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)" /><circle cx="234" cy="216" r="5" fill="#333333" stroke="#333333"/><text x="260" y="149" fill="#333333" font-size="16" text-anchor="start" font-weight="400">+X 전방</text><text x="92" y="210" fill="#333333" font-size="16" text-anchor="middle" font-weight="400">+Y</text><text x="234" y="287" fill="#6b6b6b" font-size="16" text-anchor="middle" font-weight="400">+Z 위쪽 (화면 밖)</text><circle cx="635" cy="174" r="21" fill="#e0e0e0" stroke="#333333"/><path d="M635 174H788" fill="none" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)" /><path d="M635 174V263" fill="none" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)" /><path d="M635 174L537 238" fill="none" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)" /><text x="791" y="163" fill="#333333" font-size="16" text-anchor="middle" font-weight="400">+X 오른쪽</text><text x="682" y="273" fill="#333333" font-size="16" text-anchor="middle" font-weight="400">+Y 아래</text><text x="546" y="262" fill="#333333" font-size="16" text-anchor="middle" font-weight="400">+Z 전방</text><text x="665" y="297" fill="#6b6b6b" font-size="14" text-anchor="middle" font-weight="400">축 방향을 같다고 가정하지 않기</text></g></svg>