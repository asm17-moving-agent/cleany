<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">먼저 접근 준비 위치를 찾습니다</title><desc id="desc">접근 방향 반대편의 pre-grasp 위치와 grasp 후보 TCP 위치</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#333333"/></marker></defs><rect width="900" height="360" fill="#fff"/><g font-family="system-ui, sans-serif"><text x="32" y="40" fill="#242424" font-size="22" text-anchor="start" font-weight="700">먼저 접근 준비 위치를 찾습니다</text><rect x="55" y="265" width="785" height="22" rx="4" fill="#d5d5d5" stroke="#b9b9b9"/><rect x="616" y="175" width="75" height="88" rx="12" fill="#999999" stroke="#606060"/><ellipse cx="653.5" cy="175" rx="37.5" ry="12" fill="#b0b0b0"/><path d="M254 165H596" fill="none" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)" /><circle cx="254" cy="165" r="8" fill="#fff" stroke="#333333"/><circle cx="596" cy="165" r="8" fill="#333333" stroke="#333333"/><text x="254" y="113" fill="#333333" font-size="20" text-anchor="middle" font-weight="650">pre-grasp</text><text x="596" y="113" fill="#333333" font-size="20" text-anchor="middle" font-weight="650">grasp 후보 위치</text><text x="426" y="150" fill="#6b6b6b" font-size="16" text-anchor="middle" font-weight="400">접근 방향</text><path d="M280 213H550" fill="none" stroke="#333333" stroke-width="2.4" stroke-dasharray="6 5" /><text x="419" y="242" fill="#6b6b6b" font-size="16" text-anchor="middle" font-weight="400">설정된 접근 거리</text><path d="M231 146H193V212H231" fill="none" stroke="#333333" stroke-width="2.4" /><text x="653" y="325" fill="#6b6b6b" font-size="18" text-anchor="middle" font-weight="400">선택과 실행은 별도 단계</text><text x="230" y="325" fill="#6b6b6b" font-size="18" text-anchor="middle" font-weight="400">도구 끝 기준점: TCP</text></g></svg>