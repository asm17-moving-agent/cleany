<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Cleany로 배우는 로봇 소프트웨어</title>
  <style>
    :root{--paper:#fafafa;--ink:#242424;--muted:#6b6b6b;--line:#dedede;--accent:#333333;--wash:#eeeeee;--sidebar:286px}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:16px;line-height:1.85}
    a{color:var(--accent);text-underline-offset:4px}button,input{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #555555;outline-offset:4px}button:disabled{cursor:default}
    .skip{position:fixed;top:-100px;left:16px;z-index:10;background:white;padding:8px 16px}.skip:focus{top:12px}
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:4}
    .brand{padding:26px 24px 18px}.wordmark{font-size:22px;font-weight:800;letter-spacing:-.8px;text-decoration:none}.wordmark span{color:var(--accent)}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .search{margin:0 20px 12px}.search label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.search input{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 11px;background:var(--paper);font-size:14px;line-height:1.5}
    #contents{overflow-y:auto;flex:1;padding:0 12px 20px}.part{font-size:11px;font-weight:750;letter-spacing:.06em;color:var(--muted);margin:18px 12px 7px}.chapter{display:block;padding:9px 12px;margin:2px 0;border-radius:6px;text-decoration:none;line-height:1.55;font-size:14px;color:var(--ink)}.chapter:hover{background:#f4f4f4}.chapter[aria-current=page]{background:var(--wash);color:var(--accent);font-weight:700}.chapter-row{display:flex;align-items:flex-start}.chapter-row .chapter{flex:1;min-width:0}.chapter-toggle{flex:none;width:28px;height:32px;margin-top:6px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:13px}.chapter-toggle:hover{background:var(--wash);color:var(--ink)}.chapter-toggle[aria-expanded=true]{transform:rotate(90deg)}.sections{margin:1px 0 7px 16px;padding-left:11px;border-left:1px solid var(--line)}.section{display:block;padding:6px 10px;border-radius:5px;line-height:1.5;text-decoration:none;color:var(--muted);font-size:12px}.section:hover{background:#f4f4f4;color:var(--ink)}.section[aria-current=location]{background:var(--wash);color:var(--ink);font-weight:650}.no-results{font-size:14px;padding:12px;color:var(--muted)}
    .sidebar-footer{padding:12px 24px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.sidebar-footer a{font-size:12px}
    .mobile-bar{display:none}.drawer-close{display:none}.overlay{display:none}.shell{margin-left:var(--sidebar);padding:32px 56px 64px}.book{max-width:820px;margin:auto}.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:32px}.meta .source{margin-left:auto}.source a{color:var(--muted)}
    article{overflow-wrap:anywhere;min-height:50vh}article:focus{outline:none}article h1{font-size:34px;line-height:1.4;letter-spacing:-1.2px;margin:0 0 24px;font-weight:780}article h2{font-size:23px;line-height:1.5;letter-spacing:-.5px;margin:40px 0 14px}article h3{font-size:18px;margin:28px 0 10px}article p{margin:15px 0}article ul,article ol{padding-left:24px;margin:12px 0}article li{margin:5px 0}article blockquote{border-left:3px solid #888888;background:var(--wash);padding:10px 18px;margin:22px 0;border-radius:0 6px 6px 0;font-size:14px}article blockquote p{margin:3px 0}
    article code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.87em;background:#eeeeee;padding:2px 5px;border-radius:4px}article pre{position:relative;margin:20px 0;border:1px solid var(--line);border-radius:8px;padding:38px 20px 18px;background:#f5f5f5;overflow:auto;line-height:1.6;font-size:14px}article pre code{background:none;padding:0;font-size:inherit;white-space:pre;overflow-wrap:normal}.copy{position:absolute;top:6px;right:10px;border:1px solid #d8d8d8;border-radius:4px;background:#fff;color:var(--muted);font-size:11px;padding:1px 9px}.copy:hover{color:var(--accent)}
    article img{display:block;width:100%;height:auto;max-width:100%;margin:22px auto 10px;border-radius:8px;border:1px solid var(--line);background:white}.figure-link{display:block}.figure-caption{font-size:12px;color:var(--muted);margin-top:4px!important}.figure-caption em{font-style:normal}.table-scroll{overflow:auto;margin:20px 0}article table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.65}article th,article td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}article th{background:#f0f0f0;font-weight:650}article details{padding:12px 16px;margin:18px 0;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:14px}article summary{cursor:pointer;font-weight:650}article hr{border:0;border-top:1px solid var(--line);margin:32px 0}
    .mermaid-figure{margin:22px 0}.mermaid-diagram{overflow-x:auto;padding:18px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center}.mermaid-diagram:focus-visible{outline:2px solid #555;outline-offset:3px}.mermaid-diagram svg{display:block;max-width:none!important;margin:auto}.mermaid-source{margin-top:8px!important}.mermaid-error{font-size:13px;color:var(--muted);margin:0 0 8px}.mermaid-hint{margin:6px 0!important;font-size:11px;color:var(--muted)}
    .heading-link{text-decoration:none;color:inherit}.heading-link:hover{color:var(--accent)}.page-nav{display:grid;grid-template-columns:1fr 1fr;gap:20px;border-top:1px solid var(--line);margin-top:48px;padding-top:24px}.page-nav a{text-decoration:none;border:1px solid var(--line);padding:14px 18px;border-radius:8px;background:white;font-size:14px;line-height:1.6}.page-nav a:hover{border-color:#888888}.page-nav small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.page-nav .next{text-align:right}.page-nav a[hidden]{display:none}.endnote{font-size:11px;color:var(--muted);margin-top:30px}.error{background:white;border:1px solid var(--line);border-radius:8px;padding:24px}.error h1{font-size:23px}.error pre{white-space:pre-wrap;overflow-wrap:anywhere}
    @media(min-width:1500px){.shell{padding-top:44px}.book{max-width:860px}}
    @media(max-width:1000px){:root{--sidebar:250px}.shell{padding:28px 30px 50px}article h1{font-size:29px}}
    @media(max-width:760px){.sidebar{width:286px;transform:translateX(-100%);transition:transform .16s ease}.sidebar.open{transform:translateX(0)}.overlay.open{display:block;position:fixed;inset:0;background:#24242466;z-index:3;border:0}.mobile-bar{display:flex;position:sticky;top:0;z-index:2;align-items:center;gap:12px;background:#fffffff5;border-bottom:1px solid var(--line);padding:10px 18px;line-height:1.6}.mobile-bar button{border:1px solid var(--line);background:white;border-radius:5px;padding:4px 10px;font-size:13px}.mobile-bar span{font-size:14px;font-weight:650}.shell{margin-left:0;padding:22px 22px 40px}.meta{margin-bottom:24px}.meta .source{margin-left:0}article h1{font-size:26px}article h2{font-size:21px}article pre{font-size:12px;padding-left:14px;padding-right:14px}.page-nav{gap:10px}.page-nav a{padding:12px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sidebar{transition:none}}
    @media(max-width:760px){.drawer-close{display:block;position:absolute;top:28px;right:20px;border:1px solid var(--line);background:white;border-radius:5px;padding:3px 9px;font-size:12px;line-height:1.6}}
    @media print{.sidebar,.mobile-bar,.page-nav,.copy,.skip,.endnote{display:none}.shell{margin:0;padding:0}.meta{margin:0 0 24px}article{min-height:0}article pre{white-space:pre-wrap}article pre code{white-space:pre-wrap}article details{break-inside:avoid}article img{max-height:330px;object-fit:contain}body{background:white;font-size:12px}article h1{font-size:25px}article h2{font-size:19px}}
  </style>
</head>
<body>
  <a class="skip" href="#article">본문으로 건너뛰기</a>
  <header class="mobile-bar"><button id="menu" aria-controls="sidebar" aria-expanded="false">목차</button><span>Cleany · 로봇 코드 함께 읽기</span></header>
  <button class="overlay" id="overlay" aria-label="목차 닫기" tabindex="-1"></button>
  <aside class="sidebar" id="sidebar" aria-label="책 목차">
    <div class="brand"><a class="wordmark" href="#start">Cleany<span> /</span></a><button class="drawer-close" id="close-menu" aria-label="목차 닫기">닫기</button><p>처음부터 함께 읽는 로봇 소프트웨어</p></div>
    <div class="search"><label for="search">목차 검색</label><input id="search" type="search" placeholder="좌표계, ROS, 파지…" autocomplete="off"></div>
    <nav id="contents" aria-label="학습 순서"></nav>
    <div class="sidebar-footer"><a href="../../README.md" target="_blank" rel="noopener">프로젝트 README ↗</a><br>구현 기준 47bc1f7 · 구현 학습 가이드</div>
  </aside>
  <main class="shell" id="main">
    <div class="book">
      <div class="meta"><span id="part">시작하기</span><span id="position"></span><span id="duration"></span><span class="source"><a id="raw" href="README.md" target="_blank" rel="noopener">Markdown 원문 ↗</a></span></div>
      <article id="article" tabindex="-1" aria-busy="true"><p role="status">가이드를 불러오는 중입니다…</p></article>
      <nav class="page-nav" aria-label="앞뒤 페이지"><a id="previous" hidden><small>이전 페이지</small><span></span></a><a id="next" class="next" hidden><small>다음 페이지</small><span></span></a></nav>
      <p class="endnote">SVG 그림은 누르면 새 탭에서 크게 볼 수 있습니다. 흐름도는 가로로 스크롤하고 Mermaid 원문을 펼쳐 볼 수 있습니다. 실제 설정과 실행 조건은 연결된 패키지 README에서 확인하세요.</p>
    </div>
  </main>
  <script src="vendor/marked.umd.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/mermaid.tiny.js"></script>
  <script>
    'use strict';
    const article=document.querySelector('#article');
    const sidebar=document.querySelector('#sidebar');
    const search=document.querySelector('#search');
    const menu=document.querySelector('#menu');
    const overlay=document.querySelector('#overlay');
    const main=document.querySelector('#main');
    const mobile=window.matchMedia('(max-width:760px)');
    let pages=[],currentId='',activeSection='',generation=0;
    const expanded=new Map();
    let diagramSerial=0;
    if(window.mermaid)mermaid.initialize({startOnLoad:false,securityLevel:'strict',htmlLabels:false,look:'classic',suppressErrorRendering:true,theme:'base',fontFamily:'system-ui, sans-serif',themeVariables:{primaryColor:'#f3f3f3',primaryTextColor:'#242424',primaryBorderColor:'#888888',lineColor:'#555555',secondaryColor:'#eeeeee',tertiaryColor:'#fafafa',background:'#ffffff',mainBkg:'#f3f3f3',nodeBorder:'#888888',clusterBkg:'#fafafa',clusterBorder:'#cccccc',edgeLabelBackground:'#ffffff',fontSize:'15px'},flowchart:{htmlLabels:false,useMaxWidth:false},sequence:{useMaxWidth:false},state:{useMaxWidth:false}});
    const slug=text=>text.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,'').replace(/\s+/g,'-')||'section';
    const pageURL=page=>new URL(page.file,document.baseURI);
    const route=(id,section='')=>'#'+id+(section?'/'+encodeURIComponent(section):'');
    const parseRoute=()=>{const [id,section='']=location.hash.slice(1).split('/');let anchor='';try{anchor=decodeURIComponent(section);}catch{}return {id:id||'start',section:anchor};};
    function toggleMenu(open){
      sidebar.classList.toggle('open',open);overlay.classList.toggle('open',open);
      menu.setAttribute('aria-expanded',String(open));
      main.inert=open&&mobile.matches;
      document.querySelector('.mobile-bar').inert=open&&mobile.matches;
      sidebar.inert=mobile.matches&&!open;
      document.body.style.overflow=open&&mobile.matches?'hidden':'';
      if(open)search.focus();
    }
    menu.addEventListener('click',()=>toggleMenu(true));
    overlay.addEventListener('click',()=>{toggleMenu(false);menu.focus();});
    document.querySelector('#close-menu').addEventListener('click',()=>{toggleMenu(false);menu.focus();});
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&sidebar.classList.contains('open')){toggleMenu(false);menu.focus();}
      if(event.key==='Tab'&&mobile.matches&&sidebar.classList.contains('open')){
        const controls=[...sidebar.querySelectorAll('a[href],input,button')].filter(el=>el.getClientRects().length);
        const first=controls[0],last=controls.at(-1);
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
      }
    });
    mobile.addEventListener('change',()=>toggleMenu(false));toggleMenu(false);
    document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();article.focus();article.scrollIntoView();});
    function updateSection(section){
      activeSection=section;
      for(const link of document.querySelectorAll('#contents .section')){
        if(link.dataset.section===section&&link.dataset.page===currentId)link.setAttribute('aria-current','location');
        else link.removeAttribute('aria-current');
      }
    }
    function buildContents(){
      const nav=document.querySelector('#contents');nav.replaceChildren();
      const query=search.value.trim().toLocaleLowerCase('ko');let part='',count=0;
      for(const page of pages){
        const sections=Array.isArray(page.sections)?page.sections:[];
        const chapterMatch=(page.title+' '+page.part+' '+(page.keywords||'')).toLocaleLowerCase('ko').includes(query);
        const matchingSections=sections.filter(section=>section.title.toLocaleLowerCase('ko').includes(query));
        if(!chapterMatch&&!matchingSections.length)continue;
        count++;
        if(page.part!==part){const heading=document.createElement('div');heading.className='part';heading.textContent=page.part;nav.append(heading);part=page.part;}
        const row=document.createElement('div');row.className='chapter-row';
        const link=document.createElement('a');link.href=route(page.id);link.className='chapter';link.textContent=page.title;
        if(page.id===currentId)link.setAttribute('aria-current','page');row.append(link);nav.append(row);
        if(!sections.length)continue;
        const list=document.createElement('div');list.className='sections';list.id='sections-'+page.id;
        const open=Boolean(query)||expanded.get(page.id)===true||(page.id===currentId&&expanded.get(page.id)!==false);
        list.hidden=!open;
        const toggle=document.createElement('button');toggle.className='chapter-toggle';toggle.textContent='›';
        toggle.setAttribute('aria-label',page.title+' 세부 목차');toggle.setAttribute('aria-controls',list.id);toggle.setAttribute('aria-expanded',String(open));
        toggle.addEventListener('click',()=>{const next=list.hidden;list.hidden=!next;expanded.set(page.id,next);toggle.setAttribute('aria-expanded',String(next));});row.append(toggle);
        for(const section of chapterMatch?sections:matchingSections){
          const child=document.createElement('a');child.className='section';child.href=route(page.id,section.id);child.textContent=section.title;child.dataset.section=section.id;child.dataset.page=page.id;list.append(child);
        }
        nav.append(list);
      }
      if(!count){const message=document.createElement('p');message.className='no-results';message.setAttribute('role','status');message.textContent='일치하는 목차가 없습니다.';nav.append(message);}
      updateSection(activeSection);
      nav.querySelector('[aria-current="page"]')?.scrollIntoView({block:'nearest'});
    }
    search.addEventListener('input',buildContents);
    sidebar.addEventListener('click',event=>{if(event.target.closest('a[href^="#"]'))toggleMenu(false);});
    function scrollToSection(section,focus=false){
      const heading=section?document.getElementById(section):null;
      if(heading&&article.contains(heading))heading.scrollIntoView();else window.scrollTo(0,0);
      updateSection(heading?.id||'');
      if(focus)article.focus({preventScroll:true});
    }
    function decorate(page){
      const source=pageURL(page);
      const used=new Map();
      for(const heading of article.querySelectorAll('h1,h2,h3')){
        const base=heading.id||slug(heading.textContent);
        const count=used.get(base)||0;used.set(base,count+1);heading.id=base+(count?'-'+count:'');
        const anchor=document.createElement('a');anchor.className='heading-link';anchor.href=route(page.id,heading.id);
        while(heading.firstChild)anchor.append(heading.firstChild);heading.append(anchor);
      }
      for(const image of article.querySelectorAll('img')){
        image.src=new URL(image.getAttribute('src'),source).href;image.loading='lazy';image.decoding='async';
        const caption=image.closest('p')?.nextElementSibling;
        if(caption?.matches('p')&&caption.children.length===1&&caption.firstElementChild?.tagName==='EM')caption.classList.add('figure-caption');
        const link=document.createElement('a');link.href=image.src;link.className='figure-link';link.title='그림 크게 보기';link.setAttribute('aria-label',image.alt+' (새 탭에서 크게 보기)');image.before(link);link.append(image);
      }
      for(const link of article.querySelectorAll('a:not(.heading-link)')){
        const href=link.getAttribute('href');if(!href)continue;
        const resolved=new URL(href,source);
        const target=pages.find(item=>pageURL(item).pathname===resolved.pathname&&resolved.origin===location.origin);
        if(target){link.href=route(target.id,resolved.hash.slice(1));}
        else if(href.startsWith('#')){link.href=route(page.id,href.slice(1));}
        else{link.href=resolved.href;link.target='_blank';link.rel='noopener noreferrer';}
      }
      for(const table of article.querySelectorAll('table')){const wrapper=document.createElement('div');wrapper.className='table-scroll';table.before(wrapper);wrapper.append(table);}
      for(const pre of article.querySelectorAll('pre')){
        const code=pre.querySelector('code');if(!code)continue;
        const button=document.createElement('button');button.className='copy';button.textContent='복사';button.setAttribute('aria-label','코드 복사');
        button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.textContent);button.textContent='복사됨';}catch{button.textContent='직접 선택해 복사';}setTimeout(()=>button.textContent='복사',1800);});pre.prepend(button);
      }
    }
    async function renderDiagrams(content,token){
      for(const code of content.querySelectorAll('pre > code.language-mermaid')){
        if(token!==generation)return;
        const pre=code.parentElement,definition=code.textContent;
        try{
          if(!window.mermaid)throw new Error('Mermaid 라이브러리를 불러오지 못했습니다.');
          const result=await mermaid.render('guide-diagram-'+(++diagramSerial),definition);
          if(token!==generation)return;
          const figure=document.createElement('div');figure.className='mermaid-figure';
          const diagram=document.createElement('div');diagram.className='mermaid-diagram';diagram.tabIndex=0;diagram.setAttribute('role','region');diagram.setAttribute('aria-label','Mermaid 흐름도, 가로 스크롤 가능');
          diagram.innerHTML=DOMPurify.sanitize(result.svg,{USE_PROFILES:{svg:true,svgFilters:true},FORBID_TAGS:['script','foreignObject']});
          const svg=diagram.querySelector('svg');
          if(svg){
            const width=Number(svg.getAttribute('viewBox')?.split(/\s+/)[2]);
            if(width)svg.style.width=width+'px';
            svg.setAttribute('aria-label',svg.querySelector('title')?.textContent||'시스템 흐름도');
          }
          const source=document.createElement('details');source.className='mermaid-source';
          const summary=document.createElement('summary');summary.textContent='Mermaid 원문';source.append(summary);
          pre.before(figure);source.append(pre);figure.append(diagram);
          const hint=document.createElement('p');hint.className='mermaid-hint';hint.textContent='넓은 흐름도는 가로로 스크롤해서 읽을 수 있습니다.';figure.append(hint,source);
        }catch(error){
          if(token!==generation)return;
          const message=document.createElement('p');message.className='mermaid-error';message.setAttribute('role','status');message.textContent='흐름도를 표시하지 못했습니다. 아래 Mermaid 원문을 확인하세요.';pre.before(message);
        }
      }
    }
    function updateNavigation(page){
      const index=pages.indexOf(page);
      for(const [selector,offset] of [['#previous',-1],['#next',1]]){
        const node=document.querySelector(selector),neighbor=pages[index+offset];node.hidden=!neighbor;
        if(neighbor){node.href=route(neighbor.id);node.querySelector('span').textContent=neighbor.title;}
      }
      document.querySelector('#part').textContent=page.part;
      document.querySelector('#position').textContent=page.id==='start'?'':index+' / '+(pages.length-1)+'장';
      document.querySelector('#duration').textContent='';
      document.querySelector('#raw').href=pageURL(page).href;
      document.title=page.title+' · Cleany 학습 가이드';
    }
    function showError(message){
      article.replaceChildren();const box=document.createElement('div');box.className='error';
      const title=document.createElement('h1');title.textContent='가이드를 열 수 없습니다.';box.append(title);
      const detail=document.createElement('p');detail.textContent=message;box.append(detail);
      const help=document.createElement('p');help.textContent='저장소 루트에서 아래 명령을 실행하고 HTTP 주소로 접속하세요. HTML을 더블 클릭한 file:// 주소에서는 Markdown을 읽을 수 없습니다.';box.append(help);
      const command=document.createElement('pre');command.textContent='python3 -m http.server 8765 --bind 127.0.0.1\nhttp://127.0.0.1:8765/docs/guide/';box.append(command);
      const retry=document.createElement('button');retry.textContent='다시 불러오기';retry.addEventListener('click',()=>location.reload());box.append(retry);article.append(box);article.setAttribute('aria-busy','false');
      for(const selector of ['#previous','#next'])document.querySelector(selector).hidden=true;
    }
    async function loadRoute(focus=false){
      const token=++generation;const selection=parseRoute();const page=pages.find(item=>item.id===selection.id);
      if(!page){currentId='';buildContents();showError('존재하지 않는 페이지입니다. 왼쪽 목차에서 페이지를 선택하세요.');return;}
      if(currentId===page.id){expanded.set(page.id,true);buildContents();article.setAttribute('aria-busy','false');scrollToSection(selection.section,focus);return;}
      article.setAttribute('aria-busy','true');
      try{
        const response=await fetch(pageURL(page));if(!response.ok)throw new Error('Markdown 응답: '+response.status);
        const markdown=await response.text();if(token!==generation)return;
        const content=document.createElement('div');
        content.innerHTML=DOMPurify.sanitize(marked.parse(markdown,{gfm:true}),{USE_PROFILES:{html:true},FORBID_TAGS:['style'],FORBID_ATTR:['style']});
        await renderDiagrams(content,token);if(token!==generation)return;
        article.replaceChildren(...content.childNodes);
        currentId=page.id;activeSection='';expanded.set(page.id,true);decorate(page);updateNavigation(page);buildContents();article.setAttribute('aria-busy','false');scrollToSection(selection.section,focus);
      }catch(error){if(token===generation){currentId='';showError(error.message);}}
    }
    let scrollFrame=0;
    window.addEventListener('scroll',()=>{
      if(scrollFrame)return;
      scrollFrame=requestAnimationFrame(()=>{
        scrollFrame=0;
        const headings=[...article.querySelectorAll('h2')];
        const passed=headings.filter(heading=>heading.getBoundingClientRect().top<=120);
        updateSection(passed.at(-1)?.id||'');
      });
    },{passive:true});
    window.addEventListener('hashchange',()=>loadRoute(true));
    (async()=>{try{
      if(location.protocol==='file:')throw new Error('로컬 파일 주소로 열렸습니다.');
      if(!window.marked||!window.DOMPurify)throw new Error('vendor 라이브러리를 불러오지 못했습니다.');
      const response=await fetch('guide.json');if(!response.ok)throw new Error('목차 응답: '+response.status);
      const manifest=await response.json();pages=manifest.pages;
      if(!Array.isArray(pages)||!pages.length||new Set(pages.map(page=>page.id)).size!==pages.length)throw new Error('목차 형식이 올바르지 않습니다.');
      buildContents();await loadRoute();
    }catch(error){showError(error.message);}})();
  </script>
</body>
</html>
