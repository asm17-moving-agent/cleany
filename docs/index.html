정확한 RuntimeError만 보유 상실; 다른 내부 예외는 전달 |\n\n```mermaid\nflowchart TD\n    Error[\"start / poll / cancel / tick / 전환 조회 예외\"] --> Block[\"신규 실행 차단 / INTERNAL_ERROR 기록\"]\n    Block --> Abort[\"Backend.abort / 추가 중단 오류도 보존\"]\n    Abort --> Stop[\"BT tick 중지 / core가 StopAndAssess 진행\"]\n    Stop --> Confirm{\"기존 기한 안에 정지와 이전 작업 종료 확인?\"}\n    Confirm -->|예| Fatal[\"FATAL / INTERNAL_ERROR 또는 기존 FATAL 원인\"]\n    Confirm -->|아니오| Unconfirmed[\"FATAL / STOP_UNCONFIRMED\"]\n```\n\n| 오류 종료 경계 | 계약 |\n|---|---|\n| 작업 번호 전 start 실패 | `Backend.abort()`가 현재 context에 중단 신호 전달 |\n| 중단 / native halt 추가 오류 | 원인 보존; 정지 평가 계속, native 노드 reset 뒤 core 처리 |\n| 이미 정지 평가 중 | 같은 평가와 원래 기한 유지 |\n| 허용 동작 | 이전 최종 관측 수집만 수행; 놓기 / 팔 복귀 시작 안 함 |\n| 확정 | 확인된 물체·놓기·복귀 근거 보존; Result와 종료 이벤트 한 번만 확정 |\n| BT snapshot 조회 실패 | 모니터 갱신만 중단; 정지 처리와 결과 전달 계속 |\n| 준비 / XML 구성 실패 | Goal 거절 |\n| 실행 ID 예약 뒤 context 초기화 실패 | Goal 수락 후 위 오류 종료 경로로 결과 반환 |\n\n프로세스가 살아 있는 동안의 예외 계약입니다. 프로세스 종료 후 처리는 [재시작 복구 계약](../README.md#기록과-모니터)을 따릅니다.\n"},"ros2_ws/src/cleany_manipulation_bt/docs/execution_contract.md":{"title":"MuJoCo Manipulation 실행 계약","body":"# MuJoCo Manipulation 실행 계약\n\n승인된 물체 하나를 실행하는 `execution_profile=mujoco` 서버의 상세 계약이다.\n실행 명령과 ROS 경로는 [패키지 README](../README.md)를 따른다.\nGoal·Feedback·Result 필드는 [공통 Action 명세](../../cleany_skill_executor/docs/execute-manipulation-skill-action-spec.md)에 있다.\n\n| 확인할 내용 | 위치 |\n|---|---|\n| 실행 순서, 대상 검사와 timeout | [실행 순서와 결과](#실행-순서와-결과) |\n| 취소 모드와 늦은 결과 처리 | [취소](#취소) |\n| 놓기 검증과 관절별 정지 근거 | [정상 수거의 놓기·정지 확인](#정상-수거의-놓기정지-확인) |\n| 내부 예외와 오류 종료 | [예상하지 못한 실행 예외](#예상하지-못한-실행-예외) |\n\n## 실행 순서와 결과\n\n[collect_trash_mujoco.xml](../trees/collect_trash_mujoco.xml)이 준비, 잡기, 놓기, 확인과 종료를\n정한다. C++ 노드는 `start(node_id, execution_id)` 후 RUNNING을 반환하고 후속 tick에서\n`poll(operation_id)`를 호출한다. `halt()`는 `cancel(operation_id)`를 전달한다.\nPython worker 하나가 개별 동작을 수행하므로 ROS 응답/모델 추론 대기는 BT tick을 막지 않는다.\n서버는 시뮬레이션 시계와 독립적인 steady clock으로 20 Hz tick한다.\n이 방식은 [BehaviorTree.CPP 비동기 노드 계약](https://www.behaviortree.dev/docs/tutorial-basics/tutorial_04_sequence/)을 따른다.\n큰 영상/점군과 파지/경로 결과는 실행별 Python context에 두고 Blackboard에는 execution ID만 둔다.\n\n### 대상 검증\n\n움직이기 전에 지정 snapshot, 대상 깊이, 모델 분류, 정책과 목적지를 검사한다.\n기본 지원 쓰레기는 `cup`, `crumpled tissue`다. `paper cup`, `disposable paper cup`은\n같은 컵 종류 alias로 연결하되 원래 인식 label과 분류를 보존한다. 쓰레기 분류와\n목적지 정책을 검증한다. `collect_lost_item`은 `mouse`, `computer mouse`, `wireless mouse`,\n`lego brick`을 지원하며 모델의 `lost_item` 분류, 정책의 `lost_items_left` 목적지가\n일치해야 한다. 두 skill은 기존 `collect_trash_mujoco.xml`의 집기·이동·놓기·확인 절차를 공유한다.\n종류와 목적지는 정책 및 `bt_supported_trash_labels`, `bt_supported_lost_item_labels` 설정에서 읽는다.\n같은 종류 여러 개는 유효한 session/epoch/track이 있을 때 허용한다.\n빈 세션의 기존 단일 대상 경로는 종류가 유일해야 한다. 선택 객체 복원 뒤 이동 전에\n관측 OBB로 `/sorting/register_placement_target`에 등록하고 verification ID를 고정한다.\n등록이 불확실하면 이동 전에 차단하며, 놓기 확인은 그 개체에만 수행한다.\n첫 팔 이동 전과 접근 전 재관찰은 승인된 track과 기하 연속성, 분류–skill–목적지를 모두\n확인한다. 마우스 별칭은 같은 종류로 연결하고 다른 개체를 대신 선택하지 않는다.\n미지원 대상, review 분류, 분류와 불일치하는 skill 및 다른 목적지는 차단한다.\n\n### 실패와 timeout\n\n파지 확인이 실패하면 들기를 시작하지 않는다. 보유 상실, controller 실패, 동작 timeout과\n관절/시뮬레이션 시계 중단은 정지 평가로 연결된다. 기본 `CHECKPOINT` 취소는 잡기(닫기+확인), 들기(들기+보유 확인),\n놓기(위치 검사+열기+이탈 확인)의 현재 checkpoint까지 제한 시간 안에서 수행한 뒤 다음 단계를 차단한다.\n실패한 정상 경로 뒤에는 `StopAndAssess → FinalizeFailure`를 실행한다.\nAction 결과의 BLOCKED/FAILED/CANCELED/FATAL과 BT의 FAILURE는 별도 의미다.\n\n동작 결과가 없는 상태에서 제한 시간이 지나면 `TIMEOUT`을 기록하고 중단을 요청한다.\n취소한 동작의 최종 결과는 정지 확인 중에 수집하며, 정지 평가가 먼저 끝나도 동작 종료 결과를\n확인하기 전에는 최종 Result를 확정하지 않는다. 늦게 확인된 장치 오류·비상정지·내부 오류는\n`FATAL`로 반환하고 후속 Goal을 차단한다. 취소 완료나 늦은 성공은 `TIMEOUT` 결과를 유지하며,\n성공 관측의 물체 상태·놓기·팔 복귀 근거는 보존하되 다음 정상 동작이나 취소 후 복귀를 시작하지 않는다.\n이 대기는 기존 정지 제한 시간 안에서만 수행하며, 동작 종료나 정지를 확인하지 못하면\n`FATAL / STOP_UNCONFIRMED`로 종료한다. 움직임 시작 전의 시간 초과 취소에도 정지 확인을 요구한다.\n시간 초과 취소를 시작하기 전에 성공 결과가 준비되어 있으면 경과 시간과 관계없이 기존처럼\n성공을 처리한다. 최종 Result 확정 후 도착한 관측은 결과를 변경하지 않는다.\n\n## 취소\n\n`manipulation/cancel` 서비스의 mode는 다음 세 가지다. 일반 Action cancel은\n`CHECKPOINT`를 사용한다. Result와 실행 기록의 `cancel_mode`에 적용한 모드를 남긴다.\n\n| mode | 동작 |\n|---|---|\n| `IMMEDIATE` | 현재 노드와 원자 구간의 완료를 기다리지 않고 중단 요청, 정지 확인 후 종료 |\n| `CHECKPOINT` | 현재 노드를 완료하고 정지. 잡기·들기·놓기는 같은 단계의 확인까지 완료 |\n| `RETURN_ARM` | 현재 작업 중단 → 정지 확인 → 물체를 잡고 있으면 현재 위치에서 열어 놓기 → 팔 복귀 → 최종 정지 확인 |\n\n`RETURN_ARM`은 `StopAndAssess → ReleaseInPlace → ReturnArmAfterCancel → StopAfterRecovery`\n경로를 실행한다. 팔을 선택하기 전에는 복귀할 실행 대상이 없으므로 정지 후 종료한다.\n복귀는 현재 관절 상태에서 실행 시작 때 저장한 팔 자세로 계획하며 수거함 이동과 목적지\n놓기 검증은 수행하지 않는다. 현재 위치 놓기는 그리퍼 열기 완료에 근거한 초기 정책이다.\n놓기 위치 선택과 별도 물체 이탈 관찰은 후속 검토 대상으로 둔다. `placement_state`에는\n기존 확인값만 보존하고 취소 후 놓기를 수거 성공으로 만들지 않는다.\n놓기·복귀 실패는 다시 정지 평가 후 실패로 반환한다. 복귀 중 `IMMEDIATE` 요청은\n선점하며 이후 약한 요청으로 완화되지 않는다. 기존 feedback·controller·timeout 검사는 유지한다.\n\n`IMMEDIATE/RETURN_ARM`은 중단 요청을 즉시 보내고 취소한 동작의 최종 결과를 정지 확인 중에 수집한다.\n정지 평가가 먼저 끝나도 이전 동작의 결과가 확인될 때까지 놓기·복귀와 최종 Result 확정을 기다린다.\n늦게 도착한 실제 실패는 취소보다 우선하고, 장치 오류·비상정지·내부 오류는 `FATAL`로 실행을 차단한다.\n늦은 성공은 확인된 물체 상태, 놓기, 팔 복귀와 완료 단계만 보존하고 전체 수거 성공으로 바꾸지 않는다.\n이 대기는 기존 정지 제한 시간 안에서만 수행한다. 취소한 동작의 종료나 정지를 기한 내 확인하지 못하면\n`FATAL / STOP_UNCONFIRMED`로 끝내며, 움직임 시작 전 취소에도 정지 확인을 요구한다.\n\n테스트 클라이언트에서 `--cancel-stage TRANSPORTING --cancel-mode RETURN_ARM`으로\n재현한다. 이미 실행 중인 Goal에는 다음 서비스를 호출한다.\n\n```bash\nros2 service call /sim/manipulation/cancel cleany_interfaces/srv/CancelManipulation \\\n  \"{execution_id: '실행-UUID', mode: 'RETURN_ARM'}\"\n```\n\n## 정상 수거의 놓기·정지 확인\n\n그리퍼 열림은 controller와 관절 피드백으로 확인한다. `ConfirmRelease`는 방출 시각 이후의\n독립 안착 검증을 기다리고, 팔 복귀 뒤 `VerifyPlacedObject`에서 새 시각을 기준으로 다시 검증한다.\n평가기의 false는 확인 대기다. 제한 시간 내 안착 근거를 못 얻으면\n`placement_state=UNKNOWN / VERIFICATION_TIMEOUT`을 반환한다.\nSUCCESS는 독립 방출/안착, 팔 복귀와 최종 정지 근거가 모두 있을 때만 저장한다.\n\n### 정지 근거\n\n정지는 모든 ROS Action의 terminal 결과와 정지 확인 시작 이후의 새 관절 샘플을 요구한다.\n양팔과 양쪽 그리퍼의 각 관절에 sensor stamp와 단조 시계 수신 시각을 따로 기록한다.\n부분 메시지는 포함된 관절만 갱신하며, 속도 누락·비정상 값·중복 이름·반복 또는 역행 stamp는\n정지 근거로 사용하지 않는다. 실행 중 feedback 감시도 관절별 freshness를 검사한다.\n각 확인 표본은 모든 필수 관절이 이전 표본 이후 새 정보를 제공해야 인정한다.\n양팔이 별도 메시지로 들어와도 합쳐서 확인하며, 같은 정보를 반복해서 세지 않는다.\n모든 관절이 설정한 속도 이내이고 Action이 종료된 상태가 연속 표본 수와 유지 시간을\n함께 만족해야 한다. 오래된 정보, 움직임 또는 미종료 Action이 있으면 확인 구간을 다시 시작한다.\n취소 응답만으로 정지를 인정하지 않으며, 움직임 시작 후 정지가 확인되지 않으면\n`FATAL / STOP_UNCONFIRMED`와 사람 확인 필요 상태를 기록한다.\n\n[manipulation_mujoco.yaml](../config/manipulation_mujoco.yaml)의 정지 판정 설정은 다음과 같다.\n\n| ROS parameter | MuJoCo 기본값 | 용도 |\n|---|---|---|\n| `bt_stop_timeout_sec` | 10초 | 정지 확인 제한 시간 |\n| `bt_stop_feedback_max_age_sec` | 0.5초 | 관절별 수신 경과 시간과 sensor stamp 허용 오차 |\n| `bt_stationary_duration_sec` | 0.25초 | 정지 상태의 최소 유지 시간, 단조 시계 기준 |\n| `arm_stationary_samples` | 5 | 모든 필수 관절의 새 정보를 사용한 연속 확인 횟수 |\n| `arm_stationary_velocity_rad_s` | 0.02 rad/s | 팔과 그리퍼의 정지 속도 기준 |\n\n이 값은 MuJoCo 구현의 조정 가능한 초기값이며 실물 로봇의 안전 기준은 아니다.\n\n장치 오류(`HARDWARE_ERROR`), 비상정지(`E_STOP`), 내부 오류(`INTERNAL_ERROR`)와\n정지 미확인(`STOP_UNCONFIRMED`)을 동작 실패로 관측하면 즉시 실행을 차단하고 사람 확인 필요를 기록한다.\n최종 정지 확인에 성공해도 `FATAL`과 원래 오류 코드를 유지한다. 움직임 시작 후 정지 확인에 실패하면\n최종 오류 코드는 `STOP_UNCONFIRMED`를 우선하고 원래 원인은 Result message에 남긴다.\n\n## 예상하지 못한 실행 예외\n\nROS 동작 호출은 명시적인 `OperationError`의 오류 코드를 유지한다. 기존 하위 동작이\n예상 실패에 사용하는 정확한 `RuntimeError`·`ValueError`와 `InfrastructureError`,\n`CartesianPlanningError`, `LiftRedetectionError`는 기존 준비·대상·이동·파지 실패 분류로 전달한다.\n그 밖의 예외는 발생 노드와 예외 종류·내용을 담은 `INTERNAL_ERROR`로 전달하며,\n정지 확인 후 `FATAL`로 종료하고 후속 Goal을 차단한다. `AttributeError`, `TypeError`,\n`KeyError`와 `NotImplementedError`·`RecursionError` 같은 프로그램 오류를 일반 동작 실패로 바꾸지 않는다.\n보유 접촉 검사도 정확한 `RuntimeError`만 보유 상실로 바꾸며, 다른 내부 예외는 그대로 전달한다.\n\n작업 시작·상태 조회·취소와 BT tick·전환 조회에서 예상하지 못한 예외가 발생하면\n즉시 신규 실행을 차단하고 `INTERNAL_ERROR`와 발생 단계를 기록한다.\n작업 번호를 받기 전에 시작 요청이 실패해도 `Backend.abort()`가 현재 context에\n중단 신호를 전달한다. 개별 중단 요청이나 BT halt의 추가 오류는 원인과 함께 보존하며\n정지 평가를 막지 않는다. native halt callback의 오류는 노드 reset 후 core에서 처리한다.\n\n이후에는 BT를 다시 tick하지 않고 core의 별도 종료 경로가 기존 `StopAndAssess`를\n실행·조회한다. 이미 정지 평가가 진행 중이면 그 평가와 원래 제한 시간을 유지한다.\n이 경로는 놓기나 팔 복귀를 시작하지 않는다. 이전 작업의 최종 관측을 같은 기한 안에서\n수집하고, 확인된 물체 상태와 놓기·팔 복귀 진행을 보존한다.\n정지와 이전 작업 종료가 확인되면 `FATAL / INTERNAL_ERROR`로 종료한다.\n이미 관측한 장치 오류·비상정지 등 FATAL 원인은 유지하며, 정지 시작·조회 실패 또는\n미종료 작업 때문에 확인 근거를 얻지 못하면 `FATAL / STOP_UNCONFIRMED`로 종료한다.\n최종 Result와 종료 이벤트는 한 번만 확정하고, 원래 예외와 추가 정지 오류를 message에 남긴다.\nBT snapshot 조회 실패는 해당 실행의 모니터 갱신만 중단하고 정지 처리와 Action 결과 전달은 계속한다.\n\n실행 준비 확인 또는 XML 구성 실패는 Goal을 거절한다. 실행 ID를 예약한 뒤 backend\ncontext 초기화가 실패하면 해당 실행을 수락한 뒤 위 오류 종료 경로로 최종 결과를 반환한다.\n이 처리는 서버 프로세스가 살아 있는 동안의 실행 예외에 적용한다. 프로세스 종료 후의\n처리는 [README의 재시작 복구 계약](../README.md#기록과-모니터)을 따른다.\n\n## Jetson 고정 중간 자세 복귀\n\n`bt_arm_return_waypoints_file`에 두 팔의 중간 자세 두 개가 지정되면 현재 자세,\n중간 자세 1, 중간 자세 2, home 순서로 빈 팔과 그리퍼 닫기를 함께 실행한다.\n수동 복귀와 BT의 빈 팔 복귀가 이 경로를 공유하며 RRT로 대체하지 않는다.\n\n| 파라미터 | 코드 기본값 | Jetson 설정 | 적용 범위 |\n|---|---|---|---|\n| `bt_arm_return_collision_check_enabled` | `true` | `false` | 고정 중간 자세 복귀의 계획 및 실행 충돌 검사 |\n\n`false`이면 self, world와 OctoMap 충돌 검사를 생략하고 최신 충돌 지도를\n기다리지 않는다. 실행기는 결합된 팔과 그리퍼 명령의 관절 범위, 속도와 가속도를\n검사하고 정지, 취소, 피드백 및 도착 확인을 유지한다. 중간 자세 파일을 지정하지\n않은 복귀와 파지 준비의 충돌 검사에는 이 파라미터가 적용되지 않는다.\n\n## Jetson 원위치 운반의 완료 기준\n\n`pick_return_release`의 기록 역재생 경로에서는 `CarryObject`가 목표 높이까지의\n이동 명령을 한 번 실행하고 정상 완료 응답을 받으면 다음 단계로 진행한다.\n도착 높이, 관절값과 TCP 자세의 허용오차로 성공 여부를 재판정하거나 추가 하강을\n보정하지 않는다. `CheckPlacementTarget`도 이 경로의 위치를 다시 검사하지 않는다.\n이동 완료는 측정 위치의 도착 검증을 의미하지 않으며, 놓기 결과는 기존 임시\n모드의 `ASSUMED` 규칙을 따른다. 모터 fault와 취소 등 실행 실패는 후속 놓기를 차단한다.\n\n## Jetson 작업 완료와 정지 이력\n\n`bt_wake_on_operation_complete=true`이면 작업 worker의 완료, 실패와 취소 결과가\nexecutor guard를 깨워 다음 BT 처리를 진행한다. 트리 변경은 기존 callback group에서\n직렬화한다. 제한 시간과 모니터 처리는 20Hz, 진행 상태 발행은 1Hz를 유지한다.\n이는 하위 trajectory controller의 종료 이벤트와 별도의 작업 단계 알림이다.\n\n`bt_reuse_final_stationary_history=true`이면 정상 복귀 후 양팔, 두 그리퍼와 헤드의\n14개 관절에 이미 쌓인 정지 이력을 최종 확인에 사용할 수 있다. 실행 ID, 모델,\n명령 횟수, 통신 복구 세대와 정지 설정이 같고 모든 Action이 종료되어야 한다.\n현재 관절 위치와 신선도도 다시 확인한다. 중복 표본은 시간을 늘리거나 횟수를 더하지\n않으며 움직임, fault, 오래된 피드백 또는 조건 변경은 이력을 무효화한다.\n취소와 실패 정지는 새 확인 구간을 사용한다.\n\n\n`SelectArmAndPath`는 후보가 모두 탈락하면 다음 설정 팔을 검사한다. 관절 상태나\n계획 장면이 준비되지 않았거나 선택 요청 자체가 실패하면 해당 팔과 원래 오류를 반환한다.\n"},"ros2_ws/src/cleany_manipulation_bt/docs/interfaces.md":{"title":"실물 BT 인터페이스","body":"# 실물 BT 인터페이스\n\n`manipulation_jetson_server`는 실물 수거 실행, 팔 복귀와 복구 차단을 관리한다.\n아래 경로는 namespace가 없는 기본값이다. 실행은\n[실물 수거 안내](../../cleany_skill_executor/docs/physical-collection.md), 공통 취소와 기록은\n[실행 계약](execution_contract.md)을 따른다.\n\n| 종류 | 경로 | 타입 | 역할 |\n|---|---|---|---|\n| Action server | `manipulation/execute_skill` | `cleany_interfaces/action/ExecuteManipulationSkill` | 승인된 snapshot과 물체의 단일 수거 |\n| Action server | `manipulation/return_arm` | `cleany_interfaces/action/ReturnArm` | 수거와 동시 실행하지 않는 팔 복귀 |\n| Service server | `manipulation/cancel` | `cleany_interfaces/srv/CancelManipulation` | 실행 ID와 취소 모드로 중단 요청 |\n| Service server | `manipulation/get_execution` | `cleany_interfaces/srv/GetManipulationExecution` | 저장된 실행 결과 조회 |\n| Service server | `manipulation/control_state` | `std_srvs/srv/Trigger` | 현재 실행 소유권, guard와 복구 차단 조회 |\n| Service server | `manipulation/confirm_recovery` | `cleany_interfaces/srv/ConfirmManipulationRecovery` | 정지와 빈 그리퍼 확인 후 과거 차단 해제 |\n| Publisher | `manipulation/execution_events` | `cleany_interfaces/msg/ManipulationExecutionRecord` | 실행 기록. reliable, transient-local, depth 100 |\n| Publisher | `manipulation/bt_transitions` | `std_msgs/msg/String` | BT 상태 전이 JSON. reliable, transient-local, depth 100 |\n\n`arm_return`과 `manipulation_recovery`는 해당 Action과 Service의 CLI client다.\n`ReturnArm`의 성공과 수거 성공은 별도 결과이며, 복구 확인만으로 동작을 시작하지 않는다.\n노드 종료 시 취소한 명령의 응답과 실제 정지 근거를 제한 시간 안에서 수집한다.\n\n`control_state`의 JSON `external_motion_active`는 양팔과 그리퍼 컨트롤러의 Action 상태를\n집계한다. `ACCEPTED`, `EXECUTING`, `CANCELING` 중 하나라도 있으면 `true`다.\n상태 구독은 `/\u003cleft|right>_\u003carm|gripper>_controller/follow_joint_trajectory/_action/status`,\n`action_msgs/msg/GoalStatusArray`와 기본 Action status QoS를 사용한다.\n"},"ros2_ws/src/cleany_mission_manager/docs/interfaces.md":{"title":"cleany_mission_manager 노드 인터페이스","body":"# cleany_mission_manager 노드 인터페이스\n\n```mermaid\nflowchart LR\n  Gateway[\"Backend Gateway\"] --> Runtime[\"Mission Runtime\"]\n  Supervisor[\"Supervisor\"] \u003c-->|\"허가 / 정지 요청\"| Runtime\n  Runtime --> Tasks[\"Navigator / 작업 adapter\"]\n  Tasks -->|\"진행 / 결과\"| Runtime\n  Runtime -->|\"최종 결과\"| Gateway\n```\n\n[Mission 실행](../../../../docs/implementation/how-to/mission.md) · [미션 계약](../../cleany_interfaces/docs/mission.md)\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## mission_runtime\n\n실행 파일: `mission_runtime`. 원본: [노드.py](../cleany_mission_manager/node.py), [nav2.py](../cleany_mission_manager/adapters/nav2.py), [manipulation.py](../cleany_mission_manager/adapters/manipulation.py), [supervision.py](../cleany_mission_manager/adapters/supervision.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `mission/status` | `cleany_interfaces/msg/MissionStatus` | R/T1; 상태 sequence 변경 시; `tick_hz` 기본 10 Hz |\n| 토픽 발행 | `mission/result` | `cleany_interfaces/msg/MissionResult` | R/T1; 새 최종 결과 |\n| 토픽 발행 | `mission/debug_snapshot` | `cleany_interfaces/msg/RuntimeDebugSnapshot` | R/T1; 기본 2 Hz |\n| 토픽 발행 | `mission/runtime_events` | `cleany_interfaces/msg/RuntimeEvent` | R/T2048; 이벤트 발생 시 |\n| 토픽 구독 | `robot/safety_fault` | `std_msgs/msg/String` | R10; `supervision_mode=disabled`만 |\n| 토픽 구독 | `robot/safety_released` | `std_msgs/msg/String` | R10; `supervision_mode=disabled`만 |\n| 액션 제공 | `mission/stop` | `cleany_interfaces/action/StopMission` | Action 기본값; `supervision_mode=required`, `stop_action` |\n| 서비스 호출 | `system/check_permission` | `cleany_interfaces/srv/CheckPermission` | Service 기본값; required; 갱신 TTL/3 |\n| 토픽 구독 | `system/heartbeat` | `cleany_interfaces/msg/SystemHeartbeat` | R1; required |\n| 토픽 구독 | `system/state` | `cleany_interfaces/msg/SystemState` | R/T1; required |\n| 토픽 구독 | `system/capabilities` | `cleany_interfaces/msg/SystemCapabilities` | R/T1; required |\n| 서비스 제공 | `mission/offer` | `cleany_interfaces/srv/OfferMission` | Service 기본값 |\n| 서비스 제공 | `mission/cancel` | `cleany_interfaces/srv/CancelMission` | Service 기본값 |\n| 서비스 제공 | `mission/snapshot` | `cleany_interfaces/srv/GetRuntimeSnapshot` | Service 기본값 |\n| 서비스 제공 | `mission/reset_error` | `std_srvs/srv/Trigger` | Service 기본값 |\n| 액션 호출 | `navigate_to_pose` | `nav2_msgs/action/NavigateToPose` | Action 기본값; `navigation_backend=nav2` |\n| 서비스 호출 | `navigate_to_pose/_action/cancel_goal` | `action_msgs/srv/CancelGoal` | Service 기본값; Nav2 adapter |\n| 서비스 호출 | `\u003clifecycle_node>/get_state` | `lifecycle_msgs/srv/GetState` | Service 기본값; `required_navigation_lifecycle_nodes`; `supervision_mode=disabled`만 (감독 시 Supervisor가 확인) |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic`, Nav2 adapter |\n| 토픽 구독 | `navigate_to_pose/_action/status` | `action_msgs/msg/GoalStatusArray` | Action status 기본 QoS; Nav2 adapter |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 액션 호출 | `mock/manipulation/execute_skill` | `cleany_interfaces/action/ExecuteManipulationSkill` | Action 기본값; `manipulation_action` |\n| 서비스 호출 | `mock/manipulation/execute_skill/_action/cancel_goal` | `action_msgs/srv/CancelGoal` | Service 기본값; `manipulation_action` + suffix |\n| 서비스 호출 | `mock/manipulation/get_execution` | `cleany_interfaces/srv/GetManipulationExecution` | Service 기본값; `manipulation_query` |\n\n| 실행 옵션 | 생성되는 경계 |\n|---|---|\n| navigation_backend=nav2 | Nav2 endpoint와 TF 구독 |\n| manipulation_backend=action_mock | ROS 조작 endpoint; 기본 mock은 process 내부 |\n| 기본 lifecycle 목록 | map_server / amcl / planner_server / controller_server / bt_navigator / collision_monitor |\n| supervision_mode=required 기본 | 미션마다 supervision_capabilities 기본 [NAVIGATION]의 lease 하나 |\n| supervision_mode=disabled | Mock / simulation 단독 실행; snapshot의 supervision에 기록 |\n\n[Mission 계약](../../cleany_interfaces/docs/mission.md)을 따릅니다.\n\n## 책상 정밀 접근을 사용하는 navigation port\n\n```mermaid\nflowchart LR\n    Nav[\"좌석 Nav2 성공\"] --> Pose[\"요청 pose 검증 + 정지\"]\n    Pose --> Approach[\"desk/approach / 기존 lease 식별자\"]\n    Approach --> Stopped[\"접근 성공 + fresh 정지\"]\n    Stopped --> Task[\"후속 책상 작업\"]\n```\n\n| DeskApproach | 계약 |\n|---|---|\n| 활성 / 타입 | desk_approach_enabled=true, cleany_interfaces/action/DeskApproach, 기본 Action QoS |\n| desk_distance_m | Base 원점에서 평면까지 거리 |\n| 취소 | Lease 상실 / mission stop도 같은 navigation port에 연결 |\n| Home | 호출하지 않음 |\n| 재시작 | Journal desk_goal_uuid로 정확한 goal 취소; 수락만으로 정지 인정 안 함 |\n\n## 버전이 있는 좌석 목표 파일\n\n`targets_file`은 기존 schema 1 YAML과 control-plane에서 내보낸 schema 2 JSON을 읽습니다.\n좌표는 `map` 프레임의 `[x_m, y_m, yaw_rad]`이며 좌석 ID를 접근 목표로 해석합니다.\nSchema 2는 전체 payload에서 `target_digest`를 제외하고 키를 정렬한 compact JSON의\nSHA-256을 확인합니다. `validation_status=field_verified`, 유효한 복귀점과 하나 이상의\n좌석 목표가 필요합니다. 초안과 해시 불일치는 노드 초기화 중 거부합니다.\n\n`mission/snapshot`의 JSON에 `target_map`을 추가합니다. 값은 실제 로드한 파일의\n`map_id`, `source_sha256`, `layout_revision`, `target_digest`이며 schema 1에서는 null입니다.\n이는 목표 파일의 버전 확인입니다. 실제 AMCL 위치 정확도, 장애물 회피, 팔 도달성이나\n책상 정리 완료를 증명하지 않습니다. 배치 변경 후에는 Runtime을 재시작하여 새 파일을\n로드하고 Backend의 버전 일치를 확인합니다.\n"},"ros2_ws/src/cleany_mission_manager/docs/manipulation-mock-integration.md":{"title":"Gazebo 주행과 Mock 조작 연결","body":"# Gazebo 주행과 Mock 조작 연결\n\n베이스는 Gazebo/Nav2가 주행하고 인식, 계획과 팔 조작은 Mock입니다. Python Mock 서버가 ROS Action을 처리하고 실행 상태와 결과는 SQLite에 기록합니다.\n\n```mermaid\nflowchart LR\n  Request[\"Gateway / mission/offer\"] --> FSM[\"Mission FSM\"]\n  FSM \u003c--> Nav[\"Nav2 + Gazebo\"]\n  FSM --> BT[\"청소 BT\"]\n  BT \u003c--> Desk[\"MockDesk 관측 / 제안\"]\n  BT --> Port[\"ManipulationPort\"]\n  Port \u003c--> Transport[\"ROSManipulationTransport\"]\n  Transport \u003c--> Server[\"Python Mock 서버\"]\n  FSM --> Report[\"MissionResult / Gateway\"]\n```\n\nFSM은 수락, 좌석 이동, 취소, 종료 정책과 보고를 소유합니다. 청소 BT는 `ObserveBefore → [PlanNext → ValidateProposal → ExecuteOne → Reobserve → VerifyCompletion]`을 실행합니다. 접근, 집기와 운반은 Action 서버 내부 진행이며 Mission BT에 노드를 추가하지 않습니다. 검증된 성공만 논리적 책상 목록을 갱신합니다. Gazebo 팔 애니메이션이나 물리 수거는 실행하지 않습니다.\n\n| 안내 | 원본 |\n|---|---|\n| 실행과 미션 요청 | [RUNNING](../../../../docs/implementation/how-to/mission.md#gazebo-주행과-mock-조작) |\n| ID, 결과, 취소와 복구 | [Manipulation 계약](../../cleany_interfaces/docs/manipulation.md) |\n| 화면과 ExecuteOne 상세 | [Monitor 데이터](../../cleany_dev_monitor/docs/data.md#청소-bt와-조작-관측) |\n| 검증 명령과 범위 | [TESTING](../../../../docs/implementation/testing.md) |\n\n## Profile과 시작 조건\n\n| 설정 | 주행 | 조작 |\n|---|---|---|\n| [runtime.yaml](../config/runtime.yaml) | Nav2 | 로컬 Mock |\n| [runtime_manipulation_mock.yaml](../config/runtime_manipulation_mock.yaml) | Mock | 외부 Mock Action |\n| [runtime_gazebo_manipulation_mock.yaml](../config/runtime_gazebo_manipulation_mock.yaml) | Gazebo/Nav2 | 외부 Mock Action |\n\n| `manipulation_backend` | `start_manipulation_mock` | 처리 |\n|---|---|---|\n| `mock` | `false` | 기존 로컬 Mock |\n| `action_mock` | `false` | 별도 서버 연결, 미준비 시 미션 수락 차단 |\n| `action_mock` | `true` | `/mock` 서버 동시 시작 |\n| `mock` | `true` | 설정 오류로 시작 거절 |\n\n[통합 launch](../../cleany_bringup/launch/mission_sim.launch.py)는 backend, fixture의 snapshot wire ID와 목적지를 검사합니다. 서버 동시 시작 시 scenario, 서버 설정과 DB 분리도 Gazebo 실행 전에 확인합니다. `profile`은 Fortress만 지원합니다.\n\n`action_mock`은 기존 `lidar_depth_nav` 센서, `nav2_safety.yaml`의 collision monitor, `nav2_omni.yaml`과 `nav2_omni_low_speed.yaml`을 합친 저속 Omni controller를 조합합니다. Controller의 도착 오차는 3 cm이고 Mission의 기존 8 cm gate는 유지합니다. Costmap footprint는 monitor envelope와 맞춥니다. 지도 파일명과 targets의 `map_id`는 같아야 하며 초기 위치는 [AMCL 설정](../../cleany_gazebo_sim/config/nav2_amcl.yaml)의 지도 좌표를 사용합니다.\n\n## 공유 입력과 영속성\n\n[공유 fixture](../config/manipulation_server_fixture.yaml)는 두 물체와 네 관측을 등록합니다. 표시 ID `trash-1`과 wire ID `1`은 명시적으로 매핑하며 문자열에서 숫자를 추정하지 않습니다.\n\n| 관측 ID | wire ID 목록 | 역할 |\n|---|---|---|\n| `mock-snapshot-001` | `[1, 2]` | 작업 전 관측 |\n| `mock-snapshot-002` | `[2]` | 첫 수거 후 재관측 |\n| `mock-snapshot-003` | `[]` | 두 번째 수거 후 완료 제안 |\n| `mock-snapshot-004` | `[]` | 추가 빈 관측으로 완료 확인 |\n\n모든 consumer는 같은 install prefix의 생성 타입을 사용합니다. Mission DB, 서버 DB와 Bridge DB는 분리하며 재시작 시험에서 유지합니다. `manipulation_initial_mock_safe=true`는 새 journal에만 적용합니다. 저장된 위험 상태나 진행 기록을 덮어쓰지 않으며 조작 실행 기록이 있으면 로컬 Mock 전환으로 gate를 우회할 수 없습니다.\n\nGazebo가 clock, TF와 odom을 소유합니다. Mock 서버는 물리 상태 토픽을 발행하지 않으며 Mission과 서버는 steady clock으로 timeout과 취소를 처리합니다. 출처는 `navigation=sim`, `perception/planning/execution=mock`입니다.\n\n## Mock 조작의 관찰 시간\n\n\n공유 [server fixture](../config/manipulation_server_fixture.yaml)는 정상 수거를 물체 하나당\n40초로 설정합니다. 팔 이동에 준비·검증보다 긴 시간을 배정해 진행을 관찰하기 위한\n가정입니다. 실물 팔의 경로, 하중과 속도 설정을 측정해 산출한 예상 시간은 아닙니다.\n\n| 단계 | 시간 |\n|---|---:|\n| 실행 준비 확인 `VALIDATING` | 1초 |\n| 대상 확인·파지 계획 `PREPARING_TARGET` | 4초 |\n| 물체 접근 `APPROACHING` | 7초 |\n| 그리퍼 닫기·파지 확인 `GRASPING` | 3초 |\n| 들어 올리기·보유 확인 `LIFTING` | 3초 |\n| 수거함 운반 `TRANSPORTING` | 8초 |\n| 놓기·이탈 확인 `PLACING` | 5초 |\n| 팔 복귀 `RETURNING_ARM` | 7초 |\n| 안착 확인 `VERIFYING_PLACEMENT` | 2초 |\n\n두 물체는 통신·관측 시간을 더해 약 80초 이상 걸립니다. 단계 안의 세부 동작은\n해당 시간을 나누어 쓰며 각각 최소 1초입니다. 청소 BT의 `ExecuteOne`을 실행하는 동안\n`mission/debug_snapshot`의 `manipulation_feedback`과\n`/mock/manipulation/execution_events`에서 세부 진행을 확인할 수 있습니다.\n웹 관제보드의 실행 → BT에서도 조작 단계와 세부 동작이 표시됩니다.\n\n`stage_durations_sec`는 모든 scenario의 기본 시간이고, scenario별 값이 우선합니다.\n설정을 바꾸면 Mock 서버를 다시 실행해야 합니다. 이미 진행 중인 실행의 DB는 보존합니다.\n\n| Runtime timeout | 기본 로컬 Mock | 외부 Action Mock 프로필 |\n|---|---:|---:|\n| 단일 작업 | 30초 | 120초 |\n| 취소 확인 | 5초 | 15초 |\n| 청소 전체 | 180초 | 300초 |\n\nROS 계약 회귀 검사는 같은 논리 fixture의 시간을 줄이고 Gazebo 검사는 위 관찰 시간을 사용합니다.\n설정은 [Runtime 프로필](../config/runtime_manipulation_mock.yaml)과\n[Gazebo 프로필](../config/runtime_gazebo_manipulation_mock.yaml)에서 관리합니다.\n"},"ros2_ws/src/cleany_moveit_capabilities/README.md":{"title":"MoveIt 배치 검사와 시간 배정","body":"# MoveIt 배치 검사와 시간 배정\n\n`cleany/StateValidityBatch`는 한 PlanningScene 읽기 잠금 안에서 전체 로봇 상태를\n순서대로 검사한다. `/check_state_validity_batch`의 타입은\n`cleany_interfaces/srv/CheckStateValidityBatch`이며 요청당 1~64개 상태를 받는다.\n첫 실패까지만 검사하고 `valid`, `first_invalid_index`, 접촉 정보를 반환한다.\n잘못된 입력과 계산 오류는 `success=false`다.\n\n같은 관절 목록과 메타데이터를 가진 diff 묶음은 첫 상태의 변환과 관절 인덱스를\n재사용한다. 각 표본의 관절값, mimic 관절과 transform은 갱신하고 충돌 및 제약은\n모든 표본에서 검사한다. 관절 목록, 부착 물체 또는 다자유도 상태가 다르면\n각 표본을 장면의 현재 상태에서 독립적으로 변환한다. 요청 사이에는 결과를 재사용하지 않는다.\n\n`cleany/RobustTimeParameterization`은 짧은 꺾임과 방향 반전을 처리하고 관절 한계,\n속도, 가속도와 보간 경로 허용오차를 검사한다. 유효한 시간 궤적을 만들 수 없으면\n계획 실패로 반환한다. 원본과 수정 범위는 [TOTG 출처](src/totg/README.md)에 있다.\n\n충돌 형상과 시작 시 detector 확인은\n[cleany_moveit_collision](../cleany_moveit_collision/README.md)이 담당한다.\n이 패키지는 SolidFCL을 복제하거나 이동하지 않는다.\n\n빌드와 검증은 `make build-motion-foundation`, `make test-motion-native`,\n`make test-motion-runtime`을 사용한다. [검증 절차](../../../docs/TESTING.md#실물-계획과-실행-기반-검증)를 따른다.\n\n같은 관절 목록의 상태는 묶음 안에서 이름 검증과 모델 인덱스를 재사용한다. 부착 물체와 multi-DOF 변경이 없는 diff 상태는 첫 상태 변환 후 관절각을 갱신하며, 다른 요청은 장면 상태에서 독립적으로 복원한다.\n"},"ros2_ws/src/cleany_moveit_collision/README.md":{"title":"MoveIt 충돌 검사","body":"# MoveIt 충돌 검사\n\n`cleany/SolidFCL`은 로봇 메시의 닫힌 볼록 조각을 내부가 채워진 FCL 형상으로\n검사합니다. 조각 내부에 완전히 들어간 장애물도 검출하며, 서로 떨어진 조각의\n틈과 링크별 배치, 충돌 허용 행렬을 유지합니다. 열린 면이나 오목한 조각은\n초기화 오류로 거부합니다. 임의 CAD를 볼록 외피로 바꾸지는 않습니다.\n\nFreeCAD 검사 전용 `cleany/CADInspectionFCL`은 URDF collision 이름이\n`cad_enclosure__`로 시작하는 메시만 같은 닫힌 볼록 입체로 검사한다.\n나머지 CAD 메시에는 FCL 표면 검사를 유지한다. 선언한 외피가 열렸거나\n오목하면 초기화를 거부하며, 로드한 형상과 URDF 선언의 개수가 달라도\n거부한다. 검사 launch는 외피가 있는 캐시에서 이 detector와 로드 확인\ncapability를 자동 선택한다. 기존 `cleany/SolidFCL`의 엄격한 조건은 유지한다.\n\n자기 충돌은 매 요청에서 링크 경계 상자를 계산해 검사할 부품 쌍을 줄인다.\n조건부 접촉 허용, world, attached object와 거리 쿼리는 FCL 규약을 따른다.\n이전 자세의 충돌 결과는 재사용하지 않는다.\n\n`cleany/RequireCollisionDetector`는 MoveGroup 시작 시 요청한 detector가 실제로\n선택됐는지 확인합니다. 로드 실패로 다른 detector가 선택되면 프로세스를\n종료합니다. 이 패키지는 ROS endpoint나 모터 제어 기능을 추가하지 않습니다.\n\nMoveIt launch는 이 패키지를 의존하며 `collision_detector:=cleany/SolidFCL`을\n기본값으로 사용합니다. 표면 검사 대조에는 `collision_detector:=FCL`을 명시합니다.\n형상 계약은 [모델 문서](../cleany_description/docs/model-runtime.md#충돌-형상),\n빌드와 검사는 [검증 절차](../../../docs/implementation/reference/testing.md#충돌-메시와-내부-장애물-검사)를 따릅니다.\n"},"ros2_ws/src/cleany_moveit_collision/docs/calibrated-cad.md":{"title":"보정된 CAD 파지 모델","body":"# 보정된 CAD 파지 모델\n\n`freecad_calibrated`는 검증된 FreeCAD 배포의 외형과 충돌 캐시를 현재 모터\n좌표에 연결한다. 참조 뷰어의 `reference_only` 설정은 변경하지 않는다.\n`cad_grasp.json`의 `cad_binding_file`은 원본 모델, 카메라 보정, 기존 캐시의\n해시와 좌표 대응을 보존한다. 이미 보정한 관절 원점은 고정된 카메라 보정\n모델에서 가져온다. 메시를 다시 맞추거나 고정턱 보정을 추가하지 않는다.\n\nJetson의 `cad_grasp.json`은 `collision_mesh_overrides`로 단순화한 충돌 메시를\n선택한다. 키는 원본 GLB의 SHA-256, 값은 대체 GLB의 SHA-256이다.\n프로파일을 생성할 때 충돌 요소의 원본 URI를 찾아 대체 파일의 해시를 확인한다.\n시각화에는 원본 CAD를 사용한다. 체결 구멍 단순화 대상은 손목 카메라 마운트, 그리퍼 판,\n캠 혼과 서보 부품에 있는 지름 약 2.05~5.20 mm의 체결 구멍이다.\n\n긴 팔 튜브의 충돌 형상은 모서리가 있는 사각 기둥이다. 이전 볼록 형상을\n포함하며 추가 돌출은 0.53 mm 이내다. 중앙 기둥과 팔 연결부의 단순화된 볼록\n형상은 기존 형상을 포함하며 돌출 상한은 0.25 mm다. 그리퍼 몸통의 판과\n서보, 네 손끝 뒤 지지대는 기존 표면과의 양방향 거리 상한 0.1 mm를 적용한다.\n손끝의 물체 접촉 패드에는 기존 형상을 사용한다.\n\n| 계산 | 입력과 책임 |\n|---|---|\n| 모터와 제어기 | 기존 14개 관절 이름과 rad 좌표, 보정 범위를 유지한다. |\n| 팔과 헤드 | 기존 `q_CAD = scale × q_motor + offset`을 URDF 원점과 동축 mimic 관절로 표현한다. CUDA가 지원하는 축 정렬을 위한 고정 프레임은 원래 CAD 몸체 좌표를 복원한다. |\n| 대칭 집게 | 모터의 최대 열림 0도와 닫힘 160도를 CAD의 열림과 닫힘 끝점에 대응시킨다. 기존 `solve_linkage`의 원 교점과 조립 분기로 종속 관절 16개를 계산하며 모터 명령 인터페이스를 만들지 않는다. |\n| GPU IK | `curobo_ik_moveit`와 `cad_cached`가 기존 primitive 캐시를 사용한다. CPU IK fallback은 사용하지 않는다. |\n| 충돌 판정 | `cleany/CalibratedCADFCL`이 각 검사 상태의 손가락 연동을 다시 계산한 뒤 기존 CAD 충돌 구현에 전달한다. GPU의 직접 전체 충돌 검증 경로는 이 모델을 거부한다. |\n| 대상 물체 접촉 | 실제 손목과 손가락 몸체만 touch links에 포함한다. 팔과 지지대는 포함하지 않는다. |\n\n`CLEANY_CAD_LINKAGE_JSON`은 launch가 준비된 URDF의\n`cleany_cad_calibration` 속성에서 전달한다. 연동 계산에 실패하면 해당 상태를\n충돌로 판정하며, 요청자가 전달한 상태는 수정하지 않는다. 자기 충돌용\n`cad_self__`와 외부 충돌용 `cad_world__` 구분, 선언된 enclosure의 solid 처리와\nACM은 기존 배포 구현을 따른다. 기존 제어 모델과의 충돌 구현 혼용을 피하기\n위해 재사용한 CAD 구현의 C++ namespace를 분리한다.\n\n운영 모델에서 외부 충돌과 자기 충돌 형상이 다른 부품은 양쪽 그리퍼의 구동 링크 네 개다.\n운영 프로파일의 `shared_world_collision_links`에 지정된 베이스, 헤드, 팔 링크는 두 검사에\n같은 외부 충돌 형상을 사용한다. 네 구동 링크는 자기 충돌에 원본 STL 표면을 사용한다. 기존 convex enclosure는\n오목한 굽힘 사이의 빈 공간을 메워 조기 충돌을 발생시킨다. 외부 물체에 대해서는\n기존 solid enclosure를 유지한다. 링크 사이 충돌을 ACM으로 허용하지 않는다.\n\n기존 SRDF의 기계 접합부 허용은 형상이 없는 호환 프레임에서 실제 CAD\n몸체로 옮긴다. 기존 두 턱의 닫힘 접촉 허용은 대칭 집게의 두 tip에 연결한다.\n그리퍼 구동 링크 L/R 사이의 충돌은 허용하지 않는다. 접근, 닫기와 들기 등\n단계별 검사를 수행할지는 기존 수거 프로파일의 설정을 따른다.\n\n`configs/robot/cad_gripper_endpoints.json`은 양쪽 끝점 대응을 관리한다. 현재\n모터 범위 2048~3868 tick, 즉 159.9609375도는 유지한다. CAD 원본 BREP는\n144~145도 사이에서 구동 링크 간섭이 시작되며, 기존 STL은 144도에서\n약 0.014 mm의 보수적인 간섭을 보고한다. 두 형상 검사에 통과하는 최대 정수\n각도인 CAD 143도를 열림 끝점으로 사용한다. 이 값은 모터의 개방 제한이 아니다.\n중간 모터값을 두 끝점 사이 CAD 각도로 선형 대응한 뒤 비선형 링크를 계산한다.\n\n집게 폭 제어와 CAD 운동학 연동은 별개다. 이 전환은 이전에 복원한 개구 폭\n곡선을 다시 적용하지 않는다. 끝점 보간은 실측된 모터/캠 기어비나 중간 개구\n폭 보정이 아니므로 실제 중간 손가락 위치의 정확도를 보장하지 않는다.\n\n`cad_binding_file.motion_validation.ready`가 true가 아니면 쓰기 가능한\n`real_control.launch.py`는 하드웨어 노드를 만들기 전에 거부한다. 프로파일\n생성과 별도 domain의 FK, 충돌, 계획 및 GPU 검증에는 모터 드라이버가 필요\n없다. 이 플래그를 수동으로 바꾸어 충돌 실패를 우회하지 않는다.\n\n## Jetson 파지 후보의 OctoMap 검사\n\nJetson Orin에서 `cleany_moveit_collision`을 `-DCLEANY_ENABLE_CUDA_OCTOMAP=ON`으로\n빌드하면 실물 MoveIt의 깊이 지도 실행에 `/check_grasp_octomap`을 등록한다. 서비스는\n현재 장면과 OctoMap을 읽기 잠금한 상태에서 최대 64개 IK 자세를 검사한다.\n지도 또는 충돌 형상이 바뀌면 CUDA 데이터를 갱신한다. 지원하지 않는 장면이나 CUDA\n오류에서는 선택기가 기존 MoveIt 검사를 사용한다.\n\n`/grasp_selection_server`의 `grasp_octomap_mode`은 `off`, `compare`, `on`을 받는다.\n`compare`는 같은 지도에서 MoveIt의 OctoMap 결과를 비교한다. 두 검사가 일치하면\nGPU에서 겹침이 확인된 후보를 제외한다. 결과가 다르면 전체 배치를 MoveIt으로 다시 검사한다.\n`on`은 비교 호출을 생략한다. GPU 검사에서 충돌이 없었던 후보의 최종 자세와 경로는\nMoveIt에서 전체 장면을 기준으로 검사한다.\n"},"ros2_ws/src/cleany_moveit_config/docs/interfaces.md":{"title":"cleany_moveit_config 노드 인터페이스","body":"# cleany_moveit_config 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## handeye_collision_scene_applier\n\n실행 파일: `apply_handeye_collision_scene`. 원본: [apply_collision_scene.py](../cleany_moveit_config/apply_collision_scene.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 서비스 호출 | `/apply_planning_scene` | `moveit_msgs/srv/ApplyPlanningScene` | Service 기본값; `scene_config` YAML의 `apply_service` |\n\nScene 수락 후 종료하는 노드다. [Planning 계약](planning.md)을 따른다.\n\n## FreeCAD 검사\n\n`freecad_inspection.launch.py`는 `/freecad_inspection`에 MoveIt과\n`robot_state_publisher`를 배치한다. [Planning 계약](planning.md#freecad-형상-검사)을 따른다.\n\n| 종류 / 방향 | 이름 | ROS 타입 |\n|---|---|---|\n| 구독 | `/freecad_inspection/joint_states` | `sensor_msgs/msg/JointState` |\n| 구독 | `/freecad_inspection/scene_cloud` | `sensor_msgs/msg/PointCloud2` |\n| 발행 | `/freecad_inspection/scene_cloud_filtered` | `sensor_msgs/msg/PointCloud2` |\n| 서비스 제공 | `/freecad_inspection/get_planning_scene` | `moveit_msgs/srv/GetPlanningScene` |\n| 서비스 제공 | `/freecad_inspection/check_state_validity` | `moveit_msgs/srv/GetStateValidity` |\n| 서비스 제공 | `/freecad_inspection/apply_planning_scene` | `moveit_msgs/srv/ApplyPlanningScene` |\n\nTF와 robot description도 같은 namespace를 사용한다.\n`runtime_test/check_freecad_lower_body.py`는 같은 namespace에서 관절 상태와\n점군을 발행하고 필터 결과를 구독한다. 시험 장애물은 위 scene 적용 서비스로\n추가하고 상태 검사 서비스에서 접촉을 조회한 뒤 제거한다.\n점군 발행과 구독은 sensor-data QoS, 관절 상태 발행은 reliable depth 10이다.\n"},"ros2_ws/src/cleany_moveit_config/docs/planning.md":{"title":"MoveIt planning 계약","body":"# MoveIt planning 계약\n\nMoveIt은 팔별 5관절을 계획하며 gripper, base는 planning group에서 제외합니다. Grasp group은 같은 팔 관절을 사용하고 fixed TCP joint까지 chain을 확장합니다.\n\n`move_group.launch.py`는 기존 시뮬레이션 모델 `jetson_20261009`와 `joint_limits.yaml`을 사용합니다. 실물 공통 CAD의 실행은 아래 실물 계획 기반과 [모델 계약](../../cleany_description/docs/model.md)을 따릅니다.\n\n## FreeCAD 형상 검사\n\n`freecad_inspection.launch.py`는 로컬 ROS domain에서 FreeCAD URDF를 그대로\n읽어 MoveIt의 상태·충돌 검사와 OctoMap을 실행한다. 기본 모델은\n`freecad_kinematic`이며, `cad_delta_*` 좌표 0은 CAD 파일의 저장 자세다.\n검사 launch는 궤적 계획, IK와 실행 인터페이스를 비활성화한다.\n검사용 포인트클라우드는 CAD `base_link`로 표현된 데이터를 사용한다.\n[실행 방법](../../../../docs/RUNNING.md#freecad-moveit와-octomap-검사)을 따른다.\n\n`collision_cache`를 지정하면 GLB 충돌 메시를 읽는다. 기본 인덱스 캐시는\n삼각형 순서와 좌표를 보존하며, 표면 감면 캐시는 생성 시 명시한 양방향\n표면 거리 상한 안에서 삼각형을 줄인다. 두 종류 모두 링크 변환과 시각 메시를\n보존한다. 표면 감면은 입체 포함 보증이 아니므로 미확인 실물 계획의 충돌\n여유로 사용할 수 없다. 캐시는 원본\nURDF 및 형상 manifest의 해시가 일치하고 캐시 메시가 정상일 때만 사용한다.\ncuRobo 검사도 이 캐시의 저장 자세를 읽을 수 있다.\n\n`moveit_primitives` 캐시는 몸통을 채운 박스 5개의 합집합으로 표현한다.\n두 CAD 상판에서 추출한 공통 직사각형 투입구와 그 아래 공간은 비워 둔다.\n하단 경계는 기존 내부 횡대 `InstalledProfile20`의 윗면이며 실물 쓰레기통의\n바닥이나 사용 가능 깊이를 확정한 값이 아니다. 바닥 부근의 기존 IMU 형상은\n별도로 유지한다. 몸통 원본 삼각형이 투입구 내부를 가로지르면 생성을 거부한다.\n몸통 측면의 라이다 높이 틈도 이 충돌 프로필에서는 채운다. 센서 프레임과\n원본 시각 모델은 유지하지만 이 프로필을 라이다 광선 시뮬레이션의 가림 모델로\n사용하지 않는다.\n\n마운트는 각각 속이 찬 박스로, 바퀴는 기존 관절축과 동축인 원통으로\n바꾼다. 서로 움직이는 링크는 합치지 않는다. 이 단순 입체는 선택한 원본\n표면을 감싸며, 추가 여유는 부동소수점 바깥쪽 반올림뿐이다. 작은 구멍과 홈을\n채우므로 근처 물체를 더 일찍 충돌로 판정하거나 자체 필터에서 제거할 수 있다.\n단순 입체에는 표면 거리 상한을 적용하지 않는다.\n\n팔 본체는 기존 `optimize_arm_collision_meshes.py`의 분할 외피 알고리즘을\n사용한다. 새 CAD 좌표에서 부품과 포크를 분할하고 각 조각을 닫힌 볼록\n다면체로 감싼다. 마스트는 높이 방향 8개 구간으로 나눠 내부를 채우면서\n잘록한 허리와 넓은 밑부분을 유지한다. 설정은\n`configs/robot/freecad_moveit_collision.json`의 `component_enclosures`가 관리한다.\n직렬화한 float32 GLB가 원본 조각의 모든 삼각형을 포함하는지 검사한다.\n외피 확장 상한은 팔 1mm, 마스트 0.25mm이며 **각 원본 조각의 볼록 외피**를\n기준으로 한다. 오목한 CAD 표면과의 거리 상한은 아니며 작은 구멍은 채워진다.\n분할 평면과 수치 여유 1µm는 메시 생성 설정이며 관절 보정값이 아니다.\n\n생성한 외피에는 `cad_enclosure__` collision 이름을 붙인다. 검사 launch는\n이 선언이 있으면 `cleany/CADInspectionFCL`을 선택하고 실제 로드를 확인한다.\n닫힌 외피 내부에 완전히 들어간 장애물도 검출하며, 선언하지 않은 CAD 메시에는\n기존 FCL 표면 검사를 유지한다. 형상 초기화나 detector 로드가 실패하면\n검사 프로세스를 종료한다.\n\n헤드 카메라 하우징과 집게 장착 어댑터의 볼록 외피 확장 상한은 0.25mm다.\n양쪽 손목 카메라의 렌즈, 앞 유리와 마운트는 실측 치수를 담은 입력 표면\n메시를 유지한다. 구동 로드, 외측 링크와 구동 혼은 1mm 상한의 외피로 단순화한다.\n같은 링크에 고정된 팁의 쉘과 삽입부는 0.25mm 상한의 외피로 묶는다.\n손목 본체, 서보, 집게 상하판, 캠과 캠 혼은 구멍과 결합부 틈이 있는\n표면 메시로 생성한다. `RightTool`, `LeftTool`, `RightWrist`, `LeftWrist`에\n속하는 표면 감면 대상은 원본 삼각형 표면과의 양방향 거리 상한 0.5mm를\n사용한다. 후보가 더 작고 표면 검증을 통과할 때만 입력 캐시를 대체한다.\n`preserve_collision_parts`의 접촉 패드(`Tip_Support`) 4개, 운반 링크\n(`Distal_Rod`)와 내측 링크(`Internal_Rod`) 8개, 광학 부품 5개는 입력 캐시의\n표면 메시를 유지한다. 운반 링크와 내측 링크는 축 구멍과 포크 틈을 유지해야\n하므로 하나의 볼록 외피로 대체하지 않는다. 보호 부품을 단순 입체나 외피\n대상으로 지정하면 생성을 거부한다. 접촉 패드 전체를 보존하며, 결합부의\n양수 간격과 패드 사이 입구를 종속 관절을 해석한 CAD 비교 자세에서 검사한다.\n자기 접촉은 감면 전 표면 모델과 대조한다. 메시 설정은 접촉 허용 쌍을\n추가하지 않는다. 외부 장애물 검사와 제한된 CAD 자세의 통과는 기존 CAD\n자기 접촉이나 모든 자세의 무충돌 계획을 보증하지 않는다.\n원본과의 차이를 진단할 때는 원본 FreeCAD 솔리드의 표면 거리와 교집합\n부피를 사용해 틈, 조립면 접촉, 체적 겹침을 구분한다.\n헤드 팬의 고정 및 회전 브래킷, 팬 서보 외장과 구동 혼은 원본 틈이 있는\n표면 메시를 유지한다. 팬 아래 지지 혼의 고정 링크 소유는\n[CAD 링크 근거](../../cleany_description/docs/freecad-kinematics.md)에 따른다.\n조립 접촉만 분리한 검사는 별도 scene의 정해진 CAD 자세에만 적용한다.\n\n`component_enclosures.sets`는 함께 고정된 부품을 하나의 외피로 묶는다.\n같은 관절 링크와 메시 좌표계를 갖는 원본만\n허용한다. `combine_components`는 한 강체 안의 분리된 조각을 함께 감싸며,\n틈을 남기기 위한 평면 분할과 동시에 지정할 수 없다. 생성 manifest는 묶음의\n모든 원본 파일과 해시를 기록한다. 형상 허용치는 실물 보정이나 충돌 여유가\n아니며 비충돌 XML, 관절축과 영점 설정은 변경하지 않는다.\n\ncuRobo의 `--world-cache`는 같은 링크별 삼각형을 미리 합쳐 파일 수와 로딩 시\n연결 작업을 줄인다. 이 cuRobo 변환은 MoveIt 및 OctoMap 캐시를 변경하지 않는다.\n`moveit_primitives`를 입력하면 CAD 저장 자세의 FK를 적용한다. 박스, 원통과\n`cad_enclosure__` 외피 조각은 각각 독립 GPU 충돌 객체로 유지해 겹치는 입체의 내부 면이 전체 합집합의\n안팎 판정을 뒤집지 않도록 한다. 원통은 외접 64각 기둥으로 근사하며, 변환한\n좌표는 GLB의 float32로 저장한다. 현재 바퀴의 반지름 확장은 약 0.077mm다.\nworld manifest는 관절 URDF 해시와 `required_mesh_query_distance_m`을 기록한다.\n박스는 `cleany.freecad_collision_world/v2`의 `cuboids`에 위치, wxyz quaternion과\n전체 변 길이를 저장하고 기본 cuboid 검사기로 읽는다. 몸통의 다섯 박스를\n합치지 않으므로 투입구와 아래 공간은 유지된다. 박스 데이터의 해시도 검사한다.\n`load_world_shapes()`는 GPU용 메시와 cuboid를 분리해 반환하고,\n`load_world_cache()`는 기존 미리보기 호출을 위해 박스까지 삼각형으로 표시한다.\n후자의 표시용 삼각형 수를 실제 GPU 메시 비용으로 집계하지 않는다.\n구버전 mesh world는 그대로 읽으며, `--mesh-boxes`로 동일 형상의 전부 메시인\n대조 캐시를 만들 수 있다.\n검사 도구는 모든 객체의 내부를 덮도록 객체별 경계 상자 대각선에서\n`WorldCollisionConfig.max_distance`를 계산한다. 기본 0.1m 탐색 범위는 큰\n몸통의 깊은 내부를 놓칠 수 있으므로 이 캐시를 다른 검사기에 연결할 때도\n같은 범위를 적용해야 한다. 이는 거리 검색 범위이며 물리적 padding이 아니다.\n\ncuRobo 검사 도구는 같은 저장 자세의 충돌 메시를 CUDA mesh world로 읽는다.\nCAD 삼각형에 대한 접촉 검사를 제공하며, 운영 cuRobo 로봇 모델과\n궤적 solver를 갱신하려면 아래 자료가 필요하다.\n\n| 적용 경로 | 필요한 확인 |\n|---|---|\n| 관절 상태와 MoveIt | 새 CAD 기준 자세에서 팔, 헤드와 집게 캠의 encoder 값 및 방향, 관절의 가동 범위와 속도 한계 |\n| 집게와 계획 목표 | 실제 캠 각도와 개구 폭의 대응, 양쪽 TCP 위치·방향, 접촉이 허용되는 부품 쌍 |\n| 쓰레기통 투입 | 실제 통의 내벽과 바닥 위치, 내부 장치와의 간섭, TCP 기준 투입 위치와 높이. CAD의 상판 투입구만으로 통 깊이나 투입 목표를 확정하지 않음 |\n| MoveIt·cuRobo 충돌 모델 | 새 링크에 맞춘 SRDF와 자기 충돌 행렬, 가동 범위를 덮는 충돌 형상 및 구 모델, 두 검사기의 결과 대조 |\n| 실물 OctoMap | 카메라 optical frame의 새 장착 TF와 관절 피드백의 시간 대응, 자세별 로봇 제거와 점유 확인 |\n| cuRobo의 OctoMap 사용 | 기존 scene adapter가 거부하는 점유 데이터를 누락 없이 전달하는 변환과 장애물 검증 |\n| 실제 궤적 실행 | 검증된 관절 이름·단위·제한을 controller에 매핑하고 정지·복귀 시험 |\n\n## Group과 controller\n\n| Collision detector | 계약 |\n|---|---|\n| 기본 MoveIt / Mock | cleany/SolidFCL; 닫힌 최적화 convex 조각 내부 포함 검사, RViz에도 전달 |\n| 로딩 확인 | cleany/RequireCollisionDetector; 요청 detector 실패 시 프로세스 종료 |\n| 원본 CAD 표면 대조 | collision_detector:=FCL 명시 |\n\n```mermaid\nflowchart TB\n    Backend[\"활성 backend 하나\"] -->|\"팔 / gripper joint_states\"| State[\"RobotState\"]\n    Model[\"URDF / SRDF / KDL 설정\"] --> MoveIt[\"MoveIt / move_group\"]\n    State --> MoveIt\n    Scene[\"Collision scene\u003cbr/>고정 형상 / 동적 대상\"] --> MoveIt\n    MoveIt --> Arm[\"left_arm / right_arm\u003cbr/>계획 trajectory\"]\n    Arm -->|\"FollowJointTrajectory\"| Controller[\"좌우 arm controller\"]\n    Controller --> Backend\n    MoveIt --> Grasp[\"left_grasp_arm / right_grasp_arm\u003cbr/>fixed TCP / plan-only\"]\n    Grasp --> Result[\"도달성 검사 결과\u003cbr/>controller 실행과 별개\"]\n```\n\n| Group | Chain | Controller |\n|---|---|---|\n| left_arm | base_link → left_gripper_frame | left_arm_controller |\n| right_arm | base_link → right_gripper_frame | right_arm_controller |\n| left_grasp_arm | base_link → left_grasp_tcp | plan-only |\n| right_grasp_arm | base_link → right_grasp_tcp | plan-only |\n\n| 항목 | 계약 |\n|---|---|\n| IK | KDL, position_only_ik=true; 목표 위치와 전체 arm seed 사용 |\n| Home | left_home/right_home의 팔 5관절 모두 0 rad |\n| Controller 타입 | control_msgs/action/FollowJointTrajectory |\n| Action 이름 | /left_arm_controller/follow_joint_trajectory, /right_arm_controller/follow_joint_trajectory |\n| Backend 상태 | 팔, gripper 전체 /joint_states 발행 필수 |\n\nPosition-only IK는 목표 orientation을 제약하지 않습니다. SRDF는 직접 parent/child만 충돌 검사에서 제외하며, 비인접, 좌우 cross-arm 검사는 유지합니다.\n\n## 고정 collision scene\n\nHand-eye scene은 config/handeye_collision_objects.yaml의 cleany.moveit_collision_objects/v1 schema로 정의합니다. Box는 전체 길이와 base_link 기준 primitive_pose를 사용하며 top-level CollisionObject.pose에 의존하지 않습니다.\n\nmove_group 실행 후 scene을 한 번 적용합니다.\n\n```bash\nros2 launch cleany_moveit_config handeye_collision_scene.launch.py\n```\n\nApplier는 /apply_planning_scene이 handeye_table, handeye_target_stand, charuco_target을 수락한 뒤 종료합니다. 일반 move_group launch는 이 scene을 자동 주입하지 않습니다.\n\nPick-demo table은 config/pick_demo_collision_objects.yaml에 있으며 rgbd_pick_demo.xml.in과 크기, pose가 일치합니다. Box/can target은 reachable-grasp action에서 동적으로 등록합니다.\n\n관련 안내: [실행](../../../../docs/implementation/running.md), [검증](../../../../docs/implementation/testing.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n\n## Terminal logging\n\n| 옵션 / 출력 | 동작 |\n|---|---|\n| backend_log_level | Standalone info, 센서 MuJoCo warn; 경고 / 오류 유지 |\n| log_level | 기본 info; child logger move_group.scene_mapping은 독립 적용 |\n| log_level:=debug | 전체 MoveIt debug 없이 depth 콜백 / map timing 진단 |\n| Quiet mode | stdout capability banner는 launch log, ROS 로그는 stderr로 화면 유지 |\n| backend_log_level:=info | Banner도 터미널 복원 |\n\n## Humble controller plugin teardown\n\n```mermaid\nflowchart LR\n    Start[\"move_group process 시작\"] --> Preload[\"Controller library를 process-local LD_PRELOAD에 추가\"]\n    Preload --> Run[\"정상 trajectory 실행\"]\n    Run --> Exit[\"SIGINT / node 파괴 중에도 library 유지\"]\n```\n\n| 항목 | 계약 |\n|---|---|\n| 활성 | keep_controller_plugin_loaded:=true |\n| 대상 | moveit_simple_controller_manager/MoveItSimpleControllerManager만 |\n| 기존 preload | 보존 |\n| 목적 | MoveIt 2.5.9 teardown 중 plugin unload와 노드 수명 문제의 우회 |\n| 영향 | Controller 선택과 trajectory 동작 유지; class_loader unload 경고를 숨기지 않음 |\n| 패치된 MoveIt 검증 | keep_controller_plugin_loaded:=false |\n| Runtime 회귀 | backend_log_level:=warn에서 /check_state_validity, SIGTERM escalation 없는 SIGINT 종료, ROS 경고 표시 |\n\nPreloading prevented the observed crash. The workaround does not change\ntrajectory execution or controller selection. Set\n`keep_controller_plugin_loaded:=false` when validating a patched MoveIt install.\nThe workaround may leave the upstream `class_loader` unload warning visible;\nit prevents the observed crash without suppressing that warning.\n\nThe runtime regression exercises `/check_state_validity` in the default MuJoCo\nlogging mode (`backend_log_level:=warn`) and requires clean SIGINT termination\nwithout SIGTERM escalation. It also checks that ROS warnings remain on screen.\n\n## 실물 제어 프로파일 연결\n\n`physical_move_group.launch.py`는 `robot_description_file`, `controllers_file`,\n`joint_limits_file`로 생성된 실물 프로파일을 읽습니다. 별도 한계 파일이 없으면\nURDF의 관절 위치 범위를 계획 설정에 적용하며 RViz도 같은 모델을 사용합니다.\n`allow_trajectory_execution` 기본값은 `false`입니다. 충돌 검사는 `cleany/SolidFCL`을\n사용하며 `cleany/RequireCollisionDetector`가 요청한 검사기의 로드 실패 시 실행을 종료합니다.\n\n\n## 실물 계획 기반\n\n실물, Mock, 일반 MoveGroup launch는 `cleany/RequireCollisionDetector`와\n`cleany/StateValidityBatch`를 함께 로드한다. 전자는 SolidFCL 초기화를 확인하고 후자는\n전체 장면의 배치 상태 검사를 제공한다. OMPL 시간 배정은\n`cleany/RobustTimeParameterization`을 사용한다. [패키지 계약](../../cleany_moveit_capabilities/README.md)을 따른다.\n\n`mock_planning.launch.py`와 `move_group.launch.py`의 기존 팔 제어 회귀는\n`jetson_20261009` 모델과 `joint_limits.yaml`을 함께 사용합니다.\n"},"ros2_ws/src/cleany_mujoco_observer/README.md":{"title":"MuJoCo 카메라와 독립 관측","body":"# MuJoCo 카메라와 독립 관측\n\n이 패키지는 스터디카페의 카메라 렌더링, 제어 시각 전달, 독립 평가용 GT와 접촉 관측을 제공합니다. Physics와 구동은 설치된 MuJoCo backend 및 ros2_control controller가 담당합니다.\n\n```mermaid\nflowchart TD\n    Physics[\"MuJoCo hardware / physics\"] -->|mutex 보호 복사| Snapshot[\"별도 소유 private snapshot\"]\n    Snapshot --> Sensor[\"Scheduled RGB-D / RGB 카메라\"]\n    Sensor --> Public[\"공개 센서 토픽 / 인식 입력\"]\n    Snapshot --> GUI[\"Efficient GUI\"]\n    Snapshot --> GT[\"GT AABB / 접촉 진단\"]\n    GT --> Eval[\"독립 시뮬레이션 평가\"]\n    Control[\"로컬 ros2_control_node\"] -->|read / update / write| Physics\n```\n\nGT와 contact는 검출·분류·파지·계획 입력이 아닙니다. Observer는 qpos, ctrl, 힘이나 weld를 변경하지 않습니다.\n\n## 카메라 선택과 촬영 주기\n\n`scheduled_cameras=true`는 vendor 반복 촬영을 끄고 private snapshot renderer만 공개 토픽을 발행하게 합니다. Vendor 0 Hz 설정의 초기 1회 좌표계도 `/cleany/internal/disabled_vendor/*`로 격리합니다.\n\n| `/sorting_cameras` 선택 | Head | 선택 손목 | 비선택 손목 |\n|---|---|---|---|\n| `active_camera=head` | 10 Hz, `head_high_rate=false`이면 2 Hz | — | 0 Hz |\n| `active_camera=left/right` | 2 Hz | 10 Hz | 0 Hz |\n| 손목 선택 + `head_depth_boost=true` | 10 Hz | 10 Hz | 0 Hz |\n\nSorting은 새 장면 검출과 head 재선택에서 10 Hz, 검출 뒤 2 Hz로 전환합니다. 접근·파지·lift 동안만 head depth boost를 켜고 성공/실패 시 해제합니다.\n\n| 설정 / scheduling | 계약 |\n|---|---|\n| 시작 rate | `head_rate_hz`, `head_idle_rate_hz`, `wrist_rate_hz`; 실행 중 rate 수정 거부 |\n| 주기 기준 | Simulation 측정 시각 기준 최대 목표; 렌더링 비용에 따라 낮아질 수 있음 |\n| Snapshot 복사 | 가벼운 simulation clock으로 촬영 기한을 확인한 뒤 필요한 경우만 `get_data` 복사 |\n| 같은 pass | Head / wrist가 하나의 일관된 snapshot 공유 |\n| Payload | 카메라별 Image / CameraInfo와 depth 변환 배열 재사용; depth는 640픽셀 행 단위 환산 |\n| 지연 | 원래 주기를 유지하며 놓친 기한 건너뜀 |\n| Clock reset | 카메라는 새 시각에서 촬영 재개; 아래 제어 backend는 재실행 필요 |\n\n촬영 빈도를 줄여도 전체 CPU/GPU 부하가 같은 비율로 줄거나 최신 지도 수신이 보장되는 것은 아닙니다.\n\n| 센서 | 공개 토픽 | 계약 |\n|---|---|---|\n| Head RGB-D | `/camera/color/{image_raw,camera_info}`, `/camera/aligned_depth_to_color/image_raw` | 640×480, optical 좌표계, snapshot 촬영 측정 시각 |\n| 손목 RGB | `/{left,right}_wrist_camera/{image_raw,camera_info}` | RGB 전용; 공개 depth / GT mask 없음 |\n\nGLFW offscreen context와 유효한 DISPLAY가 필요합니다. GLFW는 backend thread 시작 전에 동기 초기화합니다.\n\n\u003cfigure class=\"visual-slot\" data-visual-id=\"observer-cameras\">\n\u003cp>\u003cstrong>시각자료 자리 · 비워 둠\u003c/strong>\u003c/p>\n\u003cfigcaption>\u003cstrong>필요한 자료:\u003c/strong> 현재 MuJoCo 모델의 같은 simulation stamp에서 얻은 head/wrist 영상과 camera 이름.\u003cbr>\u003cstrong>빈 이유:\u003c/strong> 기존 Isaac 카메라 비교와 실물 영상은 backend와 시간 계약이 다릅니다.\u003c/figcaption>\n\u003c/figure>\n\n## 제어 주기와 관절 피드백 시각\n\n```mermaid\nflowchart LR\n    Time[\"simulation timestamp / 실제 경과 시간\"] --> Read[\"read\"]\n    Read --> Update[\"update\"]\n    Update --> Write[\"write\"]\n    Write --> Wait[\"마지막 제어 시각에서 한 주기 이상 진행 대기\"]\n    Wait --> Time\n```\n\n| 항목 | 계약 |\n|---|---|\n| 진입점 | `study_cafe_backend.launch.py`가 이 패키지의 `ros2_control_node` 실행 |\n| 기본 | `controller_manager.update_rate=100 Hz`, `use_sim_time=true` |\n| 한 주기 | read/update/write에 동일 시각과 경과 시간 전달 |\n| 지연 후 | 마지막 제어 시각에서 한 주기 이상 진행해야 다음 실행 |\n| 같은 시각 / 시계 정지 | 새 관절 상태나 feedback 수신 시각을 만들어내지 않음 |\n| 시각 역행 | Backend 오류 종료; reset 뒤 새 launch 필요 |\n| 검증 | `test_control_cycle`: read 지연, 중복 / 정지 / 역행 시각, 밀린 주기 |\n\nPhysics timestep이나 물체 상태는 조작하지 않습니다. Feedback 만료와 [BT 정지 판정](../cleany_manipulation_bt/README.md#계약과-증거)은 유지합니다.\n\n## GUI 렌더링\n\n| 실행 선택 | 동작 |\n|---|---|\n| `scheduled_cameras:=true headless:=false sim_viewer:=efficient` | 센서 worker의 snapshot / OpenGL context 공유; vendor fullscreen renderer 미실행 |\n| `sim_viewer:=native` | 전체 MuJoCo 디버깅 UI; efficient viewer 문제 시 대안 |\n| `headless` | GUI 없이도 현재 renderer는 DISPLAY 필요 |\n\n`config/study_cafe_ros2_controllers.yaml`의 `sorting_cameras`가 초기값을 관리합니다.\n\n| 설정 | 기본값 / 동작 |\n|---|---|\n| `viewer_rate_hz` | 20.0, wall time 기준 최대 빈도 |\n| `viewer_width` / `viewer_height` | 960 / 720 |\n| `viewer_shadows` | false; 센서 촬영에는 기존 그림자를 복원해 RGB-D 픽셀 유지 |\n| 창 그리기 | Physics mutex 미보유 |\n| 최소화 / 창 닫기 | GUI 렌더링 생략, 센서와 physics 계속 실행 |\n\n| 입력 | 동작 |\n|---|---|\n| 마우스 왼쪽 / 오른쪽 / 가운데·휠 | 회전 / 이동 / 확대 |\n| Shift / Home | 수평 이동·회전 / 시점 초기화 |\n| Space / Backspace | Backend pause / reset service |\n| Escape / 창 닫기 | GUI 숨기기 |\n| 실행 터미널 Ctrl+C | 전체 종료 |\n\nEfficient viewer는 GLFW가 메인 스레드 전용으로 규정한 창 생성과 이벤트 처리를 센서 worker에서 수행합니다. 현재 Ubuntu 22.04 VM `DISPLAY=:0`에서 확인했으며 창 정지가 센서 단절로 이어질 수 있습니다. 다른 환경에서 문제가 생기면 native viewer를 사용합니다. `mjv_moveCamera`는 설치 헤더에 맞춰 5/6인자 API를 빌드 시 선택합니다.\n\n## 독립 Ground Truth 관측\n\n| 항목 | 계약 |\n|---|---|\n| Hardware wrapper | `ObservedMujocoSystem`이 설치된 `MujocoSystemInterface` 상속 |\n| 소스 | Physics mutex 아래 복사한 별도 snapshot의 동적 study-cafe collision geometry |\n| 출력 | `/simulation/sorting_ground_truth`, `visualization_msgs/MarkerArray` |\n| Marker | `text`: body명, `pose.position`: base_link AABB 중심, `scale`: full extents, 단위 quaternion |\n| Mesh 경계 | 실제 변환 vertex 극값; sphere/capsule/cylinder/ellipsoid는 해석적 투영 반경 |\n| 빈도 | Snapshot 복사 wall time 최대 10 Hz, 발행 simulation time 최대 10 Hz |\n| 소비자 | 물체 이동과 수거함 안착을 검사하는 테스트 oracle |\n\nLocal AABB를 회전해 다시 감싸는 방식의 과대 경계를 피합니다. Snapshot 잠금과 제어 주기 비용은 실측 대상이며 hard-real-time 보장은 없습니다.\n\nHumble `mujoco_ros2_control` 0.0.3 C++ API를 사용합니다. Vendor read-loop에서 arena/contact/force를 동시 조회하는 경로는 쓰지 않습니다. GT/contact의 private copy 보호가 backend 전체의 동시 접근 문제를 해결했다는 뜻은 아닙니다. Publisher-only `sorting_observer`는 시작 때 parameter 파일을 읽으며 실행 중 변경이나 별도 spin thread는 없습니다.\n\n## 선택형 접촉 진단\n\n| 항목 | 값 / 해석 |\n|---|---|\n| 활성 | `sorting_contact_diagnostics:=true`, 기본 false |\n| 출력 | `/simulation/contact_diagnostics`, `diagnostic_msgs/DiagnosticArray`; 구독자가 있을 때 최대 10 Hz |\n| 데이터 | Snapshot contact와 `mj_contactForce`; physics 재계산 / 힘 적용 없음 |\n| Header | Snapshot simulation time, `base_link` |\n| 첫 status | 전체 / 발행 contact 수 |\n| 개별 status | Body/geom 이름·ID, base-좌표계 위치(m), signed distance(m, 음수 penetration), contact-좌표계 normal force(N), tangential 크기(N) |\n| 상한 | `sorting_observer.maximum_contacts=256`, 허용 1–4096 |\n| 생략 | 상한 초과 또는 geom ID 없는 flex contact는 summary WARN, 전체 수와 발행 수 구분 |\n\nNormal force는 명령이나 파지 성공 판정이 아닙니다. 여러 접촉력을 물체 무게로 단순 합산하지 않으며 controller·검출·분류·계획은 이 진단을 구독하지 않습니다.\n\n## 검증\n\n```bash\nmake test\n```\n\n저장소 루트에서 전체 workspace를 빌드하고 검사합니다. 실제 OpenGL RGB-D 검사는 사용 가능한 display에 연결한 환경에서 실행합니다. `DISPLAY`가 없으면 해당 검사만 skip되므로 결과에서 실행 여부를 확인합니다.\n\n| 검사 | 확인 범위 |\n|---|---|\n| 기하 / 접촉 | 회전 base-좌표계 변환, 힘 조회, 상한 / 잘못된 snapshot 거부 |\n| 비간섭 | 읽기 전후 integration state와 applied force 불변 |\n| Snapshot | 원본 arena 초기화 뒤에도 copy의 contact / force 유지 |\n| Plugin | Wrapper library의 hardware plugin 로딩 |\n| Renderer | GUI draw 뒤 headless와 RGB/depth 동일, 640×480 / optical 좌표계 / capture stamp / CameraInfo 일치 |\n\n전체 분리 수거 성공은 별도 시나리오 검증 대상입니다. 구현 기준: [설치 버전 plugin](https://github.com/ros-controls/mujoco_ros2_control/blob/0.0.3/mujoco_ros2_control/src/mujoco_system_interface.cpp), [MuJoCo contact API](https://mujoco.readthedocs.io/en/3.4.0/APIreference/APIfunctions.html#mj-contactforce).\n"},"ros2_ws/src/cleany_mujoco_sim/docs/backends.md":{"title":"MuJoCo backend 계약","body":"# MuJoCo backend 계약\n\n\n[장면과 실행 설정](scenes.md) · [조작 가이드](../../../../docs/implementation/how-to/manipulation.md)\n\n한 실행에서는 backend 하나만 사용합니다. Joint state, sensor, TF, controller의 소유자를 중복시키지 않습니다.\n\n## Backend 종류\n\n| Backend | 책임 |\n|---|---|\n| Custom simulation | base velocity, joint feedback, LiDAR/depth |\n| Study-cafe ros2_control | MuJoCo, 팔 FollowJointTrajectory, 관찰 카메라와 sorting |\n| Study-cafe manipulation | 검출, 후보 선택, 접근과 sorting |\n\n## 모델과 시간\n\n기하와 센서의 원본은 패키지 config/와 cleany_description 모델입니다. CAD geometry는 wheelbase 0.350 m, separation 0.6038 m, radius 0.0635 m이며 실물 측정값과 구분합니다.\n\nCustom backend는 capture stamp를 노드 clock으로 만들며 자체 `/clock`을 발행하지 않습니다. Study-cafe ros2_control backend는 simulation clock을 사용하고 소비자는 같은 `use_sim_time`을 사용합니다. Hand-eye는 [동기화 계약](../../cleany_handeye_calibration/docs/frames-and-data.md), MoveIt은 [Planning 계약](../../cleany_moveit_config/docs/planning.md)을 따릅니다.\n\n## 실행과 한계\n\nCustom/ros2_control backend의 동시 실행은 joint 명령 경쟁을 일으키므로 허용하지 않습니다. MuJoCo 결과는 실물 구동, 집기, 제동거리 검증이 아닙니다.\n\n실행 인자는 launch/*.launch.py와 `ros2 launch ... --show-args`에서 확인합니다.\n\n관련 안내: [실행](../../../../docs/implementation/running.md), [검증](../../../../docs/implementation/testing.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n\n현행 장면과 실행은 [Study-cafe 안내](scenes.md)를 따릅니다. 이전 hand-eye backend와 RGB-D pick demo는 제거됐습니다.\n"},"ros2_ws/src/cleany_mujoco_sim/docs/interfaces.md":{"title":"cleany_mujoco_sim 노드 인터페이스","body":"# cleany_mujoco_sim 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## mujoco_sim\n\n실행 파일: `mujoco_sim_node`. 원본: [sim_node.py](../cleany_mujoco_sim/sim_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `~/joint_cmd` | `sensor_msgs/msg/JointState` | R10 |\n| 토픽 구독 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10 |\n| 토픽 발행 | `joint_states` | `sensor_msgs/msg/JointState` | R10; `publish_rate_hz` 기본 60 Hz |\n| 토픽 발행 | `odom` | `nav_msgs/msg/Odometry` | R10; `publish_rate_hz` 기본 60 Hz |\n| 토픽 발행 | `scan` | `sensor_msgs/msg/LaserScan` | R10; `scan_rate_hz` 기본 5.5 Hz, `scan_enabled` |\n| 토픽 발행 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 발행 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n`~/joint_cmd`는 private 이름이며 root namespace에서는 `/mujoco_sim/joint_cmd`입니다. Odom TF는 `publish_odom_tf`로 제어합니다. Custom backend에는 별도 `/clock` publisher가 없습니다.\n\n## left_wrist_camera_contract_adapter\n\n실행 파일: `camera_contract_adapter`. 원본: [camera_contract_adapter.py](../cleany_mujoco_sim/camera_contract_adapter.py), [camera_contract.py](../cleany_mujoco_sim/camera_contract.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/cleany/internal/mujoco/left_wrist_camera/image_raw` | `sensor_msgs/msg/Image` | Sensor |\n| 토픽 구독 | `/cleany/internal/mujoco/left_wrist_camera/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor |\n| 토픽 발행 | `/left_wrist_camera/image_raw` | `sensor_msgs/msg/Image` | Sensor; 입력 동기화와 계약 검사 통과 시 |\n| 토픽 발행 | `/left_wrist_camera/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor |\n\n입출력 이름은 `manifest_path`의 camera contract로 결정합니다. 위 표는 기본 contract입니다. Vendor topic의 remap과 ros2_control backend는 [launch](../launch/study_cafe_backend.launch.py)를 따릅니다.\n\n## simulation_placement_verifier\n\n실행 파일: `placement_verifier`. 원본: [placement_verifier.py](../cleany_mujoco_sim/placement_verifier.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS |\n|---|---|---|---|\n| 토픽 구독 | `/simulation/sorting_ground_truth` | `visualization_msgs/msg/MarkerArray` | R10 |\n| 서비스 제공 | `/sorting/verify_placement` | `cleany_interfaces/srv/VerifyPlacement` | Service 기본값 |\n\n시뮬레이션 전용 결과 판정입니다. 물체 정답 pose를 조작 코드에 반환하지 않습니다. 실물에는 독립 센서 기반 제공자가 필요합니다.\n"},"ros2_ws/src/cleany_mujoco_sim/docs/scenes.md":{"title":"MuJoCo 장면과 모델 설정","body":"# MuJoCo 장면과 모델 설정\n\n기존 MuJoCo 로봇은 `jetson_20261009` 모델입니다. 실물 공통 CAD와의 구분은 [모델 계약](../../cleany_description/docs/model.md)을 따릅니다.\n\n스터디카페 관찰과 고정 베이스 수거 장면을 제공합니다. 로봇 형상은 `cleany_description`, 물리 제어와 촬영은 선택한 backend가 소유합니다.\n\n## 상태와 책임\n\n| 목적 | 장면 / 진입점 | 실행 범위 |\n|---|---|---|\n| 공간과 로봇 배치 보기 | `study_cafe.xml.in` / `ros2 launch cleany_mujoco_sim mujoco_study_cafe.launch.py` | custom bridge 관찰 장면 |\n| 후면 수거함 보기 | `robot_top_bins_preview.launch.py` | GUI만 실행; 인식·수거 안 함 |\n| 인식과 계획 | `ros2 launch cleany_skill_executor study_cafe_nearest_grasp_demo.launch.py` | RGB-D와 MoveIt plan-only |\n| 연속 수거 | `study_cafe_grasp_execution.xml.in` / `ros2 launch cleany_skill_executor study_cafe_sorting.launch.py` | chassis-world weld, 팔·그리퍼 제어 |\n| 단일 물체 Action | [BT 서버](../../cleany_manipulation_bt/README.md) | 별도 Action 경로 |\n\n관찰 bridge와 ros2_control backend는 동시에 실행하지 않습니다. 기본 방·책상·파티션은 Gazebo의 `study_cafe_layout.yaml`과 일치하는지 검사합니다.\n\n```mermaid\nflowchart LR\n  Layout[\"layout + bins + lighting YAML\"] --> Scene[\"임시 materialized scene\"]\n  Robot[\"canonical MJCF / CAD mesh\"] --> Scene\n  Scene --> Physics[\"MuJoCo / ros2_control\"]\n  Physics --> RGBD[\"렌더링 RGB-D + 촬영 시각\"]\n  RGBD --> Perception[\"인식 / 계획 입력\"]\n  Physics --> Observer[\"잠금된 평가 snapshot\"]\n  Observer --> Verifier[\"안착 verifier / 접촉 진단\"]\n  Verifier --> Result[\"평가 결과만 반환\"]\n```\n\n물체 정답 pose와 평가 AABB는 인식·파지·경로 입력으로 쓰지 않습니다. 물체 순간이동, gripper weld, 방출 시 충돌 비활성화는 사용하지 않습니다.\n\n## 실행과 테스트\n\n저장소 루트에서 `make build` 후 [공통 ROS 환경](../../../../docs/implementation/running.md#공통-준비)을 적용합니다. Vendor renderer는 headless에서도 GLFW 연결이 필요하므로 유효한 `DISPLAY`를 준비합니다.\n\n```bash\n# 아래 실행 중 하나를 선택\nros2 launch cleany_mujoco_sim mujoco_study_cafe.launch.py\n# 수거함 배치만 확인\nros2 launch cleany_mujoco_sim robot_top_bins_preview.launch.py\n# 자동 수거는 별도 실행\nros2 launch cleany_skill_executor study_cafe_sorting.launch.py\n```\n\n| 확인 | 명령 / 결과 |\n|---|---|\n| scene loader 검사 | `make test-mujoco` |\n| 장면과 bridge 전체 단위 검사 | 빌드 overlay 적용 후 `python3 -m pytest ros2_ws/src/cleany_mujoco_sim/test` |\n| 형상·settle·카메라 시야 | `test_study_cafe_scene.py`, `test_tabletop_shapes.py`, `python3 -m pytest ros2_ws/src/cleany_skill_executor/test` |\n| 전체 조작 결과 | [수거 실행과 상태 읽기](../../cleany_skill_executor/docs/study-cafe-sorting-usage.md) |\n\n단위 검사와 장면 컴파일은 물리 수거 성공률을 뜻하지 않습니다. 주행 controller 회귀는 회전된 스터디카페 배치 대신 원점의 장애물 없는 평면 fixture를 사용합니다.\n\n## 시뮬레이션 기본 설정\n\n| 설정 | 현재값 / 의미 |\n|---|---|\n| 방 | 12.26 × 10.94 m; 벽 4, 책상 48, 파티션 24, 모니터 48; 의자는 생성하지 않음 |\n| 기준 자리 | 43번 의자 기준 책상 방향; `robot_center_rearward_offset_m=0.32` |\n| 로봇 중심 | `(-3.13, -4.16, 0.38)` m |\n| 물체 | 로봇 왼쪽 레고/마우스, 오른쪽 컵/휴지; 현재 yaw에서 desk X 음수는 로봇 왼쪽 |\n| head 영상 | 640×480, vertical FOV 42°, 초기 tilt 1.00 rad에서 네 물체가 시야 안에 들어오는 배치 |\n| 초기 joint 유지 | actuator 이름이 아닌 연결 joint 이름으로 keyframe 목표 설정 |\n| 기둥 충돌 | `robot_top_bins.yaml`의 `simulation_ignore_mast_collision: true` 기본 |\n\n기둥 옵션은 MuJoCo의 `top_base_link` 접촉과 MoveIt의 기둥–로봇 링크 충돌을 제외합니다. 외형, 팔·책상·함·물체 충돌은 유지합니다. `false`로 복원할 수 있으며 이 편의 설정의 경로가 실물 기둥을 피한다고 해석하지 않습니다.\n\n## 로봇 후면 수거함 배치 미리보기\n\n\u003cfigure class=\"contract-figure\" data-visual-id=\"bins\">\n\u003cimg src=\"assets/bins.png\" alt=\"좌우 수거함과 내부 개구부는 어디인가?\" loading=\"lazy\">\n\u003cfigcaption>현재 robot_top_bins.yaml의 평면 배치입니다. 회색은 트레이, 색 테두리는 벽이며 내부 개구부는 각각 164×154 mm입니다. base_link 기준의 시뮬레이션 개념으로 실물 장착성과 수거 성공을 검증한 도면이 아닙니다. \u003ca href=\"../../../../docs/assets/visuals/generated.json\">입력과 출처\u003c/a>\u003c/figcaption>\n\u003c/figure>\n\n`config/robot_top_bins.yaml`은 수거함과 내부 받침판의 알려진 형상을 공유합니다. 파일명은 top이지만 현재 배치는 후면입니다.\n\n| base_link 기준 | 분실물함 `lost_items_left` | 쓰레기함 `trash_right` |\n|---|---|---|\n| 중심 X / Y | −0.075 / +0.105 m | −0.075 / −0.105 m |\n| 바닥 / 상단 Z | 0.22 / 0.34 m | 0.22 / 0.34 m |\n| 외형 / 벽 두께 | 180×170×120 mm / 8 mm | 동일 |\n| 시각 테두리 | 청록 | 주황 |\n\n`internal_tray`는 210×460×12 mm입니다. 함과 받침판은 chassis에 부착되고 동일한 충돌 형상을 MoveIt에 등록합니다. 함은 바닥과 네 벽으로 열린 구조이며 `rim_rgba`는 질량·충돌 없는 시각 테두리입니다. 탈착부 강도, 배선 여유, 실제 하중 및 이동 베이스 운용은 검증 범위가 아닙니다.\n\n## 물체 형상과 접촉\n\n| 물체 / body ID | 현재 크기 | 물리 모델 |\n|---|---|---|\n| 종이컵 / `study_cafe_cup` | 윗지름 61.2, 밑지름 39.6, 높이 68.4, 벽 0.504 mm | 열린 원뿔대 벽 32개 + 바닥, 8 g |\n| 레고 / `study_cafe_lego` | 몸체 63.6×31.6×21.12, 돌기 포함 높이 25.08 mm | box + 돌기 8개, 2.3 g |\n| 휴지 / `study_cafe_tissue` | 60×50×45 mm | 삼각형 표면과 convex hull, 1 g |\n| 마우스 / `study_cafe_mouse` | 110×65×35 mm | CC0 mesh/texture와 convex hull, 120 g 가정 |\n\n| 모델 가정 | 한계 |\n|---|---|\n| 모든 물체 | Free joint 강체; 컵 / 휴지 변형 없음 |\n| 레고 | 밑면 튜브 / 로고 생략, 확대 진단 모델; 돌기 간격 / 지름 / 높이 16 / 9.6 / 3.6 mm |\n| 실제 크기 레고 | 최소 후보 폭 50 mm보다 작아 제외될 수 있음 |\n| 질량 / 물성 | 실측값 아님 |\n\n형상은 `tabletop_shapes.py`, 위치·질량·색상은 `config/study_cafe_layout.yaml`에서 관리합니다. 마우스 위치는 책상 중심 기준 `[-0.14, -0.095]` m입니다.\n\n| 접촉 설정 | 적용 / 한계 |\n|---|---|\n| 컵–jaw | 복합 형상 330 pair, friction `6 6 0.2 0.1 0.1` |\n| 레고–jaw | 90 pair, friction `1.5 1.5 .001 .0001 .0001`; 파지/방출 중 전환하지 않음 |\n| 얇은 컵 벽 강성 | `solref=\"0.002 1\"`, `solimp=\"0.99 0.9999 0.0001\"`; 종이 변형 모델 아님 |\n| 휴지/마우스–jaw | 각 10 pair에 같은 강성, friction `3 3 .2 .1 .1` |\n| 컵 바닥 clearance | `geometry.collision_bottom_clearance_m=0.00025`; 허용 0–0.000504 m |\n\n| Cup clearance | 영향 |\n|---|---|\n| 양수 | 벽 아래 꼭짓점을 경사 방향으로 올려 바닥 원판이 하중 지지 |\n| 0 | 원래 형상 |\n| 유지 | 시각 mesh, 열린 내부, 상부 파지면, 질량, 마찰 |\n\n마찰과 solver는 시뮬레이션 튜닝값입니다. 실제 재료 특성을 보장하지 않으며 마우스 충돌은 볼록 외피로 버튼의 오목한 부분을 분해하지 않습니다.\n\n### 조명과 자산 출처\n\n| `config/study_cafe_lighting.yaml` | 값 |\n|---|---|\n| 그림자 spotlight | 인접 책상 3열×2행, 중심 `(-4.33, -3.17, 3.30)` m, 수직 아래 |\n| cutoff / exponent | 40° / 0; 책상 높이 반경 약 2.16 m |\n| shadow map | 4096, 그림자 광원 1개 |\n| camera headlight | ambient 0.12 / diffuse 0.08 |\n| directional 보조광 | shadow 꺼짐; 전역 half extent 12 m |\n\n조명은 materialized copy의 GUI와 RGB-D에 공통 적용합니다. 실측 조도나 간접광 모델이 아니며 그림자 광원은 렌더 비용을 추가합니다. Camera intrinsics, 물체 물리, confidence와 안전 기준은 바꾸지 않습니다.\n\n| 자산 | 출처 / 관리 |\n|---|---|\n| 마우스 | [CreativeTrio Computer Mouse](https://poly.pizza/m/V2Ebx3pvo4), CC0 |\n| Hash / license | config/study_cafe_assets.yaml의 원본 / 변환 SHA256 |\n| 변환 | tools/convert_computer_mouse.py |\n| 과거 Mug / Smartphone | Manifest에 출처 보존, 현재 장면에는 미로딩 |\n| Robot CAD | cleany_description 소유; Gazebo plugin / sensor 복사 안 함 |\n\n## 분리 수거 fixture\n\n`study_cafe_backend.launch.py sorting_bins_config:=\u003cpath>`는 chassis 기준 함을 추가하고 `ObservedMujocoSystem` wrapper를 선택합니다. 빈 값은 함 없이 기존 장면을 씁니다. Wrapper는 잠금된 `get_data` 복사로 평가하며 vendor 배열을 동시에 직접 읽지 않습니다.\n\n`placement_verifier`는 `/simulation/sorting_ground_truth`에서 release 이후의 새 AABB를 읽고 `/sorting/verify_placement`로 결과만 반환합니다. Oracle은 인식과 계획에 사용하지 않습니다. [두 컵 검증](#두-컵과-개체별-배치-확인)은 개체 등록까지 포함합니다.\n\n## 카메라와 viewer\n\n| 항목 | 설정 / 계약 |\n|---|---|\n| `scheduled_cameras` | backend 직접 실행 false, 통합 인식/수거 true |\n| `sim_viewer:=efficient` | 960×720 snapshot GUI 최대 20 Hz; 센서 640×480과 그림자는 유지 |\n| `sim_viewer:=native` | 전체 MuJoCo UI |\n| 손목 optical pose | 최신 CAD의 좌우별 렌즈 앞면/CV축; nominal, 실물 hand-eye 별도 |\n| 손목 영상 | 640×480, vertical FOV 93° |\n| `sorting_contact_diagnostics` | 기본 false, 접촉 부위/힘 출력 전용 |\n\n[Observer GUI와 촬영](../../cleany_mujoco_observer/README.md#gui-렌더링), [수거 카메라 전환](../../cleany_skill_executor/docs/study-cafe-sorting-configuration.md)을 따릅니다. 통합 launch의 초기 양팔 roll은 +1.58 rad이며 직접 backend의 초기값과 구분합니다.\n\n## 되돌릴 수 있는 고정 책상 최적화\n\n`sim_performance_profile`은 임시 materialized scene에만 적용합니다. 기본값\n`baseline`은 기존 설정을 그대로 유지합니다. 소스 MJCF, mesh, layout은 수정하지 않습니다.\n\n| 프로필 | 배경 충돌 | 그림자 맵 |\n| --- | --- | --- |\n| `baseline` | 기존 그대로 | 4096 |\n| `tabletop_collision` | 먼 정적 가구만 비활성화 | 4096 |\n| `tabletop_fast` | 먼 정적 가구만 비활성화 | 2048 |\n\n| 최적화 대상 | 정책 |\n|---|---|\n| 제외 후보 | tabletop_performance.yaml 반경 2 m 밖에 형상 전체가 놓인 정적 책상 / 모니터 / 파티션 / 벽 |\n| 경계 판정 | 보수적 경계구; 가까운 가구와 큰 벽은 남을 수 있음 |\n| 유지 형상 | 바닥 / 로봇 / 수거함 / 물체 / 명시 contact pair |\n| 유지 설정 | 질량 / 마찰 / 관절 / timestep / solver / 카메라 해상도·FOV / 추적 FPS / MoveIt / OctoMap |\n| tabletop_fast | GUI와 센서 그림자 정밀도 저하 가능, 인식 회귀 필요 |\n\n이 프로필은 chassis-world weld가 있는 `study_cafe_grasp_execution` 장면에만\n허용합니다. 이동 베이스·내비게이션·실제 하드웨어에는 적용하지 않습니다.\n시뮬레이션 시간 배속이나 로봇 이동 속도 상향 기능이 아닙니다.\n\n`tabletop_fast`는 실험용이며 기본은 `baseline`입니다. 전체 수거 시간 단축이나 동일한 파지 성공률은 검증되지 않았습니다. 적용 전후 인식과 접촉 결과를 별도 비교합니다.\n\n```bash\n# 적용 (기존 GEMINI_API_KEY / DISPLAY 등 실행 환경 유지)\nros2 launch cleany_skill_executor study_cafe_sorting.launch.py sim_performance_profile:=tabletop_fast headless:=true use_rviz:=false use_image_view:=false\n# 원복: 실행을 종료한 뒤 baseline으로 재시작 (파일 복원 불필요)\nros2 launch cleany_skill_executor study_cafe_sorting.launch.py sim_performance_profile:=baseline headless:=true use_rviz:=false use_image_view:=false\n# 그림자 품질을 유지하며 배경 충돌만 줄이기\nros2 launch cleany_skill_executor study_cafe_sorting.launch.py sim_performance_profile:=tabletop_collision\n# 별도 정지 장면 성능 비교: 다른 시뮬레이터를 종료한 뒤 실행\npython3 ros2_ws/src/cleany_mujoco_sim/tools/benchmark_tabletop.py --output /tmp/tabletop_benchmark.json\n```\n\n벤치마크는 현재 launch 초기자세에서 세 프로필을 교차 순서로 반복합니다.\n물리 step과 640×480 카메라별 RGB 렌더+readback을 따로 측정하며,\nMuJoCo Python 버전도 기록합니다. ROS backend/vendor 버전, depth readback,\n인식 모델, GUI, 실제 파지 접촉 부하를 포함한 전체 수거 시간과는 다릅니다.\n일괄 속도 향상률로 해석하지 않습니다.\n\n## 실행 성능 측정\n\n| Runtime 측정 | 내용 |\n|---|---|\n| 지표 | Clock 진행률, RGB-D 수신 빈도, process tree CPU |\n| 출력 | Warmup 뒤 JSON + launch log; 기본 /tmp/cleany-runtime.json과 .log |\n| 종료 | 완료 / 실패 / 중단 시 도구가 시작한 process group과 추적 자식만 종료 |\n| 준비 | psutil, probe에도 동일 Fast DDS 프로필 적용해 큰 메시지 SHM 손실 방지 |\n| 해석 | CPU는 사용 코어 수 기준; 전체 수거 성공은 stage artifact로 별도 확인 |\n\n```bash\nDISPLAY=:0 python3 ros2_ws/src/cleany_mujoco_sim/tools/benchmark_runtime.py \\\n  --duration 35 --warmup 5 --output /tmp/runtime-headless.json -- \\\n  ros2 launch cleany_skill_executor study_cafe_nearest_grasp_demo.launch.py \\\n  headless:=true use_rviz:=false use_image_view:=false\nDISPLAY=:0 python3 ros2_ws/src/cleany_mujoco_sim/tools/benchmark_runtime.py \\\n  --duration 35 --warmup 5 --output /tmp/runtime-gui.json -- \\\n  ros2 launch cleany_skill_executor study_cafe_nearest_grasp_demo.launch.py \\\n  headless:=false use_rviz:=false use_image_view:=false\n```\n\n`ros2_ws/src/cleany_mujoco_sim/tools/benchmark_runtime.py --output \u003cfile> -- ros2 launch ...`로 다른 launch도 측정합니다.\n\n## ROS contract\n\n| 역할 | 실행 / 계약 |\n|---|---|\n| 제어 주기 | cleany_mujoco_observer/ros2_control_node, 설치 MuJoCo hardware / physics |\n| 상태 / 제어 | robot_state_publisher, joint-state broadcaster, 양팔 / gripper trajectory controller |\n| Controller 설정 | config/study_cafe_ros2_controllers.yaml |\n| 초기 joint | 임시 장면의 handeye_ros2_control_home keyframe; vendor 호환 내부 ID |\n| 카메라 | Scheduled observer 또는 선택 vendor renderer; head RGB-D와 nominal wrist TF |\n| 선택 adapter | wrist_camera.yaml의 왼손목 intrinsics와 topic만 사용, 이전 보정판 장면에 의존 안 함 |\n| 시간 / 보정 | 원본 capture stamp 유지; 실물 카메라 보정값을 의미하지 않음 |\n\n## 베이스 구동 모델\n\n각 휠은 독립적인 `PG42-4266-1270NE` output-shaft DC motor 모델을 사용합니다.\nactuator 제어 입력은 `rear_left_drive`, `rear_right_drive`, `front_left_drive`,\n`front_right_drive`의 모터 단자 전압입니다. `base_link +X`가 전방이며, 양의 yaw는\n`+Z` 기준 반시계 방향입니다.\n\n- 정격 공급 전압: `12 V`\n- 기어박스: `61:1`; 제조사 출력 토크에는 `72%` 효율이 반영되어 있습니다.\n- 제조사 정격 출력: `103 rpm`에서 `2.94 N.m`\n- 계산한 무부하 출력: `7000 / 61 rpm` (`12.017 rad/s`)\n- 10% 마진을 적용한 시뮬레이션 운용 한계: `10.8 V`, `2.646 N.m`\n- 디레이팅한 정격점: `92.7 rpm` (`9.708 rad/s`)\n- 디레이팅한 무부하 평형점: `103.28 rpm` (`10.815 rad/s`)\n\nMJCF actuator는 기어박스 출력축에서 직접 모델링하므로(`gear=1`) 감속비와 효율을\n다시 적용하지 않습니다. 매 physics step마다 실제 joint 속도를 읽고, feed-forward와\nanti-windup을 포함한 휠별 PID controller로 `-10.8~10.8 V` 전압을 계산합니다.\nPID gain은 MuJoCo DC motor step response를 기준으로 한 시뮬레이션 값이며 실제\nESP32 controller에 그대로 사용하지 않습니다.\n\n## 팔 서보 모델\n\n양팔은 Feetech 12 V 시리얼 서보를 사용합니다.\n\n- left/right shoulder pitch와 elbow pitch: `STS3250`\n- shoulder rotation, wrist pitch/roll, jaw, head pan/tilt: `STS3215`\n\n모델의 출력 한계에는 제조사 사양 대비 10% 운용 마진을 적용합니다. 위치 actuator와\njoint force 한계에는 최대 정지 토크의 90%를 적용합니다. 전류, 발열 및 2초 과부하\n차단 동작은 아직 모델링하지 않았습니다.\n\n## 실행 인자\n\n| 관찰 bridge | 기본 / 동작 |\n|---|---|\n| mujoco_study_cafe.launch.py | headless=false |\n| viewer_rate_hz | 20.0, 허용 1–60 Hz |\n| viewer_shadows | false |\n| GUI 변경 | viewer_rate_hz:=60.0 viewer_shadows:=true |\n| 주기 영향 | Viewer sync만 wall time 제한, physics / ROS 발행 유지 |\n| mujoco_sim.launch.py | scene_path=scenes/study_cafe.xml.in; 주행 bridge parameter 유지 |\n\n| backend 인자 | 기본 / 역할 |\n|---|---|\n| `scene_path` | `scenes/study_cafe_grasp_execution.xml.in` |\n| `controller_config` | `config/study_cafe_ros2_controllers.yaml` |\n| `camera_config` | `config/wrist_camera.yaml` |\n| `headless`, `sim_viewer`, `sim_speed_factor`, `sim_xmodifiers` | viewer, 속도, XIM |\n| `sorting_bins_config`, `scheduled_cameras`, `sorting_contact_diagnostics` | 수거함, 카메라 스케줄, 출력 진단 |\n| `camera_name`, `camera_frame_name`, `color_image_topic`, `camera_info_topic`, `depth_image_topic` | renderer 연결 |\n| `enable_camera_contract_adapter` | false; 통합 launch는 head topic 직접 연결 |\n| `enable_gripper_controllers` | 기본 false; 최신 CAD의 링크형 그리퍼 구동은 거부 |\n| `*_initial`, `head_tilt_initial` | 초기 자세; 탁상 preview의 head tilt는 최신 헤드 기준 0.8 rad |\n\n수거 전체의 초기 자세와 센서 연결은 `cleany_skill_executor`의\n`study_cafe_sorting.launch.py` 및 `study_cafe_nearest_grasp_demo.launch.py`를 따릅니다.\n\n## Backend 터미널 로그\n\n| 로그 옵션 | 출력 |\n|---|---|\n| backend_log_level:=warn 기본 | 관절 / 링크 / renderer 상세 억제, 경고·오류 유지 |\n| backend_log_level:=info | 초기화 상세 복원 |\n| log_level:=info | Spawner / camera adapter; debug 선택 가능 |\n| 상위 launch | 센서 / 수거 / BT 모두 두 옵션 전달; 준비 완료는 기본 출력 |\n\n## 시뮬레이션 확장 API\n\n```mermaid\nflowchart LR\n    Tick[\"ROS timer tick\"] --> Substeps[\"모든 physics substep\"]\n    Substeps --> Observer[\"after_step(context, stamp) / 동기 callback\"]\n    Observer --> Publish[\"ROS 상태 토픽 발행\"]\n```\n\n| API | 계약 |\n|---|---|\n| MujocoSimNode.simulation_context | MujocoSimulationContext의 model / 최신 data native handle; renderer 등 조회용 |\n| add_step_observer(observer) | StepObserver 등록; tick마다 substep 완료 뒤 한 번 호출 |\n| Callback | 짧게 유지, 예외 숨기지 않음 |\n| 변경 경계 | Adapter는 물리 상태를 바꾸지 않는 read-only 계약 |\n\n## 공통 RGB-D 파이프라인 연결\n\n| RGB-D 연결 옵션 | 처리 |\n|---|---|\n| color_image_topic / camera_info_topic / depth_image_topic | 명시하면 선택 MJCF camera를 해당 ROS topic으로 직접 remap |\n| 빈 값 | wrist_camera.yaml internal topic 사용 |\n| Custom topic | enable_camera_contract_adapter:=false 필요 |\n| 경계 | 영상 전달만 변경, geometry / 정답 pose 주입 없음; 실물 head TF 보정 정확도 보장 아님 |\n\n레포 루트의 `ros2 launch cleany_skill_executor study_cafe_nearest_grasp_demo.launch.py`은 학습 perception과 sensor-only\nMoveIt 지도를 포함하는 plan-only GUI 실행입니다. 장면만 띄우는\n`ros2 launch cleany_mujoco_sim mujoco_study_cafe.launch.py`는 장면 관찰용입니다.\n\n## 두 컵과 개체별 배치 확인\n\n`config/study_cafe_two_cups.yaml`은 기존 물체와 별도의 자유 물체 `cup_b`를 둡니다.\n`study_cafe_backend.launch.py`의 `study_cafe_layout_config`로 선택하며 기존 기본 배치는\n유지합니다. materialize API도 같은 선택적 Path 인자를 받습니다. 기존 cup/lego/tissue/mouse를\n유지하면서 고유 이름의 추가 procedural 물체를 허용합니다. asset·mesh를 재생성하지 않습니다.\n\n```mermaid\nflowchart LR\n    Observation[\"관측 OBB / 종류 / execution ID\"] --> Register[\"register_placement_target / 유일한 body 내부 고정\"]\n    Register --> ID[\"불투명 verification ID\"]\n    ID --> Fresh[\"release 뒤 새 샘플\"]\n    Fresh --> Bounds[\"등록 개체의 수거함 내부 / 안정 검사\"]\n```\n\n| 개체 구분 | 계약 |\n|---|---|\n| 같은 종류 여러 body | Label/body 배열에서 허용, 등록 경로 필요 |\n| Label-only | 종류당 body 하나일 때만 허용 |\n| 다른 컵이 함 안에 있음 | 등록된 컵의 성공 근거로 사용 안 함 |\n| 등록 응답 | Simulator body 정답 비공개 |\n\n| verifier 설정 | 시뮬레이션 기본값 |\n|---|---:|\n| 관측 OBB와 body 대응 거리 | 5 cm |\n| 후보 간 최소 차이 | 1 cm |\n| 크기 오차 | 8 cm |\n| 등록 TTL / 최대 수 | 600초 / 128건 |\n| 관측 최대 나이 | 120초 |\n\n`placement_verifier.yaml`과 `placement_verifier_two_cups.yaml`의 초기값이며 실물 기준이 아닙니다. 넓은 크기 허용은 위치 유일성 검사를 대체하지 않습니다. 재시작/시각 역행으로 등록을 복구하지 않고 잘못된 ID에 fallback하지 않습니다.\n\n분실물은 mouse / computer mouse / wireless mouse / lego brick 등록과 lost_items_left 목적지를 지원합니다. 다른 개체나 잘못된 수거함은 성공 근거가 아닙니다. 실제 vertex 극값을 쓰는 [Observer AABB 계약](../../cleany_mujoco_observer/README.md#독립-ground-truth-관측)을 따릅니다.\n\n## 범위\n\n| 제공 | 별도 검증 / 미구현 |\n|---|---|\n| CAD MJCF, 휠 PID와 cmd_vel 제한/timeout, ROS 센서와 TF | 실제 encoder noise, 전류, 발열, 과부하 차단 |\n| 양팔 FollowJointTrajectory, 12개 arm/gripper 상태 | Mission 운영 인터페이스 연동 |\n| 카메라 스케줄과 평가용 observer | 하드웨어 controller 현실성, 실제 물리 수거 성공 |\n\n모델 기준은 [Description](../../cleany_description/docs/model.md), 제품 전제는 [Robot Platform KB](../../../../docs/cleany-docs/20_TECHNICAL/04%20-%20Robot%20Platform%20XLeRobot.md)를 따릅니다.\n\n`study_cafe_backend.launch.py`의 `model_profile`은 URDF와 MJCF에 같은 형상을 선택합니다.\n지원 프로필은 `jetson_20261009`이며 기존 집기와 분리수거 데모도 같은 모델과\n손목 optical TF를 사용합니다. 실물 공통 CAD의 관절 영점과 형상을 혼합하지 않습니다.\n`config/model_profiles.json`이 각 MJCF와 장면의 그리퍼 접촉 형상을 함께 선택합니다.\n"},"ros2_ws/src/cleany_navigation/README.md":{"title":"Cleany Navigation","body":"# Cleany Navigation\n\n지도 생성과 저장, Nav2 주행, 위치 정합 및 장애물 감시를 구성합니다. 사용 순서는 작업 가이드, 노드와 설정의 세부 조건은 이 패키지의 참조 문서를 따릅니다.\n\n| 하려는 일 | 시작할 곳 |\n|---|---|\n| 휴대폰에서 목적지 지정 | [화면으로 따라 하는 주행 가이드](../../../docs/implementation/how-to/phone-navigation.md) |\n| 하드웨어로 지도 생성·저장 | [매핑 실행](../cleany_bringup/docs/hardware-mapping.md), [매핑 규약](docs/mapping.md) |\n| 경로·속도·주행 방식 조정 | [계획과 제어](docs/planning.md) |\n| 노드별 입력·출력 연결 | [인터페이스](docs/interfaces.md) |\n| 감속·정지 조건 확인 | [안전 경로](docs/safety.md) |\n\n## 휴대폰 주행의 연결\n\n```mermaid\nflowchart TD\n  UI[\"Phone UI\"] --> Bridge[\"NavigationBridge\"]\n  Bridge -->|\"목표\"| Nav[\"Nav2\"]\n  Nav -->|\"nav2/cmd_vel\"| Bridge\n  Bridge -->|\"motion/cmd_vel\"| Monitor[\"Collision Monitor\"]\n  Monitor -->|\"navigation/safe_cmd_vel\"| Final[\"phone_remote / 최종 출력\"]\n  Final -->|\"cmd_vel\"| Base[\"Base driver → MCU\"]\n  Supervisor[\"Supervisor\"] \u003c-->|\"허가 · 정지 요청\"| Bridge\n```\n\n그림은 LiDAR 주행 구성의 논리적 역할을 표시합니다. NavigationBridge와 최종 출력 처리는 `phone_remote` 프로세스 안에 있습니다. 센서 드라이버와 물리 보호 회로 전체를 나타내는 그림은 아닙니다.\n\n| 흐름 | 실제 연결 |\n|---|---|\n| 목표 | Phone UI → NavigationBridge → `navigate_to_pose` |\n| 경로 미리보기 | NavigationBridge → `compute_path_to_pose`. 구동 허가·속도 발행 없음 |\n| 자동 속도 | `/nav2/cmd_vel` → NavigationBridge → `/motion/cmd_vel` → Collision Monitor → `/navigation/safe_cmd_vel` → `phone_remote` → `/cmd_vel` |\n| 구동 | Base driver → MCU. MCU 응답과 휠 피드백으로 정지 확인 |\n| 허가 | Supervisor의 NAVIGATION lease. Fault·입력 만료 시 중단 |\n| 위치 | `localization_guard`가 scan/map 정합과 제한 속도 제공 |\n\n수동 조종은 자동 목표를 취소하고 정지를 확인한 뒤 기존 operator 경로로 전환합니다. 전체 시스템의 연결은 [연동 구조](../../../docs/implementation/integration.md)를 참고하세요.\n\n## 실행 프로필 고르기\n\n| 프로필 | 선택 | 주행 방식 |\n|---|---|---|\n| Omni 기본 튜닝 | 실행 도구 기본값 `--motion-profile omni` | 순정 Smac Lattice + Omni MPPI, 횡이동 허용 |\n| Longitudinal | `--motion-profile longitudinal` | 직진 우선 계획 + DiffDrive MPPI, 횡이동 차단 |\n| 일반 navigation | AMCL/Nav2 launch | Omni 저속 튜닝. [Planning](docs/planning.md) 참조 |\n\n`lidar_navigation.launch.py`, `hardware_mapping.launch.py`, `tools/ros2/run-navigation`의 기본값은 모두 `omni`입니다. Launch에서는 `motion_profile:=longitudinal`, 실행 도구에서는 `--motion-profile longitudinal`로 전후진 전용 구성을 선택합니다. 이 선택은 수동 조종의 횡이동 허용에도 적용됩니다.\n\n## 설정을 어디서 바꾸나요?\n\n| 조정 대상 | 파일 / 문서 |\n|---|---|\n| Omni 공통 모델과 planner | [nav2_omni.yaml](config/nav2_omni.yaml) |\n| Omni 저속 튜닝 | [nav2_omni_low_speed.yaml](config/nav2_omni_low_speed.yaml) |\n| Omni 기본 튜닝 | [nav2_omni_standard.yaml](config/nav2_omni_standard.yaml), [주행 연속성](docs/planning.md#omni-주행-연속성) |\n| 전후진 전용 프로필 | [nav2_longitudinal.yaml](config/nav2_longitudinal.yaml) |\n| 감속·정지 영역 | [lidar_safety.yaml](config/lidar_safety.yaml), [Collision Monitor](docs/interfaces.md#cleany_collision_monitor) |\n| 위치 정합·복구 | [localization_guard.yaml](config/localization_guard.yaml), [정합 정책](docs/localization.md) |\n| 슬립 관측·재시도 | [slip_recovery.yaml](config/slip_recovery.yaml), [슬립 노드](docs/interfaces.md#slip_monitor-traction_brake와-sliprecovery-bt) |\n| Robot footprint | [lidar_robot.yaml](config/lidar_robot.yaml) |\n| 선택적 D435 입력 | [depth_local.yaml](config/depth_local.yaml), [실행 안내](../../../docs/implementation/how-to/sensors.md#실물-depth-local-costmap-연결) |\n\nLiDAR 안전 설정은 평면 장애물을 감시합니다. 카메라·팔 높이의 3D 충돌이나 실측 제동거리를 보장하지 않습니다. 위치 복구는 정지 후 제한된 후보를 검사하며, 이전 목표를 자동 재개하지 않습니다.\n\n## 이전 이름에서 전환하기\n\n| 이전 이름 | 현재 이름 |\n|---|---|\n| `phone_navigation.launch.py` | `lidar_navigation.launch.py` |\n| `tools/ros2/run-phone-navigation` | `tools/ros2/run-navigation` |\n| `phone_motion_profile` / `--phone-motion-profile` | `motion_profile` / `--motion-profile` |\n| `phone_collision_monitor` | `cleany_collision_monitor` |\n| `nav2_phone_omni.yaml` | `nav2_omni.yaml` + `nav2_omni_standard.yaml` |\n| `nav2_omni_motion.yaml` | `nav2_omni.yaml` + `nav2_omni_low_speed.yaml` |\n| `nav2_phone_longitudinal.yaml` | `nav2_longitudinal.yaml` |\n| `phone_lidar_{robot,safety,supervisor}.yaml` | `lidar_{robot,safety,supervisor}.yaml` |\n| `phone_depth_local.yaml` | `depth_local.yaml` |\n| `phone_localization.yaml` | `localization_guard.yaml` |\n| `phone_slip_recovery.yaml` | `slip_recovery.yaml` |\n\n이전 launch, 실행 도구, 실행 파일과 이동 방식 인자는 호환 진입점으로 유지합니다. `--phone-motion-profile` 호환 인자는 `hardware_runtime` CLI에서 제공합니다. 신구 인자에 서로 다른 값을 주면 시작 전에 오류로 처리합니다. YAML 경로를 직접 지정하는 명령은 새 경로로 바꾸세요. 이전 launch도 기본값은 `omni`이므로 전후진 전용 운용은 `longitudinal`을 명시합니다.\n\n`phone_remote`, 웹 조종기 설정과 포트는 그대로입니다. Supervisor의 상태 파일도 `~/.local/state/cleany/phone-nav2-supervisor.json`을 계속 사용해 기존 정지 상태를 보존합니다.\n\n## 변경 후 확인\n\n저장소 루트에서 변경 범위에 맞춰 실행합니다. 빌드 환경과 전체 검사 선택은 [검증 가이드](../../../docs/implementation/testing.md)를 따릅니다.\n\n| 변경 | 명령 |\n|---|---|\n| 매핑 수명주기·스캔 필터·하드웨어 프로필 | `make test-hardware-mapping-core` |\n| Navigation C++·노드·프로필 | `make test-navigation` |\n| Launch·설치 데이터·인터페이스 | `make build-hardware-mapping`, `make test-hardware-mapping` |\n\n합성 입력 검사는 실물 주행 시험을 대신하지 않습니다. 실물에서는 위치, 센서, 정지 응답과 공간 조건을 별도로 확인합니다.\n"},"ros2_ws/src/cleany_navigation/docs/interfaces.md":{"title":"cleany_navigation 노드 인터페이스","body":"# cleany_navigation 노드 인터페이스\n\n## localization_guard\n\n실행 파일은 `localization_guard`이며 LiDAR 주행 launch에서 실행합니다.\n지도와 scan의 정합을 관측하고, Supervisor가 요청한 정지 상태의 위치 복구를 수행합니다.\n\n| 방향 | 이름 | 타입 | 계약 |\n|---|---|---|---|\n| 구독 | `map` | nav_msgs/OccupancyGrid | R/T1; 지도 변경 시 이전 정합 기록 무효화 |\n| 구독 | `scan` | sensor_msgs/LaserScan | Sensor; scan 시각의 TF로 평가 |\n| 구독 | `amcl_pose` | geometry_msgs/PoseWithCovarianceStamped | Sensor; 신선한 map 좌표와 유한 공분산 확인 |\n| 구독 | `diagnostics` | diagnostic_msgs/DiagnosticArray | R10; base_driver의 disarmed와 피드백 나이 확인 |\n| 구독·발행 | `initialpose` | geometry_msgs/PoseWithCovarianceStamped | R10; 수동 입력은 진행 중인 자동 검색을 중단 |\n| 발행 | `system/component_health` | cleany_interfaces/ComponentHealth | R10, 5Hz; source=`localization_alignment`; 검증된 위치의 degraded는 제한된 주행을 위해 AVAILABLE 유지 |\n| 발행 | `localization/status` | std_msgs/String | R1, 5Hz; state/reason/phase, score, 재정합 사유, 속도 제한 비율, 지도 ID와 관측 시각 |\n| 발행 | `navigation/localization_speed_limit` | nav2_msgs/SpeedLimit | R10, 5Hz; percentage=true; 정상 100%, degraded 30%, 미확인·실패 0% |\n| Action 서버 | `localization/recover` | cleany_interfaces/RecoverComponent | 동시에 한 요청; 정지·신선도·후보·AMCL 결과 검증 |\n| 서비스 호출 | `request_nomotion_update` | std_srvs/Empty | 정지 중 위치 미확인 또는 복구 검증 시 실제 AMCL 관측 갱신 요청 |\n\nTF는 읽기만 합니다. wheel 명령과 속도를 발행하지 않습니다. 토픽 이름은 ROS remap으로\n바꿀 수 있습니다. 다른 `localization/recover` owner와 동시에 실행하지 않습니다.\n상태와 복구 조건은 [위치 정합과 복구](localization.md)를 따릅니다.\n\n## slip_monitor, traction_brake와 SlipRecovery BT\n\n| 소유자 | 방향 | 기본 이름 | 타입 | 의미 |\n|---|---|---|---|---|\n| `slip_monitor` | 구독 | `scan_raw`, `odom` | LaserScan, Odometry | 센서 header 시각의 독립 이동 비교, sensor-data QoS |\n| `slip_monitor` | 구독 | `nav2/cmd_vel`, `cmd_vel` | geometry_msgs/Twist | 분석용 요청/최종 명령, sensor-data QoS |\n| `slip_monitor` | 구독 | `map` | nav_msgs/OccupancyGrid | transient-local depth 1, 지도 geometry/cells 식별 해시 |\n| `slip_monitor` | 발행 | `navigation/slip` | std_msgs/String | 5Hz JSON, state, t0/t1, consecutive, reason, 이동 및 오차 |\n| BT `SlipRecovery` | 구독 | `navigation/slip`, `odom` | String, Odometry | 새로운 신뢰 가능한 비교와 fresh 정지 증거 |\n| BT `SlipRecovery` | 구독 | `motion/traction_cmd_vel` | geometry_msgs/Twist | fresh 0 출력 확인, 이후 0.5초 정지 유지 |\n| BT `SlipRecovery` | 발행 | `navigation/traction_brake` | std_msgs/Bool | tick마다 brake heartbeat, true는 감속 정지 |\n| BT `SlipRecovery` | 발행 | `navigation/traction_recovery` | std_msgs/String | JSON phase, reason, retry |\n| `traction_brake` | 구독 | `motion/cmd_vel`, `navigation/traction_brake` | Twist, Bool | 기존 자동 조종 명령과 BT 상태 |\n| `traction_brake` | 발행 | `motion/traction_cmd_vel` | geometry_msgs/Twist | 50Hz 충돌 감시 입력, stale heartbeat/명령은 0 |\n\n```mermaid\nflowchart LR\n    Inputs[\"scan_raw + odom\"] --> Observe[\"slip_monitor / 이동 비교\"]\n    Observe -->|navigation/slip| BT[\"SlipRecovery BT\"]\n    BT -->|brake heartbeat| Brake[\"traction_brake\"]\n    Intent[\"motion/cmd_vel\"] --> Brake\n    Brake -->|motion/traction_cmd_vel| Monitor[\"Collision Monitor\"]\n    BT --> Retry[\"종방향 retry subtree / Longitudinal planner\"]\n```\n\n| 상태 / 시각 | 의미 |\n|---|---|\n| state | unknown / clear / suspect / confirmed |\n| clear | 해당 비교에 검출 증거 없음; 정합 품질 탈락은 unknown |\n| t0 / t1 | Scan midpoint ROS 초; 같은 비교의 heartbeat는 연속 횟수 증가 안 함 |\n| phase | warming_up / normal / braking / longitudinal_retry / failed / succeeded / idle |\n| 감지 노드 | 명령과 TF 발행 안 함 |\n\n| 복구 구성 | 계약 |\n|---|---|\n| BT child | 일반 Nav2 subtree + 종방향 retry subtree |\n| 비교 수락 | Header age / 수신 freshness / retry 뒤 비교 시작 시각 확인 |\n| 목표 수명 | Retry latch 유지, 취소 시 두 child halt |\n| Retry Action / ID | `/traction_retry/compute_path_to_pose` / `Longitudinal` |\n| Retry lifecycle | 별도 `traction_retry` namespace, global costmap과 manager |\n| 입력 | `/map`, `/scan` |\n\n[슬립 복구 실행 설정](../../../../docs/implementation/how-to/phone-navigation.md#omni-주행의-슬립-복구)을 따릅니다. Endpoint의 QoS 약어와 자동 ROS 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 참고합니다.\n\n## cleany_collision_monitor\n\n실행 파일: `cleany_collision_monitor`. 실행 노드명: `collision_monitor`. 원본: [cleany_collision_monitor.cpp](../src/cleany_collision_monitor.cpp).\n\nNav2 Collision Monitor의 lifecycle, 센서 좌표 변환, polygon 판정과 정지를 사용합니다. 별도의 안전 출력 publisher를 추가하지 않습니다.\n\n| 제한 | 계산 / 적용 |\n|---|---|\n| Slowdown polygon | 병진 합성 속도와 회전의 절대 상한으로 축소 비율 계산 |\n| 두 절대 상한 모두 0 | 기존 휠 제한만 사용 |\n| 휠 상한 | 함께 검사; 작은 명령을 키우지 않음 |\n| Localization percentage | nominal_translation_m_s / nominal_rotation_rad_s 기준 절대 상한으로 변환; 작은 입력에 중복 비율 적용 안 함 |\n| 제한 하강 | localization_limit_ramp_per_s 적용 |\n| 0% / 입력 timeout / 신선한 제한 없음 | Ramp 없이 0 출력 |\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `motion/cmd_vel` | `geometry_msgs/msg/Twist` | R1; `cmd_vel_in_topic` |\n| 토픽 구독 | `scan` | `sensor_msgs/msg/LaserScan` | Sensor; `scan.topic` |\n| 토픽 발행 | `navigation/safe_cmd_vel` | `geometry_msgs/msg/Twist` | R1 lifecycle; `cmd_vel_out_topic` |\n| 토픽 발행 | `safety/stop_zone` | `geometry_msgs/msg/PolygonStamped` | R1 lifecycle; `StopZone.polygon_pub_topic` |\n| 토픽 발행 | `safety/slow_zone` | `geometry_msgs/msg/PolygonStamped` | R1 lifecycle; `SlowZone.polygon_pub_topic` |\n| 서비스 제공 | `collision_monitor/change_state`, `collision_monitor/get_state` | lifecycle_msgs 서비스 | Nav2 lifecycle manager가 소유 |\n\n| Geometry / 설정 | 값 / 동작 |\n|---|---|\n| lidar_safety.yaml | 바퀴 외곽 +16 cm 주황 영역, +5 cm 정지 영역 |\n| absolute_limit_polygon | 기본 SlowZone |\n| wheel_limit_rad_s | 기본 0.7 |\n| Wheel radius / wheelbase / separation | 0.0635 / 0.35 / 0.59 m |\n| SlowZone.slowdown_ratio | 고정비 대신 입력마다 계산한 상한 비율 사용 |\n| 설정 반영 | 속도 / geometry 변경 뒤 lifecycle 재구성 |\n\n## depth_clearance\n\n실행 파일: `depth_clearance`. 원본: [depth_clearance_node.py](../cleany_navigation/depth_clearance_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `camera/head/depth/image_raw` | `sensor_msgs/msg/Image` | B1; `input_topic` |\n| 토픽 구독 | `camera/head/depth/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor; `camera_info_topic` |\n| 토픽 발행 | `camera/head/depth/points` | `sensor_msgs/msg/PointCloud2` | Sensor; 유효 depth 처리 시, `output_topic` |\n| 토픽 발행 | `camera/head/depth/obstacle_points` | `sensor_msgs/msg/PointCloud2` | Sensor; `obstacle_topic` |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n```mermaid\nflowchart TD\n    Depth[\"D435 rectified depth + CameraInfo\"] --> Valid{\"capture TF / 나이 / 유효 depth\"}\n    Valid -->|무효| None[\"출력 안 함\"]\n    Valid -->|유효| Self[\"차체 ray self-mask\"]\n    Self --> Clear[\"nav_points / camera frame clearing\"]\n    Self --> Filter[\"거리 / 높이 / 고립점 / voxel 필터\"]\n    Filter --> Mark[\"nav_obstacle_points / base_link marking\"]\n    Mark --> CM[\"Monitor 필수 depth 신선도 검사\"]\n```\n\n| 실물 overlay | 설정 / 계약 |\n|---|---|\n| 입력 | depth_local.yaml: `/camera/d435/depth/image_rect_raw`, `/camera/d435/depth/camera_info` |\n| Clearing | `/perception/depth/nav_points`, 카메라 좌표; local VoxelLayer ray 원점 `sensor_frame=d435_depth_frame` |\n| Marking | `/perception/depth/nav_obstacle_points`, base_link; spatial_filter_file 적용 |\n| Self-mask | self_filter_boxes_file은 base-좌표계 고정 AABB JSON; self_filter_profile과 동시 지정 금지 |\n| 가려진 ray | Marking과 clearing 모두 제외 |\n| 수락 | max_image_age_s=0.5, min_valid_fraction=0.05; 촬영 시각 유지 |\n| 무효 depth | positive_infinity_is_free=false; 빈 공간으로 변환 안 함 |\n| 미재관측 장애물 | 카메라 방향 변경만으로 삭제 안 함 |\n\n| Monitor 입력 | 처리 |\n|---|---|\n| QoS / 영역 | Marking SensorData 입력을 기존 2D polygon에 적용 |\n| Required depth | required_depth_topic, required_depth_frame=base_link, required_depth_timeout_s=0.5 |\n| 최초 입력 전 / 단절 / capture 만료 | 속도 입력 0; 오래된 source를 무시하는 Humble 기본 timeout과 별도 검사 |\n| 유효 영상의 장애물 없는 빈 점군 | 정상 입력 |\n| LiDAR 전용 | 기본 required_depth_topic 빈 값으로 유지 |\n\n## depth_coverage\n\n실행 파일: `depth_coverage`. 원본: [depth_coverage_node.py](../cleany_navigation/depth_coverage_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정
