면 충돌 검사입니다. 평면 위 장애물은 계속 검사하며 지지면 무시나 정답 책상 주입으로 사용하지 않습니다. 상세 조건은 [sorting 실행 계약](../../cleany_skill_executor/docs/study-cafe-sorting-contract.md#지지면과-jaw-충돌)을 따릅니다.\n\n## 관측 충돌 형상\n\n| 항목 | 계약 |\n|---|---|\n| 발행 설정 | `publish_collision_geometry`: 노드 false, sorting true |\n| 토픽 / QoS | `/grasp/collision_geometry`, Reliable / Transient Local, depth 16 |\n| 형상 | OBB local XY의 관측 볼록 외곽 + 관측 Z와 OBB 바닥/상단을 포함하는 프리즘 |\n| 거부 | 512 vertices 초과 또는 퇴화; 임의 축소 안 함 |\n| 동일성 | 후보와 동일 snapshot / object / capture / 좌표계 / OBB pose를 별도 메시지로 전달 |\n| 한계 | 숨은 뒷면과 구멍을 복원한 mesh 아님; 컵 내부가 비었다고 가정하지 않음 |\n| 영향 범위 | 기존 후보 포맷 유지; 시뮬레이터 mesh / 질량 / 마찰은 변경하지 않음 |\n\n## 후보 이미지 확인\n\n\u003cfigure class=\"visual-slot\" data-visual-id=\"grasp-debug\">\n\u003cp>\u003cstrong>시각자료 자리 · 비워 둠\u003c/strong>\u003c/p>\n\u003cfigcaption>\u003cstrong>필요한 자료:\u003c/strong> 현재 /grasp/debug_image에서 같은 snapshot의 물체, 후보 축과 접촉 위치가 보이는 화면.\u003cbr>\u003cstrong>빈 이유:\u003c/strong> 기존 실물 파지 사진에는 predictor의 입력과 후보 대응 정보가 없습니다.\u003c/figcaption>\n\u003c/figure>\n\n```bash\nros2 run rqt_image_view rqt_image_view /grasp/debug_image\n```\n\n800 × 800 RGB **추정 지지면 top view**다. 요청에 원본 RGB와 intrinsics가 없으므로 카메라 영상 overlay가 아닙니다. Transient Local 토픽이라 요청 뒤 viewer를 열어도 마지막 결과를 받습니다.\n\n| 표시 | 의미 |\n|---|---|\n| 주황 | Target |\n| 회색 | Context |\n| 파란 선 | 후보 jaw |\n| 초록 | 최고 점수 후보 |\n| 숫자 뒤 값 | 후보 점수 |\n\n## 설정\n\n[anygrasp.yaml](../config/anygrasp.yaml)이 배포 설정을 관리합니다.\n\n| 설정 | 의미 |\n|---|---|\n| `predictor_type` | 기본 `geometric`, SDK 사용 시 `anygrasp` |\n| `debug_image_topic` | 후보 top-view 출력 |\n| `geometric.*` | Gripper 형상, 충돌 여유, RANSAC, outlier trim, yaw / tilt |\n| `checkpoint_path` / `license_path` | Jetson-local SDK 파일; 네 license 파일의 디렉터리명은 `license` |\n| `gripper_height_m` | SDK finger height |\n| `planning_frame` | 기본 `base_link` |\n| `maximum_gripper_width_m` | 실물 gripper 보정 뒤 확정할 값 |\n| `canonical_to_tcp_rotation` | Canonical → TCP, 3×3 row-major rotation |\n| `tcp_approach_axis` | TCP 접근 축, Cleany local −Y |\n\n| Canonical 축 | Cleany TCP 대응 |\n|---|---|\n| GraspNet +X approach | −Y approach |\n| GraspNet +Y closing | +X closing |\n\n## Jetson 첫 관문\n\nSDK와 license는 저장소에 포함하지 않습니다. 배포 절차와 고정 MAC은 [GPU runtime](../../../../containers/vision/README.md)을 따릅니다. 이 adapter 구현만으로 Jetson 호환성을 검증한 것으로 보지 않습니다.\n\n| 순서 | 배포 환경에서 확인할 것 |\n|---|---|\n| 1 | JetPack 6.2 / CUDA 12.6 호환 PyTorch와 수정 MinkowskiEngine |\n| 2 | 공식 example data의 import, checkpoint / license load, collision-enabled inference |\n| 3 | MuJoCo box/can RGB point cloud의 후보 생성 |\n| 4 | `/grasp/plan`의 planning-좌표계 candidate와 RViz marker |\n\n```mermaid\nflowchart LR\n    Identity[\"network identity / root-owned Feature ID / read-only mount\"] --> License[\"license validation\"]\n    License --> Detector[\"detector 초기화\"]\n    Detector --> Node[\"node 시작\"]\n```\n\nHost-native와 container Feature ID는 다릅니다. 실제 배포 container에서 검증하고 저장된 identity와 다르면 시작을 거부합니다. ROS 비의존 core와 fake 검사는 SDK 없이 실행할 수 있습니다.\n\n## 빌드와 테스트\n\n```bash\nsource /opt/ros/humble/setup.bash\ncd ros2_ws\ncolcon build --symlink-install --packages-up-to cleany_grasping\nsource install/setup.bash\ncolcon test --packages-select cleany_grasping\ncolcon test-result --verbose\nros2 run cleany_grasping grasp_server --ros-args \\\n  --params-file src/cleany_grasping/config/anygrasp.yaml\n```\n\n## 큰 물체의 접촉 높이\n\n| 설정 | 동작 / 한계 |\n|---|---|\n| `geometric.maximum_top_contact_depth_m` | 일반 / sorting 기본 0: 기존 체적 중심 사용 |\n| `grasp_maximum_top_contact_depth_m` | Demo launch에서 같은 값 전달, 기본 0 |\n| 양수 설정 | Support-normal 상단 percentile에서 지정 깊이 이내 접촉점; 기존 중심이 더 높으면 유지 |\n| 적용 한계 | 높게 잡는 것만으로 파지가 개선되지 않음; TCP 보정, 충돌, 관절 / 파지 허용값 유지 |\n\n이 옵션은 점군 기하를 사용하며 label이나 GT 좌표를 쓰지 않습니다. 별도 컵 진단값을 기본 운용값으로 간주하지 않습니다.\n\n## 요청 검증과 설정 불변성\n\nTCP 회전과 접근 축은 입력 배열에서 복사한 읽기 전용 값으로 보관한다.\n설정 검증 뒤 외부 배열 변경이 계획 결과를 바꾸지 않게 하며, 반사 행렬은\nquaternion 변환 전에 거부한다. 기존 Cleany local -Y 접근 축 계약은 유지한다.\n\nTarget/context cloud의 촬영 timestamp는 같고 0이 아니어야 한다. 미지정 시각으로\n최신 TF를 사용해 과거 cloud를 계획하지 않도록 요청을 거부한다.\nXYZRGB cloud는 지원되는 field datatype, offset, point/row step 및 전체 data\n길이를 검사한다. 정상적인 organized cloud의 행 padding과 packed RGB는 유지한다.\n\n## AnyGrasp 워커 생명주기 및 자원 관리\n\nAnyGrasp 딥러닝 추론기는 GPU 메모리 효율을 위해 상태 기반 Lease 메커니즘과 독립 Worker 프로세스를 사용합니다.\n\n### 1. 워커 유지 및 메모리 반환 (Lease 정책)\n- **VLM 준비 창 (`/grasp/prepare_window`)**:\n  - 호출자가 준비 창을 열면 AnyGrasp 모델을 사전 로드합니다. 이 서비스 자체는 IK 계산이나 모터 명령을 실행하지 않습니다.\n  - 호출 성공 시 기본 **180초 유한 유지 Lease**가 생성되며, `false` 호출 시 즉시 해제됩니다.\n- **액션 실행 유지 (`anygrasp_task_status_topic`)**:\n  - 조작 액션이 활성화되면 기본 **600초 작업 유지 Lease**가 갱신됩니다.\n  - 액션 종료 통지 시 1회 해제되며, 두 Lease가 모두 만료된 후 기본 **120초 유휴(Idle)** 시간이 지나면 워커 프로세스가 종료되어 GPU 메모리를 반환합니다.\n- **메모리 보호 임계치**: `anygrasp_minimum_available_memory_mb` 설정 시, 시스템 가용 메모리(`MemAvailable`)가 부족하면 작업 Lease보다 메모리 즉시 반환을 우선시합니다.\n\n### 2. GPU 파일 락 기반 자원 조율 (`gpu_lock_path`)\n같은 경로를 사용하는 프로세스 간 GPU 작업을 파일 잠금으로 조정합니다:\n- **잠금 파일**: `configs/robot/gpu-work.lock` 및 `.demand`\n- **동작 원칙**:\n  - 실제 사용자 파지 요청(Foreground Demand)이 항상 최우선권을 가집니다.\n  - 대기 중인 실제 요청이 있으면 비차단 준비 요청은 GPU 사용을 보류합니다.\n  - 이미 실행 중인 CUDA 커널 연산은 안전하게 완료될 때까지 대기합니다.\n\n### 3. 후보 조건 및 적응형 점군 샘플링 (Adaptive Sampling)\n\n| 설정 파라미터 | 기본값 | 설명 |\n|---|---|---|\n| `anygrasp_approach_direction` | `[0, 0, 0]` | 파지 접근 방향 제한 벡터 (영벡터 시 무제한) |\n| `anygrasp_approach_threshold_degrees` | 180 | 허용 접근 각도 오차 (도 단위) |\n| `anygrasp_region_steering_mode` | `workspace` | SDK 관심 영역 지정 (`target_voxels` 지정 시 대상 복셀 주변으로 제한) |\n| `anygrasp_target_region_voxel_m` | 0.01 | 대상 복셀 크기 (1cm) |\n| `anygrasp_adaptive_point_policy` | `fixed` | 점군 샘플링 정책 (`target_geometry` 사용 시 대상 형상에 따라 4,000/8,000점 동적 적용) |\n| `anygrasp_adaptive_low_maximum_points` | 4000 | 경량 타깃용 샘플링 포인트 상한 |\n| `anygrasp_adaptive_minimum_object_points` | 400 | 경량 상한 적용을 위한 최소 포인트 수 하한 |\n| `anygrasp_adaptive_minimum_object_extent_m` | 0.015 | 대상 PCA 3축 최소 크기 하한 (15mm) |\n| `anygrasp_adaptive_maximum_context_ratio` | 40 | 컨텍스트 대비 타깃 포인트 비율 상한 |\n\n- **동적 샘플링 동작**:\n  - Jetson 실물 설정(`config/anygrasp.yaml`)은 `target_geometry`를 적용하여 형태가 뚜렷하고 충분한 점군이 확보된 일반 물체는 4,000점만 샘플링하여 추론 시간을 단축합니다.\n  - 작거나 얇거나 점군이 성긴 물체는 8,000점을 유지합니다. 후보가 거절되면 전체 해상도로 재시도하며 실제 생성률은 입력과 모델에 따라 달라집니다.\n- **CUDA 캐시 및 가비지 컬렉션 (GC)**:\n  - `cuda_gc_interval_calls`: 추론 N회(기본 16회)마다 명시적 Python 전체 GC를 실행합니다.\n  - 미사용 CUDA 캐시가 `cuda_cache_release_threshold_mb`(기본 512MB)를 초과하면 주기적으로 PyTorch 캐시를 시스템에 반환합니다.\n\n## CPU 연산 스레드 제어 (`CLEANY_GRASP_BLAS_THREADS`)\n\n`grasp_server`는 프로세스 기동 시 `OPENBLAS_NUM_THREADS=1`을 설정하여 기하 연산으로 인한 CPU 코어 독점을 방지합니다.\n- **환경 변수 오버라이드**: `CLEANY_GRASP_BLAS_THREADS=2`와 같이 지정하면 상위 `OPENBLAS_NUM_THREADS`보다 우선하여 적용됩니다.\n- ROS 2 콜백 실행기나 PyTorch 내부 스레드는 이 제한의 영향을 받지 않습니다.\n\n\n### 파지 대상 본체와 접촉점\n\n모든 물체에 같은 3차원 점군 검사를 적용한다. 5 mm 복셀의 기본 연결 반경\n(`target_body.connectivity_radius_m`)은 9 mm다. 가장 큰 연결 성분이 전체 점의 90% 이상\n(`target_body.minimum_fraction`)이면 그 성분에서 시작해 간격이 18 mm 미만인 인접 성분을 차례로\n본체에 포함한다. 이 간격은 설정한 연결 반경의 두 배다. 본체까지 이어지지 않는 점은\n파지 중심과 폭 계산에서 제외한다. 90% 기준을 만족하는 성분이 없거나 연결 반경이 0이면\n전체 관측을 사용한다.\n\n기하 예측기는 본체에서 중심, 방향, 벌림을 계산한다. AnyGrasp의 탐색 범위와 전체 해상도 재시도,\n두 예측기의 최종 접촉점 검사에도 같은 본체를 사용한다. 분리된 점은 장애물로 보존하며\n그 점의 연결 반경 안에 놓인 접촉 후보는 제외한다. 충돌 장면에는 원래 관측 형상을 전달한다.\n\n### 낮은 물체의 CAD 패드 접촉 후보\n\n대칭 CAD 그리퍼는 지지면 위 관측 높이가 패드 한 개의 길이(30.75 mm) 이내이면 기존\n중앙 후보와 함께 패드 중앙에서 접근축을 따라 9 mm 앞쪽을 사용하는 후보를 검사한다.\n관측 상단에서 3 mm 안쪽의 접촉 위치 주변에 점군이 둘러싸여 있어야 한다. TCP는 패드\n중앙에 고정되며 접촉 위치를 맞추기 위해 접근 반대 방향으로 이동한다. 후보별로 점군\n충돌을 검사하고, 팔 선택 시 실제 CAD 형상으로 준비 경로, 접근 경로, 손가락 닫힘을 검사한다.\n다른 그리퍼의 기본 `geometric.distal_pad_offset_m`은 0이다.\n\n### 얕은 파지에서 윗면 폭과 진입 벌림\n\nCAD 프로필은 지지면과 비슷한 방향으로 넓고 평평한 윗면이 관측되면 길이 방향의 각 파지 위치에서 패드가 덮는 구간의 양쪽 윗모서리를 측정한다. 표면 적합 허용치는 `geometric.top_face_tolerance_m`이며 0이면 기존 몸통 후보만 생성한다. 촬영 원점과 RGB 대비가 있으면 깊이가 급변하는 먼 쪽 모서리에서, 주변 윗면 색과 일치하는 관측 광선만 윗면에 투영한다. 곡면이나 성긴 점군은 윗면을 추정할 근거가 부족할 때 몸통 폭을 사용한다.\n\n얕은 후보의 TCP는 관측한 양쪽 모서리의 가운데에서 패드 접촉 깊이와 오프셋을 반영해 정한다. 후보의 `required_opening_m`은 진입할 때 필요한 벌림이다. 윗면 폭, 설정 여유와 `geometric.top_face_tip_reach_m`까지 손가락이 지나는 구간의 관측 돌출부를 반영한다. 깊게 잡는 후보는 몸통 폭을 그대로 사용한다. 서버 로그의 `index=face/opening mm` 값은 후보별 윗면 폭과 진입 벌림을 밀리미터로 표시한다.\n"},"ros2_ws/src/cleany_handeye_calibration/docs/frames-and-data.md":{"title":"Hand-eye 좌표와 데이터 계약","body":"# Hand-eye 좌표와 데이터 계약\n\nHand-eye 계산과 재현에 필요한 좌표, 동기화, 저장 조건을 정의합니다. 모델, 상수, 허용 한계는 config와 core 코드가 원본이며, 작업 절차는 [CALIBRATION](../../../../docs/implementation/calibration.md)을 따릅니다.\n\n## 좌표와 동기화\n\n```mermaid\nflowchart LR\n    Target[\"target 좌표\"] -->|\"camera_T_target / PnP\"| Camera[\"camera 좌표\"]\n    Camera -->|\"gripper_T_camera / hand-eye 결과\"| Gripper[\"gripper 좌표\"]\n    Gripper -->|\"base_T_gripper / FK\"| Base[\"base 좌표\"]\n    Target -. \"base_T_target / 합성 변환\" .-> Base\n```\n\nparent_T_child는 child 좌표를 parent로 변환합니다. Transform은 다음 식을 만족합니다.\n\n`base_T_gripper @ gripper_T_camera @ camera_T_target = base_T_target`\n\n| 항목 | 계약 |\n|---|---|\n| 단위 / quaternion | m, rad, ns / xyzw |\n| 회전 행렬 | Orthogonal, det +1, 오차 1e-6 이내 |\n| Image/CameraInfo | 같은 nonzero stamp, optical 좌표계 |\n| FK / position IK | Canonical 12관절 feedback / 팔 5관절 검사 |\n| Capture / timeout | Settle 이후 stamp / monotonic 대기 시간 |\n\nPosition-only IK는 orientation 도달을 보장하지 않습니다. 다른 입력의 camera calibration을 아래 fixture 값으로 덮어쓰지 않습니다.\n\n| Fixture camera | 값 |\n|---|---|\n| Frame / image | left_wrist_rgb_optical_frame / RGB8 640×480, step 1920 |\n| Distortion / rectification | plumb_bob D=0 / R=I |\n| Intrinsics | fx=fy=227.751496, cx=319.5, cy=239.5 |\n\n\u003cfigure class=\"contract-figure\" data-visual-id=\"joint-sync\">\n\u003cimg src=\"assets/joint-sync.png\" alt=\"촬영 시각의 관절값은 어떤 샘플 사이에서 구하나?\" loading=\"lazy\">\n\u003cfigcaption>기존 동기화 테스트의 1000/1100 ns 피드백 사이에서 1025 ns 촬영 시각을 보간한 예시입니다. 같은 관절 이름으로 대응시킨 결과는 2.5 rad, 비율은 0.25입니다. 합성 fixture의 시간 간격과 각도이며 실제 샘플 주기나 로봇 동작이 아닙니다. \u003ca href=\"../../../../docs/assets/visuals/generated.json\">입력과 출처\u003c/a>\u003c/figcaption>\n\u003c/figure>\n\n## Board와 PnP\n\n| Fixture board | 값 |\n|---|---|\n| ChArUco | 7×5, square 30 mm, marker 15 mm |\n| Dictionary / legacy | DICT_5X5_100 / false |\n| Corner gate | 24개 중 최소 16개 + 4 quadrant coverage |\n\n평면 PnP는 IPPE를 사용하고 IPPE_SQUARE는 사용하지 않습니다. Positive-depth 후보를 VVS refine한 뒤 ambiguity를 검사합니다. 상위 두 오차 비가 1.05 미만이면 ambiguous이며, 영 오차 특수 기준은 코드의 1e-12를 따릅니다. 유효하지 않은 관측은 성공 표본으로 기록하지 않습니다.\n\n## Dataset과 저장\n\n```mermaid\nflowchart TB\n    Request[\"고정 profile / 표본 요청\"] --> FK[\"IK → state validity\"]\n    FK --> Motion[\"Motion → settle\"] --> Acquire[\"Acquire → PnP\"]\n    Acquire --> Feedback[\"촬영 시각 feedback FK\"] --> PNG[\"PNG 저장 / fsync\"] --> Journal[\"Journal 기록\"]\n    Journal --> JSONL[\"JSONL atomic rename\"] --> Row[\"Row / image hash 대조\"]\n    Journal -. \"부분 쓰기 복구\" .-> Recover[\"Image와 row 대조\u003cbr/>저장 표본 덮어쓰기 금지\"]\n    Recover --> Row\n    Row --> Valid{\"Image와 row가 일치?\"}\n    Valid -->|\"예\"| Evaluate[\"Calibration 20 / held-out 5\u003cbr/>solver별 평가\"]\n    Valid -->|\"아니오\"| Fail[\"누락 / 불일치 보존\u003cbr/>유효 표본으로 처리하지 않음\"]\n```\n\nMaterialized 프로필은 pose/runtime/URDF, camera K/D/R/P, source hash를 고정합니다. 구성은 calibration 20개와 held-out 5개이며 실패 표본을 교체하지 않습니다. Random seed, 탐색 제한, 선정 근거, row/image hash, capture provenance를 보존합니다.\n\n수집은 요청 → IK → state validity → plan/execute → settle → acquire → PnP → feedback FK → record 순서입니다. 저장은 PNG fsync → journal → JSONL atomic rename 순서로 수행합니다. 부분 쓰기 복구 시 image 없는 row를 유효 처리하지 않으며, 기존 dataset 일부 재사용을 fresh run으로 표시하지 않습니다.\n\n## 평가와 적용\n\nTsai, Park, Horaud, Andreff, Daniilidis solver를 평가하고 method별 예외를 분리합니다. GT 평가는 simulation 한정이며 held-out, solver 실패도 결과에 남깁니다.\n\nOffset, 품질 gate는 명시한 실행 정책을 사용합니다. 결과 생성은 자동 TF 게시나 실물 calibration 완료를 의미하지 않습니다.\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n"},"ros2_ws/src/cleany_handeye_calibration/docs/interfaces.md":{"title":"cleany_handeye_calibration 노드 인터페이스","body":"# cleany_handeye_calibration 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## single_pose_handeye_orchestrator\n\n실행 파일: `single_pose_calibration`. 원본: [single_pose_runtime.py](../cleany_handeye_calibration/single_pose_runtime.py), [moveit_fk.py](../cleany_handeye_calibration/moveit_fk.py), [ik_port.py](../cleany_handeye_calibration/ik_port.py), [motion_port.py](../cleany_handeye_calibration/motion_port.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n| 토픽 구독 | `/left_wrist_camera/image_raw` | `sensor_msgs/msg/Image` | Sensor |\n| 토픽 구독 | `/left_wrist_camera/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor |\n| 서비스 호출 | `/get_planning_scene` | `moveit_msgs/srv/GetPlanningScene` | Service 기본값 |\n| 서비스 호출 | `/compute_fk` | `moveit_msgs/srv/GetPositionFK` | Service 기본값 |\n| 서비스 호출 | `/compute_ik` | `moveit_msgs/srv/GetPositionIK` | Service 기본값 |\n| 서비스 호출 | `/check_state_validity` | `moveit_msgs/srv/GetStateValidity` | Service 기본값 |\n| 액션 호출 | `/move_action` | `moveit_msgs/action/MoveGroup` | Action 기본값 |\n| 액션 호출 | `/execute_trajectory` | `moveit_msgs/action/ExecuteTrajectory` | Action 기본값 |\n\n`request_file`에서 실행 설정을 읽습니다. Topic과 MoveIt endpoint는 코드 상수이므로 이름 변경에는 ROS remap을 사용합니다.\n\n## multi_pose_handeye_orchestrator\n\n실행 파일: `multi_pose_calibration`. 원본: [multi_pose_runtime.py](../cleany_handeye_calibration/multi_pose_runtime.py), [single_pose_runtime.py](../cleany_handeye_calibration/single_pose_runtime.py), [moveit_fk.py](../cleany_handeye_calibration/moveit_fk.py), [ik_port.py](../cleany_handeye_calibration/ik_port.py), [motion_port.py](../cleany_handeye_calibration/motion_port.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n| 토픽 구독 | `/left_wrist_camera/image_raw` | `sensor_msgs/msg/Image` | Sensor |\n| 토픽 구독 | `/left_wrist_camera/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor |\n| 서비스 호출 | `/get_planning_scene` | `moveit_msgs/srv/GetPlanningScene` | Service 기본값 |\n| 서비스 호출 | `/compute_fk` | `moveit_msgs/srv/GetPositionFK` | Service 기본값 |\n| 서비스 호출 | `/compute_ik` | `moveit_msgs/srv/GetPositionIK` | Service 기본값 |\n| 서비스 호출 | `/check_state_validity` | `moveit_msgs/srv/GetStateValidity` | Service 기본값 |\n| 액션 호출 | `/move_action` | `moveit_msgs/action/MoveGroup` | Action 기본값 |\n| 액션 호출 | `/execute_trajectory` | `moveit_msgs/action/ExecuteTrajectory` | Action 기본값 |\n| 서비스 제공 | `/handeye/cancel_run` | `std_srvs/srv/Trigger` | Service 기본값 |\n\n`pose_manifest`와 `runtime_config`로 실행합니다. SinglePoseRuntimeEffects를 재사용하며 cancel service 응답은 요청 접수이고 실제 정지 완료는 별도 확인합니다.\n"},"ros2_ws/src/cleany_handeye_calibration/docs/offline-tools.md":{"title":"Hand-eye 수집과 오프라인 평가","body":"# Hand-eye 수집과 오프라인 평가\n\n왼손목 eye-in-hand 보정의 수집 adapter, 데이터 검증과 solver를 제공합니다. 결과는 검토용 후보이며 TF를 발행하거나 보정 프로필에 자동 적용하지 않습니다. 이 패키지는 시뮬레이터 launch를 제공하지 않으므로 카메라와 motion backend는 별도로 구성합니다.\n\n| 하려는 일 | 먼저 읽을 곳 |\n|---|---|\n| 좌표와 단위 확인 | [좌표·데이터 계약](frames-and-data.md), 아래 Transform convention |\n| 새 데이터 수집 | [수집 순서](#single-pose-orchestration), [입력 조건](#position-ik-state-validity-motion-and-settle) |\n| 기존 데이터 검증 | [데이터 검증](#pose-sets-and-dataset-validation) |\n| Solver 비교 | [오프라인 평가](#offline-solver-and-timestamp-evaluation) |\n| 구현 수정 | 아래 adapter 표와 [검증](#verification) |\n\n```mermaid\nflowchart LR\n  Joints[\"실제 joint feedback\"] --> Sync[\"영상 시각 전후 보간\"]\n  Sync --> FK[\"base_T_gripper / FK\"]\n  RGB[\"새 Image + CameraInfo\"] --> PnP[\"camera_T_target / ChArUco PnP\"]\n  FK --> Pair[\"동기 표본 / PNG + JSONL\"]\n  PnP --> Pair\n  Pair --> Cal[\"calibration 20개 → 5개 solver\"]\n  Pair --> Hold[\"held-out 5개 → 일관성 평가\"]\n  Cal --> Review[\"후보 비교 / 검토\"]\n  Hold --> Review\n```\n\n## Transform convention\n\n`RigidTransform(parent_frame, child_frame, ...)`는 child 좌표를 parent 좌표로 옮기는 `parent_T_child`입니다. 합성 전에 좌표계 이름을 검사합니다.\n\n`base_T_gripper @ gripper_T_camera @ camera_T_target = base_T_target`\n\n| 변환 | 출처 / OpenCV 인자 |\n|---|---|\n| `base_T_gripper` | feedback FK → `R_gripper2base`, `t_gripper2base` |\n| `camera_T_target` | PnP → `R_target2cam`, `t_target2cam` |\n| `gripper_T_camera` | 미지 보정값 ← `R_cam2gripper`, `t_cam2gripper` |\n| `base_T_target` | 고정 표적 관계, held-out 비교 |\n\n단위는 m, rad, 정수 ns이고 quaternion은 ROS xyzw 순서입니다. 회전 행렬은 모든 값이 유한하고 `||R^T R − I||_F ≤ 1e-6`, `|det(R) − 1| ≤ 1e-6`이어야 합니다.\n\n## Single-pose orchestration\n\n`SinglePoseOrchestrator`는 다음 9단계를 재시도 없이 수행합니다.\n\n```mermaid\nflowchart TD\n  IK[\"1. RESOLVE_POSITION_IK\"] --> Valid[\"2. VALIDATE_RESOLVED_POSE\"]\n  Valid --> Plan[\"3. PLAN\"] --> Execute[\"4. EXECUTE\"]\n  Execute --> Settle[\"5. WAIT_SETTLED\"] --> Image[\"6. ACQUIRE_IMAGE\"]\n  Image --> Detect[\"7. DETECT_TARGET\"] --> FK[\"8. COMPUTE_FEEDBACK_FK\"]\n  FK --> Record[\"9. RECORD_SAMPLE\"]\n```\n\n1. `config/single_pose_request.template.json`을 복사하고 실행 입력을 채웁니다. `null`인 미결정 값은 실행 가능한 기본값이 아닙니다.\n2. 절대 artifact 경로, pose, hash/version, soft limit, clearance 근거, right-park 허용치와 각 단계 timeout을 지정합니다.\n3. 별도로 준비한 카메라와 motion backend에서 수집합니다. 성공한 PLAN/EXECUTE만으로 촬영을 허가하지 않습니다.\n4. `orchestration.jsonl`에서 시작·성공·실패 단계와 이유를 확인합니다. 실패 이후 단계의 부작용은 실행하지 않습니다.\n\n| 사전 조건 | 의미 |\n|---|---|\n| 단계별 timeout | 각각 양의 monotonic 시간; 공유 암묵값 없음 |\n| pose 검증 | canonical left-arm soft limit, collision margin, 해당 joint vector에 묶인 clearance 근거, MoveIt validity |\n| 안전 수치 | 승인되지 않은 production 기본값을 제공하지 않음 |\n| simulation fixture | clearance 0.146088 m, 요구 margin 0.10 m, pose 일치 1e-4 rad; 현재 모델과 회귀 검사 |\n\n위 fixture 수치는 실물 허용값이 아닙니다. 수집 root는 소스 트리 밖의 실행별 디렉터리를 사용합니다.\n\n## Camera acquisition and dataset artifacts\n\n`RosExactCameraPairAdapter`는 ROS 메시지를 독립된 bounded buffer로 복사하고 **settle 완료보다 늦은** 가장 이른 호환 영상을 선택합니다.\n\n| fixture 입력 | 조건 |\n|---|---|\n| Image / CameraInfo | 같은 nonzero stamp, `left_wrist_rgb_optical_frame` |\n| 영상 | RGB8, 640×480, step 1920; endian/행 간격/payload 길이 검사 |\n| 보정 | `plumb_bob`, D의 5계수 0, R=I |\n| K | fx=fy=227.751496, cx=319.5, cy=239.5 |\n| P | K와 같은 focal/principal point, translation 0 |\n| 촬영 대기 | 명시 buffer 크기, monotonic wall deadline; ROS clock 정지에도 만료 |\n\nFocal length는 vertical FOV 93°의 `fy = height / (2 tan(FOV/2))`입니다. 다른 카메라 입력을 이 fixture 값으로 덮어쓰지 않습니다.\n\n```text\n\u003crun_id>/\n├── manifest.yaml           # 환경, 설정, 버전과 hash\n├── samples.jsonl           # 동기 표본\n├── orchestration.jsonl     # 단계별 수집 결과\n└── images/\u003csample_id>.png  # 손실 없는 원본 영상\n```\n\n| 저장 항목 | 보존할 내용 |\n|---|---|\n| manifest | commit/dirty, URDF/MJCF/pose hash, ROS/MoveIt/OpenCV/MuJoCo/vendor 버전 |\n| 재현 조건 | camera/target 계약, board SVG/PDF hash와 크기 출처, 제어·영상·joint 주기, parameter, seed |\n| 표본 | canonical 12관절, 왼팔 seed/해 5관절, 정확한 image/info stamp, 보간 전후 stamp와 비율 |\n| 추정 입력 | FK/PnP 변환, 순서 있는 ChArUco 대응점, K/D/R/P 원본과 SHA256 |\n\n`DatasetWriter`는 PNG fsync/rename → journal fsync → 전체 JSONL fsync/rename 순서로 씁니다. 재개 시 유효 journal을 replay하고 journal 이전의 미참조 이미지를 정리하며 row/image/camera/manifest hash를 검사합니다. 이미지 없는 row를 완료 표본으로 만들지 않습니다. ID의 경로 이탈과 dataset/image symlink는 거부하고 URDF/Xacro나 보정 프로필을 수정하지 않습니다.\n\n## Pose sets and dataset validation\n\n`pose_generation.py`는 호출자가 제공한 후보 근거로 결정적으로 선택합니다. `pose_manifest.py`와 `pose_run.py`는 새 실행의 20 calibration + 5 held-out 구성을 관리합니다. Single/multi-pose ROS 노드는 별도 backend에 연결하며 multi-pose 취소는 `std_srvs/Trigger`를 사용합니다.\n\n```bash\nros2 run cleany_handeye_calibration validate_handeye_dataset --help\n```\n\n검증에는 sample, pose manifest, runtime config, URDF, 평가 전용 ground truth, translation bound와 출력 인자가 필요합니다. 검증 통과가 보정 적용을 뜻하지 않습니다.\n\n## Offline solver and timestamp evaluation\n\n### 입력과 실행\n\n| 입력 | 용도 |\n|---|---|\n| `samples.jsonl` + 같은 폴더 `manifest.yaml` | 20 calibration / 5 held-out; manifest 자체 hash 검사 |\n| materialized URDF | manifest hash와 일치해야 FK 재계산 |\n| evaluation-only GT | 오프라인 오차 평가 전용; solver/PnP/TF/수집에는 전달하지 않음 |\n| continuous observation JSONL | 실제 연속 joint/image 관측. 정지 표본 전후 stamp로 합성하지 않음 |\n| `evaluation.yaml` | 검토한 translation validity bound와 timing 설정 |\n\n`config/evaluation.template.yaml`의 미결정 값을 검토하여 채운 뒤 실행합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 run cleany_handeye_calibration evaluate_handeye \\\n  --samples /absolute/run/samples.jsonl \\\n  --continuous-log /absolute/run/continuous_trajectory.jsonl \\\n  --urdf /absolute/run/cleany.urdf \\\n  --ground-truth /absolute/run/evaluation-only-ground-truth.yaml \\\n  --config /absolute/run/evaluation.yaml \\\n  --output-directory /absolute/run/evaluation\n```\n\n### 비교 행렬과 결과 읽기\n\n| 평가 조건 | pixel noise | 왼팔 joint noise |\n|---|---:|---:|\n| ideal | 0 px | 0° |\n| nominal | 0.5 px | 0.05° |\n| stress | 1.0 px | 0.10° |\n\n5 solver × 3 조건 × 기록된 seed 10개 = 150회입니다. 같은 조건/seed의 solver들은 동일한 hash의 PCG64 noise를 받습니다. Pixel noise는 원본 ChArUco 점에 적용한 뒤 PnP를, joint noise는 왼팔 5관절에 적용한 뒤 FK를 다시 계산합니다. 최종 변환이나 GT를 직접 흔들지 않습니다.\n\n| 출력 | 읽는 방법 |\n|---|---|\n| `pnp_candidates.jsonl` | raw/refined 후보, depth, RMSE와 모든 실패 |\n| `solver_results.csv` | 150개 결과 전체; 실패를 빼고 성공률을 계산하지 않음 |\n| `metrics.yaml` | 유효율, 위치/회전 median·linear P95, held-out 일관성, runtime |\n| `candidate_transform.yaml` | `candidate_not_applied`; 자동 적용하지 않음 |\n| `timestamp_sensitivity.csv` | 선택한 한 solver의 연속 관측 측정 시각 offset 민감도 |\n\n유효율 0.95 미만 method는 제외합니다. 네 정확도 지표의 Pareto 비교 후 held-out 일관성을 사용하고 우열이 교차하면 `review_required`입니다. 선택 변환은 첫 기록 seed의 clean ideal 결과입니다. 후보 적용은 사람이 검토합니다.\n\nContinuous JSONL의 `joint_state`에는 stamp, canonical 12개 이름/위치와 선택적 속도를, `image_observation`에는 별도 sample/pose ID, image stamp와 PnP 변환을 기록합니다. `image_stamp_ns + offset_ns`에서 보간하고 URDF FK를 다시 계산합니다.\n\n## Planar ChArUco and PnP contract\n\n| 항목 | 조건 |\n|---|---|\n| board | 7×5 squares, square 30 mm, marker 15 mm, `DICT_5X5_100`, `legacy_pattern=false` |\n| 유효 검출 | 내부 24 corner 중 유일하고 범위 안인 16개 이상, object-space 4분면 모두 포함 |\n| 검출 API | Ubuntu OpenCV 4.5.4의 `CharucoBoard_create`, `DetectorParameters_create`, `detectMarkers`, `interpolateCornersCharuco`, `chessboardCorners` |\n| 영상 처리 | 2배 cubic grayscale 확대 + subpixel refinement 후 좌표를 원본 픽셀로 환산 |\n| PnP | `solvePnPGeneric(SOLVEPNP_IPPE)`; `IPPE_SQUARE` 미사용 |\n| 후보 검사 | finite, 모든 표적의 camera Z 양수 → 후보별 VVS refine → cheirality와 전체점 RMSE 재검사 |\n| 모호성 | 두 RMSE 모두 ≤1e-12 px 또는 best가 그보다 크고 second/best \u003c1.05이면 `ambiguous_pnp` |\n\n확대 검출은 corner gate를 완화하지 않습니다. Raw/refined 변환, 최소 depth와 실패 이유를 보존합니다. 정답 정보는 검출과 후보 선택에 사용하지 않습니다.\n\n## Hand-eye solver and metrics\n\nTsai, Park, Horaud, Andreff, Daniilidis는 동일한 검증 표본의 복사본을 받습니다. 한 method의 예외/무효 변환은 다른 method를 중단시키지 않습니다.\n\n| 검증 | 조건 |\n|---|---|\n| registry | 예상 OpenCV constant 누락 또는 미등록 `CALIB_HAND_EYE_*` 추가 시 preflight 실패 |\n| translation envelope | `HandEyeTransformValidityPolicy.max_translation_norm_m`는 양의 유한한 명시 입력; 범위 밖 해 무효 |\n| 입력 split / 좌표계 | calibration만 solver로 전달; base/gripper/camera/target 이름 검사 |\n| held-out | 표본별 `base_T_target` 복원 후 모든 쌍의 병진·회전 차이 median/P95 |\n| 오차 단위 | 병진 m, 회전 rad |\n\n## Joint feedback synchronization and FK\n\n| adapter | 보존 / 거부 조건 |\n|---|---|\n| `JointStateRingBuffer` | 12관절 완전성, increasing stamp, bounded capacity; 추가 관절은 MoveIt에 보내지 않음 |\n| 시간 역행 | 중복/작은 역행은 buffer 변경 없이 거부; reset threshold 이상이면 새 epoch와 기존 buffer 폐기 |\n| 보간 | 영상 양쪽의 서로 다른 sample, 각각 `max_sample_distance_ns` 이내; joint 이름으로 선형 보간 |\n| 속도 | 양쪽 sample에 있으면 보간·기록; FK 필수 입력은 아님 |\n| `timed_joint_sample_from_message` | 수신 시간이 아닌 `JointState.header.stamp` |\n| `MoveItForwardKinematicsAdapter` | canonical 12관절, `is_diff=false`, `/compute_fk`의 `base_link → left_gripper_frame` |\n| FK 결과 | MoveIt code, link, 좌표계, pose 수와 rigid transform 검사; monotonic 준비/응답 timeout |\n\n누락, stale, 불완전, 순서 오류와 clock reset은 각각 명시 상태입니다. 테스트는 client/executor poll hook을 주입해 ROS graph 없이 실행할 수 있습니다.\n\n## Position IK, state validity, motion, and settle\n\n| 단계 | endpoint / gate |\n|---|---|\n| 시작/각 이동 전 | fresh ROS-stamped 12관절 위치·속도; 오른팔 5관절이 승인된 all-zero park에서 정지 |\n| IK | `/compute_ik`; `left_arm`, `left_gripper_frame`, `base_link`만 허용; collision avoidance |\n| IK state | full non-diff 12관절, 왼팔 seed만 대체; 오른팔과 gripper feedback 유지 |\n| IK 방향 | identity quaternion은 placeholder; position-only이며 orientation 보장 없음 |\n| validity | `/check_state_validity`; 왼팔 해를 같은 full state에 적용해 검사한 `ValidatedJointGoal`만 다음 단계로 전달 |\n| plan / execute | `/move_action`의 plan_only, scaling 0.10/0.10 → 반환 trajectory만 `/execute_trajectory`로 실행 |\n| 취소 | 별도 monotonic timeout; `ERROR_NONE`과 정확한 goal UUID가 `goals_canceling`에 있어야 확인 |\n\nFreshness, park 허용치와 모든 IK/validity/plan/execute/cancel/settle timeout은 `MujocoMotionConfig`의 필수 입력입니다. Raw JointPose, stale/partial state, 오른팔 park 이탈은 실행하지 않습니다. Action status와 정확한 MoveIt error code를 보존합니다.\n\n| simulation settle 기준 | 값 |\n|---|---:|\n| controller path / goal tolerance | 0.05 / 0.01 rad |\n| settle position / velocity | 0.015 rad / 0.01 rad/s |\n| 연속 유지 | ROS stamp 기준 1.0초 |\n\n왼팔 모든 joint가 동시에 만족해야 합니다. 조건 위반이나 시간 역행은 구간을 초기화합니다. 별도 monotonic settle deadline은 clock 정지에도 만료하며 timeout 뒤 촬영을 허가하지 않습니다. 이 수치는 실물 승인 허용치가 아닙니다.\n\n## Core models\n\n| 모델 | 역할 |\n|---|---|\n| `PositionTarget`, `JointPose`, `IkResult` | 좌표계을 가진 위치 목표, 완전한 joint vector, 배타적인 성공/실패 |\n| `TimedJointSample` | 촬영 시각과 대응할 feedback |\n| `CalibrationSample`, `CalibrationSampleRecord` | 변환 쌍/split과 version-1 동기 데이터 row |\n\nMutable 입력은 immutable tuple로 복사합니다. 중복 joint 이름, 길이 불일치, 무효 측정 시각와 비유한 값을 거부합니다.\n\n## Dependencies\n\nSystem NumPy/OpenCV/PyYAML은 rosdep의 `python3-numpy`, `python3-opencv`, `python3-yaml`을 사용합니다. 수학·동기화·설정·settle core는 rclpy를 import하지 않습니다. ROS adapter는 manifest의 rclpy/action_msgs/moveit_msgs/sensor_msgs에 의존합니다.\n\n## Verification\n\n저장소 루트의 Humble 환경에서 실행합니다. 개별 수정은 해당 pytest부터, 연결 변경은 `make test-handeye`로 확인합니다.\n\n```bash\npython3 -m pytest -q ros2_ws/src/cleany_handeye_calibration/test\nmake test-handeye\n```\n\n| 수정 범위 | 집중 검사 파일 |\n|---|---|\n| 동기화 / FK | `test_joint_state_sync.py`, `test_moveit_fk.py` |\n| motion / settle | `test_motion_config.py`, `test_ik_adapter.py`, `test_motion_adapter.py`, `test_settle_detector.py` |\n| camera / 저장 | `test_camera_acquisition.py`, `test_ros_camera_adapter.py`, `test_schema.py`, `test_dataset_writer.py` |\n| single pose | `test_single_pose_orchestrator.py`, `test_single_pose_runtime_config.py` |\n| pose set | `test_pose_diversity.py`, `test_pose_manifest.py`, `test_pose_generation.py`, `test_pose_run.py`, `test_multi_pose_runtime.py` |\n| 평가 | `test_offline_fk.py`, `test_experiment_evaluation.py`, `test_timestamp_sensitivity.py`, `test_evaluation_artifacts.py` |\n"},"ros2_ws/src/cleany_interfaces/docs/manipulation.md":{"title":"단일 객체 Manipulation 계약","body":"# 단일 객체 Manipulation 계약\n\nMission은 승인한 객체를 실행 서버에 전달하고, 서버 내부 BT는 executor가 소유합니다. 이 실행 계약은 reachable-grasp plan-only action과 별개입니다.\n\n## 인터페이스\n\n| 항목 | 원본 / 기본 이름 |\n|---|---|\n| 실행 action | ExecuteManipulationSkill.action / mock/manipulation/execute_skill |\n| 진행, 결과 record | ManipulationExecutionRecord.msg |\n| 취소 service | CancelManipulation.srv / mock/manipulation/cancel; Mission은 ROS Action cancel 사용 |\n| 조회 service | GetManipulationExecution.srv / mock/manipulation/get_execution |\n| 요청 | mission/task/execution ID, skill_name, snapshot ID, uint32 object ID, destination ID |\n\n## 요청과 재전송\n\n```mermaid\nsequenceDiagram\n    participant R as Mission Runtime\n    participant J as SQLite journal\n    participant P as 조작 실행 서버\n    R->>R: 요청 검증 / execution UUID 발급\n    R->>J: 전체 요청 저장\n    R->>P: ExecuteManipulationSkill / 같은 goal UUID\n    alt 결과 수신\n        P-->>R: ROS terminal + payload\n        R->>R: ID / 출처 / placement / 팔 복귀 / 정지 검사\n        R->>J: 전체 결과 저장\n    else 결과 불명확 / 재시작\n        R->>P: 같은 execution ID 조회\n        Note over R,P: 재시작 취소는 저장된 goal UUID만 대상\n        P-->>R: 기록 / 진행 상태 / found=false\n        R->>R: 확인 전 gate 유지\n        Note over R,P: 새 ID로 자동 재전송하지 않음\n    end\n```\n\nRuntime은 wire object ID를 Planner 제안과 대조하며 표시 ID에서 숫자를 추정하지 않습니다. Destination은 RuntimePolicy allowlist로 검사합니다.\n\n행동마다 execution UUID를 발급하고 **전체 요청을 SQLite에 저장한 뒤 전송**합니다. ROS goal UUID도 같은 값을 사용하므로 지연 수락, 재시작 취소는 정확한 goal만 대상으로 합니다. 결과가 불명확하면 같은 execution ID로 조회하며 새 ID로 자동 재전송하지 않습니다.\n\nAction 이름을 remap하면 Mission client와 서버가 해결된 Action 이름을 사용하며 CancelGoal 경로도 함께 맞춥니다. Record의 `accepted_at_ns`, `updated_at_ns`, `evidence_at_ns`는 서버 wall 시각의 nanosecond입니다. 실행 timeout은 별도 steady clock으로 처리합니다.\n\n## 성공 판정\n\n현재 peer는 BLOCKED도 ROS SUCCEEDED로 반환할 수 있습니다. 따라서 Runtime은 ROS terminal뿐 아니라 다음 payload 조건을 함께 검사합니다.\n\n- SUCCESS, 일치하는 execution ID와 mock 출처\n- LEFT_GRIPPER, CONFIRMED, placement 검증 완료\n- 팔 복귀와 정지 확인\n\nFeedback stage는 완료 증거가 아닙니다. 전체 결과와 task/execution/destination ID는 journal, report_json.actions에 보존하며, peer CANCELED는 Runtime CANCELLED로 변환합니다.\n\n## 주행과 복구\n\n| 상태 | 처리 |\n|---|---|\n| HELD/UNKNOWN, 팔 미복귀, 사람 확인 필요 | Home, 다음 미션 이동 차단; 취소 결과가 CANCELLED여도 FSM ERROR 유지 가능 |\n| reset_error | 주행 가능 조건 우회 금지 |\n| found=false | 저장 오류/기록 없음 미구분; 미실행, 정지 증거로 사용 금지 |\n| 진행 중, INTERRUPTED, 불일치 결과 | Gate 유지 |\n| 재시작 | 저장 UUID의 취소, 조회만 수행; 미션 자동 재개 금지 |\n\n현재 peer에는 수동 팔 복구, 해제 계약이 없으므로 Runtime은 임의 복구를 수행하지 않습니다. 진단은 journal의 manipulation_boundary metadata에 남깁니다.\n\n## 진단과 보고 호환\n\n[Action](../action/ExecuteManipulationSkill.action)의 Result에는 `failed_substage`, `cancel_mode`, Feedback에는 `substage`가 있습니다. [Record](../msg/ManipulationExecutionRecord.msg)는 현재와 완료 substage, 취소 방식을 포함합니다. 모든 제공자와 호출자를 하나의 install prefix에서 재빌드합니다.\n\n기존 `ManipulationOutcome`, `RuntimeReport.actions`, MissionResult와 Gateway payload는 유지합니다. 추가 필드는 `manipulation_boundary`의 선택적 `details` metadata에 저장하고, 과거 metadata에 없으면 빈 값으로 읽습니다. Mission DB schema는 바꾸지 않습니다.\n\nTransport는 전송한 execution ID와 일치하는 최신 Feedback 하나만 보관합니다. 새 실행 때 초기화하고 이전 실행이나 종료 후의 늦은 Feedback을 무시합니다. `manipulation_feedback`, `manipulation_details`는 debug JSON의 선택적 정보이며 수신과 debug 발행 실패는 제어 흐름에 영향을 주지 않습니다.\n\n취소는 정확한 Goal UUID의 기본 CHECKPOINT 모드를 사용합니다. 취소 ACK는 완료나 정지 증거가 아닙니다. `IMMEDIATE`, `RETURN_ARM`을 선택하는 Mission API는 제공하지 않습니다. FATAL이나 정지 미확인은 ERROR를 유지하며, 팔 미복귀 시 이미 안착한 결과를 보존하면서 주행을 차단합니다. 손상된 DB는 오류로 처리하고 자동 초기화하지 않습니다.\n\n관련 안내: [Mission](mission.md), [검증](../../../../docs/implementation/testing.md).\n"},"ros2_ws/src/cleany_interfaces/docs/mission.md":{"title":"Mission과 Gateway 계약","body":"# Mission과 Gateway 계약\n\nBackend는 queue와 배차를, Mission Runtime은 수락 이후 실행과 영속 결과를 소유합니다. Runtime에는 별도 queue가 없으며 한 번에 미션 하나만 수락합니다. 필드는 패키지 msg/srv, 설정은 cleany_mission_manager/config/runtime.yaml이 원본입니다.\n\n## 인터페이스\n\n| 상대 이름 | 의미 |\n|---|---|\n| `mission/offer` | clean_desk, SEAT, canonical seat ID 요청 수락 |\n| `mission/cancel` | 비동기 취소 수락 |\n| `mission/snapshot` | 현재 상태와 보존된 최종 보고 |\n| `mission/reset_error` | 정지, 팔 주행 가능, Nav2 준비 확인 후 명시적 오류 해제 |\n| `mission/status`, `mission/result` | transient-local 상태와 최신 최종 보고 |\n| `mission/stop` | Supervisor의 정지 요청 Action. Runtime이 자기 동작의 정지를 확인한 뒤에만 stopped=true |\n| `system/check_permission`, `system/heartbeat`, `system/state`, `system/capabilities` | Supervisor 허가 lease와 가용성 입력 (`supervision_mode=required`) |\n| `robot/safety_fault`, `robot/safety_released` | 안전 소유자의 fault/release 알림 (`supervision_mode=disabled`일 때만) |\n\nOffer/Cancel의 accepted는 수락 응답이며 완료 증거가 아닙니다. 같은 ID로 같은 요청을 보내면 재실행하지 않고, 같은 ID에 다른 내용을 보내면 거절합니다. Runtime 진단 sequence와 Backend 미션별 sequence는 별개입니다.\n\n## 수락과 완료\n\n```mermaid\nsequenceDiagram\n    participant B as Backend\n    participant G as Gateway bridge\n    participant M as Mission Runtime\n    participant J as SQLite journal\n    B->>G: mission.offer\n    G->>M: OfferMission\n    M->>M: 준비 / 요청 / 중복 검사\n    alt 새 요청 수락\n        M->>J: 수락 기록 영속 저장\n        M-->>G: accepted\n        G-->>B: mission.accepted\n        M->>M: 주행 / 작업 / 종료 정책 실행\n        M->>J: 최종 결과 영속 저장\n        M-->>G: MissionResult\n        G-->>B: mission.result\n    else 거절 또는 중복\n        M-->>G: 사유 또는 보존된 결과\n        G-->>B: 응답 / 상태 동기화\n    end\n```\n\n수신 ACK, 실행 수락, 최종 결과는 서로 다른 시점입니다.\n\n## 정상 실행\n\n```mermaid\nstateDiagram-v2\n    [*] --> IDLE\n    state \"실행 중\" as Active {\n        NAVIGATE_TO_TARGET --> WORKING: 도착 / 정지 확인\n        WORKING --> POST_MISSION: 청소 BT 성공\n        POST_MISSION --> RETURN_HOME: return_home\n    }\n    IDLE --> NAVIGATE_TO_TARGET: 요청 수락\n    POST_MISSION --> IDLE: wait_for_next\n    RETURN_HOME --> IDLE: 복귀 / 정지 확인\n    Active --> CANCELLING: 취소 / 실패\n    CANCELLING --> RETURN_HOME: 취소 후 복귀 정책 / gate 통과\n    CANCELLING --> IDLE: 정지 / 주행 가능 확인\n    CANCELLING --> ERROR: 정지 미확인 / 치명적 오류 / 주행 차단\n    IDLE --> ERROR: 안전 fault / 복구 필요\n    ERROR --> IDLE: 조건 충족 / 명시적 reset\n```\n\n정상 실행은 대상 이동, 작업, 완료 후 정책 순서입니다. 종료 전 최종 보고를 저장합니다. 취소 후 복귀에는 정지, 팔의 주행 가능 상태, 복귀 정책, Nav2 준비가 모두 필요합니다. ERROR 해제 조건은 아래 표를 따릅니다.\n\n### 청소 BT\n\n```mermaid\nflowchart TB\n    Observe[\"ObserveBefore\"] --> Plan[\"PlanNext\"]\n    Plan --> Validate[\"ValidateProposal\u003cbr/>snapshot / object ID / capability 검사\"]\n    Validate --> Execute[\"ExecuteOne\u003cbr/>수거 실행 또는 done / skip / human_review 처리\"]\n    Execute --> Reobserve[\"Reobserve\u003cbr/>fresh 관측\"]\n    Reobserve --> Verify{\"VerifyCompletion\u003cbr/>done 제안과 잔여 대상 확인\"}\n    Verify -->|\"추가 작업\"| Plan\n    Verify -->|\"완료 확인\"| Done[\"BT 성공 / POST_MISSION\"]\n    Validate -->|\"거절 / 오류\"| Fail[\"실패 보존 / 정지 절차\"]\n    Execute -->|\"치명적 오류 / 주행 불가\"| Fail\n    Verify -->|\"실패 확정\"| Fail\n```\n\n청소 BT는 처음 장면을 관측한 뒤 계획, 제안 검증, 객체 하나의 실행, 재관측, 완료 검증을 반복합니다. Snapshot/object ID와 capability를 검사하며, done 제안도 fresh 관측에서 잔여 대상을 확인한 뒤 완료합니다. Skip과 human_review는 조작 명령 없이 기록하며 done도 조작 명령을 보내지 않습니다.\n\n보고에는 skip, 사람 확인, 실패, 취소를 보존합니다. Mock 관측 ID는 실제 사진이 아닙니다.\n\n## System Supervisor 감독\n\n`supervision_mode=required`(기본)에서는 System Supervisor가 시스템 Fault, Capability와 Nav2 lifecycle 가용성을 소유하고 Runtime은 실행, 정지, 재개와 journal을 소유합니다. Supervisor 계약은 [System Supervisor](../../cleany_system_supervisor/docs/supervision.md)를 따릅니다.\n\n```mermaid\nsequenceDiagram\n    participant M as Mission Runtime\n    participant S as System Supervisor\n    participant N as Nav2 / 조작\n    M->>M: offer: 캐시된 Supervisor 가용성 확인\n    M->>S: CheckPermission (mission_id, supervision_capabilities)\n    S-->>M: lease (TTL, epoch, version)\n    M->>N: lease가 유효할 때만 첫 동작\n    loop TTL/3마다\n        M->>S: 갱신\n    end\n    S--)M: 철회 snapshot 또는 StopMission\n    M->>N: 취소\n    M->>M: 자기 동작의 정지 확인 / 최종 보고\n    M-->>S: StopMission stopped=true, 정상 종료면 release\n```\n\n| 상황 | 처리 |\n|---|---|\n| Offer | Runtime 준비 + Supervisor heartbeat, OPERATIONAL/DEGRADED, 요청 Capability AVAILABLE. 사유는 `SUPERVISOR_UNAVAILABLE`, `SYSTEM_\u003cstate>`, `CAPABILITY_UNAVAILABLE:\u003cnames>` |\n| 첫 동작 전 lease 대기 | `permission_timeout` 안에서만 대기, 초과 또는 거절이면 동작 없이 종료 |\n| 실행 중 lease 상실 | 만료, 철회, heartbeat 단절, epoch 변경 모두 즉시 정지. 최종 보고는 BLOCKED / `PERMISSION_REVOKED`, 조작 단계였으면 사람 확인 |\n| 상실 후 Runtime 상태 | 정지가 확인되면 IDLE. 시스템 Fault는 Runtime 실행 오류가 아니므로 ERROR가 아님 |\n| 정지 미확인 | 기존 규칙대로 ERROR. lease는 release하지 않고 abandon하여 Supervisor가 정지를 직접 재확인 |\n| StopMission | 해당 미션이면 정지를 시작합니다. 이 Runtime에 실행 중인 미션이 없으면 정지 증거로만 답합니다. 기한은 `cancel_timeout + 0.5 s` |\n| 독립 안전 fault | safety adapter → Supervisor ESTOP/SAFETY Fault → lease 철회. `robot/safety_*` 구독은 만들지 않음 |\n| 오류 해제 | Runtime ERROR는 `mission/reset_error`, Supervisor Fault는 `system/request_fault_reset`가 각각 소유 |\n\nAdmission의 가용성 확인은 snapshot 하나만큼 늦을 수 있는 사전 확인이며, 동작 권한은 lease만이 부여합니다. 팔 상태에 따른 주행 허가(`safe_to_drive`)는 계속 Runtime이 조작 결과로 판단합니다.\n\n## 취소, 안전, 재시작\n\nNav2는 설정된 lifecycle 노드 모두 active이고 lifecycle_timeout 이내 응답해야 준비 상태입니다. 감독 모드에서는 이 확인을 Supervisor의 NAVIGATION Capability가 대신하며 Runtime은 action server, odom, localization TF만 확인합니다. 기본 목록은 map_server, amcl, planner_server, controller_server, bt_navigator, collision_monitor입니다. Deadline은 steady clock과 runtime.yaml 값을 사용합니다.\n\n| 조건 | 처리 |\n|---|---|\n| Nav2 action server만 준비 | NAV2_NOT_READY, goal 미전송 |\n| 취소 요청 | Nav2 terminal + fresh odom 정지 확인; ACK만으로 IDLE 전이 금지 |\n| 정지 확인 기한 초과 | ERROR 유지 |\n| Safety fault (감독 해제 모드) | Producer가 실제 정지 먼저 수행; Runtime은 물리 E-stop 아님 |\n| Fault 해제 (감독 해제 모드) | 일치하는 release + 정지 확인 + 명시적 reset |\n| 재시작 당시 미완료 미션 | INTERRUPTED, 사람 확인 필요; 자동 재개 금지 |\n| Backend 단절 | 수락한 미션 계속 실행; 재연결 후 상태와 결과 동기화 |\n\nSQLite journal은 수락, 출처, goal UUID, 최종 결과, 오류를 저장합니다. 재시작 시 저장된 UUID의 orphan goal만 취소하고 정지, 준비를 확인합니다.\n\n## Gateway schema v1\n\ncontrol_bridge는 `ws(s)://\u003cbackend>/api/robots/cleany-01/gateway/ws`를 ROS에 연결합니다. mission.offer의 clean_seat를 ROS clean_desk/SEAT로 변환하고 canonical seat ID를 보존합니다.\n\n연결, 재연결, sync마다 fresh snapshot을 보내고 **snapshot ACK 이후** 해당 연결의 feedback, 명령을 허용합니다. RPC timeout은 수락 여부가 불명확하므로 거절을 합성하지 않고 재동기화합니다.\n\n| 항목 | 의미 |\n|---|---|\n| ACK / mission.accepted / mission.result | 수신 / 수락 / 최종 결과 |\n| SQLite outbox | Event ID, 미션별 sequence, payload를 ACK까지 보존하고 재전송 |\n| Snapshot | 최근 100개 최종 보고; IDLE이어도 port 미준비면 가용 ERROR |\n| Mock before/after_observation | null; outcome과 사람 확인은 보존 |\n| Schema, 인증, media 정책 | control-plane 저장소 소유 |\n| Parameter 기본값 | control_bridge 노드 기준 |\n\n## 개발 관측\n\n| 토픽 | 계약 |\n|---|---|\n| debug_snapshot | reliable/transient-local depth 1, schema v1 |\n| runtime_events | reliable/transient-local depth 2048, boot ID, 연속 sequence |\n\n관측 토픽은 명령 경로가 아닙니다. 소비자는 재시작과 sequence gap을 구분해야 합니다.\n\n관련 안내: [실행](../../../../docs/implementation/running.md), [Manipulation](manipulation.md).\n"},"ros2_ws/src/cleany_interfaces/docs/mobile-base.md":{"title":"Mobile base 계약","body":"# Mobile base 계약\n\nMuJoCo, Gazebo, 실물 base는 차체 속도를 같은 ROS 계약으로 받습니다. `/cmd_vel`은 연속 명령 스트림이며 성공 응답을 반환하지 않습니다. 실제 이동은 `/odom` 등의 상태로 확인합니다.\n\n## 인터페이스\n\n| 항목 | 계약 |\n|---|---|\n| 기본 토픽 / 타입 | /cmd_vel / geometry_msgs/msg/Twist |\n| 좌표계 | base_link; Twist에는 좌표계 ID 없음 |\n| 구독 이름 | 상대 이름 cmd_vel; namespace/remapping 허용 |\n| linear.x / linear.y | 전진 / 좌측이 양수, m/s |\n| angular.z | 반시계 회전이 양수, rad/s |\n\n## 명령 처리\n\n수신자는 x/y/yaw를 각 축의 최대 절댓값으로 제한합니다. 제한값과 timeout은 양의 유한 설정값이며, 실물 사양과 안전 검토로 결정합니다.\n\nTwist에는 stamp가 없으므로 timeout은 수신 monotonic 시각으로 판단합니다. 발행자는 timeout보다 충분히 짧은 주기로 명령을 반복해야 합니다. 목표 0은 실제 정지 완료를 의미하지 않으며, 감속 거리와 시간은 backend별로 검증합니다.\n\n| 입력 조건 | 처리 |\n|---|---|\n| linear.z / angular.x / angular.y가 nonzero | 경고 후 해당 축 무시; 발행자는 0 사용 |\n| 여섯 축 중 NaN/Inf 포함 | 메시지 전체 폐기, 정지 목표 적용 |\n| Timeout 동안 새 명령 없음 | 정지 목표 적용 |\n\n## 소유권\n\n한 시점에 명령원 하나만 cmd_vel을 제어합니다. Nav2, teleop, 시험 명령의 선택은 별도 mux가 담당합니다. Mission Manager는 cmd_vel을 직접 발행하지 않고 Navigator/Nav2에 주행을 위임합니다.\n\n이 계약은 차체 Twist까지만 정의합니다. Wheel 목표, MCU 통신, encoder, PID, PWM은 backend 내부 계약입니다.\n"},"ros2_ws/src/cleany_interfaces/docs/observation-contracts.md":{"title":"관측과 조작 인터페이스","body":"# 관측과 조작 인터페이스\n\nPerception snapshot, grasp 후보, 도달성 검사와 조작 결과가 공유하는 ROS wire 계약입니다. Provider 내부 model은 노출하지 않습니다.\n\n```mermaid\nflowchart LR\n    Detect[\"InspectScene 1차 / RGB-D snapshot + 2D 검출\"] --> Select[\"snapshot_id + selected_object_id\"]\n    Select --> Reconstruct[\"InspectScene 2차 / 선택 mask의 3D 복원\"]\n    Reconstruct --> Plan[\"PlanGrasp / 점수순 후보\"]\n    Plan --> Reach[\"SelectReachableGrasp / 양팔 plan-only 검사\"]\n    Reach --> Execute[\"별도 coordinator / trajectory와 gripper 실행\"]\n```\n\n## 객체 메시지\n\n| 타입 / 필드 | 의미 |\n|---|---|\n| `DetectedObject2D`, `DetectedObject2DArray` | RGB pixel bbox, snapshot-local 번호, 후속 선택용 `snapshot_id` |\n| `distance_m`, `distance_valid` | 촬영 depth와 TF로 구한 configured target-좌표계 원점 거리; 불충분한 depth는 자동 조작 제외 |\n| 후보 순서 | 거리 → confidence → detector 원본 순서 |\n| `DetectedObject3D`, `DetectedObject3DArray` | 선택 OBB와 같은 snapshot 문맥 |\n| `sorting_category`, `sorting_reason` | 모델 분류와 사유; category는 trash / lost_item / review / 미제공 빈 값 |\n\n빈 category는 이름 기반 폐기 허가가 아닙니다. 메시지 변경 시 consumer를 함께 재빌드합니다.\n\n### 관측 충돌 형상\n\n| `ObservedObjectGeometry` | 계약 |\n|---|---|\n| 연결 | `/grasp/collision_geometry`; capture header, snapshot_id, object_id로 후보와 연관 |\n| 좌표 | `mesh_pose`는 header 좌표계, vertices는 mesh_pose local 좌표 |\n| 형상 | Convex footprint를 인식 지지면까지 돌출; 숨은 실제 형상이나 시뮬레이터 GT 아님 |\n| 배포 | 별도 mesh 메시지, `shape_msgs` 의존; 다른 메시지 호환성은 각 계약 참조 |\n\n## Scene inspection action\n\n| 단계 | 요청 | 결과 |\n|---|---|---|\n| 1차 | 동기화된 새 RGB-D snapshot | 2D detection |\n| 2차 | 기존 snapshot_id + selected_object_id | 선택 YOLOE mask의 target/context cloud와 OBB |\n\n2차 출력은 같은 configured target 좌표계과 capture 측정 시각를 사용합니다.\n\n## Grasp planning과 선택\n\n| API | 결과 / 제약 |\n|---|---|\n| `PlanGrasp` | Score 내림차순 `GraspCandidate[] candidates` |\n| `SelectReachableGrasp` | 동일 snapshot / object / 좌표계 / OBB 후보를 IK, state validity, 두 구간 plan-only 검사 |\n| 선택 결과 | Index, arm, endpoint joint state; 현재 RobotState에 종속되는 trajectory는 반환하지 않음 |\n| `required_arm=left/right` | 재인식에서 해당 팔만 평가 |\n| `required_arm=''` | 가까운 팔부터 양팔 fallback |\n| 다른 required_arm | `ERROR_INVALID_INPUT` |\n\nNearest coordinator는 유효한 distance를 가진 가까운 물체부터 시도합니다. 선택 Action은 gripper나 trajectory를 실행하지 않습니다.\n\n## 손목 RGB 인계와 확인\n\n```mermaid\nsequenceDiagram\n    participant C as Coordinator\n    participant W as ObserveWristTarget\n    C->>W: HANDOFF / head source와 예상 OBB\n    W-->>C: 참조 ID + 새 RGB mask 또는 미검출 / 오류\n    C->>W: CHECK / 같은 arm, source, reference\n    W-->>C: after_stamp_ns 뒤 실제 촬영 header + mask\n    C->>W: CLEAR\n    W-->>C: 참조 해제\n```\n\n| 요청 / 시각 | 계약 |\n|---|---|\n| HANDOFF | Head source ID, 원래 label/confidence, 예상 base-좌표계 OBB → segmentation reference; 별도 손목 detection은 선택 |\n| `expected_pose` | 입력 추정치; header stamp는 원본 head 관측 시각 |\n| 신선도 | `after_stamp_ns`보다 새로운 image/CameraInfo 쌍만 처리 |\n| 측정 범위 | RGB-only header와 mask; depth / 3D 높이 측정값 아님 |\n\n| 응답 status | 의미 | 후속 처리 |\n|---|---|---|\n| `OK=1` | 유효한 검출, `success=true` | 참조 / mask 사용 |\n| `NOT_DETECTED=2` | 새 RGB / CameraInfo / TF로 투영했으나 대응 물체 없음 | CHECK는 기존 ID와 실제 촬영 header, 빈 mask 반환; 다음 새 프레임 재시도 가능 |\n| `ERROR=0` | 센서 / TF / 추론 / 참조 / 중복 후보 / mask 오류 | 단순 미검출로 취급 금지 |\n\nHANDOFF 미검출은 파지 진행용 참조를 만들지 않습니다. Status 필드가 다른 wire/CDR 버전은 제공자와 호출자를 함께 재빌드·재시작하고, 이전 기록은 이전 인터페이스로 읽습니다.\n\n## VerifyPlacement\n\n| 요청 / 응답 | 계약 |\n|---|---|\n| 요청 | Label, destination_id, 방출 이후 `after_stamp_ns` |\n| 결과 | 실제 놓기 확인의 success/message; 열기 명령 성공과 구분 |\n| 현재 제공자 | Simulation oracle; 물체 정답 pose를 조작 코드에 반환하지 않음 |\n| 실물 | 독립 센서 기반 검증 제공자 필요 |\n\n## Contracts\n\n- [Mobile base](../docs/mobile-base.md): `/cmd_vel` 차체 속도 명령\n\n## Mission Runtime 계약\n\n| 인터페이스 | 의미 |\n|---|---|\n| `OfferMission` | mission_id, clean_desk, SEAT, canonical target_id, requested_by; accepted / duplicate / reason / 선택 report_json은 수락 응답 |\n| `CancelMission` | 취소 수락; 실제 종료는 최종 결과로 확인 |\n| `GetRuntimeSnapshot` | 현재 상태와 보존 결과를 snapshot_json으로 반환 |\n| `MissionStatus` | FSM / 외부 phase / BT 단계 / ready / 진단 sequence; Backend의 미션별 sequence와 구분 |\n| `MissionResult` | Outcome, 실패, 완료·skip 작업, 사람 확인, 관측 참조, 주행·복귀 결과, report_json |\n\nMock 관측 ID는 실제 사진이 아닙니다. 이름과 취소·복구 규칙은 [Mission 계약](mission.md)을 따릅니다.\n\n## 개발 관측 메시지\n\n| 메시지 | 내용 |\n|---|---|\n| `DebugBTNode` | ID / parent / kind / status / visited / operation_id |\n| `RuntimeDebugSnapshot` | Header, boot/event sequence, mission/state/ready/reason, BT 노드, versioned snapshot_json |\n| `RuntimeEvent` | Boot/sequence, mission/task/execution ID, kind, data_json |\n\n명령 의미가 없고 인터페이스 빌드만으로 producer가 실행되지 않습니다. [QoS와 상세 필드](#개발-관측-인터페이스)를 참고합니다.\n\n## 설정 및 검증\n\n인터페이스를 추가하거나 변경할 때는 해당 의존 패키지, `package.xml`, 빌드 및 메시지\n호환성 검증을 함께 갱신합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\ncd ros2_ws\ncolcon build --symlink-install --packages-select cleany_interfaces\nsource install/setup.bash\ncolcon test --packages-select cleany_interfaces\ncolcon test-result --verbose\n```\n\n설치된 계약은 `ros2 interface show`로 `InspectScene`, `PlanGrasp`,\n`SelectReachableGrasp`와 관련 message를 확인합니다.\n\n## 관련 KB\n\n- [Technical Overview](../../../../docs/cleany-docs/20_TECHNICAL/00%20-%20Technical%20Overview.md)\n- [System Context](../../../../docs/cleany-docs/20_TECHNICAL/01%20-%20System%20Context.md)\n- [ROS 2 Software Architecture](../../../../docs/cleany-docs/20_TECHNICAL/11%20-%20ROS%202%20Software%20Architecture.md)\n\n## 단일 물체 Manipulation action\n\n실행·취소·조회 명령은 [Skill Executor 실행 안내](../../cleany_skill_executor/docs/manipulation-mock-usage.md)를\n따릅니다. 이 절은 ROS 필드와 종료·기록 상태의 의미를 정리합니다.\n\n### 공개 인터페이스\n\n| 타입 | 기본 ROS 이름 | 역할 |\n|---|---|---|\n| `ExecuteManipulationSkill.action` | `/mock/manipulation/execute_skill` | 승인된 `collect_trash` 또는 `collect_lost_item` 물체 하나의 요청·Feedback·Result·취소 |\n| `GetManipulationExecution.srv` | `/mock/manipulation/get_execution` | execution_id를 받아 found와 최신 record 반환 |\n| `CancelManipulation.srv` | `/mock/manipulation/cancel` | 활성 execution_id와 취소 mode를 받아 accepted와 message 반환 |\n| `ManipulationExecutionRecord.msg` | `/mock/manipulation/execution_events` | 진행·종료·재시작 중단 이벤트 |\n\n[MuJoCo BT 서버](../../cleany_manipulation_bt/README.md)는 같은 계약을 `/sim/manipulation`에서 제공합니다.\n\n이벤트 QoS는 Reliable·Transient Local, depth 100입니다.\n상태·단계·오류의 전체 목록은 [Action 명세](../../cleany_skill_executor/docs/execute-manipulation-skill-action-spec.md)를 따릅니다.\n\n### Goal·Feedback·Result\n\n| 구분 | 확인할 내용 |\n|---|---|\n| Goal | 호출자가 execution_id 발급. snapshot_id/object_id 조합으로 대상 지정 |\n| Feedback | 큰 단계 `stage`, 세부 동작 `substage`, 선택 팔과 진행 설명 |\n| `substage` | Feedback·기록의 현재 세부 동작. 큰 단계 `stage`의 취소·timeout 계약은 유지 |\n| `completed_substages` | 기록에 저장된 완료 세부 동작 목록. 명령 완료와 물체 상태 확인을 구분 |\n| `failed_substage` | Result·기록의 실패 세부 동작. 기존 기록에는 빈 값일 수 있음 |\n| `cancel_mode` | Result·기록의 취소 정책. `IMMEDIATE`, `CHECKPOINT`, `RETURN_ARM`; 취소 요청이 없으면 빈 값 |\n| Result | 종료 status, 오류, 물체·놓은 결과·팔 복귀·정지 근거 |\n| `execution_profile` | 근거를 생성한 실행 환경. 모의 서버는 `mock`, BT MuJoCo 서버는 `mujoco` |\n\n세부 진행 필드 추가 후 서버·클라이언트·모니터를 함께 재빌드하고 재시작합니다.\n이전 SQLite JSON 기록은 세부 진행 필드가 없어도 읽으며 빈 값으로 취급합니다.\n\n`CancelManipulation`은 기본 Action 취소를 내부에서 전달해 ROS 상태도 `CANCELING`으로\n전환합니다. 일반 Action cancel의 기본 정책은 `CHECKPOINT`입니다. 활성 실행 중 모드 선택은\n멱등이며, 이미 요청한 모드를 변경하려면 `IMMEDIATE`로 선점합니다. 즉시 정지는 이후\n요청으로 완화되지 않습니다. 잘못된 ID와 mode, 종료된 실행은 거절합니다.\n\n### 실행 기록 읽기\n\n`ManipulationExecutionRecord`는 Goal, 최신 진행과 Result 필드를 함께 제공합니다.\n\n| 필드 | 의미 |\n|---|---|\n| `record_state` | 아래 표의 기록 상태 |\n| `has_result` | 최종 Action Result 존재 여부 |\n| `human_confirmation_required` | 물리 상태에 대한 사람 확인 필요 여부 |\n| `revision` | 기록 갱신 버전 |\n| `accepted_at_ns`, `updated_at_ns`, `evidence_at_ns` | 수락·갱신·관측 근거 시각. Unix nanoseconds |\n\n| `record_state` | 해석 |\n|---|---|\n| `ACTIVE` | 진행 중 |\n| `FINISHED` | 실행 종료와 최종 Result 확정. 디스크 저장 완료를 보장하지 않음 |\n| `INTERRUPTED` | 재시작 시 발견한 미완료 실행. 가짜 Result를 만들지 않음 |\n| `RECORDING_FAILED` | 이전 구현의 저장 실패 진단. 현재 서버는 새 기록에 사용하지 않음 |\n\n`has_result=false`이면 status/error_code/failed_stage/retryable을 Result로 해석하지 않습니다.\n중단 기록도 마지막 물리 상태와 완료 단계를 보존하며 사람 확인 필요를 표시합니다.\n현재 서버의 조회는 메모리의 최신 기록을 반환합니다. 실행 기록 저장 실패는 경고로 남기고\n실제 실행의 status와 error_code를 유지하며, 조회 성공이 디스크 저장 완료를 보장하지 않습니다.\n단계 deadline은 기록 시각과 별개로 프로세스 단조 시계를 사용합니다.\n\n### 개발 관측 인터페이스\n\n| 토픽 | QoS | 상세 내용 |\n|---|---|---|\n| `mission/debug_snapshot` | Reliable / Transient Local, depth 1 | RuntimeDebugSnapshot, schema 1 JSON: FSM 정의, 모듈별 ready/stopped/reason, 프로필, proposal, 조작 결과, navigation 진단 |\n| `mission/runtime_events` | Reliable / Transient Local, depth 2048 | RuntimeEvent, boot ID와 연속 sequence, 실행 식별자 |\n\nEvent kind는 transition, bt_tick, action_start, action_result, action_cancel_requested, cancel_requested, mission_result입니다. 기존 MissionStatus / MissionResult와 미션 service 계약은 별도로 유지합니다.\n\n## 읽기 전용 snapshot 조회\n\n`GetSceneSnapshot.srv`는 `/perception/get_scene_snapshot`에서 `snapshot_id`를 받아\n`found`, `DetectedObject2DArray detections`, `message`를 반환합니다. 기존 cache만 조회하고\nTTL, 촬영 시각과 객체 번호를 갱신하지 않습니다. 누락/만료는 `found=false`입니다.\n\n\n## 관찰 간 추적\n\n| 식별자 / 필드 | 범위 |\n|---|---|\n| `tracking_session_id` | 같은 고정 베이스 책상 작업; 빈 값이면 추적 비활성 |\n| `track_id`, `tracking_state` | 관찰 사이 연결; snapshot-local 객체 번호와 구분 |\n| `position_valid`, `representative_position` | 대표 3D 위치, 배열의 `representative_frame` 기준; RGB header 좌표계과 구분 |\n| 배열의 session / epoch | 추적 문맥; 선택 3D 결과에도 전달 |\n| `missing_objects` | 마지막 참조 보존; 처음부터 불확실한 대상은 빈 track ID일 수 있음 |\n| Snapshot 조회 / 선택 복원 | 저장된 ID 유지 |\n\n## 개체별 배치 확인\n\n`RegisterPlacementTarget.srv`는 `/sorting/register_placement_target`에서 execution ID,\n목적지, 촬영 header와 관측 OBB·종류로 개체를 고정하고 불투명 `verification_id`를 반환한다.\n`VerifyPlacement.verification_id`가 있으면 그 개체만 확인한다. 미등록·만료 ID는 실패하고\nlabel로 fallback하지 않는다. 빈 ID의 label-only 경로는 종류당 물체 하나인 기존 장면에\n유지한다. 종류 중복 장면은 등록 경로가 필요하다. 인터페이스 변경 후 consumer를 모두 재빌드한다.\n\n## 종류명과 원본 검출 클래스\n\n`DetectedObject2D/3D.label`은 최종 종류명, `detector_label`은 원본 검출 클래스입니다.\n추적은 최종 종류와 원본 검출 클래스의 일치를 함께 확인합니다. `confidence`는\n검출 신뢰도이며 Gemini 분류 확률이 아닙니다. 기존 `sorting_reason`은 유지합니다.\n깊이와 지지면 크기의 단위 및 미측정 값은 [인식 계약](../../cleany_perception/docs/interfaces.md)을 따릅니다.\n필드 추가로 CDR 형식이 바뀌므로 생산자와 소비자를 함께 재빌드해야 합니다.\n\n\n## 실물 준비 자세 계약\n\n`ObserveObjectReference`는 PIN에서 snapshot/object를 고정하고 OBSERVE에서 새 관측을\n검사하며 CLEAR로 해제한다. 응답의 원본 종류명, 검출 클래스는 참조 TTL 동안 보존된다.\n`WristTrackingStatus`는 관찰 상태이며 파지 성공 판정을 대신하지 않는다.\n`ValidatePick` Action은 인식과 후보 선택을 연결하고 모터를 움직이지 않는다.\n`SelectReachableGrasp`의 실물 구현은 선택 팔, 계획 시작 상태와 시간 궤적을 반환한다.\n`required_arm`이 비어 있으면 양팔을 검사한다. 기존 구현은 확장 궤적 필드를 비워둘 수 있다.\n\n`CheckStateValidityBatch`는 한 장면에서 요청의 순서를 유지해 첫 무효 상태까지 검사한다.\n입력 오류와 계산 실패는 `success=false`로 반환한다. 관련 메시지가 확장되므로\n생산자, 소비자를 같은 소스로 재빌드한다. `sorting_reason`과 `PlanGrasp.target_object_header`는 유지한다.\n"},"ros2_ws/src/cleany_interfaces/docs/scene-and-grasp.md":{"title":"Scene와 Grasp 계약","body":"# Scene와 Grasp 계약\n\nScene inspection은 동기 RGB-D snapshot에서 객체를 찾고, Grasp planning은 선택 객체의 후보를 만듭니다. 도달성 선택은 MoveIt plan-only 검사이며 실제 수거 실행과 구분합니다. 필드 원본은 패키지 msg/action/srv입니다.\n\n## Snapshot과 객체\n\n```mermaid\nflowchart TB\n    RGBD[\"동기 RGB-D\u003cbr/>capture stamp / optical frame\"] --> Inspect[\"InspectScene\u003cbr/>검출 → 분할 → 3D 복원 → TF\"]\n    Inspect --> Snapshot[\"Scene snapshot\u003cbr/>snapshot ID / object ID / OBB\"]\n    Snapshot --> Plan[\"PlanGrasp\u003cbr/>target / context cloud\"]\n    Plan --> Candidates[\"Score 순 후보\u003cbr/>같은 snapshot / object / frame\"]\n    Candidates --> Select[\"SelectReachableGrasp\u003cbr/>fresh RobotState / 양팔 IK / 충돌 검사\"]\n    Select --> Check[\"Pregrasp + grasp\u003cbr/>2구간 plan-only\"]\n    Check --> Result[\"후보 / 팔 / endpoint joint state\u003cbr/>실물 구현: 시간 궤적\"]\n    Result -.-> Execution[\"별도 조작 실행 계약\u003cbr/>실제 수거는 별도 검증\"]\n```\n\n| 항목 | 의미 |\n|---|---|\n| 좌표 | m, 오른손 좌표계 |\n| Array header | 전체 객체의 capture stamp, 좌표계 |\n| object_id | Snapshot 내 1부터 시작하는 선택 번호 |\n| snapshot_id | Opaque identifier |\n| OBB pose / size | 중심, 방향 / local X/Y/Z 전체 길이 |\n| Confidence | [0,1] |\n\nInspectScene은 detector → segmenter → 3D reconstruction → TF를 한 번 수행하며 취소할 수 있습니다. 빈 query는 기본 prompt를 사용합니다. 정상 빈 장면은 success=true, ERROR_NONE, objects=[]로 반환합니다. 오류는 timeout, API, JSON, mask, depth, plane, TF, cancel, internal로 구분합니다.\n\n## 후보 생성\n\nPlanGrasp는 snapshot/object ID, target/context cloud, OBB를 직접 받아 숨은 cache에 의존하지 않는다. Cloud는 같은 nonzero capture stamp, frame을 가져야 한다. OBB는 `target_object_header`에 명시한 frame을 사용하고 capture stamp는 cloud와 같아야 한다. OBB와 cloud의 frame은 달라도 되며 각각 capture 시각의 TF를 사용한다. Latest TF로 대체하지 않는다.\n\nPointCloud2는 XYZ float32와 packed RGB float32/uint32를 지원합니다. Step, payload를 검사하고 padded row를 처리합니다. Provider, approach 설정은 cleany_grasping/config가 관리합니다.\n\n| 조건 | 처리 |\n|---|---|\n| 후보 존재 | Score 내림차순 반환 |\n| 후보 없음 | 실패; 가짜 pose 생성 금지 |\n| TCP 회전 | Rigid rotation, det +1 필수; reflection 거절 |\n\n## 도달성 선택\n\nSelectReachableGrasp는 같은 snapshot/object/frame/OBB 후보에 대해 양팔 IK, state validity, pregrasp/grasp 2구간을 검사합니다. 완전하고 fresh한 12관절 RobotState를 사용하고 goal 하나씩 처리합니다. 임시 ACM은 terminal 전에 복원해야 하며 복원 실패는 성공이 아닙니다.\n\n성공 결과는 candidate index, arm, candidate, endpoint joint state다. 실물 선택기는 계획 시작 상태와 시간 궤적도 반환하며 실행 직전 다시 검증해야 한다. 기존 선택기는 확장 궤적 필드를 비워둔다.\n\nPosition-only IK는 목표 orientation 도달을 검증하지 않습니다. MuJoCo 접근 데모도 gripper close, attach, lift 성공을 증명하지 않습니다.\n\n관련 안내: [Planning](../../cleany_moveit_config/docs/planning.md), [실행](../../../../docs/implementation/running.md).\n"},"ros2_ws/src/cleany_logger/docs/data.md":{"title":"Logger 기록 데이터 계약","body":"# Logger 기록 데이터 계약\n\nLogger가 ROS 구독, 가공과 저장을 소유합니다. Monitor는 실시간 표시 / 제어 client와 과거 자료를 읽는 HTTP adapter입니다. 실행은 [런타임](runtime.md), endpoint는 [인터페이스](interfaces.md)를 따릅니다.\n\n```mermaid\nflowchart LR\n    ROS[\"ROS callbacks\"] --> Controls[\"thread-safe RecordingControls / ticket\"]\n    Controls --> Writer[\"Logger 단일 writer worker\"]\n    Writer --> Bag[\"rosbag2 / 원본 CDR\"]\n    Writer --> DB[\"SQLite / 가공 관측과 raw_index\"]\n    Bag --> Reader[\"ArchiveReader / 읽기 전용\"]\n    DB --> Reader\n    Reader --> Monitor[\"Monitor HTTP / 재생\"]\n```\n\nLogger는 Monitor, aiohttp, preview 디코더와 Mission Runtime을 import하지 않습니다. Rosbag2는 첫 원본 쓰기에 로드하며 저장 API와 과거 조회는 ROS 없이 사용 가능합니다. 작업 성공 판정과 MissionJournal 복구 소유권은 생산자 / Mission Runtime에 남습니다.\n\n## 생산자와 저장 소유권\n\n| API | 입력과 계약 |\n|---|---|\n| `ObservationBuffer.put` | 가공 관측의 수신 wall 시각을 초 단위 `received_at`으로 전달할 수 있습니다. 생략하면 현재 wall 시각을 사용합니다. |\n| `RecordingControls` | 항목, 주기, 출처와 원본 큐를 관리합니다. `reserve`로 얻은 ticket을 `offer`에 전달합니다. |\n| `RawMessage` | 토픽, 메시지 타입, 변경하지 않은 CDR bytes, 수신 wall 초, 선택적 ROS stamp 초와 정수 수신 ROS 측정 시각 ns를 전달합니다. |\n| `Recorder.append(snapshot)` | `sequence`, `rows`, 선택적 `gap`이 있는 snapshot을 기록합니다. 각 row는 `seq`, `kind`, `key`, `data`, `received_at`을 포함합니다. |\n| `Recorder.append_raw()` | 제어 큐를 비우고 rosbag2에 쓰며 SQLite에는 원본 위치만 남깁니다. |\n| `Recorder.restore_settings(config)` | 저장된 정책을 현재 출처와 함께 검증해 복원합니다. 없거나 읽을 수 없는 설정은 기본값을 유지합니다. |\n| `Recorder.persist_settings(settings)` | 검증한 정책을 임시 파일, fsync와 rename으로 원자적으로 저장합니다. |\n| `Recorder.start_session()` | 이전 writer를 종료하고 현재 한도와 같은 controls, bag factory로 새 UUID 세션을 엽니다. |\n| `Recorder.close()` | bag을 종료하고 SQLite를 commit한 뒤 닫습니다. |\n| `export_sqlite`, `export_bag` | 가공 DB의 일관된 backup과 종료된 native bag ZIP을 만듭니다. HTTP 응답과 임시 파일 수명은 adapter가 소유합니다. |\n| `ArchiveReader(directory)` | 경로만 보관하며 디렉터리, 설정 파일과 세션을 생성하지 않습니다. |\n| `ArchiveReader.sessions`, `replay`, `raw_message`, `navigation_runs` | 세션 metadata, 시각별 가공 관측, CDR 한 건과 제한된 주행 요약을 읽습니다. |\n\n| 생산자 row 필드 | 계약 |\n|---|---|\n| data | 가공 완료한 JSON 호환 값 |\n| received_at | 수신 wall 초 |\n| received_monotonic | 선택적 표본화 시계 |\n| ros_time / source_id / category / topic_revision | 원본 시각, 개별 기록 선택, 출처 세대 |\n| seq | 같은 생산자에서 증가; 출처 변경 시 topic_revision 증가 |\n\n```mermaid\nsequenceDiagram\n    participant C as RecordingControls\n    participant W as 단일 writer\n    participant P as 생산자\n    W->>C: transition / callback ticket 봉인\n    W->>W: 이전 snapshot과 원본 큐 비우기\n    W->>W: 이전 writer 종료 / 새 UUID 세션 시작\n    P->>W: 새 초기 snapshot\n```\n\nRecorder와 SQLite 연결의 쓰기·종료는 같은 worker thread에서 수행합니다. ROS 콜백은 RecordingControls만 사용합니다. [Monitor 계약](../../cleany_dev_monitor/docs/data.md)은 별도입니다.\n\n## 저장 형식과 시간\n\n| 데이터 | 저장소 |\n|---|---|\n| 선택한 센서 / TF / 시계 / CameraInfo / 로봇 모델 문맥 | `bags/\u003csession>/` 표준 sqlite3 storage |\n| Marker / Cartographer / OccupancyGrid / SLAM matched-point | `bags/\u003csession>/diagnostics/` 별도 bag |\n| 화면 레이어 / Mission / BT / 안전 상태 / 로그 / 리소스 | `\u003csession>.sqlite3` |\n| 원본 토픽 / 타입 / 수신 시각 / bag 측정 시각 | SQLite raw_index; payload 없음 |\n| 기록 정책 | recording-settings.json |\n\n기본 state_directory는 `~/.local/state/cleany/recordings`입니다. `-p state_directory:=/absolute/path`로 바꿉니다. 기존 기록은 자동 삭제하지 않습니다.\n\n| 시간 / 호환성 | 계약 |\n|---|---|\n| 재생 축 | 수신 wall 초; 원본 ROS stamp와 monotonic도 보존 |\n| Bag 측정 시각 | 수신 ROS clock ns; 같은 시각 메시지도 수신 순서로 구분 |\n| ROS clock 역행 / 정체 | 이벤트와 수신 지연으로 표시 |\n| Host wall 역행 | 정밀 재생 미지원 |\n| 과거 SQLite schema 1/2/3 | 수정 / 자동 변환 없이 읽기 유지 |\n\n### 큐, 세션과 실패\n\n| 조건 | 처리 |\n|---|---|\n| Callback 메시지 | 최대 8 MiB |\n| 원본 큐 | 최대 32 MiB / 128건 |\n| 큐 초과 / 쓰기 실패 / 용량 중단 | 유실 수와 raw_gap metadata |\n| Rosbag2 없음 / 쓰기 실패 | 원본 중단; SQLite payload로 대체 안 함 |\n| 용량 계산 | SQLite + 상위/diagnostics bag + WAL 합산 |\n| SQLite bag | resilient preset; 읽기 transaction이 writer를 잠그지 않게 구성 |\n| 정지 후 시작 | 새 UUID |\n| 녹화 중 시작 | 같은 세션 반환 |\n| 정지 | SQLite와 bag writer 닫기 |\n\n```mermaid\nstateDiagram-v2\n    [*] --> not_started\n    not_started --> recording: 첫 원본 쓰기\n    recording --> finalized: 정상 종료\n    recording --> incomplete: 원본 쓰기 미완료\n```\n\n완료된 bag만 ZIP으로 내보내며 상위 bag과 diagnostics를 함께 포함합니다. 상위 bag만 재생하면 진단 토픽은 없습니다. 과거 단일 bag도 같은 원본 조회 API로 읽습니다.\n\n### 구독 독립성\n\n| 입력 | 기록 규칙 |\n|---|---|\n| 원본 구독 | 화면과 카메라 preview lease에 독립 |\n| CameraInfo | 이미지의 형제 camera_info 요청 |\n| TF / 시계 / CameraInfo | Hz 표본화로 누락시키지 않고 수신마다 기록 |\n| 설정 변경 / 새 세션 | Transient-local 구독 재생성으로 retained 자료 요청 |\n\n선택·표본화한 기록이며 전체 ROS 그래프의 무손실 녹화는 아닙니다. 연속 센서 bag은 [매핑 원본 수집](../../../../docs/implementation/how-to/mapping.md#오프라인-slam-비교용-원본-bag)을 따릅니다.\n\n## 조작 이력\n\n| 항목 | 계약 |\n|---|---|\n| 집계 키 / 시간 | Execution record revision과 서버 wall 측정 시각 |\n| 소유 | Logger / Monitor 각각 독립 집계 |\n| 기본 보존 | 최근 20개 실행, 실행당 64구간 |\n| 누락 표현 | 늦은 구독, revision 누락, 시각 역행 구분 |\n| 재생 | 미래에 수신한 결과를 과거 시각에 섞지 않음 |\n| 출처 변경 | 조작 이력과 revision 초기화 |\n| 저장 선택 | 해당 조작 출처의 녹화 선택 적용; Monitor / HTTP 모듈 불필요 |\n\n## 기록 정책\n\n| 정책 | 기준 |\n|---|---|\n| Source schema / 주기 | cleany_logger.sources |\n| 선택 / 프로필 | cleany_logger.recording |\n| 실제 구독 | logger_node의 DDS discovery와 subscription |\n| 큰 원본 | 기본 OFF; 카메라 / 점군 / voxel은 필요한 토픽과 Hz 선택 |\n| 진단 표본화 | source_hz / source_enabled 적용; 0.1 Hz는 10초당 최대 한 건 |\n| SLAM 대상 | slam_trajectory_topic, slam_constraints_topic, slam_submaps_topic, slam_matched_points_topic |\n| 센서와 진단 | Sensor full-rate와 diagnostics 표본화는 독립 |\n| joint_state_topic OFF | 기본 /joint_states로 우회 기록하지 않음 |\n| 세션 한도 | limit_mib 10–10240 MiB |\n| 총량 한도 | total_limit_bytes는 이전 세션까지 포함; 자동 삭제 없음 |\n| 기록 근거 | 세션에 정책, metadata에 큐 폐기 수 보존 |\n\n| Motion 출처 | 토픽 / 주기 |\n|---|---|\n| localization_status_topic | /localization/status String; 기본 2 Hz, 저사양 1 Hz / 정밀 5 Hz |\n| slip_topic | /navigation/slip String, 5 Hz |\n| traction_recovery_topic | /navigation/traction_recovery String, 수신 이벤트 |\n\n정합 점수·이유·속도 제한·복구 진행은 원본으로 저장하며 복구 지도 / 후보 파일은 실행의 runtime/localization/에 둡니다. Slip 출처도 개별 변경·제외와 동일 용량 정책을 적용합니다. [슬립 분석 문맥](../../cleany_navigation/docs/interfaces.md#슬립-관측의-분석-문맥)을 참고합니다.\n"},"ros2_ws/src/cleany_logger/docs/interfaces.md":{"title":"cleany_logger 노드 인터페이스","body":"# cleany_logger 노드 인터페이스\n\n## cleany_logger\n\n실행 파일은 `logger_node`이며 원본은 [노드.py](../cleany_logger/node.py)입니다.\n기본 노드 이름은 `/cleany_logger`입니다. 녹화 제어는 로봇 구동 명령을 생성하지 않습니다.\n\n| 종류 | 기본 이름 | 타입 | 계약 |\n|---|---|---|---|\n| 토픽 발행 | `~/status` | `cleany_interfaces/msg/RecordingStatus` | Reliable, Transient Local, depth 1, steady clock 2 Hz |\n| 서비스 제공 | `~/get_config` | `cleany_interfaces/srv/RecordingControl` | 현재 설정과 writer 상태 조회 |\n| 서비스 제공 | `~/configure` | 같은 타입 | 정지 상태에서만 전체 설정 적용, 선택적 revision 비교 |\n| 서비스 제공 | `~/start` | 같은 타입 | 활성 상태에서는 같은 세션을 반환, 정지 후에는 새 UUID 생성 |\n| 서비스 제공 | `~/stop` | 같은 타입 | 현재 `session_id` 필수, 다른 세션 거절, flush와 종료 후 응답 |\n| 서비스 요청 | `/submap_query` | `cartographer_ros_msgs/srv/SubmapQuery` | 기존 가공 기록 호환을 위한 읽기 전용 Cartographer 조회 |\n\n| 원본 구독 | 계약 |\n|---|---|\n| 입력 / QoS | [Monitor 입력 표](../../cleany_dev_monitor/docs/interfaces.md#cleany_dev_monitor) |\n| 선택 | 자체 discovery의 녹화 선택, 브라우저 / preview lease와 독립 |\n| 허용 타입 | recording.py의 CONTEXT / TYPES; discovery 타입이 달라도 우회 저장 안 함 |\n| 기록 | 지도 / 경로 / 위치 / Runtime / BT / 안전 / 로그 / SLAM / 선택 센서 |\n| 문맥 | TF / clock / CameraInfo / 로봇 모델 함께 요청 |\n\n`RecordingConfig`는 preset, MiB 한도, category별 선택과 주기, source별 토픽과\n선택과 주기를 담습니다. `RecordingSource`의 topics, enabled와 rate_hz 배열은 같은\n원소 순서를 쓰며, 내부 계산 출처는 빈 topics와 한 개의 enabled/rate_hz를 씁니다.\n`rate_hz=-1`은 수신마다 기록한다는 뜻입니다. 그 밖의 유한한 양수만 허용합니다.\n\n`RecordingControl` 요청의 `expected_revision=0`은 비교를 생략합니다. 실패 응답에는\n`success=false`, 사유와 현재 설정과 상태를 담습니다. `request_id`는 호출 식별용이며\n영속 중복 제거 키가 아닙니다. 시작과 정지는 상태와 session ID로 멱등 처리합니다.\n\n상태는 `IDLE`, `RECORDING`, `STOPPING`, `ERROR`를 구분합니다. `boot_id`는 프로세스\n수명, `session_id`는 기록 수명이며 `revision`은 정책과 큐 ticket 세대입니다. `updated_at`과\ncounter의 `received_at`은 wall 초, `stored_bytes`는 세션 SQLite와 bag 합계입니다.\n관측 간격은 logger 설정값이며 Monitor의 호스트 측정 간격과 구분합니다.\n카운터는 새 설정과 새 녹화 시 초기화하고 정지 응답에는 마지막 누적값을 유지합니다.\n\n`record_on_start`, 저장 경로와 한도, 입력 토픽과 좌표계은 ROS parameter입니다. 기본값은\n[logger.yaml](../config/logger.yaml)과 공유 관측기 [observer.py](../cleany_logger/observer.py)를\n따릅니다. HTTP endpoint는 logger에 없습니다.\n\n실물 서버의 heartbeat를 관측할 때는 `manipulation_observation_mode=server`와\n실물 `manipulation_events_topic`을 함께 지정한다. 기본 `mission` 모드는 같은\nrevision의 반복 기록을 무시하며, `server` 모드는 동일한 활성 기록의 수신 시각만\n갱신한다. 완료 기록, 서버 timestamp와 단계 이력은 heartbeat로 바꾸지 않는다.\n\n## CLI\n\n실행 파일 `logger`는 `/cleany_logger_cli_\u003c임의 suffix>` 임시 ROS 노드를 사용합니다.\n[cli.py](../cleany_logger/cli.py)의 명령 처리는 저장 파일을 열지 않으며\n[cli_client.py](../cleany_logger/cli_client.py)가 위 네 서비스를 호출합니다. 별도 logger\n노드가 같은 ROS domain에서 실행 중이어야 합니다. 실행 예시는 [RUNNING](../../../../docs/implementation/how-to/monitoring.md#독립-logger)을 따릅니다.\n\n| 명령 | 계약 |\n|---|---|\n| `status` | `get_config`로 현재 상태, session, 저장 바이트와 counter를 조회 |\n| `start` | 현재 revision을 확인하고 시작, 이미 녹화 중이면 같은 세션 |\n| `stop` | 현재 session과 revision을 조회한 뒤 해당 세션만 정지, `--session`으로 명시 가능 |\n| `topics`, `topics list` | 센서 원본과 가공 출처의 ID, 그룹, 실제 선택 여부, 토픽과 주기 조회 |\n| `topics set \u003cID>` | 정지 상태에서 `--topic`, `--hz`, `--enable`, `--disable` 중 지정한 값만 변경 |\n\n`--node`는 절대 logger 노드 경로이며 기본 `/cleany_logger`, `--timeout`은 RPC별\n발견과 응답을 합한 제한이며 기본 3초입니다. `--json`은 성공 결과를 stdout JSON으로\n출력합니다. CLI 오류와 대용량 원본 안내는 stderr로 출력합니다. 조회 결과의 `settings`는\n전체 정책이며 `topics`의 `enabled`는 상위 그룹과 개별 선택을 함께 반영합니다.\n\n설정은 조회한 revision과 비교해 적용하므로 동시에 바뀐 정책을 덮어쓰지 않습니다.\n상위 그룹이 꺼져 있을 때 하나의 출처를 활성화하면 다른 출처는 꺼진 상태를 유지합니다.\n토픽 변경만으로 기록 선택을 켜지는 않습니다. 설정은 logger가 저장하며 다음 실행에도\n복원합니다. 지원하는 ID는 logger의 출처 schema와 센서 원본 역할에서 제공합니다.\n\n| 종료 코드 | 의미 |\n|---|---|\n| `0` | 조회 또는 요청 완료, 시작은 RECORDING, 정지는 IDLE 확인 |\n| `2` | 잘못된 인자나 설정, ROS Python 의존성 누락 |\n| `3` | 서비스 발견 또는 응답 제한 초과 |\n| `4` | 상태, session, revision 충돌 또는 logger의 요청 거부와 종료 실패 |\n| `130` | 사용자 인터럽트 |\n\nTimeout과 인터럽트는 요청 취소나 정지 완료를 뜻하지 않습니다. 처리 중인 요청이\n완료됐을 수 있으므로 `status`로 확인합니다. CLI 종료는 별도 정지 요청을 보내지 않습니다.\n\n## 실물 매핑 원본\n\n| 출처 | 기본 토픽 | 허용 타입 |\n|---|---|---|\n| wheel_state_topic | /base/wheel_state | WheelState |\n| wheel_command_topic | /base/wheel_command | WheelCommand |\n| joint_state_topic | /joint_states | JointState |\n| canonical_odometry_topic | /odom | Odometry |\n| raw_scan_topic | /scan_raw | LaserScan |\n\n매핑 프로필은 위 입력을 수신마다 /scan, TF, 지도와 같은 Logger 세션에 기록합니다.\n\n운영 녹화는 `/camera/head/color/image_redacted`만 영상 소스로 허용한다. 기존 녹화 설정 복원 시 영상 소스를 이 토픽으로 바꾸며, 실행 중 다른 영상 토픽을 지정하는 설정 요청은 거절한다.\n"},"ros2_ws/src/cleany_logger/docs/runtime.md":{"title":"Logger 실행과 책임","body":"# Logger 실행과 책임\n\n`logger_node`는 대시보드 없이 ROS 입력을 구독하고 녹화하는 독립 프로세스입니다.\n원본 CDR은 rosbag2, 가공 관측과 조회 index는 SQLite에 저장합니다. 수집 정책,\n주행 요약과 조작 이력 집계, 호스트 리소스, 원본 큐, 단일 writer와 세션 종료를 소유합니다.\n대시보드를 종료하거나 다시 열어도 활성 세션은 유지합니다.\n\n```mermaid\nstateDiagram-v2\n  [*] --> Waiting: 프로세스 시작 / lock 획득\n  Waiting --> Recording: 시작 요청 또는 record_on_start\n  Recording --> Closing: 정지 요청\n  Closing --> Waiting: 큐 / SQLite / bag 마감 뒤 응답\n  note right of Recording\n    Monitor 종료는 녹화를 멈추지 않음\n    재시작은 새 UUID로 별도 세션\n  end note\n```\n\n프로세스 간 연결은 [기록과 화면의 소유권](../../../../docs/implementation/how-to/monitoring.md#화면과-기록의-소유권)을 따릅니다.\n\nLogger와 Monitor 서버는 같은 호스트에서 같은 `state_directory`를 사용합니다.\n브라우저는 원격 접속할 수 있습니다. 독립 CLI 실행 파일 `logger`는 ROS 서비스로\n시작, 정지, 상태 조회와 토픽 설정을 제공하며 대시보드를 요구하지 않습니다. 화면의 토픽 선택과 카메라 preview는 녹화 정책을\n바꾸지 않습니다. Monitor에는 writer와 logger 연결 실패 시 대체 녹화 기능이 없습니다.\n\n독립 launch는 `logger.launch.py`, 설정은 `config/logger.yaml`입니다.\n`record_on_start`가 true면 저장된 선택과 주기를 복원해 새 세션을 시작합니다.\nfalse면 대기하며 시작 요청 전에는 세션 DB를 만들지 않습니다. 저장된 active 값은\n재시작 시 자동 적용하지 않습니다. 실행별 새 UUID를 쓰고 기존 세션에 이어 쓰지 않습니다.\n\n저장 디렉터리의 `.logger.lock`은 프로세스 수명 동안 독점하며 중복 logger를 거절합니다.\n비정상 종료된 `recording` bag은 다음 시작 시 `incomplete`로 표시합니다. 자동 삭제나\n손상 bag 복구는 수행하지 않습니다. 정상 정지는 큐, SQLite와 bag 종료가 끝난 뒤 응답합니다.\n\nlogger는 상태 전이와 작업 성공을 판정하지 않으며 Mission Runtime의\n`MissionJournal`을 열거나 갱신하지 않습니다. 실패 코드는 생산자가 보낸 의미를 보존합니다.\n\nROS 계약은 [인터페이스](interfaces.md), 저장 계약은 [데이터](data.md),\n실행 절차는 [RUNNING](../../../../docs/implementation/how-to/monitoring.md#독립-logger),\n검증 절차는 [TESTING](../../../../docs/implementation/testing.md)을 따릅니다.\n"},"ros2_ws/src/cleany_manipulation_bt/README.md":{"title":"cleany_manipulation_bt","body":"# cleany_manipulation_bt\n\n승인된 `snapshot_id/object_id`의 쓰레기 또는 분실물 하나를 MuJoCo에서 수거하는 ROS Action 서버입니다.\n실제 BehaviorTree.CPP 4 실행기가 동작 순서를 소유하고, Python은 기존 인식, MoveIt,\n그리퍼 동작과 SQLite 기록을 연결합니다. Planner와 Mission Manager는 포함하지 않습니다.\n기존 mock 실행에는 이 패키지의 C++ 모듈을 import하지 않습니다.\n\n| 하려는 일 | 안내 |\n|---|---|\n| 빌드·자동 검사 | [빌드와 검증](#빌드와-검증) |\n| 장면 실행·관찰·Goal 요청 | [실행](#실행) |\n| 터미널 출력 조정 | [로그 설정](#터미널-로그) |\n| 실행 검증·취소 | [계약과 증거](#계약과-증거), [취소 방식](#취소) |\n| 결과 조회·모니터 이해 | [기록과 모니터](#기록과-모니터) |\n\n## 빌드와 검증\n\n아래 Make 명령은 레포 루트에서 실행합니다.\n\nUbuntu 22.04 / ROS 2 Humble의 `behaviortree_cpp` 4.x, `pybind11_vendor`, Python 개발\nheader가 필요합니다. 설치는 [개발환경 안내](../../../docs/implementation/development-setup.md)를 따릅니다.\n\n```bash\nmake build-manipulation-bt\nmake test-manipulation-bt\nmake test-manipulation\n```\n\n첫 검사는 실제 C++ 트리와 가짜 backend, DDS Action/취소/조회, snapshot TTL,\n수거 코드 추출 회귀를 검증합니다. 두 번째 mock 검사는 기존 성공/실패/취소/재시작을\n보존하는지 확인합니다. 가짜 backend의 성공은 물리 수거 성공 근거가 아닙니다.\n\n## 실행\n\n기존 스터디카페의 YOLOE head/손목 모델, text encoder, PyTorch/Ultralytics와\n`GEMINI_API_KEY`가 필요합니다. 모델 경로와 인식 준비 조건은\n[기존 수거 실행 안내](../cleany_skill_executor/docs/study-cafe-sorting-usage.md)를 따릅니다.\n키는 코드/ROS parameter에 넣지 않고 실행 환경에서 제공합니다.\n\n```bash\n# 키를 로컬 파일에 설정한 경우에만 사용. 키 자체를 로그에 출력하지 않는다.\nsource ~/.config/cleany/gemini.env\nmake sim-mujoco-manipulation\n# GUI가 필요한 환경: SORTING_ARGS='headless:=false use_rviz:=true'\n```\n\nheadless에서도 기존 GLFW 카메라 renderer에는 유효한 `DISPLAY`가 필요합니다.\nGUI 로그인 터미널에서 실행하거나 Xvfb가 설치된 CI에서\n`xvfb-run --auto-servernum make sim-mujoco-manipulation`을 사용합니다.\n\n| BT 수거함 / 접근 | 계약 |\n|---|---|\n| [manipulation_bins.yaml](config/manipulation_bins.yaml) | 기존 tray 좌표, trash bin Y 외측 180 mm; 자동 sorting의 170 mm 설정과 별도 |\n| 선택 이유 | 관측 OBB의 회전 독립 bounding sphere + 5 mm 여유 검사 |\n| 공유 | Simulator / MoveIt / verifier가 동일 설정 사용 |\n| 적합성 검사 | 팔 이동 전, 접근 전 재관측 때 반복 |\n| Pregrasp | 첫 재관찰 임시 객체 정리, target 접촉 금지, 팔 / gripper 함께 이동 |\n| 접근 | 다시 재관찰 후 target 접촉 허용 |\n| 한계 | 실물 수거함 / 장착 사양 확정 아님 |\n\n```mermaid\nflowchart LR\n    Launch[\"MuJoCo / 카메라 / Perception / MoveIt / BT server\"] --> Idle[\"Goal 대기 / 모든 BT 노드 IDLE\"]\n    Observe[\"관찰 요청 / 승인할 물체 선택\"] --> Goal[\"manipulation_test_client --namespace /sim\"]\n    Goal --> Run[\"지정 물체의 BT RUNNING\"]\n    Idle --> Run\n```\n\n| 실행 경계 | 동작 |\n|---|---|\n| 시작 구성 | Grasp/selection, 지도, 결과 평가기도 시작; 자동 SortingCoordinator.run 미실행 |\n| 대기 중 | 카메라 / depth 지도 갱신, 정상 좌표계 진단 기본 숨김 |\n| 재사용 | 알려진 형상 updater, jaw clearance, 좌표 보정 |\n| PTP 상한 | 속도 / 가속도 scaling 각각 0.08, launch 인자로 조정 |\n| 실패 / GT | Controller 실패 뒤 자동 재실행 없음; 평가 정답을 grasp / 연관 / 계획에 사용하지 않음 |\n\n시뮬레이션 편의 설정이며 실물 안전 검증이 아닙니다.\n\n다른 터미널에서 detector-only 관찰을 요청합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 action send_goal /perception/inspect_scene cleany_interfaces/action/InspectScene \\\n  \"{query: 'Detect objects on the table.', tracking_session_id: 'desk-validation-1', snapshot_id: '', selected_object_id: 0}\"\n```\n\n반환된 실제 snapshot과 쓰레기 object ID를 지정합니다. snapshot cache의 기본 TTL은\n120초이고 최근 두 장만 남습니다. 만료됐으면 새 관찰을 요청해야 합니다.\n\n같은 고정 베이스 책상 작업에는 같은 `tracking_session_id`를 사용합니다. BT는 승인된\nsnapshot의 session/epoch/track ID를 재관측에서도 확인합니다. 베이스 이동 후에는 새 세션을\n시작합니다. 자세한 조건은 [인식 패키지의 물체 추적](../cleany_perception/docs/runtime.md#고정-베이스-책상-물체-추적)을 따릅니다.\n빈 세션은 추적을 끄는 호환 경로이며, 재관측에서 같은 종류가 여러 개면 수거를 중단합니다.\n\n```bash\nros2 run cleany_skill_executor manipulation_test_client \\\n  --namespace /sim --snapshot-id '\u003c실제 snapshot_id>' --object-id 1 \\\n  --destination-id trash_right --timeout 1200\n# 출력된 execution_id로 조회\nros2 run cleany_skill_executor manipulation_test_client \\\n  --namespace /sim --execution-id '\u003cexecution_id>' --query\n# 취소 재현: 위 실행 명령에 --cancel-stage GRASPING 추가\n```\n\n## 터미널 로그\n\n| launch 인자 | 기본값 | 상세 출력 |\n|---|---|---|\n| `log_level` | `info` | `debug`: 후보 평가, 좌표·오차·타이밍, 깊이 지도 프레임 진단 |\n| `backend_log_level` | `warn` | `info`: MuJoCo·MoveIt·TF 초기화와 계획 상세 |\n\n기본 출력에는 준비 완료, 주요 작업 진행, 경고·오류와 컨트롤러 spawner의\n준비 완료가 남습니다.\n\n```bash\nmake sim-mujoco-manipulation SORTING_ARGS=\"headless:=false log_level:=debug\"\n# 외부 backend의 초기화·계획 상세까지 확인\nmake sim-mujoco-manipulation SORTING_ARGS=\"headless:=false log_level:=debug backend_log_level:=info\"\n```\n\n`log_level`은 끌리니 로거와 `move_group.scene_mapping`에 적용합니다.\n`debug`에서도 ROS 내부 대기 루프의 로그는 함께 켜지지 않습니다. 두 옵션은\n`debug`, `info`, `warn`, `error`, `fatal` 중에서 선택합니다.\n\nMoveIt 2.5.9의 종료 시 controller plugin unload 문제를 피하기 위해\n`keep_controller_plugin_loaded:=true`를 기본으로 전달합니다. 적용 범위와 종료\n회귀 검사는 [MoveIt README](../cleany_moveit_config/docs/planning.md#humble-controller-plugin-teardown)를 따릅니다.\n\n## 계약과 증거\n\n| ROS 경로 | 용도 |\n|---|---|\n| `/sim/manipulation/execute_skill` | 기존 `ExecuteManipulationSkill` 계약, `execution_profile=mujoco` |\n| `/sim/manipulation/get_execution` | 기존 `GetManipulationExecution` 조회 계약 |\n| `/sim/manipulation/cancel` | `CancelManipulation`: execution_id와 취소 mode 요청 |\n| `/sim/manipulation/execution_events` | Reliable/Transient Local 기록 이벤트 |\n| `/sim/manipulation/bt_transitions` | 실제 UID, 노드 ID, 이전/현재 상태 JSON |\n| `/perception/get_scene_snapshot` | 읽기 전용 `GetSceneSnapshot`; TTL/촬영 시각 유지 |\n\nAction 이름을 remap하면 내부 취소 client도 같은 이름의 `/_action/cancel_goal`을\n사용합니다. 서버 종료는 진행 중인 tick의 기록 쓰기를 기다린 뒤 DB를 닫으며,\n종료 자체를 정지 확인이나 수거 완료 근거로 기록하지 않습니다.\n\n| 실행 결과 | 근거 |\n|---|---|\n| SUCCESS | 물체 이탈 / 안착 + 팔 복귀 + 최종 정지 |\n| 반복 feedback | 시각과 내용이 같으면 새 표본 아님; 수신 시각 유지, 멈춘 스트림 만료 |\n| 같은 시각 다른 내용 / 시각 역행 | 무효 표본 |\n| Backend 주기 | read/update/write에 같은 시각, 새 simulation 시각에서만 다음 주기 |\n| 진단 | invalid_reasons: repeated_stamp / backward_stamp / missing_velocity / stale_receipt / clock_skew; clock_stopped는 시계 정지 |\n| 실패 / 취소 | 이미 확인한 물체 / 놓기 상태 보존 |\n| FATAL | 정지 미확인, 장치 / 비상정지 / 내부 오류; 후속 Goal 차단 |\n\n[상세 실행 계약](docs/execution-contract.md)이 검사 기준, timeout과 늦은 응답 처리를 관리합니다.\n\n### 취소\n\n일반 Action cancel은 `CHECKPOINT`입니다. `manipulation/cancel` 서비스는\n`IMMEDIATE`, `CHECKPOINT`, `RETURN_ARM`을 제공합니다.\n취소 수락 후에도 이전 동작의 종료와 정지 확인을 기다립니다.\n`RETURN_ARM`은 정지 확인 뒤 필요하면 현재 위치에서 그리퍼를 열고, 실행 시작 때 저장한 팔 자세로 복귀합니다.\n모드별 절차와 제한은 [상세 취소 계약](docs/execution-contract.md#취소)을 따릅니다.\n\n### 정상 수거의 놓기·정지 확인\n\n독립 안착 평가와 새 관절 샘플로 확인하며, 명령 성공이나 취소 응답만으로 정지를 인정하지 않습니다.\n평가기의 `false`는 제한 시간 안의 확인 대기이며, 확인 기한을 넘기면 `UNKNOWN / VERIFICATION_TIMEOUT`입니다.\n`arm_recovered=true`는 실행 시작 자세로의 복귀 근거입니다. 모바일 베이스의 주행 허가는 별도 readiness 계약이 필요합니다.\n판정 조건과 설정은 [놓기·정지 확인](docs/execution-contract.md#정상-수거의-놓기정지-확인)을 따릅니다.\n\n### 예상하지 못한 실행 예외\n\n프로그램 오류는 `INTERNAL_ERROR`로 기록하고 별도 종료 경로에서 정지를 확인합니다.\n정지 처리와 최종 결과는 [실행 예외 계약](docs/execution-contract.md#예상하지-못한-실행-예외)을 따릅니다.\n\n## 기록과 모니터\n\n### 실행 기록\n\n```mermaid\nflowchart LR\n    Event[\"동작 시작 / 완료 관측 / Result\"] --> Memory[\"메모리 최신 기록\"]\n    Memory --> Save[\"SQLite 저장 시도\"]\n    Save -->|실패| Warn[\"경고 / 실제 실행 결과 유지\"]\n    Disk[\"재시작 때 디스크 기록\"] --> Recover[\"ACTIVE → INTERRUPTED / 사람 확인\"]\n```\n\n| 기록 경계 | 계약 |\n|---|---|\n| 기본 DB | $XDG_STATE_HOME/cleany/manipulation_mujoco/executions.sqlite3; 미지정 시 ~/.local/state |\n| 별도 설정 | bt_database_path; mock DB와 분리 |\n| BT 전환 | bt_transitions에 실제 C++ UID / 상태 저장 |\n| 저장 실패 | 동작 중단 / status·error_code 변경 / 후속 차단 원인으로 사용 안 함 |\n| 조회 | 프로세스 메모리 최신값; 디스크 저장 완료를 보장하지 않음 |\n| 재시작 | 미완료를 INTERRUPTED / 사람 확인 필요로 전환, 자동 재개 없음 |\n| 차단 | HELD / UNKNOWN / FATAL이 남으면 후속 Goal 차단 |\n| 복구 / 중복 | 디스크에 저장된 기록만 사용; 미저장 메모리는 유실 |\n| 기동 | DB 초기화 / 읽기 실패 시 서버 시작 안 함 |\n| 새 실행 | 이전 worker와 ROS 요청 종료 필요; 늦은 응답은 기존 context에만 반영 |\n\n### Live 모니터\n\nVS Code BehaviorTree Viewer 0.1.2의 **Monitor**를 사용합니다.\n\n| 서버 | 기본 주소 | 표시 근거 |\n|---|---|---|\n| MuJoCo BT | `127.0.0.1:1667` | 실제 C++ 트리의 UID와 노드 상태 |\n| Mock | `127.0.0.1:1666` | 모의 실행 이벤트를 설계 XML에 투영 |\n\n1. VS Code workspace 설정에 `behaviortreeViewer.monitorHost=127.0.0.1`,\n   `behaviortreeViewer.monitorPort=1667`을 지정합니다.\n2. 기존 Monitor 연결을 끈 뒤 다시 켭니다. 파일명에 `(live)`와 `Monitoring active`가 표시되면 연결된 상태입니다.\n3. [실행](#실행)의 관찰 요청과 Goal 전송을 수행합니다. Goal 전송 전에는 모든 노드가 IDLE입니다.\n\nMuJoCo 포트는 `bt_monitor_port`로 변경합니다. 뷰어의 기본 포트는 1666이므로 MuJoCo 주소를 지정해야 합니다.\n모니터는 FULLTREE/STATUS를 제공합니다. 트리 구조 XML은 실행기 생성 시 한 번 보관하고,\n모니터 조회마다 실제 노드 상태를 읽습니다. 로봇 명령이나 blackboard 변경 기능은 제공하지 않습니다.\n\n실행 종료 후 native BT가 노드를 IDLE로 reset하면 진행 색도 정리됩니다.\n뷰어 0.1.2는 전체 IDLE 상태가 1.5초 이어지면 표시를 흐리게 합니다.\n종료 결과는 조회 서비스에, 상태 전환 이력은 ROS/SQLite에 남습니다.\n\n### 실행 설정\n\n[config/manipulation_mujoco.yaml](config/manipulation_mujoco.yaml)의 ROS parameter로\n동작 상한(180초), 단계별 안착 확인(10초), 정지 평가(10초), 피드백/시계 신선도(2초)와\n지원 label을 조정한다. 이 수치는 첫 시뮬레이션 구현의 조정 가능한 기본값이다.\n전체 물체 수거 성공률이나 실제 하드웨어에 대한 보장을 뜻하지 않는다.\n\n## 시뮬레이션 검증 범위\n\n고정 베이스 MuJoCo에서 단일 컵의 수거함 안착, 팔 복귀와 정지를 확인했습니다. 파지 중 취소하면 물체를 보유한 상태로 정지하고, 사람의 확인이 필요하면 다음 Goal을 거절합니다. 시뮬레이터와 제어기를 일시 정지해 정지를 확인할 수 없는 경우에는 `FATAL / STOP_UNCONFIRMED`를 기록했습니다. [시험 조건과 결과](../../../docs/EVIDENCE.md)\n\n## Jetson 실물 실행\n\n`manipulation_jetson_server`는 실물 수거와 팔 복귀를 실행하고 별도의 SQLite 기록을 유지한다.\n로봇별 수거 JSON과 모션 감시 YAML을 명시적으로 입력한다. 기존 MuJoCo 서버와\n같은 namespace에서 동시에 실행하지 않는다.\n\n실행은 [실물 수거 안내](../cleany_skill_executor/docs/physical-collection.md),\n통신과 복구 요청은 [실물 BT 인터페이스](docs/interfaces.md)를 따른다.\n"},"ros2_ws/src/cleany_manipulation_bt/docs/execution-contract.md":{"title":"MuJoCo Manipulation 실행 계약","body":"# MuJoCo Manipulation 실행 계약\n\n승인된 물체 하나를 실행하는 `execution_profile=mujoco` 서버의 계약입니다. [실행 명령](../README.md)과 [Goal·Feedback·Result 명세](../../cleany_skill_executor/docs/execute-manipulation-skill-action-spec.md)를 함께 확인합니다.\n\n```mermaid\nflowchart TD\n    Goal[\"Goal / 승인된 대상\"] --> Check[\"snapshot / 대상 / 분류 / 목적지 검증\"]\n    Check --> Register[\"개체별 placement target 등록\"]\n    Register --> Execute[\"집기 / 들기 / 운반 / 놓기\"]\n    Execute --> Confirm[\"독립 안착 확인 / 팔 복귀 / 최종 정지\"]\n    Confirm --> Success[\"SUCCESS\"]\n    Execute -->|실패 / timeout / 취소| Stop[\"StopAndAssess\"]\n    Stop --> Terminal[\"이전 동작 terminal 결과 + 새 정지 근거\"]\n    Terminal --> Result[\"최종 Result 한 번 확정\"]\n```\n\n## 실행 순서와 공통 연산의 경계\n\n```mermaid\nflowchart TD\n    Auto[\"SortingCoordinator / 여러 물체 반복\"] --> Sort[\"SortingOperations / 운반과 놓기\"]\n    BT[\"BT / 승인된 물체 하나의 단계와 취소\"] --> Mujoco[\"MujocoOperations / Action 연결\"]\n    Mujoco --> Sort\n    Nearest[\"NearestPregraspCoordinator / 거리순 탐색\"] --> Grasp[\"GraspMotionOperations / 인식과 파지\"]\n    Sort --> Grasp\n    Grasp --> Motion[\"CartesianMotion / 경로와 피드백\"]\n    Grasp --> Grip[\"GripperOperations / 접촉과 보유 검사\"]\n```\n\nBT는 자동 분류 coordinator를 상속하지 않습니다. 두 실행 경로는 같은 운반·놓기 연산과 [입구 적합성 계약](../../cleany_skill_executor/docs/study-cafe-sorting-contract.md#수거함-운반)을 사용하며, BT의 timeout·취소·결과 확정은 Action 실행기가 담당합니다.\n\n## 실행 순서와 결과\n\n[collect_trash_mujoco.xml](../trees/collect_trash_mujoco.xml)이 단계를 관리합니다. BT `FAILURE`와 Action의 BLOCKED/FAILED/CANCELED/FATAL은 서로 다른 의미입니다.\n\n```mermaid\nsequenceDiagram\n    participant BT as C++ BT / steady 20 Hz\n    participant Port as Operation port\n    participant W as Python worker\n    BT->>Port: start(node_id, execution_id)\n    Port->>W: 동작 요청\n    Port-->>BT: operation_id / RUNNING\n    BT->>Port: 후속 tick의 poll(operation_id)\n    W-->>Port: ROS / 추론 / 동작 결과\n    Port-->>BT: 결과\n    Note over BT,W: halt는 cancel(operation_id) 전달\n```\n\nWorker 하나가 동작을 수행해 ROS 응답이나 추론 대기가 tick을 막지 않습니다. 큰 영상·점군과 계획 결과는 실행별 Python context, Blackboard에는 execution ID만 둡니다. [비동기 노드 계약](https://www.behaviortree.dev/docs/tutorial-basics/tutorial_04_sequence/)을 따릅니다.\n\n### 대상 검증\n\n| Skill | 지원 label | 분류 / 목적지 |\n|---|---|---|\n| `collect_trash` | `cup`, `crumpled tissue`; `paper cup`, `disposable paper cup`은 컵 alias | 쓰레기 분류·사유와 정책 목적지 일치 |\n| `collect_lost_item` | `mouse`, `computer mouse`, `wireless mouse`, `lego brick` | `lost_item` 분류·사유 + `lost_items_left` |\n\n두 skill은 같은 집기·이동·놓기·확인 트리를 공유합니다. 원래 label과 분류는 보존하며 정책과 `bt_supported_trash_labels`, `bt_supported_lost_item_labels`에서 허용값을 읽습니다.\n\n| 시점 | 통과 조건 |\n|---|---|\n| 동작 전 | 지정 snapshot, 대상 depth, 분류, 정책과 목적지 유효 |\n| 같은 종류 여러 개 | 유효한 session / epoch / track 필요; 빈 세션의 단일 대상 경로는 종류가 유일해야 함 |\n| 복원 뒤 이동 전 | OBB로 `/sorting/register_placement_target` 등록, verification ID 고정; 불확실하면 차단 |\n| 첫 팔 이동 전 / 접근 전 | 승인 track, 기하 연속성, 분류–skill–목적지 재확인; 다른 개체로 대체 금지 |\n| 거부 | 미지원 대상, review, 분류와 다른 skill, 다른 목적지 |\n\n### 실패와 timeout\n\n| 상황 | 처리 |\n|---|---|\n| 파지 확인 실패 | Lift 시작 안 함 |\n| 보유 상실 / controller 실패 / timeout / feedback·시계 중단 | `StopAndAssess → FinalizeFailure` |\n| 제한 시간 전 결과 없음 | TIMEOUT 기록, 중단 요청; 움직임 전이라도 정지 확인 요구 |\n| Timeout 취소 시작 전에 성공 결과 준비됨 | 경과 시간과 관계없이 기존 성공 처리 |\n| 취소 시작 뒤 늦은 성공 / 취소 완료 | TIMEOUT 유지; 물체 상태·놓기·복귀 근거만 보존 |\n| 늦은 장치 / 비상정지 / 내부 오류 | FATAL, 후속 Goal 차단 |\n| 기한 내 동작 terminal 또는 정지 미확인 | `FATAL / STOP_UNCONFIRMED` |\n| 최종 Result 뒤 관측 | 확정 결과 변경 안 함 |\n\n정지 평가가 먼저 끝나도 이전 동작의 terminal 결과 전에는 Result를 확정하지 않습니다. 이 수집은 기존 정지 기한 안에서만 수행하며, timeout 후 다음 정상 동작이나 취소 후 복귀를 새로 시작하지 않습니다.\n\n## 취소\n\n| Mode | 중단 시점 | 이후 동작 |\n|---|---|---|\n| `IMMEDIATE` | 현재 노드 / 원자 구간 완료를 기다리지 않음 | 정지 확인 후 종료 |\n| `CHECKPOINT` | 현재 checkpoint까지 제한 시간 내 완료 | 잡기+확인, 들기+보유 확인, 놓기+위치/열기/이탈 확인 뒤 다음 단계 차단 |\n| `RETURN_ARM` | 현재 작업에 즉시 중단 요청 | 정지 → 보유 시 현재 위치 놓기 → 팔 복귀 → 최종 정지 |\n\n일반 Action cancel은 CHECKPOINT입니다. 적용 mode를 Result와 실행 기록의 `cancel_mode`에 남깁니다.\n\n```mermaid\nflowchart TD\n    Cancel[\"RETURN_ARM\"] --> Stop[\"StopAndAssess / 이전 작업 terminal 확인\"]\n    Stop --> Arm{\"선택된 팔 있음?\"}\n    Arm -->|아니오| End[\"종료\"]\n    Arm -->|예| Release[\"ReleaseInPlace / 보유 시 열기\"]\n    Release --> Return[\"ReturnArmAfterCancel / 시작 때 저장한 팔 자세\"]\n    Return --> Final[\"StopAfterRecovery\"]\n    Release -->|실패| Reassess[\"다시 정지 평가 / 실패\"]\n    Return -->|실패| Reassess\n    Return -->|IMMEDIATE 선점| Reassess\n```\n\n| RETURN_ARM 경계 | 계약 |\n|---|---|\n| 복귀 계획 | 현재 관절 상태 → 실행 시작 때 저장한 자세; 기존 controller / feedback / timeout 검사 |\n| 현재 위치 놓기 | 열기 완료에 근거한 초기 정책; 놓기 위치 선택과 별도 이탈 관찰은 미확정 |\n| 수거 성공과 구분 | 목적지 이동·안착 검증 없음; 기존 `placement_state`만 보존 |\n| 선점 | 복귀 중 IMMEDIATE가 우선, 뒤의 약한 요청으로 완화 안 함 |\n\nIMMEDIATE/RETURN_ARM도 이전 동작 terminal과 정지를 모두 확인해야 놓기·복귀 또는 최종 확정을 진행합니다. 늦은 실제 실패는 취소보다 우선하며 늦은 성공은 확인 근거만 보존합니다. 기한 내 종료나 정지를 확인하지 못하면 STOP_UNCONFIRMED입니다.\n\n```bash\nros2 service call /sim/manipulation/cancel cleany_interfaces/srv/CancelManipulation \\\n  \"{execution_id: '실행-UUID', mode: 'RETURN_ARM'}\"\n```\n\n테스트 클라이언트는 `--cancel-stage TRANSPORTING --cancel-mode RETURN_ARM`으로 재현합니다.\n\n## 정상 수거의 놓기·정지 확인\n\n```mermaid\nflowchart LR\n    Open[\"controller + joint feedback으로 열림 확인\"] --> Release[\"ConfirmRelease / 방출 뒤 독립 안착 확인\"]\n    Release --> Return[\"팔 복귀\"]\n    Return --> Verify[\"VerifyPlacedObject / 새 시각 기준 재확인\"]\n    Verify --> Stop[\"모든 Action 종료 + 새 관절 표본\"]\n    Stop --> Success[\"SUCCESS\"]\n```\n\n평가기의 false는 확인 대기입니다. 제한 시간 안에 안착 근거를 얻지 못하면 `placement_state=UNKNOWN / VERIFICATION_TIMEOUT`입니다. SUCCESS에는 독립 방출·안착, 팔 복귀와 최종 정지가 모두 필요합니다.\n\n### 정지 근거\n\n| 대상 | 요구 조건 / 무효 처리 |\n|---|---|\n| ROS Action | 모두 terminal; cancel 응답만으로 정지 인정 안 함 |\n| 관절 기록 | 양팔과 양 gripper의 sensor stamp + 단조 시계 수신 시각을 관절별 보관 |\n| 부분 메시지 | 포함 관절만 갱신; 양팔이 별도 메시지여도 새 표본으로 합산 가능 |\n| 무효 표본 | 속도 누락, 비정상 값, 중복 이름, 반복 / 역행 stamp |\n| 새 확인 표본 | 모든 필수 관절이 이전 확인 이후 새 정보를 제공해야 함 |\n| 연속 유지 | 전 관절 속도 이내 + Action 종료가 연속 횟수와 유지 시간을 모두 충족 |\n| 구간 재시작 | 오래된 정보, 움직임 또는 미종료 Action |\n\n[manipulation_mujoco.yaml](../config/manipulation_mujoco.yaml)의 초기값입니다. 실물 안전 기준으로 사용하지 않습니다.\n\n| ROS parameter | 기본값 | 의미 |\n|---|---|---|\n| `bt_stop_timeout_sec` | 10 s | 정지 확인 기한 |\n| `bt_stop_feedback_max_age_sec` | 0.5 s | 관절별 수신 경과 / stamp 허용 오차 |\n| `bt_stationary_duration_sec` | 0.25 s | 단조 시계 최소 유지 |\n| `arm_stationary_samples` | 5 | 모든 관절의 새 표본 연속 횟수 |\n| `arm_stationary_velocity_rad_s` | 0.02 rad/s | 팔 / gripper 정지 속도 |\n\n| 오류 우선순위 | 결과 |\n|---|---|\n| HARDWARE_ERROR / E_STOP / INTERNAL_ERROR / STOP_UNCONFIRMED 관측 | 즉시 후속 실행 차단, 사람 확인 필요 |\n| 위 오류 뒤 정지 확인 성공 | FATAL과 원래 오류 유지 |\n| 움직임 뒤 정지 확인 실패 | 최종 STOP_UNCONFIRMED 우선, 원래 원인은 message에 보존 |\n\n## 예상하지 못한 실행 예외\n\n| 예외 | 분류 |\n|---|---|\n| 명시적 `OperationError` | 원래 오류 코드 유지 |\n| 하위 동작의 정확한 `RuntimeError`, `ValueError` 및 `InfrastructureError`, `CartesianPlanningError`, `LiftRedetectionError` | 기존 준비 / 대상 / 이동 / 파지 실패 분류 |\n| 그 밖의 예외 | 발생 노드·종류·내용을 INTERNAL_ERROR로 기록 |\n| AttributeError / TypeError / KeyError / NotImplementedError / RecursionError | 일반 동작 실패로 바꾸지 않음 |\n| 보유 접촉 검사 |
