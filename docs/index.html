const pages = {"README.md":{"title":"Cleany 로봇 소프트웨어","body":"# Cleany 로봇 소프트웨어\n\nROS 2 주행과 매핑, 센서 관측, 물체 조작 시뮬레이션, ESP32 구동을 개발합니다.\n\n**[문서 홈](docs/index.md) · [브라우저로 문서 읽기](docs/index.html) · [개발환경 설치](docs/DEVELOPMENT_SETUP.md) · [팀 KB](docs/cleany-docs/README.md)**\n\n\n## 바로 시작하기\n\n| 목표 | 안내 |\n|---|---|\n| 처음 빌드·실행 | [개발환경](docs/DEVELOPMENT_SETUP.md) |\n| 센서 입력과 인식 확인 | [센서 가이드](docs/how-to/sensors.md) |\n| 물체 관찰·계획·조작 | [조작 가이드](docs/how-to/manipulation.md) |\n| MCU와 휠 구동 확인 | [베이스 가이드](docs/how-to/base.md) |\n| 휴대폰 목표 주행 | [화면으로 따라 하기](docs/how-to/phone-navigation.md) |\n| 하드웨어로 지도 만들기 | [매핑 실행](ros2_ws/src/cleany_bringup/docs/hardware-mapping.md) |\n| 시스템과 ROS 연결 이해 | [연동 구조](docs/INTEGRATION.md), [Navigation 구성](ros2_ws/src/cleany_navigation/README.md) |\n| 시뮬레이터 실행 | [시뮬레이션](docs/how-to/simulation.md) |\n| 기록과 상태 관측 | [Logger·Monitor](docs/how-to/monitoring.md) |\n| 코드 변경 검증 | [검증 안내](docs/TESTING.md) |\n\n기준 환경은 Ubuntu 22.04, ROS 2 Humble, Python 3.10, Gazebo Fortress입니다. 저장소 루트의 Humble 터미널에서 시뮬레이션을 시작합니다.\n\n```bash\ngit submodule update --init --recursive docs/cleany-docs\nsource /opt/ros/humble/setup.bash\nmake deps-gazebo\nmake test-gazebo\nmake sim-gazebo\n```\n\n전체 workspace는 `make deps`, `make build`, `make test`를 사용합니다. 명령의 범위와 준비 조건은 [개발환경](docs/DEVELOPMENT_SETUP.md)과 [검증 안내](docs/TESTING.md)를 따릅니다. 시뮬레이션과 실물 동작은 구분해서 확인합니다.\n\n## 코드와 문서\n\n| 위치 | 역할 |\n|---|---|\n| `ros2_ws/src/` | ROS 패키지, core, launch와 설정 |\n| `esp32/` | MCU 펌웨어, 빌드·업로드, 배선 |\n| `tests/`, `tools/` | 통합 검사와 개발·분석 도구 |\n| `docs/` | 작업 가이드와 시스템 설명 |\n| 각 패키지 `docs/` | 인터페이스, 설정, 단위와 동작 조건 |\n| `docs/cleany-docs/` | 제품 범위와 설계 결정을 관리하는 별도 KB |\n\n문서 사이트는 `docs/index.html`을 브라우저에서 열면 됩니다. Markdown을 수정한 뒤 `python3 tools/docs/build_site.py`로 갱신하며, `--check`로 원본과 일치하는지 확인합니다. 빌드·실행 원본의 로컬 경로는 팀 공유 위치를 의미하지 않습니다.\n"},"docs/CALIBRATION.md":{"title":"캘리브레이션 작업 가이드","body":"# 캘리브레이션 작업 가이드\n\n측정할 대상을 먼저 고릅니다. **관측·분석 결과를 얻는 것과 실제 보정값을 적용하는 것은 별도 작업**입니다.\n\n| 확인하려는 것 | 작업 | 결과 |\n|---|---|---|\n| D435와 LiDAR가 같은 벽을 보는가? | [벽 비교](#d435와-lidar-벽-비교-및-헤드-관절-관측) | 거리·법선 잔차 |\n| 휠 odom과 실제 관측 이동이 다른가? | [bag 분석](#bag-기반-슬립-의심-구간-분석) | 의심 구간·판정 불가 구간 |\n| 저장된 카메라·관절 보정값을 쓰려는가? | [기존 프로필 적용](#jetson-실물-모델과-2026-10-09-보정-프로파일) | 보정된 모델 TF |\n| 새 Hand-eye 데이터를 수집하려는가? | [수집과 평가](#hand-eye-수집과-평가) | 검토용 변환과 평가 |\n| ToF 장착·정지 조건을 정하려는가? | [Commissioning](#tof-근접-보호-commissioning) | 실측에 근거한 로봇 설정 |\n\n## D435와 LiDAR 벽 비교 및 헤드 관절 관측\n\n로봇을 **동일한 평평한 벽 앞에 정지**시킨 상태에서 비교합니다. Humble, NumPy, matplotlib, pyserial과 실제 영상·CameraInfo·`/scan_raw` 입력이 필요합니다.\n\n![D435와 LiDAR의 벽 투영, 거리 차이와 법선 각도 비교 출력](assets/examples/calibration-wall.png)\n\n왼쪽은 두 센서의 벽 투영, 가운데는 카메라−LiDAR 거리 차이, 오른쪽은 수평 방향 차이와 카메라 벽 법선 기울기입니다. **기록된 출력 예시이며, 그림의 수치를 합격 기준으로 사용하지 않습니다.**\n\n```mermaid\nflowchart LR\n  Encoder[\"헤드 encoder / ID 13·14\"] --> TF[\"촬영 시각의 카메라 TF\"]\n  Depth[\"D435 깊이 영상\"] --> Wall[\"벽 거리·법선 비교\"]\n  TF --> Wall\n  Scan[\"LiDAR scan\"] --> Wall\n  Wall --> Result[\"비교 PNG / JSON\"]\n```\n\nUSB by-id·모터 ID와 [헤드 설정](../tools/validation/config/d435_pan_tilt.json)을 검토한 뒤 실행합니다. 기존 차체→카메라 고정 TF 발행자는 중복 실행하지 않습니다.\n\n```bash\n# 터미널 A: 읽기 전용 관절 관측\npython3 tools/validation/head_pan_tilt_probe.py \\\n  --config tools/validation/config/d435_pan_tilt.json\n# 터미널 B: 자료 수집 후 비교. 사용할 새 경로로 바꿉니다.\npython3 tools/validation/capture_depth_lidar.py --output /path/to/new/capture\npython3 tools/validation/compare_depth_lidar_wall.py \\\n  --capture /path/to/new/capture --mount tools/validation/config/d435_cad_mount.json\n```\n\n결과 폴더의 `index.html`, `wall-comparison.png`, `wall-comparison.json`에서 잔차와 분석 조건을 함께 확인합니다.\n\n| 결과·모드 | 의미와 한계 |\n|---|---|\n| 실제 관절 TF 있음 | 카메라 시각과 150ms 이내인 TF 사용. 없으면 공칭 자세 비교로 표시 |\n| 거리·법선 잔차 | 한 벽으로 높이·벽에 평행한 이동을 검증할 수 없음. 벽 기울기와 장착 오차도 분리할 수 없음 |\n| 기본 실행 | 읽기 전용. `/head/joint_states`와 동적 TF 발행. 휠 `/joint_states`와 분리하며 피드백 지연·오류 시 종료 |\n| `--exercise --output …` | **실제 헤드 모터 시험.** 다른 버스 소유자 종료, 차체 정지와 주변 공간 확인 후 별도 실행 |\n| 시험 전 검사 | 토크 OFF, 모델 777, 위치 모드, 오류 없음과 온도 확인 |\n| 시험 동작·종료 | 현재 자세 부근 축별 ±5°. EEPROM은 쓰지 않으며 종료 시 토크 OFF 확인. 복귀 실패 시 추가 이동 없이 토크 OFF |\n| 남는 RAM 설정 | 가속도 5, 속도 80tick/s, 토크 한도 300과 마지막 목표값. `--poses`로 미확인 자세만 별도 시험 가능 |\n\n이 도구는 costmap이나 보정값을 자동 변경하지 않습니다. 광학 TF는 RealSense 드라이버가 계속 소유합니다.\n\n## bag 기반 슬립 의심 구간 분석\n\n```mermaid\nflowchart LR\n  Odom[\"기록된 wheel odom\"] --> Align[\"같은 시각·차체 좌표로 비교\"]\n  Scan[\"기록된 LiDAR\"] --> ICP[\"휠 초기값 없는 ICP\"]\n  ICP --> Align\n  Align --> Quality{\"정합·시간 품질 유효?\"}\n  Quality -->|\"아니오\"| Unknown[\"unknown\"]\n  Quality -->|\"예\"| Decision[\"이동 벡터 오차·연속 창 판정\"]\n```\n\nHumble과 기록 당시 custom message overlay를 source합니다. NumPy, SciPy와 PyYAML을 사용하며, 입력 bag에는 `/scan_raw`, `/odom`, `/tf_static`이 필요합니다. `/base/wheel_state`는 선택적인 보조 통계입니다.\n\n```bash\npython3 tools/validation/slip_detection.py \\\n  --bag /path/to/bag_directory \\\n  --start 2026-11-06T07:22:40+09:00 --end 2026-11-06T07:30:25+09:00 \\\n  --output /path/to/new_analysis_directory --jobs 2\n```\n\n| 확인할 것 | 위치·해석 |\n|---|---|\n| 사건과 창별 판정 | `summary.json`, `windows.jsonl`을 함께 확인 |\n| 입력·설정 식별 | `manifest.json`. 원본은 읽기 전용 snapshot으로 열며 기존 출력은 덮어쓰지 않음 |\n| 판정 기준 | [slip_detection.json](../tools/validation/slip_detection.json). 다른 설정은 `--config`, 형상은 `--mask-file`로 지정 |\n| 같은 입력 재분석 | `--bag` 대신 `--cache …/inputs.npz` 사용 |\n| `unknown` / `no_evidence` | 각각 품질 부족 / 해당 기준에서 증거 없음. 정상·슬립 없음의 확정 판정이 아님 |\n| 적용 한계 | 슬립과 걸림을 구별하는 진단이 아님. 느린 슬립·끌림, scan 중 움직임·가림에 한계. per-beam deskew 없음 |\n\n겹치는 창은 독립 표본이나 정확한 사건 시작 시각으로 해석하지 않습니다. 이 도구는 명령·TF·보정값을 발행하거나 수정하지 않으며, 제어 연동에는 별도 실시간 검증이 필요합니다.\n\n## Jetson 실물 모델과 2026-10-09 보정 프로파일\n\n[jetson_20261009](../ros2_ws/src/cleany_description/config/calibration/jetson_20261009)는 **잠정 보정 프로필**입니다. 실제 장착이 달라졌다면 재검증해야 합니다. CAD 마운트 변경만으로 보정이 갱신되는 것은 아닙니다.\n\n| 자료 | 적용 범위 |\n|---|---|\n| `*_extrinsics.yaml` | 헤드 RGB·양손목 optical TF. `parent_T_child`는 child→parent 변환, m·rad 단위 |\n| `arm_joint_calibration.yaml` | 팔 영점·방향·오프셋의 기준. `q = direction × (tick − zero) × 2π/4096 + offset` |\n| `head_joint_calibration.json` | 헤드 pan/tilt 기준과 방향. 수동 영점이며 회전축 추정값은 아님 |\n| `intrinsics/`, `motors/`, `reference/` | 원본·참고 자료. 아래 launch가 CameraInfo를 발행하거나 모터 영점을 적용하지 않음 |\n\n```bash\nros2 launch cleany_description description.launch.py \\\n  use_sim_time:=false calibration_profile:=jetson_20261009\n```\n\n`robot_state_publisher`만 실행하므로 `/joint_states`는 별도로 필요합니다. 기본 `calibration_profile`은 빈 문자열이며, 명목 TF를 사용합니다. 보정은 optical frame에 적용하고 카메라 mesh와 헤드 depth frame의 명목값을 옮기지 않습니다. EEPROM homing offset을 관절식에 이중 적용하지 않습니다.\n\n카메라 평가는 고정 보드 가정의 일관성 검사입니다. RMS·수집 조건은 각 보정 YAML을 따르며, `absolute_calibration_verified: false`를 유지합니다. 절대 위치 정확도·노출 동기화·관절 절대각이 검증됐다는 의미는 아닙니다. [모델과 좌표 규약](../ros2_ws/src/cleany_description/docs/model.md)도 확인하세요.\n\n## Hand-eye 수집과 평가\n\n[수집·오프라인 평가 도구](../ros2_ws/src/cleany_handeye_calibration/docs/offline-tools.md)와 [좌표·저장 계약](../ros2_ws/src/cleany_handeye_calibration/docs/frames-and-data.md)을 따릅니다. 결과는 검토용으로 저장하며 TF에 자동 적용하지 않습니다.\n\n## ToF 근접 보호 commissioning\n\n[ToF 기본 설정](../ros2_ws/src/cleany_tof/config/tof.yaml)은 미실측 후보입니다. 초기 관측은 모터를 분리하거나 바퀴를 띄우고 수행합니다.\n\n| 시험 | 측정·확인 항목 |\n|---|---|\n| 장착·방향 | 작은 표적을 각 native zone에 이동. flip, roll/pitch/yaw, 위치·유효 FOV |\n| 거리·평면 | 알려진 평판의 거리·기울기, sigma·residual, 접근 거리·yaw 오차. 선택 ROI가 책상 전면을 보는지 확인 |\n| 표면·사각 | 빈 공간·검정·유리·금속·햇빛·다리·얇은 물체의 유효율, `NO_RETURN`, 불신뢰, ROI 높이. 다른 센서와 함께 놓치는 경우 포함 |\n| 시간·단절 | USB 부하·read 지연·재연결·watchdog. first-frame offset 불확실성도 reaction budget에 포함 |\n| 실제 제동 | 감독자·독립 E-stop이 있는 통제 공간에서 payload·바닥·배터리별 전후·횡이동·회전의 최악 제동거리와 감속도 하한 |\n| 접근·취소 | 저속·비스듬한 평판·가림, Nav2 동시 goal, cancel, Mission/Supervisor/guard 재시작, lease 회수와 완료 후 정지 유지 |\n| ROI 필터 | 바닥·몸체 return 구분. 15Hz에서 인접 수·cluster 거리·confirm/release·hysteresis 조정. 비상 단일 return과 일반 검출의 지연·오탐·미탐 분리 |\n| 책상 품질 | 분산된 유효 row/column·최소 폭·residual. 일부 불량에서 평면 유지와 평면 소실 시 zero/abort 구분 |\n\n실측으로 `deceleration`, `reaction_s`, footprint와 margin을 정하고 근거·설정을 보존한 뒤에만 `calibrated=true`를 적용합니다. 약 3.5m 미검출은 검출 범위·빈 공간의 보장이 아닙니다. ToF만으로 평면 좌우 중심은 관측할 수 없으므로 staging과 팔 도달성은 별도로 검증합니다. [상태·필터·제동 계약](../ros2_ws/src/cleany_tof/docs/interfaces.md)을 따릅니다.\n\n## D435 미리보기의 LiDAR 높이 하한\n\n| 좌표 기준 | 값과 의미 |\n|---|---|\n| 카메라 CAD 공칭 높이 | CAD 원점에서 1.0218m. 바닥 z=−0.0955m를 적용한 추정 지상 높이는 약 1.1173m |\n| 기존 LiDAR 평면 규약 | Z=0. 실제 장착 높이 측정값과 구분 |\n| D435 필터의 `min_base_z` | `base_link` 기준 0.192m = 하우징 바닥 0.150 + 레이저 오프셋 0.042m. 추정 지상 높이는 0.2875m |\n\nD435 점군은 촬영 시각의 실제 head encoder TF로 변환합니다. 높이 하한은 로봇 좌표에 고정되어 tilt·바닥 평면 추정에 따라 바뀌지 않습니다. **하한보다 낮은 물체도 제외**되므로 낮은 장애물 검출을 보장하지 않습니다. 측정 바닥면은 표시 grid와 상한 기준으로만 사용하며, 위 값은 CAD 기반 추정입니다.\n"},"docs/DEVELOPMENT_SETUP.md":{"title":"Cleany 개발환경 설치 가이드","body":"# Cleany 개발환경 설치 가이드\n\n\n| 처음 준비할 것 | 바로가기 |\n|---|---|\n| 운영체제와 ROS 버전 | [기준 환경](#기준-환경) |\n| 의존성·빌드 | [rosdep 준비](#5-rosdep과-workspace-의존성-준비), [빌드 경로](#6-빌드와-출력-경로) |\n| 설치 후 첫 실행 | [실행 선택](RUNNING.md) |\n\n새 Ubuntu native ROS 개발환경을 아래 순서로 구성합니다. VM 이미지는 별도로 배포하지 않습니다.\n\n## 기준 환경\n\n| 항목 | 기준 |\n|---|---|\n| OS | Ubuntu 22.04 LTS (Jammy) |\n| ROS | ROS 2 Humble Desktop |\n| Python | Ubuntu 기본 Python 3.10.x |\n| Gazebo | Fortress (Ignition Gazebo 6.x) |\n| Shell | Bash |\n| 기본 실행 방식 | VM의 native 환경 |\n\nROS 2 Humble은 Ubuntu 22.04의 amd64와 arm64를 Tier 1 플랫폼으로 지원합니다. ROS의 system Python은 유지하며 Python 가상환경으로 대체하지 않습니다.\n\n[CI workflow](../.github/workflows/ci.yml)는 [전용 이미지](../containers/ci/Dockerfile)에 설치한 Humble package 의존성으로 자동 검사를 실행합니다. 이미지 갱신과 컴파일 캐시는 [테스트 가이드](TESTING.md#ci-실행과-재사용)를 따릅니다. GUI와 실물 동작은 별도 검증이 필요합니다. 설치 전에 아래 명령으로 현재 버전을 확인합니다.\n\nCI 의존성은 Jetson에서 확인한 ROS upstream 버전과 MuJoCo, google-genai의 Python 의존성을 기준으로 고정합니다.\nCI 이미지의 apt 저장소는 고정 snapshot을 사용합니다. 아래 native 설치 명령은 현재 apt 저장소를 사용하므로 CI와 동일한 세부 버전을 보장하지 않습니다.\n\n```bash\nlsb_release -ds\npython3 --version\n```\n\n## 1. Ubuntu 기본 설정\n\nUTF-8 locale과 ROS 저장소 등록에 필요한 도구를 준비합니다.\n\n```bash\nsudo apt update\nsudo apt install -y locales software-properties-common curl\nsudo locale-gen en_US en_US.UTF-8\nsudo update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8\nexport LANG=en_US.UTF-8\nsudo add-apt-repository universe\n```\n\n## 2. ROS 2 apt 저장소 등록\n\nROS 공식 `ros2-apt-source` 패키지로 keyring과 apt source를 등록합니다.\n\n```bash\nROS_APT_SOURCE_VERSION=\"$(\n  curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest \\\n    | grep -F '\"tag_name\"' \\\n    | awk -F'\"' '{print $4}'\n)\"\ncurl -L -o /tmp/ros2-apt-source.deb \\\n  \"https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo \"${UBUNTU_CODENAME:-${VERSION_CODENAME}}\")_all.deb\"\nsudo dpkg -i /tmp/ros2-apt-source.deb\n```\n\n## 3. ROS 2 Humble과 개발도구 설치\n\n```bash\nsudo apt update\nsudo apt upgrade -y\nsudo apt install -y ros-humble-desktop ros-dev-tools python3-pip git make\n```\n\n현재 terminal에 ROS 환경을 적용합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\n```\n\n새 terminal마다 자동 적용하려면 아래 한 줄을 `~/.bashrc`에 추가합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\n```\n\n설치 결과를 확인합니다.\n\n```bash\ntest \"${ROS_DISTRO}\" = \"humble\"\npython3 --version\ncommand -v ros2 colcon rosdep\nros2 doctor --report\n```\n\nPython 3.10.x와 `ROS_DISTRO=humble`을 확인합니다.\n\n## 4. 레포지토리 준비\n\nGitHub에 SSH key를 등록한 뒤 submodule과 함께 clone합니다.\n\n```bash\ngit clone --recurse-submodules git@github.com:asm17-moving-agent/cleany.git\ncd cleany\n```\n\n이미 clone한 레포지토리에서는 submodule을 초기화합니다.\n\n```bash\ngit submodule update --init --recursive\n```\n\n## 5. rosdep과 workspace 의존성 준비\n\nMachine에서 rosdep을 처음 사용한다면 초기화합니다. 이미 초기화됐다는 메시지가 나오면 이 단계를 건너뜁니다.\n\n```bash\nsudo rosdep init\nrosdep update\n```\n\n의존성은 공식 rosdep 규칙을 사용합니다. MuJoCo Python 패키지는 `python3-mujoco-pip` 키로 설치합니다.\n\n새 인식 경로의 `google-genai`는 로컬 rosdep DB에 공식 키가 없어 [전용 규칙](../ros2_ws/rosdep/cleany.yaml)을 사용합니다. 저장소 루트에서 등록한 뒤 DB를 갱신합니다. MuJoCo는 이 규칙에 포함하지 않습니다.\n\n```bash\nprintf 'yaml file://%s/ros2_ws/rosdep/cleany.yaml\\n' \"$PWD\" | sudo tee /etc/ros/rosdep/sources.list.d/10-cleany.list\nrosdep update\n```\n\n레포지토리 루트에서 workspace 의존성을 설치합니다.\n\n```bash\nmake deps\n```\n\n| 기능 | `make deps`로 설치하는 의존성 |\n|---|---|\n| Native depth self-filter | Manifest의 `python3-dev` 개발 헤더 |\n| 계획, 제어 | MoveIt 2, KDL, OMPL, ros2_control, joint_trajectory_controller |\n| MoveIt 내부 충돌 검사 | cleany_moveit_collision manifest의 libfcl-dev, geometric_shapes, pluginlib |\n| Hand-eye backend | cleany_mujoco_sim manifest의 mujoco_ros2_control |\n| 단일 물체 MuJoCo Action | BehaviorTree.CPP 4.x, pybind11_vendor, python3-dev |\n| Mock Action 트리 모니터 | python3-zmq; VS Code 확장의 native ZeroMQ 의존성은 별도 |\n\n`cleany_manipulation_bt`는 BehaviorTree.CPP 4.x를 사용합니다. Humble Navigation의\n`behaviortree_cpp_v3`와 별도 패키지이며 두 major 버전을 함께 설치할 수 있습니다.\n개별 설치와 빌드는 다음 명령을 사용합니다.\n\n```bash\nsudo apt install ros-humble-behaviortree-cpp ros-humble-pybind11-vendor python3-dev python3-zmq\nmake build-manipulation-bt\n```\n\nGemini 인식으로 MuJoCo Action을 실행할 터미널에는 `GEMINI_API_KEY`를 설정합니다.\n로컬 파일을 사용한다면 권한 `600`의 `~/.config/cleany/gemini.env`에 `export` 문을\n보관하고 실행 전에 source합니다. 모델 준비는 [인식 reference](../ros2_ws/src/cleany_perception/docs/runtime.md#모델-준비)를 따릅니다.\n\n아래 명령으로 runtime package 설치를 확인합니다.\n\n```bash\nros2 pkg prefix moveit_ros_move_group\nros2 pkg prefix moveit_kinematics\nros2 pkg prefix moveit_planners_ompl\nros2 pkg prefix controller_manager\nros2 pkg prefix joint_trajectory_controller\nros2 pkg prefix mujoco_ros2_control\n```\n\nGazebo만 준비할 때는 다음 target을 사용합니다.\n\n```bash\nmake deps-gazebo\n```\n\n시설 CLI는 `cleany_gazebo_sim`에 포함됩니다. NumPy, SciPy, Pillow, PyYAML은 manifest와 rosdep으로 설치하며, 빌드 후 `ros2 run cleany_gazebo_sim`으로 실행합니다.\n\n`deps-gazebo`는 MuJoCo parity-test용 `python3-mujoco-pip` 키를 제외합니다. 전체 테스트를 준비할 때는 `make deps`를 사용합니다.\n\n일반 설치는 manifest 기반의 `make deps-gazebo`를 사용합니다. Rosdep이 Gazebo 의존성을 해석하지 못할 때는 아래 APT 패키지를 직접 확인합니다.\n\n```bash\nsudo apt update\nsudo apt install -y ros-humble-ros-gz-sim ros-humble-ros-gz-bridge\n```\n\n## 6. 빌드와 출력 경로\n\n`CLEANY_BUILD_ROOT`는 빌드 캐시, `CLEANY_DATA_ROOT`는 실행 환경별 로컬 데이터\n경로다. 데이터 경로를 지정하지 않으면 Makefile이 인접한 `cleany-data` 경로를\n선택한다. 이 기본값은 팀 공유 위치를 의미하지 않는다. 실제 경로는\n`make -s print-build-root`와 `make -s print-data-root`로 확인한다.\n입력 자료와 결과를 팀에 공유할 때는 별도로 합의한 위치와 접근 방법을 사용한다.\n\n로컬 데이터 경로를 지정하려면 아래 값을 사용할 경로로 바꾼다.\n\n```bash\nexport CLEANY_DATA_ROOT=\"/path/to/local-data\"\n```\n\n```bash\nmake build\nsource \"$(make -s print-install-base)/setup.bash\"\nmake test\n```\n\nGazebo와 Navigation 전용 빌드는 Makefile이 선택하는 출력을 사용합니다. Navigation overlay는 `make -s print-navigation-install-base`로 조회합니다. 빌드와 조회에는 같은 Make 변수를 전달합니다.\n\n다른 ROS 배포판의 build/install/log는 재사용하지 않습니다. 출력은 Makefile의 clean target으로 정리하며, 실행 중인 overlay는 보존합니다.\n\n준비 후 [실행](RUNNING.md), [테스트](TESTING.md), [캘리브레이션](CALIBRATION.md) 가이드로 이동합니다. Gazebo 지원 조합은 Humble/Fortress입니다.\n\n## 7. 선택 환경\n\n### Fedora\n\nUbuntu 22.04 Distrobox `ros2-humble` 안에 위 의존성을 준비합니다. 호스트 Python과 Ubuntu ROS Python은 혼용하지 않습니다. GUI 실행에는 display와 OpenGL 전달도 필요합니다.\n\n### ESP32\n\n모터 펌웨어와 micro-ROS 준비는 [ESP32](../esp32/README.md) 가이드를 따릅니다. 고정 버전은 [micro_ros.lock.json](../esp32/micro_ros.lock.json)이 관리하며, firmware와 ROS/Agent의 shell 환경은 분리합니다. 장치 없는 빌드 이후 upload, serial 연결, 모터 구동은 각각 별도로 확인합니다.\n\n### Monitor 웹\n\n웹 빌드는 Node.js 22 이상과 pnpm 11을 사용합니다.\n\n```bash\ncd ros2_ws/src/cleany_dev_monitor/web\npnpm install --frozen-lockfile\npnpm build\n```\n\n`pnpm-lock.yaml`이 웹 dependency를 고정합니다. 빌드된 `web/dist`를 package 설치에 포함하므로 ROS 런타임에는 Node.js가 필요하지 않습니다. Playwright browser는 개발 검증 시 설치하며, ROS 쪽 aiohttp, Pillow 등은 package.xml과 rosdep으로 설치합니다.\n\n## 문제 해결\n\n| 증상 | 확인과 조치 |\n|---|---|\n| Python import 오류 | 같은 worktree를 빌드하고 해당 install overlay를 source |\n| Rosdep의 `python3-mujoco-pip` 키 오류 | `rosdep update`로 공식 규칙을 갱신 |\n| Gazebo 환경 검사 실패 | Ubuntu 22.04, Python 3.10, ROS humble, Ignition Gazebo major 6, ros_gz package 확인 |\n| Headless camera/GPU LiDAR 실패 | Server의 rendering context와 display/OpenGL 확인. `LIBGL_ALWAYS_SOFTWARE=1 make sim-gazebo`는 저속 진단용 fallback |\n| Viewer 실패 | VM 3D acceleration과 DISPLAY/socket 확인. Hand-eye 수집에는 viewer 필요; 화면 없는 환경에서는 `test-handeye`의 headless 검사 사용 |\n\n설치 기준은 [ROS Humble 공식 문서](https://docs.ros.org/en/humble/Installation/Ubuntu-Install-Debs.html)를 따릅니다. 저장소의 재현 기준은 package.xml, 공식 rosdep 규칙, lock 파일과 [CI](../.github/workflows/ci.yml)가 관리합니다.\n\n## 실물 매핑 의존성\n\n`cleany_bringup`의 실물 매핑은 native ROS 2 Humble의 설치된 패키지를 사용한다.\n`make build-hardware-mapping`은 lockfile로 shadcn UI를 빌드한 뒤 관련 ROS 패키지를 빌드한다.\nUI 빌드에는 Node.js 22.12 이상과 npm이 필요하며 실행 시 Node 서버나 외부 CDN은 필요 없다.\n\nCartographer, `cartographer_ros_msgs`, SLAMTEC `sllidar_ros2`, `micro_ros_agent` 실행 파일이 필요하다.\n일반 ROS 의존성은 rosdep으로 설치한다. 배포판의 공식 rosdep 규칙으로 준비되지 않는 외부\n패키지는 별도 고정 revision workspace에서 빌드하고 해당 설치 prefix를 환경에 제공한다.\n기존 Agent 준비는 `make micro-ros-agent-build`와 [ESP32 가이드](../esp32/README.md)를 따른다.\nLiDAR 드라이버 upstream은 [Slamtec/sllidar_ros2](https://github.com/Slamtec/sllidar_ros2)다.\n기존 실물 시험에서 사용한 revision은 [hardware.repos](../configs/dependencies/hardware.repos)에 고정했다.\n별도 workspace의 src에 `vcs import src \u003c /path/to/cleany/configs/dependencies/hardware.repos`로 가져와\n빌드하고 `ros2 pkg prefix sllidar_ros2`로 설치를 확인한다.\n새 운영 노드는 실행 중 Git clone이나 colcon build를 수행하지 않는다.\n\n센서 by-id, baud, 장착 TF와 scan mode는 `cleany_bringup/config/mapping_*.yaml`에서 관리한다.\n장치가 없는 단위/모의 검사는 실물 드라이버 설치 없이 실행할 수 있지만 실물 launch에는 두 외부\n드라이버가 모두 설치돼 있어야 한다. 이 통합은 MCU 펌웨어를 빌드하거나 업로드하지 않는다.\n\nHumble의 공식 rosdep 규칙에는 위 두 드라이버가 없으므로 `make deps`와 장치 없는 CI는\n`sllidar_ros2`, `micro_ros_agent`만 명시적으로 제외한다. package.xml의 실행 의존성은 유지하고\n실물 실행 전 두 드라이버의 package prefix를 확인한다. CI는 호스트 Node 24에서 조종 UI와\n입력 검사를 먼저 빌드한 뒤 ROS 컨테이너의 workspace에 설치한다.\n\n## Jetson 얼굴 디스플레이 환경\n\n독립 디스플레이에는 ROS 2 Humble, colcon, `cleany_interfaces`의 rosdep 의존성, Python venv, Chromium, GNOME 그래픽 세션과 `gnome-session-inhibit`, curl, Noto CJK 글꼴이 필요하다. 부팅 후 전체 화면 표시에는 그래픽 자동 로그인이 필요하며 설치기는 로그인 설정을 바꾸지 않는다. `install-browser.sh`는 전용 폴더에 Playwright 1.64.1과 ARM64 브라우저를 설치하며 시스템 Python 패키지를 변경하지 않는다. 설치와 실행은 [디스플레이 운영](../ros2_ws/src/cleany_display/README.md)을 따른다.\n"},"docs/INTEGRATION.md":{"title":"연동과 계약","body":"# 연동과 계약\n\n\n아래 연결 흐름은 실제 실행 경로와 미구현 경계를 구분합니다.\n\n| 살펴볼 경계 | 상세 안내 |\n|---|---|\n| Mission·Supervisor·Backend | [Mission 연결](how-to/mission.md) |\n| 센서·SLAM·주행 | [매핑](how-to/mapping.md), [Navigation 구성](../ros2_ws/src/cleany_navigation/README.md) |\n| 관측·계획·조작 | [조작 경로 선택](how-to/manipulation.md) |\n| MCU·휠·오도메트리 | [베이스](how-to/base.md) |\n| 저장·화면·진단 | [관측과 기록](how-to/monitoring.md) |\n\n이 문서는 연결 흐름과 각 계약의 소유 위치를 안내합니다. 제품 책임과 안전 원칙은 [KB Technical](cleany-docs/README.md), 정확한 wire type과 실행 옵션은 현재 코드를 기준으로 확인합니다.\n\n## 연결 흐름\n\n```mermaid\nflowchart TB\n    subgraph Cloud[\"외부 control-plane\"]\n        Gateway[\"Backend Gateway\u003cbr/>대기열과 배차\"]\n    end\n    subgraph Runtime[\"현재 Mission 실행 경로\"]\n        Bridge[\"control_bridge\u003cbr/>WebSocket ↔ ROS\"]\n        Mission[\"Mission Runtime\u003cbr/>수락 / 실행\u003cbr/>영속 결과\"]\n        Nav[\"Navigator adapter\u003cbr/>Nav2\"]\n        Safety[\"직렬 안전 경로\"]\n        Base[\"활성 base backend\"]\n        Manip[\"Manipulation transport\"]\n        Sup[\"System Supervisor\u003cbr/>가용성 / 허가 / 복구 조정\"]\n        Evidence[\"Safety adapter\u003cbr/>독립 안전 증거\"]\n    end\n    Peer[\"Python Mock 조작 서버 / 별도 실행 서버\"]\n    Gateway \u003c-->|\"요청 / 상태 / 결과\"| Bridge\n    Bridge \u003c--> Mission\n    Mission --> Nav --> Safety --> Base\n    Mission --> Manip --> Peer\n    Sup \u003c-->|\"lease / 정지 요청과 확인\"| Mission\n    Evidence --> Sup\n    subgraph Grasp[\"별도 Scene / Grasp 경로\"]\n        RGBD[\"RGB-D snapshot\"] --> Scene[\"Scene / OBB\"]\n        Scene --> Candidates[\"Grasp 후보 생성\"]\n        Candidates --> Select[\"MoveIt 도달성 선택\u003cbr/>plan-only\"]\n    end\n```\n\n실선은 현재 연결 경로입니다. Mission은 lifecycle과 최종 결과를, Backend는 대기열과 배차를 관리합니다. 감독 모드(`supervision_mode=required`)에서는 System Supervisor가 시스템 Fault와 Capability를 판단하고, Mission은 Supervisor lease가 있을 때만 움직이며 정지 완료는 Mission이 확인합니다. Safety adapter는 증거를 보고할 뿐 독립 안전 계층이 아닙니다.\n\n`grasp/select_reachable`은 plan-only 후보 선택입니다. Trajectory 실행과 수거 완료는 별도 단계이며, 외부 조작 실행 서버와 MuJoCo 접근 데모도 서로 다른 실행 경로입니다.\n\n## Robot interface의 예정 경계\n\n```mermaid\nflowchart TB\n    subgraph Goal[\"설계 목표 / cleany_robot_interface adapter는 아직 미구현\"]\n        Consumer[\"Mission / Skill\u003cbr/>공통 robot port\"]\n        Interface[\"robot_interface 경계\"]\n        Mock[\"Mock adapter\"]\n        Sim[\"Sim adapter\"]\n        Real[\"Real adapter\"]\n        Consumer -.-> Interface\n        Interface -.-> Mock\n        Interface -.-> Sim\n        Interface -.-> Real\n    end\n```\n\n점선은 예정된 공통 adapter 구조입니다. `cleany_robot_interface` adapter는 아직 미구현이며, 현재 구체적인 adapter는 [`cleany_mission_manager/adapters/`](../ros2_ws/src/cleany_mission_manager/cleany_mission_manager/adapters/)에 있습니다. 하드웨어 좌표계와 안전 한계는 adapter와 설정이 소유합니다.\n\n설계 경계의 근거는 KB의 [ROS 2 Software Architecture](\u003ccleany-docs/20_TECHNICAL/11 - ROS 2 Software Architecture.md>)에서 확인합니다.\n\n## 노드별 통신 목록\n\n발행, 구독, 서비스와 액션의 방향, 타입, QoS와 조건은 [ROS 인터페이스 색인](ROS_INTERFACES.md)에서 찾습니다. 각 패키지의 `docs/interfaces.md`가 노드별 표를 관리합니다. 아래 계약 원본은 통신의 의미와 안전 규칙을 설명합니다.\n\n## 계약 원본\n\n| 경계 | 문서와 원본 |\n|---|---|\n| Mission 수락, 중복, 취소, 복구, Gateway | [Mission](../ros2_ws/src/cleany_interfaces/docs/mission.md) |\n| 시스템 가용성, 실행 허가, 복구 조정, 운영자 reset | [System Supervisor](../ros2_ws/src/cleany_system_supervisor/docs/supervision.md) |\n| 독립 안전 증거 보고 | [Safety adapter](../ros2_ws/src/cleany_safety_adapter/docs/interfaces.md) |\n| Gazebo와 Mock 조작 profile, fixture | [Mock 연결](../ros2_ws/src/cleany_mission_manager/docs/manipulation_mock_integration.md) |\n| Scene, Grasp snapshot/frame/후보 | [Scene와 Grasp](../ros2_ws/src/cleany_interfaces/docs/scene-and-grasp.md) |\n| Manipulation ID, timeout, 중복, 결과 | [Manipulation](../ros2_ws/src/cleany_interfaces/docs/manipulation.md) |\n| 공통 base Twist | [Mobile base](../ros2_ws/src/cleany_interfaces/docs/mobile_base.md) |\n| ROS driver, odometry, 구동 허가 | [Base driver](../ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md) |\n| ROS↔MCU wheel protocol | [Protocol v2](../ros2_ws/src/cleany_base_interfaces/docs/protocol.md) |\n| Navigation 경로 계획과 주행 제어 | [Planning](../ros2_ws/src/cleany_navigation/docs/planning.md) |\n| Navigation 직렬 안전, 관측, 정지 | [Safety](../ros2_ws/src/cleany_navigation/docs/safety.md) |\n| Robot model, 좌표, 형상 | [Model](../ros2_ws/src/cleany_description/docs/model.md) |\n| joint, TCP, MoveIt 그룹 | [Planning](../ros2_ws/src/cleany_moveit_config/docs/planning.md) |\n| MuJoCo backend, 시간, sensor | [Backends](../ros2_ws/src/cleany_mujoco_sim/docs/backends.md) |\n| Logger ROS 제어와 상태 | [인터페이스](../ros2_ws/src/cleany_logger/docs/interfaces.md) |\n| Logger 저장, 세션, 시간과 원본 | [기록 데이터](../ros2_ws/src/cleany_logger/docs/data.md) |\n| Monitor 수집, HTTP, 화면과 stale | [관측 데이터](../ros2_ws/src/cleany_dev_monitor/docs/data.md) |\n| Calibration frame, 동기화, dataset | [Frames and data](../ros2_ws/src/cleany_handeye_calibration/docs/frames-and-data.md) |\n\n메시지 필드는 [cleany_interfaces](../ros2_ws/src/cleany_interfaces)와 [cleany_base_interfaces](../ros2_ws/src/cleany_base_interfaces)의 `.msg/.srv/.action`을 기준으로 확인합니다. 위 reference는 필드 목록을 복제하지 않고 단위, 소유권, 오류, 멱등성을 설명합니다.\n\n## 실행과 설정\n\n실행 절차는 [RUNNING](RUNNING.md), 시험 선택은 [TESTING](TESTING.md)를 따릅니다.\n\n| 영역 | 설정 원본 |\n|---|---|\n| Mission deadline, port, 정책 | [runtime.yaml](../ros2_ws/src/cleany_mission_manager/config/runtime.yaml) |\n| Supervisor Fault, Capability, deadline, 신뢰 publisher | [system_supervisor.yaml](../ros2_ws/src/cleany_system_supervisor/config/system_supervisor.yaml) |\n| 좌석 ID→map pose | [study_cafe_targets.yaml](../ros2_ws/src/cleany_mission_manager/config/study_cafe_targets.yaml) |\n| ToF, 근접 제동과 책상 접근 | [ToF 계약](../ros2_ws/src/cleany_tof/docs/interfaces.md) |\n| Navigation | [config](../ros2_ws/src/cleany_navigation/config) |\n| Grasp predictor | [anygrasp.yaml](../ros2_ws/src/cleany_grasping/config/anygrasp.yaml) |\n| 후보 선택 | [grasp_selection.yaml](../ros2_ws/src/cleany_skill_executor/config/grasp_selection.yaml) |\n| 실물, mock base | [Base driver config](../ros2_ws/src/cleany_base_driver/config) |\n\n| 조건 | 연동 규칙 |\n|---|---|\n| Simulation 접근 목표 | Dock, 팔 도달성, 실환경 좌표는 별도 검증 |\n| 초기 `base_hardware.yaml` | 바퀴를 띄운 시험용; 바닥 주행은 별도 허가 |\n| 한 실행의 명령과 위치 정보 | 명령원과 canonical odom/TF 소유자를 각각 하나만 유지 |\n| 재연결, 재시작 | Cached motion과 미션을 자동 재개하지 않음 |\n\n외부 Backend의 schema, 인증, media 정책은 별도 control-plane 저장소가 관리합니다.\n\n## 실물 매핑과 휴대폰 조종\n\n- [휴대폰 조종 계약](../ros2_ws/src/cleany_teleop/docs/interfaces.md)\n- [매핑 세션과 저장](../ros2_ws/src/cleany_navigation/docs/mapping.md)\n- [실물 구성과 보정 프로필](../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md)\n\n## 로컬 얼굴 디스플레이\n\n로봇의 미션과 수거 실행 상태를 표시하는 전용 앱은 제어 경로와 독립적으로 구독한다. [디스플레이 인터페이스](../ros2_ws/src/cleany_display/docs/interfaces.md)에 상태 매핑, QoS, 연결 단절과 배터리 데이터 만료 규칙이 있다.\n"},"docs/ROS_INTERFACES.md":{"title":"ROS 인터페이스 색인","body":"# ROS 인터페이스 색인\n\n## 어떤 통신인가요?\n\n```mermaid\nflowchart LR\n  Publisher[\"Publisher\"] -->|\"Topic: 연속 데이터\"| Subscriber[\"Subscriber\"]\n  Client[\"Client\"] -->|\"Service: 요청\"| Server[\"Server\"]\n  Server -->|\"응답\"| Client\n  Goal[\"Action client\"] -->|\"목표 / 취소\"| Executor[\"Action server\"]\n  Executor -->|\"피드백 / 최종 결과\"| Goal\n```\n\n| 찾을 기능 | 패키지 표 |\n|---|---|\n| 구동과 피드백 | [Base driver](../ros2_ws/src/cleany_base_driver/docs/interfaces.md) |\n| 주행·SLAM·안전 노드 | [Navigation](../ros2_ws/src/cleany_navigation/docs/interfaces.md) |\n| 인식과 조작 | [Perception](../ros2_ws/src/cleany_perception/docs/runtime.md), [Manipulation](../ros2_ws/src/cleany_skill_executor/docs/interfaces.md) |\n| 미션과 허가 | [Mission](../ros2_ws/src/cleany_mission_manager/docs/interfaces.md), [Supervisor](../ros2_ws/src/cleany_system_supervisor/docs/interfaces.md) |\n| 기록과 관측 | [Logger](../ros2_ws/src/cleany_logger/docs/interfaces.md), [Monitor](../ros2_ws/src/cleany_dev_monitor/docs/interfaces.md) |\n\n아래 표는 전체 이름 색인입니다. HTML 문서에서는 긴 표의 검색칸으로 이름·타입·노드를 좁혀 볼 수 있습니다.\n\n실물 진단 도구 `tools/validation/head_pan_tilt_probe.py`의 `d435_head_encoder_tf`는\n헤드 직렬 피드백으로 `/head/joint_states` (`sensor_msgs/msg/JointState`, R10)와\n`/tf`의 D435 pan/tilt 체인을 발행한다. 제품 bringup에 자동 포함되지 않으며,\n명시 모터 시험과 읽기 전용 실행의 차이는 [캘리브레이션 가이드](CALIBRATION.md#d435와-lidar-벽-비교-및-헤드-관절-관측)를 따른다.\n\n`cleany_navigation`의 `slip_monitor`, `traction_brake` 실행 파일과 `SlipRecovery`\nBT plugin은 [슬립 복구 인터페이스](../ros2_ws/src/cleany_navigation/docs/interfaces.md#slip_monitor-traction_brake와-sliprecovery-bt)를 따른다.\n\n휴대폰의 [`localization_guard`][ros-localization-guard]는 `/map`, `/scan`, `/amcl_pose`,\n`/diagnostics`, `/initialpose`를 구독하고 `/localization/status`와\n`/system/component_health`, `/navigation/localization_speed_limit`을 발행한다. `/initialpose` 발행은 검증된 정지 복구 때만\n수행하며 `/request_nomotion_update`를 호출한다.\n\n각 노드의 발행, 구독, 서비스 제공/호출, 액션 제공/호출을 찾는 색인이다. 상세 표는 코드 옆 `docs/interfaces.md`가 관리하고, 동작과 안전 규칙은 [INTEGRATION](INTEGRATION.md)의 계약 reference를 따른다.\n\n표는 현재 소스와 launch의 기본 이름을 기록한다. 실행별 namespace, node name, parameter와 remap에 따라 실제 graph는 달라진다. 조건부 endpoint, 외부 server, 미구현 타입을 구분하며 모든 노드가 동시에 실행되는 것으로 해석하지 않는다.\n\n## 표 읽기\n\n| 표기 | 뜻 |\n|---|---|\n| 토픽 발행 / 구독 | 해당 노드에서 나가는 데이터 / 들어오는 데이터 |\n| 서비스 제공 / 호출 | Server / client |\n| 액션 제공 / 호출 | Action server / client |\n| R10, R20, R1 | Reliable, volatile, keep-last depth 10 / 20 / 1 |\n| B1 | Best-effort, volatile, keep-last depth 1 |\n| Sensor | Humble `qos_profile_sensor_data`: best-effort, volatile, keep-last depth 5 |\n| R/T1, R/T2048 | Reliable, transient-local, keep-last depth 1 / 2048 |\n| Service 기본값 | Humble service QoS: reliable, volatile, keep-last depth 10 |\n| Action 기본값 | rclpy 기본 request/result/cancel service와 feedback/status QoS. Status는 reliable, transient-local, depth 1 |\n| TF 기본 QoS | tf2_ros broadcaster/listener 기본값. 응용 코드가 별도 QoS를 지정하지 않음 |\n| 상대 이름 / `/절대 이름` / `~/private` | Node namespace 적용 / root 이름 / node namespace와 node name 적용 |\n| 주기 | 소스의 기본 timer 또는 callback 조건. 실제 수신 빈도와 동일하지 않을 수 있음 |\n\n## 종류별 통합 목록\n\n[Topic](#topic-목록), [Action](#action-목록), [Service](#service-목록)에서 이름으로 찾는다. 노드 링크는 패키지의 상세 표로 연결하며, 아직 표에 없는 runtime endpoint는 구현 소스로 연결한다. QoS와 호출 조건은 연결된 문서와 소스를 따른다.\n\n아래 이름은 **root namespace에서 기본 이름을 해석한 값**이다. 상대 이름을 절대 이름으로 고정하는 설정이 아니며, namespace, remap과 parameter override가 있으면 달라진다. `cleany_dev_monitor`의 `runtime_namespace`는 기본 빈 값으로 표시했다. `\u003c...>`는 실행 시 결정되는 이름 패턴이다.\n\n발행/제공 목록의 여러 노드는 실행 구성에 따른 대안이거나 서로 다른 데이터를 같은 토픽으로 보내는 노드다. 동시에 실행한다는 뜻은 아니다. `mock_*`, Gazebo, MuJoCo와 `sorting_cameras`는 mock 또는 시뮬레이션 경로이며, 외부 Nav2, MoveIt과 controller는 별도 실행이 필요하다. `—`는 이 색인에서 상대 노드를 지정하지 않은 항목이며, endpoint의 부재나 미구현을 뜻하지 않는다. `SortingObserver`는 MuJoCo host 노드에 붙는 plugin이며 독립 노드 이름이 아니다. Monitor의 동적 구독은 discovery와 사용자 선택에 따라 생성된다.\n\nROS 자동 인터페이스는 [별도 표](#ros가-자동-생성하는-인터페이스)에 둔다. 응용 코드가 직접 호출하거나 관찰하는 action cancel/status와 카메라 parameter 서비스는 통합 목록에도 표시한다. 외부 패키지 전체 API와 실행 중 동적으로 발견되는 모든 이름을 열거하지는 않는다.\n\n### Topic 목록\n\n| 기본 이름 (root namespace) | ROS 타입 | 발행 노드 | 구독 노드 | 조건 / 연결 |\n|---|---|---|---|---|\n| `/amcl_pose` | `geometry_msgs/msg/PoseWithCovarianceStamped` | — | [`cleany_dev_monitor`][ros-cleany-dev-monitor], [`system_supervisor`][ros-system-supervisor] | — |\n| `/base/imu_state` | `cleany_base_interfaces/msg/ImuState` | [`cleany_motor_controller`][ros-cleany-motor-controller] | [`cleany_imu`][ros-cleany-imu] | — |\n| `/base/wheel_command` | `cleany_base_interfaces/msg/WheelCommand` | [`cleany_base_driver`][ros-cleany-base-driver] | [`mock_base_mcu`][ros-mock-base-mcu], [`cleany_motor_controller`][ros-cleany-motor-controller] | — |\n| `/base/wheel_state` | `cleany_base_interfaces/msg/WheelState` | [`mock_base_mcu`][ros-mock-base-mcu], [`cleany_motor_controller`][ros-cleany-motor-controller] | [`cleany_base_driver`][ros-cleany-base-driver] | — |\n| `/behavior_tree_log` | `nav2_msgs/msg/BehaviorTreeLog` | — | [`cleany_dev_monitor`][ros-cleany-dev-monitor], [`nav2_bt_trace`][ros-nav2-bt-trace] | — |\n| `/body_guard_3d/risk_voxels` | `sensor_msgs/msg/PointCloud2` | [`voxel_guard`][ros-voxel-guard] | [`cleany_dev_monitor`][ros-cleany-dev-monitor] | — |\n| `/body_guard_3d/state` | `std_msgs/msg/String` | [`voxel_guar calibration/docs/interfaces.md#multi_pose_handeye_orchestrator) |\n| `cleany_logger` | `cleany_logger` | `logger_node` | [표](../ros2_ws/src/cleany_logger/docs/interfaces.md#cleany_logger) |\n| `cleany_logger` | `cleany_logger_cli_\u003csuffix>` | `logger` | [CLI](../ros2_ws/src/cleany_logger/docs/interfaces.md#cli) |\n| `cleany_dev_monitor` | `cleany_dev_monitor` | `dev_monitor` | [표](../ros2_ws/src/cleany_dev_monitor/docs/interfaces.md#cleany_dev_monitor) |\n| `cleany_motor_controller` | ESP32 micro-ROS | `esp32/src/main.cpp` | [MCU 표](../esp32/README.md#ros-인터페이스) |\n\nSingle/multi pose 실행 전 설정 파일만 읽는 `single_pose_handeye_config`, `multi_pose_handeye_config`는 임시 bootstrap 노드다. 응용 endpoint가 없으며 ROS 기본 인터페이스만 생성한다. `cleany_description`, `cleany_bringup`은 모델/launch를 제공하고, `cleany_interfaces`, `cleany_base_interfaces`는 타입을 정의한다. `cleany_planner`에는 현재 등록된 자체 ROS 노드가 없다. `cleany_logger`는 독립 기록 노드이며 [기록 계약](../ros2_ws/src/cleany_logger/docs/data.md)을 따른다. 새 perception과 sorting 실행은 아래 패키지 문서에서 확인한다. 이전 grasp 실행 데모, RGB-D pick 노드와 MuJoCo calibration pose generator는 제거됐다.\n\n## Runtime integration에서 추가된 실행\n\n| 노드 이름 | 실행 파일 | 구현과 API 안내 |\n|---|---|---|\n| `perception_inspector` | `inspection_node` | [Perception](../ros2_ws/src/cleany_perception/docs/runtime.md#ros-api) |\n| `depth_scene_node` | `depth_scene_node` | [Depth 점군](../ros2_ws/src/cleany_perception/docs/runtime.md#전체-depth-환경-포인트클라우드) |\n| `scene_cloud_receipt` | `scene_cloud_receipt_node` | [점군 수신 확인](../ros2_ws/src/cleany_perception/docs/runtime.md#필터링-점군-수신-확인) |\n| `nearest_pregrasp_coordinator` | `nearest_pregrasp_coordinator` | [조작 경로](../ros2_ws/src/cleany_skill_executor/docs/manipulation.md#가까운-객체-자동-pre-grasp) |\n| `nearest_pregrasp_coordinator` 상속 이름 | `sorting_coordinator` | [분류와 수거](../ros2_ws/src/cleany_skill_executor/docs/manipulation.md#시뮬레이션-분리-수거-통합-검증-진행-중); launch remap 적용 여부 확인 |\n| `simulation_placement_verifier` | `placement_verifier` | [MuJoCo 표](../ros2_ws/src/cleany_mujoco_sim/docs/interfaces.md#simulation_placement_verifier) |\n| `manipulation_server` | `manipulation_server` | [Mock Action 서버](../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#manipulation_server) |\n| `manipulation_monitor` | `manipulation_monitor` | [읽기 전용 트리 모니터](../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#manipulation_monitor) |\n| `manipulation_test_client` | `manipulation_test_client` | [요청·취소·조회 CLI](../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#manipulation_test_client) |\n| `manipulation_mujoco_server` | `manipulation_mujoco_server` | [MuJoCo BT Action 서버](../ros2_ws/src/cleany_manipulation_bt/README.md#계약과-증거) |\n\n`perception_inspector`는 `GetSceneSnapshot` 타입의 `/perception/get_scene_snapshot`을\n제공해 기존 cache를 조회합니다. `simulation_placement_verifier`의\n`/sorting/register_placement_target`은 `RegisterPlacementTarget`으로 개체를 고정하며,\n`VerifyPlacement.verification_id`로 해당 개체만 검증합니다.\n상세 필드는 [관측 계약](../ros2_ws/src/cleany_interfaces/docs/observation-contracts.md)을 따릅니다.\n\n## 외부 노드와 타입만 있는 계약\n\n| 경계 | 연결 위치와 현재 상태 |\n|---|---|\n| Gazebo `ros_gz_bridge` | [Bridge 표](../ros2_ws/src/cleany_gazebo_sim/docs/interfaces.md#ros_gz_bridge). ROS/Gazebo sensor와 명령 변환 |\n| Nav2 / AMCL / Collision Monitor | [Navigation launch](../ros2_ws/src/cleany_navigation/launch/navigation.launch.py)와 [설정](../ros2_ws/src/cleany_navigation/config)이 조합을 선택. Mission이 호출하는 action/lifecycle 서비스는 Mission 노드 표에 포함 |\n| MoveIt `move_group` | `/compute_ik`, `/compute_fk`, `/check_state_validity`, `/get_planning_scene`, `/apply_planning_scene`, `/move_action`, `/execute_trajectory`를 이용. 자체 호출 노드 표와 [Planning 계약](../ros2_ws/src/cleany_moveit_config/docs/planning.md)에서 연결 확인 |\n| ros2_control | Arm/gripper의 FollowJointTrajectory와 joint_state_broadcaster. [Controller 설정](../ros2_ws/src/cleany_moveit_config/config/mock_ros2_controllers.yaml)과 [MuJoCo backend launch](../ros2_ws/src/cleany_mujoco_sim/launch/study_cafe_backend.launch.py)이 선택 |\n| `robot_state_publisher` | `joint_states` 구독, `/tf`, `/tf_static` 발행. URDF와 [모델 계약](../ros2_ws/src/cleany_description/docs/model.md)이 frame 의미를 관리 |\n| `InspectScene` | `perception_inspector`가 `perception/inspect_scene`을 제공. [Perception API](../ros2_ws/src/cleany_perception/docs/runtime.md#ros-api) |\n| `ExecuteManipulationSkill` | Runtime의 action client와 [타입](../ros2_ws/src/cleany_interfaces/action/ExecuteManipulationSkill.action)은 존재. 기본 mock는 process 내부 구현이며 `action_mock`은 선택형 Python Mock 서버에 연결 |\n\n위 표는 외부 패키지의 연결 경계다. 외부 패키지의 전체 API 목록은 해당 패키지 문서와 실행 graph를 기준으로 확인한다. RViz, rqt, controller spawner와 검증용 probe 노드는 실행 보조 도구이며 자체 제품 endpoint 목록에 포함하지 않는다.\n\n## ROS가 자동 생성하는 인터페이스\n\nParameter 서비스와 이벤트, rosout, sim clock 구독, action 내부 전송은 응용 표에서 반복하지 않는다. 아래 패턴이 노드 옵션과 실행 상태에 따라 추가된다.\n\n| 항목 | 기본 패턴 / 타입 |\n|---|---|\n| Parameter 서비스 | `\u003cnode>/{describe_parameters,get_parameter_types,get_parameters,list_parameters,set_parameters,set_parameters_atomically}`; `rcl_interfaces/srv/*` |\n| Parameter 변경 이벤트 | `/parameter_events`; `rcl_interfaces/msg/ParameterEvent` |\n| 로그 | `/rosout`; `rcl_interfaces/msg/Log`, rosout 활성화 시 |\n| Simulation clock | `/clock`; `rosgraph_msgs/msg/Clock`, ROS time source 연결 시; `use_sim_time`으로 시간 적용 선택 |\n| Action 요청 / 결과 / 취소 | `\u003caction>/_action/{send_goal,get_result,cancel_goal}` 서비스 |\n| Action feedback / status | `\u003caction>/_action/{feedback,status}` 토픽 |\n\n명시적으로 만든 cancel client와 status subscription은 호출 노드의 표에도 표시한다. ESP32 rclc 노드는 표에 적힌 wheel interface만 초기화하며 rclpy의 자동 parameter 서비스가 동일하게 생긴다고 가정하지 않는다.\n\n## 실행 중 확인\n\n실행한 구성과 같은 DDS domain, 같은 overlay의 터미널에서 확인한다.\n\n```bash\nros2 node list\nros2 node info /mission_runtime\nros2 topic list -t\nros2 topic info /cmd_vel --verbose\nros2 service list -t\nros2 action list -t\nros2 action info /grasp/select_reachable\n```\n\n실행 graph는 해당 실행의 증거다. 조건부 노드를 실행하지 않은 결과를 전체 소스의 인터페이스 목록으로 대체하지 않는다. 코드를 변경할 때 해당 노드 표와 이 색인을 함께 갱신한다.\n\n## 실물 매핑과 휴대폰 조종\n\n| 패키지 | 실행 파일 | 인터페이스 |\n|---|---|---|\n| cleany_teleop | phone_remote | [조종과 웹 계약](../ros2_ws/src/cleany_teleop/docs/interfaces.md) |\n| cleany_teleop | commission_wheels | 같은 문서의 독립 시험 CLI |\n| cleany_navigation | mapping_scan_filter, mapping_session | [매핑 계약](../ros2_ws/src/cleany_navigation/docs/mapping.md) |\n| cleany_bringup | hardware_runtime | [프로세스 수명](../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md) |\n\nBase driver의 `base/set_enabled`와 wheel odometry의 `~/reset`은 해당 패키지 reference에 설명한다.\n\n## ToF 활성 구성\n\n[ToF reference][ros-tof]는 `tof_driver`, `proximity_guard`, `desk_approach` 실행 파일과\n조건부 Mission Action client를 관리한다. `tof_enabled=false`인 구성에는 생성하지 않는다.\n\n| Endpoint | 타입 | 발행 또는 제공 | 구독 또는 호출 |\n|---|---|---|---|\n| `/tof/frame` | `cleany_interfaces/msg/TofFrame` | tof_driver | proximity_guard, desk_approach |\n| `/motion/cmd_vel` | `geometry_msgs/msg/Twist` | desk_approach | 기존 navigation 안전 계층 |\n| `/proximity/input` | `geometry_msgs/msg/Twist` | 기존 최종 안전 계층 | proximity_guard |\n| `/proximity/status` | `std_msgs/msg/String` | proximity_guard | 관측 도구 |\n| `/system/component_health` | `cleany_interfaces/msg/ComponentHealth` | proximity_guard (추가 source) | system_supervisor |\n| `/desk/approach` | `cleany_interfaces/action/DeskApproach` | desk_approach | mission_runtime |\n\n[ros-tof]: ../ros2_ws/src/cleany_tof/docs/interfaces.md\n\n## 로컬 얼굴 디스플레이\n\n`cleany_display` 패키지의 `cleany_display` 실행 파일은 같은 이름의 노드로 미션 상태, 미션 결과, 수거 실행 기록, 오도메트리, 배터리와 화면 지정 입력을 구독한다. 로봇 명령을 발행하지 않는다. 토픽 타입, QoS와 로컬 HTTP 규약은 [디스플레이 인터페이스](../ros2_ws/src/cleany_display/docs/interfaces.md)를 따른다.\n\n휴대폰 지도 주행 옵션(`phone_remote --navigation`): `/map`, `/plan`, `/scan`, `/odom`, `/nav2/cmd_vel` 구독, `/initialpose` 발행, `navigate_to_pose` Action client, `navigation/stop` Action server. 상세 계약은 [teleop interfaces](../ros2_ws/src/cleany_teleop/docs/interfaces.md)를 따른다.\n\n- `tools/validation/map_extension/extend.py`: 독립 실험 실행 도구. 외부 Cartographer와\n  occupancy grid 노드를 `/map_extension`에서 실행하며 `/scan`, `/odom`, TF를 읽는다.\n  `/map_extension/map` (`nav_msgs/OccupancyGrid`)과 `/map_extension/tracked_pose`\n  (`geometry_msgs/PoseStamped`), Cartographer 표준 서비스를 사용한다. TF와 모터 명령은 발행하지 않는다.\n- `tools/validation/map_extension/view_tf.py`: RViz 전용 `/map_extension/view_tf`\n  (`tf2_msgs/TFMessage`)를 발행한다. 기존 odometry TF와 Cartographer\n  `/map_extension/tracked_pose`를 같은 시각에 결합하며 전역 `/tf`는 변경하지 않는다.\n  같은 표시 도구의 `/map_extension/view_trajectory` (`visualization_msgs/MarkerArray`)는\n  원본 궤적 메시지를 복사해 기존 궤적은 파랑, 추가 궤적은 불투명 노랑으로 표시한다.\n  원본 Cartographer marker의 투명도와 연결 상태 정보는 수정하지 않는다.\n\n\n- `cleany_navigation/depth_obstacles_preview`: 촬영 시각 head TF 기반 D435 장애물 미리보기.\n  센서 구독, 점군 및 상태 발행, 별도 preview TF는\n  [미리보기 인터페이스](../ros2_ws/src/cleany_navigation/docs/interfaces.md#depth_obstacles_preview)를 따른다.\n\n- 실물 phone depth overlay: 기존 `depth_clearance`가 `/perception/depth/nav_points`, `/perception/depth/nav_obstacle_points`를 발행하고 local costmap 및 `collision_monitor`가 소비한다. 별도 실행 파일이나 3D 정지 가드는 추가하지 않는다. [실물 depth 계약](../ros2_ws/src/cleany_navigation/docs/interfaces.md#depth_clearance)을 따른다.\n"},"docs/RUNNING.md":{"title":"실행 가이드","body":"# 실행 가이드\n\n할 일을 선택하고 준비 → 실행 → 관측 → 종료 순서로 진행합니다. 각 가이드는 같은 저장소의 명령과 설정을 기준으로 합니다.\n\n```mermaid\nflowchart TD\n  Env[\"Humble 환경과 같은 DDS domain\"] --> Mode{\"실행할 대상\"}\n  Mode -->|\"주행과 센서\"| Gazebo[\"Gazebo\"]\n  Mode -->|\"팔과 물체 조작\"| Mujoco[\"MuJoCo + MoveIt\"]\n  Gazebo --> Observe[\"센서 · odom · TF 확인\"]\n  Mujoco --> Observe\n  Observe --> Run[\"시나리오 실행과 종료 확인\"]\n```\n\n| 하려는 일 | 가이드 | 확인할 결과 |\n|---|---|---|\n| 가상 환경에서 센서·주행 확인 | [시뮬레이션](how-to/simulation.md) | scan, odom, TF |\n| LiDAR로 지도 생성·저장 | [매핑](how-to/mapping.md) | map.yaml, PGM, pbstream |\n| 저장 지도에서 목표 주행 | [휴대폰 주행](how-to/phone-navigation.md) | 경로 미리보기와 정지 응답 |\n| 물체 관찰·후보 계획·조작 | [조작](how-to/manipulation.md) | snapshot, 계획, Action 결과 |\n| Backend 요청과 실행 연결 | [Mission](how-to/mission.md) | 요청 수락, 허가, 결과 |\n| 센서 입력과 장애물 관측 | [센서](how-to/sensors.md) | 영상·점군·frame·시각 |\n| MCU와 베이스 연결 | [베이스](how-to/base.md), [펌웨어](../esp32/README.md) | 휠 피드백과 STOP ACK |\n| 기록과 화면 확인 | [관측·기록](how-to/monitoring.md) | Logger 세션과 Monitor 화면 |\n\n## 실행 선택과 준비 순서\n\n위 표에서 작업을 고른 뒤 해당 가이드의 준비 조건을 확인합니다.\n\n## 공통 준비\n\n명령은 저장소 루트의 Ubuntu 22.04 / Humble 터미널에서 실행합니다. [환경과 출력 경로](DEVELOPMENT_SETUP.md), [연동 계약](INTEGRATION.md)을 확인한 뒤, 각 터미널에 같은 DDS domain과 같은 worktree overlay를 적용합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\n```\n\nNavigation 전용 빌드는 `print-navigation-install-base`로 overlay를 조회합니다. 빌드 때 바꾼 Make 변수는 경로 조회 때도 동일하게 전달합니다.\n\n## 세부 절차 바로가기\n\n## Gazebo\n\n[Gazebo 절차](how-to/simulation.md#gazebo)\n\n## 시설 생성 도구와 종료\n\n[시설 생성 도구와 종료 절차](how-to/simulation.md#시설-생성-도구와-종료)\n\n## 저장 지도 Navigation\n\n[저장 지도 Navigation 절차](how-to/mapping.md#저장-지도-navigation)\n\n## 실물 휠 odometry와 2D LiDAR 매핑\n\n[실물 휠 odometry와 2D LiDAR 매핑 절차](how-to/mapping.md#실물-휠-odometry와-2d-lidar-매핑)\n\n### 오프라인 SLAM 비교용 원본 bag\n\n[오프라인 SLAM 비교용 원본 bag 절차](how-to/mapping.md#오프라인-slam-비교용-원본-bag)\n\n## 실물 depth local costmap 연결\n\n[실물 depth local costmap 연결 절차](how-to/sensors.md#실물-depth-local-costmap-연결)\n\n### 기존 지도 병행 확장\n\n[지도 확장 절차](how-to/mapping.md#기존-지도-병행-확장)\n\n## MuJoCo와 조작 데모\n\n[MuJoCo와 조작 데모 절차](how-to/manipulation.md#mujoco와-조작-데모)\n\n### 단일 물체 Manipulation Action\n\n[단일 물체 Manipulation Action 절차](how-to/manipulation.md#단일-물체-manipulation-action)\n\n### Plan-only 후보 선택\n\n[Plan-only 후보 선택 절차](how-to/manipulation.md#plan-only-후보-선택)\n\n### MuJoCo 접근 데모\n\n[MuJoCo 접근 데모 절차](how-to/manipulation.md#mujoco-접근-데모)\n\n## Mission Runtime과 Backend\n\n[Mission Runtime과 Backend 절차](how-to/mission.md#mission-runtime과-backend)\n\n### 주행 구성을 함께 실행\n\n[주행 구성을 함께 실행 절차](how-to/mission.md#주행-구성을-함께-실행)\n\n### 기존 주행 구성에 Runtime 연결\n\n[기존 주행 구성에 Runtime 연결 절차](how-to/mission.md#기존-주행-구성에-runtime-연결)\n\n### System Supervisor 감독 stack\n\n[System Supervisor 감독 stack 절차](how-to/mission.md#system-supervisor-감독-stack)\n\n### Gazebo 주행과 Mock 조작\n\n[Gazebo 주행과 Mock 조작 절차](how-to/mission.md#gazebo-주행과-mock-조작)\n\n### 주행도 Mock으로 Action 연결 확인\n\n[주행도 Mock으로 Action 연결 확인 절차](how-to/mission.md#주행도-mock으로-action-연결-확인)\n\n## 실물 IMU\n\n[실물 IMU 절차](how-to/sensors.md#실물-imu)\n\n## ToF 근접 보호와 책상 접근\n\n[ToF 근접 보호와 책상 접근 절차](how-to/sensors.md#tof-근접-보호와-책상-접근)\n\n## D435 장애물 미리보기\n\n[D435 장애물 미리보기 절차](how-to/sensors.md#d435-장애물-미리보기)\n\n## Base와 plot\n\n[Base와 plot 절차](how-to/base.md#base와-plot)\n\n### 장치 없는 mock\n\n[장치 없는 mock 절차](how-to/base.md#장치-없는-mock)\n\n### 실물 base와 관측 GUI\n\n[실물 base와 관측 GUI 절차](how-to/base.md#실물-base와-관측-gui)\n\n## 개발 Monitor\n\n[개발 Monitor 절차](how-to/monitoring.md#개발-monitor)\n\n### 독립 Logger\n\n[독립 Logger 절차](how-to/monitoring.md#독립-logger)\n\n## Jetson 얼굴 디스플레이\n\n[Jetson 얼굴 디스플레이 절차](how-to/monitoring.md#jetson-얼굴-디스플레이)\n\n## 휴대폰 Omni 주행의 슬립 복구\n\n[휴대폰 Omni 주행의 슬립 복구 절차](how-to/phone-navigation.md#휴대폰-omni-주행의-슬립-복구)\n\n## 휴대폰 지도 클릭 주행 (LiDAR 전용 시연)\n\n[휴대폰 지도 클릭 주행 (LiDAR 전용 시연) 절차](how-to/phone-navigation.md)\n"},"docs/TESTING.md":{"title":"변경을 검증하기","body":"# 변경을 검증하기\n\n수정한 경계에 맞는 검사를 고르고, 자동 검사와 시뮬레이션, 실물 결과를 구분합니다.\n\n```mermaid\nflowchart TD\n  Change{\"변경한 경계\"}\n  Change -->|\"core 로직\"| Unit[\"패키지 단위 검사\"]\n  Change -->|\"ROS 인터페이스\"| ROS[\"빌드 + ROS 연동 검사\"]\n  Change -->|\"가상 센서·제어\"| Sim[\"시뮬레이션 시나리오\"]\n  Change -->|\"실물 설정·구동\"| Real[\"장치와 실물 시험\"]\n```\n\n## 먼저 고를 검사\n\n| 바꾼 것 | 첫 검사 | 추가로 확인할 것 |\n|---|---|---|\n| 순수 Python 로직 | 해당 패키지 pytest | 입력 오류, 상태 전이와 실패 경로 |\n| ROS 타입·launch·설치 데이터 | 관련 package build/test | 실제 topic·service 연결 |\n| 여러 패키지 연결 | 합성 ROS runtime | lifecycle, 취소, 재연결 |\n| 주행·인식·조작 | 관련 simulator runtime | 실제 장치와 주행·정지는 별도 시험 |\n| UI | 실제 제공 페이지의 브라우저 검사 | 갱신, 재접속, 모바일 레이아웃 |\n| 문서 | 링크·명령 구문·생성 파일 검사 | 아래 문서 검증 명령 |\n\n## 자주 쓰는 명령\n\n| 범위 | 명령 |\n|---|---|\n| 전체 ROS workspace | `make test` |\n| Mission core / Supervisor core | `make test-mission-core`, `make test-supervision-core` |\n| Navigation / Gazebo | `make test-navigation`, `make test-gazebo` |\n| ROS Navigation runtime | `make test-navigation-runtime` |\n| 조작 Mock / MuJoCo BT | `make test-manipulation`, `make test-manipulation-bt` |\n| Base / ESP32 | `make test-base`, `make test-motor-core` |\n| 매핑 / 슬립 분석 | `make test-hardware-mapping-core`, `make test-slip-detection` |\n| Logger / Monitor | `make test-logger`, `make test-dev-monitor` |\n\n환경과 선택 실행 조건, 전체 명령표는 [상세 참조](reference/testing.md#검사-선택)를 따릅니다. 장치가 없는 검사와 실물 실행 검사는 같은 성공으로 합산하지 않습니다.\n\n## 문서 사이트 검사\n\n```bash\npython3 tools/docs/build_site.py --check\npython3 docs/guide/build_standalone.py --check\ngit diff --check\n```\n\n브라우저에서는 데스크톱과 모바일에서 메뉴, 검색, 도표 확대와 내부 링크를 확인합니다.\n\n## 검사별 상세 참조\n\n## 테스트와 도구 위치\n\n[테스트와 도구 위치의 명령과 조건](reference/testing.md#테스트와-도구-위치)\n\n## 검사 선택\n\n[검사 선택의 명령과 조건](reference/testing.md#검사-선택)\n\n## CI 실행과 재사용\n\n[CI 실행과 재사용의 명령과 조건](reference/testing.md#ci-실행과-재사용)\n\n## 선택 runtime과 UI\n\n[선택 runtime과 UI의 명령과 조건](reference/testing.md#선택-runtime과-ui)\n\n### 카메라 영상 수집\n\n[카메라 영상 수집의 명령과 조건](reference/testing.md#카메라-영상-수집)\n\n### 선택 실행 조건\n\n[선택 실행 조건의 명령과 조건](reference/testing.md#선택-실행-조건)\n\n## 결과와 증거\n\n[결과와 증거의 명령과 조건](reference/testing.md#결과와-증거)\n\n## 문서 변경 검사\n\n[문서 변경 검사의 명령과 조건](reference/testing.md#문서-변경-검사)\n\n## 실물 매핑 패키지 경계\n\n[실물 매핑 패키지 경계의 명령과 조건](reference/testing.md#실물-매핑-패키지-경계)\n\n## ToF와 Supervisor 통합\n\n[ToF와 Supervisor 통합의 명령과 조건](reference/testing.md#tof와-supervisor-통합)\n\n## 얼굴 디스플레이\n\n[얼굴 디스플레이의 명령과 조건](reference/testing.md#얼굴-디스플레이)\n\n## MoveIt 충돌 형상과 MuJoCo 동등성 검사\n\n[MoveIt 충돌 형상과 MuJoCo 동등성 검사의 명령과 조건](reference/testing.md#moveit-충돌-형상과-mujoco-동등성-검사)\n\n## 충돌 메시와 내부 장애물 검사\n\n[충돌 메시와 내부 장애물 검사의 명령과 조건](reference/testing.md#충돌-메시와-내부-장애물-검사)\n\n### 순정 Lattice와 Phone Omni MPPI 비교\n\n[순정 Lattice와 Phone Omni MPPI 비교의 명령과 조건](reference/testing.md#순정-lattice와-phone-omni-mppi-비교)\n\n### 기록된 Nav2 조건과 MPPI reset 검사\n\n[기록된 Nav2 조건과 MPPI reset 검사의 명령과 조건](reference/testing.md#기록된-nav2-조건과-mppi-reset-검사)\n\n## D435 높이 필터 검증\n\n[D435 높이 필터 검증의 명령과 조건](reference/testing.md#d435-높이-필터-검증)\n\n## 실물 depth costmap과 Monitor 격리 회귀\n\n[실물 depth costmap과 Monitor 격리 회귀의 명령과 조건](reference/testing.md#실물-depth-costmap과-monitor-격리-회귀)\n"},"docs/how-to/base.md":{"title":"베이스 구동과 피드백 확인하기","body":"# 베이스 구동과 피드백 확인하기\n\nMock MCU와 실제 MCU를 구분하고, 명령·휠 피드백·오도메트리와 STOP 응답을 확인합니다.\n\n```mermaid\nflowchart LR\n  Cmd[\"차체 Twist + 구동 허가\"] --> Driver[\"Base driver / 휠 변환\"]\n  Driver -->|\"wheel_command\"| MCU[\"ESP32 / PI · FF · watchdog\"]\n  MCU -->|\"wheel_state\"| Driver\n  Driver --> Odom[\"joint_states → wheel odometry\"]\n```\n\n[공통 환경 준비](../RUNNING.md#공통-준비) · [검증 선택](../TESTING.md)\n\n## Base와 plot\n\n### 장치 없는 mock\n\n별도 domain에서 빌드한 mock를 실행합니다.\n\n```bash\nmake build-base\nexport ROS_DOMAIN_ID=173\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 launch cleany_base_driver base_driver.launch.py mock:=true\n```\n\nMock domain에는 실물 MCU/Agent를 연결하지 않습니다. 고장 주입 service는 mock node와 테스트가 관리합니다.\n\n### 실물 base와 관측 GUI\n\nAgent와 driver 양쪽에 domain 0을 적용하고 검토한 hardware config를 선택합니다.\n\n```bash\nexport ROS_DOMAIN_ID=0\nros2 launch cleany_base_driver base_driver.launch.py \\\n  mock:=false config:=\"$(ros2 pkg prefix --share cleany_base_driver)/config/base_hardware.yaml\"\n# 같은 overlay/domain의 별도 터미널에서 관측 GUI:\nros2 launch cleany_base_driver base_monitor.launch.py preset:=true\n```\n\n초기 hardware config는 바퀴를 띄운 시험용입니다. Launch 이후 구동 허가는 별도 절차로 수행하며, mock domain과 실제 MCU domain을 혼용하지 않습니다. 실물 시험은 [ESP32 가이드](../../esp32/README.md)와 [base 계약](../../ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md)을 따릅니다.\n\nPlot은 목표, slew/reversal 이후 목표, encoder 속도(rad/s), PWM(%), diagnostics를 표시합니다. `preset:=false wheel:=fl|fr|rl|rr|all`로 관측 범위를 바꿀 수 있습니다. GUI를 종료해도 별도로 실행한 driver/Agent는 계속 실행됩니다.\n"},"docs/how-to/manipulation.md":{"title":"물체 관찰과 조작 실행하기","body":"# 물체 관찰과 조작 실행하기\n\nPlan-only 후보 선택, Mock Action과 MuJoCo 조작은 실행 범위가 다릅니다. 필요한 경로를 먼저 선택하세요.\n\n```mermaid\nflowchart TD\n  Observe[\"관찰과 대상 선택\"] --> Plan[\"MoveIt 도달성 · 충돌 검사\"]\n  Plan --> Execute[\"접근 · 파지 · 운반\"]\n  Execute --> Verify[\"재관측 · 놓기 · 팔 복귀\"]\n  Verify --> Stop[\"정지 확인과 결과\"]\n  Execute -->|\"실패 / 취소\"| Stop\n```\n\n[공통 환경 준비](../RUNNING.md#공통-준비) · [검증 선택](../TESTING.md)\n\n## MuJoCo와 조작 데모\n\n```bash\nmake sim\n# viewer가 필요하면 build와 overlay source 후:\nros2 launch cleany_mujoco_sim mujoco_sim.launch.py headless:=false\nros2 launch cleany_mujoco_sim rgbd_pick_demo.launch.py\n```\n\n위 두 실행과 `handeye_backend.launch.py` 중 backend 하나만 실행합니다. RGB-D scene 출력은 grasp/skill 입력으로 사용하며, 수거 완료는 별도로 확인해야 합니다.\n\n### 단일 물체 Manipulation Action\n\nMock 서버의 요청, 취소, 조회와 모니터 사용은\n[Mock 실행 안내](../../ros2_ws/src/cleany_skill_executor/docs/manipulation_mock_usage.md)를 따릅니다.\n실제 인식과 MoveIt을 사용하는 MuJoCo BT 스택은 다음 명령으로 실행합니다.\n\n```bash\nmake sim-mujoco-manipulation\n```\n\n이 스택은 승인된 물체 하나를 실행하며, 기존 sorting coordinator와 별도 구성입니다.\n입력, 세부 옵션과 검증 범위는 [MuJoCo BT 서버](../../ros2_ws/src/cleany_manipulation_bt/README.md)를 따릅니다.\n\n### Plan-only 후보 선택\n\nMoveIt을 준비한 뒤 같은 overlay의 별도 터미널에서 후보 선택을 실행합니다.\n\n```bash\nros2 launch cleany_moveit_config mock_planning.launch.py\n# 같은 overlay의 별도 터미널\nros2 launch cleany_skill_executor grasp_selection.launch.py\n```\n\n### MuJoCo 접근 데모\n\n아래 데모는 MuJoCo controller까지 연결합니다. 두 launch는 각각 별도로 실행합니다.\n\n```bash\nros2 launch cleany_skill_executor grasp_execution_demo.launch.py\nros2 launch cleany_skill_executor can_grasp_execution_demo.launch.py\n```\n\n| 데모 | 확인 범위 | 실행 조건 |\n|---|---|---|\n| 기본 grasp | 후보 선택, 두 trajectory 실행, 최종 joint 수렴 | MuJoCo controller 연결 |\n| can grasp | RGB-D 검출, 후보 생성, 충돌 검사, 그리퍼 개방, 방향 보정 pre-grasp 접근 | Viewer/OpenGL 필요; `headless:=true` 미지원 |\n\n두 데모 모두 gripper close, attach, lift와 실제 수거는 검증하지 않습니다. Plan-only action과 데모의 차이는 [Manipulation 계약](../../ros2_ws/src/cleany_interfaces/docs/manipulation.md)을 따릅니다.\n"},"docs/how-to/mapping.md":{"title":"지도 만들기와 저장 지도 주행","body":"# 지도 만들기와 저장 지도 주행\n\nLiDAR, 휠 피드백과 TF를 확인한 뒤 매핑 세션을 시작합니다. 저장된 지도와 원점을 확인하고 주행 구성에 연결합니다.\n\n```mermaid\nflowchart LR\n  Sensors[\"LiDAR + 휠 피드백\"] --> Ready[\"scan · odom · TF 준비\"]\n  Ready --> Session[\"매핑 세션 / Cartographer\"]\n  Session --> View[\"지도 · 스캔 · 궤적 관측\"]\n  Session --> Stop[\"입력 차단 · STOP 확인\"]\n  Stop --> Save[\"지도 저장 · Logger flush · 종료\"]\n```\n\n[공통 환경 준비](../RUNNING.md#공통-준비) · [검증 선택](../TESTING.md)\n\n## 지도·스캔·위치를 함께 보기\n\n![기록된 지도, LiDAR 스캔, 로봇 TF와 궤적을 겹쳐 본 예시](../assets/examples/mapping-poster.png)\n\n실물 bag에 기록된 레이어를 같은 시각으로 표시한 예시입니다. 지도의 회색·흰색·검은색, 스캔 점과 로봇 좌표축을 구분해 봅니다. 궤적은 이동 이력이며 현재 위치는 TF로 표시합니다.\n\n\u003cdetails>\u003csummary>기록 재생 GIF 보기 · 6.7 MB\u003c/summary>\n\u003cimg src=\"../assets/examples/mapping-replay.gif\" alt=\"기록된 SLAM 레이어를 시간순으로 재생한 애니메이션\" loading=\"lazy\">\n\u003cp>기록을 6초 간격으로 표본화한 약 60배속 재생입니다. 새 SLAM 계산이나 완전한 원본 재생이 아니며, 기록 누락은 유지됩니다.\u003c/p>\n\u003c/details>\n\n## 실물 휠 odometry와 2D LiDAR 매핑\n\n1. [개발환경](../DEVELOPMENT_SETUP.md#실물-매핑-의존성)의 외부 Agent와 LiDAR 드라이버를 준비하고 `make build-hardware-mapping`을 실행한다.\n2. 저장소 루트에서 `make run-hardware-mapping`으로 실행할 수 있다. 기존 base, Nav2, 조종기와 중복 실행하지 않는다.\n   별도 터미널에서 직접 launch하려면 빌드한 overlay를 먼저 source한다.\n3. 현재 센서 장착과 일치하는 [프로필](../../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md)을 선택한다.\n\n   ```bash\n   ros2 launch cleany_bringup hardware_mapping.launch.py \\\n     profile:=\"$(ros2 pkg prefix --share cleany_bringup)/config/mapping_legacy.yaml\"\n   ```\n\n4. 로그의 조종 주소와 state_root/web-token 키로 접속한다. 주소의 127.0.0.1만 노트북 LAN 주소로 바꾼다.\n   연결 후 지도 초기화를 누르고 running 상태를 확인한 뒤 휴대폰으로 조종한다. 초기화 접수는 완료를 뜻하지 않는다.\n5. Ctrl+C로 종료하면 입력을 막고 STOP, 지도/pbstream 저장과 Logger flush를 확인한 뒤 장치를 종료한다.\n   지도는 기본 `~/.local/state/cleany/hardware/maps/`, 녹화는 `recordings/`에 보존한다.\n\n`state_root`, `host`, `phone_port`, `mock`은 launch 인자다. 모의 모드는 별도 ROS domain에서 사용하며\n실물 장치 대신 main의 mock MCU를 실행한다. 모의 LiDAR 입력은 런타임 검사 도구가 제공한다.\n새 SLAM은 IMU를 사용하지 않으며 raw scan 원본과 0.30m 마스킹을 유지한다.\n프로필의 `scan_filter.half_angle_deg: 90`은 전방 180도, `180`은 실험용 전방위 360도다.\n각도 변경은 해당 프로필로 하드웨어 런타임을 시작할 때 적용되며, 지도 초기화만으로는 바뀌지 않는다.\n기존 Dev Monitor는 별도로 실행해 지도와 센서를 관측할 수 있다.\n\n휴대폰만 독립 실행할 때는 같은 geometry의 base driver가 먼저 실행돼 있어야 한다.\n\n```bash\nros2 launch cleany_teleop teleop.launch.py \\\n  base_config:=\"$(ros2 pkg prefix --share cleany_base_driver)/config/base_hardware.yaml\"\n```\n\n문제가 발생하면 조종 상태 API의 `last_permission_error`, `event_log`와 매핑 상태 API의\n`status_age_ms`, `error_code`, `error_file`을 먼저 확인한다. 기본 실행의 조종 사건은\n`~/.local/state/cleany/hardware/teleop-events.jsonl`, 매핑 오류 JSON은\n`~/.local/state/cleany/hardware/maps/errors/`에 남는다. `state_root`를 바꿨다면 해당 경로를\n따른다. 오류 JSON을 쓰지 못한 경우 `state_root/mapping.log`에서 traceback을 확인한다.\n\n### 오프라인 SLAM 비교용 원본 bag\n\nLogger의 가공 기록과 별도로 연속적인 센서 입력을 확보하려면 Jetson에서 빌드한\nROS overlay를 source한 뒤 다음 도구를 실행한다. Python 관측기의 큐를 거치지 않고\n네이티브 rosbag2가 `/scan_raw`, `/odom`, `/tf`, `/tf_static`, `/base/wheel_state`,\n`/joint_states`를 저장한다. 조종 명령과 기존 지도 출력은 입력에 포함하지 않는다.\nSQLite에는 `resilient` preset을 적용하며 기본 native cache는 64 MiB다.\n\n```bash\npython3 tools/validation/record_mapping_bag.py \\\n  --output \"$HOME/.local/state/cleany/mapping-bags/trial-$(date +%Y%m%dT%H%M%S)\" \\\n  --duration-s 180\n```\n\n180초가 지나거나 Ctrl+C를 누르면 해당 recorder만 SIGINT로 종료해 cache와 metadata를\n마감한다. 기존 bag 경로는 덮어쓰지 않는다. 같은 비교 주행 중에는 지도 초기화로\nodom 원점을 바꾸지 않는다. 사용한 하드웨어 프로필과 Cartographer 설정도 함께 보존한다.\n원본 bag에서도 시각 공백과 메시지 수를 확인한 뒤 재처리에 사용한다.\n\n## 저장 지도 Navigation\n\n```bash\nmake build-navigation\nsource \"$(make -s print-navigation-install-base)/setup.bash\"\nros2 launch cleany_navigation navigation.launch.py --show-args\n```\n\n[Launch](../../ros2_ws/src/cleany_navigation/launch/navigation.launch.py)에서 지도, backend, sensor 옵션을 확인합니다. `map → odom`의 소유자는 하나만 선택하므로 Mapping과 AMCL을 함께 실행하지 않습니다.\n\n주행 명령은 Mission의 Navigator/Nav2가 생성합니다. Runtime은 `/cmd_vel`을 직접 만들지 않으며, 안전 경로와 sensor 만료 규칙은 [Navigation reference](../../ros2_ws/src/cleany_navigation/docs/safety.md)를 따릅니다.\n\n## 기존 지도 병행 확장\n\n`tools/validation/map_extension/extend.py`는 실행 중인 센서의 `/scan`과\n`/odom`, TF를 읽어 저장된 Cartographer 상태에 새 궤적을 추가한다.\n기존 궤적은 고정하고 `/map_extension` namespace에 지도와 추정 자세를\n발행한다. 기존 `/tf`를 전용 `/map_extension/tf`로 단방향 전달하며 Cartographer도\n그 전용 토픽에만 연결한다. 전역 TF와 주행 명령은 발행하지 않으므로 AMCL/Nav2와 함께 실행할 수 있다.\n입력은 지도 이미지가 아닌 `.pbstream`이다. 시작 시 현재 `map -> base_link`\n자세와 저장 상태의 원점을 이용하므로 기존 AMCL 위치가 맞아 있어야 한다.\n확장 영역에서 기존 AMCL 지도가 부족해져도 확장 Cartographer는 자체 추정을\n계속한다. 자동주행 지도 교체는 별도 작업이며 수동조종으로 확장 영역을 주행한다.\n\nROS 환경과 현재 workspace overlay를 적용한 터미널에서 실행한다.\n`--origin-reader`에는 `tools/validation/map_extension/read_origin.cpp`를\n해당 Cartographer 개발 라이브러리로 빌드한 실행 파일을 지정해야 한다.\n출력 폴더는 아직 존재하지 않는 경로를 사용한다.\n\n```bash\npython3 tools/validation/map_extension/extend.py \\\n  --source /path/to/seed.pbstream \\\n  --output /path/to/local-data/runs/mapping/YYYY-MM-DD_HHMMSS_map-extension \\\n  --origin-reader /path/to/read_origin\n```\n\n출력 폴더에는 입력 사본 `seed.pbstream`, 원점과 시작 자세 `session.json`,\n60초 주기의 `latest.pbstream`, `map.yaml`, `map.pgm`을 저장한다.\n종료할 때는 실행 터미널에서 `Ctrl-C`를 누른다. 궤적 종료와\n`final.pbstream` 저장은 종료 로그와 출력 파일로 확인한다.\nRViz에서는 `/map_extension/map`과 `/map_extension/tracked_pose`를 선택한다.\n원본 지도와 기존 로거는 변경하지 않는다.\n\n확장 RViz는 `/tf`를 `/map_extension/view_tf`로 remap해 실행한다.\n`tools/validation/map_extension/view_tf.py`를 함께 실행하면 LiDAR와 odometry를\n확장 SLAM의 자세 기준으로 표시한다. 궤적과 지도는 `/map_extension` 토픽을\n선택한다. 제약선, raw scan, scan-matched point cloud는 표시 항목에서 켤 수 있다.\n\n확장 중 센서/장치 재시작이나 odom 원점 초기화를 하면 기존 궤적을 계속 사용할 수 없다.\n확장 입력은 `/map_extension/odom`으로 전달되며, 원본 `/odom`에 2초 이상 공백,\n샘플 간 0.25m 초과 이동, 0.35rad 초과 회전 또는 역행 시각이 있으면 전달을 차단하고\n현재 확장 세션을 종료 저장한다. 임계값은 `extend.py --odom-max-*` 인자로 지정한다.\n문제를 해결한 후 깨끗한 원본 상태 또는 마지막 정상 저장 상태로 새 확장을 시작한다.\n\n\nPhone Omni의 횡/대각 선호는 `nav2_phone_omni.yaml`의 `FollowPath.DirectionalMotionCritic`\n두 가중치로 조정한다. 현재 시험값은 lateral=1, diagonal=20 cost/m이며 controller 재구성 시 적용된다.\n이동 1m당 전후진 0, 횡이동 1, 45도 대각이동 20.5가 된다.\n슬립 복구 BT와 자동 학습을 연결하는 설정은 없다. 로거의 motion 항목을 켜면\n`/navigation/slip`의 위치/명령 문맥과 `/navigation/traction_recovery`가 기존 bag에 저장된다.\n"},"docs/how-to/mission.md":{"title":"Mission Runtime 연결하기","body":"# Mission Runtime 연결하기\n\n외부 요청을 Runtime과 연결하고, 실행 허가와 완료·취소 결과를 확인합니다.\n\n```mermaid\nflowchart LR\n  Gateway[\"Backend Gateway\"] --> Runtime[\"Mission Runtime\"]\n  Supervisor[\"Supervisor\"] \u003c-->|\"허가 / 정지 요청\"| Runtime\n  Runtime --> Tasks[\"Navigator / 작업 adapter\"]\n  Tasks -->|\"진행 / 결과\"| Runtime\n  Runtime -->|\"최종 결과\"| Gateway\n```\n\n[공통 환경 준비](../RUNNING.md#공통-준비) · [검증 선택](../TESTING.md)\n\n## Mission Runtime과 Backend\n\n### 주행 구성을 함께 실행\n\n빌드와 overlay 적용 후 Gazebo, Nav2, Runtime, Gateway를 함께 실행합니다.\n\n```bash\nmake build-mission-sim\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 launch cleany_bringup mission_sim.launch.py \\\n  gateway_url:=ws://127.0.0.1:8080/api/robots/cleany-01/gateway/ws \\\n  post_mission:=wait_for_next\n```\n\nBackend는 별도 `cleany-control-plane` 저장소에서 실행합니다. 같은 robot에 Runtime, bridge, canonical odometry producer를 중복 실행하지 않습니다. 책상 작업은 기본 mock이며 관측 ID에는 실제 사진이 포함되지 않습니다.\n\n### 기존 주행 구성에 Runtime 연결\n\nAMCL/Nav2가 이미 실행 중이면 아래 명령으로 Runtime을 연결합니다.\n\n```bash\nmake build-mission-runtime\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 launch cleany_mission_manager mission_runtime.launch.py \\\n  gateway_url:=ws://127.0.0.1:8080/api/robots/cleany-01/gateway/ws \\\n  post_mission:=wait_for_next\n```\n\n`mission_runtime.launch.py`의 기본 `supervision_mode:=required`는 아래 System Supervisor 감독 stack이 함께 실행 중이어야 미션을 받습니다. 감독 없이 실행하면 `SUPERVISOR_UNAVAILABLE` 사유로 거절합니다.\n\n| 실행 조건 | 설정과 동작 |\n|---|---|\n| 감독 없이 단독 실험 | `supervision_mode:=disabled`; snapshot의 `supervision`에 기록. 시스템 Fault와 E-stop 증거를 확인하지 않음 |\n| Nav2 없이 구조 확인 | `navigation_backend:=mock` 추가 |\n| 완료 후 동작 선택 | `post_mission:=return_home\\|wait_for_next`; 제품 복귀 정책은 별도 결정 |\n| 독립 실험 | 별도 `journal_path`, `bridge_journal_path` 사용 |\n| 동일 미션 복구 | 기존 journal DB 유지 |\n\n재연결, 중복, 취소, 재시작 동작은 [Mission 계약](../../ros2_ws/src/cleany_interfaces/docs/mission.md)을 따릅니다.\n\n### System Supervisor 감독 stack\n\nSupervisor, safety adapter, Nav2 lifecycle 복구 owner를 Runtime 옆에 실행합니다. 센서, Nav2와 Runtime은 각자의 launch가 소유합니다.\n\n```bash\nmake build-supervision\nsource \"$(make -s print-navigation-install-base)/setup.bash\"\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 launch cleany_system_supervisor supervision.launch.py \\\n  \"estop_released_topic:=\u003c하드웨어 해제 Bool>\" \"protection_ready_topic:=\u003c보호 계층 Bool>\"\nros2 run cleany_system_supervisor supervisor_operator            # 활성 Fault 확인\nros2 run cleany_system_supervisor supervisor_operator ESTOP --operator \"\u003cname>\"\n```\n\n| 실행 조건 | 설정과 동작 |\n|---|---|\n| 안전 증거 topic 미지정 | 의도된 `FAULT_LOCKED`; Runtime은 `SYSTEM_FAULT_LOCKED`로 거절 |\n| 팔 controller가 있는 구성 | `arm_health:=true`로 `arm_health_monitor` 추가 |\n| Gazebo 통합 실행 | `mission_sim.launch.py supervision:=true`; 시뮬레이션에는 안전 하드웨어가 없어 evidence topic을 주지 않으면 잠김 |\n| 상태 파일 | 기본 `~/.ros/cleany/system_supervisor_state.json`; latched Fault가 재시작 뒤에도 유지 |\n\nFault, 복구와 운영자 절차는 [System Supervisor](../../ros2_ws/src/cleany_system_supervisor/docs/supervision.md)를 따릅니다. 영구 기록이 필요하면 `cleany_logger` 기록 대상에 `/system/events`, `/system/state`, `/system/faults`, `/safety/status`를 추가합니다.\n\n### Gazebo 주행과 Mock 조작\n\n베이스 주행은 Gazebo/Nav2, 인식과 계획 및 팔 조작은 Mock이다. 모든 터미널에 같은 overlay와 DDS domain을 적용한다. 기본 로컬 Mock 실행과 별도로 사용한다.\n\n1. 통합 package를 빌드하고 환경을 적용한다.\n\n```bash\nmake build-mission-sim\nsource \"$(make -s print-install-base)/setup.bash\"\nexport ROS_DOMAIN_ID=186\n```\n\n2. Gateway 없이 시작한다. 세 DB 경로는 분리하고 재시작 시험에서는 보존한다.\n\n```bash\nros2 launch cleany_bringup mission_sim.launch.py \\\n  profile:=fortress headless:=true \\\n  runtime_config:=$PWD/ros2_ws/src/cleany_mission_manager/config/runtime_gazebo_manipulation_mock.yaml \\\n  start_manipulation_mock:=true manipulation_scenario:=success \\\n  post_mission:=wait_for_next enable_bridge:=false enable_telemetry:=false \\\n  journal_path:=$HOME/.local/state/cleany/mission-mock/missions.db \\\n  bridge_journal_path:=$HOME/.local/state/cleany/mission-mock/bridge.db \\\n  manipulation_database_path:=$HOME/.local/state/cleany/mission-mock/manipulation.sqlite3\n```\n\n3. 별도 터미널에서 `ros2 topic echo /mission/status`로 `ready: true`를 확인한 뒤 요청한다. 새 미션에는 새 ID를 사용한다. `NAV2_NOT_READY`이면 Nav2 lifecycle, odom과 TF를 먼저 확인한다.\n\n```bash\nros2 service call /mission/offer cleany_interfaces/srv/OfferMission \\\n  \"{mission_id: gazebo-mock-demo-001, mission_type: clean_desk, target_kind: SEAT, target_id: seat-12, requested_by: manual-test}\"\nros2 topic echo /mission/result\n```\n\n수락 응답은 완료 결과가 아니다. 정상 실행은 두 물체를 서로 다른 execution ID로 처리한 뒤 추가 빈 관측을 확인한다. 물체당 정상 조작 시간은 약 40초다. [개발 Monitor](monitoring.md#개발-monitor)의 실행 → BT에서 ExecuteOne을 선택하거나 매니퓰레이션 화면을 연다. 같은 domain과 overlay를 사용한다.\n\nBackend 조합과 주행 설정은 [Mock 연결 reference](../../ros2_ws/src/cleany_mission_manager/docs/manipulation_mock_integration.md)를 따른다. 기본 종료 정책은 `return_home`이며 위 명령의 첫 시험은 `wait_for_next`를 명시한다.\n\n### 주행도 Mock으로 Action 연결 확인\n\n두 터미널에서 같은 overlay와 `ROS_DOMAIN_ID=186`을 사용한다. 첫 터미널에서 서버를 시작한다.\n\n```bash\nmake build-mission-mock\nsource \"$(make -s print-install-base)/setup.bash\"\nexport ROS_DOMAIN_ID=186\nros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n  mock_config:=$PWD/ros2_ws/src/cleany_mission_manager/config/manipulation_server_fixture.yaml \\\n  database_path:=$HOME/.local/state/cleany/mission-mock/manipulation.sqlite3\n```\n\n두 번째 터미널에서 Runtime을 시작한 뒤 위의 준비 확인과 미션 요청을 수행한다. 이 구성의 주행 성공은 Gazebo 주행 증거가 아니다.\n\n```bash\nros2 run cleany_mission_manager mission_runtime --ros-args \\\n  --params-file ros2_ws/src/cleany_mission_manager/config/runtime_manipulation_mock.yaml \\\n  -p targets_file:=$PWD/ros2_ws/src/cleany_mission_manager/config/study_cafe_targets.yaml \\\n  -p post_mission:=wait_for_next \\\n  -p journal_path:=$HOME/.local/state/cleany/mission-mock/missions.db\n```\n"},"docs/how-to/monitoring.md":{"title":"상태를 보고 기록하기","body":"# 상태를 보고 기록하기\n\nMonitor는 상태를 표시하고, 독립 Logger는 기록을 소유합니다. 화면을 닫는 것과 기록 종료를 구분합니다.\n\n```mermaid\nflowchart LR\n  ROS[\"ROS 상태 · 센서 · 이벤트\"] --> Logger[\"독립 Logger\"]\n  Logger --> Store[\"rosbag2 + SQLite\"]\n  Store --> Read[\"ArchiveReader\"]\n  Read --> UI[\"Monitor / CLI\"]\n  ROS -->|\"실시간 구독\"| UI\n```\n\n[공통 환경 준비](../RUNNING.md#공통-준비) · [검증 선택](../TESTING.md)\n\n## 화면과 기록의 소유권\n\n![Logger, 저장소, Monitor와 CLI의 관계](../../ros2_ws/src/cleany_logger/docs/assets/logger-architecture.svg)\n\n화면에서 보이는 카메라 preview와 원본 녹화 정책은 별개입니다. 기록 시작·종료는 Logger 상태로 확인하고, 과거 자료는 읽기 전용 조회 경로를 사용합니다.\n\n## 개발 Monitor\n\n```bash\nmake build-dev-monitor\nmake run-dev-monitor\n```\n\n브라우저에서 `http://127.0.0.1:8768`을 엽니다. Monitor는 관측 전용이며, 관측 대상과 같은 DDS domain과 메시지 overlay가 필요합니다. Frontend 준비는 [개발환경](../DEVELOPMENT_SETUP.md)을 따릅니다.\n\n실시간 입력과 logger 연결은 [monitor.yaml](../../ros2_ws/src/cleany_dev_monitor/config/monitor.yaml)에서\n설정합니다. `make build-dev-monitor`는 logger도 빌드하지만 Monitor 실행은 logger를\n자동 시작하지 않습니다. 기록은 아래 절차로 별도 실행합니다. 웹 자산 갱신 후에는\n`make build-dev-monitor-ros`로 설치 자산도 갱신합니다.\n\n### 독립 Logger\n\n1. 웹 없이 logger만 빌드하려면 `make build-logger`를 실행합니다.\n2. 빌드 overlay를 source한 별도 터미널에서 logger를 시작합니다.\n   CLI에서 토픽을 먼저 설정하려면 녹화 대기 상태로 실행합니다.\n\n   ```bash\n   ros2 launch cleany_logger logger.launch.py record_on_start:=false\n   ```\n\n   기본값인 `record_on_start:=true`는 즉시 녹화하며, 시뮬레이션에서는\n   `use_sim_time:=true`를 지정합니다. `make run-logger LOGGER_LAUNCH_ARGS='record_on_start:=true'`도\n   사용할 수 있습니다.\n3. 같은 DDS domain과 빌드 overlay를 사용하는 다른 터미널에서 CLI로 설정하고\n   녹화합니다. 설정을 먼저 바꾸려면 logger를 `record_on_start:=false`로 실행합니다.\n   이미 녹화 중이면 `stop` 후 설정합니다.\n\n   ```bash\n   ros2 run cleany_logger logger status\n   ros2 run cleany_logger logger topics\n   ros2 run cleany_logger logger topics set camera --topic /camera/head/color/image_raw --hz 2 --enable\n   ros2 run cleany_logger logger topics set path_topic --topic /plan --hz 1 --enable\n   ros2 run cleany_logger logger start\n   ros2 run cleany_logger logger stop\n   ```\n\n   `topics set \u003cID> --disable`은 해당 항목을 끕니다. ID는 `topics` 출력에서 확인합니다.\n   속도 체인은 `topics set velocity_topics --topic /first --topic /second`로 전체를\n   지정하거나 `velocity_topics:0`처럼 특정 항목만 변경합니다. 출처별 `--hz all`은\n   수신마다 기록하며 카메라 등 센서 원본은 숫자 Hz가 필요합니다. 카메라와 점군\n   원본은 대용량이므로 필요한 토픽과 주기를 선택합니다.\n\n   루트에서 `make logger LOGGER_ARGS='status'`로도 호출할 수 있습니다.\n   다른 노드는 `--node /robot/logger`, 대기 시간은 `--timeout 3`, 자동화 출력은\n   `--json`으로 지정합니다. 이 옵션은 하위 명령 앞이나 뒤에 쓸 수 있습니다.\n   CLI는 한 번 요청하고 종료하며 logger 프로세스와 녹화는 계속됩니다.\n4. 대시보드를 사용하려면 별도 터미널에서 `make run-dev-monitor`를 실행합니다.\n   기본 저장 위치는 두 프로세스 모두 `~/.local/state/cleany/recordings`입니다.\n   다른 경로는 logger YAML의 `state_directory`와 Monitor의\n   `MONITOR_ROS_ARGS='-p state_directory:=/absolute/path'`에 동일하게 지정합니다.\n   이전 기록은 기존 디렉터리를 명시해 조회합니다. 대시보드나 브라우저를 종료해도\n   logger는 같은 세션을 녹화합니다.\n\n`mission_sim.launch.py`는 `enable_logger:=true record_on_start:=true`로 logger를\n함께 실행할 수 있습니다. 기본은 비활성이며 `logger_config:=/absolute/logger.yaml`로\n설정을 지정합니다. 이 launch 구성은 시뮬레이션 시계를 logger에 전달합니다.\n\n기록 구조는 [Logger 데이터 계약](../../ros2_ws/src/cleany_logger/docs/data.md),\nHTTP와 stale 처리는 [Monitor 계약](../../ros2_ws/src/cleany_dev_monitor/docs/data.md)을 따릅니다.\n\n상세 SLAM, LiDAR, 점군과 costmap은 같은 domain의 RViz에서 확인합니다. 완료된 원본 bag ZIP을 내려받아 압축을 푼 뒤 다음과 같이 재생합니다. Bag에 기록된 토픽, TF와 CameraInfo만 사용할 수 있으며 SQLite 가공 기록은 RViz 입력이 아닙니다.\n\n```bash\nros2 bag info \"\u003cbag-directory>\"\nros2 bag play \"\u003cbag-directory>\" --clock\nrviz2 --ros-args -p use_sim_time:=true\n```\n\nFixed Frame은 `map_frame`에 맞추고 Cartographer Submaps display에는 해당 plugin을 설치합니다.\n\n진단 토픽은 `\u003cbag-directory>/diagnostics`의 별도 bag에 있습니다. 센서와 함께\n보려면 동일한 시작 시각 기준으로 두 bag을 재생합니다. 센서 bag은 `/clock`을\n발행하고 진단 bag은 `--clock` 없이 재생합니다. 정밀 비교에는 각 bag의 첫 메시지\n시각 차이도 맞춰야 합니다.\n\nLiDAR 매핑의 보정 분석용 기록에서는 `/scan_raw`,\n`/odom`, `/base/wheel_state`, TF를 full-rate로 남기고, 중복 `/scan`, `/wheel/odom`,\n`/joint_states`는 기록에서 제외할 수 있습니다. 재생성에는 당시 필터와 휠 변환\n설정도 보존해야 합니다. 궤적은 1 Hz, 제약선은 0.5 Hz로 기록하고 submap 목록,\nmatched points, map과 가공 관측의 주기는 기존 설정을 유지합니다.\n카메라와 depth 점군은 별도로 선택합니다. 설정은 녹화가 정지된\n상태에서 적용하며 실시간 RViz 표시나 센서 발행 주기는 바꾸지 않습니다.\n시간당 용량은 지도와 그래프 크기에 따라 달라지므로 실제 입력으로 확인합니다.\n이 분석용 주기에 이전의 0.1 Hz 절약 설정에서 측정한 0.97 GB/h를 적용하면 안 됩니다.\n`limit_mib`는 시간당 속도가 아닌 세션 총량 제한입니다.\n\n## Jetson 얼굴 디스플레이\n\n전용 앱은 `/home/cleany/cleany-display`에 독립 설치한다. 자동 로그인 후 로컬 Chromium 키오스크를 실행하고 ROS 상태를 구독한다. 설치, 서비스 재시작과 자동 시작 해제는 [디스플레이 운영](../../ros2_ws/src/cleany_display/README.md)을 따른다. 기존 `/home/cleany/cleany` checkout과 그 실행 프로세스를 변경하지 않는다.\n"},"docs/how-to/phone-navigation.md":{"title":"휴대폰으로 지도 위 목표까지 이동하기","body":"# 휴대폰으로 지도 위 목표까지 이동하기\n\n저장 지도를 불러오고, 휴대폰에서 현재 위치와 목적지를 지정합니다. 이 안내는 **LiDAR 전용 시연 프로필**을 다룹니다.\n\n```mermaid\nflowchart LR\n  Stop[\"STOP / 정지 확인\"] --> Pose[\"현재 위치와 방향 지정\"]\n  Pose --> Preview[\"목표 선택 / 경로 미리보기\"]\n  Preview -->|\"이동 버튼 + 실행 허가\"| Move[\"자동 목표 실행\"]\n  Move -->|\"취소\"| Stop\n```\n\n## 1. 준비하기\n\n| 준비물 | 확인 |\n|---|---|\n| ROS 환경 | Ubuntu 22.04 / ROS 2 Humble. 호스트 실행 도구는 `ros2-humble` Distrobox 사용 |\n| 빌드 | 저장소 루트에서 `make build-hardware-mapping` 완료 |\n| 하드웨어 프로필 | 현재 장치와 포트에 맞춘 YAML. [매핑 프로필 안내](../../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md) |\n| 저장 지도 | `map.yaml`과 그 파일이 참조하는 이미지 |\n| DDS 설정 | 현재 네트워크에 맞는 Fast DDS XML |\n| 작업 공간 | 실제 로봇 주변을 확인하고 정지 수단 확보 |\n\n이 프로필은 LiDAR 평면 장애물을 감시합니다. 높이가 다른 장애물, 팔과 카메라의 전신 충돌, 물리 E-stop의 동작을 보장하지 않습니다. [감시 범위](../../ros2_ws/src/cleany_navigation/docs/safety.md)를 확인하세요.\n\n## 2. 실행하고 접속하기\n\n저장소 루트에서 아래 경로를 현재 환경에 맞게 바꿉니다. 출력 폴더는 이번 실행의 저장 위치입니다.\n\n```bash\npython3 tools/ros2/run-phone-navigation \\\n  --run-root /path/to/local-data/runs/navigation/traction/YYYY-MM-DD_HHMMSS_phone-navigation \\\n  --profile /path/to/hardware-profile.yaml \\\n  --map /path/to/map.yaml \\\n  --dds-profile /path/to/fastdds.xml\n```\n\n기본 프로필은 전후·횡이동을 허용하는 `omni`입니다. 횡이동을 차단하려면 `--motion-profile longitudinal`을 추가합니다. 이 도구는 초기 위치나 이동 목표를 자동 전송하지 않습니다.\n\n휴대폰을 접속 가능한 네트워크에 연결하고 **실행 로그에 표시된 URL**을 엽니다. 주소의 `127.0.0.1`은 로봇 서버가 실행 중인 PC의 접속 가능한 IP로 바꾸고, `#token=...`은 유지하세요. 기본 포트는 `8766`입니다. 화면에서 지도가 보이는지 확인하고 STOP으로 정지 상태를 확인합니다.\n\n## 3. 현재 위치 지정하기\n\n1. **초기 위치 설정 모드**를 켭니다.\n2. 지도에서 로봇의 실제 위치를 누르고, 로봇이 바라보는 방향으로 드래그합니다.\n3. **현재 위치 지정**을 누릅니다.\n4. 위치 정합과 주행 준비 상태가 정상인지 확인합니다.\n\n초기 위치는 정지 상태에서만 설정합니다. 위치가 틀리거나 준비되지 않았다면 목표를 보내기 전에 다시 확인하세요.\n\n## 4. 목표와 경로 확인하기\n\n\u003cdiv class=\"screen-example\">\n\u003cfigure>\u003cimg src=\"../assets/navigation/phone-preview.png\" alt=\"지도에서 이동 패널과 파란 경로 미리보기\" width=\"460\">\u003cfigcaption>합성 입력을 사용하는 UI 캡처. 이 화면은 실물 이동의 검증 결과가 아닙니다.\u003c/figcaption>\u003c/figure>\n\u003cdiv>\n\u003ch3>화면 읽기\u003c/h3>\n\u003cp>\u003cstrong>녹색\u003c/strong>은 로봇 위치, \u003cstrong>빨강\u003c/strong>은 이동 목표, \u003cstrong>파랑\u003c/strong>은 Nav2 전역 경로입니다.\u003c/p>\n\u003cp>초기 위치 설정 모드를 끄고 목적지에서 드래그하면 방향을 지정할 수 있습니다.\u003c/p>\n\u003cp>미리보기가 완료되면 빨간 목표가 계획 경로의 끝점으로 조정됩니다. 표시된 좌표와 방향을 확인하세요.\u003c/p>\n\u003cp>현재 UI는 캡처와 일부 문구가 다를 수 있습니다. 버튼과 상태는 현재 실행 화면을 기준으로 확인합니다.\u003c/p>\n\u003c/div>\n\u003c/div>\n\n지도 클릭은 `ComputePathToPose` 미리보기만 요청합니다. 구동 허가를 얻거나 속도를 발행하지 않습니다. 계획이 준비되고 주행 조건을 만족해야 **이동** 버튼이 활성화됩니다.\n\n## 5. 이동하고 멈추기\n\n| 조작 | 동작 |\n|---|---|\n| **이동** | 표시된 목표를 실행. 로봇 주변과 주행 상태 관찰 |\n| **이동 취소 / 정지** 또는 **STOP** | 자동 목표 취소와 정지 요청. 정지 완료 확인 후 수동 조종 재개 |\n| 휴대폰 화면 끄기·다른 앱으로 전환 | 수락된 자동 목표는 로봇 측 감시 아래 계속 실행 |\n| 수동 조종에서 입력 해제·화면 이탈 | 입력 만료에 따라 정지 |\n\n자동주행 중 화면을 닫는 것으로 정지를 대신하지 마세요. 위치 복구 뒤에도 이전 목표는 자동 재개하지 않습니다.\n\n## 문제가 생겼을 때\n\n| 화면·증상 | 먼저 확인할 것 |\n|---|---|\n| 지도 수신 대기 | 저장 지도 경로와 이미지, 로봇 서버와 네트워크 연결 |\n| 파란 경로가 나오지 않음 | 초기 위치, 지도 안의 목표, 장애물. 경로 오류 확인 후 목표 재선택 |\n| 이동 버튼 비활성 | 경로 미리보기 완료 여부와 위치·센서·Supervisor 준비 사유 |\n| 위치 정합 회복 중 · 감속 주행 | 위치와 지도 일치 여부. 회복되지 않으면 정지·복구하며 새 목표 필요 |\n| 자동 목표가 취소됨 | `/api/navigation/status`의 `last_input_failure`와 실행 로그 |\n| 재기동 뒤 잠금 유지 | `supervisor_operator`로 원인 확인. 원인 미상·실제 고장은 자동 해제 대상이 아님 |\n\n## 실행 옵션과 상세 규약\n\n| 바꾸려는 것 | 위치 |\n|---|---|\n| Omni / longitudinal, 슬립 재시도 | `--motion-profile`, `--slip-recovery true/false` |\n| 지도·입력·출력 경로 | `tools/ros2/run-phone-navigation --help` |\n| 속도·footprint·계획 비용 | [경로 계획과 주행 설정](../../ros2_ws/src/cleany_navigation/docs/planning.md#휴대폰-시연-프로필) |\n| 위치 정합과 복구 조건 | [위치 정합 정책](../../ros2_ws/src/cleany_navigation/docs/planning.md#위치-정합과-복구) |\n| 버튼·API·취소 계약 | [휴대폰 인터페이스](../../ros2_ws/src/cleany_teleop/docs/interfaces.md#지도-클릭-주행-명시적-선택) |\n| Nav2·안전·구동 연결 | [Navigation 구성](../../ros2_ws/src/cleany_navigation/README.md) |\n\n실행 파일은 지정한 run의 `runtime/`과 `ros-log/`에 저장됩니다. 팀에 결과를 공유할 때는 팀이 접근할 수 있는 위치를 사용합니다.\n\n\n## 휴대폰 Omni 주행의 슬립 복구\n\nLiDAR 전용 `phone_navigation.launch.py`의 Omni 프로필은 `slip_recovery:=true`가\n기본이다. `config/phone_slip_recovery.yaml`에서 감지와 복구 시간을 조정한다.\n`slip_recovery:=false`는 기존 기본 BT와 명령 경로를 사용한다. 기본 종방향\n프로필과 다른 launch에는 이 복구가 자동 적용되지 않는다.\n\n약 1초의 LiDAR/휠 이동 비교가 2개 연속 의심이면 BT가 현재 추종을 취소하고\n감속 정지한다. fresh odom과 감속 게이트의 0 출력으로 0.5초 연속 정지를 확인한 뒤 `Longitudinal`\n플래너와 컨트롤러로 같은 목표를 한 번 재시도한다. 해당 목표가 종료될 때까지\n종방향 모드를 유지하며, 정지 중 신호가 사라져도 Omni로 복귀하지 않는다.\n재시도 이후 새 비교 창에서 슬립이 다시 확인되거나 재시도가 실패하면 정지 후\n목표를 실패 처리한다. 슬립 분기에는 costmap 초기화나 무조건적인 회전, 후진\n복구가 없다. 일반 탐색 실패에는 기존 기본 BT 복구를 유지한다.\n\n재시도 플래너는 `/traction_retry/compute_path_to_pose`를 제공하는 별도\n프로세스로 실행한다. 두 Lattice 모델이 내부 static motion table을 공유하는\n간섭을 피하고, 동일한 지도와 안전 footprint를 쓰는 별도 global costmap을 갖는다.\n종방향 MPPI 컨트롤러는 기존 controller server의 `Longitudinal` plugin이다.\n\n감지의 `unknown`은 정상 판정이 아니다. 유효한 측정이 3초 이상 없으면 정지 후\n실패한다. 첫 측정 전에는 명령을 허용하지 않는다. 정지 확인은 5초 제한이며,\n확인 실패도 목표 실패로 끝난다. 센서 비교와 BT tick 주기로 인해 즉시 감지나\n물리 정지 거리를 보장하지 않는다.\n\n명령 흐름은 `motion/cmd_vel → traction_brake → motion/traction_cmd_vel →\ncollision_monitor → navigation/safe_cmd_vel → 기존 최종 구동 소유자`다.\nBT 요청에 따른 감속은 충돌 검사 전에 수행한다. 충돌 STOP과 기존 Supervisor,\nMCU 허가 및 정지 확인은 계속 우선한다. BT heartbeat가 0.5초 또는 명령이\n0.3초 이상 끊기면 게이트는 0을 출력한다. 수동 조종 경로에는 게이트를 삽입하지 않는다.\n"},"docs/how-to/sensors.md":{"title":"센서 입력과 장애물 관측 확인하기","body":"# 센서 입력과 장애물 관측 확인하기\n\n카메라, LiDAR, IMU와 ToF의 입력, 좌표계와 유효 시간을 확인합니다. 장착 보정은 캘리브레이션 가이드로 이어집니다.\n\n```mermaid\nflowchart LR\n  Input[\"RGB-D · LiDAR · 관절 피드백\"] --> Time[\"촬영 시각과 frame 확인\"]\n  Time --> TF[\"TF로 좌표 변환\"]\n  TF --> Output[\"점군 · OBB · 보정 결과\"]\n  Output --> Check[\"장착 조건과 정확도 검증\"]\n```\n\n[공통 환경 준비](../RUNNING.md#공통-준비) · [검증 선택](../TESTING.md)\n\n## 깊이 영상 읽기\n\n![D435에서 관측한 optical depth 영상, 단위 m](../assets/examples/d435-depth.png)\n\n색은 카메라 optical depth의 거리(m)를 나타냅니다. 이 그림만으로 바닥 위 높이나 작은 장애물 검출 성공을 판단하지 않습니다. 차체 좌표의 높이 필터를 확인하려면 TF를 적용한 점군과 비교하세요.\n\n## 실물 IMU\n\nMCU 부팅 보정과 gyro 수신 실행은 [IMU 안내](../../ros2_ws/src/cleany_base_driver/docs/imu.md)를 따른다.\n\n## ToF 근접 보호와 책상 접근\n\n[ToF 계약](../../ros2_ws/src/cleany_tof/docs/interfaces.md)의 명령 경로와 보정 항목을 먼저\n확인한다. 기본 프로파일은 주행을 차단한다. 이 절차는 물리 시험 통과를 의미하지 않는다.\n\n1. `make build-tof`를 실행한다. 공통 navigation은 Ubuntu/Humble 환경에서\n   `make build-navigation`으로 빌드한다. 호스트에서는 `distrobox enter --name ros2-humble\n   --no-tty --clean-path -- make build-navigation`을 사용할 수 있다.\n2. navigation overlay와 `make print-install-base`의 overlay를 순서대로 source한다.\n   기존 로봇 센서, localization, base와 독립 safety evidence를 구성한다.\n3. 공통 `cleany_navigation navigation.launch.py`에 기존 map/robot profile 인자와 함께\n   `tof_enabled:=true tof_params_file:=/absolute/path/to/commissioned-tof.yaml`을 전달한다.\n4. `cleany_system_supervisor supervision.launch.py`는 `tof_required:=true`로 실행한다.\n   실제 estop/protection evidence 인자는 기존 절차를 따른다. ToF 가용성만으로 하드웨어\n   estop 해제나 arm 가용성을 만들어내지 않는다.\n5. Mission launch에 `desk_approach_enabled:=true desk_distance_m:=0.75`를 전달한다.\n   목표는 base 원점 기준 거리이며 현장 좌석과 guard envelope에 맞게 조정한다.\n   Mission, 두 ToF 제어 노드와 기존 안전 경로가 동일한 canonical odom을 보도록 remap한다.\n6. 좌석 pose는 책상 전면을 바라보는 staging pose로 설정한다. Mission이 Nav2 도착과\n   정지를 확인한 뒤 접근을 요청하며, home 복귀에는 접근을 수행하지 않는다.\n\n`tof_driver`의 serial port는 기본적으로 공급 펌웨어 보드의 by-id 경로다. 다른 보드는\n해당 노드의 `port`를 별도 설정한다. 재연결 시 64 zone, 15Hz로 재설정한다. 별도\nteleop도 `nav2/cmd_vel` 입력을 사용하며 ToF 활성 상태에서 `cmd_vel`에 직접 발행하지 않는다.\n\n정상 NO_RETURN은 장애물 미검출로 처리하며 RGB-D proof 없이 주행 입력을 허용한다.\nToF 전용 coverage observer 설정과 no_return_max_*, min_valid/required_zones는 제거한다.\n기존 head-pan depth coverage는 기존 설정에 따른다. 감시 ROI, 인접 검출 수, 확인/해제\n시간과 비상 거리는 ToF YAML의 조정 가능한 후보다. sensor_ready=false나 오래된 frame은\n계속 정지하며, 정상 미검출을 센서 fault로 보고하지 않는다. 미검출이 빈 공간을 보장하지\n않으므로 기존 독립 안전 계층을 활성 상태로 유지한다.\n\nvoxel guard의 충돌 검사와 속도 출력 기본은 `update_period_s: 0.10`(10Hz)다.\n이 값은 voxel 지도 갱신 주기와 별개이며 명시적 robot profile override가 있으면 그 값을\n사용한다. 주기를 조정할 때 상류 출력과 ToF의 command_timeout_s를 함께 확인한다.\n\n## D435 장애물 미리보기\n\n실제 head TF와 카메라가 실행된 ROS 환경에서 다음 명령을 사용한다.\n`FILTER_JSON`은 실행 폴더의 `obstacle-filter.json`, `BODY_JSON`은\n`ros2_ws/src/cleany_navigation/config/d435_fixed_body_boxes.json` 경로다.\n\n```bash\nros2 run cleany_navigation depth_obstacles_preview --ros-args -p filter_file:=\"$FILTER_JSON\" -p body_boxes_file:=\"$BODY_JSON\"\nros2 run rviz2 rviz2 -d tools/validation/config/d435_obstacles.rviz\n```\n\nLiDAR 아래를 제외하려면 filter JSON에 `min_base_z: 0.192`를 지정하고 미리보기 노드만 재시작한다.\n초록 점이 장애물 후보, 주황 점이 CAD 높이의 LiDAR다. 원본 점군은 별도 토픽에 보존한다.\n현재 미리보기는 Nav2 costmap과 Collision Monitor에 연결하지 않는다.\n\n## 실물 depth local costmap 연결\n\n`tools/ros2/run-phone-navigation`에 `--depth-params ros2_ws/src/cleany_navigation/config/phone_depth_local.yaml`을 추가한다. 기존 map, profile, DDS와 slip-recovery 선택은 유지한다. 하위 launch의 `depth_params_file`과 hardware runtime의 `--depth-params`로 전달된다. 생략하면 LiDAR 전용이다. D435 카메라와 실제 head encoder TF는 별도로 실행돼 있어야 한다.\n\n이 overlay는 local VoxelLayer, depth 투영 노드와 기존 Collision Monitor의 depth 입력만 추가한다. global costmap과 3D 누적 장애물 지도, voxel guard는 추가하지 않는다. 원본 유효 광선은 제거용, LiDAR 높이 이상의 필터 점은 표시용이다.\n\n적용 전 조종을 pause하고 MCU 정지 확인, 현재 지도와 pose를 보존한다. 실행 관리자를 정상 종료해 logger를 마무리한 뒤 같은 설정에 overlay를 추가하여 재시작한다. 저장한 pose는 로봇이 움직이지 않은 경우에만 초기 추정으로 복원하고 지도 정합을 확인한다. `tools/validation/check_depth_navigation.py --output /path/to/run/state.json`으로 점군 및 costmap 상태를 기록할 수 있다. 실물 적용 후 위치 복원은 이 도구의 `--restore-pose /path/to/before/state.json`을 명시적으로 사용한다.\n\n롤백은 `--depth-params`를 제거한 뒤 같은 절차로 재시작한다. systemd 실행에서는 해당 인자를 추가한 drop-in만 제거 또는 비활성 이름으로 바꾸고 daemon-reload한다. 카메라가 꺼진 채 depth 프로파일을 유지하면 자동주행 속도 출력은 0으로 제한된다.\n"},"docs/how-to/simulation.md":{"title":"시뮬레이터 실행하기","body":"# 시뮬레이터 실행하기\n\nGazebo에서 센서와 주행을 확인하고, 시설 도구로 시험 환경을 준비합니다. MuJoCo 조작은 별도 작업 가이드를 따릅니다.\n\n```mermaid\nflowchart TD\n  Env[\"Humble 환경과 같은 DDS domain\"] --> Mode{\"실행할 대상\"}\n  Mode -->|\"주행과 센서\"| Gazebo[\"Gazebo\"]\n  Mode -->|\"팔과 물체 조작\"| Mujoco[\"MuJoCo + MoveIt\"]\n  Gazebo --> Observe[\"센서 · odom · TF 확인\"]\n  Mujoco --> Observe\n  Observe --> Run[\"시나리오 실행과 종료 확인\"]\n```\n\n[공통 환경 준비](../RUNNING.md#공통-준비) · [검증 선택](../TESTING.md)\n\n## Gazebo\n\n1. 의존성과 실행 환경을 확인합니다.\n2. Headless base, study-cafe GUI, 전체 시설 GUI 중 하나를 실행합니다.\n\n```bash\nmake deps-gazebo\nmake check-gazebo-env\nmake sim-gazebo                 # headless base\nmake sim-gazebo-study-cafe      # study-cafe GUI; 위 실행과 별도로 사용\nmake sim-gazebo-facility        # 전체 시설 GUI; 위 실행과 별도로 사용\n```\n\nGUI renderer는 `GAZEBO_GUI_RENDER_ENGINE=ogre|ogre2`로 선택합니다. 센서 서버는 OGRE2를 사용하므로 GPU LiDAR와 camera는 headless에서도 OpenGL context가 필요합니다. 지원 환경은 Fortress/Humble입니다.\n\n3. 같은 overlay/domain의 별도 터미널에서 sensor와 odometry를 확인합니다.\n\n```bash\nros2 topic hz /clock\nros2 topic hz /scan\nros2 topic echo /odom --once\nros2 run tf2_ros tf2_echo odom base_link\n```\n\nTopic 등록 이후 실제 발행, 이동, 정지를 각각 확인합니다. 실행별 sensor와 odometry 소유권은 [연동 가이드](../INTEGRATION.md)를 따릅니다.\n\n## 시설 생성 도구와 종료\n\n`ros2 run cleany_gazebo_sim \u003c스크립트명> --help`로 각 도구의 입력을 확인합니다.\n\n| CLI | 출력 |\n|---|---|\n| `generate_mission_targets.py` | 접근 목표 YAML과 검증 JSON |\n| `render_layout_overlay.py` | 명시한 layout, reference image로 배치 SVG |\n| `generate_felt_texture.py` | 명시한 PNG 경로에 펠트 질감 |\n| `generate_roly_textures.py` | 명시한 폴더에 seat/back PNG |\n\n시설 reference 이미지와 입력 fixture는 실행 전에 준비하고 각 도구의 입력 경로로 지정합니다. Clone에 포함되지 않은 자료를 팀에서 사용할 경우 공유 위치와 파일 식별자를 함께 안내합니다. 목표 생성은 정적 footprint 여유를 검사하며, 전체 경로와 팔 도달성은 별도 검증이 필요합니다.\n\nLaunch는 `Ctrl-C`로 종료한 뒤 센서와 명령의 발행 중단과 해당 실행의 자식 종료를 확인합니다. 시나리오 runner의 실패, cleanup 판정은 [테스트 가이드](../TESTING.md)를 따릅니다.\n"},"docs/index.md":{"title":"Cleany 개발 문서","body":"# Cleany 개발 문서\n\n\u003cdiv class=\"hero\">\n\u003cdiv>\n\u003cp class=\"eyebrow\">ROBOT SOFTWARE / ROS 2 HUMBLE\u003c/p>\n\u003cp class=\"hero-title\">구조를 보고.\u003cbr>로봇을 실행하고.\u003cbr>상태를 확인하세요.\u003c/p>\n\u003cp>주행과 매핑, 인식과 조작, MCU 제어, 시뮬레이션과 관측을 연결하는 프로젝트 문서입니다.\u003c/p>\n\u003ca class=\"button\" href=\"RUNNING.md\">실행할 작업 선택 →\u003c/a>\n\u003ca class=\"secondary\" href=\"DEVELOPMENT_SETUP.md\">처음 환경 준비하기\u003c/a>\n\u003c/div>\n\u003c/div>\n\n## 작업에서 시작하기\n\n\u003cdiv class=\"cards\">\n\u003ca class=\"card\" href=\"how-to/simulation.md\">\u003cspan class=\"card-number\">01 / SIMULATE\u003c/span>\u003cstrong>가상 로봇 실행\u003c/strong>\u003cspan>Gazebo 환경과 센서, 주행 확인\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/mapping.md\">\u003cspan class=\"card-number\">02 / MAP &amp; NAVIGATE\u003c/span>\u003cstrong>지도와 주행\u003c/strong>\u003cspan>LiDAR 지도 생성·저장, 목표 주행\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/sensors.md\">\u003cspan class=\"card-number\">03 / PERCEIVE\u003c/span>\u003cstrong>센서와 인식\u003c/strong>\u003cspan>RGB-D, LiDAR, IMU와 ToF 관측\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/manipulation.md\">\u003cspan class=\"card-number\">04 / MANIPULATE\u003c/span>\u003cstrong>관찰·계획·조작\u003c/strong>\u003cspan>물체 선택, MoveIt 계획, Mock·MuJoCo 실행\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/base.md\">\u003cspan class=\"card-number\">05 / CONTROL\u003c/span>\u003cstrong>구동과 펌웨어\u003c/strong>\u003cspan>MCU 연결, 휠 피드백, STOP 확인\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/monitoring.md\">\u003cspan class=\"card-number\">06 / OBSERVE\u003c/span>\u003cstrong>기록과 상태 관측\u003c/strong>\u003cspan>Logger, Monitor와 얼굴 디스플레이\u003c/span>\u003c/a>\n\u003c/div>\n\n## 세부 작업 바로가기\n\n| 필요한 작업 | 안내 |\n|---|---|\n| 처음 설치·빌드 | [개발환경](DEVELOPMENT_SETUP.md) |\n| 휴대폰으로 목표 주행 | [화면으로 따라 하기](how-to/phone-navigation.md) |\n| 외부 요청과 Mission 연결 | [Mission Runtime](how-to/mission.md) |\n| 카메라·헤드·ToF 보정 | [캘리브레이션](CALIBRATION.md) |\n| 변경한 코드 검증 | [검사 선택](TESTING.md) |\n\n## 구조에서 찾아보기\n\n| 궁금한 것 | 문서 |\n|---|---|\n| 명령과 데이터가 어떻게 연결되는가? | [시스템 연결](INTEGRA
