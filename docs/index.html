 왕복 record와 90개 정상 편도, 반복 수 및\n   `response_summary.status == \"success\"`를 확인한다. 이는 설정된 실행·ICP\n   조건의 완료이며 외부 위치 정확도 합격과는 별도다. 외부 정확도 판정에는\n   별도로 합의한 위치·yaw 기준과 독립적인 테이프·각도 측정을 사용한다.\n\n제어 응답만 진단할 때는 복사한 config에서 `require_valid_icp: false`를\n명시할 수 있다. 이 경우 결과를 제어 전용으로 표시하며 ICP 거부를 정확도\n검증 성공으로 바꾸지 않는다. 주행·watchdog·경계 중단은 유지한다.\n"},"tools/wheel_calibration/README.md":{"title":"휠 속도 추종 진단","body":"# 휠 속도 추종 진단\n\n전후이동과 횡이동에서 네 휠의 목표 속도, 명령 속도, 실제 속도와 PWM을\n수집하고 정상상태 추종 편차와 지면 하중 FF 추정치를 계산한다.\n순서는 FL, FR, RL, RR이다.\n\n## 실행\n\n레포 루트에서 실행한다. 실물 실행은\n[베이스 드라이버](../../ros2_ws/src/cleany_base_driver/README.md)의 Agent와\nhardware profile 기동 절차를 따른다. 사람 없는 평탄한 시험 공간과\n물리 emergency stop을 준비한다.\n\n```bash\n# 합성 표본 분석만 실행: ROS 연결 및 주행 없음\nbash tools/wheel_calibration/run_wheel_diag.sh --dry-run\n\n# 기본값: 전후와 횡방향 각각 0.5 m 왕복, 0.3 m/s\nbash tools/wheel_calibration/run_wheel_diag.sh \\\n  --pattern both --distance 0.5 --speed 0.3\n```\n\nUbuntu 22.04가 아닌 환경에서는 `ros2-humble` Distrobox로 진입한다.\n실물 ROS domain은 0이다. `--pattern surge|sway|both`,\n`--no-round-trip`, `--odom-timeout`, `--baseline`, `--output-dir`를 지원한다.\n기본 odometry timeout은 0.15초다.\n\n## 분석과 보정 기준값\n\n- `controller_baseline.json`은 `esp32/src/main.cpp`의 휠별 FF·Kp·Ki를 보존한다.\n  테스트가 두 파일의 값 일치를 검사한다.\n- 목표가 안정되고 명령이 목표를 따라가는 표본만 정상상태 분석에 사용한다.\n  정방향과 역방향을 분리하며, 표본이 부족하면 보정 권고를 만들지 않는다.\n- 출력은 진단 근거와 검토용 설정이다. 펌웨어 설정을 자동 변경하거나\n  업로드하지 않는다.\n- 보정값을 변경하면 `esp32/src/main.cpp`와 baseline을 함께 갱신하고\n  부하·노면·방향·속도별로 재검증한다.\n\n주행은 [오도메트리 평가 도구](../odometry_evaluation/README.md)의 공통\n제어·freshness guard를 사용한다. 중복 주행 도구와 다른 `/cmd_vel`\npublisher를 검사하며, odometry 이상 시 STOP과 disable을 요청한다.\n\n## 결과와 테스트\n\n기본 출력은 Git 제외 경로인 `artifacts/wheel_calibration/`이다.\n`wheel_diag_\u003cpattern>_\u003ctimestamp>.json`에 원시 표본, 방향별 통계,\n제어 설정과 펌웨어 소스 해시를 기록한다. 통계와 matplotlib이 있으면\n같은 이름의 `.png`를 생성한다.\n\nROS Humble, NumPy, SciPy, matplotlib과 pytest가 필요하다.\n레포 루트에서 관련 테스트를 실행한다.\n\n```bash\ndistrobox enter ros2-humble --no-tty --clean-path -- bash -c \\\n  'source /opt/ros/humble/setup.bash &&\n   source ros2_ws/install/setup.bash &&\n   PYTHONNOUSERSITE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \\\n   python3 -m pytest -q tools/wheel_calibration tools/odometry_evaluation'\n\nmake test-motor-core test-base\n```\n"}};
const article=document.getElementById('article');
const search=document.getElementById('search');
const results=document.getElementById('search-results');
let current='docs/index.md', generation=0;
function route(path,section=''){const q=new URLSearchParams({page:path});if(section)q.set('section',section);return '#'+q.toString()}
function resolve(path,base){const parts=path.startsWith('/')?[]:base.split('/').slice(0,-1);for(const p of path.split('/')){if(p==='..')parts.pop();else if(p&&p!=='.')parts.push(p)}return parts.join('/')}
function closeMenu(){document.body.classList.remove('nav-open');document.getElementById('menu').setAttribute('aria-expanded','false')}
function slug(text){return text.toLowerCase().replace(/[^\p{L}\p{N}_\- ]/gu,'').replace(/ /g,'-')}
function convertLinks(root,path){
 for(const el of root.querySelectorAll('[href],[src]')){
  const attr=el.hasAttribute('href')?'href':'src';const raw=el.getAttribute(attr);
  if(!raw||/^(https?:|mailto:|data:|blob:)/i.test(raw))continue;
  if(/^[a-z][a-z0-9+.-]*:/i.test(raw)){el.removeAttribute(attr);continue}
  const cut=raw.indexOf('#');const part=cut<0?raw:raw.slice(0,cut);const section=cut<0?'':decodeURIComponent(raw.slice(cut+1));
  const target=part?resolve(decodeURIComponent(part),path):path;
  if(attr==='href'&&pages[target])el.setAttribute(attr,route(target,section));
  else el.setAttribute(attr,'../'+target+(section?'#'+encodeURIComponent(section):''));
 }
}
async function render(){
 const q=new URLSearchParams(location.hash.slice(1));current=q.get('page')||'docs/index.md';const section=q.get('section');const ticket=++generation;
 const page=pages[current];closeMenu();results.replaceChildren();search.value='';
 if(!page){article.innerHTML='<p class="error">문서를 찾을 수 없습니다. 왼쪽 메뉴나 검색에서 다시 선택하세요.</p>';return}
 document.title=page.title+' · Cleany';document.getElementById('breadcrumb').textContent='문서 / '+page.title;
 const source=document.getElementById('source');source.href='../'+current;source.title=current;
 article.className=current==='docs/index.md'?'home':'';
 article.innerHTML=DOMPurify.sanitize(marked.parse(page.body,{gfm:true}),{USE_PROFILES:{html:true},FORBID_TAGS:['style'],FORBID_ATTR:['style']});
 const counts=new Map();for(const h of article.querySelectorAll('h1,h2,h3,h4')){const id=slug(h.textContent);const n=counts.get(id)||0;counts.set(id,n+1);h.id=id+(n?'-'+n:'')}
 convertLinks(article,current);
 for(const image of article.querySelectorAll('img')){
  image.classList.add('zoomable');image.tabIndex=0;image.setAttribute('role','button');image.title='원본 크기로 보기';image.setAttribute('aria-label',image.alt+' · 원본 크기로 보기');
  const zoom=()=>{const large=document.getElementById('zoom-image');large.src=image.src;large.alt=image.alt;document.getElementById('image-dialog').showModal()};
  image.addEventListener('click',zoom);image.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();zoom()}});
 }

 for(const table of article.querySelectorAll('table')){
  const rows=[...table.querySelectorAll('tbody tr')];if(rows.length<12)continue;
  const box=document.createElement('div');box.className='table-filter';const input=document.createElement('input');input.type='search';input.placeholder='이 표에서 이름·타입·설정 찾기';input.setAttribute('aria-label','표 내용 검색');const count=document.createElement('span');count.textContent=rows.length+'개 행';box.append(input,count);table.before(box);
  input.addEventListener('input',()=>{const query=input.value.toLowerCase();let n=0;for(const row of rows){row.hidden=!row.textContent.toLowerCase().includes(query);if(!row.hidden)n++}count.textContent=n+' / '+rows.length+'개 행'});
 }
 for(const pre of article.querySelectorAll('pre')){
  const code=pre.querySelector('code');if(!code)continue;
  if(code.classList.contains('language-mermaid')){
   pre.className='diagram';try{const diagram=await mermaid.render('diagram-'+ticket+'-'+Math.random().toString(36).slice(2),code.textContent);if(ticket!==generation)return;pre.innerHTML=DOMPurify.sanitize(diagram.svg,{USE_PROFILES:{svg:true,svgFilters:true},FORBID_TAGS:['script']})}catch{pre.setAttribute('aria-label','도식 원문')}continue;
  }
  const button=document.createElement('button');button.className='copy';button.textContent='복사';button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.textContent);button.textContent='복사됨'}catch{button.textContent='선택해 복사';const range=document.createRange();range.selectNodeContents(code);const selection=getSelection();selection.removeAllRanges();selection.addRange(range)}});pre.append(button);
 }
 if(ticket!==generation)return;
 const h2=[...article.querySelectorAll('h2')];if(h2.length&&current!=='docs/index.md'){const toc=document.createElement('nav');toc.className='toc';toc.setAttribute('aria-label','이 페이지의 내용');for(const h of h2){const a=document.createElement('a');a.href=route(current,h.id);a.textContent=h.textContent;toc.append(a)}const h1=article.querySelector('h1');if(h1)h1.after(toc)}
 for(const a of document.querySelectorAll('aside a[data-page]')){const active=a.dataset.page===current;a.classList.toggle('active',active);if(active){a.setAttribute('aria-current','page');let parent=a.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement}}else a.removeAttribute('aria-current')}
 const footer=document.createElement('div');footer.className='footer';footer.textContent='Cleany 개발 문서 · 실행 조건과 상세 설정은 연결된 패키지 문서를 확인하세요.';article.append(footer);
 if((current.startsWith('ros2_ws/')||current.startsWith('docs/reference/'))&&page.body.length>6500){
  const sections=[];
  for(const heading of [...article.querySelectorAll(':scope > h2')]){
   const details=document.createElement('details');details.className='reference-section';const summary=document.createElement('summary');let sibling=heading.nextElementSibling;heading.before(details);summary.append(heading);details.append(summary);
   while(sibling&&sibling.tagName!=='H2'&&!sibling.classList.contains('footer')){const next=sibling.nextElementSibling;details.append(sibling);sibling=next}
   sections.push(details);
  }
  if(sections.length){const button=document.createElement('button');button.className='section-toggle';button.textContent='상세 항목 모두 펼치기';button.addEventListener('click',()=>{const open=sections.some(d=>!d.open);sections.forEach(d=>d.open=open);button.textContent=open?'상세 항목 모두 접기':'상세 항목 모두 펼치기'});article.querySelector('h1').after(button)}
 }
 if(section){const target=document.getElementById(section);let parent=target?.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement}target?.scrollIntoView()}else window.scrollTo(0,0);
}
for(const a of document.querySelectorAll('[data-page]'))a.href=route(a.dataset.page);
const packageGroups=new Map();
for(const [path,page] of Object.entries(pages)){
 if(!path.startsWith('ros2_ws/'))continue;
 const name=path.split('/')[2];let group=packageGroups.get(name);
 if(!group){group=document.createElement('details');const label=document.createElement('summary');label.textContent=name.replace('cleany_','');group.append(label);packageGroups.set(name,group);document.getElementById('package-nav').append(group)}
 const a=document.createElement('a');a.href=route(path);a.dataset.page=path;a.textContent=page.title;group.append(a);
}
if(window.mermaid)mermaid.initialize({startOnLoad:false,securityLevel:'strict',htmlLabels:false,theme:'neutral',fontFamily:'system-ui, sans-serif',flowchart:{htmlLabels:false},suppressErrorRendering:true});
search.addEventListener('input',()=>{const terms=search.value.toLowerCase().trim().split(/\s+/).filter(Boolean);results.replaceChildren();if(!terms.length)return;let count=0;for(const [path,page] of Object.entries(pages)){const hay=(page.title+' '+path+' '+page.body).toLowerCase();if(!terms.every(t=>hay.includes(t)))continue;const a=document.createElement('a');a.href=route(path);a.textContent=page.title;const small=document.createElement('small');small.textContent=path;a.append(small);results.append(a);if(++count===16)break}if(!count){const p=document.createElement('p');p.className='empty';p.textContent='검색 결과가 없습니다.';results.append(p)}});
search.addEventListener('keydown',event=>{if(event.key==='Escape')results.replaceChildren();if(event.key==='Enter')results.querySelector('a')?.click()});
document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))results.replaceChildren()});
document.getElementById('menu').addEventListener('click',()=>{const open=document.body.classList.toggle('nav-open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});document.getElementById('scrim').addEventListener('click',closeMenu);
document.getElementById('close-image').addEventListener('click',()=>document.getElementById('image-dialog').close());
addEventListener('hashchange',render);render();
</script>
</body>
</html>
