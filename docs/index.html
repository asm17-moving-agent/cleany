y.md) |\n\n## 휴대폰 주행의 연결\n\n```mermaid\nflowchart TD\n  UI[\"Phone UI\"] --> Bridge[\"NavigationBridge\"]\n  Bridge -->|\"목표\"| Nav[\"Nav2\"]\n  Nav -->|\"nav2/cmd_vel\"| Bridge\n  Bridge -->|\"motion/cmd_vel\"| Monitor[\"Collision Monitor\"]\n  Monitor -->|\"navigation/safe_cmd_vel\"| Final[\"phone_remote / 최종 출력\"]\n  Final -->|\"cmd_vel\"| Base[\"Base driver → MCU\"]\n  Supervisor[\"Supervisor\"] \u003c-->|\"허가 · 정지 요청\"| Bridge\n```\n\n그림은 LiDAR 전용 phone 프로필의 논리적 역할을 표시합니다. NavigationBridge와 최종 출력 처리는 `phone_remote` 프로세스 안에 있습니다. 센서 드라이버와 물리 보호 회로 전체를 나타내는 그림은 아닙니다.\n\n| 흐름 | 실제 연결 |\n|---|---|\n| 목표 | Phone UI → NavigationBridge → `navigate_to_pose` |\n| 경로 미리보기 | NavigationBridge → `compute_path_to_pose`. 구동 허가·속도 발행 없음 |\n| 자동 속도 | `/nav2/cmd_vel` → NavigationBridge → `/motion/cmd_vel` → Collision Monitor → `/navigation/safe_cmd_vel` → `phone_remote` → `/cmd_vel` |\n| 구동 | Base driver → MCU. MCU 응답과 휠 피드백으로 정지 확인 |\n| 허가 | Supervisor의 NAVIGATION lease. Fault·입력 만료 시 중단 |\n| 위치 | `localization_guard`가 scan/map 정합과 제한 속도 제공 |\n\n수동 조종은 자동 목표를 취소하고 정지를 확인한 뒤 기존 operator 경로로 전환합니다. 전체 시스템의 연결은 [연동 구조](../../../docs/INTEGRATION.md)를 참고하세요.\n\n## 실행 프로필 고르기\n\n| 프로필 | 선택 | 주행 방식 |\n|---|---|---|\n| Phone Omni | 실행 도구 기본값 `--motion-profile omni` | 순정 Smac Lattice + Omni MPPI, 횡이동 허용 |\n| Phone longitudinal | `--motion-profile longitudinal` | 직진 우선 계획 + DiffDrive MPPI, 횡이동 차단 |\n| 일반 navigation | AMCL/Nav2 launch | Phone과 별도 프로필. [Planning](docs/planning.md) 참조 |\n\n`phone_navigation.launch.py`를 직접 실행할 때의 기본값은 `longitudinal`입니다. 상위 실행 도구와 기본값이 다르므로 프로필을 명시적으로 선택하세요.\n\n## 설정을 어디서 바꾸나요?\n\n| 조정 대상 | 파일 / 문서 |\n|---|---|\n| Omni 계획·속도·가속도 | [nav2_phone_omni.yaml](config/nav2_phone_omni.yaml), [주행 연속성](docs/planning.md#omni-주행-연속성) |\n| 전후진 전용 프로필 | [nav2_phone_longitudinal.yaml](config/nav2_phone_longitudinal.yaml) |\n| 감속·정지 영역 | [phone_lidar_safety.yaml](config/phone_lidar_safety.yaml), [Collision Monitor](docs/interfaces.md#phone_collision_monitor) |\n| 위치 정합·복구 | [phone_localization.yaml](config/phone_localization.yaml), [정합 정책](docs/planning.md#위치-정합과-복구) |\n| 슬립 관측·재시도 | [phone_slip_recovery.yaml](config/phone_slip_recovery.yaml), [슬립 노드](docs/interfaces.md#slip_monitor-traction_brake와-sliprecovery-bt) |\n| Robot footprint | [phone_lidar_robot.yaml](config/phone_lidar_robot.yaml) |\n| 선택적 D435 입력 | [phone_depth_local.yaml](config/phone_depth_local.yaml), [실행 안내](../../../docs/RUNNING.md#실물-depth-local-costmap-연결) |\n\nLiDAR 프로필은 평면 장애물 감시입니다. 카메라·팔 높이의 3D 충돌이나 실측 제동거리를 보장하지 않습니다. 위치 복구는 정지 후 제한된 후보를 검사하며, 이전 목표를 자동 재개하지 않습니다.\n\n## 변경 후 확인\n\n저장소 루트에서 변경 범위에 맞춰 실행합니다. 빌드 환경과 전체 검사 선택은 [검증 가이드](../../../docs/TESTING.md)를 따릅니다.\n\n| 변경 | 명령 |\n|---|---|\n| 매핑 수명주기·스캔 필터·하드웨어 프로필 | `make test-hardware-mapping-core` |\n| Navigation C++·노드·프로필 | `make test-navigation` |\n| Launch·설치 데이터·인터페이스 | `make build-hardware-mapping`, `make test-hardware-mapping` |\n\n합성 입력 검사는 실물 주행 시험을 대신하지 않습니다. 실물에서는 위치, 센서, 정지 응답과 공간 조건을 별도로 확인합니다.\n"},"ros2_ws/src/cleany_navigation/docs/interfaces.md":{"title":"cleany_navigation 노드 인터페이스","body":"# cleany_navigation 노드 인터페이스\n\n## localization_guard\n\n실행 파일은 `localization_guard`이며 휴대폰 LiDAR 주행 launch에서 실행한다.\n지도와 scan의 정합을 관측하고, Supervisor가 요청한 정지 상태의 위치 복구를 수행한다.\n\n| 방향 | 이름 | 타입 | 계약 |\n|---|---|---|---|\n| 구독 | `map` | nav_msgs/OccupancyGrid | R/T1; 지도 변경 시 이전 정합 기록 무효화 |\n| 구독 | `scan` | sensor_msgs/LaserScan | Sensor; scan 시각의 TF로 평가 |\n| 구독 | `amcl_pose` | geometry_msgs/PoseWithCovarianceStamped | Sensor; 신선한 map 좌표와 유한 공분산 확인 |\n| 구독 | `diagnostics` | diagnostic_msgs/DiagnosticArray | R10; base_driver의 disarmed와 피드백 나이 확인 |\n| 구독·발행 | `initialpose` | geometry_msgs/PoseWithCovarianceStamped | R10; 수동 입력은 진행 중인 자동 검색을 중단 |\n| 발행 | `system/component_health` | cleany_interfaces/ComponentHealth | R10, 5Hz; source=`localization_alignment`; 검증된 위치의 degraded는 제한된 주행을 위해 AVAILABLE 유지 |\n| 발행 | `localization/status` | std_msgs/String | R1, 5Hz; state/reason/phase, score, 재정합 사유, 속도 제한 비율, 지도 ID와 관측 시각 |\n| 발행 | `navigation/localization_speed_limit` | nav2_msgs/SpeedLimit | R10, 5Hz; percentage=true; 정상 100%, degraded 30%, 미확인·실패 0% |\n| Action 서버 | `localization/recover` | cleany_interfaces/RecoverComponent | 동시에 한 요청; 정지·신선도·후보·AMCL 결과 검증 |\n| 서비스 호출 | `request_nomotion_update` | std_srvs/Empty | 정지 중 위치 미확인 또는 복구 검증 시 실제 AMCL 관측 갱신 요청 |\n\nTF는 읽기만 한다. wheel 명령과 속도를 발행하지 않는다. 토픽 이름은 ROS remap으로\n바꿀 수 있다. 다른 `localization/recover` owner와 동시에 실행하지 않는다.\n상태와 복구 조건은 [위치 정합과 복구](planning.md#위치-정합과-복구)를 따른다.\n\n## slip_monitor, traction_brake와 SlipRecovery BT\n\n| 소유자 | 방향 | 기본 이름 | 타입 | 의미 |\n|---|---|---|---|---|\n| `slip_monitor` | 구독 | `scan_raw`, `odom` | LaserScan, Odometry | 센서 header 시각의 독립 이동 비교, sensor-data QoS |\n| `slip_monitor` | 구독 | `nav2/cmd_vel`, `cmd_vel` | geometry_msgs/Twist | 분석용 요청/최종 명령, sensor-data QoS |\n| `slip_monitor` | 구독 | `map` | nav_msgs/OccupancyGrid | transient-local depth 1, 지도 geometry/cells 식별 해시 |\n| `slip_monitor` | 발행 | `navigation/slip` | std_msgs/String | 5Hz JSON, state, t0/t1, consecutive, reason, 이동 및 오차 |\n| BT `SlipRecovery` | 구독 | `navigation/slip`, `odom` | String, Odometry | 새로운 신뢰 가능한 비교와 fresh 정지 증거 |\n| BT `SlipRecovery` | 구독 | `motion/traction_cmd_vel` | geometry_msgs/Twist | fresh 0 출력 확인, 이후 0.5초 정지 유지 |\n| BT `SlipRecovery` | 발행 | `navigation/traction_brake` | std_msgs/Bool | tick마다 brake heartbeat, true는 감속 정지 |\n| BT `SlipRecovery` | 발행 | `navigation/traction_recovery` | std_msgs/String | JSON phase, reason, retry |\n| `traction_brake` | 구독 | `motion/cmd_vel`, `navigation/traction_brake` | Twist, Bool | 기존 자동 조종 명령과 BT 상태 |\n| `traction_brake` | 발행 | `motion/traction_cmd_vel` | geometry_msgs/Twist | 50Hz 충돌 감시 입력, stale heartbeat/명령은 0 |\n\n`state`는 `unknown`, `clear`, `suspect`, `confirmed`다. `t0/t1`은 scan midpoint의\nROS 초이며 같은 비교를 heartbeat로 재발행해도 연속 횟수는 증가하지 않는다.\n`clear`는 해당 비교에서 검출 증거가 없다는 의미다. 정합 품질 탈락은 `unknown`이다.\n`phase`는 `warming_up`, `normal`, `braking`, `longitudinal_retry`, `failed`,\n`succeeded`, `idle` 중 하나다. 감지 노드는 명령과 TF를 발행하지 않는다.\n\n`SlipRecovery`는 일반 Nav2 subtree와 종방향 retry subtree 두 child를 갖는\ncontrol plugin이다. header age, 수신 freshness와 retry 이후 비교 시작 시각을\n검사한다. 한 목표 안에서 retry latch를 유지하고 취소 시 두 child를 halt한다.\n복구 정책과 시간 설정은 [실행 가이드](../../../../docs/RUNNING.md#휴대폰-omni-주행의-슬립-복구)를 따른다.\n\n종방향 retry는 `/traction_retry/compute_path_to_pose` 액션과 `Longitudinal`\nplanner ID를 사용한다. retry planner server와 그 global costmap은 `traction_retry`\nnamespace와 별도 lifecycle manager를 가지며, 지도와 scan 입력은 `/map`, `/scan`이다.\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## phone_collision_monitor\n\n실행 파일: `phone_collision_monitor`. 실행 노드명: `collision_monitor`. 원본: [phone_collision_monitor.cpp](../src/phone_collision_monitor.cpp).\n\nNav2 Collision Monitor의 lifecycle, 센서 좌표 변환, polygon 판정과 정지를 사용한다.\n지정한 slowdown polygon에서는 고정 비율 대신 병진 합성 속도와 회전의 절대 상한으로\n제한 비율을 계산한다. `translation_limit_m_s`, `rotation_limit_rad_s`가 모두 0이면\n기존 휠 제한만 사용한다. 최종 휠 상한도 함께 검사하며, 작은 명령은 키우지 않는다.\n안전 출력의 별도 발행자를 추가하지 않는다.\n\n`localization_speed_limit_topic`을 지정하면 같은 percentage 제한을 추가로 적용한다.\n`nominal_translation_m_s`, `nominal_rotation_rad_s`를 기준으로 절대 상한을 계산하므로\n이미 작은 명령에 비율을 중복 곱하지 않는다. 신선한 제한이 없으면 0을 출력한다.\n정상값에서 감속값으로 낮출 때는 `localization_limit_ramp_per_s`를 따르며, 0%와\n입력 timeout은 ramp를 거치지 않는다.\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `motion/cmd_vel` | `geometry_msgs/msg/Twist` | R1; `cmd_vel_in_topic` |\n| 토픽 구독 | `scan` | `sensor_msgs/msg/LaserScan` | Sensor; `scan.topic` |\n| 토픽 발행 | `navigation/safe_cmd_vel` | `geometry_msgs/msg/Twist` | R1 lifecycle; `cmd_vel_out_topic` |\n| 토픽 발행 | `safety/stop_zone` | `geometry_msgs/msg/PolygonStamped` | R1 lifecycle; `StopZone.polygon_pub_topic` |\n| 토픽 발행 | `safety/slow_zone` | `geometry_msgs/msg/PolygonStamped` | R1 lifecycle; `SlowZone.polygon_pub_topic` |\n| 서비스 제공 | `collision_monitor/change_state`, `collision_monitor/get_state` | lifecycle_msgs 서비스 | Nav2 lifecycle manager가 소유 |\n\n`phone_lidar_safety.yaml`은 바퀴 외곽 +16cm의 주황 영역과 +5cm 정지 영역을 정의한다. `absolute_limit_polygon` 기본값 `SlowZone`, `wheel_limit_rad_s` 기본값 0.7, wheel radius 0.0635m, wheelbase 0.35m, wheel separation 0.59m를 사용한다. 속도와 geometry 변경은 lifecycle 재구성을 거친다. `SlowZone.slowdown_ratio`는 계산에 쓰는 고정 감속비가 아니며 각 입력에서 상한 비율로 대체된다. 상한보다 작은 명령은 그대로 통과한다.\n\n## depth_clearance\n\n실행 파일: `depth_clearance`. 원본: [depth_clearance_node.py](../cleany_navigation/depth_clearance_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `camera/head/depth/image_raw` | `sensor_msgs/msg/Image` | B1; `input_topic` |\n| 토픽 구독 | `camera/head/depth/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor; `camera_info_topic` |\n| 토픽 발행 | `camera/head/depth/points` | `sensor_msgs/msg/PointCloud2` | Sensor; 유효 depth 처리 시, `output_topic` |\n| 토픽 발행 | `camera/head/depth/obstacle_points` | `sensor_msgs/msg/PointCloud2` | Sensor; `obstacle_topic` |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n실물 `phone_depth_local.yaml`은 `/camera/d435/depth/image_rect_raw`와\n`/camera/d435/depth/camera_info`를 받아 `/perception/depth/nav_points`(카메라 좌표의\n유효 clearing 관측), `/perception/depth/nav_obstacle_points`(`base_link`의 필터링한\nmarking 점)를 발행한다. 두 출력은 원본 촬영 시각을 유지한다. local VoxelLayer는\n`sensor_frame=d435_depth_frame`으로 ray 시작점을 지정한다.\n`spatial_filter_file` 설정 시 marking에 거리, 높이, 고립점과 voxel 간격 필터를 적용한다.\n`self_filter_boxes_file`은 base 좌표 고정 차체 AABB JSON이며 기존 `self_filter_profile`과\n동시에 지정할 수 없다. self-occluded 광선은 marking과 clearing 모두에서 제외한다.\n실물 설정은 `max_image_age_s=0.5`, `min_valid_fraction=0.05`다. TF 누락, 오래된 영상,\n유효 깊이 부족은 출력하지 않는다. `positive_infinity_is_free=false`로 무효 픽셀을\n빈 공간으로 바꾸지 않는다. 카메라 방향이 바뀌어 재관측하지 못한 장애물은 지우지 않는다.\n\n`phone_collision_monitor`는 이 marking 토픽을 SensorData QoS로 받아 기존 2D 영역에\n적용한다. 실물 overlay의 `required_depth_topic`, `required_depth_frame=base_link`,\n`required_depth_timeout_s=0.5`는 최초 유효 입력 전과 입력 중단, 촬영 시각 만료 시\n속도 입력을 0으로 제한한다. Humble의 기본 source timeout은 오래된 센서를 무시하므로\n같은 Monitor 안에서 필수 depth의 신선도를 별도로 확인한다. 유효 영상에서 장애물만\n없는 빈 점군은 정상 입력이다. 기본 `required_depth_topic`은 비어 있어 LiDAR 전용은 유지된다.\n\n## depth_coverage\n\n실행 파일: `depth_coverage`. 원본: [depth_coverage_node.py](../cleany_navigation/depth_coverage_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `camera/head/depth/image_raw` | `sensor_msgs/msg/Image` | Sensor; `input_topic` |\n| 토픽 구독 | `camera/head/depth/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor; `camera_info_topic` |\n| 토픽 구독 | `nav2/cmd_vel` | `geometry_msgs/msg/Twist` | R10 |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor |\n| 토픽 발행 | `head_pan/coverage` | `std_msgs/msg/String` | R10; `update_period_s` 기본 0.2초 |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n## pan_motion_gate\n\n실행 파일: `pan_motion_gate`. 원본: [pan_motion_gate_node.py](../cleany_navigation/pan_motion_gate_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `nav2/cmd_vel` | `geometry_msgs/msg/Twist` | R10; `command_topic` |\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `joint_states_topic` |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic` |\n| 토픽 구독 | `camera/head/depth/points` | `sensor_msgs/msg/PointCloud2` | Sensor; `depth_topic` |\n| 토픽 발행 | `pan_ready/cmd_vel` | `geometry_msgs/msg/Twist` | R10; `output_topic` |\n| 토픽 발행 | `head_pan/command` | `std_msgs/msg/Float64` | R10; `pan_command_topic` |\n| 토픽 발행 | `head_pan/state` | `std_msgs/msg/String` | R10; `state_topic` |\n\n`observation_only=true`에서는 속도 출력 publisher와 odom/depth 구독을 생성하지 않는다. Update 주기는 `update_period_s` 기본 0.05초다. TF listener는 없다.\n\n## reactive_guard\n\n실행 파일: `reactive_guard`. 원본: [reactive_guard_node.py](../cleany_navigation/reactive_guard_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `safety_2d/cmd_vel` | `geometry_msgs/msg/Twist` | R1; `command_topic` |\n| 토픽 구독 | `nav2/cmd_vel` | `geometry_msgs/msg/Twist` | R1; `raw_command_topic` |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic` |\n| 토픽 구독 | `scan` | `sensor_msgs/msg/LaserScan` | Sensor; `scan_topic` |\n| 토픽 구독 | `camera/head/depth/points` | `sensor_msgs/msg/PointCloud2` | Sensor; `depth_topic` |\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `joint_states_topic`, `require_pan_feedback=true` |\n| 토픽 발행 | `cmd_vel` | `geometry_msgs/msg/Twist` | R1; `output_topic` |\n| 토픽 발행 | `reactive_guard/state` | `std_msgs/msg/String` | R10 |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n선택 실행 경로다. Full voxel 경로의 최종 publisher와 중복 실행하지 않는다. Update 주기는 `update_period_s` 기본 0.05초다.\n\n## obstacle_memory\n\n실행 파일: `obstacle_memory`. 원본: [obstacle_memory_node.py](../cleany_navigation/obstacle_memory_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `map` | `nav_msgs/msg/OccupancyGrid` | R/T1; `map_topic` |\n| 토픽 구독 | `scan` | `sensor_msgs/msg/LaserScan` | Sensor; `scan_topic` |\n| 토픽 구독 | `camera/head/depth/points` | `sensor_msgs/msg/PointCloud2` | Sensor; `depth_topic` |\n| 토픽 발행 | `obstacle_memory/grid` | `nav_msgs/msg/OccupancyGrid` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/lidar` | `nav_msgs/msg/OccupancyGrid` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/depth` | `nav_msgs/msg/OccupancyGrid` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/navigation_grid` | `nav_msgs/msg/OccupancyGrid` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/voxels` | `sensor_msgs/msg/PointCloud2` | R/T1; `world_publish_period` |\n| 토픽 발행 | `obstacle_memory/local_voxels` | `sensor_msgs/msg/PointCloud2` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/voxel_status` | `std_msgs/msg/String` | R/T1 |\n| 서비스 제공 | `obstacle_memory/save` | `std_srvs/srv/Trigger` | Service 기본값 |\n| 서비스 제공 | `obstacle_memory/set_enabled` | `std_srvs/srv/SetBool` | Service 기본값 |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\nUpdate 주기는 `update_period` 기본 0.5초이며, 출력별 실제 발행은 변경 여부와 별도 주기 설정에 따라 달라진다.\n\n## voxel_guard\n\n실행 파일: `voxel_guard`. 원본: [voxel_guard_node.py](../cleany_navigation/voxel_guard_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `safety_2d/cmd_vel` | `geometry_msgs/msg/Twist` | R10; `command_topic` |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic` |\n| 토픽 구독 | `obstacle_memory/voxels` | `sensor_msgs/msg/PointCloud2` | R/T1; `voxel_topic` |\n| 토픽 구독 | `obstacle_memory/voxel_status` | `std_msgs/msg/String` | R/T1; `status_topic` |\n| 토픽 발행 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10; `output_topic` |\n| 토픽 발행 | `body_guard_3d/state` | `std_msgs/msg/String` | R/T1 |\n| 토픽 발행 | `body_guard_3d/risk_voxels` | `sensor_msgs/msg/PointCloud2` | R/T1 |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n충돌 검사와 속도 출력 주기는 `update_period_s` 기본 0.10초(10Hz)다. 기존 Collision Monitor와\nToF의 주기는 별도로 유지한다. 이름 외에도 body profile과 안전 설정이 필요하다.\n\n## nav2_bt_trace\n\n실행 파일: `nav2_bt_trace`. 원본: [bt_trace_node.py](../cleany_navigation/bt_trace_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `behavior_tree_log` | `nav2_msgs/msg/BehaviorTreeLog` | R10; `log_topic` |\n| 토픽 구독 | `bt_navigator/transition_event` | `lifecycle_msgs/msg/TransitionEvent` | R10; `navigator` + suffix |\n| 토픽 구독 | `navigate_to_pose/_action/status` | `action_msgs/msg/GoalStatusArray` | R/T1; `action` + suffix |\n| 토픽 발행 | `navigation/bt_trace` | `std_msgs/msg/String` | R/T1; 입력 이벤트 처리 시, `output_topic` |\n\n시작할 때 `manifest_file`과 `xml_file`을 검증한다.\n\n## 매핑 세션 상태\n\n`mapping/status`의 `error_code`, `error_file`은 마지막 작업 실패의 단계 코드와\n진단 JSON 경로다. 오류가 없으면 빈 문자열이며 새 작업 접수 시 초기화된다.\n`output`은 시작 준비 단계부터 제공되고, `generation`은 성공한 시작 횟수만 나타낸다.\n\n## nav2_lifecycle_recovery\n\n실행 파일: `nav2_lifecycle_recovery`. 원본: [lifecycle_recovery_node.py](../cleany_navigation/lifecycle_recovery_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 액션 제공 | `navigation/recover` | `cleany_interfaces/action/RecoverComponent` | Action 기본값; `actions` |\n| 액션 제공 | `localization/recover` | `cleany_interfaces/action/RecoverComponent` | Action 기본값; `actions` |\n| 서비스 호출 | `lifecycle_manager_navigation/manage_nodes` | `nav2_msgs/srv/ManageLifecycleNodes` | Service 기본값; `lifecycle_managers`, `call_timeout_s` 10초 |\n| 서비스 호출 | `lifecycle_manager_localization/manage_nodes` | `nav2_msgs/srv/ManageLifecycleNodes` | Service 기본값; `lifecycle_managers` |\n\nSystem Supervisor의 복구 요청을 받아 해당 lifecycle manager에 RESET, STARTUP 순서로 위임한다. 모든 Action을 통틀어 한 번에 하나의 goal만 수락하고, cancel은 단계 사이에서만 적용한다. 성공은 manager가 성공을 응답했다는 뜻이며 실제 복구는 Supervisor가 이후 fresh lifecycle과 localization health로 검증한다. `lifecycle_manager_safety`의 collision_monitor와 Nav2 BT recovery는 다루지 않는다. 실제 Nav2 stack에서 RESET 뒤 AMCL 초기 pose와 지도 상태는 검증하지 않았다.\n\n## ToF를 활성화한 명령 경로\n\n`navigation.launch.py tof_enabled:=true`는 `nav2/cmd_vel`과 기존 안전 계층 사이에\n`motion/cmd_vel`을 선택하는 `desk_approach`를 둔다. 기존 최종 안전 출력은\n`proximity/input`으로 옮기고 `proximity_guard`가 유일한 `cmd_vel` 발행자가 된다.\n`depth_coverage`의 고정 구독도 선택된 명령으로 remap한다. 별도 Nav2 노드나 recovery는\n기존과 같은 경로를 사용한다. ToF endpoint와 계약은\n[ToF reference](../../cleany_tof/docs/interfaces.md)를 따른다.\n\n기존 `depth_coverage`와 `head_pan/coverage`는 원래 observer 설정에 따른다. ToF는\nRGB-D coverage 근거를 요청하지 않으며 observer를 강제로 활성화하지 않는다.\n\n병행 지도 확장 실험은 `tools/validation/map_extension/extend.py`에서 표준 Cartographer\n서비스 `start_trajectory`, `finish_trajectory`, `write_state`, `get_trajectory_states`를\n`/map_extension` 아래에서 호출한다. 입력 `/scan`과 `/odom`은 기존 실물 토픽이며,\n지도와 자세 출력은 `/map_extension/map`, `/map_extension/tracked_pose`다.\n`publish_to_tf=false`로 기존 AMCL의 TF 소유권을 유지한다.\n\n### 슬립 관측의 분석 문맥\n\n`navigation/slip.context`는 새 관측 창마다 고정하며 반복 heartbeat에서 갱신하지 않는다.\n`at=t1`의 `map → base_link` TF를 조회해 `pose=[x,y,yaw]`와 `frame`을 담는다.\n과거 TF가 없으면 `pose=null`, `pose_reason=historical_transform_unavailable`이며 최신 TF로\n대체하지 않는다. 위치는 비교 창의 끝점이지 슬립이 시작된 정확한 접촉 위치가 아니다.\n`map_revision`은 문맥 생성 시 수신한 지도의 frame, geometry와 cells에 대한 SHA-256이다.\n\n`commands.requested/output`은 각각 기본 `nav2/cmd_vel`, `cmd_vel`의\n`velocity=[vx,vy,wz]`, `received_at`, `age_s`, `topic`, `reason`을 담는다.\nTwist에 header가 없으므로 `command_time_basis=ros_receive_time`이다. `t1` 이전 마지막\n수신값을 선택하며 기본 `command_context_max_age_s=0.3`보다 오래되거나 값이 없으면 null이다.\n미래 명령을 과거 관측에 붙이지 않는다. 명령 이력은 각 4초/최대 512개로 제한한다.\n기록용 topic/frame은 `requested_command_topic`, `output_command_topic`, `map_topic`,\n`map_frame` 파라미터로 바꾼다. 이 문맥은 감지 판정이나 BT 제어 입력이 아니다.\n\n로거 motion 항목은 `slip_topic`을 5Hz, `traction_recovery_topic`을 수신 이벤트마다 기록한다.\n기존 raw CDR bag, 용량 상한과 보존 정책을 사용한다. 별도 무제한 파일은 만들지 않는다.\n\n\n## depth_obstacles_preview\n\n실행 파일 `depth_obstacles_preview`는 촬영 시점 pan/tilt TF로 깊이 점을\n`base_link`로 변환하는 미리보기 노드다. costmap, clearing, 주행 명령은 발행하지 않는다.\n\n| 방향 | 토픽 | 타입 | 의미 |\n|---|---|---|---|\n| 구독 | `/camera/d435/depth/image_rect_raw` | sensor_msgs/Image | rectified 깊이 |\n| 구독 | `/camera/d435/depth/camera_info` | sensor_msgs/CameraInfo | 깊이 내부 파라미터 |\n| 구독 | `/scan_raw` | sensor_msgs/LaserScan | CAD 높이의 LiDAR 표시 |\n| 발행 | `/perception/depth/measured_points` | sensor_msgs/PointCloud2 | 원본 변환 점 |\n| 발행 | `/perception/depth/obstacle_points` | sensor_msgs/PointCloud2 | 높이, 고정 차체, 고립점 필터 결과 |\n| 발행 | `/perception/depth/ground_points` | sensor_msgs/PointCloud2 | 관측 바닥면 주변 진단용 점 |\n| 발행 | `/perception/lidar/cad_points` | sensor_msgs/PointCloud2 | LiDAR 별도 표시 |\n| 발행 | `/perception/depth/filter_status` | std_msgs/String | 유효성, 개수, `min_base_z` JSON |\n\n센서와 점군 QoS는 SensorData, 상태는 reliable depth 10이다. 촬영 시점 TF를 얻지 못하거나\n새 유효 데이터가 0.5초 동안 없으면 미리보기를 비운다. 원본 촬영 시각을 유지한다.\n`filter_file` JSON의 `min_base_z`를 지정하면 바닥 상대 하한 `min_height` 대신\n`base_link`의 고정 z 하한(m)을 쓴다. 미지정 시 바닥 상대 하한을 사용한다.\n상한 `max_height`는 관측 바닥면 기준이고, floor 설정은 진단용 grid에도 사용한다.\n`body_boxes_file`은 고정 CAD 부품의 ray self-mask이며 자세 미상의 가동 팔은 제외한다.\n별도 static TF `d435_ground_preview`, `lidar_cad_preview`를 발행하며 기존 `lidar_link`는 변경하지 않는다.\n"},"ros2_ws/src/cleany_navigation/docs/mapping.md":{"title":"실물 매핑 세션","body":"# 실물 매핑 세션\n\n```mermaid\nflowchart LR\n  Sensors[\"LiDAR + 휠 피드백\"] --> Ready[\"scan · odom · TF 준비\"]\n  Ready --> Session[\"매핑 세션 / Cartographer\"]\n  Session --> View[\"지도 · 스캔 · 궤적 관측\"]\n  Session --> Stop[\"입력 차단 · STOP 확인\"]\n  Stop --> Save[\"지도 저장 · Logger flush · 종료\"]\n```\n\n[실행 가이드](../../../../docs/how-to/mapping.md) · [하드웨어 프로필](../../cleany_bringup/docs/hardware-mapping.md)\n\n`mapping_scan_filter`는 `scan_raw` 원본을 보존하고 base 전방 180도 중 0.30m 초과 값을\n`scan`으로 발행한다. 후방과 가까운 finite 값은 NaN이며 clearing ray로 바꾸지 않는다.\n센서 yaw를 이용해 전방을 센서 좌표로 변환한다.\n\n`mapping_session`은 지도 세션과 Cartographer, Logger 자식 프로세스를 소유한다.\nAgent, base, 조종 웹과 센서 프로세스는 bringup 수명이므로 지도 초기화로 재시작하지 않는다.\n\n기록 디렉터리에 `recording-settings.json`이 있으면 Logger가 복원한 기록 정책을\n지도 초기화 후에도 유지한다. 저장된 정책이 없는 첫 실행에서만 매핑용 기본 토픽과\n주기를 설정한다. 따라서 초기화가 사용자의 기록 제외나 Hz 설정을 덮어쓰지 않는다.\n\n| ROS endpoint | 타입 | 계약 |\n|---|---|---|\n| `mapping/control` | `MappingControl` 서비스 | reset 또는 stop 접수. request_id와 operation 조합으로 수명 내 중복 제거 |\n| `mapping/status` | `MappingStatus` | Reliable transient local depth 1. phase, generation, output과 이전 output |\n| `teleop/status` | `TeleopStatus` 구독 | 정지 확인은 fresh connected, paused, disabled, stop_confirmed 모두 필요 |\n| `teleop/pause` | `SetBool` client | 초기화와 종료 전 입력 차단. 준비 완료 뒤 차단만 해제 |\n| `wheel_odometry/reset` | `Trigger` client | 이전 SLAM 종료와 STOP 확인 후 오도메트리 원점 재설정 |\n| `write_state` | Cartographer `WriteState` client | 최종 pbstream 파일과 code=0 응답 모두 확인 |\n| `/cleany_logger/*` | `RecordingControl` client | 자신이 시작한 session ID만 정지 |\n\n상태는 idle, queued, stopping, waiting_usb, starting, running, failed다.\nwaiting_usb는 장치 파일만 검사하지 않고 실제 scan과 fresh MCU 연결을 기다린다.\n새 세션은 scan 시각의 `map -> sensor` TF, fresh odom과 새 map을 확인해야 running이 된다.\n\n초기화 순서는 입력 차단과 STOP 확인, 이전 지도/pbstream 저장, Logger flush, 이전 SLAM 종료,\nodom reset, 새 Logger와 SLAM 시작이다. 저장 실패와 남은 자식은 다음 시작을 차단한다.\nESP32 연결 자체가 사라지면 STOP 미확인을 상태에 남기고 재연결을 기다린다.\n\n`map.yaml`은 실제 origin yaw와 immutable PGM을 참조한다. 현재 지도 사본 `map.pgm`,\n`latest.pbstream`, 선택 설정과 출처를 담은 `session.json`, Logger session을 가리키는\n`recording.json`, 종료 결과를 세션별로 보존한다. 기존 세션 디렉터리를 덮어쓰지 않는다.\nMap YAML과 이미지는 임시 파일과 원자적 교체로 갱신한다.\n\nCartographer는 map->odom, base relay는 odom->base_link, 단일 장착 TF는 base_link->sensor를\n소유한다. AMCL이나 별도 SLAM, Gazebo canonical odom과 동시에 실행하지 않는다.\n일반 Cartographer launch는 유지하고 실물 경로는 `cartographer_hardware_2d.lua`를 선택한다.\n\n## 실패 진단\n\n매핑 관리자는 시작 전에 `MappingStatus.output`을 설정하므로 준비 중 실패해도\nCartographer와 Logger 로그의 세션 디렉터리를 찾을 수 있다. `generation`은 정상 시작이\n완료됐을 때만 증가한다.\n\n작업 실패 시 `error_code`는 실패 단계에 따른 `MAPPING_\u003cPHASE>_FAILED`를 나타낸다.\n`error_file`은 output_root의 `errors/\u003coperation_id>.json`을 가리킨다. 파일에는 UTC,\n요청과 작업 식별자, 세션 경로, 실패 당시 상태, 예외 타입과 전체 traceback이 포함된다.\n시작과 정리 작업이 모두 실패하면 두 예외를 함께 보존한다. 관리자의 표준 오류에도\ntraceback을 출력하므로 진단 파일 저장 실패는 runtime의 `mapping.log`에서 확인한다.\n새 요청을 접수하면 현재 오류 필드는 초기화되며 기존 진단 파일은 유지된다.\n실행 중 자식이 종료되면 상태 메시지에서 Cartographer와 Logger를 구분하고 종료 코드와\n로그 경로를 제공한다.\n\n하드웨어 프로필의 `recording_limit_mib`는 최초 세션 정책과 Logger 시작 한도를, `recording_total_limit_mib`는 보존된 전체 기록의 총량 한도를 설정한다. 저장된 `recording-settings.json`이 있으면 세션 한도는 저장된 정책을 우선한다. 총량 한도는 세션 한도 이상이어야 하며, 프로필 변경은 런타임을 다음에 시작할 때 적용한다.\n\nLiDAR 전용 phone navigation은 `lidar_self_mask_cad.yaml`의 고정 기둥 직사각형을 base_link 좌표로 제외한다. CAD -Y를 base +X, CAD +X를 base +Y로 변환하고 기둥 외곽에 15mm 여유를 둔다. 360도 매핑 원본 `/scan_raw`는 변경하지 않으며, 일반 매핑 실행에는 이 마스크를 자동 적용하지 않는다.\n"},"ros2_ws/src/cleany_navigation/docs/planning.md":{"title":"경로 계획과 주행 제어","body":"# 경로 계획과 주행 제어\n\n\n[주행 화면과 조작](../../../../docs/how-to/phone-navigation.md) · [구성 선택](../README.md#실행-프로필-고르기) · [안전 경로](safety.md)\n\n기본 AMCL 및 Omni 프로필은 `nav2_smac_planner::SmacPlannerLattice`와\n`cleany_navigation::MPPIController`를 사용한다. MPPI는 `Omni` 모델로 전후와 횡이동을 허용한다.\n명시적인 `axis_motion:=true`는 기존 축 전용 DWB 프로필을 선택한다.\n\nlaunch는 설치된 `config/lattice/omni-r10cm.json`을 사용하며,\n`GridBased.lattice_filepath`를 명시하면 해당 경로를 우선한다.\n이 lattice는 공식 Nav2 1.1.20 Generator의 5cm 격자, 10cm 반경 설정,\n16개 heading과 144개 primitive를 사용한다. 반경 설정은 실물 최소 회전 반경 측정값이 아니다.\n\n커스텀 MPPI와 critic은 `mppi/src` 및 `include/cleany_navigation/mppi`에서 빌드한다.\n기본 Nav2 MPPI와 구분하도록 controller는 `cleany_navigation::MPPIController`,\ncritic은 `cleany_navigation::mppi::critics`로 등록한다.\n원본 라이선스와 설명은 `mppi/LICENSE.md`와 `mppi/README.upstream.md`에 보존한다.\n\n## 휴대폰 시연 프로필\n\n`phone_navigation.launch.py`는 `phone_motion_profile:=longitudinal`을 기본으로 사용한다. 이 프로필은 통합 MPPI의 DiffDrive 모델과 직진/제자리 회전 Lattice primitive를 사용한다. `phone_motion_profile:=omni`는 기존 Omni 모델과 bundled Omni primitive를 사용한다. 두 프로필 모두 일반 navigation의 기본값을 변경하지 않는다. 이 launch는 명시적 robot_params_file과 기존 안전 센서 입력이 필요하다.\n\n`omni`는 순정 `nav2_smac_planner::SmacPlannerLattice`만 전역 계획에 사용한다. 직선 우선 연결, 고정 방향 XY 탐색, 별도 몸체 방향 탐색과 거리 기준 방향 선택을 거치지 않는다. 현재 phone Omni 기본값인 `omni-r10cm-balanced.json`은 기존 144개 primitive의 좌표와 방향을 그대로 보존하고, 오른쪽 횡이동 16개의 잘못된 `trajectory_length`와 `straight_length`만 실제 거리로 교정한 파일이다. 원본 `omni-r10cm.json`은 일반 navigation 프로필용으로 보존한다.\n\n| Lattice 설정 | 값 | 역할 |\n| --- | --- | --- |\n| `rotation_penalty` | 5.0 | 제자리 회전 비용 |\n| `reverse_penalty` | 1.2 | 후진 확장 비용 |\n| `non_straight_penalty` / `change_penalty` | 1.2 / 0.05 | 곡선과 회전 방향 전환 비용 |\n| `cost_penalty` | 2.0 | 장애물 비용장 반영 |\n| `max_planning_time` | 2.0s | 검색 시간 예산 |\n| `tolerance` | 0.0m | 다른 목표 셀로 대체하지 않음 |\n| `smooth_path` / analytic expansion | false / 0m | primitive 기반 경로 유지 |\n\n순정 Humble Lattice는 클릭 좌표와 yaw를 5cm 셀 및 16개 방향으로 양자화한다. `tolerance=0`도 연속 좌표를 정확히 보존한다는 뜻은 아니다. 컨트롤러의 3cm/0.1rad 도착 판정은 반환된 경로 끝점 기준이다. 웹 UI는 미리보기 반환 끝점을 빨간 목표와 좌표/방향 숫자로 표시하고, 사용자가 이동을 누르면 그 자세를 전달한다. 조종기의 3cm/0.1rad 도착 검사도 이 표시 목표에 적용하며 허용오차를 늘리지 않는다.\n\nMPPI는 `Omni`, 20Hz, 60×0.05s 예측과 1000개 샘플을 사용한다. X/Y 표준편차는 0.1m/s, 회전 표준편차는 0.2rad/s, temperature는 0.1이다. `PathAlignCritic`은 `use_path_orientations=false`로 Lattice 경로의 위치만 평가하며 가중치는 5다. 이동 중 몸체 방향은 방향별 이동 비용, 장애물과 회전 비용으로 결정한다. `PathAngleCritic`과 강제 회전 단계는 비활성이다. GoalCritic/PathFollowCritic의 전환 거리는 0.5m, 가중치는 40/30이다. GoalAngleCritic은 0.15m에서 가중치 12로 최종 방향을 평가한다. TwirlingCritic 가중치 1은 불필요한 회전에 비용을 준다. CostCritic의 일반 반발 비용을 생략하는 도착 영역은 0.3m이며 footprint 충돌 검사는 유지한다. 이 설정은 특정 거리에서 회전·전진·회전 순서를 강제하지 않는다.\n\nLiDAR phone 시연의 footprint는 CAD 바퀴 포함 하부 외곽 0.477×0.6548m를 사용하고 `footprint_padding=0.05`를 적용한다. Collision Monitor 정지 사각형은 같은 외곽을 사방 5cm 확장한 0.577×0.7548m다. 이 여유는 카메라·팔 높이의 3D 충돌 검사나 실측 제동 거리 보증을 뜻하지 않는다.\n\n휴대폰 Omni 자동주행은 병진 합성 속도 `hypot(vx, vy)`를 0.5m/s, 회전을 0.7rad/s로\n제한한다. 주황 영역은 바퀴 외곽 사방 0.16m이며 병진 0.16m/s와 회전 0.3rad/s를\n적용한다. 작은 요청은 키우지 않고, 혼합 명령이 경계를 넘으면 Collision Monitor가\nTwist 전체를 같은 비율로 줄여 곡률을 유지한다. 도착점 0.2m 안에서는 병진 0.06m/s,\n회전 0.15rad/s를 목표 상한으로 사용한다. 휠 10rad/s는 드라이버와 같은 최종 구동\n상한이다. 병진과 회전을 섞으면 이 구동 상한으로 더 느려질 수 있다. 별도 종방향\n프로필의 주행 속도는 기존 값을 유지한다.\n\n횡이동 차단 프로필은 `StraightFirstPlanner`로 몸체 전체가 통과 가능한 직선을 먼저 검사하고, 불가능할 때 Smac Lattice 탐색으로 전환한다. 횡이동 경로는 사용하지 않으며 추가 검색 padding은 0으로 두고 기존 footprint의 5cm 여유를 그대로 검사한다.\n\nlongitudinal 프로필의 `GridBased.prefix_shortcut_distance=1.0`은 Lattice 경로 앞쪽 1m 안에서 연결 가능한 먼 경로점까지 직진과 필요한 제자리 회전으로 연결한다. 격자 시작점에 붙기 위한 짧은 이동과 반대 방향 회전을 줄이며 남은 경로와 최종 자세는 보존한다. 연결은 전체 footprint의 연속 sweep과 최신 costmap을 모두 통과해야 한다. 통과하지 못하면 원래 경로를 유지하며, 다른 프로필의 기본값 0은 이 처리를 끈다.\n\nlongitudinal의 `PathAngleCritic.respect_in_place_rotations=true`는 Lattice 경로의 제자리 회전을 평가한다. 로봇이 선두 경로점의 0.075m 안에 있고 같은 XY에서 yaw만 바뀌면 그 회전 구간의 마지막 yaw를 후보 궤적의 방향 목표로 사용한다. `path_rotate_enabled`는 방향 오차 0.1rad를 넘는 동안 후보 궤적과 출력의 목표 XY 속도를 0으로 제한한다. Omni의 가속도 제한이 켜져 있으면 현재 이동을 먼저 감속하며 그 감속 이동도 충돌 검사에 포함한다. 제한을 끈 기존 프로필은 즉시 XY=0을 적용한다. 측정된 초기 속도는 충돌 예측에 그대로 반영한다. 일반 이동 구간은 기존 경로 방위각 평가를 유지한다.\n\nlongitudinal은 위치가 목표의 3cm 안에 들어오면 최종 GoalAngleCritic을 우선한다. 최종 회전 XY 제한은 2.5cm에서 시작해 3cm 밖에서 해제된다. Omni는 이 강제 단계를 사용하지 않고 비용 평가와 물리적 속도·가속도 제약으로 명령을 정한다.\n\n## 위치 정합과 복구\n\n휴대폰 Omni의 `slip_recovery:=false`는 `slip_monitor`와 로그를 유지하고\n`SlipRecovery` BT, 종방향 재시도 planner와 `traction_brake`를 실행하지 않는다.\n충돌 감시 입력은 `motion/cmd_vel`이며 기본 Nav2 동작과 아래 위치 정합 복구는\n계속 적용한다. 슬립 BT를 켜면 입력은 `motion/traction_cmd_vel`로 바뀐다.\n\n휴대폰 LiDAR 시연의 `localization_guard`는 scan 시각의 base pose로 레이저 끝점을\n지도에 투영하고 점유 셀까지의 거리를 평가한다. 지도 밖과 미확인 영역의 끝점은\n일치로 세지 않는다. 상위 25% 잔차는 평균에서 제외하되 일치 비율의 분모에서는\n제외하지 않는다. 따라서 일부 동적 물체를 허용하면서 미확인 영역만으로 정상 판정을\n만들지 않는다. 공분산이 작다는 사실은 지도 정합 검사를 생략하는 근거가 아니다.\nAMCL의 분산 계산에서 생기는 -1e-9 이내의 수치 오차는 0으로 해석하지만 더 큰\n음수, 비유한 값과 설정 상한을 넘는 분산은 정상 위치 근거로 사용하지 않는다.\n\n`phone_localization.yaml`의 실험 기준은 15cm 이내 끝점 30% 이상, 절사 평균 잔차\n18cm 이하이며 최소 60개 유효 끝점을 요구한다. 1초 연속 정상 관측으로 검증된\n위치만 available이 된다. 이 위치에서 가벼운 불일치가 생기면 degraded로 전환하고\nAMCL이 계속 보정하는 동안 기존 목표와 허가를 유지한다. 새 초기 위치를 아직\n검증하지 못했거나 센서·TF 입력이 오래됐으면 unknown이며 주행을 허용하지 않는다.\n반복 heartbeat는 안정화 시간을 늘리지 않는다.\n이 기준은 지도 품질과 실제 바닥에서 추가 검증해야 하는 시연용 초기값이다.\n\ndegraded는 정상 속도 상한의 30%를 요청한다. 현재 병진 0.15m/s와 회전 0.21rad/s이며\n더 낮은 장애물·도착 상한이 우선한다. MPPI와 기존 Collision Monitor가 같은\n`navigation/localization_speed_limit`을 소비한다. Monitor의 제한 하강 속도는 초당\n30%p이며, 정상 복귀 시 MPPI의 기존 가속도 제한으로 회복한다. 제한 메시지가\n0.6초 동안 없거나 0%를 받으면 Monitor는 즉시 0을 출력한다.\n\n개선은 최고 기록보다 평균 오차가 2cm 줄거나 일치율이 5%p 증가한 경우다. 정상\n기준을 만족하는 새 관측도 개선 시각을 갱신한다. 다만 1초 연속 정상 확인 전에는\n감속을 유지하고, 짧은 정상 관측이 끼어도 총 8초의 대기 한도는 초기화하지 않는다.\n4초간 개선이 없거나 불일치 총 시간이 8초에 도달하면 unavailable로 정지한다. 일치율 10%\n미만과 평균 오차 35cm 초과가 동시에 0.8초 지속되면 먼저 정지한다. 잘못된 공분산,\n큰 불확실성, 입력 단절은 이 대기 시간을 받지 않는다. 정상 기준을 다시 1초 유지하면\navailable이 되지만, 이미 취소된 목표를 자동 재개하지 않는다.\n\nSupervisor가 위치 정합 Fault로 주행 허가를 회수하고 이전 목표의 정지를 확인하면\nbase_disarmed가 안정된 뒤 `localization/recover`를 요청한다. 이 node는 현재 pose\n주변 반경 0.8m와 yaw ±0.7rad만 탐색한다. 별도 학습/검증 빔, 다른 위치 후보와의\n점수 차이, 다음 신선한 scan을 확인하고 나서만 AMCL initialpose를 발행한다.\n복구는 휠을 움직이지 않으며 지도도 수정하지 않는다.\n\n복구 후보는 일치 비율 50% 이상, 기존 절사 평균 대비 4cm 이상 개선되어야 한다.\n공분산만 높고 기존 pose의 정합은 정상인 경우에는 개선량 대신 같은 엄격한 일치\n비율과 후보의 유일성을 확인한다. 큰 공분산은 이동 허가를 막지만 유효한 scan과\nTF를 사용한 복구 탐색까지 막지는 않는다. 정지 중 미확인 상태나 복구 검증 중에는\n0.5초 간격으로 AMCL의 no-motion update를 요청해 새 관측을 확인한다.\n30cm 또는 0.2rad 이상 다른 후보와 점수 차이가 2.5cm 미만이면 모호하다고 거부한다.\nAMCL이 새 pose에서 1.5초간 정상 정합을 유지해야 owner가 성공을 반환하며,\nSupervisor도 다시 신선한 health를 확인한다. 총 2회까지만 시도하고 실패하면 새\n자동 주행을 계속 막는다. 이전 목표를 자동으로 재개하지 않는다.\n\n수동 initialpose, 지도 교체, base 움직임, 입력 중단, 취소는 진행 중인 후보 적용을\n중단한다. 큰 위치 오차나 반복 구조 때문에 후보가 모호하면 수동 초기 위치 설정이\n필요하다. `localization_evidence_directory`에 회차별 지도·scan·seed와 판정 근거를\n저장하며 물리 E-stop 또는 전신 보호 증거를 생성하지 않는다.\n\n## 횡이동과 대각이동의 고정 비용\n\nPhone Omni의 `DirectionalMotionCritic`은 body frame의 이동 각도 θ와 이동 거리로 비용을 계산한다.\n이동 1m당 비용은 `1 × sin²(θ) + 20 × sin²(2θ)`이고, 각 예측점에서 속력과\n`model_dt`를 곱해 적분한다. `lateral_weight=1.0`, `diagonal_weight=20.0`의 단위는\ncost/m이며 일반 plugin 기본값은 각각 0이다. 두 값은 configure 시 읽으므로 변경 후\ncontroller를 재구성해야 한다. 이전 harmonic-overlap 계산과 같은 수치로 호환되지 않는다.\n\n순수 전후진은 0, 횡이동은 1, 45도 대각이동은 20.5 cost/m이다. 횡방향 기본 비용이\n더해져 실제 최대는 약 45.36도에서 20.5031 cost/m이며 각도에 따라 연속적으로 변한다.\n전후와 좌우 부호에 대칭이고 정지 및 제자리 회전에는 비용을 더하지 않는다.\nDiffDrive 복구 controller와 기존 goal checker의 XY 도착 허용오차 안에서는 생략한다.\n모든 비용은 유한한 선호이므로 횡이동 후보를 제거하거나 회전 후 전진 순서를 강제하지 않는다.\n기존 충돌, 도착, 경로 추종 및 회전 비용과 함께 평가한다.\n\n이 비용은 슬립 측정으로 자동 변경하지 않는다. 위치별 위험 지도와 장기 학습은 구현하지 않는다.\n기존 `SlipRecovery`의 감속 정지, 정지 확인, 한 번의 종방향 재시도는 별도로 유지한다.\n가중치는 초기 시험값이며 실제 바닥에서의 개선은 실물 비교로 확인해야 한다.\n\n## MPPI 샘플 초기화\n\n`NoiseGenerator`는 초기화와 reset이 반환되기 전에 완전한 잡음 묶음을 생성한다.\n`regenerate_noises=true`일 때 이후 묶음은 작업 스레드에서 준비한다. reset은 설정,\n운동 모델과 잡음 배열을 같은 잠금 안에서 교체하며, DiffDrive로 전환하면 횡방향 잡음은\n0으로 지운다. 각 controller는 독립 난수 엔진을 소유한다. 이 변경은 후보가 모두\n같아지는 초기 경쟁 상태를 막지만, 비동기 스케줄까지 결정적으로 만들지는 않는다.\n충돌 검사, 비용 가중치와 출력 제한은 바꾸지 않는다.\n\n## Omni 주행 연속성\n\nPhone Omni는 `acceleration_limits=true`로 샘플, 가중 평균, 필터 후 출력과 충돌 회피 대체 후보에 같은 제약을 적용한다. 몸체 X/Y/회전 가속도의 절댓값은 `ax_max=0.20m/s²`, `ay_max=0.15m/s²`, `az_max=0.40rad/s²`이며 네 휠의 명령 가속도는 `wheel_acceleration_max=3rad/s²` 이내다. Twist 전체를 같은 비율로 보간하여 혼합 이동의 휠 제한도 함께 지킨다. 이 모드는 대칭 가감속이며 기존 `ax_min`, `ay_min` 값은 사용하지 않는다. 첫 호출 또는 0.2초 넘는 호출 공백에서는 측정 odom 속도에서 시작하고, 연속 호출에서는 직전 출력에서 시작한다. 측정 초기 속도는 footprint 충돌 예측에 유지한다. 일반 MPPI 프로필의 가속도 제한 기본값은 false다.\n\nOmni의 `path_velocity_weight=0`은 직선 구간을 판별해 횡오차를 벌점으로 주던 별도 규칙을 끈다. `control_variation_weight=1`은 연속 명령 변화에 비용을 추가한다. `path_rotate_enabled=false`와 `goal_rotate_enter_radius=goal_rotate_exit_radius=0`으로 경로·도착 회전 단계의 XY 강제 제한과 그 단계에 연결된 거리 속도 제한을 끈다. 샘플과 출력의 휠 속도 및 가속도 제한은 유지한다.\n\n`proximity_translation_max`와 `proximity_yaw_max`는 local costmap의 치명적 또는\n미관측 셀과 padded footprint 외접 사각형 사이 거리로 사전 감속을 계산한다.\n`proximity_clearance=0.11m`는 wheel+5cm footprint에서 wheel+16cm 주황 영역까지의\n거리다. 셀 반대각을 차감하고, 축 및 휠 가속도 중 보수적인 감속도와\n`speed_limit_reaction_time=0.3s`를 반영한다. 0.5m/s에서 0.16m/s로 감속하기 위한\n계산상 시작 거리는 주황 경계 약 0.98m 전이다. 이는 실측 정지 거리 보장이 아니다.\n목표점 접근에도 같은 제동 곡선을 적용한다. 상한이 낮아질 때 기존 속도는 가감속\n제약을 따라 줄이고, 실제 주황 영역의 절대 상한과 빨간 영역 정지는 Collision\nMonitor가 적용한다. 입력 단절과 갑자기 나타난 장애물의 정지는 평활화하지 않는다.\n\n### 대칭 고정 자세 이동 후보\n\n`config/lattice/omni-r10cm-symmetric-translation.json`은 비교용으로 보존한 선택적 구성이다.\n기존 16개 heading과 5cm 격자를 유지하고, 각 heading에서 몸체 기준 전후, 좌우,\n네 대각선의 8방향 이동을 제공한다. 축 이동과 대각선 이동의 길이는 다르지만 반대\n방향 및 좌우 반사 쌍은 같은 길이다. 고정 자세 이동 128개와 기존 제자리 회전\n32개, 곡선 64개로 총 224개다. 일반 navigation의 기본 파일은 변경하지 않는다.\n\n`tools/validation/native_lattice_mppi/symmetric_translation.py SOURCE OUTPUT --audit AUDIT`\n명령으로 후보와 회전 대칭 검사를 재생성한다. `SOURCE`에는 balanced 파일을 준다.\n기존 곡선과 제자리 회전의 pose와 길이는 보존한다. 45도 배수 heading의 좌우 회전은\n대칭이지만, 나머지 heading은 인접 각도 간격이 달라 반사 쌍이 없다.\n\n후진을 직접 포함하므로 `allow_reverse_expansion=true`와 조합하면 중복 확장이\n생길 수 있다. 사용 전 확장 설정과 후진 비용, 경로 품질 및 검색 시간을 검증한다.\n구조 검사는 `tests/tools/test_symmetric_primitives.py`, 순정 Smac 파일 읽기는\n`native_lattice_mppi` CMake 대상 `primitive_probe`로 실행한다. 이 검사는 실물 주행이나\n충돌 없는 경로 생성을 보증하지 않는다.\n"},"ros2_ws/src/cleany_navigation/docs/safety.md":{"title":"Navigation 안전 계약","body":"# Navigation 안전 계약\n\n기본 full runtime은 Nav2 속도를 pan gate, Collision Monitor, voxel guard 순서로 검사한다. 모든 단계가 기본 활성화이며, 최종 cmd_vel publisher는 voxel guard 하나다. 속도는 Twist x/y/yaw를 사용한다.\n\n```mermaid\nflowchart TB\n    Nav[\"Nav2 / nav2/cmd_vel\"] --> Pan[\"Pan gate / 시야 정렬과 fresh depth\"]\n    Pan -->|\"pan_ready/cmd_vel\"| Collision[\"Collision Monitor / 2D 장애물\"]\n    Collision -->|\"safety_2d/cmd_vel\"| Voxel[\"Voxel guard / 몸체와 제동 sweep\"]\n    Voxel -->|\"cmd_vel / 최종 publisher\"| Base[\"활성 base backend\"]\n    Inputs[\"sensor / odom / TF / localization\"] -. \"freshness와 유효성\" .-> Pan\n    Inputs -.-> Collision\n    Inputs -.-> Voxel\n    Voxel -->|\"필수 입력 단절 / stale / 계산 초과\"| Zero[\"최종 속도 0\"]\n```\n\n## 입력과 TF\n\n| 입력 | 계약 |\n|---|---|\n| scan | LaserScan, LiDAR frame, ROS stamp |\n| odom | child=base_link, 측정 x/y/yaw 속도 |\n| joint_states | head_pan_joint position/velocity, 유효 stamp |\n| Depth image | Rectified 32FC1(m)/16UC1(mm); 0/NaN/-Inf는 관측 없음 |\n| CameraInfo | Image와 동일 크기, optical frame, 유효 K/monocular P, D=0 |\n| Backend TF | odom→base_link, base→LiDAR/head/optical |\n| AMCL TF | map→odom |\n\n## Depth 처리\n\nDepth는 capture stamp의 TF로 변환한다. TF/calibration이 없으면 cloud를 발행하지 않는다. 자기 필터는 park 팔, 고정 몸체, 기둥을 통과하는 ray와 레일 뒤 경계 픽셀을 제거한다. 평행 ray, 표면 접촉, 센서가 몸체 내부인 경우도 보수적으로 판정한다.\n\n회전 head는 정적 자기 필터 대상이 아니며 가려진 ray를 free-space로 처리하지 않는다. 기본 margin은 1 mm이며, 실물 보정 오차에 맞춘 별도 검증이 필요하다.\n\n## Pan과 이동\n\nPan gate는 head_pan/command Float64를 발행하고 TF를 소유하지 않는다. Backend의 actuator adapter와 실측 feedback이 필요하다. 같은 방위각의 범위 내 위치 중 현재 pan에 가장 가까운 값을 선택하며 목표를 clipping하지 않는다.\n\n| 설정 / 모드 | 동작 |\n|---|---|\n| pan_min/max_position_rad | 기본 [-π, π]; 실물 보정 한계 아님 |\n| 자유 이동 | 방향 정렬 + 정렬 이후 fresh depth 확인 |\n| 축 제한 | 정지, settle 추가 확인 |\n| 후진 | 뒤쪽 π rad 정렬, 정지 후 fresh depth; 실물 뒤쪽 시야 검증 필요 |\n| allow_reverse=false | 후진 제외 |\n| 기본 이동 | 전진, 후진, 제자리 회전; 횡이동 차단 |\n| Progress checker | XY 0.15 m 또는 yaw 0.25 rad; 20초간 둘 다 없으면 실패 |\n\n## 차단과 적용 한계\n\nVoxel guard는 몸체 OBB와 예측 제동 sweep를 검사한다. 요청 속도가 0이어도 측정된 관성 이동은 검사한다. Pan/voxel은 steady timer를 사용해 `/clock` 중단 중에도 정지 출력을 유지한다.\n\n| 조건 | 처리 |\n|---|---|\n| Pan 범위 안에 목표 방위각 없음 | PAN_TARGET_OUT_OF_RANGE, 속도 차단 |\n| 필수 입력 단절, stale/future stamp, TF 누락 | 최종 속도 0 |\n| Localization jump, voxel freeze, 계산 초과 | 최종 속도 0 |\n\n몸체 검사는 설정된 park posture를 가정한다. 실시간 팔 FK 감시, 자세 유지는 미구현이며, 관측하지 않은 공간의 안전을 보장하지 않는다. 물리 E-stop, driver watchdog, 실측 제동은 로봇 통합에서 별도 검증한다.\n\n## Memory와 진단\n\nGlobal/local costmap은 obstacle_memory/grid를 max 병합한다. Voxel을 사용하려면 memory가 필요하다. Pan/memory/voxel을 비활성화하면 그에 맞춰 속도 경로가 바뀐다.\n\n| 항목 | 위치 / 동작 |\n|---|---|\n| 진단 토픽 | obstacle_memory/{grid,voxels,voxel_status}, body_guard_3d/state, head_pan/state |\n| Memory service | obstacle_memory/save, obstacle_memory/set_enabled |\n| output_directory | 기본 빈 값; 지정 시 로그, snapshot 기록 |\n| Full runtime alias | amcl_nav2_safety.launch.py |\n| 기본 Nav2 실험 | amcl_nav2.launch.py map:=... |\n| 설정 | 패키지 config/의 pan_enabled/memory_enabled/voxel_enabled 등 |\n\n관련 안내: [실행](../../../../docs/RUNNING.md), [테스트](../../../../docs/TESTING.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n"},"ros2_ws/src/cleany_perception/docs/runtime.md":{"title":"cleany_perception","body":"# cleany_perception\n\n```mermaid\nflowchart LR\n  RGBD[\"동기화된 RGB-D\"] --> TF[\"촬영 시각 TF\"]\n  TF --> Detect[\"검출 · 번호 · 거리 정렬\"]\n  Detect --> Cache[\"snapshot cache\"]\n  Cache --> Select[\"대상 선택\"]\n  Select --> Mask[\"instance mask · support plane\"]\n  Mask --> OBB[\"base_link의 3D OBB\"]\n```\n\n[센서 입력 확인](../../../../docs/how-to/sensors.md) · [조작과 연결](../../../../docs/how-to/manipulation.md)\n\n## 처리 경계\n\n위 흐름은 head RGB-D의 물체 선택 경로입니다. 손목 RGB는 전달받은 대상의 일관성을 따로 검사합니다.\n\n## 입력과 손목 관측\n\n`depth_scene_node`의 Depth/CameraInfo 구독은 best-effort KEEP_LAST(1)이다.\n부하가 높을 때 과거 입력을 순차 처리하지 않고 최신 수신 프레임을 사용한다.\n촬영 timestamp와 `maximum_depth_age_sec` 검사는 유지하며 오래된 Depth를\n현재 시각으로 재표기하지 않는다.\n\n`enable_wrist_observation=true`는 `/perception/observe_wrist_target`를 추가한다.\n현재 sorting의 `yoloe_gemini` + `yoloe_seg` 모드에서는 손목 RGB에 YOLOE-seg를\n실행한다. `wrist_yoloe_model_path`는 왼손목 바닥 위 물체의 HANDOFF,\n`wrist_right_yoloe_model_path`는 오른손목 HANDOFF,\n`wrist_check_yoloe_model_path`는 왼손목 파지 후 CHECK,\n`wrist_mouse_check_yoloe_model_path`는 왼손목 마우스 CHECK,\n`wrist_right_check_yoloe_model_path`는 오른손목 CHECK 체크포인트다. 경로를 비워 두면\n앞 단계 모델을 공유한다. Head RGB-D에서 전달한 예상 OBB를 촬영 시점 TF로 손목 영상에 투영하고,\n별도 오른손목 CHECK 모델을 지정했다면\n`wrist_right_check_yoloe_class_confidence_thresholds`로 그 모델의 클래스별 검출\n기준을 설정할 수 있다. 노드 매개변수의 빈 목록은 head와 같은 기준을 쓴다.\n스터디카페 기본 프로필은 실제 오른손목 컵 파지 자세로 만든 전용 CHECK 모델을\n사용하며 컵 기준만 0.08로 설정한다. 추가 학습한 v2 모델은 서로 다른 독립\n합성 영상 묶음에서 컵 마스크 IoU 0.5 검출이 각각 20/20이었다. 실제 파지\n영상 한 장에서도 컵 검출 신뢰도가 약 0.69였다. 미검출과 관측 오류는 아래 응답 상태로 구분한다.\nGemini 상세 라벨에 포함된 YOLOE 클래스, 투영 box와의 IoU, 단일 물체 여부 및 instance\nmask 위치·면적을 HANDOFF와 CHECK마다 확인한다. 손목 영상은 로컬 YOLOE-seg로 검증한다. 연속 추적 대신 두 시점의 새 영상을 독립적으로 검출하며,\n같은 위치·마스크의 중복 예측만 하나로 취급한다.\n오른손목 HANDOFF 전용 모델이 투영 위치에서 물체를 찾지 못하면, 이미 로드된\n왼손목/양손목 통합 모델로 같은 RGB를 한 번 더 검사한다. 이 경우에도 같은\n클래스·투영 box·마스크 검증을 통과해야 하며, 정상 검출 시 추가 추론은 없다.\n오른손목 CHECK 전용 모델이 놓친 경우에는 왼손목 파지 후 통합 모델로 같은\n검증을 한 번 더 수행한다. 마우스 CHECK만 별도 모델을 쓰므로, 통합 모델을\n휴지 CHECK의 추가 메모리 비용 없이 재사용한다.\nheadless 인식 진단 시 `wrist_failure_image_directory`를 지정하면 YOLOE가\n예상 손목 물체를 찾지 못한 프레임만 PNG로 저장한다. 기본값은 빈 문자열이라\n영상을 저장하지 않는다.\nHANDOFF 이후 RGB·mask 이력을 보관하지 않는다. 손목 카메라는 RGB만 제공하므로\n새 3D 위치나 독립적인 물체 ID는 산출하지 않는다. Head 모델과 다른 손목\n체크포인트를 지정하면 그만큼 모델 메모리가 추가된다.\n\n손목 RGB와 CameraInfo는 exact timestamp로 짝지어 처리한다. 촬영 시점 TF,\n보정값, source/reference ID와 mask 검증 실패는 성공으로 처리하지 않는다.\n`wrist_*` 매개변수로 freshness/TTL, confidence, 투영 시야와 mask 면적 한계를 설정한다.\nHANDOFF와 CHECK는 `after_stamp_ns`보다 새로운 촬영 영상을 요구한다.\n`ObserveWristTarget` 응답은 `OK`, `NOT_DETECTED`, `ERROR`를 구분한다.\n정상 프레임에서 대응 후보가 없으면 `NOT_DETECTED`이며 `success=false`다.\nCHECK 미검출도 실제 촬영 시각과 기존 reference/source ID를 반환하고,\n그 프레임을 다시 CHECK에 사용하면 거부한다. 새 프레임 재시도와 그리퍼 피드백을\n이용한 진행 여부는 skill executor가 판단한다. 센서·TF·모델 오류, 후보 모호성,\n잘못된 mask 및 비정상 confidence는 `ERROR`로 반환하며 미검출로 숨기지 않는다.\n\n## 기존 snapshot 조회\n\n`/perception/get_scene_snapshot` (`cleany_interfaces/srv/GetSceneSnapshot`)은\n`snapshot_id`의 캐시된 2D 관측을 읽는다. `found`, `detections`, `message`를 반환하고,\nTTL과 촬영 시각을 갱신하거나 새 모델 추론을 시작하지 않는다. 누락/만료는 `found=false`다.\n동일 cache를 `InspectScene` 선택 물체 복원에서도 사용한다.\n\n## 필터링 점군 수신 확인\n\n`scene_cloud_receipt_node`는 MoveIt의 `/perception/scene_cloud_filtered`를\n받고, 완전한 비어 있지 않은 PointCloud2의 원본 Header만\n`/perception/scene_cloud_receipt` (`std_msgs/Header`, RELIABLE depth 1)로\n전달한다. 촬영 시각을 현재 시각으로 바꾸거나 timer로 재발행하지 않는다.\n기본 입력은 BEST_EFFORT depth 1이며, 입력 손실/중단 시 확인 메시지도 중단된다.\n`filtered_cloud_topic`, `receipt_topic`을 ROS parameter로 설정한다.\n\n목적은 인식/action을 기다리는 coordinator에서 큰 점군의 수신·복사를\n분리하는 것이다. 점군 좌표나 지도는 바꾸지 않고, mapper에는 기존 전체\n점군이 그대로 입력된다. receipt만으로 지도 갱신/안전을 보장하지 않으며\ncoordinator의 capture-age와 populated OctoMap 수신-age 검사도 필요하다.\n이 경로는 센서 전용 파이프라인 launch에서 함께 시작된다.\n\n## 모델 준비\n\n의존성 설치는 `docs/DEVELOPMENT_SETUP.md`를 따른다. YOLOE checkpoint와\n`mobileclip2_b.ts` text encoder는 `CLEANY_MODEL_DIR` 또는 `~/models` 아래에 준비한다.\n모델은 저장소에 포함하거나 실행 중 자동 다운로드하지 않는다.\nGemini 분류를 사용하는 `yoloe_gemini`는 `GEMINI_API_KEY` 환경변수가 필요하다.\n스터디카페 head/손목 전용 체크포인트는 아래 학습 절과 Skill Executor README를 따른다.\n\n## 실행\n\nJetson에서는 perception을 `172.30.0.11` 전용 GPU service로 실행한다. AnyGrasp의 고정\nMAC, license와 checkpoint는 perception container에 mount하지 않는다. 자세한 절차는\n[`containers/vision`](../../../../containers/vision/README.md)을 따른다. 아래 명령은 native\n개발환경용이다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nexport GEMINI_API_KEY=\"\u003cyour-api-key>\"\nros2 launch cleany_perception inspect_scene.launch.py\n```\n\n입력 topic 기본값:\n\n- `camera/color/image_raw`: `rgb8` 또는 `bgr8`\n- `camera/color/camera_info`\n- `camera/depth/image_raw`: meter `32FC1` 또는 scale parameter를 적용한 `16UC1`\n- `camera/depth/camera_info`\n\n네 메시지는 exact timestamp로 조립한다. RGB와 depth의 해상도와 intrinsics가 일치해야\n한다. 해당 timestamp의 `target_frame \u003c- depth optical frame` TF는 snapshot 직후 Gemini\n전에 확보하고 RGB-D 및 detections와 함께 cache에 보관한다. 기본 cache는 최근 2개\nsnapshot을 120초 동안 유지하며 parameter로 조정한다.\n\n1차 detection은 bbox 중앙 영역의 유효 depth 중앙값으로 대표 3D point를 만들고,\n촬영 시점 TF를 적용해 configured target frame 원점(기본 `base_link`)까지의 거리를\n계산한다. `nearest_object_central_bbox_fraction`과\n`nearest_object_minimum_depth_pixels`로 배경 혼입과 depth hole을 제한한다. 결과는\n유효 거리 오름차순, confidence 내림차순, detector 원본 순서로 번호를 부여하며,\n유효 depth가 부족한 detection은 `distance_valid=false`로 배열 뒤에 남긴다. 자동 조작\ncoordinator는 `distance_valid=true`인 객체만 가까운 순서로 시도해야 한다.\n\n## ROS API\n\nAction:\n\n```text\nperception/inspect_scene  cleany_interfaces/action/InspectScene\n```\n\n빈 query는 `default_query` parameter를 사용한다. 1차 요청은 `snapshot_id=''`,\n`selected_object_id=0`이며, 동시에 하나의 goal만 실행한다. detection이 없으면 빈 2D\ndetection 배열로 성공한다. 2차 요청은 1차 결과의 두 값을 함께 전달한다.\n\n```bash\nros2 action list\nros2 action info /perception/inspect_scene\nros2 action send_goal \\\n  /perception/inspect_scene \\\n  cleany_interfaces/action/InspectScene \\\n  \"{query: 'Detect the box and can on the table.', snapshot_id: '', selected_object_id: 0}\" \\\n  --feedback\n```\n\n2차 요청 예시:\n\n```bash\nros2 action send_goal \\\n  /perception/inspect_scene \\\n  cleany_interfaces/action/InspectScene \\\n  \"{query: '', snapshot_id: 'rgbd-...', selected_object_id: 2}\" \\\n  --feedback\n```\n\n성공 시 같은 snapshot을 다음 topic에도 발행한다.\n\n- `perception/detections_2d`: 번호가 부여된 `DetectedObject2DArray`\n- `perception/objects`: 후속 선택 단계에서 사용할 `DetectedObject3DArray` topic\n\nMuJoCo 통합 데모는 `detector_type=simulation_color`,\n`segmenter_type=simulation_color`로 시뮬레이션 전용 adapter를 선택한다. 이 adapter는\n렌더링된 RGB의 빨강/파랑 픽셀에서 bbox와 mask를 계산할 뿐, 물체 pose나 합성 점을\n주입하지 않는다. 거리와 3D geometry는 운영 경로와 동일하게 실제 depth image,\nCameraInfo 및 촬영 시점 TF에서 계산한다. 색상 규칙은 통합 검증용이므로 실제 배포\nperception 대체물로 사용하지 않는다.\n\n```bash\nros2 topic echo /perception/detections_2d --once\nros2 topic echo /perception/debug_image_latched --once --field encoding \\\n  --qos-reliability reliable --qos-durability transient_local\n```\n\n### System Supervisor readiness\n\n`perception_inspector`는 `health_topic`(기본 `system/component_health`, 빈 값이면 끔)에\n`health_period_seconds`(0.2초)마다 `source=perception` ComponentHealth를 발행한다.\n\n| 상태 | 조건 |\n|---|---|\n| UNKNOWN | 지연 로딩 모델이 아직 로드되지 않음(`preload_models:=true`일 때만 readiness 보고), 또는 RGB-D 동기 snapshot 미수신 |\n| UNAVAILABLE | 최신 동기 RGB-D snapshot이 `health_maximum_rgbd_age_seconds`(1.0초)보다 오래됨 |\n| AVAILABLE | 모델 준비 + fresh 동기 RGB-D |\n\ncamera frame 수신만으로 준비를 선언하지 않는다. Gemini 등 원격 classifier 접근 가능성은\n여기서 확인하지 않으며 요청별 `ERROR_DETECTOR_API`로 보고된다.\n\n## 실패 처리\n\n1차 결과의 `snapshot_id`는 후속 선택 단계가 같은 RGB-D와 촬영 시점 TF를 사용하기 위한\nopaque key다. cache 크기와 TTL을 넘긴 snapshot은 후속 단계에서 사용할 수 없다.\n\n## 모델 로딩 로그\n\n기본 `INFO` 출력은 모델 로딩 시작과 준비 완료·사용 장치를 알린다.\n개별 detector 로딩과 모델·text encoder 경로는 `DEBUG`에서 확인한다.\nMuJoCo 수거·BT launch에서는 `log_level:=debug`, 단독 노드 실행에서는\n`--ros-args --log-level perception_inspector:=debug`로 상세 로그를 켠다.\n\n깊이 점군과 receipt 노드는 ROS context 종료에 따른 executor 중단과 점군 변환\n중단을 정상 종료로 처리한다. ROS가 실행 중일 때의 `RuntimeError`는 다시\n발생시켜 실제 변환 실패가 숨겨지지 않게 한다.\n\n## 검증\n\n```bash\nsource /opt/ros/humble/setup.bash\ncd ros2_ws\ncolcon build --symlink-install --packages-up-to cleany_perception\nsource install/setup.bash\npython3 -m pytest -q src/cleany_perception/test\npython3 -m flake8 src/cleany_perception\ncolcon test --packages-select cleany_perception\ncolcon test-result --verbose\n```\n\n## 스터디카페 MuJoCo 전용 YOLOE-seg 학습\n\n기본 YOLOE-26s-seg의 범용 text prompt는 현재 MuJoCo 종이컵·마우스·휴지·레고를\n안정적으로 검출하지 못했다. `tools/study_cafe_yoloe_dataset.py`는 동일한 study-cafe\nscene의 head RGB 영상을 여러 물체 위치·회전과 밝기 값으로 생성하고, **오프라인 학습\n라벨에만** MuJoCo segmentation geom ID를 쓴다. 실행 중 인식 노드는 RGB-D 픽셀과\nYOLOE 출력만 읽으며 geom ID나 물체 pose를 사용하지 않는다. 생성 데이터와 모델은\n저장소 밖의 모델 디렉터리에 둔다.\n\n손목 시점 학습에는 `--camera left_wrist_rgb` 또는 `right_wrist_rgb`와\n`--joint-positions-json`으로 실제 pregrasp의 관절값을 전달할 수 있다. 손목 시야에\n네 물체가 모두 들어오지 않으면 `--allow-partial-objects`를 사용해 보이는 물체만\n라벨링한다. 서로 다른 카메라 데이터는 같은 클래스 순서로 합쳐 학습하고, 별도 seed의\nholdout 영상으로 head와 양손목 성능을 각각 평가한다. 이 geom ID와 관절값은 오프라인\n학습에만 쓰며 실행 중 인식에는 전달하지 않는다.\n`tools/combine_study_cafe_yoloe_datasets.py`는 클래스 순서를 검사하고 이미지·라벨을\n복사하지 않고 심볼릭 링크로 합친다. 예를 들어 head와 두 손목의 `dataset.yaml`을\n`--source head=... --source left_wrist=... --source right_wrist=...`로 전달한다.\n파지 후 시점을 학습할 때는 `--attached-object lego --attachment-site left_grasp_tcp`처럼\n오프라인 장면의 물체를 TCP 부근에 배치할 수 있다. `--attachment-jitter-m`으로 위치를\n흔들며, 렌더링한 물체 geom에서만 학습 라벨을 만든다. 이는 실제 런타임 물체 위치를\n읽는 기능이 아니며, 생성 자세 밖의 손목 시점 성능을 보장하지 않는다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nexport MUJOCO_GL=egl\nexport OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4\npython3 ros2_ws/src/cleany_perception/tools/study_cafe_yoloe_dataset.py \\\n  --output ~/models/yoloe/study_cafe_sim_v1_dataset \\\n  --train-count 64 --val-count 16\npython3 ros2_ws/src/cleany_perception/tools/finetune_study_cafe_yoloe.py \\\n  --dataset ~/models/yoloe/study_cafe_sim_v1_dataset/dataset.yaml \\\n  --checkpoint ~/models/yoloe/yoloe-26s-seg.pt \\\n  --text-encoder-directory ~/models/yoloe \\\n  --project ~/models/yoloe/study_cafe_sim_v1_training \\\n  --epochs 8 --batch 4 --device cpu\npython3 ros2_ws/src/cleany_perception/tools/evaluate_study_cafe_yoloe.py \\\n  --dataset ~/models/yoloe/study_cafe_sim_v1_dataset/dataset.yaml \\\n  --checkpoint ~/models/yoloe/study_cafe_sim_v1_training/fit/weights/best.pt \\\n  --text-encoder-directory ~/models/yoloe \\\n  --confidence 0.08 --class-thresholds 0.25 0.25 0.25 0.08\ncp ~/models/yoloe/study_cafe_sim_v1_training/fit/weights/best.pt \\\n  ~/models/yoloe/study_cafe_sim_yoloe26s_seg.pt\n```\n\n실행 기본값은 YOLOE 추론 confidence 0.08과 클래스별 컵/마우스/휴지 0.25,\n레고 0.08이다. 클래스별 문턱값은 모델 출력 뒤, Gemini 분류 전에 적용한다.\n마스크 평가는 IoU 0.5를 사용한다. 학습에 쓰지 않은 별도 난수 시드 20장(80개 물체)에서\n범용 모델은 6개, 이 모델과 설정은 71개를 맞췄다. 클래스별로 컵 20/20,\n마우스 18/20, 휴지 18/20, 레고 15/20이었다. 모델 출력 중 GT mask와 IoU 0.5로\n매칭되지 않은 검출은 21개였다. 검증 영상도 같은 scene의 다른 무작위 배치이므로\n실물 인식 성능의 근거로 사용할 수 없다.\n\n## YOLOE-seg 공통 실행 프로필\n\n`config/yoloe_seg.yaml`은 로컬 YOLOE 검출의 instance mask를 선택 객체 분할에\n그대로 사용한다. `config/yoloe_seg_gemini.yaml`은 같은 마스크에 Gemini의\nlabel/category/reason을 결합하며 `learned_rgbd.launch.py`의 기본 프로필이다.\n`model_profile:=\u003cyaml>`로 명시적으로 다른 프로필을 선택할 수 있다.\n`enable_wrist_observation:=true`로 YOLOE-seg 손목 HANDOFF/CHECK 서비스를 켠다.\n모델 생성 시 로컬 파일과 장치를 검사하고 `preload_models=true`는 action 공개 전에\n모델을 준비한다. 실패하면 다른 검출기나 색상 fixture로 자동 대체하지 않는다.\n\n```bash\nros2 launch cleany_perception learned_rgbd.launch.py \\\n  model_directory:=/models device:=cuda:0 use_sim_time:=true\n```\n\n카메라와 로봇 driver는 별도로 실행한다. 기본 입력은 `/camera/color/image_raw`,\n`/camera/color/camera_info`, `/camera/aligned_depth_to_color/image_raw`이며\nRGB-D와 CameraInfo의 크기·frame·intrinsics·exact timestamp 계약이 필요하다.\n`auto`는 CUDA/CPU를 선택하고 명시한 CUDA를 사용할 수 없으면 실패한다.\n\n## 전체 depth 환경 포인트클라우드\n\n`depth_scene_node`는 검출 bbox나 SAM mask와 무관하게 전체 depth를\n`/perception/scene_cloud` (`PointCloud2`, XYZ, 원본 optical frame/stamp)로\n투영한다. 환경 물체 pose, 크기, MuJoCo mesh/정답 상태는 읽지 않는다.\n설정은 `config/depth_scene.yaml`이다. 기본값은 0.1–2.0 m, pixel stride 2,\n2 Hz이며, 1초보다 오래되거나 미래 timestamp인 depth는 발행하지 않는다.\ncloud 구독자가 없으면 depth 투영 자체를 건너뛰며, 구독자가 생기면 다음 새 depth부터 발행한다.\n현재 정렬 실행에서는 MoveIt의 OctoMap 최신성 검증 때문에 장면 cloud를 계속 갱신한다.\n작업 단계별 생성 중단은 최신성 계약과 함께 재설계해야 하므로 적용하지 않았다.\n0/NaN/Inf depth를 빈 공간이나 임의 표면으로 채우지 않는다.\n\n입력은 **정류된 depth와 그 영상에 맞는 CameraInfo**여야 한다. RGB로\n정렬된 depth라면 RGB optical frame/intrinsics를 사용한다. 왜곡 계수가\n남아 있거나 frame/해상도가 다르면 거부한다. `32FC1`은 m, `16UC1`은\n`depth_16u_scale_m`(기본 0.001)로 환산하며 endian과 row padding을 처리한다.\nCameraInfo는 같은 보정/해상도가 유지된다는 전제로 최신 값을 재사용한다.\n\n```bash\nros2 run cleany_perception depth_scene_node --ros-args \\\n  --params-file ros2_ws/src/cleany_perception/config/depth_scene.yaml \\\n  -p depth_image_topic:=/camera/depth/image_rect_raw \\\n  -p depth_info_topic:=/camera/depth/camera_info\n```\n\n이 출력은 RViz 표시와 MoveIt occupancy updater 입력용이다. 로봇 자체\n표면 제거는 MoveIt의 URDF/TF 기반 self-filter가 담당한다. 검출되지 않은\n물체도 depth가 관측되면 포함되지만, 가려진 표면은 복원하지 않는다.\n\n## 고정 베이스 책상 물체 추적\n\n`InspectScene.Goal.tracking_session_id`를 지정하면 새 관찰 성공 시 `core/tracking.py`가\n같은 종류·촬영 TF의 `base_link` 대표 위치로 물체를 연결한다. 거리 계산에 사용한 3D\n위치를 함께 보존하며 `position_valid`, `track_id`, `tracking_state`를 반환한다.\nRGB header frame과 대표 위치의 `representative_frame`은 서로 구분한다. 유일한 양방향\n대응만 `TRACKED`이며 모호한 위치·큰 이동·깊이 실패는 새 ID로 우회하지 않는다.\n사라진 물체의 마지막 참조는 `missing_objects`에 남는다. 최초부터 불확실했던 물체는\n빈 track ID 참조로 남을 수 있다. 빈 장면이 불확실한 대상을 없던 것으로 만들지 않는다.\n\n`inspect_scene.yaml`의 위치 차이 3cm·후보 차이 1cm, alias, 최대 32세션·TTL 600초는\n조정 가능한 시뮬레이션 초기값이다. 컵 별칭과 `computer mouse`, `wireless mouse`를\n각각 `cup`, `mouse`로 연결하며 레고는 `lego brick`을 유지한다. 별칭은 종류만 연결하고\n쓰레기·분실물 분류를 결정하지 않는다. 실물 기준이 아니다. 세션 메모리 재생성·만료마다\nepoch가 바뀌며 베이스 이동 시 호출자가 새 세션을 시작해야 한다. TF 실패·취소 관찰은\n갱신하지 않는다. cache 조회·선택 복원은 기존 ID·epoch를 그대로 반환하고 TTL을 유지한다.\n기존 빈 세션 호출은 `UNTRACKED`다.\n\n## 관련 KB\n\n### Gemini 분류 메타데이터 (2026-09-08)\n\nGemini structured response에 `sorting_category`(trash/lost_item/review),\n`sorting_reason`을 추가해 `DetectedObject2D`까지 보존한다. 기존 bbox만 있는\n응답은 파싱 가능하지만 category는 빈 값이며 sorting 실행에서 검토 대상으로\n처리한다. 위험하거나 용도가 불확실한 물체는 review를 요청한다. 소유권 판단은\n확정 사실이 아니며 현재 정책은 감독하의 시뮬레이션 검증용이다.\n\n- [Technical Overview](../../../../docs/cleany-docs/20_TECHNICAL/00%20-%20Technical%20Overview.md)\n- [Safety and Risk](../../../../docs/cleany-docs/20_TECHNICAL/08%20-%20Safety%20and%20Risk.md)\n"},"ros2_ws/src/cleany_safety_adapter/docs/interfaces.md":{"title":"cleany_safety_adapter 노드 인터페이스","body":"# cleany_safety_adapter 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## safety_adapter\n\n실행 파일: `safety_adapter`. 원본: [node.py](../cleany_safety_adapter/node.py), [evidence.py](../cleany_safety_adapter/evidence.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `safety/status` | `cleany_interfaces/msg/SafetyStatus` | R10; `rate_hz` 20 Hz |\n| 토픽 구독 | `\u003cestop_released_topic>` | `std_msgs/msg/Bool` | R10; 기본 빈 값이면 구독 없음 |\n| 토픽 구독 | `\u003cprotection_ready_topic>` | `std_msgs/msg/Bool` | R10; 기본 빈 값이면 구독 없음 |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic` |\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `joint_states_topic` |\n\n독립 안전 계층의 증거를 System Supervisor에 전달할 뿐이며 구동을 차단하거나 E-stop을 해제하지 않는다. 확인할 수 없는 항목은 항상 안전하지 않은 값으로 보고한다.\n\n| 출력 | 증거 | 증거가 없거나 오래됐을 때 |\n|---|---|---|\n| `protection_ready` | 보호 계층 준비 Bool | false |\n| `estop_engaged`, `physical_release_confirmed` | 물리 해제와 회로 reset 완료 Bool | engaged=true, release=false |\n| `stopped` | 최신 odom twist와 모든 관절 속도가 임계값 이하 | false |\n| `detail` | 판정 이유 | 미설정 source와 stale 항목 명시 |\n\nBool에는 header가 없어 수신 monotonic 시각으로 freshness(`evidence_timeout_s` 0.3초)를 판단한다. 설정한 하드웨어 source가 각각 한 번 보고하기 전에는 발행하지 않으므로, 부팅 순서 때문에 Supervisor가 E-stop을 latch하지 않는다. Source를 설정하지 않았으면 즉시 안전하지 않은 값을 발행한다. `stopped`는 encoder 기반 측정이며 독립 정지 센서나 STO 상태를 대체하지 않는다. 정지 임계값(`stopped_linear_mps` 0.01, `stopped_angular_radps` 0.02, `stopped_joint_radps` 0.02)은 미검증 초기값이다.\n\n현재 Cleany에는 이 Bool을 발행하는 하드웨어가 없다. E-stop 회로 설계와 adapter 또는 MCU 펌웨어는 KB에서 미정이다.\n"},"ros2_ws/src/cleany_scene_mapping/README.md":{"title":"Cleany sensor scene mapping","body":"# Cleany sensor scene mapping\n\n실험용 MoveIt OctoMap updater. MuJoCo sorting 파이프라인은 이 updater를\n기본으로 사용한다. 실물 및 다른 모드는 기존 updater를 유지하며,\n`depth_octomap_plugin:=cleany_scene_mapping/KnownGeometryOctomapUpdater`로\n명시 선택할 수 있다. 실제 하드웨어 안전 검증을 완료한 기능이 아니다.\n\nMoveIt의 `ShapeMask`로 점군 self-mask를 계산하고, sensor ray의 free/occupied/\nmodel/clip 셀을 갱신한 뒤, MoveIt이 제외 대상으로 전달한 collision shape의\n제외 영역에 완전히 포함되는 **관측된 점유 leaf**를 free로 바꾼다. 로봇 URDF,\n관측에서 구한 target mesh/OBB, 명시적으로 등록한 수거함이 shape의 출처다. MuJoCo GT나\n물체 이름/정답 위치는 읽지 않으며 planning scene의 충돌 형상을 삭제하지 않는다.\n\n가려져 현재 depth ray가 도달하지 않는 내부 잔상을 다루는 목적이다.\n표준 updater와 같은 `padding_scale` / `padding_offset` 설정을 사용한다.\n점군 self-mask는 upstream 판정을 유지한다. 내부 점유 정리에서는 mesh의\nconvex face를 법선 방향으로 `padding_offset`만큼 확장하고, 확장한 local\nbounding box로도 제한한다. `padding_scale`은 hull vertex 평균을 중심으로 적용한다.\nprimitive의 내부 판정은 기존과 같다. upstream의 mesh vertex 방사 방향 padding은\n긴 형상의 옆면에 설정값보다 작은 여유를 주므로, 컵과 겹치는 1cm 셀의 일부\n모서리를 놓쳐 잔상이 남을 수 있었다. 정리는 점유 갱신 **후** 수행해 같은\n프레임의 depth endpoint가 해당 셀을 다시 점유 상태로 만들지 않게 한다.\n한 convex body 안에 셀의 8개 모서리가 모두 포함되어야 한다. 일부만 겹치는\n셀, 여러 형상 사이의 틈, 바깥 장애물, 아직 관측하지 않은 셀은 비우지 않는다.\nTF는 점군 촬영 시점의 cache를 사용한다. 하나라도 누락되거나 비정상이거나,\ncache 조회 중 형상이 추가·제거됐으면 **그 프레임 전체를 거부**한다.\n그 경우 self-mask/raycast/내부 정리/점유 갱신/filtered-cloud 발행을 모두\n수행하지 않는다. 따라서 receipt relay도 해당 촬영 시각을 처리 완료로 알리지 않는다.\n로봇/OBB/TF가 틀린 경우 실제 장애물이 잘못\n제외될 위험은 남으므로 이 기능이 인식 오류나 충돌 안전을 보증하지 않는다.\n\n## 설정\n\n`depth_cloud.known_geometry_clear_max_leaves`는 메시지당 검사하는 leaf 수의\n상한이며 기본 200000이다. 초과하면 나머지를 건드리지 않고 경고한다.\nfree cell도 검사 예산에 포함한다. 정리 수/검사 수/소요 시간은 throttled\n`DEBUG` log로 기록한다. 정상 프레임의 raycast는 이 추가 검사 예산과 무관하게 수행한다.\n이 패키지는 미지정 시 `RelWithDebInfo`로 빌드한다. 점유 leaf 순회와\nconvex body 검사는 CPU 경로이므로 디버그 무최적화 실행 시간과 구분한다.\n\n`depth_cloud.mask_workers`는 1–4개 CPU 작업자로 self-mask를 분할하며 기본은 4다.\n모든 점을 순환 배분한 뒤 원래 순서로 합치므로 점군 밀도, mesh, padding,\nrange/내부/외부 판정은 바꾸지 않는다. 작업자는 각각 upstream ShapeMask와\n독립적인 Body 자세 상태를 가지며, `Body::cloneAt`으로 불변 convex mesh 계산\n결과만 공유한다. 원본 형상은 한 번만 생성해 시작 시 반복 hull 계산을 피한다.\n형상 변경/cache 갱신은 모든 작업자가 끝날 때까지 직렬화하며 작업 예외는\n프레임 전체를 거부한다. 1로 설정하면 분할 없이 원래 ShapeMask를 호출한다.\n전체 CPU 작업량/메모리는 감소한다는 보장이 없으며 CPU 여유에 맞춰 설정한다.\n\n병렬 작업 스레드는 worker 수 설정 시 한 번 생성하고 프레임 사이에는 condition\nvariable에서 대기한다. 기본 4 worker는 호출 스레드 1개와 상주 스레드 3개로 실행한다.\n프레임마다 `std::async` 스레드를 생성·종료하지 않으며, 점군 분할 및 판정 배열도\n다음 프레임에 재사용한다. 원본 점군을 순환 분할 버퍼로 복사하는 작업 자체는 유지한다.\n버퍼는 처리한 최대 프레임 크기에 맞춰 용량을 보관하므로, 반복 할당 감소가\n프로세스 상주 메모리 감소를 의미하지는 않는다. worker 수 재설정 또는 객체 종료 시\n스레드를 종료하고 버퍼를 해제한다. 형상이 등록된 동안 worker 수 변경은 거부한다.\n\n호출 스레드 또는 작업 스레드에서 예외가 발생하면 나머지 작업자가 모두 끝날 때까지\n기다린 후 예외를 전달한다. 실패한 프레임의 일부 판정을 반환하지 않으며 다음 프레임에서\n정상 복구할 수 있다. 상위 updater의 frame/geometry 직렬화와 TF·형상 세대 검사는 유지한다.\n\n## 빌드와 검증\n\n```bash\nmake test-scene-mapping\n```\n\n정지 상태에서 저장한 진단 fixture가 있다면 ROS node나 물리 명령 없이 비교한다:\n\n```bash\nmake profile-scene-mask MASK_FIXTURE=/absolute/path/to/mask_fixture\n```\n\nfixture는 `robot.urdf`, `raw.cdr`(PointCloud2), `fk.cdr`(GetPositionFK response,\ncloud frame의 collision link pose)를 요구한다. robot-only serial/2/4 worker 결과가\n점 단위로 완전히 같아야 통과하며 부품별 내부 판정/clone 시간을 출력한다.\nworld/attached body는 이 프로파일에 포함되지 않는다. 별도 frame integration\n검사가 해당 형상의 누락/cache 변경 시 거부와 정상 점군 통합을 검증한다.\n이 수치는 실제 이동 중 지연 또는 Jetson 성능을 대신하지 않는다.\n\n2026-09-29 버퍼/스레드 재사용 전후 비교는 저장된 robot-only fixture\n(76,800점, 27개 형상, 4 worker)를 사용했다. 준비 후 전후 실행 순서를 교대해\n12회 비교한 self-mask 중앙값은 365.53→363.30ms(약 0.6% 감소)였고, 모든 점의\n결과는 단일 worker 기준과 일치했다. 별도 3회 계측에서 해당 호출 안의 C++\n`operator new/new[]` 할당은 프레임당 30→0회였다. 프레임마다 만들던 스레드 3개는\n초기화 시 생성한 스레드로 대체했다. 이 fixture에서 재사용하는 분할/판정 payload는\n약 1.17MiB이며 프로세스 RSS 감소를 측정한 것은 아니다. 처리 시간 차이는 작아서\n큰 속도 향상이나 전체 파이프라인 지연 급증 해소를 주장하지 않는다. 현재 실행 로그의\n지도 전체 갱신 시간과도 측정 범위가 다르다. 전후 코드·원자료·계측 프로그램은 로컬\n`artifacts/scene_mask_reuse_20260929/`에 보관한다.\n\nROS 2 Humble의 `moveit_ros_perception`, `moveit_ros_occupancy_map_monitor`,\n`geometric_shapes`, `octomap`이 필요하다. 로컬 MoveIt perception prefix의\n설치 조건은 루트 `docs/DEVELOPMENT_SETUP.md`를 따른다. core gtest는 내부/\n외부/경계/분리 형상/회전/가변 leaf 크기/예산/TF 누락을 검사한다.\nmesh face padding은 같은 box의 primitive 표현과 비교하며, scale·회전·local\nvertex offset·capture-time clone에서 일치하는지 확인한다. 통합 검사에서는\nmesh 옆면의 과거 잔상과 새 endpoint가 반복 프레임에서도 제거되고, 주변의\n기존 장애물과 새 장애물은 유지되는지 확인한다.\n통합 gtest는 형상 세대 변경, 누락·비정상 cache, 거부 프레임의 tree/receipt\n미갱신, 정상 self-mask와 주변 장애물 보존, 카메라 원점, 잘못된 점군 layout,\nrange clipping, stop/start, 동시 frame 직렬화 및 executor 지연 후 최신 프레임\n선택을 검사한다.\n이 테스트가 실제 파지·운반 성공을 증명하지는 않는다.\n`test_partitioned_shape_mask`는 worker 재사용/재설정, 큰 프레임에서 작은 프레임으로의\n전환, XYZ/XYZRGB layout 변경, 호출·작업 스레드 예외 후 전체 작업 종료와 복구도 검사한다.\n\n## 프레임 처리 계약\n\n이전 `PointCloudOctomapUpdater::updateMask` hook은 정리를 건너뛰더라도\nbase callback의 점유 갱신을 중단할 수 없었다. 지금은 `OccupancyMapUpdater`\nplugin으로 프레임 callback 전체를 소유한다. 한 mutex로 callback을 직렬화하고,\n형상 세대·cache 검사와 mask를 geometry mutex 안에서 수행한 후 body clone을\n보존한다. transform provider 호출과 tree 접근 중에는 geometry mutex를 잡지\n않는다(PlanningSceneMonitor의 shape/tree lock과 역순 잠금 방지).\n\n입력은 `depth_scene_node`의 optical-frame PointCloud2 계약을 따른다:\nlittle-endian FLOAT32 XYZ(offset 0/4/8), packed row, 완전한 data buffer.\n다른 layout은 거부한다. shape mask에서 카메라 원점은 optical frame의 0이며,\nraycasting에서만 촬영 시점 map-frame 카메라 위치로 변환한다. TF가 아직\n도착하지 않았다면 해당 프레임을 거부하고 다음 새 프레임을 받는다. TF 대기\nqueue나 재발행/임의 타임스탬프는 사용하지 않는다. 정상 filtered cloud의\nheader는 원본 그대로이며 BEST_EFFORT SensorDataQoS로 발행한다. 입력/출력\nhistory는 `KEEP_LAST(1)`이다. 처리 중 새 입력이 쌓이면 과거 영상을 순서대로\n처리하지 않고 가장 최근 촬영본을 받는다. 한 프레임의 처리 중단이나 timestamp\n재작성은 하지 않는다. 최신성 허용 기준은 coordinator에서 그대로 검사한다.\n로그는 transform/cache, mask/shape snapshot, raycast, tree 갱신, receipt 발행\n구간의 wall time과 입력/출력의 ROS capture age를 구분한다. lock 대기는 해당\n구간 시간에 포함되므로 각 숫자를 순수 CPU 시간으로 해석하지 않는다.\n추가 callback 진단은 ROS clock과 독립적인 steady clock으로 초당 최대 한 번\n입장/종료를 기록한다. 원본 capture stamp, 해당 node의 ROS 시각, 마지막 갱신\n시각과 종료 stage(`ros_clock_rate_limit`, `transform_cache`, `map_transform`,\n`shape_mask`, `tree_update`, `integrated` 등)를 포함한다. transform cache가 false를\n반환한 경우의 시간도 경고로 남긴다. throttled 로그이므로 모든 프레임의 trace는\n아니며, callback 로그만으로 upstream 입력 중단과 executor 지연을 구분할 수는 없다.\n입력 토픽 관측과 함께 읽어야 한다. 진단은 프레임 수용 조건이나 지도 내용,\n원본 timestamp/receipt 계약을 바꾸지 않는다.\n\n참고한 [MoveIt 2.5.9 updater](https://github.com/moveit/moveit2/blob/2.5.9/moveit_ros/perception/pointcloud_octomap_updater/src/pointcloud_octomap_updater.cpp)와\n[transform cache provider](https://github.com/moveit/moveit2/blob/2.5.9/moveit_ros/planning/planning_scene_monitor/src/planning_scene_monitor.cpp)의\n동작을 기준으로 한다. 시스템 전체의 실제 충돌 안전을 검증한 것은 아니다.\n\n## 로그 수준\n\n준비 완료와 실패·TF cache 누락·검사 예산 초과는 기본 출력에 남는다.\n정상 프레임의 입장·종료와 `Consistent depth frame` 통계는 throttled `DEBUG`\n로그이며 `move_group.scene_mapping` 로거를 사용한다. 상위 MuJoCo launch의\n`log_level:=debug` 또는 standalone MoveIt의 같은 옵션으로 확인한다.\n기본 `INFO`에서는 대기 중 정상 프레임 진단을 계속 출력하지 않는다.\n"},"ros2_ws/src/cleany_skill_executor/docs/01_manipulation_action_design.md":{"title":"01. 매니퓰레이션 Action 설계 안내","body":"# 01. 매니퓰레이션 Action 설계 안내\n\n> **구현 안내와 후속 연동 설계.** 초기 설계 기준은 2026-09-30의 GitHub KB `main` (`4b6816e`)이다.\n> 이 브랜치에는 Mock Action 서버와 MuJoCo BT Action 서버가 구현되어 있다.\n> 아래 Mission Manager·Planner 흐름은 후속 연동 목표이며, 현재 서버와의 통합 완료를 뜻하지 않는다.\n\n| 바로 확인할 내용 | 문서 |\n|---|---|\n| 모델 없이 실행·취소·조회 | [Mock 사용법](manipulation_mock_usage.md) |\n| MuJoCo·인식·MoveIt 연동 실행 | [BT 서버 README](../../cleany_manipulation_bt/README.md) |\n| Goal·Feedback·Result 필드 | [공통 Action 명세](02_execute_manipulation_skill_action_spec.md) |\n| Mission Manager와 연결할 책임 | [Mission 연동 후속 작업](manipulation.md#mission-연동-후속-작업) |\n\n## 1. 먼저 이해할 한 문장\n\n**Mission Manager가 행동 하나를 승인하고, Manipulation Action 서버가 그 행동의\n팔과 그리퍼 동작을 수행한 뒤 결과를 돌려준다.**\n\n예를 들어 `collect_trash(물체 3번)`을 한 번 요청하면 서버가 접근, 집기, 들기,\n수거함으로 운반, 그리퍼를 열어 놓기, 팔 복귀와 놓은 결과 확인을 처리한다.\n이 세부 동작마다 Mission Manager를 다시 호출하지 않는다.\n다음 물체는 결과 재관찰 후 Planner가 제안하고 Mission Manager가 승인한다.\n\n| 질문 | 답 |\n|---|---|\n| 여러 물체도 처리하는가? | 행동 하나 실행, 재관찰과 다음 제안을 반복해 여러 물체를 처리한다. |\n| Goal 하나가 책상 전체를 정리하는가? | 이번 명세의 Goal은 승인된 high-level 행동 하나다. |\n| 인식만 별도로 사용할 수 있는가? | Perception의 `InspectScene`은 독립 Action으로 계속 사용할 수 있다. |\n| 모든 팔 동작을 Mission Manager가 지시하는가? | 접근, 들기, 운반 등의 동작은 Skill Executor 내부에서 처리한다. |\n| 서버 개발에 Mission Manager 완성이 필요한가? | 같은 검증 조건을 갖춘 테스트 클라이언트와 mock port로 개발할 수 있다. |\n\n## 2. 기준으로 읽은 KB\n\n| 문서 | 적용하는 내용 |\n|---|---|\n| [Mission Lifecycle](../../../../docs/cleany-docs/20_TECHNICAL/09%20-%20Mission%20Lifecycle.md) | 행동 하나 승인, 성공과 실패 및 차단 후 재관찰 |\n| [Task Planning and Robot Capabilities](../../../../docs/cleany-docs/20_TECHNICAL/03%20-%20Task%20Planning%20and%20Robot%20Capabilities.md) | Planner 제안, Mission Manager 검증, Capability 물리 실행 |\n| [ROS 2 Software Architecture](../../../../docs/cleany-docs/20_TECHNICAL/11%20-%20ROS%202%20Software%20Architecture.md) | Manipulation에 Action 사용, 정확한 schema는 구현 문서에서 관리 |\n| [Target Scenario](../../../../docs/cleany-docs/10_PLANNING/02%20-%20Target%20Scenario.md) | 여러 물체, 작업 전후 관찰, 복귀와 Dashboard 결과 |\n| [Success Criteria](../../../../docs/cleany-docs/10_PLANNING/05%20-%20Success%20Criteria.md) | Rule-based 통합 검증과 VLA 실행을 포함한 목표 MVP의 통과 조건 |\n| [Robot Operations and Mission Dispatch](../../../../docs/cleany-docs/20_TECHNICAL/02%20-%20Robot%20Operations%20and%20Mission%20Dispatch.md) | 재시작 시 자동 재개 금지, 외부에 중단과 사람 확인 필요 보고 |\n| [책임 경계 결정](../../../../docs/cleany-docs/30_DECISIONS/Technical/260806%20-%20Task%20Planning과%20Robot%20Capability%20경계.md) | Mission Manager의 allowlist와 기본 인자 검증, 하위 물리 제약 검증 |\n\n`CLEAN_TABLE` 상태와 책상 전체 `ExecuteTableManipulation` 제안은 과거 비교 자료다.\n그 제안의 미션 상태 변경과 결과 필드를 이 명세의 전제로 사용하지 않는다.\n\n## 3. 누가 무엇을 하는가\n\n| 담당 | 역할 | 예시 |\n|---|---|---|\n| Mission Manager | 행동 승인, 실행 요청, 결과 기록과 재관찰, 전체 미션 보고 | 이 단계에서 수거를 허용할지 검사 |\n| Planner | 최신 장면과 이전 결과로 다음 행동 또는 완료 제안 | 물체 3번을 먼저 수거하자 |\n| Perception | 물체, 이미지 영역과 3D 정보 제공 | 물체 3번의 bbox와 위치 |\n| Manipulation Action 서버 | 행동 하나의 실행 순서, Feedback와 Result 관리 | 접근부터 놓은 결과 확인까지 |\n| Motion 또는 VLA backend | 동작 생성, 물리 제약 검사, 실행과 정지 | MoveIt, controller와 실험 후 선택할 VLA adapter |\n| 관측 전달 기능 | 같은 장면의 원본 이미지와 정보를 묶어 전달 | overlay를 위한 자료 |\n| Backend와 Dashboard | 관측 저장, overlay와 최종 결과 표시 | 전후 사진과 미처리 대상 |\n\nPerception 모델과 Planner adapter, Skill 내부 VLA와 MoveIt 조합은 KB의 실험 후보다.\n현재 시뮬레이션 구현이 제품의 최종 모델이나 분실물 처리 정책을 결정하지 않는다.\n\n### Action 서버 구현과 목표 MVP의 관계\n\n| 단계 | 확인할 내용 |\n|---|---|\n| Rule-based 통합 검증 | 규칙 기반 Planner와 실행 계층을 연결해 Goal, 물리 실행 결과, 재관찰과 보고를 검증 |\n| 목표 MVP | 위 흐름에 AI의 다음 행동 제안과 **VLA 기반 Manipulation Skill의 물리 실행 및 결과 관찰**을 포함 |\n\nAction 서버는 기존 MoveIt 및 controller port나 mock으로 먼저 개발할 수 있다.\n이 검증만으로 목표 MVP를 완료했다고 보고하지 않는다. 목표 MVP에는 VLA 기반 실행과\n관찰 결과로 다음 행동 또는 완료를 판단하는 검증이 추가로 필요하다.\nVLA 모델, adapter와 MoveIt의 조합은 실험 후 선택하며 이 명세에서 확정하지 않는다.\n단계별 통과 조건은 [KB Success Criteria](../../../../docs/cleany-docs/10_PLANNING/05%20-%20Success%20Criteria.md)를 따른다.\n\n### ROS 서버를 세부 동작마다 만드는가\n\n제안하는 Manipulation Action endpoint는 하나다. 접근, 집기, 들기와 운반은 내부 함수\n또는 BT node로 연결한다. 기존 Perception의 `InspectScene`, 파지 선택의\n`SelectReachableGrasp`는 별도 Action이고, `PlanGrasp`와 `VerifyPlacement`는 기존 Service다.\nService는 잡을 자세나 확인 결과를 요청하는 호출이며 Mission Manager의 새 상태가 아니다.\nTask Planner의 다음 행동 제안과 `PlanGrasp`의 grasp 계산도 서로 다른 책임이다.\n\n## 4. 책상에 도착한 뒤의 전체 흐름\n\n```mermaid\nflowchart TD\n    START[\"작업 전 스캔과 Planner 제안\u003cbr/>첫 이미지, bbox와 분류 자료 준비·전달\"] --> D{\"Planner의 제안은?\"}\n    D -->|\"물체 수거\"| V{\"Mission Manager가\u003cbr/>실행을 허용하는가?\"}\n    V -->|\"허용\"| A[\"Action Goal 전송\u003cbr/>접근 → 집기 → 들기\u003cbr/>운반 → 놓기 → 팔 복귀 → 확인\"]\n    V -->|\"보류 또는 실행 불가\"| B[\"새 Goal을 보내지 않음\u003cbr/>이유 기록, 재판단 또는 종료\"]\n    B -.->|\"재판단을 허용한 경우\"| PL[\"최신 Scene과 이전 결과로\u003cbr/>Planner에 다시 제안 요청\"]\n    A --> R{\"Result 이후\u003cbr/>재판단을 계속할 수 있는가?\"}\n    R -->|\"안전 조건 충족, 취소·치명 오류 없음\"| OBS[\"결과 기록과 재관찰\"]\n    OBS --> PL\n    PL --> D\n    R -->|\"취소 또는 치명 오류 등으로 종료\"| STOP[\"안전 종료와 진행 기록\u003cbr/>가능한 관찰 및 종료 보고\"]\n    B -->|\"종료를 결정한 경우\"| STOP\n    D -->|\"작업 완료\"| F[\"새 수거 Goal을 보내지 않음\u003cbr/>최종 관찰과 처리 기록 확인\"]\n    F --> C{\"완료 제안과\u003cbr/>관찰·기록이 일치하는가?\"}\n    C -->|\"일치\"| END[\"안전 조건을 확인해 복귀\u003cbr/>전후 자료와 최종 결과 보고\"]\n    C -->|\"불일치\"| M[\"불일치 기록\u003cbr/>재판단 또는 실패 종료\"]\n    M -.->|\"재판단을 허용한 경우\"| PL\n    M -->|\"실패 종료를 결정한 경우\"| STOP\n```\n\n**Action 서버는 켜진 채로 대기한다. 실행할 물체 수거가 승인된 경우에만 새 Goal을 받는다.**\n\n| 상황 | Mission Manager가 하는 일 |\n|---|---|\n| Planner가 물체 3번 수거를 제안하고 검증을 통과 | 물체 3번의 Action Goal 전송 |\n| Planner가 작업 완료를 제안 | 새 수거 Goal 없이 최종 관찰과 기록 확인 |\n| 제안이 허용 기능 또는 인자 검증을 통과하지 못함 | Goal 없이 이유 기록. 재판단하거나 차단 결과로 종료 |\n| 미션 취소 또는 치명 오류 | 안전 종료 경로로 이동. 새 수거 Goal 전송 금지 |\n\n이 표는 Mission Manager가 Goal을 보내기 전의 판단이다. Goal을 보낸 뒤 서버가\n거절하거나 수락 후 `BLOCKED`를 반환하는 경우는 [Action 수락 명세](02_execute_manipulation_skill_action_spec.md)의 별도 처리다.\n첫 관측의 원본 이미지 전달과 수신 확인 계약은 Mission 연동 단계에서 추가 결정해야 한다.\n위 그림의 재판단은 안전 조건과 종료 정책을 확인한 경우에만 수행한다.\n치명 오류와 취소는 종료 및 안전 경로로 연결하고 새 Goal을 자동으로 보내지 않는다.\n취소 뒤 안전하게 관찰할 수 있어도 다음 행동 실행을 재개하지 않는다.\n\n**빈 장면이나 실행할 제안이 없다는 사실만으로 성공을 결정하지 않는다.**\nPlanner의 완료 제안, 최종 관찰, 처리 기록과 남은 대상을 함께 확인한다.\n\n## 5. 승인된 행동 하나의 내부 동작\n\n```mermaid\nflowchart LR\n    V[\"입력과 준비 조건 확인\"] --> G[\"물체와 잡을 자세 준비\"]\n    G --> A[\"접근\"] --> P[\"집기\"] --> L[\"들기와 잡은 상태 확인\"]\n    L --> T[\"수거함으로 운반\"] --> O[\"그리퍼를 열어 놓기\"]\n    O --> R[\"팔 복귀\"] --> C[\"놓은 결과 확인\"] --> END[\"결과 반환\"]\n```\n\n선택 물체의 3D 조회나 집기 전 위치 확인은 행동의 준비 과정에 포함할 수 있다.\n서버는 다른 물체를 선택하거나 전체 장면에서 새 high-level 행동을 계획하지 않는다.\n집기 전 장면이 달라졌다면 이전 Goal을 차단하고 Mission Manager가 재관찰한다.\n\n## 6. 문서 읽는 순서\n\n| 순서 | 문서 | 확인할 내용 |\n|---|---|---|\n| 01 | [설계 안내](01_manipulation_action_design.md) | 전체 흐름과 책임 경계, 지금 읽는 문서 |\n| 02 | [Action 인터페이스 명세](02_execute_manipulation_skill_action_spec.md) | Goal, Feedback와 Result 필드 및 예시 |\n| 03 | [서버 동작 명세](03_manipulation_server_behavior_spec.md) | 실행 단계, 준비 조건, 실패와 취소 |\n| 06 | [BT와 Groot2 설계](06_manipulation_behavior_tree_design.md) | 행동 내부 트리, 포트와 실행기 경계 |\n\n## 7. 현재 구현과 추가 개발\n\n| 항목 | 현재 상태 |\n|---|---|\n| `InspectScene`, grasp 계획과 선택 | 기존 ROS interface와 구현 있음 |\n| 집기, 운반, 놓기와 확인 경로 | 시뮬레이션 coordinator에 있음 |\n| 새 Manipulation Action | `.action`, Python 모의 서버·테스트 클라이언트·SQLite 기록·조회·복구 이벤트 구현. Mission Manager adapter는 후속 구현 |\n| 행동별 재관찰과 Planner 승인 반복 | 목표 KB 흐름. 현재 Mission Manager core에 추가 통합 필요 |\n| snapshot 조회 | `GetSceneSnapshot`의 검출 metadata 조회 구현. RGB 원본 조회와 외부 관측 전달은 추가 구현 필요 |\n| MuJoCo BT.CPP 실행기 | [cleany_manipulation_bt](../../cleany_manipulation_bt/README.md)에 구현. 별도의 실행 XML과 실제 인식·MoveIt 경로 사용 |\n| Groot2 설계 XML과 모의 모니터 | 정적 미리보기와 이벤트 투영. Groot2Publisher 실시간 연결은 후속 구현 |\n\n모의 서버는 실제 팔 명령을 내리지 않으며 미션 FSM 통합은 후속 단계다. 남은 제품 판단은 각 명세에 표시한다.\n"},"ros2_ws/src/cleany_skill_executor/docs/02_execute_manipulation_skill_action_spec.md":{"title":"02. Manipulation Action 인터페이스 명세","body":"# 02. Manipulation Action 인터페이스 명세\n\n> **Mock·MuJoCo 공통 Action 계약.** 실제 필드는 [ExecuteManipulationSkill.action](../../cleany_interfaces/action/ExecuteManipulationSkill.action)을 따른다.\n> 실물 backend와 Mission Manager의 외부 승인·연동 계약은 후속 구현 대상이다.\n\n| 서버 | namespace / `execution_profile` | 실행·설정 안내 |\n|---|---|---|\n| Python 모의 서버 | `/mock` / `mock` | [Mock 사용법](manipulation_mock_usage.md) |\n| native BT MuJoCo 서버 | `/sim` / `mujoco` | [BT 서버 README](../../cleany_manipulation_bt/README.md) |\n\n이 문서는 공통 필드와 결과 의미를 관리한다. backend별 물리 확인 방식은 각 실행 안내를 따른다.\n\n## 1. Goal 하나가 하는 일\n\n**지원 행동은 `collect_trash`와 `collect_lost_item`이다.** 호출자가 승인한 물체\n하나를 지정 수거함에 옮기고 결과를 확인한다. 접근, 집기와 운반은 서버 내부 단계다.\n다음 물체를 제안하려면 이번 행동 결과와 새 Scene이 필요하다.\n\n| 범위 | 처리 |\n|---|---|\n| 승인된 쓰레기 후보 하나 수거 | `collect_trash` |\n| 승인된 분실물 하나의 전용 탑재 보관함 보관 | `collect_lost_item`. 사용자 요청으로 구현하며 KB의 MVP 범위 불일치는 별도 기록 |\n| 책상 전체 반복 | Mission Manager와 Planner의 책임 |\n| 인식만 수행 | 독립 Perception interface 사용 |\n\n모델 분류–skill–목적지는 각각 검사한다. 두 분류의 수거 동작은 공통 BT를 사용하고\n책상 반복과 재관찰은 호출자가 담당한다. staging과 handoff는 이 계약에 추가하지 않는다.\n\n## 2. Goal: 무엇을 실행할지\n\n| 필드 | 타입 | 쉽게 설명하면 | 예시 |\n|---|---|---|---|\n| `mission_id` | `string` | 어떤 미션인가 | `mission-001` |\n| `task_id` | `string` | 어떤 승인된 행동인가 | `task-003` |\n| `execution_id` | `string` | 이번 실행 시도의 고유 번호 | UUID |\n| `skill_name` | `string` | 승인된 행동 이름 | `collect_trash` 또는 `collect_lost_item` |\n| `snapshot_id` | `string` | 대상이 확인된 관찰 | `snapshot-010` |\n| `object_id` | `uint32` | 그 관찰 안의 물체 번호 | `3` |\n| `destination_id` | `string` | 설정에 등록된 수거 목적지 | Mock: `mock_trash_bin`, MuJoCo: `trash_right` |\n\n`object_id`는 snapshot마다 다시 붙을 수 있다. `(snapshot_id, object_id)`로 조회하며\n다음 관찰의 3번이 같은 물체라고 가정하지 않는다. 목적지 ID는 해당 서버의 설정과 일치해야 한다.\n`work_area_id`는 이번 Goal에 넣지 않는다. 좌석과 접근 위치는 미션 및 Navigator 계약,\n물리 workspace는 서버 설정과 backend가 검사한다.\n\n### 식별자와 승인\n\n- 미션 식별자는 기존 값을 전달하고 task는 승인된 proposal에 연결한다.\n- task ID의 재관찰 간 유지 및 발급 규칙은 Planner adapter에서 정해야 한다.\n- 호출 adapter가 `execution_id`를 생성하고 실제 움직임 전에 기록한다.\n- 새 실행 ID로 재시도할 때도 이전 시도의 물체 상태를 먼저 확인한다.\n- Goal 필드만으로 권한이나 의미 분류를 증명하지 않는다. Mission Manager가 상태,\n  allowlist와 인자를 승인하고, 허용 client의 ROS 접근 경계는 구현 시 정의한다.\n\n## 3. Goal 수락과 중복 요청\n\n| 상황 | 처리 |\n|---|---|\n| ID 누락, `object_id=0`, 지원하지 않는 skill | Goal 거절 |\n| 다른 Goal 실행 중 | Goal 거절. 활성 행동 선점 금지 |\n| fault 또는 정지 확인이 필요한 상태 | Goal 거절 |\n| 같은 실행 ID가 실행, 종료 또는 중단 기록에 있음 | 중복 Goal 거절. 다시 움직이지 않음 |\n| 같은 실행 ID에 다른 인자 | 충돌로 거절 |\n| 구조상 유효한 새 Goal | 수락 후 준비 및 물리 검증 |\n| snapshot 조회 실패, 대상 이동 또는 verifier 준비 실패 | 수락 후 `BLOCKED`, 움직임 시작하지 않음 |\n\nROS Goal 거절에는 일반 Result payload가 없다. 호출 adapter는 거절을 수거 실패나\n취소 완료로 만들지 않고 준비 상태와 실행 기록을 확인한다. 기록 조회는 `manipulation/get_execution`이다.\n\n완료 Result를 새 Goal에 자동 재생하는 계약은 사용하지 않는다. 응답을 잃으면 실행 ID로\n기록을 조회한다. 이번 구현은 SQLite와 `GetManipulationExecution.srv`를 사용하며 기록을 자동 만료하지 않는다.\n조회할 수 없다면 새 ID로 무조건 재실행하지 않는다. 프로세스 재시작 후 이전 활성\n실행은 중단으로 기록하고 자동 재개하지 않는다.\n\n### 작업 중 프로그램이나 장치가 다시 켜진 경우\n\n예를 들어 물체를 집던 중 프로그램이 종료되고 다시 켜졌다면, 기존 기록만으로\n물체가 그리퍼에 있는지 또는 팔이 멈췄는지 확정할 수 없다.\n\n1. 이전 활성 실행을 중단으로 표시하고 마지막 물리 진행 기록을 보존한다.\n2. 중단 사실과 확인 가능한 상태를 Mission Manager의 복구 처리에 전달한다.\n3. Mission Manager와 외부 상태 adapter는 **미션 중단과 사람 확인 필요**를 Backend에 알린다.\n4. 실제 팔, 그리퍼와 물체 상태 및 안전 조건을 확인하기 전 새 물리 Goal을 허용하지 않는다.\n5. 이전 Goal을 자동 재개하지 않는다. 후속 미션이나 행동은 별도 검증과 승인 절차를 따른다.\n\n재시작 자체를 `CANCELED` Result나 `stop_confirmed=true`의 근거로 사용하지 않는다.\n기존 Goal에 응답할 수 없으면 실행 기록 조회 및 복구 이벤트로 중단을 전달해야 한다.\n이번 구현의 중단 이벤트는 `manipulation/execution_events`의\n`ManipulationExecutionRecord`이며 Reliable·Transient Local, depth 100이다.\nSQLite 기록과 함께 제공하고 Backend 전달은 후속 Mission Manager adapter가 맡는다.\n외부 보고 연결은 [Mission 연동 후속 작업](manipulation.md#mission-연동-후속-작업)를 따르며,\n제품 요구는 [KB 재시작 규칙](../../../../docs/cleany-docs/20_TECHNICAL/02%20-%20Robot%20Operations%20and%20Mission%20Dispatch.md)에 있다.\n\n## 4. Feedback: 지금 어디까지 했는지\n\n| 필드 | 타입 | 의미 |\n|---|---|---|\n| `execution_id` | `string` | 이번 실행 시도 |\n| `stage` | `string` | 아래 단계 |\n| `substage` | `string` | 현재 세부 동작. 예: `GraspObject`, `ConfirmGrasp` |\n| `selected_arm` | `string` | 선택 전 빈 값, 선택 후 등록된 팔 ID |\n| `message` | `string` | 사람이 읽는 설명 |\n\n| 단계 | 화면에서 읽을 뜻 |\n|---|---|\n| `VALIDATING` | 입력과 준비 상태 확인 |\n| `PREPARING_TARGET` | 선택 물체의 좌표, grasp와 경로 준비 |\n| `APPROACHING` | 빈 팔을 물체 쪽으로 이동 |\n| `GRASPING` | 그리퍼를 닫아 집기 |\n| `LIFTING` | 들어 올리고 잡은 상태 확인 |\n| `TRANSPORTING` | 물체를 든 채 수거함으로 이동 |\n| `PLACING` | 목적지에서 그리퍼를 열어 놓기 |\n| `RETURNING_ARM` | 팔을 backend의 복귀 목표 자세로 이동 |\n| `VERIFYING_PLACEMENT` | 수거함 내부 위치 확인 |\n| `RELEASING_IN_PLACE` | 취소 후 현재 위치에서 그리퍼 열기 |\n| `RECOVERING_ARM` | 취소 후 팔 복귀 |\n| `STOPPING` | 취소 또는 실패 후 동작 종료와 정지 확인 |\n| `FINALIZING` | 실제 진행과 종료 결과 기록 |\n\nFeedback은 진행 안내다. `PLACING`을 받았다고 물체가 수거된 것은 아니다.\n첫 이미지 전달, 책상 재관찰과 베이스 복귀는 이 Action의 단계가 아니다.\n\n두 구현의 Feedback은 `substage`도 제공한다. 예를 들어 `GRASPING/GraspObject`는\n그리퍼 닫기, `GRASPING/ConfirmGrasp`는 파지 확인이다. Result의 `failed_substage`는\n실패 세부 동작을 식별하고, 조회 기록의 `completed_substages`는 완료한 세부 동작만\n보존한다. 큰 단계의 취소 및 timeout 계약은 유지한다.\n\n## 5. Result: 이번 행동이 어떻게 끝났는지\n\n### 구현 필드\n\n| 필드 | 타입 | 확인하려는 것 |\n|---|---|---|\n| `execution_id` | `string` | 어떤 시도 결과인가 |\n| `execution_profile` | `string` | `mock` 또는 `mujoco`. 실행 환경과 근거 구분 |\n| `status` | `string` | 성공, 차단, 실패, 취소 또는 치명 오류 |\n| `cancel_mode` | `string` | 취소 요청이 없으면 빈 값. `IMMEDIATE`, `CHECKPOINT`, `RETURN_ARM` |\n| `error_code` | `string` | 원인. 정상 성공은 `NONE` |\n| `failed_stage` | `string` | 문제가 난 단계. 성공은 빈 값 |\n| `failed_substage` | `string` | 실패한 세부 동작. 없으면 빈 값 |\n| `last_completed_stage` | `string` | 근거를 확인하고 끝낸 마지막 단계. 없으면 빈 값 |\n| `object_state` | `string` | 물체를 건드리지 않았는지, 들고 있는지 등 |\n| `placement_state` | `string` | 수거함 내부 위치를 확인했는지 |\n| `selected_arm` | `string` | 사용한 팔. 선택 전 종료면 빈 값 |\n| `stop_confirmed` | `bool` | 종료 시 팔과 그리퍼의 정지를 확인했는가 |\n| `arm_recovered` | `bool` | backend의 목표 자세로 팔을 복귀했는가 |\n| `retryable` | `bool` | 같은 행동을 다시 검토할 여지가 있는가 |\n| `message` | `string` | 사람이 읽는 설명 |\n\nMuJoCo의 복귀 목표는 실행 시작 때 저장한 팔 자세다. `arm_recovered=true`만으로\n모바일 베이스의 주행 자세나 이동 허가를 보장하지 않는다. 상위 연동에서 별도 readiness를 확인해야 한다.\n\n`retryable=true`는 재실행 명령이나 책상 전체 재시작 허가가 아니다. Mission Manager가\n재관찰, 승인과 retry budget을 확인한다. false인 Goal을 그대로 자동 반복하지 않는다.\n\n### 상태와 ROS 종료\n\n| `status` | 뜻 | ROS 종료 |\n|---|---|---|\n| `SUCCESS` | 수거, 놓은 결과 확인과 팔 복귀 완료 | `SUCCEEDED` |\n| `BLOCKED` | 움직임 전에 필요한 조건을 통과하지 못함 | `SUCCEEDED`, payload 확인 필요 |\n| `FAILED` | 실행을 시작했으나 요구한 결과를 얻지 못함 | `ABORTED` |\n| `CANCELED` | 선택한 취소 정책을 마치고 정지를 확인 | `CANCELED` |\n| `FATAL` | e-stop, hardware fault 또는 정지 확인 불가 | `ABORTED` |\n\n취소 수락과 취소 완료는 다르다. 정지가 확인되지 않으면 `FATAL`을 반환한다.\n전송 연결 유실이나 client timeout은 위 Result를 실제로 받았다는 뜻이 아니다.\n정상 종료와 취소 요청이 동시에 오면 종료 상태 변경을 직렬화한다. Result가 이미\n확정된 Goal의 취소는 수락하지 않고 기존 결과를 유지한다. 취소를 먼저 수락했다면\n최종 물리 진행을 보존하면서 취소 경로를 완료한다. 실제 fault는 취소보다 우선한다.\n\n### 취소 방식과 서비스\n\n`manipulation/cancel`의 `CancelManipulation` 서비스는 활성 `execution_id`와 `mode`를\n받고 `accepted/message`를 반환한다. `accepted=true`는 요청 수락이며 정지 완료가 아니다.\n기본 ROS Action cancel은 `CHECKPOINT`다.\n`IMMEDIATE`는 현재 완료를 기다리지 않고 정지를 요청한다. `CHECKPOINT`는 현재 동작과\n필요한 확인까지만 완료한다. `RETURN_ARM`은 현재 작업 중단과 정지 확인 뒤 잡고 있는\n물체를 그 자리에서 놓고 팔을 복귀한다. 초기 정책에서는 현재 위치 놓기의 별도 안착\n검증을 추가하지 않는다. MuJoCo의 이 경로는 그리퍼 열림 완료를 근거로 하며 독립적인\n물체 이탈 확인도 제공하지 않는다. 모드는 진행과 Result에 보존하며 `IMMEDIATE`로 선점할 수 있다.\n놓기·복귀 실패는 `FAILED`, 정지 확인 실패는 `FATAL/STOP_UNCONFIRMED`로 반환한다.\n\n### 물체 상태와 놓은 결과\n\n| `object_state` | 뜻 |\n|---|---|\n| `NOT_TOUCHED` | 잡거나 움직이지 않았다는 근거가 있음 |\n| `HELD` | 마지막 확인에서 그리퍼로 들고 있음 |\n| `LEFT_GRIPPER` | 그리퍼에서 떠난 것을 확인. 목적지 내부인지는 별도 |\n| `UNKNOWN` | 접촉, 낙하 또는 센서 유실로 상태를 확정할 수 없음 |\n\n| `placement_state` | 뜻 |\n|---|---|\n| `NOT_CHECKED` | 수거함 내부 확인을 아직 수행하지 않음 |\n| `CONFIRMED` | 놓은 뒤 검증 근거로 수거함 내부 위치를 확인 |\n| `NOT_CONFIRMED` | 확인 기능의 성공 조건을 만족하지 못함 |\n| `UNKNOWN` | 확인 timeout 또는 센서 문제로 판단 불가 |\n\n정상 수거 경로에서 `LEFT_GRIPPER`는 그리퍼 열기 명령 성공만으로 기록하지 않는다. 추가 근거가 없으면\n`UNKNOWN`이다. 수거함 내부 검증이 성공하면 `LEFT_GRIPPER/CONFIRMED`로 갱신할 수 있다.\n기존 `VerifyPlacement.srv`의 false는 명시적인 수거함 밖 판정이 아니다.\nMock의 확인 실패 시나리오는 `NOT_CONFIRMED`를 반환한다. MuJoCo adapter는 false를\n확인 대기로 처리하고, 기한 내 안착 근거를 얻지 못하면 `UNKNOWN / VERIFICATION_TIMEOUT`을 반환한다.\n센서 근거와 정지 확인은 [MuJoCo 실행 계약](../../cleany_manipulation_bt/docs/execution_contract.md#정상-수거의-놓기정지-확인)을 따른다.\n\n### 예시로 읽기\n\n| 상황 | 상태 | 물체 / 놓은 결과 | 중요한 점 |\n|---|---|---|---|\n| 수거와 확인, 팔 복귀 완료 | `SUCCESS` | `LEFT_GRIPPER / CONFIRMED` | 정지와 복귀도 확인 |\n| 시작 전에 snapshot이 없음 | `BLOCKED` | `NOT_TOUCHED / NOT_CHECKED` | 새 관찰 필요 |\n| 운반 중 물체 상태를 잃음 | `FAILED` | `UNKNOWN / NOT_CHECKED` | 정지와 재관찰 필요 |\n| Mock의 확인 실패 시나리오 | `FAILED` | 확인된 상태 / `NOT_CONFIRMED` | 밖에 있다고 단정하지 않음 |\n| MuJoCo에서 안착 확인 기한 초과 | `FAILED` | 마지막 확인 상태 / `UNKNOWN` | false 응답만으로 즉시 실패하지 않음 |\n| 놓기는 확인됐지만 팔 복귀 실패 | `FAILED` | `LEFT_GRIPPER / CONFIRMED` | 실제 수거 증거 보존 |\n| 취소 후 물체를 든 채 정지 | `CANCELED` | `HELD / NOT_CHECKED` | 베이스 자동 복귀 금지 |\n| 취소 후 정지 확인 불가 | `FATAL` | 마지막 확인 상태 / 기존 확인 상태 | 신규 Goal 차단 |\n\n성공 Result의 필수 조건은 `error_code=NONE`, `failed_stage=\"\"`,\n`last_completed_stage=VERIFYING_PLACEMENT`, `object_state=LEFT_GRIPPER`,\n`placement_state=CONFIRMED`, 팔 ID 존재, `stop_confirmed=true`,\n`arm_recovered=true`, `retryable=false`다.\n`FINALIZING`은 보관 단계이며 마지막 물리 완료 단계로 쓰지 않는다.\n\n실패와 취소에서도 실제로 확인된 물체 및 놓은 결과를 초기값으로 되돌리지 않는다.\n`CANCELED`는 `error_code=CANCELED`, `retryable=false`로 반환하고 취소를 관찰한 실행\n단계를 `failed_stage`에 남긴다. 정지 실패는 그 단계와 별도로 `STOP_UNCONFIRMED` 원인을\n보존한다. 실행 후 실패 및 치명 오류의 재시도 기본 판단은 false다. 준비 중 일시 오류만\n정지 및 미접촉 근거가 있는 경우 true 후보로 검토한다. 확인하지 못한 물리 상태는\nfalse 또는 UNKNOWN으로 표시하고 추정해서 성공 값으로 채우지 않는다.\n\n## 6. ROS 정의\n\n값 목록은 위 표를 따르며 Python core는 문자열 Enum을 사용한다.\n아래 필드는 [실제 Action 정의](../../cleany_interfaces/action/ExecuteManipulationSkill.action)와 같다.\n\n```text\n# Goal\nstring mission_id\nstring task_id\nstring execution_id\nstring skill_name\nstring snapshot_id\nuint32 object_id\nstring destination_id\n---\n# Result\nstring execution_id\nstring execution_profile\nstring status\nstring error_code\nstring failed_stage\nstring last_completed_stage\nstring object_state\nstring placement_state\nstring selected_arm\nbool stop_confirmed\nbool arm_recovered\nbool retryable\nstring message\nstring failed_substage\nstring cancel_mode\n---\n# Feedback\nstring execution_id\nstring stage\nstring substage\nstring selected_arm\nstring message\n```\n\n## 7. 오류와 후속 결정\n\n구현 오류 목록: `NONE`, `INVALID_ARGUMENT`, `TARGET_UNAVAILABLE`, `STALE_TARGET`,\n`DESTINATION_UNAVAILABLE`, `BACKEND_NOT_READY`, `VERIFICATION_UNAVAILABLE`,\n`GRASP_FAILED`, `GRASP_LOST`, `MOTION_FAILED`, `PLACEMENT_NOT_CONFIRMED`,\n`VERIFICATION_TIMEOUT`, `TIMEOUT`, `CANCELED`, `E_STOP`, `HARDWARE_ERROR`,\n`STOP_UNCONFIRMED`, `INTERNAL_ERROR`.\n\n반환 단계와 adapter 대응은 [서버 명세](03_manipulation_server_behavior_spec.md)와\n[Mission 연동 후속 작업](manipulation.md#mission-연동-후속-작업)에 정리한다.\n클라이언트는 execution_id를 발급하며 테스트 클라이언트는 UUID4를 사용한다.\n실행 기록 저장 실패는 경고 로그로 전달하며 실제 실행의 status와 error_code를 유지한다.\n저장 실패만으로 동작이나 신규 Goal을 차단하지 않는다. 함께 발생한 hardware fault·e-stop·\n정지 미확인의 `FATAL`과 물리 상태에 따른 차단은 유지한다.\n조회는 서버 메모리의 최신 기록을 반환하며 저장 성공을 보장하지 않는다.\n`ManipulationExecutionRecord`는 Goal과 최신 진행·Result, `record_state`, `has_result`,\n`human_confirmation_required`, revision과 Unix nanoseconds 시각을 제공한다.\n`has_result=false`인 중단 기록에는 가짜 status/error_code를 채우지 않는다.\n제품 snapshot 보존, 실물 정지 판정·verifier와 허용 client는 후속 결정 대상이다.\n"},"ros2_ws/src/cleany_skill_executor/docs/03_manipulation_server_behavior_spec.md":{"title":"03. Manipulation 서버 동작 명세","body":"# 03. Manipulation 서버 동작 명세\n\n> **모의 구현과 BT backend 계약.** 대상은 승인된 `collect_trash` 또는 `collect_lost_item` 물체 하나다.\n> 서버는 책상 전체의 물체 선택, Planner 호출과 완료 판정을 맡지 않는다.\n> Python 모의 서버의 실행·설정·검증은 [사용법](manipulation_mock_usage.md)를 따른다.\n> MuJoCo의 실제 실행·정지 근거는 [BT 실행 계약](../../cleany_manipulation_bt/docs/execution_contract.md)을 따른다.\n\n| 확인할 내용 | 위치 |\n|---|---|\n| 시작 조건과 실행 단계 | [시작 전 확인](#2-시작-전에-확인할-것), [실행 단계](#3-실행-단계) |\n| 인식과 놓기 검증 | [InspectScene](#4-inspectscene은-무엇인가), [놓은 결과 확인](#5-놓은-결과-확인) |\n| 실패·취소·기록 | [실패와 재시도](#6-실패와-재시도), [취소](#7-취소는-어떻게-처리하는가), [실행 기록](#8-기록-fault와-profile) |\n| Mock의 구현 범위 | [모의 서버의 구현 경계](#10-모의-서버의-구현-경계) |\n\n## 1. 시작과 종료 경계\n\n| 시작 | 종료
