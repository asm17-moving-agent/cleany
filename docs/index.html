 기한을 갱신하지 않음\n    end note\n    note right of Disabled\n        재연결만으로 재허가하지 않음\n        STOP과 단절은 대기 명령 삭제\n    end note\n```\n\n부팅, STOP, 만료, 단절 뒤에는 새 ENABLE과 새 cmd_vel이 필요합니다. 연결 복구만으로 이전 목표를 재개하지 않습니다. STOP latch와 단절은 대기 명령을 지우며, PWM/PI는 별도 motor task가 계산합니다.\n\n## 피드백\n\n| 필드 | 의미 |\n|---|---|\n| boot_id | 부팅별 nonzero uint32; reboot/baseline 감지 |\n| timestamp_us | MCU monotonic; JointState는 ROS 수신 stamp 사용 |\n| enabled | 소프트웨어 구동 허가 |\n| command_age_ms=65535 | 활성 유효 명령 없음 |\n| Fault bit 0 | 명령 만료; 새 ENABLE 수락 시 초기화 |\n\nDriver는 중복, 역순 feedback을 무시하고 실제 수신 지연을 감시합니다. Encoder rollover는 modular delta로 누적합니다. Reboot, 단절 뒤에는 baseline을 재설정하되 누적 각도를 유지합니다. 단절 중 이동량은 관측할 수 없습니다.\n\n관련 안내: [Driver](../../cleany_base_driver/docs/command-and-odometry.md), [펌웨어](../../../../esp32/README.md), [검증](../../../../docs/implementation/testing.md).\n\n## 표준 IMU telemetry\n\nIMU는 이 패키지의 custom message가 아니라 `sensor_msgs/msg/Imu`를 사용한다.\nMCU의 `imu_uncalibrated/data_raw` 발행, Jetson 고정 gyro bias 적용과 EKF 연결은\n[IMU 계약](../../cleany_base_driver/docs/imu.md)을 따른다. Wheel의 MCU monotonic\n시각과 달리 IMU `header.stamp`는 Agent에 동기화한 ROS epoch 취득 시각이다.\n\n기존 custom IMU transport를 사용하던 환경은 firmware와 host를 함께 갱신한다.\n\n## Host 구동 허가 서비스\n\n`SetBaseEnabled.srv`는 ROS host 사이의 순서 있는 허가 요청입니다. MCU의 고정 크기 메시지나\n펌웨어 wire protocol을 변경하지 않습니다. client_id별 request_sequence로 지연된 과거 요청을\n거절하고 응답의 command_sequence와 boot_id는 fresh WheelState에서 확인합니다.\n"},"ros2_ws/src/cleany_base_odometry/docs/interfaces.md":{"title":"cleany_base_odometry 노드 인터페이스","body":"# cleany_base_odometry 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## wheel_odometry\n\n실행 파일: `wheel_odometry_node`. 원본: [wheel_odom_node.py](../cleany_base_odometry/wheel_odom_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `input_topic` |\n| 토픽 발행 | `wheel/odom` | `nav_msgs/msg/Odometry` | R10; 유효 관측 구간 준비 후 입력 수신 시, `output_topic` |\n\nTF는 발행하지 않습니다. 의미는 [Base odometry 계약](../../cleany_base_driver/docs/command-and-odometry.md)을 따릅니다.\n\n`twist_covariance_diagonal`은 vx, vy, vz, wx, wy, wz 순서의 유한한 비음수 분산\n6개다. 단독 실행 기본값은 0이며 EKF bringup은 융합에 사용하는 축에 양의 분산을\n설정한다. Off-diagonal 항은 0이다. Pose covariance는 변경하지 않는다.\n\n## 원점 초기화\n\n`wheel_odometry/reset`은 private `~/reset`, `std_srvs/srv/Trigger` 서비스입니다.\npose와 encoder baseline을 초기화하고 다음 fresh encoder 표본을 기다립니다. 이 서비스는\n모터를 정지시키지 않으므로 매핑 관리자가 STOP을 확인하고 기존 SLAM을 종료한 뒤 호출합니다.\n"},"ros2_ws/src/cleany_benchmark/README.md":{"title":"Controller compute timing","body":"# Controller compute timing\n\nThis standalone Humble package wraps any `nav2_core::Controller` without changing\nthe algorithm namespace, lifecycle methods, plan, speed limit, commands, or\nexceptions. Source it after the ROS and original controller overlays.\n\n```yaml\ncontroller_server:\n  ros__parameters:\n    controller_plugins: [FollowPath]\n    FollowPath:\n      plugin: cleany_benchmark::TimedController\n      wrapped_plugin: teb_local_planner::TebLocalPlannerROS\n      benchmark_timing_file: /absolute/run/directory/controller_compute.csv\n      # 기존 FollowPath 파라미터를 변경 없이 여기에 입력합니다.\n```\n\nRPP's original plugin is\n`nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController`.\nThe destination directory must already exist. CSV files are appended to preserve\nexisting evidence; use a distinct file per run. A new wrapper instance restarts\nsequence numbering at 1, while a cleanup/reconfigure of the same instance keeps it.\n\nCSV columns:\n\n| Column | Meaning |\n|---|---|\n| `sequence` | Invocation number, starting at 1 |\n| `sim_time_ns` | Node clock immediately before the call, nanoseconds; simulated time when `use_sim_time=true` |\n| `wall_start_ns` | Monotonic steady clock start, nanoseconds since its implementation-defined epoch |\n| `compute_us` | Steady wall duration of the wrapped compute call, microseconds |\n| `success` | 1 when the method returns, 0 when it throws; exception is rethrown unchanged |\n\n```mermaid\nflowchart LR\n    Start[\"steady start timestamp\"] --> Compute[\"wrapped compute call\"]\n    Compute --> End[\"steady end timestamp\"]\n    End --> CSV[\"mutex / file write / flush\"]\n```\n\n| Timing / output boundary | Contract |\n|---|---|\n| Included | Original method visualization / logging and thread scheduling |\n| Excluded | Surrounding Nav2 cycle, wrapper file write / mutex / flush |\n| Buffer | Requested 64 KiB, flush every 128 calls and cleanup / destruction |\n| Abrupt termination | Last buffered rows may be lost |\n| success=1 | Method returned; does not establish navigation arrival |\n\nFor a 20 Hz controller, report a 50 ms wall deadline and the separately identified\nRTF-adjusted wall budget (25 ms at actual RTF 2). Do not infer actual RTF from its\nconfigured target. Report p95/p99 for successful calls and exception calls\nseparately, retaining both raw populations. `wall_start_ns` is monotonic, not UTC.\n\nBuild inside the installed ROS container:\n\n```sh\nsource /opt/ros/humble/setup.bash\ncolcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release\nsource install/setup.bash\n```\n"},"ros2_ws/src/cleany_bringup/docs/hardware-mapping.md":{"title":"실물 매핑 구성","body":"# 실물 매핑 구성\n\n```mermaid\nflowchart LR\n  Sensors[\"LiDAR + 휠 피드백\"] --> Ready[\"scan · odom · TF 준비\"]\n  Ready --> Session[\"매핑 세션 / Cartographer\"]\n  Session --> View[\"지도 · 스캔 · 궤적 관측\"]\n  Session --> Stop[\"입력 차단 · STOP 확인\"]\n  Stop --> Save[\"지도 저장 · Logger flush · 종료\"]\n```\n\n[지도 만들기](../../../../docs/implementation/how-to/mapping.md) · [센서 확인](../../../../docs/implementation/how-to/sensors.md) · [매핑 상태 계약](../../cleany_navigation/docs/mapping.md)\n\n`hardware_mapping.launch.py`는 설치된 패키지로 hardware runtime을 시작합니다.\nRuntime은 영속 센서/base/조종 launch와 매핑 관리자를 별도 프로세스 그룹으로 소유합니다.\n종료 시 매핑 관리자의 저장을 먼저 기다리고 장치 launch를 종료합니다.\n웹 페이지를 닫아도 지도와 기록은 종료되지 않습니다.\n\n실물 구성에서는 base relay가 `odom → base_link`, 장착 TF가 `base_link → sensor`를 제공합니다. 매핑 세션의 Cartographer는 `map → odom`을 발행합니다. 같은 변환을 발행하는 다른 실행 구성을 함께 시작하지 않습니다.\n\n| 프로필 | 출처와 범위 |\n|---|---|\n| `mapping_legacy.yaml` | 이전 실물 매핑의 x=0.029m, yaw=-7.85도. 원본 측정 artifact 미확인 |\n| `mapping_evaluation_20261015.yaml` | main의 평면 보정 x=-0.070807m, y=-0.038232m, yaw=79.770070도, laser 좌표계 |\n\n두 프로필은 서로 다른 장착/프레임 자료이므로 합성하지 않습니다. 둘 다 z=0은 평면 규약이며\n실측 높이가 아닙니다. 장착을 변경했다면 해당 프로필의 사용 근거를 다시 확인합니다.\n기본값은 기존 매핑 동작을 보존하는 legacy 프로필입니다. mock은 실물 geometry 대신\n`base_synthetic.yaml`을 선택하며 Agent와 실물 LiDAR를 시작하지 않습니다.\n\n설정은 설치된 package share에서 찾고, 실행 시 state_root에 확정 설정을 보존합니다.\n키는 state_root/web-token(0600), 지도는 maps/, 녹화는 recordings/에 두며 저장소 소스나\n`.runtime` 빌드 경로를 사용하지 않습니다. 시작 명령은 [RUNNING](../../../../docs/implementation/running.md),\n설치와 외부 드라이버는 [개발환경](../../../../docs/implementation/development-setup.md)을 따릅니다.\n\n조종 사건은 state_root의 `teleop-events.jsonl`과 회전 백업에 저장합니다. 매핑 작업 오류는\n`maps/errors/\u003coperation_id>.json`에서 확인하며, 진단 파일 저장에 실패하면\n`mapping.log`의 traceback을 확인합니다. [진단 계약](../../cleany_teleop/docs/interfaces.md)을 따릅니다.\n"},"ros2_ws/src/cleany_control_bridge/docs/interfaces.md":{"title":"cleany_control_bridge 노드 인터페이스","body":"# cleany_control_bridge 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## control_bridge\n\n실행 파일: `control_bridge`. 원본: [노드.py](../cleany_control_bridge/node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 서비스 호출 | `mission/offer` | `cleany_interfaces/srv/OfferMission` | Service 기본값 |\n| 서비스 호출 | `mission/cancel` | `cleany_interfaces/srv/CancelMission` | Service 기본값 |\n| 서비스 호출 | `mission/snapshot` | `cleany_interfaces/srv/GetRuntimeSnapshot` | Service 기본값 |\n\nROS 토픽이나 action을 직접 제공하지 않습니다. Backend WebSocket은 `url`로 설정하고 상태 동기화 간격은 `heartbeat_interval` 기본 1초입니다. [Gateway 계약](../../cleany_interfaces/docs/mission.md)을 따릅니다.\n\n`mission/snapshot` 응답 JSON에 `target_map`이 있으면 `robot.snapshot` payload로 그대로\n전달합니다. 이 값은 Runtime이 로드한 좌석 목표 파일의 지도 ID, 원본 해시, 배치 revision과\n목표 digest입니다. Bridge가 디스크 파일만 읽어 Runtime의 적용 상태로 보고하지 않습니다.\n필드가 없는 기존 Runtime에는 이전 snapshot 계약을 유지합니다.\n\n## pose_backend_bridge\n\n실행 파일: `pose_backend_bridge`. 원본: [pose_node.py](../cleany_control_bridge/pose_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS와 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/telemetry/pose` | `geometry_msgs/msg/PoseStamped` | sensor data, best effort, volatile; `pose_topic` |\n\nROS 발행, 서비스, action과 TF는 없습니다. Mission의 영속 명령 bridge와 별도 프로세스로\n실행합니다. 위치는 최신값 하나만 유지하며 재접속 때 과거 표본을 재생하지 않습니다.\n\n| 파라미터 | 기본값 | 의미 |\n|---|---|---|\n| `url` | `ws://127.0.0.1:8080/api/robots/cleany-01/pose/ws` | Backend pose endpoint |\n| `device_token_file` | 빈 문자열 | 장치 토큰 파일; 설정 시 연결마다 읽어 Bearer 인증에 사용 |\n| `map_id`, `map_frame` | 빈 문자열, `map` | 해당 좌표계에서만 보낼 Backend 지도 ID |\n| `rate` | `5.0` | 최대 전송 빈도(Hz) |\n| `input_timeout`, `future_tolerance` | `1.5`, `0.1` | 원본 시각의 최대 나이와 미래 허용 오차(초) |\n| `reconnect_initial`, `reconnect_max` | `1.0`, `30.0` | 재접속 지수 backoff 범위(초) |\n\nBackend payload는 `x`, `y`, `yaw`, `frame_id`와 선택적 `map_id`입니다. map_id는\n입력 좌표계가 map_frame과 일치할 때만 포함합니다. 지도 ID는 실제 localization에\n사용한 지도와 맞춰야 하며 이 설정은 좌표 변환을 수행하지 않습니다. Backend의\n`received_at`은 서버 수신 시각입니다. 원본 관측 시각은 ROS 메시지에 유지되며 현재\nBackend 계약에 별도 필드로 추가하지 않습니다.\n\n원본 시각은 같은 ROS 시계로 검사하고, 이미 경과한 입력 나이를 단조 시계의 전송\n유효기간에서 차감합니다. 같은 시각의 반복 입력은 유효기간을 연장하지 않습니다.\nBackend 연결 실패는 관측 노드에 영향을 주지 않습니다. 토큰 파일 경로만 ROS\n파라미터로 전달하며 내용은 로그에 기록하지 않습니다. 인증이 필요한 Backend에는\n파일을 반드시 설정해야 합니다.\n"},"ros2_ws/src/cleany_description/docs/freecad-gripper.md":{"title":"FreeCAD 집게의 명목 연동","body":"# FreeCAD 집게의 명목 연동\n\n원본의 `Pinc_Cam`은 원판의 두 편심핀으로 구동 로드를 당기고 미는 형상이다.\n저장된 BREP에서 편심핀, 로드 양 끝, 고정판과 손끝 링크의 공통 원통축을\n찾아 두 개의 폐쇄 링크를 구성했다. 캠 외곽면과 가상의 접촉 법칙을 맞추지 않고\n핀 중심 간 거리를 사용한다. 실물 구속이나 조립 공차를 측정한 결과는 아니다.\n\n## 확인한 연결\n\n손가락마다 아래 점을 사용한다. 좌표와 근거 면 번호는\n[`freecad_kinematics.json`](../config/geometry/freecad_kinematics.json)의\n`gripper_linkages`에 보존한다. 부품 구분은\n[`freecad_gripper_structure.json`](../config/geometry/freecad_gripper_structure.json)에 둔다.\n\n| 점 | 공통 축을 갖는 부품 | 역할 |\n|---|---|---|\n| O | Cam, CamHorn, servo | 캠 회전축 |\n| P | Cam, Driving_Rod | 캠 편심핀 |\n| D | Driving_Rod, Internal_Rod | 구동 로드와 내측 링크 연결 |\n| A | Internal_Rod, Top_Plate, Bottom_Plate | 내측 링크의 고정축 |\n| B | External_Rod, Top_Plate, Bottom_Plate | 외측 링크의 고정축 |\n| C | Internal_Rod, Distal_Rod | 내측 링크와 손끝 운반 링크 연결 |\n| E | External_Rod, Distal_Rod | 외측 링크와 손끝 운반 링크 연결 |\n\n```mermaid\nflowchart LR\n    O[\"고정축 O\"] --- Cam[\"캠\"] --- P[\"편심핀 P\"]\n    P --- Drive[\"구동 로드\"] --- D[\"연결핀 D\"]\n    A[\"고정축 A\"] --- Inner[\"내측 링크\"] --- C[\"손끝 핀 C\"]\n    D --- Inner\n    B[\"고정축 B\"] --- Outer[\"외측 링크\"] --- E[\"손끝 핀 E\"]\n    C --- Distal[\"손끝 운반 링크\"] --- E\n```\n\n캠과 혼은 중앙 축 외에 네 체결 구멍의 축도 일치한다. 이를 명목 강체 회전으로\n묶었다. 좌우 집게 각각의 두 손가락에서 추출한 주요 거리는 다음과 같다.\n\n| 거리 | CAD 값 |\n|---|---|\n| 편심 반경 OP | 11 mm |\n| 구동 로드 PD | 약 32.64768 mm |\n| 내측 링크의 구동점 AD | 약 21.26447 mm |\n| 내측 AC, 외측 BE | 각각 40 mm |\n| 고정축 간격 AB, 손끝 핀 간격 CE | 각각 11.5 mm |\n\nAC와 BE의 벡터, AB와 CE의 벡터가 각각 일치하여 저장된 자세에서 평행사변형을\n이룬다. 두 편심핀의 벌어진 각도는 180°가 아니라 178.68°다. 대칭 오차인지\n의도한 위상인지 확정하지 않고 원본 좌표를 그대로 사용한다. 따라서 두 손가락의\n움직임을 강제로 같은 각도로 만들지 않는다.\n\n## 계산과 모델 반영\n\n입력은 각 손의 `cad_delta_right_gripper_cam`, `cad_delta_left_gripper_cam`이다.\n저장된 자세에서 캠이 회전한 변화량이며 물리 영점이나 servo encoder 값이 아니다.\n\n1. O를 중심으로 P를 회전한다.\n2. A 중심의 반경 AD 원과 P 중심의 반경 PD 원의 교점으로 D를 구한다.\n3. 내측 링크를 강체 회전하여 C를 구한다.\n4. C 중심의 반경 CE 원과 B 중심의 반경 BE 원의 교점으로 E를 구한다.\n5. 내측, 외측, 구동 로드와 손끝 운반 링크의 상대 회전을 계산한다.\n\n교점 두 개 중 저장된 조립 자세와 같은 방향의 해를 유지한다. 원이 만나지\n않거나 접선 상태로 해가 합쳐지면 오류로 처리한다. 해를 바꾸거나 링크 길이를\n수정해서 계속 움직이지 않는다. 이 오류 조건은 기하학적 계산 영역이며 실제\n사용 가능 각도나 안전 한계가 아니다.\n\n한 손에 캠 1개와 종속 회전 8개를 추가했다. 전체 미리보기는 34개 회전 좌표이며\n독립 입력은 기존 16개와 캠 2개를 합한 18개다. 종속 좌표 16개는\n`resolved_deltas()`가 계산한다. URDF에는 비선형 폐쇄 링크를 선형 `mimic`으로\n대체하지 않았다. ROS에 상태를 공급할 때도 해석된 좌표들을 함께 제공해야 하며,\n종속 관절을 독립적으로 움직이면 링크 폐쇄가 깨진다.\n\nMuJoCo는 이 FK 결과로 34개 mocap body를 배치한다. 실제 접촉·구동·관성으로\n링크를 강제하는 동역학 모델은 아니며 actuator와 추정 질량은 추가하지 않았다.\n\n## 아직 확정하지 않은 것\n\n| 항목 | 상태 |\n|---|---|\n| 캠 물리 영점, encoder 부호, 모터 ID와 가동 범위 | null 유지 |\n| 실물 각도와 개구 폭의 보정 곡선 | null 유지; 명목 링크 위치 계산과 구분 |\n| 캠 편심핀의 178.68° 배치 의도 | 추가 확인 필요; 180°로 수정하지 않음 |\n| 핀 유격, 마찰, 체결 상태, 탄성, 접촉 힘 | 모델링하지 않음 |\n| 팁의 실제 체결력·탄성·유격 | CAD 맞물림은 명목 고정 결합으로 반영. 나사·재질 조건은 실물 확인 필요 |\n| 물체 접촉 뒤 정지, 패드 변형과 유지력 | 실물 시험 필요 |\n\n구동 로드와 내·외측 링크의 핀 연동은 모델에 반영했지만,\n`gripper_actuation=false`는 유지한다. 기존 실물 집게의 닫힘 tick과 접촉 판정\n기준을 새 집게로 복사하지 않는다.\n\n[팁 체결과 회전 간섭 분석](freecad-tip-mounts.md)에서 네 팁의 공통 체결축과\n양방향 강체 회전 간섭을 확인했다. 팁은 운반 링크 아래의 네 고정 자식 링크로\n분리했으며 회전 좌표나 독립 입력은 추가하지 않았다.\n\n덮개를 숨긴 연동 GIF는 다음 명령으로 만든다. `-25`는 표시용 변화량 예시다.\n출력 JSON은 독립 입력과 계산된 전체 관절 변화량을 함께 기록한다.\n\n```bash\npython3 tools/validation/preview_freecad_kinematics.py \\\n  --delta cad_delta_right_gripper_cam=-25 --focus-gripper right \\\n  --output /tmp/cleany-gripper.gif\n```\n"},"ros2_ws/src/cleany_description/docs/freecad-kinematics.md":{"title":"FreeCAD 링크와 회전축","body":"# FreeCAD 링크와 회전축\n\n`freecad_kinematic`은 저장된 CAD 자세에서의 각도 변화량으로 움직이는 형상\n미리보기다. 양팔 10축, 헤드 2축, 바퀴 4축에\n[PincOpen의 명목 핀 연동](freecad-gripper.md)을 추가했다. 독립 입력은 기존\n16개와 캠 2개이며 종속 좌표를 포함한 전체 회전 좌표는 34개다.\n[팁 맞물림](freecad-tip-mounts.md)은 네 고정 자식 링크로 표현하며 새로운\n수동 회전 자유도를 추가하지 않는다.\n\n## 추출 근거\n\n축은 BREP의 해석적 원통면에서 구한다. 구동 혼과 서보의 중심선이 일치하고,\n지지 혼이 있는 경우 그 중심선도 일치해야 선택한다. 중심선 일치의 수치 허용값은\n0.02 mm와 0.0001 rad이며 물리적인 조립 허용오차나 제어 허용값이 아니다.\n후보가 없거나 둘 이상이면 내보내기를 중단한다. 부품 이름의 Placement 축을\n그대로 관절축으로 사용하지 않는다.\n\n원본 부품의 소유 관계는\n[`freecad_link_structure.json`](../config/geometry/freecad_link_structure.json)에,\n원통면 번호, 반지름, 면적, 축과 비교 오차는\n[`freecad_kinematics.json`](../config/geometry/freecad_kinematics.json)에 보존한다.\n링크 연결은 원본 부품 그룹과 서보 케이스·구동 혼의 배치에 근거한 해석이며,\n원본 파일에 조립 구속이나 실물 검증 결과가 추가된 것은 아니다.\n\n| 움직이는 링크 | 부모 | 원본 근거 |\n|---|---|---|\n| 좌우 shoulder_yaw | base_link | Base_servo와 Yaw 구동·지지 혼 |\n| 좌우 shoulder_pitch | 해당 shoulder_yaw | Yaw_servo와 Upper 구동·지지 혼 |\n| 좌우 elbow_pitch | 해당 shoulder_pitch | Upper_servo와 Lower 구동·지지 혼 |\n| 좌우 wrist_pitch | 해당 elbow_pitch | Lower_servo와 Wrist 구동·지지 혼 |\n| 좌우 wrist_roll | 해당 wrist_pitch | Wrist_servo와 ToolDriveHorn |\n| head_pan | base_link | HeadPanServoCase와 pan 구동·지지 혼 |\n| head_tilt | head_pan | HeadTiltServoCase와 tilt 구동·지지 혼 |\n| 4개 wheel | base_link | 원통형 wheel 외곽과 해당 motor 중심선 |\n\n서보 케이스는 부모 링크, 그 서보의 구동 혼은 자식 링크에 둔다. 헤드는 원본의\n단일 HeadRig 그룹에서 케이스, 브래킷, 혼과 카메라를 나누었다. 모든 입체 부품은\n한 링크에만 속한다. 원본 `RightArm`은 로봇 오른팔이다.\n헤드 팬 아래의 `HeadPanIdlerHorn`은 고정 브래킷 안에서 고정 서보 케이스에\n닿고 움직이는 구동 혼과는 29.4mm 떨어져 있다. CAD 검사 모델에서는 이를\n`base_link`에 배치하고 팬 중심선의 근거로 계속 사용한다. 실물 체결은 별도\n확인 항목이다.\n\n원본 바퀴 이름의 front/rear와 left/right는 화면 전방을 기준으로 한 ROS 방향과\n다르다. 축과 위치에 따라 다음처럼 연결하며 모터 ID는 지정하지 않는다.\n\n| 원본 이름 | 미리보기 위치 |\n|---|---|\n| Drive_rear_left | front_right |\n| Drive_rear_right | front_left |\n| Drive_front_left | rear_right |\n| Drive_front_right | rear_left |\n\n## 변화량 좌표\n\n`cad_delta_*`의 단위는 rad이며 저장된 CAD 자세에서 추가로 회전한 각도다.\n모든 변화량이 0이면 기존 `freecad_final`의 형상이 정확히 재현된다. 이는 물리적\n관절 영점이나 encoder 0을 선택했다는 뜻이 아니다.\n\n축 방향은 `base_link`에서 절댓값이 가장 큰 성분을 양수로 만드는 수치 규약이다.\n서보의 양의 명령 방향은 미확정이다. 관절 프레임의 원점은 구동 혼 원통면의\n표면 중심을 축에 투영한 점이다. 회전 중심선을 표현하는 좌표 선택이며 기준\n각도나 실제 베어링 중심의 측정값을 추가하지 않는다.\n\nURDF는 변화량 입력을 표현하기 위해 `continuous`를 사용한다. 이 형식은 실제\n관절의 무제한 회전을 주장하지 않는다. 운용 한계가 미확정이므로 임의의\nlower/upper, effort, velocity를 넣지 않았다. 이름도 기존 제어 관절과 다르며\n이 모델에 기존 MoveIt 또는 hardware controller를 연결하지 않는다.\n\nMuJoCo는 34개 mocap body를 FK 결과로 배치한다. 구동 관절, actuator, 질량과\n접촉 응답을 추가하지 않는다. 따라서 모터로 구동하는 동역학 시뮬레이션이 아니라\n관절축과 연결 구조의 운동학적 표시다.\n\n## 미확정 값\n\n| 항목 | 현재 상태 | 필요한 확인 |\n|---|---|---|\n| 관절 영점, encoder zero와 회전 부호 | 축마다 null | 영점 기준 자세와 실물 encoder 대응 |\n| 가동 범위, 속도와 힘 제한 | 축마다 null | 기구 간섭, 배선, 모터 사양과 실물 시험 |\n| PincOpen 구동 | 명목 폐쇄 링크와 팁 고정 자리 반영; 실물 보정·체결력은 미확정 | encoder와 개구 폭 대응, 유격, 체결·탄성 조건 |\n| TCP와 파지 접촉 판정 | 미설정 | 기준점·접근축 정의와 손끝 접촉 시험 |\n| 질량, 관성, 센서 외부 보정 | 기존 미확정 상태 유지 | 실물과 사양 근거 |\n\n집게는 핀과 로드의 기하학적 거리로 연동한다. 실물 actuator와 접촉 응답은\n아직 연결하지 않으며 `gripper_actuation=false`를 유지한다.\n\n실행과 GIF 생성은 [실행 가이드](../../../../docs/RUNNING.md#freecad-형상-미리보기),\n검사 범위는 [테스트 가이드](../../../../docs/TESTING.md#freecad-정적-기준-모델)를 따른다.\n"},"ros2_ws/src/cleany_description/docs/freecad-model.md":{"title":"FreeCAD 기준 모델","body":"# FreeCAD 기준 모델\n\n실행 CAD는 [공통 CAD 런타임](runtime-model.md)에서 다룬다.\n\n`Cleany-final.FCStd`의 저장된 조립 형상을 `freecad_final` 모델로 제공한다.\n프레임, 양팔, PincOpen 집게, 손목 카메라, 헤드, 바퀴, 외장과 화면을 포함한다.\n관절을 움직이는 모델이 아니라 CAD에 저장된 한 자세의 정적 기준 모델이다.\n원본의 `DesignStatus`도 `layout-draft`다.\n양쪽 손목 카메라에는 원본 형상 위에 사용자 실측 깊이를 반영한다. 내보내기\n도구는 `freecad_wrist_camera_depth.json`이 있으면 PCB 위치와 광축을 기준으로\n렌즈 몸체, 앞 유리와 마운트 뒤 면을 맞춘다. 렌즈 유리 앞 끝에서 PCB 뒤면은\n9.5mm, 마운트 뒤 면은 26.7mm다. PCB, 손목 체결 위치와 광학 보정값은\n유지하며 치수 출처는 형상 manifest에 기록한다.\n\n## 모델 선택과 적용 범위\n\n| 선택 | 용도 | 제약 |\n|---|---|---|\n| `freecad_final` | 정적 description 미리보기, 부품 배치와 표면 확인 | 관절 명령, 동역학, 파지와 센서 보정에 사용하지 않음 |\n| `freecad_kinematic` | 추출한 축과 집게 핀 연동의 변화량 표시 | 영점·운용 제한·실물 접촉 미확정, 실제 제어용이 아님 |\n| `legacy_runtime` | 기존 URDF의 관절, MoveIt, 제어와 기존 보정 비교 | 새 CAD 형상을 반영한 실행 모델이 아님 |\n\n`description.launch.py`의 기본값은 `freecad_calibrated`이다. 정적 미리보기는 `model_variant:=freecad_final`로 선택한다. 기존 직접 진입점인\n`cleany.urdf.xacro`, `cleany_control.urdf.xacro`와 `mjcf/cleany.xml`은 기존 실행\n모델을 유지한다. 새 정적 모델은 기존 관절명과 TCP를 제공하지 않으므로 기존\nMoveIt chain이나 컨트롤러 설정을 붙여 사용하지 않는다. 기존 실행기의 홈 자세,\n충돌 구, 관절 보정과 접촉 판정도 새 CAD 기준으로 검증된 값이 아니다.\n\n`namespace`는 robot description, joint state와 TF 토픽에 적용하고,\n`frame_prefix`는 발행하는 TF frame ID에 적용한다. 둘의 기본값은 빈 문자열이다.\n실물 관절 피드백을 사용하려면 현재 encoder 값과 CAD 기준 자세의 대응을\n검증해야 한다. 실행 중인 주행 좌표와 CAD 전방 및 높이 원점도 먼저 맞춰야 한다.\n\n회전축과 링크 소유 관계의 후속 추출은 [FreeCAD 운동학](freecad-kinematics.md)에\n정리한다. 이 페이지의 null 값은 정적 기준 모델의 상태이며, 추출된 기하 축과\n아직 미확정인 영점·구동 값은 운동학 manifest에서 구분한다.\n\n새 URDF의 `cad_snapshot_*` 링크는 원본의 부품 그룹을 나타낸다. `fixed` 연결은\n저장된 조립 자세를 표시하기 위한 것이며, 실제 팔이나 집게가 고정되어 있다는\n뜻이 아니다. 모든 부품 메시를 `base_link` 좌표로 내보내 그룹 원점은 항등 변환을\n사용한다. 실제 관절 원점과 축을 추정해 넣지 않는다.\n\n## 좌표와 형상 계약\n\n| 항목 | 반영 내용 |\n|---|---|\n| 원본과 출력 단위 | FreeCAD mm → 메시 m |\n| 전방과 좌측 | LiDAR가 장착된 CAD -Y → ROS +X, CAD +X → ROS +Y |\n| 높이 원점 | CAD 지면 Z=-95.5 mm를 기준으로 기존 `base_link`의 지면 위 380 mm 좌표 관례 유지 |\n| 변환식 | `x=-CAD_y/1000`, `y=CAD_x/1000`, `z=CAD_z/1000-0.2845` |\n| 좌우 팔 | 원본 `RightArm` → 로봇 오른팔, `LeftArm` → 로봇 왼팔; 정면에서 보이는 좌우와 구분 |\n| 프레임 기둥 | 원본 560 mm 반영; 기존 실행 모델의 660 mm와 다름 |\n| 메시 배치 | BREP에 포함된 객체 Placement를 한 번 사용하고 상위 App::Part Placement를 합성 |\n| 형상 세분화 | 최대 선형 편차 설정 0.35 mm, 각도 0.35 rad; 각 면의 CAD 경계를 벗어난 결과나 작은 면은 더 세밀하게 재시도 |\n| 색상과 화면 | 저장된 부품별 색상과 내장 `idle.png` 사용 |\n| 충돌 | URDF에 동일한 삼각형 표면 제공; 움직이는 로봇의 충돌 근사나 SolidFCL용 볼록 분해로 인증한 형상은 아님 |\n| MuJoCo | 월드에 고정된 시각 기준 모델. actuator와 joint 없이 접촉 비활성화 |\n\n높이 변환은 좌표계를 맞추는 관례이며 실물 측정이나 새로운 보정 결과가 아니다.\n원본의 바퀴 이름은 화면 전방 기준과 일치하지 않으므로 구동 모터 ID나 기존\nwheel joint에 이름만으로 연결하지 않는다. 원통형 바퀴 표현은 메카넘 구동 방식의\n변경을 뜻하지 않는다.\n\n원본 해시, 부품별 BREP와 메시 해시, 그룹, 경계와 변환은\n[`freecad_final.json`](../config/geometry/freecad_final.json)에 기록한다.\n화면은 두 삼각형의 텍스처 면으로 제공하며 충돌 형상에서 제외한다.\nMuJoCo의 STL당 삼각형 200,000개 제한에 맞춰 LiDAR 메시를 둘로 나누고,\nURDF와 MuJoCo가 같은 두 조각을 읽는다. 원본 삼각형의 순서와 내용은 유지한다.\nmanifest에는 조각별 해시와 분할 전 STL 해시를 기록한다. 자동 관성 추정은\n끄므로 색상이나 부피로 질량을 추정하지 않는다.\nschema 2는 URDF와 MuJoCo가 공유하는 `meshes` 목록을 사용한다. 도구는 schema 1도\n읽는다. 재생성에 성공하면 이전 manifest에 등록된 메시 중 새 모델에 쓰이지 않고\n해시가 그대로인 파일을 정리한다. 사용자가 수정한 파일은 경고와 함께 보존한다.\n재질의 시각 색상은 밀도나 질량 근거로 사용하지 않는다. 원본 파일에 자산별\n배포 라이선스는 명시되어 있지 않으며 제공 파일의 출처를 manifest에 보존한다.\n\n## 미확정 항목\n\n다음 값은 manifest에서 `null`로 남긴다. 기존 실행 모델의 값을 새 CAD에\n복사하거나 저장된 자세를 관절 영점으로 간주하지 않는다.\n\n| 미확정 항목 | 필요한 근거 | 반영할 위치 |\n|---|---|---|\n| 관절축과 영점 | 회전축, 링크 간 기준 변환, 영점 정의와 좌우 대응 | 새 관절 URDF, MJCF, FK 검사 |\n| 관절 제한과 encoder 매핑 | 실물 motor ID, 회전 부호, 영점과 안전 범위 | 관절 보정, 하드웨어와 MoveIt 설정 |\n| PincOpen 구동 관계 | 구동축, 링크 길이와 구속, servo 각도별 개구 폭 | 집게 운동학과 폭→명령 변환 |\n| TCP와 접촉 판정 | 손끝 기준점과 접근축, 닫힘 위치, 빈 집게·물체 접촉 시험 | TCP, 중심 보정, 접촉 판정 설정 |\n| 질량과 관성 | 재질 밀도, 실측 질량, 전자부품과 배터리 배치 | URDF/MJCF inertial, 동역학 |\n| 센서 측정 좌표 | 렌즈 광학축, LiDAR 스캔 기준, IMU 축과 실물 외부 보정 | 센서 TF와 새로운 보정 프로파일 |\n| 움직임 충돌 모델 | 관절 확정 후 볼록 분해, 링크별 경계와 자기충돌 검사 | 충돌 메시, 구 모델, SRDF와 캐시 |\n| 홈·복귀 경로 | 새 기구에서의 자세와 경로 검증 | 홈, 경유점, 수거와 복귀 설정 |\n\n기존 `jetson_20261009` 보정은 기존 조립체의 기록이다. `freecad_final` 선택 시\n해당 프로파일을 지정하면 launch가 오류를 내며, 보정이 적용된 것처럼 표시하지\n않는다. 광학 프레임, TCP와 질량의 임시 기본값도 생성하지 않는다.\n\n## 다음 구현의 완료 조건\n\n관절·집게 구동 관계를 확보한 뒤 움직이는 링크로 분리하고 독립 FK와\nURDF/MJCF를 비교한다. 이어 새 충돌 모델에서 팔 도달성, 외장과 집게 간섭,\n홈·복귀 경로를 검사한다. 센서 보정과 접촉 판정은 실물 조건에서 별도로\n확인한다. 이 조건이 충족되기 전까지 새 정적 형상과 기존 실행 모델의 검증을\n같은 결과로 보고하지 않는다.\n"},"ros2_ws/src/cleany_description/docs/freecad-tip-mounts.md":{"title":"FreeCAD 팁 체결과 회전 간섭","body":"# FreeCAD 팁 체결과 회전 간섭\n\n양손의 네 팁에서 공통 체결축과 맞물리는 강체 형상을 확인했다. 현재 CAD 조립\n상태는 이 축을 중심으로 자유회전하는 힌지로 표현하지 않는다. 팁 조립체를\n손끝 운반 링크의 고정 자식 링크로 분리했다. 실제 나사 체결력이나 연성 재료의\n변형까지 확정한 것은 아니다.\n\n## 원본에서 확인한 것\n\n| 항목 | CAD 근거 |\n|---|---|\n| 공통 체결축 | `Distal_Rod`, `Distal_Shell`, `Removable_Tip`의 원통 구멍 축 일치 |\n| 운반 링크 구멍 | 지름 2.05 mm |\n| 팁과 쉘의 구멍 | 지름 3.10 mm |\n| 쉘의 추가 자리 | 같은 축에 지름 5.50 mm 원통 자리, 위아래 배치 |\n| 원래 자세 | 비교한 부품 사이 체적 중첩 없음 |\n| 쉘과 운반 링크 | 최소 거리 약 0.20217 mm |\n| 팁 전체의 공통축 회전 | ±0.1°, ±1°의 모든 검사에서 팁 내부 형상과 운반 링크의 체적 간섭 발생 |\n\n공통 구멍 축만으로는 고정인지 회전인지 구분하지 않는다. 위 검사는 원본 BREP\n강체를 공통축 주위로 회전한 뒤 `Distal_Rod`와 `Removable_Tip`의 교차 체적을\n계산한다. 기존 위치에는 중첩이 없지만 양방향 회전에는 간섭이 생기는 맞물림이\n있다. 따라서 원래 조립 자세를 유지하는 명목 고정 결합으로 사용한다.\n검사 각도는 판단용 입력이며 회전 한계나 허용 유격의 측정값이 아니다.\n\n쉘만 따로 돌리는 경우에는 작은 한쪽 회전에서 간섭이 없기도 하다. 이는 쉘의\n여유 공간이며, 팁 전체가 자유롭게 회전한다는 근거로 사용하지 않는다. 쉘의\n실제 흔들림은 나사 체결과 재질 조건을 확인해야 한다.\n\n숫자는 원본 형상의 치수다. 지름만으로 나사 규격, 나사산, 탭 가공 여부나\n필요한 체결 토크를 추정하지 않는다. 해당 나사 부품과 조립 조건은 파일에 없다.\n\n## 모델 반영\n\n`cad_{right|left}_gripper_tip_{L|R}` 네 링크를 추가하고, 각 링크를 기존\n`cad_*_gripper_distal_*`의 고정 자식으로 연결했다. 쉘, 탈착 팁, 패드는 해당 팁\n링크를 따른다. 관절축이나 회전 명령을 새로 추가하지 않았으며, 기존 34개 회전\n좌표와 18개 독립 입력은 그대로다. URDF는 총 39개 링크, 34개 변화량 관절과\n4개 고정 관절을 가진다. MuJoCo에서도 팁을 해당 운반 링크 아래에 고정해\n별도 mocap 구동을 만들지 않는다.\n\n원본 면 번호, 공통축, 부품별 구멍 지름, 회전 전 최소 거리와 교차 체적,\n양방향 회전 검사는 [`freecad_kinematics.json`](../config/geometry/freecad_kinematics.json)의\n`gripper_linkages[].tip_mounts`에 기록한다. 고정 연결은 `fixed_attachments`에서\n찾을 수 있다. [`freecad_tip_mounts.json`](../config/geometry/freecad_tip_mounts.json)은\n검사 각도와 수치 판정 조건을 관리한다.\n\n## 팁에서 실물 또는 제작 사양 확인이 필요한 것\n\n| 남은 항목 | 필요한 확인 |\n|---|---|\n| 나사와 조립 | 실제 규격, 길이, 나사산 또는 인서트, 위아래 조립 방식 |\n| 체결 유지 | 조임 상태, 풀림 방지와 하중을 받을 때 이탈 여부 |\n| 패드 고정 | 재질, 접착·끼움·일체 성형 여부와 실제 마찰 |\n| 탄성과 유격 | 팁·쉘·패드의 변형, 마모와 체결 후 미세 흔들림 |\n| 파지 성능 | 물체 접촉 후 변형, 유지력과 미끄러짐 |\n\n위 항목은 null로 남긴다. CAD의 강체 간섭 검사는 재료가 휘거나 눌리는 실제\n거동, 다른 축의 탄성 변형, 체결력이나 물체를 유지하는 힘을 검증하지 않는다.\n이 모델을 근거로 새로운 수동 회전 관절이나 탄성 상수를 임의로 넣지 않는다.\n"},"ros2_ws/src/cleany_description/docs/legacy-model-runtime.md":{"title":"cleany_description","body":"# cleany_description\n\n이 문서는 `model_profile:=jetson_20261009`의 기존 관절·제어 모델 계약이다. 별도로 선택하는 FreeCAD 정적 형상과 미확정 값은 [FreeCAD 모델](freecad-model.md)을\n따른다.\n\n## URDF migration\n\n`feat/migrate-cleany-description`의 형상 xacro와 참조 CAD frame 메시를 가져왔다.\n`physical_properties.xacro`는 본체·팔·바퀴의 상세 visual/collision을 제공한다.\n현재 브랜치의 두 control xacro는 카메라 스케줄링, hardware plugin 및 초기\n관절값 설정 호환성을 위해 유지한다. 대응 MJCF도 같은 브랜치에서 가져왔으며,\n스터디카페 접촉 pair 호환성을 위해 양팔 jaw collision geom 이름을 유지한다.\n정합성 검사는 새 CAD 모델의 팔·TCP·그리퍼·헤드 카메라 좌표를 기준으로 한다.\n모델 정합성 통과가 물체 파지나 전체 수거 성공을 보장하지는 않는다.\n\n양팔 하단 `Base.stl`의 장착 위치는 원형 마운트\n`cad_frame/035armbase_step__êäèë4.stl`의 체결 구멍 4개에 맞춘다.\n기존 배치 대비 `base_link` 기준 이동량은 왼쪽\n`(-0.099657, +11.114727, 0)` mm, 오른쪽\n`(+0.099838, -11.114072, 0)` mm다. 팔 하단과 모터의 visual/collision,\n어깨 관절 원점, MJCF의 전체 팔 body에 같은 이동량을 적용하고,\nURDF에 합쳐진 고정 팔 하단의 질량 중심과 관성도 다시 계산했다.\n수정 후 어깨 원점은 왼쪽 `(0.116200343, 0.196231727, 0.447797)` m,\n오른쪽 `(0.116200838, -0.196177072, 0.447797)` m다.\n이 수치는 기존 CAD 메시의 XY 체결 정렬값이며 실물 보정값이 아니다.\n높이와 회전은 기존 값을 유지한다.\n`test_arm_base_fasteners_align_with_cad_mounts`는 메시 좌표계에서 측정한\n구멍 축을 각 배치로 변환해 XY 오차가 0.01 mm 이내인지 검사한다.\nURDF/MJCF의 같은 오배치가 단순 모델 일치 검사를 통과하는 문제를 방지한다.\n\n`base_link`의 고정 조립체 관성은 MJCF에 기록된 `chassis`, `Base`, `Base_2`의\n질량·질량 중심·`fullinertia`를 같은 좌표계로 옮겨 평행축 정리로 합성한다.\n관성 정합성 검사는 이 원본 텐서를 기준으로 절대 오차 `1e-9`를 유지하며,\nMuJoCo 버전별 주관성축 분해의 수치 차이가 합성 기준에 섞이는 것을 방지한다.\n\n`include_head_camera:=false`로 카메라 관절을 제외해도 고정 기둥\n`top_base_link`/`top_base_joint`는 유지한다. MoveIt의 팔 전용 모델에서 기둥이\n누락되어 복귀 중 팔이 실제 기둥에 부딪히던 문제를 방지한다.\n움직이는 pan/tilt 헤드 전체의 충돌 반영은 해당 관절 feedback 연결이 별도 필요하다.\nMJCF의 거친 head mount box가 pan joint를 사이에 둔 tilt housing과 겹쳐\n카메라를 밀어내므로 `top_base_link`–`head_tilt_link` 한 쌍만 내부 조립체\n접촉에서 제외한다. 헤드와 외부 환경의 충돌은 유지하며 head pose 유지 시험으로\n검증한다. 이는 CAD 충돌 근사의 예외이지 실물 간섭이 없다는 보증은 아니다.\n기본 description의 바퀴 관절은 continuous이며 고정 미리보기에서는\n`include_wheel_joints:=false`로 확장할 수 있다.\n\ncontrol xacro의 `scheduled_cameras`(기본 false)는 observer hardware에 카메라별\n촬영 스케줄러 사용 여부를 전달한다. `efficient_viewer`(기본 false)는 같은 worker에서\nGUI도 그릴지 지정한다. launch가 이 GUI를 선택하면 vendor `headless=true`를 함께\n전달한다. `efficient_viewer`는 hardware parser에 맞춰 소문자 true/false로 출력한다.\n로봇 mesh/카메라 장착 형상은 변경하지 않는다.\n\nSorting의 analytical wrist-roll 후보 보정은 `wrist_roll_joint`의 local -Y\n축과 `grasp_tcp_joint`의 `(0, -0.100, 0)` offset이 공선이라는 현재 모델\n계약을 사용한다. `test_grasp_roll_alignment_matches_collinear_robot_geometry`\n검사가 양쪽 URDF에서 이 전제를 확인한다. 축/도구 보정을 바꿀 때는 이\n보정 알고리즘도 함께 검토해야 하며, 현재 TCP는 실측 하드웨어 보정값이 아니다.\n\nControl xacro의 `mujoco_hardware_plugin` 기본값은 기존\n`mujoco_ros2_control/MujocoSystemInterface`다. 분리 수거 backend는 이를\n`cleany_mujoco_observer/ObservedMujocoSystem`으로 지정해 잠금된 평가 snapshot을\n추가한다. 관절/command interface, controller 및 physics 설정은 바뀌지 않는다.\n\nAuthoritative robot description assets shared by MuJoCo, TF, and MoveIt.\n\n## Files\n\n- `urdf/cleany_geometry.xacro`: backend-neutral canonical physical model\n- `urdf/cleany.urdf.xacro`: plugin-free dual-arm URDF used by\n  `robot_state_publisher` and MoveIt\n- `urdf/cleany_control.urdf.xacro`: control-backend extension entrypoint; it\n  adds the MuJoCo `ros2_control` hardware interface for the ten arm joints and\n  read-only state interfaces for both grippers\n- `urdf/cleany_mujoco_ros2_control.xacro`: reusable MuJoCo hardware macro\n- `urdf/head_camera.xacro`: physical head mount and optional measured RGB optical transform\n- `mjcf/cleany.xml`: MuJoCo robot model included by simulator scenes\n- `meshes/`: visual and collision CAD assets referenced by both descriptions\n- `test/test_model_parity.py`: canonical joint, motor geometry, and randomized\n  FK parity checks\n\nBoth URDF entrypoints include the five separate motor CAD meshes on each arm\nas visuals and URDF collision shapes, at their MJCF body-local placements. Upper-arm\nand lower-arm motors have respective offsets `(0, 0.05, 0)` and `(0, 0, 0.05)` m;\nthe other three have zero offsets. The RGB-D self-filter uses collision shapes,\nso omitting these parts can leave the robot's own surfaces in the environment\nOctoMap. The fixed-jaw motor remains visual-only in MJCF and has a matching URDF\ncollision mesh. The v8 wrist mounts use six visuals and fifteen collision\nprimitives per wrist in both backends, replacing the old camera-case meshes.\nTheir rigid geometry is attached to the gripper independently of optical TFs.\nThe simulated wrist cameras and optical sites/bodies use the v8 geometry\nregistration's lens centre and CV axes. The camera renderer reverses optical\nY/Z to use its -Z viewing convention. Sorting's nominal wrist transform config\nmatches this pose; the measured Jetson calibration profile remains independent.\nRegression checks compare the original URDF collision model with MJCF, including\nposes, dimensions and colors. The planning model separately preserves visuals,\ninertia and joints; both original and optimized motor collision placements are\nchecked against MJCF. Motor translation comparisons allow `2e-6` m for CAD rounding.\nExisting CAD files are reused without regenerating assets or changing joint\nkinematics. This coverage does not by itself prove collision-free execution.\n\n## Model contract\n\nThe MJCF moving-jaw body frames use the migrated URDF joint RPY `(pi, 0, 3.33)`\nas quaternions. The visual/collision origins retain the CAD's approximately\n21.59-degree compensation, and inertial properties use the same link frame.\nChanging only the body rotation without this mesh compensation would alter\nthe contact geometry. Tests check both visual and collision mesh poses.\nRandomized FK parity checks include both moving jaws over\narm and gripper configurations in both URDF entrypoints, in addition to the\nfixed jaws and TCPs. The `1e-5` tolerance accommodates rounded MJCF CAD angles;\nthis is simulation-model parity, not a measured hardware calibration.\n\nRun `make test` from the repository root to build the workspace and check\nthe model parity suite, including randomized arm/TCP,\nmoving-jaw and head-camera FK. The simulation tests also compare the configured\nwrist optical transforms against the MJCF camera sites. URDF entrypoint geometry\nis compared with `include_wheel_joints:=false` on both sides: the default mobile\ndescription has continuous wheels, while the stationary arm-control and MoveIt\nsorting descriptions use fixed wheels because their controllers do not publish\nwheel states. These tests do not validate real-hardware calibration, Jetson\nperformance, navigation, or successful object retention.\n\n- REP-103: `base_link` +X forward, +Y left, +Z up; wheel axes +Y.\n  Optical frames use +X right, +Y down, +Z forward.\n- Wheelbase **0.35 m**, track **0.6038 m**, wheel radius **0.0635 m**.\n  URDF wheels are rigid 500 g assemblies; 48 passive roller joints are MJCF-only.\n- `${side}_grasp_tcp` is fixed at `(0, -0.100, 0)` m in\n  `${side}_gripper_frame`; the original hinged gripper is retained.\n- Head RGB-D transforms are nominal by default. The explicit `jetson_20261009`\n  calibration profile applies provisional measured RGB and wrist optical transforms.\n  Depth remains nominal; simulation ground-truth wrist edges remain separate.\n  See [model contract](model.md) and [calibration guide](../../../../docs/implementation/calibration.md).\n- The control entrypoint commands ten arm joints and reads both grippers.\n  Gripper commands are opt-in via `enable_gripper_command:=true`.\n  Base, head, and rollers are outside this control contract.\n- Arm-only MoveIt uses `include_head_camera:=false include_wheel_joints:=false`.\n  These default to `true` in the full description; disabling wheel joints\n  retains their geometry as fixed links.\n- Fourteen legacy servo position actuators and four PG42 voltage actuators\n  remain active. New servo DC-motor defaults are commented out pending the\n  separate MuJoCo/ros2_control upgrade. The 3.4 backend removes only wheel\n  actuators from its temporary scene; see [simulation setup](../../cleany_mujoco_sim/docs/scenes.md).\n\nMass properties are estimates: total **15.933871 kg**,\nincluding a provisional **5.20 kg, 195×165×175 mm battery**, **0.8 kg per PG42\nmotor**, and estimated PLA parts.\n\n## Use\n\nAfter building and sourcing `ros2_ws`, publish the full description:\n\n```bash\nros2 launch cleany_description description.launch.py model_variant:=legacy_runtime model_profile:=jetson_20261009 use_sim_time:=true\n```\n\nExpand the control description from this package directory:\n\n```bash\nxacro urdf/cleany_control.urdf.xacro \\\n  mujoco_model:=/absolute/path/to/control_scene.xml headless:=true\n```\n\nThe control entrypoint exposes position commands plus position and velocity\nstate for the five joints of each arm. Both gripper joints expose position and\nvelocity state so MoveIt receives a complete dual-arm model state. Gripper\ncommands are disabled by default and enabled with `enable_gripper_command:=true`\nfor sorting. The base, head, and passive roller joints remain outside this\ncontrol contract.\n\n## Integration regression scope\n\nModel-parity checks compare geometry and FK; they do not validate every existing\nmotion fixture after a CAD migration. Run `make test` with a working X display\nfor controller, planning and hand-eye regressions as well.\n\nRun geometry, color, mass, joint-contract, and randomized FK checks from `ros2_ws`:\n\n```bash\npython3 -m pytest src/cleany_description/test/test_model_parity.py\n```\n\n## Gazebo navigation adapter\n\n`cleany_gazebo_sim` consumes this CAD description through Xacro / sdformat conversion.\nIts navigation profile freezes the arms and head at configured park angles, retains\nfour driven wheel joints, and attaches Gazebo sensors and mecanum contact approximations.\nIt does not modify this package's movable joint contract. See that package's README\nfor the CAD launcher, wheel odometry geometry, and simulation limitations.\n\n## 선택적 충돌 메시 평면화\n\n`optimized_arm_collision_meshes`는 기존 이름을 유지하며 팔, 모터, 머리와 마스트의\n경량 충돌 메시를 선택한다. 기본값은 `true`이고 `head_collision_meshes`도\n`true`다. 공통 URDF 기본값이므로 Gazebo CAD 변환에도 최적화 충돌 형상이\n전달된다. MuJoCo의 물리 접촉 계산은 `mjcf/cleany.xml`의 기존 형상을 유지한다.\n시뮬레이션에서도 MoveIt 경로 계획에는 공통 URDF의 최적화 충돌 형상을 사용한다.\n원본 URDF와 MJCF의 충돌 형상 대조 검사는 `optimized_arm_collision_meshes:=false`와\n`head_collision_meshes:=false`를 모두 명시한다. 기본 계획 모델은 원본 모델과\n시각 형상, 관성, 관절이 같은지 별도로 검사한다.\n시각 모델, 관성, 관절과 원본 CAD 파일은 바뀌지 않는다.\n\n| 대상 | `true`일 때의 형상 |\n|---|---|\n| 양팔의 상완, 하완, 연결부와 모터 11종 | `meshes/collision/`의 평면 메시, 좌우 합계 22개 인스턴스 |\n| 머리와 마스트 CAD 6종 | `head_collision_meshes=true`이고 해당 링크가 포함될 때 경량 메시 적용 |\n| 집게의 기존 볼록 메시 5종 | 이미 12–24개 삼각형으로 구성되어 원본 유지 |\n| box, cylinder, sphere primitive | 기존 해석적 형상 유지 |\n\n외접 메시의 각 조각은 담당하는 원본 표면 조각을 포함한다. 하완 포크, 어깨와 손목 연결부,\n하완 모터, 마스트와 머리 브래킷은 먼저 평면으로 나누고 떨어진 표면 조각을\n분리한다. 이후 각 조각을 지지 평면으로 감싸 불필요한 둥근 모서리와 작은\n구멍을 단순화한다.\n분할 축과 위치는 `configs/robot/arm_collision_meshes.json`의\n`partition_components`에서 원본 메시 좌표계의 미터 단위로 지정한다.\n밀리미터 CAD의 단위 변환은 `mesh_scales`가 관리한다.\n\n`enclosure_variants`는 각 조각의 축 선택과 불필요한 지지 평면 제거 방식을\n기록한다. STL의 float32 좌표로 반올림한 뒤 볼록 면을 다시 구성하고 원본\n포함 및 팽창 상한을 검사한다. 최종 STL의 각 면도 같은 볼록 경계를 이루는지\n검사해, 정점의 볼록 외피만 맞고 실제 삼각형은 안으로 접히는 경우를 막는다.\n\n팽창 상한 1mm는 **분할 조각의 볼록 외피**를 기준으로 한다. 오목한 CAD\n표면과의 거리 상한이 아니며, 조각 내부의 작은 빈 공간은 메워질 수 있다.\nMoveIt은 `cleany/SolidFCL`로 닫힌 볼록 조각을 내부가 채워진 형상으로 읽는다.\n삼각형 표면을 가로지르지 않고 조각 안에 완전히 들어간 작은 장애물도 검출한다.\n외접 포함 조건뿐 아니라 실제 서비스의 내부 장애물 검출과 원본 CAD 대조를\n검사한다. Gazebo와 MuJoCo의 물리 엔진에 이 MoveIt 플러그인을 적용하는 것은 아니다.\n\n`make test-description-models`는 원본 모델의 MuJoCo 동등성, 기본 계획 모델의\n공통 정보 보존과 최적화 자산을 검사한다. `test_collision_meshes.py`는 모든 출력 메시의 실제 STL 좌표에서 포함과 팽창\n상한, 폐곡면, 분할된 포크의 틈, 단위와 Xacro 적용 범위를 검사한다.\n재생성은 `python3 tools/optimize_arm_collision_meshes.py --write`를 명시적으로\n실행하며, `--write`가 없으면 생성 결과와 저장된 자산의 일치를 확인한다.\n"},"ros2_ws/src/cleany_description/docs/model-runtime.md":{"title":"CAD 런타임 모델","body":"# CAD 런타임 모델\n\n현재 기본 모델과 표시 계약은 [공통 CAD 런타임](runtime-model.md)을 따른다.\nCLI, MoveIt, GPU IK와 RViz는 같은 보정된 CAD를 사용한다.\n`cleany.urdf.xacro`와 기존 MJCF는 시뮬레이션 및 회귀 검사에 사용한다.\n원본 CAD, 보정 입력과 과거 검증 기록은 재현 근거로 보존한다.\n\n그리퍼의 실제 0~160도 범위와 CAD 끝점 대응은\n[CAD 파지 모델](../../cleany_moveit_collision/docs/calibrated-cad.md)에 정의한다.\n\n## 보존된 시뮬레이션 모델\n\n`legacy_runtime`은 `model_profile:=jetson_20261009`의 xacro를 실행한다.\n기존 장착의 관절, 관성, 센서와 회귀 검사 기준은 [이전 모델 reference](legacy-model-runtime.md)를 따른다.\n\n```bash\nros2 launch cleany_description description.launch.py \\\n  model_variant:=legacy_runtime model_profile:=jetson_20261009\n```\n\n| 진입점 | 역할 |\n|---|---|\n| `urdf/cleany.urdf` | 실물 CAD 파지, MoveIt와 RViz의 공통 보정 모델 |\n| `urdf/cleany.urdf.xacro` | 기존 시뮬레이션의 head, wheel과 arm 모델 |\n| `urdf/cleany_control.urdf.xacro` | 기존 시뮬레이션 팔 제어 모델 |\n| `mjcf/cleany.xml` | 기존 MuJoCo scene 원본 |\n| MoveIt `move_group.launch.py` | 기존 시뮬레이션 모델과 `joint_limits.yaml` 사용 |\n\n`include_head_camera:=false`여도 고정 마스트는 남는다. `include_wheel_joints:=false`는\n바퀴 형상과 고정 연결을 유지한다. 기존 장착의 보정은 `calibration_profile:=jetson_20261009`로\n선택하며 실물 공통 CAD의 보정과 혼합하지 않는다.\n\n실물 CAD의 원본, collision 자산과 갱신 절차는 [공통 CAD 런타임](runtime-model.md)을 따른다.\n모델 회귀 검사는 `make test-description-models`로 실행한다.\n"},"ros2_ws/src/cleany_description/docs/model.md":{"title":"Robot model 계약","body":"# Robot model 계약\n\nCAD 파지와 미리보기는 `urdf/cleany.urdf`를 공유한다. 기존 14개 모터 좌표를 보정된 CAD\n형상에 연결하며 CLI, MoveIt, cuRobo와 RViz가 같은 산출물을 읽는다.\n기본 launch, 표시 상태와 갱신 절차는 [공통 CAD 런타임](runtime-model.md)을 따른다.\n\n| 항목 | 계약 |\n|---|---|\n| 로봇 좌표 | `base_link`의 +X 전방, +Y 좌측, +Z 상방 |\n| 광학 좌표 | +X 우측, +Y 하방, +Z 전방 |\n| 모터 좌표 | 기존 양팔과 헤드의 14개 관절 이름, rad 단위와 보정 범위를 유지 |\n| 집게 연동 | 16개 종속 관절을 기존 핀 연결 해석기로 계산하며 별도 모터로 제어하지 않음 |\n| 집게 끝점 | 실제 최대 열림 0도와 닫힘 160도를 CAD의 양 끝 자세에 대응 |\n| TCP | 현재 실물 프로파일의 손목 기준 119.775 mm 위치와 대칭 그리퍼 방향 |\n| 충돌 | CAD 자기 충돌과 외부 장애물 검사를 유지하며 단계별 정책은 수거 프로파일에서 결정 |\n| GPU | cuRobo IK와 native MoveIt 충돌 검사를 결합하며 CPU IK fallback을 기본으로 사용하지 않음 |\n\nCAD 끝점 보간은 실측된 중간 개구 폭 곡선이 아니다. 원본 형상, 카메라 보정과\n구동 좌표의 연결 및 검증 범위는 [CAD 파지 계약](../../cleany_moveit_collision/docs/calibrated-cad.md)을 따른다.\n이 모델의 계산 일치도는 실물 TCP 정확도나 동역학 검증을 뜻하지 않는다.\n\n`cleany.urdf.xacro`, control xacro와 `mjcf/cleany.xml`은 기존 시뮬레이션에서도 사용한다. 원본 CAD 입력과 과거 측정 기록은 재현 근거로 보존한다.\n\n## 보존된 시뮬레이션 모델\n\n기존 시뮬레이션은 `model_profile:=jetson_20261009`를 사용한다. Gazebo의 `cad_frame`은\n이 xacro를 SDF로 변환하고, MuJoCo는 `mjcf/cleany.xml`을 읽는다. 실물 런타임의\n보정된 CAD와 구분하며, 관절과 센서 좌표는 [이전 모델 reference](legacy-model-runtime.md)를 따른다.\n\n실물 충돌 자산은 `meshes/cad_runtime_collision/`에서 관리한다.\n시뮬레이션 모델 선택은 이 자산과 실물 `urdf/cleany.urdf`를 변경하지 않는다.\n"},"ros2_ws/src/cleany_description/docs/runtime-model.md":{"title":"공통 CAD 런타임","body":"# 공통 CAD 런타임\n\n설치된 `urdf/cleany.urdf`는 `tools/robot-model`, CAD 파지 프로파일의\nMoveIt과 cuRobo, RViz가 공유하는 보정된 모델이다. `configs/robot/cad_grasp.json`으로 생성하며\n기존 14개 모터 좌표와 최대 열림 0도에서 닫힘 160도 범위를 유지한다.\n생성 파일의 해시는 `config/geometry/runtime_model.json`에 기록한다.\n\n보정 입력 변경 뒤에는 Jetson에서 다음 순서로 공통 산출물을 갱신한다.\n첫 명령은 모델 파일만 생성하며 모터를 조회하거나 움직이지 않는다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource install/setup.bash\npython3 tools/validation/materialize_runtime_cad.py --repository \"$PWD\" --output /tmp/cleany-cad-materialized\nmake build COLCON_BUILD_ARGS='--packages-select cleany_description cleany_robot_interface cleany_moveit_config cleany_skill_executor --executor sequential'\n./tools/robot-model check\n```\n\n`runtime_model_state`는 시리얼 장치와 제어기를 사용하지 않는다. 기본 입력은\n전역 `/joint_states`의 모터 피드백이다. 출력은 실행 namespace 아래의\n`joint_states`이며, 14개 모터와 계산된 16개 종속 관절을 포함한다.\n원본 피드백과 출력이 같은 토픽이 되지 않도록 preview namespace를 지정한다.\n\n| 상태 토픽 `status`의 `source` | 표시 자세 |\n|---|---|\n| `nominal_preview` | 아직 피드백이 없으며 모터 제한 안의 명목 자세를 표시한다. |\n| `measured_feedback` | 14개 모터값이 모두 들어온 최근 피드백을 표시한다. |\n| `stale_feedback` | 1초 넘게 새 피드백이 없으며 마지막 자세를 유지한다. |\n\nRViz는 기본 `/runtime_model/robot_description`, namespace 안의 TF를 읽는다.\n화면의 로봇이 움직여도 이 노드가 모터 명령을 생성하지 않는다.\n`arm_preview.launch.py`도 같은 모델을 사용하며 직접 모터 버스를 열지 않는다.\n\n`cleany.urdf.xacro`와 MJCF 모델은 기존 시뮬레이션 및 회귀 검사에서 사용한다.\n실물 CAD 파지 프로파일은 장치별 보정 파일과 함께 명시적으로 선택한다.\n그리퍼 끝점 대응과 충돌 판정은\n[보정된 CAD 파지 모델](../../cleany_moveit_collision/docs/calibrated-cad.md)을 따른다.\n"},"ros2_ws/src/cleany_dev_monitor/README.md":{"title":"cleany_dev_monitor","body":"# cleany_dev_monitor\n\nROS 그래프, 카메라, 조작 단계와 호스트 리소스를 웹으로 관측한다.\n기본값은 관측 전용이며, 명시적으로 켜는 운영 제어는 인증 후 기존 실물 실행기에\n작업을 요청한다. 녹화와 재생 데이터는 독립 `cleany_logger`가 관리한다.\n\n- [빌드 환경](../../../docs/implementation/development-setup.md#monitor-웹)\n- [실행과 운영 제어](../../../docs/RUNNING.md#개발-monitor)\n- [검증 절차](../../../docs/TESTING.md#운영-ui와-승인-흐름-검증)\n- [ROS, HTTP와 승인 계약](docs/interfaces.md)\n- [관측 데이터 계약](docs/data.md)\n\n`tools/dev-monitor`의 Jetson 프로필은 `0.0.0.0:8768`에서 제공한다.\n관측 화면은 인증 없이 열리며 실물 제어에는 조작키가 필요하다.\n`http://\u003cJetson 주소>:8768/#manipulation`에서 실행 요청, 작업 제안과 실행 기록을 확인한다.\nHTTP 개발 화면은 로컬 네트워크, Tailscale 또는 SSH 터널에서 사용한다.\n\n제안은 관측 이미지와 대상을 검토한 뒤 한 번 승인한다. 정지 물체를 가정한 시험에서는 원본 관측의 물체 번호와 추적 ID를 확인한다. 그 밖의 설정은 승인 시 새 영상에서 같은 대상을 확인한다. 실행이 끝나도 다음 작업은 다시\n승인을 기다린다. `물체 1개 실행`은 기존 CLI의 자동 선택 후 즉시 실행 경로다.\n소프트웨어 중단 접수와 명령 프로세스 종료는 실제 정지나 수거 성공을 의미하지 않는다.\n실측 `CONFIRMED`와 시험 모드의 `ASSUMED` 결과는 구별해서 표시한다.\n\n`물체 1개 실행`의 일반 물체 자동 선택과 공통 TCP·최대 개방·GPU 설정은 [공통 파지 설정](../cleany_skill_executor/docs/shared-grasp-policy.md)을 따른다.\n"},"ros2_ws/src/cleany_dev_monitor/docs/data.md":{"title":"Monitor 관측 데이터 계약","body":"# Monitor 관측 데이터 계약\n\nMonitor는 ROS 상태를 웹에 표시하고 독립 logger의 기록을 조회합니다. 관측 전용이며 Runtime의 안전과 완료 판정을 대체하지 않습니다.\n\n```mermaid\nflowchart LR\n    ROS[ROS 입력] --> Logger[독립 logger_node]\n    ROS --> Live[Monitor 실시간 수집]\n    Logger --> Archive[(rosbag2 원본 / SQLite 가공 자료)]\n    Archive --> Reader[읽기 전용 ArchiveReader]\n    Reader --> HTTP[Monitor HTTP / WebSocket]\n    Live --> HTTP\n    HTTP --> UI[브라우저]\n    HTTP -->|ROS 녹화 제어 서비스| Logger\n    Logger -->|상태 토픽| HTTP\n```\n\n## 수집과 한도\n\nMetadata는 전체 discovery를 수행하되 메시지는 기본, action, 사용자 선택 토픽만 구독합니다. 마지막 선택자가 해제하면 해당 구독을 정리합니다. 수신 주기는 발행 주기를 보장하지 않습니다.\n\n| 항목 | 한도 |\n|---|---|\n| ROS discovery / UI 갱신 | 1 Hz / 최대 10 Hz |\n| Action / 선택 토픽 / 브라우저 | 32 / 16 / 8 |\n| 미리보기 전체 / 배열 / 깊이 / 문자열 | 2048 / 256 / 10 / 4096자 |\n| 지도 기본 / 설정 상한 | 524288 / 1048576셀 |\n| 경로 / 이벤트 ring / 브라우저 로그 | 4096점 / 2048건 / 500건 |\n| 느린 브라우저 전송 timeout | 2초 |\n\nQoS는 publisher endpoint 기준으로 선택하며, 혼합 publisher는 호환 가능한 약한 설정을 사용합니다. Type import, QoS 오류, publisher 없음, 수신 없음, stale을 구분합니다.\n\n## 공간 데이터와 재접속\n\n2D 레이어는 메시지 시각의 TF로 map_frame에 변환하고 회전 origin을 반영합니다. Robot pose는 최신 TF를 사용하며 ±2초 밖 stamp는 stale로 처리합니다. 정적 지도와 마지막 경로는 유지합니다.\n\nTelemetry는 종류/토픽별 최신값으로 합칩니다. Runtime/Monitor boot ID는 별개이며 재접속 시 초기 snapshot을 제공합니다.\n\n| 조건 | 표시 / 처리 |\n|---|---|\n| 미구독 토픽 | unmeasured |\n| 미리보기 한도 초과 | truncated; 전체 cloud/rosbag 대체 아님 |\n| 지도 / 경로 한도 초과 | 지도는 사유와 함께 거절 / 경로는 잘림 표시 |\n| Layer TF 없음 | 해당 레이어 숨김 |\n| 이벤트 ring에서 밀려남 | Gap 표시 |\n| 단절, 재시작, sequence gap | 명시적으로 표시; IDLE/성공/안전으로 추정 금지 |\n\n## 기록과 시간\n\nLogger가 ROS 수집, 가공, 정책, 설정 파일, 세션과 단일 writer를 소유합니다.\nMonitor는 ROS 상태와 카메라의 실시간 표시, HTTP와 녹화 제어 client를 소유합니다.\n카메라 구독, 변환과 최신 프레임 캐시는 독립 telemetry camera_preview가 소유합니다.\nMonitor는\n`ArchiveReader`로 공유 디렉터리의 과거 자료만 읽습니다. 생성자는 저장 경로나 파일을\n만들지 않습니다. Monitor 종료는 logger에 정지 요청을 보내지 않습니다. 두 프로세스의\n메모리 Hub와 구독 수명은 독립적이며 `MissionJournal`은 Mission Runtime에 남습니다.\n\nLogger 상태가 기본 3초 동안 갱신되지 않으면 `UNAVAILABLE`로 표시합니다. 제어 서비스\n불가와 응답 timeout은 HTTP 503, 상태나 revision 충돌은 409입니다. 실패 시 로컬 writer를\n만들거나 정지 완료로 추정하지 않습니다. 과거 기록은 logger가 없어도 조회할 수 있습니다.\n\n저장 형식, 시간 단위, 큐와 종료 계약은 [Logger 데이터 계약](../../cleany_logger/docs/data.md)을\n따릅니다. 기존 `state_directory`와 schema 1/2/3/4 읽기를 유지하며 HTTP 경로도 같습니다.\n\n| HTTP 경로 | 의미 |\n|---|---|\n| `/api/recordings/{session}/export` | 가공 데이터 SQLite |\n| `/api/recordings/{session}/bag` | 완료된 원본 bag ZIP; 녹화 중 409, 완료 bag 없음 404 |\n| `/api/recordings/{session}/raw?category=point_cloud&at=\u003cwall-seconds>` | 지정 시각 직전 원본 CDR 1건 |\n| `/api/recordings/{session}/replay?at=\u003cwall-seconds>` | SQLite의 가공 자료로 과거 재생 |\n\n## 기록 설정과 화면\n\n| 설정 | 변경 범위 / 유지 조건 |\n|---|---|\n| 저사양 / 기본 / 정밀 프로필 | 수집 주기만 변경; 항목 선택, 토픽 이름, 녹화 정지 상태 유지 |\n| 센서 원본 5종 | 기본 OFF |\n| 항목별 Hz | 시간 표본화; 점과 픽셀 수는 유지 |\n| 안전 판단 변경 이벤트 | 해당 토픽이 켜져 있으면 Hz와 무관하게 보존 |\n| 녹화 토픽 | Logger의 관측 출처만 변경; 대시보드는 Monitor parameter 사용 |\n| 설정 변경 | 정지 상태에서만 허용 |\n| 녹화 중 시작 요청 | 기존 세션 반환 |\n\n정확한 항목과 주기는 `cleany_logger.recording.SEMANTIC_RATES`와 `cleany_logger.sources`의 출처 정의를 따릅니다.\n\n```mermaid\nflowchart TD\n    Change[Logger 출처 세대 변경] --> Clear[가공 최신 상태 / 주행·조작 이력 초기화]\n    Clear --> Record[새 설정 기록]\n    Session[(SQLite 세션)] --> Span[실제 기록 구간 연결]\n    Span --> Timeline[시간 막대]\n    Timeline --> Play[과거 기록 재생]\n    Pause[일시정지 / 기록 없는 시각] --> Gap[구분해서 표시]\n    Gap --> Timeline\n```\n\n재생에는 라이브 표본을 섞지 않습니다.\n\n| 호스트 리소스 | 출처 / 해석 |\n|---|---|\n| 실시간 / 과거 기록 | Monitor / Logger의 `psutil` 관측; 다른 DDS 호스트 지표를 추정하지 않음 |\n| 수집 | 별도 worker, 기본 1초 주기 |\n| 기본 한도 | CPU / RSS 상위 프로세스 각각 20개, 요약 이력 300개 |\n| 권한 / 장치 오류, 첫 표본 | 미측정 표시 |\n| 프로세스 CPU | 논리 코어 하나가 100% |\n| RSS 합계 | 호스트 전체 메모리 사용량과 다름 |\n\n## Cartographer와 RViz\n\nCartographer 수집과 SQLite 재생은 기존 기록과의 호환을 위해 유지합니다.\n\n| 관측 | 입력 / 한도 |\n|---|---|\n| ROS 토픽 | `/submap_list`, `/trajectory_node_list`, `/constraint_list`, `/scan_matched_points2` |\n| Query | Allowlist된 SubmapQuery만 호출 |\n| 기본 한도 | 서브맵 64개, 텍스처 262144 pixel, 이미지 캐시 16 MiB |\n| 최신성 | Epoch와 버전 구분; 불일치하거나 오래된 텍스처를 새 관측으로 표시하지 않음 |\n\n전용 웹 SLAM renderer는 제거됐습니다. 서브맵, 정합점, LiDAR, 점군과 costmap의 상세 공간 관측은 RViz를 사용합니다. 원본 bag 재생 절차는 [실행 가이드](../../../../docs/implementation/how-to/monitoring.md#개발-monitor)를 따릅니다. Nav2 BT 화면은 수신 XML과 상태를 기록하며 BT 실행이나 주행 명령을 보내지 않습니다.\n\n관련 안내: [실행](../../../../docs/implementation/running.md), [환경](../../../../docs/implementation/development-setup.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n\n## 청소 BT와 조작 관측\n\n실행 → BT는 Mission의 실제 노드와 상태를 보여줍니다. 관측은 Perception port, 다음 행동 제안은 Planner port가 수행하고 Mission은 제안 검증과 실행 허가를 소유합니다. 노드는 이 책임을 호출하는 작업 흐름이며 별도 인식 알고리즘을 뜻하지 않습니다.\n\nExecuteOne을 선택하면 Action 준비, 접근, 집기, 운반, 놓기와 팔 복귀를 펼쳐 볼 수 있습니다. 이 상세는 서버 단계의 관측이며 청소 BT topology나 실행 순서를 변경하지 않습니다. 별도 매니퓰레이션 화면에는 전체 단계, 실행 시간, 취소 상태와 실행 비교가 있습니다.\n\n실행 기록은 현재 mission ID와 정확한 execution ID로 연결합니다. 다음 Goal의 기록이 아직 없으면 이전 물체의 진행률을 대신 표시하지 않습니다. 과거 실행을 선택해도 현재 Runtime의 주행 판단은 별도로 표시합니다. 관측 토픽을 바꾸면 이전 조작 이력과 revision도 초기화합니다.\n\n| 표시 | 의미 |\n|---|---|\n| 청소 BT SUCCESS | 마지막으로 관측한 작업 결과; 현재 Nav2 준비나 주행 가능 여부와 다름 |\n| 주행 확인 불가 | Runtime 상태가 없거나 오래돼 현재 gate를 확인할 수 없음 |\n| 조작 완료 | 서버 최종 record의 결과; Mission의 검증과 정지 확인은 별도 |\n| 진행 상태 미확인 | 수신 정체나 이전 실행을 현재 진행으로 추정하지 않음 |\n\n| 실행 시간 막대 | 판정 / 한도 |\n|---|---|\n| 단계 구간 | `execution_events` revision과 서버 wall 측정 시각로 구성 |\n| 부분 기록 | 중간 구독, 누락, 시각 역행을 구분 |\n| 시각 역행 | 해당 기록의 경과 시간은 표시하지 않음 |\n| Timeout / 취소 | 서버 steady clock 기준 |\n| 기본 보존 | 최근 실행 20개, 실행당 구간 64개 |\n| Topic QoS depth | 100 |\n| 과거 재생 | SQLite 가공 기록도 같은 의미 사용; 로봇 명령을 보내지 않음 |"},"ros2_ws/src/cleany_dev_monitor/docs/interfaces.md":{"title":"cleany_dev_monitor 노드 인터페이스","body":"# cleany_dev_monitor 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## cleany_dev_monitor\n\n실행 파일: `dev_monitor`. 원본: [노드.py](../cleany_dev_monitor/node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `\u003cruntime_namespace>/mission/debug_snapshot` | `cleany_interfaces/msg/RuntimeDebugSnapshot` | 동적 QoS; `runtime_namespace` |\n| 토픽 구독 | `\u003cruntime_namespace>/mission/runtime_events` | `cleany_interfaces/msg/RuntimeEvent` | 동적 QoS; `runtime_namespace`, depth 2048 |\n| 토픽 구독 | `\u003cruntime_namespace>/mission/result` | `cleany_interfaces/msg/MissionResult` | 동적 QoS; `runtime_namespace` |\n| 토픽 구독 | `/rosout` | `rcl_interfaces/msg/Log` | 동적 QoS |\n| 토픽 구독 | `/clock` | `rosgraph_msgs/msg/Clock` | 동적 QoS |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/map` | `nav_msgs/msg/OccupancyGrid` | 동적 QoS; `map_topic` |\n| 토픽 구독 | `/plan` | `nav_msgs/msg/Path` | 동적 QoS; `path_topic` |\n| 토픽 구독 | `/local_costmap/costmap` | `nav_msgs/msg/OccupancyGrid` | 동적 QoS; `local_costmap_topic` |\n| 토픽 구독 | `/global_costmap/costmap` | `nav_msgs/msg/OccupancyGrid` | 동적 QoS; `global_costmap_topic` |\n| 토픽 구독 | `/nav2/cmd_vel` | `geometry_msgs/msg/Twist` | 동적 QoS; `velocity_topics` |\n| 토픽 구독 | `/safety_2d/cmd_vel` | `geometry_msgs/msg/Twist` | 동적 QoS; `velocity_topics` |\n| 토픽 구독 | `/cmd_vel` | `geometry_msgs/msg/Twist` | 동적 QoS; `velocity_topics` |\n| 토픽 구독 | `/wheel/odom` | `nav_msgs/msg/Odometry` | 동적 QoS; `odometry_topic` |\n| 토픽 구독 | `/ground_truth/odom` | `nav_msgs/msg/Odometry` | 동적 QoS; `ground_truth_topic` |\n| 토픽 구독 | `/amcl_pose` | `geometry_msgs/msg/PoseWithCovarianceStamped` | 동적 QoS; `amcl_pose_topic` |\n| 토픽 구독 | `/head_pan/state` | `std_msgs/msg/String` | 동적 QoS; `pan_state_topic` |\n| 토픽 구독 | `/reactive_guard/state` | `std_msgs/msg/String` | 동적 QoS; `reactive_guard_topic` |\n| 토픽 구독 | `/body_guard_3d/state` | `std_msgs/msg/String` | 동적 QoS; `voxel_guard_topic` |\n| 토픽 구독 | `/head_pan/coverage` | `std_msgs/msg/String` | 동적 QoS; `coverage_topic` |\n| 토픽 구독 | `/behavior_tree_log` | `nav2_msgs/msg/BehaviorTreeLog` | 동적 QoS; `nav2_bt_topic` |\n| 토픽 구독 | `/navigation/bt_trace` | `std_msgs/msg/String` | 동적 QoS; `nav2_bt_trace_topic` |\n| 토픽 구독 | `/collision_monitor_state` | `discovery 타입` | 동적 QoS; `collision_state_topic` |\n| 토픽 구독 | `\u003cruntime_namespace>/mock/manipulation/execution_events` | `discovery 타입` | 동적 QoS; `manipulation_events_topic` |\n| 토픽 구독 | `/evaluation` | `discovery 타입` | 선택 시 동적 구독; `controller_evaluation_topic` |\n| 토픽 구독 | `/scan` | `sensor_msgs/msg/LaserScan` | 선택 시 동적 구독; `scan_topic` |\n| 토픽 구독 | `/camera/head/depth/obstacle_points` | `sensor_msgs/msg/PointCloud2` | 선택 시 동적 구독; `depth_points_topic` |\n| 토픽 구독 | `/body_guard_3d/risk_voxels` | `sensor_msgs/msg/PointCloud2` | 선택 시 동적 구독; `risk_points_topic` |\n| 토픽 구독 | `/local_costmap/published_footprint` | `geometry_msgs/msg/PolygonStamped` | 선택 시 동적 구독; `footprint_topic` |\n| 토픽 구독 | `/safety/stop_zone` | `geometry_msgs/msg/PolygonStamped` | 선택 시 동적 구독; `stop_polygon_topic` |\n| 토픽 구독 | `/safety/slow_zone` | `geometry_msgs/msg/PolygonStamped` | 선택 시 동적 구독; `slow_polygon_topic` |\n| 토픽 구독 | `/local_plan` | `nav_msgs/msg/Path` | 선택 시 동적 구독; `local_path_topic` |\n| 토픽 구독 | `/obstacle_memory/grid` | `nav_msgs/msg/OccupancyGrid` | 선택 시 동적 구독; `obstacle_memory_topic` |\n| 토픽 구독 | `/obstacle_memory/lidar` | `nav_msgs/msg/OccupancyGrid` | 선택 시 동적 구독; `lidar_memory_topic` |\n| 토픽 구독 | `/obstacle_memory/depth` | `nav_msgs/msg/OccupancyGrid` | 선택 시 동적 구독; `depth_memory_topic` |\n| 토픽 구독 | `/submap_list` | `cartographer_ros_msgs/msg/SubmapList` | 동적 QoS; `slam_submaps_topic` |\n| 토픽 구독 | `/trajectory_node_list` | `visualization_msgs/msg/MarkerArray` | 동적 QoS; `slam_trajectory_topic` |\n| 토픽 구독 | `/constraint_list` | `visualization_msgs/msg/MarkerArray` | 동적 QoS; `slam_constraints_topic` |\n| 토픽 구독 | `/scan_matched_points2` | `sensor_msgs/msg/PointCloud2` | 동적 QoS; `slam_matched_points_topic` |\n| 서비스 요청 | `/submap_query` | `cartographer_ros_msgs/srv/SubmapQuery` | allowlist된 읽기 전용 요청; `slam_submap_query_service` |\n| 토픽 구독 | `\u003caction>/_action/status` | `action_msgs/msg/GoalStatusArray` | Discovery된 최대 32개 status/feedback 토픽 내에서 선택 |\n| 토픽 구독 | `\u003caction>/_action/feedback` | `\u003caction package>/action/\u003cAction>_FeedbackMessage` | Discovery 타입과 publisher QoS |\n| 토픽 구독 | `\u003c사용자 선택 토픽>` | `discovery 타입` | 설정과 웹 선택에 따라 구독 생성 / 해제 |\n\n관측 노드에는 응용 ROS publisher, service server와 action client/server가 없다. 선택적 운영 제어는 아래 별도 adapter가 담당한다. SubmapQuery client는 서브맵을 읽고, 녹화 제어 client는 독립 logger에 요청한다. Discovery에서 해당 이름과 타입이 확인돼야 실제 구독을 생성한다. 표의 타입은 기본 입력의 기대 타입이며 구독은 discovery 타입을 사용한다. `runtime_namespace`가 비어 있으면 prefix는 없다. TF listener 구독은 별도로 생성된다.\n\n동적 QoS는 모든 publisher와 호환되는 reliability/durability를 선택합니다. Depth는 image 1, runtime_events 2048, manipulation execution events 100, 그 밖의 토픽 5입니다. 구독의 존재와 발행 주기는 보장하지 않습니다.\n\nHTTP/WebSocket은 `host=127.0.0.1`, `port=8768`이 기본값입니다. 주요 경로는 `/api/snapshot`, `/api/camera`, `/api/recordings`, `/api/recordings/{session}/replay`, `/ws`이며 전체 route는 [server.py](../cleany_dev_monitor/server.py)를 따릅니다. 기록 설정 API는 독립 logger의 서비스를 호출하며 로봇 구동 명령은 보내지 않습니다. [관측 데이터 계약](data.md)을 함께 확인합니다.\n\n## Logger 연결\n\n| 독립 Logger 연결 | 기본 |\n|---|---|\n| Namespace | logger_namespace=/cleany_logger |\n| RecordingControl clients | start / stop / configure / get_config |\n| RecordingStatus 구독 | status, Reliable / Transient Local depth 1 |\n| 상태 / service timeout | logger_timeout_s=3.0 |\n\n서비스 의미와 단위는 [Logger 인터페이스](../../cleany_logger/docs/interfaces.md)를 따릅니다.\n\nMonitor와 logger의 `state_directory`는 같은 호스트의 같은 디렉터리여야 합니다.\nHTTP `PUT /api/recording/settings`는 정지 상태에서 설정하거나 활성 녹화를 정지합니다.\n`POST /api/recording/session`은 정지 후 새 세션을 시작하고, 이미 녹화 중이면 같은\n세션을 반환한다. Monitor 종료는 logger 서비스 호출 없이 자체 HTTP와 구독만 닫는다.\n\n## 운영 제어와 상태\n\n`control_enabled=false`가 기본값이다. `control_enabled=true`와\n`control_directory/enabled` 파일이 모두 있어야 변경 요청을 허용한다.\n`control_directory`는 기본 `~/.local/state/cleany/dev-monitor/operator`이며 CLI는\n`XDG_STATE_HOME`을 따른다. `control_repository_root`는 기존 실행 도구의 저장소 경로다.\n제어 노드는 프로세스별 고유 이름을 사용하고 관측 collector와 분리한다.\n\n| 경로 또는 호출 | 계약 |\n|---|---|\n| `POST /api/control/login`, `logout` | 이름과 0600 조작키로 단일 세션 인증. 기본 3600초(`control_session_seconds`), 명시적 제어권 가져오기, HttpOnly/SameSite 쿠키와 동일 origin 검사 |\n| `GET /api/control/status` | 현재 실행기 상태, 허용 동작과 제한 사유, 작업 이력과 제안 |\n| `POST /api/control/jobs` | `request_id`, 허용된 `action`, 엄격한 `args`만 수락. 같은 UUID는 기존 작업 반환 |\n| `POST /api/control/cancel` | 활성 execution ID의 중단 또는 Action 이전 작업의 취소. 접수는 실물 정지 증거가 아님 |\n| `POST /api/control/jobs/{id}/acknowledge` | 사라진 작업 소유자의 불명확한 결과를 확인한 메모. 실행기 차단을 해제하지 않음 |\n| `/manipulation/cancel` | `CancelManipulation` Client, 정확한 실행 ID와 중단 방식 |\n| `/manipulation/confirm_recovery` | `ConfirmManipulationRecovery` Client, 검토한 execution ID/revision과 정지, 빈 그리퍼 확인 |\n\n허용 동작은 준비, 인식, 직접 실행, 제안, 승인, 건너뛰기, 팔 복귀, 복구와 종료다.\n토크, 그리퍼 개방과 복구에는 명시 확인이 필요하다. 준비는 기존 runtime start와\nAction server 시작, 직접 실행은 `make manipulation-run`, 복귀와 종료는 기존 CLI를\n호출한다. 임의 명령을 받지 않으며 guard, 실행 소유권과 차단 검사를 유지한다.\n\n웹 작업은 별도 systemd 사용자 scope에서 실행한다. 브라우저나 모니터 종료만으로\n로봇 작업을 종료하지 않는다. 웹과 CLI는 제어 활성화 중 공통 `operation.lock`을\n사용하며 시작 또는 진행 중 작업이 있으면 제어 토글을 거절한다.\n`jobs/\u003cUUID>.json`과 `.log`에 요청, 운영자와 결과를 보존한다. PID와 Linux 시작 tick으로\n소유자를 확인하며 사라진 작업은 결과 확인 전까지 새 실행을 막는다.\n응답 유실 시 같은 UUID만 재사용한다. 복구 revision은 확인창에서 고정하고 서버가\n다시 비교한다. 로그 요약은 오류 설명이며 실행 허가나 실제 정지 판단에 쓰지 않는다.\n\n`key`와 허용된 운영 옵션의 `runtime-settings.json`은 0600으로 저장한다.\nAPI key 값은 웹에 내보내지 않는다. 화면에는 최근 5개 명령을 표시하고 원본은 보존한다.\n\nJetson 프로필은 `/manipulation/execution_events`의 서버 기록을 사용한다.\n동일 기록의 heartbeat는 생존 시각만 갱신하며 revision과 완료 단계는 바꾸지 않는다.\n연결 또는 heartbeat가 오래되면 진행 상태와 동작 허가를 표시하지 않는다.\n준비 단계는 `manipulation_request_file`에서 읽으며, 기본 파일은\n`~/.local/state/cleany/manipulation/request.json`이다. CLI와 함께\n`CLEANY_MANIPULATION_PROGRESS_FILE`로 위치를 바꿀 수 있다. 준비 파일은 실시간 관측용이며\nLogger 녹화에 자동 포함하지 않는다. 요청의 execution ID가 일치하기 전에는 이전\n작업 결과를 현재 결과로 표시하지 않는다. `ASSUMED`와 실측 `CONFIRMED`를 구분한다.\n\n카메라 미리보기는 지원 JPEG를 재인코딩하지 않고 사용한다. 손목 raw 영상은 가능한 경우\n5 Hz preview/compressed, 헤드 컬러는 image_raw/compressed를 우선 사용한다.\n원본 깊이와 compressedDepth는 미리보기에서 제외한다. 선택은 set_enabled를 호출하지 않는다.\n`X-Camera-Topic`은 실제 구독 토픽이다. 리소스 수집은 Logger의 공통 sampler를 사용하며\nLinux에서 PID별 stat 한 번으로 CPU, 시작 tick과 RSS를 읽고 PID 재사용 시 기준을 초기화한다.\n\n## 승인 기반 작업 제안\n\n`pick_return_release`에서 `temporary_ignore_decision=true`면 로봇 좌표계에서\n유효한 3D 거리가 가장 짧은 검출을 표시한다. 이전에 건너뛴 기록은 고려하지 않는다.\n추적 ID가 모호하거나 실행 조건을 충족하지 않으면 해당 대상을 `DISPLAY_ONLY`로 표시한다.\n운영자는 `READY` 상태의 대상만 승인할 수 있다.\n\n인증된 제어 경로의 `cleany_dev_monitor_operator_\u003cpid>_\u003cid>` adapter가 요청별 작업을\n수행한다. 제안은 InspectScene으로 생성하고 승인은 GetSceneSnapshot으로 원본을 확인한다. 새 관측이 필요한 승인에서는 RevalidateTarget도 호출한다.\n승인 작업은 기존 `manipulation_test_client`로 정확한 Goal을 한 번 전달한다.\n재관찰은 승인한 대상의 동일성, 분류, 위치, bbox, 깊이와 크기 조건을 검증한다.\n주변 검출 목록의 일치는 승인 조건이 아니며, `scene_context`와 `scene_object_count`는\n제안 당시 관측 기록으로 유지한다. 경로와 충돌 검사는 승인 이후 실행기가 수행한다.\n\n| 종류 / 방향 | 기본 이름 | 타입과 조건 |\n|---|---|---|\n| Action Client | `/perception/inspect_scene` | `cleany_interfaces/action/InspectScene`, 같은 `tracking_session_id`로 새 작업 제안과 분류 |\n| 서비스 Client | `/perception/revalidate_target` | `cleany_interfaces/srv/RevalidateTarget`, 승인 대상의 최신 기하와 원본 분류 반환 |\n| 서비스 Client | `/perception/get_scene_snapshot` | `cleany_interfaces/srv/GetSceneSnapshot`, 승인 관측의 잔존 여부 확인 |\n| 토픽 구독 | `/perception/debug_image_latched` | `sensor_msgs/msg/Image`, reliable/transient_local/depth 1; `proposal_debug_image_topic` |\n| 서비스 Client | `/manipulation/control_state` | `std_srvs/srv/Trigger`, 실행 전후 현재 소유권과 차단 조회 |\n| Action Client, 기존 CLI | `/manipulation/execute_skill` | `cleany_interfaces/action/ExecuteManipulationSkill`, 승인된 snapshot/object/skill/destination; execution ID는 승인 작업 UUID |\n\n`POST /api/control/jobs`의 `action=propose`는 빈 `args`로 제안한다. `approve`, `skip`은\n`args={\"proposal_id\":\"UUID\"}`만 허용한다. 대상과 동작은 서버의 불변 제안에서 읽는다.\n동일 request UUID 재전송은 이전 작업을 반환하고, 다른 UUID로 같은 제안을 재사용하면\n거절한다. 별도 shell 인자나 임의 Goal은 받지 않는다. `GET /api/control/status`는\n현재 `proposal`과 진행 작업의 `phase`를 반환한다. `GET /api/control/proposals/{id}/image`는\n현재 인증 세션에 촬영 시각과 일치하는 JPEG만 반환하며 캐시하지 않는다.\n\n제안의 `target`은 종류명, 처리 분류, 검출 신뢰도와 위치를 포함합니다.\n재확인 응답은 승인 관측의 분류 사유(`sorting_reason`)도 유지합니다. 제안의 `reason`은\n대상 선정 규칙이나 실행 불가 상태를 설명하는 로컬 메시지입니다.\n\n승인은 원본 관측의 유효 기간, 물체 번호와 추적 ID의 대응, 세션, 설정 및 실행 적격 조건을 확인합니다.\n`pick_return_release`의 정지 물체 시험 설정(`assume_stationary_target=true`, `visual_servo_enabled=false`, `wrist_observation_enabled=false`)에서는\n원본 관측을 그대로 사용합니다. 기록의 `mode`는 `stationary_target_assumed`이고 `attempts`는 비어 있습니다.\n이 모드에서는 제안 이후 물체가 움직였는지 측정하지 않습니다.\n\n그 밖의 설정에서는 승인한 snapshot, 물체 번호, 추적 ID와 세션을 재확인 서비스에 전달합니다.\n새 영상의 위치, 박스, 깊이, 크기와 신뢰도를 검사하고 원본 이름과 처리 분류를 유지합니다.\n두 방식 모두 실행 명령은 원래 승인한 snapshot과 물체 번호를 사용합니다.\n\n마스크 대응 또는 RGB-D 수신 실패만 제한된 횟수로 새 영상을 요청합니다.\n이동, 낮은 박스 겹침, 깊이, 정책 또는 설정 실패에는 재시도하지 않습니다.\n`control_directory/revalidations/\u003cproposal_id>.json`에 승인 대상, 각 응답의\n촬영 시각, 위치, 박스, 신뢰도, 크기, 실패 원인과 종료 시각을 저장합니다.\n오류 메시지는 이동 거리(mm), 박스 겹침 또는 후보 식별 실패를 구분합니다.\n\n| 파라미터 | 기본값 | 의미 |\n|---|---|---|\n| `proposal_max_age_sec` | 90.0 | 촬영 후 승인 재확인 완료까지의 유효 시간; 인식 cache TTL도 별도 적용 |\n| `proposal_position_tolerance_m` | 0.015 | 같은 좌표계에서 승인 대상의 최대 위치 차이 |\n| `proposal_minimum_bbox_iou` | 0.7 | 승인 대상 bbox의 최소 겹침 비율 |\n| `proposal_inspection_timeout_sec` | 180.0 | 관측 응답 대기 상한 |\n| `proposal_execution_timeout_sec` | 1200.0 | 기존 CLI가 Action 결과를 기다리는 상한 |\n| `proposal_reobservation_attempts` | 2 | 새 영상 재확인 최대 시도 수, 1~3의 정수 |\n\n제안 상태는 `READY`, `DISPLAY_ONLY`, `NO_TARGET`, 조회 시 파생되는 `EXPIRED`, `CONSUMED`다. 실제\n실행 결과와 독립적이며 `NO_TARGET`은 전체 작업 완료가 아니다. 진행 단계는\n`PROPOSING`, `REVALIDATING`, `EXECUTING`, `PROPOSING_NEXT`다. 승인 작업 실패 후에도\n소비된 제안은 재사용하지 않는다. `propose`, 별도 인식, 준비, 직접 실행, 복귀, 복구,\n종료 요청은 기존 제안을 무효화한다. 모니터 재시작은 승인 대기 시간을 연장하지 않는다.\n\n카메라 미리보기는 `camera_preview_url`(기본 `http://127.0.0.1:8769`)의\n[telemetry camera_preview](../../cleany_telemetry/docs/interfaces.md#camera_preview)를\n조회합니다. Monitor의 `/api/camera`는 응답을 중계하며 영상 구독, 변환과 캐시를\n소유하지 않습니다. 제공자 연결 실패는 HTTP 503이며 로컬 영상 처리로 대체하지 않습니다.\n기존 `camera_max_streams`, `camera_fps`는 camera_preview 노드에 설정합니다.\n\n승인 제안 adapter는 인식 snapshot과 같은 header의 debug image를 구독해 승인 대상\n표시와 근거 이미지를 저장합니다. 이 작업별 이미지 소비는 연속 카메라 미리보기의\n구독·lease·캐시와 별개입니다. JPEG 변환은 telemetry의 공통 변환 함수를 사용합니다.\n\n\n저장 실행 환경의 `CLEANY_COLLECTION_USE_EXISTING_PERCEPTION=true`는 기존 인식과 헤드 RGB-D를 공유한다. 웹과 작업 프로세스는 ROS 초기화 전에 `CLEANY_COLLECTION_SHARED_RMW_IMPLEMENTATION`을 적용하며 기본값은 `rmw_fastrtps_cpp`다. 시작 전 읽기 전용 준비 검사와 RPC 응답을 확인하고, 종료 시 공유 제공자를 유지한다. HTTP·ROS endpoint와 요청 형식은 바뀌지 않는다.\n"},"ros2_ws/src/cleany_display/README.md":{"title":"Cleany Jetson 디스플레이","body":"# Cleany Jetson 디스플레이\n\nJetson의 로컬 브라우저에서 얼굴과 안내 문구를 전체 화면으로 표시합니다. 로봇 상태는 ROS 2 Humble로 구독하며 HTML, CSS, JavaScript는 설치 폴더에서 제공합니다. 인터넷 연결은 필요하지 않습니다. 상세 구독과 화면 우선순위는 [인터페이스](docs/interfaces.md)를 따릅니다.\n\n## 독립 설치\n\n배포 폴더는 `/home/cleany/cleany-display`입니다. `cleany_display`와 사용하는 로봇 버전의 `cleany_interfaces` 사본을 이 폴더에서 독립적으로 빌드합니다. 기존 로봇 checkout과 build/install은 수정하지 않습니다.\n\n[개발환경 기준](../../../docs/implementation/development-setup.md#jetson-얼굴-디스플레이-환경)의 의존성과 그래픽 자동 로그인 세션이 필요합니다. 이 패키지는 시스템 로그인 설정을 수정하지 않습니다.\n\n1. Jetson에 준비한 이 구현 레포의 루트에서 배포 파일을 복사합니다. 기본 설치 위치는 현재 사용자의 `~/cleany-display`입니다.\n\n   ```bash\n   display_root=\"$HOME/cleany-display\"\n   mkdir -p \"$display_root/ros2_ws/src\" \"$display_root/config\"\n   cp -R ros2_ws/src/cleany_display ros2_ws/src/cleany_interfaces \"$display_root/ros2_ws/src/\"\n   cp -R ros2_ws/src/cleany_display/scripts \"$display_root/\"\n   cp ros2_ws/src/cleany_display/scripts/standalone.Makefile \"$display_root/Makefile\"\n   cp ros2_ws/src/cleany_display/config/display.json \"$display_root/config/\"\n   ```\n\n2. 설치 폴더의 `config/display.json`에 실제 토픽 이름을 지정합니다. `runtime.env`가 필요하면 `ROS_DOMAIN_ID=0`처럼 실제 로봇과 같은 DDS 환경을 넣습니다. 별도 지정이 없으면 ROS 기본 domain 0을 사용합니다.\n\n3. 독립 workspace와 브라우저를 설치하고 사용자 서비스를 시작합니다. 그래픽 로그인한 Jetson 터미널에서 실행합니다.\n\n   ```bash\n   cd \"$HOME/cleany-display\"\n   make build\n   scripts/install-browser.sh\n   scripts/install-autostart.sh\n   ```\n\n설치기는 다음 사용자 설정만 추가합니다.\n\n- `~/.config/systemd/user/cleany-display.service`: ROS 구독 및 HTTP, 사용자 세션 시작 시 자동 실행\n- `~/.config/systemd/user/cleany-display-kiosk.service`: 전용 Chromium 프로필로 실행, 종료 시 재시작\n- `~/.config/autostart/cleany-display.desktop`: 그래픽 로그인 시 화면 환경을 전달하고 키오스크 시작\n\n자동 로그인 후 전체 화면이 켜집니다. 브라우저 설치 경로는 `browser.path`, Chromium 프로필과 캐시는 설치 폴더의 `browser-profile/`, `browser-config/`, `browser-cache/`에 둡니다. 브라우저 설치에만 다운로드가 필요하고 이후 화면 실행에는 인터넷이 필요하지 않습니다. 배포본 갱신 시 `install-browser.sh`의 Playwright 버전을 바꾸고 재설치한 뒤 키오스크를 재시작합니다. 키오스크 실행 중에는 GNOME의 idle 동작을 억제합니다. HDMI를 연결하면 데스크톱이 선택한 해상도에 맞춰 화면이 다시 배치됩니다.\n\n전용 브라우저는 [NVIDIA 안내](https://docs.nvidia.com/jetson/archives/r36.5/DeveloperGuide/SD/Graphics/GraphicsProgramming/OpenglEsProgrammingTips.html#graphics-driver-cpu-usage)에 따라 `__GL_YIELD=USLEEP`을 적용해 드라이버 대기 중 CPU 점유를 줄입니다. 다른 값이 필요하면 `runtime.env`에서 지정합니다.\n\n## 운영\n\n```bash\nsystemctl --user status cleany-display cleany-display-kiosk\njournalctl _SYSTEMD_USER_UNIT=cleany-display.service _SYSTEMD_USER_UNIT=cleany-display-kiosk.service -n 50\ncurl -s http://127.0.0.1:8770/api/state\n```\n\n설정 변경 후에는 `systemctl --user restart cleany-display`를 실행합니다. HTTP 주소나 포트를 바꾸면 `runtime.env`의 `CLEANY_DISPLAY_URL`도 맞추고 키오스크를 재시작합니다. 웹 자산을 갱신할 때는 독립 workspace의 소스를 교체하고 설치 루트에서 `make build` 후 두 서비스를 재시작합니다. 화면 상태 입력 예시는 다음과 같습니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource /home/cleany/cleany-display/ros2_ws/install/local_setup.bash\nros2 topic pub --once /cleany/display/state std_msgs/msg/String \\\n  '{data: \"{\\\"mode\\\":\\\"charging\\\",\\\"duration_seconds\\\":5}\"}'\n```\n\n화면을 끄고 자동 시작을 해제하려면 다음 명령을 사용합니다.\n\n```bash\nsystemctl --user stop cleany-display-kiosk\nsystemctl --user disable --now cleany-display\nmv ~/.config/autostart/cleany-display.desktop /home/cleany/cleany-display/cleany-display.desktop.disabled\n```\n\n검증 방법은 [테스트 안내](../../../docs/implementation/reference/testing.md#얼굴-디스플레이)를 따릅니다.\n"},"ros2_ws/src/cleany_display/docs/interfaces.md":{"title":"Cleany 디스플레이","body":"# Cleany 디스플레이\n\n```mermaid\nflowchart LR\n  ROS[\"미션 · 조작 · odom · 배터리\"] --> Display[\"cleany_display / 상태 매핑\"]\n  Display --> HTTP[\"로컬 HTTP\"]\n  HTTP --> Screen[\"얼굴 화면\"]\n```\n\n[실행과 자동 시작](../README.md) · [관측 도구 전체](../../../../docs/implementation/how-to/monitoring.md)\n\n`cleany_display`는 ROS 상태를 구독해 로컬 HTTP 화면에 전달합니다. 로봇 제어 토픽을 발행하거나 서비스와 Action을 호출하지 않습니다. 토픽 이름과 화면 정책은 `config/display.json`, DDS 환경은 별도 설치 폴더의 `runtime.env`로 설정합니다.\n\n| 기본 구독 토픽 | 메시지 | QoS | 표시 의미 |\n|---|---|---|---|\n| `/mission/status` | `cleany_interfaces/msg/MissionStatus` | reliable, transient-local, depth 1 | IDLE → 대기, NAVIGATE_TO_TARGET/RETURN_HOME → 이동, WORKING → 확인, ExecuteOne 단계 → 수거, ERROR → 도움 요청 |\n| `/mission/result` | `cleany_interfaces/msg/MissionResult` | reliable, transient-local, depth 1 | 실행을 관측한 미션의 SUCCESS/PARTIAL_SUCCESS → 완료, 검토 필요 → 도움 요청 |\n| `/manipulation/execution_events` | `cleany_interfaces/msg/ManipulationExecutionRecord` | reliable, transient-local, depth 1 | ACTIVE → 수거 또는 준비 단계 확인, human_confirmation_required → 도움 요청, SUCCESS → 수거 완료 |\n| `/wheel/odom` | `nav_msgs/msg/Odometry` | sensor data | 선속도 크기 0.02 m/s 또는 각속도 절댓값 0.05 rad/s 초과 → 이동, 양의 z 각속도 → 왼쪽 |\n| `/battery_state` | `sensor_msgs/msg/BatteryState` | sensor data | CHARGING(1) → 충전, 유효한 percentage(0–1)만 백분율 표시 |\n| `/cleany/display/state` | `std_msgs/msg/String` | sensor data | JSON으로 제한 시간 동안 화면 상태만 지정 |\n\n충전 표시에는 실제 `BatteryState` 발행자가 필요합니다. 이 패키지는 배터리 드라이버를 제공하지 않습니다. 수거 실행 기록의 확인 단계는 기본적으로 ValidateRequest, EnsureReady, CaptureScene, SelectArmAndPath, ValidatePlan이며 `checking_substages`로 설정합니다.\n\n표시 우선순위는 미션 오류/사람 확인 필요, 제한 시간 지정 화면, 충전, 진행 중 수거, 미션 진행, 측정된 이동, 완료 순서입니다. 이벤트 방식의 상태는 발행자가 존재하는 동안 유지합니다. 주행 측정값은 1.5초, 배터리는 15초 후 만료합니다. 완료는 6초 동안 표시하며 이전에 저장된 수거 성공은 측정 시각로 걸러냅니다. `MissionResult`는 측정 시각가 없으므로 가장 최근 실행을 관측한 미션의 결과만 완료로 표시합니다.\n\n처음 켰을 때 ROS 입력이 없으면 대기 얼굴을 표시합니다. ROS 입력이 있었으나 모든 유효 입력이 사라지면 3초 후 도움 요청과 “연결을 확인해 주세요”를 표시합니다. 로컬 HTTP 연결이 끊어져도 브라우저에서 같은 문구를 표시하고 재연결합니다. 개별 입력이 없어도 다른 유효 입력이 있으면 그 상태를 사용합니다.\n\n## 제한 시간 화면 지정\n\n```json\n{\"mode\":\"charging\",\"duration_seconds\":5,\"direction\":\"forward\"}\n```\n\n`mode`는 idle, moving, checking, collecting, complete, charging, help 중 하나입니다. `duration_seconds`는 기본 5초, 최대 60초이며 `direction`은 left, forward, right 중 하나입니다. 선택적인 `message`는 최대 120자의 일반 텍스트로 표시합니다. 모드와 시간이 유효하지 않은 요청은 무시합니다. 이 입력이 만료되면 관측된 로봇 상태로 돌아갑니다. 미션 오류와 사람 확인 필요 상태를 가리지 않습니다.\n\n## HTTP\n\n기본 주소는 `http://127.0.0.1:8770`입니다. `/`는 디스플레이, `/api/state`와 `/healthz`는 읽기 전용 JSON snapshot입니다. `mode`, `direction`, `message`, `battery_percent`, `collected_count`, `connected`, `source`, `sources`, `poll_ms`, `rendering`을 반환합니다. 알 수 없는 수치는 null이며 데모 값으로 대체하지 않습니다. HTTP는 로봇 명령을 받지 않습니다.\n\n화면은 16:9 영역을 화면 가운데 맞추고 남는 영역은 어두운 배경으로 채웁니다. 상태가 반복 수신되어도 애니메이션을 처음부터 다시 시작하지 않습니다. 대기 중에는 10초 간격으로 웃기, 둘러보기, 끄덕이기를 반복합니다. 충전 중에는 Zzz, 수거 중에는 땀방울을 표시합니다. 확인과 수거 동작은 3.2초, 도움 요청은 3.6초를 한 주기로 반복합니다.\n\n표정이 바뀌어도 진행 중인 눈 깜빡임과 얼굴 움직임을 이어갑니다. 눈과 입의 모양, 땀방울과 이동 효과는 현재 모습에서 점진적으로 바뀌며 Zzz는 옅어지면서 사라집니다. 안내 문구는 이전 문구가 사라진 뒤 다음 문구를 표시합니다. 도움 요청은 얼굴 아래에 배치하고, 이전 안내와 얼굴이 안내 영역을 벗어난 뒤 나타냅니다. 모션 감소 설정에서는 전환 효과 없이 즉시 표시합니다.\n\n## 렌더링 설정\n\n| 설정 | 기본값 | 브라우저 적용 범위 | 의미 |\n|---|---|---|---|\n| `rendering.max_canvas_width` | 1280 | 320–3840 | 얼굴 비트맵의 최대 가로 픽셀 수 |\n| `rendering.max_pixel_ratio` | 2 | 1–2 | 장치 픽셀 배율의 상한 |\n| `rendering.max_fps` | 60 | 15–60 | 얼굴의 초당 렌더링 횟수 상한 |\n\n기본값은 60fps이고 캔버스는 최대 1280×720이며 화면 크기에 맞춰 확대합니다. 안내 글자는 DOM으로 원래 해상도에서 표시합니다. 장치의 출력 해상도와 주사율은 별개입니다. 애니메이션 시간은 렌더링 간격으로 계산하므로 프레임 수를 낮춰도 동작 주기는 유지됩니다. 상태 변경과 크기 변경 시에는 즉시 다시 그립니다.\n\n설정은 상태 응답에 포함되며 서버 재시작 후 브라우저 재실행 없이 적용됩니다. 브라우저의 requestAnimationFrame 콜백 수와 실제 캔버스 렌더링 횟수는 다르므로 성능 측정에서 구분합니다.\n"},"ros2_ws/src/cleany_gazebo_sim/docs/interfaces.md":{"title":"cleany_gazebo_sim 노드 인터페이스","body":"# cleany_gazebo_sim 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n주행 launch의 설정 병합과 어댑터 구성은 [주행 연동](navigation.md)에서 관리합니다.\n\n## gazebo_command_guard\n\n실행 파일: `gazebo_command_guard`. 원본: [command_guard.py](../cleany_gazebo_sim/command_guard.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10 |\n| 토픽 발행 | `gazebo_cmd_vel` | `geometry_msgs/msg/Twist` | R10; 명령 수신 또는 timeout 정지 시 |\n\nTimeout 검사는 `timeout_check_rate_hz` 기본 20 Hz입니다.\n\n## gazebo_feedback_sampler\n\n실행 파일: `gazebo_feedback_sampler`. 원본: [feedback_sampler.py](../cleany_gazebo_sim/feedback_sampler.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/gazebo/raw_clock` | `rosgraph_msgs/msg/Clock` | Sensor |\n| 토픽 구독 | `/gazebo/raw_joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n| 토픽 발행 | `/clock` | `rosgraph_msgs/msg/Clock` | R10 |\n| 토픽 발행 | `/joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n\nRaw 시뮬레이터 feedback을 받아 샘플링합니다. `publish_period_s` 기본 0.02초는 ROS stamp 간격 기준이며 wall-time 50 Hz를 보장하지 않습니다.\n\n## gazebo_odom_tf_publisher\n\n실행 파일: `gazebo_odom_tf_publisher`. 원본: [odom_tf_publisher.py](../cleany_gazebo_sim/odom_tf_publisher.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `gazebo_odom` | `nav_msgs/msg/Odometry` | R10; `input_topic` |\n| 토픽 발행 | `odom` | `nav_msgs/msg/Odometry` | R10; `publish_odometry=true` |\n| 토픽 발행 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n입력 수신 시 `odom_frame_id → base_frame_id` TF를 발행합니다. 기본 좌표계은 odom/base_link입니다.\n\n## gazebo_pan_tf_publisher\n\n실행 파일: `gazebo_pan_tf_publisher`. 원본: [pan_tf_publisher.py](../cleany_gazebo_sim/pan_tf_publisher.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n| 토픽 발행 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\nPan feedback에서 head camera TF를 발행합니다. Frame 이름과 장착 geometry는 노드 parameter를 따릅니다.\n\n## gazebo_sensor_tf_publisher\n\n실행 파일: `gazebo_sensor_tf_publisher`. 원본: [sensor_tf_publisher.py](../cleany_gazebo_sim/sensor_tf_publisher.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n시작 시 설정된 sensor의 static TF를 보냅니다. `parent_frame_id`와 sensor별 frame/translation/rotation parameter가 필요합니다.\n\n## simulated_encoder\n\n실행 파일: `simulated_encoder_node`. 원본: [simulated_encoder_node.py](../cleany_gazebo_sim/simulated_encoder_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `input_topic` |\n| 토픽 발행 | `wheel_encoder/joint_states` | `sensor_msgs/msg/JointState` | Sensor; 입력 수신 시, `output_topic` |\n\n## simulated_odometry_error\n\n실행 파일: `simulated_odometry_error_node`. 원본: [simulated_odometry_error_node.py](../cleany_gazebo_sim/simulated_odometry_error_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `wheel/odom_raw` | `nav_msgs/msg/Odometry` | R10; `input_topic` |\n| 토픽 발행 | `wheel/odom` | `nav_msgs/msg/Odometry` | R10; 입력 수신 시, `output_topic` |\n\n## ground_truth_route_follower\n\n실행 파일: `ground_truth_route_follower`. 원본: [ground_truth_route_follower.py](../cleany_gazebo_sim/ground_truth_route_follower.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `ground_truth/odom` | `nav_msgs/msg/Odometry` | R10 |\n| 토픽 발행 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10; `control_rate_hz` 기본 20 Hz |\n\n별도 GT 주행 시험용입니다. Nav2와 같은 cmd_vel 명령원을 동시에 실행하지 않습니다.\n\n## ros_gz_bridge\n\n외부 실행 파일은 `ros_gz_bridge/parameter_bridge`입니다. [Sensor 프로필](../cleany_gazebo_sim/launch_helpers/sensor_profile.py)이 `gazebo_\u003cgroup>_bridge`를 만들며 기본 `lidar_nav`는 core와 lidar 그룹을 사용합니다. 아래는 [bridge 설정](../config/bridge)의 ROS 측 목록입니다.\n\n| 그룹 | 종류 / 방향 | ROS 기본 이름 | ROS 타입 | 조건 |\n|---|---|---|---|---|\n| `core` | 토픽 구독 | `/gazebo_cmd_vel` | `geometry_msgs/msg/Twist` | 선택된 그룹에서 활성화 |\n| `core` | 토픽 발행 | `/gazebo_odom` | `nav_msgs/msg/Odometry` | 선택된 그룹에서 활성화 |\n| `core` | 토픽 발행 | `/ground_truth/odom` | `nav_msgs/msg/Odometry` | 선택된 그룹에서 활성화 |\n| `core` | 토픽 발행 | `/joint_states` | `sensor_msgs/msg/JointState` | Profile launch에서 `/gazebo/raw_joint_states`로 remap |\n| `core` | 토픽 발행 | `/clock` | `rosgraph_msgs/msg/Clock` | Profile launch에서 `/gazebo/raw_clock`로 remap |\n| `core` | 토픽 발행 | `/imu/data` | `sensor_msgs/msg/Imu` | 선택된 그룹에서 활성화 |\n| `lidar` | 토픽 발행 | `/scan` | `sensor_msgs/msg/LaserScan` | 선택된 그룹에서 활성화 |\n| `head_depth` | 토픽 발행 | `/camera/head/depth/image_raw` | `sensor_msgs/msg/Image` | `SENSOR_DATA` |\n| `head_depth` | 토픽 발행 | `/camera/head/depth/camera_info` | `sensor_msgs/msg/CameraInfo` | `SENSOR_DATA` |\n| `head_rgbd` | 토픽 발행 | `/camera/head/color/image_raw` | `sensor_msgs/msg/Image` | ROS 구독자가 있을 때 활성화 |\n| `head_rgbd` | 토픽 발행 | `/camera/head/depth/camera_info` | `sensor_msgs/msg/CameraInfo` | `SENSOR_DATA` |\n| `head_rgbd` | 토픽 발행 | `/camera/head/depth/image_raw` | `sensor_msgs/msg/Image` | 선택된 그룹에서 활성화 |\n| `left_wrist` | 토픽 발행 | `/camera/left_wrist/color/image_raw` | `sensor_msgs/msg/Image` | 선택된 그룹에서 활성화 |\n| `right_wrist` | 토픽 발행 | `/camera/right_wrist/color/image_raw` | `sensor_msgs/msg/Image` | 선택된 그룹에서 활성화 |\n\nQoS를 지정하지 않은 행은 설치된 bridge 기본값을 따릅니다. `/clock`과 `/joint_states`의 raw 입력은 `gazebo_feedback_sampler`가 정규 토픽으로 다시 발행합니다. `bridge_config` override는 sampler와 이 remap을 사용하지 않고 지정 YAML로 단일 `gazebo_override_bridge`를 만듭니다.\n\n`bridge.yaml`, `navigation_bridge.yaml`은 별도 통합 설정이며 위 프로필 표와 동시에 활성화되는 것은 아닙니다. Gazebo wire type은 Fortress의 `ignition.msgs`를 사용합니다. 서비스와 액션 bridge는 현재 설정에 없습니다.\n\n| 손목 카메라 | 계약 |\n|---|---|\n| 형상 원본 | `description/config/geometry/wrist_mount_v8.json`의 기존 장착 좌표 |\n| 축 | Gazebo +X 전방을 optical +Z로 변환 |\n| SDF 좌표계 | *_wrist_rgb_optical_frame에 같은 pose; 추가 ROS TF 발행 없음 |\n| Legacy model | v8 visual 6개 사용, 기존 주행 상체 collision envelope 유지 |\n| CAD model | 최신 CAD visual / collision; 팔 포함 설정에서만 손목 센서 생성 |\n| 영상 크기 | Gazebo 640×360, MuJoCo 640×480과 별도 |\n| 실행 | 원본 SDF는 template; launch / world generator로 생성 |\n\n### 변환 모델 식별\n\n생성된 `*.model.json`은 변환에 사용한 모델을 식별합니다. `cad_frame`은\n설치된 `cleany_description`의 URDF를 읽으므로, 별도 CAD 파일을 바꿔도 자동 갱신되지 않습니다.\n\n| 필드 | 의미 |\n|---|---|\n| `description.expanded_urdf_sha256` | 변환 전 펼친 URDF의 해시 |\n| `description.mesh_sha256` | URDF가 참조한 각 메시 파일의 내용 해시 |\n| `description.sha256` | 위 모델 식별 정보를 합친 해시 |\n| `profile_sha256` | 적용한 CAD 변환 YAML 파일의 해시 |\n| `adapter_origin_commit` | 변환기 도입 이력; 현재 형상의 버전이 아님 |\n\n실제 변환 결과에는 `simulation_excluded_link_roots`, `park_joints`와\n`simulation_park_limits`도 적용됩니다. 원본 형상과 이 설정을 함께 비교해야 합니다.\n"},"ros2_ws/src/cleany_gazebo_sim/docs/navigation.md":{"title":"Gazebo 주행 연동","body":"# Gazebo 주행 연동\n\n이 패키지는 시뮬레이터의 센서와 TF, 시뮬레이션 시간을 공통 Navigation 입력에 연결합니다. 위치 추정과 경로 계획, 주행 제어는 `cleany_navigation`이 수행합니다. 실행 순서는 [시뮬레이터 가이드](../../../../docs/implementation/how-to/simulation.md)를 따릅니다.\n\n## 실행 구성과 설정 병합\n\n```mermaid\nflowchart TD\n    Common[\"cleany_navigation / 공통 nav2_amcl.yaml\"] --> Merge[\"Gazebo launch / 환경 차이 병합\"]\n    Local[\"cleany_gazebo_sim / nav2_amcl.yaml\"] --> Merge\n    Merge --> Params[\"완성된 parameters.yaml\"]\n    Params --> Navigation[\"cleany_navigation launch\"]\n    Sensors[\"Gazebo 센서와 TF 어댑터\"] --> Navigation\n    Clock[\"시뮬레이션 시간 / use_sim_time\"] --> Navigation\n```\n\n| 이 패키지의 진입점 | 연결하는 공통 진입점 | 이 패키지의 처리 |\n|---|---|---|\n| [amcl_nav2.launch.py](../launch/amcl_nav2.launch.py) | `cleany_navigation/amcl_nav2.launch.py` | AMCL/Nav2 설정 병합, 지도와 시뮬레이션 시간 전달 |\n| [amcl_nav2_safety.launch.py](../launch/amcl_nav2_safety.launch.py) | `cleany_navigation/navigation.launch.py` | 설정 병합, 센서와 몸체 설정 구성, 카메라 TF 어댑터 연결 |\n\n두 진입점의 `params_file`은 [이 패키지의 환경 overlay](../config/nav2_amcl.yaml)를 기본으로 사용합니다. 공통 파일과 합쳐 임시 `parameters.yaml`을 만든 뒤 Navigation에 전달하므로, 이 overlay를 Nav2 노드에 단독으로 전달하지 않습니다. Plugin 교체 시의 병합 규칙은 [Navigation 설정 계약](../../cleany_navigation/docs/planning.md#외부-설정의-전달-계약)을 따릅니다.\n\n## 안전 주행 어댑터의 책임\n\n| 입력 또는 구성 | 처리 |\n|---|---|\n| `use_sim_time` | 기본 `true`; 공통 launch에 전달 |\n| `safety_params_file` | [Gazebo 안전 설정](../config/nav2_safety.yaml)에서 카메라 장착 정보와 로봇 설정 분리 |\n| `body_profile` | CAD 변환 프로필과 시뮬레이션 주차 한계를 로봇 설정에 반영 |\n| 카메라 TF | 동적 pan 구성은 명령 bridge와 feedback TF 어댑터 연결; 고정 구성은 장착 TF 발행 |\n| Optical TF | 카메라 프레임에서 optical 프레임으로 변환 발행 |\n| `robot_params_file` | 위 정보를 합친 임시 `robot.yaml`을 공통 Navigation에 전달 |\n| `omni_params_file` | 기본 Omni 저속 튜닝을 공통 Navigation에 전달 |\n\nGazebo 메타데이터가 포함된 안전 설정은 공통 ROS 파라미터 파일과 구분합니다. 래퍼는 공통 `safety_params_file`과 환경별 `robot_params_file`을 각각 전달합니다. 어댑터의 정확한 토픽과 TF는 [인터페이스](interfaces.md)를 따릅니다.\n\n`odom → base_link`와 센서 장착 TF는 활성 시뮬레이션 구성이 제공합니다. 같은 변환을 실물 드라이버나 다른 시뮬레이터가 중복 발행하지 않도록 실행 구성을 분리합니다. `map → odom`은 선택한 위치 추정 또는 SLAM 중 하나가 소유합니다.\n"},"ros2_ws/src/cleany_grasping/docs/interfaces.md":{"title":"cleany_grasping 노드 인터페이스","body":"# cleany_grasping 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## grasp_server\n\n- **실행 파일**: `grasp_server`\n- **시작 설정**: [runtime.py](../cleany_grasping/runtime.py)\n- **노드 구현**: [grasp_node.py](../cleany_grasping/grasp_node.py)\n\n| 종류 / 방향 | 기본 토픽 및 서비스 이름 | ROS 타입 | QoS 및 파라미터 매핑 | 설명 |\n|---|---|---|---|---|\n| **서비스 제공** | `grasp/plan` | `cleany_interfaces/srv/PlanGrasp` | 기본 Service QoS (`service_name`) | 파지 후보 생성 및 계획 요청 처리 |\n| **서비스 제공** | `/grasp/prepare_window` | `std_srvs/srv/SetBool` | 기본 Service QoS (`anygrasp_prepare_service`) | AnyGrasp 모델 사전 준비 및 180초 유지 Lease 설정 |\n| **토픽 구독** | `/manipulation/execute_skill/_action/status` | `action_msgs/msg/GoalStatusArray` | Reliable, Transient Local 1 (`anygrasp_task_status_topic`) | 조작 액션 수행 중 워커 유지 Lease 갱신 |\n| **토픽 발행** | `grasp/debug_image` | `sensor_msgs/msg/Image` | Reliable, Transient Local 1 (`debug_image_topic`) | 파지 후보 및 바운딩 박스가 표시된 디버그 이미지 |\n| **토픽 구독** | `/tf`, `/tf_static` | `tf2_msgs/msg/TFMessage` | TF2 기본 QoS | 카메라-로봇 간 좌표 변환 |\n\n`PlanGrasp`는 서비스입니다. 호출 의미는 [Scene와 Grasp 계약](../../cleany_interfaces/docs/scene-and-grasp.md)을 따릅니다.\n"},"ros2_ws/src/cleany_grasping/docs/predictors.md":{"title":"파지 후보 생성과 선택","body":"# 파지 후보 생성과 선택\n\n`GraspNode`는 선택 물체의 점군에서 후보를 만들고 필터링한 `GraspCandidate[]`를 점수 내림차순으로 반환합니다. 팔 선택, IK, MoveIt 충돌 검사와 실제 실행은 [조작 경로](../../../../docs/implementation/how-to/manipulation.md)가 담당합니다.\n\n```mermaid\nflowchart LR\n    Input[\"target / context cloud + OBB\"] --> Frame[\"촬영 시각 TF / workspace\"]\n    Frame --> Predictor{\"predictor\"}\n    Predictor --> Geometric[\"geometric / 기하 기반\"]\n    Predictor --> SDK[\"AnyGrasp / SDK 추론\"]\n    Geometric --> Filter[\"폭 / 선택 객체 접촉 / NMS\"]\n    SDK --> Filter\n    Filter --> Result[\"점수순 후보 / 없으면 ERROR_NO_GRASP_CANDIDATE\"]\n    Result --> MoveIt[\"후속 IK / 충돌 / 실행\"]\n```\n\n## 처리 경계\n\n| 입력 / 출력 | 계약 |\n|---|---|\n| 서비스 | `grasp/plan` (`cleany_interfaces/srv/PlanGrasp`) |\n| 입력 | Perception 2단계의 RGB `target_cloud` / `context_cloud`와 원본 OBB |\n| Workspace | target bounds + margin; context로 충돌 후보 제거 |\n| 출력 없음 | `ERROR_NO_GRASP_CANDIDATE`; pose 합성 안 함 |\n| Predictor 확장 | `GraspPredictor` port 구현 |\n| Geometric | 모델 / checkpoint / SDK license 불필요; 단순 강체의 top-down MVP |\n| AnyGrasp | Adapter import는 첫 요청까지 지연; 2026 aarch64 dev SDK의 `create_detector()` / region steering 사용 |\n\n### Geometric 후보가 만들어지는 순서\n\n```mermaid\nflowchart TD\n    Plane[\"context RANSAC / 지지면 법선\"] --> Axes[\"target 투영 / 최소 폭 방향과 두 물체축\"]\n    Axes --> Center[\"robust extent 중점 / 3D 중심 복원\"]\n    Center --> Poses[\"접근 tilt / 주축 / yaw offset / 접촉 위치 조합\"]\n    Poses --> Collision[\"finger / palm과 target 밖 context 충돌 제거\"]\n    Collision --> Score[\"폭 여유 / 주축 정렬 / 짧은 축 선호 점수\"]\n```\n\n복잡한 형상, 변형 물체와 측면 접근에는 별도 predictor 또는 MoveIt 단계가 필요합니다. 후보 생성 성공은 파지 유지 성공이 아닙니다.\n\n## 물체별 접근각 탐색\n\n| 옵션 | 일반 기본 / Sorting | 동작 |\n|---|---|---|\n| `search_approach_tilts` | 기존 단일 `approach_tilt_degrees` / true | `approach_tilt_options` 기본 0, 8, 16, 24° 평가 |\n| `include_reverse_closing_axis` | 선택 / sorting 비활성 | 비대칭 jaw의 반대 closing 방향 추가 |\n| `nms_rotation_threshold_degrees` | 20° / 5° | 접근각 후보가 NMS에서 합쳐지는 범위 조정 |\n| `approach_reference_positions` | `[0.0]` 비활성 / 양 어깨 xyz | Planning 좌표계 기준점을 평탄화한 배열; 어깨에서 물체로 향하는 수평 접근 생성 |\n| `reject_robot_opposite_approach` | 선택 | `robot_reference_position`에서 물체로 향하는 방향과 반대인 후보 제거 |\n| `prefer_upward_closing_axis` | false | 같은 점수에서 fixed-jaw 쪽 +closing이 위인 후보 우선; 진단용 |\n| 생성 예산 | 일반 demo 24 / sorting 96 | 실행 selector의 IK 예산은 24 유지 |\n\n실물 준비 자세 프로파일과 sorting launch는 반대 closing 방향을 끄고 yaw를 0°, ±20°, ±40°로 제한합니다.\n\n접근 tilt와 어깨 기준점은 교차 배분합니다. 반대 closing 방향에도 같은 short-axis 점수를 주어 후보 제한에서 사라지지 않게 합니다. 재관측은 기존 방향과 중심 연속성으로 먼저 선별합니다.\n\n요청마다 지지면, 물체축·중심과 장애물 점은 한 번 계산합니다. 각 조합은 이 결과를 공유하고 점수순으로 충돌을 지연 평가합니다. 후보 상한 뒤 계산을 생략해도 전체 평가 후 자른 결과와 순서·다양성은 같아야 합니다.\n\n### 길이 방향 접촉 위치\n\n| 검사 / 옵션 | 조건 |\n|---|---|\n| 활성 | `search_longitudinal_contacts`: 일반 false, sorting true |\n| 대상 | 지지면 높이/길이 ≤ `longitudinal_max_height_ratio=0.4`, 길이 > finger length |\n| 위치 | `longitudinal_offset_fractions=[0,-0.25,0.25]`; finger 전체가 robust 관측 범위 안에 남도록 제한 |\n| 높이 보정 | 일반은 유지; sorting의 `longitudinal_contact_height_offset_m=0.003`은 위 대상만 법선 방향 3 mm 보정 |\n| 제외 | 짧은 레고나 두꺼운 컵에는 위 높이 보정 미적용 |\n| 순위 | 생성 시 동점이면 robot reference에 가까운 지점; 최종 같은 품질의 길이 방향 후보는 관측 체적 중심에 가까운 후보 우선 |\n| 유지 검사 | 폭 / 점수 기준, context 충돌, NMS, 후속 IK / MoveIt |\n\n끝부분 후보도 남아 중앙 후보의 IK나 충돌 검사 실패 시 평가합니다. 라벨과 시뮬레이터 정답 위치는 사용하지 않습니다. 3 mm는 시뮬레이션 시험값이며 실물 보정값이 아닙니다.\n\n### 지지면 검사 위임\n\n```mermaid\nflowchart LR\n    Cloud[\"context\"] --> Plane[\"지지면 inlier만 간이 손가락 검사에서 제외\"]\n    Plane --> Patch[\"selector / executor가 유한 support patch 등록\"]\n    Patch --> Robot[\"실제 로봇 형상으로 open / closure 검사\"]\n```\n\n`geometric.defer_support_plane_collision=true`는 위 계약을 함께 적용하는 sorting 전용입니다. 기본 false는 간이 지지
