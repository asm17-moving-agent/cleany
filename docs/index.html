TION.md) |\n| 각 패키지가 무엇을 맡는가? | [기능별 패키지 지도](packages.md) |\n| 토픽·서비스·액션의 타입과 방향은? | [ROS 인터페이스](ROS_INTERFACES.md) |\n| 로봇 소프트웨어 개념부터 배우려면? | [학습 가이드](guide/index.html) |\n| 제품 범위와 설계 결정은? | [팀 KB](cleany-docs/README.md) |\n\n실물·시뮬레이션·합성 입력은 각 문서에서 구분합니다. 기능이 존재하거나 자동 검사가 통과한 것과 실물 성능이 검증된 것은 구분해서 확인합니다.\n"},"docs/packages.md":{"title":"기능별 패키지 지도","body":"# 기능별 패키지 지도\n\n\n패키지 이름보다 작업 영역에서 시작하세요. 각 링크는 역할과 실행 조건, 인터페이스 또는 상세 설정으로 이어집니다.\n\n| 영역 | 구성과 실행 | 상세 계약 |\n|---|---|---|\n| 매핑·주행 | [Navigation](../ros2_ws/src/cleany_navigation/README.md), [Bringup](../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md) | [계획](../ros2_ws/src/cleany_navigation/docs/planning.md), [매핑](../ros2_ws/src/cleany_navigation/docs/mapping.md), [안전](../ros2_ws/src/cleany_navigation/docs/safety.md) |\n| 인식·파지 후보 | [Perception](../ros2_ws/src/cleany_perception/docs/runtime.md), [Grasping](../ros2_ws/src/cleany_grasping/docs/predictors.md) | [관측 계약](../ros2_ws/src/cleany_interfaces/docs/observation-contracts.md), [Scene·Grasp](../ros2_ws/src/cleany_interfaces/docs/scene-and-grasp.md) |\n| 조작 실행 | [Skill Executor](../ros2_ws/src/cleany_skill_executor/docs/manipulation.md), [MuJoCo BT](../ros2_ws/src/cleany_manipulation_bt/README.md) | [실행 계약](../ros2_ws/src/cleany_manipulation_bt/docs/execution_contract.md), [MoveIt](../ros2_ws/src/cleany_moveit_config/docs/planning.md) |\n| Mission·허가 | [Mission](../ros2_ws/src/cleany_mission_manager/docs/manipulation_mock_integration.md), [Supervisor](../ros2_ws/src/cleany_system_supervisor/docs/supervision.md) | [미션 계약](../ros2_ws/src/cleany_interfaces/docs/mission.md), [Safety adapter](../ros2_ws/src/cleany_safety_adapter/docs/interfaces.md) |\n| Host·Backend 연결 | [Control bridge](../ros2_ws/src/cleany_control_bridge/docs/interfaces.md) | [Pose telemetry](../ros2_ws/src/cleany_telemetry/docs/interfaces.md) |\n| 구동·펌웨어 | [Base driver](../ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md), [ESP32](../esp32/README.md) | [Wheel protocol](../ros2_ws/src/cleany_base_interfaces/docs/protocol.md), [Wheel odometry](../ros2_ws/src/cleany_base_odometry/docs/interfaces.md) |\n| 센서·보정 | [IMU](../ros2_ws/src/cleany_base_driver/docs/imu.md), [ToF](../ros2_ws/src/cleany_tof/docs/interfaces.md), [Hand-eye](../ros2_ws/src/cleany_handeye_calibration/docs/offline-tools.md) | [좌표](../ros2_ws/src/cleany_handeye_calibration/docs/frames-and-data.md) |\n| 모델·시뮬레이션 | [Robot model](../ros2_ws/src/cleany_description/docs/model.md), [Gazebo](../ros2_ws/src/cleany_gazebo_sim/docs/interfaces.md), [MuJoCo](../ros2_ws/src/cleany_mujoco_sim/docs/scenes.md) | [Model runtime](../ros2_ws/src/cleany_description/docs/model-runtime.md), [Backend](../ros2_ws/src/cleany_mujoco_sim/docs/backends.md) |\n| 기록·관측 | [Logger](../ros2_ws/src/cleany_logger/docs/runtime.md), [Monitor](../ros2_ws/src/cleany_dev_monitor/docs/data.md), [Display](../ros2_ws/src/cleany_display/docs/interfaces.md) | [Logger data](../ros2_ws/src/cleany_logger/docs/data.md), [Monitor API](../ros2_ws/src/cleany_dev_monitor/docs/interfaces.md) |\n\n패키지별 목록은 사이드 메뉴에서도 찾을 수 있습니다. 모든 노드가 동시에 실행되는 것은 아니므로 실제 구성은 [시스템 연결](INTEGRATION.md)에서 확인하세요.\n"},"docs/reference/testing.md":{"title":"테스트 상세 참조","body":"# 테스트 상세 참조\n\n명령은 저장소 루트의 Humble/Fortress 환경에서 실행합니다. 변경 범위를 확인한 뒤 가장 작은 관련 검사부터 선택합니다. Make target의 실제 동작은 [Makefile](../../Makefile)을 기준으로 확인합니다.\n\n## 테스트와 도구 위치\n\n테스트는 검사 대상을 소유한 위치에 둡니다. 루트 `tests/`에는 저장소 도구의 자동 검사와 패키지를 연결하는 통합 검사만 둡니다. 실행, 관찰과 보고 코드는 검증 도구로 분리합니다.\n\n| 위치 | 책임 |\n|---|---|\n| `ros2_ws/src/\u003cpackage>/test/`, `tests/` | 패키지 기능과 계약의 자동 검사 |\n| `ros2_ws/src/\u003cpackage>/runtime_test/` | 해당 패키지의 명시 실행 smoke와 runtime 검사 |\n| `tests/integration/` | Backend, Mission 등 여러 구성 요소의 연동 검사 |\n| `tests/tools/` | 저장소 검증 도구의 자동 검사 |\n| `tools/validation/` | Simulator 실행과 영상·로그 수집 |\n\n패키지 내부에도 통합 검사가 있을 수 있습니다. 파일의 책임과 실행 조건으로 위치를 정하며, runtime CLI를 `tests/`에 넣었다고 pytest가 자동 실행하는 것은 아닙니다.\n\n## 검사 선택\n\nbag 기반 휠/LiDAR 이동 불일치 도구는 `make test-slip-detection`으로 검사한다.\n시간 보간과 좌표 변환, 합성 스캔 정합, 퇴화된 단일 벽, 정합 품질 실패,\nodom 단절과 연속 감지 조건을 검증한다. ROS 노드나 모터 명령을 만들지 않는다.\n실제 기록의 분석 절차와 판정 한계는 [캘리브레이션 가이드](../CALIBRATION.md#bag-기반-슬립-의심-구간-분석)를 따른다.\n\n실시간 노드와 BT를 빌드한 뒤 `make test-slip-recovery`로 navigation CTest를\n격리된 `BASE_TEST_ROS_DOMAIN_ID`에서 실행한다. 실제 BT 플러그인의 child halt,\n정지 확인, 목표별 재시도 유지, 지연된 이전 비교 무시와 반복 실패를 검사한다.\n게이트 단위 검사는 병진 방향 유지와 휠별 감속 상한, heartbeat 단절을 확인한다.\n전체 Nav2 smoke에는 `tools/validation/slip_recovery_smoke.py`를 사용한다.\n별도 도메인에 빈 시험 지도와 `phone_navigation.launch.py phone_motion_profile:=omni`를\n먼저 실행한 뒤 같은 도메인에서 도구를 실행한다. 합성 센서와 명령 전달만으로\n경로 추종 시작과 취소 후 0 출력을 검사하며, 도구는 하드웨어 도메인 0에서 실행을 거부한다.\n\n```mermaid\nflowchart TB\n    Change{\"바뀐 경계\"}\n    Change -->|\"순수 logic / 도구\"| Unit[\"해당 core / host test\"]\n    Change -->|\"ROS type / manifest / launch\"| Package[\"관련 package build + test\"]\n    Change -->|\"여러 package 연결\"| ROS[\"합성 ROS runtime 검사\"]\n    Change -->|\"센서 / 주행 / 조작\"| Sim[\"해당 simulator runtime 검사\"]\n    Change -->|\"UI\"| UI[\"served app + refresh / reconnect / replay\"]\n    Change -->|\"문서\"| Docs[\"링크 / 경로 / Make dry-run / KB 무결성\"]\n    Unit --> Evidence[\"실행 조건과 결과 원본 보존\"]\n    Package --> Evidence\n    ROS --> Evidence\n    Sim --> Evidence\n    UI --> Evidence\n    Docs --> Evidence\n```\n\n아래 표에서 변경 범위에 맞는 명령을 선택합니다. Simulator, mock 통과는 해당 입력과 backend의 증거이며, 실물 검증은 별도로 수행합니다.\n\n| 변경 범위 | 명령 | 확인 범위 |\n|---|---|---|\n| 전체 ROS workspace | `make test` | build, colcon package test와 결과 집계 |\n| Mission, Gateway core | `make test-mission-core` | ROS 없는 lifecycle, 영속성, 중복, 재전송 |\n| Mock 조작 core | `make test-manipulation-core` | 서버 실행, 취소, 영속 기록과 모니터 |\n| Mission과 Mock Action | `make test-mission-mock BASE_TEST_ROS_DOMAIN_ID=186` | 공통 타입, Action, 조회, 취소와 재시작; 주행은 Mock |\n| Gazebo와 Mock Action | `make test-gazebo-manipulation BASE_TEST_ROS_DOMAIN_ID=186` | Nav2 도착과 정지, 두 수거, 추가 빈 관측과 보고 |\n| Mission ROS 설치, 연동 | `make test-mission-runtime` | 관련 package build/test |\n| Supervisor core | `make test-supervision-core` | ROS 없는 Fault, 허가, 복구, 영속성, Runtime 감독 port, 안전 증거 |\n| Supervisor와 Runtime 연동 | `make test-supervision` | Supervisor ROS graph와 실제 Runtime, base driver, safety adapter, lifecycle 복구의 E2E; 센서, Nav2와 안전 하드웨어는 합성. 장애→정지 지연을 `SUPERVISION_LATENCY_REPORT` 경로에 기록 |\n\nSupervisor 검사는 시연 프로필의 재기동 통신 복구도 포함한다. 원인이 기록된 통신\nFault만 base 정지와 fresh health 이후 해제하고, 오래된 피드백, 실제 고장, 원인 미상\n상태, 미확인 목표 정지 및 기본 수동 정책은 계속 차단하는지 검사한다. ROS E2E는\n실제 base driver와 합성 MCU를 사용해 단절, 재연결, Supervisor 재기동 순서를 검증하며\n물리 USB 차단이나 실제 정지 성능 검증과 구분한다.\nBase driver의 `test_stop_retry.py`는 STOP 3회 유실 후 동일 sequence의 ACK를 확인하고,\nwatchdog 정지와 알 수 없는 MCU Fault를 구분한다. 어느 경우에도 복구를 위한\nENABLE 명령이 나가지 않아야 한다.\n\n위치 정합 검사는 `cleany_navigation/test/test_localization_alignment.py`와\n`test_localization_guard_ros.py`에 있다. 작은 공분산의 잘못된 pose, 지도 회전,\n정합 미확인, 가벼운 불일치 중 lease 유지와 감속, 회복/개선 중단/최대 대기 시간,\n높은 공분산에서의 탐색과 재검증, 제한된 후보 탐색, 모호한 통로, 정지 미확인,\n동시 복구와 수동 초기 위치 선점을 확인한다. ROS 검사는 별도 domain의 실제 Guard와 Supervisor에 합성\nLiDAR·AMCL 응답을 연결하며 물리 위치 정확도 검증과 구분한다.\n\n기존 주행 기록의 위치 정합 정책 비교는 ROS 환경에서\n`tools/validation/validate_recorded_localization.py --help`로 실행 인자를 확인한다.\n`--bag`에는 원본과 진단 DB가 포함된 완료된 bag 폴더를 반복 지정한다.\n`--settings`는 비교할 localization 설정, `--old-source-tar`는 이전 정지 정책의\n소스 스냅샷, `--draft-source`는 비교할 수정 전 감속 정책 Python 파일이다.\n`--output`은 데이터 루트의 해당 실행 폴더로 지정한다. 도구는 원본 DB를 읽기 전용으로\n열고 해시를 전후 비교하며, DDS domain 196에서 실제 Guard를 재생한다.\n기록된 AMCL·TF를 고정한 비교이므로 변경한 속도로 이동했을 때의 위치 정확도와\n최적 감속 비율을 입증하지 않는다. 기록에 없는 initialpose는 AMCL 수신 로그로\n보수적으로 신뢰를 초기화하며, 센서 저장 주기와 입력 누락을 그대로 반영한다.\n\n기록된 정합 점수 자체의 시간 그래프는\n`tools/validation/plot_localization_history.py --bag BAG --end ISO_TIME --minutes 10 --output RUN_DIR`\n로 생성한다. 종료 시각에는 시간대를 포함한다. 읽기 전용 DB 트랜잭션으로\n위치 정합, 출력 속도 명령과 목표 취소 기록을 추출하고 PNG, PDF, CSV와 HTML을 저장한다.\n점수를 재계산하지 않으며 수신 공백과 오래된 점수는 그래프에서 연결하지 않는다.\n\n복구 하한과 판정 흐름 비교는 `tools/validation/localization_policy_experiment.py`에\n`--bag`을 반복 지정하고 `--output RUN_DIR`로 실행한다. 기록 중인 DB는 먼저\nSQLite backup으로 고정하며 필요하면 `--end UNIX_SECONDS`로 범위를 제한한다.\n원본 지도와 인과적 TF로 정지 관측 창을 구성하고, 위치·방향 오차를 전체 참조\n스트림에 유지한 채 기존 하한과 구조 변경 후보를 비교한다.\n`tools/validation/report_localization_policy_experiment.py RUN_DIR`는 HTML, CSV와\n그래프를 만든다. 도구 검사는 `tests/tools/test_localization_policy_experiment.py`에 있다.\n기록된 AMCL은 실측 정답이 아니며, 재초기화 후의 AMCL이나 물리 복구 성공률은\n이 실험으로 입증하지 않는다. 실행 프로필은 자동으로 변경하지 않는다.\n\n| 변경 범위 | 명령 | 확인 범위 |\n|---|---|---|\n| Navigation core, plugin | `make test-navigation` | Python core와 C++ plugin |\n| 합성 Navigation runtime | `make test-navigation-runtime` | ROS lifecycle, goal, 취소, sensor 단절 |\n| Gazebo, Navigation | `make test-gazebo` | package 검사와 C++ plugin; 선택 runtime은 제외 |\n| Gazebo sensor runtime | `make test-gazebo-nav-runtime` | 실제 simulator의 sensor, odom, TF |\n| 시설 목표 생성 | `make test-gazebo-facility-tools` | simulator 없는 ID, 여유, 제거 의자 처리 |\n| MuJoCo | `make test-mujoco` | scene loader; 모든 조작 runtime을 뜻하지 않음 |\n| Mock Manipulation Action | `make test-manipulation` | ROS Action, 취소, 조회와 재시작 복구 |\n| MuJoCo BT 경계 | `make test-manipulation-bt` | native BT, Action, 관련 인식과 수거 회귀; 실제 물리 수거 성공은 별도 |\n| Hand-eye 경계 | `make test-handeye` | description, MuJoCo, MoveIt, calibration |\n| Base ROS | `make test-base` | interface, driver, odometry; mock MCU |\n| ESP32 준비, motor core | `make test-micro-ros-setup test-motor-core` | Python 준비 도구와 장치 없는 C++ |\n| Logger | `make test-logger` | CLI 정책 편집과 종료 코드, 기록 정책, 읽기 전용 archive, 디렉터리 독점, 세션과 복구 경계 |\n| 매핑 원본 bag 도구 | `python3 -m pytest tests/tools/test_mapping_bag_recorder.py` | 센서 토픽 선택, 기존 bag 보존, native recorder 종료와 flush |\n| Monitor와 Logger | `make test-dev-monitor` | Logger 검사와 ROS 수집, 저장, HTTP와 UI 데이터 경계 |\n| Telemetry | `make test-telemetry` | odom relay |\n| CI 준비 도구 | `make test-ci-tools` | 의존성 이미지 무효화, build context와 명령 전달 |\n\nFedora에서는 `make test-hardware-mapping-core`를 호스트에서 실행합니다. Python 검사는 Humble Distrobox에서 ROS 설치 환경과 `BASE_TEST_ROS_DOMAIN_ID`를 사용하고, 버튼 입력 검사는 호스트 Node.js에서 실행합니다. Navigation의 Python 묶음은 격리 ROS lifecycle과 센서 신선도 검사를 포함하므로 CTest 실행 한도를 300초로 둡니다. 개별 검사 내부의 판정 시간과 임계값은 별도로 유지합니다.\n\nFedora에서는 native ROS target을 Humble Distrobox에서 실행합니다. `test-micro-ros-setup`, `test-motor-core`는 Makefile의 `BASE_EXEC`가 환경을 선택합니다.\n\nCI는 `PYTEST_DISABLE_PLUGIN_AUTOLOAD=1`로 runtime 의존성이 설치한 외부 pytest plugin의 자동 로드를 끕니다. 프로젝트의 `conftest.py`와 pytest 기본 plugin은 유지하며, 로컬에서는 `PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 make test`로 같은 설정을 적용합니다.\n\n`make test`는 package test가 실패해도 `colcon test-result --verbose`로 실패 상세를 출력하고 실패 상태를 반환합니다.\n\n## CI 실행과 재사용\n\nCI는 Ubuntu 22.04 amd64에서 모든 PR의 전체 workspace 검사, ESP32 motor core, 합성 Navigation runtime과 Gazebo sensor runtime을 실행합니다. 베이스의 pytest는 colcon에 직접 등록하며 전체 workspace 검사에서 한 번 실행합니다. Navigation과 Gazebo runtime은 같은 실행에서 이미 빌드한 workspace를 사용합니다.\n\n| 재사용 대상 | 갱신 조건 | 검증 경계 |\n|---|---|---|\n| GHCR 의존성 이미지 | 모든 `package.xml`, rosdep YAML, `containers/ci/`, 이미지 준비 도구, platform 변경 | ROS, apt, pip 의존성만 포함하며 응용 소스와 빌드 결과는 포함하지 않음 |\n| ccache | compiler 내용, 소스, header와 옵션에 따라 hit/miss 결정 | 빌드 명령은 매번 실행하며 CTest/pytest 결과는 캐시하지 않음 |\n| 같은 실행의 workspace | 전체 빌드 완료 후 runtime 검사에서 재사용 | 다른 실행의 `build/`, `install/`, test result는 복원하지 않음 |\n\n이미지가 없거나 pull할 수 없으면 고정한 저장소 snapshot과 Python 버전으로 이미지를 만든 뒤 전체 검사를 실행합니다. 같은 저장소의 실행은 환경 확인 후 의존성 이미지를 게시합니다. 응용 테스트의 성공 여부와 별개로 의존성 이미지와 compiler cache를 보존해 실패 수정 시에도 재사용하며, 다음 실행의 전체 검사와 실패 판정은 그대로 유지합니다. Fork PR은 이미지를 게시하지 않습니다. 매주 월요일 실행도 동일한 의존성 이미지를 재사용합니다.\n\n기준은 2026-11-02에 조회한 Jetson의 system Python과 설치된 ROS 패키지입니다.\n[repository-snapshots.env](../../containers/ci/repository-snapshots.env)는 Ubuntu와 ROS 저장소의 시점을,\n[pip-constraints.txt](../../containers/ci/pip-constraints.txt)는 MuJoCo와 google-genai 및 전이 의존성 버전을 고정합니다.\n베이스에 이미 설치된 ROS 패키지도 선택한 snapshot으로 갱신한 뒤 workspace 의존성을 설치합니다.\nCI는 설치 후와 검사 시작 전에 [버전 검사](../../containers/ci/verify-versions.py)를 실행합니다.\n공통 ROS 패키지는 아키텍처별 빌드 시각을 제외한 upstream 버전을 비교하며,\nJetson에만 설치된 패키지를 CI에 추가로 설치하지 않습니다. JetPack, GPU 라이브러리와 실물 동작은 이 검사 범위가 아닙니다.\nBT.CPP `4.9.1`의 amd64 패키지는 라이브러리 설치 위치와 CMake 검색 경로가 달라, CI 이미지에서 같은 바이너리를 가리키는 호환 링크를 추가합니다.\n\n외부 의존성 갱신은 snapshot, Python constraints와 Jetson ROS 버전 기준을 명시적으로 변경하고 전체 CI로 검증합니다.\nDockerfile의 `DEPENDENCY_REVISION`만 올리면 같은 버전으로 이미지를 다시 만들며 패키지 버전은 갱신하지 않습니다.\n저장소와 서명 키 갱신은 [ROS snapshot 안내](https://github.com/ros2/ros2_documentation/blob/rolling/source/Get-Started/Installation/Snapshot-Repository.rst)와 [Ubuntu snapshot 안내](https://snapshot.ubuntu.com/)를 따릅니다.\n\n패키지 빌드는 최대 2개, 패키지 내부 컴파일은 runner CPU 수의 절반으로 제한해 두 병렬화 계층의 경합을 줄입니다. 최적화 수준은 기존 `RelWithDebInfo`를 유지합니다. 모델 검사에서는 같은 인자의 xacro 출력 bytes만 재사용하고 각 검사는 독립 XML tree를 받습니다.\n\n`MAKEFLAGS`도 함께 지정해 colcon이 전체 CPU 수의 `-j` 옵션으로 CMake의 병렬 제한을 덮어쓰지 않도록 합니다.\n\nCI artifact에는 test XML, 실패 로그, 설치된 apt/pip 버전과 ccache 통계를 남깁니다. 속도는 이미지 생성과 compiler cache miss가 있는 최초 실행, 이미지와 cache를 재사용하는 실행으로 구분해 비교합니다. 이미지 pull과 cache 복원 시간도 포함한 GitHub job 전체 시간을 기준으로 판단합니다.\n\n전체 job 제한은 40분이며 이미지 생성은 별도로 15분 안에 완료해야 합니다.\nAPT는 서명을 검증한 snapshot index에서 버전, 파일 경로와 SHA256을 결정합니다.\nUbuntu 패키지 파일은 동일한 pool 경로의 archive 미러에서 먼저 받고, 없거나 검증에 실패하면 원래 snapshot에서 받습니다.\n다운로드는 4개씩 수행하고 SHA256과 크기가 일치하는 파일만 APT cache에 보관하며 설치 시 APT가 다시 검증합니다.\n미러의 최신 index나 다른 버전으로 대체하지 않습니다.\n연결 timeout은 15초, 파일 다운로드는 60초, 한 설치 명령의 다운로드 준비는 5분으로 제한합니다.\nAPT 자체 재시도는 1회, 의존성 준비 명령은 10초 대기 후 최대 2회 실행합니다.\n계속 실패하면 CI를 실패 처리합니다. 빌드와 테스트는 이 재시도 대상에 포함하지 않습니다.\n\n## 선택 runtime과 UI\n\n### 카메라 영상 수집\n\n현재 workspace를 빌드한 뒤 `tools/validation/capture_cameras.py`로 실제 ROS\n카메라 영상을 수집합니다. 각 출력 경로는 아직 없는 새 디렉터리여야 합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/local_setup.bash\"\npython3 tools/validation/capture_cameras.py --backend mujoco \\\n  --output /absolute/new-camera-run/mujoco\npython3 tools/validation/capture_cameras.py --backend gazebo --gazebo-model cad-with-arms \\\n  --output /absolute/new-camera-run/gazebo\nPYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q tests/tools/test_capture_cameras.py\n```\n\nGUI가 없는 환경에서는 촬영 명령 앞에 `xvfb-run --auto-servernum`을 붙입니다.\nVM에서 GPU 렌더링이 불안정하면 `LIBGL_ALWAYS_SOFTWARE=1`을 지정합니다.\nGazebo의 `--gazebo-model legacy`로 레거시 모델도 선택할 수 있습니다.\n\n도구는 head와 양손목 영상의 크기, encoding, frame, buffer 및 시뮬레이션 clock과\n상태 메시지를 확인하고 PNG, `report.json`, `launch.log`를 남깁니다. 누락, timeout과\n조기 종료는 실패 코드로 보고하고 실행한 프로세스 그룹을 종료합니다. 촬영 성공은\n전체 집기 미션의 성공을 뜻하지 않습니다. 기본 CAD 주행 프로파일은 팔을 제외하며,\n`cad-with-arms`는 촬영 검증에만 팔을 포함합니다.\n\n### 선택 실행 조건\n\nGazebo package의 `--run-sim-runtime`, `--run-evaluation-tests`와 Mission core의 `CLEANY_RUN_ROS_TESTS=1`은 별도로 활성화하는 검사입니다. 실행 결과에서 통과와 skip을 구분합니다.\n\nLogger의 `CLEANY_RUN_ROS_TESTS=1 make test-logger`는 native rosbag2의 활성 읽기,\n센서와 진단 bag 분리, CDR 조회, 합산 용량과 ZIP 내보내기도 검사합니다.\n실물 ROS domain과 분리해서 실행하며, 이 검사는 실물 주행의 누락률이나\n시간당 저장 용량을 보장하지 않습니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nROS_DOMAIN_ID=82 CLEANY_RUN_ROS_TESTS=1 make test-mission-core\n```\n\nLogger 독립 녹화 검사는 빌드 overlay를 source한 뒤 빈 출력 경로에서 실행합니다.\nlogger와 Monitor를 별도 프로세스로 띄우고 합성 경로, 카메라와 점군을 발행합니다.\nMonitor 종료 전후의 같은 세션에서 SQLite 증가, rosbag2 원문과 stamp, Monitor 재접속,\nHTTP 시작과 정지, logger 단절과 writer 대체 금지를 확인합니다. 실제 로봇 구동과\n센서 성능 검증은 포함하지 않습니다.\n\n```bash\nROS_DOMAIN_ID=218 ROS_LOCALHOST_ONLY=1 make test-logger-independence \\\n  LOGGER_TEST_OUTPUT=/absolute/new-logger-run LOGGER_BASE_COMMIT=\u003cbase-commit>\nCLEANY_RUN_ROS_TESTS=1 ROS_DOMAIN_ID=217 ROS_LOCALHOST_ONLY=1 make test-dev-monitor\n```\n\nCLI 실제 연결 검사는 logger를 별도 프로세스로 띄우고 설치된 `logger` 실행 파일로\n조회, 토픽 설정, 시작과 정지를 호출합니다. 합성 경로와 이미지를 native bag에서\n다시 읽으며 CLI 종료 후 녹화 유지, 활성 설정 거부, 세션 보호와 연결 실패를 확인합니다.\n\n```bash\nROS_DOMAIN_ID=219 ROS_LOCALHOST_ONLY=1 make test-logger-cli \\\n  LOGGER_TEST_OUTPUT=/absolute/new-cli-run LOGGER_BASE_COMMIT=\u003cbase-commit>\n```\n\nMonitor smoke는 같은 domain에서 Monitor를 먼저 실행한 뒤 호출합니다.\n\n```bash\nROS_DOMAIN_ID=187 python3 ros2_ws/src/cleany_dev_monitor/runtime_test/smoke.py --output /absolute/new-run\n# frontend의 현재 Playwright 설정과 package scripts:\ncat ros2_ws/src/cleany_dev_monitor/web/package.json\n```\n\nFrontend 검사는 `ros2_ws/src/cleany_dev_monitor/web`에서 `pnpm exec tsc --noEmit`과 `pnpm exec playwright test`를 실행한다. 실제 Monitor가 필요한 검사는 `MONITOR_URL`을 지정하고 해당 ROS 입력도 준비한다. 기본 fixture 검사는 로컬 Vite를 시작한다.\n\nUI 변경은 실제 served app에서 새로고침, 재연결, 기록 재생까지 확인합니다. Playwright browser가 없으면 configured browser를 설치한 뒤 다시 실행합니다.\n\nMission Gateway smoke는 `tests/integration/mission_runtime/`, Monitor smoke는 `ros2_ws/src/cleany_dev_monitor/runtime_test/`에 있습니다. 실제 Backend, ROS, Gazebo 입력 조건을 준비한 경우에 명시적으로 실행합니다.\n\n## 결과와 증거\n\n| 증거 | 의미 |\n|---|---|\n| 소스, manifest, 단위 검사 | 구현과 검사된 입력의 계약 |\n| mock / 합성 ROS | 합성 backend의 lifecycle과 메시지 경계 |\n| Gazebo, MuJoCo runtime | 해당 simulator, 입력, 버전의 동작 |\n| 장치 통신 | 실제 USB, UART, DDS 등 확인한 계층 |\n| 물리 시험 | 실제 sensor, actuator, 정지, 시나리오 결과 |\n\n결과에는 다음 항목을 남깁니다.\n\n- Code commit와 dirty 상태, 환경, overlay\n- 입력, config, asset hash\n- 요청 범위와 실제 완료 범위, 실패, skip, 중단\n- 로그와 출력 위치\n\nCTest wrapper와 pytest 집계가 겹치면 중복 합산하지 않습니다. 변경별 검증 결과는 PR과 CI 결과에 남깁니다. 별도 보고서나 대용량 원본을 공유할 때는 팀이 합의한 위치와 접근 방법을 함께 안내합니다. 개인 로컬 출력 경로만으로 팀이 결과를 재현할 수 있다고 가정하지 않습니다.\n\n## 문서 변경 검사\n\n내부 파일 링크, anchor, 코드, 설정, launch 경로, Make target의 존재와 native dry-run을 확인합니다. 문서 검증만을 위해 실제 로봇을 움직이거나 새 calibration을 수행하지 않습니다.\n\nKB를 변경한 경우에는 KB의 `kb-quality-checks`도 실행합니다. 검사 통과와 내용 승인은 별도로 기록합니다.\n\n## 실물 매핑 패키지 경계\n\n`make test-hardware-mapping-core`는 입력 lease, ordered permission의 MCU 확인, 스캔 필터,\n설정 검증, map origin yaw와 원자적 저장, 초기화 직렬화와 저장 실패를 검사한다.\n매핑 heartbeat 만료와 재수신, RPC 실패 원인 보존, 시작 실패의 로그 경로와 traceback,\n이벤트 파일 회전과 재시작 보존, 큐 포화와 디스크 장애도 검사한다.\n`make test-base BASE_TEST_ROS_DOMAIN_ID=174`는 기존 base 회귀와 새 구동 허가 계약을 검사한다.\nROS graph 검사는 같은 domain에서 동시에 실행하지 않는다.\n\n설치된 패키지의 모의 통합은 다음 명령으로 실행한다. 새 출력 디렉터리를 지정한다.\n\n```bash\nmake build-hardware-mapping\nmake test-hardware-mapping-runtime MAPPING_TEST_OUTPUT=/absolute/path/to/new-artifact-dir\n```\n\n이 검사는 domain 173에서 synthetic MCU와 합성 LiDAR를 사용한다. 저장소 밖 `/tmp`에서\n설치된 launch를 시작하고 단일 휠 publisher, 휴대폰 명령/해제, 지도 초기화와 중복 요청,\n두 세션의 map/pbstream 및 Logger bag, 최종 저장 후 종료를 확인한다. 관리자 종료 후 ROS\n상태 만료와 조종 이벤트 파일 저장도 확인한다. 실물 USB는 열지 않는다.\n물리 정지 거리, 현재 장착 TF의 정확도와 실제 바닥에서의 지도 품질은 별도 실물 검사다.\n\n`make test-hardware-mapping`은 관련 ROS 패키지를 domain 174에서 순서대로 검사한다.\nBase graph fixture는 BASE_TEST_ROS_DOMAIN_ID도 따르므로 두 domain 변수를 함께 설정한다.\n위 통합 결과의 bag은 domain 175에서 실제 ROS 재생으로 확인할 수 있다.\n\n```bash\nmake test-hardware-mapping-replay \\\n  MAPPING_BAG=/absolute/path/to/recordings/bags/session-id \\\n  MAPPING_TEST_OUTPUT=/absolute/path/to/replay-verification.json\n```\n\n## ToF와 Supervisor 통합\n\n`make test-tof-core`는 거리 투영, 평면 fit, 제동 envelope, timeout과 navigation 경로의\n순수 검사를 실행한다. `make test-tof`는 interface, ToF, Mission, safety adapter와\nSupervisor를 빌드하고 패키지 검사를 실행한다. ToF ROS 검사는 독립 DDS domain의 합성\nframe/odom/lease와 pseudo-terminal을 사용하며 실제 센서나 모터를 열지 않는다.\n\n기존 navigation C++/Python 회귀 검사는 Humble 환경에서 `make test-navigation`으로\n실행한다. Mission의 선택 ROS 시나리오는 `CLEANY_RUN_ROS_TESTS=1`과 독립\n`ROS_DOMAIN_ID`에서 별도 실행한다. colcon의 선택 시나리오 skip은 성공으로 해석하지 않는다.\n실물 검증 항목은 [CALIBRATION](../CALIBRATION.md#tof-근접-보호-commissioning)을 따른다.\n\nToF 분류 회귀에는 단독 보드 로그의 3개 frame과 합성 입력을 사용한다. 정상 미검출의\n주행 허용, 부분 품질 불량 제외, 전부 불량 정지, 인접/물리 cluster, 15Hz 지속 확인,\nflash/고립 noise, 비상 단일 검출, 해제 hysteresis와 필터 reset을 검사한다. ROS 검사는\n센서 fault와 stale 정지, 일부 불량 Zone의 책상 접근, 평면 소실과 기존 lease/cancel 경계를\n검사한다. Navigation은 ToF 활성 여부와 독립 head-pan observer 설정 조합을 검사한다.\n합성 graph는 기존 안전 chain을 identity로 대체하며 실제 Nav2/모터 주행이 아니다.\n\n원본 측정 로그를 ROS 개발환경에서 오프라인 감사하려면 다음을 사용한다. 장치를 열지 않는다.\n\n```bash\nPYTHONPATH=\"$PWD/ros2_ws/src/cleany_tof\" python3 tools/validation/tof/replay.py \\\n  /absolute/path/to/range-15hz-2min.jsonl --output /absolute/path/to/audit.json\n```\n\n\n## 얼굴 디스플레이\n\n상태 로직은 Jetson의 독립 설치 폴더에서 `make test`로 검사한다. 저장소의 `make test`가 실행하는 colcon 검사에도 같은 pytest가 등록된다.\n\nROS→HTTP 전환, 결과 수량과 연결 복구는 구현 레포 루트에서 다음 명령으로 검사한다. `/cleany_display_validation/` 토픽과 domain 173을 사용하며 로봇 제어기는 실행하지 않는다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource /home/cleany/cleany-display/ros2_ws/install/local_setup.bash\nROS_DOMAIN_ID=173 python3 tools/validation/verify_cleany_display_ros.py \\\n  --config /home/cleany/cleany-display/config/display.json \\\n  --output output/cleany-display-jetson/ros-verification.json\n```\n\n브라우저 검사는 [Dev Monitor 웹 의존성](../DEVELOPMENT_SETUP.md#monitor-웹)과 로컬 Chrome을 설치한 구현 레포에서 `node tools/validation/verify_cleany_display_web.cjs`로 실행한다. 7개 표정의 60fps와 Zzz 주기, 화면 비율과 720p 상한, 설정 변경, 60.01Hz 입력에서 균등한 30fps 간격, 동일 상태의 DOM 변경 부재, 모션 감소 설정과 HTTP 복구를 검사한다. 결과는 Git에서 제외한 `output/cleany-display-jetson/`에 기록한다.\n\n전환 검사는 같은 환경에서 `node tools/validation/verify_cleany_display_transitions.cjs`로 실행한다. HTTP 상태를 바꾸면서 60Hz 프레임을 제어해 깜빡임의 연속성, 눈과 입의 중간 모양, 얼굴 위치, 땀방울과 Zzz의 사라짐을 확인한다. 안내 교체 중 추가 상태 수신, 도움 요청과 일반 안내의 겹침, 모션 감소 설정도 검사한다. 결과와 중간 프레임은 `output/cleany-display-jetson/transitions/`에 기록하며, 실제 장치의 프레임 성능 측정과 구분한다.\n\n실물 성능 측정은 Jetson에서 다음 순서로 실행한다.\n\n1. `systemctl --user set-environment CLEANY_DISPLAY_DEBUG_PORT=9223`과 `systemctl --user restart cleany-display-kiosk`로 전용 브라우저의 로컬 디버깅 포트를 연다.\n2. 설치 폴더의 `browser-tools/bin/python`으로 `tools/validation/measure_cleany_display.py --output \u003c결과.json>`을 실행한다. `--modes idle moving checking collecting complete charging help`를 추가하면 브라우저 응답만 임시로 바꿔 표정별로 측정하고 실제 ROS 상태 화면으로 복구한다.\n3. 측정 종료 후 `systemctl --user unset-environment CLEANY_DISPLAY_DEBUG_PORT`와 키오스크 재시작으로 디버깅 포트를 닫는다.\n\n결과의 `frames.canvas.fps`는 실제 캔버스 렌더링 빈도이고 `frames.raf.fps`는 브라우저 콜백 빈도다. CPU 수치는 단일 코어 기준이며 GPU 사용률이 아니다. 실물 화면, 장시간 동시 운용과 재부팅 후 자동 시작은 별도 검증한다.\n## MoveIt 충돌 형상과 MuJoCo 동등성 검사\n\n`make test-description-models`는 ROS 2와 MuJoCo, NumPy, SciPy 환경에서\n원본 URDF와 MJCF의 동등성 및 최적화 충돌 자산을 검사합니다.\n원본 대조에는 `optimized_arm_collision_meshes:=false head_collision_meshes:=false`를\n명시하고, 기본 최적화 모델에는 시각 형상, 관성, 관절 보존과 모터 충돌 메시\n배치를 검사합니다. MuJoCo 물리 접촉 형상은 기존 MJCF를 유지하며,\n시뮬레이션의 MoveIt 경로 계획은 최적화 URDF를 사용합니다.\n`COLLISION_TEST_ARGS`로 `-k`와 `--junitxml` 등을 전달할 수 있습니다.\n\n## 충돌 메시와 내부 장애물 검사\n\n```bash\nmake build COLCON_BUILD_ARGS=\"--packages-up-to cleany_moveit_config\"\nmake test-moveit-collision\n```\n\n첫 명령은 description, 충돌 플러그인과 기존 scene mapping 의존성을 함께\n빌드합니다. Jetson의 MoveIt 2.5.9 전용 환경을 사용하는 경우 해당 overlay를\n먼저 source합니다. 검사 시 불러오는 설치 경로는 `INSTALL_BASE`를 따릅니다.\n\n`test-moveit-collision`은 형상 검사, SolidFCL 단위 검사, 계획 설정 및 실제\nMoveIt 서비스 검사를 실행합니다. 서비스 검사는 기본 detector가 내부 장애물\n36개를 검출하는지, 같은 입력을 표면 FCL이 놓치는지와 존재하지 않는 detector를\n선택했을 때 프로세스가 종료하는지 확인합니다. 가상 장애물만 사용하고\ntrajectory execution은 끄며 모터 드라이버를 실행하지 않습니다.\n\n병행 지도 확장 도구의 원점 변환과 지도 저장 형식은 ROS Python 환경에서\n`PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q tests/tools/test_map_extension.py`로 검사한다.\n실행 시 `/map`과 `/tf` 발행자에 확장 Cartographer가 없는지, `/map_extension/map`\n및 `/map_extension/tracked_pose`가 수신되는지 확인한다. 실물 확장 품질은\n연결 통로 왕복 관측과 복귀 시 벽 정합으로 별도 평가한다.\n\n### 순정 Lattice와 Phone Omni MPPI 비교\n\n`tools/validation/native_lattice_mppi`는 설치된 Smac Lattice와 통합 MPPI를 격리 실행한다. 실제 로봇에 속도를 발행하지 않는다. 입력 폴더에는 `map.txt`(크기, 해상도, 원점), `map.bin`(Nav2 cost byte 배열), `poses.txt`(시작/목표 x y yaw)가 필요하다. 설정은 controller_server, planner_server와 local_costmap의 합성 YAML이다.\n\n```bash\ncmake -S tools/validation/native_lattice_mppi -B /tmp/cleany-lattice-validation\ncmake --build /tmp/cleany-lattice-validation -j2\npython3 tools/validation/native_lattice_mppi/compare.py \\\n  /tmp/cleany-lattice-validation/closed_loop \u003cartifact-root> \u003cconfig-stem> \u003ccase> [\u003ccase> ...]\n```\n\n각 `\u003ccase>`는 입력 폴더이고 `\u003cconfig-stem>.yaml`을 읽어 결과와 초기 경로 및 20Hz 명령을 저장한다. `--preview-goal`은 웹 UI처럼 최초 미리보기 끝점을 실제 이동 목표로 선택한다. 격리 domain은 188이며 운영 domain과 같으면 실행하지 않는다. 시험은 1Hz 재계획, 1.5m 지역 경로와 이상적 평면 운동 적분을 사용한다. 실제 PathHandler의 TF/지역 지도 갱신, AMCL 오차, 통신 지연, 모터 응답과 슬립은 재현하지 않는다. 120초 시뮬레이션 시간 안에 반환 경로 끝점의 3cm/0.1rad 이내 도착과 footprint 충돌 여부를 검사하며, 클릭 목표와의 오차도 별도로 출력한다. 이것은 실물 주행 성공 근거가 아니다.\n\n`balance_primitives.py SOURCE DESTINATION`은 직선 primitive의 좌표를 변경하지 않고 길이 metadata를 재계산한다. `test_phone_profile.py`는 번들 원본과의 차이가 오른쪽 횡이동 16개의 길이 필드뿐인지, 모든 직선 길이가 기하와 일치하는지 검사한다.\n\n\n고정 방향 비용은 `mppi_critics_tests`의 `Directional*` 및 `mppi_critic_manager_test`로\n부호 대칭, 동일 거리의 각도별 비용과 봉우리, 시간 적분, DiffDrive 무효화, 플러그인 로딩을 확인한다. `test_slip_context.py`는\n과거 TF/명령 선택, stale/null, bounded history와 지도 식별을 검사한다.\n`cleany_logger/tests/test_logger_policy.py`는 문맥 토픽의 기록/제외/재매핑을 검사한다.\n`tools/validation/native_lattice_mppi/compare.py`의 격리 실행은 실제 planner/controller와\n이상적 운동학의 도착 및 명령 한계를 검사하며 실제 슬립 개선 증거로 사용하지 않는다.\n\n\n`tools/validation/slip_context_recording.py --output \u003c새 결과 폴더>`는 설치된 logger에\n합성 String 메시지를 보내고 저장된 CDR을 다시 읽어 문맥을 비교한다. hardware domain 0에서는\n실행을 거부한다. runner 환경 설정 뒤 별도 `ROS_DOMAIN_ID`를 지정해 실행한다.\n\n\n### 기록된 Nav2 조건과 MPPI reset 검사\n\n`tools/validation/native_lattice_mppi/extract_bag_fixture.py`는 bag의 지정 시각 이전에\n수신된 global costmap, odom, plan과 map→odom TF를 읽어 정적 과제를 만든다.\n수신 시각과 header의 미래 값, 오래된 입력, 좌표계 불일치를 거부한다. OccupancyGrid의\n손실 압축을 역변환할 때 각 비용 구간의 상한을 사용하고 lethal과 unknown을 보존한다.\n`tests/tools/test_bag_navigation_fixture.py`는 이 비용 변환과 SE(2) 합성을 검사한다.\n\n`compare.py`의 폐루프는 정적 비용 지도에서 정지 출발하는 이상적 운동 모사다.\n실제 scan의 시간 변화, SLAM/AMCL 오차, BT 복구, 마찰과 슬립을 재현하지 않는다.\n`--preview-goal` 사용 시 반환된 Lattice 끝점을 도착 기준으로 사용하고 요청 좌표와의\n오차를 별도로 기록한다. 실패한 과제도 결과에 보존해야 한다.\n\n`noise_reset_probe`는 1000×60 후보의 reset 직후 잡음과 실행 시간을 100회 측정한다.\n`mppi_noise_generator_test`는 비동기 생성 요청과 reset이 겹칠 때의 완전한 첫 묶음,\n운동 모델 전환, 독립 controller 난수열과 종료를 검사한다. ROS domain은 실제 로봇과\n분리한다. 헤더의 객체 배치가 바뀌면 비교용 바이너리도 해당 라이브러리와 함께 재빌드한다.\n\n메모리 사용을 제한하는 격리 빌드는 패키지 수와 C++ 컴파일 작업 수를 모두 제한한다.\n`CMAKE_BUILD_PARALLEL_LEVEL`은 CMake `-D` 인수가 아니라 환경 변수다.\n\n```bash\nCMAKE_BUILD_PARALLEL_LEVEL=2 MAKEFLAGS=-j2 make build \\\n  CLEANY_BUILD_ROOT=/path/to/isolated-build \\\n  COLCON_BUILD_ARGS='--packages-select cleany_navigation --parallel-workers 1'\n```\n\n\n## D435 높이 필터 검증\n\nROS 환경에서 `python3 -m pytest -q ros2_ws/src/cleany_navigation/test/test_depth_obstacles.py ros2_ws/src/cleany_navigation/test/test_depth_obstacle_preview_transport.py`로\n높이 경계, 기울어진 관측 바닥과 독립적인 고정 하한, TF 소실 시 오래된 점군 제거를 확인한다.\n실물 미리보기가 실행 중이면 `python3 tools/validation/probe_depth_obstacle_cutoff.py --min-z .192 --output /path/to/run/live-check.json`으로\n신선한 비어 있지 않은 출력의 좌표계와 최소 높이를 확인한다. 이 검사는 물체 검출률이나 주행 안전성을 입증하지 않는다.\n\n## 실물 depth costmap과 Monitor 격리 회귀\n\n`test_depth_local_costmap.py`는 ROS domain 192에서 설치된 VoxelLayer의 표시, 관측 밖 유지, 빈 공간 재관측 후 제거를 검사한다. `test_phone_collision_monitor.py`는 domain 191에서 LiDAR와 depth 각각의 정지 우선순위, 절대 속도 상한, 필수 depth 중단 시 정지와 복구를 검사한다. 로봇 domain 0에 속도 명령을 보내지 않는다. `test_depth_transport.py`는 실제 형식의 깊이 메시지, 촬영 시각 TF, 무효 영상 차단과 floor clearing 보존을 검사한다. `test_phone_slip_launch.py`는 depth 옵션이 global costmap이나 slip 설정을 바꾸지 않는지 검사한다.\n\n```bash\npython3 -m pytest -q ros2_ws/src/cleany_navigation/test/test_depth_local_costmap.py ros2_ws/src/cleany_navigation/test/test_phone_collision_monitor.py ros2_ws/src/cleany_navigation/test/test_depth_transport.py ros2_ws/src/cleany_navigation/test/test_phone_slip_launch.py\n```\n\n격리 합성 입력 검사는 실물 의자 이동이나 실제 제동 거리의 검증과 구분한다. 실물에서는 조종 pause 상태에서 의자를 놓고 치운 관측과 costmap을 기록한 후 별도 주행 시험으로 진행한다.\n"},"esp32/README.md":{"title":"ESP32-S3 micro-ROS motor controller","body":"# ESP32-S3 micro-ROS motor controller\n\n```mermaid\nflowchart LR\n  Cmd[\"차체 Twist + 구동 허가\"] --> Driver[\"Base driver / 휠 변환\"]\n  Driver -->|\"wheel_command\"| MCU[\"ESP32 / PI · FF · watchdog\"]\n  MCU -->|\"wheel_state\"| Driver\n  Driver --> Odom[\"joint_states → wheel odometry\"]\n```\n\n[베이스 연결부터 확인](../docs/how-to/base.md) · [빌드와 장치 없는 검사](#1-빌드와-장치-없는-검사) · [업로드와 통신](#2-upload와-통신) · [실물 인수](#3-실물-인수)\n\nNative USB micro-ROS와 encoder, PWM/DIR로 4륜을 제어하는 펌웨어입니다. Target은 ESP32-S3 N32R16V(octal flash 32 MB / PSRAM 16 MB), PlatformIO environment는 `esp32-s3-microros`입니다. GPIO는 [PINMAP](PINMAP.md), 고정 버전은 `micro_ros.lock.json`에서 확인합니다.\n\n| 경로 | 역할 |\n|---|---|\n| src/ | firmware, motor core |\n| host_tests/ | 장치 없는 C++/Python 검사 |\n| scripts/ | PlatformIO, 고정 dependency bootstrap |\n| microros_smoke/ | micro-ROS/type-support 링크 검사 |\n| imu_calibration/ | MPU6050 정지 보정 진단과 USB JSON 결과 |\n| pcb/ | KiCad, 로컬 library |\n| micro_ros/, .venv/ | 생성 dependency, 빌드 도구 |\n\n도구 이동 후에는 `make firmware-setup`으로 Git wrapper 링크를 갱신합니다. Wrapper는 component root와 하위 폴더 clone 모두 revision을 고정합니다.\n\n## ROS 인터페이스\n\n노드 이름은 `cleany_motor_controller`, namespace는 기본 root입니다. [main.cpp](src/main.cpp)의 rclc entity 초기화를 기준으로 기록합니다.\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS와 주기 |\n|---|---|---|---|\n| 토픽 구독 | `base/wheel_command` | `cleany_base_interfaces/msg/WheelCommand` | Best-effort, volatile, keep-last 1 |\n| 토픽 발행 | `base/wheel_state` | `cleany_base_interfaces/msg/WheelState` | Best-effort, volatile, keep-last 1; 50 Hz |\n| 토픽 발행 | `base/imu_state` | `cleany_base_interfaces/msg/ImuState` | Best-effort, volatile, keep-last 1; 최대 100 Hz |\n\nMCU에 서비스와 액션은 없습니다. 구동 허가는 WheelCommand의 ENABLE/STOP으로 처리하고, ROS `base/enable` 서비스는 [base driver](../ros2_ws/src/cleany_base_driver/docs/interfaces.md)가 제공합니다. 전체 노드는 [ROS 인터페이스 색인](../docs/ROS_INTERFACES.md)에서 찾습니다.\n\n## Runtime\n\n```mermaid\nflowchart TB\n    Driver[\"ROS base driver\"] -->|\"base/wheel_command\"| USB[\"USB XRCE-DDS\"]\n    subgraph Communication[\"통신 task\"]\n        Callback[\"rclc callback\"] --> Mailbox[\"최신 명령 mailbox\"]\n        Ping[\"Agent ping / 재연결\"]\n    end\n    USB --> Callback\n    subgraph Control[\"motor task / 5 ms\"]\n        Gate[\"ENABLE / deadline 검사\"] --> PI[\"PI + feed-forward\"] --> PWM[\"PWM / DIR\"]\n        Encoder[\"Encoder feedback\"] --> PI\n        Encoder --> State[\"Wheel state\"]\n    end\n    Mailbox --> Gate\n    Ping -->|\"단절 시 STOP latch\"| Gate\n    PWM --> Motor[\"네 휠\"]\n    Motor --> Encoder\n    State -->|\"base/wheel_state\"| USB\n    USB --> Driver\n```\n\n통신 task는 USB, ROS entity, Agent 재연결을 관리합니다. Motor task는 독립적으로 5 ms마다 실행하며, `motorMutex` 안에서 명령을 검사하고 PWM을 갱신합니다. 부팅 시 PWM은 0이고 구동은 disabled입니다. Zero ENABLE을 받은 뒤 VELOCITY를 허용합니다.\n\n| 조건 | 처리 |\n|---|---|\n| STOP, 재연결 | Sequence high-water 유지 |\n| 거부된 명령, 반복 ENABLE | Deadline과 이동 목표를 갱신하지 않음 |\n| STOP latch | 대기 명령 삭제; 새 sequence로 오래된 ENABLE 차단 |\n| Deadline | 수신 후 최대 250 ms; 명령 처리 전에 검사 |\n| 만료, 단절 | 허가 해제; 재개에는 새 ENABLE 필요 |\n| STOP, 만료, 단절 | Controller reset과 PWM 0 요청 |\n| Agent ping 실패 | STOP latch → entity teardown → 재연결 |\n\n| 항목 | 값과 규칙 |\n|---|---|\n| Wheel ceiling, 목표 반올림 | 10 rad/s, 0.1 rad/s 단위 |\n| PWM | 20 kHz, 명령 슬루는 20 ms당 가속 1%p, 감속 3%p |\n| 방향 반전 | 측정 속도 ≤0.5 rad/s를 50 ms 유지한 뒤 DIR 변경 |\n| Wheel 배열 | FL/FR/RL/RR → PCB M1/M2/M4/M3, mapping `{0,1,3,2}` |\n| 극성, encoder | 극성은 MCU에서만 적용; 출력축 1회전=3172 counts |\n| State | 50 Hz, best-effort/volatile/keep-last-1 |\n| MCU 시간, Boot ID | Monotonic µs; reboot baseline 식별 |\n| USB | Agent용 framed XRCE-DDS 전용 |\n| Agent ping | 100 ms 주기, 20 ms timeout |\n\n메시지와 명령 수락 규칙은 [protocol v2](../ros2_ws/src/cleany_base_interfaces/docs/protocol.md)를 따릅니다.\n\n## Runtime MPU6050 telemetry\n\nThe motor image also acquires MPU6050 data on J_I2C1 (SDA GPIO41, SCL GPIO42),\nusing the existing driver: 100 kHz I2C, 100 Hz sensor sampling, ±250 deg/s gyro,\n±2 g accelerometer and 42 Hz gyro DLPF. Module/external I2C pull-ups are required.\n\nThe independent priority-2 acquisition task polls data-ready every 2 ms. It does\nnot take `motorMutex`. The priority-6 motor and priority-4 communication tasks\nremain separate. A one-entry overwrite queue drops intermediate data if\ncommunication stalls; reconnect does not drain a sample backlog.\n\nThe communication task publishes fixed-size `ImuState` on `base/imu_state`,\nbest effort / volatile / keep last 1, driven by newly acquired samples up to\nthe sensor rate. WheelState remains at 50 Hz. Actual rates and motor timing\nunder combined USB/I2C load require robot measurements.\n\nPackets carry uncalibrated sensor-frame SI vectors, temperature, MCU MAC,\nWHO_AM_I, boot ID, packet sequence, MCU acquisition timestamp and fault bits.\nImuState v2 also carries MCU-corrected gyro, the selected bias/covariance,\nand calibration state/reason. Build the ROS interfaces and firmware together.\nAcquisitions older than 100 ms and duplicate/backward timestamps are not sent\nas new measurements. Missing/error data produces a sensor-fault heartbeat\nat most 10 Hz; saturation has its own fault bit. Initialization/read errors\nretry with 250 ms to 5 s backoff. IMU I2C failure does not authorize motors.\n\n### Power-on calibration\n\nThe acquisition task calibrates once per MCU boot, independently of the Agent.\nDefaults are 5 s settling, 1,000 training samples and 500 holdout samples, with\na 25 s deadline. It reuses the existing online gyro statistics. Noise/residual\nfailure, sensor/sample errors or timeout select the saved bench coefficients.\nThe selection remains fixed until MCU reboot, including across Agent reconnects.\n\nDuring calibration, motor PWM stays zero, PID updates are skipped and non-STOP\ncommands are discarded. Completion only releases this inhibit; a fresh ENABLE\nis still required. STOP, watchdog and disconnect handling remain active.\nFallback can release the calibration inhibit even if the sensor is unavailable;\nsensor errors are still reported, and no angular-rate samples are fabricated.\n\nEdit [`ros2_ws/src/cleany_base_driver/config/imu_calibration.json`](../ros2_ws/src/cleany_base_driver/config/imu_calibration.json)\nto configure timing, windows, checks and measured fallback bias/covariance.\n`make firmware-build` validates it and generates `cleany_config/imu_startup_config.hpp`\ninside the PlatformIO build directory. The configuration is compiled into the\nimage; changes require rebuilding and uploading. Runtime checks samples and\nobserved statistics. A single acquisition-side enqueue helper attaches calibration\nmetadata and releases the boot inhibit on completion. The IMU task uses 6144 bytes\nof stack for online statistics.\n\nROS topics and status are documented under\n[IMU 실시간 수신](../ros2_ws/src/cleany_base_driver/docs/imu.md#imu-실시간-수신).\nThe standalone [diagnostic](imu_calibration/README.md) provides bench reports;\nnormal startup calibration is part of the motor image.\n\n## 휠 속도 제어 설정\n\n`src/main.cpp`의 `kFl/Fr/Rl/RrControllerConfig`는 FF scale, Kp, Ki와 PWM limit을\n설정한다. 변경 후 rebuild와 upload가 필요하다. FF 출력은\n`target / FF scale × PWM limit`이다. 진단 기준값은\n[`controller_baseline.json`](../tools/wheel_calibration/controller_baseline.json)에\n보존하며, 관련 테스트가 펌웨어 설정과의 일치를 확인한다.\n\n| 휠 | FF scale (rad/s) | Kp | Ki | PWM 상한 (%) |\n|---|---:|---:|---:|---:|\n| FL | 11.9352 | 6.058 | 12.118 | 100 |\n| FR | 12.2596 | 6.030 | 12.058 | 100 |\n| RL | 11.7678 | 6.246 | 12.492 | 100 |\n| RR | 11.3872 | 6.154 | 12.309 | 100 |\n\nFF 초기 추정은 `PWM≈k×속도`, `FF scale=100/k`를 사용한다. PI 초기 추정에는\n측정한 gain K, 시정수 τ와 delay L을 사용하며,\n`Kp=clamp(0.6/K,2,8)`, `Ki=Kp/max(0.5,4(τ+L))`로 계산한다.\n추정값은 실제 하중과 속도 필터 설정에 맞춰 재검증한다.\n\n명령 슬루는 가속 시 20 ms당 1%, 감속 시 20 ms당 3%로 설정한다.\n속도 피드백 LPF 시상수는 `kVelocityFilterTimeConstantSeconds = 0.02`초다.\nSTOP, 만료 및 연결 단절은 슬루 감속을 기다리지 않고 PWM zero를 요청한다.\n\n측정과 재검증 방법은 [휠 진단 안내](../tools/wheel_calibration/README.md)와\n[오도메트리 평가 안내](../tools/odometry_evaluation/README.md)를 따른다.\n오도메트리 내부 제어 잔차와 바닥 테이프 또는 LiDAR 기준의 실측 오차는\n별도 지표로 기록한다. 측정 JSON과 PNG는 Git 제외 경로인 `artifacts/`에 저장한다.\n\n## 1. 빌드와 장치 없는 검사\n\n명령은 저장소 루트에서 실행합니다. 호스트 호출 시 Ubuntu 22.04 `ros2-humble` Distrobox를 사용합니다.\n\n```bash\nmake firmware-setup\nmake test-micro-ros-setup test-motor-core\nmake firmware-smoke\nmake firmware-build\nmake build-base test-base\nmake micro-ros-agent-build\n```\n\nType support 원본은 `ros2_ws/src/cleany_base_interfaces`입니다. Smoke/runtime은 cache를 공유하므로 순차 빌드하며, interface, metadata, 환경을 변경하면 type support를 재생성합니다.\n\n`cmake/microros_python.cmake` exposes the pinned generator modules to IDF's\nPython during CMake configuration. PlatformIO clears the process `PYTHONPATH`\nbefore this step, so the SCons environment alone does not cover a fresh\nmicro-ROS/type-support rebuild. Runtime and smoke projects share this helper.\n\nSmoke and runtime share a library cache and build sequentially. Changes to\ninterfaces, metadata, or build environment regenerate type support.\n`sdkconfig.defaults` configures octal memory, a 1000 Hz FreeRTOS tick, and the\nUSB transport. The DOUT image header lets the bootloader enable OPI.\n\nFor clangd, run inside Distrobox:\n\n```bash\nesp32/.venv/bin/platformio run -d esp32 -e esp32-s3-microros -t compiledb\n```\n\n## 2. Upload와 통신\n\nFor stationary gyro calibration on `J_I2C1`, use the separate\n[MPU6050 calibration diagnostic](imu_calibration/README.md).\nIt provides a calibration-only image, retained USB results, measured-limit\nconfiguration, and the motor-firmware restoration procedure.\n\nSelect the device and confirm upload:\n\n```bash\nmake firmware-upload CLEANY_ESP_PORT=/dev/serial/by-id/\u003cdevice> CONFIRM_UPLOAD=1\n```\n\nAgent/ROS overlay를 적용하고 DDS domain 0에서 통신을 확인합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource esp32/micro_ros/agent/install/local_setup.bash\nsource \"$(make -s print-install-base)/local_setup.bash\"\nexport ROS_DOMAIN_ID=0\nros2 run micro_ros_agent micro_ros_agent serial --dev \"$CLEANY_ESP_PORT\" -b 115200\n# Another terminal with the same overlays/domain:\nros2 topic echo /base/wheel_state --qos-reliability best_effort\n```\n\nBare MCU 확인 항목은 다음과 같습니다.\n\n- Nonzero boot ID, 증가하는 sequence/timestamp\n- Disabled 상태, 목표, PWM 0, fault 없음\n\n## 3. 실물 인수\n\n1. 감독자, 사람 없는 구역, 검토한 제한값, 접근 가능한 물리 E-stop을 준비합니다.\n2. 바퀴를 띄워 startup 0, 회전 방향, encoder 부호를 확인합니다.\n3. Enable 후 새 저속 명령으로 전진, 좌측, yaw, PI, PWM slew, 반전 dwell을 확인합니다.\n4. STOP, 만료, driver/Agent 종료, USB 단절, MCU reboot의 정지 시간을 측정합니다.\n5. 재연결 후 새 enable과 새 명령이 필요한지 확인합니다.\n\nOdometry, TF 소유권은 [Base 계약](../ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md)을 따릅니다. 결과에는 revision, 설정, 하중/바닥, 부호, 주기, 정지 시간을 기록합니다.\n\n## KiCad\n\n프로젝트는 [motor_controller.kicad_pro](pcb/motor_controller.kicad_pro)이며 symbol/footprint는 project-local table에 등록됩니다. Espressif 출처와 라이선스는 [libraries](pcb/libraries/README.md)에서 확인합니다.\n"},"ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md":{"title":"Base 명령과 odometry","body":"# Base 명령과 odometry\n\n\n[베이스 실행](../../../../docs/how-to/base.md) · [MCU protocol](../../cleany_base_interfaces/docs/protocol.md) · [TF 소유권](#tf-소유권)\n\nBase driver는 차체 Twist를 wheel 명령으로 변환하고 MCU feedback을 ROS 상태로 제공한다. 차체 명령은 [Mobile base](../../cleany_interfaces/docs/mobile_base.md), MCU 통신은 [protocol v2](../../cleany_base_interfaces/docs/protocol.md)를 따른다.\n\n## 명령과 구동 허가\n\n```mermaid\nsequenceDiagram\n    participant U as Enable 요청자\n    participant D as Base driver\n    participant M as MCU\n    U->>D: enable true\n    D->>D: 기존 cmd_vel 삭제\n    D->>M: 목표 0인 ENABLE\n    M-->>D: fresh enabled feedback\n    D->>D: 구동 허가 확인\n    alt 새 cmd_vel 수신\n        D->>M: 새 wheel VELOCITY\n    else 새 목표 없음\n        D->>M: zero VELOCITY\n    end\n    Note over D,M: STOP / 만료 / 단절 / reboot 후에는 새 ENABLE과 새 cmd_vel 필요\n```\n\nDriver는 enable 요청을 받으면 기존 cmd_vel을 버리고 목표가 0인 ENABLE을 보낸다. Fresh feedback에서 MCU의 구동 허가를 확인한 뒤, enable 요청 이후에 수신한 새 목표만 전송한다. 새 목표가 없으면 zero VELOCITY를 유지한다.\n\nMecanum 변환 후 wheel limit을 넘으면 네 바퀴를 같은 비율로 축소해 이동 방향을 보존한다.\n\n| 조건 | 처리 |\n|---|---|\n| 여섯 축 중 nonfinite 포함 | STOP |\n| 지원하지 않는 축 | 경고 후 무시 |\n| ENABLE 전달 손실 | 같은 sequence, deadline으로 재시도 |\n| STOP 전달 손실 | 같은 sequence로 재전송. 신선한 MCU ACK를 보기 전까지 STOP 전송 유지 |\n| STOP, 단절, 만료, reboot | 새 ENABLE과 새 cmd_vel 필요; 재연결만으로 재개 금지 |\n\nSTOP 재전송은 50Hz driver tick에서 수행하고 새 구동 허가를 만들지 않는다.\n새 명시적 STOP 요청은 별도 sequence를 발급하므로 이전 ACK를 재사용하지 않는다.\n명령 watchdog timeout bit만 설정된 disabled MCU가 출력 0과 STOP ACK를 보고하면\n안전한 비활성 상태로 분류한다. 이 기록을 지우려고 ENABLE하지 않으며 다른 MCU fault,\n잘못된 프로토콜과 비정상 구동 상태는 기존 Fault를 유지한다.\n\n## 설정과 시간\n\n| 항목 | 기준 |\n|---|---|\n| 설정 원본 | [base_hardware.yaml](../config/base_hardware.yaml), [base_synthetic.yaml](../config/base_synthetic.yaml) |\n| 실물 geometry | radius 0.0635 m / wheelbase 0.350 m / separation 0.610 m |\n| MCU timestamp | MCU monotonic; ROS epoch 아님 |\n| JointState stamp | ROS 수신 시각 |\n| Driver deadline, cmd_vel timeout | 해당 설정값 사용 |\n\n실물 초기 속도 제한은 바퀴를 띄운 시험용이며 바닥 주행 승인값이 아니다. Mock geometry는 합성값이므로 실물 보정값으로 사용하지 않는다. Feedback 단절 중 이동량은 관측할 수 없다.\n\n## Diagnostics와 장애 구분\n\n`base_driver` status의 `feedback_received`는 현재 유효한 MCU 피드백 연결 여부다. 피드백이 stale이면 driver가 수신 기록을 초기화하므로 부팅 전과 연결 상실 뒤 모두 `False`다. `fault`는 다음 acknowledged ENABLE까지 유지되는 실제 장애 이유다.\n\n| 비활성 이유 | `fault` | 의미 |\n|---|---|---|\n| STOP 요청, `cmd_vel timeout`, 비유한 `cmd_vel` 거부, driver 종료 | 빈 값 | 의도한 안전 비활성. level은 기존처럼 ERROR |\n| MCU fault bit, 계약 불일치, MCU 재부팅, 무허가 enable, ENABLE ack timeout, 구동 중 피드백 stale | 이유 | base 장애 |\n\nSTOP을 보낸 직후 MCU가 그 STOP을 처리하기 전에 보낸 피드백(`last_command_sequence`가 STOP보다 오래됨)은 0.25초까지 무허가 enable로 보지 않는다. 그 뒤에도 enabled면 장애다. System Supervisor는 level 대신 `fault`와 `feedback_received`로 base 가용성을 판단한다.\n\n## Wheel odometry\n\nWheel odometry는 joint position 차이를 적분해 `/wheel/odom`을 발행하며 TF는 발행하지 않는다. Joint velocity는 필수 입력이 아니다. 실물 driver가 reboot, 단절 baseline과 encoder rollover를 처리해 연속 position을 제공한다.\n\n`velocity_window_s=0`은 샘플 간 차분, 양수는 구간 평균 twist를 사용한다. 시작, 시간 역행, 긴 공백 뒤에는 관측 구간이 준비될 때까지 발행하지 않으며, 미관측 속도를 0으로 보고하지 않는다. 평균 속도의 지연은 제동, 도착 검증에 반영해야 한다.\n\n`yaw_scale`은 유한한 양수의 회전 보정 계수이며 geometry를 바꾸지 않는다. Sim 보정값은 독립 검증 없이 실물에 적용하지 않는다. Covariance는 config/구현을 따르며 wheel odometry는 slip, 바닥 오차를 보정하지 않는다.\n\n## TF 소유권\n\n```mermaid\nflowchart TB\n    Twist[\"cmd_vel / 차체 Twist\"] --> Driver[\"Base driver\u003cbr/>Mecanum 변환 / wheel limit\"]\n    Driver -->|\"wheel_command\"| MCU[\"MCU / 네 휠\"]\n    MCU -->|\"wheel_state\"| Driver\n    Driver -->|\"연속 position / ROS 수신 stamp\"| Joint[\"joint_states\"]\n    Joint --> Odom[\"Wheel odometry\u003cbr/>position 차이 적분\"]\n    Odom --> Wheel[\"wheel/odom\u003cbr/>TF 미발행\"]\n    Wheel --> Relay[\"base_odom_relay\u003cbr/>실물 / mock\"]\n    Relay --> Canonical[\"odom / odom → base_link\"]\n    Gazebo[\"Gazebo\u003cbr/>wheel_odom_raw → error adapter → wheel_odom\"] -->|\"simulator 소유\"| Canonical\n    AMCL[\"AMCL\"] --> Map[\"map → odom\"]\n    Joint --> RSP[\"robot_state_publisher\"] --> ModelTF[\"Fixed / joint TF\"]\n```\n\n| TF / 출력 | 소유자 |\n|---|---|\n| 실물, mock /odom, odom→base_link | base_odom_relay |\n| Gazebo wheel_odom_raw→error adapter→wheel_odom 및 canonical odom/TF | simulator |\n| map→odom | AMCL |\n| Robot fixed/joint TF | robot_state_publisher |\n\n실물/mock과 Gazebo는 대체 실행 경로다. Canonical odom/TF 소유자는 실행마다 하나만 둔다. 외부 estimator를 사용할 때는 `relay_odom:=false`로 중복 publisher를 제거한다.\n\n관련 안내: [ESP32](../../../../esp32/README.md), [실행](../../../../docs/RUNNING.md), [검증](../../../../docs/TESTING.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n"},"ros2_ws/src/cleany_base_driver/docs/imu.md":{"title":"IMU 실시간 수신","body":"# IMU 실시간 수신\n\n\n[센서 확인 절차](../../../../docs/how-to/sensors.md#실물-imu) · [펌웨어](../../../../esp32/README.md)\n\nMCU가 부팅할 때 정지 보정을 한 번 수행하며 실패하면 기존 bench bias·covariance를\n적용한다. PC는 `base/imu_state`의 시각을 ROS로 변환하고 받은 결과를 그대로 발행한다.\nAgent나 PC 재시작으로 보정을 반복하지 않는다.\n\n| 토픽 | 내용 |\n|---|---|\n| `imu/data_raw` | MCU의 보정 전 각속도 |\n| `imu/data` | MCU에서 보정한 각속도, `RUNNING`·`FALLBACK`에서 발행 |\n| `imu/status` | `DiagnosticArray` 보정·수신 상태 |\n\nIMU 입력·출력은 best effort / volatile / keep last 1이다.\n3축 gyro는 센서 좌표계이며 orientation·linear acceleration은 covariance 첫 원소\n`-1`로 unavailable을 표시한다. Raw gyro covariance의 0은 unknown이다.\n향후 EKF 입력은 장착 TF를 확인한 Z축 각속도만 사용한다.\n\n### 실행\n\n같은 v2 인터페이스로 빌드한 모터 펌웨어를 업로드하고 Agent를 실행한다.\n**MCU 전원을 켤 때 로봇과 센서를 정지시킨다.** PC는 보정 도중이나 완료 후 연결해도 된다.\n레포 루트의 Humble 환경에서:\n\n```bash\nmake build-base\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nexport ROS_DOMAIN_ID=0\nros2 launch cleany_base_driver imu_bringup.launch.py\n\n# 다른 terminal에서 동일 overlay/domain 적용\nros2 topic echo /imu/data_raw --once --qos-reliability best_effort\nros2 topic hz /imu/data_raw\nros2 topic echo /imu/status --once --qos-durability transient_local\nros2 topic echo /imu/data --once --qos-reliability best_effort\n```\n\nPC 설정은 [`imu_bringup.yaml`](../config/imu_bringup.yaml)의 장치 MAC,\n센서 frame과 수신 시간 제한이다. Launch는 수신 node만 시작하며 모터 명령·TF·Agent를\n실행하지 않는다. `imu_link`의 실제 장착 TF는 별도로 측정해 URDF에 반영한다.\n\n### MCU 보정 설정\n\n[`imu_calibration.json`](../config/imu_calibration.json)은 빌드 시 검사해\n펌웨어에 포함한다. 기본값은 5초 안정화, 100 Hz 보정 1,000샘플 + 검증 500샘플,\n25초 timeout이다. 보정 중 모터를 차단하고, 완료 후에도 새 ENABLE이 필요하다.\n\nMCU는 `gyro_calibration.hpp`의 통계를 재사용해 두 window의 잡음·평균 잔차를\n검사한다. 정상일 때 새 평균을 bias로 사용하고 covariance는 검증·기준 분산 중\n큰 값으로 대각화한다. 실패하면 설정의 bias와 전체 covariance를 사용한다.\n기준 측정 출처는 JSON의 `source`에 보관한다. 새 결과는 MCU RAM에만 적용하며,\n재보정은 MCU 재부팅으로 수행한다. 센서 교체 시 MAC과 기준 보정값을 갱신한다.\nPC는 보정 파일이나 계수를 재검사하지 않는다.\n\n### 상태 토픽\n\n`imu/status`의 `status[0].name=imu_driver`, `message`에 아래 상태를 담는다.\n\n| 상태 | Level | 의미 |\n|---|---|---|\n| `CALIBRATING` | WARN | 시작 수신 대기 또는 정지 보정 중 |\n| `RUNNING` | OK | 새 보정값으로 실측 각속도 발행 중 |\n| `FALLBACK` | WARN | 기존 bench 보정값으로 실측 각속도 발행 중 |\n| `ERROR` | ERROR | 센서 오류·수신 timeout |\n\n`values`는 `bias_source` (`none/startup/fallback`), bias, 이유, 마지막 정상 샘플 age와\n수신 통계를 담는다. 상태 변경 시 즉시, 유지 시 1 Hz로 발행하며 QoS는\nreliable / transient local / keep last 1이다. `diagnostics`에도 같은 내용을 발행한다.\n센서 오류·수신 단절은 보정 상태보다 우선한다. 오류 중에는 측정값을 만들거나\n재생하지 않으며, 수신 회복 후 MCU가 선택한 상태로 돌아간다.\n\n### Timestamp와 상태 검사\n\n첫 정상 수신 시각에 MCU 시각을 맞추고 이후 취득 간격을 보존한다. 최초 USB\n지연은 남으므로 EKF 연결 전 wheel JointState와 시간 정렬을 실측한다.\nProtocol·장치·센서 오류, 중복/역순 샘플, 100 ms 초과 backlog/미래 시각과\n50 ms 초과 clock jump를 거부한다. MCU 재부팅이나 ROS clock jump 후 기준점을\n다시 잡는다. 기본 250 ms 수신 단절은 `ERROR`다. 이 상태의 주행 정지 연동은\n융합 주행을 연결할 때 검증한다.\n\n### 장치 없는 검증\n\n```bash\nmake test-imu-runtime\nmake test-motor-core\nmake test-base\nmake firmware-build\n```\n\n부팅 보정/fallback·모터 차단, timestamp, raw/corrected 전달과 장애·수신 회복을\n검사한다. 실물에서는 수신율·시각 오차·정지 잡음·Z축 부호·모터 주기 영향을 확인한다.\n"},"ros2_ws/src/cleany_base_driver/docs/interfaces.md":{"title":"cleany_base_driver 노드 인터페이스","body":"# cleany_base_driver 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## cleany_base_driver\n\n실행 파일: `base_driver_node`. 원본: [driver_node.py](../cleany_base_driver/driver_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `base/wheel_command` | `cleany_base_interfaces/msg/WheelCommand` | B1; 50 Hz |\n| 토픽 발행 | `joint_states` | `sensor_msgs/msg/JointState` | R10; fresh wheel feedback 수신 시 |\n| 토픽 발행 | `diagnostics` | `diagnostic_msgs/msg/DiagnosticArray` | R10; 10 Hz |\n| 토픽 구독 | `base/wheel_state` | `cleany_base_interfaces/msg/WheelState` | B1 |\n| 토픽 구독 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10 |\n| 서비스 제공 | `base/enable` | `std_srvs/srv/SetBool` | Service 기본값 |\n\n이름은 ROS remap으로 변경한다. 구동 허가와 정지 규칙은 [Base 계약](command-and-odometry.md)을 따른다.\n\n`base_driver` diagnostics의 `disarmed`는 host와 MCU가 모두 disabled이고,\n0.25초 이내의 검증된 피드백에서 목표, 명령, PWM이 0이며 측정 휠 속도가\n`disarmed_velocity_rad_s`(기본 0.02rad/s) 이하일 때만 true다. 이 값은 base 정지\n관측이며 STOP 명령 응답이나 팔을 포함한 전신 안전 증거를 대신하지 않는다.\n명령 watchdog의 timeout bit만 남은 disabled 상태는 정지 관측에 사용할 수 있지만,\n다른 fault bit나 enabled 상태는 허용하지 않는다. Timeout bit는 다음 명시적 ENABLE\n때 MCU가 해제하며 정지 확인을 위해 자동 ENABLE하지 않는다.\n\n## mock_base_mcu\n\n실행 파일: `mock_mcu_node`. 원본: [mock_node.py](../cleany_base_driver/mock_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `base/wheel_state` | `cleany_base_interfaces/msg/WheelState` | B1; 50 Hz, transport 허용 시 |\n| 토픽 구독 | `base/wheel_command` | `cleany_base_interfaces/msg/WheelCommand` | B1 |\n| 서비스 제공 | `mock/reboot` | `std_srvs/srv/Trigger` | Service 기본값 |\n| 서비스 제공 | `mock/transport` | `std_srvs/srv/SetBool` | Service 기본값 |\n| 서비스 제공 | `mock/drop_next_enable` | `std_srvs/srv/Trigger` | Service 기본값 |\n| 서비스 제공 | `mock/force_disarm` | `std_srvs/srv/Trigger` | Service 기본값 |\n\n실물 MCU 대신 실행하는 장치 없는 시험 노드다.\n\n## base_odom_relay\n\n실행 파일: `odom_relay_node`. 원본: [odom_relay.py](../cleany_base_driver/odom_relay.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `wheel/odom` | `nav_msgs/msg/Odometry` | R10 |\n| 토픽 발행 | `odom` | `nav_msgs/msg/Odometry` | R10; 입력 수신 시 |\n| 토픽 발행 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n`odom → base_link` TF를 발행한다. 외부 estimator 또는 Gazebo canonical publisher와 중복 실행하지 않는다.\n\n## cleany_imu\n\n실행 파일: `imu_driver_node`. 원본: [imu_node.py](../cleany_base_driver/imu_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `base/imu_state` | `cleany_base_interfaces/msg/ImuState` | B1 |\n| 토픽 발행 | `imu/data_raw` | `sensor_msgs/msg/Imu` | B1; 정상 IMU 수신 시 |\n| 토픽 발행 | `imu/data` | `sensor_msgs/msg/Imu` | B1; RUNNING 또는 FALLBACK |\n| 토픽 발행 | `imu/status` | `diagnostic_msgs/msg/DiagnosticArray` | R/T1; 상태 변경 시와 1 Hz |\n| 토픽 발행 | `diagnostics` | `diagnostic_msgs/msg/DiagnosticArray` | R10; 상태 변경 시와 1 Hz |\n\n이름은 ROS remap으로 변경한다. 보정과 오류 상태는 [IMU 계약](imu.md)을 따른다.\n\n## 순서가 있는 구동 허가\n\n`base/set_enabled`는 host 전용 `cleany_base_interfaces/srv/SetBaseEnabled` 서비스다.\nclient_id별 증가하는 request_sequence를 요구하며 늦게 도착한 ENABLE이 더 최신 STOP을\n덮지 못하게 한다. accepted는 발행 접수이며 command_sequence, boot_id를 fresh MCU\nfeedback과 대조해야 구동/정지 완료다. 기존 `base/enable`은 그대로 제공한다.\n"},"ros2_ws/src/cleany_base_interfaces/docs/protocol.md":{"title":"Wheel protocol v2","body":"# Wheel protocol v2\n\n\n[인터페이스와 단위](#인터페이스와-단위) · [명령 수락](#명령-수락) · [정지와 재개](#정지와-재개)\n\nROS driver와 MCU는 이 패키지의 msg/를 원본으로 같은 계약의 type support를 빌드한다. 한 MCU의 command publisher는 driver 하나가 소유한다.\n\n## 인터페이스와 단위\n\n| 토픽 | 방향 | QoS / 주기 |\n|---|---|---|\n| base/wheel_command | ROS → MCU | best effort, volatile, keep last 1 / 50 Hz |\n| base/wheel_state | MCU → ROS | best effort, volatile, keep last 1 / 50 Hz |\n\n| 항목 | 계약 |\n|---|---|\n| 배열 순서 | FL, FR, RL, RR |\n| PCB 매핑 | MCU에서만 M1, M2, M4, M3 및 극성 적용 |\n| 각도 / 속도 | 출력축 rad / rad/s |\n| Encoder / PWM | signed int32 count / signed percent |\n| Encoder scale | 출력축 1회전 = 3172 counts |\n\n## 명령 수락\n\n| Mode | 값 | 동작 |\n|---|---:|---|\n| STOP | 0 | 목표 삭제, 출력 0, 허가 해제 |\n| ENABLE | 1 | 네 목표가 0일 때 구동 허가 |\n| VELOCITY | 2 | 허가된 상태에서 유한한 [-10,10] rad/s 목표 적용 |\n\nProtocol version은 2다. Sequence는 uint32이며 `0 \u003c (new-old) mod 2^32 \u003c 2^31`일 때만 새 명령이다. MCU는 정지, 단절 뒤에도 마지막 번호를 유지하고, driver는 fresh feedback의 last_command_sequence 다음 번호를 사용한다.\n\n`valid_until_us`는 MCU monotonic µs다. Driver는 MCU stamp와 로컬 monotonic 경과로 계산한다. ENABLE/VELOCITY는 `now \u003c deadline \u003c= now+250000`을 만족해야 한다.\n\n| 예외 | 처리 |\n|---|---|\n| 중복, 거부, 이미 enabled인 ENABLE | 목표와 기한 갱신 없음 |\n| STOP | 버전, 목표, 기한에 관계없이 정지; 새 sequence일 때만 번호 갱신 |\n| Deadline 만료 | 목표, 허가 삭제 |\n\nSTOP의 새 sequence는 오래된 ENABLE의 재허가를 막는다. 매 control tick에서 **명령 처리 전에** 기한을 검사한다. watchdog_ms=250은 최대 유효기간이며 별도 watchdog 시각이 아니다.\n\n## 정지와 재개\n\n```mermaid\nstateDiagram-v2\n    [*] --> Disabled: 부팅 / 목표와 PWM 0\n    Disabled --> Enabled: 새 zero ENABLE / 버전과 기한 유효\n    Enabled --> Enabled: 새 VELOCITY / 유한한 목표와 유효 기한\n    Enabled --> Disabled: STOP / 기한 만료 / 단절\n    Disabled --> Disabled: STOP / 거부된 명령\n    note right of Enabled\n        중복, 거부, 이미 enabled인 ENABLE은\n        목표와 기한을 갱신하지 않음\n    end note\n    note right of Disabled\n        재연결만으로 재허가하지 않음\n        STOP과 단절은 대기 명령 삭제\n    end note\n```\n\n부팅, STOP, 만료, 단절 뒤에는 새 ENABLE과 새 cmd_vel이 필요하다. 연결 복구만으로 이전 목표를 재개하지 않는다. STOP latch와 단절은 대기 명령을 지우며, PWM/PI는 별도 motor task가 계산한다.\n\n## 피드백\n\n| 필드 | 의미 |\n|---|---|\n| boot_id | 부팅별 nonzero uint32; reboot/baseline 감지 |\n| timestamp_us | MCU monotonic; JointState는 ROS 수신 stamp 사용 |\n| enabled | 소프트웨어 구동 허가 |\n| command_age_ms=65535 | 활성 유효 명령 없음 |\n| Fault bit 0 | 명령 만료; 새 ENABLE 수락 시 초기화 |\n\nDriver는 중복, 역순 feedback을 무시하고 실제 수신 지연을 감시한다. Encoder rollover는 modular delta로 누적한다. Reboot, 단절 뒤에는 baseline을 재설정하되 누적 각도를 유지한다. 단절 중 이동량은 관측할 수 없다.\n\n관련 안내: [Driver](../../cleany_base_driver/docs/command-and-odometry.md), [펌웨어](../../../../esp32/README.md), [검증](../../../../docs/TESTING.md).\n\n## IMU telemetry v2\n\n`ImuState`는 WheelState v2와 별개의 고정 크기 메시지다. `base/imu_state`는\nbest effort, volatile, keep last 1이다. MPU6050의 100 Hz 취득 결과를 최신값\nmailbox에서 소비해 발행하며, 연결 지연 중 누락된 샘플은 재전송하지 않는다.\n\n- `angular_velocity_rad_s[3]`와 `acceleration_mps2[3]`는 센서 축 X/Y/Z의\n  보정 전 SI 값이며 `temperature_c`는 섭씨다.\n- `protocol_version=2`, `who_am_i=0x68`이다. Sensor fault bit는 1,\n  saturation bit는 2다. 정상 측정이 없으면 최대 10 Hz fault heartbeat를 보낸다.\n- 정상 패킷의 `timestamp_us`는 MCU acquisition 시각이고 ROS epoch가 아니다.\n  Fault 패킷은 오류 보고 시각을 사용하므로 측정으로 적분하지 않는다.\n- `boot_id`는 WheelState와 같은 MCU 부팅 ID다. `sequence`는 발행 패킷마다\n  증가하며, 수신자는 동일 부팅 내 중복, 역순과 역행 시각을 거부한다.\n- `device_mac[6]`는 ESP32의 MAC이다. 교체 가능한 MPU6050 칩의 고유 ID는 아니다.\n- `calibration_state`는 `CALIBRATING=0`, `RUNNING=1`, `FALLBACK=2`다.\n  MCU 부팅 때 한 번 결정하며 Agent/ROS 재시작으로 보정을 재실행하지 않는다.\n- `calibration_reason`은 `NONE=0`, `TIMEOUT=1`, `SENSOR=2`, `UNSTABLE=3`,\n  `SAMPLE=4`다. Runtime 상태와 오류 보고용이며 측정값 자체를 대신하지 않는다.\n- `corrected_angular_velocity_rad_s[3]`는 MCU가 bias를 제거한 각속도다.\n  `gyro_bias_rad_s[3]`, `gyro_covariance_rad2_s2[9]`와 함께 전달한다.\n  `RUNNING` 또는 `FALLBACK`일 때만 사용하며 raw vector는 그대로 보존한다.\n\n센서 오류 패킷과 원본 acceleration은 이 토픽을 기록해 보존한다.\nGyro-only ROS 변환, MCU 부팅 보정과 기존 측정값 fallback은\n[`cleany_base_driver`](../../cleany_base_driver/docs/imu.md#imu-실시간-수신)를 따른다.\nv1과 payload가 다르므로 펌웨어와 ROS 인터페이스를 함께 빌드한다.\n\n## Host 구동 허가 서비스\n\n`SetBaseEnabled.srv`는 ROS host 사이의 순서 있는 허가 요청이다. MCU의 고정 크기 메시지나\n펌웨어 wire protocol을 변경하지 않는다. client_id별 request_sequence로 지연된 과거 요청을\n거절하고 응답의 command_sequence와 boot_id는 fresh WheelState에서 확인한다.\n"},"ros2_ws/src/cleany_base_odometry/docs/interfaces.md":{"title":"cleany_base_odometry 노드 인터페이스","body":"# cleany_base_odometry 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## wheel_odometry\n\n실행 파일: `wheel_odometry_node`. 원본: [wheel_odom_node.py](../cleany_base_odometry/wheel_odom_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `input_topic` |\n| 토픽 발행 | `wheel/odom` | `nav_msgs/msg/Odometry` | R10; 유효 관측 구간 준비 후 입력 수신 시, `output_topic` |\n\nTF는 발행하지 않는다. 의미는 [Base odometry 계약](../../cleany_base_driver/docs/command-and-odometry.md)을 따른다.\n\n## 원점 초기화\n\n`wheel_odometry/reset`은 private `~/reset`, `std_srvs/srv/Trigger` 서비스다.\npose와 encoder baseline을 초기화하고 다음 fresh encoder 표본을 기다린다. 이 서비스는\n모터를 정지시키지 않으므로 매핑 관리자가 STOP을 확인하고 기존 SLAM을 종료한 뒤 호출한다.\n"},"ros2_ws/src/cleany_benchmark/README.md":{"title":"Controller compute timing","body":"# Controller compute timing\n\nThis standalone Humble package wraps any `nav2_core::Controller` without changing\nthe algorithm namespace, lifecycle methods, plan, speed limit, commands, or\nexceptions. Source it after the ROS and original controller overlays.\n\n```yaml\ncontroller_server:\n  ros__parameters:\n    controller_plugins: [FollowPath]\n    FollowPath:\n      plugin: cleany_benchmark::TimedController\n      wrapped_plugin: teb_local_planner::TebLocalPlannerROS\n      benchmark_timing_file: /absolute/run/directory/controller_compute.csv\n      # Original FollowPath parameters go here unchanged.\n```\n\nRPP's original plugin is\n`nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController`.\nThe destination directory must already exist. CSV files are appended to preserve\nexisting evidence; use a distinct file per run. A new wrapper instance restarts\nsequence numbering at 1, while a cleanup/reconfigure of the same instance keeps it.\n\nCSV columns:\n\n| Column | Meaning |\n|---|---|\n| `sequence` | Invocation number, starting at 1 |\n| `sim_time_ns` | Node clock immediately before the call, nanoseconds; simulated time when `use_sim_time=true` |\n| `wall_start_ns` | Monotonic steady clock start, nanoseconds since its implementation-defined epoch |\n| `compute_us` | Steady wall duration of the wrapped compute call, microseconds |\n| `success` | 1 when the method returns, 0 when it throws; exception is rethrown unchanged |\n\nFile writes, mutex acquisition, and flushes happen after the end timestamp. A\n64 KiB stream buffer is requested; explicit flush occurs every 128 calls and on\ncleanup/destruction. Abrupt process termination may lose the last buffered rows.\nThe measurement includes the original method's own visualization/logging and\nthread scheduling, and excludes the surrounding Nav2 cycle. Successful rows mean\nthe method returned, not that navigation arrived at the goal.\n\nFor a 20 Hz controller, report a 50 ms wall deadline and the separately identified\nRTF-adjusted wall budget (25 ms at actual RTF 2). Do not infer actual RTF from its\nconfigured target. Report p95/p99 for successful calls and exception calls\nseparately, retaining both raw populations. `wall_start_ns` is monotonic, not UTC.\n\nBuild inside the installed ROS container:\n\n```sh\nsource /opt/ros/humble/setup.bash\ncolcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release\nsource install/setup.bash\n```\n"},"ros2_ws/src/cleany_bringup/docs/hardware-mapping.md":{"title":"실물 매핑 구성","body":"# 실물 매핑 구성\n\n```mermaid\nflowchart LR\n  Sensors[\"LiDAR + 휠 피드백\"] --> Ready[\"scan · odom · TF 준비\"]\n  Ready --> Session[\"매핑 세션 / Cartographer\"]\n  Session --> View[\"지도 · 스캔 · 궤적 관측\"]\n  Session --> Stop[\"입력 차단 · STOP 확인\"]\n  Stop --> Save[\"지도 저장 · Logger flush · 종료\"]\n```\n\n[지도 만들기](../../../../docs/how-to/mapping.md) · [센서 확인](../../../../docs/how-to/sensors.md) · [매핑 상태 계약](../../cleany_navigation/docs/mapping.md)\n\n`hardware_mapping.launch.py`는 설치된 패키지로 hardware runtime을 시작한다.\nRuntime은 영속 센서/base/조종 launch와 매핑 관리자를 별도 프로세스 그룹으로 소유한다.\n종료 시 매핑 관리자의 저장을 먼저 기다리고 장치 launch를 종료한다.\n웹 페이지를 닫아도 지도와 기록은 종료되지 않는다.\n\n| 프로필 | 출처와 범위 |\n|---|---|\n| `mapping_legacy.yaml` | 이전 실물 매핑의 x=0.029m, yaw=-7.85도. 원본 측정 artifact 미확인 |\n| `mapping_evaluation_20261015.yaml` | main의 평면 보정 x=-0.070807m, y=-0.038232m, yaw=79.770070도, laser frame |\n\n두 프로필은 서로 다른 장착/프레임 자료이므로 합성하지 않는다. 둘 다 z=0은 평면 규약이며\n실측 높이가 아니다. 장착을 변경했다면 해당 프로필의 사용 근거를 다시 확인한다.\n기본값은 기존 매핑 동작을 보존하는 legacy 프로필이다. mock은 실물 geometry 대신\n`base_synthetic.yaml`을 선택하며 Agent와 실물 LiDAR를 시작하지 않는다.\n\n설정은 설치된 package share에서 찾고, 실행 시 state_root에 확정 설정을 보존한다.\n키는 state_root/web-token(0600), 지도는 maps/, 녹화는 recordings/에 두며 저장소 소스나\n`.runtime` 빌드 경로를 사용하지 않는다. 시작 명령은 [RUNNING](../../../../docs/RUNNING.md),\n설치와 외부 드라이버는 [개발환경](../../../../docs/DEVELOPMENT_SETUP.md)을 따른다.\n\n조종 사건은 state_root의 `teleop-events.jsonl`과 회전 백업에 저장한다. 매핑 작업 오류는\n`maps/errors/\u003coperation_id>.json`에서 확인하며, 진단 파일 저장에 실패하면\n`mapping.log`의 traceback을 확인한다. [진단 계약](../../cleany_teleop/docs/interfaces.md)을 따른다.\n"},"ros2_ws/src/cleany_control_bridge/docs/interfaces.md":{"title":"cleany_control_bridge 노드 인터페이스","body":"# cleany_control_bridge 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## control_bridge\n\n실행 파일: `control_bridge`. 원본: [node.py](../cleany_control_bridge/node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 서비스 호출 | `mission/offer` | `cleany_interfaces/srv/OfferMission` | Service 기본값 |\n| 서비스 호출 | `mission/cancel` | `cleany_interfaces/srv/CancelMission` | Service 기본값 |\n| 서비스 호출 | `mission/snapshot` | `cleany_interfaces/srv/GetRuntimeSnapshot` | Service 기본값 |\n\nROS 토픽이나 action을 직접 제공하지 않는다. Backend WebSocket은 `url`로 설정하고 상태 동기화 간격은 `heartbeat_interval` 기본 1초다. [Gateway 계약](../../cleany_interfaces/docs/mission.md)을 따른다.\n"},"ros2_ws/src/cleany_description/docs/model-runtime.md":{"title":"cleany_description","body":"# cleany_description\n\n## URDF migration\n\n`feat/migrate-cleany-description`의 형상 xacro와 참조 CAD frame 메시를 가져왔다.\n`physical_properties.xacro`는 본체·팔·바퀴의 상세 visual/collision을 제공한다.\n현재 브랜치의 두 control xacro는 카메라 스케줄링, hardware plugin 및 초기\n관절값 설정 호환성을 위해 유지한다. 대응 MJCF도 같은 브랜치에서 가져왔으며,\n스터디카페 접촉 pair 호환성을 위해 양팔 jaw collision geom 이름을 유지한다.\n정합성 검사는 새 CAD 모델의 팔·TCP·그리퍼·헤드 카메라 좌표를 기준으로 한다.\n모델 정합성 통과가 물체 파지나 전체 수거 성공을 보장하지는 않는다.\n\n양팔 하단 `Base.stl`의 장착 위치는 원형 마운트\n`cad_frame/035armbase_step__êäèë4.stl`의 체결 구멍 4개에 맞춘다.\n기존 배치 대비 `base_link` 기준 이동량은 왼쪽\n`(-0.099657, +11.114727, 0)` mm, 오른쪽\n`(+0.099838, -11.114072, 0)` mm다. 팔 하단과 모터의 visual/collision,\n어깨 관절 원점, MJCF의 전체 팔 body에 같은 이동량을 적용하고,\nURDF에 합쳐진 고정 팔 하단의 질량 중심과 관성도 다시 계산했다.\n수정 후 어깨 원점은 왼쪽 `(0.116200343, 0.196231727, 0.447797)` m,\n오른쪽 `(0.116200838, -0.196177072, 0.447797)` m다.\n이 수치는 기존 CAD 메시의 XY 체결 정렬값이며 실물 보정값이 아니다.\n높이와 회전은 기존 값을 유지한다.\n`test_arm_base_fasteners_align_with_cad_mounts`는 메시 좌표계에서 측정한\n구멍 축을 각 배치로 변환해 XY 오차가 0.01 mm 이내인지 검사한다.\nURDF/MJCF의 같은 오배치가 단순 모델 일치 검사를 통과하는 문제를 방지한다.\n\n`base_link`의 고정 조립체 관성은 MJCF에 기록된 `chassis`, `Base`, `Base_2`의\n질량·질량 중심·`fullinertia`를 같은 좌표계로 옮겨 평행축 정리로 합성한다.\n관성 정합성 검사는 이 원본 텐서를 기준으로 절대 오차 `1e-9`를 유지하며,\nMuJoCo 버전별 주관성축 분해의 수치 차이가 합성 기준에 섞이는 것을 방지한다.\n\n`include_head_camera:=false`로 카메라 관절을 제외해도 고정 기둥\n`top_base_link`/`top_base_joint`는 유지한다. MoveIt의 팔 전용 모델에서 기둥이\n누락되어 복귀 중 팔이 실제 기둥에 부딪히던 문제를 방지한다.\n움직이는 pan/tilt 헤드 전체의 충돌 반영은 해당 관절 feedback 연결이 별도 필요하다.\nMJCF의 거친 head mount box가 pan joint를 사이에 둔 tilt housing과 겹쳐\n카메라를 밀어내므로 `top_base_link`–`head_tilt_link` 한 쌍만 내부 조립체\n접촉에서 제외한다. 헤드와 외부 환경의 충돌은 유지하며 head pose 유지 시험으로\n검증한다. 이는 CAD 충돌 근사의 예외이지 실물 간섭이 없다는 보증은 아니다.\n기본 description의 바퀴 관절은 continuous이며 고정 미리보기에서는\n`include_wheel_joints:=false`로 확장할 수 있다.\n\ncontrol xacro의 `scheduled_cameras`(기본 false)는 observer hardware에 카메라별\n촬영 스케줄러 사용 여부를 전달한다. `efficient_viewer`(기본 false)는 같은 worker에서\nGUI도 그릴지 지정한다. launch가 이 GUI를 선택하면 vendor `headless=true`를 함께\n전달한다. `efficient_viewer`는 hardware parser에 맞춰 소문자 true/false로 출력한다.\n로봇 mesh/카메라 장착 형상은 변경하지 않는다.\n\nSorting의 analytical wrist-roll 후보 보정은 `wrist_roll_joint`의 local -Y\n축과 `grasp_tcp_joint`의 `(0, -0.100, 0)` offset이 공선이라는 현재 모델\n계약을 사용한다. `test_grasp_roll_alignment_matches_collinear_robot_geometry`\n검사가 양쪽 URDF에서 이 전제를 확인한다. 축/도구 보정을 바꿀 때는 이\n보정 알고리즘도 함께 검토해야 하며, 현재 TCP는 실측 하드웨어 보정값이 아니다.\n\nControl xacro의 `mujoco_hardware_plugin` 기본값은 기존\n`mujoco_ros2_control/MujocoSystemInterface`다. 분리 수거 backend는 이를\n`cleany_mujoco_observer/ObservedMujocoSystem`으로 지정해 잠금된 평가 snapshot을\n추가한다. 관절/command interface, controller 및 physics 설정은 바뀌지 않는다.\n\nAuthoritative robot description assets shared by MuJoCo, TF, and MoveIt.\n\n## Files\n\n- `urdf/cleany_geometry.xacro`: backend-neutral canonical physical model\n- `urdf/cleany.urdf.xacro`: plugin-free dual-arm URDF used by\n  `robot_state_publisher` and MoveIt\n- `urdf/cleany_control.urdf.xacro`: control-backend extension entrypoint; it\n  adds the MuJoCo `ros2_control` hardware interface for the ten arm joints and\n  read-only state interfaces for both grippers\n- `urdf/cleany_mujoco_ros2_control.xacro`: reusable MuJoCo hardware macro\n- `urdf/head_camera.xacro`: physical head mount and optional measured RGB optical transform\n- `mjcf/cleany.xml`: MuJoCo robot model included by simulator scenes\n- `meshes/`: visual and collision CAD assets referenced by both descriptions\n- `test/test_model_parity.py`: canonical joint, motor geometry, and randomized\n  FK parity checks\n\nBoth URDF entrypoints include the five separate motor CAD meshes on each arm\nas visuals and URDF collision shapes, at their MJCF body-local placements. Upper-arm\nand lower-arm motors have respective offsets `(0, 0.05, 0)` and `(0, 0, 0.05)` m;\nthe other three have zero offsets. The RGB-D self-filter uses collision shapes,\nso omitting these parts can leave the robot's own surfaces in the environment\nOctoMap. The fixed-jaw motor remains visual-only in MJCF and has a matching URDF\ncollision mesh. The v8 wrist mounts use six visuals and fifteen collision\nprimitives per wrist in both backends, replacing the old camera-case meshes.\nTheir rigid geometry is attached to the gripper independently of optical TFs.\nThe simulated wrist cameras and optical sites/bodies use the v8 geometry\nregistration's lens centre and CV axes. The camera renderer reverses optical\nY/Z to use its -Z viewing convention. Sorting's nominal wrist transform config\nmatches this pose; the measured Jetson calibration profile remains independent.\nRegression checks compare the original URDF collision model with MJCF, including\nposes, dimensions and colors. The planning model separately preserves visuals,\ninertia and joints; both original and optimized motor collision placements are\nchecked against MJCF. Motor translation comparisons allow `2e-6` m for CAD rounding.\nExisting CAD files are reused without regenerating assets or changing joint\nkinematics. This coverage does not by itself prove collision-free execution.\n\n## Model contract\n\nThe MJCF moving-jaw body frames use the migrated URDF joint RPY `(pi, 0, 3.33)`\nas quaternions. The visual/collision origins retain the CAD's approximately\n21.59-degree compensation, and inertial properties use the same link frame.\nChanging only the body rotation without this mesh compensation would alter\nthe contact geometry. Tests check both visual and collision mesh poses.\nRandomized FK parity checks include both moving jaws over\narm and gripper configurations in both URDF entrypoints, in addition to the\nfixed jaws and TCPs. The `1e-5` tolerance accommodates rounded MJCF CAD angles;\nthis is simulation-model parity, not a measured hardware calibration.\n\nRun `make test` from the repository root to build the workspace and check\nthe model parity suite, including randomized arm/TCP,\nmoving-jaw and head-camera FK. The simulation tests also compare the configured\nwrist optical transforms against the MJCF camera sites. URDF entrypoint geometry\nis compared with `include_wheel_joints:=false` on both sides: the default mobile\ndescription has continuous wheels, while the stationary arm-control and MoveIt\nsorting descriptions use fixed wheels because their controllers do not publish\nwheel states. These tests do not validate real-hardware calibration, Jetson\nperformance, navigation, or successful object retention.\n\n- REP-103: `base_link` +X forward, +Y left, +Z up; wheel axes +Y.\n  Optical frames use +X right, +Y down, +Z forward.\n- Wheelbase **0.35 m**, track **0.6038 m**, wheel radius **0.0635 m**.\n  URDF wheels are rigid 500 g assemblies; 48 passive roller joints are MJCF-only.\n- `${side}_grasp_tcp` is fixed at `(0, -0.100, 0)` m in\n  `${side}_gripper_frame`; the original hinged gripper is retained.\n- Head RGB-D transforms are nominal by default. The explicit `jetson_20261009`\n  calibration profile applies provisional measured RGB and wrist optical transforms.\n  Depth remains nominal; simulation ground-truth wrist edges remain separate.\n  See [model contract](model.md) and [calibration guide](../../../../docs/CALIBRATION.md).\n- The control entrypoint commands ten arm joints and reads both grippers.\n  Gripper commands are opt-in via `enable_gripper_command:=true`.\n  Base, head, and rollers are outside this control contract.\n- Arm-only MoveIt uses `include_head_camera:=false include_wheel_joints:=false`.\n  These default to `true` in the full description; disabling wheel joints\n  retains their geometry as fixed links.\n- Fourteen legacy servo position actuators and four PG42 voltage actuators\n  remain active. New servo DC-motor defaults are commented out pending the\n  separate MuJoCo/ros2_control upgrade. The 3.4 backend removes only wheel\n  actuators from its temporary scene; see [simulation setup](../../cleany_mujoco_sim/docs/scenes.md).\n\nMass properties are estimates: total **15.933871 kg**,\nincluding a provisional **5.20 kg, 195×165×175 mm battery**, **0.8 kg per PG42\nmotor**, and estimated PLA parts.\n\n## Use\n\nAfter building and sourcing `ros2_ws`, publish the full description:\n\n```bash\nros2 launch cleany_description description.launch.py use_sim_time:=true\n```\n\nExpand the control description from this package directory:\n\n```bash\nxacro urdf/cleany_control.urdf.xacro \\\n  mujoco_model:=/absolute/path/to/control_scene.xml headless:=true\n```\n\nThe control entrypoint exposes position commands plus position and velocity\nstate for the five joints of each arm. Both gripper joints expose position and\nvelocity state so MoveIt receives a complete dual-arm model state. Gripper\ncommands are disabled by default and enabled with `enable_gripper_command:=true`\nfor sorting. The base, head, and passive roller joints remain outside this\ncontrol contract.\n\n## Integration regression scope\n\nModel-parity checks compare geometry and FK; they do not validate every existing\nmotion fixture after a CAD migration. Run `make test` with a working X display\nfor controller, planning and hand-eye regressions as well. Validation commands\nand their scope are documented in the [testing guide](../../../../docs/TESTING.md).\n\nRun geometry, color, mass, joint-contract, and randomized FK checks from `ros2_ws`:\n\n```bash\npython3 -m pytest src/cleany_description/test/test_model_parity.py\n```\n\n## Gazebo navigation adapter\n\n`cleany_gazebo_sim` consumes this CAD description through Xacro / sdformat conversion.\nIts navigation profile freezes the arms and head at configured park angles, retains\nfour driven wheel joints, and attaches Gazebo sensors and mecanum contact approximations.\nIt does not modify this package's movable joint contract. See that package's README\nfor the CAD launcher, wheel odometry geometry, and simulation limitations.\n\n## 선택적 충돌 메시 평면화\n\n`optimized_arm_collision_meshes`는 기존 이름을 유지하며 팔, 모터, 머리와 마스트의\n경량 충돌 메시를 선택한다. 기본값은 `true`이고 `head_collision_meshes`도\n`true`다. 공통 URDF 기본값이므로 Gazebo CAD 변환에도 최적화 충돌 형상이\n전달된다. MuJoCo의 물리 접촉 계산은 `mjcf/cleany.xml`의 기존 형상을 유지한다.\n시뮬레이션에서도 MoveIt 경로 계획에는 공통 URDF의 최적화 충돌 형상을 사용한다.\n원본 URDF와 MJCF의 충돌 형상 대조 검사는 `optimized_arm_collision_meshes:=false`와\n`head_collision_meshes:=false`를 모두 명시한다. 기본 계획 모델은 원본 모델과\n시각 형상, 관성, 관절이 같은지 별도로 검사한다.\n시각 모델, 관성, 관절과 원본 CAD 파일은 바뀌지 않는다.\n\n| 대상 | `true`일 때의 형상 |\n|---|---|\n| 양팔의 상완, 하완, 연결부와 모터 11종 | `meshes/collision/`의 평면 메시, 좌우 합계 22개 인스턴스 |\n| 머리와 마스트 CAD 6종 | `head_collision_meshes=true`이고 해당 링크가 포함될 때 경량 메시 적용 |\n| 집게의 기존 볼록 메시 5종 | 이미 12–24개 삼각형으로 구성되어 원본 유지 |\n| box, cylinder, sphere primitive | 기존 해석적 형상 유지 |\n\n외접 메시의 각 조각은 담당하는 원본 표면 조각을 포함한다. 하완 포크, 어깨와 손목 연결부,\n하완 모터, 마스트와 머리 브래킷은 먼저 평면으로 나누고 떨어진 표면 조각을\n분리한다. 이후 각 조각을 지지 평면으로 감싸 불필요한 둥근 모서리와 작은\n구멍을 단순화한다.\n분할 축과 위치는 `configs/robot/arm_collision_meshes.json`의\n`partition_components`에서 원본 메시 좌표계의 미터 단위로 지정한다.\n밀리미터 CAD의 단위 변환은 `mesh_scales`가 관리한다.\n\n`enclosure_variants`는 각 조각의 축 선택과 불필요한 지지 평면 제거 방식을\n기록한다. STL의 float32 좌표로 반올림한 뒤 볼록 면을 다시 구성하고 원본\n포함 및 팽창 상한을 검사한다. 최종 STL의 각 면도 같은 볼록 경계를 이루는지\n검사해, 정점의 볼록 외피만 맞고 실제 삼각형은 안으로 접히는 경우를 막는다.\n\n팽창 상한 1mm는 **분할 조각의 볼록 외피**를 기준으로 한다. 오목한 CAD\n표면과의 거리 상한이 아니며, 조각 내부의 작은 빈 공간은 메워질 수 있다.\nMoveIt은 `cleany/SolidFCL`로 닫힌 볼록 조각을 내부가 채워진 형상으로 읽는다.\n삼각형 표면을 가로지르지 않고 조각 안에 완전히 들어간 작은 장애물도 검출한다.\n외접 포함 조건뿐 아니라 실제 서비스의 내부 장애물 검출과 원본 CAD 대조를\n검사한다. Gazebo와 MuJoCo의 물리 엔진에 이 MoveIt 플러그인을 적용하는 것은 아니다.\n\n`make test-description-models`는 원본 모델의 MuJoCo 동등성, 기본 계획 모델의\n공통 정보 보존과 최적화 자산을 검사한다. `test_collision_meshes.py`는 모든 출력 메시의 실제 STL 좌표에서 포함과 팽창\n상한, 폐곡면, 분할된 포크의 틈, 단위와 Xacro 적용 범위를 검사한다.\n재생성은 `python3 tools/optimize_arm_collision_meshes.py --write`를 명시적으로\n실행하며, `--write`가 없으면 생성 결과와 저장된 자산의 일치를 확인한다.\n"},"ros2_ws/src/cleany_description/docs/model.md":{"title":"Robot model 계약","body":"# Robot model 계약\n\n```mermaid\nflowchart LR\n  CAD[\"CAD 형상\"] --> URDF[\"URDF / joint chain\"]\n  URDF --> TF[\"robot_state_publisher / TF\"]\n  URDF --> MoveIt[\"MoveIt / 충돌 형상\"]\n  URDF --> MJCF[\"MuJoCo / 동역학 모델\"]\n  Cal[\"선택적 보정 프로필\"] --> TF\n```\n\n[모델 실행](model-runtime.md) · [좌표와 보정](../../../../docs/CALIBRATION.md)\n\nCAD 모델은 ROS 좌표, 팔 chain, 시뮬레이션 형상을 공유한다. Geometry, 질량, 센서 TF에는 명목값과 추정값이 포함되므로 실물 검증값으로 취급하지 않는다.\n\n\u003cfigure>\u003cimg src=\"../../../../docs/assets/physical-calibration/mount.png\" alt=\"헤드와 양팔 카메라 장착 모델\" width=\"760\">\u003cfigcaption>장착 모델 시각화. 실물 사진이나 최신 장착 치수의 검증 자료가 아닙니다.\u003c/figcaption>\u003c/figure>\n\n## 좌표와 형상\n\n| 항목 | 계약 |\n|---|---|\n| base_link, REP-103 | +X 전방 / +Y 좌측 / +Z 상방; wheel 축 +Y |\n| Optical frame | +X 우측 / +Y 하방 / +Z 전방 |\n| CAD wheelbase / track / radius | 0.35 / 0.6038 / 0.0635 m |\n| Wheel 모델 | URDF: 500 g rigid assembly; MJCF만 passive roller joint 48개 |\n| Grasp TCP | gripper_frame 기준 (0, -0.100, 0) m 고정; hinged gripper 유지 |\n| Head RGB-D TF | 기본은 명목값; `jetson_20261009` 프로파일은 RGB optical TF에만 잠정 실물 보정 적용 |\n| Wrist camera TF | 기본은 제외; 같은 프로파일 선택 시 각 gripper 기준 보정 optical TF와 RGB alias 추가 |\n\n## 실물 헤드 마운트와 관절 기준\n\nJetson에 저장된 2026-10-09 모델에 맞춰 마스트의 매끄러운 면을 뒤쪽(-X)으로 돌리고,\nCAD 상판 뒤쪽 모서리보다 50 mm 뒤에 배치한다. `head_mast_rear_gap_m`은\nURDF와 MJCF가 같은 조립 형상을 유지하도록 `0.05`만 허용한다.\n하부 마운트 높이 65 mm와 기둥 238 mm를 반영하며 상부 pan/tilt\n부품은 이 합계에서 제외한다. 하부 마운트의 전후 길이는 172 mm이고 앞쪽 모서리는\n상판 앞쪽보다 41 mm 뒤에 있다. 상부 헤드는 전방을 향하도록 유지한다.\n\n`topbase1.stl`은 Jetson의 기존 수정 mesh를 그대로 사용한다. URDF visual과 collision,\nMJCF의 마스트와 상부 장착 높이를 함께 맞춘다. 메시 치수와 조립 방향을 확인하는\n검사는 URDF/MJCF의 단순 상호 일치와 별개로 수행한다.\n\n왼쪽 wrist-roll의 2026-10-05 측정 범위\n`[-1.5247769031583274, 2.9513790358919736]` rad는 관절 보정 프로파일의\n`observed_position_limits_rad`와 원본 자세 기록에 보존한다. 이 범위를 실행 제한으로\n채택하려면 URDF, MJCF, MoveIt과 grasp 실행기의 좌우별 설정을 함께 연결해야 한다.\n현재 기본 관절 제한과 TCP는 유지한다. 마운트 변경은 기본 형상에 적용하며,\n카메라 외부 보정은 프로파일 선택으로 구분한다.\n\n![양팔의 v8 손목 카메라 마운트와 헤드](../../../../docs/assets/physical-calibration/mount.png)\n\n이미지는 사용자가 제공한 `mount.png` 원본이며 기존 PR 이미지를 교체했다.\n마운트 형상을 보여주는 렌더로, 실물 사진이나 보정 정확도 검증 자료는 아니다.\n\n프로파일 적용 방법, 좌표계와 검증 한계는 [캘리브레이션 가이드](../../../../docs/CALIBRATION.md)를 따른다.\n팔과 헤드 encoder 매핑은 근거 데이터로 보존하며 이 패키지가 직접 장치를 설정하지 않는다.\n\n## 손목 카메라 마운트 v8\n\nJetson에 적용된 v8 마운트를 양쪽 `*_gripper_frame`에 붙인다. 기존\n`XLeRobot_camera1/2.stl` 형상을 교체하며 URDF와 canonical MJCF에 같은 배치를\n사용한다. 손목별 visual 6개는 보라색 마운트, 커넥터, 카메라 모듈, 렌즈와 나사를\n표현한다. 충돌 형상은 상자 14개와 렌즈 원통 1개이며 MuJoCo 접촉과 URDF 충돌\n검사에 사용한다. 통합 STL은 여러 구성품을 이어 담은 visual이므로 충돌 mesh로\n사용하지 않는다. 전선과 케이블은 독립 미리보기에만 포함된다.\n\n[형상 설정](../config/geometry/wrist_mount_v8.json)은 출처, SHA-256, 좌표 변환과\n측정 조건을 보존한다. 판 크기 42.1 × 50.7 mm 등 사용자 실측 기준을 반영한\n프록시이며 기울기, 두께, 발판 위치와 질량은 추정값이다. 제작용 CAD는 아니다.\n메시는 Jetson 원본 바이트를 유지하며 관절, TCP와 canonical 질량/관성은 유지한다.\n\n형상의 추정 광학 좌표와 `jetson_20261009` 실측 외부 보정은 별도다. Jetson의\n보정 파일은 이전 수집본과 동일하며 이번 형상 반영으로 보정 정확도를 새로 검증한\n것은 아니다. Canonical MuJoCo 카메라와 optical site/body는 형상 설정의\n`legacy_jaw_from_camera_cv_approximate`를 따라 v8 렌즈 중심과 방향에 맞춘다.\nMuJoCo 카메라의 -Z 촬영 방향과 optical frame의 +Z 전방을 변환하며,\n시뮬레이션 내부 보정 계약인 640×480, 수직 FOV 93°는 유지한다.\n`cleany_mujoco_sim/config/sorting_wrist_cameras.yaml`도 같은 광학 변환을 사용한다.\nGazebo world generator도 이 형상 설정에서 손목 촬영 위치와 방향을 읽고,\n렌더러의 +X 전방 축으로 변환한다. CAD의 팔 제외 설정에서는 손목 센서를\n추가하지 않는다. 레거시 모델의 카메라 케이스 visual도 공유 v8 형상을 사용한다.\n실제 장착 위치가 보정 당시와 달라졌다면 기존 보정값의 유효성을 재확인해야 한다.\n\n독립 형상 미리보기는 다음 명령으로 연다. 독립 모델의 추정 관성과 카메라 설정은\ncanonical 로봇에 적용하지 않는다.\n\n```bash\npython3 -m mujoco.viewer --mjcf=ros2_ws/src/cleany_description/mjcf/wrist_mount_v8.xml\n```\n\n## 제어 범위\n\nControl entrypoint는 팔 10관절을 명령하고 gripper 2관절을 관측한다. Gripper 명령은 enable_gripper_command=true일 때만 허용하며 base, head, roller는 이 계약 밖이다.\n\nArm-only MoveIt은 include_head_camera=false, include_wheel_joints=false를 사용한다. Full description에서는 둘 다 기본 true이며, wheel false여도 fixed geometry는 유지한다.\n\n기존 actuator는 servo position 14개와 PG42 voltage 4개다. 신규 servo DC-motor 기본값은 별도 upgrade 전까지 비활성이다. MuJoCo 3.4 backend는 임시 scene의 wheel actuator만 제거한다.\n\n## 추정 질량과 Gazebo\n\n| 항목 | 추정값 |\n|---|---|\n| 총 질량 | 15.933871 kg; PLA 추정 포함 |\n| 배터리 | 5.20 kg, 195×165×175 mm |\n| PG42 motor | 각 0.8 kg |\n\nGazebo navigation은 park 팔, head를 고정하고 wheel joint, 센서를 부착한다. 이 설정은 실물 관성, 센서 보정을 증명하지 않는다.\n\n관련 안내: [MuJoCo backend](../../cleany_mujoco_sim/docs/backends.md).\n"},"ros2_ws/src/cleany_dev_monitor/docs/data.md":{"title":"Monitor 관측 데이터 계약","body":"# Monitor 관측 데이터 계약\n\nMonitor는 ROS 상태를 웹에 표시하고 독립 logger의 기록을 조회한다. 관측 전용이며 Runtime의 안전과 완료 판정을 대체하지 않는다.\n\n```mermaid\nflowchart LR\n    ROS[ROS 입력] --> Logger[독립 logger_node]\n    ROS --> Live[Monitor 실시간 수집]\n    Logger --> Archive[(rosbag2 원본 / SQLite 가공 자료)]\n    Archive --> Reader[읽기 전용 ArchiveReader]\n    Reader --> HTTP[Monitor HTTP / WebSocket]\n    Live --> HTTP\n    HTTP --> UI[브라우저]\n    HTTP -->|ROS 녹화 제어 서비스| Logger\n    Logger -->|상태 토픽| HTTP\n```\n\n## 수집과 한도\n\nMetadata는 전체 discovery를 수행하되 메시지는 기본, action, 사용자 선택 토픽만 구독한다. 마지막 선택자가 해제하면 해당 구독을 정리한다. 수신 주기는 발행 주기를 보장하지 않는다.\n\n| 항목 | 한도 |\n|---|---|\n| ROS discovery / UI 갱신 | 1 Hz / 최대 10 Hz |\n| Action / 선택 토픽 / 브라우저 | 32 / 16 / 8 |\n| 미리보기 전체 / 배열 / 깊이 / 문자열 | 2048 / 256 / 10 / 4096자 |\n| 지도 기본 / 설정 상한 | 524288 / 1048576셀 |\n| 경로 / 이벤트 ring / 브라우저 로그 | 4096점 / 2048건 / 500건 |\n| 느린 브라우저 전송 timeout | 2초 |\n\nQoS는 publisher endpoint 기준으로 선택하며, 혼합 publisher는 호환 가능한 약한 설정을 사용한다. Type import, QoS 오류, publisher 없음, 수신 없음, stale을 구분한다.\n\n## 공간 데이터와 재접속\n\n2D 레이어는 메시지 시각의 TF로 map_frame에 변환하고 회전 origin을 반영한다. Robot pose는 최신 TF를 사용하며 ±2초 밖 stamp는 stale로 처리한다. 정적 지도와 마지막 경로는 유지한다.\n\nTelemetry는 종류/토픽별 최신값으로 합친다. Runtime/Monitor boot ID는 별개이며 재접속 시 초기 snapshot을 제공한다.\n\n| 조건 | 표시 / 처리 |\n|---|---|\n| 미구독 토픽 | unmeasured |\n| 미리보기 한도 초과 | truncated; 전체 cloud/rosbag 대체 아님 |\n| 지도 / 경로 한도 초과 | 지도는 사유와 함께 거절 / 경로는 잘림 표시 |\n| Layer TF 없음 | 해당 레이어 숨김 |\n| 이벤트 ring에서 밀려남 | Gap 표시 |\n| 단절, 재시작, sequence gap | 명시적으로 표시; IDLE/성공/안전으로 추정 금지 |\n\n## 기록과 시간\n\nLogger가 ROS 수집, 가공, 정책, 설정 파일, 세션과 단일 writer를 소유한다.\nMonitor는 ROS 상태와 카메라의 실시간 표시, HTTP와 녹화 제어 client를 소유하며\n`ArchiveReader`로 공유 디렉터리의 과거 자료만 읽는다. 생성자는 저장 경로나 파일을\n만들지 않는다. Monitor 종료는 logger에 정지 요청을 보내지 않는다. 두 프로세스의\n메모리 Hub와 구독 수명은 독립적이며 `MissionJournal`은 Mission Runtime에 남는다.\n\nLogger 상태가 기본 3초 동안 갱신되지 않으면 `UNAVAILABLE`로 표시한다. 제어 서비스\n불가와 응답 timeout은 HTTP 503, 상태나 revision 충돌은 409다. 실패 시 로컬 writer를\n만들거나 정지 완료로 추정하지 않는다. 과거 기록은 logger가 없어도 조회할 수 있다.\n\n저장 형식, 시간 단위, 큐와 종료 계약은 [Logger 데이터 계약](../../cleany_logger/docs/data.md)을\n따른다. 기존 `state_directory`와 schema 1/2/3/4 읽기를 유지하며 HTTP 경로도 같다.\n\n| HTTP 경로 | 의미 |\n|---|---|\n| `/api/recordings/{session}/export` | 가공 데이터 SQLite |\n| `/api/recordings/{session}/bag` | 완료된 원본 bag ZIP; 녹화 중 409, 완료 bag 없음 404 |\n| `/api/recordings/{session}/raw?category=point_cloud&at=\u003cwall-seconds>` | 지정 시각 직전 원본 CDR 1건 |\n| `/api/recordings/{session}/replay?at=\u003cwall-seconds>` | SQLite의 가공 자료로 과거 재생 |\n\n## 기록 설정과 화면\n\n저사양, 기본, 정밀 프로필은 주기만 바꾸며 항목 선택, 토픽 이름, 녹화 정지 상태를 유지한다. 센서 원본 5종은 기본 OFF다. 항목별 Hz는 시간 표본화이며 점과 픽셀 수를 줄이지 않는다. 안전 판단 변경 이벤트는 해당 토픽을 끈 경우를 제외하고 Hz와 무관하게 보존한다. 정확한 항목과 주기는 `cleany_logger.recording`의 `SEMANTIC_RATES`, `cleany_logger.sources`의 출처 정의를 따른다.\n\n녹화 토픽 변경은 logger의 관측 출처만 바꾼다. 대시보드 실시간 관측은 Monitor parameter를 따른다. 설정 변경은 정지 상태에서만 허용하며 녹화 중 시작 요청은 기존 세션을 반환한다. logger 출처 세대가 바뀌면 가공 최신 상태와 주행, 조작 이력을 초기화하고 설정을 기록한다. 시간 막대는 SQLite 세션의 실제 기록 구간을 연결하고, 일시정지와 기록 없는 시각을 구분한다. 재생에는 라이브 표본을 섞지 않는다.\n\n실시간 호스트 리소스는 Monitor, 기록된 호스트 리소스는 logger의 `psutil` 관측이며 다른 DDS 호스트의 지표를 추정하지 않는다. 별도 worker가 기본 1초마다 수집하고 CPU/RSS 상위 프로세스는 각각 20개, 요약 이력은 300개가 기본값이다. 권한과 장치 오류, 첫 표본은 미측정으로 표시한다. 프로세스 CPU는 논리 코어 하나가 100%이며 RSS 합계는 호스트 메모리 사용량이 아니다.\n\n## Cartographer와 RViz\n\n기존 Cartographer 수집과 SQLite 재생은 호환을 위해 유지한다. `/submap_list`, `/trajectory_node_list`, `/constraint_list`, `/scan_matched_points2`를 읽고 allowlist된 SubmapQuery만 호출한다. 기본 한도는 서브맵 64개, 텍스처 262144 pixel, 이미지 캐시 16 MiB다. Epoch와 버전을 구분하고 불일치하거나 오래된 텍스처를 새 관측으로 표시하지 않는다.\n\n전용 웹 SLAM renderer는 제거됐다. 서브맵, 정합점, LiDAR, 점군과 costmap의 상세 공간 관측은 RViz를 사용한다. 원본 bag 재생 절차는 [실행 가이드](../../../../docs/RUNNING.md#개발-monitor)를 따른다. Nav2 BT 화면은 수신 XML과 상태를 기록하며 BT 실행이나 주행 명령을 보내지 않는다.\n\n관련 안내: [실행](../../../../docs/RUNNING.md), [환경](../../../../docs/DEVELOPMENT_SETUP.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n\n## 청소 BT와 조작 관측\n\n실행 → BT는 Mission의 실제 노드와 상태를 보여준다. 관측은 Perception port, 다음 행동 제안은 Planner port가 수행하고 Mission은 제안 검증과 실행 허가를 소유한다. 노드는 이 책임을 호출하는 작업 흐름이며 별도 인식 알고리즘을 뜻하지 않는다.\n\nExecuteOne을 선택하면 Action 준비, 접근, 집기, 운반, 놓기와 팔 복귀를 펼쳐 볼 수 있다. 이 상세는 서버 단계의 관측이며 청소 BT topology나 실행 순서를 변경하지 않는다. 별도 매니퓰레이션 화면에는 전체 단계, 실행 시간,
