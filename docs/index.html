 const h2=[...article.querySelectorAll('h2')];if(h2.length&&current!=='docs/index.md'){const toc=document.createElement('nav');toc.className='toc';toc.setAttribute('aria-label','이 페이지의 내용');for(const h of h2){const a=document.createElement('a');a.href=route(current,h.id);a.textContent=h.textContent;toc.append(a)}const h1=article.querySelector('h1');if(h1)h1.after(toc)}
 for(const a of document.querySelectorAll('aside a[data-page]')){const active=a.dataset.page===current;a.classList.toggle('active',active);if(active){a.setAttribute('aria-current','page');let parent=a.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement}}else a.removeAttribute('aria-current')}
 const footer=document.createElement('div');footer.className='footer';footer.textContent='Cleany 개발 문서 · 실행 조건과 상세 설정은 연결된 패키지 문서를 확인하세요.';article.append(footer);
 if((current.startsWith('ros2_ws/')||current.startsWith('docs/implementation/reference/'))&&page.body.length>6500){
  const sections=[];
  for(const heading of [...article.querySelectorAll(':scope > h2')]){
   const details=document.createElement('details');details.className='reference-section';const summary=document.createElement('summary');let sibling=heading.nextElementSibling;heading.before(details);summary.append(heading);details.append(summary);
   while(sibling&&sibling.tagName!=='H2'&&!sibling.classList.contains('footer')){const next=sibling.nextElementSibling;details.append(sibling);sibling=next}
   sections.push(details);
  }
  if(sections.length){const button=document.createElement('button');button.className='section-toggle';button.textContent='상세 항목 모두 펼치기';button.addEventListener('click',()=>{const open=sections.some(d=>!d.open);sections.forEach(d=>d.open=open);button.textContent=open?'상세 항목 모두 접기':'상세 항목 모두 펼치기'});article.querySelector('h1').after(button)}
 }
 if(section){const target=document.getElementById(section);let parent=target?.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement}target?.scrollIntoView()}else window.scrollTo(0,0);
}
for(const a of document.querySelectorAll('[data-page]'))a.href=route(a.dataset.page);
const packageGroups=new Map();
for(const [path,page] of Object.entries(pages)){
 if(!path.startsWith('ros2_ws/')){
  if(/^(tools|esp32|containers)\//.test(path)){
   const a=document.createElement('a');a.href=route(path);a.dataset.page=path;a.textContent=page.title;document.getElementById('tool-nav').append(a);
  }
  continue;
 }
 const name=path.split('/')[2];let group=packageGroups.get(name);
 if(!group){group=document.createElement('details');const label=document.createElement('summary');label.textContent=name.replace('cleany_','');group.append(label);packageGroups.set(name,group);document.getElementById('package-nav').append(group)}
 const a=document.createElement('a');a.href=route(path);a.dataset.page=path;a.textContent=page.title;group.append(a);
}
if(window.mermaid)mermaid.initialize({startOnLoad:false,securityLevel:'strict',htmlLabels:false,theme:'neutral',fontFamily:'system-ui, sans-serif',flowchart:{htmlLabels:false},suppressErrorRendering:true});
search.addEventListener('input',()=>{const terms=search.value.toLowerCase().trim().split(/\s+/).filter(Boolean);results.replaceChildren();if(!terms.length)return;let count=0;for(const [path,page] of Object.entries(pages)){const hay=(page.title+' '+path+' '+page.body).toLowerCase();if(!terms.every(t=>hay.includes(t)))continue;const a=document.createElement('a');a.href=route(path);a.textContent=page.title;const small=document.createElement('small');small.textContent=path;a.append(small);results.append(a);if(++count===16)break}if(!count){const p=document.createElement('p');p.className='empty';p.textContent='검색 결과가 없습니다.';results.append(p)}});
search.addEventListener('keydown',event=>{if(event.key==='Escape')results.replaceChildren();if(event.key==='Enter')results.querySelector('a')?.click()});
document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))results.replaceChildren()});
document.getElementById('menu').addEventListener('click',()=>{const open=document.body.classList.toggle('nav-open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});document.getElementById('scrim').addEventListener('click',closeMenu);
document.getElementById('close-image').addEventListener('click',()=>document.getElementById('image-dialog').close());
addEventListener('hashchange',render);render();
</script>
</body>
</html>
