수 있다. 선택 3D 결과에도 같은\ntrack/session/epoch를 전달한다. RGB header frame·snapshot-local 번호와 구분한다.\n세션을 비우면 추적을 사용하지 않는다. snapshot 조회·선택 복원은 저장된 ID를 유지한다.\n\n\n## 개체별 배치 확인\n\n`RegisterPlacementTarget.srv`는 `/sorting/register_placement_target`에서 execution ID,\n목적지, 촬영 header와 관측 OBB·종류로 개체를 고정하고 불투명 `verification_id`를 반환한다.\n`VerifyPlacement.verification_id`가 있으면 그 개체만 확인한다. 미등록·만료 ID는 실패하고\nlabel로 fallback하지 않는다. 빈 ID의 label-only 경로는 종류당 물체 하나인 기존 장면에\n유지한다. 종류 중복 장면은 등록 경로가 필요하다. 인터페이스 변경 후 consumer를 모두 재빌드한다.\n"},"ros2_ws/src/cleany_interfaces/docs/scene-and-grasp.md":{"title":"Scene와 Grasp 계약","body":"# Scene와 Grasp 계약\n\nScene inspection은 동기 RGB-D snapshot에서 객체를 찾고, Grasp planning은 선택 객체의 후보를 만든다. 도달성 선택은 MoveIt plan-only 검사이며 실제 수거 실행과 구분한다. 필드 원본은 패키지 msg/action/srv다.\n\n## Snapshot과 객체\n\n```mermaid\nflowchart TB\n    RGBD[\"동기 RGB-D\u003cbr/>capture stamp / optical frame\"] --> Inspect[\"InspectScene\u003cbr/>검출 → 분할 → 3D 복원 → TF\"]\n    Inspect --> Snapshot[\"Scene snapshot\u003cbr/>snapshot ID / object ID / OBB\"]\n    Snapshot --> Plan[\"PlanGrasp\u003cbr/>target / context cloud\"]\n    Plan --> Candidates[\"Score 순 후보\u003cbr/>같은 snapshot / object / frame\"]\n    Candidates --> Select[\"SelectReachableGrasp\u003cbr/>fresh RobotState / 양팔 IK / 충돌 검사\"]\n    Select --> Check[\"Pregrasp + grasp\u003cbr/>2구간 plan-only\"]\n    Check --> Result[\"후보 / 팔 / endpoint joint state\u003cbr/>Trajectory 미반환\"]\n    Result -.-> Execution[\"별도 조작 실행 계약\u003cbr/>실제 수거는 별도 검증\"]\n```\n\n| 항목 | 의미 |\n|---|---|\n| 좌표 | m, 오른손 좌표계 |\n| Array header | 전체 객체의 capture stamp, frame |\n| object_id | Snapshot 내 1부터 시작하는 선택 번호 |\n| snapshot_id | Opaque identifier |\n| OBB pose / size | 중심, 방향 / local X/Y/Z 전체 길이 |\n| Confidence | [0,1] |\n\nInspectScene은 detector → segmenter → 3D reconstruction → TF를 한 번 수행하며 취소할 수 있다. 빈 query는 기본 prompt를 사용한다. 정상 빈 장면은 success=true, ERROR_NONE, objects=[]로 반환한다. 오류는 timeout, API, JSON, mask, depth, plane, TF, cancel, internal로 구분한다.\n\n## 후보 생성\n\nPlanGrasp는 snapshot/object ID, target/context cloud, OBB를 직접 받아 숨은 cache에 의존하지 않는다. Cloud는 같은 nonzero capture stamp, frame을 가져야 하며, TF는 capture 시각을 사용한다. Latest TF로 대체하지 않는다.\n\nPointCloud2는 XYZ float32와 packed RGB float32/uint32를 지원한다. Step, payload를 검사하고 padded row를 처리한다. Provider, approach 설정은 cleany_grasping/config가 관리한다.\n\n| 조건 | 처리 |\n|---|---|\n| 후보 존재 | Score 내림차순 반환 |\n| 후보 없음 | 실패; 가짜 pose 생성 금지 |\n| TCP 회전 | Rigid rotation, det +1 필수; reflection 거절 |\n\n## 도달성 선택\n\nSelectReachableGrasp는 같은 snapshot/object/frame/OBB 후보에 대해 양팔 IK, state validity, pregrasp/grasp 2구간을 검사한다. 완전하고 fresh한 12관절 RobotState를 사용하고 goal 하나씩 처리한다. 임시 ACM은 terminal 전에 복원해야 하며 복원 실패는 성공이 아니다.\n\n성공 결과는 candidate index, arm, candidate, endpoint joint state다. Trajectory는 현재 RobotState에 종속되어 반환하지 않는다.\n\nPosition-only IK는 목표 orientation 도달을 검증하지 않는다. MuJoCo 접근 데모도 gripper close, attach, lift 성공을 증명하지 않는다.\n\n관련 안내: [Planning](../../cleany_moveit_config/docs/planning.md), [실행](../../../../docs/RUNNING.md).\n"},"ros2_ws/src/cleany_logger/docs/data.md":{"title":"Logger 기록 데이터 계약","body":"# Logger 기록 데이터 계약\n\n`logger_node`가 ROS 구독, 가공 관측 생산과 저장을 소유한다. Monitor는 실시간 표시와\nROS 제어 client, `ArchiveReader`를 사용하는 읽기 전용 HTTP adapter다. Logger는\nMonitor와 aiohttp, 카메라 preview 디코더, Mission Runtime을 import하지 않는다.\nrosbag2 의존성은 첫 원본 쓰기에 불러오며 저장 API와 과거 조회는 ROS 없이 사용할 수 있다.\n독립 실행과 상태 전이는 [런타임](runtime.md), 서비스 계약은 [인터페이스](interfaces.md)를 따른다.\n\nmotion 그룹의 `localization_status_topic`은 `/localization/status`의 정합 점수,\n판정 이유, 재정합 진행과 속도 제한 비율, 위치 복구 단계를 원본 String으로 저장한다. 기본 2Hz이며 저사양/정밀\n설정은 각각 1/5Hz다. 복구용 지도와 후보 근거 파일은 해당 실행의\n`runtime/localization/`에 별도로 보존한다.\n\n## 생산자와 저장 소유권\n\n| API | 입력과 계약 |\n|---|---|\n| `ObservationBuffer.put` | 가공 관측의 수신 wall 시각을 초 단위 `received_at`으로 전달할 수 있다. 생략하면 현재 wall 시각을 사용한다. |\n| `RecordingControls` | 항목, 주기, 출처와 원본 큐를 관리한다. `reserve`로 얻은 ticket을 `offer`에 전달한다. |\n| `RawMessage` | 토픽, 메시지 타입, 변경하지 않은 CDR bytes, 수신 wall 초, 선택적 ROS stamp 초와 정수 수신 ROS timestamp ns를 전달한다. |\n| `Recorder.append(snapshot)` | `sequence`, `rows`, 선택적 `gap`이 있는 snapshot을 기록한다. 각 row는 `seq`, `kind`, `key`, `data`, `received_at`을 포함한다. |\n| `Recorder.append_raw()` | 제어 큐를 비우고 rosbag2에 쓰며 SQLite에는 원본 위치만 남긴다. |\n| `Recorder.restore_settings(config)` | 저장된 정책을 현재 출처와 함께 검증해 복원한다. 없거나 읽을 수 없는 설정은 기본값을 유지한다. |\n| `Recorder.persist_settings(settings)` | 검증한 정책을 임시 파일, fsync와 rename으로 원자적으로 저장한다. |\n| `Recorder.start_session()` | 이전 writer를 종료하고 현재 한도와 같은 controls, bag factory로 새 UUID 세션을 연다. |\n| `Recorder.close()` | bag을 종료하고 SQLite를 commit한 뒤 닫는다. |\n| `export_sqlite`, `export_bag` | 가공 DB의 일관된 backup과 종료된 native bag ZIP을 만든다. HTTP 응답과 임시 파일 수명은 adapter가 소유한다. |\n| `ArchiveReader(directory)` | 경로만 보관하며 디렉터리, 설정 파일과 세션을 생성하지 않는다. |\n| `ArchiveReader.sessions`, `replay`, `raw_message`, `navigation_runs` | 세션 metadata, 시각별 가공 관측, CDR 한 건과 제한된 주행 요약을 읽는다. |\n\n생산자는 가공을 마친 JSON 호환 row를 전달한다. `received_at`은 wall 초이며\n`received_monotonic`은 선택적 표본화 시계다. `ros_time`, `source_id`, `category`,\n`topic_revision`으로 원본 시각, 개별 기록 선택과 출처 세대를 전달할 수 있다.\n같은 생산자의 `seq`는 증가해야 하며 출처 변경 시 `topic_revision`을 증가시킨다.\n\n`Recorder`와 SQLite 연결은 호출한 단일 worker가 소유하며 모든 쓰기와 종료를 같은\nthread에서 수행한다. ROS callback은 thread-safe한 `RecordingControls`만 사용한다.\n새 세션 전에는 `controls.transition()`으로 callback ticket을 봉인하고 이전 snapshot과\n원본 큐를 비운다. 이후 새 세션을 열고 생산자가 초기 snapshot을 전달한다. Monitor의\n시각별 HTTP 경로와 구독 계약은 [Monitor 계약](../../cleany_dev_monitor/docs/data.md)에 있다.\n\nlogger는 작업의 성공이나 실패를 판정하지 않고 생산자가 보낸 이벤트, 결과와 실패 코드를\n기록한다. `MissionJournal`의 실행 복구와 상태 소유권은 Mission Runtime에 남아 있다.\n\n## 저장 형식과 시간\n\nROS stamp와 수신 wall/monotonic 시각을 함께 저장하며 재생 축은 수신 wall이다. ROS clock 역행은 이벤트로 남기고 clock 정체와 수신 지연을 표시한다. Host wall 역행 환경의 정밀 재생은 지원하지 않는다.\n\n저장 경계는 ROS 메시지의 CDR 원문은 rosbag2, logger가 만든 조회와 재생 모델은 SQLite다. 선택하고 표본화한 기록이므로 전체 ROS 그래프의 무손실 녹화를 뜻하지 않는다.\n\n| 데이터 | 저장소 |\n|---|---|\n| 선택한 센서, 지도, 경로, 위치, Runtime, BT, 안전 진단, 로그와 SLAM 원문 | rosbag2의 표준 `sqlite3` storage |\n| TF, 시계, 카메라 CameraInfo와 선택한 로봇 모델 문맥 | 같은 bag에 수신마다 기록 |\n| 화면 레이어, 미션, BT, 안전 상태, 로그와 호스트 리소스 | 가공 SQLite의 가공 자료 |\n| 원본의 토픽, 타입, 수신 시각과 bag timestamp | SQLite `raw_index`; payload 없음 |\n\n`state_directory` 아래 `\u003csession>.sqlite3`, `bags/\u003csession>/`, `recording-settings.json`을 둔다. 기본 위치는 `~/.local/state/cleany/recordings`이며 실행 시 `-p state_directory:=/absolute/path`로 바꾼다. 기록은 자동 삭제하지 않는다. `web/dist`와 ROS install은 생성물이다.\n\nROS callback은 최대 8 MiB 메시지를 32 MiB/128건의 큐로 넘기고 logger 전용 writer thread가 bag 쓰기와 종료를 소유한다. 초과, 쓰기 실패와 용량 중단은 유실 건수와 `raw_gap` metadata로 남긴다. rosbag2 runtime이 없거나 쓰기에 실패하면 원본 기록을 중단하며 SQLite payload로 대체하지 않는다. 세션 제한과 `total_limit_bytes`는 SQLite와 bag을 합산한다.\n\nSQLite bag은 rosbag2의 `resilient` preset을 사용한다. WAL 파일도 저장 용량에 포함하며\n원본 조회의 읽기 트랜잭션 때문에 writer가 잠기지 않도록 한다. 연속 센서 bag을 별도로\n확보하는 절차는 [실물 매핑 실행](../../../../docs/RUNNING.md#오프라인-slam-비교용-원본-bag)을 따른다.\n\n정지 후 녹화를 시작할 때 새 UUID를 만들고, 녹화 중 시작 요청은 같은 세션을 반환한다. 정지하면 SQLite와 bag writer를 닫는다. `bag_state`는 `not_started`, `recording`, `finalized`, `incomplete`를 구분하며 완료된 bag만 ZIP으로 내보낸다. 원본 timestamp는 수신 ROS clock의 nanosecond, SQLite 시간축은 수신 wall 초다. 동일 ROS timestamp의 원본도 수신 순서로 구분한다. 이전 schema 1/2/3 SQLite는 수정하거나 자동 변환하지 않고 계속 읽는다.\n\n원본 구독은 화면과 카메라 preview lease에 독립적이다. CameraInfo는 이미지 토픽의 형제 `camera_info`에서 요청한다. TF와 시계, CameraInfo는 Hz로 누락시키지 않는다. 설정 변경과 새 세션은 transient-local 원본 구독을 다시 생성해 retained 자료를 요청한다.\n\n## 조작 이력\n\n공유 관측기는 조작 execution record의 revision과 서버 wall timestamp로 실행별\n단계 구간을 집계한다. Logger와 Monitor가 각각 독립적으로 집계하며 기본 최근\n20개 실행, 실행당 64개 구간을 보존한다. 늦은 구독, revision 누락과 시각 역행을\n표시하며 수신 시각 이후의 결과를 과거 재생에 섞지 않는다. Logger의 관측 출처를\n바꾸면 조작 이력과 revision을 초기화한다. 집계 결과는 해당 조작 출처의 녹화\n선택을 따르며 Monitor나 HTTP 모듈을 필요로 하지 않는다.\n\n## 기록 정책\n\nMarker 계열과 Cartographer 메시지, OccupancyGrid, SLAM의 matched-point 점군은\n`bags/\u003csession>/diagnostics/`의 별도 rosbag2에 기록한다. 센서와 TF는 상위 bag에\n남는다. 두 bag은 원래 수신 timestamp와 CDR을 유지하며, 용량 제한과 ZIP 내보내기는\n두 bag을 모두 포함한다. 과거 단일 bag도 같은 원본 조회 API로 읽는다.\n상위 bag만 재생하면 진단 토픽은 나오지 않으므로 진단 비교에는 하위 bag도 사용한다.\n\nSLAM 진단 원본에도 `slam_trajectory_topic`, `slam_constraints_topic`,\n`slam_submaps_topic`, `slam_matched_points_topic`의 `source_hz`와\n`source_enabled`를 적용한다. 0.1 Hz는 10초마다 최대 한 건이며, 중간 진단 상태는\n보존하지 않는다. 원본 센서의 full-rate 기록과 진단의 표본화는 서로 독립적이다.\n`joint_state_topic`을 비활성화하면 기본 `/joint_states`도 우회 기록하지 않는다.\n\n출처 schema와 기본 주기는 `cleany_logger.sources`, 기록 선택과 프로필은\n`cleany_logger.recording`이 소유한다. 생산자는 이 schema로 ROS 구독을 설정할 수\n있으며 logger_node가 직접 DDS discovery와 구독을 생성한다. 큰 원본의 선택은\n기본 OFF이며 카메라, 점군과 voxel은 대용량이므로 필요한 토픽과 Hz를 선택한다.\n기록 정책은 세션에, 큐 폐기 수는 metadata에 남기고 기존 파일을 자동 삭제하지 않는다.\n\n세션 정책 `limit_mib`는 10~10240 MiB를 허용한다. `total_limit_bytes`는 이전 세션까지 포함하는 별도 총량 제한이며, 기존 기록은 자동 삭제하지 않는다.\n\n\n슬립 분석에는 motion 그룹의 `slip_topic` (`/navigation/slip`, String, 5Hz)과\n`traction_recovery_topic` (`/navigation/traction_recovery`, String, 수신 이벤트)를 사용한다.\n기본 source schema에 포함되어 토픽 변경과 개별 제외가 가능하다. 기존 bag에 raw CDR로 저장하며\n동일한 용량/보존 정책을 따른다. 관측의 위치 및 명령 문맥은\n[슬립 인터페이스](../../cleany_navigation/docs/interfaces.md#슬립-관측의-분석-문맥)를 따른다.\n"},"ros2_ws/src/cleany_logger/docs/interfaces.md":{"title":"cleany_logger 노드 인터페이스","body":"# cleany_logger 노드 인터페이스\n\n## cleany_logger\n\n실행 파일은 `logger_node`이며 원본은 [node.py](../cleany_logger/node.py)다.\n기본 노드 이름은 `/cleany_logger`다. 녹화 제어는 로봇 구동 명령을 생성하지 않는다.\n\n| 종류 | 기본 이름 | 타입 | 계약 |\n|---|---|---|---|\n| 토픽 발행 | `~/status` | `cleany_interfaces/msg/RecordingStatus` | Reliable, Transient Local, depth 1, steady clock 2 Hz |\n| 서비스 제공 | `~/get_config` | `cleany_interfaces/srv/RecordingControl` | 현재 설정과 writer 상태 조회 |\n| 서비스 제공 | `~/configure` | 같은 타입 | 정지 상태에서만 전체 설정 적용, 선택적 revision 비교 |\n| 서비스 제공 | `~/start` | 같은 타입 | 활성 상태에서는 같은 세션을 반환, 정지 후에는 새 UUID 생성 |\n| 서비스 제공 | `~/stop` | 같은 타입 | 현재 `session_id` 필수, 다른 세션 거절, flush와 종료 후 응답 |\n| 서비스 요청 | `/submap_query` | `cartographer_ros_msgs/srv/SubmapQuery` | 기존 가공 기록 호환을 위한 읽기 전용 Cartographer 조회 |\n\n공유 관측기의 기본 ROS 입력과 QoS 선택은 [Monitor 입력 표](../../cleany_dev_monitor/docs/interfaces.md#cleany_dev_monitor)를\n따른다. logger에는 브라우저 선택이나 카메라 preview lease가 없으며, 녹화 선택은\n자체 discovery에 적용한다. 원본 CDR 허용 타입은 `recording.py`의 `CONTEXT`, `TYPES`에서\n관리한다. 지도, 경로, 위치, 속도, Runtime, BT, 안전 진단, 로그와 SLAM 원문, 선택한\n센서 원문을 기록하고 TF, clock, CameraInfo와 로봇 모델을 함께 요청한다.\nDiscovery된 타입을 읽더라도 원본 허용 타입과 다르면 오류를 표시하고 저장하지 않는다.\n\n`RecordingConfig`는 preset, MiB 한도, category별 선택과 주기, source별 토픽과\n선택과 주기를 담는다. `RecordingSource`의 topics, enabled와 rate_hz 배열은 같은\n원소 순서를 쓰며, 내부 계산 출처는 빈 topics와 한 개의 enabled/rate_hz를 쓴다.\n`rate_hz=-1`은 수신마다 기록한다는 뜻이다. 그 밖의 유한한 양수만 허용한다.\n\n`RecordingControl` 요청의 `expected_revision=0`은 비교를 생략한다. 실패 응답에는\n`success=false`, 사유와 현재 설정과 상태를 담는다. `request_id`는 호출 식별용이며\n영속 중복 제거 키가 아니다. 시작과 정지는 상태와 session ID로 멱등 처리한다.\n\n상태는 `IDLE`, `RECORDING`, `STOPPING`, `ERROR`를 구분한다. `boot_id`는 프로세스\n수명, `session_id`는 기록 수명이며 `revision`은 정책과 큐 ticket 세대다. `updated_at`과\ncounter의 `received_at`은 wall 초, `stored_bytes`는 세션 SQLite와 bag 합계다.\n관측 간격은 logger 설정값이며 Monitor의 호스트 측정 간격과 구분한다.\n카운터는 새 설정과 새 녹화 시 초기화하고 정지 응답에는 마지막 누적값을 유지한다.\n\n`record_on_start`, 저장 경로와 한도, 입력 토픽과 frame은 ROS parameter다. 기본값은\n[logger.yaml](../config/logger.yaml)과 공유 관측기 [observer.py](../cleany_logger/observer.py)를\n따른다. HTTP endpoint는 logger에 없다.\n\n## CLI\n\n실행 파일 `logger`는 `/cleany_logger_cli_\u003c임의 suffix>` 임시 ROS 노드를 사용한다.\n[cli.py](../cleany_logger/cli.py)의 명령 처리는 저장 파일을 열지 않으며\n[cli_client.py](../cleany_logger/cli_client.py)가 위 네 서비스를 호출한다. 별도 logger\n노드가 같은 ROS domain에서 실행 중이어야 한다. 실행 예시는 [RUNNING](../../../../docs/RUNNING.md#독립-logger)을 따른다.\n\n| 명령 | 계약 |\n|---|---|\n| `status` | `get_config`로 현재 상태, session, 저장 바이트와 counter를 조회 |\n| `start` | 현재 revision을 확인하고 시작, 이미 녹화 중이면 같은 세션 |\n| `stop` | 현재 session과 revision을 조회한 뒤 해당 세션만 정지, `--session`으로 명시 가능 |\n| `topics`, `topics list` | 센서 원본과 가공 출처의 ID, 그룹, 실제 선택 여부, 토픽과 주기 조회 |\n| `topics set \u003cID>` | 정지 상태에서 `--topic`, `--hz`, `--enable`, `--disable` 중 지정한 값만 변경 |\n\n`--node`는 절대 logger 노드 경로이며 기본 `/cleany_logger`, `--timeout`은 RPC별\n발견과 응답을 합한 제한이며 기본 3초다. `--json`은 성공 결과를 stdout JSON으로\n출력한다. CLI 오류와 대용량 원본 안내는 stderr로 출력한다. 조회 결과의 `settings`는\n전체 정책이며 `topics`의 `enabled`는 상위 그룹과 개별 선택을 함께 반영한다.\n\n설정은 조회한 revision과 비교해 적용하므로 동시에 바뀐 정책을 덮어쓰지 않는다.\n상위 그룹이 꺼져 있을 때 하나의 출처를 활성화하면 다른 출처는 꺼진 상태를 유지한다.\n토픽 변경만으로 기록 선택을 켜지는 않는다. 설정은 logger가 저장하며 다음 실행에도\n복원한다. 지원하는 ID는 logger의 출처 schema와 센서 원본 역할에서 제공한다.\n\n| 종료 코드 | 의미 |\n|---|---|\n| `0` | 조회 또는 요청 완료, 시작은 RECORDING, 정지는 IDLE 확인 |\n| `2` | 잘못된 인자나 설정, ROS Python 의존성 누락 |\n| `3` | 서비스 발견 또는 응답 제한 초과 |\n| `4` | 상태, session, revision 충돌 또는 logger의 요청 거부와 종료 실패 |\n| `130` | 사용자 인터럽트 |\n\nTimeout과 인터럽트는 요청 취소나 정지 완료를 뜻하지 않는다. 처리 중인 요청이\n완료됐을 수 있으므로 `status`로 확인한다. CLI 종료는 별도 정지 요청을 보내지 않는다.\n\n## 실물 매핑 원본\n\n선택 가능한 motion 출처에 `wheel_state_topic`, `wheel_command_topic`, `joint_state_topic`,\n`canonical_odometry_topic`을, SLAM 출처에 `raw_scan_topic`을 추가한다. 기본 토픽은 각각\n`/base/wheel_state`, `/base/wheel_command`, `/joint_states`, `/odom`, `/scan_raw`다.\n허용 원본 타입은 WheelState, WheelCommand, JointState, Odometry, LaserScan으로 제한한다.\n매핑 프로필은 이 출처를 수신마다 기록하고 `/scan`, TF, 지도와 함께 한 Logger session에 보존한다.\n"},"ros2_ws/src/cleany_logger/docs/runtime.md":{"title":"Logger 실행과 책임","body":"# Logger 실행과 책임\n\n`logger_node`는 대시보드 없이 ROS 입력을 구독하고 녹화하는 독립 프로세스다.\n원본 CDR은 rosbag2, 가공 관측과 조회 index는 SQLite에 저장한다. 수집 정책,\n주행 요약과 조작 이력 집계, 호스트 리소스, 원본 큐, 단일 writer와 세션 종료를 소유한다.\n대시보드를 종료하거나 다시 열어도 활성 세션은 유지한다.\n\n![Logger 기록 구조](assets/logger-architecture.svg)\n\nLogger와 Monitor 서버는 같은 호스트에서 같은 `state_directory`를 사용한다.\n브라우저는 원격 접속할 수 있다. 독립 CLI 실행 파일 `logger`는 ROS 서비스로\n시작, 정지, 상태 조회와 토픽 설정을 제공하며 대시보드를 요구하지 않는다. 화면의 토픽 선택과 카메라 preview는 녹화 정책을\n바꾸지 않는다. Monitor에는 writer와 logger 연결 실패 시 대체 녹화 기능이 없다.\n\n독립 launch는 `logger.launch.py`, 설정은 `config/logger.yaml`이다.\n`record_on_start`가 true면 저장된 선택과 주기를 복원해 새 세션을 시작한다.\nfalse면 대기하며 시작 요청 전에는 세션 DB를 만들지 않는다. 저장된 active 값은\n재시작 시 자동 적용하지 않는다. 실행별 새 UUID를 쓰고 기존 세션에 이어 쓰지 않는다.\n\n저장 디렉터리의 `.logger.lock`은 프로세스 수명 동안 독점하며 중복 logger를 거절한다.\n비정상 종료된 `recording` bag은 다음 시작 시 `incomplete`로 표시한다. 자동 삭제나\n손상 bag 복구는 수행하지 않는다. 정상 정지는 큐, SQLite와 bag 종료가 끝난 뒤 응답한다.\n\nlogger는 상태 전이와 작업 성공을 판정하지 않으며 Mission Runtime의\n`MissionJournal`을 열거나 갱신하지 않는다. 실패 코드는 생산자가 보낸 의미를 보존한다.\n\nROS 계약은 [인터페이스](interfaces.md), 저장 계약은 [데이터](data.md),\n실행 절차는 [RUNNING](../../../../docs/RUNNING.md#독립-logger),\n검증 절차는 [TESTING](../../../../docs/TESTING.md)을 따른다.\n"},"ros2_ws/src/cleany_manipulation_bt/README.md":{"title":"cleany_manipulation_bt","body":"# cleany_manipulation_bt\n\n승인된 `snapshot_id/object_id`의 쓰레기 또는 분실물 하나를 MuJoCo에서 수거하는 ROS Action 서버다.\n실제 BehaviorTree.CPP 4 실행기가 동작 순서를 소유하고, Python은 기존 인식, MoveIt,\n그리퍼 동작과 SQLite 기록을 연결한다. Planner와 Mission Manager는 포함하지 않는다.\n기존 mock 실행에는 이 패키지의 C++ 모듈을 import하지 않는다.\n\n| 하려는 일 | 안내 |\n|---|---|\n| 빌드·자동 검사 | [빌드와 검증](#빌드와-검증) |\n| 장면 실행·관찰·Goal 요청 | [실행](#실행) |\n| 터미널 출력 조정 | [로그 설정](#터미널-로그) |\n| 실행 검증·취소 | [계약과 증거](#계약과-증거), [취소 방식](#취소) |\n| 결과 조회·모니터 이해 | [기록과 모니터](#기록과-모니터) |\n\n## 빌드와 검증\n\n아래 Make 명령은 레포 루트에서 실행한다.\n\nUbuntu 22.04 / ROS 2 Humble의 `behaviortree_cpp` 4.x, `pybind11_vendor`, Python 개발\nheader가 필요하다. 설치는 [개발환경 안내](../../../docs/DEVELOPMENT_SETUP.md)를 따른다.\n\n```bash\nmake build-manipulation-bt\nmake test-manipulation-bt\nmake test-manipulation\n```\n\n첫 검사는 실제 C++ 트리와 가짜 backend, DDS Action/취소/조회, snapshot TTL,\n수거 코드 추출 회귀를 검증한다. 두 번째 mock 검사는 기존 성공/실패/취소/재시작을\n보존하는지 확인한다. 가짜 backend의 성공은 물리 수거 성공 근거가 아니다.\n\n## 실행\n\n기존 스터디카페의 YOLOE head/손목 모델, text encoder, PyTorch/Ultralytics와\n`GEMINI_API_KEY`가 필요하다. 모델 경로와 인식 준비 조건은\n[기존 수거 실행 안내](../cleany_skill_executor/docs/study_cafe_sorting_usage.md)를 따른다.\n키는 코드/ROS parameter에 넣지 않고 실행 환경에서 제공한다.\n\n```bash\n# 키를 로컬 파일에 설정한 경우에만 사용. 키 자체를 로그에 출력하지 않는다.\nsource ~/.config/cleany/gemini.env\nmake sim-mujoco-manipulation\n# GUI가 필요한 환경: SORTING_ARGS='headless:=false use_rviz:=true'\n```\n\nheadless에서도 기존 GLFW 카메라 renderer에는 유효한 `DISPLAY`가 필요하다.\nGUI 로그인 터미널에서 실행하거나 Xvfb가 설치된 CI에서\n`xvfb-run --auto-servernum make sim-mujoco-manipulation`을 사용한다.\n\n[manipulation_bins.yaml](config/manipulation_bins.yaml)은 기존 tray 좌표를 유지하고\n시뮬레이션 trash bin의 Y 외측 치수를 170 mm에서 180 mm로 넓힌다. 기존 컵의 센서 OBB를\n회전 독립 bounding sphere와 5 mm 여유로 검사하면 기존 170 mm opening에 맞지 않는 경우가\n있어 BT 경로에만 별도 설정을 사용한다. 시뮬레이터, MoveIt 충돌 형상과 평가기가 같은 설정을 읽는다.\n관측 payload의 수거함 적합성을 팔 이동 전에 검사하고 접근 전 재관측에서도 다시 검사한다.\n첫 팔 이동 전 재관찰의 임시 충돌 객체를 정리하고, 새 pregrasp 작업에서 대상 접촉을\n금지한 뒤 팔과 그리퍼를 함께 이동한다. 이후 접근 단계에서는 다시 재관찰하고 접촉을 허용한다.\n실물 수거함/장착 사양의 확정은 아니다. 기존 자동 sorting의 bin 설정은 유지한다.\n\n이 launch는 MuJoCo, 카메라, Perception, grasp/selection 서버, MoveIt, 지도와 결과 평가기,\nBT Action 서버를 시작한다. 자동으로 물체를 고르는 `SortingCoordinator.run()`은 실행하지 않는다.\nlaunch 직후에는 BT가 Goal을 기다리므로 Live에 연결돼도 모든 노드가 IDLE이다.\n대기 중에도 카메라와 깊이 지도는 갱신되지만 정상 프레임 진단은 기본 로그에 출력하지 않는다.\nBT의 RUNNING 전환을 보려면\n아래의 관찰 요청 후 지정 물체의 `manipulation_test_client --namespace /sim` Goal을 보내야 한다.\n기존 sorting 프로필의 알려진 형상 OctoMap updater, jaw clearance와 좌표 보정을\n재사용한다. PTP 이동은 그리퍼 추종 오차를 줄이기 위해 속도/가속도 scaling을 각각 0.08로\n설정하며 같은 이름의 launch 인자로 조정한다. controller 실패 후 자동 재실행하지 않는다.\n이는 시뮬레이션 편의 설정이며 실제 로봇의 안전 검증으로 해석하지 않는다.\n평가기의 MuJoCo 정답 좌표를 grasp, 물체 연결 또는 경로 계획에 사용하지 않는다.\n\n다른 터미널에서 detector-only 관찰을 요청한다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 action send_goal /perception/inspect_scene cleany_interfaces/action/InspectScene \\\n  \"{query: 'Detect objects on the table.', tracking_session_id: 'desk-validation-1', snapshot_id: '', selected_object_id: 0}\"\n```\n\n반환된 실제 snapshot과 쓰레기 object ID를 지정한다. snapshot cache의 기본 TTL은\n120초이고 최근 두 장만 남는다. 만료됐으면 새 관찰을 요청해야 한다.\n\n같은 고정 베이스 책상 작업에는 같은 `tracking_session_id`를 사용한다. BT는 승인된\nsnapshot의 session/epoch/track ID를 재관측에서도 확인한다. 베이스 이동 후에는 새 세션을\n시작한다. 자세한 조건은 [인식 패키지의 물체 추적](../cleany_perception/docs/runtime.md#고정-베이스-책상-물체-추적)을 따른다.\n빈 세션은 추적을 끄는 호환 경로이며, 재관측에서 같은 종류가 여러 개면 수거를 중단한다.\n\n```bash\nros2 run cleany_skill_executor manipulation_test_client \\\n  --namespace /sim --snapshot-id '\u003c실제 snapshot_id>' --object-id 1 \\\n  --destination-id trash_right --timeout 1200\n# 출력된 execution_id로 조회\nros2 run cleany_skill_executor manipulation_test_client \\\n  --namespace /sim --execution-id '\u003cexecution_id>' --query\n# 취소 재현: 위 실행 명령에 --cancel-stage GRASPING 추가\n```\n\n## 터미널 로그\n\n| launch 인자 | 기본값 | 상세 출력 |\n|---|---|---|\n| `log_level` | `info` | `debug`: 후보 평가, 좌표·오차·타이밍, 깊이 지도 프레임 진단 |\n| `backend_log_level` | `warn` | `info`: MuJoCo·MoveIt·TF 초기화와 계획 상세 |\n\n기본 출력에는 준비 완료, 주요 작업 진행, 경고·오류와 컨트롤러 spawner의\n준비 완료가 남는다.\n\n```bash\nmake sim-mujoco-manipulation SORTING_ARGS=\"headless:=false log_level:=debug\"\n# 외부 backend의 초기화·계획 상세까지 확인\nmake sim-mujoco-manipulation SORTING_ARGS=\"headless:=false log_level:=debug backend_log_level:=info\"\n```\n\n`log_level`은 끌리니 로거와 `move_group.scene_mapping`에 적용한다.\n`debug`에서도 ROS 내부 대기 루프의 로그는 함께 켜지지 않는다. 두 옵션은\n`debug`, `info`, `warn`, `error`, `fatal` 중에서 선택한다.\n\nMoveIt 2.5.9의 종료 시 controller plugin unload 문제를 피하기 위해\n`keep_controller_plugin_loaded:=true`를 기본으로 전달한다. 적용 범위와 종료\n회귀 검사는 [MoveIt README](../cleany_moveit_config/docs/planning.md#humble-controller-plugin-teardown)를 따른다.\n\n## 계약과 증거\n\n| ROS 경로 | 용도 |\n|---|---|\n| `/sim/manipulation/execute_skill` | 기존 `ExecuteManipulationSkill` 계약, `execution_profile=mujoco` |\n| `/sim/manipulation/get_execution` | 기존 `GetManipulationExecution` 조회 계약 |\n| `/sim/manipulation/cancel` | `CancelManipulation`: execution_id와 취소 mode 요청 |\n| `/sim/manipulation/execution_events` | Reliable/Transient Local 기록 이벤트 |\n| `/sim/manipulation/bt_transitions` | 실제 UID, 노드 ID, 이전/현재 상태 JSON |\n| `/perception/get_scene_snapshot` | 읽기 전용 `GetSceneSnapshot`; TTL/촬영 시각 유지 |\n\nAction 이름을 remap하면 내부 취소 client도 같은 이름의 `/_action/cancel_goal`을\n사용한다. 서버 종료는 진행 중인 tick의 기록 쓰기를 기다린 뒤 DB를 닫으며,\n종료 자체를 정지 확인이나 수거 완료 근거로 기록하지 않는다.\n\n정상 수거의 `SUCCESS`에는 물체 이탈·안착, 팔 복귀와 최종 정지 근거가 모두 필요하다.\n관절 메시지의 시각과 내용이 모두 같은 연속 중복 수신은 새 관측으로 세지 않는다.\n기존 수신 시각을 유지하므로 멈춘 스트림은 만료되고, 같은 시각에 내용이 달라지거나\n시각이 역행하는 메시지는 기존 무효 판정을 따른다. 중복만으로 정지를 확인하지 않는다.\n스터디카페 backend의 로컬 제어 실행기는 한 주기의 `read/update/write`에 같은 시각을\n사용하고 새 시뮬레이션 시각에서만 다음 주기를 실행한다. 무효 피드백 로그의\n`invalid_reasons`는 `repeated_stamp`, `backward_stamp`, `missing_velocity`,\n`stale_receipt`, `clock_skew` 등을 구분하며, `clock_stopped`는 시계 정지를 표시한다.\n피드백 만료와 정지 확인 기준은 변경하지 않는다.\n실패·취소에서도 이미 확인한 물체 상태와 놓기 결과를 보존한다.\n정지 미확인, 장치 오류, 비상정지와 내부 오류는 `FATAL`로 종료하고 후속 Goal을 차단한다.\n실제 트리 순서, 대상 검사, timeout과 늦은 응답 처리는 [상세 실행 계약](docs/execution_contract.md)을 따른다.\n\n### 취소\n\n일반 Action cancel은 `CHECKPOINT`다. `manipulation/cancel` 서비스는\n`IMMEDIATE`, `CHECKPOINT`, `RETURN_ARM`을 제공한다.\n취소 수락 후에도 이전 동작의 종료와 정지 확인을 기다린다.\n`RETURN_ARM`은 정지 확인 뒤 필요하면 현재 위치에서 그리퍼를 열고, 실행 시작 때 저장한 팔 자세로 복귀한다.\n모드별 절차와 제한은 [상세 취소 계약](docs/execution_contract.md#취소)을 따른다.\n\n### 정상 수거의 놓기·정지 확인\n\n독립 안착 평가와 새 관절 샘플로 확인하며, 명령 성공이나 취소 응답만으로 정지를 인정하지 않는다.\n평가기의 `false`는 제한 시간 안의 확인 대기이며, 확인 기한을 넘기면 `UNKNOWN / VERIFICATION_TIMEOUT`이다.\n`arm_recovered=true`는 실행 시작 자세로의 복귀 근거다. 모바일 베이스의 주행 허가는 별도 readiness 계약이 필요하다.\n판정 조건과 설정은 [놓기·정지 확인](docs/execution_contract.md#정상-수거의-놓기정지-확인)을 따른다.\n\n### 예상하지 못한 실행 예외\n\n프로그램 오류는 `INTERNAL_ERROR`로 기록하고 별도 종료 경로에서 정지를 확인한다.\n정지 처리와 최종 결과는 [실행 예외 계약](docs/execution_contract.md#예상하지-못한-실행-예외)을 따른다.\n\n## 기록과 모니터\n\n### 실행 기록\n\n기본 DB는 `$XDG_STATE_HOME/cleany/manipulation_mujoco/executions.sqlite3`이다.\n`XDG_STATE_HOME`이 없으면 `~/.local/state`를 사용한다. mock DB와 분리되어 있으며\n`bt_database_path:=/절대/경로.sqlite3`로 바꿀 수 있다. 각 실제 동작의 시작 checkpoint를\n먼저 메모리에 반영하고 SQLite 저장을 시도한다. 완료 관측과 최종 Result도 같은 방식으로 처리한다.\n`bt_transitions` 테이블에는 C++ 실행기의 실제 UID/상태 전환을 추가 저장한다.\n실행 기록이나 BT 상세 로그 저장 실패는 경고로 남기며 동작 중단, Result의 status·error_code 변경,\n후속 Goal 차단의 원인으로 사용하지 않는다. 조회는 프로세스 메모리의 최신 기록을 반환한다.\n프로세스 중단 기록은 재시작 시 INTERRUPTED/사람 확인 필요로 바꾸고 자동 재개하지 않는다.\nHELD/UNKNOWN 또는 FATAL이 남으면 후속 Goal을 차단한다.\n재시작 복구와 재시작 이후 중복 검사는 디스크에 저장된 기록만 사용하며 미저장 메모리 기록은 유실된다.\n기동 시 DB 초기화와 기존 기록 읽기는 여전히 필수이며, 실패하면 서버를 기동하지 않는다.\n새 실행은 이전 worker와 ROS 요청이 종료되어야 허용하며 늦은 응답은 기존 context에만 적용된다.\n\n### Live 모니터\n\nVS Code BehaviorTree Viewer 0.1.2의 **Monitor**를 사용한다.\n\n| 서버 | 기본 주소 | 표시 근거 |\n|---|---|---|\n| MuJoCo BT | `127.0.0.1:1667` | 실제 C++ 트리의 UID와 노드 상태 |\n| Mock | `127.0.0.1:1666` | 모의 실행 이벤트를 설계 XML에 투영 |\n\n1. VS Code workspace 설정에 `behaviortreeViewer.monitorHost=127.0.0.1`,\n   `behaviortreeViewer.monitorPort=1667`을 지정한다.\n2. 기존 Monitor 연결을 끈 뒤 다시 켠다. 파일명에 `(live)`와 `Monitoring active`가 표시되면 연결된 상태다.\n3. [실행](#실행)의 관찰 요청과 Goal 전송을 수행한다. Goal 전송 전에는 모든 노드가 IDLE이다.\n\nMuJoCo 포트는 `bt_monitor_port`로 변경한다. 뷰어의 기본 포트는 1666이므로 MuJoCo 주소를 지정해야 한다.\n모니터는 FULLTREE/STATUS를 제공한다. 트리 구조 XML은 실행기 생성 시 한 번 보관하고,\n모니터 조회마다 실제 노드 상태를 읽는다. 로봇 명령이나 blackboard 변경 기능은 제공하지 않는다.\n\n실행 종료 후 native BT가 노드를 IDLE로 reset하면 진행 색도 정리된다.\n뷰어 0.1.2는 전체 IDLE 상태가 1.5초 이어지면 표시를 흐리게 한다.\n종료 결과는 조회 서비스에, 상태 전환 이력은 ROS/SQLite에 남는다.\n\n### 실행 설정\n\n[config/manipulation_mujoco.yaml](config/manipulation_mujoco.yaml)의 ROS parameter로\n동작 상한(180초), 단계별 안착 확인(10초), 정지 평가(10초), 피드백/시계 신선도(2초)와\n지원 label을 조정한다. 이 수치는 첫 시뮬레이션 구현의 조정 가능한 기본값이다.\n전체 물체 수거 성공률이나 실제 하드웨어에 대한 보장을 뜻하지 않는다.\n"},"ros2_ws/src/cleany_manipulation_bt/docs/execution_contract.md":{"title":"MuJoCo Manipulation 실행 계약","body":"# MuJoCo Manipulation 실행 계약\n\n```mermaid\nflowchart TD\n  Goal[\"승인된 대상\"] --> Check[\"입력 · 분류 · 목적지 검증\"]\n  Check --> Execute[\"계획과 동작 / 비동기 BT\"]\n  Execute --> Success[\"놓기 · 복귀 · 정지 평가\"]\n  Success --> Result[\"최종 Result\"]\n  Execute -->|\"실패 / timeout / 취소\"| Stop[\"StopAndAssess\"]\n  Stop --> Result\n```\n\n그림의 결과는 하단 조건을 충족해야 확정됩니다. 취소·timeout은 단순히 실행 함수를 종료하는 것으로 완료되지 않습니다.\n\n승인된 물체 하나를 실행하는 `execution_profile=mujoco` 서버의 상세 계약이다.\n실행 명령과 ROS 경로는 [패키지 README](../README.md)를 따른다.\nGoal·Feedback·Result 필드는 [공통 Action 명세](../../cleany_skill_executor/docs/02_execute_manipulation_skill_action_spec.md)에 있다.\n\n| 확인할 내용 | 위치 |\n|---|---|\n| 실행 순서, 대상 검사와 timeout | [실행 순서와 결과](#실행-순서와-결과) |\n| 취소 모드와 늦은 결과 처리 | [취소](#취소) |\n| 놓기 검증과 관절별 정지 근거 | [정상 수거의 놓기·정지 확인](#정상-수거의-놓기정지-확인) |\n| 내부 예외와 오류 종료 | [예상하지 못한 실행 예외](#예상하지-못한-실행-예외) |\n\n## 실행 순서와 결과\n\n[collect_trash_mujoco.xml](../trees/collect_trash_mujoco.xml)이 준비, 잡기, 놓기, 확인과 종료를\n정한다. C++ 노드는 `start(node_id, execution_id)` 후 RUNNING을 반환하고 후속 tick에서\n`poll(operation_id)`를 호출한다. `halt()`는 `cancel(operation_id)`를 전달한다.\nPython worker 하나가 개별 동작을 수행하므로 ROS 응답/모델 추론 대기는 BT tick을 막지 않는다.\n서버는 시뮬레이션 시계와 독립적인 steady clock으로 20 Hz tick한다.\n이 방식은 [BehaviorTree.CPP 비동기 노드 계약](https://www.behaviortree.dev/docs/tutorial-basics/tutorial_04_sequence/)을 따른다.\n큰 영상/점군과 파지/경로 결과는 실행별 Python context에 두고 Blackboard에는 execution ID만 둔다.\n\n### 대상 검증\n\n움직이기 전에 지정 snapshot, 대상 깊이, 모델 분류, 정책과 목적지를 검사한다.\n기본 지원 쓰레기는 `cup`, `crumpled tissue`다. `paper cup`, `disposable paper cup`은\n같은 컵 종류 alias로 연결하되 원래 인식 label과 분류를 보존한다. 쓰레기 분류·사유와\n목적지 정책을 검증한다. `collect_lost_item`은 `mouse`, `computer mouse`, `wireless mouse`,\n`lego brick`을 지원하며 모델의 `lost_item` 분류와 사유, 정책의 `lost_items_left` 목적지가\n일치해야 한다. 두 skill은 기존 `collect_trash_mujoco.xml`의 집기·이동·놓기·확인 절차를 공유한다.\n종류와 목적지는 정책 및 `bt_supported_trash_labels`, `bt_supported_lost_item_labels` 설정에서 읽는다.\n같은 종류 여러 개는 유효한 session/epoch/track이 있을 때 허용한다.\n빈 세션의 기존 단일 대상 경로는 종류가 유일해야 한다. 선택 객체 복원 뒤 이동 전에\n관측 OBB로 `/sorting/register_placement_target`에 등록하고 verification ID를 고정한다.\n등록이 불확실하면 이동 전에 차단하며, 놓기 확인은 그 개체에만 수행한다.\n첫 팔 이동 전과 접근 전 재관찰은 승인된 track과 기하 연속성, 분류–skill–목적지를 모두\n확인한다. 마우스 별칭은 같은 종류로 연결하고 다른 개체를 대신 선택하지 않는다.\n미지원 대상, review 분류, 분류와 불일치하는 skill 및 다른 목적지는 차단한다.\n\n### 실패와 timeout\n\n파지 확인이 실패하면 들기를 시작하지 않는다. 보유 상실, controller 실패, 동작 timeout과\n관절/시뮬레이션 시계 중단은 정지 평가로 연결된다. 기본 `CHECKPOINT` 취소는 잡기(닫기+확인), 들기(들기+보유 확인),\n놓기(위치 검사+열기+이탈 확인)의 현재 checkpoint까지 제한 시간 안에서 수행한 뒤 다음 단계를 차단한다.\n실패한 정상 경로 뒤에는 `StopAndAssess → FinalizeFailure`를 실행한다.\nAction 결과의 BLOCKED/FAILED/CANCELED/FATAL과 BT의 FAILURE는 별도 의미다.\n\n동작 결과가 없는 상태에서 제한 시간이 지나면 `TIMEOUT`을 기록하고 중단을 요청한다.\n취소한 동작의 최종 결과는 정지 확인 중에 수집하며, 정지 평가가 먼저 끝나도 동작 종료 결과를\n확인하기 전에는 최종 Result를 확정하지 않는다. 늦게 확인된 장치 오류·비상정지·내부 오류는\n`FATAL`로 반환하고 후속 Goal을 차단한다. 취소 완료나 늦은 성공은 `TIMEOUT` 결과를 유지하며,\n성공 관측의 물체 상태·놓기·팔 복귀 근거는 보존하되 다음 정상 동작이나 취소 후 복귀를 시작하지 않는다.\n이 대기는 기존 정지 제한 시간 안에서만 수행하며, 동작 종료나 정지를 확인하지 못하면\n`FATAL / STOP_UNCONFIRMED`로 종료한다. 움직임 시작 전의 시간 초과 취소에도 정지 확인을 요구한다.\n시간 초과 취소를 시작하기 전에 성공 결과가 준비되어 있으면 경과 시간과 관계없이 기존처럼\n성공을 처리한다. 최종 Result 확정 후 도착한 관측은 결과를 변경하지 않는다.\n\n## 취소\n\n`manipulation/cancel` 서비스의 mode는 다음 세 가지다. 일반 Action cancel은\n`CHECKPOINT`를 사용한다. Result와 실행 기록의 `cancel_mode`에 적용한 모드를 남긴다.\n\n| mode | 동작 |\n|---|---|\n| `IMMEDIATE` | 현재 노드와 원자 구간의 완료를 기다리지 않고 중단 요청, 정지 확인 후 종료 |\n| `CHECKPOINT` | 현재 노드를 완료하고 정지. 잡기·들기·놓기는 같은 단계의 확인까지 완료 |\n| `RETURN_ARM` | 현재 작업 중단 → 정지 확인 → 물체를 잡고 있으면 현재 위치에서 열어 놓기 → 팔 복귀 → 최종 정지 확인 |\n\n`RETURN_ARM`은 `StopAndAssess → ReleaseInPlace → ReturnArmAfterCancel → StopAfterRecovery`\n경로를 실행한다. 팔을 선택하기 전에는 복귀할 실행 대상이 없으므로 정지 후 종료한다.\n복귀는 현재 관절 상태에서 실행 시작 때 저장한 팔 자세로 계획하며 수거함 이동과 목적지\n놓기 검증은 수행하지 않는다. 현재 위치 놓기는 그리퍼 열기 완료에 근거한 초기 정책이다.\n놓기 위치 선택과 별도 물체 이탈 관찰은 후속 검토 대상으로 둔다. `placement_state`에는\n기존 확인값만 보존하고 취소 후 놓기를 수거 성공으로 만들지 않는다.\n놓기·복귀 실패는 다시 정지 평가 후 실패로 반환한다. 복귀 중 `IMMEDIATE` 요청은\n선점하며 이후 약한 요청으로 완화되지 않는다. 기존 feedback·controller·timeout 검사는 유지한다.\n\n`IMMEDIATE/RETURN_ARM`은 중단 요청을 즉시 보내고 취소한 동작의 최종 결과를 정지 확인 중에 수집한다.\n정지 평가가 먼저 끝나도 이전 동작의 결과가 확인될 때까지 놓기·복귀와 최종 Result 확정을 기다린다.\n늦게 도착한 실제 실패는 취소보다 우선하고, 장치 오류·비상정지·내부 오류는 `FATAL`로 실행을 차단한다.\n늦은 성공은 확인된 물체 상태, 놓기, 팔 복귀와 완료 단계만 보존하고 전체 수거 성공으로 바꾸지 않는다.\n이 대기는 기존 정지 제한 시간 안에서만 수행한다. 취소한 동작의 종료나 정지를 기한 내 확인하지 못하면\n`FATAL / STOP_UNCONFIRMED`로 끝내며, 움직임 시작 전 취소에도 정지 확인을 요구한다.\n\n테스트 클라이언트에서 `--cancel-stage TRANSPORTING --cancel-mode RETURN_ARM`으로\n재현한다. 이미 실행 중인 Goal에는 다음 서비스를 호출한다.\n\n```bash\nros2 service call /sim/manipulation/cancel cleany_interfaces/srv/CancelManipulation \\\n  \"{execution_id: '실행-UUID', mode: 'RETURN_ARM'}\"\n```\n\n## 정상 수거의 놓기·정지 확인\n\n그리퍼 열림은 controller와 관절 피드백으로 확인한다. `ConfirmRelease`는 방출 시각 이후의\n독립 안착 검증을 기다리고, 팔 복귀 뒤 `VerifyPlacedObject`에서 새 시각을 기준으로 다시 검증한다.\n평가기의 false는 확인 대기다. 제한 시간 내 안착 근거를 못 얻으면\n`placement_state=UNKNOWN / VERIFICATION_TIMEOUT`을 반환한다.\nSUCCESS는 독립 방출/안착, 팔 복귀와 최종 정지 근거가 모두 있을 때만 저장한다.\n\n### 정지 근거\n\n정지는 모든 ROS Action의 terminal 결과와 정지 확인 시작 이후의 새 관절 샘플을 요구한다.\n양팔과 양쪽 그리퍼의 각 관절에 sensor stamp와 단조 시계 수신 시각을 따로 기록한다.\n부분 메시지는 포함된 관절만 갱신하며, 속도 누락·비정상 값·중복 이름·반복 또는 역행 stamp는\n정지 근거로 사용하지 않는다. 실행 중 feedback 감시도 관절별 freshness를 검사한다.\n각 확인 표본은 모든 필수 관절이 이전 표본 이후 새 정보를 제공해야 인정한다.\n양팔이 별도 메시지로 들어와도 합쳐서 확인하며, 같은 정보를 반복해서 세지 않는다.\n모든 관절이 설정한 속도 이내이고 Action이 종료된 상태가 연속 표본 수와 유지 시간을\n함께 만족해야 한다. 오래된 정보, 움직임 또는 미종료 Action이 있으면 확인 구간을 다시 시작한다.\n취소 응답만으로 정지를 인정하지 않으며, 움직임 시작 후 정지가 확인되지 않으면\n`FATAL / STOP_UNCONFIRMED`와 사람 확인 필요 상태를 기록한다.\n\n[manipulation_mujoco.yaml](../config/manipulation_mujoco.yaml)의 정지 판정 설정은 다음과 같다.\n\n| ROS parameter | MuJoCo 기본값 | 용도 |\n|---|---|---|\n| `bt_stop_timeout_sec` | 10초 | 정지 확인 제한 시간 |\n| `bt_stop_feedback_max_age_sec` | 0.5초 | 관절별 수신 경과 시간과 sensor stamp 허용 오차 |\n| `bt_stationary_duration_sec` | 0.25초 | 정지 상태의 최소 유지 시간, 단조 시계 기준 |\n| `arm_stationary_samples` | 5 | 모든 필수 관절의 새 정보를 사용한 연속 확인 횟수 |\n| `arm_stationary_velocity_rad_s` | 0.02 rad/s | 팔과 그리퍼의 정지 속도 기준 |\n\n이 값은 MuJoCo 구현의 조정 가능한 초기값이며 실물 로봇의 안전 기준은 아니다.\n\n장치 오류(`HARDWARE_ERROR`), 비상정지(`E_STOP`), 내부 오류(`INTERNAL_ERROR`)와\n정지 미확인(`STOP_UNCONFIRMED`)을 동작 실패로 관측하면 즉시 실행을 차단하고 사람 확인 필요를 기록한다.\n최종 정지 확인에 성공해도 `FATAL`과 원래 오류 코드를 유지한다. 움직임 시작 후 정지 확인에 실패하면\n최종 오류 코드는 `STOP_UNCONFIRMED`를 우선하고 원래 원인은 Result message에 남긴다.\n\n## 예상하지 못한 실행 예외\n\nROS 동작 호출은 명시적인 `OperationError`의 오류 코드를 유지한다. 기존 하위 동작이\n예상 실패에 사용하는 정확한 `RuntimeError`·`ValueError`와 `InfrastructureError`,\n`CartesianPlanningError`, `LiftRedetectionError`는 기존 준비·대상·이동·파지 실패 분류로 전달한다.\n그 밖의 예외는 발생 노드와 예외 종류·내용을 담은 `INTERNAL_ERROR`로 전달하며,\n정지 확인 후 `FATAL`로 종료하고 후속 Goal을 차단한다. `AttributeError`, `TypeError`,\n`KeyError`와 `NotImplementedError`·`RecursionError` 같은 프로그램 오류를 일반 동작 실패로 바꾸지 않는다.\n보유 접촉 검사도 정확한 `RuntimeError`만 보유 상실로 바꾸며, 다른 내부 예외는 그대로 전달한다.\n\n작업 시작·상태 조회·취소와 BT tick·전환 조회에서 예상하지 못한 예외가 발생하면\n즉시 신규 실행을 차단하고 `INTERNAL_ERROR`와 발생 단계를 기록한다.\n작업 번호를 받기 전에 시작 요청이 실패해도 `Backend.abort()`가 현재 context에\n중단 신호를 전달한다. 개별 중단 요청이나 BT halt의 추가 오류는 원인과 함께 보존하며\n정지 평가를 막지 않는다. native halt callback의 오류는 노드 reset 후 core에서 처리한다.\n\n이후에는 BT를 다시 tick하지 않고 core의 별도 종료 경로가 기존 `StopAndAssess`를\n실행·조회한다. 이미 정지 평가가 진행 중이면 그 평가와 원래 제한 시간을 유지한다.\n이 경로는 놓기나 팔 복귀를 시작하지 않는다. 이전 작업의 최종 관측을 같은 기한 안에서\n수집하고, 확인된 물체 상태와 놓기·팔 복귀 진행을 보존한다.\n정지와 이전 작업 종료가 확인되면 `FATAL / INTERNAL_ERROR`로 종료한다.\n이미 관측한 장치 오류·비상정지 등 FATAL 원인은 유지하며, 정지 시작·조회 실패 또는\n미종료 작업 때문에 확인 근거를 얻지 못하면 `FATAL / STOP_UNCONFIRMED`로 종료한다.\n최종 Result와 종료 이벤트는 한 번만 확정하고, 원래 예외와 추가 정지 오류를 message에 남긴다.\nBT snapshot 조회 실패는 해당 실행의 모니터 갱신만 중단하고 정지 처리와 Action 결과 전달은 계속한다.\n\n실행 준비 확인 또는 XML 구성 실패는 Goal을 거절한다. 실행 ID를 예약한 뒤 backend\ncontext 초기화가 실패하면 해당 실행을 수락한 뒤 위 오류 종료 경로로 최종 결과를 반환한다.\n이 처리는 서버 프로세스가 살아 있는 동안의 실행 예외에 적용한다. 프로세스 종료 후의\n처리는 [README의 재시작 복구 계약](../README.md#기록과-모니터)을 따른다.\n"},"ros2_ws/src/cleany_mission_manager/docs/interfaces.md":{"title":"cleany_mission_manager 노드 인터페이스","body":"# cleany_mission_manager 노드 인터페이스\n\n```mermaid\nflowchart LR\n  Gateway[\"Backend Gateway\"] --> Runtime[\"Mission Runtime\"]\n  Supervisor[\"Supervisor\"] \u003c-->|\"허가 / 정지 요청\"| Runtime\n  Runtime --> Tasks[\"Navigator / 작업 adapter\"]\n  Tasks -->|\"진행 / 결과\"| Runtime\n  Runtime -->|\"최종 결과\"| Gateway\n```\n\n[Mission 실행](../../../../docs/how-to/mission.md) · [미션 계약](../../cleany_interfaces/docs/mission.md)\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## mission_runtime\n\n실행 파일: `mission_runtime`. 원본: [node.py](../cleany_mission_manager/node.py), [nav2.py](../cleany_mission_manager/adapters/nav2.py), [manipulation.py](../cleany_mission_manager/adapters/manipulation.py), [supervision.py](../cleany_mission_manager/adapters/supervision.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `mission/status` | `cleany_interfaces/msg/MissionStatus` | R/T1; 상태 sequence 변경 시; `tick_hz` 기본 10 Hz |\n| 토픽 발행 | `mission/result` | `cleany_interfaces/msg/MissionResult` | R/T1; 새 최종 결과 |\n| 토픽 발행 | `mission/debug_snapshot` | `cleany_interfaces/msg/RuntimeDebugSnapshot` | R/T1; 기본 2 Hz |\n| 토픽 발행 | `mission/runtime_events` | `cleany_interfaces/msg/RuntimeEvent` | R/T2048; 이벤트 발생 시 |\n| 토픽 구독 | `robot/safety_fault` | `std_msgs/msg/String` | R10; `supervision_mode=disabled`만 |\n| 토픽 구독 | `robot/safety_released` | `std_msgs/msg/String` | R10; `supervision_mode=disabled`만 |\n| 액션 제공 | `mission/stop` | `cleany_interfaces/action/StopMission` | Action 기본값; `supervision_mode=required`, `stop_action` |\n| 서비스 호출 | `system/check_permission` | `cleany_interfaces/srv/CheckPermission` | Service 기본값; required; 갱신 TTL/3 |\n| 토픽 구독 | `system/heartbeat` | `cleany_interfaces/msg/SystemHeartbeat` | R1; required |\n| 토픽 구독 | `system/state` | `cleany_interfaces/msg/SystemState` | R/T1; required |\n| 토픽 구독 | `system/capabilities` | `cleany_interfaces/msg/SystemCapabilities` | R/T1; required |\n| 서비스 제공 | `mission/offer` | `cleany_interfaces/srv/OfferMission` | Service 기본값 |\n| 서비스 제공 | `mission/cancel` | `cleany_interfaces/srv/CancelMission` | Service 기본값 |\n| 서비스 제공 | `mission/snapshot` | `cleany_interfaces/srv/GetRuntimeSnapshot` | Service 기본값 |\n| 서비스 제공 | `mission/reset_error` | `std_srvs/srv/Trigger` | Service 기본값 |\n| 액션 호출 | `navigate_to_pose` | `nav2_msgs/action/NavigateToPose` | Action 기본값; `navigation_backend=nav2` |\n| 서비스 호출 | `navigate_to_pose/_action/cancel_goal` | `action_msgs/srv/CancelGoal` | Service 기본값; Nav2 adapter |\n| 서비스 호출 | `\u003clifecycle_node>/get_state` | `lifecycle_msgs/srv/GetState` | Service 기본값; `required_navigation_lifecycle_nodes`; `supervision_mode=disabled`만 (감독 시 Supervisor가 확인) |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic`, Nav2 adapter |\n| 토픽 구독 | `navigate_to_pose/_action/status` | `action_msgs/msg/GoalStatusArray` | Action status 기본 QoS; Nav2 adapter |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 액션 호출 | `mock/manipulation/execute_skill` | `cleany_interfaces/action/ExecuteManipulationSkill` | Action 기본값; `manipulation_action` |\n| 서비스 호출 | `mock/manipulation/execute_skill/_action/cancel_goal` | `action_msgs/srv/CancelGoal` | Service 기본값; `manipulation_action` + suffix |\n| 서비스 호출 | `mock/manipulation/get_execution` | `cleany_interfaces/srv/GetManipulationExecution` | Service 기본값; `manipulation_query` |\n\nNav2 adapter의 endpoint와 TF 구독은 `navigation_backend=nav2`에서 생성한다. 조작 endpoint는 `manipulation_backend=action_mock`일 때만 생성하며 기본 `mock`는 process 내부 실행이다. 기본 lifecycle 목록은 `map_server`, `amcl`, `planner_server`, `controller_server`, `bt_navigator`, `collision_monitor`다. `supervision_mode` 기본값은 `required`이며 `supervision_capabilities`(기본 `[NAVIGATION]`) 하나의 lease를 미션마다 요청한다. `disabled`는 mock과 simulation 단독 실행용이고 Runtime snapshot의 `supervision`에 기록된다. [Mission 계약](../../cleany_interfaces/docs/mission.md)을 따른다.\n\n## 책상 정밀 접근을 사용하는 navigation port\n\n`desk_approach_enabled=true`이면 좌석 이동의 Nav2 성공, 요청 pose 검증과 정지 확인 뒤\n`desk/approach` (`cleany_interfaces/action/DeskApproach`, Action 기본 QoS)를 호출한다.\n목표 `desk_distance_m`는 base 원점에서 평면까지의 거리다. 기존 Supervisor lease의\n식별자를 전달하며 접근 중 lease 상실과 `mission/stop`도 같은 navigation port의 취소로\n연결한다. home에는 호출하지 않는다. 후속 책상 작업은 접근 성공과 신선한 정지 확인\n이후에만 시작한다. journal의 `desk_goal_uuid`는 재시작 시 정확한 goal의 취소에 사용하며,\n취소 수락만으로 정지가 확인된 것으로 처리하지 않는다.\n"},"ros2_ws/src/cleany_mission_manager/docs/manipulation_mock_integration.md":{"title":"Gazebo 주행과 Mock 조작 연결","body":"# Gazebo 주행과 Mock 조작 연결\n\n베이스는 Gazebo/Nav2가 주행하고 인식, 계획과 팔 조작은 Mock이다. Python Mock 서버는 PR #55 `86a6d85`의 실행 core, model, mock adapter, port, 단계, SQLite 저장소와 ROS wrapper를 선별 포함했다. Native BT와 MuJoCo 실행기는 포함하지 않았다.\n\n```mermaid\nflowchart LR\n  Request[\"Gateway / mission/offer\"] --> FSM[\"Mission FSM\"]\n  FSM \u003c--> Nav[\"Nav2 + Gazebo\"]\n  FSM --> BT[\"청소 BT\"]\n  BT \u003c--> Desk[\"MockDesk 관측 / 제안\"]\n  BT --> Port[\"ManipulationPort\"]\n  Port \u003c--> Transport[\"ROSManipulationTransport\"]\n  Transport \u003c--> Server[\"Python Mock 서버\"]\n  FSM --> Report[\"MissionResult / Gateway\"]\n```\n\nFSM은 수락, 좌석 이동, 취소, 종료 정책과 보고를 소유한다. 청소 BT는 `ObserveBefore → [PlanNext → ValidateProposal → ExecuteOne → Reobserve → VerifyCompletion]`을 실행한다. 접근, 집기와 운반은 Action 서버 내부 진행이며 Mission BT에 노드를 추가하지 않는다. 검증된 성공만 논리적 책상 목록을 갱신한다. Gazebo 팔 애니메이션이나 물리 수거는 실행하지 않는다.\n\n| 안내 | 원본 |\n|---|---|\n| 실행과 미션 요청 | [RUNNING](../../../../docs/RUNNING.md#gazebo-주행과-mock-조작) |\n| ID, 결과, 취소와 복구 | [Manipulation 계약](../../cleany_interfaces/docs/manipulation.md) |\n| 화면과 ExecuteOne 상세 | [Monitor 데이터](../../cleany_dev_monitor/docs/data.md#청소-bt와-조작-관측) |\n| 검증 명령과 범위 | [TESTING](../../../../docs/TESTING.md) |\n\n## Profile과 시작 조건\n\n| 설정 | 주행 | 조작 |\n|---|---|---|\n| [runtime.yaml](../config/runtime.yaml) | Nav2 | 로컬 Mock |\n| [runtime_manipulation_mock.yaml](../config/runtime_manipulation_mock.yaml) | Mock | 외부 Mock Action |\n| [runtime_gazebo_manipulation_mock.yaml](../config/runtime_gazebo_manipulation_mock.yaml) | Gazebo/Nav2 | 외부 Mock Action |\n\n| `manipulation_backend` | `start_manipulation_mock` | 처리 |\n|---|---|---|\n| `mock` | `false` | 기존 로컬 Mock |\n| `action_mock` | `false` | 별도 서버 연결, 미준비 시 미션 수락 차단 |\n| `action_mock` | `true` | `/mock` 서버 동시 시작 |\n| `mock` | `true` | 설정 오류로 시작 거절 |\n\n[통합 launch](../../cleany_bringup/launch/mission_sim.launch.py)는 backend, fixture의 snapshot wire ID와 목적지를 검사한다. 서버 동시 시작 시 scenario, 서버 설정과 DB 분리도 Gazebo 실행 전에 확인한다. `profile`은 Fortress만 지원한다.\n\n`action_mock`은 기존 `lidar_depth_nav` 센서, `nav2_safety.yaml`의 collision monitor, `nav2_omni_motion.yaml`의 mecanum controller를 조합한다. Controller의 도착 오차는 3 cm이고 Mission의 기존 8 cm gate는 유지한다. Costmap footprint는 monitor envelope와 맞춘다. 지도 파일명과 targets의 `map_id`는 같아야 하며 초기 위치는 [AMCL 설정](../../cleany_gazebo_sim/config/nav2_amcl.yaml)의 지도 좌표를 사용한다.\n\n## 공유 입력과 영속성\n\n[공유 fixture](../config/manipulation_server_fixture.yaml)는 두 물체와 네 관측을 등록한다. 표시 ID `trash-1`과 wire ID `1`은 명시적으로 매핑하며 문자열에서 숫자를 추정하지 않는다.\n\n| 관측 ID | wire ID 목록 | 역할 |\n|---|---|---|\n| `mock-snapshot-001` | `[1, 2]` | 작업 전 관측 |\n| `mock-snapshot-002` | `[2]` | 첫 수거 후 재관측 |\n| `mock-snapshot-003` | `[]` | 두 번째 수거 후 완료 제안 |\n| `mock-snapshot-004` | `[]` | 추가 빈 관측으로 완료 확인 |\n\n모든 consumer는 같은 install prefix의 생성 타입을 사용한다. Mission DB, 서버 DB와 Bridge DB는 분리하며 재시작 시험에서 유지한다. `manipulation_initial_mock_safe=true`는 새 journal에만 적용한다. 저장된 위험 상태나 진행 기록을 덮어쓰지 않으며 조작 실행 기록이 있으면 로컬 Mock 전환으로 gate를 우회할 수 없다.\n\nGazebo가 clock, TF와 odom을 소유한다. Mock 서버는 물리 상태 토픽을 발행하지 않으며 Mission과 서버는 steady clock으로 timeout과 취소를 처리한다. 출처는 `navigation=sim`, `perception/planning/execution=mock`이다.\n\n## Mock 조작의 관찰 시간\n\n\n공유 [server fixture](../config/manipulation_server_fixture.yaml)는 정상 수거를 물체 하나당\n40초로 설정합니다. 팔 이동에 준비·검증보다 긴 시간을 배정해 진행을 관찰하기 위한\n가정입니다. 실물 팔의 경로, 하중과 속도 설정을 측정해 산출한 예상 시간은 아닙니다.\n\n| 단계 | 시간 |\n|---|---:|\n| 실행 준비 확인 `VALIDATING` | 1초 |\n| 대상 확인·파지 계획 `PREPARING_TARGET` | 4초 |\n| 물체 접근 `APPROACHING` | 7초 |\n| 그리퍼 닫기·파지 확인 `GRASPING` | 3초 |\n| 들어 올리기·보유 확인 `LIFTING` | 3초 |\n| 수거함 운반 `TRANSPORTING` | 8초 |\n| 놓기·이탈 확인 `PLACING` | 5초 |\n| 팔 복귀 `RETURNING_ARM` | 7초 |\n| 안착 확인 `VERIFYING_PLACEMENT` | 2초 |\n\n두 물체는 통신·관측 시간을 더해 약 80초 이상 걸립니다. 단계 안의 세부 동작은\n해당 시간을 나누어 쓰며 각각 최소 1초입니다. 청소 BT의 `ExecuteOne`을 실행하는 동안\n`mission/debug_snapshot`의 `manipulation_feedback`과\n`/mock/manipulation/execution_events`에서 세부 진행을 확인할 수 있습니다.\n웹 관제보드의 실행 → BT에서도 조작 단계와 세부 동작이 표시됩니다.\n\n`stage_durations_sec`는 모든 scenario의 기본 시간이고, scenario별 값이 우선합니다.\n설정을 바꾸면 Mock 서버를 다시 실행해야 합니다. 이미 진행 중인 실행의 DB는 보존합니다.\n\n| Runtime timeout | 기본 로컬 Mock | 외부 Action Mock profile |\n|---|---:|---:|\n| 단일 작업 | 30초 | 120초 |\n| 취소 확인 | 5초 | 15초 |\n| 청소 전체 | 180초 | 300초 |\n\nROS 계약 회귀 검사는 같은 논리 fixture의 시간을 줄이고 Gazebo 검사는 위 관찰 시간을 사용한다.\n설정은 [Runtime profile](../config/runtime_manipulation_mock.yaml)과\n[Gazebo profile](../config/runtime_gazebo_manipulation_mock.yaml)에서 관리한다.\n"},"ros2_ws/src/cleany_moveit_collision/README.md":{"title":"MoveIt 충돌 검사","body":"# MoveIt 충돌 검사\n\n`cleany/SolidFCL`은 로봇 메시의 닫힌 볼록 조각을 내부가 채워진 FCL 형상으로\n검사한다. 조각 내부에 완전히 들어간 장애물도 검출하며, 서로 떨어진 조각의\n틈과 링크별 배치, 충돌 허용 행렬을 유지한다. 열린 면이나 오목한 조각은\n초기화 오류로 거부한다. 임의 CAD를 볼록 외피로 바꾸지는 않는다.\n\n자기 충돌은 매 요청에서 링크 경계 상자를 계산해 검사할 부품 쌍을 줄인다.\n조건부 접촉 허용, world, attached object와 거리 쿼리는 FCL 규약을 따른다.\n이전 자세의 충돌 결과는 재사용하지 않는다.\n\n`cleany/RequireCollisionDetector`는 MoveGroup 시작 시 요청한 detector가 실제로\n선택됐는지 확인한다. 로드 실패로 다른 detector가 선택되면 프로세스를\n종료한다. 이 패키지는 ROS endpoint나 모터 제어 기능을 추가하지 않는다.\n\nMoveIt launch는 이 패키지를 의존하며 `collision_detector:=cleany/SolidFCL`을\n기본값으로 사용한다. 표면 검사 대조에는 `collision_detector:=FCL`을 명시한다.\n형상 계약은 [모델 문서](../cleany_description/docs/model-runtime.md#선택적-충돌-메시-평면화),\n빌드와 검사는 [검증 절차](../../../docs/TESTING.md#충돌-메시와-내부-장애물-검사)를 따른다.\n"},"ros2_ws/src/cleany_moveit_config/docs/interfaces.md":{"title":"cleany_moveit_config 노드 인터페이스","body":"# cleany_moveit_config 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## handeye_collision_scene_applier\n\n실행 파일: `apply_handeye_collision_scene`. 원본: [apply_collision_scene.py](../cleany_moveit_config/apply_collision_scene.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 서비스 호출 | `/apply_planning_scene` | `moveit_msgs/srv/ApplyPlanningScene` | Service 기본값; `scene_config` YAML의 `apply_service` |\n\nScene 수락 후 종료하는 노드다. [Planning 계약](planning.md)을 따른다.\n"},"ros2_ws/src/cleany_moveit_config/docs/planning.md":{"title":"MoveIt planning 계약","body":"# MoveIt planning 계약\n\nMoveIt은 팔별 5관절을 계획하며 gripper, base는 planning group에서 제외한다. Grasp group은 같은 팔 관절을 사용하고 fixed TCP joint까지 chain을 확장한다.\n\n## Group과 controller\n\n기본 MoveIt 및 Mock launch는 `collision_detector:=cleany/SolidFCL`을 사용한다.\n최적화 메시의 닫힌 볼록 조각을 내부가 채워진 형상으로 읽고, RViz에도 같은\ndetector를 전달한다. `cleany/RequireCollisionDetector`가 요청한 detector의 로드를\n확인하며, 실패하면 다른 검사기로 계속 계획하지 않고 프로세스를 종료한다.\n원본 CAD의 표면 검사 대조에는 `collision_detector:=FCL`을 명시한다.\n\n```mermaid\nflowchart TB\n    Backend[\"활성 backend 하나\"] -->|\"팔 / gripper joint_states\"| State[\"RobotState\"]\n    Model[\"URDF / SRDF / KDL 설정\"] --> MoveIt[\"MoveIt / move_group\"]\n    State --> MoveIt\n    Scene[\"Collision scene\u003cbr/>고정 형상 / 동적 대상\"] --> MoveIt\n    MoveIt --> Arm[\"left_arm / right_arm\u003cbr/>계획 trajectory\"]\n    Arm -->|\"FollowJointTrajectory\"| Controller[\"좌우 arm controller\"]\n    Controller --> Backend\n    MoveIt --> Grasp[\"left_grasp_arm / right_grasp_arm\u003cbr/>fixed TCP / plan-only\"]\n    Grasp --> Result[\"도달성 검사 결과\u003cbr/>controller 실행과 별개\"]\n```\n\n| Group | Chain | Controller |\n|---|---|---|\n| left_arm | base_link → left_gripper_frame | left_arm_controller |\n| right_arm | base_link → right_gripper_frame | right_arm_controller |\n| left_grasp_arm | base_link → left_grasp_tcp | plan-only |\n| right_grasp_arm | base_link → right_grasp_tcp | plan-only |\n\n| 항목 | 계약 |\n|---|---|\n| IK | KDL, position_only_ik=true; 목표 위치와 전체 arm seed 사용 |\n| Home | left_home/right_home의 팔 5관절 모두 0 rad |\n| Controller 타입 | control_msgs/action/FollowJointTrajectory |\n| Action 이름 | /left_arm_controller/follow_joint_trajectory, /right_arm_controller/follow_joint_trajectory |\n| Backend 상태 | 팔, gripper 전체 /joint_states 발행 필수 |\n\nPosition-only IK는 목표 orientation을 제약하지 않는다. SRDF는 직접 parent/child만 충돌 검사에서 제외하며, 비인접, 좌우 cross-arm 검사는 유지한다.\n\n## 고정 collision scene\n\nHand-eye scene은 config/handeye_collision_objects.yaml의 cleany.moveit_collision_objects/v1 schema로 정의한다. Box는 전체 길이와 base_link 기준 primitive_pose를 사용하며 top-level CollisionObject.pose에 의존하지 않는다.\n\nmove_group 실행 후 scene을 한 번 적용한다.\n\n```bash\nros2 launch cleany_moveit_config handeye_collision_scene.launch.py\n```\n\nApplier는 /apply_planning_scene이 handeye_table, handeye_target_stand, charuco_target을 수락한 뒤 종료한다. 일반 move_group launch는 이 scene을 자동 주입하지 않는다.\n\nPick-demo table은 config/pick_demo_collision_objects.yaml에 있으며 rgbd_pick_demo.xml.in과 크기, pose가 일치한다. Box/can target은 reachable-grasp action에서 동적으로 등록한다.\n\n관련 안내: [실행](../../../../docs/RUNNING.md), [검증](../../../../docs/TESTING.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n\n## Terminal logging\n\n`move_group.launch.py` accepts `backend_log_level` (standalone default `info`)\nand `log_level` (default `info`). The sensor-driven MuJoCo workflow passes\n`backend_log_level:=warn` to reduce backend initialization and planning detail.\nWarnings and errors remain visible. The child logger `move_group.scene_mapping`\nuses `log_level` independently: `log_level:=debug` enables throttled depth\ncallback and map timing diagnostics without enabling every MoveIt logger.\nIn quiet mode, capability banners printed directly to stdout go to the launch\nlog; this process sends ROS logs to stderr so warnings and errors remain on\nscreen even if the parent environment selects stdout. `backend_log_level:=info`\nalso restores those banners to the terminal.\n\n## Humble controller plugin teardown\n\n`keep_controller_plugin_loaded:=true` keeps the default controller plugin library\nmapped through process teardown using a process-local `LD_PRELOAD`. Existing\npreload entries are preserved. It applies only to\n`moveit_simple_controller_manager/MoveItSimpleControllerManager`.\n\nIn this VM, Ctrl+C caused a SIGSEGV in `rclcpp::CallbackGroup` while the controller\nmanager node was being destroyed. MoveIt 2.5.9 declares the plugin loader after\nthat node, so the loader is destroyed first; the core dump is consistent with\na remaining weak-pointer control block referencing unloaded plugin code.\nSee the [upstream member declarations](https://github.com/moveit/moveit2/blob/2.5.9/moveit_ros/planning/trajectory_execution_manager/include/moveit/trajectory_execution_manager/trajectory_execution_manager.h).\n\nPreloading prevented the observed crash. The workaround does not change\ntrajectory execution or controller selection. Set\n`keep_controller_plugin_loaded:=false` when validating a patched MoveIt install.\nThe workaround may leave the upstream `class_loader` unload warning visible;\nit prevents the observed crash without suppressing that warning.\n\nThe runtime regression exercises `/check_state_validity` in the default MuJoCo\nlogging mode (`backend_log_level:=warn`) and requires clean SIGINT termination\nwithout SIGTERM escalation. It also checks that ROS warnings remain on screen.\n"},"ros2_ws/src/cleany_mujoco_observer/README.md":{"title":"cleany_mujoco_observer","body":"# cleany_mujoco_observer\n\n인식·수거 pipeline의 `scheduled_cameras=true`에서는 원래 공통 카메라 renderer의 반복 촬영을\n끄고 private snapshot 기반 센서 renderer를 사용한다. vendor의 0 Hz 설정에서도\n발생하는 초기 1회 frame은 `/cleany/internal/disabled_vendor/*`로 격리한다.\n공개 센서 토픽은 scheduled renderer만 발행한다. 물체 좌표/segmentation ID는\n센서 토픽에 노출하지 않는다. `/sorting_cameras`의 `active_camera` ROS parameter를\n`head`, `left`, `right`로 변경하면 **렌더링 자체의 주기**를 전환한다.\n헤드 기본 10 Hz / 손목 사용 중 헤드 2 Hz / 선택 손목 10 Hz, 비선택 손목은 0 Hz다.\n`head_high_rate=false`를 설정하면 head가 선택된 동안에도 2 Hz로 낮춘다.\nsorting은 새 장면 검출과 head 재선택 시 10 Hz로 올리고, 검출 완료 후 2 Hz로 내린다.\n시작 파라미터는 `head_rate_hz`, `head_idle_rate_hz`, `wrist_rate_hz`이며\n실행 중 rate 수정은 거부한다. 별도 boolean `head_depth_boost`(기본 false)를\ntrue로 설정하면 선택 손목 카메라를 유지하면서 헤드를 `head_rate_hz`로 촬영한다.\nsorting은 접근·파지·lift 동안만 이를 켜고 성공/실패 시 해제한다.\n이는 목표 촬영 빈도 변경이며 처리 지연을 없애거나 최신 지도 수신을 보장하지 않는다.\n`/camera/color/{image_raw,camera_info}` 및\n`/camera/aligned_depth_to_color/image_raw`는 헤드 RGB-D이고,\n`/{left,right}_wrist_camera/{image_raw,camera_info}`는 RGB 전용이다.\n640×480, 촬영한 snapshot의 simulation timestamp, optical frame을 사용한다.\n공개 손목 depth/GT mask는 발행하지 않는다. 이 모드는 GLFW offscreen context가 필요하다.\nGLFW는 backend thread 시작 전에 동기 초기화한다. FPS는 simulation timestamp 기준\n최대 목표치이며 렌더링 비용에 따라 낮아질 수 있다. 프레임 수 감소가 곧 전체 CPU/GPU\n부하의 같은 비율 감소를 뜻하지 않는다. 카메라 worker는 가벼운 simulation clock으로\n촬영 기한을 먼저 확인하고, 촬영할 카메라가 있을 때만 mutex 보호 `get_data` snapshot을\n복사한다. 같은 scheduling pass에 촬영하는 head/wrist 카메라는 하나의 일관된 snapshot을\n공유한다.\n카메라별 ROS Image/CameraInfo payload와 depth 변환 배열을 재사용하며,\ndepth는 640픽셀 행 버퍼에서 환산한 뒤 각 메시지 행에 복사한다.\n늦게 촬영한 프레임은 원래 촬영 주기를 유지하면서 놓친 기한을 건너뛴다.\nsimulation clock reset 뒤에는 새로운 시각에서 촬영을 재개한다.\n\n## 제어 주기와 관절 피드백 시각\n\n`study_cafe_backend.launch.py`는 이 패키지의 `ros2_control_node`를 실행한다.\n설치된 MuJoCo hardware/physics와 기존 trajectory controller를 사용하고,\n제어 주기의 시각 선택과 대기를 레포에서 관리한다. `controller_manager.update_rate`\n기본값 100 Hz는 기존 controller 설정을 따른다. `use_sim_time=true`가 필요하다.\n\n한 주기에서 읽은 simulation timestamp와 실제 경과 시간을 `read/update/write`에\n동일하게 전달한다. 처리가 늦어진 뒤에도 마지막 제어 시각으로부터 한 주기 이상\n시각이 진행돼야 다음 실행을 허용한다. 같은 시각의 새 관절 상태를 발행하지 않으며,\n정지된 시계에서 피드백 수신 시각을 갱신하지 않는다. 피드백 만료와 BT 정지 판정\n기준은 유지한다. 시각이 역행하면 오류로 backend를 종료하므로 reset 후에는\n새 launch로 장면을 시작해야 한다. physics의 timestep이나 물체 상태를 조작하지 않는다.\n\n제어 중 read 지연, 중복 시각, 멈춘 시계, 밀린 주기와 시각 역행을\n`test_control_cycle`에서 검사한다. 실제 수거 성공은 별도 MuJoCo 시나리오로 확인한다.\n수거와 취소, 정지 확인 조건은 [BT 실행 계약](../cleany_manipulation_bt/README.md#계약과-증거)을 따른다.\n\n## GUI 렌더링\n\n`scheduled_cameras:=true headless:=false sim_viewer:=efficient`는 센서 worker의\nprivate snapshot과 OpenGL context를 공유하는 GUI를 사용한다. vendor의 별도\nfullscreen renderer는 시작하지 않는다. 창을 그리는 동안 physics mutex를 잡지 않는다.\n`config/study_cafe_ros2_controllers.yaml`의 `sorting_cameras`에서 시작 설정을 관리한다:\n`viewer_rate_hz=20.0`, `viewer_width=960`, `viewer_height=720`, `viewer_shadows=false`.\nGUI 갱신은 wall time 기준 최대 빈도이며 최소화/창 닫기 후에는 GUI 렌더링을 생략한다.\n센서 촬영에는 기존 그림자를 복원하므로 GUI 설정이 RGB-D 픽셀에 영향을 주지 않는다.\n\n마우스 왼쪽 버튼으로 회전, 오른쪽으로 이동, 가운데 버튼/휠로 확대한다.\nShift는 수평 이동/회전을 선택하고 Home은 시점을 초기화한다. Space는 backend의\npause service를 호출하고 Backspace는 reset service를 호출한다. Escape/창 닫기는\nGUI를 숨기며 센서·physics는 계속 실행한다. 전체 종료는 실행 터미널의 Ctrl+C다.\n전체 MuJoCo 디버깅 UI가 필요하면 `sim_viewer:=native`를 선택한다.\nheadless에서도 현재 GLFW renderer에는 유효한 DISPLAY가 필요하다.\n\nGUI 사용 시 주의: efficient viewer는 보이는 창 생성과 입력 처리(`glfwPollEvents`)를\n메인 스레드가 아닌 센서 worker 스레드에서 수행한다. GLFW는 이 동작을 메인 스레드\n전용으로 규정하므로 현재는 Ubuntu 22.04 VM의 `DISPLAY=:0` 환경에서만 확인했다.\n다른 환경에서 GUI 창이 멈추거나 GUI 실행 중 카메라 토픽이 끊기면\n`sim_viewer:=native`를 사용한다. 창과 센서가 같은 스레드를 쓰므로 창 문제는 센서\n정지로 이어질 수 있다.\n마우스 이동은 설치된 MuJoCo 헤더의 `mjv_moveCamera` 함수 형식에 따라\nscene 인자가 있는 6인자 API 또는 scene 인자가 없는 5인자 API를 빌드 시 선택한다.\n\nMuJoCo 분리 수거 시뮬레이션의 결과를 독립적으로 평가하는 read-only 관측기다.\n`cleany_mujoco_observer/ObservedMujocoSystem`은 설치된\n`MujocoSystemInterface`를 상속하며 hardware/physics 동작은 원래\nbackend에 맡긴다. 제어 실행 주기는 위 로컬 실행기를 사용한다.\n공개 `get_model` / `get_data`가 제공하는 physics mutex로\n보호된 **별도 소유 snapshot**에서 동적 study-cafe\n물체 collision geometry의 base-frame AABB를 읽어 `/simulation/sorting_ground_truth`에\n`visualization_msgs/MarkerArray`로 발행한다. `text`는 body 이름이며\n`pose.position`은 `base_link` 기준 AABB 중심, `scale`은 full extents다.\norientation은 단위 quaternion이다. 복사는 wall time 기준 최대 10 Hz이며,\nmesh는 변환된 실제 vertex 극값, sphere/capsule/cylinder/ellipsoid는 해석적\n투영 반경을 사용한다. 로컬 AABB를 회전시켜 다시 감싸면 기울어진 컵의 빈\n공간까지 포함해 책상 아래로 경계가 내려가는 오류가 있어 이를 피한다.\n이 변경은 평가 경계 계산만 수정하며 검출/제어 또는 배치 오차 허용값은 바꾸지 않는다.\n발행도 simulation time 기준 최대 10 Hz다. full snapshot 복사에 따른 잠금\n대기/제어 주기 비용은 실측 대상이며 hard-real-time 보장을 하지 않는다.\n\n이 토픽은 검출/분류/grasp 생성/경로 계획 입력이 아니다. 시뮬레이션 테스트가\n실제로 물체가 이동하고 올바른 수거함에 안착했는지 확인하는 oracle이다.\nplugin은 qpos, ctrl, 힘, weld를 변경하지 않는다. 로봇 구동은 기존\nros2_control trajectory controller와 MuJoCo 접촉 물리 계산이 담당한다.\n\n현재 설치된 Humble `mujoco_ros2_control` 0.0.3의 C++ API를 사용한다.\n시스템 패키지를 수정하지 않는다. 기존 vendor read-loop plugin 경로는\nphysics의 `mj_copyData`와 동시에 arena/contact/force pointer를 읽을 수 있어\n사용하지 않는다. 기존 `SortingObserver` vendor plugin 등록은 제거했다.\n원래 backend의 동시 접근을 전반적으로 수정한 것은 아니며, 이 관측기의\nGT와 contact만 일관된 private snapshot으로 보호한다. `sorting_observer`\npublisher-only node가 launch parameter file을 초기화 시 읽으며 별도 spin\nthread나 실행 중 parameter 변경 기능은 추가하지 않는다.\n\n## 선택형 접촉 진단\n\n분리 수거 launch에 `sorting_contact_diagnostics:=true`를 주면\n`/simulation/contact_diagnostics` (`diagnostic_msgs/DiagnosticArray`)를 추가한다.\n기본은 false이며, 켜진 경우에도 구독자가 있을 때만 최대 10 Hz로 만든다.\nprivate snapshot에 이미 계산된 contact와 `mj_contactForce` 결과를 읽으며,\nphysics를 다시 계산하거나 힘을 적용하지 않는다.\n\nheader는 snapshot의 simulation time / `base_link`다. 첫 status는 전체/발행\n접촉 수이며, 이후 status는 body/geom 이름과 id, base-frame 접촉 위치(m),\nsigned distance(m, 음수는 penetration), contact-frame normal force(N),\ntangential force magnitude(N)를 key/value로 제공한다. normal force는 명령이나\n그리퍼 파지 성공 판정이 아니다. 여러 접촉점의 힘을 하나의 물체 무게처럼\n해석하지 않는다. 기본 최대 256개이며\n`sorting_observer.maximum_contacts`로 1–4096 범위에서 설정한다.\n상한 초과/geom id 없는 flex contact 생략 시 summary가 WARN이고 전체 수와\n발행 수가 다르다. 이 진단은 controller/검출/분류/계획에서 구독하지 않는다.\n\n```bash\nmake test-mujoco-observer\n# 실제 OpenGL RGB-D 회귀 검사 포함 (DISPLAY 없으면 해당 검사만 skip)\nDISPLAY=:0 make test-mujoco-observer\n```\n\n회전된 base-frame 위치 변환, 접촉 힘 조회, 읽기 전후 integration state 및\napplied force 불변, 검사 상한/잘못된 snapshot 거부를 작은 MuJoCo 모델로\n검사한다. 원본 arena 초기화 뒤에도 private copy의 접촉/힘이 유지되는지,\nwrapper library가 hardware plugin으로 로드되는지도 검사한다.\n실제 렌더러 검사는 GUI draw 이후에도 headless와 RGB/depth 픽셀이 같고,\n640×480 해상도·optical frame·촬영 timestamp·CameraInfo가 일치하는지 확인한다.\n실제 전체 분리 수거 성공을 입증하는 테스트는 아니다.\n\n참고: [설치 버전 plugin/snapshot 처리](https://github.com/ros-controls/mujoco_ros2_control/blob/0.0.3/mujoco_ros2_control/src/mujoco_system_interface.cpp),\n[MuJoCo contact force API](https://mujoco.readthedocs.io/en/3.4.0/APIreference/APIfunctions.html#mj-contactforce).\n"},"ros2_ws/src/cleany_mujoco_sim/docs/backends.md":{"title":"MuJoCo backend 계약","body":"# MuJoCo backend 계약\n\n\n[장면과 실행 설정](scenes.md) · [조작 가이드](../../../../docs/how-to/manipulation.md)\n\n한 실행에서는 backend 하나만 사용한다. Joint state, sensor, TF, controller의 소유자를 중복시키지 않는다.\n\n## Backend 종류\n\n| Backend | 책임 |\n|---|---|\n| Custom simulation | base velocity, joint feedback, LiDAR/depth |\n| Study-cafe ros2_control | MuJoCo, 팔 FollowJointTrajectory, 관찰 카메라와 sorting |\n| Study-cafe manipulation | 검출, 후보 선택, 접근과 sorting |\n\n## 모델과 시간\n\n기하와 센서의 원본은 패키지 config/와 cleany_description 모델이다. CAD geometry는 wheelbase 0.350 m, separation 0.6038 m, radius 0.0635 m이며 실물 측정값과 구분한다.\n\nCustom backend는 capture stamp를 node clock으로 만들며 자체 `/clock`을 발행하지 않는다. Study-cafe ros2_control backend는 simulation clock을 사용하고 소비자는 같은 `use_sim_time`을 사용한다. Hand-eye는 [동기화 계약](../../cleany_handeye_calibration/docs/frames-and-data.md), MoveIt은 [Planning 계약](../../cleany_moveit_config/docs/planning.md)을 따른다.\n\n## 실행과 한계\n\nCustom/ros2_control backend의 동시 실행은 joint 명령 경쟁을 일으키므로 허용하지 않는다. MuJoCo 결과는 실물 구동, 집기, 제동거리 검증이 아니다.\n\n실행 인자는 launch/*.launch.py와 `ros2 launch ... --show-args`에서 확인한다.\n\n관련 안내: [실행](../../../../docs/RUNNING.md), [검증](../../../../docs/TESTING.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n\n현행 장면과 실행은 [Study-cafe 안내](scenes.md)를 따른다. 이전 hand-eye backend와 RGB-D pick demo는 제거됐다.\n"},"ros2_ws/src/cleany_mujoco_sim/docs/interfaces.md":{"title":"cleany_mujoco_sim 노드 인터페이스","body":"# cleany_mujoco_sim 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## mujoco_sim\n\n실행 파일: `mujoco_sim_node`. 원본: [sim_node.py](../cleany_mujoco_sim/sim_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `~/joint_cmd` | `sensor_msgs/msg/JointState` | R10 |\n| 토픽 구독 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10 |\n| 토픽 발행 | `joint_states` | `sensor_msgs/msg/JointState` | R10; `publish_rate_hz` 기본 60 Hz |\n| 토픽 발행 | `odom` | `nav_msgs/msg/Odometry` | R10; `publish_rate_hz` 기본 60 Hz |\n| 토픽 발행 | `scan` | `sensor_msgs/msg/LaserScan` | R10; `scan_rate_hz` 기본 5.5 Hz, `scan_enabled` |\n| 토픽 발행 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 발행 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n`~/joint_cmd`는 private 이름이며 root namespace에서는 `/mujoco_sim/joint_cmd`다. Odom TF는 `publish_odom_tf`로 제어한다. Custom backend에는 별도 `/clock` publisher가 없다.\n\n## left_wrist_camera_contract_adapter\n\n실행 파일: `camera_contract_adapter`. 원본: [camera_contract_adapter.py](../cleany_mujoco_sim/camera_contract_adapter.py), [camera_contract.py](../cleany_mujoco_sim/camera_contract.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/cleany/internal/mujoco/left_wrist_camera/image_raw` | `sensor_msgs/msg/Image` | Sensor |\n| 토픽 구독 | `/cleany/internal/mujoco/left_wrist_camera/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor |\n| 토픽 발행 | `/left_wrist_camera/image_raw` | `sensor_msgs/msg/Image` | Sensor; 입력 동기화와 계약 검사 통과 시 |\n| 토픽 발행 | `/left_wrist_camera/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor |\n\n입출력 이름은 `manifest_path`의 camera contract로 결정한다. 위 표는 기본 contract다. Vendor topic의 remap과 ros2_control backend는 [launch](../launch/study_cafe_backend.launch.py)를 따른다.\n\n## simulation_placement_verifier\n\n실행 파일: `placement_verifier`. 원본: [placement_verifier.py](../cleany_mujoco_sim/placement_verifier.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS |\n|---|---|---|---|\n| 토픽 구독 | `/simulation/sorting_ground_truth` | `visualization_msgs/msg/MarkerArray` | R10 |\n| 서비스 제공 | `/sorting/verify_placement` | `cleany_interfaces/srv/VerifyPlacement` | Service 기본값 |\n\n시뮬레이션 전용 결과 판정이다. 물체 정답 pose를 조작 코드에 반환하지 않는다. 실물에는 독립 센서 기반 제공자가 필요하다.\n"},"ros2_ws/src/cleany_mujoco_sim/docs/scenes.md":{"title":"cleany_mujoco_sim","body":"# cleany_mujoco_sim\n\n```mermaid\nflowchart TD\n  Env[\"Humble 환경과 같은 DDS domain\"] --> Mode{\"실행할 대상\"}\n  Mode -->|\"주행과 센서\"| Gazebo[\"Gazebo\"]\n  Mode -->|\"팔과 물체 조작\"| Mujoco[\"MuJoCo + MoveIt\"]\n  Gazebo --> Observe[\"센서 · odom · TF 확인\"]\n  Mujoco --> Observe\n  Observe --> Run[\"시나리오 실행과 종료 확인\"]\n```\n\n[Gazebo 실행](../../../../docs/how-to/simulation.md) · [MuJoCo 조작](../../../../docs/how-to/manipulation.md) · [backend 책임](backends.md)\n\n스터디카페 관찰 장면과 고정 베이스 수거용 MuJoCo backend를 제공한다.\n\n| 하려는 일 | 안내 |\n|---|---|\n| 장면 실행·테스트 | [실행과 테스트](#실행과-테스트) |\n| 수거함 배치 확인 | [후면 수거함 미리보기](#로봇-후면-수거함-배치-미리보기) |\n| backend 설정·로그 | [실행 인자](#실행-인자), [Backend 로그](#backend-터미널-로그) |\n| 두 컵과 개체별 배치 확인 | [두 컵 설정](#두-컵과-개체별-배치-확인) |\n\n## 시뮬레이션 기본 설정\n\n수거 시뮬레이션은 `robot_top_bins.yaml`의\n`simulation_ignore_mast_collision: true`를 기본으로 사용한다.\n고정 기둥(`top_base_link`) 외형은 남기되 MuJoCo 접촉을 끄고, MoveIt에서도\n기둥과 로봇 링크 간 충돌을 제외한다. 팔·책상·수거함·물체의 충돌은 유지한다.\n이는 시뮬레이션 편의 설정이며 기둥을 통과하는 동작은 실물에서 안전하지 않다.\n해당 값을 false로 바꾸면 기둥 충돌 검사를 복원한다.\n\n기본 책상 테스트 배치는 로봇 기준 왼쪽에 레고·마우스(분실물), 오른쪽에\n종이컵·휴지뭉치(쓰레기)를 둔다. `study_cafe_layout.yaml`의 현재 로봇 yaw에서는\ndesk X 음수가 로봇 왼쪽이다. 같은 쪽 팔에서 같은 쪽 수거함으로의 도달성을\n시험하기 위한 배치이며, 실제 분류와 팔 선택은 기존 인식 파이프라인을 유지한다.\n\n스터디카페는 `cleany_description/mjcf/cleany.xml`의 migrated CAD 모델을 사용한다.\n방·책상·파티션의 공통 배치는 Gazebo의 `study_cafe_layout.yaml`과 동일하게 유지한다.\nchair 기준 후퇴 거리는 0.32m로 설정한다. 공통 의자 기준점을 책상 쪽으로\n0.10m 옮긴 배치에서도 로봇 중심 좌표 `(-3.13, -4.16, 0.38)`와 CAD 전면\n기둥과 책상 사이의 초기 여유를 유지한다. 내부 후면 수거함은 chassis에 부착한다.\n초기 keyframe의 position actuator 명령은 actuator 이름이 아니라 연결된\njoint 이름으로 찾는다. 따라서 `head_tilt` / `head_tilt_joint`처럼 이름이\n달라도 지정된 카메라 자세를 유지하며 0rad로 돌아가지 않는다.\n책상·물체·후면 수거함 배치는 유지하며, 기존 접촉 pair는 이름이 유지된 양팔\njaw collision geom을 참조한다. `robot_top_bins_preview.launch.py`는 모델 배치\n확인용이며 자동 집기·수거를 실행하지 않는다. 전체 수거 성공은 별도 검증 대상이다.\n\n단위 테스트 통과는 전체 물리 수거 성공률을 나타내지 않는다.\n`make test-mujoco`는 현재 장면과 공통 bridge의 전체 단위 테스트를 실행한다. Python bridge의 시뮬레이션 context와 step observer는 단일 정의로 관리한다.\n주행 회귀 검사는 같은 CAD 로봇을 원점의 장애물 없는 평면 fixture에 배치해\n휠 속도 추종·정지·이동 방향을 확인한다. 스터디카페의 회전된 초기 배치와\n책상 접촉은 이 controller 검사의 입력으로 사용하지 않는다.\n\n## 로봇 후면 수거함 배치 미리보기\n\n`ros2 launch cleany_mujoco_sim robot_top_bins_preview.launch.py`는 기존 책상\n양끝 분류 영역/구분선을 넣지 않고, 로봇 뒤쪽에 청록 테두리 분실물함(로봇 왼쪽)과\n주황 테두리 쓰레기함(오른쪽)을 배치한다. 본체는 저채도 네이비로 통일한다.\n`config/robot_top_bins.yaml`에서 base_link 기준 위치와 크기를 변경한다.\n기존 실행 호환을 위해 파일명은 유지하지만 현재 배치는 상단이 아닌 후면이다.\n각 함의 중심은 base_link 기준 x=-0.075 m, y=±0.105 m이며\n바닥 z=0.22 m, 상단 z=0.34 m이다. 외부 선반 대신 `internal_tray` 설정으로\n210×460×12 mm 받침판을 로봇 프레임 내부 뒤쪽에 둔다.\n함과 받침판은 chassis에 부착되어 로봇을 따라 움직이며 동일한 충돌 형상을\nMoveIt에 등록한다. 함의 탈착·체결부 강도·배선 여유는 모델링하지 않은\n시뮬레이션 설계안이다. 이동 베이스 운용 및 모든 물체의 수거 성공은 별도 검증이 필요하다.\n각 함의 외형은 180×170×120 mm,\n벽 두께 8 mm이며 바닥과 네 벽이 있는 열린 충돌 형상이다.\n기존 홈 자세를 유지하는 MuJoCo GUI만 실행하며 인식·자동 수거는 시작하지 않는다.\n이 설정은 배치 검토용 시뮬레이션 시안이며 실제 장착 강도/하중과 수거 경로는\n검증되지 않았다. 자동 수거와 일반 파이프라인 launch도 동일한 후면 설정을\n기본으로 사용한다. 배치 통일은 수거 경로 검증 완료를 뜻하지 않는다.\n선택적 `rim_rgba`는 벽 두께 안쪽의 둥근 시각 테두리를 추가하며 질량/충돌은\n추가하지 않는다. 물리 형상은 기존 바닥과 네 벽으로 유지한다.\n\n`study_cafe_backend.launch.py scheduled_cameras:=true`는 sorting observer hardware의\n카메라별 촬영 주기 제어를 켠다. 수거함 설정 없이도 observer hardware를 선택할 수 있다.\n직접 backend의 기본값은 false이며, 통합 인식·수거 launch는 true를 기본으로 사용한다.\n`headless:=false sim_viewer:=efficient`는 최대 20Hz의 960×720 snapshot GUI를\n사용한다. 센서 RGB-D는 640×480과 원래 그림자를 유지한다. 전체 native MuJoCo UI는\n`sim_viewer:=native`로 선택한다. 설정·조작법은\n[`cleany_mujoco_observer`](../../cleany_mujoco_observer/README.md#gui-렌더링)를 따른다.\n`config/sorting_wrist_cameras.yaml`은 양팔 RGB optical frame의 v8 형상 기반 장착값이다.\nDescription의 `config/geometry/wrist_mount_v8.json`에 저장된 렌즈 중심과 광학 방향을\ncanonical MJCF 카메라 및 optical site/body와 공유한다. 수거 launch는 이 변환으로\n손목 영상의 좌표를 gripper 좌표에 연결한다. 실제 로봇의 hand-eye 보정은 별도이며,\n시뮬레이션 영상 계약은 기존 640×480, 수직 FOV 93°를 유지한다.\n\n전체 ROS runtime의 clock 진행률·RGB-D 수신 빈도·process tree CPU는 다음으로 측정한다.\n측정기는 warmup 이후 JSON과 별도 launch log를 저장하고, 완료·실패·중단 시 자신이\n시작한 process group과 추적한 자식 프로세스를 종료한다. `psutil`이 필요하다.\n기본 출력은 `/tmp/cleany-runtime.json` 및 같은 이름의 `.log`다.\nprobe에도 동일한 Fast DDS profile을 적용해 큰 센서 메시지의 SHM 손실을 피한다.\nCPU 지표는 사용한 코어 수에 해당하며 전체 수거 성공 여부는 stage artifact로 확인한다.\n\n```bash\nDISPLAY=:0 make profile-mujoco-runtime \\\n  BENCHMARK_ARGS='--duration 35 --warmup 5 --output /tmp/runtime-headless.json' \\\n  PIPELINE_ARGS='headless:=true use_rviz:=false use_image_view:=false'\nDISPLAY=:0 make profile-mujoco-runtime \\\n  BENCHMARK_ARGS='--duration 35 --warmup 5 --output /tmp/runtime-gui.json' \\\n  PIPELINE_ARGS='headless:=false use_rviz:=false use_image_view:=false'\n```\n\n`tools/benchmark_runtime.py --output \u003cfile> -- ros2 launch ...`로 다른 launch도 측정한다.\n\n`scenes/study_cafe_grasp_execution.xml.in`에는 컵–양손 그리퍼의 10개 접촉쌍을\n명시해 미끄럼 마찰을 기존 접촉값 3에서 6으로 높인 시험 설정을 둔다.\n`friction=\"6 6 0.2 0.1 0.1\"`이며 비틀림/구름 마찰과 기본 접촉 softness는\n유지한다. 컵–책상, 다른 물체, 질량·모터 힘·형상은 바꾸지 않는다.\n이는 실측 재질 계수가 아닌 시뮬레이션 민감도 시험이며 실제 패드 성능을 보장하지 않는다.\n\n분리 수거용 `study_cafe_backend.launch.py`에서 수거함 config를 전달한 경우,\n`sorting_contact_diagnostics:=true`로 출력 전용 접촉 진단을 켤 수 있다.\n기본은 false이며 `/simulation/contact_diagnostics` 계약과 한계는\n`cleany_mujoco_observer/README.md`를 따른다. 로봇/물체 물리 상태나 perception\n입력을 바꾸지 않는다.\n\n## 분리 수거 fixture\n\n`study_cafe_backend.launch.py sorting_bins_config:=\u003cpath>`는 materialized\nscene의 chassis 기준으로 바닥과 네 벽을 갖는 좌우 수거함을 추가한다.\n`config/robot_top_bins.yaml`의 +Y가 분실물함, -Y가 쓰레기함이다.\n빈 인자(기본값)는 기존 장면을 그대로 사용한다. template/materializer 외의\ncanonical 로봇 mesh/scene asset은 변경하지 않는다.\n\n수거함은 실제 MuJoCo 충돌 형상이다. 물체를 순간 이동하거나 그리퍼에\nweld하는 기능은 추가하지 않았다. 설정 시\n`cleany_mujoco_observer/ObservedMujocoSystem` hardware wrapper를 선택한다.\n설치된 backend의 제어/물리 동작을 유지하며, 잠금된 `get_data` 복사로\n평가용 관측을 수행한다. 동시 갱신되는 vendor plugin 배열을 직접 읽지 않는다.\n`placement_verifier`는 `/simulation/sorting_ground_truth`를 관찰하고\n`/sorting/verify_placement` 요청에 release 이후의 올바른 수거함 내부\n안착 여부를 응답한다. 이는 시뮬레이션 평가용 정답 정보이며 RGB-D 인식이나\ngrasp/경로의 입력으로 쓰지 않는다. 동작 연결은 skill executor의\n`make sim-mujoco-sorting`을 사용한다(전체 집기·놓기 검증은 진행 중).\n\n현재 vendor renderer는 headless여도 GLFW 연결을 필요로 한다. 이 VM에서는\n유효한 `DISPLAY=:0`을 전달해야 RGB-D가 발행된다. GUI 창을 켜야 한다는\n뜻은 아니며 display가 없으면 모델 준비 완료 뒤에도 RGB-D timeout이 난다.\n\n## 상태와 책임\n\n유지하는 장면은 스터디카페 두 가지다.\n\n- `scenes/study_cafe.xml.in`: 방·책상·물체 배치를 확인하는 관찰 장면.\n- `scenes/study_cafe_grasp_execution.xml.in`: 고정 베이스에서 집기·분류·놓기를 실행하는 장면.\n\n`mujoco_study_cafe.launch.py`는 custom bridge를 통해 관찰 장면을 실행한다.\n`study_cafe_backend.launch.py`는 로컬 `cleany_mujoco_observer/ros2_control_node`에서\n설치된 MuJoCo hardware와 팔·그리퍼 controller를 실행한다. 한 제어 주기의 시각을\n공유하고 중복 시각 발행을 방지한다. [제어 주기 설명](../../cleany_mujoco_observer/README.md#제어-주기와-관절-피드백-시각)을 따른다.\n공통 기본 장면도 스터디카페이며, 두 backend를 동시에 실행하지 않는다.\n캔·박스·RGB-D pick·hand-eye 전용 시뮬레이션과 비활성 OBJ는 제거했다.\n현재 물체는 종이컵·레고·휴지·마우스이며 외부 OBJ/texture는 마우스만 사용한다.\n로봇 CAD mesh는 공통 모델에 필요한 `cleany_description`에서 관리한다.\n\n주행 기본값은 wheelbase **0.35 m**, track **0.6038 m**, wheel radius\n**0.0635 m**이며 launch/ROS parameter로 변경할 수 있다. CAD 치수이며 실측\nodometry 보정값은 아니다. 기존 액추에이터와 MuJoCo 3.4 제어 호환 경로를\n유지한다. 물성 추정과 모델 계약은\n[cleany_description](../../cleany_description/docs/model.md)을 참고한다.\n\n## 실행과 테스트\n\n### 되돌릴 수 있는 고정 책상 최적화\n\n`sim_performance_profile`은 임시 materialized scene에만 적용한다. 기본값\n`baseline`은 기존 설정을 그대로 유지한다. 소스 MJCF, mesh, layout은 수정하지 않는다.\n\n| 프로필 | 배경 충돌 | 그림자 맵 |\n| --- | --- | --- |\n| `baseline` | 기존 그대로 | 4096 |\n| `tabletop_collision` | 먼 정적 가구만 비활성화 | 4096 |\n| `tabletop_fast` | 먼 정적 가구만 비활성화 | 2048 |\n\n`config/tabletop_performance.yaml`의 반경 2m 바깥에 **형상 전체가** 위치한\n책상·모니터·파티션·벽만 대상으로 한다. 보수적인 경계구를 사용하므로 근처\n가구와 큰 벽은 유지될 수 있다. 바닥, 로봇, 수거함, 물체 및 명시 contact pair는\n유지한다. 질량·마찰·관절 제한·timestep·solver·카메라 해상도/FOV·추적 FPS·\nMoveIt/OctoMap은 변경하지 않는다. `tabletop_fast`는 GUI와 센서 영상 모두에서\n그림자 정밀도가 낮아질 수 있으므로 인식 회귀 검사가 필요하다.\n\n이 프로필은 chassis-world weld가 있는 `study_cafe_grasp_execution` 장면에만\n허용한다. 이동 베이스·내비게이션·실제 하드웨어에는 적용하지 않는다.\n시뮬레이션 시간 배속이나 로봇 이동 속도 상향 기능이 아니다.\n\n2026-09-11 시험에서 먼 배경 충돌 602개를 비활성화해도 물리 step 시간은\n유의미하게 줄지 않았다. 그림자 축소의 헤드 RGB 렌더 시간 감소는 약 12%였으나\n전체 수거 시간 단축은 확인하지 못했다. `tabletop_fast` headless 시험은 레고\n수거 후 컵 접근에서 관절 목표 오차로 실패했고, 비교 `baseline` 실행은 그 컵을\n수거했다. 원인을 최적화로 확정한 것은 아니지만 **기본 프로필은 baseline으로\n유지하며 fast는 실험용**이다. 같은 파지 성공률이 검증됐다고 해석하지 않는다.\n\n```bash\n# 적용 (기존 GEMINI_API_KEY / DISPLAY 등 실행 환경 유지)\nmake sim-mujoco-sorting SORTING_ARGS='sim_performance_profile:=tabletop_fast headless:=true use_rviz:=false use_image_view:=false'\n# 원복: 실행을 종료한 뒤 baseline으로 재시작 (파일 복원 불필요)\nmake sim-mujoco-sorting SORTING_ARGS='sim_performance_profile:=baseline headless:=true use_rviz:=false use_image_view:=false'\n# 그림자 품질을 유지하며 배경 충돌만 줄이기\nmake sim-mujoco-sorting SORTING_ARGS='sim_performance_profile:=tabletop_collision'\n# 별도 정지 장면 성능 비교: 다른 시뮬레이터를 종료한 뒤 실행\nmake profile-mujoco-tabletop BENCHMARK_ARGS='--output /tmp/tabletop_benchmark.json'\n```\n\n벤치마크는 현재 launch 초기자세에서 세 프로필을 교차 순서로 반복한다.\n물리 step과 640×480 카메라별 RGB 렌더+readback을 따로 측정하며,\nMuJoCo Python 버전도 기록한다. ROS backend/vendor 버전, depth readback,\n인식 모델, GUI, 실제 파지 접촉 부하를 포함한 전체 수거 시간과는 다르다.\n일괄 속도 향상률로 해석하지 않는다.\n\n아래 명령은 레포지토리 루트에서 실행한다.\n\n```bash\nmake sim\nmake sim-mujoco-study-cafe\nmake test-mujoco\n```\n\n`sim-mujoco-study-cafe`는 Gazebo 개발공간의 12.26×10.94 m 방과 동일한 좌표에\n벽 4개, 책상 48개, 파티션 24개, 모니터 48개를 띄우며 의자는 생성하지 않는다.\n기존 Gazebo spawn에서 가장 가까웠던 43번 의자 자리를 기준으로 끌리니 1대를\n책상을 향하도록 배치한다. 의자 중심에서 책상 반대 방향으로 0.32 m 이동하며\n후퇴 거리는 `robot_center_rearward_offset_m`으로 설정한다. 로봇 앞 43번 책상의 현재\n물체는 손잡이 없는 종이컵, 빨간 2×4 레고 블록, 흰 휴지뭉치, 무선 마우스다.\n마우스는 [Computer Mouse — CreativeTrio](https://poly.pizza/m/V2Ebx3pvo4)의 CC0\n메시와 원본 텍스처를 사용하고 110×65×35mm로 정규화했다.\n원본/변환 SHA256과 변경 사항은 `config/study_cafe_assets.yaml`, 재현 도구는\n`tools/convert_computer_mouse.py`에 있다.\n마우스는 책상 중심 기준 `[-0.14, -0.095]m`에 배치한다. 이전 위치에서\n로봇 방향으로 8cm 당긴 시험 배치이며 크기·질량·마찰은 유지한다.\n\n| 물체 / body ID | 외형 크기 | 물리 모델 |\n| --- | --- | --- |\n| 종이컵 / `study_cafe_cup` | 기존 80% 크기에서 추가 10% 축소: 윗지름 61.2, 밑지름 39.6, 높이 68.4, 벽 0.504 mm | 열린 원뿔대 벽 32개와 바닥, 8 g 유지 |\n| 레고 / `study_cafe_lego` | 2배 확대 후 높이만 추가 10% 확대: 몸체 63.6×31.6×21.12 mm, 돌기 포함 높이 25.08 mm | 본체 box와 8개 돌기 cylinder, 2.3 g 유지 |\n| 휴지뭉치 / `study_cafe_tissue` | 60×50×45 mm | 불규칙 삼각형 표면과 convex-hull collision, 1 g |\n| 무선 마우스 / `study_cafe_mouse` | 110×65×35 mm | CreativeTrio CC0 mesh·원본 텍스처와 convex-hull 충돌, 120 g (시뮬레이션 가정) |\n\n`cleany_mujoco_sim/tabletop_shapes.py`가 설정값에서 결정적으로 MJCF mesh/primitive를\n생성한다. 컵은 수거함 입구의 보수적 크기 판정 여유를 확보하기 위해 기존 형상의\n80%로 축소한 뒤 접근 비교를 위해 추가 10% 축소했다(최초 대비 72%). 질량·마찰·위치·파지 설정은 유지하며, 축소만으로 실제 파지/수거\n성공을 보장하지 않는다. 네 물체 모두 free joint가 있으며 강제 고정/attach하지 않는다. 종이컵은\n안쪽을 채운 cylinder가 아니므로 입구로 들어가는 접촉도 가능하다. 다만 종이컵과 휴지는\n눌리거나 구겨지지 않는 **강체 근사**이며, 레고 밑면 결합 튜브와 로고는 생략했다.\n질량과 종이컵/휴지 크기는 시뮬레이션 가정이며 실물 측정값이 아니다. 레고는\n[실측 치수](https://www.cailliau.org/Alphabetical/L/Lego/Dimensions/More%20Dimensions/BBEditPreviewTemp.html)의\n8 mm 돌기 간격, 4.8 mm 지름, 1.8 mm 돌기 높이를 기준으로 현재 모두 2배\n확대해 각각 16 mm, 9.6 mm, 3.6 mm를 사용한다. 시각·충돌 형상을 함께 확대하며,\n크기에 따른 파지 비교를 위해 질량·위치·마찰·파지 설정은 유지한다.\n이는 실제 규격 크기가 아닌 진단용 확대 모델이다.\n파지 실행 launch의 우측 팔 mirrored home 자세는 wrist-roll을 `-1.58 rad`로\n시작하는 기존 설정을 유지한다.\n위치, 질량, 색상과 collision 크기는\n`config/study_cafe_layout.yaml`에서 조정할 수 있다. 기본 위치는 640×480\n`head_realsense_rgb` 카메라와 `head_tilt_joint=1.00 rad` 조건에서 네 물체의 전체\n물체가 화면 경계 안에 들어오도록 맞춰져 있다.\n\n실제 집기 실행은 `scenes/study_cafe_grasp_execution.xml.in`을 사용한다. 일반 관찰 장면과\n같은 배치를 유지하면서 chassis를 world에 고정한다. 종이컵/레고와 양쪽 fixed/moving jaw\n사이의 고마찰 contact pair는 복합 collision의 모든 부분으로 확장한다(컵 330개,\n레고 90개). 컵의 sliding friction은 6이다. 레고는 열린 fixed jaw에 남는 현상을\n줄이기 위해 명시 pair friction을 `(1.5, 1.5, .001, .0001, .0001)`로 설정한다\n(이전 `(5, 5, .4, .15, .15)`). 좌우 sliding 마찰 외에 비틀림/구름 저항도 낮췄다.\n두 팔의 본체/돌기 pair에 동일하게 적용하며 파지와 방출 중 값을 전환하지 않는다.\n이는 시뮬레이션 튜닝값이지 실제 종이/플라스틱의 측정 마찰계수가 아니다.\n물체 weld, 중력 보상, 강제 낙하 힘 또는 방출 시 collision 비활성화는 사용하지 않는다.\n2026-09-11 headless 레고 단독 파이프라인에서 파지·운반·배치 성공과\n열림 시작 후 약 0.10 simulation 초에 하강, 완전 열림/팔 복귀 전에 낙하를 확인했다.\n진단은 `artifacts/lego_release_fix_20260911/REPORT.md`에 기록했으며,\n다른 자세/물체의 성공률 보장은 아니다.\n얇은 강체 컵 벽의 수치적 관통을\n줄이기 위해 컵 pair는 `solref=\"0.002 1\"`, `solimp=\"0.99 0.9999 0.0001\"`을 사용한다.\n이는 종이의 찌그러짐을 재현하는 설정이 아니며 실제 컵 파지력 검증을 대체하지 않는다.\n\n컵의 `geometry.collision_bottom_clearance_m` 기본 배치값은 `0.00025`m다.\n충돌 벽 32개의 외측 아래 꼭짓점을 원뿔대 경사를 따라 0.25mm 올려, 똑바로 선 컵의\n하중을 바닥 원판이 받도록 한다. RGB 시각 메시, 열린 내부, 위쪽 파지 면, 질량 8g,\n마찰 및 solver 설정은 유지한다. 벽 수를 줄이는 것보다 중복된 바닥 접촉 제거가\n효과적이어서 충돌 벽은 32개를 유지한다. 값은 0 이상 바닥 두께(0.504mm) 이하만\n허용하며, 생략하거나 `0`을 설정하면 기존 충돌 형상으로 돌아간다.\n\n2026-09-29 MuJoCo 3.7 정지 장면 비교(실제 launch home, 1 simulation 초 settle 후\n2초 측정, 순서를 교대해 3회 반복, ROS·렌더링 제외)에서 컵 접촉은 69→5개,\n전체 접촉은 88→24개, 물리 step 중앙값은 1.306→0.230ms였다(약 82% 감소).\n수정 후 측정 구간 위치 변화는 약 0.0012mm였다. 이는 **정지 상태 물리 계산**의\n개선이며, 전체 인식·집기 파이프라인이나 GUI가 같은 비율로 빨라진다는 의미는 아니다.\n비교 원자료와 재현 스크립트는 로컬 `artifacts/cup_contact_optimization_20260929/`에\n보관한다. `test/test_tabletop_shapes.py`는 시각 형상 불변, 열린 입구, 파지 높이의\n측면 연속성, 바닥 지지와 접촉 감소를 검사한다.\n\n휴지와 마우스 강체 proxy도 각각 양쪽 jaw와의 10개 pair에 같은 강성을 적용한다. 기본 혼합\n마찰 `(3, 3, .2, .1, .1)`과 질량/형상/모터 한도는 유지한다. 부드러운 접촉에서\n이전 휴지·지갑 proxy에서 관측된 약 18mm·2.1mm 메시 관통을 줄이기 위해 도입했으며\n실제 휴지나 마우스의 변형 모델은 아니다.\n마우스는 시각 메시를 collision mesh에도 공유한다(MuJoCo convex hull).\n오목한 버튼 장식까지 충돌 분해한 모델은 아니다.\n머리 카메라는 materialization 시\n`640×480`, `fovy=42°` 계약을 검사해 RGB-D driver의 1×1 기본 해상도 사용을 막는다.\n\n조명은 `config/study_cafe_lighting.yaml`에서 설정하며 일반 관찰/집기 장면과 GUI/RGB-D\n렌더에 공통 적용한다. 기존 canonical robot의 world light는 materialized copy에서만\n제거하고, 작업 책상이 포함된 3열×2행의 인접 책상 6개에 하나의 spotlight를\n배치한다. 중심은 `(-4.33, -3.17, 3.30)m`, 수직 아래 방향, cutoff 40°,\nexponent 0이다. 책상 높이에서 반경 약 2.16m 범위를 같은 각도 강도로 비춘다.\n4096 shadow map을 방 전체 대신 이 구역에 집중해 그림자 계단 현상을 줄인다.\n방 전체 directional 보조광과 ambient는 유지하며, 그림자 광원은 하나다.\n카메라 headlight는 ambient 0.12, diffuse 0.08, shadow map은 4096이며\n전역 directional shadow half extent는 12 m다. 보조광의 그림자는 꺼져 있다. 이는 실측 조도나\n실내 간접광을 계산하는 모델이 아닌 근사다.\n기존 headlight와 기본 광원의 합산으로 흰 상판이 포화되고\n그림자 대비가 사라지는 문제를 줄이기 위한 설정이지 실측 조도/카메라 보정값은 아니다.\n[MuJoCo headlight는 자체적으로 그림자를 만들지 않는다](https://mujoco.readthedocs.io/en/stable/XMLreference.html#visual-headlight).\n그림자 광원은 추가 렌더 패스를 사용하므로 렌더링 비용이 증가할 수 있다. 물체 크기,\n마찰, 카메라 intrinsics, 검출 confidence 및 파지 안전 기준은 조명 변경으로 바꾸지 않는다.\n\nGazebo plugin·sensor는 옮기지 않으며, Fuel에서 내려받는 의자 mesh 대신 Gazebo\ncollision 치수와 같은 MuJoCo primitive를 visual/collision로 사용한다. 원본 배치는\n`config/study_cafe_layout.yaml`에 독립 실행용으로 복제하며, 테스트에서 Gazebo 원본\nYAML과의 일치 여부를 확인한다.\n\nTabletop asset 출처와 라이선스는 `config/study_cafe_assets.yaml`에 기록한다. 현재\n외부 mesh는 Computer Mouse(CreativeTrio, CC0)이며 원본 UV texture를 사용한다.\n과거 Coffee Mug(Michael Fuchs, CC BY 3.0)와\nSmartphone(smallbigsquare, CC0)의 OBJ, URL, 변환 내역, SHA-256은 이력용으로\n보존하지만 현재 장면에 로드하지 않는다.\n\n새 형상의 장면 컴파일, 실물 크기, 열린 컵 충돌체, 물리 settle, 카메라 시야는\n`test_study_cafe_scene.py`/`test_tabletop_shapes.py`와 `make test-grasp-pregrasp`로\n검사한다. 이 검증은 YOLOE 검출이나 집기 성공 검증을 대신하지 않는다. 기존 머그컵의\n수거 성공/시간 측정 결과를 새 종이컵·레고·휴지에 적용하지 않는다. 실제 크기 레고는\nsorting의 기존 50 mm 최소 파지 후보 폭보다 작으므로 자동 집기 대상에서 제외될 수 있다.\n\n직접 launch할 수도 있다.\n\n```bash\nros2 launch cleany_mujoco_sim mujoco_study_cafe.launch.py headless:=false\n```\n\n전체 수거와 인식 파이프라인은 레포지토리 루트에서 실행한다.\n\n```bash\nmake sim-mujoco-sorting\nmake sim-mujoco-pipeline\nmake test-grasp-pregrasp\nmake test-mujoco\n```\n\n`make test-mujoco`는 현재 장면과 custom bridge의 전체 단위 테스트를 검사한다.\n이전 데모와 빈 방의 MuJoCo 주행 runtime 검사는 제거했다. 공통 명령 검증·timeout·\n휠 매핑 단위 테스트는 유지하며 전체 물리 수거 성공은 별도 검증 대상이다.\n\n## ROS contract\n\n스터디카페 수거 backend는 `mujoco_ros2_control/ros2_control_node`,\n`robot_state_publisher`, joint-state broadcaster와 양팔·그리퍼 trajectory controller를\n실행한다. `config/study_cafe_ros2_controllers.yaml`에서 controller 설정을 관리한다.\n초기 관절 값은 임시 장면의 `handeye_ros2_control_home` keyframe에 기록한다.\n이 이름은 vendor plugin 호환을 위해 유지하는 내부 keyframe 식별자다.\n\n스터디카페 통합 launch는 head RGB-D와 nominal 손목 TF를 연결한다.\n센서 촬영은 `cleany_mujoco_observer`의 scheduled renderer 또는 선택한 vendor\nrenderer가 담당한다. 이전 Python RGB-D renderer와 ground-truth bridge는 제거했다.\n선택형 `camera_contract_adapter`는 `config/wrist_camera.yaml`에서 왼손목 camera\nintrinsics와 topic 계약만 읽는다. 보정판·이전 hand-eye 장면에는 의존하지 않는다.\nRGB-D의 원본 촬영 시각을 보존하며 실제 카메라 보정값을 의미하지 않는다.\n\n## 베이스 구동 모델\n\n각 휠은 독립적인 `PG42-4266-1270NE` output-shaft DC motor 모델을 사용한다.\nactuator 제어 입력은 `rear_left_drive`, `rear_right_drive`, `front_left_drive`,\n`front_right_drive`의 모터 단자 전압이다. `base_link +X`가 전방이며, 양의 yaw는\n`+Z` 기준 반시계 방향이다.\n\n- 정격 공급 전압: `12 V`\n- 기어박스: `61:1`; 제조사 출력 토크에는 `72%` 효율이 반영되어 있다.\n- 제조사 정격 출력: `103 rpm`에서 `2.94 N.m`\n- 계산한 무부하 출력: `7000 / 61 rpm` (`12.017 rad/s`)\n- 10% 마진을 적용한 시뮬레이션 운용 한계: `10.8 V`, `2.646 N.m`\n- 디레이팅한 정격점: `92.7 rpm` (`9.708 rad/s`)\n- 디레이팅한 무부하 평형점: `103.28 rpm` (`10.815 rad/s`)\n\nMJCF actuator는 기어박스 출력축에서 직접 모델링하므로(`gear=1`) 감속비와 효율을\n다시 적용하지 않는다. 매 physics step마다 실제 joint 속도를 읽고, feed-forward와\nanti-windup을 포함한 휠별 PID controller로 `-10.8~10.8 V` 전압을 계산한다.\nPID gain은 MuJoCo DC motor step response를 기준으로 한 시뮬레이션 값이며 실제\nESP32 controller에 그대로 사용하지 않는다.\n\n## 팔 서보 모델\n\n양팔은 Feetech 12 V 시리얼 서보를 사용한다.\n\n- left/right shoulder pitch와 elbow pitch: `STS3250`\n- shoulder rotation, wrist pitch/roll, jaw, head pan/tilt: `STS3215`\n\n모델의 출력 한계에는 제조사 사양 대비 10% 운용 마진을 적용한다. 위치 actuator와\njoint force 한계에는 최대 정지 토크의 90%를 적용한다. 전류, 발열 및 2초 과부하\n차단 동작은 아직 모델링하지 않았다.\n\n## 실행 인자\n\n`mujoco_study_cafe.launch.py`는 `headless`를 제공하며 기본은 false다.\n관찰용 Python bridge의 `viewer_rate_hz` 기본은 20.0(1–60Hz)이고,\n`viewer_shadows` 기본은 false다. viewer sync만 wall time으로 제한하며 physics·ROS\n발행 주기는 유지한다. `SIM_ARGS='viewer_rate_hz:=60.0 viewer_shadows:=true'`로\n기존 GUI 설정을 선택할 수 있다.\n공통 custom bridge인 `mujoco_sim.launch.py`의 `scene_path` 기본값도\n`scenes/study_cafe.xml.in`이다. 주행 관련 bridge parameter는 이 관찰 backend의\n공통 기능으로 유지한다.\n\n`study_cafe_backend.launch.py`의 주요 인자:\n\n- `scene_path`: 기본 `scenes/study_cafe_grasp_execution.xml.in`.\n- `controller_config`: 기본 `config/study_cafe_ros2_controllers.yaml`.\n- `camera_config`: 기본 `config/wrist_camera.yaml`.\n- `headless`, `sim_viewer`, `sim_speed_factor`, `sim_xmodifiers`: viewer·속도·XIM 설정.\n- `sorting_bins_config`, `scheduled_cameras`, `sorting_contact_diagnostics`: 수거함·카메라 스케줄·관측 설정.\n- `camera_name`, `camera_frame_name`, `color_image_topic`, `camera_info_topic`, `depth_image_topic`: renderer 연결.\n- `enable_camera_contract_adapter`: 기본 false. 통합 launch는 head camera topic을 직접 연결한다.\n- `enable_gripper_controllers`, 양팔 `*_initial`, `head_tilt_initial`: 제어 interface와 초기 자세.\n\n수거 전체의 초기 자세와 센서 연결은 `cleany_skill_executor`의\n`study_cafe_sorting.launch.py` 및 `study_cafe_nearest_grasp_demo.launch.py`를 따른다.\n\n## Backend 터미널 로그\n\n`study_cafe_backend.launch.py`는 `backend_log_level:=warn`으로 관절 등록,\n링크 나열과 renderer 초기화 상세를 줄인다. 경고·오류와 controller spawner의\n준비 완료는 기본 출력에 남는다. 상세 초기화는 `backend_log_level:=info`로\n확인한다. `log_level:=info`는 spawner와 camera contract adapter에 적용하며\n`debug`로 조정할 수 있다. 상위 센서·수거·BT launch도 두 옵션을 전달한다.\n\n## 시뮬레이션 확장 API\n\n같은 process의 sensor adapter는 `MujocoSimNode.simulation_context`에서\n`MujocoSimulationContext`를 받아 MuJoCo model과 최신 data를 조회할 수 있다. 두\nnative handle은 렌더링 등 MuJoCo API 호출에 직접 사용할 수 있지만 adapter가 물리\n상태를 변경하지 않는 read-only 계약을 따른다.\n\n`MujocoSimNode.add_step_observer(observer)`에 `StepObserver` 구현을 등록하면 각 ROS\ntimer tick의 모든 물리 substep이 끝난 직후 한 번 `after_step(context, stamp)`가\n호출된다. callback은 기존 ROS 상태 토픽 발행 전에 동기적으로 실행되며 예외를\n숨기지 않는다. observer는 callback을 짧게 유지해야 한다.\n\n## 범위\n\n구현된 기능:\n\n- `cleany_description`의 authoritative MJCF를 simulator-owned scene에 load\n- 독립적인 PG42 motor를 사용하는 네 개의 5-inch mecanum drive wheel 시뮬레이션\n- ROS timer로 simulator step, joint state·odometry·laser scan·TF 발행\n- 시뮬레이션 시험용 직접 joint position 명령\n- `/cmd_vel` 검증·제한·timeout과 메카넘 역기구학\n- 휠별 PID, feed-forward, anti-windup, 전압 제한을 통한 actuator 제어\n- 좌·우 5축별 표준 `FollowJointTrajectory` action과 12개 arm/gripper joint state를\n  제공하는 배타적인 MuJoCo `ros2_control` backend\n- Humble release `MujocoCameras` 기반 left wrist RGB/CameraInfo와 public contract\n  normalizer\n- 스터디카페 head·손목 RGB-D renderer 연결과 카메라 스케줄링\n- 관측 wrapper를 통한 평가 전용 수거함·접촉·안착 정보\n\n아직 구현되지 않은 기능:\n\n- `cleany_robot_interface` 또는 Mission FSM의 운영 인터페이스 연동\n- 실제 encoder noise, 전류, 열, 과부하 차단 동작\n- 베이스 또는 매니퓰레이터용 하드웨어 현실성 기반 controller\n\n## 공통 RGB-D 파이프라인 연결\n\n`study_cafe_backend.launch.py`에 `color_image_topic`, `camera_info_topic`,\n`depth_image_topic`을 명시하면 선택 MJCF camera 출력을 해당 ROS 토픽으로\n직접 remap한다. 비워 두면 `wrist_camera.yaml`의 internal 토픽을 사용한다.\ncustom 토픽 사용 시 `enable_camera_contract_adapter:=false`가 필요하다.\n이 옵션은 영상 전달 경계만 바꾸며 simulator geometry/물체 정답을 알고리즘에\n주입하지 않는다. head 고정 camera 보정 TF의 실제 로봇 정확성을 뜻하지 않는다.\n\n레포 루트의 `make sim-mujoco-pipeline`은 학습 perception과 sensor-only\nMoveIt 지도를 포함하는 plan-only GUI 실행이다. 장면만 띄우는\n`make sim-mujoco-study-cafe`는 장면 관찰용이다.\n\n## 관련 KB와 문서 갱신\n\n- [Robot Platform XLeRobot](../../../../docs/cleany-docs/20_TECHNICAL/04%20-%20Robot%20Platform%20XLeRobot.md)\n- [Navigation and Mapping](../../../../docs/cleany-docs/20_TECHNICAL/05%20-%20Navigation%20and%20Mapping.md)\n- [Safety and Risk](../../../../docs/cleany-docs/20_TECHNICAL/08%20-%20Safety%20and%20Risk.md)\n\n발행 topic, launch parameter, 시뮬레이션 모델 가정 또는 테스트 명령이 바뀌면 이\nREADME도 갱신한다. 시뮬레이션 하드웨어 파라미터를 관련 KB 결정 없이 확정된 실제\n하드웨어 사양으로 표현하지 않는다.\n\n## 두 컵과 개체별 배치 확인\n\n`config/study_cafe_two_cups.yaml`은 기존 물체와 별도의 자유 물체 `cup_b`를 둔다.\n`study_cafe_backend.launch.py`의 `study_cafe_layout_config`로 선택하며 기존 기본 배치는\n유지한다. materialize API도 같은 선택적 Path 인자를 받는다. 기존 cup/lego/tissue/mouse를\n유지하면서 고유 이름의 추가 procedural 물체를 허용한다. asset·mesh를 재생성하지 않는다.\n\n독립 `placement_verifier`는 `/sorting/register_placement_target`에서 관측된 OBB·종류와\nexecution ID로 기하학적으로 유일한 simulator body를 내부에 고정한다. 이후 verification\nID의 개체에만 release 이후 새 샘플·수거함 내부·안정을 검사한다. 다른 컵이 안에 있어도\n등록된 컵의 성공으로 판단하지 않는다. label/body 배열은 같은 종류의 여러 body를 허용하되\nlabel-only 확인은 그 종류에 body가 하나일 때만 가능하다. 등록 응답은 body 정답을 노출하지 않는다.\n\n`placement_verifier.yaml`과 `placement_verifier_two_cups.yaml`의 5cm 거리·1cm 후보 차이·\n8cm 크기 오차는 관측 OBB와 충돌 AABB를 대응시키는 시뮬레이션 초기값이다. 실물 기준이\n아니며 넓은 크기 허용은 위치의 유일성 검사를 대체하지 않는다. 등록은 기본 600초·128건,\n관측 최대 나이 120초다. 재시작·시각 역행으로 등록을 복구하지 않고 잘못된 ID에는 fallback하지 않는다.\n\n분실물 확인은 `mouse`, `computer mouse`, `wireless mouse`, `lego brick`의 개체 등록과\n`lost_items_left` 목적지를 지원한다. 검사에서 다른 개체나 잘못된 수거함은 성공 근거가\n되지 않는다. MuJoCo physics에서 레고의 정상 배치는 확인된다. 기존 observer가 마우스\nmesh의 회전된 local AABB를 변환하면 실제 물체가 내부에 안정되어도 바닥 경계를 벗어나는\n경우가 있어 보수적으로 거부한다. 이 제한을 테스트로 보존하며 허용 오차는 완화하지 않는다.\n"},"ros2_ws/src/cleany_navigation/README.md":{"title":"Cleany Navigation","body":"# Cleany Navigation\n\n지도 생성과 저장, Nav2 주행, 위치 정합 및 장애물 감시를 구성합니다. 사용 순서는 작업 가이드, 노드와 설정의 세부 조건은 이 패키지의 참조 문서를 따릅니다.\n\n| 하려는 일 | 시작할 곳 |\n|---|---|\n| 휴대폰에서 목적지 지정 | [화면으로 따라 하는 주행 가이드](../../../docs/how-to/phone-navigation.md) |\n| 하드웨어로 지도 생성·저장 | [매핑 실행](../cleany_bringup/docs/hardware-mapping.md), [매핑 규약](docs/mapping.md) |\n| 경로·속도·주행 방식 조정 | [계획과 제어](docs/planning.md) |\n| 노드별 입력·출력 연결 | [인터페이스](docs/interfaces.md) |\n| 감속·정지 조건 확인 | [안전 경로](docs/safet
