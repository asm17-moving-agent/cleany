` |\n\n### 지지면과 jaw 충돌\n\n```mermaid\nflowchart LR\n    OBB[\"관측 OBB 바닥\"] --> Patch[\"유한 support patch\"]\n    Patch --> Open[\"실제 열린 jaw 끝점 검사\"]\n    Open --> Close[\"전체 로봇으로 닫힘 구간 검사\"]\n    Close --> Attach[\"attachment 뒤에도 지지면 유지\"]\n    Attach --> Restore[\"transaction 종료 / target 제거와 ACM 복원\"]\n```\n\n| 검사 | 설정 / 거부 조건 |\n|---|---|\n| Support patch | `support_patch_margin_m=0.02`; OBB XY 사방 2 cm 확장, 바닥 아래 두께 1 cm; 노드 기본 0 |\n| 관측 전제 | OBB Z축이 지지면 법선; 수평에서 20° 초과 또는 잘못된 pose 거부 |\n| 범위 | target mask padding 1.5 cm를 포함하는 로컬 가정; 책상 정답을 읽지 않음 |\n| 접촉 허용 | 물체/support만 허용, robot/support 거부 |\n| 열린 끝점 | `require_open_grasp_clearance=true`; target 접촉 허용을 잠시 해제하고 선택 gripper만 연 전체 로봇 검사 |\n| 닫힘 sweep | `require_gripper_closure_clearance=true`; `gripper_sweep_step_rad=0.05` 이하 간격, target 외 충돌 거부 |\n| 복원 | 성공 / 실패 / 예외 모두 ACM 복원; attachment 뒤에도 patch 유지 |\n| 충돌 진단 | 거부된 seeded cubic의 최대 8개 contact: body pair, 위치/frame, penetration depth |\n\n이 검사는 기하학적 표본 검사입니다. 접촉 동역학과 파지 유지를 보장하지 않으며 보수적인 OBB 때문에 유효한 후보도 거부할 수 있습니다. Grasping의 간이 지지면 검사 위임은 이 patch와 open/closure 검사를 함께 사용할 때만 허용합니다.\n\n### 선택 물체의 복원과 IK\n\n```mermaid\nflowchart TD\n    Ranked[\"bbox / depth 거리순 후보\"] --> Review{\"review 분류?\"}\n    Review -->|예| Unresolved[\"정밀 복원 없이 미해결 유지\"]\n    Review -->|아니오| Reconstruct[\"선택 mask의 3D 복원 / 주기 내 캐시\"]\n    Reconstruct --> IK[\"파지 계획 / 양팔 도달성\"]\n    IK -->|실패| Next[\"다음 후보 / snapshot TTL 재검사\"]\n    Next --> Review\n    IK -->|성공| Chosen[\"선택 종료 / 실행 전 경로 검증\"]\n```\n\n접근 방향의 어깨 기준점은 launch가 현재 기본 URDF의 `base_link` 기준 원점에서 읽습니다. 별도 CAD 좌표를 복제하지 않습니다.\n\n선택하지 않은 물체도 전체 depth OctoMap의 충돌 검사에는 남습니다. 만료된 snapshot의 시각을 갱신하지 않으며, 미해결 물체와 이전 관측 물체의 누락을 계속 검사합니다.\n\n| 항목 | Sorting 값 / 계약 |\n|---|---|\n| 고정 jaw 여유 | `fixed_jaw_clearance_m=0.003 m`; selector/coordinator의 `grasp_fixed_jaw_clearance_m`도 동일; 비-sorting 기본 0 |\n| 벌림 여유 | `grasp_opening_margin_m=0.008 m`; 고정 jaw 여유는 그 절반 이하 |\n| 5 mm 진단 | 고정 여유 0.005 m, 벌림 여유 0.010 m; 생성기와 두 TCP 보정 경로에 동일 전달 |\n| 수치 보정 | `pose_refinement_iterations=30`; runtime `/robot_description` URDF 로컬 FK와 MoveIt FK를 후보 탐색 전 대조; 일반 adapter 0은 기존 탐색 |\n| Seed 예산 | pregrasp는 `pregrasp_aim_attempts`, grasp는 `grasp_pose_seed_attempts`; grasp 0이면 pregrasp 예산 재사용 |\n| 종료 | 설정 예산 내 첫 유효 해; 예산 증가는 실패 후보 시간을 늘릴 수 있으나 허용값은 유지 |\n| 위치 검사 | grasp 1.5 mm (`grasp_position_tolerance_m=0.0015`), pregrasp 20 mm |\n| 위치 잔차 가중치 | `pose_refinement_position_weight=10`; 각도, 관절 한계, 충돌 기준 유지 |\n| Head reference 갱신 | `sorting_head_reference_refresh_age_sec=0.0`이면 시간 경과만으로 재인식하지 않음; `(0,30] s`는 만료 / 연관 / 동일 팔 재계획 활성 |\n\n수치 보정은 후보 계산이며 로봇 명령을 보내지 않습니다. Head reference 자동 갱신을 꺼도 손목 관측 유효성 검사와 원본 측정 시각는 유지합니다.\n\n### TCP 보정과 닫기\n\n| 항목 | 계산 / 제한 |\n|---|---|\n| `grasp_use_aperture_centering=true` | 검출 폭에서 opening margin 8 mm 제외 → 물체 폭/2 − `fixed_jaw_inner_x` 8 mm로 TCP 옆방향 보정 |\n| 계획과 실행 | 같은 보정 함수 사용 |\n| 시뮬레이션 jaw | aperture 기울기 0.065 m/rad, command opening reduction 18 mm |\n| 추가 닫기 | `gripper_contact_retry_steps`: 노드 0, sorting 5, 허용 0–5회 |\n| 회당 명령 | `gripper_contact_retry_step_rad=0.10`, `gripper_contact_retry_motion_sec=1.2` |\n| 구동 한계 | 닫힘 하한과 기존 토크 제한 유지; 최초 열린 위치 기준으로 접촉 판정 |\n| 확인 실패 | 허용 횟수 안에서 확인되지 않으면 lift 전에 실패 |\n\n### 자동 sorting의 손목 미검출 보완\n\n```mermaid\nflowchart TD\n    Handoff{\"HANDOFF 성공?\"} -->|아니오| Fail[\"중단\"]\n    Handoff -->|예| Check[\"접근 / 파지 / lift 후 새 CHECK\"]\n    Check --> Result{\"CHECK 결과\"}\n    Result -->|오류 또는 모호함| Fail\n    Result -->|검출 또는 NOT_DETECTED| Motor{\"전후 새 그리퍼 표본으로 접촉 확인?\"}\n    Motor -->|아니오| Fail\n    Motor -->|예| Carry[\"운반 / 시각 확인 여부를 로그에 구분\"]\n```\n\n| 조건 | 기준 |\n|---|---|\n| CHECK 횟수 | `sorting_wrist_check_attempts=1`, 허용 1–5; 기본은 미검출이어도 추가 요청 없이 모터 검사로 판단 |\n| 영상 신선도 | 첫 요청은 lift 완료 뒤, 재요청은 직전 실제 촬영 시각 뒤의 프레임 |\n| 응답 동일성 | 미검출 응답도 source/reference ID, 선택 팔 좌표계, 촬영 시각 확인 |\n| 보완 제외 | HANDOFF 실패, 센서 / 통신 / TF / 추론 / 참조 오류, 모호한 검출 |\n| 접촉 표본 | 각 CHECK 전후 요청 이후의 서로 다른 표본 최소 3개 |\n| 지속 시간 | `sorting_wrist_contact_confirmation_sec=0.3 s` ROS 시간 |\n| 나이 / 간격 | `sorting_gripper_feedback_max_age_sec=0.5 s` 이하 |\n| 대기 상한 | `gripper_contact_feedback_timeout_sec=5 s` wall time |\n| 거부 | 오래된 값, 중복 stamp, 단절, 빈손 완전 닫힘, 접촉 상실 |\n| 미래 stamp | `/clock`이 따라올 때까지 세지 않음; 지속되는 미래 값 / 시계 정지는 상한에서 실패 |\n\n모든 영상이 미검출이어도 접촉 조건을 만족하면 운반합니다. 이는 그리퍼 위치·속도에 근거한 진행이며 물체 식별이나 전류·토크 확인이 아닙니다. Lift 높이도 FK와 파지 offset의 추정값입니다.\n\n### 접촉 재시도와 운반 감시\n\n| 단계 | 유지하는 검사 |\n|---|---|\n| 최초 접촉 | 관절 잔차와 정지 속도; 완전히 닫혀 잔차가 없으면 성공 아님 |\n| 연속 sorting | `gripper_force_full_close=true`로 기존 닫힘 하한을 목표로 유지; 실제 접촉은 그 전에 멈출 수 있음 |\n| 비동기 운반 | 추가 조임은 허용; 최소 잔차, 열리는 속도 상한, feedback 신선도, 손목 추적, 접촉 상실 debounce 유지 |\n| 감시 기준 명령 | 추가 닫기를 포함한 실제 마지막 명령 |\n| Attachment 대기 | [경로별 timeout](study-cafe-sorting-configuration.md#파지-후-depth-최신성); 새 데이터가 준비되면 즉시 진행 |\n| 지도 신선도 | 2 s, attachment 뒤 새 capture 필요; tree 쓰기 뒤 processed-cloud receipt로 활동 확인 |\n| 지도 거부 | 빈 지도, 원본 cloud 수신만 있음, 중복 receipt; populated-map과 capture/receipt 신선도 모두 요구 |\n\n힘 센서 판정이 아니므로 잔차가 사라지기 전의 미끄러짐을 모두 검출하지 못합니다. 물리 파지 성공과 실물 보정값은 별도 검증 대상입니다.\n\n### 열린 jaw와 수직 lift 진단\n\n열린 jaw 검사는 [지지면과 jaw 충돌](#지지면과-jaw-충돌)을 따릅니다. 아래 진단은 기본 역방향 retreat를 바꾸어 시험할 때 사용합니다.\n\n| 설정 / 검사 | 조건 |\n|---|---|\n| `direct_vertical_lift` | 기본 false; true는 현재 TCP에서 바로 수직 lift 계획 |\n| `direct_vertical_lift_extra_m` | 기본 0, 허용 0–0.05 m; 진단 TCP 상승에만 추가 |\n| 높이 | 기존 물체 중심 최소 상승 높이 유지; 부족하면 예측 / 요구 높이 오류 기록 |\n| 경로 | 끝점 position IK/FK + seeded 위치 corridor; 끝점 자세 한도 5°와 전체 FK / 충돌 / 자세 검사 |\n| 해석 | 정확한 자세 고정 LIN이 아님; 접촉과 손목 감시 유지 |\n\n## 수거함 운반\n\n고정 투하점과 운반 설정 원본은 [nearest_pregrasp.yaml](../config/nearest_pregrasp.yaml)입니다.\n\n### 분류된 수거함으로 직접 이동 / 손목 유지 (기본 모드)\n\n```mermaid\nflowchart LR\n    Lift[\"lift 완료 / 실제 wrist roll 캡처\"] --> Solve[\"물체 offset을 반영한 고정 투하 IK\"]\n    Solve --> Plan[\"부착 물체와 장애물 포함 MoveIt 계획\"]\n    Plan --> Verify[\"물체 중심 / wrist feedback 확인\"]\n    Verify --> Release[\"그리퍼 열기 / attachment 해제\"]\n    Release --> Return[\"손목 제한 해제 / 복귀와 그리퍼 닫기\"]\n```\n\n| 항목 | 값 / 동작 |\n|---|---|\n| 왼쪽 분실물 중심 | `sorting_fixed_release_lost_items_left_m=[-0.075,0.105,0.50]`, base_link m |\n| 오른쪽 쓰레기 중심 | `sorting_fixed_release_trash_right_m=[-0.075,-0.105,0.50]`, base_link m |\n| 기본 경유점 | 파지 전 공통 경유점 IK, 공동 손목 endpoint, 경유점 이동 생략 |\n| 투하 IK | Roll 고정, 어깨 yaw/pitch + 팔꿈치 + 손목 pitch 4관절 계산 |\n| 투하 허용오차 | 중심 1 cm, IK 축별 0.5 mm, `sorting_fixed_release_wrist_tolerance_deg=0.5°`; 자동 확대 없음 |\n| 도달 실패 | 물체를 놓지 않고 중단; 넓은 탐색이나 손목 완화로 우회하지 않음 |\n| 최종 자세 캐시 | 동일 팔 / roll / offset / 투하점만 재사용; hit도 현재 부착 물체 충돌과 FK 재검사 |\n| 빈손 복귀 상한 | `sorting_return_velocity_scaling=0.12`, `sorting_return_acceleration_scaling=0.15`; 더 낮은 전역값 우선 |\n\n현재 `robot_top_bins.yaml`의 `simulation_ignore_mast_collision=true`는 MuJoCo 기둥 접촉과 MoveIt 기둥–로봇 충돌을 제외합니다. 외형과 self-filter 형상은 남지만 이 구성의 성공은 실제 기둥 회피 검증이 아닙니다.\n\n복귀 상한은 MJCF STS3215 모델(2.648 Nm, 감쇠 합 3.342 Nm·s/rad)의 추종 제약에 맞춘 값입니다. 무부하 정상 속도 약 0.78 rad/s 이하에 대해 복귀 yaw 상한은 약 0.509 rad/s입니다. 토크와 0.12 rad 추종 허용치는 유지하며 실제 모터 인증값으로 쓰지 않습니다.\n\n### 파지 후 후퇴/들어 올리기의 손목 제약\n\n| 단계 | 제약 / 재시도 |\n|---|---|\n| 기준각 | 안정된 파지 접촉 시점의 실제 roll; 구간마다 재설정하지 않음 |\n| 후퇴 / lift | 새 endpoint IK와 전체 Cartesian 경로; 빈 팔 pregrasp 목표 재사용 안 함 |\n| Roll 범위 | `sorting_carry_wrist_tolerances_deg=[2,5,10,20,30]°`; 계획 실패 시 다음 범위, 확대 범위는 놓기까지 유지 |\n| 방향 변화 | `sorting_carry_cartesian_rotation_limit_deg=30°`; 구간 시작 방향 기준, pitch는 물리 한계 내 자유 |\n| MoveIt / 직접 궤적 | 같은 joint path constraint; local IK와 모든 waypoint에서 확인 |\n| 재시도 금지 | 서비스 / URDF 오류, controller 실패, 접촉 상실 뒤 완화 재실행 금지 |\n| 일반 운반 | IK 뒤 경로 계획 실패 시 중단 |\n| 해제 | 열기와 attachment 해제 후 복귀 |\n\nFK corridor의 자세·속도·가속도·충돌 검사는 유지합니다. Roll 유지가 세계좌표 방향 고정, 물체 수평 유지 또는 전역 최적해를 뜻하지 않습니다.\n\n| 공통 입구 검사 | 기준 |\n|---|---|\n| 입구 내 포함 | 벽 두께와 `sorting_release_edge_margin_m=0.005 m`를 제외한 내부에 bounding sphere 포함 |\n| 테두리 위 물체 하단 | `sorting_release_clearance_m=0.06 m`부터 `sorting_release_maximum_clearance_m=0.21 m`까지 |\n| 실행 / 놓기 전 | 범위 밖이면 이동 중단; 놓기 직전 실제 중심 / 손목 / 입구 재검사 |\n| 고정 놓기점 | 계획 오차 ±1 mm까지 허용 영역 안에 포함; 큰 물체나 범위 밖 점은 운반 전에 거부 |\n\n## 준비 자세와 접근 경로\n\n```mermaid\nflowchart TD\n    OBB[\"RGB-D OBB 8개 모서리\"] --> Cone[\"camera TF로 16면 visibility cone\"]\n    Cone --> Visible{\"준비 자세 CAD가 시야를 가리는가?\"}\n    Visible -->|예| Next[\"다른 IK / 후보\"]\n    Visible -->|아니오| Pre[\"pre-grasp / 필요 시 충돌 검사 재이동\"]\n    Pre --> Fresh[\"새 RGB-D로 동일 물체와 LIN 기준 확인\"]\n    Fresh --> Corridor[\"관절 seed / cubic corridor 생성\"]\n    Corridor --> Validate[\"전체 FK / 충돌 / 제약 검사 후 실행\"]\n```\n\n| 검사 | Sorting 설정 / 제한 |\n|---|---|\n| 시야 | `require_pregrasp_visibility=true`, 일반 false; 관측 OBB 기반, padding 3 mm |\n| TF / 결과 | 동적 camera TF 0.5 s 이내; 누락된 validity 결과를 통과로 간주하지 않음 |\n| 재선택 후 이동 | LIN 방향 기준을 넘으면 새 pregrasp로 이동; target 접촉 불허 |\n| 재관측 | 동일 OBB 모서리 집합 5 mm 이내, LIN 방향 10°; 누락 / stale / 중복 일치 거부 |\n| 접근 모드 | `use_joint_corridor_grasp=true`, `use_seeded_cartesian_grasp=true`; 선택 grasp 관절값 보존 |\n| 경로 기하 | TCP 반경 1 mm 원통, 역접근 목표는 실제 접근 시작 관절값 |\n| IK / 곡선 | 기본 10 mm 간격 collision-aware IK → 단조 cubic; 전체 feedback / attachment 유지 |\n| 방향 검사 | 시작 / 끝 0.01 rad 이내, 중간은 끝 자세 SLERP의 5° 이내; 원통 이탈 / 역행 거부 |\n| 실행 전 표본 | 실제 JTC cubic을 기본 1 mm 및 관절별 0.005 rad 이하 간격 검사; 2,000점 초과 중단 |\n| JTC 전달 | position + velocity, acceleration 필드는 비움 |\n| 관절 한계 | `cartesian_joint_limits_file` 기본 MoveIt `joint_limits.yaml`; 미정 가속도는 `cartesian_joint_acceleration_rad_s2=1.0` rad/s²에 실행 scaling |\n| Cartesian retiming | 0.10 m/s, 0.50 rad/s, 0.20 m/s²에 scaling; `corridor_time_margin=2.0` |\n\nRetiming은 위치를 바꾸지 않고 시간을 균일하게 늘리며 속도·가속도를 함께 낮춥니다. 표본 검사는 연속 시간 충돌이나 하드웨어 안전 인증을 대신하지 않습니다. Seeded 모드를 끄고 joint corridor만 켜면 OMPL+FK 검사를 쓰며, 일반 데모는 opt-in이고 수직 lift는 endpoint 검사 후 Pilz LIN입니다.\n\n`align_grasp_wrist_roll=true`는 URDF의 roll 축과 TCP offset이 local −Y라는 가정 아래 후보의 closing 방향을 맞춥니다. 관절 범위 안 동치각만 검사하며 비대칭 jaw의 180° 반전은 허용하지 않습니다. 후보만 회전시킨 뒤 전체 충돌과 FK 허용값을 다시 검사합니다. 일반 selector 기본은 false이며 모델-parity 검사가 이 기구학 가정을 확인합니다.\n\n## Head 재관측 fallback\n\n```mermaid\nflowchart LR\n    Missing[\"lift 뒤 head 재검출 실패\"] --> Propose[\"실제 TCP + OBB / 영상 ray 3개로 후보 생성\"]\n    Propose --> Check[\"화면 포함 / 높이 / 충돌 검사\"]\n    Check --> Move[\"최대 한 번 재관측 이동\"]\n    Move --> Observe[\"새 관측 / 접촉 / 상대 상승량 재검사\"]\n    Observe --> Match{\"중심 연관 통과?\"}\n    Match -->|예| Carry[\"운반\"]\n    Match -->|아니오| Fail[\"중단\"]\n```\n\n| 설정 / 조건 | 기준 |\n|---|---|\n| 활성 | `sorting_reobserve_after_lift=true`; 기본 관측 경로에서 대상이 없을 때도 적용 |\n| 화면 포함 | 관측 OBB bounding sphere 전체; `sorting_reobserve_margin_px=24`, `sorting_reobserve_geometry_padding_m=0.01 m` |\n| 이동 | `sorting_reobserve_max_translation_m=0.20 m` |\n| 낮추기 | `sorting_reobserve_max_lowering_m=0.10 m`, 높이 최대 3단계; 필수 상대 상승량 + `sorting_reobserve_height_clearance_m=0.02 m` 아래 금지 |\n| 실행 | attached geometry 유지, collision-aware IK와 MoveIt 계획; 전후 contact 확인 |\n| 결과 | 재검출 / 복원 / 높이 실패는 중단; 중심 연관 `sorting_held_association_tolerance_m=0.03 m` 이내 |\n| 파지 중 joint-goal | `sorting_payload_velocity_scaling=0.24`, `sorting_payload_acceleration_scaling=0.20`; 더 낮은 기존 상한 우선 |\n| Node 단독 기본 | 위 scaling 둘 다 0.01; 열린 그리퍼 복귀는 원래 값, Cartesian retiming은 별도 |\n\nMuJoCo GT나 자동 물체 부착을 사용하지 않는 센서 기반 동작입니다. 재관측과 지속 파지 성공은 별도 실행 검증이 필요합니다.\n"},"ros2_ws/src/cleany_skill_executor/docs/study-cafe-sorting-usage.md":{"title":"스터디카페 실행과 진단","body":"# 스터디카페 실행과 진단\n\n[파지 후보와 다른 조작 경로](manipulation.md) / [설정](study-cafe-sorting-configuration.md) / [실행 계약](study-cafe-sorting-contract.md)\n\n## 센서 전용 study-cafe 검증\n\n| 목적 | 저장소 루트 명령 | 실제 실행 범위 |\n|---|---|---|\n| 인식과 후보 계획 | `ros2 launch cleany_skill_executor study_cafe_nearest_grasp_demo.launch.py` | RGB-D, YOLOE/Gemini, AnyGrasp, MoveIt plan-only |\n| 연속 수거 | `ros2 launch cleany_skill_executor study_cafe_sorting.launch.py` | MuJoCo 팔 이동과 물체 접촉, 운반과 놓기 |\n| 단일 물체 Action | [BT 실행](../../cleany_manipulation_bt/README.md) | 별도 BT Action 경로 |\n\n1. `make build` 후 [공통 환경](../../../../docs/implementation/running.md#공통-준비)을 적용하고 `GEMINI_API_KEY`, 로컬 YOLOE/AnyGrasp 모델을 준비합니다. [인식 모델 설정](../../cleany_perception/docs/runtime.md#모델-준비)을 따릅니다.\n2. 같은 domain의 다른 simulator/controller를 종료합니다. Vendor 카메라 renderer는 headless에서도 유효한 `DISPLAY`가 필요합니다.\n3. 위 표에서 하나를 선택합니다. Target 위치는 카메라에서 얻으며 시뮬레이터 정답을 planner 입력으로 사용하지 않습니다.\n\n## 시뮬레이션 분리 수거 (통합 검증 진행 중)\n\n처음에는 GUI를 유지해 결과를 확인할 수 있습니다.\n\n```bash\nros2 launch cleany_skill_executor study_cafe_sorting.launch.py headless:=false use_rviz:=true use_image_view:=true shutdown_on_sorting_exit:=false\n```\n\n기본 실행은 headless이며 RViz/image_view를 시작하지 않습니다. 완료/실패 뒤 기본적으로 launch도 종료합니다. `shutdown_on_sorting_exit:=false`는 GUI 유지 옵션이며 수거를 자동 재시도하지 않습니다.\n\n| 화면 / 출력 | 확인할 내용 | 성공으로 오해하지 않을 것 |\n|---|---|---|\n| MuJoCo GUI | 물체가 실제로 들어갔는지, 팔 복귀 | 기본 관찰 모드는 자동 안착 검증을 하지 않음 |\n| `/sorting/status` | 단계, label, category, destination, 완료 항목; 실패 시 `error` | 수락/계획 로그는 최종 결과가 아님 |\n| `mission_complete_unverified` | 관찰 모드 종료 | `placement_verified=false` |\n| `mission_complete` | verifier 사용 시 안착 확인 후 종료 | 시뮬레이션 결과이며 실물 수거 성공 아님 |\n| `First ranked grasp/pregrasp` | 첫 IK 후보 오차 | 최종 선택은 Action result의 joint state |\n\n별도 터미널에서 같은 domain과 overlay로 관찰합니다.\n\n```bash\nros2 topic echo /sorting/status --qos-durability transient_local\n```\n\n빈 작업영역은 연속 두 번 확인합니다. `sorting_require_category_coverage=true`일 때만 설정된 모든 category 완료도 요구합니다. `review` 및 위험/저신뢰 물체는 미해결로 남기며 집지 않습니다. 분류 대상은 종이컵, 마우스, 휴지, 레고이고 위치/크기는 [장면 설정](../../cleany_mujoco_sim/docs/scenes.md)을 따릅니다.\n\n## 실행 옵션 고르기\n\n| 옵션 | 효과 |\n|---|---|\n| `sim_viewer:=efficient` 기본 | 센서 snapshot을 공유하는 최대 20 Hz GUI |\n| `sim_viewer:=native` | 전체 MuJoCo UI |\n| `scheduled_cameras:=true` | 통합 launch 기본; 손목 전환 수거에 필수 |\n| `sorting_verify_placement:=true` | release 이후 새 AABB로 안착을 검사하는 시뮬레이션 verifier 사용 |\n| `sorting_use_wrist_camera:=false` | head-only 비교 시험 |\n| `sorting_contact_diagnostics:=true` | 접촉 부위/힘 출력만 추가. Coordinator는 이 GT 토픽을 읽지 않음 |\n| `topdown_only:=true` | [수직 후보 비교](study-cafe-sorting-configuration.md#선택형-시뮬레이션-최적화와-원복) |\n\n`fastdds_profiles_file`은 child 시작 전에 `FASTRTPS_DEFAULT_PROFILES_FILE`로 전달됩니다. 기존 환경변수를 우선하며 기본은 UDP와 participant별 16 MiB SHM인 `fastdds_rgbd.xml`입니다. 빈 값은 middleware 기본 설정을 사용합니다. 별도 recorder/camera도 같은 DDS 환경을 사용합니다. 다른 RMW, QoS 및 freshness 기준은 바꾸지 않습니다.\n\n## 실패 위치 찾기\n\n| 멈춘 구간 | 먼저 확인할 것 |\n|---|---|\n| RGB-D 준비 | DISPLAY, 모델 경로, exact stamp와 TF, DDS 환경 |\n| 후보 선택 | 거리 유효성, 시야 cone, IK와 충돌 결과; 정답 pose 주입 금지 |\n| HANDOFF | 선택 팔 좌표계과 source/reference ID, 새 손목 RGB |\n| 닫기 / lift | 새 gripper feedback, 접촉 유지, attachment 이후 Depth receipt |\n| CHECK 미검출 | [미검출 보완 조건](study-cafe-sorting-contract.md#자동-sorting의-손목-미검출-보완); ERROR는 별도 실패 |\n| 운반 / 놓기 | 부착 형상, 고정 물체 중심과 wrist feedback; 실패 시 열지 않음 |\n\n재관측 이동, seeded corridor와 손목 제한은 [실행 계약](study-cafe-sorting-contract.md)에 모읍니다. 속도·깊이·대기 시간은 [설정](study-cafe-sorting-configuration.md)에서 변경합니다.\n\n## 저장 결과 읽기\n\n```mermaid\nflowchart LR\n    Run[\"실행 / 새 run-uuid\"] --> Perception[\"inspection / grasps / selection CDR\"]\n    Run --> Motion[\"motion_request / result / plan CDR\"]\n    Run --> Services[\"services-uuid / service 요청·응답과 완료 JSON\"]\n    Perception --> Review[\"오프라인 후보 / 경로 / 실패 비교\"]\n    Motion --> Review\n    Services --> Review\n```\n\n| Artifact 설정 / 파일 | 의미 |\n|---|---|\n| sorting_artifact_directory | 기본 빈 값은 저장 안 함; 지정하면 새 run-uuid |\n| inspection / grasps / selection | InspectScene.Result / PlanGrasp.Response / SelectReachableGrasp.Result |\n| motion_request / motion_result | MoveGroup.Goal / Result; 접근 / 후퇴 / lift의 계획 실패·실행 전 거부도 기록 |\n| Seeded 요청 | cleany_seeded_cartesian / monotone_cubic은 기록용 pipeline/planner ID; MoveGroup 서버에 보내지 않음 |\n| 결과 trajectory / planning_time | 실제 IK / 검증 계산, 실패 포함 |\n| motion_plan | FK 검증 통과 RobotTrajectory, corridor retiming 반영 |\n| Services trace | 별도 services-uuid에 MoveIt 요청 / 응답 CDR, 완료 시각 / 취소 JSON |\n| 사용 경계 | 출력 전용, 제어 입력 재사용이나 응답 / 계획 수정 없음 |\n| 성능 해석 | File I/O 포함 시간; 저장 OFF 성능이나 물리 파지 성공으로 해석 안 함 |\n\n`/sorting/verify_placement`는 독립 결과 검증 port입니다. 정답 AABB는 인식·분류·파지·경로 계산에 쓰지 않으며 실물에는 별도 센서 기반 verifier가 필요합니다.\n"},"ros2_ws/src/cleany_system_supervisor/docs/interfaces.md":{"title":"cleany_system_supervisor 노드 인터페이스","body":"# cleany_system_supervisor 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다. 동작 계약은 [System Supervisor](supervision.md)를 따릅니다.\n\n## system_supervisor\n\n실행 파일: `system_supervisor`. 원본: [노드.py](../cleany_system_supervisor/node.py), [ros_transport.py](../cleany_system_supervisor/ros_transport.py). 설정: [system_supervisor.yaml](../config/system_supervisor.yaml)의 `ros`.\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `system/state` | `cleany_interfaces/msg/SystemState` | R/T1; 20 Hz; epoch, revision, 운영 상태, 전체 MissionPermission |\n| 토픽 발행 | `system/capabilities` | `cleany_interfaces/msg/SystemCapabilities` | R/T1; 20 Hz |\n| 토픽 발행 | `system/faults` | `cleany_interfaces/msg/SystemFaults` | R/T1; 20 Hz; 활성과 retention 중인 해제 Fault |\n| 토픽 발행 | `system/recoveries` | `cleany_interfaces/msg/SystemRecoveries` | R/T1; 20 Hz |\n| 토픽 발행 | `system/heartbeat` | `cleany_interfaces/msg/SystemHeartbeat` | R1; 20 Hz |\n| 토픽 발행 | `system/events` | `cleany_interfaces/msg/SystemEvent` | R100; 이벤트 발생 시 |\n| 토픽 발행 | `diagnostics` | `diagnostic_msgs/msg/DiagnosticArray` | R10; `diagnostics_period_s` 1초; `system_supervisor: ...` status |\n| 토픽 구독 | `diagnostics` | `diagnostic_msgs/msg/DiagnosticArray` | R10; `base_driver` status만 사용; `diagnostics_topic` |\n| 토픽 구독 | `scan` | `sensor_msgs/msg/LaserScan` | Sensor; `scan_topic` |\n| 토픽 구독 | `amcl_pose` | `geometry_msgs/msg/PoseWithCovarianceStamped` | Sensor; `pose_topic` |\n| 토픽 구독 | `camera/head/color/image_raw` | `sensor_msgs/msg/Image` | Sensor; `camera_topic` |\n| 토픽 구독 | `system/component_health` | `cleany_interfaces/msg/ComponentHealth` | R10; `component_sources`의 source만 수락 |\n| 토픽 구독 | `safety/status` | `cleany_interfaces/msg/SafetyStatus` | R10; `safety_topic` |\n| 서비스 호출 | `\u003cnav2 node>/get_state` | `lifecycle_msgs/srv/GetState` | Service 기본값; `lifecycle_poll_s` 0.5초; `navigation_nodes`, `localization_nodes` |\n| 서비스 제공 | `system/check_permission` | `cleany_interfaces/srv/CheckPermission` | Service 기본값 |\n| 서비스 제공 | `system/request_fault_reset` | `cleany_interfaces/srv/RequestFaultReset` | Service 기본값; `operator_id` 필수 |\n| 액션 제공 | `system/request_recovery` | `cleany_interfaces/action/RequestRecovery` | Action 기본값 |\n| 액션 호출 | `mission/stop` | `cleany_interfaces/action/StopMission` | Action 기본값; `stop_action`; 서버는 `mission_runtime` |\n| 액션 호출 | `\u003csource>/recover` | `cleany_interfaces/action/RecoverComponent` | Action 기본값; `recovery_policies.*.action` |\n\nGraph 조회로 `trusted_publishers`의 topic publisher를 1초마다 검사합니다. 상태 snapshot의 retained 값은 허가가 아니며, client는 heartbeat freshness, epoch와 lease 만료를 별도로 검사합니다.\n\n기동 복구를 사용하는 프로필은 `base_driver` diagnostics의 `disarmed`도 확인합니다.\n키 누락, stale 측정 시각와 stale 피드백은 `base_disarmed` 정상 증거가 아닙니다.\n연결 단절 원인은 영속 Fault의 `cause`에 보존하고 복구 결과는 기존 `system/events`의\n`BASE_STARTUP_RECONCILED`로 발행합니다. 기존 ROS 메시지와 서비스 형식은 유지합니다.\n\n## supervisor_operator\n\n실행 파일: `supervisor_operator`. 원본: [operator_cli.py](../cleany_system_supervisor/operator_cli.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `system/heartbeat` | `cleany_interfaces/msg/SystemHeartbeat` | R1 |\n| 토픽 구독 | `system/faults` | `cleany_interfaces/msg/SystemFaults` | R/T1 |\n| 서비스 호출 | `system/request_fault_reset` | `cleany_interfaces/srv/RequestFaultReset` | Service 기본값; reset 인자가 있을 때만 |\n\n인자 없이 실행하면 활성 Fault를 나열하고, `\u003cFAULT_CODE> --operator \u003cname>`은 reset을 요청합니다. 하드웨어를 해제하지 않습니다.\n\n`tof_required=true`이면 `tof_proximity`를 component source와 `BASE_MOTION` 필수 근거에\n추가하고 `/proximity_guard`의 health 발행을 허용합니다. source가 오래되거나 가용하지 않으면\n기존 lease 회수와 Mission stop 경로를 사용합니다. 일반 장애물 정지는 health 불가용으로\n보고하지 않습니다. ToF가 실제로 없는 구성에는 이 옵션을 적용하지 않습니다.\n"},"ros2_ws/src/cleany_system_supervisor/docs/supervision.md":{"title":"System Supervisor 계약","body":"# System Supervisor 계약\n\n\n[감독 stack 실행](../../../../docs/implementation/how-to/mission.md#system-supervisor-감독-stack) · [인터페이스](interfaces.md)\n\nSystem Supervisor는 시스템 가용성, Fault, Capability, 운영 상태, Mission 실행 허가와 복구 조정을 소유합니다. 실제 안전 정지 장치가 아니며 Mission 실행, 정지 확인, 재개, journal과 Nav2 BT Recovery를 대신하지 않습니다. 책임 원칙은 KB의 [System Supervisor](\u003c../../../../docs/cleany-docs/20_TECHNICAL/14 - System Supervisor.md>)를 따릅니다. Endpoint 표는 [인터페이스](interfaces.md), 설정 원본은 [system_supervisor.yaml](../config/system_supervisor.yaml)입니다.\n\n## 책임 경계\n\n```mermaid\nflowchart TB\n    Safety[\"Independent safety layer\u003cbr/>(하드웨어, 미구현)\"] -->|\"Bool 증거\"| Adapter[\"safety_adapter\u003cbr/>/safety/status\"]\n    Adapter --> Sup[\"System Supervisor\u003cbr/>Fault / Capability / 허가 / 복구 조정\"]\n    Owners[\"Base driver / Nav2 lifecycle / LiDAR / pose / camera\u003cbr/>arm_health_monitor / perception_inspector\"] -->|\"health\"| Sup\n    Sup -->|\"lease, 철회, StopMission\"| Runtime[\"Mission Runtime\u003cbr/>실행 / 정지 확인 / journal / 재개\"]\n    Runtime -->|\"취소\"| Ops[\"Nav2 / 조작\"]\n    Sup -->|\"RecoverComponent\"| Recovery[\"nav2_lifecycle_recovery\u003cbr/>→ Nav2 lifecycle manager\"]\n    Logger[\"cleany_logger / Monitor\"] -.->|\"관측, 기록\"| Sup\n```\n\n| 판단 | 소유자 |\n|---|---|\n| 시스템 Fault, Capability, 운영 상태, 실행 허가 | Supervisor |\n| 미션 수락, 실행, 취소, 자기 동작의 정지 완료, 재개, journal | Mission Runtime |\n| 현재 팔 상태로 주행해도 되는지(`safe_to_drive`) | Mission Runtime (조작 결과 기반) |\n| 실제 정지와 하드웨어 보호 | 독립 안전 계층 |\n| 정지 증거와 E-stop 해제 증거 보고 | `cleany_safety_adapter` |\n| 실제 복구 | 각 컴포넌트 owner (현재는 Nav2 lifecycle manager만) |\n| 영구 기록 | `cleany_logger`; Supervisor는 구조화 이벤트만 발행 |\n\nRuntime의 실행 오류(정지 기한 초과, adapter 예외, INTERRUPTED)는 Runtime ERROR와 `mission/reset_error`가 처리합니다. 시스템 Fault는 Supervisor와 `system/request_fault_reset`가 처리합니다. 허가 상실로 끝난 미션은 정지가 확인되면 Runtime ERROR로 가지 않습니다.\n\n## 운영 상태\n\n| 상태 | 조건 |\n|---|---|\n| INITIALIZING | boot grace 중 필수 기능 또는 안전 증거가 아직 검증되지 않음 |\n| OPERATIONAL | 모든 Capability와 필수 안전 증거가 fresh, stable이고 운영 잠금 Fault 없음 |\n| DEGRADED | 필수 기능과 안전은 검증됐지만 일부 비필수 Capability 제한 |\n| FAULT_LOCKED | 운영 잠금 Fault, 필수 기능 불가, 또는 grace 이후 필수 정보 미확인 |\n\nSeverity만으로 상태를 정하지 않습니다. 필수 Capability는 `BASE_MOTION`입니다. 초기와 stale 상태는 UNKNOWN입니다. Capability 차단은 Fault debounce 없이 즉시 적용하고, 정상 복귀에는 `clear_s` 동안 연속 정상 보고가 필요합니다.\n\n### 부팅 유예와 hysteresis\n\n| 상황 | 처리 |\n|---|---|\n| 한 번도 AVAILABLE을 보고하지 않은 source의 UNKNOWN | `startup_grace_s`(source별 override, base 15초) 동안 Fault 아님. Capability는 UNKNOWN이라 허가 거부 |\n| 명시적 이상 보고 | grace와 무관하게 `raise_s` 뒤 Fault |\n| 확인된 뒤 상실 | grace와 무관하게 `raise_s` 뒤 Fault |\n| Base 첫 MCU 피드백 전 | `feedback_received=False`를 UNKNOWN으로 처리 |\n| Base 짧은 피드백 공백 | `raise_s` 0.3초 미만이면 BASE_MOTION만 즉시 차단, latch 없음 |\n| STOP 요청, `cmd_vel timeout` | base driver `fault`가 비어 있으므로 장애 아님 |\n\nGrace 값과 hysteresis는 미측정 초기값입니다.\n\n## Capability와 Fault\n\n| Capability | 직접 증거 | 의존성 |\n|---|---|---|\n| BASE_MOTION | base diagnostics | 없음 |\n| NAVIGATION | 유효 scan, covariance 제한 내 pose와 localization lifecycle, Nav2 lifecycle(`planner_server`, `controller_server`, `bt_navigator`, `collision_monitor`) | BASE_MOTION |\n\n| MANIPULATION | `arm_health_monitor` | 없음 |\n| VISUAL_PERCEPTION | 유효 image, `perception_inspector` readiness | 없음 |\n| MOBILE_MANIPULATION | 없음 | NAVIGATION, MANIPULATION, VISUAL_PERCEPTION |\n\nPose 공분산의 대각 성분은 상한을 유지하며, AMCL 부동소수점 연산의 음수 잔차는 `-1e-9`까지 0으로 취급합니다. 그보다 작은 음수, non-finite 값과 상한 초과는 여전히 거부합니다.\n\n| Phone LiDAR 위치 조건 | 허가 / 복구 |\n|---|---|\n| NAVIGATION | localization_alignment 추가 요구 |\n| Unknown / unavailable | 작은 공분산이어도 불허 |\n| Degraded | 검증 위치의 제한된 재정합 대기; AVAILABLE health + 속도 제한으로 기존 허가 유지 |\n| 자동 위치 복구 | 이 프로필에서 정지 뒤 요청 |\n| 정지 근거 | Base driver fresh base_disarmed + 미확인 lease의 StopMission 완료 |\n| 한계 | 물리 E-stop이나 팔 포함 전신 정지 증거 아님 |\n\nKB 초기 분류는 BASE_MOTION에 \"이동을 허용할 팔 상태\"를 포함합니다. 현재 구현은 이 판단을 Runtime의 `safe_to_drive`에 두고 Capability에서는 팔 가용성만 다룹니다. 이 배치는 KB 검토가 필요합니다.\n\n| Fault | 기본 처리 |\n|---|---|\n| BASE_UNAVAILABLE | base fault, 지속 피드백 상실, grace 후 미연결. CRITICAL, latched, 전체 잠금 |\n| LIDAR_UNAVAILABLE, CAMERA_UNAVAILABLE | 입력 중단 또는 무효. 해당 Capability 제한, 복구 unsupported |\n| LOCALIZATION_UNAVAILABLE, NAVIGATION_UNAVAILABLE | pose 또는 lifecycle 이상. NAVIGATION 제한, lifecycle 복구 가능 |\n| PERCEPTION_UNAVAILABLE, ARM_UNAVAILABLE | owner 보고 불가 또는 미확인. 해당 Capability 제한, 복구 unsupported |\n| SAFETY_UNVERIFIED, ESTOP | 보호 계층 또는 E-stop 해제 증거 없음. CRITICAL, latched, 전체 잠금 |\n| UNTRUSTED_PUBLISHER | 안전 또는 health topic에 allowlist 밖 publisher. CRITICAL, latched, 전체 잠금 |\n| MISSION_STOP_FAILED:\u003clease_id> | 정지 실패 또는 기한 초과. 확인된 stop 결과 전까지 잠금 |\n| SUPERVISOR_STATE_UNVERIFIED | 영속 상태 파일 읽기 또는 쓰기 실패. operator 확인 전까지 잠금 |\n\n일반 Latched Fault reset에는 원인 source의 fresh, stable 정상 보고와 `operator_id`가 모두 필요합니다. E-stop reset은 하드웨어를 해제하지 않습니다.\n\n## 허가와 정지\n\nMission Runtime과의 순서와 사유 코드는 [Mission 계약](../../cleany_interfaces/docs/mission.md#system-supervisor-감독)을 따릅니다.\n\n| 항목 | 계약 |\n|---|---|\n| Lease | 미션당 하나, `supervision_capabilities` 집합. TTL 1.5초, epoch와 version 일치, 갱신은 같은 집합만 |\n| 철회 | Capability 상실, 운영 잠금, TTL 만료. 철회 즉시 `mission/stop` 요청 |\n| 정지 확인 | Runtime이 자기 동작의 정지와 terminal 결과를 확인해야 stopped=true. Action 수락은 증거 아님 |\n| 정지 기한 | `stop_timeout_s` 6초. Runtime 응답 기한(`cancel_timeout` 5초 + 0.5초)보다 길어야 정상 정지가 잠금으로 확대되지 않음 |\n| 정지 서버 미발견 | 기한 안에서 재시도. 기한 초과 시 MISSION_STOP_FAILED |\n| 늦은 확인 | 기한 뒤라도 stopped 결과가 오면 해당 Fault 해제 |\n| Supervisor 종료 | 갱신이 끊겨 Runtime이 heartbeat timeout(1초)과 TTL로 스스로 정지 |\n\n## 재시작과 영속 상태\n\n`persistence.state_file`(기본 `~/.ros/cleany/system_supervisor_state.json`)에 활성 latched Fault와 정지 미확인 lease를 원자적으로 기록합니다.\n\n| 재시작 시 | 처리 |\n|---|---|\n| Latched Fault | restored로 다시 활성. 현재 health가 정상이어도 operator reset 전 잠금 |\n| 정지 미확인 lease | granted=false로 복원하고 `mission/stop`으로 재확인. 확인 전에는 같은 mission의 새 허가와 복구 dispatch 차단 |\n| 파일 손상, format 불일치 | SUPERVISOR_STATE_UNVERIFIED |\n| 빈 `state_file` | 영속화 해제. 테스트 전용 |\n\n```mermaid\nflowchart TD\n    Boot[\"재기동 / 복원된 base Fault\"] --> Cause{\"cause=base_feedback_lost?\"}\n    Cause -->|아니오| Operator[\"기존 operator reset\"]\n    Cause -->|예| Fresh[\"base / 모든 safety_sources / base_disarmed fresh + stable\"]\n    Fresh --> Gate{\"다른 잠금 / 정지 미확인 lease / 복구 작업 없음?\"}\n    Gate -->|예| Clear[\"통신 Fault 해제 / 자동 목표 재개 없음\"]\n    Gate -->|아니오| Hold[\"잠금 유지\"]\n```\n\n| 재기동 통신 복구 | 설정 / 제한 |\n|---|---|\n| 활성 | Phone LiDAR startup_base_reconnect.enabled=true, stable_s=1.0; 일반 기본 OFF |\n| 자동 해제 제외 | 원인 없는 이전 Fault, motor / protocol 고장, 현재 프로세스에서 생긴 Fault |\n| base_disarmed | 검증된 휠 feedback; 독립 전신 안전 / STOP ACK 아님 |\n| 해제 뒤 | 새 구동 허가 발급이나 기존 목표 재개 없음 |\n\n## 정리와 이벤트\n\n`retention_s`(300초)가 지난 정지 확인 lease, terminal recovery job, 해제 Fault를 정리합니다. Job은 해당 Fault episode가 끝난 뒤에만 정리하므로 재시도 예산은 사라지지 않습니다.\n\n`system/events`는 상태 차이에서 이벤트를 만들기 때문에 어떤 전이도 기록을 건너뛰지 않습니다. 영구 저장은 `cleany_logger`의 기록 대상에 추가해 처리하며, Supervisor는 파일을 쓰지 않습니다. Node log에는 debug level로만 남깁니다.\n\n| kind | 의미 |\n|---|---|\n| STATE_CHANGED | 운영 상태 전이 |\n| FAULT_RAISED, FAULT_CLEARED, FAULT_RESTORED | Fault 발생, 해제, 재시작 후 복원 |\n| FAULT_RESET_ACCEPTED, FAULT_RESET_REJECTED | reset 요청. `source`는 operator_id |\n| BASE_STARTUP_RECONCILED | 시연 프로필의 기동 후 통신 복구 및 base 정지 확인으로 이전 연결 Fault 해제 |\n| LEASE_GRANTED, LEASE_REVOKED, LEASE_RELEASED, LEASE_RESTORED | 허가 수명 |\n| MISSION_STOP_ACCEPTED, MISSION_STOPPED | 정지 요청 수락과 정지 확인 |\n| RECOVERY_REQUESTED, RECOVERY_\u003cstate>, RECOVERY_UNSUPPORTED | 복구 시도와 결과 |\n| STATE_RESTORE_FAILED, STATE_PERSIST_FAILED | 영속 상태 오류 |\n\n## 운영자 절차\n\n1. `ros2 run cleany_system_supervisor supervisor_operator`로 활성 Fault를, `system/events`로 이력을 확인합니다.\n2. 물리 원인을 해소합니다. CLI와 서비스는 하드웨어를 해제하지 않습니다.\n3. `supervisor_operator \u003cFAULT_CODE> --operator \u003cname>`으로 reset을 요청합니다. 거부 사유는 응답과 이벤트에 남습니다.\n4. `MISSION_STOP_FAILED:\u003clease>` reset은 정지 Action을 다시 조회할 뿐이며 새 stopped 결과가 와야 해제됩니다.\n5. Runtime ERROR가 남아 있으면 `mission/reset_error`로 따로 해제합니다.\n\n## 발신자 신뢰\n\n| 발신자 검사 | 보장 / 한계 |\n|---|---|\n| Graph allowlist | trusted_publishers topic에 허용 밖 노드가 publish하면 잠금 |\n| 검출 가능 | 잘못된 실행, 이름 충돌 |\n| 검출 불가 | 같은 노드명 위조, 허용 노드의 ComponentHealth.source 사칭 |\n| 이유 | Humble rclpy에 메시지별 발신자 없음; source와 노드가 결합되지 않음 |\n| 실제 접근 통제 | SROS2 enforce enclave별 safety/status·system/component_health 발행, system/request_fault_reset·mission/stop 호출 허용 |\n| 검증 상태 | 이 저장소에서 SROS2 통제 미검증 |\n\n## 복구 정책\n\n| source | owner | 상태 |\n|---|---|---|\n| navigation | `navigation/recover` → `lifecycle_manager_navigation` | 구현, 자동 off |\n| localization | `localization/recover` → `lifecycle_manager_localization` | 구현, 자동 off |\n\n| lidar, camera, perception, arm, base | 없음 | `UNSUPPORTED`, 예산 소모 없음 |\n\n휴대폰 시연의 `localization/recover` owner는 `localization_guard`이며 위 일반\nlifecycle 복구 owner와 동시에 실행하지 않습니다. 정지 상태에서 제한된 scan/map\n후보를 검증해 initialpose를 갱신하며, 자동 목표 재개나 이동 명령은 발행하지 않습니다.\n이 프로필은 `localization_alignment` Fault 하나에 복구 예산을 연결합니다. 기본\n`localization` 감시도 계속 주행을 차단하지만 별도 복구 작업을 만들지 않습니다.\n따라서 공분산과 정합 이상이 동시에 발생해도 중복 예산으로 재시도하지 않습니다.\n\n| 일반 lifecycle 복구 | 기준 |\n|---|---|\n| 기본 | OFF; 실제 Nav2 reset 미검증 |\n| 예산 | max_attempts 2, attempt 15 s, total 40 s, verify 5 s, cancel 2 s |\n| 동시성 | 겹쳐 실행 안 함; 같은 Fault episode 중복은 같은 job 반환 |\n| 시작 | Safety adapter whole-robot stopped + 미확인 Mission 정지 없음 |\n| 성공 | Owner 응답 뒤 fresh health와 안정화까지 확인 |\n\n## 검증 범위\n\n소프트웨어 검증 명령과 범위는 [테스트 가이드](../../../../docs/implementation/testing.md)를 따릅니다. 다음 항목은 하드웨어나 실제 stack에서 별도 검증이 필요합니다.\n\n- E-stop 회로와 독립 보호 계층 상태를 내보내는 하드웨어. 현재 신호가 없어 기본 실행은 잠깁니다.\n- ESP32 통신 차단 시 MCU watchdog의 모터 정지 시간과 실제 감속 거리.\n- 실제 Nav2 stack의 lifecycle RESET/STARTUP 복구, Jetson 다중 프로세스 지연, base grace 15초의 적정성.\n- 실물 arm controller 가용성 보고와 SROS2 enforce 모드.\n- Mission이나 하위 제어기 crash 뒤의 물리 안전. Lease는 이 Runtime만 제한하며 임의의 `cmd_vel` publisher나 sorting coordinator 같은 별도 실행기를 막지 않습니다.\n"},"ros2_ws/src/cleany_telemetry/docs/interfaces.md":{"title":"cleany_telemetry 노드 인터페이스","body":"# cleany_telemetry 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## 책임 경계\n\n`cleany_telemetry`는 로봇 관측을 읽기 전용으로 제공합니다. 위치와 카메라는 Backend와\n무관하게 실행하며, 센서 장치를 열거나 조종 명령, 인식과 추론, 원본 녹화를 수행하지\n않습니다. Backend 계약과 인증, 재접속은\n[pose_backend_bridge](../../cleany_control_bridge/docs/interfaces.md#pose_backend_bridge)가\n소유합니다. dev_monitor와 다른 ROS 소비자는 같은 관측 토픽을 사용할 수 있습니다.\n카메라 미리보기는 dev_monitor와 Dashboard가 공유하지만 인식과 Logger는 원본 ROS\n토픽을 계속 사용합니다.\n\n## pose_observer\n\n실행 파일: `pose_observer`. 원본: [pose_node.py](../cleany_telemetry/pose_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | 조건 |\n|---|---|---|---|\n| 토픽 구독 | `/odom` | `nav_msgs/msg/Odometry` | `source=odom`; `odom_topic` |\n| TF 구독 | `/tf`, `/tf_static` | `tf2_msgs/msg/TFMessage` | `source=tf`; tf2 기본 QoS |\n| 토픽 발행 | `/telemetry/pose` | `geometry_msgs/msg/PoseStamped` | `pose_topic`; sensor data, best effort, volatile |\n\n| 파라미터 | 기본값 | 의미 |\n|---|---|---|\n| `source` | `odom` | `odom` 입력 또는 `tf` 조회 |\n| `target_frame`, `base_frame` | `map`, `base_link` | TF 조회 좌표계 |\n| `rate` | `5.0` | TF 조회 주기(Hz); odom 모드는 수신 시 처리 |\n| `input_timeout` | `1.5` | 원본 ROS 시각 기준 최대 입력 나이(초) |\n| `future_tolerance` | `0.1` | 허용하는 미래 원본 시각 오차(초) |\n\n위치(m), 정규화된 quaternion, 원본 `header.frame_id`와 `header.stamp`를 제공합니다.\n유한하지 않은 위치·회전, 길이가 0인 quaternion, 비어 있는 좌표계와 0인 시각은\n발행하지 않습니다. 동일하거나 역순인 표본은 재발행하지 않으며 ROS 시계 자체가\n되돌아가면 새 시각부터 다시 관측합니다. 시뮬레이션에서는 생산자와 소비자 모두\n`use_sim_time=true`를 사용해야 합니다.\n\nTF 모드는 원본 변환의 시각을 보존하며 위치 추정을 요청하거나 TF를 발행하지 않습니다.\nTF가 없거나 오래되면 출력이 멈춥니다. odom을 map으로 이름만 바꾸거나 마지막 위치를\n현재 시각으로 갱신하지 않습니다. 소비자는 별도로 수신 중단을 감지해야 합니다.\n\n기존 `telemetry_node`는 `pose_observer`와 `cleany_control_bridge/pose_backend_bridge`의\n두 프로세스로 대체했습니다. 기존 `odom_topic`은 관측 노드로, `url`과 전송 설정은\nbridge로 이동합니다. Backend가 필요 없는 관측에는 bridge를 실행하지 않습니다.\n\n## camera_preview\n\n실행 파일: `camera_preview`. 원본: [camera_node.py](../cleany_telemetry/camera_node.py).\n\n| 종류 / 방향 | 이름 | ROS 타입 | QoS와 수명 |\n|---|---|---|---|\n| 토픽 구독 | HTTP에서 요청한 영상 토픽 | `sensor_msgs/msg/Image`, `sensor_msgs/msg/CompressedImage` | Sensor data, best effort, volatile; 조회 lease 만료 시 해제 |\n\nROS 발행, 서비스와 action은 없습니다. 위치 관측과 별도 프로세스로 실행하고\n관측 대상 ROS graph에서 발견한 영상 토픽만 구독합니다. 구독할 토픽은 읽기 요청으로\n선택하며 카메라 드라이버를 시작하지 않습니다. 발행 토픽이 사라지거나 타입이 바뀌면\n해당 캐시와 lease를 지웁니다.\n\n| 파라미터 | 기본값 | 의미 |\n|---|---|---|\n| `host`, `port` | `127.0.0.1`, `8769` | HTTP 주소; loopback만 허용 |\n| `camera_max_streams` | `2` | 전체 소비자가 공유하는 동시 토픽 한도, 1~4 |\n| `camera_fps` | `5.0` | 원시 영상의 최대 인코딩 빈도, 1~10 Hz |\n| `lease_seconds` | `3.0` | 마지막 조회 이후 구독 유지 시간 |\n| `stale_seconds` | `2.0` | 최신 프레임 제공 기한; lease보다 작아야 함 |\n| `discovery_seconds` | `0.5` | ROS graph와 구독 갱신 주기 |\n\n### HTTP 계약\n\n| GET 경로 | 응답 |\n|---|---|\n| `/api/cameras` | `topics` 객체: 영상 토픽명 → ROS 메시지 타입 |\n| `/api/camera?topic=/...` | 최신 프레임 JPEG 또는 아래 상태 |\n\n정상 응답은 `image/jpeg`, `Cache-Control: no-store`, `X-Frame-Age`(수신 후 경과 초),\n`X-Camera-Topic`(실제 구독 토픽), `X-Image-Width`, `X-Image-Height`, `X-ROS-Stamp`(원본 메시지 시각)를 포함합니다.\n202는 최초 영상 대기 또는 오래된 영상, 400은 알 수 없거나 미리보기를 지원하지 않는 영상 토픽, 422는 변환 오류,\n429는 동시 토픽 한도 초과입니다. 과거 프레임을 연결 오류의 대체 영상으로 반환하지 않습니다.\n동일 토픽을 여러 화면이 조회해도 ROS 구독과 프레임 캐시는 하나입니다.\n\n입력은 16 MiB와 2 MP로 제한하며 RGB/BGR/RGBA/BGRA/mono8, JPEG와 PNG를 지원합니다.\n깊이 영상은 미리보기 대상이 아닙니다. 출력은 최대 1280×720 JPEG 품질 75이며,\n이 범위 내 2 MiB 이하 JPEG는 컨테이너 검사 후 재인코딩 없이 전달합니다.\n조회·프레임은 저장하지 않습니다. 로컬 HTTP 자체에는 사용자 인증이 없으므로\nDashboard 외부 접근은 Backend에서 사용자·시설 권한을 검사해야 합니다.\n\n헤드 RGB와 손목 원시 영상 요청은 대응하는 압축 미리보기 토픽이 발견되면 그 토픽을\n구독합니다. 알려진 metric-depth 토픽은 lease 생성 전에 거부합니다. 이미 인코딩된\nJPEG는 다시 인코딩하지 않고 최신 수신 프레임을 유지하며 `camera_fps`로 감속하지 않습니다.\n\n운영 카메라의 `allowed_topic` 값은 `/camera/head/color/image_redacted`다. 이 값이 설정되면 HTTP 목록과 영상 요청에는 지정한 토픽만 노출한다. ROS 개발용 다중 카메라 프리뷰는 이 매개변수를 비워 사용한다.\n"},"ros2_ws/src/cleany_teleop/README.md":{"title":"Cleany Teleop","body":"# Cleany Teleop\n\n폰 조종의 입력 유효시간, STOP과 ENABLE 확인 및 ROS 전송을 담당합니다.\n매핑 상태의 수신 지연, 권한 RPC 거절 사유와 조종 사건 기록은\n[인터페이스와 진단 규약](docs/interfaces.md)에서 확인합니다.\n\n공통 [실행 절차](../../../docs/implementation/running.md)를 따라 실행하고,\n저장소 루트에서 `make test-hardware-mapping-core`로 입력과 오류 처리 로직을 검증합니다.\nROS 인터페이스를 변경한 경우 `make build-hardware-mapping`과\n`make test-hardware-mapping`을 실행합니다.\n"},"ros2_ws/src/cleany_teleop/docs/interfaces.md":{"title":"휴대폰 조종과 자동 주행 인터페이스","body":"# 휴대폰 조종과 자동 주행 인터페이스\n\n`phone_remote`는 브라우저 입력을 base driver에 전달합니다. MCU 휠 명령은 발행하지 않으며 단일 브라우저가 입력 lease를 소유합니다.\n\n```mermaid\nflowchart LR\n    UI[\"브라우저 / token + 입력 lease\"] --> Server[\"phone_remote\"]\n    Server --> Driver[\"Base driver / 같은 base-config\"]\n    Driver --> MCU[\"MCU\"]\n    MCU -->|신선한 WheelState| Server\n    Server -->|상태 / 정지 확인| UI\n```\n\n## 수동 조종과 ROS 연결\n\n| 종류 | 기본 이름 | 타입 / 계약 |\n|---|---|---|\n| 발행 | `cmd_vel` | Twist, 50 Hz 상한; driver 축별 / 휠 상한 적용 |\n| 구독 | `base/wheel_state` | WheelState, SensorData QoS; 신선한 MCU 응답으로 상태 판정 |\n| 호출 | `base/set_enabled` | SetBaseEnabled; 순서 있는 허가 요청, 응답만으로 구동 완료 판정 금지 |\n| 제공 | `teleop/pause` | SetBool; true는 입력 차단 + STOP, false는 차단 해제만 |\n| 발행 | `teleop/status` | TeleopStatus, Reliable depth 10; ready / pause / 연결 / 정지 / boot |\n| 구독 | `mapping/status` | MappingStatus, Reliable / Transient Local depth 1 |\n| 호출 | `mapping/control` | MappingControl; 인증된 초기화 전달 |\n\n| 수동 입력 조건 | 동작 |\n|---|---|\n| 갱신 / 만료 | 70 ms / 250 ms |\n| Publisher 단일성 | `base/wheel_command`와 `cmd_vel` 각각 하나여야 허용 |\n| 설정 | `--base-config`는 실행 driver와 동일 |\n| 속도 해석 | UI 최대 휠 속도는 의도 상한, 실제 전송 목표는 MCU `target_rad_s` |\n\n```mermaid\nstateDiagram-v2\n    [*] --> 대기\n    대기 --> 조종: 새 눌림 / ENABLE / 새 입력\n    조종 --> 정지확인: 연결 단절\n    정지확인 --> 조종: 같은 눌림 유지 / 연결 복구 / STOP 확인 / 새 ENABLE과 입력\n    조종 --> 대기: 해제 / STOP / pointer cancel / 화면 이탈\n    정지확인 --> 대기: 해제 / STOP / pointer cancel / 화면 이탈\n```\n\n서버 재시작은 이전 lease를 복원하지 않고 눌림 없이 ENABLE하지 않습니다. `commission_wheels`는 protocol-v2 독립 시험 CLI이므로 base driver와 동시에 실행하지 않습니다.\n\n### 전후진과 회전만 허용하기\n\n| 항목 | 방법 / 의미 |\n|---|---|\n| 설정 파일 | `--token-file`과 같은 디렉터리의 `teleop-motion.json` |\n| 활성 | `{\"forward_only\": true}` 저장 후 조종 서버 재시작 |\n| 복원 | false 또는 파일 없음 + 재시작 |\n| 허용 | 전후 스틱, 회전 스틱과 a/d 키 |\n| 차단 | UI 횡이동 숨김, 서버도 횡이동 / 대각 명령 거부 |\n| 상태 | `GET /api/status`의 `forward_only` |\n\n키 이름은 forward_only지만 회전은 허용합니다. STOP·입력 만료·허가 검사는 유지하며 driver나 다른 controller는 변경하지 않습니다.\n\n## Jetson 게임패드 입력\n\n`gamepad_input`은 리시버의 XInput 보고서를 `/joy` (`sensor_msgs/Joy`, frame ID `leadjoy_xeno_plus`)에 발행합니다. 커널의 `MSC_TIMESTAMP` 표시가 있는 프레임을 사용합니다. 입력 시각은 evdev 이벤트 기준이며 장치 분리 또는 큐 손실 때는 빈 배열을 발행합니다. 축 0~5는 조종에 쓰는 LX, LY, LT, RX, RY, RT이고 축 6~9는 같은 보고서의 원본 LX, LY, RX, RY입니다. 버튼 순서는 A, B, X, Y, LB, RB, Back, Start, Guide, LS, RS입니다.\n\n입력 노드는 모든 USB 보고서에서 LS와 RS의 각 축을 검사합니다. 움직이던 축이 중립대(±0.05)에 진입하거나 부호가 바뀌면 그 축의 출력을 0으로 두고 바로 발행합니다. 스틱 전체가 중립으로 돌아오면 두 축의 반동을 함께 거릅니다. 반동 중 방향이 바뀔 때마다 안정 시간을 다시 셉니다. 새 방향이 60 ms간 이어지면 그 방향을 반영하고, 중립이 60 ms간 이어지면 다음 조작부터 바로 반영합니다. 보통 보고서는 20 ms 간격으로 발행하며 버튼 전환도 즉시 발행합니다. 주행과 헤드 노드는 최초 시작 때 원본 축에서 중립을 한 번 확인합니다. 입력이 끊겼다가 돌아오면 복구 뒤 새로 수신한 보고서로 조종합니다.\n\n`gamepad_teleop`은 중립을 확인한 뒤 왼쪽 스틱으로 병진 이동을, 오른쪽 스틱의 수평 축으로 회전을 요청합니다. 이동 의도가 사라지면 조종권을 즉시 해제합니다. LT(축 2)와 RT(축 5)는 왼쪽 스틱의 병진 속도를 선택합니다. 기준은 0~1 범위에서 0.5 이상이며 동시에 누르면 LT가 우선합니다. 기본 저속과 고속은 각각 0.1 m/s, 0.5 m/s입니다. 어댑터는 베이스 프로필의 휠 반지름과 축별 제한으로 이를 휠 속도로 환산합니다. 어댑터는 150 ms 이내의 실제 입력을 사용하며 이동 중에는 70 ms 간격으로 갱신을 요청합니다. 입력 처리는 중계 응답을 기다리지 않습니다. 조종권 확인 후 두 갱신까지 응답을 병행해서 기다리고, 만료된 갱신은 버린 뒤 최신 실제 입력을 보냅니다. 스틱 해제와 단절은 대기 중인 갱신을 건너뛰어 정지 요청을 보냅니다. 실제 입력 단절, 250 ms 동안의 조종권 갱신 실패 또는 주행 거부 시 정지합니다. 스틱을 기울인 채로 유지하면 새 보고서로 다시 조종권을 요청하고, 허가를 받은 뒤 현재 입력을 전달합니다. 휴대폰 서버에서 자동 주행 중이면 게임패드의 이동 요청을 거부하고 현재 목표를 유지합니다. Backend는 같은 사용자의 Unix 소켓에서 요청을 받아 수동 조종 허가를 확인하고 기존 서버에 전달합니다. `gamepad_press/update`는 같은 호스트의 단조 시각 만료를 확인합니다. `release`는 순번을 기록하고 해당 소유자의 조종만 해제합니다. 명령을 받을 수 없으면 기존 250 ms 입력 만료가 적용됩니다. [설치와 조종 방법](../../../../docs/implementation/how-to/gamepad.md)\n\n`gamepad_head`는 같은 `/joy`의 RY(인덱스 4)를 헤드 틸트 속도로 변환합니다. 팬은 조향하지 않습니다. RS 중립에서는 현재 각도를 유지합니다. 150 ms가 지난 입력은 만료됩니다. 새 RS 보고서가 도착하면 현재 스틱 위치로 조향을 재개합니다. 서보 ID 13과 14의 레지스터 범위를 `head_preview_joints.json`의 실측 범위와 대조합니다. 편향을 받은 축만 현재 위치에서 토크를 켭니다. 틸트 최고속도는 30°/s로 제한하며, 수직 축의 최대 편향에서 목표각과 서보에는 341 tick/s(약 29.97°/s)를 적용합니다. 실측 팬과 틸트 각도(rad)를 `/head/joint_states` (`sensor_msgs/JointState`)로 발행합니다. 종료 시 해당 축의 토크를 해제하고 기존 RAM 설정을 복원합니다.\n\n헤드는 best effort, depth 1로 최신 RS 보고서를 구독합니다. 운전 중 서보의 실측 위치가 범위를 벗어나거나 상태 레지스터가 0이 아니거나 온도가 50 °C 이상이면 조향 중지 사유와 측정값을 기록하고 소유한 토크를 해제합니다. 두 축에서 1초간 정상 판독이 이어진 뒤 새 RS 중립 입력을 받아야 다시 조향할 수 있습니다.\n\n## HTTP와 인증\n\n| HTTP | 계약 |\n|---|---|\n| `GET /`, `/assets/` | 설치 shadcn UI; asset 디렉터리 밖 파일 제공 안 함 |\n| `GET /api/status` | X-Control-Token 필수; 목표 / 측정 속도 / PWM / 진단 / 최근 정지 사유 |\n| `POST /api/control` | Token + 동일 Origin + ui_version=2 + client + 증가 sequence |\n| `GET /api/mapping/status` | Token 필수 |\n| `POST /api/reset` | Token + 동일 Origin + request_id; 202는 접수, running이 완료 |\n\nToken은 `#token=...`에서 읽고 저장하지 않습니다. STOP도 인증합니다. Stale 요청 409는 통신 단절과 구분하고, 초기화 응답 지연은 같은 request_id로 재시도합니다.\n\n| UI 갱신 | 동작 |\n|---|---|\n| `/` 요청 | 현재 index.html을 매번 읽어 새 해시 asset 반영 |\n| 파일 교체 중 entrypoint 없음 | 503 |\n| UI / asset 캐시 | no-store |\n| HTTP LAN | Secure-context 전용 API에 의존하지 않는 요청 ID로 목적지 선택 / 이동 지원 |\n\n## 진단 상태와 이벤트 기록\n\n| 상태 필드 | 해석 |\n|---|---|\n| Mapping `status_age_ms`, `connected` | 마지막 ROS heartbeat 기준; HTTP 연결 유지와 구분 |\n| `--mapping-status-timeout` | 기본 1 s 초과 시 phase=unavailable; 마지막 경로 / ID와 last_phase 보존 |\n| `permission` | 요청 단계, client, request_sequence, 응답 boot_id / command_sequence |\n| `last_permission_error` | 마지막 RPC 거절 / 예외의 code, reason, exception_type, traceback; 다음 요청 뒤에도 보존 |\n| MCU 대기 / boot 불일치 | `mcu_ack_pending` / `mcu_boot_mismatch` |\n| `event_log` | 경로, 저장 / 누락 수, 마지막 저장 오류 |\n| `event_sink_error` | 이벤트 전달 자체의 예외 |\n\n| JSONL 기록 | 계약 |\n|---|---|\n| 행 식별 | UTC, 단조 시각 at, run_id, 증가 event_id, PID와 요청 문맥 |\n| 쓰기 | 별도 스레드; 큐 포화 / 저장 실패가 조종 루프를 막지 않음 |\n| 직접 실행 기본 | `~/.local/state/cleany/teleop/events.jsonl` (`--event-log`) |\n| 통합 launch | state_root의 `teleop-events.jsonl` |\n| 회전 | 기본 2 MB, 백업 3개; `--event-log-max-bytes`, `--event-log-backups` |\n| 한계 | 강제 종료 / 디스크 장애 / 큐 포화 시 누락 가능; 장기 보관 보장 아님 |\n\n## 지도 클릭 주행 (명시적 선택)\n\n`phone_remote --navigation`은 일반 수동 조종과 별도 선택입니다. 수락한 자동 목표는 화면 잠금·앱 전환 중에도 Supervisor와 센서 감시 아래 계속 실행됩니다. 수동 조종은 기존 입력 만료와 화면 이탈 정지를 유지합니다.\n\n```mermaid\nsequenceDiagram\n    participant UI as 휴대폰\n    participant B as NavigationBridge\n    participant N as Nav2\n    participant S as Supervisor\n    UI->>B: preview / map_id, x, y, yaw, request_id\n    B->>N: ComputePathToPose\n    N-->>B: 경로와 양자화된 끝점\n    B-->>UI: preview_target / 빨간 목표 갱신\n    UI->>B: 표시된 자세로 goal 요청\n    B->>S: NAVIGATION 허가\n    B->>B: map TF / scan / 안전 연결 확인\n    B->>N: navigate_to_pose\n```\n\n| HTTP | 입력 / 결과 |\n|---|---|\n| GET `/api/navigation/map`, `/status` | Token으로 보호된 지도 / 상태 |\n| POST `/api/navigation/{initial-pose,goal,cancel,heartbeat}` | 기존 Origin / token 검사 |\n| Goal | map_id, x/y(m), yaw(rad), request_id |\n| Initial pose | 정지 상태에서만 설정; preview 양자화 변환 미적용 |\n| Preview | ComputePathToPose만 호출; lease 취득 / ENABLE / 속도 발행 없음 |\n| Preview 상태 | preview_request_id, phase, path, error, target(x/y/yaw) |\n| Preview 무효화 | 목적지 / 지도 변경, 취소, 이동 시작; 늦은 응답은 generation으로 제외 |\n\n도착 판정은 표시된 목표의 3 cm / 0.1 rad를 유지합니다. 초기 위치 설정과 수동 조종이 가능하더라도 자동 목표에는 새 위치 정합과 새 Supervisor 허가가 필요합니다.\n\n### 자동 속도와 정지 경로\n\n```mermaid\nflowchart LR\n    Nav[\"자동 intent / motion/cmd_vel\"] --> CM[\"Collision Monitor\"]\n    CM --> Safe[\"navigation/safe_cmd_vel\"]\n    Safe --> Owner[\"phone_remote / 소유 goal과 구동 상태 확인\"]\n    Owner --> Cmd[\"cmd_vel / 최종 publisher 하나\"]\n    Manual[\"수동 전환 요청\"] --> Cancel[\"자동 goal 취소 / 정지 확인\"]\n    Cancel --> Operator[\"기존 operator-controlled 경로\"]\n```\n\n| 프로필 / 제한 | 값 |\n|---|---|\n| 하드웨어 Omni | `forward_only=false`, Omni MPPI; body +Y 좌측 이동 허용 |\n| Longitudinal | 횡이동 차단 유지 |\n| 자동 MPPI 상한 | 병진 합성 0.5 m/s, 회전 0.7 rad/s |\n| 주황 영역 | 병진 0.16 m/s, 회전 0.3 rad/s |\n| 최종 휠 상한 | `phone_navigation.yaml`의 `navigation.max_wheel_rad_s=10` |\n| 혼합 명령 | 네 휠 최대 절댓값으로 같은 비율 축소; 작은 요청을 키우지 않음 |\n\n실물 자동 주행은 별도 통합 검증 대상입니다. Plugin 로딩이나 mock 통과가 실물 구동 증거는 아닙니다.\n\n### ROS 연결과 재기동 후 정지\n\n| 방향 | Endpoint / 계약 |\n|---|---|\n| 구독 | `/map` OccupancyGrid transient-local, `/plan` Path reliable/volatile, `/scan` LaserScan, `/odom` Odometry, `/nav2/cmd_vel` Twist |\n| 발행 / Action | `/initialpose`, `navigate_to_pose`, 기존 NAVIGATION lease |\n| 정지 Action | `navigation/stop` StopMission; 소유 session의 epoch/lease 검증, MCU STOP 확인 뒤 성공 |\n| 공통 제어 | 일반 조종과 자동 주행이 같은 DriverControl 사용 |\n| 허가 전 연결 | Fresh map TF/scan, 안전 입력 subscriber, 단일 최종 publisher |\n\n| 재기동 idle bridge | 처리 |\n|---|---|\n| 현재 epoch의 이전 lease 정지 요청 | 목표나 새 허가 없이 STOP 수락 |\n| stopped 근거 | 신선한 MCU ACK, 휠 속도 \u003c 0.05 rad/s, 출력 정지, 진행 중 goal 전송 / 취소 완료 |\n| 다른 epoch / 새 목표와 무관한 lease | 거부 |\n| STOP 응답 boot_id=0 | 실제 feedback 뒤 새 STOP; 0을 ACK로 인정하거나 ENABLE로 복구하지 않음 |\n\n### 주행 상태 표시\n\n| 상태 | 출처 / 처리 |\n|---|---|\n| `slip`, `traction_recovery` | navigation/slip, navigation/traction_recovery의 String JSON; 표시용이며 권한 추가 없음 |\n| `localization` | localization/status String; 정합 미확인으로 허가 거부 시 이유 표시 |\n| `tf_error` | 마지막 TF 조회 오류; 정상 새 TF에서 해제. 예상 밖 처리 오류는 위치를 즉시 무효화하고 5 s 간격 제한 오류 로그 출력 |\n| `last_input_failure` | 센서 지연 취소의 입력별 수신 나이; event log의 navigation_input_failure와 함께 정지 뒤에도 보존 |\n| 파란 전역 경로 | `/plan`의 유한한 map-좌표계 점; 빈 경로 / 지도 변경 / 새 목표 / 취소 시 제거 |\n| 경로 상태 | global_path_topic, global_path_points, global_path_age_s; 없으면 “경로 생성 대기” |\n\nSubscription 변경은 기존 서버 프로세스에 자동 반영되지 않으므로 코드 반영 뒤 서버를 재실행합니다.\n"},"ros2_ws/src/cleany_tof/docs/interfaces.md":{"title":"ToF 근접 감지와 책상 접근","body":"# ToF 근접 감지와 책상 접근\n\nToF는 유효한 거리 return으로 근거리 장애물을 보완 감지하고 책상 전면까지의 거리와\n방향을 측정합니다. 정상 `NO_RETURN`은 장애물 미검출이며 주행 차단 사유가 아닙니다.\n모든 Zone의 유효성이나 RGB-D free-space 증명을 요구하지 않습니다. 미검출이 실제 빈\n공간을 보장하지는 않으며 ToF와 다른 센서가 같은 장애물을 모두 놓칠 수 있습니다.\n\n## 명령 경로와 책임\n\n```mermaid\nflowchart TD\n  Input[\"Nav2 / 공식 teleop\"] --> Select[\"desk_approach / 명령 선택\"]\n  Select --> Existing[\"기존 pan / Collision Monitor / voxel · reactive guard\"]\n  Existing --> Guard[\"proximity_guard\"]\n  Guard --> Base[\"cmd_vel → Base driver → MCU\"]\n  USB[\"USB JSONL\"] --> Driver[\"tof_driver / tof/frame\"]\n  Driver --> Obs[\"공통 Observation\"]\n  Obs --> Guard\n  Obs --> Select\n  Mission[\"Mission / staging · 정지 확인\"] -->|\"desk/approach\"| Select\n```\n\n기존 LiDAR, RGB-D와 Nav2 Collision Monitor의 보호, 최종 속도 경계와 모터 watchdog을\n유지합니다. ToF 미검출을 costmap clearing ray로 발행하지 않습니다. 기존 head-pan\n`depth_coverage` observer는 원래 설정과 책임을 유지하며 ToF에 의존하지 않습니다.\nToF 전용 `tof/depth_coverage`, 모델 hash와 sweep proof 경로는 제거했습니다.\n\n드라이버는 통신과 센서 세션을, guard는 순간 속도 제한을, approach는 명령 선택과\n접근 Action을 소유합니다. Supervisor는 가용성, Fault, lease와 Mission stop을 관리합니다.\n정상 미검출과 실제 장애물에 따른 정지는 System Fault가 아닙니다. `tof_required=true`는\n`tof_proximity`를 기존 `BASE_MOTION`의 필수 가용성 근거에 추가합니다. 센서 복구만으로\nMission을 자동 재개하지 않습니다.\n\n## 측정과 장애 구분\n\n| 상태 | 조건 | 근접 감지와 평면 처리 |\n|---|---|---|\n| `RANGE` | count>0, status5/9, firmware valid=true, 유한 양수 거리와 허용 sigma | ROI 안의 실제 거리점으로 사용 |\n| `NO_RETURN` | count=0, target_status255, valid=false | 정상 미검출. 잔여 거리/sigma 슬롯은 사용하지 않음 |\n| `UNRELIABLE` | 불량 품질, 허용하지 않은 상태, 범위 위반 또는 불일치 | 해당 Zone 제외. 다른 Zone까지 무효화하지 않음 |\n| `NOT_UPDATED` | target_status0 | 해당 Zone 제외 |\n| 세션/입력 불가용 | sensor_ready=false, 통신/형식 오류, stale frame/odom, 전부 불신뢰/미갱신 | zero와 가용성 철회 |\n\n전체 Zone이 NO_RETURN이어도 정상 관측입니다. 전부 품질 불량인 좌표계은 미검출과 구별해\n사용 불가능으로 처리합니다. 개별 불량 Zone은 무시하므로 해당 방향의 검출 능력은 줄어듭니다.\n`ComponentHealth`는 입력과 guard의 가용성이지 공간 전체의 안전 증명이 아닙니다.\n\n| 통신 / 센서 상태 | 계약 |\n|---|---|\n| Valid | Firmware status 5/9 의미 유지 |\n| Zone target_status255 | Firmware 오류 event status255와 별개 |\n| 오류 event 255 | sensor_ready=false 즉시 발행, 세션 닫기 |\n| 연결 순서 | stop 확인 → cnh off → config 64 15 400000 → start |\n| 입력 | 부분 read 누적; reboot 기본 10 Hz는 주행 입력으로 거부 |\n| Timestamp | Read 완료에서 read 시간 + 한 주기 차감 추정; 첫 좌표계부터의 일정 USB 지연은 실측 필요 |\n\n\u003cfigure class=\"contract-figure\" data-visual-id=\"tof-grid\">\n\u003cimg src=\"assets/native-grid.png\" alt=\"ToF 64개 Zone의 원본 거리 화면은 어떤 모습인가?\" loading=\"lazy\">\n\u003cfigcaption>2026-10-25 미장착 ToF 센서의 native 8×8 거리 화면입니다. 셀 번호와 mm 단위, 회색 미표시 셀을 확인합니다. 당시 viewer의 valid 표시는 현재 RANGE/NO_RETURN 분류와 다르며 ROI 설정이나 보호 성능을 뜻하지 않습니다. \u003ca href=\"../../../../docs/assets/visuals/imported.json\">입력과 출처\u003c/a>\u003c/figcaption>\n\u003c/figure>\n\n## ROI 장애물 필터와 속도 제한\n\n`guard_rows`와 `guard_columns`는 native 8×8 인덱스의 감시 ROI입니다. 기본은 전체 Zone이며\n장착 후 바닥, 로봇 몸체와 필요한 보호 높이를 보고 조정합니다. flip과 extrinsic은 거리\n투영에 적용합니다. 센서 +x는 전방, +y는 영상 왼쪽, +z는 위쪽입니다. 별도 TF를 발행하지 않습니다.\n\n거리 임계값은 raw sensor range가 아니라 직사각형 footprint까지의 평면 거리에서\n`margin + 3*max_sigma_m`를 뺀 clearance입니다. 높이는 ROI로 선택하며 3D 몸체 충돌 모델을\n새로 만들지 않습니다. 다음 값은 미장착 상태의 조정 가능한 초기 후보입니다.\n\n| 설정 | 기본 후보 | 의미 |\n|---|---|---|\n| `obstacle_clearance_m` | 0.75m | 일반 장애물 검출 범위 |\n| `min_cluster_zones` / `cluster_distance_m` | 2 / 0.20m | 상하좌우 인접하고 실제 점 간 거리도 가까운 cluster |\n| `confirm_s` | 0.12s | 같은 Zone의 공간 support 지속 시간, 15Hz에서 보통 3 frames |\n| `emergency_clearance_m` | 0.03m | 유효한 단일 Zone도 첫 좌표계부터 정지 |\n| `hysteresis_m` / `release_s` | 0.05m / 0.20s | 검출 해제 거리와 시간 여유 |\n| `max_speed` / `max_yaw_rate` | 0.25m/s / 0.3rad/s | 최종 명령 상한 |\n\nguard의 30Hz timer가 같은 좌표계을 여러 번 확인한 것으로 세지 않습니다. 수신한 새\n좌표계마다 monotonic 시각으로 갱신하며 긴 입력 공백, 시간 역행 또는 불가용 입력이면\n필터 이력을 폐기합니다. 서로 떨어진 cluster나 반복 flash가 같은 Zone에서 지속된 것으로\n누적되지 않습니다. 확인된 Zone은 해제 거리 이내의 유효 return이 남으면 유지됩니다.\n\n일부 확인된 Zone이 미검출되면 남은 실제 거리점을 계속 사용합니다. 확인된 거리점이 모두\n미검출되거나 해제 거리 바깥으로 사라지면 최대 release_s 동안\n`OBSTACLE_HOLD`로 정지합니다. 이동한 base 좌표계에서 이전 점을 재사용하지 않습니다.\n비상 정지는 emergency_clearance+hysteresis 안의 return이 사라진 후 release_s 뒤 해제합니다.\n미검출만 있는 초기/정상 좌표계은 이 정지 이력을 새로 만들지 않습니다.\n\n확정된 거리점에 명령과 실제 odom의 접근 속도를 검사합니다. x/y 중 접근하는 성분이\n있으면 병진 norm을, 회전에는 footprint 외접반경을 사용합니다. 허용 속도는 다음 식으로\n구하고 x/y/yaw 전체를 같은 비율로 줄입니다. 이미 실제 속도가 envelope를 넘으면 zero입니다.\n\n```text\nclearance >= closing_speed * (reaction_s + confirm_s + sample_age)\n             + closing_speed^2 / (2 * deceleration)\n```\n\n`PROXIMITY_STOP`, `BRAKING_ENVELOPE`, `OBSTACLE_HOLD`는 장애물 대응입니다. `LIMITED`는\n감속, `CLEAR`는 검출에 의한 추가 제한 없음입니다. 센서/odom/명령 지연, 미보정,\nSupervisor 상실과 명령 graph 충돌은 별도의 정지 사유입니다. 매우 가까운 return과 해제\nhold는 이동 방향에 관계없이 정지합니다. 그 외에는 멀어지는 방향을 허용합니다.\n\n일반 검출의 지연, ROI 밖 물체, 기준보다 작은 cluster와 불량 return은 놓칠 수 있습니다.\n제동 식에 confirm_s를 포함해도 그 지연과 센서 관측 한계의 물리 안전성을 보장하지 않습니다.\n\n## 책상 접근\n\n```mermaid\nflowchart LR\n    Nav[\"Nav2 staging / 실제 정지\"] --> Request[\"DeskApproach / 기존 lease 검증\"]\n    Request --> Plane[\"RANGE만 선택 / column median 평면 fit\"]\n    Plane --> Valid{\"support / residual / yaw 유효?\"}\n    Valid -->|아니오| Stop[\"시작 거부 또는 zero + abort\"]\n    Valid -->|예| Align[\"정렬 / 저속 접근\"]\n    Align --> Settle[\"목표 오차 내 odom 정지 0.6 s\"]\n    Settle --> Success[\"성공 / Mission도 정지 feedback 확인\"]\n```\n\n| 평면 검사 | 기본 기준 |\n|---|---|\n| ROI | approach_rows 2–5, approach_columns 0–7 |\n| 입력 | RANGE만 사용; 미검출 / 불량 Zone 보간 안 함 |\n| Support | Column마다 실제 min_plane_rows=2 이상, min_plane_columns=4 이상 |\n| 폭 | min_plane_span_m=0.15 m |\n| Fit | Column median으로 x=distance+slope*y, 전체 선택 sample residual / yaw 검사 |\n| 실패 | 일부 불량 자체는 실패 아님; support 부족 / 모호한 전면은 거부 |\n\n미검출만으로 책상이나 도착을 추정하지 않습니다.\n\n| 접근 / 종료 | 계약 |\n|---|---|\n| 최대 속도 | 0.04 m/s, 0.08 rad/s |\n| 목표 거리 | Base_link 원점에서 평면 y=0 교점; bumper gap 아님 |\n| 좌우 중심 | Staging pose에 의존 |\n| 성공 | 목표 오차 내 실제 odom 정지 settle_s=0.6 s, Mission 정지 feedback |\n| 실패 / 취소 | Timeout / overshoot / no progress / Nav2 동시 goal / 센서·평면 소실 / lease 회수 |\n| 권한 | 기존 lease의 epoch / version / lifetime 검증만; 발급 / 연장 없음 |\n| 재시작 | Journal의 해당 Action goal만 취소 |\n\n## ROS endpoint와 배포\n\n| 노드 | 기본 endpoint | 타입과 조건 |\n|---|---|---|\n| tof_driver | 발행 `tof/frame` | TofFrame, R1, sensor_ready, 64 native Zone, tof_link, 거리/sigma m, 15Hz |\n| guard / approach | 구독 `tof/frame`, `odom` | TofFrame R1 / Odometry Sensor, ROS와 monotonic freshness |\n| proximity_guard | 구독 `proximity/input`, 발행 `cmd_vel` | Twist R1, 출력30Hz steady timer |\n| proximity_guard | 발행 `proximity/status` | String R1, 제한/정지 사유 |\n| proximity_guard | 발행 `system/component_health` | ComponentHealth R10, source=tof_proximity, 분류 개수와 pending/obstacle/emergency/held |\n| desk_approach | 구독 `nav2/cmd_vel`, 발행 `motion/cmd_vel` | Twist R1, 단일 명령 선택 |\n| desk_approach | 구독 `navigate_to_pose/_action/status` | GoalStatusArray, Action status QoS |\n| guard / approach | 구독 `system/heartbeat`, `system/state` | 기존 메시지, R1 / R/T1, 시각과 epoch 검사 |\n| desk_approach | 제공 `desk/approach` | DeskApproach Action, 기존 lease 식별자, feedback/result/cancel |\n\n두 제어 노드에 동일한 ToF YAML을 적용하고 Mission과 기존 안전 경로의 canonical odom도\n일치시킵니다. navigation의 tof_enabled, Supervisor의 tof_required, Mission의\ndesk_approach_enabled는 별도 옵션입니다. 기본은 opt-in과 calibrated=false입니다.\n예전 min_valid/required_zones, no_return_max_*와 ToF coverage proof 설정은 제거합니다.\nTofFrame의 sensor_ready 계약은 유지되므로 외부 publisher도 정상 좌표계에 true를 설정합니다.\n\n아직 센서는 로봇에 미장착입니다. FOV/extrinsic/ROI, 표면/조명별 검출, 실제 지연과 제동,\n필터 오탐/미탐, 접근 정확도와 독립 정지를 장착 후 측정해야 합니다. 기존 독립 안전 장치를\n활성 상태로 유지하고 후보 설정을 물리 안전 검증 결과로 해석하지 않습니다.\n"},"ros2_ws/src/cleany_trajectory_controller/docs/interfaces.md":{"title":"이벤트 궤적 제어기","body":"# 이벤트 궤적 제어기\n\n`cleany_trajectory_controller/JointTrajectoryController`는 ROS 2 Humble의\n`joint_trajectory_controller` 2.53.3을 상속하는 controller plugin이다.\n궤적 보간, 모터 명령, 허용 오차와 도착 판정은 기존 구현을 사용하고,\n완료 결과를 기다리는 상위 작업에는 executor 이벤트로 결과를 전달한다.\n\n## 결과 전달과 진행 상태\n\n완료 결과와 진행 상태의 전달 주기를 구분한다.\n\n| 항목 | 기존 제어기 | 이벤트 제어기 |\n|---|---|---|\n| 성공, 실패와 취소 결과 | `action_monitor_rate` 타이머에서 전달 | 종료를 감지하면 executor를 깨워 전달 |\n| 진행 상태 피드백 | `action_monitor_rate` 타이머에서 전달 | 같은 설정의 타이머에서 전달; 처리할 목표가 없으면 타이머 정지 |\n| 궤적 보간과 도착 판정 | 기존 JTC 구현 | 기존 JTC 구현 |\n\n종료 상황별 결과는 다음과 같다.\n\n| 항목 | 처리 |\n|---|---|\n| 성공, 궤적 허용 오차 실패 | 기존 종료 판정과 결과 코드를 전달 |\n| 사용자 취소 | 기존 취소와 hold 처리를 수행하고, ROS 취소 상태 전이 뒤 `CANCELED` 전달 |\n| 새 명령으로 교체 | 이전 목표를 `ABORTED / INVALID_GOAL`로 종료하고 새 목표 실행 |\n| 활성 제어기 비활성화 | 기존 중단 결과를 이벤트로 전달 |\n\n서버에 의한 명령 교체에는 사용자 취소 상태 전이가 없으므로\n`EXECUTING → CANCELED`를 직접 시도하지 않는다. 수락한 사용자 취소와\n완료 판정이 겹치면 사용자 취소 결과를 전달한다. 목표별 handle은 결과\n전달까지 보존하며 다음 명령이 이전 결과를 덮어쓰지 않는다.\n\nAction callback과 결과 전달은 같은 상호 배타 callback group을 사용한다.\n제어 update는 guard condition만 알리고, 결과 메시지는 executor에서 발행한다.\n운영체제와 RMW의 최악 지연 상한을 보장하지 않으며, 일반 controller state\n토픽과 하드웨어 제어 주기는 바꾸지 않는다.\n\n## 인터페이스\n\n| 기본 이름 | ROS 타입 | 역할 |\n|---|---|---|\n| `\u003ccontroller_name>/follow_joint_trajectory` | `control_msgs/action/FollowJointTrajectory` | 기존 Action 요청, 결과, 취소와 피드백 유지 |\n| `\u003ccontroller_name>/query_state` | `control_msgs/srv/QueryTrajectoryState` | upstream 조회 서비스 유지 |\n| `~/controller_state`, `~/state` | `control_msgs/msg/JointTrajectoryControllerState` | upstream 상태 발행 유지 |\n\n## 설정\n\n실물 제어 프로파일에서 다음과 같이 선택한다. 설정은 다음 제어기 생성 시 적용한다.\n\n```yaml\ncontroller:\n  type: cleany_trajectory_controller/JointTrajectoryController\n  action_monitor_rate: 20.0\n```\n\n| 설정 | 기본값과 조건 |\n|---|---|\n| `controller.type` | 생략 시 `joint_trajectory_controller/JointTrajectoryController`; 위의 두 plugin 이름만 허용 |\n| `controller.action_monitor_rate` | 기본 20Hz, 유한한 수 1–100Hz; 이벤트 방식에서는 진행 상태 주기 |\n\n기존 `trajectory_tolerance`, `goal_tolerance`, `goal_time`은 그대로 사용한다.\n\n## 빌드 호환성과 검증\n\n이 plugin은 upstream 내부 상태를 사용하므로 JTC 버전을 2.53.3으로 고정한다.\n다른 버전에서는 CMake 구성이 실패한다. 의존 버전을 변경할 때는 취소와\n명령 교체를 포함한 종료 동작을 다시 검증한다.\n\n빌드, 종료 동작 검사와 CPU 및 지연 비교는\n[테스트 가이드](../../../../docs/TESTING.md#이벤트-결과-전달-검증)를 따른다.\n`src/event_controller.cpp`의 목표 수락 절차는 Apache-2.0인\n[upstream 2.53.3 구현](https://github.com/ros-controls/ros2_controllers/blob/2.53.3/joint_trajectory_controller/src/joint_trajectory_controller.cpp)을 기반으로 한다.\n"},"tools/odometry_evaluation/README.md":{"title":"실물 베이스의 정지 응답과 odometry 평가","body":"# 실물 베이스의 정지 응답과 odometry 평가\n\n휠 피드백으로 정지한 위치와 LiDAR 또는 바닥 마킹으로 측정한 변위를 비교합니다. 평가용 P 제어는 상시 주행 controller나 wheel geometry 보정과 별개입니다.\n\n| 확인하려는 것 | 진입점 | 입력 |\n|---|---|---|\n| 한 패턴의 왕복 잔차 | `run_eval.sh` | pattern / 거리 / 회전 수 |\n| 속도별 wheel odom 재측정 | `run_wheel_only_eval.sh` | [wheel 평가 config](../../configs/mission/wheel_odometry_evaluation.json) |\n| 축별 P 응답과 외부 오차 | `run_motion_response.sh` | [전 축 프로토콜](validation-protocol.md) |\n| 저장 스캔만 다시 정합 | `replay_scan_matches.py` | response summary + NPZ; ROS/장치 사용 안 함 |\n\n## 1. 사전 준비 및 바닥 마킹\n\n1. 최소 3.5×3.5 m의 평탄하고 장애물 없는 바닥을 확보합니다. 기본 legacy 패턴의 시작점 기준 최대 변위는 3.0 m입니다.\n2. 바닥 십자선과 로봇 외곽 기준점을 정렬합니다. 필요하면 전방 2.5 m, 좌측 2.0 m에도 마킹합니다.\n3. 물리 Emergency Stop을 즉시 사용할 수 있게 준비하고 다른 명령원을 종료합니다.\n4. Dry-run으로 해당 **실행 경로의** 거리·속도·반복 수를 확인합니다. 전 축 응답 시험은 별도 0.5 m/90° 한계입니다.\n\n## 2. 노드 기동\n\n| 실행 경로 | 노드 준비 |\n|---|---|\n| `run_eval.sh` | 아래 Agent와 base driver, 선택 LiDAR를 미리 실행 |\n| `run_wheel_only_eval.sh`, `run_motion_response.sh` | runtime config로 준비/재사용; [자동 기동 조건](#자동-기동과-준비-확인) |\n\n```bash\n# 터미널 1: exact by-id 장치를 CLEANY_ESP_PORT에 지정한 뒤 실행\nsource /opt/ros/humble/setup.bash\nsource esp32/micro_ros/agent/install/local_setup.bash\nexport ROS_DOMAIN_ID=0\nros2 run micro_ros_agent micro_ros_agent serial --dev \"$CLEANY_ESP_PORT\" -b 115200\n```\n\n```bash\n# 터미널 2\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nexport ROS_DOMAIN_ID=0\nros2 launch cleany_base_driver base_driver.launch.py   mock:=false config:=\"$PWD/ros2_ws/src/cleany_base_driver/config/base_hardware.yaml\"\n```\n\n## 3. 평가 스크립트 실행\n\nUbuntu 22.04 외 호스트에서는 launcher가 `ros2-humble` Distrobox로 전환합니다. 먼저 이동 없는 계획을 확인합니다.\n\n```bash\nbash tools/odometry_evaluation/run_eval.sh --pattern surge --dry-run\nbash tools/odometry_evaluation/run_wheel_only_eval.sh --dry-run\nbash tools/odometry_evaluation/run_motion_response.sh --dry-run\n```\n\n### 한 패턴 선택\n\n아래 경로는 로봇 좌표계 +X 전방, +Y 좌측입니다. 도식의 길이는 축척이 아니며 실제 거리는 표를 따릅니다.\n\n```mermaid\nflowchart LR\n  subgraph Surge[\"surge / 전후진\"]\n    S0[\"원점\"] -->|\"+X\"| S1[\"전방\"]\n    S1 -->|\"−X\"| S0\n  end\n  subgraph Sway[\"sway / 좌우\"]\n    Y0[\"원점\"] -->|\"+Y\"| Y1[\"좌측\"]\n    Y1 -->|\"−Y\"| Y0\n  end\n  subgraph Box[\"box / yaw 고정\"]\n    A[\"원점\"] -->|\"+X\"| B[\"전방\"]\n    B -->|\"+Y\"| C[\"전좌\"]\n    C -->|\"−X\"| D[\"좌측\"]\n    D -->|\"−Y\"| A\n  end\n```\n\n| `run_eval.sh` 인자 | 기본 동작 | 비교하려는 오차 |\n|---|---|---|\n| `--pattern surge --distance 2.5` | +X 2.5 m → 2초 정지 → −X 복귀 | 반경 계수 / 전후 가감속 |\n| `--pattern sway --distance 2.0` | +Y 2 m → 2초 정지 → −Y 복귀 | 횡방향 슬립 |\n| `--pattern yaw --turns 2.0` | 반시계 720° → 2초 정지 → 시계 복귀 | wheelbase/track 계수와 회전 마찰 |\n| `--pattern box --distance 2.0` | yaw 고정, 2×2 m 폐루프; 최대 반경 2.828 m | 복합 누적 drift |\n| `--pattern return_x` / `return_y` | 지정 거리 직진/횡이동 후 복귀 | 원위치 잔차 |\n\n병진 명령 상한은 0.5 m/s, yaw는 1.0 rad/s입니다. 실제 속도와 구분합니다. 확인한 패턴으로 실물 실행합니다.\n\n```bash\nbash tools/odometry_evaluation/run_eval.sh --pattern surge --distance 2.5\n```\n\n### 속도별 3회 휠 odom 재측정\n\n```bash\nbash tools/odometry_evaluation/run_wheel_only_eval.sh   --config configs/mission/wheel_odometry_evaluation.json\n```\n\n| 기본 행렬 | 값 |\n|---|---|\n| 병진 | X/Y, 두 대각선의 정·역방향; 편도 총거리 0.5 m |\n| 회전 | ±90° |\n| 속도 | 병진 0.20/0.35/0.50 m/s, 회전 0.30/0.60/1.00 rad/s |\n| 반복 | 각 조건 3회, 45회 왕복 / 90개 편도 |\n| 평가 odom | `/wheel/odom`; IMU/localization 융합 없음, ICP도 odom에 융합하지 않음 |\n\n긴 wheel 평가의 거리는 이 config의 `translation_distance_m`에서 변경합니다. P 응답 프로토콜의 0.5 m 제한과 혼동하지 않습니다. 경로와 `output_dir`는 레포 루트 기준입니다. Dry-run은 ROS나 결과 폴더를 만들지 않습니다. 이동 또는 ICP 실패 시 후속 반복을 시작하지 않습니다.\n\n### 전 축 P=6 검증 프로토콜\n\n시험 행렬과 조정 범위의 원본은 [VALIDATION_PROTOCOL](validation-protocol.md)입니다.\n\n```bash\nbash tools/odometry_evaluation/run_motion_response.sh   --config configs/mission/all_axis_validation.json\n```\n\n현재 P는 X/Y/yaw와 대각선 모두 6.0이며 trial에만 적용합니다. `motion_settings.json`의 `candidate_settings: true`는 재검증 대상임을 표시합니다. 기본 `require_valid_icp=true`, 전 축 preset inlier 하한은 0.30이며 생략 시 0.40입니다. 제어 응답 완료와 외부 정확도 판정을 구분합니다.\n\n### X/Y/yaw P 응답 측정과 현재 적용값\n\n| config | 목적 |\n|---|---|\n| `motion_response_tuning.json` | X/Y/yaw의 P·속도 후보 비교 |\n| `diagonal_response_tuning.json` | 두 대각선, 0.20 m/s에서 P=1/3/4/6 |\n| `diagonal_response_validation.json` | P=6, 0.20/0.35/0.50 m/s 각 3회 |\n\n```bash\nbash tools/odometry_evaluation/run_motion_response.sh   --config configs/mission/motion_response_tuning.json --dry-run\n# 위 계획과 시험 공간을 확인한 뒤 같은 명령에서 --dry-run을 제외한다.\n```\n\n150 ms odom watchdog을 유지합니다. `guards`는 시작점 반경, 횡이탈, 병진 중 yaw, 과도 변위를 제한하는 시험용 중단값입니다. `require_valid_icp=false`를 명시하면 정상 제어 trace는 이어 측정하되 거부된 외부 비교는 무효로 남깁니다. 주행 실패·watchdog·경계 이탈은 항상 중단합니다.\n\n### 대각선 P 튜닝과 외부 오차 측정\n\n| 축 | 방향 | 0.5 m 편도의 성분 |\n|---|---|---|\n| `diagonal_left` | 전좌 ↔ 후우 (+45°/−135°) | abs(X)=abs(Y)≈0.354 m |\n| `diagonal_right` | 전우 ↔ 후좌 (−45°/+135°) | abs(X)=abs(Y)≈0.354 m |\n\n속도와 거리는 벡터 크기입니다. 제어와 5 mm 정지 허용치는 진행방향 투영값이며 2D norm이 아닙니다. 횡편차와 yaw는 별도로 측정하고 guard를 적용합니다. 대각선 P는 fallback `linear_kp`만 바꿉니다.\n\n## 4. Ground-Truth 계측 방식 (LiDAR ICP vs 바닥 테이프 수동 측정)\n\nICP는 품질을 검사한 상대변위 추정입니다. 독립적으로 측정한 절대 정답이나 슬립 원인 판정으로 취급하지 않습니다.\n\n```mermaid\nflowchart LR\n  Goal[\"명령 목표\"] --> Controller[\"시험용 P / odom 정지\"]\n  Wheel[\"wheel odom 변위\"] --> WheelError[\"wheel_goal\"]\n  Goal --> WheelError\n  Scan[\"시작 / 종료 LiDAR burst\"] --> ICP[\"ICP + 품질 gate\"]\n  ICP --> ICPError[\"icp_goal\"]\n  Goal --> ICPError\n  Wheel --> Diff[\"odom_minus_icp\"]\n  ICP --> Diff\n```\n\n### 2D LiDAR ICP 자동 계측\n\n`/scan`의 고정 구조물 반사를 시작/종료 각 1초 burst로 모아 Point-to-Line ICP로 비교합니다. 기본 활성이고 `--no-lidar`로 끕니다. RMSE, inlier 비율과 Hessian 관측성 검사를 통과해야 유효합니다. 결과 JSON과 같은 이름의 PNG는 scan overlay와 정합을 보여줍니다.\n\n### ICP 수렴과 관측성\n\n`lidar_scan_matcher.py`는 `p_ref = R(yaw) p_target + t`와 일치하는 additive\npose Jacobian을 사용합니다. 최종 30 mm inlier에서 같은 robust Jacobian으로\n병진·전체 SE(2) 관측성을 다시 계산합니다.\n\n수렴은 correspondence 거리의 annealing이 40 mm 최종 단계에 도달한 뒤만\n판정합니다. 병진 `1e-5 m`와 회전 `1e-5 rad`의 strict step 조건을 각각 확인하며,\n작은 반복 진동은 다음 조건을 모두 만족할 때 별도로 종료합니다.\n\n- 주기 2~6의 pose가 세 주기 연속 반복.\n- 대응하는 모든 pose 쌍이 strict 병진·회전 공차 안에서 일치.\n- 전체 반복 구간의 pose 간 최대 차이가 1 mm·0.02° 이하.\n\n반환값은 마지막 pose이며, 평균 pose나 odometry 값으로 대체하지 않습니다.\n수렴 후에도 inlier·RMSE·관측성 검사를 통과해야 유효합니다.\n`ScanMatchResult`는 `convergence_reason`(`step_tolerance`, `bounded_cycle` 등),\n마지막 보정량과 적용한 `convergence_settings`를 기록합니다.\n`LidarScanMatcher(convergence_config=...)`로 병진·회전 strict 공차,\n최대 반복 진동 폭과 주기를 각각 설정합니다.\n\n### 저장 스캔 재검증\n\n`replay_scan_matches.py`는 저장된 `response_summary.json`과 NPZ만 읽어\noutbound·inbound·직접 loop 정합을 다시 계산합니다. ROS나 장치를 사용하지\n않습니다. 저장된 extrinsic과 odometry로 laser-axis 초기값을 재구성하며,\nloop 초기값은 두 편도의 SE(2) 합성으로 계산합니다.\n\n```bash\n# 레포 루트, Ubuntu 22.04 외 호스트의 Distrobox 환경\ndistrobox enter --name ros2-humble --no-tty --clean-path -- \\\n  env PYTHONNOUSERSITE=1 /usr/bin/python3 \\\n  tools/odometry_evaluation/replay_scan_matches.py \\\n  /absolute/run/response_summary.json \\\n  --min-inlier-ratio .30 \\\n  --output /absolute/new-icp-replay.json\n```\n\n`--min-inlier-ratio`를 생략하면 각 원본 결과의 적용값(없으면 40%)을 사용합니다.\n새 JSON에는 기존·새 품질 판정, 수렴 사유, 적용 설정, pose 변화량과 회귀 건수를\n기록합니다. 원본을 수정하지 않으며 기존 출력 파일도 덮어쓰지 않습니다.\nPose 변화량은 알고리즘 간 차이이며 실제 위치 오차가 아닙니다.\n\n### 바닥 마킹 테이프 수동 입력 (Fallback 또는 `--no-lidar`)\nLiDAR를 사용하지 않거나 ICP가 거부되면 명시적인 수동 측정이 필요합니다.\n`--manual-fallback`을 지정하면 바닥 테이프 기준의 측정치를 프롬프트로 입력받습니다.\n빈 입력을 0으로 간주하지 않습니다.\n\n```text\nEnter physical X error relative to tape mark in mm (forward/overshoot + / undershoot -):\nEnter physical Y error relative to tape mark in mm (left + / right -):\nEnter physical Yaw error relative to tape mark in deg (CCW + / CW -):\n```\n\n입력 또는 LiDAR 추정 완료 시 요약 분석표가 출력되며, `artifacts/odometry_evaluation/odom_eval_\u003cpattern>_\u003ctimestamp>.json`에 상세 기록이 저장됩니다.\n\n`--tape-error-x`, `--tape-error-y`, `--tape-error-yaw`를 모두 지정해 직접\n측정값을 전달할 수도 있습니다. 유효한 ICP나 완전한 수동 측정이 없으면\n성공으로 처리하지 않습니다. 시작·종료 스캔은 같은 이름의 `_start.npz`,\n`_end.npz`로 저장하며, 기존 평가 JSON을 덮어쓰지 않습니다.\n\n## 자동 기동과 준비 확인\n\n[`ros2_ws/src/cleany_base_driver/config/wheel_evaluation_runtime.json`](../../ros2_ws/src/cleany_base_driver/config/wheel_evaluation_runtime.json)에서\nMCU·LiDAR by-id USB 경로, base hardware 프로필, LiDAR 옵션과 대기 시간을 바꿉니다.\n\n- Agent가 없으면 연결된 MCU에 serial Agent를 시작하고, base driver가 없으면\n  `mock:=false`로 wheel odometry를 함께 시작합니다.\n- LiDAR가 정상 스캔을 발행하면 재사용합니다. USB 재연결 후 스캔이 끊긴 기존\n  프로세스는 같은 사용자·설정된 serial 경로·허용 노드 이름까지 식별되는 경우만\n  종료하고 by-id 경로로 다시 시작합니다. 식별되지 않는 프로세스를 임의 종료하거나\n  중복 driver를 추가하지 않습니다.\n- `/base/enable` service와 측정 시각가 진행하는 실제 odom·scan·WheelState를\n  확인합니다. MCU가 disabled·fault-free이고 wheel 목표/PWM이 0이며,\n  차체 필터 뒤 외부 환경 반사점이 충분히 수신되어야 주행을 시작합니다.\n- 기본 30초 안에 준비되지 않으면 누락·정체 원인을 기록하고 평가 프로세스를\n  시작하지 않습니다. 자체 기동 프로세스의 로그는 배치 결과 디렉터리에 남깁니다.\n- 완료·실패·Ctrl+C에서는 평가 프로세스의 STOP·disable 정리 후 자체 기동한\n  프로세스만 종료합니다. 재사용한 정상 프로세스는 유지합니다.\n\nMCU에는 micro-ROS **모터 제어 펌웨어**가 실행되어야 합니다.\n독립 IMU 캘리브레이션 펌웨어는 `cleany.imu_calibration/v1` JSON만 응답하며\n`/base/wheel_state`를 발행하지 않습니다. 이 경우 Agent를 켜도 odom은 생성되지\n않습니다. Launcher는 이 누락을 보고하며 펌웨어를 자동으로 덮어쓰지 않습니다.\n모터 펌웨어 복원은 [IMU 진단의 복원 절차](../../esp32/imu_calibration/README.md#hardware-acceptance-and-restoration)를 따릅니다.\n\n`lidar_min_range_m: 0.45`는 이번 장착의 프로파일 반사점(관측 거리 약 0.23~0.39 m)을\n평가용 ICP에서 제외하는 거리 필터입니다. `/scan` 자체나 장애물 회피 입력을\n변경하지 않습니다. 필터 후에도 서로 다른 방향의 고정 구조물이 충분히 보여야 합니다.\n이는 보정용 프로파일 정합과 달리 외부 환경 스캔을 비교하는 주행 평가입니다.\n새 센서 위치에서 필터를 재사용하려면 차체 반사점의 최대 거리를 다시 확인합니다.\n\n보정 파일은 `yaw_deg`, `lever_arm_x_m`, `lever_arm_y_m`의 유한한 수치 세 개를\n필수로 포함하는 JSON입니다. 추가 provenance 필드는 허용합니다. 적용한 보정값과\n파일 식별 정보, odom 입력 및 최소 거리는 개별 결과와 summary에 기록합니다.\n배치 실행은 설정을 사전 검증하고 `output_dir/batch_\u003c시각>_\u003cpid>/`에 고정 사본과 결과를 남깁니다. 하위 `run_oneway_eval.py`를 직접 사용할 때 현재 장착의 extrinsic 파일을 생략하면 이전 장착 기본값이 적용되므로 생략하지 않습니다.\n\n\n## 5. 결과와 그래프 읽기\n\n\u003cfigure class=\"visual-slot\" data-visual-id=\"odometry-result\">\n\u003cp>\u003cstrong>시각자료 자리 · 비워 둠\u003c/strong>\u003c/p>\n\u003cfigcaption>\u003cstrong>필요한 자료:\u003c/strong> 현재 평가 도구의 response.png와 대응하는 실제 trace·결과 JSON.\u003cbr>\u003cstrong>빈 이유:\u003c/strong> 기존 wheel 비교 자료는 이 도구의 응답 trace와 연결되지 않아 재사용하지 않았습니다.\u003c/figcaption>\n\u003c/figure>\n\n`response.png`는 축별 열과 3개 행으로 구성됩니다. **실제 trace가 있는 실행에서 생성한 그림**을 결과 JSON과 함께 열어 해석합니다.\n\n| 그림 위치 / 표시 | 의미 |\n|---|---|\n| 위 행 | 목표 대비 진행량; 정·역방향을 같은 양의 목표로 정규화 |\n| 가운데 행 | wheel odom의 남은 목표 오차 |\n| 아래 행 | odom 속도와 명령 속도; 명령은 옅은 점선 |\n| 실선 / 점선 | outbound / inbound |\n| 색상 | P와 속도 상한 조합 |\n| 시간 축 | 주행 응답만; 종료 후 dwell과 scan 수집 제외 |\n\n`settling_entry_s`는 위치와 속도가 모두 허용 범위에 들어와 이후 유지되는 시각입니다. 0.5초 hold 완료와 별도 1.5초 dwell을 더한 시각이 아닙니다.\n\n| JSON 결과 | 비교 | 해석 한계 |\n|---|---|---|\n| `wheel_goal` | wheel odom − 목표 | 제어 feedback 잔차 |\n| `icp_goal` | 유효 ICP 변위 − 목표 | 외부 추정 기준 목표 차이 |\n| `odom_minus_icp` | wheel odom − 유효 ICP | 피드백과 외부 추정의 불일치 |\n| 무효 ICP | `icp_goal`, `odom_minus_icp`는 null | 0으로 대체하거나 평균에 포함하지 않음 |\n\n빠르게 정착하거나 wheel 잔차가 작아도 실제 위치 오차가 작다는 뜻은 아닙니다. 결과에는 ICP 거부 건수와 전체 분모를 함께 남깁니다. 원인은 측정 불확실성과 장착 보정까지 고려하며 P나 슬립으로 단정하지 않습니다.\n\n| 배치 출력 | 내용 |\n|---|---|\n| `config_snapshot.json` | 실험 설정과 원본 식별 |\n| `motion_config.json`, `extrinsic_config.json` | 반복에 적용한 고정 사본 |\n| `runtime_config.json`, `base_hardware.yaml` | runtime과 hardware 프로필 |\n| `run_1/`, `run_2/`, `run_3/` | 개별 측정, trace, JSON/NPZ/PNG |\n| `runtime_logs/` | 자체 시작한 agent/base/lidar 로그 |\n| `batch_summary.json` | 배치 종료 상태; 중단 시 후속 반복 없음 |\n\n### 제어 설정과 보조 도구\n\n| 도구 / 설정 | 용도 |\n|---|---|\n| `motion_settings.json` | 순수 X/Y는 축별 kp, 대각선은 linear_kp, 회전은 yaw_kp; 생략한 축값은 linear_kp |\n| `motion_control.py`, `motion_runtime.py` | 공통 제어; stale/역행/중복/비정상 odom 시 STOP+disable, 같은 실행 재개 금지 |\n| `run_oneway_eval.py` | 목표 정지 잔차와 odom−ICP 분리; `--extrinsic-config`, `--odom-topic` |\n| `run_multi_speed_eval.py`, `tune_yaw_p.py` | 속도 비교 / 독립 yaw controller 시험 |\n| `capture_preflight.py` | 정지 odom/WheelState/scan 확인 |\n| [휠 진단](../wheel_calibration/README.md) | 정상상태 휠 속도/PWM |\n\n주행 도구는 `/tmp/cleany_odom_eval.lock`과 `/cmd_vel` publisher 검사로 중복을 막습니다. Legacy `run_eval.sh`/`run_multi_speed_eval.py`의 LiDAR→base 기본값은 yaw −7.85°, X lever arm 0.029 m이며 extrinsic 선택 옵션이 없습니다. 현재 장착 재측정에는 명시 config 기반 launcher를 사용합니다.\n\n다중 속도 실행은 `--output-dir /absolute/new-run` 또는 `CLEANY_DATA_ROOT`를 지정합니다. 환경변수만 지정하면 `runs/navigation/control/YYYY-MM-DD_HHMMSS_odometry/`에 실행 설정, 개별 결과, 집계와 그림을 모읍니다. 기존 디렉터리는 재사용하지 않으며 dry-run은 결과 디렉터리를 만들지 않습니다.\n\n| 결과 표현 | 계약 |\n|---|---|\n| LiDAR ICP reference | scan matching 상대 추정; 독립적인 실물 정답을 뜻하지 않음 |\n| `reference_error` | 새 기준 오차 키; `measurement_method`로 ICP와 수동 측정 구분 |\n| `calibrated_base_reference` | 외부 보정 후 base 좌표계의 ICP 상대 변위 |\n| 과거 JSON | `physical_ground_truth`, `calibrated_base_ground_truth`를 호환 키로 함께 저장; 읽을 때 새 키 우선, 없으면 과거 키 사용 |\n\n## 6. 단위 테스트\n\n```bash\nmake test-odometry-evaluation\n```\n\nBatch config, 변환, ICP, 공통 제어, 휠 진단 pytest와 Bash 문법을 검사하며 장치를 실행하지 않습니다.\n\n현재 기본 평가 config는 [2026-11-16 LiDAR extrinsic](../../ros2_ws/src/cleany_base_driver/config/lidar_extrinsic_20261116.json)을 사용합니다.\nLiDAR → base 변환은 X 0.143429742 m, Y −0.001191569 m, yaw 179.997034°이며 ICP 초기값과 결과 변환에 함께 적용합니다.\n"},"tools/odometry_evaluation/validation-protocol.md":{"title":"전 축 실물 검증 프로토콜","body":"# 전 축 실물 검증 프로토콜\n\nX/Y, yaw와 두 대각선의 정지 응답 및 wheel odom과 LiDAR ICP의 차이를\n같은 절차로 측정합니다. 기본 시험용 P는 모든 축에서 **6.0**입니다.\n\nP는 각 편도의 거리·각도 정지를 위한 일시적인 평가 제어입니다. trial에만 적용하며\n실행 후 설정 파일에 되쓰지 않습니다. MCU 휠 속도 PI·FF, 휠 odom geometry와\n상시 주행 controller의 튜닝과 구분합니다.\n\n## 1. 설정과 시험 행렬\n\n편집할 파일은\n[`configs/mission/all_axis_validation.json`](../../configs/mission/all_axis_validation.json)입니다.\n`run_motion_response.sh`의 기본 config이며, 기존 후보 sweep과 별개입니다.\n\n| `axis` | outbound → inbound | 편도 목표 | 속도 상한 |\n|---|---|---|---|\n| `x` | 전진 → 후진 | 0.5 m | 0.20 / 0.35 / 0.50 m/s |\n| `y` | 좌측 → 우측 | 0.5 m | 0.20 / 0.35 / 0.50 m/s |\n| `yaw` | 반시계 → 시계 | 90° | 0.30 / 0.60 / 1.00 rad/s |\n| `diagonal_left` | 전좌 → 후우 | 벡터 총거리 0.5 m | 0.20 / 0.35 / 0.50 m/s |\n| `diagonal_right` | 전우 → 후좌 | 벡터 총거리 0.5 m | 0.20 / 0.35 / 0.50 m/s |\n\n각 속도·축에서 3회 왕복, 총 **45회 왕복 / 90개 편도**다. 반복마다 저속의\n다섯 축, 중속의 다섯 축, 고속의 다섯 축 순서로 실행합니다.\n대각선의 각 X/Y 성분은 약 0.354 m입니다. 속도는 명령 상한이며, 짧은 구간의\n가감속과 휠 속도 제한 때문에 실측 최고 속도와 다를 수 있습니다.\n\n### 파라미터 편집\n\n| 위치 | 의미와 적용 범위 |\n|---|---|\n| `trials[].axis` | `x`, `y`, `yaw`, `diagonal_left`, `diagonal_right` |\n| `trials[].kp` | 해당 왕복의 P. 허용 범위 `0 \u003c kp \u003c= 8`. 기본 6.0 |\n| `trials[].speed` | 해당 왕복의 속도 상한. 병진 최대 0.5 m/s, yaw 최대 1 rad/s |\n| `repetitions` | 전체 trial 목록 반복 수. 1~10 |\n| `translation_distance_m` | 모든 병진 편도의 벡터 총거리. 최대 0.5 m |\n| `rotation_angle_deg` | 회전 편도 각도. 최대 90° |\n| `require_valid_icp` | 기본 `true`. 외부 비교가 거부되면 후속 trial 중단 |\n| `icp_min_inlier_ratio` | 유효 ICP의 최소 inlier 비율. 현재 preset은 `0.30`(30%), 생략 시 `0.40` |\n| `icp_convergence` | 병진·회전 strict 공차, bounded cycle의 최대 폭과 주기. 아래 기본값 참조 |\n| `guards` | 아래 시험용 중단 경계 |\n| `output_dir` | 결과 묶음의 상위 디렉터리 |\n\n| 튜닝 / ICP 기준 | 규칙 |\n|---|---|\n| 전 속도 P 변경 | 같은 축 세 trial 함께 편집 |\n| 부분 재시험 | 복사 config의 trials에 필요한 행만 유지 |\n| 비교 | P / 속도 / 감속을 동시에 바꾸지 않고 원본과 변경 결과 구분 |\n| 전 축 preset | Inlier 하한 30%, 적용값 결과에 기록 |\n| 반복 / strict 공차 | 최대 50회, 병진 1e-5 m / 회전 1e-5 rad |\n| 수렴 시점 | Correspondence annealing이 최종 40 mm에 도달한 뒤 |\n| Bounded cycle | 주기 2–6이 세 번 반복, pose 차이 ≤1 mm / 0.02° |\n| 최종 유효 | 수렴 뒤 inlier / RMSE / 관측성 모두 통과 |\n\n[ICP 수렴과 저장 스캔 재검증](README.md#icp-수렴과-관측성)을 따릅니다.\n\n`icp_convergence`의 설정 키는 `translation_tolerance_m`, `rotation_tolerance_rad`,\n`max_translation_span_m`, `max_rotation_span_rad`, `max_period`입니다.\n현재 기본값은 각각 `1e-5`, `1e-5`, `0.001`, `0.00034906585039886593`(0.02°), `6`입니다.\n적용값과 각 정합의 `convergence_reason`은 결과에 기록합니다.\n\n`evaluation_config`가 가리키는\n[`wheel_odometry_evaluation.json`](../../configs/mission/wheel_odometry_evaluation.json)에서는\nodom topic, timeout, LiDAR 필터·extrinsic, runtime과 기본 motion 파일을 읽습니다.\n이 프로토콜의 축·P·속도·거리·반복 수는 **validation config가 우선**하며,\nwheel config의 `patterns`나 속도 목록을 수정해도 이 trial 행렬은 바뀌지 않습니다.\n경로는 레포 루트 기준이며 절대 경로도 사용할 수 있습니다.\n\n기본 motion의 정지 공차, 최소속도, 감속과 hold는\n[`motion_settings.json`](motion_settings.json)에서 관리합니다.\nX/Y trial은 축별 P, 두 대각선 trial은 fallback `linear_kp`, yaw trial은\n`yaw_kp`만 실행 중 덮어씁니다. 다른 축의 설정은 보존합니다.\n\n## 2. 시험 전 준비\n\n1. 평탄하고 사람·장애물이 없는 3.5 m × 3.5 m 이상 구역과 물리 emergency\n   stop을 준비합니다. 센서·프로파일과 적재 상태를 고정합니다.\n2. 시작 위치와 heading을 표시합니다. 대각선 0.5 m가 각 축 0.5 m가 아님을\n   확인하고 전체 차체의 회전 공간을 확보합니다.\n3. MCU의 모터 제어 펌웨어, MCU·LiDAR USB 연결과\n   [`wheel_evaluation_runtime.json`](../../ros2_ws/src/cleany_base_driver/config/wheel_evaluation_runtime.json)의\n   by-id 경로를 확인합니다. 다른 teleop·Nav2·평가 명령원을 종료합니다.\n4. 장착 상태와\n   [`lidar_extrinsic_20261116.json`](../../ros2_ws/src/cleany_base_driver/config/lidar_extrinsic_20261116.json)을\n   대조한다. 거리 필터 0.45 m 밖에 서로 다른 방향의 고정 구조물이 보여야 한다.\n5. 아래 offline 검사와 dry-run에서 모든 P=6, 90개 편도와 결과 경로를 확인한다.\n   dry-run은 장치 준비 확인을 대신하지 않으며 ROS 노드나 이동을 시작하지 않는다.\n\n```bash\nmake test-odometry-evaluation\n\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/all_axis_validation.json --dry-run\n```\n\n## 3. 실물 실행과 중단\n\n새 장착·노면·적재 또는 변경한 계수의 첫 시험은 config를 복사해 저속 다섯\ntrial과 `repetitions: 1`만 남겨 먼저 확인합니다. 정상 응답을 확인한 뒤 전체\n행렬을 실행합니다.\n\n```bash\n# 시험 공간과 emergency stop 준비를 확인한 뒤 실행\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/all_axis_validation.json\n```\n\nLauncher는 Agent·base·LiDAR를 준비하고 진행하는 odom·scan·WheelState,\ndisabled·fault-free MCU와 `/base/enable`을 확인합니다.\n주행 전 passive STOP handshake를 완료하며, 주행 중 odom watchdog은 150 ms입니다.\n정상 실행 중인 stack은 재사용합니다.\n\n| `guards` 기본값 | 중단 조건 |\n|---|---|\n| `session_radius_m: 0.75` | 세션 시작 위치에서 wheel-odom 변위 반경 초과 |\n| `cross_track_m: 0.08` | 병진 경로 수직 이탈 또는 회전 중심 병진 이탈 초과 |\n| `translation_overshoot_m: 0.025` | 편도 시작 기준 진행축 변위의 절댓값이 목표 + 25 mm 초과 |\n| `translation_yaw_drift_deg: 10.0` | 병진 중 yaw 변화 절댓값 초과 |\n| `rotation_overshoot_deg: 5.0` | 회전 변화 절댓값이 목표 + 5° 초과 |\n\n경계는 wheel odom 기반 **시험 중단값**이며 외부 정확도의 합격 기준이 아닙니다.\n주행 실패, watchdog, 경계 이탈, STOP·disable 미확인이나 유효하지 않은 ICP는\n후속 시험을 중단합니다. Ctrl+C도 STOP·disable 정리를 요청합니다.\n세션 누적 이탈로 중단되면 원인과 실제 위치를 확인하고 새 실행으로 재시험합니다.\n\nLiDAR health 응답만 있고 실제 scan이 없으면 시작하지 않습니다. 재기동 실패 시\n로그를 보존하고 USB 연결과 scan 수신을 확인한 뒤 새 실행을 시작합니다.\n\n## 4. 기록과 판정\n\n결과는 `artifacts/odometry_evaluation/all_axis_validation/\u003c시각>/`에 저장합니다.\n\n- `config.json`, `evaluation_config.json`, `base_motion_config.json`: 적용 설정.\n- `runtime_ready.json`, `runtime_logs/`: stack 준비 근거와 자체 기동 로그.\n- `rep*_*.json`: 왕복별 제어 trace, 편도·loop ICP, 응답 지표와 endpoint 오차.\n- `*_start.npz`, `*_destination.npz`, `*_returned.npz`, `*_scans.npz`: 원본 스캔.\n- `response_summary.json`, `response.png`: 전체 실행 상태와 응답 비교.\n\n각 축·속도·방향을 분리해 완료 수, 유효 ICP 수, 평균·표준편차·최대값과\n중단 사유를 보고합니다. 서로 다른 P의 결과를 같은 통계에 섞지 않습니다.\n\n1. **제어 응답:** 두 편도의 `is_valid`, `reached_tolerance`와 `metrics.valid`를\n   확인합니다. 현재 병진 진행축 공차 5 mm 또는 yaw 공차 1°와 정지 속도 조건을\n   0.5초 유지해야 합니다. 정착 진입, hold 완료와 1.5초 dwell은 구분합니다.\n   오버슛과 실측 최고 속도도 기록합니다.\n2. **외부 비교:** outbound·inbound·직접 loop ICP의 품질 판정을 확인합니다.\n   병진의 `endpoint_errors`는 wheel 목표 잔차, ICP 목표 차이와\n   `odom_minus_icp`를 구분합니다. yaw는 각 편도의\n   `one_way_error.error_yaw_deg`와 병진 드리프트를 확인합니다.\n   무효 ICP는 `null`과 거부 사유를 유지하고 통계에서 제외합니다.\n3. **전체 완료:** 45개 왕복 record와 90개 정상 편도, 반복 수 및\n   `response_summary.status == \"success\"`를 확인합니다. 이는 설정된 실행·ICP\n   조건의 완료이며 외부 위치 정확도 합격과는 별도입니다. 외부 정확도 판정에는\n   별도로 합의한 위치·yaw 기준과 독립적인 테이프·각도 측정을 사용합니다.\n\n제어 응답만 진단할 때는 복사한 config에서 `require_valid_icp: false`를\n명시할 수 있습니다. 이 경우 결과를 제어 전용으로 표시하며 ICP 거부를 정확도\n검증 성공으로 바꾸지 않습니다. 주행·watchdog·경계 중단은 유지합니다.\n"},"tools/wheel_calibration/README.md":{"title":"휠 속도 추종 진단","body":"# 휠 속도 추종 진단\n\n전후이동과 횡이동에서 네 휠의 목표 속도, 명령 속도, 실제 속도와 PWM을\n수집하고 정상상태 추종 편차와 지면 하중 FF 추정치를 계산합니다.\n순서는 FL, FR, RL, RR입니다.\n\n## 실행\n\n레포 루트에서 실행합니다. 실물 실행은\n[베이스 드라이버](../../docs/implementation/how-to/base.md)의 Agent와\nhardware 프로필 기동 절차를 따릅니다. 사람 없는 평탄한 시험 공간과\n물리 emergency stop을 준비합니다.\n\n```bash\n# 합성 표본 분석만 실행: ROS 연결 및 주행 없음\nbash tools/wheel_calibration/run_wheel_diag.sh --dry-run\n\n# 기본값: 전후와 횡방향 각각 0.5 m 왕복, 0.3 m/s\nbash tools/wheel_calibration/run_wheel_diag.sh \\\n  --pattern both --distance 0.5 --speed 0.3\n```\n\nUbuntu 22.04가 아닌 환경에서는 `ros2-humble` Distrobox로 진입합니다.\n실물 ROS domain은 0입니다. `--pattern surge|sway|both`,\n`--no-round-trip`, `--odom-timeout`, `--baseline`, `--output-dir`를 지원합니다.\n기본 odometry timeout은 0.15초입니다.\n\n## 분석과 보정 기준값\n\n- `controller_baseline.json`은 `esp32/src/main.cpp`의 휠별 FF·Kp·Ki를 보존합니다.\n  테스트가 두 파일의 값 일치를 검사합니다.\n- 목표가 안정되고 명령이 목표를 따라가는 표본만 정상상태 분석에 사용합니다.\n  정방향과 역방향을 분리하며, 표본이 부족하면 보정 권고를 만들지 않습니다.\n- 출력은 진단 근거와 검토용 설정입니다. 펌웨어 설정을 자동 변경하거나\n  업로드하지 않습니다.\n- 보정값을 변경하면 `esp32/src/main.cpp`와 baseline을 함께 갱신하고\n  부하·노면·방향·속도별로 재검증합니다.\n\n주행은 [오도메트리 평가 도구](../odometry_evaluation/README.md)의 공통\n제어·freshness guard를 사용합니다. 중복 주행 도구와 다른 `/cmd_vel`\npublisher를 검사하며, odometry 이상 시 STOP과 disable을 요청합니다.\n\n## 결과와 테스트\n\n기본 출력은 Git 제외 경로인 `artifacts/wheel_calibration/`입니다.\n`wheel_diag_\u003cpattern>_\u003ctimestamp>.json`에 원시 표본, 방향별 통계,\n제어 설정과 펌웨어 소스 해시를 기록합니다. 통계와 matplotlib이 있으면\n같은 이름의 `.png`를 생성합니다.\n\nROS Humble, NumPy, SciPy, matplotlib과 pytest가 필요합니다.\n레포 루트에서 관련 테스트를 실행합니다.\n\n```bash\ndistrobox enter ros2-humble --no-tty --clean-path -- bash -c \\\n  'source /opt/ros/humble/setup.bash &&\n   source ros2_ws/install/setup.bash &&\n   PYTHONNOUSERSITE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \\\n   python3 -m pytest -q tools/wheel_calibration tools/odometry_evaluation'\n\nmake test-motor-core test-base\n```\n"}};
const article=document.getElementById('article');
const search=document.getElementById('search');
const results=document.getElementById('search-results');
let current='docs/index.md', generation=0;
function route(path,section=''){const q=new URLSearchParams({page:path});if(section)q.set('section',section);return '#'+q.toString()}
function resolve(path,base){const parts=path.startsWith('/')?[]:base.split('/').slice(0,-1);for(const p of path.split('/')){if(p==='..')parts.pop();else if(p&&p!=='.')parts.push(p)}return parts.join('/')}
function closeMenu(){document.body.classList.remove('nav-open');document.getElementById('menu').setAttribute('aria-expanded','false')}
function slug(text){return text.toLowerCase().replace(/[^\p{L}\p{N}_\- ]/gu,'').replace(/ /g,'-')}
function convertLinks(root,path){
 for(const el of root.querySelectorAll('[href],[src]')){
  const attr=el.hasAttribute('href')?'href':'src';const raw=el.getAttribute(attr);
  if(!raw||/^(https?:|mailto:|data:|blob:)/i.test(raw))continue;
  if(/^[a-z][a-z0-9+.-]*:/i.test(raw)){el.removeAttribute(attr);continue}
  const cut=raw.indexOf('#');const part=cut<0?raw:raw.slice(0,cut);const section=cut<0?'':decodeURIComponent(raw.slice(cut+1));
  const target=part?resolve(decodeURIComponent(part),path):path;
  if(attr==='href'&&pages[target])el.setAttribute(attr,route(target,section));
  else el.setAttribute(attr,'../'+target+(section?'#'+encodeURIComponent(section):''));
 }
}
async function render(){
 const q=new URLSearchParams(location.hash.slice(1));current=q.get('page')||'docs/index.md';const section=q.get('section');const ticket=++generation;
 const page=pages[current];closeMenu();results.replaceChildren();search.value='';
 if(!page){article.innerHTML='<p class="error">문서를 찾을 수 없습니다. 왼쪽 메뉴나 검색에서 다시 선택하세요.</p>';return}
 document.title=page.title+' · Cleany';document.getElementById('breadcrumb').textContent='문서 / '+page.title;
 const source=document.getElementById('source');source.href='../'+current;source.title=current;
 article.className=current==='docs/index.md'?'home':'';
 article.innerHTML=DOMPurify.sanitize(marked.parse(page.body,{gfm:true}),{USE_PROFILES:{html:true},FORBID_TAGS:['style'],FORBID_ATTR:['style']});
 const counts=new Map();for(const h of article.querySelectorAll('h1,h2,h3,h4')){const id=slug(h.textContent);const n=counts.get(id)||0;counts.set(id,n+1);h.id=id+(n?'-'+n:'')}
 convertLinks(article,current);
 for(const image of article.querySelectorAll('img')){
  image.classList.add('zoomable');image.tabIndex=0;image.setAttribute('role','button');image.title='원본 크기로 보기';image.setAttribute('aria-label',image.alt+' · 원본 크기로 보기');
  const zoom=()=>{const large=document.getElementById('zoom-image');large.src=image.src;large.alt=image.alt;document.getElementById('image-dialog').showModal()};
  image.addEventListener('click',zoom);image.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();zoom()}});
 }

 for(const table of article.querySelectorAll('table')){
  const rows=[...table.querySelectorAll('tbody tr')];if(rows.length<12)continue;
  const box=document.createElement('div');box.className='table-filter';const input=document.createElement('input');input.type='search';input.placeholder='이 표에서 이름·타입·설정 찾기';input.setAttribute('aria-label','표 내용 검색');const count=document.createElement('span');count.textContent=rows.length+'개 행';box.append(input,count);table.before(box);
  input.addEventListener('input',()=>{const query=input.value.toLowerCase();let n=0;for(const row of rows){row.hidden=!row.textContent.toLowerCase().includes(query);if(!row.hidden)n++}count.textContent=n+' / '+rows.length+'개 행'});
 }
 for(const pre of article.querySelectorAll('pre')){
  const code=pre.querySelector('code');if(!code)continue;
  if(code.classList.contains('language-mermaid')){
   pre.className='diagram';try{const diagram=await mermaid.render('diagram-'+ticket+'-'+Math.random().toString(36).slice(2),code.textContent);if(ticket!==generation)return;pre.innerHTML=DOMPurify.sanitize(diagram.svg,{USE_PROFILES:{svg:true,svgFilters:true},FORBID_TAGS:['script']});const svg=pre.querySelector('svg');if(svg?.viewBox.baseVal.width){svg.style.minWidth=Math.ceil(svg.viewBox.baseVal.width*.8)+'px';pre.tabIndex=0;pre.title='넓은 도식은 가로로 스크롤해 확인하세요'}}catch{pre.setAttribute('aria-label','도식 원문')}continue;
  }
  const button=document.createElement('button');button.className='copy';button.textContent='복사';button.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.textContent);button.textContent='복사됨'}catch{button.textContent='선택해 복사';const range=document.createRange();range.selectNodeContents(code);const selection=getSelection();selection.removeAllRanges();selection.addRange(range)}});pre.append(button);
 }
 if(ticket!==generation)return;
