# 취소 방식과 서비스\n\n| 취소 계약 | 의미 |\n|---|---|\n| 서비스 | manipulation/cancel, 활성 execution_id + mode → accepted/message |\n| accepted=true | 요청 수락, 정지 완료 아님 |\n| IMMEDIATE | 현재 완료를 기다리지 않고 중단 요청 |\n| CHECKPOINT | 현재 동작과 필요한 확인까지 완료; 일반 Action cancel 기본 |\n| RETURN_ARM | 중단 / 정지 확인 → 현재 위치 열기 → 팔 복귀 |\n| RETURN_ARM 한계 | MuJoCo 열림 완료 기반; 별도 이탈 / 안착 확인은 초기 정책에 없음 |\n| 선점 | Mode를 진행 / Result에 보존; IMMEDIATE로 선점 가능 |\n| 실패 | 놓기 / 복귀 FAILED, 정지 미확인 FATAL/STOP_UNCONFIRMED |\n\n### 물체 상태와 놓은 결과\n\n| `object_state` | 뜻 |\n|---|---|\n| `NOT_TOUCHED` | 잡거나 움직이지 않았다는 근거가 있음 |\n| `HELD` | 마지막 확인에서 그리퍼로 들고 있음 |\n| `LEFT_GRIPPER` | 그리퍼에서 떠난 것을 확인. 목적지 내부인지는 별도 |\n| `UNKNOWN` | 접촉, 낙하 또는 센서 유실로 상태를 확정할 수 없음 |\n\n| `placement_state` | 뜻 |\n|---|---|\n| `NOT_CHECKED` | 수거함 내부 확인을 아직 수행하지 않음 |\n| `CONFIRMED` | 놓은 뒤 검증 근거로 수거함 내부 위치를 확인 |\n| `NOT_CONFIRMED` | 확인 기능의 성공 조건을 만족하지 못함 |\n| `UNKNOWN` | 확인 timeout 또는 센서 문제로 판단 불가 |\n\n| 놓기 근거 | 판정 |\n|---|---|\n| 열기 명령만 성공 | LEFT_GRIPPER로 확정하지 않음, 추가 근거 없으면 UNKNOWN |\n| 함 내부 검증 성공 | LEFT_GRIPPER / CONFIRMED로 갱신 가능 |\n| VerifyPlacement false | 명시적인 함 밖 판정 아님 |\n| Mock 확인 실패 시나리오 | NOT_CONFIRMED |\n| MuJoCo false | 확인 대기; 기한 초과 시 UNKNOWN / VERIFICATION_TIMEOUT |\n\n[MuJoCo 센서 / 정지 계약](../../cleany_manipulation_bt/docs/execution-contract.md#정상-수거의-놓기정지-확인)을 따릅니다.\n\n### 예시로 읽기\n\n| 상황 | 상태 | 물체 / 놓은 결과 | 중요한 점 |\n|---|---|---|---|\n| 수거와 확인, 팔 복귀 완료 | `SUCCESS` | `LEFT_GRIPPER / CONFIRMED` | 정지와 복귀도 확인 |\n| 시작 전에 snapshot이 없음 | `BLOCKED` | `NOT_TOUCHED / NOT_CHECKED` | 새 관찰 필요 |\n| 운반 중 물체 상태를 잃음 | `FAILED` | `UNKNOWN / NOT_CHECKED` | 정지와 재관찰 필요 |\n| Mock의 확인 실패 시나리오 | `FAILED` | 확인된 상태 / `NOT_CONFIRMED` | 밖에 있다고 단정하지 않음 |\n| MuJoCo에서 안착 확인 기한 초과 | `FAILED` | 마지막 확인 상태 / `UNKNOWN` | false 응답만으로 즉시 실패하지 않음 |\n| 놓기는 확인됐지만 팔 복귀 실패 | `FAILED` | `LEFT_GRIPPER / CONFIRMED` | 실제 수거 증거 보존 |\n| 취소 후 물체를 든 채 정지 | `CANCELED` | `HELD / NOT_CHECKED` | 베이스 자동 복귀 금지 |\n| 취소 후 정지 확인 불가 | `FATAL` | 마지막 확인 상태 / 기존 확인 상태 | 신규 Goal 차단 |\n\n| 성공 Result 필드 | 필수값 |\n|---|---|\n| error_code / failed_stage | NONE / 빈 문자열 |\n| last_completed_stage | VERIFYING_PLACEMENT; FINALIZING은 보관 단계 |\n| object_state / placement_state | LEFT_GRIPPER / CONFIRMED |\n| 팔 ID | 존재 |\n| stop_confirmed / arm_recovered | true / true |\n| retryable | false |\n\n| 종료 / 재시도 | 규칙 |\n|---|---|\n| 실패 / 취소 | 확인된 물체와 놓기 상태 보존 |\n| CANCELED | error_code=CANCELED, retryable=false; 취소 관찰 단계를 failed_stage로 기록 |\n| 정지 실패 | 단계와 별도로 STOP_UNCONFIRMED 원인 보존 |\n| 실행 후 실패 / 치명 오류 | 기본 retryable=false |\n| 준비 중 일시 오류 | 정지 / 미접촉 근거가 있을 때만 true 후보 |\n| 미확인 물리 상태 | false 또는 UNKNOWN; 성공값 추정 금지 |\n\n## ROS 정의\n\n값 목록은 위 표를 따르며 Python core는 문자열 Enum을 사용합니다.\n아래 필드는 [실제 Action 정의](../../cleany_interfaces/action/ExecuteManipulationSkill.action)와 같습니다.\n\n```text\n# Goal\nstring mission_id\nstring task_id\nstring execution_id\nstring skill_name\nstring snapshot_id\nuint32 object_id\nstring destination_id\n---\n# Result\nstring execution_id\nstring execution_profile\nstring status\nstring error_code\nstring failed_stage\nstring last_completed_stage\nstring object_state\nstring placement_state\nstring selected_arm\nbool stop_confirmed\nbool arm_recovered\nbool retryable\nstring message\nstring failed_substage\nstring cancel_mode\n---\n# Feedback\nstring execution_id\nstring stage\nstring substage\nstring selected_arm\nstring message\n```\n\n## 오류와 후속 결정\n\n구현 오류 목록: `NONE`, `INVALID_ARGUMENT`, `TARGET_UNAVAILABLE`, `STALE_TARGET`,\n`DESTINATION_UNAVAILABLE`, `BACKEND_NOT_READY`, `VERIFICATION_UNAVAILABLE`,\n`GRASP_FAILED`, `GRASP_LOST`, `MOTION_FAILED`, `PLACEMENT_NOT_CONFIRMED`,\n`VERIFICATION_TIMEOUT`, `TIMEOUT`, `CANCELED`, `E_STOP`, `HARDWARE_ERROR`,\n`STOP_UNCONFIRMED`, `INTERNAL_ERROR`.\n\n| 실행 기록 / 후속 결정 | 계약 |\n|---|---|\n| ID | Client 발급, 테스트 client UUID4 |\n| 저장 실패 | 경고만 남기고 실제 status/error_code 유지; 저장 실패만으로 동작 / 신규 Goal 차단 안 함 |\n| Fault 병행 | Hardware / E-stop / 정지 미확인 FATAL과 물리 상태 차단 유지 |\n| 조회 | 메모리 최신값, 디스크 저장 보장 아님 |\n| Record | Goal / 진행 / Result, record_state, has_result, human_confirmation_required, revision, Unix ns |\n| has_result=false | 가짜 status/error_code 생성 안 함 |\n| 미결정 | 제품 snapshot 보존, 실물 정지 / verifier, 허용 client |\n\nAdapter 대응은 [서버 명세](manipulation-server-behavior-spec.md)와 [Mission 연결](../../cleany_mission_manager/docs/manipulation-mock-integration.md)을 따릅니다.\n"},"ros2_ws/src/cleany_skill_executor/docs/interfaces.md":{"title":"cleany_skill_executor 노드 인터페이스","body":"# cleany_skill_executor 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## grasp_selection_server\n\n실행 파일: `grasp_selection_server`. 원본: [grasp_selection_node.py](../cleany_skill_executor/grasp_selection_node.py), [moveit_adapter.py](../cleany_skill_executor/moveit_adapter.py), [planning_scene.py](../cleany_skill_executor/planning_scene.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | R20; `joint_state_topic` |\n| 액션 제공 | `grasp/select_reachable` | `cleany_interfaces/action/SelectReachableGrasp` | Action 기본값 |\n| 서비스 호출 | `/compute_ik` | `moveit_msgs/srv/GetPositionIK` | Service 기본값 |\n| 서비스 호출 | `/check_state_validity` | `moveit_msgs/srv/GetStateValidity` | Service 기본값 |\n| 서비스 호출 | `/apply_planning_scene` | `moveit_msgs/srv/ApplyPlanningScene` | Service 기본값 |\n| 서비스 호출 | `/get_planning_scene` | `moveit_msgs/srv/GetPlanningScene` | Service 기본값 |\n| 액션 호출 | `/move_action` | `moveit_msgs/action/MoveGroup` | Action 기본값; plan-only |\n\n도달성 검사 action이며 controller 실행을 제공하지 않습니다.\n\n현재 조작 실행은 [nearest-pregrasp와 sorting 계약](manipulation.md)을 따릅니다. 이전 demo coordinator는 제거됐습니다.\n\n## manipulation_server\n\n실행 파일: `manipulation_server`. 원본: [manipulation_node.py](../cleany_skill_executor/manipulation_node.py). Mock launch는 `/mock` namespace를 적용합니다.\n\n| 종류 / 방향 | 기본 상대 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 액션 제공 | `manipulation/execute_skill` | `cleany_interfaces/action/ExecuteManipulationSkill` | Action 기본값 |\n| 서비스 제공 | `manipulation/get_execution` | `cleany_interfaces/srv/GetManipulationExecution` | Service 기본값 |\n| 서비스 제공 | `manipulation/cancel` | `cleany_interfaces/srv/CancelManipulation` | Service 기본값 |\n| 토픽 발행 | `manipulation/execution_events` | `cleany_interfaces/msg/ManipulationExecutionRecord` | Reliable, transient-local depth 100; record 변경 시 |\n| 서비스 호출 | `manipulation/execute_skill/_action/cancel_goal` | `action_msgs/srv/CancelGoal` | 정확한 Goal의 cancel 응답 경로 |\n\nTick 기본 주기는 steady clock 0.05초입니다. 물리 명령 publisher는 없습니다. Mission은 취소 service의 별도 모드 대신 ROS Action cancel의 CHECKPOINT를 사용합니다.\n\nAction 이름을 remap하면 서버와 내부 CancelGoal client가 같은 해결된 이름을 사용합니다. 예를 들어 `manipulation/execute_skill:=/custom/execute`에서는 내부 취소 요청도 `/custom/execute/_action/cancel_goal`로 전달합니다.\n\n수락, 기록과 취소의 의미는 [공통 Action 계약](../../cleany_interfaces/docs/observation-contracts.md#단일-물체-manipulation-action)을 따릅니다.\n\n## arm_health_monitor\n\n실행 파일: `arm_health_monitor`. 원본: [arm_health_node.py](../cleany_skill_executor/arm_health_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `system/component_health` | `cleany_interfaces/msg/ComponentHealth` | R10; 20 Hz; `health_topic`, `source=arm` |\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `joint_states_topic` |\n| 서비스 호출 | `controller_manager/list_controllers` | `controller_manager_msgs/srv/ListControllers` | Service 기본값; `poll_s` 0.5초, `controller_manager` |\n\n설정한 arm controller(`controllers`)가 모두 `active`이고 설정한 관절(`joints`)의 위치가 fresh, finite일 때만 AVAILABLE입니다. Controller 상태를 확인할 수 없거나 관절을 한 번도 받지 못했으면 UNKNOWN, 비활성 또는 끊긴 feedback은 UNAVAILABLE입니다. 가용성만 보고하며, 현재 팔 상태로 base가 움직여도 되는지는 Mission Runtime이 조작 결과의 `safe_to_drive`로 판단합니다. 실물 arm controller에서는 검증하지 않았습니다.\n\n## manipulation_monitor\n\n실행 파일: `manipulation_monitor`. 원본: [manipulation_monitor_node.py](../cleany_skill_executor/manipulation_monitor_node.py).\n`event_topic` 기본값 `/mock/manipulation/execution_events`를 Reliable, transient-local,\ndepth 100으로 구독합니다. `monitor_port`의 localhost ZeroMQ REP socket은 읽기 전용\n트리 상태를 제공하며 ROS Action을 실행하거나 취소하지 않습니다.\n\n## manipulation_test_client\n\n실행 파일: `manipulation_test_client`. 원본: [manipulation_client.py](../cleany_skill_executor/manipulation_client.py).\n`namespace` 옵션으로 선택한 서버의 `manipulation/execute_skill` Action과\n`manipulation/get_execution`, `manipulation/cancel` 서비스를 호출한다.\n요청, 취소와 결과 확인 예시는 [실행 안내](manipulation-mock-usage.md)를 따른다.\n\n\n## physical_grasp_selection_server\n\n실물 후보를 검증하고 준비 자세, 파지 자세의 시간 궤적을 반환한다. 실행 명령은 보내지 않는다.\n기존 `grasp_selection_server`와 같은 Action 이름을 사용하므로 함께 실행하지 않는다.\n\n| 방향 | 기본 이름 | 타입과 의미 |\n|---|---|---|\n| Action 제공 | `grasp/select_reachable` | `SelectReachableGrasp`; `action_name`으로 변경 |\n| 서비스 제공 | `/grasp/warmup_status` | `std_srvs/srv/Trigger`; 예열 준비 상태 |\n| 서비스 제공 | `/grasp/vlm_warmup` | `std_srvs/srv/SetBool`; VLM 대기 구간 알림 |\n| 서비스 호출 | `/check_state_validity_batch` | `CheckStateValidityBatch`; 전체 상태의 배치 검사 |\n| 구독 | `joint_states` | `sensor_msgs/msg/JointState`, depth 20; `joint_state_topic` 기본값 |\n| 구독 | `/robot_description` | `std_msgs/msg/String`; transient-local |\n\nMoveIt IK, FK, 장면 조회, 변경과 `/move_action`도 사용한다.\n상세 실행 조건은 [실물 파지 계획](physical-pregrasp.md)을 따른다.\n\n## validate_pick_server\n\n`grasp/validate_pick` Action(`cleany_interfaces/action/ValidatePick`)은 인식, 후보 생성,\n도달성 검사를 연결한다. 기본 downstream은 `perception/inspect_scene`, `grasp/plan`,\n`grasp/select_reachable`이며 각각 이름 파라미터로 바꿀 수 있다.\n`pin_object_reference=true`이면 `/perception/observe_object_reference`로 기준 물체를 등록한다.\n`grasp/validate_pick_debug`는 `sensor_msgs/msg/Image`, reliable, transient-local depth 1이다.\nAction 결과는 계획 근거이며 실물 수거 성공을 뜻하지 않는다.\n\n## 준비 자세 실행 도구\n\n`pregrasp_pipeline`은 기본 plan-only이며 `mujoco` 모드를 선택할 수 있다.\n`hardware_pregrasp`는 `/grasp/validate_pick`, 기준 물체 관찰과 controller 상태 조회를\n사용하고 `/{arm}_{arm|gripper}_controller/follow_joint_trajectory` Action으로 준비 자세를\n실행한다. `/joint_states`와 `/robot_description`을 읽으며 controller를 자동 활성화하지 않는다.\n`pregrasp_sim_ready`는 시뮬레이션 시작 상태를 확인하는 명시 실행 도구다.\n\n## collection_pipeline\n\n`collection_pipeline`은 기존 인식, 경로 계획과 제어 런타임에 연결하는 명시 실행 도구다.\n`--execute`가 없으면 ROS 노드를 만들지 않고 로컬 설정만 검사한다. 실행 시에는\n[준비 자세 도구](#준비-자세-실행-도구)의 입력에 `manipulation/check_evidence`\n(`cleany_interfaces/srv/CheckManipulation`) client를 추가한다.\n[실물 수거 계약](physical-collection.md)을 따른다.\n\n## manipulation_evidence\n\n실행 파일 `manipulation_evidence`는 모터와 손목 관측에서 읽기 전용 근거를 제공한다.\n\n| 종류 | 기본 경로 | 타입 | 의미 |\n|---|---|---|---|\n| Subscription | `/joint_state_broadcaster/dynamic_joint_states` | `control_msgs/msg/DynamicJointState` | 원시 모터 피드백 |\n| Subscription | `/perception/wrist_tracking_status` | `cleany_interfaces/msg/WristTrackingStatus` | 대상 식별과 관측 시각 |\n| Subscription | `/real_control/status` | `std_msgs/msg/String` | 실물 guard 상태 JSON |\n| Subscription | `/perception/manipulation_outcome` | `cleany_interfaces/msg/ManipulationOutcome` | 독립된 놓기와 이탈 확인 |\n| Service server | `/manipulation/check_evidence` | `cleany_interfaces/srv/CheckManipulation` | arm, reference, snapshot, object, destination과 after stamp에 해당하는 근거 |\n\n근거의 나이와 모터와 카메라의 시간 차이를 검사하고 실패한 guard를 ready 메시지만으로 해제하지 않는다.\n\n선택기의 `pregrasp_z_offset_m`, `maximum_path_candidates`, `curobo_ik_endpoint_margin_rad`와 공통 실행 설정은 [공통 파지 설정](shared-grasp-policy.md)을 따른다. ROS endpoint와 메시지 타입은 바뀌지 않는다.\n\n실물 지원 launch의 `start_head_camera=false`는 기존 헤드 RGB-D와 TF bridge를 공유하며, GPU 선택기·장면 처리·ValidatePick은 계속 시작한다. 기본값 true는 기존 센서 시작 동작을 유지한다. [공유 계약](shared-grasp-policy.md#dev-monitor와-운영-인식-공유)을 따른다.\n"},"ros2_ws/src/cleany_skill_executor/docs/manipulation-action-design.md":{"title":"매니퓰레이션 Action 설계 안내","body":"# 매니퓰레이션 Action 설계 안내\n\n한 Goal은 승인된 물체 하나의 조작을 요청합니다. Gazebo 미션은 Mock 조작 서버와 연동할 수 있습니다. 고정 베이스 MuJoCo에서는 BT Action 서버가 인식·MoveIt·그리퍼를 연결합니다. Jetson에서 실물 수거를 실행하는 조건은 [실물 수거 가이드](physical-collection.md)를 따릅니다.\n\n| 바로 확인할 내용 | 문서 |\n|---|---|\n| 모델 없이 실행·취소·조회 | [Mock 사용법](manipulation-mock-usage.md) |\n| MuJoCo·인식·MoveIt 연동 실행 | [BT 서버 README](../../cleany_manipulation_bt/README.md) |\n| Goal·Feedback·Result 필드 | [공통 Action 명세](execute-manipulation-skill-action-spec.md) |\n| Mission Manager와 연결할 책임 | [Gazebo 미션과 Mock 조작 연동](../../cleany_mission_manager/docs/manipulation-mock-integration.md) |\n\n## 행동의 실행 단위\n\n**Mission Manager가 행동 하나를 승인하고, Manipulation Action 서버가 그 행동의\n팔과 그리퍼 동작을 수행한 뒤 결과를 돌려줍니다.**\n\n예를 들어 `collect_trash(물체 3번)`을 한 번 요청하면 서버가 접근, 집기, 들기,\n수거함으로 운반, 그리퍼를 열어 놓기, 팔 복귀와 놓은 결과 확인을 처리합니다.\n이 세부 동작마다 Mission Manager를 다시 호출하지 않습니다.\n다음 물체는 결과 재관찰 후 Planner가 제안하고 Mission Manager가 승인합니다.\n\n| 질문 | 답 |\n|---|---|\n| 여러 물체도 처리하는가? | 행동 하나 실행, 재관찰과 다음 제안을 반복해 여러 물체를 처리합니다. |\n| Goal 하나가 책상 전체를 정리하는가? | 이번 명세의 Goal은 승인된 high-level 행동 하나입니다. |\n| 인식만 별도로 사용할 수 있는가? | Perception의 `InspectScene`은 독립 Action으로 계속 사용할 수 있습니다. |\n| 모든 팔 동작을 Mission Manager가 지시하는가? | 접근, 들기, 운반 등의 동작은 Skill Executor 내부에서 처리합니다. |\n| 서버 개발에 Mission Manager 완성이 필요한가? | 같은 검증 조건을 갖춘 테스트 클라이언트와 mock port로 개발할 수 있습니다. |\n\n## 구성 요소별 책임\n\n| 담당 | 역할 | 예시 |\n|---|---|---|\n| Mission Manager | 행동 승인, 실행 요청, 결과 기록과 재관찰, 전체 미션 보고 | 이 단계에서 수거를 허용할지 검사 |\n| Planner | 최신 장면과 이전 결과로 다음 행동 또는 완료 제안 | 물체 3번을 먼저 수거하자 |\n| Perception | 물체, 이미지 영역과 3D 정보 제공 | 물체 3번의 bbox와 위치 |\n| Manipulation Action 서버 | 행동 하나의 실행 순서, Feedback와 Result 관리 | 접근부터 놓은 결과 확인까지 |\n| Motion 또는 VLA backend | 동작 생성, 물리 제약 검사, 실행과 정지 | MoveIt, controller와 실험 후 선택할 VLA adapter |\n| 관측 전달 기능 | 같은 장면의 원본 이미지와 정보를 묶어 전달 | overlay를 위한 자료 |\n| Backend와 Dashboard | 관측 저장, overlay와 최종 결과 표시 | 전후 사진과 미처리 대상 |\n\nPerception 모델과 Planner adapter, Skill 내부 VLA와 MoveIt 조합은 KB의 실험 후보입니다.\n현재 시뮬레이션 구현이 제품의 최종 모델이나 분실물 처리 정책을 결정하지 않습니다.\n\n### Action 서버 구현과 목표 MVP의 관계\n\n| 단계 | 확인할 내용 |\n|---|---|\n| Rule-based 통합 검증 | 규칙 기반 Planner와 실행 계층을 연결해 Goal, 물리 실행 결과, 재관찰과 보고를 검증 |\n| 목표 MVP | 위 흐름에 AI의 다음 행동 제안과 **VLA 기반 Manipulation Skill의 물리 실행 및 결과 관찰**을 포함 |\n\nAction 서버는 기존 MoveIt 및 controller port나 mock으로 먼저 개발할 수 있습니다.\n이 검증만으로 목표 MVP를 완료했다고 보고하지 않습니다. 목표 MVP에는 VLA 기반 실행과\n관찰 결과로 다음 행동 또는 완료를 판단하는 검증이 추가로 필요합니다.\nVLA 모델, adapter와 MoveIt의 조합은 실험 후 선택하며 이 명세에서 확정하지 않습니다.\n단계별 통과 조건은 [KB Success Criteria](../../../../docs/cleany-docs/10_PLANNING/05%20-%20Success%20Criteria.md)를 따릅니다.\n\n### ROS 서버를 세부 동작마다 만드는가\n\n제안하는 Manipulation Action endpoint는 하나입니다. 접근, 집기, 들기와 운반은 내부 함수\n또는 BT 노드로 연결합니다. 기존 Perception의 `InspectScene`, 파지 선택의\n`SelectReachableGrasp`는 별도 Action이고, `PlanGrasp`와 `VerifyPlacement`는 기존 Service입니다.\nService는 잡을 자세나 확인 결과를 요청하는 호출이며 Mission Manager의 새 상태가 아닙니다.\nTask Planner의 다음 행동 제안과 `PlanGrasp`의 grasp 계산도 서로 다른 책임입니다.\n\n## 책상에 도착한 뒤의 전체 흐름\n\n```mermaid\nflowchart TD\n    START[\"작업 전 스캔과 Planner 제안\u003cbr/>첫 이미지, bbox와 분류 자료 준비·전달\"] --> D{\"Planner의 제안은?\"}\n    D -->|\"물체 수거\"| V{\"Mission Manager가\u003cbr/>실행을 허용하는가?\"}\n    V -->|\"허용\"| A[\"Action Goal 전송\u003cbr/>접근 → 집기 → 들기\u003cbr/>운반 → 놓기 → 팔 복귀 → 확인\"]\n    V -->|\"보류 또는 실행 불가\"| B[\"새 Goal을 보내지 않음\u003cbr/>이유 기록, 재판단 또는 종료\"]\n    B -.->|\"재판단을 허용한 경우\"| PL[\"최신 Scene과 이전 결과로\u003cbr/>Planner에 다시 제안 요청\"]\n    A --> R{\"Result 이후\u003cbr/>재판단을 계속할 수 있는가?\"}\n    R -->|\"안전 조건 충족, 취소·치명 오류 없음\"| OBS[\"결과 기록과 재관찰\"]\n    OBS --> PL\n    PL --> D\n    R -->|\"취소 또는 치명 오류 등으로 종료\"| STOP[\"안전 종료와 진행 기록\u003cbr/>가능한 관찰 및 종료 보고\"]\n    B -->|\"종료를 결정한 경우\"| STOP\n    D -->|\"작업 완료\"| F[\"새 수거 Goal을 보내지 않음\u003cbr/>최종 관찰과 처리 기록 확인\"]\n    F --> C{\"완료 제안과\u003cbr/>관찰·기록이 일치하는가?\"}\n    C -->|\"일치\"| END[\"안전 조건을 확인해 복귀\u003cbr/>전후 자료와 최종 결과 보고\"]\n    C -->|\"불일치\"| M[\"불일치 기록\u003cbr/>재판단 또는 실패 종료\"]\n    M -.->|\"재판단을 허용한 경우\"| PL\n    M -->|\"실패 종료를 결정한 경우\"| STOP\n```\n\n**Action 서버는 켜진 채로 대기합니다. 실행할 물체 수거가 승인된 경우에만 새 Goal을 받습니다.**\n\n| 상황 | Mission Manager가 하는 일 |\n|---|---|\n| Planner가 물체 3번 수거를 제안하고 검증을 통과 | 물체 3번의 Action Goal 전송 |\n| Planner가 작업 완료를 제안 | 새 수거 Goal 없이 최종 관찰과 기록 확인 |\n| 제안이 허용 기능 또는 인자 검증을 통과하지 못함 | Goal 없이 이유 기록. 재판단하거나 차단 결과로 종료 |\n| 미션 취소 또는 치명 오류 | 안전 종료 경로로 이동. 새 수거 Goal 전송 금지 |\n\n이 표는 Mission Manager가 Goal을 보내기 전의 판단입니다. Goal을 보낸 뒤 서버가\n거절하거나 수락 후 `BLOCKED`를 반환하는 경우는 [Action 수락 명세](execute-manipulation-skill-action-spec.md)의 별도 처리입니다.\n첫 관측의 원본 이미지 전달과 수신 확인 계약은 Mission 연동 단계에서 추가 결정해야 합니다.\n위 그림의 재판단은 안전 조건과 종료 정책을 확인한 경우에만 수행합니다.\n치명 오류와 취소는 종료 및 안전 경로로 연결하고 새 Goal을 자동으로 보내지 않습니다.\n취소 뒤 안전하게 관찰할 수 있어도 다음 행동 실행을 재개하지 않습니다.\n\n**빈 장면이나 실행할 제안이 없다는 사실만으로 성공을 결정하지 않습니다.**\nPlanner의 완료 제안, 최종 관찰, 처리 기록과 남은 대상을 함께 확인합니다.\n\n## 승인된 행동 하나의 내부 동작\n\n```mermaid\nflowchart LR\n    V[\"입력과 준비 조건 확인\"] --> G[\"물체와 잡을 자세 준비\"]\n    G --> A[\"접근\"] --> P[\"집기\"] --> L[\"들기와 잡은 상태 확인\"]\n    L --> T[\"수거함으로 운반\"] --> O[\"그리퍼를 열어 놓기\"]\n    O --> R[\"팔 복귀\"] --> C[\"놓은 결과 확인\"] --> END[\"결과 반환\"]\n```\n\n선택 물체의 3D 조회나 집기 전 위치 확인은 행동의 준비 과정에 포함할 수 있습니다.\n서버는 다른 물체를 선택하거나 전체 장면에서 새 high-level 행동을 계획하지 않습니다.\n집기 전 장면이 달라졌다면 이전 Goal을 차단하고 Mission Manager가 재관찰합니다.\n\n## 실행과 결과 확인\n\n- Goal과 결과 필드, 취소 후의 상태는 [Action 인터페이스](execute-manipulation-skill-action-spec.md)에서 확인합니다.\n- 준비 조건, 단계별 실패, 실행 기록의 조회는 [서버 동작](manipulation-server-behavior-spec.md)을 따릅니다.\n- MuJoCo 실행기의 트리와 관찰 방법은 [BT 서버](../../cleany_manipulation_bt/README.md), 설계용 XML의 노드와 포트는 [BT 설계](manipulation-behavior-tree-design.md)에 있습니다.\n"},"ros2_ws/src/cleany_skill_executor/docs/manipulation-behavior-tree-design.md":{"title":"Manipulation 행동 내부의 Behavior Tree와 Groot2","body":"# Manipulation 행동 내부의 Behavior Tree와 Groot2\n\n> **모의 서버용 정적 설계 미리보기.** 이 XML과 포트는 표시·설계 자료입니다.\n> 현재 ROS Action wrapper는 Python 모의 core를 실행하며 이 XML을 실행하지 않습니다.\n> 실제 MuJoCo BT.CPP 실행기는 [cleany_manipulation_bt](../../cleany_manipulation_bt/README.md)에 별도 구현되어 있습니다.\n\n| 트리 | 용도 | 실행·표시 방식 |\n|---|---|---|\n| [groot2_table_cleanup.xml](groot2_table_cleanup.xml) | 모의 서버의 설계·모니터 표시 | Python 모의 core의 이벤트를 투영 |\n| [collect_trash_mujoco.xml](../../cleany_manipulation_bt/trees/collect_trash_mujoco.xml) | MuJoCo Action의 실행 순서 | BehaviorTree.CPP 4 실행기 |\n\n로컬 테스트에서는 [VS Code 모니터 브리지](manipulation-mock-usage.md#vs-code에서-로컬-트리-모니터링)로\n모의 core의 실행 이벤트를 XML 노드 상태에 투영할 수 있습니다. 이 표시는 BT.CPP 실행기 채택이나\nXML tick 실행을 의미하지 않습니다.\n\n## 무엇을 트리로 보여주는가\n\n**이번 트리는 `collect_trash` 행동 하나의 내부 순서를 보여줍니다.**\n\n| 바깥 흐름 | 트리 내부 |\n|---|---|\n| Mission Manager와 Planner의 제안, 승인 및 재관찰 | 대상 준비, 접근, 집기, 들기, 운반, 놓기, 팔 복귀와 확인 |\n| 다음 물체 선택, 책상 완료와 미션 보고 | 현재 행동의 진행, 실패 처리와 결과 보관 |\n\n여러 물체는 바깥 흐름에서 Goal을 다시 승인해 처리합니다. XML 안에 전체 책상\nscan 반복이나 Planner 호출을 넣지 않습니다.\n\n| 준비 또는 인식 과정 | 실행 위치 |\n|---|---|\n| Action 서버 시작, 모델 로딩과 워밍업 | 서비스 시작 과정. 수거 Goal마다 다시 실행하지 않음 |\n| 책상 전체 최초 관찰, 대상 선택과 승인 | 상위 Mission Manager 및 Perception 흐름 |\n| 모델과 실행 backend 준비 여부 확인 | 수거 트리의 `ValidateGoal` |\n| 전달받은 관측 확인, 선택 물체 3D 복원과 파지 준비 | 수거 트리의 `PREPARING_TARGET` 세부 단계 |\n\n이 문서의 모의 경로에서 준비 확인과 인식 관련 세부 단계는 모의 결과입니다.\nMuJoCo BT 경로는 실제 모델과 Perception을 사용하며 위 링크의 실행 계약을 따릅니다.\n\n## 정상 경로와 실패 경로\n\nXML의 정상 경로는 네 개의 Sequence 그룹으로 묶습니다. 세부 실행 순서는 유지합니다.\n\n| 그룹 | 세부 단계 |\n|---|---|\n| 준비 | 모델과 실행 준비 확인, 대상 관측 확인, 선택 물체 3D 복원, 파지 후보 생성, 팔과 경로 결정 |\n| 물체 잡기 | 잡기 전 위치 이동, 물체 접근, 그리퍼 닫기, 파지 확인, 물체 들어 올리기, 보유 상태 확인 |\n| 물체 놓기 | 수거함 이동, 놓을 위치 확인, 그리퍼 열기, 물체 이탈 확인, 팔 복귀 |\n| 확인과 종료 | 놓은 결과 확인, 성공 결과 보관 |\n\nVS Code 모니터에서는 그룹도 자식 단계의 진행·완료·실패를 표시합니다.\nXML을 변경한 뒤에는 브리지를 재시작하고 뷰어의 Monitor를 다시 연결합니다.\n\n```mermaid\nflowchart TD\n    N[\"승인된 Goal\"] --> V[\"검증과 대상 준비\"]\n    V --> A[\"접근\"] --> G[\"집기\"] --> L[\"들기와 잡은 상태 확인\"]\n    L --> T[\"운반\"] --> P[\"그리퍼를 열어 놓기\"]\n    P --> R[\"팔 복귀\"] --> C[\"놓은 결과 확인\"]\n    C --> OK[\"성공 결과 보관\"]\n    V -.->|\"차단 또는 실패\"| STOP[\"동작 종료와 상태 확인\"]\n    A -.-> STOP\n    G -.-> STOP\n    L -.-> STOP\n    T -.-> STOP\n    P -.-> STOP\n    R -.-> STOP\n    C -.-> STOP\n    STOP --> ERR[\"실제 진행과 실패 결과 보관\"]\n```\n\n`Sequence`는 노드를 순서대로 실행합니다. 한 노드가 실패하면 뒤의 정상 노드는 실행하지 않습니다.\n`Fallback`은 정상 Sequence 실패 후 종료 및 결과 보관 경로를 실행합니다.\nBT의 SUCCESS와 FAILURE는 실행 순서 제어용 값이며 ROS Action의 최종 상태와 별도입니다.\n예를 들어 준비 차단은 BT 정상 경로 실패여도 Result는 `BLOCKED`일 수 있습니다.\n\n## XML에서 보여주는 노드\n\n| 노드 | 동작 | 대응 Feedback |\n|---|---|---|\n| `ValidateGoal` | 모델과 실행 준비 확인 | `VALIDATING` |\n| `PrepareTarget` | 전달받은 대상 관측 확인 | `PREPARING_TARGET` |\n| `ReconstructTarget` | 선택 물체 3D 복원 | `PREPARING_TARGET` |\n| `GenerateGrasp` | 파지 후보 생성 | `PREPARING_TARGET` |\n| `SelectArmAndPath` | 팔과 경로 결정 | `PREPARING_TARGET` |\n| `MoveToPregrasp` | 잡기 전 위치 이동 | `APPROACHING` |\n| `ApproachObject` | 물체 접근 | `APPROACHING` |\n| `GraspObject` | 그리퍼 닫기 | `GRASPING` |\n| `ConfirmGrasp` | 파지 확인 | `GRASPING` |\n| `LiftObject` | 물체 들어 올리기 | `LIFTING` |\n| `ConfirmHeld` | 보유 상태 확인 | `LIFTING` |\n| `CarryObject` | 물체를 든 채 목적지 이동 | `TRANSPORTING` |\n| `CheckPlacementTarget` | 놓을 위치 확인 | `PLACING` |\n| `OpenGripperAtDestination` | 그리퍼 열기 | `PLACING` |\n| `ConfirmRelease` | 물체 이탈 확인 | `PLACING` |\n| `ReturnArm` | backend의 목표 자세로 복귀 | `RETURNING_ARM` |\n| `VerifyPlacedObject` | 놓은 뒤 수거함 내부 확인 | `VERIFYING_PLACEMENT` |\n| `FinalizeSuccess` | 성공 조건과 기록 확인, Result 생성 | `FINALIZING` |\n| `StopAndAssess` | 하위 goal 종료, 정지와 물체 상태 확인 | `STOPPING` |\n| `ReleaseInPlace` | `RETURN_ARM` 취소 중 현재 위치에서 그리퍼 열기 | `RELEASING_IN_PLACE` |\n| `ReturnArmAfterCancel` | `RETURN_ARM` 취소 중 팔 복귀 | `RECOVERING_ARM` |\n| `FinalizeFailure` | 차단, 실패, 취소 또는 fault Result 보관 | `FINALIZING` |\n\n동작 노드는 명령 전과 물리 근거를 얻은 직후 진행을 기록합니다. 집기와 그리퍼 열기\n기록을 트리 끝의 Finalize에만 맡기지 않습니다. 물체를 놓은 뒤 검증이 실패해도 놓기\n명령과 실제 물체 상태를 보존합니다.\n\n모의 서버는 큰 `stage` 안의 현재 `substage`와 `completed_substages`를 기록합니다.\n브리지는 완료 이벤트가 있는 세부 단계만 초록색으로 표시합니다. 그리퍼 닫기 완료는\n물체 보유 근거가 아니며, 이탈 근거가 없는 `release_unobserved` 시나리오에서는\n`ConfirmRelease`를 완료로 표시하지 않습니다. 이후 독립 수거함 확인으로 성공할 수 있습니다.\n세부 단계 추가가 기존 집기, 들기와 놓기의 원자 구간 취소 규칙을 바꾸지는 않습니다.\n\n기본 `CHECKPOINT` 외의 취소 방식과 복귀 경로의 제한은\n[취소 계약](execute-manipulation-skill-action-spec.md#취소-방식과-서비스)을 따릅니다.\n모의 XML의 복귀 노드는 이벤트 표시용이며 수거함 배치 성공을 나타내지 않습니다.\n\n`VerifyPlacedObject`는 이번 verified Action에서 생략하지 않습니다. 확인 기능이 없으면\n시작 검증에서 차단합니다. 기존 GUI simulation의 확인 생략 경로는 별도 demo입니다.\n\n## Blackboard와 포트 후보\n\n| Blackboard key | 내용 |\n|---|---|\n| `goal` | 승인된 Action Goal |\n| `execution` | 물체와 팔 상태, 마지막 완료 단계, 계획과 검증 근거 |\n| `error` | 원인과 실패 단계. 시작 시 NONE |\n| `result` | 최종 Action Result |\n\n| XML 포트 | 방향 | 연결 |\n|---|---|---|\n| `goal` | 입력 | `{goal}` |\n| `context_in` | 입력 | `{execution}` |\n| `context_out` | 출력 | `{execution}` |\n| `error` | 오류 출력 또는 종료 노드 입력 | `{error}` |\n| `error_in`, `error_out` | 종료 분석의 입력과 출력 | `{error}` |\n| `result` | 출력 | `{result}` |\n\n`SkillGoal`, `SkillContext`, `SkillError`와 `SkillResult`는 화면 표시용 타입 이름입니다.\n현재 C++ 또는 Python class가 있다는 뜻이 아닙니다. 실제 typed 모델과 변환 규칙은 구현해야 합니다.\nGroot2에서 포트와 연결 이름을 볼 수 있지만 정적 XML에 센서 값이나 실시간 객체는 없습니다.\n\n## 실패, 취소와 halt 처리 계약\n\n기본 취소는 `CHECKPOINT`입니다. 현재 노드를 마치고, 잡기·들기·놓기에서는 원자 구간의\n확인까지 완료합니다. `IMMEDIATE`는 현재 완료를 기다리지 않고 중단합니다. `RETURN_ARM`은\n현재 작업 중단과 정지 확인 뒤 물체를 잡고 있으면 그 자리에서 놓고 팔을 복귀합니다.\n현재 위치 놓기의 별도 안착 검증은 초기 정책에 포함하지 않습니다. native MuJoCo 트리는\n복귀 뒤 정지를 다시 확인하고 복귀 실패 시 정지 평가로 연결합니다.\n[native BT 구현](../../cleany_manipulation_bt/README.md)의 실패 경로를 따릅니다.\n\n| 상황 | 처리 후보 |\n|---|---|\n| 일반 노드 FAILURE | Fallback의 StopAndAssess와 FinalizeFailure 실행 |\n| 정지 근거 없음 | 종료 분석 context에 `stop_confirmed=false`, FATAL 원인 기록 |\n| `halt()` 또는 예외 | 실행 host가 try/finally로 동일한 종료 및 보관 port 실행 |\n| 비상 정지 | controller 및 hardware 안전 경로 우선, tree tick을 기다리지 않음 |\n| 기록 실패 | 경고 전달, 실제 실행 상태 유지. 저장 실패만으로 동작·신규 Goal을 차단하지 않음 |\n\n`StopAndAssess`의 SUCCESS는 **분석을 마쳤다**는 제어 값입니다. 정지가 성공했다는\n뜻으로 사용하지 않습니다. 정지 미확인도 context와 error에 담아 FinalizeFailure까지\n전달합니다. 정지 분석 자체가 예외로 끝나면 host의 종료 port가 UNKNOWN 상태를 보관합니다.\n\n트리가 halt되면 Fallback까지 tick될 것이 보장되지 않습니다. 따라서 XML의 실패 경로만으로\n취소 처리를 완성했다고 볼 수 없습니다. 종료 보관은 `execution_id` 기준 멱등 처리하고,\n트리와 host가 모두 호출해도 결과를 중복 작성하거나 물체를 다시 움직이지 않아야 합니다.\n\n자동 `RetryUntilSuccessful`, 전체 행동 반복 또는 무조건 성공 decorator는 넣지 않습니다.\n준비 조회 retry는 서버 설정과 노드 계약에서 제한하고, 접촉 이후 새 시도는 Mission\nManager의 재관찰 및 승인을 따릅니다.\n\n## Groot2에서 열기\n\n[groot2_table_cleanup.xml](groot2_table_cleanup.xml)의 기본 트리는 `CollectTrashSkill`입니다.\n파일명은 table_cleanup이지만 실행 범위는 행동 하나입니다.\n\nGroot2의 Load Project or File 메뉴에서 위 XML을 열고 `CollectTrashSkill`을 선택합니다.\nGUI 설치는 사용하는 OS와 architecture에 맞춰 별도로 준비합니다. 이 XML은 정적 설계\n미리보기이며, 현재 서버의 실제 C++ 트리 상태는 [MuJoCo BT 모니터](../../cleany_manipulation_bt/README.md#기록과-모니터)를 사용합니다.\n\n## 설계 파일의 검증 범위\n\nXML 구문, 노드 모델, 포트 이름과 Blackboard 연결을 정적으로 검사합니다.\nGroot2 GUI import와 실제 BT.CPP 동작, 취소 및 물리 정지 검증은 별도입니다.\nXML을 여는 것만으로 Action 서버가 생기거나 로봇이 움직이지 않습니다.\n\n관련 문서: [서버 명세](manipulation-server-behavior-spec.md),\n[Action 명세](execute-manipulation-skill-action-spec.md), [설계 안내](manipulation-action-design.md).\n"},"ros2_ws/src/cleany_skill_executor/docs/manipulation-mock-usage.md":{"title":"모의 Manipulation Action 사용법","body":"# 모의 Manipulation Action 사용법\n\n```mermaid\nsequenceDiagram\n  participant C as 요청자\n  participant S as Mock Action 서버\n  participant D as 실행 기록\n  C->>S: Goal (대상과 작업)\n  S-->>C: 단계별 Feedback\n  S->>D: 상태와 결과 저장 시도\n  S-->>C: 최종 Result\n  C->>S: execution_id로 조회\n  S-->>C: 최신 실행 기록\n```\n\n이 서버는 진행을 모의 생성합니다. [MuJoCo 실행 경로](../../cleany_manipulation_bt/README.md)와 구분하세요.\n\n[패키지 안내로 돌아가기](manipulation.md)\n\n**물체 하나의 `collect_trash` 또는 `collect_lost_item`을 요청하고, 진행·결과·실행 기록을 터미널에서 확인합니다.**\n현재 실행 프로필은 `mock`입니다. 팔과 그리퍼 동작 및 확인 근거를 모의로 생성하며,\n팔 애니메이션이나 실제 로봇 명령은 제공하지 않습니다.\n\n| 하려는 일 | 안내 |\n|---|---|\n| 처음 실행해 보기 | [빠른 시작](#빠른-시작) |\n| 진행 중 취소하거나 결과 다시 조회하기 | [취소와 기록 조회](#취소와-기록-조회) |\n| 집기 실패·정지 실패 등을 재현하기 | [실패 상황 재현](#실패-상황-재현) |\n| namespace·대상·제한 시간 바꾸기 | [설정](#설정) |\n| SQLite와 재시작 동작 이해하기 | [SQLite 기록과 재시작](#sqlite-기록과-재시작) |\n| 자동 검사 실행하기 | [검증](#검증) |\n| Action·Service·Topic 계약 확인하기 | [ROS 인터페이스와 실행 구조](#ros-인터페이스와-실행-구조) |\n\n## 빠른 시작\n\n아래 명령은 **bash 터미널 두 개**, **레포 루트**에서 실행합니다.\n처음 개발환경을 준비한다면 [설치 가이드](../../../../docs/implementation/development-setup.md)를 따릅니다.\n\n**1. 터미널 A: 빌드하고 서버 실행**\n\n```bash\nmake build-manipulation\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\n\nmock_db_dir=\"$(mktemp -d)\"\nros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n  database_path:=\"$mock_db_dir/executions.sqlite3\"\n```\n\n`Mock manipulation ready`가 나오면 요청을 받을 준비가 된 것입니다.\n`mock_db_dir`에는 이번 테스트의 독립 DB 경로가 저장됩니다. 서버 종료는 `Ctrl+C`입니다.\n\n**2. 터미널 B: 정상 수거 요청**\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\n\nros2 run cleany_skill_executor manipulation_test_client\n```\n\n기본 요청은 `mock-snapshot-001`의 **1번 물체**, 목적지 `mock_trash_bin`, 팔 `left`입니다.\n약 5초 동안 다음 순서의 Feedback을 출력합니다.\n\n```text\nVALIDATING → PREPARING_TARGET → APPROACHING → GRASPING → LIFTING\n→ TRANSPORTING → PLACING → RETURNING_ARM → VERIFYING_PLACEMENT → FINALIZING\n```\n\n**3. 출력에서 확인할 값**\n\n| 출력 | 의미 |\n|---|---|\n| 첫 줄의 `execution_id` | 클라이언트가 발급한 UUID4. 기록 조회 때 사용 |\n| 단계별 Feedback | 지금 진행 중인 단계와 설명 |\n| 첫 번째 JSON | Action의 최종 Result |\n| 두 번째 JSON | 조회 Service로 읽은 최신 실행 기록 |\n\n정상 종료 시 Result는 `status=SUCCESS`, `execution_profile=mock`,\n`error_code=NONE`, `object_state=LEFT_GRIPPER`, `placement_state=CONFIRMED`,\n`arm_recovered=true`, `stop_confirmed=true`입니다.\n조회 결과는 `found=true`, `record_state=FINISHED`, `has_result=true`입니다.\n\n같은 단계에서도 시작, 관측 결과 수신, 단계 완료를 각각 Feedback으로 알립니다.\n클라이언트는 `stage/substage`로 세부 동작을 표시합니다. 예를 들어 집기는 다음과 같습니다.\n\n```text\nGRASPING/GraspObject Starting GRASPING\nGRASPING/ConfirmGrasp Substage completed: GraspObject; starting ConfirmGrasp\nGRASPING/ConfirmGrasp Observation received: Mock contact observation\nGRASPING/ConfirmGrasp Stage completed: GRASPING\nFINALIZING Finalizing result: Mock collection verified\nFINALIZING Execution finished: SUCCESS; Mock collection verified\n```\n\n`Finalizing result`는 결과 확정 시작, `Execution finished`는 실행 종료를 알립니다.\n`revision`도 작업 횟수가 아니라 기록 갱신 번호입니다.\n\n기록의 `completed_substages`는 실제 완료한 모의 세부 단계이며, 실패 시 Result의\n`failed_substage`로 그리퍼 명령 실패와 파지 확인 실패 등을 구분합니다.\n그리퍼 닫기 완료만으로 물체 보유를 확정하지 않습니다.\n\n**세부 단계를 천천히 관찰하기**\n\n기존 서버를 종료하고 터미널 A에서 아래 명령을 실행합니다. 별도 임시 설정 파일 없이\n각 세부 단계를 약 3초, 전체 정상 흐름을 약 51초 동안 확인할 수 있습니다.\n\n```bash\nmock_db_dir=\"$(mktemp -d)\"\nros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n  database_path:=\"$mock_db_dir/executions.sqlite3\" monitor:=true \\\n  mock_config:=\"$PWD/ros2_ws/src/cleany_skill_executor/config/manipulation_mock_slow.yaml\"\n```\n\n이 설정의 시나리오는 `success`만 제공합니다. 원래 설정의 `stage_duration_sec`는 큰 단계\n전체 시간이며 세부 단계 수에 나눠 적용합니다. 느린 설정은 단계별 시간과 timeout을 함께 늘렸습니다.\n\n## VS Code에서 로컬 트리 모니터링\n\n설치된 **BehaviorTree Viewer** 확장(NicholasJamesBell, 0.1.2)의 Monitor 기능으로\n모의 Action의 단계별 진행을 표시합니다. Python 이벤트 브리지가 `FULLTREE`·`STATUS`\nZMQ 요청에 응답하는 로컬 테스트 기능이며 BT.CPP 실행기나 Groot2 전체 프로토콜 구현은 아닙니다.\n\n1. 빠른 시작의 터미널 A에서 launch에 `monitor:=true`를 추가합니다.\n\n   ```bash\n   mock_db_dir=\"$(mktemp -d)\"\n   ros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n     database_path:=\"$mock_db_dir/executions.sqlite3\" monitor:=true\n   ```\n\n2. VS Code에서 이 패키지의 `docs/groot2_table_cleanup.xml`을 열고\n   `BehaviorTree: Open Behavior Tree Viewer`를 실행합니다. 뷰어에서 **Monitor**를 누릅니다.\n   확장 설정은 `behaviortreeViewer.monitorHost=127.0.0.1`,\n   `behaviortreeViewer.monitorPort=1666`을 사용합니다. 레포 workspace 설정은 MuJoCo용\n   1667이므로 mock을 모니터링할 때는 1666으로 바꿉니다.\n3. 터미널 B에서 `ros2 run cleany_skill_executor manipulation_test_client`를 실행합니다.\n   실행 중 파란색, 완료 초록색, 실패 빨간색으로 바뀝니다. 끝난 상태는 다음 Goal까지 유지됩니다.\n   같은 명령을 다시 실행해 새로운 실행을 볼 수 있습니다.\n4. 실패를 보려면 서버를 종료한 뒤 새 임시 DB와 `scenario:=grasp_failure`로 시작합니다.\n   뷰어를 다시 연결하고 클라이언트를 실행하면 집기 노드가 실패하고 뒤의 동작은 미실행으로 남습니다.\n\n서버가 별도로 실행 중이면 같은 namespace에서 브리지만 시작할 수도 있습니다.\n\n```bash\nros2 run cleany_skill_executor manipulation_monitor --ros-args -r __ns:=/mock\n```\n\n| 항목 | 동작 |\n|---|---|\n| 입력 | namespace 내 `manipulation/execution_events`, Reliable·Transient Local |\n| 연결 | loopback `127.0.0.1:1666`, launch의 `monitor_port`로 변경 가능 |\n| 표시 범위 | 최신 `execution_profile=mock` 실행 하나. revision으로 중복·오래된 기록 제외 |\n| 표시 근거 | `stage`, `last_completed_stage`, Result. 단계 시작만으로 성공 처리하지 않음 |\n| 실패·취소 | BT 상태는 FAILURE로 투영. `BLOCKED`·`CANCELED`·`FATAL` 구분은 Action Result 확인 |\n| 미지원 | blackboard 실제 값, breakpoint, fault injection, 로봇 제어, 실행 이력 replay |\n\nXML은 서버가 실행하는 코드가 아니라 이벤트를 표시하는 도식입니다. 특히 종료 경로는\nResult를 화면에 투영한 것으로, XML의 각 노드를 실제로 tick했다는 의미가 아닙니다.\n서버 재시작으로 `INTERRUPTED`가 된 기록은 성공한 정지·종료 처리로 표시하지 않습니다.\n연결 직후 최근 보존 이벤트를 읽으며 전체 과거 기록을 재생하지는 않습니다.\n\n브리지는 `python3-zmq`가 필요하다([개발환경 안내](../../../../docs/implementation/development-setup.md#5-rosdep과-workspace-의존성-준비)).\n확장에 **native zeromq binary unavailable**이 나오면 모니터링용 네이티브 의존성이\n설치되지 않은 것입니다. 정적 미리보기와 별개이며 해당 플랫폼의 zeromq 바이너리를 준비한 뒤\nVS Code의 `Developer: Reload Window`를 실행합니다. Remote SSH에서는 확장도 원격 VM에 설치합니다.\nPC의 로컬 확장에서 VM 브리지에 연결한다면 SSH로 1666 포트를 전달해야 합니다.\n\n## 취소와 기록 조회\n\n아래 명령은 **빠른 시작의 터미널 B**에서 실행합니다.\n\n**운반 중 취소**\n\n```bash\nros2 run cleany_skill_executor manipulation_test_client \\\n  --cancel-stage TRANSPORTING\n```\n\n`STOPPING` 이후 `status=CANCELED`, `stop_confirmed=true`, `object_state=HELD`를\n확인합니다. 기본 `CHECKPOINT`에서는 물체를 들고 있어도 놓기나 팔 복귀를 실행하지 않습니다.\n물체 보유 상태가 남으므로 이후 새 Goal은 거절됩니다.\n다른 독립 테스트를 하려면 터미널 A에서 서버를 종료하고 새 임시 DB로 실행합니다.\n\n집기·들기·놓기 중 취소는 현재의 짧은 원자 구간을 완료하거나 제한 시간에서 차단한\n뒤 정지를 확인합니다. 취소 후 다음 동작은 시작하지 않습니다. fault는 취소보다 우선하며\n정지를 확인하지 못하면 `FATAL/STOP_UNCONFIRMED`입니다.\n\n**현재 작업을 중단하고, 잡고 있는 물체를 그 자리에서 놓은 뒤 팔 복귀**\n\n```bash\nros2 run cleany_skill_executor manipulation_test_client \\\n  --cancel-stage TRANSPORTING --cancel-mode RETURN_ARM\n```\n\n`STOPPING → RELEASING_IN_PLACE → RECOVERING_ARM → STOPPING → FINALIZING`으로\n종료합니다. `CANCELED`, `cancel_mode=RETURN_ARM`, `object_state=LEFT_GRIPPER`,\n`arm_recovered=true`, `stop_confirmed=true`이며 수거함 확인은 실행하지 않습니다.\n빈 팔에서는 놓기를 건너뜁니다. 현재 위치 놓기의 추가 위치 정책은 후속 검토 대상입니다.\n`--cancel-mode IMMEDIATE`는 현재 완료를 기다리지 않고 정지를 요청합니다.\n\n이미 실행 중인 Goal에는 `CancelManipulation` 서비스를 사용합니다. `/sim`에서도 같은\n서비스와 모드를 제공합니다. 모드 설정과 기본 Action 취소를 따로 호출할 필요는 없습니다.\n\n```bash\nros2 service call /mock/manipulation/cancel cleany_interfaces/srv/CancelManipulation \\\n  \"{execution_id: '실행-UUID', mode: 'RETURN_ARM'}\"\n```\n\n놓기·복귀 중 `IMMEDIATE`로 선점할 수 있으며 이미 즉시 정지를 요청했으면 완화되지 않습니다.\n\n**기존 실행 기록 조회**\n\n첫 줄에 출력된 UUID를 `execution_id`에 넣습니다. 조회는 새 Goal을 보내지 않습니다.\n\n```bash\nexecution_id='클라이언트가 출력한 UUID'\nros2 run cleany_skill_executor manipulation_test_client \\\n  --query --execution-id \"$execution_id\"\n```\n\n응답 유실이나 클라이언트 timeout 뒤에도 같은 ID로 먼저 조회합니다.\n같은 execution_id로 Goal을 다시 보내면 중복 요청으로 거절됩니다.\n\n## 실패 상황 재현\n\n**서버 시나리오를 바꾸는 경우:** 터미널 A에서 기존 서버를 `Ctrl+C`로 종료하고,\n독립 임시 DB와 `scenario`를 지정해 다시 실행합니다.\n\n```bash\nmock_db_dir=\"$(mktemp -d)\"\nros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n  database_path:=\"$mock_db_dir/executions.sqlite3\" \\\n  scenario:=grasp_lost\n```\n\n터미널 B에서는 정상 수거 명령을 다시 실행합니다.\n`grasp_lost`는 운반 중 `FAILED/GRASP_LOST`, `object_state=UNKNOWN`으로 끝납니다.\n\n| `scenario` | 재현 상황 | 예상 결과 |\n|---|---|---|\n| `success` | 정상 수거 | `SUCCESS` |\n| `release_unobserved` | 그리퍼 이탈 근거 없이 독립 확인까지 대기 | 확인 후 `SUCCESS` |\n| `backend_not_ready` | 시작 준비 불가 | `BLOCKED/BACKEND_NOT_READY` |\n| `verification_unavailable` | 확인 기능 준비 불가 | `BLOCKED/VERIFICATION_UNAVAILABLE` |\n| `grasp_failure` | 집기 실패 | `FAILED/GRASP_FAILED` |\n| `grasp_lost` | 운반 중 물체 상태 유실 | `FAILED/GRASP_LOST` |\n| `placement_failure` | 수거함 내부 확인 실패 | `FAILED/PLACEMENT_NOT_CONFIRMED` |\n| `verification_timeout` | 확인 제한 시간 초과 | `FAILED/VERIFICATION_TIMEOUT` |\n| `return_failure` | 팔 복귀 실패, 독립 수거 근거 보존 | `FAILED/MOTION_FAILED`, `placement_state=CONFIRMED` |\n| `stop_failure` | 취소·실패 후 정지 확인 실패 | `FATAL/STOP_UNCONFIRMED` |\n| `stop_timeout` | 취소·실패 후 정지 확인 제한 시간 초과 | `FATAL/STOP_UNCONFIRMED` |\n| `hardware_fault` | 운반 중 모의 hardware fault | `FATAL/HARDWARE_ERROR` |\n| `e_stop` | 들기 중 모의 e-stop | `FATAL/E_STOP` |\n\n`stop_failure`와 `stop_timeout`에서는 클라이언트에 `--cancel-stage TRANSPORTING`을\n추가해 정지 경로를 실행합니다. 정상 수거 요청만으로는 이 오류가 발생하지 않습니다.\n\n**Goal 인자로 준비 실패를 재현하는 경우:** `success` 서버에서 아래 명령 중 하나를 실행합니다.\n모두 움직임 전에 `BLOCKED`로 끝납니다.\n\n```bash\n# 없는 대상: TARGET_UNAVAILABLE\nros2 run cleany_skill_executor manipulation_test_client --object-id 99\n\n# 오래된 대상: STALE_TARGET\nros2 run cleany_skill_executor manipulation_test_client --snapshot-id mock-stale-snapshot\n\n# 잘못된 목적지: DESTINATION_UNAVAILABLE\nros2 run cleany_skill_executor manipulation_test_client --destination-id missing\n```\n\n없는 snapshot도 `--snapshot-id missing`으로 재현할 수 있습니다.\n\n## 설정\n\n**서버 launch 인자**\n\n| 인자 | 기본값 | 용도 |\n|---|---|---|\n| `namespace` | `mock` | ROS 이름의 namespace |\n| `database_path` | [기본 DB 경로](#sqlite-기록과-재시작) | 실행 기록 파일 |\n| `scenario` | `success` | 위 표의 모의 시나리오 |\n| `mock_config` | package의 `config/manipulation_mock.yaml` | 대상 fixture와 모의 시간 설정 |\n\n예를 들어 서버를 `namespace:=demo`로 실행하면 클라이언트에도 `--namespace /demo`를\n전달합니다. 설정 변경은 서버 재시작 때 반영합니다. 노드의 `backend` parameter는\n`mock`만 지원하며 다른 값은 시작 시 거절합니다.\n\n**테스트 클라이언트 옵션**\n\n| 옵션 | 기본값 또는 동작 |\n|---|---|\n| `--namespace` | `/mock` |\n| `--snapshot-id`, `--object-id` | `mock-snapshot-001`, `1` |\n| `--destination-id` | `mock_trash_bin` |\n| `--skill-name` | `collect_trash`. 분실물은 `collect_lost_item`과 `--destination-id mock_lost_item_bin` 지정 |\n| `--mission-id`, `--task-id` | `mock-mission`, `mock-task` |\n| `--execution-id` | 생략하면 UUID4 발급 |\n| `--cancel-stage` | 지정 단계에서 취소 요청 |\n| `--cancel-mode` | `CHECKPOINT`(기본), `IMMEDIATE`, `RETURN_ARM` |\n| `--query` | `--execution-id`의 기록만 조회 |\n| `--timeout` | Result 응답 대기 120초. 서버의 단계 제한 시간과 별개 |\n\n전체 옵션은 `ros2 run cleany_skill_executor manipulation_test_client --help`로 확인합니다.\n\n**모의 YAML 설정**\n\n[`config/manipulation_mock.yaml`](../config/manipulation_mock.yaml)에서 관리합니다.\n아래 수치는 모의 검증용이며 실물 안전 기준으로 사용하지 않습니다.\n\n| 항목 | 기본값 |\n|---|---|\n| 대상 | `mock-snapshot-001`의 물체 1·2·3 |\n| 목적지 / 선택 팔 | `mock_trash_bin` / `left` |\n| 단계 실행 / 정지 확인 시간 | 0.5초 / 0.1초 |\n| 준비 / 확인 제한 시간 | 각각 5초 |\n| 동작 / 정지 제한 시간 | 단계별 10초 / 1초 |\n| 관찰 최대 age | 30초. snapshot age는 모의 fixture 값 |\n| 자동 재시도 | 0회 |\n\n## SQLite 기록과 재시작\n\n현재 서버는 최신 실행 기록을 메모리에 유지하고 SQLite에도 저장을 시도합니다.\n같은 프로세스의 중복 검사와 결과 조회는 메모리 기록을 사용하며, 재시작 복구와\n재시작 이후 중복 검사는 디스크에 저장된 기록을 사용합니다.\nPython 표준 라이브러리의 `sqlite3`를 사용하므로 별도 DB 서버나\n`sqlite3` 명령어 설치는 필요 없습니다. 서버가 DB 파일을 자동으로 만듭니다.\n\n기본 경로는 `${XDG_STATE_HOME:-~/.local/state}/cleany/manipulation_mock/executions.sqlite3`입니다.\n빠른 시작에서는 `database_path`를 지정해 테스트별 임시 DB를 사용합니다.\n\n| `record_state` | 의미 |\n|---|---|\n| `ACTIVE` | 수락한 실행이 진행 중 |\n| `FINISHED` | 실행 종료와 Result 확정. 디스크 저장 완료를 보장하지 않음 |\n| `INTERRUPTED` | 재시작 시 발견한 미완료 실행. `has_result=false`, 사람 확인 필요 |\n| `RECORDING_FAILED` | 이전 구현의 저장 실패 진단. 현재 서버는 새 기록에 사용하지 않음 |\n\n**같은 DB로 재시작할 때**\n\n- 미완료 기록을 `INTERRUPTED`, `human_confirmation_required=true`로 표시합니다.\n- 마지막 물리 근거는 보존하고 정지를 추정하거나 가짜 Action Result를 생성하지 않습니다.\n- 중단 기록을 조회 Service와 복구 이벤트로 제공합니다. 이전 Goal을 자동 재개하지 않습니다.\n- fault·중단·물체 보유·상태 불명이 남으면 신규 Goal을 차단합니다.\n\n이번 버전에는 reset과 기록 자동 만료가 없습니다. 다른 모의 테스트는 새 임시 DB로 분리합니다.\n기존 DB 삭제를 물리 복구 완료로 간주하지 않습니다.\n\n저장 실패는 경고 로그로 남기고 실제 실행의 status와 error_code를 유지합니다.\n저장 실패만으로 동작이나 신규 실행을 차단하지 않습니다. 최신 진행과 결과는 메모리에 유지하고\n이후 갱신 시 저장을 다시 시도합니다. 최초 저장이 실패했으면 다음 갱신에서 기록 생성을 다시 시도합니다.\n함께 발생한 hardware fault·e-stop·정지 확인 실패와 물체 보유·상태 불명에 따른 차단은 유지합니다.\n디스크에 남은 마지막 활성 기록은 재시작 때 중단으로 복구되지만, 미저장 메모리 기록은 유실됩니다.\n기동 시 DB 초기화와 기존 이력 읽기가 실패하면 서버는 기동하지 않습니다.\n\n## 검증\n\n레포 루트에서 필요한 검사를 선택합니다.\n\n| 명령 | 검사 범위 |\n|---|---|\n| `make test-manipulation-core` | 가짜 시계 기반 core: 단계 진행·실패·취소·기록·복구 |\n| `make test-manipulation` | 관련 패키지 빌드, 실제 ActionClient 통신, 동시·중복 요청, 저장 실패, SIGKILL 후 복구 |\n\n기존 Skill Executor 전체 회귀 검사는 ROS setup을 읽은 터미널에서 실행합니다.\n\n```bash\nPYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest ros2_ws/src/cleany_skill_executor/test\n```\n\n## ROS 인터페이스와 실행 구조\n\n| 기본 ROS 이름 | 타입 | 용도 |\n|---|---|---|\n| `/mock/manipulation/execute_skill` | `ExecuteManipulationSkill` Action | 요청·Feedback·Result·취소 |\n| `/mock/manipulation/cancel` | `CancelManipulation` Service | execution_id와 취소 방식 지정 |\n| `/mock/manipulation/get_execution` | `GetManipulationExecution` Service | execution_id로 최신 기록 조회 |\n| `/mock/manipulation/execution_events` | `ManipulationExecutionRecord` Topic | 수락·단계·물리 근거·종료·복구 이벤트 |\n\n| Result `status` | ROS 종료 |\n|---|---|\n| `SUCCESS`, `BLOCKED` | `SUCCEEDED`. Result payload의 status도 확인 |\n| `FAILED`, `FATAL` | `ABORTED` |\n| `CANCELED` | 정지 확인 후 `CANCELED` |\n\nID·skill 오류, 동시 실행, 중복 execution_id와 기존 fault는 수락 전에 거절하며\n일반 Result payload가 없습니다. 상세 필드·단계·오류는\n[Action 명세](execute-manipulation-skill-action-spec.md)를 따릅니다.\n\nROS wrapper, 순수 Python core, 동작 port, Mock adapter와 SQLite 저장소를 분리했습니다.\n20Hz steady-clock timer와 Reentrant 콜백, 4-thread executor를 사용하고,\n수락·취소·진행 변경·최종 결과는 같은 lock으로 직렬화합니다.\nSQLite는 실행 ID UNIQUE 제약, DB별 파일 lock, WAL/FULL 동기화를 사용합니다.\n수락·단계 시작·확인된 물리 변화·Result의 최신 기록과 이력을 동일 트랜잭션으로 저장합니다.\n\n이벤트 QoS는 Reliable·Transient Local, depth 100입니다. 최신 100개 이벤트를 재수신할 수\n있으며 SQLite 저장에 성공한 이력은 `execution_events`에 보존합니다.\n이 mock 경로는 실제 Perception·팔 backend를 사용하지 않습니다. 실제 MuJoCo BT 실행은\n[cleany_manipulation_bt](../../cleany_manipulation_bt/README.md)를 따릅니다.\nMission Manager의 `action_mock` 연동과 Backend 계약은\n[Mission 계약](../../cleany_interfaces/docs/mission.md)을 확인합니다.\n"},"ros2_ws/src/cleany_skill_executor/docs/manipulation-server-behavior-spec.md":{"title":"Manipulation 서버 동작 명세","body":"# Manipulation 서버 동작 명세\n\n> **모의 구현과 BT backend 계약.** 대상은 승인된 `collect_trash` 또는 `collect_lost_item` 물체 하나입니다.\n> 서버는 책상 전체의 물체 선택, Planner 호출과 완료 판정을 맡지 않습니다.\n> Python 모의 서버의 실행·설정·검증은 [사용법](manipulation-mock-usage.md)를 따릅니다.\n> MuJoCo의 실제 실행·정지 근거는 [BT 실행 계약](../../cleany_manipulation_bt/docs/execution-contract.md)을 따릅니다.\n\n| 확인할 내용 | 위치 |\n|---|---|\n| 시작 조건과 실행 단계 | [시작 전 확인](#시작-전에-확인할-것), [실행 단계](#실행-단계) |\n| 인식과 놓기 검증 | [InspectScene](#inspectscene은-무엇인가), [놓은 결과 확인](#놓은-결과-확인) |\n| 실패·취소·기록 | [실패와 재시도](#실패와-재시도), [취소](#취소는-어떻게-처리하는가), [실행 기록](#기록-fault와-profile) |\n| Mock의 구현 범위 | [모의 서버의 구현 경계](#모의-서버의-구현-경계) |\n\n## 시작과 종료 경계\n\n| 시작 | 종료 |\n|---|---|\n| 승인된 Goal과 관찰 참조를 받음 | 행동 Result와 실제 물체 및 팔 상태를 반환 |\n| 선택된 물체와 목적지를 물리적으로 검사 | Mission Manager가 기록, 재관찰과 다음 판단 |\n\n새 Goal을 실행하기 전에 이전 실행의 기록과 정지 상태를 확인합니다.\n같은 서버와 관련 팔 및 그리퍼 자원을 쓰는 Goal은 한 번에 하나만 실행합니다.\ne-stop과 hardware fault의 실제 정지는 ROS Result와 Planner 응답을 기다리지 않습니다.\n\n## 시작 전에 확인할 것\n\n아래는 상위 연동까지 포함한 준비 조건입니다. 이 브랜치의 MuJoCo 서버는 고정 베이스를 사용하며,\n모바일 베이스의 도착·정지·주행 자세를 조회하는 readiness adapter는 아직 없습니다.\n\n| 확인 | 통과 조건 | 실패 처리 후보 |\n|---|---|---|\n| 지원 행동 | 승인 경로를 거친 `collect_trash`, `collect_lost_item` | 구조상 오류는 Goal 거절, 분류–skill–목적지 불일치는 이동 전 차단 |\n| backend | mock, 검증 가능한 simulation 또는 준비된 real adapter | `BLOCKED/BACKEND_NOT_READY` |\n| 베이스 상태 | 접근 위치 도착, 베이스 정지와 위치 조건 유효 | `BLOCKED/BACKEND_NOT_READY` |\n| 팔과 그리퍼 | 새 feedback으로 상태와 정지를 확인, 이전 held 또는 fault 없음 | 준비 불가 또는 기존 fault는 실행 차단 |\n| snapshot | 지정 관찰 존재, 기간과 대상 유효 | `BLOCKED/TARGET_UNAVAILABLE` 또는 `STALE_TARGET` |\n| 목적지 | 등록된 수거 목적지, 해당 물체의 크기와 경로 유효 | `BLOCKED/DESTINATION_UNAVAILABLE` |\n| 확인 기능 | 놓은 결과를 검증할 port 준비 | `BLOCKED/VERIFICATION_UNAVAILABLE` |\n| 실행 기록 | ID·인자 충돌과 기존 실행 상태 확인, 시작 기록을 메모리에 반영 | 충돌·미완료 실행은 차단. SQLite 쓰기 실패만으로는 차단하지 않음 |\n\n실물 연동의 베이스 정지 기준, snapshot age와 확인 수단은 아직 정해야 합니다.\n준비 전 움직임이 없고 초기 feedback이 부족하면 `BLOCKED`로 끝낼 수 있지만\n`stop_confirmed=true`라고 주장하지 않습니다. 이미 움직인 뒤 정지가 불명확하면 `FATAL`입니다.\n검증이 준비되지 않은 실물 프로필은 사용 가능으로 표시하지 않습니다.\n\n## 실행 단계\n\n```mermaid\nflowchart TD\n    V[\"VALIDATING\u003cbr/>입력과 준비 확인\"] --> P[\"PREPARING_TARGET\u003cbr/>대상, grasp와 경로 준비\"]\n    P --> A[\"APPROACHING\u003cbr/>빈 팔 이동과 접근\"]\n    A --> G[\"GRASPING\u003cbr/>그리퍼 닫기\"]\n    G --> L[\"LIFTING\u003cbr/>들기와 잡은 상태 확인\"]\n    L --> T[\"TRANSPORTING\u003cbr/>수거함으로 운반\"]\n    T --> O[\"PLACING\u003cbr/>그리퍼를 열어 놓기\"]\n    O --> R[\"RETURNING_ARM\u003cbr/>목표 자세 복귀\"]\n    R --> C[\"VERIFYING_PLACEMENT\u003cbr/>수거함 내부 확인\"]\n    C --> F[\"FINALIZING\u003cbr/>실행 기록과 Result\"]\n```\n\n| 단계 | 수행과 통과 조건 | 남길 기록 |\n|---|---|---|\n| 입력 검증 | 위 시작 조건 확인 | Goal, 프로필, 초기 상태 |\n| 대상 준비 | 선택 물체 3D 정보, grasp와 경로 유효 | snapshot, 팔, 계획 참조 |\n| 접근 | 승인된 경로와 최신 제어 feedback으로 완료 확인 | 시작 명령과 접근 결과 |\n| 집기 | 그리퍼 접촉 및 제어 결과 확인 | 물체 상태와 근거 시각 |\n| 들기 | 들어 올린 뒤 잡은 상태 유지 확인 | `HELD` 또는 불명확 상태 |\n| 운반 | 충돌, workspace와 잡은 상태 감시 | 목적지 접근과 이탈 여부 |\n| 놓기 | 목적지 유효성 재확인 후 그리퍼 열기 | 명령 성공과 물체 상태를 구분 |\n| 팔 복귀 | backend의 복귀 목표 자세 도달 확인 | `arm_recovered`, 정지 근거 |\n| 놓은 결과 확인 | 놓은 뒤의 검증이 성공 조건 만족 | 확인 상태와 관찰 시각 |\n| 종료 | 모든 실제 진행 보존 후 Result 반환 | 마지막 완료 단계, 원인과 정지 상태 |\n\n각 motion 노드는 명령 전과 근거가 생긴 직후 진행을 기록합니다. 마지막 단계에서만\n기록하면 집거나 놓은 뒤 실패한 사실을 잃습니다. `last_completed_stage`는 성공 근거가\n있는 단계만 갱신합니다. 그리퍼 명령 완료만으로 물체 수거를 완료 처리하지 않습니다.\n\n모의 구현은 기존 `stage` 안에 `substage`를 추가해 세부 진행을 기록합니다.\n예를 들어 `GRASPING`은 그리퍼 닫기와 파지 확인을 구분하며, 확인 전에는\n`HELD`로 갱신하지 않습니다. `completed_substages`는 완료된 세부 단계만 보존하고,\n실패한 세부 단계는 `failed_substage`로 반환합니다. 재시작 시 이 진행도 유지합니다.\n세부 단계가 늘어나도 기존 단계 timeout과 원자 구간 취소 경계는 유지합니다.\n\n## InspectScene은 무엇인가\n\n**기존 Perception Action의 이름입니다. 선택 물체를 잡기 위해 필요한 정보도 제공합니다.**\n\n| 요청 종류 | 기존 입력 | 기존 출력 |\n|---|---|---|\n| 전체 장면 관찰, phase 1 | 빈 `snapshot_id`, `selected_object_id=0` | 2D 검출 목록과 새 snapshot |\n| 선택 대상 준비, phase 2 | 기존 snapshot과 물체 번호 | 해당 대상의 3D, mask 기반 cloud와 주변 cloud |\n\n```mermaid\nflowchart LR\n    Mission[\"Mission / 최초 관찰과 재관찰\"] --> Selected[\"승인된 선택 물체\"]\n    Selected --> Port[\"대상 준비 port / phase 2 또는 검증 3D payload\"]\n    Port --> Same{\"선택 대상 확인\"}\n    Same -->|같은 대상| Execute[\"실행\"]\n    Same -->|달라짐| Block[\"Goal 차단 / 다른 대상 자동 선택 없음\"]\n```\n\nPhase 2는 캐시된 관찰의 선택 물체 복원입니다. 새 사진으로 책상 전체를 다시 분류하지 않습니다.\n\n기존 [InspectScene.action](../../cleany_interfaces/action/InspectScene.action) 오류를 다음처럼 연결합니다.\n\n| 기존 Perception 오류 | 행동 오류 후보 |\n|---|---|\n| `ERROR_SNAPSHOT_NOT_FOUND`, `ERROR_INVALID_SELECTION` | `TARGET_UNAVAILABLE` |\n| RGB-D, mask, depth, plane, TF 오류 | 대상 준비 불가 또는 `STALE_TARGET`, 원래 코드도 보존 |\n| detector API, response, internal 오류 | `TARGET_UNAVAILABLE` 또는 `INTERNAL_ERROR`, 원인 보존 |\n| Perception 취소 | 상위 취소이면 `CANCELED`; 예상 밖 하위 취소면 실패 원인으로 기록 |\n\n하위 취소만 받았다고 팔 정지가 확인된 것은 아닙니다. Action Result가 요구하는 물리\n상태와 상위 취소 요청을 확인합니다. snapshot 오류 이름은 기존 `ERROR_SNAPSHOT_NOT_FOUND`를 따릅니다.\n\n## 놓은 결과 확인\n\n기존 [VerifyPlacement.srv](../../cleany_interfaces/srv/VerifyPlacement.srv)는\n`success`와 `message`만 반환합니다. 상세한 센서 판정 enum은 없습니다.\n\n| 받은 정보 | Mock의 기록·시나리오 | MuJoCo adapter |\n|---|---|---|\n| 유효한 안착 확인 | `CONFIRMED` | 방출 뒤와 팔 복귀 뒤 각각 확인. 나머지 조건 충족 시 `SUCCESS` |\n| 확인 불충족 / `success=false` | `NOT_CONFIRMED`, `FAILED/PLACEMENT_NOT_CONFIRMED` | 확인 기한 안에서 대기 |\n| 확인 timeout 또는 응답 불가 | `UNKNOWN`, `VERIFICATION_TIMEOUT` | `UNKNOWN`, `VERIFICATION_TIMEOUT` 또는 통신 원인 보존 |\n| 시작 시 확인 port 준비 안 됨 | `NOT_CHECKED`, 이동 전 차단 | `BLOCKED/VERIFICATION_UNAVAILABLE`, 집지 않음 |\n\nfalse를 “수거함 밖에 있는 것을 봤다”로 확대하지 않습니다. 현재 srv로는 그런 근거를\n보장하지 않습니다. action 내부 adapter는 응답 false와 호출 timeout은 구분할 수 있습니다.\n명시적 위치 판정이 필요하면 srv 확장을 별도 검토합니다.\n\nMuJoCo는 방출 직후 `ConfirmRelease`와 팔 복귀 후 `VerifyPlacedObject`에서 독립 검증을 요청합니다.\n팔 복귀가 실패했어도 backend가 독립적인 최신\n검증 근거를 제공하면 그 물리 사실을 실패 Result에 보존할 수 있습니다. 그 경우에도 행동\n상태는 `FAILED`입니다. 증거를 얻지 못하면 확인 성공을 추정하지 않습니다.\n\n기존 자동 sorting 데모의 기본 GUI 관찰 모드는 확인을 끄고 `complete_unverified`를 기록합니다.\nMuJoCo BT Action은 독립 확인을 요구합니다. 확인 생략 모드를 지원하려면\n별도 프로필과 보고 계약을 검토하고, `CONFIRMED`를 허위로 반환하지 않습니다.\n\n## 실패와 재시도\n\n| 상황 | 제안하는 결과 | 다음 판단 |\n|---|---|---|\n| 움직임 전 대상 또는 목적지 불가 | `BLOCKED` | Mission Manager가 관찰과 새 제안 검토 |\n| 움직임 전 계획을 만들지 못함 | `BLOCKED`, `GRASP_FAILED` 또는 `MOTION_FAILED` | 실패 원인과 대상 근거 전달 |\n| 접근, 집기, 운반 또는 팔 복귀 실패 | `FAILED` | 동작 종료, 정지와 물체 상태 확인 |\n| 물체 상태 유실 | `FAILED/GRASP_LOST`, `object_state=UNKNOWN` | 자동 놓기 금지, 정지 후 재관찰 |\n| 수거함 내부 확인 실패 | `FAILED` | 놓기 진행과 확인 실패를 함께 기록 |\n| 실제 e-stop 또는 hardware fault | `FATAL` | 하위 안전 경로, 신규 Goal 차단 |\n| 실행 후 정지 확인 불가 | `FATAL/STOP_UNCONFIRMED` | 신규 Goal 차단, 즉시 fault 알림 |\n\n접촉 이후 행동 전체를 내부에서 다시 시작하지 않습니다. 준비 단계 조회와 motion 계획은\n새 움직임이 없고 입력이 유효할 때만 설정된 횟수 안에서 retry할 수 있습니다.\n그 설정과 실행 후 재시도 budget은 별개입니다. `max_object_attempts`, `max_scan_cycles` 같은\n책상 반복 설정은 이 서버가 소유하지 않습니다.\n관측에서 대상이 사라진 사실만으로 수거 성공을 만들지 않습니다.\n\n## 취소는 어떻게 처리하는가\n\n**취소 요청을 받으면 다음 정상 단계 시작을 막고, 선택한 취소 모드로 종료합니다.**\n새로운 대상이나 수거 행동을 시작하지 않습니다. 기본 Action cancel은 `CHECKPOINT`이고,\n`manipulation/cancel` 서비스는 `execution_id/mode`를 받습니다.\n\n| mode | 서버 처리 | 종료 때 주의점 |\n|---|---|---|\n| `IMMEDIATE` | 현재 노드와 원자 구간 완료 대기 없이 중단 요청, 실제 정지 확인 | 팔 복귀나 그리퍼 열기 없음 |\n| `CHECKPOINT` | 현재 동작과 완료 확인까지만 수행한 뒤 정지 | 잡기·들기·놓기는 현재 원자 구간까지, 다음 단계 금지 |\n| `RETURN_ARM` | 현재 동작 중단, 정지 확인, 물체를 잡고 있으면 현재 위치에서 놓고 팔 복귀 | 수거함 배치 성공으로 기록하지 않음 |\n\n`RETURN_ARM`의 현재 위치 놓기는 그리퍼 열기 완료에 근거한 초기 구현 정책입니다.\n놓기 위치 선택과 별도 이탈 관찰은 후속 검토 대상으로 둡니다. 빈 팔은 놓기 동작 없이\n복귀하고, 팔 선택 전이면 정지 후 종료합니다. 놓기와 복귀 중에도 `IMMEDIATE`로 선점합니다.\n놓기·복귀 실패는 다시 정지 후 실패로 반환하며, 실제 정지 미확인은 기존 FATAL 경로입니다.\n\n집기, 들기 원자 구간의 범위와 제한 시간은 backend별로 정의해야 합니다. 제한 없이\n취소를 지연하거나, 선택한 취소 정책 밖의 운반과 놓기를 새로 시작하지 않습니다.\ne-stop과 hardware fault는 이 checkpoint 대기를 우회하는 독립 정지 경로입니다.\n\n### 정지 확인에 필요한 근거\n\n1. 해당 MoveIt 및 controller goal에 중단을 전달하고 종료 응답을 확인합니다.\n2. 명령 뒤의 **새 feedback**으로 팔과 그리퍼 속도를 확인합니다.\n3. 설정한 속도 기준과 유지 시간을 만족해야 정지를 확인합니다.\n4. 확인 제한 시간 안에 증거를 얻지 못하면 정지 미확인으로 종료하고 실행을 차단합니다.\n\n같은 feedback을 여러 번 읽은 것을 연속 새 표본으로 세지 않습니다. 제한 시간은\n프로세스의 단조 시계, sensor freshness는 해당 stamp 및 clock 계약으로 따로 관리합니다.\nMuJoCo BT 서버의 Action 종료·새 관절 표본 검사는 [BT README](../../cleany_manipulation_bt/README.md#계약과-증거)를\n따릅니다. 실물 backend의 정지 기준과 해당 계약의 검증은 후속 구현 대상입니다.\n\n## 기록, fault와 profile\n\n| 항목 | 구현 요구 후보 |\n|---|---|\n| 시작 기록 | 실행 ID, 인자 hash, snapshot과 대상, 프로필을 움직임 전에 보관 |\n| 물리 진행 | 집기, 들기, 그리퍼 열기와 확인 근거를 발생 직후 보관 |\n| 종료 | 취소와 예외도 마지막 진행과 원인을 반드시 기록 |\n| 재시작 | 활성 기록은 중단, 자동 재개 금지. Mission Manager에 중단과 마지막 진행 전달, 외부에 사람 확인 필요 보고 |\n| fault 알림 | 안전 경로와 Mission Manager에 즉시 전달. 정확한 진단 topic 또는 port는 구현 시 선택 |\n| fault 해제 | 운영자 권한과 로봇 안전 조건 검사. 물리 e-stop 및 hardware fault를 원격 reset으로 해제하지 않음 |\n| mock 프로필 | 순수 core와 동작 port 검증 |\n| simulation 프로필 | 독립 확인과 stop 근거를 제공하는 simulation adapter |\n| real 프로필 | 실제 feedback, 물리 verifier와 안전 경로가 준비되기 전 비활성 |\n\n| 기록 단계 | 계약 |\n|---|---|\n| 수락 / 단계 시작 | 동작 전에 메모리 반영 후 SQLite 저장 시도 |\n| 저장 | 최신 기록과 단계 이력을 같은 transaction, execution_id UNIQUE, DB별 file lock |\n| 저장 실패 | 실제 동작 중단 안 함 |\n| 같은 프로세스 조회 / 중복 | 메모리 기록 사용 |\n| 외부 연결 | Action 명세의 조회 service와 복구 이벤트 |\n\n### 재시작 시 서버와 Mission Manager가 처리할 일\n\n**재시작은 작업 도중 프로그램이나 장치가 종료된 뒤 다시 켜지는 상황입니다.**\n새 미션 시작과 구분하여 이전 활성 기록을 먼저 확인합니다.\n\n| 담당 | 처리할 일 |\n|---|---|\n| Action 서버의 복구 처리 | 이전 실행 ID와 미션 ID, 마지막 진행 및 확인 근거를 보존하고 중단 사실 전달 |\n| 로봇 상태 및 안전 기능 | 현재 팔, 그리퍼, 들고 있는 물체와 정지 여부 확인. 확인 전 새 물리 실행 차단 |\n| Mission Manager | 이전 미션을 자동 재개하지 않고 중단과 사람 확인 필요를 보고 자료에 반영 |\n| 외부 상태 adapter | Backend에 중단과 사람 확인 필요 전달. 연결이 없으면 보고를 보관하고 재연결 시 전달 |\n\n기록에 집기 명령이 있다는 것만으로 현재 물체를 들고 있다고 확정하지 않습니다.\n재시작했다는 이유만으로 정상 취소 또는 안전 정지 완료를 보고하지 않습니다.\n오류 reset이 허용되어도 이전 미션이 자동 재개되지는 않습니다.\n중단 보고 및 사람 확인 필요는 [KB 운영 규칙](../../../../docs/cleany-docs/20_TECHNICAL/02%20-%20Robot%20Operations%20and%20Mission%20Dispatch.md)의 요구이며,\n조회 Service와 복구 이벤트는 모의 서버에 구현했습니다. Backend 재전송 저장소와\nMission Manager adapter는 후속 구현 대상입니다.\n\n### 설정 목록 후보\n\n| 설정 | 용도 |\n|---|---|\n| `observation_max_age_sec`, `target_check_timeout_sec` | 관찰 기간과 선택 대상 확인 |\n| `preparation_timeout_sec`, `preparation_max_retries` | 움직임 전 준비와 제한된 retry |\n| `motion_timeout_sec`, `placement_check_timeout_sec` | motion과 놓은 결과 확인 |\n| `stop_timeout_sec`, `stationary_velocity_limit`, `stationary_duration_sec` | 새 feedback 기반 정지 판정 |\n| `execution_record_retention_sec` | 중복 방지 기록 보관 |\n| backend별 베이스, 팔과 그리퍼 readiness 기준 | 시작 및 복귀 허용 조건 |\n\n| 설정 | 모의 값 / 범위 |\n|---|---|\n| 단계 / 정지 확인 | 0.5 s / 0.1 s |\n| 준비·확인 / 동작 / 정지 기한 | 5 s / 10 s / 1 s |\n| 자동 재시도 | 0회 |\n| 기존 정지 설정 | arm_stationary_velocity_rad_s=0.02, arm_stationary_samples=5 |\n\n실물 기본값은 미정입니다. MuJoCo는 횟수와 지속 시간 / 관절별 freshness를 함께 검사하며 [BT 설정](../../cleany_manipulation_bt/docs/execution-contract.md#정상-수거의-놓기정지-확인)을 따릅니다.\n\n## 실행 환경별 연동\n\nMuJoCo의 [BT 서버](../../cleany_manipulation_bt/README.md)는 팔 동작별 진행 상태와 Result를 관리합니다. Gazebo 미션에서 조작 요청·취소와 재관찰을 확인할 때는 [Mission Manager의 Mock 연동](../../cleany_mission_manager/docs/manipulation-mock-integration.md)을 사용합니다. 시뮬레이션의 좌석 순회와 물체 선택은 개별 조작 서버의 책임 범위 밖입니다.\n\n## 모의 서버의 구현 경계\n\n정상 단계는 3절의 순서로 진행합니다. core는 비동기 port를 poll하며 ROS timer는\n20Hz steady clock을 사용합니다. `CHECKPOINT`는 현재 단계를 완료하고,\n`IMMEDIATE/RETURN_ARM`은 현재 동작을 중단한 뒤 정지 확인으로 처리합니다. fault는 checkpoint 대기를\n우회하고 `FATAL`로 신규 실행을 차단합니다. 취소와 Result 확정은 하나의 lock으로 직렬화합니다.\n\n| 재시작 / 저장 경계 | 처리 |\n|---|---|\n| 활성 기록 | INTERRUPTED / 사람 확인 필요, 마지막 물리 근거 보존 |\n| Result / 재개 | 가짜 Result 생성과 이전 Goal 자동 재개 없음 |\n| 신규 Goal 차단 | Fault / 중단 / HELD / UNKNOWN; reset 없음 |\n| 기록 쓰기 실패 | 경고, 실제 결과 유지; 쓰기 실패만으로 차단 안 함 |\n| FINISHED | 메모리 실행 종료, 디스크 저장 보장 아님 |\n| 기동 | DB 초기화 / 이력 읽기 필수 |\n| 재시작 복구 / 중복 | 디스크 기록만 사용; 미저장 메모리 유실 |\n\nMock adapter는 실제 제어기 feedback, VLA, 실물 verifier 또는 베이스 readiness를\n검증하지 않습니다. 해당 backend와 권한·복구·원격 전달 계약은 별도로 구현해야 합니다.\n"},"ros2_ws/src/cleany_skill_executor/docs/manipulation.md":{"title":"조작 경로와 파지 후보 선택","body":"# 조작 경로와 파지 후보 선택\n\n이 패키지는 파지 후보를 MoveIt으로 검증하고, 선택한 실행 경로에 따라 Mock 결과 또는 MuJoCo 조작을 수행합니다. 외부 실물 로봇의 통합 수거 실행은 지원하지 않습니다.\n\n| 필요한 동작 | 진입점 | 명령이 도달하는 곳 |\n|---|---|---|\n| 단일 물체 Action 연결 | [Mock 사용법](manipulation-mock-usage.md) | 모의 진행과 결과만 생성 |\n| 단일 물체 물리 시뮬레이션 | [MuJoCo BT](../../cleany_manipulation_bt/README.md) | MuJoCo 팔과 그리퍼 controller |\n| 후보 도달성 검사 | 아래 Reachable grasp Action | IK와 계획만 수행 |\n| 가까운 물체 pre-grasp | 아래 coordinator | 기본 pre-grasp, 선택적으로 집기와 lift |\n| 연속 분류 수거 | [실행과 진단](study-cafe-sorting-usage.md) | 고정 베이스 MuJoCo sorting |\n\n수거의 수치 설정은 [설정](study-cafe-sorting-configuration.md), 충돌·접촉·운반 조건은 [실행 계약](study-cafe-sorting-contract.md)에서 관리합니다.\n\n## 단일 물체 Action 실행\n\nMock과 native MuJoCo BT는 `ExecuteManipulationSkill` 계약을 공유합니다. 진행·취소·결과 필드는 [공통 Action 계약](../../cleany_interfaces/docs/observation-contracts.md#단일-물체-manipulation-action)을 따릅니다. Mission의 `action_mock`은 `/mock/manipulation`을 호출하며, 아래 nearest-pregrasp 및 연속 sorting과 별도 경로입니다.\n\n## Python Mock Manipulation 서버\n\n`manipulation_server`는 진행과 결과를 모의 생성합니다. Backend는 `mock`만 허용하며 clock, TF, odom, 카메라와 joint_states를 발행하지 않습니다. Steady clock으로 timeout과 취소를 처리합니다. [Endpoint 표](interfaces.md#manipulation_server)와 [실행 절차](../../../../docs/implementation/how-to/mission.md#주행도-mock으로-action-연결-확인)를 따릅니다.\n\n| 설정 | 용도 | 정상 시간 |\n|---|---|---|\n| [기본 fixture](../config/manipulation_mock.yaml) | 빠른 서버 계약 검사 | 단계당 기본 0.5초 |\n| [Mission 공유 fixture](../../cleany_mission_manager/config/manipulation_server_fixture.yaml) | 두 물체와 네 관측 | 물체당 합계 40초 |\n\n시간 우선순위는 scenario의 `stage_durations_sec`, 전역 `stage_durations_sec`, `stage_duration_sec` 순서입니다. 정지 단계 기본값은 `stop_duration_sec`입니다. [공유 시간표와 timeout](../../cleany_mission_manager/docs/manipulation-mock-integration.md#mock-조작의-관찰-시간)을 따릅니다.\n\nExecution ID는 중복 수락하지 않습니다. 재시작 시 ACTIVE를 INTERRUPTED로 보존하고 자동 재개하지 않습니다. 과거 JSON의 추가 필드는 기본값으로 읽으며 손상된 DB는 시작 오류입니다. 서버 DB와 Mission DB는 분리해 유지합니다. [결과, 취소와 보고 계약](../../cleany_interfaces/docs/manipulation.md)을 함께 확인합니다.\n\n조회는 메모리에 유지 중인 최신 상태를 포함합니다. 실행 중 서버 DB 쓰기가 실패하면 경고를 남기고 모의 동작 결과는 보존합니다. Mission의 전송 전 journal 저장과 결과 저장은 별도 계약이며, 조회 응답만으로 서버 DB 쓰기 성공을 판단하지 않습니다.\n\n## Reachable grasp action\n\n`grasp/select_reachable` (`SelectReachableGrasp`)는 trajectory나 gripper 명령을 보내지 않습니다.\n\n```mermaid\nflowchart TD\n  Candidate[\"점수순 후보 / 가까운 팔\"] --> IK[\"TCP 위치 IK seed\"]\n  IK --> Aim[\"실제 -Y 접근축의 0.14 m aim tip 정렬\"]\n  Aim --> FK[\"grasp 위치와 접근 / closing 방향 FK 확인\"]\n  FK --> Valid[\"state validity + 두 구간 계획\"]\n  Valid -->|통과| Result[\"선택한 팔과 joint target 반환\"]\n  Valid -->|실패| Next[\"같은 팔의 다음 해 → 반대 팔 → 다음 후보\"]\n  Next --> IK\n```\n\n| 검사 | 조건 |\n|---|---|\n| 입력 동일성 | snapshot, object, 좌표계, target OBB 일치; 좌표계은 `planning_frame` |\n| 현재 상태 | 양팔과 gripper 12개 joint 완전, 나이 0.5초 이내 |\n| pre-grasp | 접근 벡터 반대 방향 0.14 m |\n| 탐색 | 팔당 joint limit 전체에 분산한 8개 seed; 위치 seed 실패 시 현재 상태에서도 시도 |\n| 해 순위 | joint-limit 정규화 이동량, wrist roll 가중치 2; 자세 오차는 동률 비교 |\n| 방향 허용 | 접근축 최대 15°, jaw 대칭을 고려한 closing 축 최대 30° |\n| 계획 | current→pre-grasp와 pre-grasp→grasp 모두 검사 |\n| 종료 | 임시 target OBB와 ACM 복원 후 결과 확정; 복원 실패는 planning-scene 오류 |\n\n한 번에 goal 하나만 처리합니다. 각 IK, validity, planning 단계 전후에 timeout과 cancel을 확인합니다. Skill Executor는 결과를 반환하며 Mission Manager FSM을 직접 변경하지 않습니다.\n\n## 설정 및 검증\n\n`config/grasp_selection.yaml`이 planning 좌표계, timeout, attempts/scaling과 후보 수를 관리합니다.\n\n```bash\n# 각각 별도 터미널에서 같은 overlay 적용\nros2 launch cleany_moveit_config mock_planning.launch.py\nros2 launch cleany_skill_executor grasp_selection.launch.py\n# 저장소 루트의 단위 검사\npytest -q ros2_ws/src/cleany_skill_executor/test\n```\n\n일반 simulation 실행은 planning attempts 3, velocity/acceleration scaling 0.08, replan 2회와 delay 0.25초를 사용합니다. Controller 실패는 joint tracking error를 남기고 현재 상태에서 같은 joint goal로 한 번만 안전 재계획합니다. 연속 sorting의 값은 [별도 설정](study-cafe-sorting-configuration.md#sorting-속도와-실행-설정)을 따릅니다.\n\n\n## 가까운 객체 자동 pre-grasp\n\n`nearest_pregrasp_coordinator`는 다음 순서로 한 번의 작업을 수행합니다.\n\n```mermaid\nflowchart TD\n  Detect[\"InspectScene: distance_valid 후보 거리순\"] --> Restore[\"선택 물체 복원 → PlanGrasp\"]\n  Restore --> Reach[\"SelectReachableGrasp\"]\n  Reach --> Pre[\"target OBB 유지 / pre-grasp 실행\"]\n  Pre --> Mode{\"execute_grasp_and_lift\"}\n  Mode -->|false 기본| Done[\"pre-grasp에서 완료\"]\n  Mode -->|true| Reobserve[\"새 RGB-D / 동일 팔 재선택\"]\n  Reobserve --> Lift[\"Pilz LIN 접근 → 접촉 → 역접근 → 수직 상승\"]\n```\n\n양쪽 gripper는 object evaluation 전에 open합니다. 따라서 MoveIt 후보 검증과 실제 실행이\n동일한 gripper joint state 및 collision geometry를 사용합니다.\n\n가장 가까운 객체가 segmentation, grasp 생성 또는 양팔 도달성 검사에서 실패하면 다음\n가까운 객체로 fallback합니다. depth가 불충분해 `distance_valid=false`인 detection은\n자동 조작에서 제외합니다. infrastructure, MoveIt 또는 controller 실패는 다른 객체로\n넘기지 않고 전체 작업을 실패시킵니다.\n\nRGB-D camera, `perception/inspect_scene`, `grasp/plan`,\n`grasp/select_reachable`, MoveGroup과 arm/gripper controller를 먼저 실행한 뒤 coordinator를\n시작합니다.\n\n```bash\nros2 launch cleany_skill_executor nearest_pregrasp.launch.py\n```\n\nquery, timeout, 속도/가속도 scaling과 gripper open 위치는\n`config/nearest_pregrasp.yaml`에서 설정합니다. pre-grasp joint target은 운영 selector가\naim-tip IK와 FK 방향 검증까지 통과한 결과를 사용합니다. 성공한 target OBB는 완료 자세에서\nPlanning Scene에 유지하며, 실패하거나 coordinator가 종료될 때 기존 ACM과 함께 복원합니다.\n"},"ros2_ws/src/cleany_skill_executor/docs/physical-collection.md":{"title":"실물 수거 실행과 복귀","body":"# 실물 수거 실행과 복귀\n\n실물 BT는 선택된 물체의 접근, 파지, 들기, 운반과 팔 복귀를 실행한다.\n경로 계획과 파지 전 준비 자세는 [physical-pregrasp.md](physical-pregrasp.md)를 따른다.\nMoveIt은 경로만 계산하고 실제 명령은 하드웨어 실행기가 보낸다.\n\n새 cuRobo 실물 준비 세션은 모터 보호 노드의 실시간 준비 상태와 MoveIt 계획 장면 서비스의 관절 상태 응답을 확인한 뒤 GPU IK 초기화를 시작한다. GPU 기동 전과 전체 준비 검사에서 MoveIt의 궤적 실행 설정이 불리언 false인지 확인한다. 탐색이 끝난 뒤에도 설정 조회 응답이 도착하지 않으면 10초 검사 기한 안에 한 번 재조회한다.\n\n## 실행 경로\n\n`manipulation_jetson_server`는 기존 수거 트리를 실행하며 실행 기록을 별도 SQLite에 보존한다.\n관측과 파지 후보 선택 뒤 실행 준비 상태, 명령 경로와 피드백을 확인한다.\n정지 확인이 끝나지 않은 작업, 진행 중인 복귀 또는 해제하지 않은 복구 차단이 있으면\n새 작업을 시작하지 않는다. ROS 경로는 [BT 인터페이스](../../cleany_manipulation_bt/docs/interfaces.md)를 따른다.\n\n| 경로 | 동작과 완료 근거 |\n|---|---|\n| `full_collection` | 설정된 종류와 수거함을 사용하고 파지, 보유와 놓기 근거를 확인 |\n| `grasp_lift_hold`, `grasp_lift_return_hold` | 파지와 들기 이후 물체를 보유하는 단일 시험 |\n| `pick_return_release` | 원래 집은 위치로 돌아와 놓는 단일 시험. 놓기 상태는 명시적인 `assume_success` 설정이며 센서로 확인한 성공과 구분 |\n\n실물 프로필은 로봇별로 준비한 JSON과 모션 감시 설정을 명시적으로 입력한다.\n저장소의 `supervised_collection_fixture.json`은 가짜 동작 포트를 위한 테스트 입력이다.\n프로필 검사 통과나 `commissioning_verified` 값만으로 실물 검증을 대신하지 않는다.\n\n실측 TCP의 FK는 `execution_reuse_measured_fk` ROS 파라미터로 재사용하며 기본값은 `true`다.\n요청 좌표계에서 TCP까지의 URDF 관절 위치가 정확히 같을 때 마지막 성공 결과 하나만 재사용한다.\n관절 위치, 모델, 좌표계, 요청 링크나 통신 복구 횟수가 바뀌면 다시 계산한다.\n해당 TCP 위치에 영향을 주지 않는 그리퍼 관절과 다른 팔의 변경은 재사용을 막지 않는다.\nURDF 의존관계를 해석할 수 없거나 관절 정보가 불완전하면 기존 FK 서비스를 호출한다.\n재사용할 때도 최신 피드백, 취소와 모터 fault 검사를 먼저 수행하며 충돌과 도착 판정은 저장하지 않는다.\n실행 시간 기록을 켜면 `pickup_pose_captured`, `pickup_departure_recorded`, `return_planned`에\n누적 재사용 횟수 `measured_fk_cache_hits`와 성공한 서비스 호출 횟수 `measured_fk_service_calls`를 남긴다.\n\n## 명령 준비와 대기 재사용\n\nJetson 운용값은 [manipulation_jetson.yaml](../../cleany_manipulation_bt/config/manipulation_jetson.yaml)에서 읽는다.\n\n| 파라미터 | Jetson 값 | 적용 내용 |\n|---|---|---|\n| `hardware_trajectory_limit_scale` | 1.0 | 현재 관절별 속도와 가속도 상한을 명령 시간 계산에 반영. 코드 기본값은 0.8 |\n| `hardware_path_step_rad` | 0.02 | 궤적 충돌 검사 표본 간 관절 변화 상한. 명령점 수와 별개 |\n| `hardware_start_delay_sec`, `hardware_return_start_delay_sec` | 0.2초 | 팔과 그리퍼의 공통 시작 여유. 시작 전 수락 조건 유지 |\n| `hardware_retime_retreat` | true | 기록 후퇴 곡선의 속도와 가속도 극값으로 실행 시간을 다시 계산 |\n| `hardware_retreat_min_duration_sec`, `hardware_lift_min_duration_sec` | 0.3초 | 후퇴 역재생과 일반 들어올리기의 최소 시간. 실제 제한이 요구하면 더 길어짐 |\n| `hardware_prepare_models_on_startup` | true | 시작 시 정적 모델과 FK 준비. 전송 전 현재 모델과 controller 상태 조회 유지 |\n| `hardware_prefetch_release_retreat` | true | 놓은 뒤 후퇴 계획과 독립적인 모델 조회를 겹침 |\n\n팔의 요청 상한은 2rad/s와 8rad/s²이며 그리퍼는 별도 하드웨어 상한을 따른다.\n시간 계산의 5% 수치 여유와 관절 범위 검사는 유지한다. 곡선 표본은 벡터 계산하고\nURDF 회전축은 한 번 정규화한다. 측정 메시지의 필드를 직접 복사하고 하나의 응답\n대기 반복에서는 같은 측정을 두 번 만들지 않는다.\n\n파지 접근에서 준비점에 정착한 관절각과 선택된 궤적의 첫 점이 모든 팔 관절에서\n`hardware_start_tolerance_rad`(기본 0.005 rad) 이내이면 원본 관절 위치, 시간,\n속도와 가속도를 제어기에 전달한다. 전송 직전에도 시작 자세를 비교한다. 둘 중\n어느 검사에서든 허용치를 넘으면 실측 자세에서 같은 파지 TCP로 다시 계획한다.\n원본 궤적도 관절 범위, 속도, 가속도와 운영 충돌 정책을 적용한 전송 전 검사를\n받는다. 후퇴용 기록에는 실제 보낸 가속도도 저장한다.\n\n복귀 조회는 현재 팔, 명령 횟수, 통신 복구 세대와 신선도가 일치할 때 한 번 소비한다.\n후퇴 직후의 도착 확인은 전체 관절 위치와 모델이 정확히 같을 때만 재사용한다.\n빈 팔 복귀 시작에서도 정지 이력을 별도로 검사하고, 조건이 달라지면 새 조회와 대기를 한다.\n\n## 복귀와 복구\n\n| 동작 | 적용 조건 |\n|---|---|\n| 기록 경로 역재생 | `return_to_pick_reverse_enabled`로 선택한다. 목표 높이에 해당하는 구간을 찾고 명령 범위, 속도와 가속도를 검사 |\n| 단일 높이 보정 | `lift_height_correction_enabled`일 때 부족한 높이를 설정 단위로 올림해 한 번만 보정. XY, 위쪽 초과와 방향 검사는 유지 |\n| 빈 팔 home 복귀 | 저장된 home와 중간 자세를 사용하며 팔과 그리퍼의 수락 응답을 공통 시작 시각 전에 확인 |\n| 복구 차단 해제 | 현재 정지와 그리퍼 비움에 대한 명시 확인을 받고 최신 피드백으로 정지를 다시 검사. 과거 결과는 수정하지 않음 |\n\n현재 Jetson 프로필의 고정 중간 자세 복귀는 `bt_arm_return_collision_check_enabled=false`다.\n이 경로는 충돌 검사를 생략하지만 최종 명령의 관절 범위, 속도, 가속도와 도착 검사는 유지한다.\n충돌 검사 생략 여부를 실행 로그에 기록한다. 중간 자세가 없는 일반 복귀 경로는 충돌 검사와\n직접 연결 또는 RRT 계획을 사용한다. 이 구현 설정은 실물 안전성 검증 결과가 아니다.\n\n물체 복귀의 역재생 경로는 완료 후 추가 하강 보정이나 도착 오차 재검사를 수행하지 않는다.\n`hardware_pickup_height_search_tolerance_m`은 경로 절단 시점을 찾는 수치 오차다.\n취소, 통신 실패와 모터 fault는 계속 실패로 처리한다.\n\n## 명시 실행\n\n1. [개발환경](../../../../docs/implementation/development-setup.md)과 [실행 안내](../../../../docs/RUNNING.md)에 따라 설치를 준비한다.\n2. 로봇별 프로필 경로를 지정한다.\n\n   ```bash\n   export CLEANY_MANIPULATION_COLLECTION_CONFIG=/absolute/path/collection.json\n   export CLEANY_FEETECH_CONTROL_CONFIG=/absolute/path/control.json\n   export CLEANY_HARDWARE_MONITOR_CONFIG=/absolute/path/motion-monitor.yaml\n   ```\n\n3. `make collection-start`로 런타임을 시작하고 `make manipulation-start`로 대기 중인 BT 서버를 연결한다.\n   시작 시 설치된 ROS 패키지로 보정 파일과 제어 모델을 먼저 읽는다.\n   파일을 열거나 모델을 생성할 수 없으면 웹 작업 이력에 원인을 기록하고 장치 기동 전에 종료한다.\n   제어기가 첫 관절 피드백을 기다리는 `waiting` 상태에서는 기존 상태 조회 기한 안에 `ready`로 전환되는지 확인한다.\n   `make collection-plan`은 계획만 확인하고 `make manipulation-run`은 실제 단일 수거를 요청한다.\n4. 진행 상태는 `make collection-status`와 `make collection-logs`로 확인한다.\n   `make manipulation-recover`는 복구 상태를 조회하며 확인 인자는\n   `tools/collection-runtime action-recover --help`를 따른다.\n   `make arm-return`은 실제 팔 복귀를 요청한다.\n5. `make collection-stop`은 실행기 종료와 정지 확인을 기다린 뒤 의존 프로세스를 종료하고 토크를 해제한다.\n   종료를 확인하지 못한 프로세스의 PID는 보존하고 성공으로 보고하지 않는다.\n\n## 접촉과 대상 근거\n\n`manipulation_evidence`는 원시 모터 피드백의 접촉 판정과 손목 관측의 대상 식별을 결합한다.\nJetson 운영 프로파일은 양쪽 그리퍼에서 토크 한도 읽기값 400과 정상 정지 피드백을 확인한다.\n0.4초 창의 전류 원시값 중앙값이 15 이상이고 부하 원시값 최솟값이 200 이상이면 접촉으로 판정한다.\n전류 중앙값과 부하 최댓값이 각각 기준 미만이면 빈 상태로 판정한다.\n닫힘 목표까지 남은 인코더 틱은 진단에 기록한다.\n손목 관측은 대상 ID, 신선도와 시간 차이를 검사한다.\n구형 부하 단독 판정은 사용하지 않는다. 같은 근거를 재전송해도 새 관측이 되지 않는다.\n서비스와 메시지 정의는 [인터페이스](interfaces.md#manipulation_evidence)를 따른다.\n\n## 실행 준비와 시간 최적화\n\n동일한 관절 상태와 모델의 FK, IK client와 불변 모델 데이터는 재사용한다.\n최신 피드백 감시와 충돌 검사는 요청마다 유지하며 충돌 장면의 결과는 캐시하지 않는다.\n기록 경로는 `hardware_retime_retreat`로 역재생 시간 재계산을 선택할 수 있다.\n\n| Jetson 설정 | 값 | 적용 |\n|---|---|---|\n| `hardware_trajectory_limit_scale` | `1.0` | 요청 속도와 가속도를 물리 관절 한도로 제한 |\n| `hardware_path_step_rad` | `0.02` | 충돌 검사용 관절 보간 간격 |\n| `hardware_lift_min_duration_sec` | `0.3` | 들기 최소 시간. retimer의 속도와 가속도 제한 유지 |\n| `hardware_retreat_min_duration_sec` | `0.3` | 복귀 최소 시간 |\n| `hardware_retime_retreat` | `true` | 현재 한도로 기록 경로 재타이밍 |\n| `hardware_return_start_delay_sec` | `0.2` | 팔과 그리퍼의 공통 시작 대기 |\n\n위 값은 `cleany_manipulation_bt/config/manipulation_jetson.yaml`의 실행 프로필이며\n실행기 자체의 기본 여유율은 `0.8`이다. 실물 안전성과 전체 수거 시간의 개선은 별도 검증한다.\n"},"ros2_ws/src/cleany_skill_executor/docs/physical-pregrasp.md":{"title":"실물 파지 계획과 준비 자세 실행","body":"# 실물 파지 계획과 준비 자세 실행\n\n`physical_grasp_selection_server`는 파지 후보의 IK와 충돌을 검사하고 준비 자세와\n파지 자세 사이의 경로를 반환한다. 기본 backend는 MoveIt이다.\n`curobo_ik_moveit`은 cuRobo로 IK 후보를 구하고 전체 장면의 상태 검사와 경로 계획은\nMoveIt에서 수행한다. GPU 충돌 구는 후보 계산용 근사이며 최종 충돌 판정을 대신하지 않는다.\n하이브리드 IK는 실패한 후보에 설정된 재시도 횟수와 시드 수를 적용한다.\n\n```mermaid\nflowchart LR\n    Inspect[\"InspectScene\"] --> Validate[\"ValidatePick\"]\n    Validate --> Candidates[\"PlanGrasp: 기본 geometric\"]\n    Candidates --> Select[\"SelectReachableGrasp: IK / 충돌 / 경로\"]\n    Select --> Result[\"계획 시작 상태 / 시간 궤적 / FK 오차\"]\n    Result --> Pregrasp[\"hardware_pregrasp: 준비 자세까지만 실행\"]\n```\n\n기존 `grasp_selection_server`와 실물 선택기는 같은 Action 기본 이름을 사용하므로\n같은 namespace에서 함께 실행하지 않는다. `ValidatePick`과 선택기는 모터를 움직이지\n않는다. `hardware_pregrasp`는 사용자가 별도로 시작한 실물 controller에 명령을 보내며,\n수거, 들어올리기와 복귀를 실행하지 않는다.\n\n## 계획과 실행 조건\n\n| 경계 | 조건 |\n|---|---|\n| 후보 | 같은 snapshot, object, frame과 OBB. `required_arm`은 빈 값, `left`, `right` |\n| 현재 상태 | 완전하고 최신인 관절 상태. 오래된 상태나 잘못된 후보는 거절 |\n| 파지 준비 거리 | 실물 지원 프로필은 8cm부터 검사하고 IK 실패 시 6cm, 4cm 순으로 시도 |\n| 시간 궤적 | 시작 관절 상태와 함께 반환. 실행기는 현재 상태, 관절 범위, 속도와 가속도, 충돌을 다시 검사 |\n| 기준 물체 | PIN한 snapshot/object를 재관찰. 오래되거나 이동한 표면을 다른 물체로 대신하지 않음 |\n| 실물 준비 자세 | 이동 전후 기준 물체를 관찰하고 이동량을 검사. 파지 명령은 보내지 않음 |\n| 통신 복구 | 취소와 최신 피드백을 확인한 뒤 남은 경로를 다시 연결, 검사 |\n| 로컬 FK | 활성화 시 MoveIt FK와 먼저 대조. 모델, 관절, 그리퍼 변경 시 다시 확인하며 충돌 결과는 캐시하지 않음 |\n\n`pregrasp_motion.yaml`은 실물 후보 선택 설정, `geometric_pregrasp.yaml`은 기하학적\n후보 생성 설정이다. `hybrid_motion.yaml`은 GPU IK 설정을 추가한다. 기하학적 후보 생성이\n기본이며 AnyGrasp는 선택 사항이다. 설정의 허용오차는 물리 로봇의 안전 인증 기준이 아니다.\n보정 CAD 모델의 실물 수거는 `geometric_collection_cad.yaml`을 추가로 읽어\n대칭형 그리퍼가 같은 축을 180° 반대 손목 방향에서도 잡는 후보를 생성한다.\n\n`pregrasp_hardware_support.launch.py`에 `collection_config_file`을 지정하면\n선택기는 그 파일의 승인된 그리퍼 열림 각도, 닫힘 각도와 폭 기준을 실행기와\n함께 사용한다. 이 값은 패키지의 기본 선택 설정을 덮어쓴다. 현재 선택기는\n양팔에 하나의 폭 변환을 사용하므로, 두 팔의 이 세 값이 다르면 시작을 거부한다.\n파일을 생략했을 때의 각도 기본값은 최대 개방 기준 160° 보정을 따른다.\n100mm 폭은 명목값이며, 모터 끝점 확인이 개구 폭 곡선 측정을 대신하지 않는다.\n현재 보정과 복원용 스냅샷은 [캘리브레이션 안내](../../../../docs/CALIBRATION.md)에 있다.\n\n## 예열과 장면 처리\n\n`/grasp/warmup_status`는 GPU 준비 상태를 보고한다. VLM 대기 중 예열은 인식 launch의\n`vlm_ik_warmup_enabled`와 선택기의 `curobo_ik_vlm_warmup_enabled`를 모두 켰을 때\n사용한다. 실제 GPU 요청은 예열보다 우선하며 진행 중인 CUDA 호출은 중단하지 않는다.\n\n센서 장면은 관측 시각과 OctoMap을 확인한다. 자기 형상 필터의 메시 준비와 raycast\n중복 연산을 줄이되 캐시 검증 실패는 원래 계산으로 돌아간다. MoveIt 배치 검사는 한\n읽기 잠금 안에서 전체 로봇 상태를 검사한다. 배치 서비스가 없으면 단일 상태 검사로\n대체한다. 충돌 플러그인은 `cleany_moveit_collision`이 계속 관리한다.\n\n`hybrid_motion.yaml`은 선택 단계의 `state_validity_batch_size=64`와\n`selection_overlap_sensor_wait=true`를 사용한다. 센서 장면 갱신 동안 독립적인 후보\n준비를 진행하고 첫 장면 의존 검사 전에 같은 관측 시각과 원래 제한 시간으로 대기한다.\n선택 성공 직전에도 장면 유효성을 확인한다. 서비스 응답은 완료 알림으로 대기를 깨운다.\n\nGPU IK 결과가 32개 이상이면 손목 변형과 자세 오차를 GPU에서 묶어 계산한다.\nURDF에서 손목 축과 TCP 오프셋의 동축 관계가 확인된 경우 기준 FK에 손목 회전을\n합성하고, 관계가 맞지 않으면 전체 FK를 계산한다. 채택 후보는 현재 모델의 FK와 실제\n그리퍼 열림 상태로 MoveIt 검사를 통과해야 하며, 같은 요청의 확정 결과만 중복 검사 없이\n전달한다. 관절 순서와 공통 메시지 정보는 묶음 안에서만 공유한다.\nGPU 평가 후 전체 오차 통계는 숫자 배열에서 집계하고, 선택에는 유효한 자세 전부와\n가장 우선순위가 높은 탈락 자세만 객체로 만든다. 평가 개수와 탈락 근거는 보존한다.\n\n실물 준비 프로필의 손목 오프셋은 0°다. IK 결과의 손목 자세와 선호 자세,\n연속 정렬 자세, 허용 오차 안에서 선호 자세에 가까운 해를 평가한다.\n기하학적 후보의 yaw는 0°, ±20°, ±40°다. 보정 CAD 모델에서는 각 후보의 180° 반전\n방향도 탐색하며 접근 방향, 물체 형상과 충돌 조건을 적용한다.\n\n실행 절차는 [RUNNING](../../../../docs/RUNNING.md#실물-파지-계획과-준비-자세),\n검증 명령은 [TESTING](../../../../docs/TESTING.md#실물-계획과-실행-기반-검증),\nROS 계약은 [인터페이스](interfaces.md#physical_grasp_selection_server)를 따른다.\n\n공통 TCP, 그리퍼, GPU와 운영 충돌 정책은 [공통 파지 설정](shared-grasp-policy.md)을 따른다.\n\n## 파지 후보 배치 IK 선별\n\n`batch_grasp_ik_before_limit`을 켜면 양팔의 위치와 방향 조건을 만족하는\nIK 제안을 먼저 찾고 후보 수 제한을 적용한다. 선택 단계의 관절 범위와\n전체 충돌 장면 검사는 MoveIt에서 수행합니다. 묶음에서 후순위 후보의 관절해가\n최종 검사를 통과하지 못하면 해당 후보를 기본 시드 수로 다시 계산합니다.\n이때 해당 후보의 그리퍼 개구폭과 충돌 장면을 사용합니다.\n"},"ros2_ws/src/cleany_skill_executor/docs/shared-grasp-policy.md":{"title":"공통 파지 설정","body":"# 공통 파지 설정\n\ndev-monitor의 `물체 1개 실행`은 `make manipulation-run`에서 자동 대상을 고른 뒤\n`/manipulation/execute_skill`로 실행한다. 일반 물체 선택과 양팔 후보 검사를 유지한다.\n운영 수거 파일은 `CLEANY_MANIPULATION_COLLECTION_CONFIG`로 지정하며 Jetson 기본 파일은\n`configs/robot/jetson/collection.json`이다. CLI와 웹은 같은 선택기와 수거 실행기를 사용한다.\n\n| 항목 | 계약 |\n|---|---|\n| 예측기 기준점 | 후보의 TCP는 `translation + depth_m * rotation[:, 0]`이다. 원본 후보를 수정하지 않는다. |\n| 대칭 그리퍼 | 고정턱 TCP 이동, 추가 편향과 개구 중심 이동을 적용하지 않는다. 반대 파지 방향 중 현재 손목에서 회전량이 작은 방향을 먼저 검사한다. |\n| 접근 중 개방 | 승인된 `open_joint_rad`까지 연다. 선택기는 물체 폭이 수용 범위에 있는지 확인하고 최대 개방 각도로 상태와 경로를 검사한다. 실행기는 경로에 사용한 각도를 실물 설정의 최대 개방 각도와 비교한다. |\n| 준비 위치 Z | `pregrasp_z_offset_m`는 계획 좌표계 Z축의 미터 값이다. 준비 위치와 8/6/4cm 대체 준비 위치에만 더하며 최종 TCP와 접근 벡터는 바꾸지 않는다. Jetson 운영 파일은 `0.010`을 사용한다. |\n| 복귀 기준 | 운영 파일의 `home_joint_rad: \"startup\"`은 시작 관절 피드백을 복귀 기준으로 저장한다. |\n| GPU IK | `curobo_ik_moveit`, 배치 8개, CPU IK fallback 비활성 상태를 유지한다. |\n| IK 끝점 여유 | `curobo_ik_endpoint_margin_rad: 0.1`은 활성 팔의 GPU 탐색 범위와 최종 해 선택에 적용한다. URDF, 모터 및 MoveIt의 물리 관절 한계는 바꾸지 않는다. |\n| 경로 후보 수 | `maximum_path_candidates: 4`는 경로 검사에 진입할 서로 다른 후보·팔 조합을 제한한다. 먼저 검사한 조합의 지연 RRT 재시도는 유지한다. |\n\nGPU 후보 생성은 활성 팔의 어깨 yaw 접근 범위와 끝점 여유를 함께 적용한다.\n후보용 URDF의 해당 관절 한계만 좁히고 원본 모델과 반대 팔의 측정 상태는 유지한다.\n초기 seed, 검사를 미룬 후보의 선택과 CPU 자세 보정에도 같은 범위를 적용하며,\n범위를 벗어난 첫 후보 때문에 뒤의 유효한 후보를 버리지 않는다.\n\nJetson 운영 파일은 준비 위치에서 최종 파지 위치까지의 접근, 닫기, 들어올리기의 충돌 검사를 끈다.\n최대 개방, 준비 위치로의 이동, 복귀와 놓은 뒤 이탈, 그리퍼 보유 물체의 OctoMap 검사는 유지한다.\n선택 단계의 장면 충돌 검사와 경로 검사는 계속 수행한다. 모터 끝점 보정과 명목 개구 폭은 운영\n파일의 값을 그대로 사용하며 측정하지 않은 CAD 개구 폭 곡선을 새로 적용하지 않는다.\n\n`camera_preview.json`의 `rigid_accessory_files`는 왼쪽 손목의 고정 카메라 마운트 CAD 23개를\n시각화와 충돌 모델에 등록한다. 왼쪽 V8 근사 형상 15개를 교체하며 오른쪽 형상은 유지한다.\n등록 파일은 출처 SHA와 손목 부모 joint의 origin·axis를 검증한다. 이 형상은 자기 형상 필터와\n일반 충돌 모델에서 함께 사용한다. 카메라의 광학 TF, TCP, 관절 보정, 필터 padding 또는 허용\n충돌 목록을 변경하지 않는다.\n\n모터 없는 GPU 검증은 `tools/validation/verify_dev_monitor_gpu_grasp.py`에 생성한 URDF와\n실제 launch에서 합성한 파라미터 JSON을 전달한다. 양팔마다 알려진 FK 목표 8개를 CUDA로\n계산하고 끝점 여유와 위치 오차를 검사한다. 이 검증은 controller를 시작하거나 장치를 열지 않는다.\n\nGPU의 `joint_simplified_registered` 모드는 기존 링크의 형상 서명과 검증된 구를 유지한다.\n왼쪽 `left_gripper_frame`만 현재의 모든 convex body를 감싸는 구를 만든 뒤, 포함 관계를\n검사하며 설정된 개수로 합친다. 각 body의 모든 꼭짓점을 한 구가 포함하므로 내부 고체도\n포함한다. 등록 형상 표시가 없거나 다른 링크의 서명이 달라지면 거부한다. 원본 CAD,\n메시와 기존 검증 구 asset은 재생성하지 않는다.\n\n## dev-monitor와 운영 인식 공유\n\nJetson dev-monitor의 저장된 실행 설정은 `CLEANY_COLLECTION_USE_EXISTING_PERCEPTION=true`를 사용한다.\n이미 실행 중인 카메라와 `gemini-decision-1` 운영 인식을 공유하며, 파지 자세 계산은\n`curobo_ik_moveit` 컨테이너에 맡긴다. 일반 물체 자동 선택은 유지한다.\n\n| 경계 | 동작 |\n|---|---|\n| 시작 전 확인 | 현재 RGB·depth 영상과 InspectScene, ObserveObjectReference, ObserveWristTarget 서버를 읽기 전용으로 확인한다. 누락 시 모터 제어를 시작하기 전에 중단한다. |\n| 헤드 카메라 | 지원 launch의 `start_head_camera=false`는 카메라 드라이버와 RGB-D TF bridge를 새로 시작하지 않는다. 기본값은 true다. |\n| 시작·종료 소유권 | 공유된 인식·카메라 서비스를 시작하거나 종료하지 않는다. 관리 중인 런타임의 인식 소유권을 도중에 바꿀 수 없다. |\n| 운영 인식 기능 | 사용자 service의 `50-dev-monitor-observation.conf`는 기존 실행 명령과 모델을 보존하고 물체 참조와 손목 관찰 기능만 켠다. |\n| 독립 CLI | 환경변수를 생략하면 기존 컨테이너 인식 경로를 사용한다. 운영 인식을 공유할 때는 위 값을 명시한다. |\n\n공유 제공자는 먼저 실행 중이어야 한다. `python3 tools/shared_perception_readiness.py`로\n모터를 시작하지 않고 준비 상태를 확인할 수 있다. 기본 DDS domain은 호출 환경을 따른다.\n`verify_motion_container_readiness.py`에 `--collection-config`를 추가하면 별도 DDS domain에서\n공유 카메라 지원 launch 전체를 검사한다. 이 검사는 가상 관절 상태와 plan-only MoveIt만 사용한다.\n\n공유 모드의 웹, 작업 프로세스와 수거 실행기는 저장된\n`CLEANY_COLLECTION_SHARED_RMW_IMPLEMENTATION`을 ROS 초기화 전에 적용한다.\n기본값 `rmw_fastrtps_cpp`는 현재 native 운영 제공자와 일치한다. 비공유 컨테이너 경로는\n기존 CycloneDDS 설정을 유지한다. DDS 검색만으로 통신 성공을 판단하지 않는다.\n준비 검사는 `/perception_inspector/get_parameters`의 실제 RPC 응답에서\n`target_frame=base_link`, 물체 참조와 손목 관찰 활성 상태도 확인한다.\n\n## 보정된 CAD 경로\n\n`freecad_calibrated` 모델에서는 기존 GPU IK와 native MoveIt 충돌 판정을\n연결한다. 캐시된 CAD primitive는 IK 비용에 사용하며, 최종 충돌 허용은\n전체 CAD 형상으로 검사한다. 실제 손가락의 종속 좌표는 상태마다 다시\n계산한다. 기존 폭 제어 곡선, 일반 물체 자동 선택과 단계별 검사 설정은\n모델 연결만으로 변경하지 않는다. 상세 계약은\n[CAD 파지 모델](../../cleany_moveit_collision/docs/calibrated-cad.md)을 따른다.\n"},"ros2_ws/src/cleany_skill_executor/docs/study-cafe-sorting-configuration.md":{"title":"스터디카페 수거 설정","body":"# 스터디카페 수거 설정\n\n[실행](study-cafe-sorting-usage.md) / [충돌·접촉·운반 계약](study-cafe-sorting-contract.md)\n\n아래 값은 고정 베이스 시뮬레이션용입니다. Launch 인자는 다음 실행부터 적용되며 이미 실행 중인 GUI의 파라미터를 바꾸지 않습니다.\n\n## 작업자 관찰 모드와 파지 깊이\n\n| `sorting_verify_placement` | 동작 | 종료 결과 |\n|---|---|---|\n| `false` 기본 | 놓기와 복귀 후 다음 탐색; verifier 준비/호출을 기다리지 않음 | `complete_unverified`, `placement_verified=false`, `mission_complete_unverified` |\n| `true` | 독립 verifier로 안착 확인 | 확인을 통과해야 `mission_complete` |\n\n두 모드 모두 접촉 이탈 감시, 정지, 충돌 검사와 빈 작업영역 재확인을 유지합니다. 관찰 모드의 안착은 작업자가 GUI에서 확인합니다.\n\n| 접근 보정 | MuJoCo sorting 값 | 적용 |\n|---|---:|---|\n| `grasp_approach_offset_m` | 0.018 m | 공통; 일반 경로는 0.016 m |\n| `mouse_grasp_extra_depth_m` | +0.014 m | `mouse`, `computer mouse`, `wireless mouse`; 합계 32 mm |\n| `lego_grasp_extra_depth_m` | +0.004 m | 설정 라벨 정확 일치; 합계 22 mm |\n| `tissue_grasp_extra_depth_m` | +0.004 m | `crumpled tissue`, `tissue`, `crumpled paper`; 합계 22 mm |\n\n`red building block`은 레고 추가량에 매칭되지 않습니다. 실물/비sorting 추가량 기본은 0입니다. 일반 ROS 설정의 `deeper_grasp_labels`와 `deeper_grasp_offsets_m`은 같은 길이이며 selector/executor가 동일한 값을 사용해야 합니다. Pregrasp 위치는 유지합니다. 공통 깊이는 `0.016`, 휴지 추가량은 `0.0`으로 비교할 수 있습니다. 실측 보정값이 아니므로 다른 물체 크기에 재사용하기 전에 검증합니다.\n\n## 선택형 시뮬레이션 최적화와 원복\n\n| 옵션 | 사용 목적 / 기본값 |\n|---|---|\n| `sim_performance_profile` | `baseline`; 배경 충돌/그림자 절감은 [MuJoCo 프로필](../../cleany_mujoco_sim/docs/scenes.md#되돌릴-수-있는-고정-책상-최적화) |\n| `topdown_only` | 기본 false. true는 지지면 법선 아래 방향만 탐색하고 반대쪽 접근 필터를 끔; 사선 fallback 없음 |\n| `shutdown_on_sorting_exit` | false로 실행하면 완료/실패 뒤 GUI 유지 |\n| 초기 손목 roll | 양팔 +1.58 rad, keyframe과 actuator 목표에 적용; 실물 보정과 별개 |\n| `gripper_open_position_rad` | 1.2 rad; 열린 jaw 경로도 충돌 검사 |\n| `joint_limit_margin_rad` | sorting 0.005 rad, 일반 0; endpoint 선택 여유이며 feedback clipping 아님 |\n\nTop-down도 평면 추정과 IK 오차 허용이 있으므로 완벽한 수직 제어를 뜻하지 않습니다. IK와 충돌 허용 기준은 동일합니다.\n\n## 파지 후 Depth 최신성\n\n```mermaid\nsequenceDiagram\n  participant Arm as 조작 실행\n  participant Camera as sorting_cameras\n  participant Map as OctoMap\n  Arm->>Camera: 접근 / 닫기 / lift 동안 head_depth_boost=true\n  Arm->>Map: 물체 attachment\n  Camera->>Map: attachment 이후 촬영한 Depth\n  Map-->>Arm: 처리 완료 receipt + populated map\n  Note over Arm,Map: capture / map 신선도 2초 이내\n  Arm->>Camera: 구간 종료 또는 실패 시 boost=false\n```\n\n| `attachment_scene_timeout_sec` 적용 경로 | wall time 상한 |\n|---|---:|\n| 일반 sensor-scene | 5초 |\n| 시뮬레이터를 시작하지 않는 sorting 구성 | 10초 |\n| MuJoCo 시뮬레이터를 시작하는 sorting | 30초 |\n\n이는 준비 응답의 최대 대기 시간입니다. 신선도 2초를 늘리지 않으며 준비되면 즉시 진행합니다. 외부 실물 수거 실행은 아직 지원하지 않습니다. Boost 거부 시 이동하지 않으며 카메라 노드도 함께 빌드해야 합니다.\n\n| 지도 설정 | 범위 / 절충 |\n|---|---|\n| `KnownGeometryOctomapUpdater` | MuJoCo sorting 기본. 등록한 물체 형상 내부에 완전히 포함된 셀만 제거; 부분 겹침과 주변 장애물 유지 |\n| `depth_octomap_plugin` | 명시 override; 실물과 비sorting은 기존 updater |\n| `scene_cloud_pixel_stride` | MuJoCo 4: 640×480 최대 19,200점. 일반 2: 76,800점. 인식 해상도는 유지하지만 작은 장애물 점 밀도 감소 |\n\n지도 갱신은 원본 cloud 수신만으로 인정하지 않습니다. 처리 receipt와 populated map 조건은 [계약](study-cafe-sorting-contract.md#접촉-재시도와-운반-감시)을 따릅니다. 어깨 기준점은 현재 CAD URDF shoulder origin이며 `test_learned_runtime_launch.py`가 grasp parameter와 일치하는지 검사합니다.\n\n## 닫기 직후 접촉 확인\n\n| 조건 | 기본값 |\n|---|---|\n| 새 joint-state의 안정 샘플 | 연속 3개 이상 |\n| ROS 시간 안정 구간 | `gripper_contact_stable_duration_sec`: 0.10초 이상 |\n| 실제 시간 대기 | `gripper_contact_feedback_timeout_sec`: 최대 5초 |\n\n속도가 튀면 안정 구간을 초기화합니다. 이 확인 중 추가 닫기 명령을 보내지 않으며 controller 실패나 새 feedback 누락은 실패입니다. CHECK 전후의 0.3초 확인과 닫기 재시도는 [별도 계약](study-cafe-sorting-contract.md#자동-sorting의-손목-미검출-보완)입니다.\n\n## Sorting 속도와 실행 설정\n\n다음 값은 simulation sorting launch의 기본값입니다. 일반 demo와 실물 로봇의\n하드웨어 한계와 구분하며, 각 이름은 launch argument 및 ROS parameter입니다.\n\n| 설정 | 기본값 |\n| --- | ---: |\n| `velocity_scaling` / `acceleration_scaling` | 0.30 / 0.50 |\n| `sorting_payload_velocity_scaling` / `sorting_payload_acceleration_scaling` | 0.24 / 0.20 |\n| `cartesian_translation_speed_m_s` | 0.30 |\n| `approach_velocity_scaling` / `retreat_velocity_scaling` | 1.0 / 0.8 |\n| `cartesian_translation_acceleration_m_s2` | 0.80 |\n| `cartesian_joint_acceleration_rad_s2` | 4.0 |\n| `cartesian_rotation_speed_rad_s` | 1.50 |\n| `lin_acceleration_scaling` | 0.8 |\n| `corridor_time_margin` | 1.05 |\n| `gripper_motion_sec` (별도 닫기/놓기 명령) | 2.0 |\n\n접근 가속도 배율 `sorting_approach_acceleration_scaling=1.0`은 유지합니다.\npregrasp와 그리퍼 열기는 기존 6관절 동시 계획을 유지하며, 별도 2초 대기를\n추가하지 않습니다. 운반은 기본 이동 배율과 payload 배율의 최솟값을 적용합니다.\n위 Cartesian 속도는 retiming 상한이지 실제 일정 속도를 보장하는 값이 아닙니다.\n충돌/FK/관절 위치·속도 한계, 추적·접촉 감시, timeout 취소는 유지합니다.\n시뮬레이션 속도는 실제 경과 시간과 다를 수 있으며, 이 설정은 실물 성능 검증값이 아닙니다.\n\n## 관측 형상과 재선택\n\n```mermaid\nflowchart LR\n    Mesh[\"grasp 서버 / 관측 collision geometry\"] --> Cache[\"64개 bounded cache / 동일성 검사\"]\n    Cache --> Valid[\"finite / closed / outward / convex / 크기 상한\"]\n    Valid --> Scene[\"target collision + attachment\"]\n    New[\"Head 재관측 후보\"] --> Continuity[\"기존 중심 / 방향 연속성\"]\n    Continuity --> Arm[\"같은 팔 reachability 검사\"]\n```\n\n| 설정 / 검사 | 계약 |\n|---|---|\n| use_observed_collision_geometry | Sorting true, 일반 false는 기존 OBB |\n| 입력 | /grasp/collision_geometry의 snapshot/object ID, capture header, OBB pose 정확 일치 |\n| Mesh 유효성 | Finite / closed / outward / convex, vertex / triangle 상한 |\n| 활성 상태에서 geometry 없음 | Timeout 뒤 실패; OBB로 조용히 대체 안 함 |\n| 유지 검사 | Support patch, 전체 robot open/closure |\n| 운반 / 재관측 / 놓기 반경 | OBB 반대각선과 mesh 최대 local vertex 거리 중 큰 값 |\n| 한계 | Trimmed OBB 밖 관측점 포함, 숨은 실제 형상 보장 아님; cache는 identity 검사 |\n| 시간 | Sensor-scene / wrist freshness 별도 적용 |\n| 기록 | 수신 collision_geometry CDR도 artifact에 포함 |\n| 재선택 | 중심 / 방향 연속성 통과 후보만 같은 팔 selector에 전달; 호환 후보 없으면 이동 전 실패 |\n| Head 갱신 | sorting_head_reference_refresh_age_sec 기본 0, 양수로 진단 가능, 최대 30 s |\n\nHead 갱신을 켜도 새 관측과 재계획은 기존 simulation-clock 신선도 상한을 만족해야 합니다.\n\n## 서비스와 실행 대기 상한\n\n응답 timeout은 고정 대기나 충돌 허용치가 아닙니다. 준비되면 즉시 진행하고 만료되면 해당 작업을 실패시킵니다.\n\n| 설정 | 일반 | CPU sorting |\n|---|---:|---:|\n| `planning_scene_timeout_sec` | selector 1초 / executor 2초 | 5초 |\n| `state_validity_timeout_sec` | 1초 | 5초 |\n| `fk_timeout_sec` | [selector config](../config/grasp_selection.yaml) | 5초 |\n| `ik_response_margin_sec`, `planning_response_margin_sec` | 1초 | 5초 |\n| IK / aim IK / MoveGroup 계산 예산 | 0.15 / 1 / 4초 | 동일 |\n\n응답 여유는 계산 예산 뒤에 더하며 aim IK에도 적용합니다. 충돌 검사나 실패 결과를 생략하지 않습니다.\n\nCartesian wall deadline은 `max(minimum_sec, trajectory_duration × factor + margin_sec)`입니다.\n\n| `cartesian_execution_wall_timeout_` 접미사 | 값 |\n|---|---:|\n| `minimum_sec` | 60초 |\n| `margin_sec` | 10초 |\n| `factor` | 일반 2 / CPU sorting 10 |\n\n동작 감속값이 아니며 접촉·추적 감시와 timeout 시 취소·종료 확인은 유지합니다.\n\n## 동시 관절 이동과 카메라 인계\n\n```mermaid\nflowchart TD\n    Search[\"search / head RGB-D 선택\"] --> Pre[\"선택 팔 6관절 pregrasp + gripper 열기\"]\n    Pre --> Done[\"팔 / gripper 두 Action 완료 + 6관절 feedback\"]\n    Done --> Handoff[\"손목 RGB HANDOFF / head 2 Hz, 선택 손목 10 Hz\"]\n    Handoff --> Lift[\"접근 / 파지 / lift / CHECK\"]\n    Lift --> Carry[\"고정 수거함 운반 / 접촉과 충돌 감시\"]\n    Carry --> Release[\"놓기 / attachment 해제\"]\n    Release --> Return[\"head 복원 / 6관절 복귀 + gripper 닫기\"]\n```\n\n| 동시 이동 | 계약 |\n|---|---|\n| 시작 | 양손 초기 열기 없음; 선택 팔만 *_pregrasp_open 사용 |\n| 검사 | 열린 jaw 포함 전체 경로; target 접촉 허용은 grasp 접근부터 |\n| Controller | MoveIt이 팔 / gripper 궤적 분배; 두 완료와 선택 6관절 feedback 전에는 HANDOFF 금지 |\n| 반대 팔 / IK | 반대 gripper 미이동; grasp / retreat IK는 기존 5관절 |\n| 복귀 | *_return_close, 저장된 원래 팔 자세 + sorting_return_gripper_position_rad=-0.30 |\n| 복귀 조건 | 의도한 release와 attachment 해제 뒤 빈 팔만, jaw 충돌과 두 controller 완료 확인 |\n| 시간 | gripper_open_position_rad는 최종 열림; gripper_motion_sec는 별도 파지 / 놓기만, 동시 이동 시간은 MoveIt 경로가 결정 |\n\n| 손목 인계 / 운반 | 경계 |\n|---|---|\n| HANDOFF | 기존 head 3D와 경로 보존, RGB로 일관성 검사; 실패 시 중단 |\n| 이 분기의 제외 동작 | Head 재검출 / 3D 재계산 / head 시야 복구 이동 |\n| Lift 근거 | 손목 mask, 닫힘 명령 대비 관절 접촉 추정, kinematic clearance |\n| 측정 한계 | 독립 힘 센서 / depth 상승량 아님; 옛 3D를 새 측정값으로 표시 안 함 |\n| 수거함 | robot_top_bins.yaml 초기 base_link 위치, 전후 접촉 / 충돌 검사; [입구 검사는 경로별 구분](study-cafe-sorting-contract.md) |\n| 카메라 TF | Nominal CAD; 실물은 측정한 양팔 hand-eye 필요 |\n| 설정 파일 | sorting_wrist_cameras_config, 기본 cleany_mujoco_sim/config/sorting_wrist_cameras.yaml |\n| 실행 범위 | 외부 로봇 수거 / visual servo 미지원; 경로는 head 3D와 joint feedback에 의존 |\n| Head-only 비교 | sorting_use_wrist_camera:=false |\n"},"ros2_ws/src/cleany_skill_executor/docs/study-cafe-sorting-contract.md":{"title":"스터디카페 분류·운반 실행 계약","body":"# 스터디카페 분류·운반 실행 계약\n\n[실행](study-cafe-sorting-usage.md) / [설정](study-cafe-sorting-configuration.md)\n\n센서로 선택한 물체를 집어 로봇 내부 후면 수거함의 고정 위치에 놓습니다. 아래는 MuJoCo 실행 계약이며 전체 물리 정리 성공이나 실로봇 안전을 보증하지 않습니다.\n\n```mermaid\nflowchart TD\n  Select[\"분류 / 거리순 후보\"] --> Safe[\"시야 + IK + 열린 jaw / 닫힘 충돌 검사\"]\n  Safe --> Pre[\"pre-grasp / 손목 HANDOFF\"]\n  Pre --> Contact[\"접근 / 닫기 / 새 접촉 feedback\"]\n  Contact --> Map[\"attachment 이후 새 Depth / 지도 확인\"]\n  Map --> Lift[\"후퇴 / lift / CHECK\"]\n  Lift --> Fit[\"물체 경계 구 / 입구와 고정 놓기점 검사\"]\n  Fit --> Carry[\"부착 물체 충돌 검사 / 고정 투하점\"]\n  Carry --> Release[\"중심 + 손목 확인 / 놓기 / 복귀\"]\n  Release --> Verify{\"독립 안착 검증 사용?\"}\n  Verify -->|false 기본| Unverified[\"complete_unverified\"]\n  Verify -->|true| Oracle[\"독립 placement verifier\"]\n```\n\n| 경로 | 놓기 직전 확인 | 결과의 한계 |\n|---|---|---|\n| 자동 sorting / MuJoCo BT Action | 물체 중심, wrist feedback, MoveIt 충돌, bounding sphere 입구 검사 | 같은 margin / 높이와 공통 검사 적용; 실물 검증 아님 |\n\n## 분류·운반 실행 계약\n\n| 항목 | 규칙 |\n|---|---|\n| 배치 | `robot_top_bins.yaml`의 내부 후면 받침판과 수거함; 책상 양끝 분류 영역과 구분선 없음 |\n| 분류 | Gemini category/reason을 `table_sorting_policy.yaml` destination에 연결; label allowlist로 대체하지 않음 |\n| 대상 | RGB-D 거리순 시도, 위험 label 거부, 수거 구역 물체 다시 집지 않음 |\n| 완료 | 미처리 / 미확인 물체가 없어야 함; 관측 수보다 완료 수가 적으면 중단 |\n| 빈 영역 | 두 번 재확인; search/action 최대 12회 도달 시 실패 |\n| 수량 검사의 한계 | 객체 identity 추적과 독립 안착 검증을 대체하지 않음 |\n| MuJoCo oracle | 물체 전체 AABB가 수거함 안에 있고 정지했는지 검사 |\n| 종료 | `sorting_exit_on_finish=true`; GUI 유지 시 `shutdown_on_sorting_exit:=false
