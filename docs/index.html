'use strict';
const pages = {"README.ko.md":{"title":"끌리니 (Cleany)","body":"\u003cp align=\"center\">\n  \u003cimg src=\"docs/assets/readme/banner-ko.svg\" width=\"100%\" alt=\"끌리니 — 무인 스터디카페 정리 로봇. 원본 CAD 조립 모델 렌더.\">\n\u003c/p>\n\n\u003cp align=\"center\">\u003ca href=\"README.md\">English\u003c/a> | \u003cstrong>한국어\u003c/strong>\u003c/p>\n\n# 끌리니 (Cleany)\n\n[![ROS 2 Humble](https://img.shields.io/badge/ROS_2-Humble-22314E?style=flat-square&logo=ros&logoColor=white)](docs/implementation/development-setup.md)\n[![Ubuntu 22.04](https://img.shields.io/badge/Ubuntu-22.04-E95420?style=flat-square&logo=ubuntu&logoColor=white)](docs/implementation/development-setup.md)\n[![Jetson Orin](https://img.shields.io/badge/NVIDIA-Jetson_Orin-76B900?style=flat-square&logo=nvidia&logoColor=white)](docs/implementation/how-to/control-plane-integration.md)\n\n끌리니는 **무인 스터디카페에서 사용이 끝난 책상을 정리하기 위해 개발 중인 로봇**입니다. 운영자가 좌석을 지정하면 해당 위치로 이동해 책상 위 물체를 확인하고 쓰레기를 수거하는 것을 목표로 합니다.\n\nXLeRobot 기반 양팔과 Mecanum 베이스에 RGB-D 카메라, LiDAR를 장착했습니다. 이 저장소에는 ROS 2 기반 주행, 인식, 조작 코드와 MCU 펌웨어가 있습니다. 대시보드와 서버는 [cleany-control-plane](https://github.com/asm17-moving-agent/cleany-control-plane)에서 개발합니다.\n\n[주요 기능](#주요-기능) · [시연](#시연) · [기술 스택](#기술-스택) · [시스템 구성](#시스템-구성) · [실행 방법](#실행-방법) · [팀 소개](#팀-소개)\n\n## 주요 기능\n\n- **자율주행**: LiDAR로 실내 지도를 만들고, Nav2로 지정한 위치까지의 경로를 계획합니다. Mecanum 베이스의 전후진, 회전과 횡이동을 지원합니다.\n- **물체 인식과 조작**: RGB-D 영상에서 물체를 찾고 3D 위치와 파지 후보를 구합니다. MoveIt 2로 로봇팔의 동작을 계획하고 Behavior Tree로 실행합니다.\n- **작업 관리**: 서버에서 받은 작업의 진행 상태와 결과를 관리합니다. 작업 취소, 중복 요청 처리와 오류 발생 시 복구 절차를 구현했습니다.\n- **수동 조종**: 브라우저의 조종 스틱으로 이동하거나 지도에서 목표 위치를 지정할 수 있습니다. 로봇 위치와 카메라 영상도 확인할 수 있습니다.\n\n## 시연\n\n### 로봇 동작과 지도 생성\n\n\u003ctable>\n  \u003ctr>\n    \u003cth width=\"50%\">실물 작업 장면\u003c/th>\n    \u003cth width=\"50%\">SLAM 지도 생성\u003c/th>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd align=\"center\">\u003cimg src=\"docs/assets/readme/table-work.gif\" width=\"320\" alt=\"사람이 함께 참여하는 실물 로봇 조작 실험\">\u003c/td>\n    \u003ctd align=\"center\">\u003cimg src=\"docs/assets/readme/map-growth.gif\" width=\"480\" alt=\"기록 지도와 Cartographer 재실행 결과로 만든 지도 확장 GIF\">\u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n### 인식과 이동\n\n![YOLOE Detection, Segmentation과 depth 기반 3D 목표](docs/assets/readme/perception-pipeline.png)\n\n![Mecanum 운동학: 전진, 횡이동, 회전 명령의 CAD 애니메이션](docs/assets/readme/mecanum-motion.gif)\n\n### 시뮬레이션\n\n\u003ctable>\n  \u003ctr>\n    \u003cth width=\"50%\">Gazebo 스터디카페\u003c/th>\n    \u003cth width=\"50%\">Isaac Sim 병렬 환경\u003c/th>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/gazebo-study-cafe.png\" width=\"100%\" alt=\"Gazebo 스터디카페 환경의 Cleany\">\u003c/td>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/isaac-parallel.png\" width=\"100%\" alt=\"Isaac Sim의 독립 로봇 환경 16개\">\u003c/td>\n  \u003c/tr>\n  \u003ctr>\n    \u003cth width=\"50%\">MuJoCo\u003c/th>\n    \u003cth width=\"50%\">RViz\u003c/th>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/mujoco-work.gif\" width=\"100%\" alt=\"MuJoCo 파지 동작 기록\">\u003c/td>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/rviz-motion.gif\" width=\"100%\" alt=\"RViz 팔 동작 기록\">\u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n### 대시보드와 CAD\n\n\u003ctable>\n  \u003ctr>\n    \u003cth width=\"50%\">관제 대시보드 (예시 데이터)\u003c/th>\n    \u003cth width=\"50%\">FreeCAD\u003c/th>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd align=\"center\" valign=\"middle\">\u003ca href=\"https://github.com/asm17-moving-agent/cleany-control-plane\">\u003cimg src=\"docs/assets/readme/dashboard.png\" width=\"100%\" alt=\"좌석 배치와 로봇 상태를 보여주는 관제 대시보드\">\u003c/a>\u003c/td>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/freecad-workspace.png\" width=\"100%\" alt=\"FreeCAD에서 연 Cleany 조립체와 모델 트리\">\u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n## 기술 스택\n\n| 구분 | 기술 |\n|---|---|\n| 개발 환경 | Ubuntu 22.04, ROS 2 Humble, Python 3.10, C++ |\n| 하드웨어 | NVIDIA Jetson Orin, ESP32, micro-ROS |\n| 주행 | Cartographer, Nav2, AMCL, Smac Lattice, MPPI |\n| 인식 | RGB-D, YOLOE, OpenCV |\n| 조작 | MoveIt 2, ros2_control, BehaviorTree.CPP, Feetech Servo |\n| 모델과 시뮬레이션 | FreeCAD, URDF/Xacro, MJCF, Gazebo Fortress, MuJoCo, Isaac Sim (실험) |\n\n## 시스템 구성\n\n서버에서 받은 작업은 Control Bridge를 거쳐 Mission Runtime으로 전달됩니다. Mission Runtime은 주행과 조작을 요청하고, Supervisor는 로봇 상태를 확인해 실행 허가와 복구를 관리합니다.\n\n```mermaid\nflowchart TB\n    CP[\"대시보드 / 서버\"]\n    Bridge[\"Control Bridge\u003cbr/>관제 ↔ ROS\"]\n    Mission[\"Mission Runtime\u003cbr/>작업 상태와 결과\"]\n    Supervisor[\"Supervisor\u003cbr/>실행 허가 / 복구\"]\n    Nav[\"Navigation\u003cbr/>Nav2 Adapter\"]\n    Desk[\"Desk Adapter\u003cbr/>Mock / Action\"]\n    Telemetry[\"Telemetry\u003cbr/>위치 관측\"]\n\n    CP \u003c-->|WebSocket| Bridge\n    Bridge \u003c--> Mission\n    Supervisor -.-> Mission\n    Mission --> Nav\n    Mission --> Desk\n    Telemetry -->|Pose| Bridge\n\n    classDef web fill:#edf4fa,stroke:#6e89a2,color:#21384b\n    classDef edge fill:#edf7f3,stroke:#6a9b8c,color:#214a40\n    classDef control fill:#fff6e8,stroke:#b89b66,color:#5d4827\n    class CP web\n    class Bridge,Mission,Nav,Desk,Telemetry edge\n    class Supervisor control\n```\n\n수동 조종은 `cleany_teleop`, 위치와 카메라 관측은 `cleany_telemetry`가 담당합니다. Telemetry는 서버 없이 실행할 수 있으며, 서버와의 통신은 Control Bridge와 카메라 프록시에서 처리합니다.\n\n책상 작업은 실행 설정에 따라 Mock 또는 조작 Action 서버에 연결합니다. 자세한 내용은 [연동 구조](docs/implementation/integration.md)와 [패키지별 인터페이스](docs/implementation/ros-interfaces.md)를 참고하세요.\n\n## 개발 현황\n\n주행, 조작과 관제 기능을 통합하고 있습니다. **작업 요청부터 책상 정리와 복귀까지의 전체 실물 검증은 남아 있습니다.**\n\n- [ ] 현장 좌석 배치에 맞춰 접근 좌표와 로봇 보정값 확인\n- [ ] Jetson에서 작업 요청 → 이동 → 책상 정리 → 복귀 → 결과 보고 검증\n\n[환경별 검증 범위와 결과](docs/EVIDENCE.md)\n\n## 실행 방법\n\nUbuntu 22.04와 ROS 2 Humble을 기준으로 합니다. 처음 설치한다면 [개발환경 설정](docs/implementation/development-setup.md)을 먼저 진행해 주세요. 아래 명령은 ROS 설치와 rosdep 초기화, 프로젝트 규칙 등록을 마친 환경에서 실행합니다.\n\n```bash\ngit clone --recurse-submodules https://github.com/asm17-moving-agent/cleany.git\ncd cleany\nsource /opt/ros/humble/setup.bash\n\nmake deps\nmake build\nsource \"$(make -s print-install-base)/setup.bash\"\n```\n\n테스트와 Gazebo 실행:\n\n```bash\nmake test\nmake sim-gazebo\n```\n\n`make sim-gazebo`는 Gazebo를 headless로 실행합니다. Nav2와 미션 연결, 실물 장치 설정은 다음 가이드를 참고하세요.\n\n- [SLAM 매핑](docs/implementation/how-to/mapping.md) / [휴대폰 주행](docs/implementation/how-to/phone-navigation.md)\n- [물체 인식과 로봇팔 조작](docs/implementation/how-to/manipulation.md)\n- [서버와 미션 연결](docs/implementation/how-to/mission.md) / [Jetson 배포](docs/implementation/how-to/control-plane-integration.md)\n\n## 팀 소개\n\n**AI·SW마에스트로 제17기 | AI 에이전트는 움직이고 싶어**\n\n이동근, 박창수, 이정현\n\n[GitHub](https://github.com/asm17-moving-agent) · [관제 저장소](https://github.com/asm17-moving-agent/cleany-control-plane)\n\n---\n\n[개발 문서](docs/index.md) · [학습 가이드](docs/guide/README.md) · [기획 문서](docs/cleany-docs/README.md) · [이미지와 영상 출처](docs/assets/readme/sources.json)\n"},"README.md":{"title":"Cleany","body":"\u003cp align=\"center\">\n  \u003cimg src=\"docs/assets/readme/banner.svg\" width=\"100%\" alt=\"Cleany — a mobile manipulator for study cafés. Render of the original CAD assembly.\">\n\u003c/p>\n\n\u003cp align=\"center\">\u003cstrong>English\u003c/strong> | \u003ca href=\"README.ko.md\">한국어\u003c/a>\u003c/p>\n\n# Cleany\n\n[![ROS 2 Humble](https://img.shields.io/badge/ROS_2-Humble-22314E?style=flat-square&logo=ros&logoColor=white)](docs/implementation/development-setup.md)\n[![Ubuntu 22.04](https://img.shields.io/badge/Ubuntu-22.04-E95420?style=flat-square&logo=ubuntu&logoColor=white)](docs/implementation/development-setup.md)\n[![Jetson Orin](https://img.shields.io/badge/NVIDIA-Jetson_Orin-76B900?style=flat-square&logo=nvidia&logoColor=white)](docs/implementation/how-to/control-plane-integration.md)\n\nCleany is a **mobile manipulator project for clearing desks in unattended study cafés**. The goal is to let an operator select a seat, then have the robot navigate to the desk, inspect the objects on it, and collect waste.\n\nThe robot combines XLeRobot-based dual arms, a Mecanum drive base, RGB-D cameras, and LiDAR. This repository contains the ROS 2 navigation, perception, and manipulation code, along with MCU firmware. The dashboard and backend are developed in [cleany-control-plane](https://github.com/asm17-moving-agent/cleany-control-plane).\n\n[Features](#features) · [Demos](#demos) · [Tech stack](#tech-stack) · [Architecture](#architecture) · [Getting started](#getting-started) · [Team](#team)\n\n## Features\n\n- **Navigation**: Build indoor maps with LiDAR and plan routes with Nav2. The Mecanum base supports forward, lateral, and rotational motion.\n- **Perception and manipulation**: Detect objects in RGB-D images, estimate their 3D positions, and generate grasp candidates. MoveIt 2 plans arm motion, and a Behavior Tree coordinates execution.\n- **Mission management**: Track work requested by the backend and report progress and results. Handle cancellation, duplicate requests, and recovery after faults.\n- **Manual control**: Drive the robot with a browser joystick or select a goal on the map. View robot position and camera previews.\n\n## Demos\n\n### Desk work and mapping\n\n\u003ctable>\n  \u003ctr>\n    \u003cth width=\"50%\">Physical desk work\u003c/th>\n    \u003cth width=\"50%\">SLAM mapping\u003c/th>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd align=\"center\">\u003cimg src=\"docs/assets/readme/table-work.gif\" width=\"320\" alt=\"Physical robot manipulation experiment with human assistance\">\u003c/td>\n    \u003ctd align=\"center\">\u003cimg src=\"docs/assets/readme/map-growth.gif\" width=\"480\" alt=\"Map growth from recorded maps and Cartographer sensor-replay snapshots\">\u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n### Perception and mobility\n\n![YOLOE detection, segmentation mask and depth-based 3D target](docs/assets/readme/perception-pipeline.png)\n\n![Mecanum kinematics: CAD animation of forward, lateral and rotational commands](docs/assets/readme/mecanum-motion.gif)\n\n### Simulation\n\n\u003ctable>\n  \u003ctr>\n    \u003cth width=\"50%\">Gazebo study café\u003c/th>\n    \u003cth width=\"50%\">Isaac Sim parallel environments\u003c/th>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/gazebo-study-cafe.png\" width=\"100%\" alt=\"Cleany in the Gazebo study café environment\">\u003c/td>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/isaac-parallel.png\" width=\"100%\" alt=\"Sixteen independent robot environments in Isaac Sim\">\u003c/td>\n  \u003c/tr>\n  \u003ctr>\n    \u003cth width=\"50%\">MuJoCo\u003c/th>\n    \u003cth width=\"50%\">RViz\u003c/th>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/mujoco-work.gif\" width=\"100%\" alt=\"Recorded MuJoCo grasp motion\">\u003c/td>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/rviz-motion.gif\" width=\"100%\" alt=\"Recorded arm motion in RViz\">\u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n### Dashboard and CAD\n\n\u003ctable>\n  \u003ctr>\n    \u003cth width=\"50%\">Dashboard (example data)\u003c/th>\n    \u003cth width=\"50%\">FreeCAD\u003c/th>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd align=\"center\" valign=\"middle\">\u003ca href=\"https://github.com/asm17-moving-agent/cleany-control-plane\">\u003cimg src=\"docs/assets/readme/dashboard.png\" width=\"100%\" alt=\"Dashboard showing the seat layout and robot status\">\u003c/a>\u003c/td>\n    \u003ctd align=\"center\" valign=\"middle\">\u003cimg src=\"docs/assets/readme/freecad-workspace.png\" width=\"100%\" alt=\"Cleany assembly open in the FreeCAD workspace\">\u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n## Tech stack\n\n| Area | Technologies |\n|---|---|\n| Development | Ubuntu 22.04, ROS 2 Humble, Python 3.10, C++ |\n| Hardware | NVIDIA Jetson Orin, ESP32, micro-ROS |\n| Navigation | Cartographer, Nav2, AMCL, Smac Lattice, MPPI |\n| Perception | RGB-D, YOLOE, OpenCV |\n| Manipulation | MoveIt 2, ros2_control, BehaviorTree.CPP, Feetech Servo |\n| Modeling and simulation | FreeCAD, URDF/Xacro, MJCF, Gazebo Fortress, MuJoCo, Isaac Sim (experiments) |\n\n## Architecture\n\nControl Bridge forwards backend requests to Mission Runtime, which coordinates navigation and manipulation. Supervisor checks robot availability and manages execution permission and recovery.\n\n```mermaid\nflowchart TB\n    CP[\"Dashboard\u003cbr/>Backend\"]\n    Bridge[\"Control Bridge\u003cbr/>Backend ↔ ROS\"]\n    Mission[\"Mission Runtime\u003cbr/>State / results\"]\n    Supervisor[\"Supervisor\u003cbr/>Permission / recovery\"]\n    Nav[\"Navigation\u003cbr/>Nav2 Adapter\"]\n    Desk[\"Desk Adapter\u003cbr/>Mock / Action\"]\n    Telemetry[\"Telemetry\u003cbr/>Robot pose\"]\n\n    CP \u003c-->|WebSocket| Bridge\n    Bridge \u003c--> Mission\n    Supervisor -.-> Mission\n    Mission --> Nav\n    Mission --> Desk\n    Telemetry -->|Pose| Bridge\n\n    classDef web fill:#edf4fa,stroke:#6e89a2,color:#21384b\n    classDef edge fill:#edf7f3,stroke:#6a9b8c,color:#214a40\n    classDef control fill:#fff6e8,stroke:#b89b66,color:#5d4827\n    class CP web\n    class Bridge,Mission,Nav,Desk,Telemetry edge\n    class Supervisor control\n```\n\n`cleany_teleop` handles manual commands. `cleany_telemetry` provides read-only pose and camera observations and runs without the backend. Control Bridge and the camera proxy handle backend communication.\n\nDepending on the launch configuration, desk tasks use a mock or a manipulation Action server. See the [integration guide](docs/implementation/integration.md) and [package interfaces](docs/implementation/ros-interfaces.md) for details.\n\n## Development status\n\nNavigation, manipulation, and dashboard integration are in progress. **The full physical workflow still needs field validation.**\n\n- [ ] Verify desk approach coordinates and robot calibration at the deployment site.\n- [ ] Validate the complete request → navigation → desk clearing → return → result sequence on Jetson.\n\n[Validation results and scope](docs/EVIDENCE.md)\n\n## Getting started\n\nThe reference environment is Ubuntu 22.04 with ROS 2 Humble. Follow the [development setup guide](docs/implementation/development-setup.md) first. The commands below assume ROS is installed, rosdep is initialized, and the project rosdep rules are registered.\n\n```bash\ngit clone --recurse-submodules https://github.com/asm17-moving-agent/cleany.git\ncd cleany\nsource /opt/ros/humble/setup.bash\n\nmake deps\nmake build\nsource \"$(make -s print-install-base)/setup.bash\"\n```\n\nRun tests and start Gazebo:\n\n```bash\nmake test\nmake sim-gazebo\n```\n\n`make sim-gazebo` starts Gazebo in headless mode. For Nav2, missions, and physical hardware setup, see the guides below. The implementation guides are currently written in Korean.\n\n- [SLAM mapping](docs/implementation/how-to/mapping.md) / [Phone navigation](docs/implementation/how-to/phone-navigation.md)\n- [Perception and arm manipulation](docs/implementation/how-to/manipulation.md)\n- [Backend and mission integration](docs/implementation/how-to/mission.md) / [Jetson deployment](docs/implementation/how-to/control-plane-integration.md)\n\n## Team\n\n**AI·SW Maestro, 17th cohort | AI 에이전트는 움직이고 싶어**\n\n이동근, 박창수, 이정현\n\n[GitHub](https://github.com/asm17-moving-agent) · [Control plane repository](https://github.com/asm17-moving-agent/cleany-control-plane)\n\n---\n\n[Documentation](docs/index.md) · [Learning guide](docs/guide/README.md) · [Project planning](docs/cleany-docs/README.md) · [Image and video sources](docs/assets/readme/sources.json)\n"},"containers/motion/README.md":{"title":"모션 GPU 런타임","body":"# 모션 GPU 런타임\n\n`cleany-motion:jp6.2`는 JetPack 6.2, CUDA 12.6과 Python 3.10에서 cuRobo IK를 실행한다.\nMoveIt은 호스트에서 전체 장면의 충돌과 경로를 검사하고, 모터 제어는 호스트 controller가 담당한다.\n일반 MoveIt backend는 이 컨테이너가 필요하지 않다.\n\n## 준비\n\n```bash\nmake motion-container-image\nmake motion-container-prepare\nmake motion-container-check\n```\n\n저장소는 읽기 전용으로 연결한다. 빌드와 캐시는 작업 트리별 Docker volume에 저장한다.\n`prepare`는 인터페이스, 로봇 모델, MoveIt 설정, 파지와 실행 패키지 5개를 설치한다.\n`check`는 이미지와 설치 입력의 hash를 대조한다. 입력이 바뀌면 다시 준비한다.\n호스트의 MoveIt 준비는 [개발환경 안내](../../docs/implementation/development-setup.md#실물-모션-기반)를 따른다.\n\n## 실행\n\n```bash\nros2 launch cleany_skill_executor physical_grasp_selection.launch.py \\\n  repository_root:=\"$PWD\" motion_backend:=curobo_ik_moveit motion_runtime:=container\n```\n\n| 파라미터 | 동작 |\n|---|---|\n| `motion_backend` | 기본 `moveit`, 선택 `curobo_ik_moveit` |\n| `motion_runtime` | `auto`는 Jetson GPU backend에 컨테이너를 선택. `native`, `container`로 지정 가능 |\n| `curobo_python` | 별도로 준비한 native GPU Python의 경로 |\n\n호스트의 네트워크, IPC, PID namespace와 사용자 UID/GID를 사용한다.\n`CLEANY_MOTION_BLAS_THREADS`는 OpenBLAS 스레드 수이며 기본값은 1이다.\n`tools/motion-container status --owner OWNER`와 `stop --owner OWNER`로 해당 실행을 관리한다.\n\nGPU 작업은 `configs/robot/gpu-work.lock`을 공유한다. 실제 요청은 백그라운드 예열보다\n우선하며 진행 중인 CUDA 호출은 중단하지 않는다. 선택적으로 AnyGrasp를 실행할 때도\n동일한 잠금을 사용한다. 기본 파지 후보 생성은 기하학적 방식이다.\n\n## 검증\n\n```bash\nmake test-motion-foundation MOTION_TEST_PATHS=tests/tools/test_motion_container.py\ntools/motion-container exec -- python3 /workspace/cleany/containers/motion/smoke.py\n```\n\nGPU 회귀 검사는 `cleany_skill_executor/runtime_test/`에 있다.\n실행 조건과 범위는 [테스트 안내](../../docs/TESTING.md#실물-계획과-실행-기반-검증)를 따른다.\n"},"containers/vision/README.md":{"title":"Jetson 혼합형 GPU runtime","body":"# Jetson 혼합형 GPU runtime\n\n안전·제어·mission stack은 Jetson의 native ROS 2 Humble에 유지하고, CUDA dependency가\n필요한 모델만 container로 격리합니다. `cleany-vision:jp6.2` image와 그 안의 AnyGrasp SDK\nbinary는 기존 것을 그대로 공유하지만 runtime service와 mount는 분리합니다.\n\n| 위치/service | 책임 | 고정 주소 |\n|---|---|---|\n| Native | Mission Manager, Skill Executor, Robot Interface, `ros2_control`, hardware driver, Nav2, safety watchdog, AI 결과 검증 | host |\n| `anygrasp` | `grasp/plan` (`PlanGrasp.srv`) | `172.30.0.10`, license에 묶인 고정 MAC |\n| `perception` | YOLOE-seg, depth, 3D reconstruction와 `perception/inspect_scene` (`InspectScene.action`) | `172.30.0.11` |\n| `motion` | cuRobo/cuMotion service 예약; 아직 Compose service 없음 | `172.30.0.13` 예약 |\n\nRGB-D driver도 초기에는 native에 둡니다. 실제 profiling에서 DDS 전송이 병목으로 확인된\n뒤에만 perception container 이전을 검토합니다. AI service는 ROS 결과만 반환하며\n`cmd_vel`, controller action 또는 actuator command를 발행하지 않습니다.\n\n```mermaid\nflowchart LR\n  subgraph Host[\"Jetson native / 172.30.0.1\"]\n    RGBD[\"카메라 / TF\"]\n    Mission[\"Mission / Skill Executor\"]\n    Control[\"안전 검증 / controller / actuator\"]\n    Mission --> Control\n  end\n  subgraph GPU[\"Compose bridge / 같은 DDS domain\"]\n    Perception[\"perception / .11\"]\n    Grasp[\"anygrasp / .10 / 고정 MAC\"]\n  end\n  RGBD -->|\"RGB-D\"| Perception\n  Perception -->|\"InspectScene 결과\"| Mission\n  Mission -->|\"PlanGrasp 요청\"| Grasp\n  Grasp -->|\"후보 결과\"| Mission\n```\n\n| 순서 | 작업 | 확인 |\n|---|---|---|\n| 1 | [Host/image](#host와-image-준비) | JetPack ABI와 NVIDIA runtime |\n| 2 | [Identity](#root-owned-jetson-identity) | license와 일치하는 root 소유 파일 |\n| 3 | [서비스](#실행-명령) | container 및 ROS server 시작 |\n| 4 | [DDS 연결](#ros-2-dds-연결) | native에서 endpoint 확인 |\n| 5 | [인수 검사](#migration-검증) | 실제 inference와 재생성/reboot 경계 |\n\n## Host와 image 준비\n\nJetson에는 JetPack 6.2, NVIDIA Container Toolkit과 Docker Compose가 필요합니다.\nimage는 Jetson aarch64 CUDA/cuBLAS ABI를 제공하는 NVIDIA 공식\n`nvcr.io/nvidia/l4t-jetpack:r36.4.0` digest에 고정합니다. 일반 ARM server용\n`nvidia/cuda` SBSA image는 Jetson에서 CUDA device가 보여도 cuBLAS 실행이 실패하므로\n사용하지 않습니다.\n\n```bash\nuname -m\nnvcc --version\ndocker info\ntools/vision-container host-setup\n```\n\nJetPack 6.2.1 kernel에 `CONFIG_IP_NF_RAW`가 없을 때 `tools/vision-container host-setup`은 Docker가 제공하는\n`DOCKER_INSECURE_NO_IPTABLES_RAW=1` systemd drop-in을 설치하고 daemon을 재시작합니다. 이\n설정은 Docker 전체에 적용됩니다. GPU service는 port를 publish하지 않습니다.\n\n기존 `cleany-vision:jp6.2` image가 SBSA 기반이거나 Dockerfile dependency를 갱신했다면\n다시 빌드합니다. 이후에는 migration-controlled AnyGrasp SDK commit을 바꾸지 않는 한\n같은 image를 재사용합니다.\n\n```bash\ntools/vision-container build\n```\n\nlicense와 checkpoint는 image에 넣지 않습니다. 예시 identity 기준 host layout은 다음과\n같습니다.\n\n```text\n/home/cleany/.local/share/cleany/anygrasp/license/\n  licenseCfg.json\n  \u003clicense-name>.lic\n  \u003clicense-name>.public_key\n  \u003clicense-name>.signature\n/home/cleany/models/anygrasp/checkpoint_detection.tar\n/home/cleany/models/yoloe/yoloe-26s-seg.pt\n```\n\nAnyGrasp license directory와 model directory는 `anygrasp`에만 read-only로 mount됩니다.\n`perception`에는 YOLOE model만 read-only로 mount되고 AnyGrasp identity, license와\ncheckpoint는 노출되지 않습니다.\n\n## Root-owned Jetson identity\n\nCompose용 개발 `.env`는 더 이상 사용하지 않습니다. 다음 명령은 pinned identity template을\n`/etc/cleany/jetson-identity.env`에 `root:root`, mode `0644`로 설치합니다.\n\n```bash\ntools/vision-container init\nsudoedit /etc/cleany/jetson-identity.env\ntools/vision-container hybrid-config\n```\n\ntemplate의 `ANYGRASP_MAC_ADDRESS`, `ANYGRASP_EXPECTED_FEATURE_ID`,\n`ANYGRASP_LICENSE_FILE`은 placeholder입니다. Jetson에서 발급받은 license 기준 값으로\n바꾸고, 실제 값은 저장소에 커밋하지 않습니다. 이 값과 service network는 일반 개발 변경\n대상이 아니며, 변경하려면 별도 AnyGrasp license migration이 필요합니다.\n\nidentity 파일이 없거나 root 소유가 아니거나 group/other writable이면 모든 Compose 명령이\n실패합니다. 호출 shell의 동명 환경변수는 wrapper가 제거하므로 identity를 덮어쓸 수 없습니다.\nCompose interpolation에도 기본값이 없어서 wrapper를 우회해도 누락된 값은 configuration\n단계에서 실패합니다.\n\n## 실행 명령\n\n서비스별로 container를 먼저 올리고 ROS server를 실행합니다.\n\n```bash\ntools/vision-container anygrasp-up\ntools/vision-container anygrasp-run\n\n# 다른 terminal\nexport GEMINI_API_KEY='\u003capi-key>'  # Gemini 분류를 사용할 때 필요\ntools/vision-container perception-up\ntools/vision-container perception-run\n```\n\n> [!TIP]\n> **OpenBLAS CPU 스레드 최적화 (`CLEANY_PERCEPTION_BLAS_THREADS`)**:\n> - 인식 컨테이너의 NumPy / SciPy 연산은 기본 **1개 스레드**(`OPENBLAS_NUM_THREADS=1`)를 사용합니다.\n> - VLM API 응답을 대기하는 동안 씬 매핑 및 경로 계획이 동시에 돌 때 발생하는 CPU 코어 경합을 완화하기 위함입니다.\n> - 스레드 수를 변경하려면 `export CLEANY_PERCEPTION_BLAS_THREADS=2` 등으로 지정한 뒤 `make perception-up`으로 컨테이너를 재생성하고 `make perception-run`을 실행합니다. (ROS 2 콜백 스레드 수는 변경되지 않습니다.)\n\n`cleany_perception`은 YOLOE-seg의 검출과 마스크에 Gemini 분류를 결합합니다.\nAPI 키는 환경 변수로 실행 프로세스에 전달하며 identity 파일에는 저장하지 않습니다.\n모델 프로파일과 TensorRT 변환은 [모델 설정](../../configs/models/README.md)을 따릅니다.\n\n전체 lifecycle 명령은 다음과 같습니다.\n\n```bash\ntools/vision-container hybrid-up\ntools/vision-container hybrid-run\ntools/vision-container hybrid-down\n```\n\n`vision-feature-id`와 `vision-license-check`는 SDK 확인 명령이다.\n`hybrid-down`은 같은 Compose project의 이전 `vision` orphan도 함께 정리한다. 이전\ncontainer와 새 `anygrasp`가 같은 MAC으로 동시에 실행 중이면 시작 wrapper가 거부한다.\n\n## AnyGrasp fail-closed preflight\n\n`anygrasp` entrypoint는 model을 읽기 전에 다음을 모두 확인하고 성공 marker를 만든다.\n\n- root-owned identity가 read-only mount인지\n- 비-loopback interface가 `eth0` 하나뿐인지\n- `eth0` MAC/IP가 identity의 `ANYGRASP_MAC_ADDRESS`, `172.30.0.10`인지\n- SDK feature ID가 identity의 `ANYGRASP_EXPECTED_FEATURE_ID`와 정확히 같은지\n- license directory와 checkpoint 경로가 read-only mount에 포함되는지\n\n호스트 wrapper도 Docker inspect로 `network_mode: host`, 둘 이상의 network, MAC/IP 변경을\n검사한다. 어느 검사든 실패하면 container가 종료되고 `grasp/plan` node는 시작하지 않는다.\n실행 직전에 preflight를 다시 수행하므로 대기 container에 network를 나중에 추가해도\n`make anygrasp-run`은 실패한다.\n\nfeature ID와 license/checkpoint 초기화를 별도로 확인할 수 있다.\n\n```bash\nmake vision-feature-id\nmake vision-license-check\n```\n\n첫 명령은 값을 출력만 하는 것이 아니라 identity의 feature ID와 일치해야 성공한다. 두 번째 명령은\nSDK license validation 뒤 checkpoint를 읽어 detector까지 생성한다. 실제 CUDA inference\nwarm-up은 유효한 RGB-D point cloud로 `grasp/plan`을 한 번 호출해 확인한다.\n\n## Migration 검증\n\n코드를 바꾸기 전에 기존 `vision` container의 ID가 기준값인지 기록하고 container를\n내린다. 새 구성을 받은 뒤 다음 순서로 재생성 안정성을 확인한다.\n\n```bash\nmake hybrid-down\nmake anygrasp-up\nmake vision-feature-id\n\nfor attempt in 1 2 3; do\n  make hybrid-down\n  make anygrasp-up\n  make vision-feature-id\ndone\n```\n\n네 출력은 모두 identity의 `ANYGRASP_EXPECTED_FEATURE_ID`와 같아야 한다. 이어서 Docker daemon 재시작과 Jetson\n재부팅 뒤에도 같은 명령을 반복한다. 새 license 설치 뒤에는 다음을 확인한다.\n\n```bash\nmake vision-license-check\nmake anygrasp-run\n# native ROS terminal에서 실제 point cloud를 포함한 /grasp/plan 요청 1회\n```\n\n다음 negative test도 Jetson 인수검사에 포함한다.\n\n- identity 파일 누락/권한 변경: Compose 단계에서 실패\n- identity의 IP 변경: migration-controlled 값 검사에서 실패\n- identity의 MAC/Feature ID가 실제 container MAC 또는 SDK feature ID와 다름: runtime 검사에서 실패\n- `network_mode: host`, MAC override: host inspect 또는 container IP/MAC 검사에서 실패\n- `docker network connect`로 추가 network 연결 후 `anygrasp-run`: interface 검사에서 실패\n- license/model mount를 read-write로 변경: mount 검사에서 실패\n\nAnyGrasp process를 강제 종료한 통합 시험에서는 native Skill Executor가 작업을 `BLOCKED`\n또는 `MODEL_UNAVAILABLE`로 끝내고 actuator command를 만들지 않는지 별도로 확인한다. 현재\nROS 계약의 `PlanGrasp.ERROR_MODEL_UNAVAILABLE`는 유지되며, AI service 결과를 motion/control\n명령으로 직접 연결하지 않는다.\n\n## ROS 2 DDS 연결\n\n현재 `perception-run`은 YOLOE-seg + Gemini 공통 프로필을 사용합니다.\nroot-owned identity는 `jetson-identity.env.example`의 현재 키 목록에 맞춥니다.\n`YOLOE_MODEL_HOST_DIR`는 checkpoint와 text encoder를 담은 폴더이며 컨테이너의\n`/models/yoloe`에 read-only로 연결합니다. AnyGrasp identity/MAC/license 값은 유지합니다.\n\n```bash\nCLEANY_PERCEPTION_USE_SIM_TIME=true CLEANY_PERCEPTION_USE_WRIST_CAMERA=true tools/vision-container perception-run\nros2 launch cleany_skill_executor study_cafe_sorting.launch.py start_perception:=false\n```\n\n컨테이너와 native 시뮬레이터의 시계를 맞춥니다. 실카메라는\n`CLEANY_PERCEPTION_USE_SIM_TIME=false`가 기본입니다. 컨테이너는 CUDA를 명시합니다.\n\nnative와 container는 ROS 2 Humble, `rmw_cyclonedds_cpp`를 사용합니다. 두 container는\n`eth0`만 사용하고 host bridge gateway `172.30.0.1`을 peer로 지정합니다. native terminal은\nWi-Fi/Ethernet 자동 선택 대신 bridge gateway `172.30.0.1`을 DDS interface로 고정하고,\n두 service 주소가 등록된 host 설정을 사용합니다. 따라서 Compose network를 먼저 올린 뒤\nnative ROS process를 시작합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource ros2_ws/install/setup.bash\nexport RMW_IMPLEMENTATION=rmw_cyclonedds_cpp\nexport CYCLONEDDS_URI=\"file://${PWD}/containers/vision/cyclonedds/host.xml\"\nexport ROS_DOMAIN_ID=0\nros2 node list\nros2 action info /perception/inspect_scene\nros2 service type /grasp/plan\n```\n\n외부 machine까지 ROS graph를 연결하는 topology는 DDS Router 또는 별도 robot network\n설계가 필요합니다.\n\n## 시작 결과와 복구\n\n| 관측 | 의미 / 조치 |\n|---|---|\n| container up | server/inference 준비까지 보장하지 않음; run과 endpoint 확인 필요 |\n| feature ID 확인 성공 | identity 일치; license와 모델 초기화는 별도 |\n| license-check 성공 | detector 생성; 실제 CUDA warm-up은 유효한 point cloud 요청 필요 |\n| endpoint가 안 보임 | bridge 선기동, native interface, 같은 domain/clock/overlay 확인 |\n| model service 단절 | native에서 BLOCKED 또는 MODEL_UNAVAILABLE 처리; AI 결과를 actuator에 직접 연결하지 않음 |\n\n종료는 `tools/vision-container hybrid-down`을 사용합니다. 변경 전 image와 설정을 복원할 때도 같은 root identity, network/MAC, read-only mount 계약을 유지하고 feature-ID/license 검사를 다시 수행합니다. License identity 자체를 바꾸는 복구는 별도 migration입니다. 재생성 전후 확인은 아래 절차를 따릅니다.\n\n## AnyGrasp fail-closed preflight\n\n`anygrasp` entrypoint는 model을 읽기 전에 다음을 모두 확인하고 성공 marker를 만듭니다.\n\n| 검사 | 통과 조건 |\n|---|---|\n| identity | root-owned, read-only mount |\n| network interface | non-loopback은 eth0 하나 |\n| MAC / IP | identity MAC / 172.30.0.10 |\n| SDK feature ID | `ANYGRASP_EXPECTED_FEATURE_ID` 정확 일치 |\n| license / checkpoint | read-only mount 경로 안 |\n\n호스트 wrapper도 Docker inspect로 `network_mode: host`, 둘 이상의 network, MAC/IP 변경을\n검사합니다. 어느 검사든 실패하면 container가 종료되고 `grasp/plan` 노드는 시작하지 않습니다.\n실행 직전에 preflight를 다시 수행하므로 대기 container에 network를 나중에 추가해도\n`tools/vision-container anygrasp-run`은 실패합니다.\n\nfeature ID와 license/checkpoint 초기화를 별도로 확인할 수 있습니다.\n\n```bash\ntools/vision-container feature-id\ntools/vision-container check-license\n```\n\n첫 명령은 값을 출력만 하는 것이 아니라 identity의 feature ID와 일치해야 성공합니다. 두 번째 명령은\nSDK license validation 뒤 checkpoint를 읽어 detector까지 생성합니다. 실제 CUDA inference\nwarm-up은 유효한 RGB-D point cloud로 `grasp/plan`을 한 번 호출해 확인합니다.\n\n## Migration 검증\n\n코드를 바꾸기 전에 기존 `vision` container의 ID가 기준값인지 기록하고 container를\n내립니다. 새 구성을 받은 뒤 다음 순서로 재생성 안정성을 확인합니다.\n\n```bash\ntools/vision-container hybrid-down\ntools/vision-container anygrasp-up\ntools/vision-container feature-id\n\nfor attempt in 1 2 3; do\n  tools/vision-container hybrid-down\n  tools/vision-container anygrasp-up\n  tools/vision-container feature-id\ndone\n```\n\n네 출력은 모두 identity의 `ANYGRASP_EXPECTED_FEATURE_ID`와 같아야 합니다. 이어서 Docker daemon 재시작과 Jetson\n재부팅 뒤에도 같은 명령을 반복합니다. 새 license 설치 뒤에는 다음을 확인합니다.\n\n```bash\ntools/vision-container check-license\ntools/vision-container anygrasp-run\n# native ROS terminal에서 실제 point cloud를 포함한 /grasp/plan 요청 1회\n```\n\n| Negative test | 실패해야 하는 경계 |\n|---|---|\n| identity 누락 / 소유·쓰기 권한 변경 | Compose |\n| 고정 IP 변경 | migration-controlled 값 검사 |\n| MAC / SDK feature ID 불일치 | runtime preflight |\n| host network / MAC override | host inspect 또는 IP/MAC 검사 |\n| 대기 container에 추가 network 연결 | run 직전 interface 검사 |\n| license/model read-write mount | mount 검사 |\n\nAnyGrasp process를 강제 종료한 통합 시험에서는 native Skill Executor가 작업을 `BLOCKED`\n또는 `MODEL_UNAVAILABLE`로 끝내고 actuator command를 만들지 않는지 별도로 확인합니다. 현재\nROS 계약의 `PlanGrasp.ERROR_MODEL_UNAVAILABLE`는 유지되며, AI service 결과를 motion/control\n명령으로 직접 연결하지 않습니다.\n\n## 로컬 deterministic test\n\nJetson SDK 없이 identity/network/mount 정책의 순수 로직을 검사할 수 있습니다.\n\n```bash\npython3 -m pytest -q containers/vision/test\ntools/vision-container hybrid-config\n```\n\nFeature ID 재생성, Docker daemon/reboot, NVIDIA runtime, license, detector 초기화와 실제\nROS DDS 호출은 Jetson에서만 검증할 수 있습니다.\n"},"docs/CALIBRATION.md":{"title":"캘리브레이션 안내","body":"# 캘리브레이션 안내\n\n현재 절차와 계약은 [캘리브레이션 가이드](implementation/calibration.md)를 따릅니다.\n"},"docs/DEVELOPMENT_SETUP.md":{"title":"개발환경 안내","body":"# 개발환경 안내\n\n현재 설치 절차와 의존성은 [개발환경 가이드](implementation/development-setup.md)를 따릅니다.\n"},"docs/EVIDENCE.md":{"title":"검증 범위와 결과","body":"# 검증 범위와 결과\n\n**작업 요청부터 현장 좌석 이동, 책상 정리, 복귀, 결과 보고까지 이어지는 전체 실물 미션은 검증이 남아 있습니다.** 아래 표는 각 환경에서 관찰한 결과와 그 결과가 뒷받침하는 범위를 요약합니다.\n\n| 기능 | 시험 환경과 관찰 결과 | 검증 범위와 근거 |\n|---|---|---|\n| 센서와 로봇 모델 | 실물 Jetson에서 RGB-D 입력을 수신했습니다. 관절 상태의 시각에 맞춰 헤드·손목 카메라와 파지 프레임의 TF를 조회했습니다. | 모델과 센서 연결을 확인했습니다. [RViz·TF 측정 기록](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/docs/EVIDENCE.md?plain=1#L7-L19) |\n| 장애물 지도 | Jetson에서 기록한 점군과 TF를 재생했습니다. OctoMap 갱신 최적화 전후에 모든 재생 단계의 지도 해시가 일치했습니다. | 같은 입력에 대한 지도 보존을 확인했습니다. 현장 주행 중 장애물 회피는 별도 시험입니다. [측정 조건과 결과](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/docs/EVIDENCE.md?plain=1#L280-L298) |\n| 거리 센서 | 단독 ESP32 보드에서 ToF 센서의 8×8 거리 프레임을 120초간 수신했습니다. | 보드의 출력과 전송 연속성을 확인했습니다. 로봇 장착 상태의 감지 범위와 정지 거리는 현장에서 측정해야 합니다. [펌웨어](../esp32/tof_vl53l7ch/README.md#실물-기록과-재생) |\n| 물체 인식 | 운영 환경에서 헤드 RGB-D 한 프레임을 입력해 객체 6개가 포함된 응답을 받았습니다. | 입력부터 응답까지 연결한 시험입니다. 검출률과 3D 위치 정확도는 별도 평가가 필요합니다. [인식 결과](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/docs/EVIDENCE.md?plain=1#L324-L336) |\n| 단일 물체 수거 | 고정 베이스 MuJoCo에서 컵 하나의 수거, 놓기, 팔 복귀와 정지를 확인했습니다. 파지 중 취소와 제어기 중단 시의 결과도 검사했습니다. | 단일 물체 시뮬레이션의 결과입니다. 여러 물체의 수거 성공률과 실물 팔 성능은 별도 평가 대상입니다. [시뮬레이션 결과](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/ros2_ws/src/cleany_manipulation_bt/README.md?plain=1#L231-L306) |\n| 미션 연동 | Gazebo/Nav2 주행과 Mock 조작 서버로 두 물체의 실행 ID, 재관찰과 미션 완료 보고를 확인했습니다. | 인식·계획·팔 동작에 모의 입력을 사용했습니다. [통합 시험 기록](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/docs/EVIDENCE.md?plain=1#L1022-L1044) · [재현 절차](implementation/how-to/mission.md#gazebo-주행과-mock-조작) |\n\n현장 인수검사에서는 좌석별 접근 좌표와 장착 보정값을 확인한 뒤, 한 작업 요청의 이동·수거·복귀·결과 보고를 같은 미션 ID로 추적합니다. [보정 가이드](implementation/calibration.md) · [실행 가이드](implementation/running.md)\n\n패키지별 검사 명령과 입력은 [검증 가이드](implementation/testing.md)에서 확인할 수 있습니다. 표에 인용한 실험의 커밋, 환경, 입력과 원본 위치는 [전체 실행 기록](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/docs/EVIDENCE.md)에 보존되어 있습니다. 변경별 자동 검사 결과는 [GitHub Actions](https://github.com/asm17-moving-agent/cleany/actions/workflows/ci.yml)에서 확인할 수 있습니다.\n"},"docs/INTEGRATION.md":{"title":"통합 안내","body":"# 통합 안내\n\n현재 절차와 계약은 [통합 가이드](implementation/integration.md)를 따릅니다.\n"},"docs/ROS_INTERFACES.md":{"title":"ROS 인터페이스 안내","body":"# ROS 인터페이스 안내\n\n실행 파일과 ROS endpoint는 [인터페이스 색인](implementation/ros-interfaces.md)을 따릅니다.\n"},"docs/RUNNING.md":{"title":"실행 안내","body":"# 실행 안내\n\n현재 절차와 계약은 [실행 가이드](implementation/running.md)를 따릅니다.\n"},"docs/TESTING.md":{"title":"검증 안내","body":"# 검증 안내\n\n현재 절차와 계약은 [검증 가이드](implementation/testing.md)를 따릅니다.\n"},"docs/implementation/calibration.md":{"title":"캘리브레이션 작업 가이드","body":"# 캘리브레이션 작업 가이드\n\n측정할 대상을 먼저 고릅니다. **관측·분석 결과를 얻는 것과 실제 보정값을 적용하는 것은 별도 작업**입니다.\n\n| 확인하려는 것 | 작업 | 결과 |\n|---|---|---|\n| D435와 LiDAR가 같은 벽을 보는가? | [벽 비교](#d435와-lidar-벽-비교-및-헤드-관절-관측) | 거리·법선 잔차 |\n| 휠 odom과 실제 관측 이동이 다른가? | [bag 분석](#bag-기반-슬립-의심-구간-분석) | 의심 구간·판정 불가 구간 |\n| 저장된 카메라·관절 보정값을 쓰려는가? | [기존 프로필 적용](#jetson-실물-모델과-2026-10-09-보정-프로파일) | 보정된 모델 TF |\n| 새 Hand-eye 데이터를 수집하려는가? | [수집과 평가](#hand-eye-수집과-평가) | 검토용 변환과 평가 |\n| ToF 장착·정지 조건을 정하려는가? | [Commissioning](#tof-근접-보호-commissioning) | 실측에 근거한 로봇 설정 |\n\n## D435와 LiDAR 벽 비교 및 헤드 관절 관측\n\n로봇을 **동일한 평평한 벽 앞에 정지**시킨 상태에서 비교합니다. Humble, NumPy, matplotlib, pyserial과 실제 영상·CameraInfo·`/scan_raw` 입력이 필요합니다.\n\n![D435와 LiDAR의 벽 투영, 거리 차이와 법선 각도 비교 출력](../assets/examples/calibration-wall.png)\n\n왼쪽은 두 센서의 벽 투영, 가운데는 카메라−LiDAR 거리 차이, 오른쪽은 수평 방향 차이와 카메라 벽 법선 기울기입니다. **기록된 출력 예시이며, 그림의 수치를 합격 기준으로 사용하지 않습니다.**\n\n```mermaid\nflowchart LR\n  Encoder[\"헤드 encoder / ID 13·14\"] --> TF[\"촬영 시각의 카메라 TF\"]\n  Depth[\"D435 깊이 영상\"] --> Wall[\"벽 거리·법선 비교\"]\n  TF --> Wall\n  Scan[\"LiDAR scan\"] --> Wall\n  Wall --> Result[\"비교 PNG / JSON\"]\n```\n\nUSB by-id·모터 ID와 [헤드 설정](../../tools/validation/config/d435_pan_tilt.json)을 검토한 뒤 실행합니다. 기존 차체→카메라 고정 TF 발행자는 중복 실행하지 않습니다.\n\n```bash\n# 터미널 A: 읽기 전용 관절 관측\npython3 tools/validation/head_pan_tilt_probe.py \\\n  --config tools/validation/config/d435_pan_tilt.json\n# 터미널 B: 자료 수집 후 비교. 사용할 새 경로로 바꿉니다.\npython3 tools/validation/capture_depth_lidar.py --output /path/to/new/capture\npython3 tools/validation/compare_depth_lidar_wall.py \\\n  --capture /path/to/new/capture --mount tools/validation/config/d435_cad_mount.json\n```\n\n결과 폴더의 `index.html`, `wall-comparison.png`, `wall-comparison.json`에서 잔차와 분석 조건을 함께 확인합니다.\n\n| 결과·모드 | 의미와 한계 |\n|---|---|\n| 실제 관절 TF 있음 | 카메라 시각과 150ms 이내인 TF 사용. 없으면 공칭 자세 비교로 표시 |\n| 거리·법선 잔차 | 한 벽으로 높이·벽에 평행한 이동을 검증할 수 없음. 벽 기울기와 장착 오차도 분리할 수 없음 |\n| 기본 실행 | 읽기 전용. `/head/joint_states`와 동적 TF 발행. 휠 `/joint_states`와 분리하며 피드백 지연·오류 시 종료 |\n| `--exercise --output …` | **실제 헤드 모터 시험.** 다른 버스 소유자 종료, 차체 정지와 주변 공간 확인 후 별도 실행 |\n| 시험 전 검사 | 토크 OFF, 모델 777, 위치 모드, 오류 없음과 온도 확인 |\n| 시험 동작·종료 | 현재 자세 부근 축별 ±5°. EEPROM은 쓰지 않으며 종료 시 토크 OFF 확인. 복귀 실패 시 추가 이동 없이 토크 OFF |\n| 남는 RAM 설정 | 가속도 5, 속도 80tick/s, 토크 한도 300과 마지막 목표값. `--poses`로 미확인 자세만 별도 시험 가능 |\n\n이 도구는 costmap이나 보정값을 자동 변경하지 않습니다. 광학 TF는 RealSense 드라이버가 계속 소유합니다.\n\n## bag 기반 슬립 의심 구간 분석\n\n```mermaid\nflowchart LR\n  Odom[\"기록된 wheel odom\"] --> Align[\"같은 시각·차체 좌표로 비교\"]\n  Scan[\"기록된 LiDAR\"] --> ICP[\"휠 초기값 없는 ICP\"]\n  ICP --> Align\n  Align --> Quality{\"정합·시간 품질 유효?\"}\n  Quality -->|\"아니오\"| Unknown[\"unknown\"]\n  Quality -->|\"예\"| Decision[\"이동 벡터 오차·연속 창 판정\"]\n```\n\nHumble과 기록 당시 custom message overlay를 source합니다. NumPy, SciPy와 PyYAML을 사용하며, 입력 bag에는 `/scan_raw`, `/odom`, `/tf_static`이 필요합니다. `/base/wheel_state`는 선택적인 보조 통계입니다.\n\n```bash\npython3 tools/validation/slip_detection.py \\\n  --bag /path/to/bag_directory \\\n  --start 2026-11-06T07:22:40+09:00 --end 2026-11-06T07:30:25+09:00 \\\n  --output /path/to/new_analysis_directory --jobs 2\n```\n\n| 확인할 것 | 위치·해석 |\n|---|---|\n| 사건과 창별 판정 | `summary.json`, `windows.jsonl`을 함께 확인 |\n| 입력·설정 식별 | `manifest.json`. 원본은 읽기 전용 snapshot으로 열며 기존 출력은 덮어쓰지 않음 |\n| 판정 기준 | [slip_detection.json](../../tools/validation/slip_detection.json). 다른 설정은 `--config`, 형상은 `--mask-file`로 지정 |\n| 같은 입력 재분석 | `--bag` 대신 `--cache …/inputs.npz` 사용 |\n| `unknown` / `no_evidence` | 각각 품질 부족 / 해당 기준에서 증거 없음. 정상·슬립 없음의 확정 판정이 아님 |\n| 적용 한계 | 슬립과 걸림을 구별하는 진단이 아님. 느린 슬립·끌림, scan 중 움직임·가림에 한계. per-beam deskew 없음 |\n\n겹치는 창은 독립 표본이나 정확한 사건 시작 시각으로 해석하지 않습니다. 이 도구는 명령·TF·보정값을 발행하거나 수정하지 않으며, 제어 연동에는 별도 실시간 검증이 필요합니다.\n\n## Jetson 실물 모델과 2026-10-09 보정 프로파일\n\n[jetson_20261009](../../ros2_ws/src/cleany_description/config/calibration/jetson_20261009)는 **잠정 보정 프로필**입니다. 실제 장착이 달라졌다면 재검증해야 합니다. CAD 마운트 변경만으로 보정이 갱신되는 것은 아닙니다.\n\n| 자료 | 적용 범위 |\n|---|---|\n| `*_extrinsics.yaml` | 헤드 RGB·양손목 optical TF. `parent_T_child`는 child→parent 변환, m·rad 단위 |\n| `arm_joint_calibration.yaml` | 팔 영점·방향·오프셋의 기준. `q = direction × (tick − zero) × 2π/4096 + offset` |\n| `head_joint_calibration.json` | 헤드 pan/tilt 기준과 방향. 수동 영점이며 회전축 추정값은 아님 |\n| `intrinsics/`, `motors/`, `reference/` | 원본·참고 자료. 아래 launch가 CameraInfo를 발행하거나 모터 영점을 적용하지 않음 |\n\n```bash\nros2 launch cleany_description description.launch.py \\\n  use_sim_time:=false model_variant:=legacy_runtime model_profile:=jetson_20261009 \\\n  calibration_profile:=jetson_20261009\n```\n\n`robot_state_publisher`만 실행하므로 `/joint_states`는 별도로 필요합니다. 기본 `calibration_profile`은 빈 문자열이며, 명목 TF를 사용합니다. 보정은 optical 좌표계에 적용하고 카메라 mesh와 헤드 depth 좌표계의 명목값을 옮기지 않습니다. EEPROM homing offset을 관절식에 이중 적용하지 않습니다.\n\n카메라 평가는 고정 보드 가정의 일관성 검사입니다. RMS·수집 조건은 각 보정 YAML을 따르며, `absolute_calibration_verified: false`를 유지합니다. 절대 위치 정확도·노출 동기화·관절 절대각이 검증됐다는 의미는 아닙니다. [모델과 좌표 규약](../../ros2_ws/src/cleany_description/docs/model.md)도 확인하세요.\n\n## Hand-eye 수집과 평가\n\n[수집·오프라인 평가 도구](../../ros2_ws/src/cleany_handeye_calibration/docs/offline-tools.md)와 [좌표·저장 계약](../../ros2_ws/src/cleany_handeye_calibration/docs/frames-and-data.md)을 따릅니다. 결과는 검토용으로 저장하며 TF에 자동 적용하지 않습니다.\n\n## ToF 근접 보호 commissioning\n\n[ToF 기본 설정](../../ros2_ws/src/cleany_tof/config/tof.yaml)은 미실측 후보입니다. 초기 관측은 모터를 분리하거나 바퀴를 띄우고 수행합니다.\n\n| 시험 | 측정·확인 항목 |\n|---|---|\n| 장착·방향 | 작은 표적을 각 native zone에 이동. flip, roll/pitch/yaw, 위치·유효 FOV |\n| 거리·평면 | 알려진 평판의 거리·기울기, sigma·residual, 접근 거리·yaw 오차. 선택 ROI가 책상 전면을 보는지 확인 |\n| 표면·사각 | 빈 공간·검정·유리·금속·햇빛·다리·얇은 물체의 유효율, `NO_RETURN`, 불신뢰, ROI 높이. 다른 센서와 함께 놓치는 경우 포함 |\n| 시간·단절 | USB 부하·read 지연·재연결·watchdog. first-좌표계 offset 불확실성도 reaction budget에 포함 |\n| 실제 제동 | 감독자·독립 E-stop이 있는 통제 공간에서 payload·바닥·배터리별 전후·횡이동·회전의 최악 제동거리와 감속도 하한 |\n| 접근·취소 | 저속·비스듬한 평판·가림, Nav2 동시 goal, cancel, Mission/Supervisor/guard 재시작, lease 회수와 완료 후 정지 유지 |\n| ROI 필터 | 바닥·몸체 return 구분. 15Hz에서 인접 수·cluster 거리·confirm/release·hysteresis 조정. 비상 단일 return과 일반 검출의 지연·오탐·미탐 분리 |\n| 책상 품질 | 분산된 유효 row/column·최소 폭·residual. 일부 불량에서 평면 유지와 평면 소실 시 zero/abort 구분 |\n\n실측으로 `deceleration`, `reaction_s`, footprint와 margin을 정하고 근거·설정을 보존한 뒤에만 `calibrated=true`를 적용합니다. 약 3.5m 미검출은 검출 범위·빈 공간의 보장이 아닙니다. ToF만으로 평면 좌우 중심은 관측할 수 없으므로 staging과 팔 도달성은 별도로 검증합니다. [상태·필터·제동 계약](../../ros2_ws/src/cleany_tof/docs/interfaces.md)을 따릅니다.\n\n## D435 미리보기의 LiDAR 높이 하한\n\n| 좌표 기준 | 값과 의미 |\n|---|---|\n| 카메라 CAD 공칭 높이 | CAD 원점에서 1.0218m. 바닥 z=−0.0955m를 적용한 추정 지상 높이는 약 1.1173m |\n| 기존 LiDAR 평면 규약 | Z=0. 실제 장착 높이 측정값과 구분 |\n| D435 필터의 `min_base_z` | `base_link` 기준 0.192m = 하우징 바닥 0.150 + 레이저 오프셋 0.042m. 추정 지상 높이는 0.2875m |\n\nD435 점군은 촬영 시각의 실제 head encoder TF로 변환합니다. 높이 하한은 로봇 좌표에 고정되어 tilt·바닥 평면 추정에 따라 바뀌지 않습니다. **하한보다 낮은 물체도 제외**되므로 낮은 장애물 검출을 보장하지 않습니다. 측정 바닥면은 표시 grid와 상한 기준으로만 사용하며, 위 값은 CAD 기반 추정입니다.\n\n## 머리 모터의 영점과 허용 범위\n\n[헤드 관절 설정](../../configs/robot/head_preview_joints.json)의 `reference_ticks`를 정면 영점으로 사용합니다. 상태 모델과 제어 모델에는 같은 파일의 `joint_position_bounds`를 적용합니다.\n\n| 모터 | 허용 tick 범위 | 정면 영점 tick | 정면 기준 각도 범위 |\n|---|---|---|---|\n| 13번 좌우 | 8~4001 | 2009 | −175.078125°~+175.869141° |\n| 14번 상하 | 44~1101 | 425 | −33.486328°~+59.414063° |\n\n좌우 모터는 왼쪽으로, 상하 모터는 위쪽으로 움직일 때 원시 tick이 감소합니다. 읽기 전용 RViz에는 별도 매핑 `~/.config/cleany/head-rviz-mapping.json`을 사용합니다.\n\n## 양팔의 수동 ROS 영점 정렬\n\n[양팔 미리보기 설정](../../ros2_ws/src/cleany_robot_interface/config/arm_preview.yaml)의 `overrides.left`와 `overrides.right`에서 각 관절의 `direction`, `zero_tick`, `offset_rad`를 확인합니다. 엔코더의 현재 위치에는 EEPROM의 homing offset이 이미 반영되어 있습니다. 손목 CAD 중심과 URDF의 영점은 서로 다른 기준입니다.\n\n다시 정렬할 때는 제어기와 조회 프로세스의 포트 점유를 해제하고, 토크가 꺼진 팔을 기준 자세로 지지한 뒤 안정된 엔코더 구간을 수집합니다. 읽기 전용 상태 조회를 다시 시작해 방향과 영점을 확인합니다. 카메라 마운트의 시각적 정렬로는 광학축이나 관절의 절대 정확도를 평가할 수 없습니다. 재조립한 손목의 물리적 영점은 별도 확인이 필요합니다.\n\n## 그리퍼 보정과 복원\n\n[양팔 보정 스냅샷](../../ros2_ws/src/cleany_robot_interface/config/calibration/jetson_20261115/manifest.json)은 기본 복원 자료입니다. [그리퍼 개방 기준 스냅샷](../../ros2_ws/src/cleany_robot_interface/config/calibration/jetson_20261115_open160/manifest.json)은 양쪽 그리퍼에 최대 개방 0°를 적용합니다.\n\n| 모터 | Homing offset | 최대 개방 | 닫힘 목표 |\n| --- | ---: | ---: | ---: |\n| 6, 왼쪽 | −1400 | 2048 tick | 3868 tick |\n| 12, 오른쪽 | −1618 | 2048 tick | 3868 tick |\n\n모터 혼 정면에서 시계 방향으로 닫히며 개방점에서 닫힘 목표까지의 차이는 1,820 tick(약 160°)입니다. 양쪽 모터에서 닫힘 목표 도달을 확인했습니다. 왕복 동작, 개구 폭 곡선과 파지력은 아직 검증하지 않았습니다.\n\n양팔 매핑은 `calibration/jetson_20261115_open160/motors/`의 좌우 모터 JSON을 읽습니다. [카메라 자세 설정](../../configs/robot/jetson/calibration/camera_pose.json)에는 매핑과 기준 파일을 대조할 SHA-256이 있습니다.\n\n## LiDAR 평면 extrinsic\n\n[`wheel_odometry_evaluation.json`](../../configs/mission/wheel_odometry_evaluation.json)은\n[`lidar_extrinsic_20261116.json`](../../ros2_ws/src/cleany_base_driver/config/lidar_extrinsic_20261116.json)을\n선택한다. `p_base = R(yaw) p_laser + t`이며 전진 +X는 CAD −Y,\n좌측 +Y는 CAD +X다. 평가기의 ICP 초기 추정과 결과 변환에 적용한다.\n\n| 항목 | 적용값 |\n|---|---:|\n| X | 0.143429742 m |\n| Y | −0.001191569 m |\n| yaw | 179.997034° |\n\n보정 파일의 `measurement`에는 측정에 사용한 CAD와 원시 CSV의 SHA-256이 있습니다. 재측정할 때는 원시 각도와 거리를 보존하고, LiDAR 높이에서 홈과 곡면을 포함한 CAD 단면을 추출합니다. 반복 관측의 각도별 중앙값을 센서에서 보이는 외곽 면에 정합한 뒤 위 좌표계로 변환합니다.\n\n## IMU factory gyro bias\n\nJetson은 [`imu_bringup.yaml`](../../ros2_ws/src/cleany_base_driver/config/imu_bringup.yaml)의\n고정 gyro bias와 covariance를 사용한다. 부팅 시 자동 보정은 수행하지 않는다.\n\n기본값은 기존 `bench_20261014T142933Z/run06_persistent` 결과다. 기존 값을\n재사용할 때는 새 측정 없이 이 설정으로 실행한다. 다음 절차는 계수를 새로\n산출하기로 한 경우에만 수행한다.\n\n1. [독립 IMU 진단 절차](../../esp32/imu_calibration/README.md)에 따라 센서를 정지시키고\n   새 bench 측정과 검증 결과를 저장한다.\n2. 센서 축과 rad/s 단위를 확인하고 YAML의 `gyro_bias_rad_s`,\n   `gyro_covariance_rad2_s2`, `calibration_source`를 함께 갱신한다.\n3. 모터 runtime 펌웨어를 복원하고 host `imu_bringup.launch.py`를 재시작한다.\n4. `imu_uncalibrated/data_raw`, `imu/data_raw`, `imu/status`에서 정지 잔차, 계수 출처와\n   covariance를 확인한다. 측정 환경, code commit와 원본 위치를 결과에 남긴다.\n\n측정 결과는 런타임에 자동 적용되지 않는다. 데이터와 filter 계약은\n[IMU reference](../../ros2_ws/src/cleany_base_driver/docs/imu.md)를 따른다.\n"},"docs/implementation/development-setup.md":{"title":"Cleany 개발환경 설치 가이드","body":"# Cleany 개발환경 설치 가이드\n\n\n| 준비 범위 | 읽을 곳 | 완료 기준 |\n|---|---|---|\n| 모든 개발자 | 아래 1–6단계 | Humble 환경, 의존성 설치, 같은 checkout의 overlay |\n| Gazebo만 사용 | 5단계의 `deps-gazebo` | Fortress와 ROS bridge |\n| MCU / 실물 매핑 | [ESP32](#esp32), [실물 매핑 의존성](#실물-매핑-의존성) | firmware/Agent/driver를 각각 확인 |\n| Monitor 웹 개발 | [웹 도구](#monitor-웹) | frontend build; ROS 실행에는 Node 불필요 |\n| Fedora / Jetson 화면 | [선택 환경](#7-선택-환경), [얼굴 화면](#jetson-얼굴-디스플레이-환경) | 해당 호스트 조건 |\n\n새 Ubuntu native 환경은 1–6단계 순서로 구성합니다. VM 이미지는 별도로 배포하지 않습니다.\n\n## KiCad PCB 검증 환경\n\n통합 컨트롤러는 KiCad 10 이상의 `kicad-cli`와 같은 설치본의 Python `pcbnew`,\n표준 심벌과 풋프린트 라이브러리를 사용합니다. 3D 검토에는 KiCad의 표준 3D 라이브러리와\n[프로젝트 모델의 설치 조건](../../esp32/pcb/integrated_controller/libraries/3dmodels/README.md)도 확인합니다.\n로컬 검증 환경은 Fedora 44, KiCad 10.0.8, 시스템 Python 3.14.10입니다.\n\n`make test-pcb`는 KiCad가 설치된 호스트에서 직접 실행하며 ROS 컨테이너를 사용하지 않습니다.\n`PCB_PYTHON` 기본값은 `/usr/bin/python3`입니다. 다른 Python을 사용하면 해당 실행 파일에서\n`import pcbnew`가 가능한지 확인합니다. 일반 Python venv만으로는 KiCad 모듈을 제공하지 않습니다.\n검증 명령과 출력 경로는 [PCB 검증 절차](reference/testing.md#통합-컨트롤러-pcb-검증)를 따릅니다.\n\n\n## 인식과 파지 후보 패키지\n\n`make build-perception-candidates`는 `cleany_interfaces`, `cleany_perception`,\n`cleany_grasping`을 현재 checkout의 외부 빌드 경로에 설치합니다. GPU 모델과\n실물 장치 없이 빌드할 수 있습니다. YOLOE와 AnyGrasp 추론용 환경은\n[비전 컨테이너](../../containers/vision/README.md), 모델 변환과 검증은\n[모델 설정](../../configs/models/README.md)을 따릅니다.\n\n`DetectedObject2D/3D`와 `PlanGrasp`의 필드가 추가되어 ROS 직렬화 형식이 바뀝니다.\n배포할 때는 이 인터페이스를 사용하는 native 노드와 비전 컨테이너를 모두\n같은 소스로 재빌드하고 함께 재시작합니다. 이전 rosbag은 기록 당시의 인터페이스로 읽습니다.\n\n## 기준 환경\n\n| 항목 | 기준 |\n|---|---|\n| OS | Ubuntu 22.04 LTS (Jammy) |\n| ROS | ROS 2 Humble Desktop |\n| Python | Ubuntu 기본 Python 3.10.x |\n| Gazebo | Fortress (Ignition Gazebo 6.x) |\n| Shell | Bash |\n| 기본 실행 방식 | VM의 native 환경 |\n\nROS 2 Humble은 Ubuntu 22.04의 amd64와 arm64를 Tier 1 플랫폼으로 지원합니다. ROS의 system Python은 유지하며 Python 가상환경으로 대체하지 않습니다.\n\n기존 환경에서는 먼저 아래 버전을 확인합니다. Native 설치는 현재 APT 저장소를 사용하고, [CI](../../.github/workflows/ci.yml)는 snapshot/constraints를 고정하므로 세부 버전이 같다고 가정하지 않습니다. [CI 재현 기준](reference/testing.md#ci-실행과-재사용)을 따릅니다.\n\n```bash\nlsb_release -ds\npython3 --version\n```\n\n## FreeCAD 형상 내보내기 도구\n\n배포된 CAD 메시를 읽고 ROS 노드를 실행할 때는 FreeCAD나 OCP가 필요하지\n않습니다. 원본 FCStd에서 자산을 다시 만들 때만 별도 Python 3.12 가상환경에\n`numpy==2.5.4`, `cadquery-ocp==8.0.1.1.0`을 설치합니다. 이는 ROS runtime의\nsystem Python을 바꾸지 않는 오프라인 CAD 도구 환경입니다.\n\n```bash\npython3.12 -m venv /tmp/cleany-cad-export\n/tmp/cleany-cad-export/bin/pip install numpy==2.5.4 cadquery-ocp==8.0.1.1.0\n/tmp/cleany-cad-export/bin/python tools/export_freecad_model.py /absolute/path/Cleany-final.FCStd\n/tmp/cleany-cad-export/bin/python tools/extract_freecad_kinematics.py /absolute/path/Cleany-final.FCStd\n```\n\n다른 디렉터리에서 내보내기를 검토하려면 `--package /path/to/staging-package`를\n추가합니다. 도구는 저장된 형상만 읽고 FreeCAD 매크로나 expression을 실행하지\n않습니다. [모델 계약](../../ros2_ws/src/cleany_description/docs/freecad-model.md)에\n따라 원본 해시, 좌표 변환과 미확정 값도 함께 기록합니다.\n기존 출력에 다시 내보낼 때는 위 두 명령을 순서대로 실행해 정적 모델과 운동학\n모델을 함께 갱신합니다. 내보내기 도구는 이전 manifest와 해시가 일치하는\n미사용 메시를 정리합니다. 임의로 추가하거나 수정한 파일은 보존합니다.\n\n충돌 캐시 생성 도구는 같은 오프라인 Python 환경에 NumPy, SciPy와 trimesh가\n필요합니다. `--max-surface-error-m`으로 삼각형 감면을 선택할 때만 VTK가\n추가로 필요하며 `vtk==9.6.2`에서 검증했습니다. 생성된 GLB 캐시를 읽는 ROS와\ncuRobo runtime에는 VTK를 설치하지 않습니다.\n\n## 1. Ubuntu 기본 설정\n\nUTF-8 locale과 ROS 저장소 등록에 필요한 도구를 준비합니다.\n\n```bash\nsudo apt update\nsudo apt install -y locales software-properties-common curl\nsudo locale-gen en_US en_US.UTF-8\nsudo update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8\nexport LANG=en_US.UTF-8\nsudo add-apt-repository universe\n```\n\n## 2. ROS 2 apt 저장소 등록\n\nROS 공식 `ros2-apt-source` 패키지로 keyring과 apt source를 등록합니다.\n\n```bash\nROS_APT_SOURCE_VERSION=\"$(\n  curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest \\\n    | grep -F '\"tag_name\"' \\\n    | awk -F'\"' '{print $4}'\n)\"\ncurl -L -o /tmp/ros2-apt-source.deb \\\n  \"https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo \"${UBUNTU_CODENAME:-${VERSION_CODENAME}}\")_all.deb\"\nsudo dpkg -i /tmp/ros2-apt-source.deb\n```\n\n## 3. ROS 2 Humble과 개발도구 설치\n\n```bash\nsudo apt update\nsudo apt install -y ros-humble-desktop ros-dev-tools python3-pip git make\n```\n\n현재 terminal에 ROS 환경을 적용합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\n```\n\n새 terminal마다 자동 적용하려면 아래 한 줄을 `~/.bashrc`에 추가합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\n```\n\n설치 결과를 확인합니다.\n\n```bash\ntest \"${ROS_DISTRO}\" = \"humble\"\npython3 --version\ncommand -v ros2 colcon rosdep\nros2 doctor --report\n```\n\nPython 3.10.x와 `ROS_DISTRO=humble`을 확인합니다.\n\n## 4. 레포지토리 준비\n\nGitHub에 SSH key를 등록한 뒤 submodule과 함께 clone합니다.\n\n```bash\ngit clone --recurse-submodules git@github.com:asm17-moving-agent/cleany.git\ncd cleany\n```\n\n이미 clone한 레포지토리에서는 submodule을 초기화합니다.\n\n```bash\ngit submodule update --init --recursive\n```\n\n## 5. rosdep과 workspace 의존성 준비\n\nMachine에서 rosdep을 처음 사용한다면 초기화합니다. 이미 초기화됐다는 메시지가 나오면 이 단계를 건너뜁니다.\n\n```bash\nsudo rosdep init\nrosdep update\n```\n\n의존성은 공식 rosdep 규칙을 사용합니다. MuJoCo Python 패키지는 `python3-mujoco-pip` 키로 설치합니다.\n\n새 인식 경로의 `google-genai`와 물리 버스용 `feetech-servo-sdk`는 로컬 rosdep DB에 공식 키가 없어 [전용 규칙](../../ros2_ws/rosdep/cleany.yaml)을 사용합니다. 저장소 루트에서 등록한 뒤 DB를 갱신합니다. MuJoCo는 이 규칙에 포함하지 않습니다.\n\n```bash\nprintf 'yaml file://%s/ros2_ws/rosdep/cleany.yaml\\n' \"$PWD\" | sudo tee /etc/ros/rosdep/sources.list.d/10-cleany.list\nrosdep update\n```\n\n레포지토리 루트에서 workspace 의존성을 설치합니다.\n\n```bash\nmake deps\n```\n\n| 기능 | `make deps`로 설치하는 의존성 |\n|---|---|\n| Native depth self-filter | Manifest의 `python3-dev` 개발 헤더 |\n| 계획, 제어 | MoveIt 2, KDL, OMPL, ros2_control, joint_trajectory_controller |\n| MoveIt 내부 충돌 검사 | cleany_moveit_collision manifest의 libfcl-dev, geometric_shapes, pluginlib |\n| Hand-eye backend | cleany_mujoco_sim manifest의 mujoco_ros2_control |\n| 단일 물체 MuJoCo/Jetson Action | BehaviorTree.CPP 4.x, pybind11_vendor, python3-dev |\n| Mock Action 트리 모니터 | python3-zmq; VS Code 확장의 native ZeroMQ 의존성은 별도 |\n| 실물 IMU와 wheel 융합 | `robot_localization`; 공식 rosdep 키로 설치 |\n\nGazebo만 준비할 때는 다음 target을 사용합니다.\n\n```bash\nmake deps-gazebo\n```\n\n시설 CLI는 `cleany_gazebo_sim`에 포함됩니다. NumPy, SciPy, Pillow, PyYAML은 manifest와 rosdep으로 설치하며, 빌드 후 `ros2 run cleany_gazebo_sim`으로 실행합니다.\n\n`deps-gazebo`는 MuJoCo parity-test용 `python3-mujoco-pip` 키를 제외합니다. 전체 테스트를 준비할 때는 `make deps`를 사용합니다.\n\n일반 설치는 manifest 기반의 `make deps-gazebo`를 사용합니다. Rosdep이 Gazebo 의존성을 해석하지 못할 때는 아래 APT 패키지를 직접 확인합니다.\n\n```bash\nsudo apt update\nsudo apt install -y ros-humble-ros-gz-sim ros-humble-ros-gz-bridge\n```\n\n## 6. 빌드와 출력 경로\n\n`CLEANY_BUILD_ROOT`는 빌드 캐시, `CLEANY_DATA_ROOT`는 실행 환경별 로컬 데이터\n경로입니다. 데이터 경로를 지정하지 않으면 Makefile이 인접한 `cleany-data` 경로를\n선택합니다. 이 기본값은 팀 공유 위치를 의미하지 않습니다. 실제 경로는\n`make -s print-build-root`와 `make -s print-data-root`로 확인합니다.\n입력 자료와 결과를 팀에 공유할 때는 별도로 합의한 위치와 접근 방법을 사용합니다.\n\n로컬 데이터 경로를 지정하려면 아래 값을 사용할 경로로 바꿉니다.\n\n```bash\nexport CLEANY_DATA_ROOT=\"/path/to/local-data\"\n```\n\n```bash\nmake build\nsource \"$(make -s print-install-base)/setup.bash\"\nmake test\n```\n\nGazebo와 Navigation 전용 빌드는 Makefile이 선택하는 출력을 사용합니다. Navigation overlay는 `make -s print-navigation-install-base`로 조회합니다. 빌드와 조회에는 같은 Make 변수를 전달합니다.\n\n다른 ROS 배포판의 build/install/log는 재사용하지 않습니다. 출력은 Makefile의 clean target으로 정리하며, 실행 중인 overlay는 보존합니다.\n\n| 설치 확인 | 정상 확인 기준 |\n|---|---|\n| `test \"$ROS_DISTRO\" = humble` | 종료 코드 0 |\n| `command -v ros2 colcon rosdep` | 현재 Ubuntu 환경의 실행 경로 |\n| `make -s print-install-base` | 이 checkout의 빌드 경로; 해당 `setup.bash` source |\n| `make test` | 실패 상세와 skip을 구분; [검사 결과 해석](reference/testing.md#실행-결과-읽기) |\n\n준비 후 [실행](running.md), [테스트](testing.md), [캘리브레이션](calibration.md) 가이드로 이동합니다. Gazebo 지원 조합은 Humble/Fortress입니다.\n\n## 7. 선택 환경\n\n### Jetson Orin USB 카메라 회전\n\nDECXIN `1M-2012V1` USB 카메라(`0bda:5844`)의 180도 회전은 native host에서\n초기화합니다. 설치 대상은 JetPack 6 계열의 Ubuntu 22.04 aarch64 Jetson Orin이며,\nsystem Python 3.10, systemd와 udev를 사용합니다. 별도 pip 패키지는 필요하지 않습니다.\nROS workspace나 vision container 안에 설치하지 않습니다.\n\n저장소 루트에서 다음 명령을 실행합니다.\n\n```bash\nmake test-camera-orientation\nmake camera-host-install\n```\n\n설치기는 다음 파일을 root 소유로 복사하고 systemd와 udev 설정을 다시 읽습니다.\n작업 checkout은 실행 시 참조하지 않습니다.\n\n| 설치 경로 | 역할 |\n|---|---|\n| `/usr/local/libexec/cleany/camera-orientation.py` | USB 장치 확인, Roll 설정과 readback, 드라이버 복구 |\n| `/etc/systemd/system/cleany-camera-orientation@.service` | USB 장치별 일회성 초기화 |\n| `/etc/udev/rules.d/70-cleany-camera-orientation.rules` | 해당 VID/PID의 USB 연결 시 초기화 요청 |\n\n설치 명령은 실행 중인 카메라를 건드리지 않습니다. 설치 후 캡처 프로그램을 닫고 USB를\n재연결합니다. 이후 재연결과 부팅 시 udev가 초기화를 요청하므로 별도의\n`systemctl enable`은 사용하지 않습니다. 규칙은 동일 VID/PID를 가진 모든 카메라에\n적용됩니다. 이 모듈의 공통 serial 문자열로 여러 카메라를 구분하지 않습니다.\n\n호스트 설정을 바꾸지 않고 설치 결과만 확인하려면 별도 경로에 배치합니다.\n\n```bash\npython3 tools/camera/install.py install --root /tmp/cleany-camera-stage\npython3 tools/camera/install.py uninstall --root /tmp/cleany-camera-stage\n```\n\n제거는 Jetson 호스트에서 `make camera-host-uninstall`로 수행합니다.\n운영 중 조회, 수동 적용과 캡처 시작 순서는 [실행 가이드](how-to/sensors.md#jetson-usb-카메라-회전)를\n따릅니다.\n\n### 조작과 인식\n\n`cleany_manipulation_bt`는 BehaviorTree.CPP 4.x를 사용합니다. Humble Navigation의\n`behaviortree_cpp_v3`와 별도 패키지이며 두 major 버전을 함께 설치할 수 있습니다.\n개별 설치와 빌드는 다음 명령을 사용합니다.\n\n```bash\nsudo apt install ros-humble-behaviortree-cpp ros-humble-pybind11-vendor python3-dev python3-zmq\nmake build-manipulation-bt\n```\n\nGemini 인식으로 MuJoCo Action을 실행할 터미널에는 `GEMINI_API_KEY`를 설정합니다.\n로컬 파일을 사용한다면 권한 `600`의 `~/.config/cleany/gemini.env`에 `export` 문을\n보관하고 실행 전에 source합니다. 모델 준비는 [인식 reference](../../ros2_ws/src/cleany_perception/docs/runtime.md#모델-준비)를 따릅니다.\n\n아래 명령으로 runtime package 설치를 확인합니다.\n\n```bash\nros2 pkg prefix moveit_ros_move_group\nros2 pkg prefix moveit_kinematics\nros2 pkg prefix moveit_planners_ompl\nros2 pkg prefix controller_manager\nros2 pkg prefix joint_trajectory_controller\nros2 pkg prefix mujoco_ros2_control\n```\n\n\n### Fedora\n\nUbuntu 22.04 Distrobox `ros2-humble` 안에 위 의존성을 준비합니다. 호스트 Python과 Ubuntu ROS Python은 혼용하지 않습니다. GUI 실행에는 display와 OpenGL 전달도 필요합니다.\n\n### ESP32\n\n모터 펌웨어와 micro-ROS 준비는 [ESP32](../../esp32/README.md) 가이드를 따릅니다. 고정 버전은 [micro_ros.lock.json](../../esp32/micro_ros.lock.json)이 관리하며, firmware와 ROS/Agent의 shell 환경은 분리합니다. 장치 없는 빌드 이후 upload, serial 연결, 모터 구동은 각각 별도로 확인합니다.\n\n### Monitor 웹\n\n웹 빌드는 Node.js 22 이상과 pnpm 11을 사용합니다.\n\n```bash\ncd ros2_ws/src/cleany_dev_monitor/web\npnpm install --frozen-lockfile\npnpm build\n```\n\n`pnpm-lock.yaml`이 웹 dependency를 고정합니다. 빌드된 `web/dist`를 package 설치에 포함하므로 ROS 런타임에는 Node.js가 필요하지 않습니다. Playwright browser는 개발 검증 시 설치하며, ROS 쪽 aiohttp, Pillow 등은 package.xml과 rosdep으로 설치합니다.\n\n## 문제 해결\n\n| 증상 | 확인과 조치 |\n|---|---|\n| Python import 오류 | 같은 worktree를 빌드하고 해당 install overlay를 source |\n| Rosdep의 `python3-mujoco-pip` 키 오류 | `rosdep update`로 공식 규칙을 갱신 |\n| Gazebo 환경 검사 실패 | Ubuntu 22.04, Python 3.10, ROS humble, Ignition Gazebo major 6, ros_gz package 확인 |\n| Headless camera/GPU LiDAR 실패 | Server의 rendering context와 display/OpenGL 확인. `LIBGL_ALWAYS_SOFTWARE=1 make sim-gazebo`는 저속 진단용 fallback |\n| Viewer 실패 | VM 3D acceleration과 DISPLAY/socket 확인. Hand-eye 수집에는 viewer 필요; 화면 없는 환경에서는 `test-handeye`의 headless 검사 사용 |\n\n설치 기준은 [ROS Humble 공식 문서](https://docs.ros.org/en/humble/Installation/Ubuntu-Install-Debs.html)를 따릅니다. 저장소의 재현 기준은 package.xml, 공식 rosdep 규칙, lock 파일과 [CI](../../.github/workflows/ci.yml)가 관리합니다.\n\n## Jetson 실물 제어 패키지\n\n실물 상태 조회, Feetech 제어기와 MoveIt 연동 패키지는 다음 명령으로 빌드합니다.\nROS 의존성은 위 rosdep 절차로 준비합니다. 빌드에는 로봇 장치가 필요하지 않습니다.\n`cleany_robot_interface` 빌드는 Python 노드와 Feetech C++ 플러그인을 함께 설치합니다.\nFeetech 드라이버를 별도 패키지로 빌드한 환경에서 전환할 때는 새 `CLEANY_BUILD_ROOT`를\n사용하고 이전 install을 source하지 않은 셸에서 빌드합니다.\n\nrosdep의 pip 규칙에는 패키지 이름을 사용하고, CI의 Feetech SDK 1.0.0 고정은\n[`pip-constraints.txt`](../../containers/ci/pip-constraints.txt)에서 관리합니다. 같은 버전으로\n로컬 의존성을 준비하려면 `PIP_CONSTRAINT=\"$PWD/containers/ci/pip-constraints.txt\" make deps`를 사용합니다.\n\n```bash\nmake build-jetson-control\nsource \"$(make -s print-install-base)/setup.bash\"\n```\n\n`CLEANY_DATA_ROOT`의 기본값은 저장소 옆 `cleany-data`이고,\n`CLEANY_BUILD_ROOT`는 그 아래 `builds/\u003ccheckout>`입니다. `BUILD_BASE`,\n`INSTALL_BASE`, `LOG_BASE`는 빌드 루트 아래의 `build`, `install`, `log`입니다.\n호스트 Python 도구와 `tools/ros2/cleany-install-env`도 같은 경로 규칙을 사용합니다.\n`INSTALL_BASE`를 바꿔 직접 실행할 때는 `CLEANY_INSTALL_BASE`에도 같은 값을 지정합니다.\n\n실물 실행은 [제어 실행 절차](how-to/manipulation.md#jetson-실물-실행-경로)를 따릅니다.\n\nJetson에서 시스템 MoveIt과 버전을 맞춘 사용자 설치본을 사용하는 경우에는\n빌드 전에 해당 dependency overlay를 source합니다. 예를 들어 기존 MoveIt 2.5.9\n설치 환경은 아래 perception/Pilz overlay를 사용합니다. 없는 환경에서는 먼저 위\nrosdep 절차로 배포판 의존성을 준비합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$HOME/.local/share/cleany/moveit-scene-runtime/local_setup.bash\"\nexport LD_LIBRARY_PATH=\"$HOME/.local/share/cleany/moveit-perception/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH):${LD_LIBRARY_PATH:-}\"\nmake build-jetson-control\n```\n\n\n## 실물 모션 기반\n\nJetson의 센서 장면과 동시 OctoMap 조회는 MoveIt 2.5.9에 맞춘 로컬 overlay를 사용한다.\n시스템 패키지를 교체하지 않고 `$HOME/.local/share/cleany` 아래에 설치한다.\n\n```bash\nmake scene-mapping-setup\nmake moveit-octomap-lock-setup\nsource tools/scene-mapping-env\nmake build-motion-foundation\n```\n\n설치 도구는 버전과 패치 입력 영수증을 확인한다. 이미 준비된 환경에서는 다시 설치할 필요가 없다.\n`CLEANY_SCENE_RUNTIME_PREFIX`, `CLEANY_MOVEIT_PATCH_PREFIX`로 overlay 위치를 바꿀 수 있다.\nGPU IK는 별도의 [모션 컨테이너](../../containers/motion/README.md)를 사용하며 기본 MoveIt 경로는 CUDA를 요구하지 않는다.\n\n모션 기하 회귀 검사는 `trimesh`가 필요하다. `python3-trimesh`는 rosdep 키가 없으므로\n시스템 Python을 바꾸지 않는 테스트 환경에 설치한다. Jetson에 NumPy 1.26이 설치된\n경우 Ubuntu 22.04의 SciPy 1.8 대신 호환되는 SciPy 1.13.1을 이 환경에서 사용한다.\n`CLEANY_BUILD_ROOT`는 [검증 안내](reference/testing.md#실물-계획과-실행-기반-검증)처럼 운영 경로와 분리해 지정한다.\n\n```bash\npython3 -m venv --system-site-packages \"$CLEANY_BUILD_ROOT/test-env\"\n\"$CLEANY_BUILD_ROOT/test-env/bin/python3\" -m pip install --no-deps trimesh==4.5.3 scipy==1.13.1\nmake test-motion-foundation MOTION_TEST_PYTHON=\"$CLEANY_BUILD_ROOT/test-env/bin/python3\"\n```\n\n## 실물 매핑 의존성\n\n`cleany_bringup`의 실물 매핑은 native ROS 2 Humble의 설치된 패키지를 사용합니다.\n`make build-hardware-mapping`은 lockfile로 shadcn UI를 빌드한 뒤 관련 ROS 패키지를 빌드합니다.\nUI 빌드에는 Node.js 22.12 이상과 npm이 필요하며 실행 시 Node 서버나 외부 CDN은 필요 없습니다.\n\n| 하드웨어 매핑 의존성 | 준비 / 확인 |\n|---|---|\n| Cartographer / cartographer_ros_msgs / sllidar_ros2 / micro_ros_agent | 공식 ROS 의존성은 rosdep 우선 |\n| 공식 rosdep으로 준비되지 않는 외부 패키지 | 별도 고정 revision workspace에서 build, 설치 prefix 적용 |\n| micro-ROS Agent | make micro-ros-agent-build, [ESP32 안내](../../esp32/README.md) |\n| LiDAR 원본 / revision | [Slamtec/sllidar_ros2](https://github.com/Slamtec/sllidar_ros2), [hardware.repos](../../configs/dependencies/hardware.repos) |\n\n```bash\n# 별도 dependency workspace에서 실행\nvcs import src \u003c /path/to/cleany/configs/dependencies/hardware.repos\n# 해당 workspace를 빌드하고 설치 overlay 적용 후\nros2 pkg prefix sllidar_ros2\n```\n\n운영 노드는 실행 중 Git clone이나 colcon build를 수행하지 않습니다.\n\n센서 by-id, baud, 장착 TF와 scan mode는 `cleany_bringup/config/mapping_*.yaml`에서 관리합니다.\n장치가 없는 단위/모의 검사는 실물 드라이버 설치 없이 실행할 수 있지만 실물 launch에는 두 외부\n드라이버가 모두 설치돼 있어야 합니다. 이 통합은 MCU 펌웨어를 빌드하거나 업로드하지 않습니다.\n\nHumble의 공식 rosdep 규칙에는 위 두 드라이버가 없으므로 `make deps`와 장치 없는 CI는\n`sllidar_ros2`, `micro_ros_agent`만 명시적으로 제외합니다. package.xml의 실행 의존성은 유지하고\n실물 실행 전 두 드라이버의 package prefix를 확인합니다. CI는 호스트 Node 24에서 조종 UI와\n입력 검사를 먼저 빌드한 뒤 ROS 컨테이너의 workspace에 설치합니다.\n\n## Jetson 얼굴 디스플레이 환경\n\n| 독립 디스플레이 환경 | 조건 |\n|---|---|\n| ROS | Humble, colcon, cleany_interfaces rosdep 의존성 |\n| Desktop | Python venv, Chromium, GNOME 세션 / gnome-session-inhibit, curl, Noto CJK |\n| 부팅 표시 | 그래픽 자동 로그인 필요; 설치기는 로그인 설정 미변경 |\n| Browser 설치 | install-browser.sh가 전용 폴더에 Playwright 1.64.1 / ARM64 browser 설치; 시스템 Python 미변경 |\n\n[디스플레이 운영](../../ros2_ws/src/cleany_display/README.md)을 따릅니다.\n"},"docs/implementation/how-to/base.md":{"title":"베이스 구동과 피드백 확인하기","body":"# 베이스 구동과 피드백 확인하기\n\nMock MCU와 실제 MCU를 구분하고, 명령·휠 피드백·오도메트리와 STOP 응답을 확인합니다.\n\n```mermaid\nflowchart LR\n  Cmd[\"차체 Twist + 구동 허가\"] --> Driver[\"Base driver / 휠 변환\"]\n  Driver -->|\"wheel_command\"| MCU[\"ESP32 / PI · FF · watchdog\"]\n  MCU -->|\"wheel_state\"| Driver\n  Driver --> Odom[\"joint_states → wheel odometry\"]\n```\n\n[공통 환경 준비](../running.md#공통-준비) · [검증 선택](../testing.md)\n\n## Base와 plot\n\n\u003cfigure class=\"visual-slot\" data-visual-id=\"base-plot\">\n\u003cp>\u003cstrong>시각자료 자리 · 비워 둠\u003c/strong>\u003c/p>\n\u003cfigcaption>\u003cstrong>필요한 자료:\u003c/strong> 현재 base_monitor의 명령, encoder, PWM과 진단 상태를 같은 시간축에 담은 화면.\u003cbr>\u003cstrong>빈 이유:\u003c/strong> 기존 데이터에서 이 화면과 대응하는 입력 기록을 찾지 못했습니다.\u003c/figcaption>\n\u003c/figure>\n\n### 장치 없는 mock\n\n별도 domain에서 빌드한 mock를 실행합니다.\n\n```bash\nmake build-base\nexport ROS_DOMAIN_ID=173\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 launch cleany_base_driver base_driver.launch.py mock:=true\n```\n\nMock domain에는 실물 MCU/Agent를 연결하지 않습니다. 고장 주입 service는 mock 노드와 테스트가 관리합니다.\n\n### 실물 base와 관측 GUI\n\nAgent와 driver 양쪽에 domain 0을 적용하고 검토한 hardware config를 선택합니다.\n\n```bash\nexport ROS_DOMAIN_ID=0\nros2 launch cleany_base_driver base_driver.launch.py \\\n  mock:=false config:=\"$(ros2 pkg prefix --share cleany_base_driver)/config/base_hardware.yaml\"\n# 같은 overlay/domain의 별도 터미널에서 관측 GUI:\nros2 launch cleany_base_driver base_monitor.launch.py preset:=true\n```\n\n초기 hardware config는 바퀴를 띄운 시험용입니다. Launch 이후 구동 허가는 별도 절차로 수행하며, mock domain과 실제 MCU domain을 혼용하지 않습니다. 실물 시험은 [ESP32 가이드](../../../esp32/README.md)와 [base 계약](../../../ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md)을 따릅니다.\n\nPlot은 목표, slew/reversal 이후 목표, encoder 속도(rad/s), PWM(%), diagnostics를 표시합니다. `preset:=false wheel:=fl|fr|rl|rr|all`로 관측 범위를 바꿀 수 있습니다. GUI를 종료해도 별도로 실행한 driver/Agent는 계속 실행됩니다.\n"},"docs/implementation/how-to/control-plane-integration.md":{"title":"Jetson 관제 통합","body":"# Jetson 관제 통합\n\nCleany와 `cleany-control-plane`을 노트북에서 개발하고\n`jetson-orin-via-n100`에서 최종 검증합니다. Dashboard, Backend와\n주행 서버는 모두 Jetson에서 실행합니다.\n\n## 지도와 연결\n\n선택한 지도는 `2026-11-08_manual-map-edit`이며 control-plane의\n`apps/backend/maps/slam-20261108/`에 보관합니다. Nav2에는 같은 bundle의 `map.yaml`을\n전달합니다. `metadata.json`의 원본 해시, resolution과 origin으로 지도 일치를\n확인합니다. Dashboard 좌표를 역산하여 주행 목표를 만들지 않습니다.\n\nBackend는 localhost:8080으로 수신하며 LAN에서는 `https://cleany.home.arpa`를\n사용합니다. DNS와 HTTPS 설정은 control-plane의\n`docs/architecture/slam-map-integration.md`가 관리합니다. Backend 원본 지도는 로봇의\n실시간 `/map`이나 좌석 접근 목표를 대신하지 않습니다.\n\n## 실물 연결 전 확인\n\n| 경계 | 필요한 통합 |\n|---|---|\n| Robot Gateway와 pose 연결 | 현재 Backend의 Robot token 헤더를 클라이언트에 전달 |\n| 지도 위치 | 최신 localization `map -> base_link`와 `frame_id=map`, `map_id=slam-20261108` 전달 |\n| 좌석과 home | 실물 지도에서 접근 자세와 정지 조건 검증 후 설정 |\n| 실행 출처 | Mission의 Nav2 `sim` 고정 값을 실제 backend 설정과 일치하도록 변경 |\n| 인식과 조작 | Mission의 MockDesk 경계를 실제 관찰, 계획과 실행 서버에 연결 |\n| 주행 UI | 인증과 origin 검사를 연결한 뒤 LAN 프록시 공개 |\n\n현재 odom relay의 위치를 map 좌표라고 이름만 바꾸면 안 됩니다. 지도 위치가 없으면\nDashboard에 마커를 표시하지 않습니다. 기존 디스플레이와 CAD 서비스는 별도 프로세스이며\n통합을 위해 종료하지 않습니다.\n\n## 검증 순서\n\n1. Backend 계약, 인증과 지도 API를 검증합니다.\n2. Gateway 수락, 상태, 취소, 재연결과 중복 실행 방지를 검증합니다.\n3. 실물 localization, 좌석 접근, 정지와 복귀를 검증합니다.\n4. 고정 베이스에서 실제 관찰, 조작과 재관찰을 검증합니다.\n5. Dashboard 요청부터 전후 관찰, 실제 책상 정리와 복귀까지 연결합니다.\n\n미션 ID와 실행 ID로 두 저장소 commit, 설정, 지도 해시, 로그와 관찰 자료를 연결합니다.\nHTTP health, DNS 응답과 화면 표시는 실물 왕복이나 책상 정리 완료의 증거가 아닙니다.\n"},"docs/implementation/how-to/gamepad.md":{"title":"Jetson에서 게임패드로 수동 조종하기","body":"# Jetson에서 게임패드로 수동 조종하기\n\nLeadJoy Xeno Plus의 2.4 GHz 리시버를 Jetson에 연결하고 패드를 Xbox 모드로 페어링합니다. 이 경로는 Jetson의 USB 수신기와 기존 베이스 드라이버를 사용합니다.\n\n## 드라이버와 입력 확인\n\n`lsusb -d 4131:3519`와 `uname -r`로 장치와 커널을 확인합니다. 설치 도구는 `5.15.148-tegra` 헤더와 Module.symvers, make, gcc, curl, patch, kmod를 사용합니다. 커널 버전이 바뀌면 해당 ABI용 빌드와 실물 시험이 필요합니다.\n\n```bash\ntools/jetson-xpad build\ntools/jetson-xpad load\n```\n\n`load`는 모듈을 이번 부팅에 로드합니다. 조종기 ROS 패키지를 빌드하고 두 터미널에서 ROS 환경을 로드합니다. 런타임 의존성은 `python3-evdev`입니다. 노드는 이름이 `LeadJoy Xeno Plus`인 이벤트 장치를 자동으로 찾아 수신기 식별자와 보고서 기능을 검증합니다. 해당 장치에 읽기 권한이 필요합니다. 같은 패드가 여러 대면 `device:=/dev/input/by-path/…-event-joystick`으로 사용할 포트를 지정합니다.\n\n```bash\nexport ROS_LOCALHOST_ONLY=1 ROS_DOMAIN_ID=104\nros2 launch cleany_teleop gamepad.launch.py\nROS_LOCALHOST_ONLY=1 ROS_DOMAIN_ID=104 ros2 topic echo /joy\n```\n\n왼쪽 스틱을 위로 밀면 `axes[1]`, 왼쪽으로 밀면 `axes[0]`가 양수가 됩니다. LB와 RB를 누르면 각각 `buttons[4]`와 `buttons[5]`가 1이 됩니다. 스틱을 일정하게 유지해도 실제 입력 보고서가 계속 들어오는지 확인합니다. LB를 누른 채 패드 전원을 끄거나 리시버를 뺐을 때 입력이 끊기거나 중립으로 바뀌는지 각각 확인합니다. RF 단절 뒤에도 마지막 이동 입력이 계속 수신되면 해당 리시버 설정에서는 실물 구동을 보류합니다.\n\n실물 입력 시험 뒤 `tools/jetson-xpad install`로 USB 자동 로드용 모듈과 udev 규칙을 설치합니다. `plugdev` 그룹은 `/dev/input/cleany-gamepad`를 읽을 수 있습니다. 재부팅·재연결 후 같은 장치로 시험합니다. 입력 노드를 종료한 뒤 `tools/jetson-xpad remove`로 설치를 되돌릴 수 있습니다.\n\n## 수동 조종\n\n동일한 Jetson 사용자로 실행하는 Control Plane의 환경에 다음 값을 지정합니다. 경로는 해당 사용자의 `echo \"$XDG_RUNTIME_DIR\"` 결과에 맞춥니다.\n\n```ini\nCLEANY_GAMEPAD_SOCKET=/run/user/1000/cleany-gamepad.sock\n```\n\n변경한 Backend와 `cleany_teleop`를 함께 배포하고 Backend를 재시작합니다. 기존 수동 조종 서버의 토큰과 loopback 연결 설정은 [휴대폰 주행 절차](phone-navigation.md)를 따릅니다. 조종 서버, 베이스 드라이버와 MCU 피드백이 준비된 뒤 입력 확인용 launch를 종료하고 다음을 실행합니다.\n\n```bash\nros2 launch cleany_teleop gamepad.launch.py drive:=true\n```\n\n처음에는 왼쪽 스틱과 오른쪽 스틱을 가운데에 둡니다. 왼쪽 스틱으로 전후진과 횡이동을 하고, 오른쪽 스틱을 좌우로 기울여 제자리 회전하거나 이동하면서 회전합니다. 오른쪽으로 기울이면 시계 방향입니다. 왼쪽 스틱과 오른쪽 스틱의 수평 축을 놓으면 정지합니다. 전후진과 회전만 허용된 설정에서는 횡이동 입력을 0으로 보냅니다. 입력이 끊기면 정지하고, 스틱을 민 채 다시 연결하면 새 입력으로 조종권을 얻은 뒤 주행을 재개합니다.\n\nLT를 절반 이상 누르면 병진 속도 상한은 0.1 m/s, RT는 0.5 m/s입니다. 동시에 누르면 LT가 우선하고 두 트리거를 놓으면 기본 속도로 돌아갑니다. 회전 속도는 오른쪽 스틱의 수평 편향으로 정합니다.\n\n오른쪽 스틱을 위아래로 기울이면 헤드 카메라가 움직이고, 놓으면 현재 각도를 유지합니다. 최초 조향 전에 수직 축을 가운데에 둡니다. 조향 노드는 `CLEANY_FIELD_REPO/configs/robot`의 헤드 보정 파일을 읽고 팔과 공유하는 직렬 버스를 단독 사용합니다. 팔 제어기가 이 포트를 사용하는 세션은 `head:=false`로 실행합니다.\n\nLS와 RS를 놓으면 가운데를 지나 양쪽으로 튀는 동안 해당 축의 조종 입력이 0이 됩니다. 다른 축을 계속 밀고 있으면 그 축의 조작은 이어집니다. 가운데에서 안정된 스틱은 바로 조작할 수 있고, 곧바로 반대 방향으로 밀면 새 방향이 60 ms간 유지된 뒤 반영됩니다. `/joy`에서 LS의 조종값은 `axes[0:2]`, 원본은 `axes[6:8]`입니다. RS의 조종값은 `axes[3:5]`, 원본은 `axes[8:10]`입니다.\n\n운전 중 서보 보호 정지가 발생하면 로그에 축 ID, 실측 위치, 상태 코드, 온도가 표시됩니다. 양쪽 서보에서 1초간 정상값을 확인한 뒤 RS를 가운데에 놓고 다시 기울이면 조향이 재개됩니다.\n\n첫 구동은 바퀴를 띄운 상태에서 설정된 저속으로 확인합니다. 스틱과 버튼의 중립 복귀, 패드 전원 끄기, 리시버 분리와 어댑터 종료를 시험하고 MCU의 정지 확인 및 측정 휠 속도를 기록합니다. 입력 만료 설정과 측정한 정지 시간을 구분해 기록합니다.\n"},"docs/implementation/how-to/manipulation.md":{"title":"물체 관찰과 조작 실행하기","body":"# 물체 관찰과 조작 실행하기\n\nPlan-only 후보 선택, Mock Action과 MuJoCo 조작은 실행 범위가 다릅니다. 필요한 경로를 먼저 선택하세요.\n\n```mermaid\nflowchart TD\n  Observe[\"관찰과 대상 선택\"] --> Plan[\"MoveIt 도달성 · 충돌 검사\"]\n  Plan --> Execute[\"접근 · 파지 · 운반\"]\n  Execute --> Verify[\"재관측 · 놓기 · 팔 복귀\"]\n  Verify --> Stop[\"정지 확인과 결과\"]\n  Execute -->|\"실패 / 취소\"| Stop\n```\n\n[공통 환경 준비](../running.md#공통-준비) · [검증 선택](../testing.md)\n\n## MuJoCo와 조작 데모\n\n\u003cfigure class=\"visual-slot\" data-visual-id=\"manipulation-run\">\n\u003cp>\u003cstrong>시각자료 자리 · 비워 둠\u003c/strong>\u003c/p>\n\u003cfigcaption>\u003cstrong>필요한 자료:\u003c/strong> 본문 MuJoCo 실행의 관찰 → 접근 → 놓기와 Action 결과를 연결한 화면 또는 GIF.\u003cbr>\u003cstrong>빈 이유:\u003c/strong> 기존 실물 파지 사진과 Isaac 저장 자세는 이 실행 경로를 보여주지 않습니다.\u003c/figcaption>\n\u003c/figure>\n\n실물 공통 CAD와 기존 시뮬레이션은 [모델 계약](../../../ros2_ws/src/cleany_description/docs/model.md)에서 구분합니다. 아래 실행 경로에서 사용하는 모델과 구동 설정을 먼저 확인합니다.\n\n| 실행 범위 | 진입점 |\n|---|---|\n| 장면만 관찰 | `ros2 launch cleany_mujoco_sim mujoco_study_cafe.launch.py` |\n| 인식과 plan-only | `ros2 launch cleany_skill_executor study_cafe_nearest_grasp_demo.launch.py` |\n| 연속 수거 | `ros2 launch cleany_skill_executor study_cafe_sorting.launch.py` |\n| 단일 물체 Action | 아래 Mock / BT 실행 |\n\n직접 launch는 `make build` 후 [공통 overlay](../running.md#공통-준비)를 적용합니다. 한 domain에서 backend는 하나만 실행합니다. [모델 준비와 실제 결과 판독](../../../ros2_ws/src/cleany_skill_executor/docs/study-cafe-sorting-usage.md)을 따릅니다.\n\n### 단일 물체 Manipulation Action\n\nMock 서버의 요청, 취소, 조회와 모니터 사용은\n[Mock 실행 안내](../../../ros2_ws/src/cleany_skill_executor/docs/manipulation-mock-usage.md)를 따릅니다.\n실제 인식과 MoveIt을 사용하는 MuJoCo BT 스택은 다음 명령으로 실행합니다.\n\n```bash\nmake sim-mujoco-manipulation\n```\n\n이 스택은 승인된 물체 하나를 실행하며, 기존 sorting coordinator와 별도 구성입니다.\n입력, 세부 옵션과 검증 범위는 [MuJoCo BT 서버](../../../ros2_ws/src/cleany_manipulation_bt/README.md)를 따릅니다.\n\n### Plan-only 후보 선택\n\nMoveIt을 준비한 뒤 같은 overlay의 별도 터미널에서 후보 선택을 실행합니다.\n\n```bash\nros2 launch cleany_moveit_config mock_planning.launch.py\n# 같은 overlay의 별도 터미널\nros2 launch cleany_skill_executor grasp_selection.launch.py\n```\n\n### MuJoCo 접근 데모\n\n가까운 물체 하나의 pre-grasp와 선택적 lift는 `nearest_pregrasp_coordinator` 경로입니다. RGB-D, Perception, Grasp, MoveIt과 controller를 먼저 준비하고 [실행 절차](../../../ros2_ws/src/cleany_skill_executor/docs/manipulation.md#가까운-객체-자동-pre-grasp)를 따릅니다. 기본 pre-grasp 완료와 집기·lift 성공은 서로 다른 결과입니다.\n\n## Jetson 실물 실행 경로\n\n외부 제어 프로파일의 온도 설정은 [Feetech 온도 MACD 설정](../../../ros2_ws/src/cleany_robot_interface/docs/feetech-hardware.md#온도-macd-필터)을 따른다.\n기존 `temperature_fault_confirmation_samples`를 제거하고 세 시정수를\n명시해야 새 드라이버가 기동한다. 생성된 제어 모델은 표현 가능한 실측\n모터 범위와 운영 위치 제한의 교집합을 사용한다.\n\n`cleany_robot_interface`는 로봇 상태 조회와 Feetech 컨트롤러 실행을 제공합니다.\n로봇별 시리얼 포트, 엔코더 보정과 운영 한계는 실행 전에 확인한 외부 프로파일로 지정합니다.\n패키지의 `test/data` 파일은 합성 검사 입력이며 운영 기본값으로 사용하지 않습니다.\n관절 미리보기 `arm_preview.launch.py`는 모델 경로, 상태 설정, RViz, 헤드 포함 여부와\n마스트 간격을 받습니다. 기본 모델은 명목 형상이며, 저장된 보정을 적용한 실물\n모델은 아래 상태 프로파일 실행 절차를 따릅니다.\n\n1. [개발환경](../development-setup.md#jetson-실물-제어-패키지)에 따라 빌드하고 같은 install을 적용합니다.\n\n   ```bash\n   source /opt/ros/humble/setup.bash\n   source \"$(make -s print-install-base)/setup.bash\"\n   ```\n\n2. 실물 상태와 제어기는 동일 시리얼 포트를 단독 점유합니다. 다른 상태 조회기를 종료한 뒤 읽기 전용으로 시작합니다.\n\n   ```bash\n   ros2 launch cleany_robot_interface real_control.launch.py \\\n     repository_root:=\"$PWD\" \\\n     profile_file:=/absolute/path/to/state-profile.json \\\n     control_file:=/absolute/path/to/control-limits.yaml \\\n     read_only:=true with_moveit:=false\n   ```\n\n3. MoveIt 연결이 필요하면 `with_moveit:=true`를 사용합니다. 읽기 전용에서는 궤적 실행도 차단합니다.\n   제어를 허용하는 별도 실행은 확인한 운영 한계와 프로파일을 사용해 `read_only:=false`로 시작합니다.\n   외부 실행기가 궤적을 소유하는 경우에는 `allow_trajectory_execution:=false`로 MoveIt 실행 권한을 분리합니다.\n\n상태 가드는 결측되거나 오래된 관절 상태를 차단합니다. 정지 요청은 `/real_control/stop`\n서비스를 사용합니다. 토픽, 상태와 카메라 제어는 [패키지 인터페이스](../../../ros2_ws/src/cleany_robot_interface/docs/interfaces.md)를 따릅니다.\n\n\n## 실물 파지 계획과 준비 자세\n\n1. [환경 설정](../development-setup.md#실물-모션-기반)의 MoveIt overlay를 준비하고 빌드한다.\n\n   ```bash\n   make build-motion-foundation\n   source tools/scene-mapping-env\n   source \"$(make -s print-install-base)/setup.bash\"\n   ```\n\n2. 실물 상태 조회, MoveGroup과 인식을 실행한 환경에서 계획 전용 선택기를 시작한다.\n   인식의 `inspect_scene.launch.py`에는 `enable_reference_observation:=true`를 지정한다.\n\n   ```bash\n   ros2 launch cleany_skill_executor physical_grasp_selection.launch.py \\\n     repository_root:=\"$PWD\" motion_backend:=moveit\n   ros2 launch cleany_skill_executor validate_pick.launch.py --show-args\n   ```\n\n3. 기존 실물 controller에 센서와 계획 서비스를 연결하는 설정은\n   `pregrasp_hardware_support.launch.py --show-args`로 확인한다. 이 launch는\n   RGB-D 카메라와 장면 처리도 시작하며 기본 후보 생성은 `geometric`이다.\n   같은 카메라를 별도로 중복 실행하지 않는다. 모터 실행은 요청하지 않는다.\n   `hardware_pregrasp`는 별도로 실행하는 물리 동작 도구이며 준비 자세 도달과 재관찰까지만 수행한다.\n   전체 수거와 복귀는 이 경로의 기능이 아니다.\n\n[계획과 실행 조건](../../../ros2_ws/src/cleany_skill_executor/docs/physical-pregrasp.md),\n[선택적 GPU 환경](../../../containers/motion/README.md)을 함께 확인한다.\n\n\n## 실물 수거와 팔 복귀\n\n실물 준비 자세 실행 이후 수거, 복귀와 복구 명령은\n[실물 수거 안내](../../../ros2_ws/src/cleany_skill_executor/docs/physical-collection.md)를 따른다.\n실물 프로필을 명시적으로 입력하며 `make collection-plan`과 실제 실행 명령을 구분한다.\n\n## Decision 의미 분류와 운영 진입점\n\n기본 `yoloe_gemini` 구성은 YOLOE 마스크 뒤 `gemini-decision-1`을 호출한다.\n`GEMINI_API_KEY`를 같은 실행 환경에 주입한다. 종류 후보, 영어 질문, 위험에 따른\n최종 검토 규칙과 실패 계약은 [perception 런타임](../../../ros2_ws/src/cleany_perception/docs/runtime.md#decision-분류)을 따른다.\n\n```bash\nros2 launch cleany_perception inspect_scene.launch.py gemini_model:=gemini-decision-1\n```\n\n기존 분류기는 `gemini_model:=gemini-3.5-flash-lite`로 명시적으로 선택한다.\nnative와 컨테이너의 `run-perception`은 선택한 YOLOE 프로파일의 `gemini_model`을\n읽고, `GEMINI_MODEL` 설정을 우선한다. 기본 운영 프로파일은 Decision을 사용한다.\nJetson의 수동 인식은 현재 저장소의 기본 ROS 설치 경로를 사용한다. 별도 설치본은 `CLEANY_YOLOE_NATIVE_INSTALL`으로 지정한다.\n헤드 카메라는 `serial_no:=261822075013`일 때 설치된 `cleany_perception/config/jetson_head_intrinsics.json`을 읽는다. 다른 일련번호 또는 미지정 장치는 SDK 보정을 사용한다. `rgb_intrinsics_file:=...`로 보정 파일을 직접 지정할 수 있다. Jetson의 기본 native 인식은 장비 프로필에 따라 참조 관측과 손목 관측을 켜고 참조를 600초 동안 보존한다.\n\n두 실행기의 RGB-D 구독 기본값은 best-effort다. 컨테이너에서 reliable이 필요한\n입력은 `CLEANY_RGBD_QOS_RELIABILITY=reliable`로 명시한다.\n\n| 운영 진입점 | 인식 제공자와 모델 선택 |\n|---|---|\n| `cleany-perception.service`, Jetson의 `make perception-run` | `tools/perception-native`, 기본 real53 프로파일 |\n| `tools/vision-container perception-run`, `hybrid-run` | 컨테이너 `run-perception`, 엔진에 맞는 기본 real53 또는 real32 프로파일 |\n| `ros2 launch cleany_perception inspect_scene.launch.py` | 현재 source한 설치본의 프로파일; `gemini_model:=...` 명시값 우선 |\n\n`decision_object_types`는 ROS 문자열 배열로, `decision_prompt_file`은 설치된 기본\nYAML 또는 명시한 파일로 설정한다. 종류 후보와 질문은 실제 검출 이름을 힌트로 쓰지 않는다.\n시작 준비는 API를 호출하지 않으며 검출이 있는 새 관측에서 실제 접근을 확인한다.\n저장 이미지 검증과 실제 Jetson 배포는 구분한다.\n"},"docs/implementation/how-to/mapping.md":{"title":"지도 만들기와 저장 지도 주행","body":"# 지도 만들기와 저장 지도 주행\n\nLiDAR, 휠 피드백과 TF를 확인한 뒤 매핑 세션을 시작합니다. 저장된 지도와 원점을 확인하고 주행 구성에 연결합니다.\n\n| 작업 | 입력 | 실행 / 결과 |\n|---|---|---|\n| 새 지도 만들기 | 현재 scan, wheel odom, TF | [실물 매핑](#실물-휠-odometry와-2d-lidar-매핑) → PGM/YAML + pbstream |\n| 재처리할 센서 기록 | 연속 raw 센서 입력 | [원본 bag](#오프라인-slam-비교용-원본-bag) → rosbag2 |\n| 저장 지도에서 주행 | 지도와 일치하는 현재 위치 | [Navigation](#저장-지도-navigation) |\n| 기존 지도 확장 | `.pbstream` + 유효한 AMCL 위치 | [병행 확장](#기존-지도-병행-확장) → 별도 namespace와 출력 |\n\n[공통 환경 준비](../running.md#공통-준비) · [검증 선택](../testing.md)\n\n## 지도·스캔·위치를 함께 보기\n\n![기록된 지도, LiDAR 스캔, 로봇 TF와 궤적을 겹쳐 본 예시](../../assets/examples/mapping-poster.png)\n\n실물 bag에 기록된 레이어를 같은 시각으로 표시한 예시입니다. 지도의 회색·흰색·검은색, 스캔 점과 로봇 좌표축을 구분해 봅니다. 궤적은 이동 이력이며 현재 위치는 TF로 표시합니다.\n\n\u003cdetails>\u003csummary>기록 재생 GIF 보기 · 6.7 MB\u003c/summary>\n\u003cimg src=\"../../assets/examples/mapping-replay.gif\" alt=\"기록된 SLAM 레이어를 시간순으로 재생한 애니메이션\" loading=\"lazy\">\n\u003cp>기록을 6초 간격으로 표본화한 약 60배속 재생입니다. 새 SLAM 계산이나 완전한 원본 재생이 아니며, 기록 누락은 유지됩니다.\u003c/p>\n\u003c/details>\n\n## 실물 휠 odometry와 2D LiDAR 매핑\n\n1. [개발환경](../development-setup.md#실물-매핑-의존성)의 외부 Agent와 LiDAR 드라이버를 준비하고 `make build-hardware-mapping`을 실행한다.\n2. 저장소 루트에서 `make run-hardware-mapping`으로 실행할 수 있다. 기존 base, Nav2, 조종기와 중복 실행하지 않는다.\n   이 명령과 `tools/hardware-mapping`은 현재 저장소의 ROS 설치본, LiDAR 드라이버와 USB Agent의 설치 환경을 읽는다.\n   Jetson에서는 저장소의 `ros2_ws/src/cleany_bringup/config/mapping_cad_lidar_front.yaml`을 기본으로 읽는다. `profile:=...`으로 다른 프로필을 선택할 수 있다.\n   `make run-hardware-mapping HARDWARE_MAPPING_ARGS=--show-args`로 장치를 시작하기 전에 launch 인자를 확인한다.\n3. 현재 센서 장착과 일치하는 [프로필](../../../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md)을 선택한다.\n\n   FreeCAD와 같은 조립체이고 LiDAR 쪽이 전방이면 `mapping_cad_lidar_front.yaml`을\n   선택한다. 센서 변환 변경 전 기존 지도를 저장하고 새 매핑 세션에서 실행한다.\n\n   ```bash\n   ros2 launch cleany_bringup hardware_mapping.launch.py \\\n     profile:=\"$(ros2 pkg prefix --share cleany_bringup)/config/mapping_cad_lidar_front.yaml\"\n   ```\n\n4. 로그의 조종 주소와 state_root/web-token 키로 접속한다. 주소의 127.0.0.1만 노트북 LAN 주소로 바꾼다.\n   연결 후 지도 초기화를 누르고 running 상태를 확인한 뒤 휴대폰으로 조종한다. 초기화 접수는 완료를 뜻하지 않는다.\n5. Ctrl+C로 종료하면 입력을 막고 STOP, 지도/pbstream 저장과 Logger flush를 확인한 뒤 장치를 종료한다.\n   지도는 기본 `~/.local/state/cleany/hardware/maps/`, 녹화는 `recordings/`에 보존한다.\n\n`state_root`, `host`, `phone_port`, `mock`은 launch 인자다. 모의 모드는 별도 ROS domain에서 사용하며\n실물 장치 대신 main의 mock MCU를 실행한다. 모의 LiDAR 입력은 런타임 검사 도구가 제공한다.\n새 SLAM은 IMU를 사용하지 않으며 raw scan 원본, 전방 180도와 0.30m 마스킹을 유지한다.\n기존 Dev Monitor는 별도로 실행해 지도와 센서를 관측할 수 있다.\n\n휴대폰만 독립 실행할 때는 같은 geometry의 base driver가 먼저 실행돼 있어야 한다.\n\n```bash\nros2 launch cleany_teleop teleop.launch.py \\\n  base_config:=\"$(ros2 pkg prefix --share cleany_base_driver)/config/base_hardware.yaml\"\n```\n\n문제가 발생하면 조종 상태 API의 `last_permission_error`, `event_log`와 매핑 상태 API의\n`status_age_ms`, `error_code`, `error_file`을 먼저 확인한다. 기본 실행의 조종 사건은\n`~/.local/state/cleany/hardware/teleop-events.jsonl`, 매핑 오류 JSON은\n`~/.local/state/cleany/hardware/maps/errors/`에 남는다. `state_root`를 바꿨다면 해당 경로를\n따른다. 오류 JSON을 쓰지 못한 경우 `state_root/mapping.log`에서 traceback을 확인한다.\n\n## 오프라인 SLAM 비교용 원본 bag\n\nLogger의 가공 기록과 별도로 연속적인 센서 입력을 확보하려면 Jetson에서 빌드한\nROS overlay를 source한 뒤 다음 도구를 실행합니다. Python 관측기의 큐를 거치지 않고\n네이티브 rosbag2가 `/scan_raw`, `/odom`, `/tf`, `/tf_static`, `/base/wheel_state`,\n`/joint_states`를 저장합니다. 조종 명령과 기존 지도 출력은 입력에 포함하지 않습니다.\nSQLite에는 `resilient` preset을 적용하며 기본 native cache는 64 MiB입니다.\n\n```bash\npython3 tools/validation/record_mapping_bag.py \\\n  --output \"$HOME/.local/state/cleany/mapping-bags/trial-$(date +%Y%m%dT%H%M%S)\" \\\n  --duration-s 180\n```\n\n180초가 지나거나 Ctrl+C를 누르면 해당 recorder만 SIGINT로 종료해 cache와 metadata를\n마감합니다. 기존 bag 경로는 덮어쓰지 않습니다. 같은 비교 주행 중에는 지도 초기화로\nodom 원점을 바꾸지 않습니다. 사용한 하드웨어 프로필과 Cartographer 설정도 함께 보존합니다.\n원본 bag에서도 시각 공백과 메시지 수를 확인한 뒤 재처리에 사용합니다.\n\n## 저장 지도 Navigation\n\n```bash\nmake build-navigation\nsource \"$(make -s print-navigation-install-base)/setup.bash\"\nros2 launch cleany_navigation navigation.launch.py --show-args\n```\n\n[Launch](../../../ros2_ws/src/cleany_navigation/launch/navigation.launch.py)에서 지도, backend, sensor 옵션을 확인합니다. `map → odom`의 소유자는 하나만 선택하므로 Mapping과 AMCL을 함께 실행하지 않습니다.\n\n주행 명령은 Mission의 Navigator/Nav2가 생성합니다. Runtime은 `/cmd_vel`을 직접 만들지 않으며, 안전 경로와 sensor 만료 규칙은 [Navigation reference](../../../ros2_ws/src/cleany_navigation/docs/safety.md)를 따릅니다.\n\n## 기존 지도 병행 확장\n\n`.pbstream`의 기존 궤적을 고정하고 새 궤적을 추가합니다. 시작 시 현재 `map → base_link`와 저장 원점을 쓰므로 AMCL 위치가 먼저 맞아 있어야 합니다.\n\n```mermaid\nflowchart LR\n  Scan[\"scan / odom / 기존 TF\"] --> Extension[\"확장 Cartographer\"]\n  Seed[\"seed.pbstream / 고정된 기존 궤적\"] --> Extension\n  Extension --> Map[\"/map_extension/map + tracked_pose\"]\n  Extension --> TF[\"/map_extension/tf\"]\n  Existing[\"AMCL / Nav2\"] --> Global[\"기존 /map과 전역 TF\"]\n```\n\n확장은 전역 TF와 속도 명령을 발행하지 않아 AMCL/Nav2와 병행할 수 있습니다. 확장 영역은 수동조종하며 자동주행 지도 교체는 별도 작업입니다. 지도 이미지로 확장을 시작할 수는 없습니다.\n\nROS 환경과 현재 workspace overlay를 적용한 터미널에서 실행합니다.\n`--origin-reader`에는 `tools/validation/map_extension/read_origin.cpp`를\n해당 Cartographer 개발 라이브러리로 빌드한 실행 파일을 지정해야 합니다.\n출력 폴더는 아직 존재하지 않는 경로를 사용합니다.\n\n```bash\npython3 tools/validation/map_extension/extend.py \\\n  --source /path/to/seed.pbstream \\\n  --output /path/to/local-data/runs/mapping/YYYY-MM-DD_HHMMSS_map-extension \\\n  --origin-reader /path/to/read_origin\n```\n\n출력 폴더에는 입력 사본 `seed.pbstream`, 원점과 시작 자세 `session.json`,\n60초 주기의 `latest.pbstream`, `map.yaml`, `map.pgm`을 저장합니다.\n종료할 때는 실행 터미널에서 `Ctrl-C`를 누릅니다. 궤적 종료와\n`final.pbstream` 저장은 종료 로그와 출력 파일로 확인합니다.\nRViz에서는 `/map_extension/map`과 `/map_extension/tracked_pose`를 선택합니다.\n원본 지도와 기존 로거는 변경하지 않습니다.\n\n확장 RViz는 `/tf`를 `/map_extension/view_tf`로 remap해 실행합니다.\n`tools/validation/map_extension/view_tf.py`를 함께 실행하면 LiDAR와 odometry를\n확장 SLAM의 자세 기준으로 표시합니다. 궤적과 지도는 `/map_extension` 토픽을\n선택합니다. 제약선, raw scan, scan-matched point cloud는 표시 항목에서 켤 수 있습니다.\n\n\u003cfigure class=\"contract-figure\" data-visual-id=\"map-growth\">\n\u003cimg src=\"../../assets/examples/map-growth.gif\" alt=\"고정한 기존 지도에 새 관측이 더해지면 무엇이 변하나?\" loading=\"lazy\">\n\u003cfigcaption>기록 센서와 seed pbstream을 Cartographer로 재처리하며 지도가 확장되는 예시입니다. 2026-11-06 생성, 313프레임 /
