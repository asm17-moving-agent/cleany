|\n|---|---|---|---|\n| 토픽 구독 | `camera/head/depth/image_raw` | `sensor_msgs/msg/Image` | Sensor; `input_topic` |\n| 토픽 구독 | `camera/head/depth/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor; `camera_info_topic` |\n| 토픽 구독 | `nav2/cmd_vel` | `geometry_msgs/msg/Twist` | R10 |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor |\n| 토픽 발행 | `head_pan/coverage` | `std_msgs/msg/String` | R10; `update_period_s` 기본 0.2초 |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n## pan_motion_gate\n\n실행 파일: `pan_motion_gate`. 원본: [pan_motion_gate_node.py](../cleany_navigation/pan_motion_gate_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `nav2/cmd_vel` | `geometry_msgs/msg/Twist` | R10; `command_topic` |\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `joint_states_topic` |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic` |\n| 토픽 구독 | `camera/head/depth/points` | `sensor_msgs/msg/PointCloud2` | Sensor; `depth_topic` |\n| 토픽 발행 | `pan_ready/cmd_vel` | `geometry_msgs/msg/Twist` | R10; `output_topic` |\n| 토픽 발행 | `head_pan/command` | `std_msgs/msg/Float64` | R10; `pan_command_topic` |\n| 토픽 발행 | `head_pan/state` | `std_msgs/msg/String` | R10; `state_topic` |\n\n`observation_only=true`에서는 속도 출력 publisher와 odom/depth 구독을 생성하지 않습니다. Update 주기는 `update_period_s` 기본 0.05초입니다. TF listener는 없습니다.\n\n## reactive_guard\n\n실행 파일: `reactive_guard`. 원본: [reactive_guard_node.py](../cleany_navigation/reactive_guard_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `safety_2d/cmd_vel` | `geometry_msgs/msg/Twist` | R1; `command_topic` |\n| 토픽 구독 | `nav2/cmd_vel` | `geometry_msgs/msg/Twist` | R1; `raw_command_topic` |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic` |\n| 토픽 구독 | `scan` | `sensor_msgs/msg/LaserScan` | Sensor; `scan_topic` |\n| 토픽 구독 | `camera/head/depth/points` | `sensor_msgs/msg/PointCloud2` | Sensor; `depth_topic` |\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `joint_states_topic`, `require_pan_feedback=true` |\n| 토픽 발행 | `cmd_vel` | `geometry_msgs/msg/Twist` | R1; `output_topic` |\n| 토픽 발행 | `reactive_guard/state` | `std_msgs/msg/String` | R10 |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n선택 실행 경로입니다. Full voxel 경로의 최종 publisher와 중복 실행하지 않습니다. Update 주기는 `update_period_s` 기본 0.05초입니다.\n\n## obstacle_memory\n\n실행 파일: `obstacle_memory`. 원본: [obstacle_memory_node.py](../cleany_navigation/obstacle_memory_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `map` | `nav_msgs/msg/OccupancyGrid` | R/T1; `map_topic` |\n| 토픽 구독 | `scan` | `sensor_msgs/msg/LaserScan` | Sensor; `scan_topic` |\n| 토픽 구독 | `camera/head/depth/points` | `sensor_msgs/msg/PointCloud2` | Sensor; `depth_topic` |\n| 토픽 발행 | `obstacle_memory/grid` | `nav_msgs/msg/OccupancyGrid` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/lidar` | `nav_msgs/msg/OccupancyGrid` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/depth` | `nav_msgs/msg/OccupancyGrid` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/navigation_grid` | `nav_msgs/msg/OccupancyGrid` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/voxels` | `sensor_msgs/msg/PointCloud2` | R/T1; `world_publish_period` |\n| 토픽 발행 | `obstacle_memory/local_voxels` | `sensor_msgs/msg/PointCloud2` | R/T1; memory update 시 |\n| 토픽 발행 | `obstacle_memory/voxel_status` | `std_msgs/msg/String` | R/T1 |\n| 서비스 제공 | `obstacle_memory/save` | `std_srvs/srv/Trigger` | Service 기본값 |\n| 서비스 제공 | `obstacle_memory/set_enabled` | `std_srvs/srv/SetBool` | Service 기본값 |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\nUpdate 주기는 `update_period` 기본 0.5초이며, 출력별 실제 발행은 변경 여부와 별도 주기 설정에 따라 달라집니다.\n\n## voxel_guard\n\n실행 파일: `voxel_guard`. 원본: [voxel_guard_node.py](../cleany_navigation/voxel_guard_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `safety_2d/cmd_vel` | `geometry_msgs/msg/Twist` | R10; `command_topic` |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic` |\n| 토픽 구독 | `obstacle_memory/voxels` | `sensor_msgs/msg/PointCloud2` | R/T1; `voxel_topic` |\n| 토픽 구독 | `obstacle_memory/voxel_status` | `std_msgs/msg/String` | R/T1; `status_topic` |\n| 토픽 발행 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10; `output_topic` |\n| 토픽 발행 | `body_guard_3d/state` | `std_msgs/msg/String` | R/T1 |\n| 토픽 발행 | `body_guard_3d/risk_voxels` | `sensor_msgs/msg/PointCloud2` | R/T1 |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n충돌 검사와 속도 출력 주기는 `update_period_s` 기본 0.10초(10Hz)입니다. 기존 Collision Monitor와\nToF의 주기는 별도로 유지합니다. 이름 외에도 body 프로필과 안전 설정이 필요합니다.\n\n## nav2_bt_trace\n\n실행 파일: `nav2_bt_trace`. 원본: [bt_trace_node.py](../cleany_navigation/bt_trace_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `behavior_tree_log` | `nav2_msgs/msg/BehaviorTreeLog` | R10; `log_topic` |\n| 토픽 구독 | `bt_navigator/transition_event` | `lifecycle_msgs/msg/TransitionEvent` | R10; `navigator` + suffix |\n| 토픽 구독 | `navigate_to_pose/_action/status` | `action_msgs/msg/GoalStatusArray` | R/T1; `action` + suffix |\n| 토픽 발행 | `navigation/bt_trace` | `std_msgs/msg/String` | R/T1; 입력 이벤트 처리 시, `output_topic` |\n\n시작할 때 `manifest_file`과 `xml_file`을 검증합니다.\n\n## 매핑 세션 상태\n\n`mapping/status`의 `error_code`, `error_file`은 마지막 작업 실패의 단계 코드와\n진단 JSON 경로입니다. 오류가 없으면 빈 문자열이며 새 작업 접수 시 초기화됩니다.\n`output`은 시작 준비 단계부터 제공되고, `generation`은 성공한 시작 횟수만 나타냅니다.\n\n## nav2_lifecycle_recovery\n\n실행 파일: `nav2_lifecycle_recovery`. 원본: [lifecycle_recovery_node.py](../cleany_navigation/lifecycle_recovery_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 액션 제공 | `navigation/recover` | `cleany_interfaces/action/RecoverComponent` | Action 기본값; `actions` |\n| 액션 제공 | `localization/recover` | `cleany_interfaces/action/RecoverComponent` | Action 기본값; `actions` |\n| 서비스 호출 | `lifecycle_manager_navigation/manage_nodes` | `nav2_msgs/srv/ManageLifecycleNodes` | Service 기본값; `lifecycle_managers`, `call_timeout_s` 10초 |\n| 서비스 호출 | `lifecycle_manager_localization/manage_nodes` | `nav2_msgs/srv/ManageLifecycleNodes` | Service 기본값; `lifecycle_managers` |\n\n```mermaid\nsequenceDiagram\n    participant S as Supervisor\n    participant R as nav2_lifecycle_recovery\n    participant M as Lifecycle manager\n    S->>R: RecoverComponent\n    R->>M: RESET\n    R->>M: STARTUP\n    M-->>R: Manager 결과\n    R-->>S: Action 결과\n    S->>S: fresh lifecycle / localization health 재검증\n```\n\n| 경계 | 계약 |\n|---|---|\n| 동시성 | 모든 Action을 통틀어 goal 하나 |\n| Cancel | 단계 사이에서 적용 |\n| 성공 의미 | Manager 성공 응답; 실제 복구는 Supervisor의 fresh health 확인 |\n| 제외 | lifecycle_manager_safety의 collision_monitor와 Nav2 BT recovery |\n| 미검증 | 실제 stack RESET 뒤 AMCL 초기 pose와 지도 상태 |\n\n## ToF를 활성화한 명령 경로\n\n```mermaid\nflowchart LR\n    Nav[\"nav2/cmd_vel\"] --> Desk[\"desk_approach / 명령 선택\"]\n    Desk --> Motion[\"motion/cmd_vel / 기존 안전 계층\"]\n    Motion --> Proximity[\"proximity/input\"]\n    Proximity --> Guard[\"proximity_guard\"]\n    Guard --> Final[\"cmd_vel / 유일한 최종 publisher\"]\n```\n\n| 설정 / 경로 | 동작 |\n|---|---|\n| 활성 | `navigation.launch.py tof_enabled:=true` |\n| depth_coverage | 선택 명령으로 remap; 원래 observer 설정 유지 |\n| ToF | RGB-D coverage 요구나 observer 강제 활성 없음 |\n| 기존 Nav2 / recovery | 같은 선택 명령 경로 사용 |\n\n[ToF 계약](../../cleany_tof/docs/interfaces.md)을 따릅니다.\n\n| 병행 지도 확장 | 계약 |\n|---|---|\n| 도구 | tools/validation/map_extension/extend.py |\n| 서비스 | /map_extension 아래 start_trajectory, finish_trajectory, write_state, get_trajectory_states |\n| 실물 입력 | /scan, /odom |\n| 출력 | /map_extension/map, /map_extension/tracked_pose |\n| TF | publish_to_tf=false로 기존 AMCL 소유 유지 |\n\n### 슬립 관측의 분석 문맥\n\n| context 필드 | 기록 기준 |\n|---|---|\n| 생성 | 새 관측 창마다 고정; heartbeat에서 갱신 안 함 |\n| pose / 좌표계 | at=t1의 map→base_link TF, `[x,y,yaw]`; 비교 창 끝점이며 실제 슬립 시작 접촉점 아님 |\n| TF 없음 | pose=null, historical_transform_unavailable; 최신 TF 대체 금지 |\n| map_revision | 문맥 생성 시 지도의 좌표계 / geometry / cells SHA-256 |\n| commands.requested / output | 기본 nav2/cmd_vel / cmd_vel의 velocity, received_at, age_s, topic, reason |\n| 명령 시간 | Header 없는 Twist이므로 ros_receive_time; t1 이전 마지막 수신값 |\n| 최대 나이 | command_context_max_age_s=0.3; 오래되거나 없으면 null, 미래 값 사용 금지 |\n| 이력 | 출처별 4 s / 최대 512개 |\n| 이름 설정 | requested_command_topic, output_command_topic, map_topic, map_frame |\n\n이 문맥은 분석용이며 감지 판정이나 BT 입력이 아닙니다. Logger는 slip 5 Hz, traction_recovery 수신 이벤트를 기존 CDR bag과 용량·보존 정책으로 기록합니다.\n\n## depth_obstacles_preview\n\n\u003cfigure class=\"contract-figure\" data-visual-id=\"depth-mask\">\n\u003cimg src=\"assets/depth-mask.png\" alt=\"D435 preview의 고정 자기 필터는 어떤 부피를 덮나?\" loading=\"lazy\">\n\u003cfigcaption>현재 d435_fixed_body_boxes.json의 고정 AABB를 측면(XZ, 위)과 전면(YZ, 아래)으로 투영했습니다. 움직이는 팔은 포함하지 않습니다. 이 그림은 D435 preview의 고정 자기 필터이고 전체 3D 안전 모델이 아닙니다. \u003ca href=\"../../../../docs/assets/visuals/generated.json\">입력과 출처\u003c/a>\u003c/figcaption>\n\u003c/figure>\n\n실행 파일 `depth_obstacles_preview`는 촬영 시점 pan/tilt TF로 깊이 점을\n`base_link`로 변환하는 미리보기 노드입니다. costmap, clearing, 주행 명령은 발행하지 않습니다.\n\n| 방향 | 토픽 | 타입 | 의미 |\n|---|---|---|---|\n| 구독 | `/camera/d435/depth/image_rect_raw` | sensor_msgs/Image | rectified 깊이 |\n| 구독 | `/camera/d435/depth/camera_info` | sensor_msgs/CameraInfo | 깊이 내부 파라미터 |\n| 구독 | `/scan_raw` | sensor_msgs/LaserScan | CAD 높이의 LiDAR 표시 |\n| 발행 | `/perception/depth/measured_points` | sensor_msgs/PointCloud2 | 원본 변환 점 |\n| 발행 | `/perception/depth/obstacle_points` | sensor_msgs/PointCloud2 | 높이, 고정 차체, 고립점 필터 결과 |\n| 발행 | `/perception/depth/ground_points` | sensor_msgs/PointCloud2 | 관측 바닥면 주변 진단용 점 |\n| 발행 | `/perception/lidar/cad_points` | sensor_msgs/PointCloud2 | LiDAR 별도 표시 |\n| 발행 | `/perception/depth/filter_status` | std_msgs/String | 유효성, 개수, `min_base_z` JSON |\n\n| 미리보기 조건 | 처리 |\n|---|---|\n| QoS | 센서 / 점군 SensorData, 상태 Reliable depth 10 |\n| 신선도 | 촬영 TF 없음 또는 0.5 s 유효 입력 없음 → 화면 비우기; 원본 stamp 유지 |\n| filter_file의 min_base_z | 지정 시 base_link 고정 z 하한(m), 미지정 시 바닥 상대 min_height |\n| max_height / floor | 상한은 관측 바닥 기준, floor는 진단 grid에도 사용 |\n| body_boxes_file | 고정 CAD ray self-mask; 자세 미상의 가동 팔 제외 |\n| Static TF | d435_ground_preview, lidar_cad_preview 발행; 기존 lidar_link 유지 |\n"},"ros2_ws/src/cleany_navigation/docs/localization.md":{"title":"위치 정합과 정지 상태 복구","body":"# 위치 정합과 정지 상태 복구\n\n`localization_guard`는 LiDAR scan과 지도의 정합을 검사합니다. 검증된 위치가 가볍게 어긋나면 감속하고, 위치를 신뢰할 수 없으면 주행을 막습니다. 자동 복구는 **로봇을 정지시킨 상태에서 AMCL 초기 위치만 갱신**합니다.\n\n## 상태별 주행 허가\n\n```mermaid\nstateDiagram-v2\n    [*] --> unknown\n    unknown --> available: 1 s 정상\n    unknown --> unavailable: 정합 실패 지속\n    available --> degraded: 가벼운 불일치\n    degraded --> available: 1 s 정상\n    degraded --> unavailable: 정지 조건\n    unavailable --> available: 1 s 정상\n```\n\n어느 상태에서든 입력 무효, 공분산 미검증 또는 새 초기 위치는 `unknown`으로 전환합니다.\n\n\n| 상태 | 의미 | 주행 처리 |\n|---|---|---|\n| `unknown` | 초기 위치 / 공분산 미검증 또는 센서 / TF 입력 무효 | 허용하지 않음 |\n| `available` | 새 관측으로 1 s 연속 정상 확인 | 다른 안전 조건도 충족하면 허용 |\n| `degraded` | 검증된 위치의 가벼운 불일치, AMCL 보정 대기 | 기존 목표와 허가 유지, 정상 속도의 30% 요청 |\n| `unavailable` | 정합 실패 지속 | 정지와 허가 회수 |\n\n정상으로 복귀해도 **이미 취소된 목표는 자동 재개하지 않습니다.** 반복 heartbeat는 정상 확인 시간을 늘리지 않습니다.\n\n## Scan과 지도 비교\n\n```mermaid\nflowchart LR\n    Scan[\"scan 시각의 base pose\"] --> Project[\"레이저 끝점을 지도에 투영\"]\n    Project --> Distance[\"점유 셀까지 거리 계산\"]\n    Distance --> Ratio[\"15 cm 이내 끝점 비율\"]\n    Distance --> Mean[\"상위 25% 잔차 제외 평균\"]\n    Ratio --> Judge[\"공분산 / 입력 신선도와 함께 판정\"]\n    Mean --> Judge\n```\n\n지도 밖과 미확인 영역의 끝점은 일치로 세지 않습니다. 평균에서 제외한 상위 25%도 일치율의 분모에는 남깁니다. 공분산이 작아도 이 지도 정합 검사를 생략하지 않습니다.\n\n[localization_guard.yaml](../config/localization_guard.yaml)의 값은 시연용 초기 기준입니다. 지도 품질과 실제 바닥에서 추가 검증이 필요합니다.\n\n| 정상 판정 항목 | 조건 |\n|---|---|\n| 유효 끝점 | 최소 60개 |\n| 일치율 | 15 cm 이내 끝점이 30% 이상 |\n| 절사 평균 잔차 | 18 cm 이하 |\n| 정상 지속 | 새 관측으로 1 s 연속 |\n| 공분산 | 비유한 값, 설정 상한 초과, 허용 범위 밖 음수는 정상 근거로 사용하지 않음 |\n| 공분산 수치 오차 | −1e−9 이내 음수는 0으로 해석 |\n\n\u003cfigure class=\"contract-figure\" data-visual-id=\"alignment\">\n\u003cimg src=\"assets/alignment.png\" alt=\"같은 scan도 pose가 틀리면 지도 정합이 어떻게 달라지나?\" loading=\"lazy\">\n\u003cfigcaption>기존 단위 테스트의 같은 지도와 scan을 정상 pose(위), 잘못된 pose(아래)로 투영했습니다. 검정은 점유 셀, 주황은 scan 끝점입니다. 실제 bag이나 복구 성능 측정이 아닌 합성 fixture 예시입니다. \u003ca href=\"../../../../docs/assets/visuals/generated.json\">입력과 출처\u003c/a>\u003c/figcaption>\n\u003c/figure>\n\n## 감속 유지와 정지 시점\n\n| degraded에서 관측된 조건 | 처리 |\n|---|---|\n| 최고 기록보다 평균 오차 2 cm 감소 **또는** 일치율 5%p 증가 | 개선 시각 갱신 |\n| 정상 기준을 만족하는 새 관측 | 개선 시각 갱신; 1 s 연속 확인 전까지 감속 유지 |\n| 4 s 동안 개선 없음 | `unavailable`, 정지 |\n| 불일치 총 8 s 도달 | `unavailable`, 정지; 짧은 정상 관측으로 한도 초기화 안 함 |\n| 일치율 \u003c 10% **동시에** 평균 오차 > 35 cm, 0.8 s 지속 | 먼저 정지 |\n| 잘못된 공분산, 큰 불확실성 또는 입력 단절 | 위 대기 시간을 주지 않고 주행 차단 |\n\n| 속도 제한 전달 | 동작 |\n|---|---|\n| 요청 비율 | 정상 상한의 30%: 현재 병진 0.15 m/s, 회전 0.21 rad/s |\n| 다른 상한과 관계 | 더 낮은 장애물 / 도착 상한 우선 |\n| 소비자 | MPPI와 Collision Monitor가 `navigation/localization_speed_limit` 공유 |\n| Monitor 제한 하강 | 초당 30%p |\n| 정상 복귀 | MPPI의 기존 가속도 제한으로 회복 |\n| 제한 메시지 0.6 s 단절 또는 0% 수신 | Monitor 즉시 0 출력 |\n\n## 정지 상태의 자동 복구\n\n아래는 후보 검사를 통과한 경우의 순서입니다. 거부와 중단 조건은 아래 표를 따릅니다.\n\n```mermaid\nsequenceDiagram\n    participant S as Supervisor\n    participant B as Base / 기존 목표\n    participant G as Localization guard\n    participant A as AMCL\n    S->>B: 위치 정합 Fault로 허가 회수\n    B-->>S: 이전 목표 정지 확인 / base_disarmed 안정\n    S->>G: localization/recover 요청\n    G->>G: 현재 pose 주변 후보 탐색\n    G->>G: 학습 / 검증 빔 분리, 후보 유일성 검사\n    G->>G: 다음 신선한 scan으로 재검사\n    G->>A: 검사 통과 시 initialpose 발행\n    A-->>G: 새 pose와 scan 정합\n    G-->>S: 1.5초 정상 정합 후 성공\n    S->>S: 신선한 health 재확인\n    Note over S,B: 이전 목표 자동 재개 없음\n```\n\n| 복구 검사 | 통과 조건 |\n|---|---|\n| 탐색 범위 | 현재 pose 주변 반경 0.8 m, yaw ±0.7 rad |\n| 일치율 | 50% 이상 |\n| 정합 개선 | 기존 절사 평균보다 4 cm 이상 개선 |\n| 공분산만 높은 경우 | 기존 정합이 정상이면 개선량 대신 엄격한 일치율과 후보 유일성 검사 |\n| 모호한 후보 거부 | 30 cm 또는 0.2 rad 이상 다른 후보와 점수 차이 \u003c 2.5 cm |\n| 적용 후 검증 | AMCL의 새 pose에서 1.5 s 정상 정합 |\n| 재시도 | 총 2회; 실패하면 새 자동 주행 계속 차단 |\n\n큰 공분산은 이동 허가를 막지만 유효한 scan과 TF를 이용한 복구 탐색까지 막지는 않습니다. 정지 중 미확인 상태 또는 복구 검증 중에는 0.5 s 간격으로 AMCL no-motion update를 요청합니다.\n\n| 중단 또는 실패 상황 | 후속 처리 |\n|---|---|\n| 수동 initialpose, 지도 교체, base 움직임, 입력 중단, 취소 | 진행 중인 후보 적용 중단 |\n| 큰 위치 오차 또는 반복 구조로 후보 모호 | 수동 초기 위치 설정 필요 |\n| 회차별 판정 확인 | `localization_evidence_directory`의 지도, scan, seed와 판정 근거 확인 |\n\n복구는 휠을 움직이거나 지도를 수정하지 않습니다. 저장 결과는 물리 E-stop 또는 전신 보호의 증거가 아닙니다. 통신 규격은 [인터페이스](interfaces.md), 주행 설정은 [계획과 제어](planning.md)를 따릅니다.\n"},"ros2_ws/src/cleany_navigation/docs/mapping.md":{"title":"실물 매핑 세션","body":"# 실물 매핑 세션\n\n```mermaid\nflowchart LR\n  Request[\"mapping/control 요청\"] --> Stop[\"입력 차단 / STOP 확인\"]\n  Stop --> Save[\"기존 지도 저장 / 기록 종료\"]\n  Save --> Operation{\"요청 종류\"}\n  Operation -->|reset| Ready[\"입력 준비 / 새 세션 시작\"]\n  Operation -->|stop| Done[\"세션 종료\"]\n  Ready --> Status[\"mapping/status / 준비 결과\"]\n```\n\n[실행 가이드](../../../../docs/implementation/how-to/mapping.md) · [하드웨어 프로필](../../cleany_bringup/docs/hardware-mapping.md)\n\n`mapping_scan_filter`는 `scan_raw` 원본을 보존하고 base 전방 180도 중 0.30m 초과 값을\n`scan`으로 발행합니다. 후방과 가까운 finite 값은 NaN이며 clearing ray로 바꾸지 않습니다.\n센서 yaw를 이용해 전방을 센서 좌표로 변환합니다.\n\n`mapping_session`은 지도 세션과 Cartographer, Logger 자식 프로세스를 소유합니다.\n센서와 구동, 조종 프로세스는 외부에서 제공하며 지도 초기화로 재시작하지 않습니다. 해당 프로세스의 실행 수명은 [하드웨어 구성](../../cleany_bringup/docs/hardware-mapping.md)이 관리합니다.\n\n기록 디렉터리에 `recording-settings.json`이 있으면 Logger가 복원한 기록 정책을\n지도 초기화 후에도 유지합니다. 저장된 정책이 없는 첫 실행에서만 매핑용 기본 토픽과\n주기를 설정합니다. 따라서 초기화가 사용자의 기록 제외나 Hz 설정을 덮어쓰지 않습니다.\n\n| ROS endpoint | 타입 | 계약 |\n|---|---|---|\n| `mapping/control` | `MappingControl` 서비스 | reset 또는 stop 접수. request_id와 operation 조합으로 수명 내 중복 제거 |\n| `mapping/status` | `MappingStatus` | Reliable transient local depth 1. phase, generation, output과 이전 output |\n| `teleop/status` | `TeleopStatus` 구독 | 정지 확인은 fresh connected, paused, disabled, stop_confirmed 모두 필요 |\n| `teleop/pause` | `SetBool` client | 초기화와 종료 전 입력 차단. 준비 완료 뒤 차단만 해제 |\n| `wheel_odometry/reset` | `Trigger` client | 이전 SLAM 종료와 STOP 확인 후 오도메트리 원점 재설정 |\n| `write_state` | Cartographer `WriteState` client | 최종 pbstream 파일과 code=0 응답 모두 확인 |\n| `/cleany_logger/*` | `RecordingControl` client | 자신이 시작한 session ID만 정지 |\n\n상태는 idle, queued, stopping, waiting_usb, starting, running, failed입니다.\nwaiting_usb는 장치 파일만 검사하지 않고 실제 scan과 fresh MCU 연결을 기다립니다.\n새 세션은 scan 시각의 `map -> sensor` TF, fresh odom과 새 map을 확인해야 running이 됩니다.\n\n초기화 순서는 입력 차단과 STOP 확인, 이전 지도/pbstream 저장, Logger flush, 이전 SLAM 종료,\nodom reset, 새 Logger와 SLAM 시작입니다. 저장 실패와 남은 자식은 다음 시작을 차단합니다.\nESP32 연결 자체가 사라지면 STOP 미확인을 상태에 남기고 재연결을 기다립니다.\n\n`map.yaml`은 실제 origin yaw와 immutable PGM을 참조합니다. 현재 지도 사본 `map.pgm`,\n`latest.pbstream`, 선택 설정과 출처를 담은 `session.json`, Logger session을 가리키는\n`recording.json`, 종료 결과를 세션별로 보존합니다. 기존 세션 디렉터리를 덮어쓰지 않습니다.\nMap YAML과 이미지는 임시 파일과 원자적 교체로 갱신합니다.\n\n이 매핑 세션의 Cartographer는 `map → odom`을 소유합니다. 외부 입력은\n`odom → base_link`와 센서 장착 TF를 제공해야 하며, 각 변환의 발행자는 하나여야 합니다.\n같은 `map → odom`을 발행하는 AMCL이나 다른 SLAM은 동시에 실행하지 않습니다.\n일반 Cartographer launch는 유지하고 실물 경로는 `cartographer_hardware_2d.lua`를 선택합니다.\n\n## 실패 진단\n\n매핑 관리자는 시작 전에 `MappingStatus.output`을 설정하므로 준비 중 실패해도\nCartographer와 Logger 로그의 세션 디렉터리를 찾을 수 있습니다. `generation`은 정상 시작이\n완료됐을 때만 증가합니다.\n\n| 실패 정보 | 보존 / 갱신 |\n|---|---|\n| error_code | 단계별 `MAPPING_\u003cPHASE>_FAILED` |\n| error_file | `output_root/errors/\u003coperation_id>.json` |\n| JSON 내용 | UTC / 요청·작업 ID / 세션 경로 / 당시 상태 / 예외 타입 / 전체 traceback |\n| 시작과 정리 모두 실패 | 두 예외 함께 보존 |\n| 진단 저장 실패 | Stderr traceback, runtime/mapping.log 확인 |\n| 새 요청 | 현재 오류 필드 초기화, 이전 파일 유지 |\n| 실행 자식 종료 | Cartographer / Logger 구분, 종료 코드와 로그 경로 |\n\n하드웨어 프로필의 `recording_limit_mib`는 최초 세션 정책과 Logger 시작 한도를, `recording_total_limit_mib`는 보존된 전체 기록의 총량 한도를 설정합니다. 저장된 `recording-settings.json`이 있으면 세션 한도는 저장된 정책을 우선합니다. 총량 한도는 세션 한도 이상이어야 하며, 프로필 변경은 런타임을 다음에 시작할 때 적용합니다.\n\nLiDAR 주행 구성은 `lidar_self_mask_cad.yaml`의 고정 기둥 직사각형을 base_link 좌표로 제외합니다. CAD -Y를 base +X, CAD +X를 base +Y로 변환하고 기둥 외곽에 15mm 여유를 둡니다. 360도 매핑 원본 `/scan_raw`는 변경하지 않으며, 일반 매핑 실행에는 이 마스크를 자동 적용하지 않습니다.\n"},"ros2_ws/src/cleany_navigation/docs/planning.md":{"title":"경로 계획과 주행 제어","body":"# 경로 계획과 주행 제어\n\n전역 planner는 지나갈 경로를 찾고, MPPI는 그 경로를 따라갈 속도를 선택합니다. 실제 출력은 [안전 경로](safety.md)의 제한을 추가로 받습니다. 실행 방법은 [주행 가이드](../../../../docs/implementation/how-to/phone-navigation.md)를 따릅니다.\n\n## 프로필 선택\n\n| 실행 | 전역 planner / primitive | 제어 모델 | 이동 방식 |\n|---|---|---|---|\n| Omni 저속 튜닝 / 일반 AMCL | Smac Lattice / `omni-r10cm.json` | MPPI Omni | 전후, 횡이동, 회전 |\n| 전후진 전용 / 명시적 `longitudinal` | StraightFirst → 필요 시 Lattice / 직진과 제자리 회전 | MPPI DiffDrive | 횡이동 없이 직진과 회전 |\n| Omni 기본 튜닝 / `omni` | Smac Lattice / `omni-r10cm-balanced.json` | MPPI Omni | 방향별 비용으로 전후, 횡이동, 회전 선택 |\n| 명시적 `axis_motion:=true` | 축 전용 기존 프로필 | DWB | 축 전용 이동 |\n\n`lidar_navigation.launch.py`에는 `robot_params_file`과 기존 안전 센서 입력이 필요합니다. `lidar_navigation.launch.py`, `hardware_mapping.launch.py`, `run-navigation`은 모두 `omni`를 기본으로 사용합니다. `motion_profile:=longitudinal`을 명시하면 StraightFirst와 DiffDrive를 선택합니다. 수동 조종의 횡이동 허용도 같은 선택을 따릅니다. 일반 `navigation.launch.py`는 Omni 저속 튜닝을 사용합니다.\n\n```mermaid\nflowchart TD\n    Goal[\"목표 자세\"] --> Mode{\"이동 방식\"}\n    Mode -->|omni| Smac[\"순정 Smac Lattice\"]\n    Mode -->|longitudinal| Direct{\"전체 footprint로 직선 통과 가능?\"}\n    Direct -->|예| Straight[\"직선 경로\"]\n    Direct -->|아니오| Lattice[\"직진 / 회전 Lattice 탐색\"]\n    Lattice --> Shortcut[\"앞쪽 1 m 연결 검사 / 실패하면 원래 경로\"]\n    Smac --> Omni[\"MPPI Omni / 이동 방향을 비용으로 선택\"]\n    Straight --> Diff[\"MPPI DiffDrive / 경로의 제자리 회전 반영\"]\n    Shortcut --> Diff\n    Omni --> Safety[\"속도 제한과 충돌 감시\"]\n    Diff --> Safety\n```\n\n### 공통 설정과 운용 튜닝\n\n```mermaid\nflowchart LR\n    Common[\"nav2_omni.yaml / 공통 운동 모델과 planner\"] --> Low[\"nav2_omni_low_speed.yaml / Omni 저속 튜닝\"]\n    Common --> Standard[\"nav2_omni_standard.yaml / Omni 기본 튜닝\"]\n    Low --> M[\"일반 navigation / 축별 최대 0.15 m/s\"]\n    Standard --> L[\"LiDAR navigation / 합성 최대 0.5 m/s\"]\n    Long[\"nav2_longitudinal.yaml\"] --> D[\"명시적 전후진 / StraightFirst + DiffDrive\"]\n```\n\n공통 파일과 운용별 차이를 합쳐 적용합니다. `standard`와 `low_speed`는 주행 튜닝 이름이며 센서 종류를 뜻하지 않습니다. 두 튜닝은 속도 외에도 탐색 시간과 비용 설정이 다릅니다. `nav2_omni_standard.yaml`과 `nav2_omni_low_speed.yaml`은 단독 설정 파일이 아닙니다. `lidar_robot.yaml`, `lidar_safety.yaml`은 센서와 로봇의 조건을, `motion_profile`은 이동 방식을 선택합니다. `phone_remote`는 웹 조종기의 이름입니다.\n\n### 외부 설정의 전달 계약\n\n```mermaid\nflowchart LR\n    Base[\"공통 Nav2 설정\"] --> Merge[\"load_navigation_profile / 병합\"]\n    Overlay[\"호출자가 제공한 환경별 차이\"] --> Merge\n    Merge --> Resolved[\"완성된 파라미터 파일\"]\n    Resolved --> Entry[\"Navigation launch / params_file\"]\n```\n\n`load_navigation_profile(base, overlay)`는 같은 plugin의 값을 병합하고, plugin 종류가 달라지면 해당 설정 묶음을 교체합니다. 이전 plugin의 전용 값이 새 plugin에 남지 않게 하기 위한 규칙입니다. 환경별 차이만 담긴 파일은 호출자가 공통 설정과 합친 뒤 `params_file`로 전달합니다. Navigation launch는 전달받은 파일을 읽고 선택한 이동 방식과 안전 설정을 적용합니다.\n\n센서와 구동 연결, 환경별 설정 선택은 호출 패키지가 소유합니다. 실행 순서는 [전역 실행 가이드](../../../../docs/implementation/running.md), 이 패키지가 요구하는 입력은 [안전 계약](safety.md#입력과-tf)을 따릅니다.\n\n`navigation.launch.py`가 안전 센서를 포함한 공통 진입점이며 `amcl_nav2_safety.launch.py`는 같은 인자를 전달하는 호환 이름입니다. 축 이동 구성은 `AxisGenerator`와 `PathHeadingCritic`을 사용합니다. StraightFirst planner의 연속 footprint 검사는 별도 `footprint_sweep` 라이브러리를 사용합니다.\n\n## 기본 튜닝과 전후진 전용 설정\n\n### 클릭한 목표와 실제 도착 판정\n\n```mermaid\nflowchart LR\n    Click[\"클릭한 좌표와 yaw\"] --> Grid[\"5 cm 셀 / 16개 방향으로 양자화\"]\n    Grid --> Preview[\"미리보기 경로의 끝점 / 빨간 목표와 수치 표시\"]\n    Preview -->|사용자가 이동 선택| Navigate[\"표시된 자세로 주행\"]\n    Navigate --> Check[\"도착 검사 / 3 cm와 0.1 rad\"]\n```\n\n`tolerance=0`은 다른 목표 셀로 대체하지 않는다는 뜻입니다. 연속 좌표의 정확한 보존을 뜻하지 않습니다. Controller는 반환된 경로 끝점, 조종기는 표시된 목표를 기준으로 위 허용오차를 검사합니다.\n\n### Omni 전역 계획\n\nOmni 기본 튜닝에는 직선 우선 연결, 고정 방향 XY 탐색, 별도 몸체 방향 탐색이나 거리 기준 방향 선택이 없습니다.\n\n| 설정 | 값 | 역할 |\n|---|---|---|\n| `rotation_penalty` | 5.0 | 제자리 회전 비용 |\n| `reverse_penalty` | 1.2 | 후진 확장 비용 |\n| `non_straight_penalty` / `change_penalty` | 1.2 / 0.05 | 곡선 / 회전 방향 전환 비용 |\n| `cost_penalty` | 2.0 | 장애물 비용장 반영 |\n| `max_planning_time` | 2.0 s | 검색 시간 예산 |\n| `tolerance` | 0.0 m | 다른 목표 셀로 대체하지 않음 |\n| `smooth_path` / analytic expansion 길이 | false / 0 m | Primitive 경로 유지 |\n\n### Omni 지역 제어\n\n[nav2_omni.yaml](../config/nav2_omni.yaml)과 [nav2_omni_standard.yaml](../config/nav2_omni_standard.yaml)을 합쳐 Omni 기본 튜닝을 구성합니다. MPPI는 20 Hz로 동작하며 **60 × 0.05 s 예측 구간에 1,000개 후보**를 평가합니다.\n\n| 샘플 설정 | 값 |\n|---|---|\n| 운동 모델 | `Omni` |\n| X / Y 속도 표준편차 | 각각 0.1 m/s |\n| 회전 속도 표준편차 | 0.2 rad/s |\n| Temperature | 0.1 |\n\n| 비용 항목 | 가중치 | 적용 기준 |\n|---|---|---|\n| PathAlign | 5 | `use_path_orientations=false`: 경로 위치만 평가 |\n| Goal / PathFollow | 40 / 30 | 전환 거리 0.5 m |\n| GoalAngle | 12 | 목표 0.15 m 안에서 최종 방향 평가 |\n| Twirling | 1 | 불필요한 회전 억제 |\n| Cost | 설정 파일 참조 | 목표 0.3 m 안에서는 일반 반발 비용 생략, footprint 충돌 검사는 유지 |\n| PathAngle | 비활성 | 경로 방향 강제 없음 |\n\n몸체 방향은 [방향별 이동 비용](#횡이동과-대각이동의-고정-비용), 장애물과 회전 비용을 함께 평가해 결정합니다. 특정 거리에서 회전→전진→회전을 강제하지 않습니다.\n\n### Longitudinal의 경로 연결과 회전\n\n| 상황 | 처리 | 실패 또는 해제 조건 |\n|---|---|---|\n| 직선 연결 가능 | StraightFirstPlanner가 전체 footprint로 검사 | 불가능하면 Lattice 탐색 |\n| Lattice 경로 앞쪽 1 m | 먼 연결 가능 경로점까지 직진과 필요한 제자리 회전으로 연결 | 연속 footprint sweep 또는 최신 costmap 검사 실패 시 원래 경로 |\n| 선두 경로점 0.075 m 이내, 같은 XY에서 yaw 변화 | 회전 구간 마지막 yaw를 방향 목표로 선택 | 일반 이동 구간은 기존 경로 방위각 평가 |\n| 경로 방향 오차 > 0.1 rad | 후보와 출력의 목표 XY 속도 0 | 가속도 제한 사용 시 먼저 감속, 미사용 시 즉시 XY=0 |\n| 목표 위치 3 cm 이내 | 최종 GoalAngle 비용 우선 | 최종 회전 XY 제한은 2.5 cm에서 시작, 3 cm 밖에서 해제 |\n\n`prefix_shortcut_distance=1.0`은 남은 경로와 최종 자세를 보존합니다. 다른 프로필의 기본값 0은 이 연결 처리를 끕니다. 추가 검색 padding은 0이며 footprint의 기존 5 cm 여유를 검사합니다.\n\n경로 회전은 `PathAngleCritic.respect_in_place_rotations=true`와 `path_rotate_enabled`로 제어합니다. 측정 초기 속도와 감속 이동도 충돌 예측에 포함합니다. Omni는 이 강제 회전 단계를 사용하지 않습니다.\n\n## Omni 주행 연속성\n\n### 공간과 속도 상한\n\n| 영역 또는 조건 | 병진 합성 속도 상한 | 회전 상한 |\n|---|---|---|\n| 정상 | 0.5 m/s | 0.7 rad/s |\n| 주황 영역: 바퀴 외곽 사방 0.16 m | 0.16 m/s | 0.3 rad/s |\n| 목표점 0.2 m 이내 | 목표 상한 0.06 m/s | 목표 상한 0.15 rad/s |\n| 위치 정합 degraded | 0.15 m/s | 0.21 rad/s |\n| 빨간 영역, 정지 조건 | 0 | 0 |\n\n병진은 `hypot(vx, vy)`입니다. 더 낮은 제한이 우선하고 작은 요청을 키우지 않습니다. Collision Monitor는 경계를 넘는 혼합 Twist 전체를 같은 비율로 줄여 곡률을 유지합니다. 휠 최종 상한 10 rad/s 때문에 병진과 회전을 섞으면 더 느려질 수 있습니다. Longitudinal 속도는 별도 프로필 값을 따릅니다.\n\n| 공간 기준 | 크기 / 여유 | 적용 한계 |\n|---|---|---|\n| CAD 바퀴 포함 하부 외곽 | 0.477 × 0.6548 m | 하부 2D 외곽 |\n| Costmap footprint | 위 외곽 + `footprint_padding=0.05 m` | 카메라와 팔 높이의 3D 검사 아님 |\n| Collision Monitor 정지 사각형 | 0.577 × 0.7548 m | 실측 제동 거리 보증 아님 |\n\n\u003cfigure class=\"contract-figure\" data-visual-id=\"footprint\">\n\u003cimg src=\"assets/footprint.png\" alt=\"2D 바퀴 외곽, stop, slow 경계의 실제 크기는?\" loading=\"lazy\">\n\u003cfigcaption>LiDAR 설정의 바퀴 외곽(녹색), 정지 경계와 padded footprint(빨강), 감속 경계(주황)를 같은 축척으로 그렸습니다. base_link의 X는 전방, Y는 왼쪽입니다. 높이별 3D 보호나 실측 제동 거리를 나타내지 않습니다. \u003ca href=\"../../../../docs/assets/visuals/generated.json\">입력과 출처\u003c/a>\u003c/figcaption>\n\u003c/figure>\n\n### 가감속과 장애물 접근\n\n```mermaid\nflowchart TD\n    Limit[\"장애물 거리 / 목표 거리 / 위치 정합 제한\"] --> Predict[\"MPPI: 미리 감속할 속도 상한 계산\"]\n    Predict --> Accel[\"몸체 축과 네 휠의 가감속 제한\"]\n    Accel --> Monitor[\"Collision Monitor\"]\n    Monitor -->|주황 영역| Scale[\"절대 상한으로 Twist 축소\"]\n    Monitor -->|빨간 영역 또는 입력 단절| Stop[\"즉시 0 / 평활화하지 않음\"]\n```\n\n| 설정 | Omni 기본 튜닝 값 | 의미 |\n|---|---|---|\n| `acceleration_limits` | true | 샘플, 가중 평균, 필터 후 출력, 충돌 회피 대체 후보에 동일 적용 |\n| `ax_max` / `ay_max` / `az_max` | 0.20 / 0.15 m/s² / 0.40 rad/s² | 몸체 축별 대칭 가감속; `ax_min`, `ay_min` 미사용 |\n| `wheel_acceleration_max` | 3 rad/s² | 네 휠 명령의 가감속 제한 |\n| `control_variation_weight` | 1 | 연속 명령 변화 비용 |\n| `path_velocity_weight` | 0 | 직선 구간 횡오차에 대한 별도 벌점 비활성 |\n| `path_rotate_enabled` | false | 경로 회전의 XY 강제 제한 비활성 |\n| `goal_rotate_enter_radius` / `goal_rotate_exit_radius` | 0 / 0 | 도착 회전 단계와 연결된 거리 속도 제한 비활성 |\n\nTwist는 전체를 같은 비율로 보간합니다. 첫 호출이나 0.2 s를 넘는 호출 공백에서는 측정 odom 속도, 연속 호출에서는 직전 출력을 시작점으로 씁니다. 측정 초기 속도는 충돌 예측에 유지합니다. 일반 MPPI 프로필의 가속도 제한 기본값은 false입니다.\n\n| 사전 감속 계산 | 기준 |\n|---|---|\n| 장애물 거리 | 치명적 또는 미관측 costmap 셀과 padded footprint 외접 사각형 사이 거리에서 셀 반대각 차감 |\n| 주황 영역까지 여유 | `proximity_clearance=0.11 m`: 바퀴+5 cm에서 바퀴+16 cm까지 |\n| 감속도와 반응 시간 | 축 / 휠 중 보수적인 감속도, `speed_limit_reaction_time=0.3 s` |\n| 계산 예 | 0.5→0.16 m/s 감속은 주황 경계 약 0.98 m 전부터 시작 |\n| 목표 접근 | 같은 제동 곡선 적용 |\n\n이 거리는 계산값이며 실측 정지 거리 보장이 아닙니다. 낮아진 상한으로의 감속은 가감속 제약을 따르되, 실제 영역의 절대 상한과 갑자기 나타난 장애물의 정지는 Monitor가 적용합니다.\n\n## 횡이동과 대각이동의 고정 비용\n\n`DirectionalMotionCritic`은 body 좌표계 이동 각도 θ에 대해 아래 비용을 이동 거리로 적분합니다. 각 예측점의 거리는 속력 × `model_dt`입니다.\n\n```text\n이동 1 m당 비용 = 1 × sin²(θ) + 20 × sin²(2θ)\n```\n\n| 방향 / 동작 | 비용 (cost/m) | 해석 |\n|---|---|---|\n| 전진 / 후진 | 0 | 방향 비용 없음 |\n| 좌 / 우 횡이동 | 1 | 낮은 추가 비용 |\n| 45° 대각이동 | 20.5 | 높은 추가 비용 |\n| 약 45.36° | 약 20.5031 | 연속 함수의 실제 최대 |\n| 정지 / 제자리 회전 | 추가 비용 없음 | 회전 비용은 다른 critic이 평가 |\n\n전후와 좌우 부호에 대칭입니다. **선호 비용이므로 횡이동 후보를 제거하거나 회전 후 전진을 강제하지 않습니다.** 충돌, 도착, 경로 추종 비용과 함께 평가하며 DiffDrive 복구 controller와 goal checker의 XY 도착 허용오차 안에서는 생략합니다.\n\n| 조정 항목 | 조건 |\n|---|---|\n| `lateral_weight` / `diagonal_weight` | 기본 튜닝 1.0 / 20.0 cost/m; 일반 plugin 기본값은 둘 다 0 |\n| 값 반영 | configure 시 읽음; 변경 후 controller 재구성 필요 |\n| 호환성 | 이전 harmonic-overlap 계산과 같은 수치로 호환되지 않음 |\n| 검증 범위 | 초기 시험값; 실제 바닥 개선은 실물 비교 필요 |\n\n슬립 측정으로 가중치를 자동 변경하지 않습니다. 위치별 위험 지도와 장기 학습은 미구현입니다. SlipRecovery의 감속 정지, 정지 확인, 한 번의 종방향 재시도는 별도 동작입니다.\n\n\u003cfigure class=\"contract-figure\" data-visual-id=\"direction-cost\">\n\u003cimg src=\"assets/direction-cost.png\" alt=\"이동 방향별 비용은 어떤 모양인가?\" loading=\"lazy\">\n\u003cfigcaption>현재 critic 식과 기본 튜닝 가중치로 계산한 1 m당 방향 비용입니다. 전후 0, 횡이동 1, 45°에서 20.5이며 다른 비용과 함께 평가합니다. 실측 슬립이나 주행 성능 그래프가 아닙니다. \u003ca href=\"../../../../docs/assets/visuals/generated.json\">입력과 출처\u003c/a>\u003c/figcaption>\n\u003c/figure>\n\n## 위치 정합과 복구\n\n위치가 불확실하면 감속하거나 주행 허가를 회수합니다. [위치 정합 문서](localization.md)에서 상태 전이, 정지 조건과 정지 상태의 자동 복구 순서를 확인합니다.\n\n| 슬립 복구 설정 | 유지하는 기능 | 실행하지 않는 기능 |\n|---|---|---|\n| Omni `slip_recovery:=false` | slip_monitor와 로그, 기본 Nav2 동작, 위치 정합 복구 | SlipRecovery BT, 종방향 재시도 planner, traction_brake |\n| 슬립 BT 활성 | 충돌 감시 입력 `motion/traction_cmd_vel` | — |\n| 슬립 BT 비활성 | 충돌 감시 입력 `motion/cmd_vel` | — |\n\n## Lattice 파일\n\n| 파일 | 구성 | 용도 |\n|---|---|---|\n| `omni-r10cm.json` | 5 cm 격자, 반경 설정 10 cm, heading 16개, primitive 144개 | 일반 navigation 기본 |\n| `omni-r10cm-balanced.json` | 원본 좌표 / 방향 유지; 오른쪽 횡이동 16개의 길이 메타데이터만 교정 | Omni 기본 튜닝 |\n\n파일은 [config/lattice](../config/lattice)에 있습니다. Launch 기본 경로보다 명시적인 `GridBased.lattice_filepath`가 우선합니다. 원본은 공식 Nav2 1.1.20 Generator로 만들었으며 반경 설정은 실물 최소 회전 반경 측정값이 아닙니다.\n\n\u003cfigure class=\"contract-figure\" data-visual-id=\"lattice\">\n\u003cimg src=\"assets/lattice.png\" alt=\"현재 기본 Lattice의 이동과 회전 후보는?\" loading=\"lazy\">\n\u003cfigcaption>기본 튜닝의 balanced JSON에서 시작 heading 0인 7개 primitive만 표시했습니다. 점은 저장된 pose, 화살표는 마지막 yaw이며 원점의 두 화살표는 제자리 회전입니다. 선은 pose 사이 연결이고 실제 주행 결과가 아닙니다. \u003ca href=\"../../../../docs/assets/visuals/generated.json\">입력과 출처\u003c/a>\u003c/figcaption>\n\u003c/figure>\n\n## MPPI 샘플 초기화\n\n| 시점 / 범위 | 계약 |\n|---|---|\n| 초기화와 reset 반환 전 | 완전한 잡음 묶음 생성 |\n| `regenerate_noises=true` | 이후 묶음을 작업 스레드에서 준비 |\n| reset 잠금 | 설정, 운동 모델과 잡음 배열을 함께 교체 |\n| DiffDrive로 전환 | 횡방향 잡음 0으로 초기화 |\n| Controller별 상태 | 독립 난수 엔진 소유 |\n\n후보가 모두 같아지는 초기 경쟁 상태를 방지하지만 비동기 스케줄의 결정성은 보장하지 않습니다. 충돌 검사, 비용 가중치와 출력 제한은 별도 계약입니다.\n\n커스텀 controller는 `cleany_navigation::MPPIController`, critic은 `cleany_navigation::mppi::critics`로 등록합니다. 소스는 `mppi/src`와 `include/cleany_navigation/mppi`, 원본 설명과 라이선스는 [upstream README](../mppi/README.upstream.md)와 [LICENSE](../mppi/LICENSE.md)에 있습니다.\n"},"ros2_ws/src/cleany_navigation/docs/safety.md":{"title":"Navigation 안전 계약","body":"# Navigation 안전 계약\n\n기본 full runtime은 Nav2 속도를 pan gate, Collision Monitor, voxel guard 순서로 검사합니다. 모든 단계가 기본 활성화이며, 최종 cmd_vel publisher는 voxel guard 하나입니다. 속도는 Twist x/y/yaw를 사용합니다.\n\n```mermaid\nflowchart TB\n    Nav[\"Nav2 / nav2/cmd_vel\"] --> Pan[\"Pan gate / 시야 정렬과 fresh depth\"]\n    Pan -->|\"pan_ready/cmd_vel\"| Collision[\"Collision Monitor / 2D 장애물\"]\n    Collision -->|\"safety_2d/cmd_vel\"| Voxel[\"Voxel guard / 몸체와 제동 sweep\"]\n    Voxel -->|\"cmd_vel / 최종 publisher\"| Base[\"활성 base backend\"]\n    Inputs[\"sensor / odom / TF / localization\"] -. \"freshness와 유효성\" .-> Pan\n    Inputs -.-> Collision\n    Inputs -.-> Voxel\n    Voxel -->|\"필수 입력 단절 / stale / 계산 초과\"| Zero[\"최종 속도 0\"]\n```\n\n## 입력과 TF\n\n| 입력 | 계약 |\n|---|---|\n| scan | LaserScan, LiDAR 좌표계, ROS stamp |\n| odom | child=base_link, 측정 x/y/yaw 속도 |\n| joint_states | head_pan_joint position/velocity, 유효 stamp |\n| Depth image | Rectified 32FC1(m)/16UC1(mm); 0/NaN/-Inf는 관측 없음 |\n| CameraInfo | Image와 동일 크기, optical 좌표계, 유효 K/monocular P, D=0 |\n| Backend TF | odom→base_link, base→LiDAR/head/optical |\n| AMCL TF | map→odom |\n\n## Depth 처리\n\nDepth는 capture stamp의 TF로 변환합니다. TF/calibration이 없으면 cloud를 발행하지 않습니다. 자기 필터는 park 팔, 고정 몸체, 기둥을 통과하는 ray와 레일 뒤 경계 픽셀을 제거합니다. 평행 ray, 표면 접촉, 센서가 몸체 내부인 경우도 보수적으로 판정합니다.\n\n회전 head는 정적 자기 필터 대상이 아니며 가려진 ray를 free-space로 처리하지 않습니다. 기본 margin은 1 mm이며, 실물 보정 오차에 맞춘 별도 검증이 필요합니다.\n\n## Pan과 이동\n\nPan gate는 head_pan/command Float64를 발행하고 TF를 소유하지 않습니다. Backend의 actuator adapter와 실측 feedback이 필요합니다. 같은 방위각의 범위 내 위치 중 현재 pan에 가장 가까운 값을 선택하며 목표를 clipping하지 않습니다.\n\n| 설정 / 모드 | 동작 |\n|---|---|\n| pan_min/max_position_rad | 기본 [-π, π]; 실물 보정 한계 아님 |\n| 자유 이동 | 방향 정렬 + 정렬 이후 fresh depth 확인 |\n| 축 제한 | 정지, settle 추가 확인 |\n| 후진 | 뒤쪽 π rad 정렬, 정지 후 fresh depth; 실물 뒤쪽 시야 검증 필요 |\n| allow_reverse=false | 후진 제외 |\n| 기본 이동 | 전진, 후진, 제자리 회전; 횡이동 차단 |\n| Progress checker | XY 0.15 m 또는 yaw 0.25 rad; 20초간 둘 다 없으면 실패 |\n\n## 차단과 적용 한계\n\nVoxel guard는 몸체 OBB와 예측 제동 sweep를 검사합니다. 요청 속도가 0이어도 측정된 관성 이동은 검사합니다. Pan/voxel은 steady timer를 사용해 `/clock` 중단 중에도 정지 출력을 유지합니다.\n\n| 조건 | 처리 |\n|---|---|\n| Pan 범위 안에 목표 방위각 없음 | PAN_TARGET_OUT_OF_RANGE, 속도 차단 |\n| 필수 입력 단절, stale/future stamp, TF 누락 | 최종 속도 0 |\n| Localization jump, voxel freeze, 계산 초과 | 최종 속도 0 |\n\n몸체 검사는 설정된 park posture를 가정합니다. 실시간 팔 FK 감시, 자세 유지는 미구현이며, 관측하지 않은 공간의 안전을 보장하지 않습니다. 물리 E-stop, driver watchdog, 실측 제동은 로봇 통합에서 별도 검증합니다.\n\n몸체 프로파일의 기본 `model_profile: freecad_calibrated`는 공통 `urdf/cleany.urdf`의\n모터 좌표와 종속 그리퍼 관절을 사용합니다. Gazebo 평가 프로파일은\n`model_profile: jetson_20261009`를 명시해 기존 시뮬레이션 xacro와 같은 형상을 선택합니다.\n`jetson_20261009`는 시뮬레이션 허용 경로에서만 선택할 수 있으며,\n실물 경로에서는 보정되지 않은 모델이나 시뮬레이션 관절 제한을 거부합니다.\n\n## Memory와 진단\n\nGlobal/local costmap은 obstacle_memory/grid를 max 병합합니다. Voxel을 사용하려면 memory가 필요합니다. Pan/memory/voxel을 비활성화하면 그에 맞춰 속도 경로가 바뀝니다.\n\n| 항목 | 위치 / 동작 |\n|---|---|\n| 진단 토픽 | obstacle_memory/{grid,voxels,voxel_status}, body_guard_3d/state, head_pan/state |\n| Memory service | obstacle_memory/save, obstacle_memory/set_enabled |\n| output_directory | 기본 빈 값; 지정 시 로그, snapshot 기록 |\n| Full runtime alias | amcl_nav2_safety.launch.py |\n| 기본 Nav2 실험 | amcl_nav2.launch.py map:=... |\n| 설정 | 패키지 config/의 pan_enabled/memory_enabled/voxel_enabled 등 |\n\n관련 안내: [실행](../../../../docs/implementation/running.md), [테스트](../../../../docs/implementation/testing.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n"},"ros2_ws/src/cleany_perception/docs/interfaces.md":{"title":"인식 인터페이스","body":"# 인식 인터페이스\n\n`inspection_node`의 기존 Action과 토픽은 [런타임 API](runtime.md#ros-api)를 따릅니다.\n\n| 인터페이스 | 변경 계약 |\n|---|---|\n| `perception/check_rgbd` (`std_srvs/srv/Trigger`) | 요청 뒤 수신한 동기 RGB-D의 시각과 기하를 검사. 추론이나 모터 명령 없음 |\n| `DetectedObject2D/3D.label` | 정규화한 최종 종류명. Gemini가 원본 검출 종류를 수정할 수 있음 |\n| `DetectedObject2D/3D.detector_label` | 원본 검출 클래스. 미제공은 빈 문자열 |\n| `DetectedObject2D.median_depth_m` | 유효 깊이의 중앙값, m |\n| `DetectedObject2D.estimated_width_m / estimated_height_m` | 지지면의 두 수평 방향 크기 추정, m. 미측정은 0 |\n| `DetectedObject2D.sorting_reason` | 기존 수거 소비자가 사용하는 모델 분류 사유 유지 |\n\n신뢰도는 검출기의 값이며 Gemini 종류명과 처리 분류의 확률이 아닙니다.\n동의어 설정은 종류명 정규화만 수행하며 수거 허가 정책을 변경하지 않습니다.\n새 필드가 포함된 모든 메시지, Action, Service 소비자는 같은 버전으로 재빌드합니다.\n\n기존 `ObserveWristTarget` 요청의 `detector_label`은 손목 영상의 클래스 대응에\n사용합니다. 빈 값은 `label`로 대체하고, CHECK에서 최종 종류명이나 원본 클래스가\n바뀌면 거절합니다. 손목 상태와 승인 재확인은 아래 별도 인터페이스를 사용합니다.\n\n\n## 기준 물체 재관찰과 예열 알림\n\n| 방향 | 기본 이름 | 타입과 조건 |\n|---|---|---|\n| 서비스 제공 | `perception/observe_object_reference` | `cleany_interfaces/srv/ObserveObjectReference`; `enable_reference_observation=true`일 때 PIN/OBSERVE/CLEAR |\n| 발행 | `/perception/wrist_tracking_status` | `cleany_interfaces/msg/WristTrackingStatus`, depth 10; 손목 관찰 결과 |\n| 서비스 호출 | `/grasp/vlm_warmup` | `std_srvs/srv/SetBool`; `vlm_ik_warmup_service` 기본값 |\n| 서비스 호출 | `/grasp/prepare_window` | `std_srvs/srv/SetBool`; `vlm_anygrasp_prepare_service` 기본값 |\n\n기준 참조는 원래 snapshot/object와 분류를 보존하고 새 RGB-D 관측을 사용한다.\n인식, 추적은 같은 추론 잠금을 공유한다. TTL 만료나 새 관측 실패를 성공으로 대체하지 않는다.\n예열 알림은 `vlm_ik_warmup_enabled=true`에서만 사용하며 서비스 준비를 기다려 인식을 막지 않는다.\n\n## 승인 대상 재확인\n\n`inspection_node`는 `perception/revalidate_target`에\n`cleany_interfaces/srv/RevalidateTarget` 서비스를 제공한다. 원본 snapshot/object와\n추적 session/ID를 확인하고 원본과 `after_stamp_ns`(ns)보다 새 RGB-D 한 장에서 대상을\n측정한다. 원본 캐시, 좌표계나 카메라 보정이 달라지거나 대응 후보가 모호하면 실패한다.\n\n물체 번호는 승인 사진 안에서만 유효하다. 동일 원시 클래스의 bbox가 여러 원본이나 여러 최신 검출과 겹치면 각 최신 후보가 원본 추적 위치와 마스크에 일대일로 대응해야 한다. 거리 한계로 `tracking_maximum_distance_m`, bbox와 마스크의 IoU 하한으로 `reference_minimum_detection_iou`를 사용한다. 승인 track이 사라지거나 대응이 모호하면 실패한다. 응답 한 건은 원본 object/track ID,\n종류명, 처리 분류와 `sorting_reason`을 유지하고 신뢰도, 위치, 크기, 깊이는 최신 값을 쓴다.\nGemini 재분류, 추적 이력 갱신, 참조 고정이나 모터 동작은 수행하지 않는다.\n진단 snapshot은 파지용 캐시에 저장하지 않으며 승인 실행은 원래 snapshot/object를 쓴다.\n인식과 같은 busy lock을 사용하며 실패는 BUSY, RGB-D, MASK, DEPTH, TF, REFERENCE로 구분한다.\n승인 유효 기간과 위치 변화 허용치는 [운영 제어](../../cleany_dev_monitor/docs/interfaces.md#승인-기반-작업-제안)가 검사한다.\n\n## 보정된 헤드 RGB-D\n\n`calibrated_rgbd`는 선택된 `intrinsics_file`의 RGB K와 D로 원본 RGB를\n왜곡 보정한다. SDK 원본 깊이의 보정된 투영행렬과 depth-to-color TF를\n사용해 깊이를 새 RGB K의 픽셀로 투영한다. 겹친 픽셀은 가까운 광학 Z를\n선택하고 미관측 픽셀은 0으로 남긴다. 깊이 센서의 내부 보정을 덮어쓰지 않는다.\n\n| 구분 | 기본 endpoint | 타입 및 규약 |\n|---|---|---|\n| 구독 | `/camera/sdk/color/image_raw` | `sensor_msgs/msg/Image`, 원본 RGB, sensor-data QoS |\n| 구독 | `/camera/raw_depth/image_raw`, `/camera/raw_depth/camera_info` | 원본 rectified depth와 `sensor_msgs/msg/CameraInfo` |\n| TF 구독 | `/tf`, `/tf_static` | SDK의 depth optical에서 color optical로의 변환 |\n| 발행 | `/camera/color/image_raw`, `/camera/color/camera_info` | 왜곡 보정된 `rgb8`, 새 K, D=0 |\n| 발행 | `/camera/depth/image_raw`, `/camera/depth/camera_info` | RGB에 정렬된 `32FC1`, 단위 m, RGB와 같은 K 및 프레임 |\n| 발행 | `/camera/color/image_raw/compressed` | `sensor_msgs/msg/CompressedImage`, JPEG preview |\n| 발행 | `/camera_calibration/rgbd_status` | `std_msgs/msg/String`, 보정 경로, 해시, 원본 시각 차이, 유효 깊이 비율의 JSON |\n\nRGB와 원본 깊이의 시각 차이는 `maximum_pair_skew_s` 이하일 때만 처리한다.\n기본값은 0.025초이며 출력 네 메시지는 RGB 원본 시각을 공유한다. 원본의\n시각 차이는 상태에 남기며, 출력 시각 일치가 하드웨어 동시 촬영을 뜻하지는\n않는다. RGB 해상도가 보정값과 다르거나 깊이 투영행렬이 유효하지 않으면\n처리하지 않는다. `realsense.launch.py`는 `rgb_intrinsics_file`을 우선한다. 설정에 등록된 일련번호와 `serial_no`가 일치하면 패키지에 설치된 보정 파일을 사용한다. 일치하는 설정이 없으면 SDK 보정을 사용한다. 실측 보정 파일을 선택하면 SDK RGB를\n`/camera/sdk/color/*`로 옮기고 SDK 자동 정렬 대신 이 노드를 실행한다.\n\n선택한 물체의 `context_cloud`에는 촬영 시각의 카메라 원점을 점군 좌표계의 미터로 담은 FLOAT32 필드 `vp_x`, `vp_y`, `vp_z`가 있다. 세 값은 한 메시지 안에서 동일하다. XYZ와 RGB는 기존 오프셋을 유지하며 소비자는 `point_step`을 따른다. 원점 필드가 없는 과거 기록도 깊이 기반 파지 입력으로 사용할 수 있다.\n\n## 헤드캠 비식별 영상\n\n`camera_privacy`는 센서 시각과 좌표계를 유지한 BGR 영상을 발행한다.\n\n| 방향 | 기본 토픽 | 타입 | QoS |\n|---|---|---|---|\n| 구독 | `/camera/color/image_raw` | `sensor_msgs/msg/Image`, RGB8 또는 BGR8 | Best effort, volatile, depth 1 |\n| 발행 | `/camera/head/color/image_redacted` | `sensor_msgs/msg/Image`, BGR8 | Best effort, volatile, depth 1 |\n\n검출기는 각 프레임에서 사람, 얼굴, 화면, 문서와 글자 위치를 확인한다. 사람과 민감한 표면을 서로 다른 불투명 색으로 채운다. 화면 검출이 잠시 끊기면 배경의 움직임을 확인한 뒤 최대 0.48초 동안 이전 화면 영역을 보강한다. 구독자가 있을 때 기본 최대 5 Hz로 처리한다. 입력 시각이 오래됐거나 추론이 실패하거나 GPU 잠금을 얻지 못하면 해당 프레임은 발행하지 않는다.\n\n영상에 클라우드 인식을 허용하지 않는 현장 구성에서는 `inspect_scene.launch.py`에 `allow_external_images:=false`를 전달한다. 이 설정에서 Gemini 어댑터를 선택하면 노드가 기동 시 중단된다. 기존 원본 ROS 토픽의 접근 권한은 배포 환경이 관리한다.\n\nGemini 탐지, 파일 업로드, 번호 분류와 Decision API는 기본적으로 비식별 RGB 스냅샷을 사용한다. 시연용 인식 서비스에 `CLEANY_GEMINI_IMAGE_MODE=original`을 지정하면 가리지 않은 스냅샷을 사용한다. 번호 분류에는 선택한 영상의 복사본에 검출 상자와 번호를 그린다. 이 설정의 적용 범위는 Gemini 이미지 요청이다.\n"},"ros2_ws/src/cleany_perception/docs/runtime.md":{"title":"인식 실행과 데이터 흐름","body":"# 인식 실행과 데이터 흐름\n\nHead RGB-D는 물체를 선택하고 3D 형상을 복원합니다. 손목 RGB는 선택된 대상의 일관성을 검사하며 새 3D 위치를 만들지 않습니다.\n\n```mermaid\nsequenceDiagram\n  participant Caller as 조작 caller\n  participant Perception\n  participant Cache as RGB-D / TF cache\n  Caller->>Perception: InspectScene (snapshot 없음, object=0)\n  Perception->>Cache: 동기 RGB-D + 촬영 TF 보존\n  Perception-->>Caller: 번호 / 대표 거리 / snapshot ID\n  Caller->>Perception: InspectScene (같은 snapshot, 선택 object ID)\n  Perception->>Cache: 같은 촬영 입력 조회\n  Perception-->>Caller: instance mask / 지지면 / target frame의 OBB\n  Note over Caller,Cache: 만료된 snapshot은 새 관측으로 자동 대체하지 않음\n```\n\n| 목적 | 절차 |\n|---|---|\n| 처음 실행 | 아래 모델 준비 → 실행 → ROS API |\n| 손목 검증 | [HANDOFF / CHECK](#입력과-손목-관측) |\n| 장애물 지도 입력 | [전체 Depth](#전체-depth-환경-포인트클라우드), [receipt](#필터링-점군-수신-확인) |\n| 새 체크포인트 학습 | [오프라인 학습](#스터디카페-mujoco-전용-yoloe-seg-학습) |\n\n## Decision 분류\n\n`decision_enabled=false`로 시작하면 장면 인식은 로컬 YOLOE 마스크만 사용하고\n처리 분류를 빈 값으로 둔다. 깊이, 크기와 추적 정보는 같은 방식으로 계산한다.\n기본값은 `true`다.\n\nYOLOE가 장면의 instance mask를 찾은 뒤 Decision 분류기가 같은 검출의 의미를\n평가한다. 선택한 종류, 분류, 위험 판단과 검토 사유는 객체별로 연결하고, 승인\n대상 재확인에서는 원래 분류를 유지한다. 종류 후보와 질문의 기본값은\n[decision_prompt.yaml](../config/decision_prompt.yaml)에 있다.\n\n| 설정 | 역할 |\n|---|---|\n| `gemini_model` | 분류 backend 선택 |\n| `decision_prompt_file` | Decision 질문과 선택지 파일 |\n| `decision_object_types` | 물체 종류 선택지 배열 |\n| `yoloe_scene_duplicate_mask_iou` | 장면의 중복 mask 제거 기준 |\n\n실행기에서 `GEMINI_MODEL`을 지정하면 YOLOE 프로파일의 모델 이름보다 우선한다.\n배포 환경에서 해당 API와 모델을 사용할 수 있어야 한다. API 키는 실행 환경의\n`GEMINI_API_KEY`로 전달한다.\n\n## 모델 준비\n\n의존성 설치는 [개발환경](../../../../docs/implementation/development-setup.md)를 따릅니다. YOLOE checkpoint와\n`mobileclip2_b.ts` text encoder는 `CLEANY_MODEL_DIR` 또는 `~/models` 아래에 준비합니다.\n모델은 저장소에 포함하거나 실행 중 자동 다운로드하지 않습니다.\nGemini 분류를 사용하는 `yoloe_gemini`는 `GEMINI_API_KEY` 환경변수가 필요합니다.\n스터디카페 head/손목 전용 체크포인트는 아래 체크포인트 표와 학습 절를 따릅니다.\n\n## 실행\n\nJetson에서는 perception을 `172.30.0.11` 전용 GPU service로 실행합니다. AnyGrasp의 고정\nMAC, license와 checkpoint는 perception container에 mount하지 않습니다. 자세한 절차는\n[`containers/vision`](../../../../containers/vision/README.md)을 따릅니다. 아래 명령은 native\n개발환경용입니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nexport GEMINI_API_KEY=\"\u003cyour-api-key>\"\nros2 launch cleany_perception inspect_scene.launch.py\n```\n\n| 입력 | 형식 |\n|---|---|\n| `camera/color/image_raw` + `camera/color/camera_info` | RGB8 또는 BGR8 |\n| `camera/depth/image_raw` + `camera/depth/camera_info` | 32FC1은 m, 16UC1은 scale parameter 적용 |\n| 네 메시지의 시간 | exact 측정 시각 |\n| RGB / Depth 보정 | 동일 해상도와 intrinsics; 촬영 시각 TF 필수 |\n\n`target_frame ← depth optical frame` TF는 Gemini 요청 전에 확보해 RGB-D/detections와 함께 cache에 저장합니다. 기본 cache는 2개 snapshot, TTL 120초입니다.\n\n\n## ROS API\n\nAction:\n\n```text\nperception/inspect_scene  cleany_interfaces/action/InspectScene\n```\n\n빈 query는 `default_query` parameter를 사용합니다. 1차 요청은 `snapshot_id=''`,\n`selected_object_id=0`이며, 동시에 하나의 goal만 실행합니다. detection이 없으면 빈 2D\ndetection 배열로 성공합니다. 2차 요청은 1차 결과의 두 값을 함께 전달합니다.\n\n```bash\nros2 action list\nros2 action info /perception/inspect_scene\nros2 action send_goal \\\n  /perception/inspect_scene \\\n  cleany_interfaces/action/InspectScene \\\n  \"{query: 'Detect objects on the table.', snapshot_id: '', selected_object_id: 0}\" \\\n  --feedback\n```\n\n2차 요청 예시:\n\n```bash\nros2 action send_goal \\\n  /perception/inspect_scene \\\n  cleany_interfaces/action/InspectScene \\\n  \"{query: '', snapshot_id: 'rgbd-...', selected_object_id: 2}\" \\\n  --feedback\n```\n\n성공 시 같은 snapshot을 다음 topic에도 발행합니다.\n\n- `perception/detections_2d`: 번호가 부여된 `DetectedObject2DArray`\n- `perception/objects`: 후속 선택 단계에서 사용할 `DetectedObject3DArray` topic\n\n| 색상 fixture | 경계 |\n|---|---|\n| 선택 | detector_type=simulation_color, segmenter_type=simulation_color |\n| 계산 | 렌더링 RGB의 빨강 / 파랑 픽셀로 bbox와 mask 생성 |\n| 3D | 운영 경로와 같은 depth / CameraInfo / 촬영 TF; pose나 합성 점 주입 없음 |\n| 용도 | 시뮬레이션 통합 검증 전용, 실제 배포 인식 대체물 아님 |\n\n```bash\nros2 topic echo /perception/detections_2d --once\nros2 topic echo /perception/debug_image_latched --once --field encoding \\\n  --qos-reliability reliable --qos-durability transient_local\n```\n\n### System Supervisor readiness\n\n`perception_inspector`는 `health_topic`(기본 `system/component_health`, 빈 값이면 끔)에\n`health_period_seconds`(0.2초)마다 `source=perception` ComponentHealth를 발행합니다.\n\n| 상태 | 조건 |\n|---|---|\n| UNKNOWN | 지연 로딩 모델이 아직 로드되지 않음(`preload_models:=true`일 때만 readiness 보고), 또는 RGB-D 동기 snapshot 미수신 |\n| UNAVAILABLE | 최신 동기 RGB-D snapshot이 `health_maximum_rgbd_age_seconds`(1.0초)보다 오래됨 |\n| AVAILABLE | 모델 준비 + fresh 동기 RGB-D |\n\ncamera 좌표계 수신만으로 준비를 선언하지 않습니다. Gemini 등 원격 classifier 접근 가능성은\n여기서 확인하지 않으며 요청별 `ERROR_DETECTOR_API`로 보고됩니다.\n\n## 거리 순서와 실패 처리\n\n| 결과 | 처리 |\n|---|---|\n| 유효 depth | bbox 중앙 유효 depth 중앙값 → 촬영 TF → target 원점까지 거리 |\n| 정렬 | 거리 오름차순, confidence 내림차순, detector 원본 순서 |\n| depth 부족 | `distance_valid=false`로 뒤에 배치; 자동 조작에서 제외 |\n| snapshot 만료 / 누락 | 선택 복원 불가; TTL이나 촬영 시각을 갱신하지 않음 |\n| 1차 검출 없음 | 빈 detection 배열로 성공; 물리 작업 완료 의미는 아님 |\n\n`nearest_object_central_bbox_fraction`과 `nearest_object_minimum_depth_pixels`가 배경 혼입과 depth hole을 제한합니다. Snapshot ID는 opaque key입니다.\n\n## 기존 snapshot 조회\n\n`/perception/get_scene_snapshot` (`cleany_interfaces/srv/GetSceneSnapshot`)은\n`snapshot_id`의 캐시된 2D 관측을 읽습니다. `found`, `detections`, `message`를 반환하고,\nTTL과 촬영 시각을 갱신하거나 새 모델 추론을 시작하지 않습니다. 누락/만료는 `found=false`입니다.\n동일 cache를 `InspectScene` 선택 물체 복원에서도 사용합니다.\n\n## 입력과 손목 관측\n\n\u003cfigure class=\"visual-slot\" data-visual-id=\"perception-snapshot\">\n\u003cp>\u003cstrong>시각자료 자리 · 비워 둠\u003c/strong>\u003c/p>\n\u003cfigcaption>\u003cstrong>필요한 자료:\u003c/strong> 같은 capture stamp와 snapshot의 RGB, segmentation, OBB와 유효 depth 점군 비교.\u003cbr>\u003cstrong>빈 이유:\u003c/strong> 기존 이미지를 동일 관측의 mask·depth·모델 설정과 연결할 근거가 부족합니다.\u003c/figcaption>\n\u003c/figure>\n\n`depth_scene_node`의 Depth/CameraInfo 구독은 best-effort KEEP_LAST(1)입니다.\n부하가 높을 때 과거 입력을 순차 처리하지 않고 최신 수신 프레임을 사용합니다.\n촬영 측정 시각와 `maximum_depth_age_sec` 검사는 유지하며 오래된 Depth를\n현재 시각으로 재표기하지 않습니다.\n\n`enable_wrist_observation=true`는 `/perception/observe_wrist_target`를 추가합니다. `yoloe_gemini` + `yoloe_seg` 모드에서는 손목 RGB를 YOLOE-seg로 검증합니다.\n\n| 단계 / 카메라 | 모델 parameter |\n|---|---|\n| 왼손목 HANDOFF | `wrist_yoloe_model_path` |\n| 오른손목 HANDOFF | `wrist_right_yoloe_model_path` |\n| 왼손목 CHECK | `wrist_check_yoloe_model_path` |\n| 왼손목 마우스 CHECK | `wrist_mouse_check_yoloe_model_path` |\n| 오른손목 CHECK | `wrist_right_check_yoloe_model_path` |\n\n빈 경로는 앞 단계 모델을 공유합니다. 모델을 분리하면 메모리도 추가로 사용합니다. 별도 오른손목 CHECK 모델의 클래스 기준은 `wrist_right_check_yoloe_class_confidence_thresholds`이며 빈 목록은 head 기준입니다. Study-cafe 프로필의 오른손목 컵 CHECK 기준은 0.08입니다.\n\n```mermaid\nflowchart LR\n    Expected[\"Head 예상 OBB + 촬영 TF\"] --> Project[\"손목 영상 투영\"]\n    RGB[\"새 손목 RGB / YOLOE-seg\"] --> Check[\"class / box IoU / 단일 대상 / mask 검사\"]\n    Project --> Check\n    Check --> Result[\"HANDOFF 또는 CHECK 결과\"]\n```\n\n각 시점의 새 영상을 독립 검출합니다. 연속 추적은 하지 않으며 같은 위치·mask의 중복 예측만 하나로 취급합니다. 클래스는 Gemini 상세 label에 포함된 YOLOE 클래스를 사용합니다.\n\n추가 검사도 클래스, 투영 box와 mask 조건을 모두 통과해야 합니다. 정상 검출이면 추가 추론하지 않습니다.\n\n| 손목 관측 보존 | 정책 |\n|---|---|\n| 실패 영상 | wrist_failure_image_directory 지정 시 예상 대상 미검출 좌표계만 PNG; 기본 빈 값은 저장 안 함 |\n| 이력 | HANDOFF 뒤 RGB / mask 이력 미보존 |\n| 측정 범위 | RGB-only, 새 3D 위치나 독립 객체 ID 미산출 |\n| 모델 메모리 | 별도 checkpoint마다 추가 사용 |\n\n손목 RGB와 CameraInfo는 exact 측정 시각로 짝지어 처리합니다. 촬영 시점 TF,\n보정값, source/reference ID와 mask 검증 실패는 성공으로 처리하지 않습니다.\n`wrist_*` 매개변수로 freshness/TTL, confidence, 투영 시야와 mask 면적 한계를 설정합니다.\nHANDOFF와 CHECK는 `after_stamp_ns`보다 새로운 촬영 영상을 요구합니다.\n\n| `ObserveWristTarget` 상태 | 의미 / 후속 처리 |\n|---|---|\n| `OK` | 클래스, 투영 box, mask 및 참조 검사 통과 |\n| `NOT_DETECTED`, `success=false` | 정상 새 프레임에 대응 후보 없음. CHECK도 촬영 시각과 reference/source ID 반환 |\n| `ERROR` | 센서/TF/모델 오류, 모호한 후보, 잘못된 mask/confidence. 미검출로 숨기지 않음 |\n\n이미 사용한 CHECK 프레임은 재사용할 수 없습니다. 새 프레임 재시도와 그리퍼 feedback을 통한 진행 여부는 Skill Executor가 결정합니다.\n\n\n## 전체 depth 환경 포인트클라우드\n\n`depth_scene_node`는 검출 bbox나 SAM mask와 무관하게 전체 depth를\n`/perception/scene_cloud` (`PointCloud2`, XYZ, 원본 optical frame/stamp)로\n투영합니다. 환경 물체 pose, 크기, MuJoCo mesh/정답 상태는 읽지 않습니다.\n설정은 `config/depth_scene.yaml`입니다.\n\n| 항목 | 기본값 / 거부 조건 |\n|---|---|\n| 거리 / 샘플링 / 주기 | 0.1–2.0 m / stride 2 / 2 Hz |\n| Depth 시각 | 1초 초과 또는 미래 시각이면 발행하지 않음 |\n| 32FC1 / 16UC1 | m / `depth_16u_scale_m` 기본 0.001 |\n| 무효 depth | 0, NaN, Inf를 표면이나 빈 공간으로 채우지 않음 |\n\ncloud 구독자가 없으면 depth 투영 자체를 건너뛰며, 구독자가 생기면 다음 새 depth부터 발행합니다.\n현재 정렬 실행에서는 MoveIt의 OctoMap 최신성 검증 때문에 장면 cloud를 계속 갱신합니다.\n작업 단계별 생성 중단은 최신성 계약과 함께 재설계해야 하므로 적용하지 않았습니다.\n\n| Depth 입력 | 요구 조건 |\n|---|---|\n| 영상 / 보정 | 정류 depth와 대응 CameraInfo; RGB 정렬 depth면 RGB optical 좌표계 / intrinsics |\n| 거부 | 잔여 왜곡, 좌표계 / 해상도 불일치 |\n| 형식 | 32FC1 m, 16UC1은 depth_16u_scale_m 기본 0.001; endian / row padding 처리 |\n| CameraInfo 재사용 | 같은 보정 / 해상도 유지 전제 |\n\n```bash\nros2 run cleany_perception depth_scene_node --ros-args \\\n  --params-file ros2_ws/src/cleany_perception/config/depth_scene.yaml \\\n  -p depth_image_topic:=/camera/depth/image_rect_raw \\\n  -p depth_info_topic:=/camera/depth/camera_info\n```\n\n이 출력은 RViz 표시와 MoveIt occupancy updater 입력용입니다. 로봇 자체\n표면 제거는 MoveIt의 URDF/TF 기반 self-filter가 담당합니다. 검출되지 않은\n물체도 depth가 관측되면 포함되지만, 가려진 표면은 복원하지 않습니다.\n\n## 필터링 점군 수신 확인\n\n```mermaid\nflowchart LR\n    Depth[\"전체 scene cloud\"] --> MoveIt[\"MoveIt self-filter / OctoMap\"]\n    MoveIt --> Filtered[\"scene_cloud_filtered\"]\n    Filtered --> Relay[\"scene_cloud_receipt_node / 유효한 비어 있지 않은 cloud\"]\n    Relay --> Header[\"원본 Header만 / scene_cloud_receipt\"]\n    Header --> Gate[\"Coordinator capture-age + populated map age 검사\"]\n```\n\n| 계약 | 값 / 처리 |\n|---|---|\n| 입력 | /perception/scene_cloud_filtered, 기본 BEST_EFFORT depth 1 |\n| 출력 | /perception/scene_cloud_receipt, std_msgs/Header, RELIABLE depth 1 |\n| 시각 | 원본 capture stamp; 현재 시각 교체 / timer 재발행 없음 |\n| 손실 / 중단 | Receipt도 중단 |\n| 이름 설정 | filtered_cloud_topic / receipt_topic |\n| 역할 | Coordinator에서 큰 점군 복사 분리; 좌표 / 지도 / mapper 입력은 유지 |\n| 한계 | Receipt만으로 지도 갱신 / 안전 보장 안 함; 기존 capture-age와 populated-map 수신-age 필요 |\n\n센서 전용 파이프라인 launch가 함께 시작합니다.\n\n## 고정 베이스 책상 물체 추적\n\n```mermaid\nflowchart LR\n    Observe[\"새 관찰 성공 / tracking_session_id\"] --> Match[\"같은 종류 + capture TF의 base_link 대표 위치\"]\n    Match --> Unique{\"유일한 양방향 대응?\"}\n    Unique -->|예| Tracked[\"TRACKED / 기존 ID 연결\"]\n    Unique -->|아니오| Uncertain[\"불확실 유지 / 새 ID로 우회하지 않음\"]\n    Missing[\"이전 대상 사라짐\"] --> Keep[\"missing_objects에 마지막 참조 유지\"]\n```\n\n| 항목 | 기준 |\n|---|---|\n| 반환 | position_valid / track_id / tracking_state; RGB header와 representative_frame 구분 |\n| 불확실 | 모호한 위치, 큰 이동, 깊이 실패; 최초 불확실 대상은 빈 track ID 가능 |\n| 빈 장면 | 이전 불확실 대상을 없던 것으로 만들지 않음 |\n| 위치 / 후보 차이 | inspect_scene.yaml: 3 cm / 1 cm |\n| 세션 | 최대 32, TTL 600 s; 재생성 / 만료마다 epoch 변경 |\n| Alias | 컵 별칭→cup, computer/wireless mouse→mouse, lego brick 유지; 종류만 연결하며 분류 결정 안 함 |\n| 베이스 이동 | 호출자가 새 세션 시작 |\n| TF 실패 / 취소 | 추적 갱신 안 함 |\n| Cache 조회 / 선택 복원 | 저장 ID / epoch / TTL 유지 |\n| 빈 session | UNTRACKED |\n\n수치와 alias는 조정 가능한 시뮬레이션 초기값이며 실물 기준이 아닙니다.\n\n## YOLOE-seg 공통 실행 프로필\n\n| 프로필 / 옵션 | 동작 |\n|---|---|\n| config/yoloe_seg.yaml | 로컬 YOLOE instance mask로 선택 객체 분할 |\n| config/yoloe_seg_gemini.yaml | 같은 mask + Gemini label/category/reason; learned_rgbd.launch.py 기본 |\n| `model_profile:=\u003cyaml>` | 명시적 프로필 선택 |\n| enable_wrist_observation:=true | 손목 HANDOFF / CHECK 활성 |\n| preload_models=true | 로컬 파일 / 장치 검사, Action 공개 전 모델 준비 |\n| 로딩 실패 | 다른 detector나 색상 fixture로 자동 대체 안 함 |\n\n```bash\nros2 launch cleany_perception learned_rgbd.launch.py \\\n  model_directory:=/models device:=cuda:0 use_sim_time:=true\n```\n\n카메라와 로봇 driver는 별도로 실행합니다. 기본 입력은 `/camera/color/image_raw`,\n`/camera/color/camera_info`, `/camera/aligned_depth_to_color/image_raw`이며\nRGB-D와 CameraInfo의 크기·좌표계·intrinsics·exact 측정 시각 계약이 필요합니다.\n`auto`는 CUDA/CPU를 선택하고 명시한 CUDA를 사용할 수 없으면 실패합니다.\n\n## 모델 로딩 로그\n\n기본 `INFO` 출력은 모델 로딩 시작과 준비 완료·사용 장치를 알립니다.\n개별 detector 로딩과 모델·text encoder 경로는 `DEBUG`에서 확인합니다.\nMuJoCo 수거·BT launch에서는 `log_level:=debug`, 단독 노드 실행에서는\n`--ros-args --log-level perception_inspector:=debug`로 상세 로그를 켭니다.\n\n깊이 점군과 receipt 노드는 ROS context 종료에 따른 executor 중단과 점군 변환\n중단을 정상 종료로 처리합니다. ROS가 실행 중일 때의 `RuntimeError`는 다시\n발생시켜 실제 변환 실패가 숨겨지지 않게 합니다.\n\n## 검증\n\n```bash\nsource /opt/ros/humble/setup.bash\ncd ros2_ws\ncolcon build --symlink-install --packages-up-to cleany_perception\nsource install/setup.bash\npython3 -m pytest -q src/cleany_perception/test\npython3 -m flake8 src/cleany_perception\ncolcon test --packages-select cleany_perception\ncolcon test-result --verbose\n```\n\n## 스터디카페 MuJoCo 전용 YOLOE-seg 학습\n\n```mermaid\nflowchart LR\n    Scene[\"Study-cafe 위치 / 회전 / 밝기 변형\"] --> Data[\"오프라인 RGB + geom ID 라벨\"]\n    Data --> Train[\"Fine-tune / 별도 seed holdout\"]\n    Train --> Model[\"저장소 밖 checkpoint\"]\n    Model --> Runtime[\"실행 인식 / RGB-D 픽셀과 YOLOE 출력만 사용\"]\n```\n\n`tools/study_cafe_yoloe_dataset.py`는 현재 장면 전용 학습 데이터를 만듭니다. MuJoCo segmentation geom ID는 오프라인 라벨에만 쓰며 실행 인식은 geom ID나 정답 pose를 읽지 않습니다. 생성 데이터와 모델은 외부 모델 디렉터리에 둡니다.\n\n| 생성 단계 | 옵션 / 산출물 |\n|---|---|\n| head 영상 | 물체 위치·회전·밝기 변형 → RGB와 geom ID 기반 offline mask |\n| 손목 영상 | `--camera left_wrist_rgb` 또는 `right_wrist_rgb`, `--joint-positions-json` |\n| 일부만 보이는 장면 | `--allow-partial-objects`; 보이는 물체만 라벨링 |\n| 파지 후 장면 | `--attached-object lego --attachment-site left_grasp_tcp`, `--attachment-jitter-m` |\n| 데이터 결합 | `combine_study_cafe_yoloe_datasets.py --source head=... --source left_wrist=... --source right_wrist=...`; 클래스 순서 확인 후 symlink |\n| 평가 | 학습과 다른 seed의 holdout, head/양손목 각각 평가; 생성 자세 밖 성능 별도 |\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nexport MUJOCO_GL=egl\nexport OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4\npython3 ros2_ws/src/cleany_perception/tools/study_cafe_yoloe_dataset.py \\\n  --output ~/models/yoloe/study_cafe_sim_v1_dataset \\\n  --train-count 64 --val-count 16\npython3 ros2_ws/src/cleany_perception/tools/finetune_study_cafe_yoloe.py \\\n  --dataset ~/models/yoloe/study_cafe_sim_v1_dataset/dataset.yaml \\\n  --checkpoint ~/models/yoloe/yoloe-26s-seg.pt \\\n  --text-encoder-directory ~/models/yoloe \\\n  --project ~/models/yoloe/study_cafe_sim_v1_training \\\n  --epochs 8 --batch 4 --device cpu\npython3 ros2_ws/src/cleany_perception/tools/evaluate_study_cafe_yoloe.py \\\n  --dataset ~/models/yoloe/study_cafe_sim_v1_dataset/dataset.yaml \\\n  --checkpoint ~/models/yoloe/study_cafe_sim_v1_training/fit/weights/best.pt \\\n  --text-encoder-directory ~/models/yoloe \\\n  --confidence 0.08 --class-thresholds 0.25 0.25 0.25 0.08\ncp ~/models/yoloe/study_cafe_sim_v1_training/fit/weights/best.pt \\\n  ~/models/yoloe/study_cafe_sim_yoloe26s_seg.pt\n```\n\n| 기준 | 값 / 해석 |\n|---|---|\n| YOLOE 추론 최소 confidence | 0.08 |\n| 클래스 순서 / 문턱값 | 컵, 마우스, 휴지, 레고 / 0.25, 0.25, 0.25, 0.08 |\n| 문턱값 적용 위치 | 모델 출력 뒤, Gemini 분류 전 |\n| mask 평가 | IoU 0.5, holdout의 일치 수와 미일치 검출 수를 함께 보고 |\n| 성능 범위 | 같은 시뮬레이터의 새로운 배치; 실제 카메라/물리 파지 성공률 아님 |\n\n모델의 클래스 순서를 바꾸면 `yoloe_class_confidence_thresholds` 순서도 맞춥니다. 학습 점수나 한 장의 검출 성공을 런타임 성공으로 해석하지 않습니다.\n\n\n## Gemini 분류 메타데이터\n\nGemini structured response에 `sorting_category`(trash/lost_item/review),\n`sorting_reason`을 추가해 `DetectedObject2D`까지 보존합니다. 기존 bbox만 있는\n응답은 파싱 가능하지만 category는 빈 값이며 sorting 실행에서 검토 대상으로\n처리합니다. 위험하거나 용도가 불확실한 물체는 review를 요청합니다. 소유권 판단은\n확정 사실이 아니며 현재 정책은 감독하의 시뮬레이션 검증용입니다.\n\n- [Technical Overview](../../../../docs/cleany-docs/20_TECHNICAL/00%20-%20Technical%20Overview.md)\n- [Safety and Risk](../../../../docs/cleany-docs/20_TECHNICAL/08%20-%20Safety%20and%20Risk.md)\n\n## 모델 재사용과 입력 처리\n\nTensorRT 엔진은 프로파일의 클래스 순서와 해시를 검사한 뒤 로드합니다.\n같은 모델 경로의 어댑터는 모델 풀을 공유하고 추론 호출을 직렬화합니다.\nGemini 요청은 JPEG를 사용하며 종류명 별칭을 정규화합니다. 분류 사유는 기존\n수거 소비자와의 호환성을 위해 계속 요청하고 전달합니다.\n\nGemini 응답을 기다리는 동안 깊이 기하를 계산하고, 동일 snapshot의 선택 복원에서\n지지면과 크기 계산을 재사용합니다. 캐시는 snapshot TTL과 함께 정리됩니다.\n`rgbd_qos_reliability`는 `best_effort` 또는 `reliable`이며 각 입력 콜백은\n별도 그룹을 사용합니다. 모델, 스레드 및 QoS 설정은 실행 환경에서 검증해야 합니다.\n\n새 서비스와 검출 필드는 [인식 인터페이스](interfaces.md)를 따릅니다.\n\n### 비식별화 모델 준비\n\nYOLOE 프롬프트와 체크포인트 해시는 [privacy lock](../../../../configs/models/yoloe-26s-seg-privacy.lock.json)에 있다. 기존 [TensorRT 내보내기 도구](../../../../tools/yoloe_trt.py)에 이 lock과 `config/yoloe_privacy.yaml`을 지정한다. 작업용 real53 엔진과 별도로 생성한 결과를 `privacy.engine`으로 배치한다.\n\n보조 모델의 출처와 검증할 SHA-256은 [보조 모델 lock](../../../../configs/models/camera-privacy-aux.lock.json)에 있다. YuNet은 ONNX를 그대로 사용한다. 글자 검출 ONNX는 같은 Jetson의 `trtexec`에 lock의 인수와 `--onnx=text.onnx --saveEngine=text.plan`을 전달해 변환한다. 노트북 CPU 검증에는 `--text text.onnx`를 사용한다.\n\n연속 영상은 시작 시점, 역행 타임스탬프 또는 0.48초 이상의 입력 단절 뒤 첫 프레임을 추적 초기화에만 사용한다. 사진은 각 검출기를 독립 실행한다. 재생 도구는 구간 앞에 입력이 있으면 한 장을 먼저 읽고, 전송을 보류한 프레임 수를 JSON에 기록한다.\n\n기본 모드에서 Gemini를 쓰는 인식 프로세스는 첫 이미지 요청에서 비식별 모델을 로드한다. 기본 번들은 `/var/opt/cleany/models/camera-privacy/active`이며 엔진과 함께 클래스 구성을 담은 `profile.yaml`이 필요하다. 프리뷰와 같은 GPU 잠금을 사용한다.\n\n시연에서 원본 맥락을 보내려면 `cleany-perception.service`의 systemd 사용자 drop-in에 다음 설정을 두고 해당 서비스만 재시작한다. 비식별 전송으로 복귀하려면 값을 `redacted`로 바꾸고 재시작한다.\n\n```ini\n[Service]\nEnvironment=CLEANY_GEMINI_IMAGE_MODE=original\n```\n"},"ros2_ws/src/cleany_robot_interface/README.md":{"title":"cleany_robot_interface","body":"# cleany_robot_interface\n\nFeetech 모터 상태 조회, 안전 가드(Controller Guard), 손목 RGB 카메라 제어 및 실물 제어 실행을 담당하는 패키지입니다.\n실물 제어에서 사용하는 Feetech 하드웨어 플러그인도 이 패키지에서 빌드하고 설치합니다.\n(Mission Manager의 범용 Mock/Sim/Real 어댑터 전체를 포괄하는 패키지는 아닙니다.)\n\n## 1. 사전 준비 및 설정\n\n실행 전 로봇별 엔코더 매핑, 캘리브레이션 파일 및 컨트롤러 한계 설정을 준비해야 합니다.\n- **기본 모델 및 카메라 보정**: `cleany_description` 패키지의 `jetson_20261009` 프로파일을 기준으로 사용합니다.\n- **단위 검증 주의**: 소프트웨어 및 가상 단위 테스트 통과 결과가 실제 하드웨어의 절대 보정 정확도나 파지 성공을 보장하는 것은 아닙니다.\n\n## 2. 관련 가이드 링크\n\n- **상세 인터페이스 및 토픽 규격**: [interfaces.md](docs/interfaces.md)\n- **Feetech 드라이버 계약**: [feetech-hardware.md](docs/feetech-hardware.md)\n- **실물 로봇 구동 절차**: [RUNNING 가이드](../../../docs/RUNNING.md#jetson-실물-실행-경로)\n- **하드웨어 없는 가상 검증**: [TESTING 가이드](../../../docs/TESTING.md#jetson-실물-변경-검증)\n- **가상 시리얼 제어기 검사**: `runtime_test/` 아래의 PTY 테스트는 실제 하드웨어 포트를 열지 않고 가상 시리얼로 안전하게 동작을 검증합니다.\n"},"ros2_ws/src/cleany_robot_interface/docs/feetech-hardware.md":{"title":"Feetech 하드웨어 플러그인","body":"# Feetech 하드웨어 플러그인\n\n`cleany_feetech_hardware/FeetechSystem`은 `cleany_robot_interface`에 포함된\nFeetech STS3215 및 STS3250 서보 모터용 `ros2_control` 하드웨어 플러그인입니다.\n- **제어 범위**: 양팔 및 그리퍼 12개 관절의 위치(Position) 명령 제어 + 머리 2개 관절의 위치 상태 조회\n- **구동 모드**: 기본 기동은 **READ 전용(읽기 전용)** 모드이며, 모터 쓰기(제어) 모드는 로봇별 외부 프로파일을 명시할 때만 활성화됩니다.\n\n## 1. 실행 및 검증\n\n실물 제어 실행은 [실행 가이드](../../../../docs/RUNNING.md#jetson-실물-실행-경로),\nC++ 드라이버와 가상 시리얼 검사는 [테스트 가이드](../../../../docs/TESTING.md#jetson-실물-변경-검증)를 따릅니다.\n\n## 2. 구현 계약 및 안전 정책\n\n제어 프로파일의 `joint_defaults`와 `joint_overrides`를 합친 관절별 속도 및\n가속도 제한은 MoveIt `joint_limits.yaml`에 적용한다.\nJetson 양팔 운영 프로파일의 그리퍼 궤적 상한은 속도 2.0 rad/s, 가속도 8.0 rad/s²다.\n양쪽 그리퍼의 모터 가속도는 각 모터에서 확인한 상한인 raw 50을 사용한다.\n토크 OFF에서 기동할 때 제어기는 쓰기가 활성화된 STS3215의 최대 가속도(주소 85, 1바이트)를 먼저 읽는다.\n요청값이 상한을 넘으면 RAM 설정 전에 관절명, 모터 ID, 요청값과 상한을 기록하고 준비를 중단한다.\n드라이버는 위치 명령을 ROS 관절 범위로 clamp한 뒤 tick으로 변환해 전송한다.\n전송 목표의 속도를 다시 제한하거나 별도 추종오차 Fault를 걸지 않으며,\n추종오차는 JTC의 궤적 및 목표 허용오차로 처리한다. 기존 프로파일의\n`tracking_error`는 사용하지 않는다. 모터의 `speed_raw`, `acceleration_raw`,\n`torque_limit_raw` 설정과 기동 검사는 유지한다.\n\n### 통신 복구 정책 (Read Recovery Budget)\n정상 수거 프로파일에는 `serial_read_retries=1`, `serial_read_recovery_budget_ms=60`이 적용되어 모터 응답 지연 시 1회 재시도합니다.\n- **복구 대상**: READ 응답 지연이나 잘못된 프레임에 적용합니다. 같은 시간 한도와 256바이트 한도 안에서 유효한 프레임을 찾고, 설정된 횟수만큼 읽기를 다시 시도합니다. 모터 상태 오류, 포트 단절과 WRITE 실패에는 재시도를 적용하지 않습니다.\n- **자세 유지(Hold)**: 재시도 중에는 마지막으로 확인된 유효 실측 위치로 모터 목표를 고정하여 토크를 유지합니다.\n- **완전한 프레임 갱신**: 복구 성공 후 부분 프레임을 버리고 14개 모터 전체를 새로 읽어 스냅샷을 갱신합니다. (100ms 타임아웃 유지)\n- **설정 미지정 시**: 기존 프로파일은 `serial_read_retries=0`으로 즉시 실패 처리됩니다.\n\n| 항목 | 동작 규격 및 안전 조치 |\n|---|---|\n| **시리얼 버스** | 양팔(ID 1–12) 및 머리(ID 13–14), 1Mbps 통신. 현재 실물 설정은 공용 포트 하나에서 14개 모터를 통합 조회하며 머리 쓰기는 원천 차단 |\n| **포트 보호** | `flock` 및 `TIOCEXCL`로 다중 점유 방지; 라이프사이클·읽기·쓰기를 동일 Mutex로 직렬화 |\n| **기동 검사** | 14개 모터 모델 번호, 홈(Homing), 최소/최대 한계 및 위치 제어 모드를 EEPROM과 대조 |\n| **변환** | 기존 방향·영점·오프셋 재사용; 초기 범위 복귀는 calibrated raw tick으로 수행 |\n| **상태 제공** | 14관절 실측 위치 및 양팔 12관절 텔레메트리 제공; 머리 제어 명령 없음 |\n| **쓰기 차단** | `read_only=true`일 경우 쓰기 함수 및 Controller 활성화를 즉시 거부 |\n| **활성화 순서** | 쓰기 모드 기동 시: RAM 속도·가속도·토크 설정 → `clamp(raw, range_min, range_max)` 목표 1회 전송 → 토크 ON → 범위 내 피드백 확인 |\n| **토크 유지 복구** | `allow_torque_on_recovery=true`이면 범위 내 정상 Hold 목표를 유지하고, 범위 밖 관절만 가까운 calibrated 경계로 복귀 |\n| **목표 전송** | 명령 인터페이스 관절을 먼저 검사한 뒤 동기 쓰기(Sync Write) 수행 |\n| **위치 명령** | ROS 관절 범위로 clamp 후 tick 변환. 유한값, 인코더 표현 범위와 상태 신선도 검사 유지 |\n| **궤적 제한** | MoveIt에서 속도·가속도 제한, JTC에서 추종오차 처리. 드라이버의 추가 속도 제한 및 추종오차 Fault 없음 |\n| **정지 유지** | JTC의 취소·중단 시 Hold 명령도 같은 위치 명령 경로로 즉시 전송 |\n| **이상 피드백** | 모든 관절을 순차 조회한 완전한 프레임만 갱신. MACD 필터 온도 초과 또는 통신 불가 시 Fault 고정 |\n| **장애 대응** | 신규 목표 즉시 차단, 통신 가능한 모터에 현재 위치 Hold 시도 (자동 재연결 없음) |\n| **종료 동작** | 모터 주저앉음을 방지하기 위해 토크를 자동 OFF하지 않음; 현재 위치 Hold 후 포트 해제 |\n\n> [!CAUTION]\n> 프로세스 종료 시 모터 토크가 자동 해제되지 않으므로, 작업 완료 후 모터 토크를 풀려면 명시적인 도구(`tools/left-arm-torque-off`, `tools/right-arm-torque-off`)를 실행해야 합니다.\n\n### 초기 범위 복귀\n\n모터 제어가 시작되는 `on_activate()`에서 제어 대상으로 선택한 팔 관절의\n토크를 켭니다. 측정 raw tick이 캘리브레이션 범위를 벗어나면 이탈량과\n무관하게 가장 가까운 최소·최대 tick을 목표로 보냅니다. IK나 FJT를 거치지\n않고 모터의 기존 `speed_raw`, `acceleration_raw`, `torque_limit_raw`를 사용합니다.\nRAM 설정을 먼저 기록하고 목표는 한 번만 보낸 뒤, 위치를 조회해 범위 안에\n들어왔을 때 활성화를 완료합니다. 복귀 중에는 활성화가 대기 상태입니다.\n\n이미 토크가 켜진 관절은 기존 복구 설정을 따릅니다. 범위 내 Hold는 기존\n목표와 RAM 설정을 인수하며 목표-실측 32 tick 검사를 유지합니다. 범위 밖\n관절에는 이 편차 검사를 적용하지 않고 경계 목표를 보냅니다. `read_only`\n실행, 명령 대상에서 제외된 관절과 머리에는 복귀 명령을 보내지 않습니다.\n\n`CLEANY_REQUIRE_POWERED_HOLD_RECOVERY=1`로 시작한 복구에서는 명령 대상\n모터가 모두 토크를 유지하고 있고 현재 위치가 보정 범위 안에 있어야 합니다.\n조건이 맞으면 저장된 목표를 유지하며, 제어기가 초기 엔코더 위치를 다시\n보내는 동안에도 기존 목표를 보존합니다. 범위 복귀는 일반 기동 경로에서 수행합니다.\n\n### 온도 MACD 필터\n\n모터별 빠른 EMA와 느린 EMA의 차이를 MACD로 계산하고, 그 차이의 EMA를\n신호선으로 사용합니다. 판정 온도는 `느린 EMA + 신호선`으로 섭씨 단위를\n유지합니다. 각 EMA의 계수는 steady clock의 실제 경과 시간으로\n`1 - exp(-dt / tau)`를 계산합니다. 연속 레지스터 응답의 원시 온도가\n적용 한도 이상이면 온도 레지스터 63을 한 번 단독 재조회하고 그 값을\n필터에 넣습니다. 최초 원시 값은 `temperature_raw`에 보존합니다.\n재조회 통신 실패는 기존 통신 Fault로 처리하며, 확인 횟수 카운터와 별도\n원시 온도 지속 시간 판정은 사용하지 않습니다.\n\n```yaml\ntemperature_macd_fast_tau_s: 0.1\ntemperature_macd_slow_tau_s: 0.5\ntemperature_macd_signal_tau_s: 0.1\n```\n\n세 시정수는 양수이고 `fast \u003c slow`여야 합니다. 기존\n`temperature_fault_confirmation_samples`는 제거하고 위 설정으로 교체합니다.\n초기 온도는 첫 실측값으로 설정하며, 이미 뜨거운 상태의 기동을 평활화로\n숨기지 않습니다. 이후 필터 온도를 기존 `temperature_limit_c`와 비교합니다.\n모터 상태와 전류 보호는 온도 필터를 거치지 않습니다. 필터 이력은 유효한\n14개 모터 전체 프레임과 함께 갱신하며, 통신 복구로 버린 부분 프레임은\n이력을 바꾸지 않습니다.\n\n## 3. ROS 인터페이스\n\n팔과 그리퍼의 궤적 제어기는 제어 프로파일의 `controller.type`으로 선택한다.\n생략하면 기존 `joint_trajectory_controller/JointTrajectoryController`를 사용한다.\n이벤트 방식의 완료 결과 전달이 필요하면\n[`cleany_trajectory_controller/JointTrajectoryController`](../../cleany_trajectory_controller/docs/interfaces.md#설정)를\n지정한다. 두 제어기의 Action 이름과 메시지 타입은 동일하다.\n지원하지 않는 `controller.type`이나 1~100 Hz 범위의 유한한 숫자가 아닌\n`controller.action_monitor_rate`는 로봇 모델을 생성하기 전에 거부한다.\n\n| 인터페이스 | 타입 | 설명 |\n|---|---|---|\n| `/{arm}_controller/follow_joint_trajectory` | `control_msgs/action/FollowJointTrajectory` | 팔 5관절 단위 표준 궤적 추종 액션 |\n| `/{gripper}_controller/follow_joint_trajectory` | `control_msgs/action/FollowJointTrajectory` | 그리퍼 1관절 단위 구동 액션 |\n| `/joint_state_broadcaster/joint_states` | `sensor_msgs/msg/JointState` | 컨트롤러 원시 상태 (미지원 항목은 NaN) |\n| `/joint_states` | `sensor_msgs/msg/JointState` | 상태 감시 노드가 검증한 14관절 위치 상태 (20 Hz) |\n| `/real_control/status` | `std_msgs/msg/String` (Transient Local) | 제어 상태 (`waiting/ready/fault`), 중단 사유 JSON (20 Hz) |\n| `/real_control/stop` | `std_srvs/srv/Trigger` | 비상 정지 및 컨트롤러 비활성화 요청 서비스 |\n\n> [!NOTE]\n> `/real_control/status`의 `state=ready`는 관절 센서 피드백이 정상 수신 중임을 의미하며, 모터 토크 활성화나 카메라 준비 완료를 뜻하지 않습니다.\n> 비상 정지(`stop`) 호출 시 `status.actions_cancelled`와 `status.controllers_stopped`를 통해 소프트웨어 정지 완료 여부를 확인합니다.\n\n## 4. 실물 구동 전 필수 확인 사항\n\n> [!WARNING]\n> - 컨트롤러 한계치(`control_config`) 및 모션 감시(`hardware_monitor_config`)는 외부 YAML 설정 파일로 명시해야 합니다.\n> - 드라이버는 설정 온도와 모터 EEPROM 보호 온도 중 더 낮은 값을 적용하며, 임의로 EEPROM을 수정하지 않습니다.\n> - 호스트 프로세스 중단 또는 USB 케이블 단절 시에도 모터가 마지막 목표 위치를 유지할 수 있으므로, **물리적인 외부 비상 정지 스위치 및 팔 하중 지지 수단**을 사전에 반드시 준비해야 합니다.\n\n구성 근거: [Humble hardware plugin](https://control.ros.org/humble/doc/ros2_control/hardware_interface/doc/writing_new_hardware_component.html) · [Joint Trajectory Controller](https://control.ros.org/humble/doc/ros2_controllers/joint_trajectory_controller/doc/userdoc.html).\nFeetech 통신 패킷 포맷은 `feetech-servo-sdk==1.0.0` 레지스터 맵을 따릅니다.\n\n## 5. 상세 텔레메트리 (Telemetry) 인터페이스\n\n양팔 및 그리퍼 모터(ID 1~12)는 `ros2_control`을 통해 상세한 진단 정보를 제공합니다:\n\n| 분류 | 주요 인터페이스 필드 | 설명 |\n|---|---|---|\n| **전기 및 부하** | `current_raw`, `load_magnitude_raw`, `voltage_raw` | 실제 모터 전류(mA 단위 변환 전 원시값), PWM 듀티 부하 크기, 구동 전압 |\n| **온도 및 상태** | `temperature`, `temperature_raw`, `motor_status`, `protocol_error_code` | MACD 판정 온도(℃), 원시 온도(℃), 하드웨어 상태 플래그, 통신 프로토콜 에러 코드 |\n| **명령 및 추종** | `command_position`, `sent_position`, `goal_position_raw` | ROS 위치 명령(rad), 시리얼 전송된 양자화 위치(rad), 모터 레지스터 목표 tick |\n| **통신 품질** | `feedback_stamp_ns`, `communication_recovery_count` | 스냅샷 취득 시각(ROS timestamp), READ 응답 지연 복구 누적 횟수 |\n\n- **안전한 기록 보관**: 수거 런타임은 제어 루프와 완전히 분리된 백그라운드 ROS 구독기를 통해 `logs/motor-telemetry.jsonl`에 주기적(기본 50 Hz)으로 기록합니다.\n- **이상치 대응**: 체크섬 오류나 일시적 통신 실패 시 마지막 정상 스냅샷을 유지하되 타임스탬프를 갱신하지 않아 상위 감시기가 지연(Stale) 상태를 즉시 감지할 수 있도록 설계되었습니다.\n"},"ros2_ws/src/cleany_robot_interface/docs/interfaces.md":{"title":"실물 상태와 컨트롤러 경계 인터페이스","body":"# 실물 상태와 컨트롤러 경계 인터페이스\n\n본 문서는 실물 로봇의 엔코더 조회 노드, 제어기 안전 가드(Guard), 손목 카메라의 ROS 2 인터페이스를 설명합니다.\n\n> [!CAUTION]\n> 엔코더 상태 조회 노드(`reader.py`, `robot_state_reader.py`)와 실물 제어기(`real_control.launch.py`)가 동일한 시리얼 포트를 동시에 점유해서는 안 됩니다.\n\n`read_only_state.launch.py`는 판독 노드와 `robot_state_publisher`에 같은 URDF를 지정한다. CAD 링크 계산이나 모터 읽기에 실패한 표본은 발행하지 않는다. 모델에 CAD 보정이 없거나 `robot_state_reader`를 모델 없이 실행하면 실측 관절만 발행한다.\n\n## 1. 노드별 인터페이스 목록\n\n| 노드명 | 인터페이스 명칭 및 타입 | 역할 및 동작 상세 |\n|---|---|---|\n| `arm_state_reader` | `joint_states` (`sensor_msgs/JointState`) [발행] | 설정된 단일 팔의 실측 관절 위치 |\n| `read_only_robot_state` | `/joint_states` (`sensor_msgs/JointState`) [발행] | 기본 20 Hz로 모터 실측 위치를 발행한다. 보정 CAD 모델에서는 양쪽 그리퍼의 실측 각도로 계산한 손가락 종속 관절 16개를 같은 메시지에 담는다. |\n| `real_control_state_guard` | `joint_state_broadcaster/dynamic_joint_states` (`control_msgs/msg/DynamicJointState`) [구독] | 최신 프레임 하나에서 모터 위치와 공통 취득 시각을 확인한다. QoS는 best effort다. |\n| 〃 | `joint_states` (`sensor_msgs/JointState`) [발행] | 정상성과 신선도(최대 나이 0.25초)를 검증한 관절 상태 |\n| 〃 | `real_control/status` (`std_msgs/String`) [발행] | 제어 상태 판정 결과 (`waiting/ready/fault`, 20 Hz, Transient Local) |\n| 〃 | `real_control/stop` (`std_srvs/Trigger`) [서비스 제공] | 컨트롤러 비활성화 및 활성 Goal 즉시 취소 |\n| 〃 | `controller_manager/switch_controller` [서비스 호출] | 비상 상황 시 제어기 강제 정지 전환 |\n| `wrist_rgb_camera` | `/{arm}_wrist_camera/image_raw`, `camera_info` [발행] | 손목 카메라 원본 영상 (SensorData QoS) 및 카메라 내부 파라미터 |\n| 〃 | `/{arm}_wrist_camera/preview/compressed` [발행] | 모니터링용 압축 미리보기 영상 (JPEG) |\n| 〃 | `/{arm}_wrist_camera/set_enabled` (`std_srvs/SetBool`) [제공] | 손목 카메라 USB 장치 동적 On/Off 제어 |\n| 〃 | `/{arm}_wrist_camera/enabled` (`std_msgs/Bool`) [발행] | 카메라 활성화 상태 알림 (1 Hz, Reliable, Transient Local) |\n| `rgbd_frame_bridge` | `/tf_static` (`tf2_msgs/TFMessage`) [발행] | 지정된 헤드 RGB-D 설정에 따른 정적 좌표계(TF) 브리지 |\n| `motor_telemetry_recorder` | `joint_state_broadcaster/dynamic_joint_states` [구독] | 모터 전류/온도/부하 텔레메트리를 stdout JSONL로 기록 (수동 구독) |\n\n- **안전 가드 기준**: 상태 데이터의 최대 허용 나이는 0.25초이며, 기동 대기 시간은 30초입니다. 지연되거나 결측된 상태는 즉시 감지되어 차단됩니다.\n- **손목 카메라 생명주기**: 손목 카메라는 기본적으로 비활성(`start_enabled=false`) 상태로 대기하며, 제어 취소나 오류 발생 시 카메라 종료가 모터 비상 정지를 지연시키지 않도록 설계되었습니다.\n\n가드는 실제 `feedback_stamp_ns`로 관절 상태를 발행한다. 발행 헤더만 새로워진\n프레임은 신선도를 갱신하지 않는다. 그리퍼 위치가 같으면 CAD 계산을 재사용한다.\nFeetech 드라이버가 오류를 고정하면 취득 시각의 갱신이 멈춘다. 가드는\n프레임에 오류 비트가 있으면 함께 검사하고, `require_driver_fault=true`를\n선택한 경우에는 해당 비트가 없는 프레임도 거부한다.\n\n실물 제어 launch는 Fast DDS를 사용할 때 컨트롤러 매니저와 보호 노드의 메시지를 비동기로 전송한다. 관절 상태는 드라이버의 취득 시각을 유지하며 보호 노드는 50ms마다 마지막 취득 시각을 검사한다.\n\n## 2. 토크 수동 제어\n\n선택한 팔의 토크는 `tools/{left,right}-arm-torque-on --control-config /absolute/path/to/limits.yaml`\n및 `tools/{left,right}-arm-torque-off`로 제어합니다. Jetson에서 한 팔을 유지할 때는 저장소의 `configs/robot/jetson/feetech_operational_left_arm.yaml` 또는 `feetech_operational_right_arm.yaml`을 해당 팔에 지정합니다. 상태 조회기나 컨트롤러가 같은 포트를 점유한 동안 실행하지 않습니다.\n\n## 보정된 카메라 TF\n\n`calibrated_camera_pose`는 `config_file`의 고정된 보정 모델과 관절 좌표 변환을\n사용한다. `/joint_states`의 위치는 rad이며, 수신 시각 기준 0.5초 이상 지난\n상태는 사용하지 않는다. 보정 모델, 관절 매핑과 모터 보정의 해시가 달라지면\n초기화에 실패한다. 장치 연결과 모터 명령은 수행하지 않는다.\n\n| 구분 | 기본 endpoint | 타입 | 의미 |\n|---|---|---|---|\n| 구독 | `/joint_states` | `sensor_msgs/msg/JointState` | 운영 관절 위치, sensor-data QoS |\n| TF | `/tf` | `tf2_msgs/msg/TFMessage` | `base_link`에서 설정된 광학 프레임으로의 동적 변환 |\n| 발행 | `/camera_calibration/pose_status` | `std_msgs/msg/String` | 선택 파일, 해시, 갱신된 카메라와 상태 나이의 JSON |\n\n상태 프로파일의 `camera_pose_config`가 선택되면 기존 광학 프레임의 고정\n분기를 제거해 TF 소유권을 이 노드로 넘긴다. 로봇의 가동 관절이나 형상이\n포함된 링크는 제거할 수 없다. 일부 팔만 존재할 때는 해당 팔의 상태로\n계산할 수 있는 카메라만 발행한다.\n\n\n## 제어기 완료 알림 주기\n\n외부 Feetech 제어 프로파일의 `controller.type`은 제어기 plugin을 선택한다.\n생략 시 `joint_trajectory_controller/JointTrajectoryController`를 사용한다.\nJetson 이벤트 전달 구성은 `cleany_trajectory_controller/JointTrajectoryController`를\n명시한다. `controller.action_monitor_rate`는 유한한 1–100Hz이며 기본값은\n20Hz다. 기존 제어기에서는 결과 확인과 피드백 주기이며, 이벤트 제어기에서는\n진행 상태 주기다. 이벤트 구성은 20Hz를 사용하고 완료, 실패와 사용자 취소는\n발생 시 executor를 깨워 전달한다. 제어 주기와 이동 제한은 별도다.\n자세한 상태 전이는 [이벤트 제어기 계약](../../cleany_trajectory_controller/docs/interfaces.md)을 따른다.\n\n운영 모델의 고정 카메라 마운트 형상 등록은 [공통 파지 설정](../../cleany_skill_executor/docs/shared-grasp-policy.md)을 따른다. 광학 TF와 제어 캘리브레이션은 기존 경로를 유지한다.\n\n보정된 CAD 프로파일에서 `control_state_guard`의 `cad_calibration_json`은 기존\n모터 피드백에 계산한 손가락 관절 16개를 추가한다. 입력 모터의 신선도와\n정상성을 먼저 검사하며, 계산 관절은 모터 명령이나 추가 실측 피드백으로\n취급하지 않는다. 연동 실패 시 상태 발행을 중단하고 정지 래치를 유지한다.\n[CAD 파지 모델 계약](../../cleany_moveit_collision/docs/calibrated-cad.md)을 따른다.\n\n\narm_preview.launch.py는 서보 버스를 열지 않고 공통 CAD 표시로 연결한다. 토픽과 상태는 [공통 CAD 런타임](../../cleany_description/docs/runtime-model.md)을 따른다.\n"},"ros2_ws/src/cleany_safety_adapter/docs/interfaces.md":{"title":"cleany_safety_adapter 노드 인터페이스","body":"# cleany_safety_adapter 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## safety_adapter\n\n실행 파일: `safety_adapter`. 원본: [노드.py](../cleany_safety_adapter/node.py), [evidence.py](../cleany_safety_adapter/evidence.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `safety/status` | `cleany_interfaces/msg/SafetyStatus` | R10; `rate_hz` 20 Hz |\n| 토픽 구독 | `\u003cestop_released_topic>` | `std_msgs/msg/Bool` | R10; 기본 빈 값이면 구독 없음 |\n| 토픽 구독 | `\u003cprotection_ready_topic>` | `std_msgs/msg/Bool` | R10; 기본 빈 값이면 구독 없음 |\n| 토픽 구독 | `odom` | `nav_msgs/msg/Odometry` | Sensor; `odom_topic` |\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `joint_states_topic` |\n\n독립 안전 계층의 증거를 System Supervisor에 전달할 뿐이며 구동을 차단하거나 E-stop을 해제하지 않습니다. 확인할 수 없는 항목은 항상 안전하지 않은 값으로 보고합니다.\n\n| 출력 | 증거 | 증거가 없거나 오래됐을 때 |\n|---|---|---|\n| `protection_ready` | 보호 계층 준비 Bool | false |\n| `estop_engaged`, `physical_release_confirmed` | 물리 해제와 회로 reset 완료 Bool | engaged=true, release=false |\n| `stopped` | 최신 odom twist와 모든 관절 속도가 임계값 이하 | false |\n| `detail` | 판정 이유 | 미설정 source와 stale 항목 명시 |\n\n| 안전 근거 | 계약 |\n|---|---|\n| Freshness | Header 없는 Bool의 monotonic 수신 시각, evidence_timeout_s=0.3 s |\n| 부팅 | 설정한 source 각각 첫 보고 전에는 발행 안 함; 부팅 순서로 E-stop latch 방지 |\n| Source 미설정 | 즉시 안전하지 않은 값 발행 |\n| stopped | Encoder 측정, 독립 정지 센서 / STO 대체 아님 |\n| 초기 정지 문턱 | stopped_linear_mps=0.01, stopped_angular_radps=0.02, stopped_joint_radps=0.02; 실물 미검증 |\n\n현재 Cleany에는 이 Bool을 발행하는 하드웨어가 없습니다. E-stop 회로 설계와 adapter 또는 MCU 펌웨어는 KB에서 미정입니다.\n"},"ros2_ws/src/cleany_scene_mapping/README.md":{"title":"cleany_scene_mapping (센서 씬 매핑)","body":"# cleany_scene_mapping (센서 씬 매핑)\n\nMoveIt 2의 깊이 센서 기반 OctoMap에서 로봇 자체 링크 및 알려진 기하 형상(Known Geometry)을 스마트하게 제외하는 실시간 옥토맵 업데이터(`KnownGeometryOctomapUpdater`) 플러그인입니다.\n\nMuJoCo 시뮬레이션 및 실물 Jetson 환경에서 센서 오차나 로봇 팔 잔상으로 인해 옥토맵에 불필요한 충돌 장애물이 생기는 문제를 방지합니다.\n- **제외 대상 형상**: 로봇 자체 링크(URDF 기반 Self-mask), 비전 인식이 전달한 대상 물체 메쉬/OBB, 수거함 충돌 형상\n- **보존 원칙**: 실제 미지의 환경 장애물, 책상, 벽면 등은 그대로 옥토맵 점유 셀로 보존됩니다.\n\n## 1. 주요 알고리즘 및 점군 처리\n\n1. **불변 스냅샷 동기화**:\n   - 촬영 시점의 TF 좌표 변환과 불변 형상 스냅샷을 사용하여 셀프 마스크 및 점유 리프(Leaf) 정리를 수행합니다.\n   - 형상 버전이 일치하지 않거나 필요한 TF가 지연/누락되면 프레임 전체를 안전하게 거부(Skip)합니다.\n2. **볼록 다면체(Convex Hull) 기반 패딩**:\n   - 메시의 법선 방향 패딩(`padding_offset`)과 스케일 패딩(`padding_scale`)을 적용한 안전 볼륨을 기준으로 점군을 판정합니다.\n3. **엄격한 Free 셀 정리**:\n   - 옥토맵 점유 리프의 8개 꼭짓점이 알려진 형상의 볼록 다면체 내부에 **모두 포함될 때만** 해당 셀을 빈 공간(Free)으로 비웁니다.\n   - 부분적으로 겹치거나 경계에 걸친 영역, 형상 사이의 틈새는 비우지 않고 안전하게 유지합니다.\n\n## 2. 병렬 처리 및 레이캐스팅 최적화\n\n- **멀티스레드 마스킹 (`depth_cloud.mask_workers`)**:\n  - 기본값은 **4개 워커**이며, AABB(축 정렬 경계 상자) 계층 구조로 1차 필터링 후 정밀 볼륨 판정을 수행합니다.\n  - 대용량 점군 데이터를 워커별로 복사하지 않고 인덱스 분할 방식으로 공유하여 메모리 복사 부하를 없앴습니다.\n- **광선 계산과 빈 공간 쓰기**\n  - OctoMap의 `computeRayKeys`가 반환한 복셀을 4×4×4 블록의 64비트 마스크에 표시합니다. 같은 프레임에서 여러 광선이 지난 복셀은 빈 공간 관측을 한 번 받습니다. 조밀한 배열에 8MiB가 넘게 필요한 경우 관측한 블록만 해시 맵에 보관합니다.\n  - 지도에는 블록별로 빈 공간 관측을 적용하고 공통 부모의 점유 확률과 가지 병합을 한 번씩 갱신합니다. 기존에 병합된 셀을 나눌 때는 원래 확률을 상속합니다. OctoMap 변경 추적이 켜져 있으면 기본 쓰기 함수를 사용해 변경된 키도 기록합니다.\n- **프레임당 최대 검사 예산**:\n  - 각 충돌 형상의 패딩을 포함하는 축 정렬 경계 상자와 겹치는 기존 리프를 방문합니다. 상자가 겹치면 같은 리프를 한 번만 세고, 점유 리프는 하나의 형상이 전체 셀을 포함할 때만 비웁니다.\n  - `depth_cloud.known_geometry_clear_max_leaves`는 이 범위에서 프레임당 방문할 고유 리프 수를 제한합니다. 기본값은 200,000이며 범위 밖의 빈 공간은 예산을 소모하지 않습니다.\n\n## 3. 빌드 및 테스트\n\nJetson 환경의 MoveIt 및 씬 매핑 오버레이 빌드:\n\n```bash\n# 1. 패치 및 씬 매핑 의존성 설정\nmake scene-mapping-setup moveit-octomap-lock-setup\nsource tools/scene-mapping-env\n\n# 2. 네이티브 C++ 단위 테스트 실행\nmake test-jetson-native\n```\n\n- **`test_raycast` 검증**:\n  - 광선 복셀 집합, 블록 배열과 해시 경로, 거리 제한 끝점과 점유 끝점의 우선순위를 검사합니다. OctoMap의 복셀별 쓰기와 블록 쓰기를 반복 적용해 전체 지도 직렬화와 변경 키를 대조합니다.\n- [Jetson 재생 벤치마크](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/docs/EVIDENCE.md?plain=1#L280-L298)에서 입력 점군, 갱신 시간과 지도 해시 비교 결과를 확인할 수 있습니다.\n"},"ros2_ws/src/cleany_skill_executor/docs/execute-manipulation-skill-action-spec.md":{"title":"Manipulation Action 인터페이스 명세","body":"# Manipulation Action 인터페이스 명세\n\n> **Mock·MuJoCo 공통 Action 계약.** 실제 필드는 [ExecuteManipulationSkill.action](../../cleany_interfaces/action/ExecuteManipulationSkill.action)을 따릅니다.\n> 실물 backend와 Mission Manager의 외부 승인·연동 계약은 후속 구현 대상입니다.\n\n| 서버 | namespace / `execution_profile` | 실행·설정 안내 |\n|---|---|---|\n| Python 모의 서버 | `/mock` / `mock` | [Mock 사용법](manipulation-mock-usage.md) |\n| native BT MuJoCo 서버 | `/sim` / `mujoco` | [BT 서버 README](../../cleany_manipulation_bt/README.md) |\n\n이 문서는 공통 필드와 결과 의미를 관리합니다. backend별 물리 확인 방식은 각 실행 안내를 따릅니다.\n\n## Goal 하나가 하는 일\n\n**지원 행동은 `collect_trash`와 `collect_lost_item`입니다.** 호출자가 승인한 물체\n하나를 지정 수거함에 옮기고 결과를 확인합니다. 접근, 집기와 운반은 서버 내부 단계입니다.\n다음 물체를 제안하려면 이번 행동 결과와 새 Scene이 필요합니다.\n\n| 범위 | 처리 |\n|---|---|\n| 승인된 쓰레기 후보 하나 수거 | `collect_trash` |\n| 승인된 분실물 하나의 전용 탑재 보관함 보관 | `collect_lost_item`. 사용자 요청으로 구현하며 KB의 MVP 범위 불일치는 별도 기록 |\n| 책상 전체 반복 | Mission Manager와 Planner의 책임 |\n| 인식만 수행 | 독립 Perception interface 사용 |\n\n모델 분류–skill–목적지는 각각 검사합니다. 두 분류의 수거 동작은 공통 BT를 사용하고\n책상 반복과 재관찰은 호출자가 담당합니다. staging과 handoff는 이 계약에 추가하지 않습니다.\n\n## Goal: 무엇을 실행할지\n\n| 필드 | 타입 | 쉽게 설명하면 | 예시 |\n|---|---|---|---|\n| `mission_id` | `string` | 어떤 미션인가 | `mission-001` |\n| `task_id` | `string` | 어떤 승인된 행동인가 | `task-003` |\n| `execution_id` | `string` | 이번 실행 시도의 고유 번호 | UUID |\n| `skill_name` | `string` | 승인된 행동 이름 | `collect_trash` 또는 `collect_lost_item` |\n| `snapshot_id` | `string` | 대상이 확인된 관찰 | `snapshot-010` |\n| `object_id` | `uint32` | 그 관찰 안의 물체 번호 | `3` |\n| `destination_id` | `string` | 설정에 등록된 수거 목적지 | Mock: `mock_trash_bin`, MuJoCo: `trash_right` |\n\n`object_id`는 snapshot마다 다시 붙을 수 있습니다. `(snapshot_id, object_id)`로 조회하며\n다음 관찰의 3번이 같은 물체라고 가정하지 않습니다. 목적지 ID는 해당 서버의 설정과 일치해야 합니다.\n`work_area_id`는 이번 Goal에 넣지 않습니다. 좌석과 접근 위치는 미션 및 Navigator 계약,\n물리 workspace는 서버 설정과 backend가 검사합니다.\n\n### 식별자와 승인\n\n- 미션 식별자는 기존 값을 전달하고 task는 승인된 proposal에 연결합니다.\n- task ID의 재관찰 간 유지 및 발급 규칙은 Planner adapter에서 정해야 합니다.\n- 호출 adapter가 `execution_id`를 생성하고 실제 움직임 전에 기록합니다.\n- 새 실행 ID로 재시도할 때도 이전 시도의 물체 상태를 먼저 확인합니다.\n- Goal 필드만으로 권한이나 의미 분류를 증명하지 않습니다. Mission Manager가 상태,\n  allowlist와 인자를 승인하고, 허용 client의 ROS 접근 경계는 구현 시 정의합니다.\n\n## Goal 수락과 중복 요청\n\n| 상황 | 처리 |\n|---|---|\n| ID 누락, `object_id=0`, 지원하지 않는 skill | Goal 거절 |\n| 다른 Goal 실행 중 | Goal 거절. 활성 행동 선점 금지 |\n| fault 또는 정지 확인이 필요한 상태 | Goal 거절 |\n| 같은 실행 ID가 실행, 종료 또는 중단 기록에 있음 | 중복 Goal 거절. 다시 움직이지 않음 |\n| 같은 실행 ID에 다른 인자 | 충돌로 거절 |\n| 구조상 유효한 새 Goal | 수락 후 준비 및 물리 검증 |\n| snapshot 조회 실패, 대상 이동 또는 verifier 준비 실패 | 수락 후 `BLOCKED`, 움직임 시작하지 않음 |\n\nROS Goal 거절에는 일반 Result payload가 없습니다. 호출 adapter는 거절을 수거 실패나\n취소 완료로 만들지 않고 준비 상태와 실행 기록을 확인합니다. 기록 조회는 `manipulation/get_execution`입니다.\n\n완료 Result를 새 Goal에 자동 재생하는 계약은 사용하지 않습니다. 응답을 잃으면 실행 ID로\n기록을 조회합니다. 이번 구현은 SQLite와 `GetManipulationExecution.srv`를 사용하며 기록을 자동 만료하지 않습니다.\n조회할 수 없다면 새 ID로 무조건 재실행하지 않습니다. 프로세스 재시작 후 이전 활성\n실행은 중단으로 기록하고 자동 재개하지 않습니다.\n\n### 작업 중 프로그램이나 장치가 다시 켜진 경우\n\n예를 들어 물체를 집던 중 프로그램이 종료되고 다시 켜졌다면, 기존 기록만으로\n물체가 그리퍼에 있는지 또는 팔이 멈췄는지 확정할 수 없습니다.\n\n1. 이전 활성 실행을 중단으로 표시하고 마지막 물리 진행 기록을 보존합니다.\n2. 중단 사실과 확인 가능한 상태를 Mission Manager의 복구 처리에 전달합니다.\n3. Mission Manager와 외부 상태 adapter는 **미션 중단과 사람 확인 필요**를 Backend에 알립니다.\n4. 실제 팔, 그리퍼와 물체 상태 및 안전 조건을 확인하기 전 새 물리 Goal을 허용하지 않습니다.\n5. 이전 Goal을 자동 재개하지 않습니다. 후속 미션이나 행동은 별도 검증과 승인 절차를 따릅니다.\n\n| 재시작 보고 | 계약 |\n|---|---|\n| Result / 정지 | 재시작 자체를 CANCELED 또는 stop_confirmed 근거로 쓰지 않음 |\n| 기존 Goal에 응답 불가 | 실행 기록 조회와 복구 이벤트로 중단 전달 |\n| 구현 이벤트 | manipulation/execution_events, ManipulationExecutionRecord, Reliable / Transient Local depth 100 |\n| 외부 전달 | SQLite 기록 제공; Backend 전달은 후속 Mission adapter |\n\n[Mission 연결](../../cleany_mission_manager/docs/manipulation-mock-integration.md)과 [KB 재시작 규칙](../../../../docs/cleany-docs/20_TECHNICAL/02%20-%20Robot%20Operations%20and%20Mission%20Dispatch.md)을 따릅니다.\n\n## Feedback: 지금 어디까지 했는지\n\n| 필드 | 타입 | 의미 |\n|---|---|---|\n| `execution_id` | `string` | 이번 실행 시도 |\n| `stage` | `string` | 아래 단계 |\n| `substage` | `string` | 현재 세부 동작. 예: `GraspObject`, `ConfirmGrasp` |\n| `selected_arm` | `string` | 선택 전 빈 값, 선택 후 등록된 팔 ID |\n| `message` | `string` | 사람이 읽는 설명 |\n\n| 단계 | 화면에서 읽을 뜻 |\n|---|---|\n| `VALIDATING` | 입력과 준비 상태 확인 |\n| `PREPARING_TARGET` | 선택 물체의 좌표, grasp와 경로 준비 |\n| `APPROACHING` | 빈 팔을 물체 쪽으로 이동 |\n| `GRASPING` | 그리퍼를 닫아 집기 |\n| `LIFTING` | 들어 올리고 잡은 상태 확인 |\n| `TRANSPORTING` | 물체를 든 채 수거함으로 이동 |\n| `PLACING` | 목적지에서 그리퍼를 열어 놓기 |\n| `RETURNING_ARM` | 팔을 backend의 복귀 목표 자세로 이동 |\n| `VERIFYING_PLACEMENT` | 수거함 내부 위치 확인 |\n| `RELEASING_IN_PLACE` | 취소 후 현재 위치에서 그리퍼 열기 |\n| `RECOVERING_ARM` | 취소 후 팔 복귀 |\n| `STOPPING` | 취소 또는 실패 후 동작 종료와 정지 확인 |\n| `FINALIZING` | 실제 진행과 종료 결과 기록 |\n\nFeedback은 진행 안내입니다. `PLACING`을 받았다고 물체가 수거된 것은 아닙니다.\n첫 이미지 전달, 책상 재관찰과 베이스 복귀는 이 Action의 단계가 아닙니다.\n\n두 구현의 Feedback은 `substage`도 제공합니다. 예를 들어 `GRASPING/GraspObject`는\n그리퍼 닫기, `GRASPING/ConfirmGrasp`는 파지 확인입니다. Result의 `failed_substage`는\n실패 세부 동작을 식별하고, 조회 기록의 `completed_substages`는 완료한 세부 동작만\n보존합니다. 큰 단계의 취소 및 timeout 계약은 유지합니다.\n\n## Result: 이번 행동이 어떻게 끝났는지\n\n### 구현 필드\n\n| 필드 | 타입 | 확인하려는 것 |\n|---|---|---|\n| `execution_id` | `string` | 어떤 시도 결과인가 |\n| `execution_profile` | `string` | `mock` 또는 `mujoco`. 실행 환경과 근거 구분 |\n| `status` | `string` | 성공, 차단, 실패, 취소 또는 치명 오류 |\n| `cancel_mode` | `string` | 취소 요청이 없으면 빈 값. `IMMEDIATE`, `CHECKPOINT`, `RETURN_ARM` |\n| `error_code` | `string` | 원인. 정상 성공은 `NONE` |\n| `failed_stage` | `string` | 문제가 난 단계. 성공은 빈 값 |\n| `failed_substage` | `string` | 실패한 세부 동작. 없으면 빈 값 |\n| `last_completed_stage` | `string` | 근거를 확인하고 끝낸 마지막 단계. 없으면 빈 값 |\n| `object_state` | `string` | 물체를 건드리지 않았는지, 들고 있는지 등 |\n| `placement_state` | `string` | 수거함 내부 위치를 확인했는지 |\n| `selected_arm` | `string` | 사용한 팔. 선택 전 종료면 빈 값 |\n| `stop_confirmed` | `bool` | 종료 시 팔과 그리퍼의 정지를 확인했는가 |\n| `arm_recovered` | `bool` | backend의 목표 자세로 팔을 복귀했는가 |\n| `retryable` | `bool` | 같은 행동을 다시 검토할 여지가 있는가 |\n| `message` | `string` | 사람이 읽는 설명 |\n\nMuJoCo의 복귀 목표는 실행 시작 때 저장한 팔 자세입니다. `arm_recovered=true`만으로\n모바일 베이스의 주행 자세나 이동 허가를 보장하지 않습니다. 상위 연동에서 별도 readiness를 확인해야 합니다.\n\n`retryable=true`는 재실행 명령이나 책상 전체 재시작 허가가 아닙니다. Mission Manager가\n재관찰, 승인과 retry budget을 확인합니다. false인 Goal을 그대로 자동 반복하지 않습니다.\n\n### 상태와 ROS 종료\n\n| `status` | 뜻 | ROS 종료 |\n|---|---|---|\n| `SUCCESS` | 수거, 놓은 결과 확인과 팔 복귀 완료 | `SUCCEEDED` |\n| `BLOCKED` | 움직임 전에 필요한 조건을 통과하지 못함 | `SUCCEEDED`, payload 확인 필요 |\n| `FAILED` | 실행을 시작했으나 요구한 결과를 얻지 못함 | `ABORTED` |\n| `CANCELED` | 선택한 취소 정책을 마치고 정지를 확인 | `CANCELED` |\n| `FATAL` | e-stop, hardware fault 또는 정지 확인 불가 | `ABORTED` |\n\n```mermaid\nflowchart TD\n    Race[\"정상 종료와 취소 경합 / 직렬화\"] --> Final{\"Result가 이미 확정됐나?\"}\n    Final -->|예| Keep[\"취소 거절 / 기존 결과 유지\"]\n    Final -->|아니오, 취소 수락| Cancel[\"물리 진행 보존 / 취소 경로 완료\"]\n    Cancel --> Fault{\"실제 fault 또는 정지 미확인?\"}\n    Fault -->|예| Fatal[\"Fault 우선 / 정지 미확인은 FATAL\"]\n    Fault -->|아니오| Result[\"최종 취소 결과\"]\n```\n\n전송 연결 유실과 client timeout은 Result 수신의 근거가 아닙니다. 취소 수락도 정지 완료와 구분합니다.\n\n##
