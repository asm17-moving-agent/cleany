|\n|---|---|\n| 승인된 Goal과 관찰 참조를 받음 | 행동 Result와 실제 물체 및 팔 상태를 반환 |\n| 선택된 물체와 목적지를 물리적으로 검사 | Mission Manager가 기록, 재관찰과 다음 판단 |\n\n새 Goal을 실행하기 전에 이전 실행의 기록과 정지 상태를 확인한다.\n같은 서버와 관련 팔 및 그리퍼 자원을 쓰는 Goal은 한 번에 하나만 실행한다.\ne-stop과 hardware fault의 실제 정지는 ROS Result와 Planner 응답을 기다리지 않는다.\n\n## 2. 시작 전에 확인할 것\n\n아래는 상위 연동까지 포함한 준비 조건이다. 이 브랜치의 MuJoCo 서버는 고정 베이스를 사용하며,\n모바일 베이스의 도착·정지·주행 자세를 조회하는 readiness adapter는 아직 없다.\n\n| 확인 | 통과 조건 | 실패 처리 후보 |\n|---|---|---|\n| 지원 행동 | 승인 경로를 거친 `collect_trash`, `collect_lost_item` | 구조상 오류는 Goal 거절, 분류–skill–목적지 불일치는 이동 전 차단 |\n| backend | mock, 검증 가능한 simulation 또는 준비된 real adapter | `BLOCKED/BACKEND_NOT_READY` |\n| 베이스 상태 | 접근 위치 도착, 베이스 정지와 위치 조건 유효 | `BLOCKED/BACKEND_NOT_READY` |\n| 팔과 그리퍼 | 새 feedback으로 상태와 정지를 확인, 이전 held 또는 fault 없음 | 준비 불가 또는 기존 fault는 실행 차단 |\n| snapshot | 지정 관찰 존재, 기간과 대상 유효 | `BLOCKED/TARGET_UNAVAILABLE` 또는 `STALE_TARGET` |\n| 목적지 | 등록된 수거 목적지, 해당 물체의 크기와 경로 유효 | `BLOCKED/DESTINATION_UNAVAILABLE` |\n| 확인 기능 | 놓은 결과를 검증할 port 준비 | `BLOCKED/VERIFICATION_UNAVAILABLE` |\n| 실행 기록 | ID·인자 충돌과 기존 실행 상태 확인, 시작 기록을 메모리에 반영 | 충돌·미완료 실행은 차단. SQLite 쓰기 실패만으로는 차단하지 않음 |\n\n실물 연동의 베이스 정지 기준, snapshot age와 확인 수단은 아직 정해야 한다.\n준비 전 움직임이 없고 초기 feedback이 부족하면 `BLOCKED`로 끝낼 수 있지만\n`stop_confirmed=true`라고 주장하지 않는다. 이미 움직인 뒤 정지가 불명확하면 `FATAL`이다.\n검증이 준비되지 않은 실물 profile은 사용 가능으로 표시하지 않는다.\n\n## 3. 실행 단계\n\n```mermaid\nflowchart TD\n    V[\"VALIDATING\u003cbr/>입력과 준비 확인\"] --> P[\"PREPARING_TARGET\u003cbr/>대상, grasp와 경로 준비\"]\n    P --> A[\"APPROACHING\u003cbr/>빈 팔 이동과 접근\"]\n    A --> G[\"GRASPING\u003cbr/>그리퍼 닫기\"]\n    G --> L[\"LIFTING\u003cbr/>들기와 잡은 상태 확인\"]\n    L --> T[\"TRANSPORTING\u003cbr/>수거함으로 운반\"]\n    T --> O[\"PLACING\u003cbr/>그리퍼를 열어 놓기\"]\n    O --> R[\"RETURNING_ARM\u003cbr/>목표 자세 복귀\"]\n    R --> C[\"VERIFYING_PLACEMENT\u003cbr/>수거함 내부 확인\"]\n    C --> F[\"FINALIZING\u003cbr/>실행 기록과 Result\"]\n```\n\n| 단계 | 수행과 통과 조건 | 남길 기록 |\n|---|---|---|\n| 입력 검증 | 위 시작 조건 확인 | Goal, profile, 초기 상태 |\n| 대상 준비 | 선택 물체 3D 정보, grasp와 경로 유효 | snapshot, 팔, 계획 참조 |\n| 접근 | 승인된 경로와 최신 제어 feedback으로 완료 확인 | 시작 명령과 접근 결과 |\n| 집기 | 그리퍼 접촉 및 제어 결과 확인 | 물체 상태와 근거 시각 |\n| 들기 | 들어 올린 뒤 잡은 상태 유지 확인 | `HELD` 또는 불명확 상태 |\n| 운반 | 충돌, workspace와 잡은 상태 감시 | 목적지 접근과 이탈 여부 |\n| 놓기 | 목적지 유효성 재확인 후 그리퍼 열기 | 명령 성공과 물체 상태를 구분 |\n| 팔 복귀 | backend의 복귀 목표 자세 도달 확인 | `arm_recovered`, 정지 근거 |\n| 놓은 결과 확인 | 놓은 뒤의 검증이 성공 조건 만족 | 확인 상태와 관찰 시각 |\n| 종료 | 모든 실제 진행 보존 후 Result 반환 | 마지막 완료 단계, 원인과 정지 상태 |\n\n각 motion node는 명령 전과 근거가 생긴 직후 진행을 기록한다. 마지막 단계에서만\n기록하면 집거나 놓은 뒤 실패한 사실을 잃는다. `last_completed_stage`는 성공 근거가\n있는 단계만 갱신한다. 그리퍼 명령 완료만으로 물체 수거를 완료 처리하지 않는다.\n\n모의 구현은 기존 `stage` 안에 `substage`를 추가해 세부 진행을 기록한다.\n예를 들어 `GRASPING`은 그리퍼 닫기와 파지 확인을 구분하며, 확인 전에는\n`HELD`로 갱신하지 않는다. `completed_substages`는 완료된 세부 단계만 보존하고,\n실패한 세부 단계는 `failed_substage`로 반환한다. 재시작 시 이 진행도 유지한다.\n세부 단계가 늘어나도 기존 단계 timeout과 원자 구간 취소 경계는 유지한다.\n\n## 4. InspectScene은 무엇인가\n\n**기존 Perception Action의 이름이다. 선택 물체를 잡기 위해 필요한 정보도 제공한다.**\n\n| 요청 종류 | 기존 입력 | 기존 출력 |\n|---|---|---|\n| 전체 장면 관찰, phase 1 | 빈 `snapshot_id`, `selected_object_id=0` | 2D 검출 목록과 새 snapshot |\n| 선택 대상 준비, phase 2 | 기존 snapshot과 물체 번호 | 해당 대상의 3D, mask 기반 cloud와 주변 cloud |\n\n전체 장면의 최초 관찰과 행동별 재관찰은 Mission Manager가 요청한다.\n서버는 phase 2를 대상 준비 port에서 호출하거나 이미 검증된 3D payload를 받을 수 있다.\n**phase 2는 새 사진으로 책상 전체를 다시 분류하는 요청이 아니다.** 캐시된 관찰에 대해\n선택 물체를 복원한다. 집기 전 실제 위치 확인이 필요하면 선택 대상만 확인하는 port를\n사용하고, 대상이 달라졌으면 Goal을 차단한다. 다른 대상 자동 선택은 하지 않는다.\n\n기존 [InspectScene.action](../../cleany_interfaces/action/InspectScene.action) 오류를 다음처럼 연결한다.\n\n| 기존 Perception 오류 | 행동 오류 후보 |\n|---|---|\n| `ERROR_SNAPSHOT_NOT_FOUND`, `ERROR_INVALID_SELECTION` | `TARGET_UNAVAILABLE` |\n| RGB-D, mask, depth, plane, TF 오류 | 대상 준비 불가 또는 `STALE_TARGET`, 원래 코드도 보존 |\n| detector API, response, internal 오류 | `TARGET_UNAVAILABLE` 또는 `INTERNAL_ERROR`, 원인 보존 |\n| Perception 취소 | 상위 취소이면 `CANCELED`; 예상 밖 하위 취소면 실패 원인으로 기록 |\n\n하위 취소만 받았다고 팔 정지가 확인된 것은 아니다. Action Result가 요구하는 물리\n상태와 상위 취소 요청을 확인한다. snapshot 오류 이름은 기존 `ERROR_SNAPSHOT_NOT_FOUND`를 따른다.\n\n## 5. 놓은 결과 확인\n\n기존 [VerifyPlacement.srv](../../cleany_interfaces/srv/VerifyPlacement.srv)는\n`success`와 `message`만 반환한다. 상세한 센서 판정 enum은 없다.\n\n| 받은 정보 | Mock의 기록·시나리오 | MuJoCo adapter |\n|---|---|---|\n| 유효한 안착 확인 | `CONFIRMED` | 방출 뒤와 팔 복귀 뒤 각각 확인. 나머지 조건 충족 시 `SUCCESS` |\n| 확인 불충족 / `success=false` | `NOT_CONFIRMED`, `FAILED/PLACEMENT_NOT_CONFIRMED` | 확인 기한 안에서 대기 |\n| 확인 timeout 또는 응답 불가 | `UNKNOWN`, `VERIFICATION_TIMEOUT` | `UNKNOWN`, `VERIFICATION_TIMEOUT` 또는 통신 원인 보존 |\n| 시작 시 확인 port 준비 안 됨 | `NOT_CHECKED`, 이동 전 차단 | `BLOCKED/VERIFICATION_UNAVAILABLE`, 집지 않음 |\n\nfalse를 “수거함 밖에 있는 것을 봤다”로 확대하지 않는다. 현재 srv로는 그런 근거를\n보장하지 않는다. action 내부 adapter는 응답 false와 호출 timeout은 구분할 수 있다.\n명시적 위치 판정이 필요하면 srv 확장을 별도 검토한다.\n\nMuJoCo는 방출 직후 `ConfirmRelease`와 팔 복귀 후 `VerifyPlacedObject`에서 독립 검증을 요청한다.\n팔 복귀가 실패했어도 backend가 독립적인 최신\n검증 근거를 제공하면 그 물리 사실을 실패 Result에 보존할 수 있다. 그 경우에도 행동\n상태는 `FAILED`다. 증거를 얻지 못하면 확인 성공을 추정하지 않는다.\n\n기존 자동 sorting 데모의 기본 GUI 관찰 모드는 확인을 끄고 `complete_unverified`를 기록한다.\nMuJoCo BT Action은 독립 확인을 요구한다. 확인 생략 모드를 지원하려면\n별도 profile과 보고 계약을 검토하고, `CONFIRMED`를 허위로 반환하지 않는다.\n\n## 6. 실패와 재시도\n\n| 상황 | 제안하는 결과 | 다음 판단 |\n|---|---|---|\n| 움직임 전 대상 또는 목적지 불가 | `BLOCKED` | Mission Manager가 관찰과 새 제안 검토 |\n| 움직임 전 계획을 만들지 못함 | `BLOCKED`, `GRASP_FAILED` 또는 `MOTION_FAILED` | 실패 원인과 대상 근거 전달 |\n| 접근, 집기, 운반 또는 팔 복귀 실패 | `FAILED` | 동작 종료, 정지와 물체 상태 확인 |\n| 물체 상태 유실 | `FAILED/GRASP_LOST`, `object_state=UNKNOWN` | 자동 놓기 금지, 정지 후 재관찰 |\n| 수거함 내부 확인 실패 | `FAILED` | 놓기 진행과 확인 실패를 함께 기록 |\n| 실제 e-stop 또는 hardware fault | `FATAL` | 하위 안전 경로, 신규 Goal 차단 |\n| 실행 후 정지 확인 불가 | `FATAL/STOP_UNCONFIRMED` | 신규 Goal 차단, 즉시 fault 알림 |\n\n접촉 이후 행동 전체를 내부에서 다시 시작하지 않는다. 준비 단계 조회와 motion 계획은\n새 움직임이 없고 입력이 유효할 때만 설정된 횟수 안에서 retry할 수 있다.\n그 설정과 실행 후 재시도 budget은 별개다. `max_object_attempts`, `max_scan_cycles` 같은\n책상 반복 설정은 이 서버가 소유하지 않는다.\n관측에서 대상이 사라진 사실만으로 수거 성공을 만들지 않는다.\n\n## 7. 취소는 어떻게 처리하는가\n\n**취소 요청을 받으면 다음 정상 단계 시작을 막고, 선택한 취소 모드로 종료한다.**\n새로운 대상이나 수거 행동을 시작하지 않는다. 기본 Action cancel은 `CHECKPOINT`이고,\n`manipulation/cancel` 서비스는 `execution_id/mode`를 받는다.\n\n| mode | 서버 처리 | 종료 때 주의점 |\n|---|---|---|\n| `IMMEDIATE` | 현재 노드와 원자 구간 완료 대기 없이 중단 요청, 실제 정지 확인 | 팔 복귀나 그리퍼 열기 없음 |\n| `CHECKPOINT` | 현재 동작과 완료 확인까지만 수행한 뒤 정지 | 잡기·들기·놓기는 현재 원자 구간까지, 다음 단계 금지 |\n| `RETURN_ARM` | 현재 동작 중단, 정지 확인, 물체를 잡고 있으면 현재 위치에서 놓고 팔 복귀 | 수거함 배치 성공으로 기록하지 않음 |\n\n`RETURN_ARM`의 현재 위치 놓기는 그리퍼 열기 완료에 근거한 초기 구현 정책이다.\n놓기 위치 선택과 별도 이탈 관찰은 후속 검토 대상으로 둔다. 빈 팔은 놓기 동작 없이\n복귀하고, 팔 선택 전이면 정지 후 종료한다. 놓기와 복귀 중에도 `IMMEDIATE`로 선점한다.\n놓기·복귀 실패는 다시 정지 후 실패로 반환하며, 실제 정지 미확인은 기존 FATAL 경로다.\n\n집기, 들기 원자 구간의 범위와 제한 시간은 backend별로 정의해야 한다. 제한 없이\n취소를 지연하거나, 선택한 취소 정책 밖의 운반과 놓기를 새로 시작하지 않는다.\ne-stop과 hardware fault는 이 checkpoint 대기를 우회하는 독립 정지 경로다.\n\n### 정지 확인에 필요한 근거\n\n1. 해당 MoveIt 및 controller goal에 중단을 전달하고 종료 응답을 확인한다.\n2. 명령 뒤의 **새 feedback**으로 팔과 그리퍼 속도를 확인한다.\n3. 설정한 속도 기준과 유지 시간을 만족해야 정지를 확인한다.\n4. 확인 제한 시간 안에 증거를 얻지 못하면 정지 미확인으로 종료하고 실행을 차단한다.\n\n같은 feedback을 여러 번 읽은 것을 연속 새 표본으로 세지 않는다. 제한 시간은\n프로세스의 단조 시계, sensor freshness는 해당 stamp 및 clock 계약으로 따로 관리한다.\nMuJoCo BT 서버의 Action 종료·새 관절 표본 검사는 [BT README](../../cleany_manipulation_bt/README.md#계약과-증거)를\n따른다. 실물 backend의 정지 기준과 해당 계약의 검증은 후속 구현 대상이다.\n\n## 8. 기록, fault와 profile\n\n| 항목 | 구현 요구 후보 |\n|---|---|\n| 시작 기록 | 실행 ID, 인자 hash, snapshot과 대상, profile을 움직임 전에 보관 |\n| 물리 진행 | 집기, 들기, 그리퍼 열기와 확인 근거를 발생 직후 보관 |\n| 종료 | 취소와 예외도 마지막 진행과 원인을 반드시 기록 |\n| 재시작 | 활성 기록은 중단, 자동 재개 금지. Mission Manager에 중단과 마지막 진행 전달, 외부에 사람 확인 필요 보고 |\n| fault 알림 | 안전 경로와 Mission Manager에 즉시 전달. 정확한 진단 topic 또는 port는 구현 시 선택 |\n| fault 해제 | 운영자 권한과 로봇 안전 조건 검사. 물리 e-stop 및 hardware fault를 원격 reset으로 해제하지 않음 |\n| mock profile | 순수 core와 동작 port 검증 |\n| simulation profile | 독립 확인과 stop 근거를 제공하는 simulation adapter |\n| real profile | 실제 feedback, 물리 verifier와 안전 경로가 준비되기 전 비활성 |\n\n이번 모의 구현은 SQLite에 최신 기록과 단계별 이력을 동일 트랜잭션으로 저장한다.\nexecution_id UNIQUE 제약과 DB별 파일 lock을 사용하며 수락 기록과 단계 시작을\n동작 전에 메모리에 반영하고 SQLite 저장을 시도한다. 저장 실패는 실제 동작을 중단하지 않는다.\n같은 프로세스의 중복 검사와 조회는 메모리 기록을 사용한다.\n조회 Service와 복구 이벤트는 Action 명세 및 README를 따른다.\n\n### 재시작 시 서버와 Mission Manager가 처리할 일\n\n**재시작은 작업 도중 프로그램이나 장치가 종료된 뒤 다시 켜지는 상황이다.**\n새 미션 시작과 구분하여 이전 활성 기록을 먼저 확인한다.\n\n| 담당 | 처리할 일 |\n|---|---|\n| Action 서버의 복구 처리 | 이전 실행 ID와 미션 ID, 마지막 진행 및 확인 근거를 보존하고 중단 사실 전달 |\n| 로봇 상태 및 안전 기능 | 현재 팔, 그리퍼, 들고 있는 물체와 정지 여부 확인. 확인 전 새 물리 실행 차단 |\n| Mission Manager | 이전 미션을 자동 재개하지 않고 중단과 사람 확인 필요를 보고 자료에 반영 |\n| 외부 상태 adapter | Backend에 중단과 사람 확인 필요 전달. 연결이 없으면 보고를 보관하고 재연결 시 전달 |\n\n기록에 집기 명령이 있다는 것만으로 현재 물체를 들고 있다고 확정하지 않는다.\n재시작했다는 이유만으로 정상 취소 또는 안전 정지 완료를 보고하지 않는다.\n오류 reset이 허용되어도 이전 미션이 자동 재개되지는 않는다.\n중단 보고 및 사람 확인 필요는 [KB 운영 규칙](../../../../docs/cleany-docs/20_TECHNICAL/02%20-%20Robot%20Operations%20and%20Mission%20Dispatch.md)의 요구이며,\n조회 Service와 복구 이벤트는 모의 서버에 구현했다. Backend 재전송 저장소와\nMission Manager adapter는 후속 구현 대상이다.\n\n### 설정 목록 후보\n\n| 설정 | 용도 |\n|---|---|\n| `observation_max_age_sec`, `target_check_timeout_sec` | 관찰 기간과 선택 대상 확인 |\n| `preparation_timeout_sec`, `preparation_max_retries` | 움직임 전 준비와 제한된 retry |\n| `motion_timeout_sec`, `placement_check_timeout_sec` | motion과 놓은 결과 확인 |\n| `stop_timeout_sec`, `stationary_velocity_limit`, `stationary_duration_sec` | 새 feedback 기반 정지 판정 |\n| `execution_record_retention_sec` | 중복 방지 기록 보관 |\n| backend별 베이스, 팔과 그리퍼 readiness 기준 | 시작 및 복귀 허용 조건 |\n\n실물 backend의 기본값은 미정이다. 모의 단계 0.5초·정지 확인 0.1초,\n준비·확인 제한 5초·동작 제한 10초·정지 제한 1초는 package YAML에 둔다.\n자동 재시도는 0회이며 실제 로봇의 안전 수치로 사용하지 않는다. 현재\n`arm_stationary_velocity_rad_s=0.02`, `arm_stationary_samples=5`는 기존 구현값이다.\nMuJoCo BT는 sample count, 지속 시간과 관절별 freshness를 함께 검증한다.\n실제 parameter 이름과 기본값은 [BT 정지 판정 설정](../../cleany_manipulation_bt/docs/execution_contract.md#정상-수거의-놓기정지-확인)을 따른다.\n\n## 9. 기존 코드에서 재사용할 부분\n\n| 코드 | 재사용하는 부분 | 현재 적용·후속 작업 |\n|---|---|---|\n| [sorting.py](../cleany_skill_executor/core/sorting.py) | pick, transport, release, retreat와 verify 순서 | MuJoCo BT core가 동작별 진행과 typed Result를 관리 |\n| [sorting_coordinator.py](../cleany_skill_executor/sorting_coordinator.py) | 준비, grasp, motion과 stop port | MuJoCo BT backend에서 개별 동작 재사용. 전체 반복은 별도 데모 |\n| [nearest_pregrasp_coordinator.py](../cleany_skill_executor/nearest_pregrasp_coordinator.py) | grasp 선택과 arm 동작 | ROS wrapper와 core port 분리 필요 |\n| Mission Manager core | 미션 요청과 기존 결과 envelope | 승인된 high-level 행동, 재관찰과 취소 adapter 필요 |\n\n현재 `sorting_required_categories`는 simulation demo에\n남는다. 제품 `collect_trash`에는 분실물과 handoff를 자동 포함하지 않는다.\n팔 동작을 재사용할 때 시뮬레이션 좌석 순회와 물체 선택까지 서버로 가져오지 않는다.\n\n관련 문서: [Action 명세](02_execute_manipulation_skill_action_spec.md),\n[Mission 연동 후속 작업](manipulation.md#mission-연동-후속-작업), [설계 안내](01_manipulation_action_design.md).\n\n## 10. 모의 서버의 구현 경계\n\n정상 단계는 3절의 순서로 진행한다. core는 비동기 port를 poll하며 ROS timer는\n20Hz steady clock을 사용한다. `CHECKPOINT`는 현재 단계를 완료하고,\n`IMMEDIATE/RETURN_ARM`은 현재 동작을 중단한 뒤 정지 확인으로 처리한다. fault는 checkpoint 대기를\n우회하고 `FATAL`로 신규 실행을 차단한다. 취소와 Result 확정은 하나의 lock으로 직렬화한다.\n\n재시작 시 활성 기록은 `INTERRUPTED`, 사람 확인 필요로 전환하고 마지막 물리 근거를\n보존한다. Action Result를 생성하거나 이전 Goal을 자동 재개하지 않는다.\nfault·중단·물체 보유·상태 불명은 신규 Goal을 차단하며 reset은 없다.\n실행 기록 저장 실패는 경고 로그로 남기고 실제 실행의 status와 error_code를 유지한다.\n저장 실패만으로 동작이나 신규 Goal을 차단하지 않는다. 함께 발생한 hardware fault·e-stop·\n정지 미확인과 물체 보유·상태 불명에 따른 차단은 유지한다.\n메모리 기록의 `FINISHED`는 실행 종료를 뜻하며 디스크 저장 완료를 보장하지 않는다.\n기동 시 DB 초기화와 기존 이력 읽기는 필수다. 재시작 복구와 재시작 이후 중복 검사는\n디스크 기록만 사용하며 미저장 메모리 기록은 유실된다.\n\nMock adapter는 실제 제어기 feedback, VLA, 실물 verifier 또는 베이스 readiness를\n검증하지 않는다. 해당 backend와 권한·복구·원격 전달 계약은 별도로 구현해야 한다.\n"},"ros2_ws/src/cleany_skill_executor/docs/06_manipulation_behavior_tree_design.md":{"title":"06. Manipulation 행동 내부의 Behavior Tree와 Groot2","body":"# 06. Manipulation 행동 내부의 Behavior Tree와 Groot2\n\n> **모의 서버용 정적 설계 미리보기.** 이 XML과 포트는 표시·설계 자료다.\n> 현재 ROS Action wrapper는 Python 모의 core를 실행하며 이 XML을 실행하지 않는다.\n> 실제 MuJoCo BT.CPP 실행기는 [cleany_manipulation_bt](../../cleany_manipulation_bt/README.md)에 별도 구현되어 있다.\n\n| 트리 | 용도 | 실행·표시 방식 |\n|---|---|---|\n| [groot2_table_cleanup.xml](groot2_table_cleanup.xml) | 모의 서버의 설계·모니터 표시 | Python 모의 core의 이벤트를 투영 |\n| [collect_trash_mujoco.xml](../../cleany_manipulation_bt/trees/collect_trash_mujoco.xml) | MuJoCo Action의 실행 순서 | BehaviorTree.CPP 4 실행기 |\n\n로컬 테스트에서는 [VS Code 모니터 브리지](manipulation_mock_usage.md#vs-code에서-로컬-트리-모니터링)로\n모의 core의 실행 이벤트를 XML 노드 상태에 투영할 수 있다. 이 표시는 BT.CPP 실행기 채택이나\nXML tick 실행을 의미하지 않는다.\n\n## 1. 무엇을 트리로 보여주는가\n\n**이번 트리는 `collect_trash` 행동 하나의 내부 순서를 보여준다.**\n\n| 바깥 흐름 | 트리 내부 |\n|---|---|\n| Mission Manager와 Planner의 제안, 승인 및 재관찰 | 대상 준비, 접근, 집기, 들기, 운반, 놓기, 팔 복귀와 확인 |\n| 다음 물체 선택, 책상 완료와 미션 보고 | 현재 행동의 진행, 실패 처리와 결과 보관 |\n\n여러 물체는 바깥 흐름에서 Goal을 다시 승인해 처리한다. XML 안에 전체 책상\nscan 반복이나 Planner 호출을 넣지 않는다.\n\n| 준비 또는 인식 과정 | 실행 위치 |\n|---|---|\n| Action 서버 시작, 모델 로딩과 워밍업 | 서비스 시작 과정. 수거 Goal마다 다시 실행하지 않음 |\n| 책상 전체 최초 관찰, 대상 선택과 승인 | 상위 Mission Manager 및 Perception 흐름 |\n| 모델과 실행 backend 준비 여부 확인 | 수거 트리의 `ValidateGoal` |\n| 전달받은 관측 확인, 선택 물체 3D 복원과 파지 준비 | 수거 트리의 `PREPARING_TARGET` 세부 단계 |\n\n이 문서의 모의 경로에서 준비 확인과 인식 관련 세부 단계는 모의 결과다.\nMuJoCo BT 경로는 실제 모델과 Perception을 사용하며 위 링크의 실행 계약을 따른다.\n\n## 2. 정상 경로와 실패 경로\n\nXML의 정상 경로는 네 개의 Sequence 그룹으로 묶는다. 세부 실행 순서는 유지한다.\n\n| 그룹 | 세부 단계 |\n|---|---|\n| 준비 | 모델과 실행 준비 확인, 대상 관측 확인, 선택 물체 3D 복원, 파지 후보 생성, 팔과 경로 결정 |\n| 물체 잡기 | 잡기 전 위치 이동, 물체 접근, 그리퍼 닫기, 파지 확인, 물체 들어 올리기, 보유 상태 확인 |\n| 물체 놓기 | 수거함 이동, 놓을 위치 확인, 그리퍼 열기, 물체 이탈 확인, 팔 복귀 |\n| 확인과 종료 | 놓은 결과 확인, 성공 결과 보관 |\n\nVS Code 모니터에서는 그룹도 자식 단계의 진행·완료·실패를 표시한다.\nXML을 변경한 뒤에는 브리지를 재시작하고 뷰어의 Monitor를 다시 연결한다.\n\n```mermaid\nflowchart TD\n    N[\"승인된 Goal\"] --> V[\"검증과 대상 준비\"]\n    V --> A[\"접근\"] --> G[\"집기\"] --> L[\"들기와 잡은 상태 확인\"]\n    L --> T[\"운반\"] --> P[\"그리퍼를 열어 놓기\"]\n    P --> R[\"팔 복귀\"] --> C[\"놓은 결과 확인\"]\n    C --> OK[\"성공 결과 보관\"]\n    V -.->|\"차단 또는 실패\"| STOP[\"동작 종료와 상태 확인\"]\n    A -.-> STOP\n    G -.-> STOP\n    L -.-> STOP\n    T -.-> STOP\n    P -.-> STOP\n    R -.-> STOP\n    C -.-> STOP\n    STOP --> ERR[\"실제 진행과 실패 결과 보관\"]\n```\n\n`Sequence`는 노드를 순서대로 실행한다. 한 노드가 실패하면 뒤의 정상 노드는 실행하지 않는다.\n`Fallback`은 정상 Sequence 실패 후 종료 및 결과 보관 경로를 실행한다.\nBT의 SUCCESS와 FAILURE는 실행 순서 제어용 값이며 ROS Action의 최종 상태와 별도다.\n예를 들어 준비 차단은 BT 정상 경로 실패여도 Result는 `BLOCKED`일 수 있다.\n\n## 3. XML에서 보여주는 노드\n\n| 노드 | 동작 | 대응 Feedback |\n|---|---|---|\n| `ValidateGoal` | 모델과 실행 준비 확인 | `VALIDATING` |\n| `PrepareTarget` | 전달받은 대상 관측 확인 | `PREPARING_TARGET` |\n| `ReconstructTarget` | 선택 물체 3D 복원 | `PREPARING_TARGET` |\n| `GenerateGrasp` | 파지 후보 생성 | `PREPARING_TARGET` |\n| `SelectArmAndPath` | 팔과 경로 결정 | `PREPARING_TARGET` |\n| `MoveToPregrasp` | 잡기 전 위치 이동 | `APPROACHING` |\n| `ApproachObject` | 물체 접근 | `APPROACHING` |\n| `GraspObject` | 그리퍼 닫기 | `GRASPING` |\n| `ConfirmGrasp` | 파지 확인 | `GRASPING` |\n| `LiftObject` | 물체 들어 올리기 | `LIFTING` |\n| `ConfirmHeld` | 보유 상태 확인 | `LIFTING` |\n| `CarryObject` | 물체를 든 채 목적지 이동 | `TRANSPORTING` |\n| `CheckPlacementTarget` | 놓을 위치 확인 | `PLACING` |\n| `OpenGripperAtDestination` | 그리퍼 열기 | `PLACING` |\n| `ConfirmRelease` | 물체 이탈 확인 | `PLACING` |\n| `ReturnArm` | backend의 목표 자세로 복귀 | `RETURNING_ARM` |\n| `VerifyPlacedObject` | 놓은 뒤 수거함 내부 확인 | `VERIFYING_PLACEMENT` |\n| `FinalizeSuccess` | 성공 조건과 기록 확인, Result 생성 | `FINALIZING` |\n| `StopAndAssess` | 하위 goal 종료, 정지와 물체 상태 확인 | `STOPPING` |\n| `ReleaseInPlace` | `RETURN_ARM` 취소 중 현재 위치에서 그리퍼 열기 | `RELEASING_IN_PLACE` |\n| `ReturnArmAfterCancel` | `RETURN_ARM` 취소 중 팔 복귀 | `RECOVERING_ARM` |\n| `FinalizeFailure` | 차단, 실패, 취소 또는 fault Result 보관 | `FINALIZING` |\n\n동작 노드는 명령 전과 물리 근거를 얻은 직후 진행을 기록한다. 집기와 그리퍼 열기\n기록을 트리 끝의 Finalize에만 맡기지 않는다. 물체를 놓은 뒤 검증이 실패해도 놓기\n명령과 실제 물체 상태를 보존한다.\n\n모의 서버는 큰 `stage` 안의 현재 `substage`와 `completed_substages`를 기록한다.\n브리지는 완료 이벤트가 있는 세부 단계만 초록색으로 표시한다. 그리퍼 닫기 완료는\n물체 보유 근거가 아니며, 이탈 근거가 없는 `release_unobserved` 시나리오에서는\n`ConfirmRelease`를 완료로 표시하지 않는다. 이후 독립 수거함 확인으로 성공할 수 있다.\n세부 단계 추가가 기존 집기, 들기와 놓기의 원자 구간 취소 규칙을 바꾸지는 않는다.\n\n기본 `CHECKPOINT` 외의 취소 방식과 복귀 경로의 제한은\n[취소 계약](02_execute_manipulation_skill_action_spec.md#취소-방식과-서비스)을 따른다.\n모의 XML의 복귀 노드는 이벤트 표시용이며 수거함 배치 성공을 나타내지 않는다.\n\n`VerifyPlacedObject`는 이번 verified Action에서 생략하지 않는다. 확인 기능이 없으면\n시작 검증에서 차단한다. 기존 GUI simulation의 확인 생략 경로는 별도 demo다.\n\n## 4. Blackboard와 포트 후보\n\n| Blackboard key | 내용 |\n|---|---|\n| `goal` | 승인된 Action Goal |\n| `execution` | 물체와 팔 상태, 마지막 완료 단계, 계획과 검증 근거 |\n| `error` | 원인과 실패 단계. 시작 시 NONE |\n| `result` | 최종 Action Result |\n\n| XML 포트 | 방향 | 연결 |\n|---|---|---|\n| `goal` | 입력 | `{goal}` |\n| `context_in` | 입력 | `{execution}` |\n| `context_out` | 출력 | `{execution}` |\n| `error` | 오류 출력 또는 종료 노드 입력 | `{error}` |\n| `error_in`, `error_out` | 종료 분석의 입력과 출력 | `{error}` |\n| `result` | 출력 | `{result}` |\n\n`SkillGoal`, `SkillContext`, `SkillError`와 `SkillResult`는 화면 표시용 타입 이름이다.\n현재 C++ 또는 Python class가 있다는 뜻이 아니다. 실제 typed 모델과 변환 규칙은 구현해야 한다.\nGroot2에서 포트와 연결 이름을 볼 수 있지만 정적 XML에 센서 값이나 실시간 객체는 없다.\n\n## 5. 실패, 취소와 halt 처리 계약\n\n기본 취소는 `CHECKPOINT`다. 현재 노드를 마치고, 잡기·들기·놓기에서는 원자 구간의\n확인까지 완료한다. `IMMEDIATE`는 현재 완료를 기다리지 않고 중단한다. `RETURN_ARM`은\n현재 작업 중단과 정지 확인 뒤 물체를 잡고 있으면 그 자리에서 놓고 팔을 복귀한다.\n현재 위치 놓기의 별도 안착 검증은 초기 정책에 포함하지 않는다. native MuJoCo 트리는\n복귀 뒤 정지를 다시 확인하고 복귀 실패 시 정지 평가로 연결한다.\n[native BT 구현](../../cleany_manipulation_bt/README.md)의 실패 경로를 따른다.\n\n| 상황 | 처리 후보 |\n|---|---|\n| 일반 node FAILURE | Fallback의 StopAndAssess와 FinalizeFailure 실행 |\n| 정지 근거 없음 | 종료 분석 context에 `stop_confirmed=false`, FATAL 원인 기록 |\n| `halt()` 또는 예외 | 실행 host가 try/finally로 동일한 종료 및 보관 port 실행 |\n| 비상 정지 | controller 및 hardware 안전 경로 우선, tree tick을 기다리지 않음 |\n| 기록 실패 | 경고 전달, 실제 실행 상태 유지. 저장 실패만으로 동작·신규 Goal을 차단하지 않음 |\n\n`StopAndAssess`의 SUCCESS는 **분석을 마쳤다**는 제어 값이다. 정지가 성공했다는\n뜻으로 사용하지 않는다. 정지 미확인도 context와 error에 담아 FinalizeFailure까지\n전달한다. 정지 분석 자체가 예외로 끝나면 host의 종료 port가 UNKNOWN 상태를 보관한다.\n\n트리가 halt되면 Fallback까지 tick될 것이 보장되지 않는다. 따라서 XML의 실패 경로만으로\n취소 처리를 완성했다고 볼 수 없다. 종료 보관은 `execution_id` 기준 멱등 처리하고,\n트리와 host가 모두 호출해도 결과를 중복 작성하거나 물체를 다시 움직이지 않아야 한다.\n\n자동 `RetryUntilSuccessful`, 전체 행동 반복 또는 무조건 성공 decorator는 넣지 않는다.\n준비 조회 retry는 서버 설정과 node 계약에서 제한하고, 접촉 이후 새 시도는 Mission\nManager의 재관찰 및 승인을 따른다.\n\n## 6. Groot2에서 열기\n\n[groot2_table_cleanup.xml](groot2_table_cleanup.xml)의 기본 트리는 `CollectTrashSkill`이다.\n파일명은 table_cleanup이지만 실행 범위는 행동 하나다.\n\nGroot2의 Load Project or File 메뉴에서 위 XML을 열고 `CollectTrashSkill`을 선택한다.\nGUI 설치는 사용하는 OS와 architecture에 맞춰 별도로 준비한다. 이 XML은 정적 설계\n미리보기이며, 현재 서버의 실제 C++ 트리 상태는 [MuJoCo BT 모니터](../../cleany_manipulation_bt/README.md#기록과-모니터)를 사용한다.\n\n## 7. Groot2 실시간 연결의 후속 작업\n\n아래는 이 정적 XML을 Groot2와 실제 실행기로 연결할 때의 작업이다.\n현재 MuJoCo 실행기는 별도 XML과 VS Code용 모니터를 사용한다.\n\n1. 사용자 정의 node와 typed port를 실제 BT.CPP factory에 등록한다.\n2. Goal마다 context를 생성하고 tick, feedback, cancel과 halt를 연결한다.\n3. 실제 factory에서 `writeTreeNodesModelXML`로 모델을 생성한다.\n4. `Groot2Publisher`와 사용 중인 Groot2 edition 및 연결 조건을 확인한다.\n\n공식 [Groot2 연동 안내](https://behaviortree.dev/docs/tutorial-basics/tutorial_11_groot2/)는\nfactory의 node 모델과 publisher 연결을 설명한다. 현재 손으로 쓴 모델은 실행기 구현\n전의 설계 자료다. 실시간 지원은 사용 중인 edition 조건도 확인해야 한다.\n\n## 8. 이번 파일 검증과 제한\n\nXML 구문, node 모델, 포트 이름과 Blackboard 연결을 정적으로 검사한다.\nGroot2 GUI import와 실제 BT.CPP 동작, 취소 및 물리 정지 검증은 별도다.\nXML을 여는 것만으로 Action 서버가 생기거나 로봇이 움직이지 않는다.\n\n관련 문서: [서버 명세](03_manipulation_server_behavior_spec.md),\n[Action 명세](02_execute_manipulation_skill_action_spec.md), [설계 안내](01_manipulation_action_design.md).\n"},"ros2_ws/src/cleany_skill_executor/docs/grasp_selection_and_pregrasp.md":{"title":"Grasp 선택과 pre-grasp 실행","body":"# Grasp 선택과 pre-grasp 실행\n\n[패키지 안내로 돌아가기](manipulation.md)\n\n## 상태\n\n점수순 grasp 후보를 양팔 MoveIt plan-only 검증으로 평가한다. 운영 action은 실제\ntrajectory와 gripper 명령을 실행하지 않는다. 스터디카페 수거 시뮬레이션에서 선택 결과를\nMuJoCo arm controller로 실행할 수 있다. `nearest_pregrasp_coordinator`는 perception이\n제공한 거리 유효 객체를 가까운 순서로 시도한다. 기본\n`execute_grasp_and_lift=false`에서는 첫 reachable grasp의 pre-grasp까지만 실행하고,\n옵션을 켜면 재인식과 Pilz LIN 기반 접촉 파지·후퇴·상승까지 수행한다.\n\n## Reachable grasp action\n\n`grasp/select_reachable` (`SelectReachableGrasp`)는 가까운 팔부터 IK, state validity,\ncurrent→pre-grasp와 pre-grasp→grasp plan을 검사한다. pre-grasp는 접근 벡터 반대 방향\n0.14 m다. 5축 position-only IK의 방향 손실을 막기 위해 먼저 TCP 위치 IK로 seed를 만든\n뒤, TCP의 실제 `-Y` 접근축 앞 0.14 m에 있는 가상 aim tip을 grasp point에 맞춘다. 이로써\n물리 gripper가 선택 객체를 바라보는 것은 강제된다. 위치 seed가 실패하면 현재 joint\nstate에서도 계속 시도하며, 전체 arm joint limit 안에 분산한 팔당 8개 seed에서 허용\n오차를 만족하는 해는 현재 상태 대비 joint-limit 정규화 이동량으로 정렬하고 wrist\nroll에는 2배 가중치를 둔다. 자세 오차는 동률 해의 tie-break로만 사용한다. 5축 기구가 정확한\n후보 방향을 만들 수 없는 경우에는 접근축 최대 15도, parallel-jaw 대칭을 고려한 closing\n축 최대 30도 안에서 가장 가까운 실행 가능 방향을 허용한다. 그보다 큰 오차는 다음 arm\n또는 후보로 fallback한다. grasp 위치에서도 TCP 위치·접근축·closing 축을 FK로 다시\n검사한다. 한 해의 validity 또는 planning이 실패하면 같은 팔의 다음 grasp/pre-grasp\n해를 먼저 시도한 뒤 반대 팔과 다음 후보로 넘어간다. 선택 오차는 selector 로그에 남긴다.\n\n## 제공 계약\n\n실행 결과는 Mission Manager가 상태 전이에 사용할 수 있는 성공·실패·차단 결과로 반환한다.\nSkill Executor는 Mission Manager의 FSM 상태를 직접 변경하지 않는다.\n\n## 설정 및 검증\n\n입력 후보는 snapshot/object/frame/target OBB가 같고 frame은 설정된 `planning_frame`과\n일치해야 한다. 현재 12개 arm/gripper joint는 완전하고 0.5초 이내여야 한다. action\n동안 target OBB와 ACM은 임시 변경되고, 복원에 성공한 뒤에만 최종 성공·실패·취소\n상태를 확정한다. 복원 실패는 planning-scene 오류로 반환한다. 한 번에 goal 하나만\n처리한다.\n\n```bash\nros2 launch cleany_moveit_config mock_planning.launch.py\nros2 launch cleany_skill_executor grasp_selection.launch.py\npytest -q ros2_ws/src/cleany_skill_executor/test\n```\n\n테스트는 기능별로 묶는다. `test_seeded_cartesian.py`는 경로 보간·자세 보정·URDF FK,\n`test_gripper_geometry.py`는 폭 보정·접촉 판정·피드백 안정화,\n\n\nplanning frame, timeout, planning attempt/scaling, 최대 후보 수는\n`config/grasp_selection.yaml`의 ROS parameter로 설정한다. timeout/cancel은 각 IK,\nstate-validity와 planning 단계 전후에 확인한다.\n\nsimulation 실행은 planning attempts 3, velocity/acceleration scaling 0.08,\nMoveGroup replan 2회와 0.25초 delay를 사용한다. controller 실패 시 joint별 tracking\nerror를 기록하고 현재 상태에서 한 번만 같은 joint goal로 안전 재계획한다.\n\n## 가까운 객체 자동 pre-grasp\n\n`nearest_pregrasp_coordinator`는 다음 순서로 한 번의 작업을 수행한다.\n\n```text\nInspectScene 1차 detection\n→ distance_valid 후보를 base_link 거리순 정렬\n→ selected-object inspection\n→ PlanGrasp\n→ SelectReachableGrasp\n→ target OBB를 충돌물로 유지하며 pre-grasp 실행\n→ (execute_grasp_and_lift=true) 새 RGB-D 재인식과 동일 arm 재선택\n→ Pilz LIN 접근 → gripper 접촉 → LIN 역접근 → LIN 수직 상승\n```\n\n양쪽 gripper는 object evaluation 전에 open한다. 따라서 MoveIt 후보 검증과 실제 실행이\n동일한 gripper joint state 및 collision geometry를 사용한다.\n\n가장 가까운 객체가 segmentation, grasp 생성 또는 양팔 도달성 검사에서 실패하면 다음\n가까운 객체로 fallback한다. depth가 불충분해 `distance_valid=false`인 detection은\n자동 조작에서 제외한다. infrastructure, MoveIt 또는 controller 실패는 다른 객체로\n넘기지 않고 전체 작업을 실패시킨다.\n\nRGB-D camera, `perception/inspect_scene`, `grasp/plan`,\n`grasp/select_reachable`, MoveGroup과 arm/gripper controller를 먼저 실행한 뒤 coordinator를\n시작한다.\n\n```bash\nros2 launch cleany_skill_executor nearest_pregrasp.launch.py\n```\n\nquery, timeout, 속도/가속도 scaling과 gripper open 위치는\n`config/nearest_pregrasp.yaml`에서 설정한다. pre-grasp joint target은 운영 selector가\naim-tip IK와 FK 방향 검증까지 통과한 결과를 사용한다. 성공한 target OBB는 완료 자세에서\nPlanning Scene에 유지하며, 실패하거나 coordinator가 종료될 때 기존 ACM과 함께 복원한다.\n\nStudy-cafe의 네 물체를 대상으로 인식부터 접촉 집기와 후퇴까지 실행하려면 다음 launch를\n사용한다.\n\n```bash\nros2 launch cleany_skill_executor study_cafe_nearest_grasp_demo.launch.py\n```\n\n기본값은 YOLOE-seg instance mask + Gemini 3.1 Flash-Lite 상세 분류 설정이다. 기존 color adapter는\n과거 머그컵/휴대폰/지우개 fixture 전용이며 현재 종이컵/레고/휴지에 대응하지 않는다.\n이 study-cafe MuJoCo launch의 YOLOE 기본 체크포인트는\n`~/models/yoloe/study_cafe_sim_yoloe26s_seg.pt`다. 현재 시뮬레이션 head 영상으로\nfine-tune한 파일이며, 생성·학습·평가 절차는\n[`cleany_perception/README.md`](../../cleany_perception/docs/runtime.md#스터디카페-mujoco-전용-yoloe-seg-학습)에 있다.\n손목 HANDOFF는 별도 `~/models/yoloe/study_cafe_sim_all_views_yoloe26s_seg.pt`를\n`wrist_yoloe_model_path`로 로드한다. 오른손목 HANDOFF는 head 체크포인트를\n`wrist_right_yoloe_model_path`로 재사용한다. 실제 컵 pregrasp 오른손목 프레임에서\nhead 모델은 컵을 confidence 0.726으로 검출했고, 양손목 바닥 학습 모델은 검출하지\n못했다. 파지 후 CHECK는\n`~/models/yoloe/study_cafe_sim_held_yoloe26s_seg.pt`를\n`wrist_check_yoloe_model_path`로 로드한다. Head 모델은 기존 학습본을 유지한다. 왼손목\n시점 holdout의 마스크 IoU 0.5 일치율은 52/80→68/80으로 개선됐지만, 새 모델을\nhead에 쓸 때는 71/80→64/80으로 하락했기 때문이다. 오른손목에서 실제 라벨이\n있는 컵·휴지의 일치율은 38/40→36/40이었다. 이 수치는 고정 시뮬레이션 자세와\n별도 생성 영상의 평가이며 실제 집기 성공률을 뜻하지 않는다. 학습 결과의 `best.pt`를\n각 손목 경로로 복사해 사용한다. 파지 후 레고 holdout은 CHECK 모델에서 18/20으로\n개선됐으나, 같은 모델의 파지 후 컵·마우스·휴지 검출은 아직 0/10이다. 실제 카메라 영상에 대한 성능은\n검증하지 않았으며, 실물 실행에는 별도 검증된 checkpoint를 `yoloe_model_path`로 지정한다.\n스터디카페 기본 실행은 왼손목 마우스 CHECK에\n`wrist_mouse_check_yoloe_model_path`의 전용 모델을 쓴다. 실제 MuJoCo 실패\n프레임에서 기존 모델은 마우스 검출 0건, 전용 모델은 신뢰도 0.25였고, 마우스\n단독 및 전체 실행에서 파지 후 CHECK를 통과했다. 오른손목 CHECK의 컵 전용\n모델이 물체를 놓치면 기존 파지 후 통합 모델로 같은 RGB를 재검사한다. 실제\nMuJoCo 휴지 CHECK 프레임에서 컵 전용 모델은 검출 0건, 통합 모델은 휴지를\n신뢰도 0.364로 검출했다. 두 추가 검사 모두 예상 물체의 투영 위치와 mask\n검증을 통과해야 한다.\nYOLOE 추론의 최소 confidence는 0.08이고, 클래스별로 컵·마우스·휴지는 0.25,\n레고는 0.08을 적용한다. 다른 클래스 목록이나 모델로 바꿀 때는\n`yoloe_class_confidence_thresholds`도 같은 순서로 조정해야 한다.\n시뮬레이션 수거 정책 `table_sorting_policy.yaml`의 최종 최소 confidence도 0.08로\n맞췄다. 레고 외 물체는 YOLOE 단계에서 먼저 0.25 미만을 제거한다.\n다른 YOLOE checkpoint는 `yoloe_model_path`로 지정할 수 있다.\n전체 파이프라인 실행은 [스터디카페 실행 안내](study_cafe_sorting_usage.md)를 따른다.\n"},"ros2_ws/src/cleany_skill_executor/docs/interfaces.md":{"title":"cleany_skill_executor 노드 인터페이스","body":"# cleany_skill_executor 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## grasp_selection_server\n\n실행 파일: `grasp_selection_server`. 원본: [grasp_selection_node.py](../cleany_skill_executor/grasp_selection_node.py), [moveit_adapter.py](../cleany_skill_executor/moveit_adapter.py), [planning_scene.py](../cleany_skill_executor/planning_scene.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | R20; `joint_state_topic` |\n| 액션 제공 | `grasp/select_reachable` | `cleany_interfaces/action/SelectReachableGrasp` | Action 기본값 |\n| 서비스 호출 | `/compute_ik` | `moveit_msgs/srv/GetPositionIK` | Service 기본값 |\n| 서비스 호출 | `/check_state_validity` | `moveit_msgs/srv/GetStateValidity` | Service 기본값 |\n| 서비스 호출 | `/apply_planning_scene` | `moveit_msgs/srv/ApplyPlanningScene` | Service 기본값 |\n| 서비스 호출 | `/get_planning_scene` | `moveit_msgs/srv/GetPlanningScene` | Service 기본값 |\n| 액션 호출 | `/move_action` | `moveit_msgs/action/MoveGroup` | Action 기본값; plan-only |\n\n도달성 검사 action이며 controller 실행을 제공하지 않는다.\n\n현재 조작 실행은 [nearest-pregrasp와 sorting 계약](manipulation.md)을 따른다. 이전 demo coordinator는 제거됐다.\n\n## manipulation_server\n\n실행 파일: `manipulation_server`. 원본: [manipulation_node.py](../cleany_skill_executor/manipulation_node.py). Mock launch는 `/mock` namespace를 적용한다.\n\n| 종류 / 방향 | 기본 상대 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 액션 제공 | `manipulation/execute_skill` | `cleany_interfaces/action/ExecuteManipulationSkill` | Action 기본값 |\n| 서비스 제공 | `manipulation/get_execution` | `cleany_interfaces/srv/GetManipulationExecution` | Service 기본값 |\n| 서비스 제공 | `manipulation/cancel` | `cleany_interfaces/srv/CancelManipulation` | Service 기본값 |\n| 토픽 발행 | `manipulation/execution_events` | `cleany_interfaces/msg/ManipulationExecutionRecord` | Reliable, transient-local depth 100; record 변경 시 |\n| 서비스 호출 | `manipulation/execute_skill/_action/cancel_goal` | `action_msgs/srv/CancelGoal` | 정확한 Goal의 cancel 응답 경로 |\n\nTick 기본 주기는 steady clock 0.05초다. 물리 명령 publisher는 없다. Mission은 취소 service의 별도 모드 대신 ROS Action cancel의 CHECKPOINT를 사용한다.\n\nAction 이름을 remap하면 서버와 내부 CancelGoal client가 같은 해결된 이름을 사용한다. 예를 들어 `manipulation/execute_skill:=/custom/execute`에서는 내부 취소 요청도 `/custom/execute/_action/cancel_goal`로 전달한다.\n\n수락, 기록과 취소의 의미는 [공통 Action 계약](../../cleany_interfaces/docs/observation-contracts.md#단일-물체-manipulation-action)을 따른다.\n\n## arm_health_monitor\n\n실행 파일: `arm_health_monitor`. 원본: [arm_health_node.py](../cleany_skill_executor/arm_health_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `system/component_health` | `cleany_interfaces/msg/ComponentHealth` | R10; 20 Hz; `health_topic`, `source=arm` |\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `joint_states_topic` |\n| 서비스 호출 | `controller_manager/list_controllers` | `controller_manager_msgs/srv/ListControllers` | Service 기본값; `poll_s` 0.5초, `controller_manager` |\n\n설정한 arm controller(`controllers`)가 모두 `active`이고 설정한 관절(`joints`)의 위치가 fresh, finite일 때만 AVAILABLE이다. Controller 상태를 확인할 수 없거나 관절을 한 번도 받지 못했으면 UNKNOWN, 비활성 또는 끊긴 feedback은 UNAVAILABLE이다. 가용성만 보고하며, 현재 팔 상태로 base가 움직여도 되는지는 Mission Runtime이 조작 결과의 `safe_to_drive`로 판단한다. 실물 arm controller에서는 검증하지 않았다.\n\n## manipulation_monitor\n\n실행 파일: `manipulation_monitor`. 원본: [manipulation_monitor_node.py](../cleany_skill_executor/manipulation_monitor_node.py).\n`event_topic` 기본값 `/mock/manipulation/execution_events`를 Reliable, transient-local,\ndepth 100으로 구독한다. `monitor_port`의 localhost ZeroMQ REP socket은 읽기 전용\n트리 상태를 제공하며 ROS Action을 실행하거나 취소하지 않는다.\n\n## manipulation_test_client\n\n실행 파일: `manipulation_test_client`. 원본: [manipulation_client.py](../cleany_skill_executor/manipulation_client.py).\n`namespace` 옵션으로 선택한 서버의 `manipulation/execute_skill` Action과\n`manipulation/get_execution`, `manipulation/cancel` 서비스를 호출한다.\n요청, 취소와 결과 확인 예시는 [실행 안내](manipulation_mock_usage.md)를 따른다.\n"},"ros2_ws/src/cleany_skill_executor/docs/manipulation.md":{"title":"cleany_skill_executor","body":"# cleany_skill_executor\n\n```mermaid\nflowchart TD\n  Observe[\"관찰과 대상 선택\"] --> Plan[\"MoveIt 도달성 · 충돌 검사\"]\n  Plan --> Execute[\"접근 · 파지 · 운반\"]\n  Execute --> Verify[\"재관측 · 놓기 · 팔 복귀\"]\n  Verify --> Stop[\"정지 확인과 결과\"]\n  Execute -->|\"실패 / 취소\"| Stop\n```\n\n| 읽으려는 내용 | 안내 |\n|---|---|\n| 실행 모드 선택 | [조작 가이드](../../../../docs/how-to/manipulation.md) |\n| Mock Action 요청과 취소 | [Mock 사용법](manipulation_mock_usage.md) |\n| MuJoCo BT 실행 | [BT 서버](../../cleany_manipulation_bt/README.md) |\n| 수거 설정과 동작 계약 | [설정](study_cafe_sorting_configuration.md), [계약](study_cafe_sorting_contract.md) |\n\n## 단일 물체 Action 실행\n\n승인된 물체 하나의 실행은 Mock 서버와 native MuJoCo BT 서버가 같은\n`ExecuteManipulationSkill` 계약을 사용합니다. Mock의 요청, 취소, 조회와 모니터는\n[실행 안내](manipulation_mock_usage.md), 물리 시뮬레이션의 인식·MoveIt 연동은\n[MuJoCo BT 서버](../../cleany_manipulation_bt/README.md)를 따릅니다.\n세부 진행, 취소 정책과 실행 기록 필드는\n[공통 Action 계약](../../cleany_interfaces/docs/observation-contracts.md#단일-물체-manipulation-action)에 정리합니다.\nMission Manager의 `action_mock` 어댑터는 `/mock/manipulation`의 계약을 호출합니다.\n기본 Mission runtime의 조작 backend 선택은 Mission 설정으로 유지합니다.\n아래 nearest-pregrasp와 sorting coordinator는 별도 실행 경로입니다.\n\n파지 후보 선택, MoveIt 계획, 시뮬레이션 집기·분류·놓기를 담당한다.\n실물 명령을 지원하는 통합 운용 단계는 아니며 외부 로봇 경로는 plan-only다.\n\n- [Python Mock 조작 서버](#python-mock-manipulation-서버)\n- [분류 실행](#시뮬레이션-분리-수거-통합-검증-진행-중)\n- [분류·운반 실행 계약](#분류운반-실행-계약)\n- [설정 및 검증](#설정-및-검증)\n\n## Python Mock Manipulation 서버\n\n`manipulation_server`는 진행과 결과를 모의 생성한다. Backend는 `mock`만 허용하며 clock, TF, odom, 카메라와 joint_states를 발행하지 않는다. Steady clock으로 timeout과 취소를 처리한다. [Endpoint 표](interfaces.md#manipulation_server)와 [실행 절차](../../../../docs/RUNNING.md#주행도-mock으로-action-연결-확인)를 따른다.\n\n| 설정 | 용도 | 정상 시간 |\n|---|---|---|\n| [기본 fixture](../config/manipulation_mock.yaml) | 빠른 서버 계약 검사 | 단계당 기본 0.5초 |\n| [Mission 공유 fixture](../../cleany_mission_manager/config/manipulation_server_fixture.yaml) | 두 물체와 네 관측 | 물체당 합계 40초 |\n\n시간 우선순위는 scenario의 `stage_durations_sec`, 전역 `stage_durations_sec`, `stage_duration_sec` 순서다. 정지 단계 기본값은 `stop_duration_sec`다. [공유 시간표와 timeout](../../cleany_mission_manager/docs/manipulation_mock_integration.md#mock-조작의-관찰-시간)을 따른다.\n\nExecution ID는 중복 수락하지 않는다. 재시작 시 ACTIVE를 INTERRUPTED로 보존하고 자동 재개하지 않는다. 과거 JSON의 추가 필드는 기본값으로 읽으며 손상된 DB는 시작 오류다. 서버 DB와 Mission DB는 분리해 유지한다. [결과, 취소와 보고 계약](../../cleany_interfaces/docs/manipulation.md)을 함께 확인한다.\n\n조회는 메모리에 유지 중인 최신 상태를 포함한다. 실행 중 서버 DB 쓰기가 실패하면 경고를 남기고 모의 동작 결과는 보존한다. Mission의 전송 전 journal 저장과 결과 저장은 별도 계약이며, 조회 응답만으로 서버 DB 쓰기 성공을 판단하지 않는다.\n\n## 작업자 관찰 모드와 파지 깊이\n\n시뮬레이터를 시작하는 수거 launch는 `sorting_verify_placement:=false`가\n기본이다. 물체를 놓고 팔이 복귀하면 `VerifyPlacement` 서비스 호출/대기 없이\n다음 물체 탐색으로 넘어간다. 시작 시 해당 서비스 준비도 기다리지 않는다.\n결과는 `complete_unverified`, `placement_verified: false`로 기록하며 자동\n안착 검증 성공으로 취급하지 않는다. 정상 종료 단계도 `mission_complete_unverified`\n이다. 실제 안착 여부는 작업자가 GUI로 확인한다.\n기존 자동 검증은 `sorting_verify_placement:=true`로 복원한다.\n이 변경은 운반 중 접촉 이탈 감시, 안전 정지, 충돌 검사, 다음 물체를 찾는\n카메라 인식 및 최종 작업 영역 비움 판정을 제거하지 않는다.\n\n휴지(`crumpled tissue`, `tissue`, `crumpled paper`)는 시뮬레이션 수거에서만\n`tissue_grasp_extra_depth_m:=0.004`를 더해 총 접근 보정량 22mm를 사용한다.\n시뮬레이션 수거의 공통 `grasp_approach_offset_m`는 18mm로, 이전 16mm보다\n접근 방향으로 2mm 더 깊게 잡는다. Selector IK와 실행 목표는 launch의 공통 보정 설정을 공유한다.\npregrasp 기준 위치와 물체별 추가량(마우스 +14mm, 레고/휴지 +4mm)은 유지한다.\n공통 깊이만 원복하려면 `grasp_approach_offset_m:=0.016`을 사용한다.\n휴지 변경만 원복하려면 `tissue_grasp_extra_depth_m:=0.0`으로 실행한다.\n새 기본값은 다음 launch부터 적용되며 이미 떠 있는 GUI의 파라미터를 소급 변경하지 않는다.\n\n## 선택형 시뮬레이션 최적화와 원복\n\n수거 launch에 `sim_performance_profile:=tabletop_fast`를 추가하면 먼 정적\n배경 충돌을 비활성화하고 그림자 맵만 2048로 낮춘다. 기본값 `baseline`으로\n재시작하면 기존 설정으로 돌아온다. 그림자 4096을 유지하는\n`tabletop_collision`도 제공한다. 파지 깊이·물체 물리·관절 속도·YOLOE-seg·\nMoveIt 충돌 검사와 완료 판정은 바꾸지 않는다.\n적용 범위, 실행 예제와 비교 측정은\n[MuJoCo scenes](../../cleany_mujoco_sim/docs/scenes.md#되돌릴-수-있는-고정-책상-최적화)를 따른다.\n\nMuJoCo sorting의 마우스는 `mouse_grasp_extra_depth_m=0.014`를 기본 적용한다.\n`mouse`, `computer mouse`, `wireless mouse` 라벨에만 기본 접근 0.018m에\n14mm를 더해 옆면을 잡는다. Selector와 executor가 같은 보정을 사용하며\npregrasp 위치, 다른 물체의 깊이, 충돌·접촉 유지 검사는 유지한다.\n레고는 `lego_grasp_extra_depth_m=0.004`로 4mm만 추가한다(총 접근 22mm).\n추가량은 설정된 라벨과 정확히 일치할 때만 적용된다. 예를 들어\n`red building block`은 현재 레고 추가량 매칭 대상이 아니므로 공통 18mm를 사용한다.\n실물/비sorting 기본 보정은 0이다. 일반 ROS 설정에서는 `deeper_grasp_labels`와\n같은 길이의 `deeper_grasp_offsets_m` 배열을 selector/executor 양쪽에 동일하게 설정한다.\n마우스 크기와 모양이 달라지면 재검증해야 하는 시뮬레이션 보정값이다.\n\n그리퍼 닫기 명령 성공 후 접촉 판정은 새 joint-state 촬영 시각으로 확인한다.\n기존 접촉 속도/잔차 기준을 연속 3개 이상, ROS 시간 기준 0.10초 이상 만족하면\n즉시 진행한다. 튀는 속도는 안정 구간을 초기화한다. 실제 시간 최대 5초\n(`gripper_contact_feedback_timeout_sec`) 동안 확인하며, 새 피드백이 없거나\n안정되지 않으면 실패한다. `gripper_contact_stable_duration_sec`로 안정 구간을\n조절한다. 확인 중 추가 닫기 명령을 보내지 않으며 controller 실패도 통과시키지 않는다.\n\n현재 스터디카페의 분실물 대상은 레고와 마우스다. Gemini/YOLOE 프로필은\n`computer mouse` 라벨을 사용하며 분류 정책은 `mouse`, `computer mouse`,\n`wireless mouse`를 분실물로 처리한다. 시뮬레이션 배치 검증도 같은 별칭을 지원한다.\n\nTop-down 비교 시험은 `make sim-mujoco-sorting SORTING_ARGS=\"topdown_only:=true\"`로\n실행한다. support plane 법선 아래 방향의 후보만 만들며 기울어진 접근 후보 탐색을\n끄고, 수평 성분 잡음에 민감한 로봇 반대쪽 접근 필터도 이 모드에서만 끈다.\n기존 IK/충돌 허용 기준은 유지한다. 평면 추정과 IK에는 기존 오차 허용이 있으므로\n수학적으로 완벽한 수직 고정 제어는 아니다. 기본은 false이며 자동으로 사선 접근으로\n되돌아가지 않는다. GUI 유지가 필요하면 `shutdown_on_sorting_exit:=false`를 추가한다.\n\nStudy-cafe 파이프라인의 초기 손목 roll은 양팔 모두 `+1.58 rad`이다.\n오른손 카메라 장착부가 왼손과 같은 방향으로 시작하도록 하며, MuJoCo 초기\nkeyframe의 관절값과 actuator 유지 목표에 함께 적용된다. 카메라 TF/장착 형상이나\n실물 모터 캘리브레이션은 변경하지 않는다. 실행 중 파지 이후 손목 제한과는 별개다.\n\n### 파지 후 Depth 최신성\n\nMuJoCo sorting은 `cleany_scene_mapping/KnownGeometryOctomapUpdater`를 기본으로\n사용한다. 가려진 파지 대상 내부의 이전 OctoMap 점유를 정리하여, 들기 시작점에서\n잡은 물체와 자기 잔상 사이의 충돌로 중단되는 것을 줄인다. 관측에서 등록한 형상\n내부에 완전히 포함된 셀만 정리하며, 주변 장애물과 부분 겹침 셀은 유지한다.\n실물 및 sorting 이외 실행은 기존 updater를 유지한다. `depth_octomap_plugin`으로\n명시 변경할 수 있다. 로봇/물체 형상 오차가 있는 환경의 안전성을 보증하지 않는다.\n\n손목 카메라 사용 시 접근·그리퍼 닫기·들어올리기 구간에\n`/sorting_cameras`의 `head_depth_boost=true`를 설정한다. 손목 선택과 YOLOE-seg\n추적은 유지하며, 구간 종료(실패 포함)에 false로 복원한다. 물체 attachment 이후\n촬영된 Depth 및 최신 OctoMap 확인은 생략하지 않는다. 최신성 허용값 2초와\n실물 sorting의 attachment 대기 상한 10초는 유지한다. MuJoCo sorting은\nGUI·추적 부하로 시뮬레이션 진행이 느려지는 경우를 위해 실제 시간 기준 상한을\n30초로 둔다. `attachment_scene_timeout_sec` 실행 인수로 조절한다.\n최신 데이터가 도착하면 즉시 진행하므로 고정 30초 대기가 아니다.\nMuJoCo 장애물 점군은 `scene_cloud_pixel_stride=4`로 샘플링하여 기존 stride 2\n대비 최대 점 수를 1/4로 줄인다(640×480 기준 76,800 → 19,200).\n인식·YOLOE-seg 입력 해상도는 유지한다. 작은 장애물의 점 밀도가 줄어드는 절충이\n있으며, 비교 시 `scene_cloud_pixel_stride:=2`로 복원할 수 있다. 실물 기본은 2다.\n카메라 노드도 함께 빌드해야 하며 boost 설정 거부 시 이동을 시작하지 않는다.\n\n스터디카페 grasp 후보 생성의 어깨 기준점은 migrated CAD URDF의 좌우\nshoulder origin을 사용한다. 원형 마운트 체결 정렬 후 기준점은 왼쪽\n`(0.116200343, 0.196231727, 0.447797)` m, 오른쪽\n`(0.116200838, -0.196177072, 0.447797)` m다 (`base_link` 기준).\n`test_learned_runtime_launch.py`에서 실제 grasp 서버 parameter와 확장한 URDF의\n어깨 원점이 일치하는지 검사한다.\n\n## Sorting 속도와 실행 설정\n\n속도, 가속도, 관측 갱신과 controller 대기 설정은\n[수거 설정](study_cafe_sorting_configuration.md#sorting-속도와-실행-설정)에서 관리한다.\n\n## 상태\n\n점수순 grasp 후보를 양팔 MoveIt plan-only 검증으로 평가한다. 운영 action은 실제\ntrajectory와 gripper 명령을 실행하지 않는다. 스터디카페 수거 시뮬레이션에서 선택 결과를\nMuJoCo arm controller로 실행할 수 있다. `nearest_pregrasp_coordinator`는 perception이\n제공한 거리 유효 객체를 가까운 순서로 시도한다. 기본\n`execute_grasp_and_lift=false`에서는 첫 reachable grasp의 pre-grasp까지만 실행하고,\n옵션을 켜면 재인식과 Pilz LIN 기반 접촉 파지·후퇴·상승까지 수행한다.\n\n## Reachable grasp action\n\n`grasp/select_reachable` (`SelectReachableGrasp`)는 가까운 팔부터 IK, state validity,\ncurrent→pre-grasp와 pre-grasp→grasp plan을 검사한다. pre-grasp는 접근 벡터 반대 방향\n0.14 m다. 5축 position-only IK의 방향 손실을 막기 위해 먼저 TCP 위치 IK로 seed를 만든\n뒤, TCP의 실제 `-Y` 접근축 앞 0.14 m에 있는 가상 aim tip을 grasp point에 맞춘다. 이로써\n물리 gripper가 선택 객체를 바라보는 것은 강제된다. 위치 seed가 실패하면 현재 joint\nstate에서도 계속 시도하며, 전체 arm joint limit 안에 분산한 팔당 8개 seed에서 허용\n오차를 만족하는 해는 현재 상태 대비 joint-limit 정규화 이동량으로 정렬하고 wrist\nroll에는 2배 가중치를 둔다. 자세 오차는 동률 해의 tie-break로만 사용한다. 5축 기구가 정확한\n후보 방향을 만들 수 없는 경우에는 접근축 최대 15도, parallel-jaw 대칭을 고려한 closing\n축 최대 30도 안에서 가장 가까운 실행 가능 방향을 허용한다. 그보다 큰 오차는 다음 arm\n또는 후보로 fallback한다. grasp 위치에서도 TCP 위치·접근축·closing 축을 FK로 다시\n검사한다. 한 해의 validity 또는 planning이 실패하면 같은 팔의 다음 grasp/pre-grasp\n해를 먼저 시도한 뒤 반대 팔과 다음 후보로 넘어간다. 선택 오차는 selector 로그에 남긴다.\n\n## 제공 계약\n\n실행 결과는 Mission Manager가 상태 전이에 사용할 수 있는 성공·실패·차단 결과로 반환한다.\nSkill Executor는 Mission Manager의 FSM 상태를 직접 변경하지 않는다.\n\n## 설정 및 검증\n\n입력 후보는 snapshot/object/frame/target OBB가 같고 frame은 설정된 `planning_frame`과\n일치해야 한다. 현재 12개 arm/gripper joint는 완전하고 0.5초 이내여야 한다. action\n동안 target OBB와 ACM은 임시 변경되고, 복원에 성공한 뒤에만 최종 성공·실패·취소\n상태를 확정한다. 복원 실패는 planning-scene 오류로 반환한다. 한 번에 goal 하나만\n처리한다.\n\n```bash\nros2 launch cleany_moveit_config mock_planning.launch.py\nros2 launch cleany_skill_executor grasp_selection.launch.py\npytest -q ros2_ws/src/cleany_skill_executor/test\n```\n\n테스트는 기능별로 묶는다. `test_seeded_cartesian.py`는 경로 보간·자세 보정·URDF FK,\n`test_gripper_geometry.py`는 폭 보정·접촉 판정·피드백 안정화,\n\n\nplanning frame, timeout, planning attempt/scaling, 최대 후보 수는\n`config/grasp_selection.yaml`의 ROS parameter로 설정한다. timeout/cancel은 각 IK,\nstate-validity와 planning 단계 전후에 확인한다.\n\nsimulation 실행은 planning attempts 3, velocity/acceleration scaling 0.08,\nMoveGroup replan 2회와 0.25초 delay를 사용한다. controller 실패 시 joint별 tracking\nerror를 기록하고 현재 상태에서 한 번만 같은 joint goal로 안전 재계획한다.\n\n## 가까운 객체 자동 pre-grasp\n\n`nearest_pregrasp_coordinator`는 다음 순서로 한 번의 작업을 수행한다.\n\n```text\nInspectScene 1차 detection\n→ distance_valid 후보를 base_link 거리순 정렬\n→ selected-object inspection\n→ PlanGrasp\n→ SelectReachableGrasp\n→ target OBB를 충돌물로 유지하며 pre-grasp 실행\n→ (execute_grasp_and_lift=true) 새 RGB-D 재인식과 동일 arm 재선택\n→ Pilz LIN 접근 → gripper 접촉 → LIN 역접근 → LIN 수직 상승\n```\n\n양쪽 gripper는 object evaluation 전에 open한다. 따라서 MoveIt 후보 검증과 실제 실행이\n동일한 gripper joint state 및 collision geometry를 사용한다.\n\n가장 가까운 객체가 segmentation, grasp 생성 또는 양팔 도달성 검사에서 실패하면 다음\n가까운 객체로 fallback한다. depth가 불충분해 `distance_valid=false`인 detection은\n자동 조작에서 제외한다. infrastructure, MoveIt 또는 controller 실패는 다른 객체로\n넘기지 않고 전체 작업을 실패시킨다.\n\nRGB-D camera, `perception/inspect_scene`, `grasp/plan`,\n`grasp/select_reachable`, MoveGroup과 arm/gripper controller를 먼저 실행한 뒤 coordinator를\n시작한다.\n\n```bash\nros2 launch cleany_skill_executor nearest_pregrasp.launch.py\n```\n\nquery, timeout, 속도/가속도 scaling과 gripper open 위치는\n`config/nearest_pregrasp.yaml`에서 설정한다. pre-grasp joint target은 운영 selector가\naim-tip IK와 FK 방향 검증까지 통과한 결과를 사용한다. 성공한 target OBB는 완료 자세에서\nPlanning Scene에 유지하며, 실패하거나 coordinator가 종료될 때 기존 ACM과 함께 복원한다.\n\nStudy-cafe의 네 물체를 대상으로 인식부터 접촉 집기와 후퇴까지 실행하려면 다음 launch를\n사용한다.\n\n```bash\nros2 launch cleany_skill_executor study_cafe_nearest_grasp_demo.launch.py\n```\n\n기본값은 YOLOE-seg instance mask + Gemini 3.1 Flash-Lite 상세 분류 설정이다. 기존 color adapter는\n과거 머그컵/휴대폰/지우개 fixture 전용이며 현재 종이컵/레고/휴지에 대응하지 않는다.\n이 study-cafe MuJoCo launch의 YOLOE 기본 체크포인트는\n`~/models/yoloe/study_cafe_sim_yoloe26s_seg.pt`다. 현재 시뮬레이션 head 영상으로\nfine-tune한 파일이며, 생성·학습·평가 절차는\n[`cleany_perception/README.md`](../../cleany_perception/docs/runtime.md#스터디카페-mujoco-전용-yoloe-seg-학습)에 있다.\n손목 HANDOFF는 별도 `~/models/yoloe/study_cafe_sim_all_views_yoloe26s_seg.pt`를\n`wrist_yoloe_model_path`로 로드한다. 오른손목 HANDOFF는 head 체크포인트를\n`wrist_right_yoloe_model_path`로 재사용한다. 실제 컵 pregrasp 오른손목 프레임에서\nhead 모델은 컵을 confidence 0.726으로 검출했고, 양손목 바닥 학습 모델은 검출하지\n못했다. 파지 후 CHECK는\n`~/models/yoloe/study_cafe_sim_held_yoloe26s_seg.pt`를\n`wrist_check_yoloe_model_path`로 로드한다. Head 모델은 기존 학습본을 유지한다. 왼손목\n시점 holdout의 마스크 IoU 0.5 일치율은 52/80→68/80으로 개선됐지만, 새 모델을\nhead에 쓸 때는 71/80→64/80으로 하락했기 때문이다. 오른손목에서 실제 라벨이\n있는 컵·휴지의 일치율은 38/40→36/40이었다. 이 수치는 고정 시뮬레이션 자세와\n별도 생성 영상의 평가이며 실제 집기 성공률을 뜻하지 않는다. 학습 결과의 `best.pt`를\n각 손목 경로로 복사해 사용한다. 파지 후 레고 holdout은 CHECK 모델에서 18/20으로\n개선됐으나, 같은 모델의 파지 후 컵·마우스·휴지 검출은 아직 0/10이다. 실제 카메라 영상에 대한 성능은\n검증하지 않았으며, 실물 실행에는 별도 검증된 checkpoint를 `yoloe_model_path`로 지정한다.\n스터디카페 기본 실행은 왼손목 마우스 CHECK에\n`wrist_mouse_check_yoloe_model_path`의 전용 모델을 쓴다. 실제 MuJoCo 실패\n프레임에서 기존 모델은 마우스 검출 0건, 전용 모델은 신뢰도 0.25였고, 마우스\n단독 및 전체 실행에서 파지 후 CHECK를 통과했다. 오른손목 CHECK의 컵 전용\n모델이 물체를 놓치면 기존 파지 후 통합 모델로 같은 RGB를 재검사한다. 실제\nMuJoCo 휴지 CHECK 프레임에서 컵 전용 모델은 검출 0건, 통합 모델은 휴지를\n신뢰도 0.364로 검출했다. 두 추가 검사 모두 예상 물체의 투영 위치와 mask\n검증을 통과해야 한다.\nYOLOE 추론의 최소 confidence는 0.08이고, 클래스별로 컵·마우스·휴지는 0.25,\n레고는 0.08을 적용한다. 다른 클래스 목록이나 모델로 바꿀 때는\n`yoloe_class_confidence_thresholds`도 같은 순서로 조정해야 한다.\n시뮬레이션 수거 정책 `table_sorting_policy.yaml`의 최종 최소 confidence도 0.08로\n맞췄다. 레고 외 물체는 YOLOE 단계에서 먼저 0.25 미만을 제거한다.\n다른 YOLOE checkpoint는 `yoloe_model_path`로 지정할 수 있다.\n전체 파이프라인은 아래 스터디카페 검증 명령으로 실행한다.\n\n## 센서 전용 study-cafe 검증\n\n`study_cafe_nearest_grasp_demo.launch.py`는 YOLOE-seg + Gemini,\naligned RGB-D/TF, AnyGrasp 후보와 MoveIt 검증을 연결한다.\n`cleany_perception/config/yoloe_seg_gemini.yaml`을 바탕으로 스터디카페\n전용 head/손목 체크포인트를 설정한다. `GEMINI_API_KEY`와 로컬 YOLOE 모델이 필요하다.\nDepth obstacle scene은 객체 검출과 별도로 유지하며 target 위치를 simulator에서 받지 않는다.\n\n```bash\nmake sim-mujoco-pipeline\nmake sim-mujoco-sorting\n```\n\n인식·수거 launch의 `scheduled_cameras` 기본은 true다. 일반 인식은 head RGB-D만\n10Hz로 촬영하며, 수거는 선택한 손목 카메라와 head 촬영 빈도를 전환한다.\n손목 전환을 사용하는 수거는 `scheduled_cameras:=false`를 허용하지 않는다.\nGUI 기본은 `sim_viewer:=efficient`이며 센서 snapshot을 공유하는 최대 20Hz 창이다.\n센서 해상도·그림자는 유지하고 GUI 그림자만 기본으로 끈다. 전체 MuJoCo UI는\n`sim_viewer:=native`로 선택한다. backend 설정은 observer README를 따른다.\n\n```bash\nmake sim-mujoco-pipeline PIPELINE_ARGS='headless:=true use_rviz:=false use_image_view:=false'\nmake sim-mujoco-pipeline PIPELINE_ARGS='headless:=false use_rviz:=false use_image_view:=false'\nmake sim-mujoco-pipeline PIPELINE_ARGS='headless:=false sim_viewer:=native'\n```\n\n## 시뮬레이션 분리 수거 (통합 검증 진행 중)\n\n분리 수거 모드는 selector의 `require_pregrasp_visibility=true`를 사용한다.\n관측한 OBB 8개 모서리를 현재 camera TF 기준으로 원근 투영하고, 이를 포함하는\n16면 visibility cone을 구성한다. MoveIt `GetStateValidity`의\n`VisibilityConstraint`가 준비 자세의 로봇 CAD와 이 영역의 겹침을 검사한다.\n가리는 자세는 움직이기 전에 제외하고 다른 IK/후보를 검토한다. 반경은 물체\n정답 크기나 고정 컵 치수가 아니라 RGB-D OBB에서 계산하며 기본 padding은\n3 mm다. 동적 camera TF는 기본 0.5초 이내여야 하고, 검사 결과가 누락되면\n통과로 취급하지 않는다. 일반 selector의 기본값은 false다.\n\n`sorting_contact_diagnostics:=true`는 MuJoCo observer의 접촉 부위/힘\n출력만 켠다. 기본은 false이며, controller 오차와 실제 접촉을 대조하는\n진단용이다. coordinator나 grasp selector는 이 GT 토픽을 읽지 않는다.\n\n```bash\nmake sim-mujoco-sorting\n\n# 기본 sorting 실행은 headless이며 RViz/image_view를 시작하지 않는다.\n\n# 수거 완료/실패 후에도 시뮬레이터와 GUI 유지 (수거 동작을 자동 재시도하지 않음)\nmake sim-mujoco-sorting SORTING_ARGS='headless:=false use_rviz:=true use_image_view:=true shutdown_on_sorting_exit:=false'\n# 같은 실행에서 GUI 창만 생략 (vendor 카메라 렌더링에는 DISPLAY 필요)\nmake sim-mujoco-sorting SORTING_ARGS='headless:=true use_rviz:=false use_image_view:=false'\n```\n\nMoveIt adapter의 `First ranked grasp/pregrasp` 로그는 실제 반환 순서의 첫 IK\n해의 오차를 기록한다. 예전 `Accepted grasp` 로그는 joint-motion 우선 순서와 달리\n최소 방향 오차만 출력하므로 선택된 해의 자세로 해석하면 안 된다. 첫 해도 이후\n충돌/계획 검사에서 탈락할 수 있어 최종 선택은 action result의 joint state가 근거다.\n\nStudy-cafe launch의 `gripper_open_position_rad`(기본 1.2rad)로 실행 전 개방 폭을\n명시적으로 설정할 수 있다. Sorting은 홈에서 해당 개방까지의 sweep을 검사한 뒤,\n그 상태로 pregrasp와 접근을 계획한다. 큰 물체 진입 실험용이며 close command의\n보정식, 접촉 gate, joint/controller 허용치는 변경하지 않는다.\n\nSorting selector는 `joint_limit_margin_rad=0.005`로 arm IK endpoint에 관절 상한/하한\n여유를 둔다(일반 selector 기본 0). 경계에 포화된 해는 순위 목록과 state validity\n앞에서 제외한다. 43의 pregrasp가 손목 상한에 정확히 놓인 뒤 feedback가 12.44µrad\n넘어 Cartesian 시작 검증이 실패한 것을 방지하기 위한 선택 조건이다. 실제 feedback나\ntrajectory를 clipping하지 않으며 hard joint bounds/controller 허용치는 그대로다.\n\nStudy-cafe launch는 모든 child process 시작 전에 `fastdds_profiles_file`을\n`FASTRTPS_DEFAULT_PROFILES_FILE`로 전달한다. 이미 지정된 환경변수를 우선 보존하고,\n없으면 `cleany_perception/config/fastdds_rgbd.xml`(UDP + participant별 16 MiB SHM)을\n기본으로 쓴다. 빈 launch 값은 사용자 기본 middleware 설정으로 되돌리는 진단 옵션이다.\n다른 RMW의 동작을 바꾸는 설정이 아니며 QoS·freshness 기준은 변경하지 않는다.\n41의 실제 집기 구간에서 지도 receipt 2초 초과가 없었으나 모든 부하/장치에서의 보장은\n아니다. 별도로 띄우는 기록기/카메라는 같은 DDS 환경을 설정해야 비교할 수 있다.\n\n`sorting_reobserve_after_lift=true`는 head 재검출에 실패한 경우(기본 관측 경로에서는\n검출 대상이 없을 경우) 한 번의 카메라 재관측 이동을 허용한다. 정착한 실제 TCP와 관측 OBB로 파지\noffset을 잡고, CameraInfo/TF의 중앙 영상 ray 3개와 관측 높이 평면들의 교점을\n제안한다. 관측 OBB의 bounding sphere 전체가 화면 안에 들어오는 후보만 쓰며\n`sorting_reobserve_margin_px=24`, `sorting_reobserve_geometry_padding_m=0.01`,\n`sorting_reobserve_max_translation_m=0.20`으로 여백·최대 이동을 제한한다.\n현재 높이에서 맞지 않으면 `sorting_reobserve_max_lowering_m=0.10` 범위에서\n높이를 최대 3단계로 검사한다. 낮추더라도 필수 상대 상승량에\n`sorting_reobserve_height_clearance_m=0.02`를 더한 높이 아래로 내려가지 않는다.\nattached geometry를 보존하는 collision-aware IK와\n일반 MoveIt 경로 계획·실행을 통과해야 한다. 이동 전후 gripper contact를 확인하고\n이후 같은 선택된 관측 경로의 상대 상승량 검증을 다시 수행한다. 관측 재실패·재구성 실패·\n관측 높이 부족은 성공으로 처리하지 않는다. `sorting_held_association_tolerance_m=0.03`\n내에서 관측 중심과 파지 추정 중심이 일치해야 운반으로 넘어간다. 이 기능은\n센서 기반 재관측 동작이며 MuJoCo GT나 자동 물체 부착을 사용하지 않는다.\n실제 재관측 성공 여부는 실행 기록으로 별도 검증해야 한다.\n재관측/수거함 운반의 일반 joint-goal 이동에는 파지 중에만\nsorting launch에서는 `sorting_payload_velocity_scaling=0.24`,\n`sorting_payload_acceleration_scaling=0.20`를\n적용한다. 기존 속도·가속도보다 높이는 설정은 적용하지 않으며 열린 그리퍼로\n복귀할 때는 원래 값을 사용한다. 접근/역접근의 Cartesian retiming은 별도로\n유지한다. 노드 단독 기본값은 둘 다 0.01이며 launch 인수로 이전 값을 재현할 수 있다.\n이는 시뮬레이션 시험 설정이며, 지속 파지 성공이나 실제 하드웨어 적합성을 뜻하지 않는다.\n\n`config/table_sorting_policy.yaml`은 Gemini의 category/reason을 받아\n쓰레기를 `trash_right`, 분실물을 `lost_items_left`로 보낸다. 위험 라벨과 저신뢰,\ncategory/reason 미제공 결과는 review로 남기고 조작하지 않는다.\n\n현재 장면은 종이컵·마우스·휴지뭉치·확대한 레고를 사용한다. YOLOE의 명시 클래스는\n`cup`, `computer mouse`, `crumpled tissue`, `lego brick`이며 Gemini는 고정 목록 없이\n외형에 따른 자유 라벨을 생성한다. 모델 출력 category/reason으로 분류하고 위험·저신뢰\n결과는 review로 남긴다. 장면의 형상·크기와 평가용 body mapping은\n[MuJoCo README](../../cleany_mujoco_sim/docs/scenes.md)를 따른다.\n\n수거 위치는 로봇 뒤쪽 +Y(좌측)의 `lost_items_left`, -Y(우측)의\n`trash_right`다. `cleany_mujoco_sim/config/robot_top_bins.yaml`은\n수거 위치의 알려진 보정값/형상만 공유한다. 책상과 집을 물체의 위치/형상은\n카메라에서 얻으며 scene의 target 좌표를 planner에 전달하지 않는다.\n수거함은 바닥과 4개 벽으로 구성되고 MoveIt에도 같은 목적지 형상을 등록한다.\n내부 후면 받침판도 같은 설정으로 MoveIt 충돌 형상에 등록한다.\n이 좌표는 현재 고정 베이스 시뮬레이션 전용이며 이동 베이스 운용을 보장하지 않는다.\n\n분류 → 물체에 가까운 팔의 후보를 먼저 검사하고 실패하면 반대 팔 검사 → 재인식/집기/후퇴/들기 →\n부착 물체를 포함한 MoveIt 운반 → 수거함 개구부 확인 → 열기 → 복귀 →\n선택적 놓기 검증 순서다. 운반 실패 또는 비정상 물체 중심이면 그리퍼를 열지 않는다.\nsorting 모드에서는 다각도 grasp 후보와 전체 팔 IK seed를 추가로 탐색하되\n기존 pose/충돌 허용 기준은 유지한다. 운반 IK에는 전체 joint feedback과\n`RobotState.is_diff=true`를 보내 부착한 OBB가 검사에서 빠지지 않도록 한다.\nSorting은 초기 양손 개방을 따로 명령하지 않는다. 선택된 팔의 pregrasp와\n그리퍼 개방을 6관절 경로로 함께 계획하고, 목표 도착 시 모든 관절 피드백을 검사한다.\n별도 닫기·놓기의 `gripper_motion_sec` 기본값은 2초이며 반환 시에도 팔 복귀와\n턱 닫기를 같은 경로로 계획한다. 속도는 상단 설정 표를 따른다.\n재검출 후보를 selector에 전달하기 전 이전 snapshot의 target OBB를 제거해 중복\n충돌체를 방지한다. 닫기 후 잔여 각도·속도의 안정 구간이 확인돼야 attachment/lift로 진행한다.\n동작 실패 뒤 depth boost 복원까지 실패하면 두 오류를 기록하고 최초 동작 오류를 유지한다.\n\n재선택한 grasp가 현재 팔 위치에서 LIN 방향 기준을 넘으면, 반환된 새\npregrasp로 충돌 검사 이동한다. 이 이동 중 target 접촉은 허용하지 않는다.\n이후 새 RGB-D로 동일 물체의 OBB 모서리 집합이 기본 5 mm 이내에서 유지되는지\n확인해야 접근한다. 없거나, 오래됐거나, 여러 물체가 일치하면 중단한다.\n기존 LIN 10도 기준은 그대로이며, 보정 이동 후에도 다시 검사한다.\n\nSorting은 `use_joint_corridor_grasp=true`, `use_seeded_cartesian_grasp=true`로\n선택된 grasp **관절값**을 보존하는 접근을 사용한다. TCP는 실제 시작점과\n목표 사이의 반경 1 mm 원통 안으로 제한하고, 역접근은 실제 접근 시작 관절값을\n목표로 동일하게 계획한다. 두 끝 관절값의 보간을 seed로 기본 10 mm 간격\ncollision-aware IK를 구한 뒤 단조 cubic 곡선을 구성한다. 모든 중간 검사는\n전체 관절 피드백과 현재 attached body를 보존한다.\n이는 5-DOF 팔에서 임의의 6-DOF 방향을 정확히 보간하는 Pilz LIN과 동일하지 않다.\n반환된 모든 waypoint를 FK로 검사해 원통 이탈/역행을 거부하며, 시작·끝 방향은\n0.01 rad 이내, 중간 방향은 두 끝 자세의 SLERP에서 기본 5도 이내여야 한다.\n충돌·목표 접촉 허용 정책과 controller/contact 한계는 변경하지 않는다.\n관절 속도와 가속도의 곡선 전체 상한을 분석해 시간을 정하고, 실제 JTC cubic\n보간 곡선을 기본 1 mm 분할 및 관절별 0.005 rad 이하 간격으로 표본화해\nMoveIt 충돌/constraint/FK 검사를 거친다. 최대 2000점 초과 시 중단한다.\nJTC에 position+velocity를 전달하며 acceleration 필드는 비워 동일한 cubic\n보간을 유지한다. 모델 관절 한계는 `cartesian_joint_limits_file`(기본 MoveIt\n`joint_limits.yaml`)에서 읽는다. 가속도 미정 관절은 명시 파라미터\n`cartesian_joint_acceleration_rad_s2=1.0`에 실행 scaling을 적용한다. 이는\nMoveIt 기본 가속도와 같은 시험용 상한이지 하드웨어 검증값은 아니다.\n\n추가로 FK sample의 병진/회전 속도와 병진 가속도를 기준으로 trajectory\n시간만 균일하게 늘린다. 기본 Cartesian 상한은\n0.10 m/s, 0.50 rad/s, 0.20 m/s²에 실행 scaling을 적용하고, 추가 시간 여유는\n`corridor_time_margin=2.0`이다. 위치/경로는 바꾸지 않고 velocity/acceleration도\n같은 비율로 줄인다. 이 FK 표본 검사는 연속 시간 속도/충돌 또는 실제 하드웨어\n안전 인증을 대신하지 않는다. `use_seeded_cartesian_grasp=false`이고 joint\ncorridor만 켜면 기존 OMPL 계획+FK 검사 경로를 사용한다. 일반 데모의 두\n모드는 opt-in이며 수직 lift는\n여전히 endpoint 검사를 통과한 Pilz LIN을 사용한다.\n\nsorting launch의 현재 기본값은 `approach_velocity_scaling=1.0`,\n`retreat_velocity_scaling=0.8`, `corridor_time_margin=1.05`이다. 같은 이름의\nlaunch 인수로 조절하며 일반 데모는 기존 0.2/0.4/2.0을 유지한다.\n관절 속도·가속도 한계, 충돌/경로 검사, controller tolerance는 완화하지 않는다.\nsorting joint-corridor의 grasp 접근에만 `sorting_approach_acceleration_scaling=1.0`을\n적용한다(기존 0.4). 계획과 FK sample 시간 배율 검사에 같은 값을 사용한다.\n관절 자체 한계는 제거하지 않는다. sorting Cartesian fallback 가속도는 4 rad/s²,\n별도 gripper motion은 2초, LIN 가속 배율은 0.8이다. MoveIt TOTG의 URDF 미정\n관절 fallback과 Cartesian fallback은 서로 다른 경로다. 현재값 전체는 상단\n속도 표를 따른다. 실기 검증값은 아니다.\n\nsensor-scene 모드에서는 OBB attach 성공 뒤 **그 시점보다 새로운 촬영 시각**의\n처리 완료 depth receipt를 기다린다. `attachment_scene_timeout_sec=5.0` 안에\n오지 않으면 후퇴를 시작하지 않는다. 기존 capture/map age 2초 조건도 유지한다.\n이 barrier는 새 frame 통합 전 계획을 막지만 지도 잔상이 모두 없어졌음을\n보증하지는 않는다.\n\nSorting selector는 `align_grasp_wrist_roll=true`도 사용한다. 현재 Cleany\nURDF의 wrist-roll 축과 TCP offset이 local -Y로 일치하므로, position IK가\n찾은 해의 closing 방향을 이 축 둘레로 직접 맞춘 후보를 만든다. 관절 범위\n안의 동치 각도만 검사하며 비대칭 jaw의 180도 반전을 허용하지 않는다.\n회전한 후보는 전체 robot state 충돌 검사와 기존 FK 위치/approach/closing\n허용 기준을 다시 통과해야 한다. 회전은 **계획 후보**에만 적용하며 실제\n로봇/물체를 강제로 회전하지 않는다. 모델-parity 테스트가 축/TCP 가정을\n검사하며 일반 selector 기본값은 false다.\n부착 해제 시에는 MoveIt이 world에 다시 만든 임시 OBB까지 순차적으로\n제거한다. `/sorting/status`의 실패 메시지에는 별도 `error`가 포함된다.\n`sorting_artifact_directory:=/absolute/path`를 launch에 지정하면 실행마다\n새 `run-\u003cuuid>` 하위 폴더에 `inspection`(InspectScene.Result),\n`grasps`(PlanGrasp.Response), `selection`(SelectReachableGrasp.Result)을\nCDR로 저장한다. fresh depth/3D 추정과 실제 사용한 후보를 오프라인에서\n비교하기 위한 출력 전용 옵션이며, 저장 데이터를 제어 입력으로 재사용하지 않는다.\n기본값은 빈 문자열로 저장하지 않는다.\n접근/후퇴/lift의 `motion_request`(MoveGroup.Goal)와 `motion_result`\n(MoveGroup.Result)는 계획 실패/실행 전 거부 시에도 저장한다.\nseeded 방식에서는 요청의 pipeline/planner ID가 `cleany_seeded_cartesian` /\n`monotone_cubic`이며, 이는 계획 입력을 같은 형식으로 기록한 것이다.\n해당 가상 pipeline ID를 MoveGroup 서버에 전송하지 않는다. 결과의 trajectory와\nplanning_time은 실제 IK/검증 계산으로 작성하며 실패도 기록한다.\n실행 전 FK 검증을 통과한 trajectory는 `motion_plan` 이름의\n`moveit_msgs/RobotTrajectory` CDR로 저장한다. 이 출력에는 corridor 시간 보정이\n반영되며, 저장 자체가 물리 실행/파지 성공을 뜻하지는 않는다.\n`grasp_approach_offset_m` launch 인수(시뮬레이션 수거 0.018 m, 그 외 0.016 m)는 selector의 IK 목표와\ncoordinator의 실행/표시 보정에 동일하게 전달한다. 회전식 비대칭 jaw의\n벌림에 따른 실제 접촉 깊이를 보정하는 시험용 입력이며, 현재 기본값은\n실측 하드웨어 보정이나 지속 파지 성공으로 검증된 값이 아니다.\n같은 옵션은 selector의 출력 전용 service trace도 활성화한다. 별도\n`services-\u003cuuid>` 폴더에 각 MoveIt 서비스 요청/응답 CDR과 완료 시간,\n취소 여부 JSON을 저장한다. 실패한 IK 요청의 seed/목표를 재현하기 위한\n진단이며 응답이나 계획을 수정하지 않는다. 이 옵션의 파일 I/O가 포함된\n시간을 저장 기능을 끈 운용 성능으로 해석하지 않는다.\n`/sorting/status`는 단계, label, 분류, 목적지, 완료 항목을 JSON String으로\nlatched 발행한다. 기본은 관찰 모드이며 물체별 `placement_verified=false`와\n`mission_complete_unverified`를 기록한다. 자동 검증을 켜면 물체별 안착 확인 후\n`mission_complete`를 발행한다. 빈 작업영역은 연속 두 번 확인해야 한다.\n`sorting_require_category_coverage=true`일 때만 `sorting_required_categories`의\n모든 종류가 완료 항목에 포함됐는지 추가 검사한다.\n\n`/sorting/verify_placement`는 독립된 결과 검증 port다. 현재는 시뮬레이션\noracle이 release 이후의 새 물체 AABB가 올바른 수거함 내부에서 안정적으로\n정지했는지 확인한다. 이 oracle은 인식·분류·grasp·경로 계산에 사용하지\n않는다. 실제 로봇에는 별도의 센서 기반 결과 검증 구현이 필요하다.\n\n## 분류·운반 실행 계약\n\n`study_cafe_sorting.launch.py`와 일반 파이프라인은 `robot_top_bins.yaml`의\n내부 후면 받침판·수거함을 기본 배치로 사용한다. 책상 양끝 분류 영역과 구분선은\n없으며 수거함의 고정 투하 위치만 사용한다.\n개별 물체 배치 성공 기록이 있지만 전체 정리 성공은 검증 중이다.\n`table_sorting_policy.yaml`의 destination으로 Gemini의 category/reason을\n연결한다. label allowlist로 category를 대체하지 않으며 위험 label은 보수적으로\n거부한다. RGB-D 거리순으로 시도하고 인식된 수거 구역 물체는 다시 집지 않는다.\n미처리/미확인 물체가 남으면 성공으로 보고하지 않는다. 관측한 작업 물체 수와\n완료 항목 수를 대조하므로 이전에 관측한 수량보다 완료 수가 적으면 중단한다.\n이는 수량 검사이며 객체 identity 추적이나 관찰 모드의 독립 안착 검증을 대신하지 않는다. 빈 작업 영역은 두 번\n재확인하며 최대 search/action 횟수 12에 도달하면 실패한다.\n\nMuJoCo oracle은 배치 후 전체 AABB가 수거함 안에 들어가 정지했는지 검증한다.\n기본 `sorting_exit_on_finish=true`; coordinator 종료 시 launch가 다른 노드도\n종료한다. GUI를 유지하려면 launch 인수 `shutdown_on_sorting_exit:=false`를 사용한다.\n현재 전체 물리 정리 성공은 아직 검증 중이다. 기록: `artifacts/table_sorting_20260908/`.\nsorting은 얇고 긴 객체의 RGB-D 점군에서 중심 외의 longitudinal contact 후보도\n생성한다. 자세/충돌 한계는 유지하며, 세부 범위는 cleany_grasping README를 따른다.\nsorting selector/executor는 `support_patch_margin_m=0.02`로 perception OBB\n바닥의 지지면을 유한 collision patch로 유지한다(일반 node 기본 0, 비활성).\npatch는 OBB XY 범위에 각 방향 2cm를 더하고, OBB 바닥 아래 1cm 두께로 만든다.\n2cm는 현재 target mask padding 1.5cm를 포함하는 로컬 범위다. 8cm 확장은\n가까운 물체에서 로봇 본체까지 가상의 면을 확장하는 문제가 있어 사용하지 않는다.\n이는 perception이 지지면 법선을 OBB Z축으로, 지지면을 바닥으로 쓰는 계약에\n의존한다. 수평에서 20°를 넘는 면/잘못된 pose는 거부한다. 새 테이블 정답은\n읽지 않으며, 관측 밖 연장 부분은 보수적인 로컬 평면 가정이다.\n물체/support pair만 접촉 허용하고 robot/support는 허용하지 않는다. attachment\n이후에도 patch가 남아 target OctoMap masking 아래의 지지면이 사라지지 않으며,\ntransaction 종료 시 target과 함께 제거하고 원래 ACM으로 복원한다.\n`require_gripper_closure_clearance=true`는 실제 full-robot 형상으로 open→close\n구간을 `gripper_sweep_step_rad=0.05` 이하 간격에서 검사한다. target 접촉만\n허용하고 환경/지지면 충돌은 거부한다. 이 검사는 기하학적 샘플 검사이며 접촉\n동역학/실제 파지 유지 성공을 보장하지 않는다. grasping의 support-plane 간이\n검사 위임은 이 support patch 및 open/closure 검사와 함께만 사용한다.\nseeded cubic 경로가 충돌로 거부되면 최대 8개 contact의 body pair, 위치/frame,\npenetration depth를 오류에 기록해 주변 물체/지지면/잔상 원인 분석에 사용한다.\n`sorting_head_reference_refresh_age_sec` 기본값은 `0.0`으로, pregrasp 도착 후\n시간 경과만을 이유로 하는 Gemini 재인식을 비활성화한다. `(0, 30]`초로 설정하면\n기존 ROS clock 기준 만료 검사와 재인식·위치 연관·동일 팔 재계획을 다시 활성화한다.\n손목 서비스 자체의 관측 유효성 검사는 유지하며 관측 timestamp를 갱신하지 않는다.\n\n파지 후 손목 CHECK의 단순 미검출(`ObserveWristTarget.NOT_DETECTED`)은 즉시\n종료하지 않는다. `sorting_wrist_check_attempts`는 기본 1회이며, 미검출이어도\n아래 그리퍼 확인을 통과하면 추가 카메라 요청 없이 운반으로 진행한다.\n1~5회로 설정할 수 있으며, 첫 요청은 lift 완료 시각, 추가 요청은 직전 응답의\n실제 촬영 시각보다 새로운 프레임을 요구한다. 실패 응답도 source/reference ID,\n선택한 팔의 frame, 촬영 시각을 확인한 뒤에만 보완 경로로 처리한다.\nHANDOFF는 성공해야 접근하며 CHECK의 센서·통신·TF·추론·참조 오류나 모호한\n검출은 이 보완 경로에 포함되지 않는다.\n\n각 CHECK 전후에는 요청 이후 도착한 그리퍼 위치·속도가 기존 접촉 조건을\n연속 만족해야 한다. 최소 3개의 서로 다른 샘플이\n`sorting_wrist_contact_confirmation_sec`(기본 0.3초)의 ROS 시간 구간을\n채워야 하며, 피드백 나이와 샘플 간격은\n`sorting_gripper_feedback_max_age_sec`(기본 0.5초) 이하여야 한다.\n대기 상한은 `gripper_contact_feedback_timeout_sec`(기본 wall time 5초)다.\n오래된 값·중복 시각·피드백 단절·빈손 완전 닫힘·접촉 상실은 성공 근거로 쓰지 않는다.\n관절 메시지가 `/clock`보다 먼저 도착하면 시계가 따라올 때까지 그 값을 세지 않고\n기다린다. 미래 시각이 계속되거나 시계가 멈추면 대기 상한에서 실패한다.\n모든 새 영상에서 미검출이어도 이 모터 확인을 통과하면 운반으로 진행한다.\n로그에는 시각적 파지 확인이 없고 그리퍼 피드백으로 진행했다는 사실을 남긴다.\n물체 중심의 lift 높이는 기존처럼 FK와 파지 offset으로 계산하며, 별도 실제 높이\n측정 또는 물체 식별 성공으로 표현하지 않는다. 전류·토크는 현재 판정에 사용하지 않는다.\n\n고정 수거함 모드에서는 YOLOE-seg bbox/depth 거리로 정렬한 후보를 하나씩 처리한다.\n`fixed_jaw_clearance_m`은 고정 손가락 여유거리(수거 기본 0.003 m),\n`grasp_opening_margin_m`은 후보 벌림 여유폭(기본 0.008 m)이다. 여유거리는\n여유폭의 절반 이하여야 한다. 5 mm 시험은 각각 `0.005`, `0.010`으로 설정한다.\n벌림 여유폭은 후보 생성기와 두 TCP 보정 경로에 동일하게 전달된다.\n현재 후보의 YOLOE-seg mask에만 3D 복원을 수행하고 파지 가능한 팔을 찾으면 탐색을 끝낸다.\n복원·파지 계획·양팔 도달성 검사가 실패하면 다음 후보를 복원하며, 같은 주기의\n복원 결과는 캐시한다. review 분류 후보는 정밀 복원 없이 미해결 대상으로 남긴다.\n선택되지 않은 물체도 전체 depth 기반 OctoMap의 충돌 검사에는 계속 포함된다.\n다음 후보 처리 전 snapshot TTL이 만료되면 기존 cache 오류로 처리되며 과거 영상의\n시각을 갱신하지 않는다. 미해결 물체와 기존 관측 물체의 누락 검사는 유지한다.\nsorting selector의 `pose_refinement_iterations=30`은 runtime `/robot_description`\nURDF의 로컬 FK로 위치와 접근/closing 방향의 잔차를 함께 줄이는 bounded numerical\nrefinement를 사용한다. 매 후보 탐색 전 MoveIt FK와 일치하는지 대조한다.\n초기 자세 예산은 pregrasp에서 `pregrasp_aim_attempts`, grasp에서 0이 아닌\n`grasp_pose_seed_attempts`를 따른다(0이면 pregrasp 예산 재사용). 수치 보정도\n설정 예산 전체를 사용하며, 첫 유효 해에서 종료한다. seed 수 증가는 실패\n후보의 계획 시간을 늘릴 수 있으나 유효성 허용값을 변경하지 않는다.\n기본 adapter 값 0은 기존 탐색이다. 각도 오차 기준, 관절 여유, 충돌검사 및\n실행 전 경로 검증은 유지한다. 후보 보정 자체는 로봇에 명령을 보내지 않는다.\n실제 grasp는 `grasp_position_tolerance_m=0.0015`로 별도 검사한다. pregrasp의\n20mm 허용값을 grasp에도 공유하던 오류를 수정했으며, 관절 자세가 맞더라도\nTCP 위치 오차가 1.5mm를 넘는 후보는 거부한다. `pose_refinement_position_weight=10`\n으로 위치 잔차를 우선 줄인다. 각도/충돌/관절 한계는 완화하지 않는다.\n\n`grasp_use_aperture_centering=true`는 검출 폭에서 opening margin 8mm를 제외한\n물체 폭을 사용해 `폭/2 - fixed_jaw_inner_x(8mm)`로 TCP 옆방향 보정량을 정한다.\n계획과 실행이 같은 함수를 사용한다. 기존 30mm 고정 보정은 작은 물체가 두\n손가락 사이에서 벗어나는 문제가 있었다. 시뮬레이션 jaw mesh 기준으로 닫힘\n근방 aperture 기울기 0.065m/rad, command opening reduction 18mm를 사용한다.\n관절 정지로 파지를 확인하지 못하면 `gripper_contact_retry_steps`(기본 node 0,\nsorting launch 5; 허용 0–5)만큼 `gripper_contact_retry_step_rad=0.10`씩 더 닫는다.\n각 재시도는 `gripper_contact_retry_motion_sec=1.2`이며 닫힘 하한과 기존 토크 제한을\n넘지 않는다. 최초 열린 위치 기준의 접촉 판정을 유지하고, 실제 마지막 명령을\n운반 중 감시에도 사용한다. 한도 내에서 파지를 확인하지 못하면 lift 전에 실패한다.\n이는 실제 하드웨어 캘리브레이션 값이 아니며 물리 파지 성공은 별도 검사한다.\n\n연속 sorting에서는 `gripper_force_full_close=true`로 기존 닫힘 하한을 목표로\n유지한다. 접촉 때문에 실제 관절은 그 전에 멈출 수 있으며, 기존 토크 제한과\n관절 잔차/속도 기반 접촉 감시는 그대로 적용한다. 추정 폭의 중간 목표에서 멈춰\n물체 자세 변화 후 추가로 조여주지 못하는 현상을 피하기 위한 설정이다.\n목표까지 완전히 닫혀 잔차가 사라지면 파지 성공으로 간주하지 않는다.\n초기 파지에는 정지 속도 조건을 적용한다. 이미 확인된 파지의 비동기 운반 중에는\n닫히는 방향의 추가 조임을 허용하되, 목표 대비 최소 잔차/열리는 속도 상한,\n관절 피드백 신선도, 손목 추적과 접촉 상실 debounce는 계속 검사한다.\n이는 힘 센서 확인이 아니며 잔차가 사라지기 전의 미끄러짐을 완전히 판별하지 못한다.\nsorting의 attachment 후 지도 갱신 대기 상한은 10초다. CPU 저속 시뮬레이션에서\n새 지도 발행을 기다릴 시간을 확보하되, 신선도 2초와 attachment 이후 새 depth\ncapture 조건은 완화하지 않는다. 새 데이터가 준비되면 즉시 진행한다.\n변화 없는 OctoMap 전체 메시지가 재발행되지 않아도, tree 쓰기 뒤 발행되는\nprocessed-cloud receipt의 새로운 capture stamp로 지도 활동을 확인한다.\n기존 populated-map 확인과 capture/receipt 신선도 기준은 유지하고, 원본 cloud\n수신이나 중복 receipt만으로 갱신하지 않는다. 빈 지도도 통과시키지 않는다.\nsorting selector는 `require_open_grasp_clearance=true`로 실제 열림 각도의 grasp\n끝점도 검사한다. 센서 OBB에 대한 jaw 접촉 허용을 잠시 해제하고, 선택된 gripper\n관절만 열림 각도로 바꾼 전체 로봇 MoveIt validity를 확인한다. 기존 피드백/계획은\n변경하지 않고 ACM은 성공/실패/예외 모두 복구한다. 이 검사는 시작/중간 경로의\n추가 안전 검증을 대체하지 않으며, 보수적인 OBB 때문에 유효한 후보도 거절할 수 있다.\n고정 jaw에는 sorting에서 `grasp_fixed_jaw_clearance_m=0.003`을 적용해 경계를\n맞닿게 두지 않는다. selector와 coordinator에 동일하게 적용하며, 설정 여유는\nopening margin의 절반 이하여야 한다. 기존 비-sorting 기본값은 0이다.\n`direct_vertical_lift:=true`는 기본 false인 동작 진단 옵션이다. 접근 경로를\n역으로 물러나는 단계 대신 현재 TCP 위치에서 수직 lift를 계획한다.\n`direct_vertical_lift_extra_m`(기본 0, 허용 범위 0~0.05m)은 이 진단 경로의\nTCP 상승 거리에만 추가된다. 물체 중심의 기존 최소 상승 높이 검사와 경로\n충돌 검사는 그대로 적용되며, 높이가 부족하면 예측/요구 중심 높이를 오류에 남긴다.\nsorting에서는 끝점 position IK/FK를 확인하고 기존 seeded 위치 corridor로 계획한다.\n기존 corridor 자세 한도(5°)를 넘는 끝점은 거절하고, 전체 경로의 FK/충돌/자세\n변화를 검사한다. 정확한 자세 고정 LIN으로 표현하지 않는다. 파지/손목 감시는\n유지하며 기본 전체 sorting 동작은 아직 역방향 retreat를 유지한다.\n\n- [System Context](../../../../docs/cleany-docs/20_TECHNICAL/01%20-%20System%20Context.md)\n- [Task Planning and Robot Capabilities](../../../../docs/cleany-docs/20_TECHNICAL/03%20-%20Task%20Planning%20and%20Robot%20Capabilities.md)\n# 수거함 운반\n\n## 분류된 수거함으로 직접 이동 / 손목 유지 (기본 모드)\n\n현재 수거 시뮬레이션은 공유 `robot_top_bins.yaml`의\n`simulation_ignore_mast_collision: true`로 고정 기둥 접촉을 MuJoCo에서 끄고\nMoveIt의 기둥–로봇 링크 충돌을 제외한다. 외형 및 self-filter용 TF/형상은 유지한다.\n이 편의 설정의 성공 결과는 실제 기둥을 피하는 실로봇 경로 검증이 아니다.\n\n빈손 복귀와 그리퍼 닫기는 계속 동시에 실행하되,\n`sorting_return_velocity_scaling: 0.12`, `sorting_return_acceleration_scaling: 0.15`로\n복귀 동작만 별도 상한을 적용한다(더 낮은 전역 설정은 유지).\n현 MJCF STS3215의 토크 한계 2.648Nm 및 감쇠 합 3.342Nm·s/rad에서는\n무부하 정상 속도조차 약 0.78rad/s 이하라 기존 30% 어깨 yaw 상한 1.274rad/s를\n지속 추종할 수 없다. 새 복귀 yaw 상한은 약 0.509rad/s이며 충돌 검사,\n모터 토크 한계 및 0.12rad 궤적 추종 허용치는 변경하지 않는다.\n이는 현재 시뮬레이터 모델용 설정이며 실제 모터 성능 인증값이 아니다.\n\n운반은 고정 투하 방식이다. `config/nearest_pregrasp.yaml`의\n고정 **물체 중심** 위치(base_link, m)는 다음과 같다. 수거함은 로봇 내부 후면에 부착된다.\n\n- `sorting_fixed_release_lost_items_left_m`: `[-0.075, 0.105, 0.50]`\n- `sorting_fixed_release_trash_right_m`: `[-0.075, -0.105, 0.50]`\n\n분류 → 파지 → 안전한 들어 올리기 → 선택된 수거함 위 고정 투하점 → 놓기 → 복귀 순서다.\n기본 모드에서는 파지 전 공통 경유점 IK 검사, 공동 손목 endpoint 검사 및 경유점 이동을\n모두 생략한다. 그리퍼 안의 실제 추정 물체 중심 offset을 반영한 최종 투하 자세만 구한다.\n도달 가능한 자세가 없으면 물체를 놓지 않고 중단한다. 직접 이동도 MoveIt의 현재\n부착 물체/장애물 충돌 검사를 거친 경로로 실행하며 무검증 직선 명령이 아니다.\n\n들어 올리기를 마치면 실제 손목 roll 각도를 캡처한다. 최종 투하 IK는 손목 roll만 변수에서\n제외하고 어깨 yaw/pitch·팔꿈치·손목 pitch의 네 관절을 푼다. 손목을 위아래로 꺾는\npitch는 고정하지 않는다. 실행 경로의 roll tracking 허용\n오차는 `sorting_fixed_release_wrist_tolerance_deg`(기본 0.5도)이며 자동 확대하지 않는다.\n고정 투하점에서 물체 중심 도착과 손목 feedback을 확인한 뒤 그리퍼를 연다.\n물체 중심 도착 허용 오차는 1cm이고, IK의 위치 허용 오차는 축별 0.5mm다.\n\n검증된 최종 자세는 프로세스 내 캐시에 저장하며 동일 팔/손목 각도/물체 offset/투하점일 때\n재사용한다. 캐시 hit도 현재 부착 물체를 포함한 충돌 및 FK를 다시 확인한다.\n센서 feedback이 달라 정확히 같은 키가 아니면 재계산하므로 캐시 hit나 시간 단축을\n항상 보장하지 않는다. 직접 운반 중에는 넓은 영역 탐색이나 손목 완화로 우회하지 않는다.\n이 설정은 시뮬레이션용이며 실제 로봇의 고정 투하 자세가 검증됐다는 뜻은 아니다.\n\n## 파지 후 후퇴/들어 올리기의 손목 제약\n\n수거 중 손목 roll만 안정된 파지 접촉 시점의 실제 관절각을 기준으로 제한한다.\npitch는 위아래 동작을 위해 자유롭게 사용하되 기존 물리 관절 한계/충돌 검사는 유지한다.\n`config/nearest_pregrasp.yaml`의 ROS parameter `sorting_carry_wrist_tolerances_deg`\n기본값은 `[2.0, 5.0, 10.0, 20.0, 30.0]`이다. 파지 후 후퇴/수직 lift는 빈 팔의\n기존 pregrasp 관절 목표를 재사용하지 않고, 현재 허용 범위에서 새 endpoint IK와\n전체 Cartesian 경로를 계획한다. endpoint나 검증된 경로를 찾지 못할 때 다음 범위로\n넓힌다.\n기준각은 구간마다 바꾸지 않으며, 한 번 확대한 범위는 놓기까지 유지한다.\n관절 한계/FK/충돌 검사는 유지한다. 최대 범위에서도 실패하면 중단한다.\n\nMoveIt 이동에는 같은 관절 path constraint를 전달하고, 직접 생성하는 Cartesian\n궤적은 local IK/refinement 경계부터 손목 제약을 반영하고 실행 전 모든 waypoint를\n검사한다. 계획/검증과 실행을 분리해 계획 실패만 재시도하며, 서비스/URDF 오류나\n제어기 실패/접촉 상실 후에는 제한을 완화해 재실행하지 않는다. 일반 MoveIt 운반\n구간은 여전히 IK 성공 후 경로 계획 실패 시 중단한다.\n\n손목 유지 시 어깨/팔꿈치 움직임으로 그리퍼의 세계좌표 방향은 변할 수 있다.\n후퇴/lift의 새 도착 방향은 기존 빈 팔 방향을 강제하지 않고 구간 시작 방향 대비\n`sorting_carry_cartesian_rotation_limit_deg`(기본 30도)로 제한한다. 이 값은 시뮬레이션\n운용 설정이며 실제 로봇의 안전한 기울기 한계가 검증됐다는 뜻은 아니다. 새 방향을\n잇는 전체 FK corridor의 기존 자세 오차/속도/가속도/충돌 검사는 유지한다.\n그리퍼를 열고 scene attachment를 해제한 뒤에는 손목 제한을 해제해 복귀한다.\n손목 변화 최소화의 전역 최적해나 물체의 수평 자세 유지는 보장하지 않는다.\n\n운반 전과 놓기 직전의 수거함 입구 크기·bounding sphere 적합성 검사는 현재 구현되어\n있지 않으며 추후 개발 예정이다 (코드의 `TODO(bin-opening-fit)`).\n분류된 수거함의 설정된 고정 투하점으로 이동하고, 물체 중심·손목 feedback으로\n도착을 확인한 뒤 놓는다. 따라서 큰 물체나 OBB가 과대 추정된 물체가 입구 벽이나\n모서리에 걸칠 수 있는지는 현재 확인하지 않는다.\n\nSAM 분할·기준 mask 추적·중앙 인계 상태는 제거했다. 현재 손목 검증은 YOLOE-seg의\nHANDOFF/CHECK 재검출이며 이동 전후 접촉·충돌 검사는 유지한다.\n\n예전 라벨 allowlist 정책, 테이블 배치 구역, 경유점/영역 탐색 운반은 제거했다.\n"},"ros2_ws/src/cleany_skill_executor/docs/manipulation_mock_usage.md":{"title":"모의 Manipulation Action 사용법","body":"# 모의 Manipulation Action 사용법\n\n```mermaid\nsequenceDiagram\n  participant C as 요청자\n  participant S as Mock Action 서버\n  participant D as 실행 기록\n  C->>S: Goal (대상과 작업)\n  S-->>C: 단계별 Feedback\n  S->>D: 상태와 결과 저장 시도\n  S-->>C: 최종 Result\n  C->>S: execution_id로 조회\n  S-->>C: 최신 실행 기록\n```\n\n이 서버는 진행을 모의 생성합니다. [MuJoCo 실행 경로](../../cleany_manipulation_bt/README.md)와 구분하세요.\n\n[패키지 안내로 돌아가기](manipulation.md)\n\n**물체 하나의 `collect_trash` 또는 `collect_lost_item`을 요청하고, 진행·결과·실행 기록을 터미널에서 확인한다.**\n현재 실행 profile은 `mock`이다. 팔과 그리퍼 동작 및 확인 근거를 모의로 생성하며,\n팔 애니메이션이나 실제 로봇 명령은 제공하지 않는다.\n\n| 하려는 일 | 안내 |\n|---|---|\n| 처음 실행해 보기 | [빠른 시작](#빠른-시작) |\n| 진행 중 취소하거나 결과 다시 조회하기 | [취소와 기록 조회](#취소와-기록-조회) |\n| 집기 실패·정지 실패 등을 재현하기 | [실패 상황 재현](#실패-상황-재현) |\n| namespace·대상·제한 시간 바꾸기 | [설정](#설정) |\n| SQLite와 재시작 동작 이해하기 | [SQLite 기록과 재시작](#sqlite-기록과-재시작) |\n| 자동 검사 실행하기 | [검증](#검증) |\n| Action·Service·Topic 계약 확인하기 | [ROS 인터페이스와 실행 구조](#ros-인터페이스와-실행-구조) |\n\n## 빠른 시작\n\n아래 명령은 **bash 터미널 두 개**, **레포 루트**에서 실행한다.\n처음 개발환경을 준비한다면 [설치 가이드](../../../../docs/DEVELOPMENT_SETUP.md)를 따른다.\n\n**1. 터미널 A: 빌드하고 서버 실행**\n\n```bash\nmake build-manipulation\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\n\nmock_db_dir=\"$(mktemp -d)\"\nros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n  database_path:=\"$mock_db_dir/executions.sqlite3\"\n```\n\n`Mock manipulation ready`가 나오면 요청을 받을 준비가 된 것이다.\n`mock_db_dir`에는 이번 테스트의 독립 DB 경로가 저장된다. 서버 종료는 `Ctrl+C`다.\n\n**2. 터미널 B: 정상 수거 요청**\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\n\nros2 run cleany_skill_executor manipulation_test_client\n```\n\n기본 요청은 `mock-snapshot-001`의 **1번 물체**, 목적지 `mock_trash_bin`, 팔 `left`다.\n약 5초 동안 다음 순서의 Feedback을 출력한다.\n\n```text\nVALIDATING → PREPARING_TARGET → APPROACHING → GRASPING → LIFTING\n→ TRANSPORTING → PLACING → RETURNING_ARM → VERIFYING_PLACEMENT → FINALIZING\n```\n\n**3. 출력에서 확인할 값**\n\n| 출력 | 의미 |\n|---|---|\n| 첫 줄의 `execution_id` | 클라이언트가 발급한 UUID4. 기록 조회 때 사용 |\n| 단계별 Feedback | 지금 진행 중인 단계와 설명 |\n| 첫 번째 JSON | Action의 최종 Result |\n| 두 번째 JSON | 조회 Service로 읽은 최신 실행 기록 |\n\n정상 종료 시 Result는 `status=SUCCESS`, `execution_profile=mock`,\n`error_code=NONE`, `object_state=LEFT_GRIPPER`, `placement_state=CONFIRMED`,\n`arm_recovered=true`, `stop_confirmed=true`다.\n조회 결과는 `found=true`, `record_state=FINISHED`, `has_result=true`다.\n\n같은 단계에서도 시작, 관측 결과 수신, 단계 완료를 각각 Feedback으로 알린다.\n클라이언트는 `stage/substage`로 세부 동작을 표시한다. 예를 들어 집기는 다음과 같다.\n\n```text\nGRASPING/GraspObject Starting GRASPING\nGRASPING/ConfirmGrasp Substage completed: GraspObject; starting ConfirmGrasp\nGRASPING/ConfirmGrasp Observation received: Mock contact observation\nGRASPING/ConfirmGrasp Stage completed: GRASPING\nFINALIZING Finalizing result: Mock collection verified\nFINALIZING Execution finished: SUCCESS; Mock collection verified\n```\n\n`Finalizing result`는 결과 확정 시작, `Execution finished`는 실행 종료를 알린다.\n`revision`도 작업 횟수가 아니라 기록 갱신 번호다.\n\n기록의 `completed_substages`는 실제 완료한 모의 세부 단계이며, 실패 시 Result의\n`failed_substage`로 그리퍼 명령 실패와 파지 확인 실패 등을 구분한다.\n그리퍼 닫기 완료만으로 물체 보유를 확정하지 않는다.\n\n**세부 단계를 천천히 관찰하기**\n\n기존 서버를 종료하고 터미널 A에서 아래 명령을 실행한다. 별도 임시 설정 파일 없이\n각 세부 단계를 약 3초, 전체 정상 흐름을 약 51초 동안 확인할 수 있다.\n\n```bash\nmock_db_dir=\"$(mktemp -d)\"\nros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n  database_path:=\"$mock_db_dir/executions.sqlite3\" monitor:=true \\\n  mock_config:=\"$PWD/ros2_ws/src/cleany_skill_executor/config/manipulation_mock_slow.yaml\"\n```\n\n이 설정의 시나리오는 `success`만 제공한다. 원래 설정의 `stage_duration_sec`는 큰 단계\n전체 시간이며 세부 단계 수에 나눠 적용한다. 느린 설정은 단계별 시간과 timeout을 함께 늘렸다.\n\n## VS Code에서 로컬 트리 모니터링\n\n설치된 **BehaviorTree Viewer** 확장(NicholasJamesBell, 0.1.2)의 Monitor 기능으로\n모의 Action의 단계별 진행을 표시한다. Python 이벤트 브리지가 `FULLTREE`·`STATUS`\nZMQ 요청에 응답하는 로컬 테스트 기능이며 BT.CPP 실행기나 Groot2 전체 프로토콜 구현은 아니다.\n\n1. 빠른 시작의 터미널 A에서 launch에 `monitor:=true`를 추가한다.\n\n   ```bash\n   mock_db_dir=\"$(mktemp -d)\"\n   ros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n     database_path:=\"$mock_db_dir/executions.sqlite3\" monitor:=true\n   ```\n\n2. VS Code에서 이 패키지의 `docs/groot2_table_cleanup.xml`을 열고\n   `BehaviorTree: Open Behavior Tree Viewer`를 실행한다. 뷰어에서 **Monitor**를 누른다.\n   확장 설정은 `behaviortreeViewer.monitorHost=127.0.0.1`,\n   `behaviortreeViewer.monitorPort=1666`을 사용한다. 레포 workspace 설정은 MuJoCo용\n   1667이므로 mock을 모니터링할 때는 1666으로 바꾼다.\n3. 터미널 B에서 `ros2 run cleany_skill_executor manipulation_test_client`를 실행한다.\n   실행 중 파란색, 완료 초록색, 실패 빨간색으로 바뀐다. 끝난 상태는 다음 Goal까지 유지된다.\n   같은 명령을 다시 실행해 새로운 실행을 볼 수 있다.\n4. 실패를 보려면 서버를 종료한 뒤 새 임시 DB와 `scenario:=grasp_failure`로 시작한다.\n   뷰어를 다시 연결하고 클라이언트를 실행하면 집기 노드가 실패하고 뒤의 동작은 미실행으로 남는다.\n\n서버가 별도로 실행 중이면 같은 namespace에서 브리지만 시작할 수도 있다.\n\n```bash\nros2 run cleany_skill_executor manipulation_monitor --ros-args -r __ns:=/mock\n```\n\n| 항목 | 동작 |\n|---|---|\n| 입력 | namespace 내 `manipulation/execution_events`, Reliable·Transient Local |\n| 연결 | loopback `127.0.0.1:1666`, launch의 `monitor_port`로 변경 가능 |\n| 표시 범위 | 최신 `execution_profile=mock` 실행 하나. revision으로 중복·오래된 기록 제외 |\n| 표시 근거 | `stage`, `last_completed_stage`, Result. 단계 시작만으로 성공 처리하지 않음 |\n| 실패·취소 | BT 상태는 FAILURE로 투영. `BLOCKED`·`CANCELED`·`FATAL` 구분은 Action Result 확인 |\n| 미지원 | blackboard 실제 값, breakpoint, fault injection, 로봇 제어, 실행 이력 replay |\n\nXML은 서버가 실행하는 코드가 아니라 이벤트를 표시하는 도식이다. 특히 종료 경로는\nResult를 화면에 투영한 것으로, XML의 각 노드를 실제로 tick했다는 의미가 아니다.\n서버 재시작으로 `INTERRUPTED`가 된 기록은 성공한 정지·종료 처리로 표시하지 않는다.\n연결 직후 최근 보존 이벤트를 읽으며 전체 과거 기록을 재생하지는 않는다.\n\n브리지는 `python3-zmq`가 필요하다([개발환경 안내](../../../../docs/DEVELOPMENT_SETUP.md#5-rosdep과-workspace-의존성-준비)).\n확장에 **native zeromq binary unavailable**이 나오면 모니터링용 네이티브 의존성이\n설치되지 않은 것이다. 정적 미리보기와 별개이며 해당 플랫폼의 zeromq 바이너리를 준비한 뒤\nVS Code의 `Developer: Reload Window`를 실행한다. Remote SSH에서는 확장도 원격 VM에 설치한다.\nPC의 로컬 확장에서 VM 브리지에 연결한다면 SSH로 1666 포트를 전달해야 한다.\n\n## 취소와 기록 조회\n\n아래 명령은 **빠른 시작의 터미널 B**에서 실행한다.\n\n**운반 중 취소**\n\n```bash\nros2 run cleany_skill_executor manipulation_test_client \\\n  --cancel-stage TRANSPORTING\n```\n\n`STOPPING` 이후 `status=CANCELED`, `stop_confirmed=true`, `object_state=HELD`를\n확인한다. 기본 `CHECKPOINT`에서는 물체를 들고 있어도 놓기나 팔 복귀를 실행하지 않는다.\n물체 보유 상태가 남으므로 이후 새 Goal은 거절된다.\n다른 독립 테스트를 하려면 터미널 A에서 서버를 종료하고 새 임시 DB로 실행한다.\n\n집기·들기·놓기 중 취소는 현재의 짧은 원자 구간을 완료하거나 제한 시간에서 차단한\n뒤 정지를 확인한다. 취소 후 다음 동작은 시작하지 않는다. fault는 취소보다 우선하며\n정지를 확인하지 못하면 `FATAL/STOP_UNCONFIRMED`다.\n\n**현재 작업을 중단하고, 잡고 있는 물체를 그 자리에서 놓은 뒤 팔 복귀**\n\n```bash\nros2 run cleany_skill_executor manipulation_test_client \\\n  --cancel-stage TRANSPORTING --cancel-mode RETURN_ARM\n```\n\n`STOPPING → RELEASING_IN_PLACE → RECOVERING_ARM → STOPPING → FINALIZING`으로\n종료한다. `CANCELED`, `cancel_mode=RETURN_ARM`, `object_state=LEFT_GRIPPER`,\n`arm_recovered=true`, `stop_confirmed=true`이며 수거함 확인은 실행하지 않는다.\n빈 팔에서는 놓기를 건너뛴다. 현재 위치 놓기의 추가 위치 정책은 후속 검토 대상이다.\n`--cancel-mode IMMEDIATE`는 현재 완료를 기다리지 않고 정지를 요청한다.\n\n이미 실행 중인 Goal에는 `CancelManipulation` 서비스를 사용한다. `/sim`에서도 같은\n서비스와 모드를 제공한다. 모드 설정과 기본 Action 취소를 따로 호출할 필요는 없다.\n\n```bash\nros2 service call /mock/manipulation/cancel cleany_interfaces/srv/CancelManipulation \\\n  \"{execution_id: '실행-UUID', mode: 'RETURN_ARM'}\"\n```\n\n놓기·복귀 중 `IMMEDIATE`로 선점할 수 있으며 이미 즉시 정지를 요청했으면 완화되지 않는다.\n\n**기존 실행 기록 조회**\n\n첫 줄에 출력된 UUID를 `execution_id`에 넣는다. 조회는 새 Goal을 보내지 않는다.\n\n```bash\nexecution_id='클라이언트가 출력한 UUID'\nros2 run cleany_skill_executor manipulation_test_client \\\n  --query --execution-id \"$execution_id\"\n```\n\n응답 유실이나 클라이언트 timeout 뒤에도 같은 ID로 먼저 조회한다.\n같은 execution_id로 Goal을 다시 보내면 중복 요청으로 거절된다.\n\n## 실패 상황 재현\n\n**서버 시나리오를 바꾸는 경우:** 터미널 A에서 기존 서버를 `Ctrl+C`로 종료하고,\n독립 임시 DB와 `scenario`를 지정해 다시 실행한다.\n\n```bash\nmock_db_dir=\"$(mktemp -d)\"\nros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n  database_path:=\"$mock_db_dir/executions.sqlite3\" \\\n  scenario:=grasp_lost\n```\n\n터미널 B에서는 정상 수거 명령을 다시 실행한다.\n`grasp_lost`는 운반 중 `FAILED/GRASP_LOST`, `object_state=UNKNOWN`으로 끝난다.\n\n| `scenario` | 재현 상황 | 예상 결과 |\n|---|---|---|\n| `success` | 정상 수거 | `SUCCESS` |\n| `release_unobserved` | 그리퍼 이탈 근거 없이 독립 확인까지 대기 | 확인 후 `SUCCESS` |\n| `backend_not_ready` | 시작 준비 불가 | `BLOCKED/BACKEND_NOT_READY` |\n| `verification_unavailable` | 확인 기능 준비 불가 | `BLOCKED/VERIFICATION_UNAVAILABLE` |\n| `grasp_failure` | 집기 실패 | `FAILED/GRASP_FAILED` |\n| `grasp_lost` | 운반 중 물체 상태 유실 | `FAILED/GRASP_LOST` |\n| `placement_failure` | 수거함 내부 확인 실패 | `FAILED/PLACEMENT_NOT_CONFIRMED` |\n| `verification_timeout` | 확인 제한 시간 초과 | `FAILED/VERIFICATION_TIMEOUT` |\n| `return_failure` | 팔 복귀 실패, 독립 수거 근거 보존 | `FAILED/MOTION_FAILED`, `placement_state=CONFIRMED` |\n| `stop_failure` | 취소·실패 후 정지 확인 실패 | `FATAL/STOP_UNCONFIRMED` |\n| `stop_timeout` | 취소·실패 후 정지 확인 제한 시간 초과 | `FATAL/STOP_UNCONFIRMED` |\n| `hardware_fault` | 운반 중 모의 hardware fault | `FATAL/HARDWARE_ERROR` |\n| `e_stop` | 들기 중 모의 e-stop | `FATAL/E_STOP` |\n\n`stop_failure`와 `stop_timeout`에서는 클라이언트에 `--cancel-stage TRANSPORTING`을\n추가해 정지 경로를 실행한다. 정상 수거 요청만으로는 이 오류가 발생하지 않는다.\n\n**Goal 인자로 준비 실패를 재현하는 경우:** `success` 서버에서 아래 명령 중 하나를 실행한다.\n모두 움직임 전에 `BLOCKED`로 끝난다.\n\n```bash\n# 없는 대상: TARGET_UNAVAILABLE\nros2 run cleany_skill_executor manipulation_test_client --object-id 99\n\n# 오래된 대상: STALE_TARGET\nros2 run cleany_skill_executor manipulation_test_client --snapshot-id mock-stale-snapshot\n\n# 잘못된 목적지: DESTINATION_UNAVAILABLE\nros2 run cleany_skill_executor manipulation_test_client --destination-id missing\n```\n\n없는 snapshot도 `--snapshot-id missing`으로 재현할 수 있다.\n\n## 설정\n\n**서버 launch 인자**\n\n| 인자 | 기본값 | 용도 |\n|---|---|---|\n| `namespace` | `mock` | ROS 이름의 namespace |\n| `database_path` | [기본 DB 경로](#sqlite-기록과-재시작) | 실행 기록 파일 |\n| `scenario` | `success` | 위 표의 모의 시나리오 |\n| `mock_config` | package의 `config/manipulation_mock.yaml` | 대상 fixture와 모의 시간 설정 |\n\n예를 들어 서버를 `namespace:=demo`로 실행하면 클라이언트에도 `--namespace /demo`를\n전달한다. 설정 변경은 서버 재시작 때 반영한다. 노드의 `backend` parameter는\n`mock`만 지원하며 다른 값은 시작 시 거절한다.\n\n**테스트 클라이언트 옵션**\n\n| 옵션 | 기본값 또는 동작 |\n|---|---|\n| `--namespace` | `/mock` |\n| `--snapshot-id`, `--object-id` | `mock-snapshot-001`, `1` |\n| `--destination-id` | `mock_trash_bin` |\n| `--skill-name` | `collect_trash`. 분실물은 `collect_lost_item`과 `--destination-id mock_lost_item_bin` 지정 |\n| `--mission-id`, `--task-id` | `mock-mission`, `mock-task` |\n| `--execution-id` | 생략하면 UUID4 발급 |\n| `--cancel-stage` | 지정 단계에서 취소 요청 |\n| `--cancel-mode` | `CHECKPOINT`(기본), `IMMEDIATE`, `RETURN_ARM` |\n| `--query` | `--execution-id`의 기록만 조회 |\n| `--timeout` | Result 응답 대기 120초. 서버의 단계 제한 시간과 별개 |\n\n전체 옵션은 `ros2 run cleany_skill_executor manipulation_test_client --help`로 확인한다.\n\n**모의 YAML 설정**\n\n[`config/manipulation_mock.yaml`](../config/manipulation_mock.yaml)에서 관리한다.\n아래 수치는 모의 검증용이며 실물 안전 기준으로 사용하지 않는다.\n\n| 항목 | 기본값 |\n|---|---|\n| 대상 | `mock-snapshot-001`의 물체 1·2·3 |\n| 목적지 / 선택 팔 | `mock_trash_bin` / `left` |\n| 단계 실행 / 정지 확인 시간 | 0.5초 / 0.1초 |\n| 준비 / 확인 제한 시간 | 각각 5초 |\n| 동작 / 정지 제한 시간 | 단계별 10초 / 1초 |\n| 관찰 최대 age | 30초. snapshot age는 모의 fixture 값 |\n| 자동 재시도 | 0회 |\n\n## SQLite 기록과 재시작\n\n현재 서버는 최신 실행 기록을 메모리에 유지하고 SQLite에도 저장을 시도한다.\n같은 프로세스의 중복 검사와 결과 조회는 메모리 기록을 사용하며, 재시작 복구와\n재시작 이후 중복 검사는 디스크에 저장된 기록을 사용한다.\nPython 표준 라이브러리의 `sqlite3`를 사용하므로 별도 DB 서버나\n`sqlite3` 명령어 설치는 필요 없다. 서버가 DB 파일을 자동으로 만든다.\n\n기본 경로는 `${XDG_STATE_HOME:-~/.local/state}/cleany/manipulation_mock/executions.sqlite3`다.\n빠른 시작에서는 `database_path`를 지정해 테스트별 임시 DB를 사용한다.\n\n| `record_state` | 의미 |\n|---|---|\n| `ACTIVE` | 수락한 실행이 진행 중 |\n| `FINISHED` | 실행 종료와 Result 확정. 디스크 저장 완료를 보장하지 않음 |\n| `INTERRUPTED` | 재시작 시 발견한 미완료 실행. `has_result=false`, 사람 확인 필요 |\n| `RECORDING_FAILED` | 이전 구현의 저장 실패 진단. 현재 서버는 새 기록에 사용하지 않음 |\n\n**같은 DB로 재시작할 때**\n\n- 미완료 기록을 `INTERRUPTED`, `human_confirmation_required=true`로 표시한다.\n- 마지막 물리 근거는 보존하고 정지를 추정하거나 가짜 Action Result를 생성하지 않는다.\n- 중단 기록을 조회 Service와 복구 이벤트로 제공한다. 이전 Goal을 자동 재개하지 않는다.\n- fault·중단·물체 보유·상태 불명이 남으면 신규 Goal을 차단한다.\n\n이번 버전에는 reset과 기록 자동 만료가 없다. 다른 모의 테스트는 새 임시 DB로 분리한다.\n기존 DB 삭제를 물리 복구 완료로 간주하지 않는다.\n\n저장 실패는 경고 로그로 남기고 실제 실행의 status와 error_code를 유지한다.\n저장 실패만으로 동작이나 신규 실행을 차단하지 않는다. 최신 진행과 결과는 메모리에 유지하고\n이후 갱신 시 저장을 다시 시도한다. 최초 저장이 실패했으면 다음 갱신에서 기록 생성을 다시 시도한다.\n함께 발생한 hardware fault·e-stop·정지 확인 실패와 물체 보유·상태 불명에 따른 차단은 유지한다.\n디스크에 남은 마지막 활성 기록은 재시작 때 중단으로 복구되지만, 미저장 메모리 기록은 유실된다.\n기동 시 DB 초기화와 기존 이력 읽기가 실패하면 서버는 기동하지 않는다.\n\n## 검증\n\n레포 루트에서 필요한 검사를 선택한다.\n\n| 명령 | 검사 범위 |\n|---|---|\n| `make test-manipulation-core` | 가짜 시계 기반 core: 단계 진행·실패·취소·기록·복구 |\n| `make test-manipulation` | 관련 패키지 빌드, 실제 ActionClient 통신, 동시·중복 요청, 저장 실패, SIGKILL 후 복구 |\n\n기존 Skill Executor 전체 회귀 검사는 ROS setup을 읽은 터미널에서 실행한다.\n\n```bash\nPYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest ros2_ws/src/cleany_skill_executor/test\n```\n\n## ROS 인터페이스와 실행 구조\n\n| 기본 ROS 이름 | 타입 | 용도 |\n|---|---|---|\n| `/mock/manipulation/execute_skill` | `ExecuteManipulationSkill` Action | 요청·Feedback·Result·취소 |\n| `/mock/manipulation/cancel` | `CancelManipulation` Service | execution_id와 취소 방식 지정 |\n| `/mock/manipulation/get_execution` | `GetManipulationExecution` Service | execution_id로 최신 기록 조회 |\n| `/mock/manipulation/execution_events` | `ManipulationExecutionRecord` Topic | 수락·단계·물리 근거·종료·복구 이벤트 |\n\n| Result `status` | ROS 종료 |\n|---|---|\n| `SUCCESS`, `BLOCKED` | `SUCCEEDED`. Result payload의 status도 확인 |\n| `FAILED`, `FATAL` | `ABORTED` |\n| `CANCELED` | 정지 확인 후 `CANCELED` |\n\nID·skill 오류, 동시 실행, 중복 execution_id와 기존 fault는 수락 전에 거절하며\n일반 Result payload가 없다. 상세 필드·단계·오류는\n[Action 명세](02_execute_manipulation_skill_action_spec.md)를 따른다.\n\nROS wrapper, 순수 Python core, 동작 port, Mock adapter와 SQLite 저장소를 분리했다.\n20Hz steady-clock timer와 Reentrant callback, 4-thread executor를 사용하고,\n수락·취소·진행 변경·최종 결과는 같은 lock으로 직렬화한다.\nSQLite는 실행 ID UNIQUE 제약, DB별 파일 lock, WAL/FULL 동기화를 사용한다.\n수락·단계 시작·확인된 물리 변화·Result의 최신 기록과 이력을 동일 트랜잭션으로 저장한다.\n\n이벤트 QoS는 Reliable·Transient Local, depth 100이다. 최신 100개 이벤트를 재수신할 수\n있으며 SQLite 저장에 성공한 이력은 `execution_events`에 보존한다.\n이 mock 경로는 실제 Perception·팔 backend를 사용하지 않는다. 실제 MuJoCo BT 실행은\n[cleany_manipulation_bt](../../cleany_manipulation_bt/README.md)를 따릅니다.\nMission Manager의 `action_mock` 연동과 Backend 계약은\n[Mission 계약](../../cleany_interfaces/docs/mission.md)을 확인합니다.\n"},"ros2_ws/src/cleany_skill_executor/docs/study_cafe_sorting_configuration.md":{"title":"스터디카페 수거 설정","body":"# 스터디카페 수거 설정\n\n[패키지 안내로 돌아가기](manipulation.md)\n\n## 작업자 관찰 모드와 파지 깊이\n\n시뮬레이터를 시작하는 수거 launch는 `sorting_verify_placement:=false`가\n기본이다. 물체를 놓고 팔이 복귀하면 `VerifyPlacement` 서비스 호출/대기 없이\n다음 물체 탐색으로 넘어간다. 시작 시 해당 서비스 준비도 기다리지 않는다.\n결과는 `complete_unverified`, `placement_verified: false`로 기록하며 자동\n안착 검증 성공으로 취급하지 않는다. 정상 종료 단계도 `mission_complete_unverified`\n이다. 실제 안착 여부는 작업자가 GUI로 확인한다.\n기존 자동 검증은 `sorting_verify_placement:=true`로 복원한다.\n이 변경은 운반 중 접촉 이탈 감시, 안전 정지, 충돌 검사, 다음 물체를 찾는\n카메라 인식 및 최종 작업 영역 비움 판정을 제거하지 않는다.\n\n휴지(`crumpled tissue`, `tissue`, `crumpled paper`)는 시뮬레이션 수거에서만\n`tissue_grasp_extra_depth_m:=0.004`를 더해 총 접근 보정량 22mm를 사용한다.\n시뮬레이션 수거의 공통 `grasp_approach_offset_m`는 18mm로, 이전 16mm보다\n접근 방향으로 2mm 더 깊게 잡는다. Selector IK와 실행 목표는 launch의 공통 보정 설정을 공유한다.\npregrasp 기준 위치와 물체별 추가량(마우스 +14mm, 레고/휴지 +4mm)은 유지한다.\n공통 깊이만 원복하려면 `grasp_approach_offset_m:=0.016`을 사용한다.\n휴지 변경만 원복하려면 `tissue_grasp_extra_depth_m:=0.0`으로 실행한다.\n새 기본값은 다음 launch부터 적용되며 이미 떠 있는 GUI의 파라미터를 소급 변경하지 않는다.\n\n## 선택형 시뮬레이션 최적화와 원복\n\n수거 launch에 `sim_performance_profile:=tabletop_fast`를 추가하면 먼 정적\n배경 충돌을 비활성화하고 그림자 맵만 2048로 낮춘다. 기본값 `baseline`으로\n재시작하면 기존 설정으로 돌아온다. 그림자 4096을 유지하는\n`tabletop_collision`도 제공한다. 파지 깊이·물체 물리·관절 속도·YOLOE-seg·\nMoveIt 충돌 검사와 완료 판정은 바꾸지 않는다.\n적용 범위, 실행 예제와 비교 측정은\n[`cleany_mujoco_sim/README.md`](../../cleany_mujoco_sim/docs/scenes.md#되돌릴-수-있는-고정-책상-최적화)를 따른다.\n\nMuJoCo sorting의 마우스는 `mouse_grasp_extra_depth_m=0.014`를 기본 적용한다.\n`mouse`, `computer mouse`, `wireless mouse` 라벨에만 기본 접근 0.018m에\n14mm를 더해 옆면을 잡는다. Selector와 executor가 같은 보정을 사용하며\npregrasp 위치, 다른 물체의 깊이, 충돌·접촉 유지 검사는 유지한다.\n레고는 `lego_grasp_extra_depth_m=0.004`로 4mm만 추가한다(총 접근 22mm).\n추가량은 설정된 라벨과 정확히 일치할 때만 적용된다. 예를 들어\n`red building block`은 현재 레고 추가량 매칭 대상이 아니므로 공통 18mm를 사용한다.\n실물/비sorting 기본 보정은 0이다. 일반 ROS 설정에서는 `deeper_grasp_labels`와\n같은 길이의 `deeper_grasp_offsets_m` 배열을 selector/executor 양쪽에 동일하게 설정한다.\n마우스 크기와 모양이 달라지면 재검증해야 하는 시뮬레이션 보정값이다.\n\n그리퍼 닫기 명령 성공 후 접촉 판정은 새 joint-state 촬영 시각으로 확인한다.\n기존 접촉 속도/잔차 기준을 연속 3개 이상, ROS 시간 기준 0.10초 이상 만족하면\n즉시 진행한다. 튀는 속도는 안정 구간을 초기화한다. 실제 시간 최대 5초\n(`gripper_contact_feedback_timeout_sec`) 동안 확인하며, 새 피드백이 없거나\n안정되지 않으면 실패한다. `gripper_contact_stable_duration_sec`로 안정 구간을\n조절한다. 확인 중 추가 닫기 명령을 보내지 않으며 controller 실패도 통과시키지 않는다.\n\n현재 스터디카페의 분실물 대상은 레고와 마우스다. Gemini/YOLOE 프로필은\n`computer mouse` 라벨을 사용하며 분류 정책은 `mouse`, `computer mouse`,\n`wireless mouse`를 분실물로 처리한다. 시뮬레이션 배치 검증도 같은 별칭을 지원한다.\n\nTop-down 비교 시험은 `make sim-mujoco-sorting SORTING_ARGS=\"topdown_only:=true\"`로\n실행한다. support plane 법선 아래 방향의 후보만 만들며 기울어진 접근 후보 탐색을\n끄고, 수평 성분 잡음에 민감한 로봇 반대쪽 접근 필터도 이 모드에서만 끈다.\n기존 IK/충돌 허용 기준은 유지한다. 평면
