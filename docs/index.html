취소 상태와 실행 비교가 있다.\n\n실행 기록은 현재 mission ID와 정확한 execution ID로 연결한다. 다음 Goal의 기록이 아직 없으면 이전 물체의 진행률을 대신 표시하지 않는다. 과거 실행을 선택해도 현재 Runtime의 주행 판단은 별도로 표시한다. 관측 토픽을 바꾸면 이전 조작 이력과 revision도 초기화한다.\n\n| 표시 | 의미 |\n|---|---|\n| 청소 BT SUCCESS | 마지막으로 관측한 작업 결과; 현재 Nav2 준비나 주행 가능 여부와 다름 |\n| 주행 확인 불가 | Runtime 상태가 없거나 오래돼 현재 gate를 확인할 수 없음 |\n| 조작 완료 | 서버 최종 record의 결과; Mission의 검증과 정지 확인은 별도 |\n| 진행 상태 미확인 | 수신 정체나 이전 실행을 현재 진행으로 추정하지 않음 |\n\n`execution_events`는 revision과 서버 wall timestamp로 단계 구간을 만든다. 중간부터 구독한 기록, 누락과 시각 역행을 구분하며 역행한 기록의 경과 시간은 표시하지 않는다. Timeout과 취소는 서버 steady clock을 사용한다. 기본 최근 실행 20개, 실행당 구간 64개를 보존하며 topic QoS depth는 100이다. SQLite 가공 기록과 시간 막대 재생에서도 같은 의미를 사용한다. 재생은 로봇 명령을 보내지 않는다.\n"},"ros2_ws/src/cleany_dev_monitor/docs/interfaces.md":{"title":"cleany_dev_monitor 노드 인터페이스","body":"# cleany_dev_monitor 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## cleany_dev_monitor\n\n실행 파일: `dev_monitor`. 원본: [node.py](../cleany_dev_monitor/node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `\u003cruntime_namespace>/mission/debug_snapshot` | `cleany_interfaces/msg/RuntimeDebugSnapshot` | 동적 QoS; `runtime_namespace` |\n| 토픽 구독 | `\u003cruntime_namespace>/mission/runtime_events` | `cleany_interfaces/msg/RuntimeEvent` | 동적 QoS; `runtime_namespace`, depth 2048 |\n| 토픽 구독 | `\u003cruntime_namespace>/mission/result` | `cleany_interfaces/msg/MissionResult` | 동적 QoS; `runtime_namespace` |\n| 토픽 구독 | `/rosout` | `rcl_interfaces/msg/Log` | 동적 QoS |\n| 토픽 구독 | `/clock` | `rosgraph_msgs/msg/Clock` | 동적 QoS |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/map` | `nav_msgs/msg/OccupancyGrid` | 동적 QoS; `map_topic` |\n| 토픽 구독 | `/plan` | `nav_msgs/msg/Path` | 동적 QoS; `path_topic` |\n| 토픽 구독 | `/local_costmap/costmap` | `nav_msgs/msg/OccupancyGrid` | 동적 QoS; `local_costmap_topic` |\n| 토픽 구독 | `/global_costmap/costmap` | `nav_msgs/msg/OccupancyGrid` | 동적 QoS; `global_costmap_topic` |\n| 토픽 구독 | `/nav2/cmd_vel` | `geometry_msgs/msg/Twist` | 동적 QoS; `velocity_topics` |\n| 토픽 구독 | `/safety_2d/cmd_vel` | `geometry_msgs/msg/Twist` | 동적 QoS; `velocity_topics` |\n| 토픽 구독 | `/cmd_vel` | `geometry_msgs/msg/Twist` | 동적 QoS; `velocity_topics` |\n| 토픽 구독 | `/wheel/odom` | `nav_msgs/msg/Odometry` | 동적 QoS; `odometry_topic` |\n| 토픽 구독 | `/ground_truth/odom` | `nav_msgs/msg/Odometry` | 동적 QoS; `ground_truth_topic` |\n| 토픽 구독 | `/amcl_pose` | `geometry_msgs/msg/PoseWithCovarianceStamped` | 동적 QoS; `amcl_pose_topic` |\n| 토픽 구독 | `/head_pan/state` | `std_msgs/msg/String` | 동적 QoS; `pan_state_topic` |\n| 토픽 구독 | `/reactive_guard/state` | `std_msgs/msg/String` | 동적 QoS; `reactive_guard_topic` |\n| 토픽 구독 | `/body_guard_3d/state` | `std_msgs/msg/String` | 동적 QoS; `voxel_guard_topic` |\n| 토픽 구독 | `/head_pan/coverage` | `std_msgs/msg/String` | 동적 QoS; `coverage_topic` |\n| 토픽 구독 | `/behavior_tree_log` | `nav2_msgs/msg/BehaviorTreeLog` | 동적 QoS; `nav2_bt_topic` |\n| 토픽 구독 | `/navigation/bt_trace` | `std_msgs/msg/String` | 동적 QoS; `nav2_bt_trace_topic` |\n| 토픽 구독 | `/collision_monitor_state` | `discovery 타입` | 동적 QoS; `collision_state_topic` |\n| 토픽 구독 | `\u003cruntime_namespace>/mock/manipulation/execution_events` | `discovery 타입` | 동적 QoS; `manipulation_events_topic` |\n| 토픽 구독 | `/evaluation` | `discovery 타입` | 선택 시 동적 구독; `controller_evaluation_topic` |\n| 토픽 구독 | `/scan` | `sensor_msgs/msg/LaserScan` | 선택 시 동적 구독; `scan_topic` |\n| 토픽 구독 | `/camera/head/depth/obstacle_points` | `sensor_msgs/msg/PointCloud2` | 선택 시 동적 구독; `depth_points_topic` |\n| 토픽 구독 | `/body_guard_3d/risk_voxels` | `sensor_msgs/msg/PointCloud2` | 선택 시 동적 구독; `risk_points_topic` |\n| 토픽 구독 | `/local_costmap/published_footprint` | `geometry_msgs/msg/PolygonStamped` | 선택 시 동적 구독; `footprint_topic` |\n| 토픽 구독 | `/safety/stop_zone` | `geometry_msgs/msg/PolygonStamped` | 선택 시 동적 구독; `stop_polygon_topic` |\n| 토픽 구독 | `/safety/slow_zone` | `geometry_msgs/msg/PolygonStamped` | 선택 시 동적 구독; `slow_polygon_topic` |\n| 토픽 구독 | `/local_plan` | `nav_msgs/msg/Path` | 선택 시 동적 구독; `local_path_topic` |\n| 토픽 구독 | `/obstacle_memory/grid` | `nav_msgs/msg/OccupancyGrid` | 선택 시 동적 구독; `obstacle_memory_topic` |\n| 토픽 구독 | `/obstacle_memory/lidar` | `nav_msgs/msg/OccupancyGrid` | 선택 시 동적 구독; `lidar_memory_topic` |\n| 토픽 구독 | `/obstacle_memory/depth` | `nav_msgs/msg/OccupancyGrid` | 선택 시 동적 구독; `depth_memory_topic` |\n| 토픽 구독 | `/submap_list` | `cartographer_ros_msgs/msg/SubmapList` | 동적 QoS; `slam_submaps_topic` |\n| 토픽 구독 | `/trajectory_node_list` | `visualization_msgs/msg/MarkerArray` | 동적 QoS; `slam_trajectory_topic` |\n| 토픽 구독 | `/constraint_list` | `visualization_msgs/msg/MarkerArray` | 동적 QoS; `slam_constraints_topic` |\n| 토픽 구독 | `/scan_matched_points2` | `sensor_msgs/msg/PointCloud2` | 동적 QoS; `slam_matched_points_topic` |\n| 서비스 요청 | `/submap_query` | `cartographer_ros_msgs/srv/SubmapQuery` | allowlist된 읽기 전용 요청; `slam_submap_query_service` |\n| 토픽 구독 | `\u003caction>/_action/status` | `action_msgs/msg/GoalStatusArray` | Discovery된 최대 32개 status/feedback 토픽 내에서 선택 |\n| 토픽 구독 | `\u003caction>/_action/feedback` | `\u003caction package>/action/\u003cAction>_FeedbackMessage` | Discovery 타입과 publisher QoS |\n| 토픽 구독 | `\u003c사용자 선택 / camera 토픽>` | `discovery 타입` | 설정과 웹 선택에 따라 구독 생성 / 해제 |\n\n응용 ROS publisher, service server와 action server/client는 없다. SubmapQuery client는 서브맵을 읽고, 녹화 제어 client는 독립 logger에 요청한다. Discovery에서 해당 이름과 타입이 확인돼야 실제 구독을 생성한다. 표의 타입은 기본 입력의 기대 타입이며 구독은 discovery 타입을 사용한다. `runtime_namespace`가 비어 있으면 prefix는 없다. TF listener 구독은 별도로 생성된다.\n\n동적 QoS는 모든 publisher와 호환되는 reliability/durability를 선택한다. Depth는 image 1, runtime_events 2048, manipulation execution events 100, 그 밖의 토픽 5다. 구독의 존재와 발행 주기는 보장하지 않는다.\n\nHTTP/WebSocket은 `host=127.0.0.1`, `port=8768`이 기본값이다. 주요 경로는 `/api/snapshot`, `/api/camera`, `/api/recordings`, `/api/recordings/{session}/replay`, `/ws`이며 전체 route는 [server.py](../cleany_dev_monitor/server.py)를 따른다. 기록 설정 API는 독립 logger의 서비스를 호출하며 로봇 구동 명령은 보내지 않는다. [관측 데이터 계약](data.md)을 함께 확인한다.\n\n## Logger 연결\n\n`logger_namespace=/cleany_logger` 아래 `start`, `stop`, `configure`, `get_config`에\n`cleany_interfaces/srv/RecordingControl` client를 생성한다. `status`는\n`cleany_interfaces/msg/RecordingStatus`, Reliable, Transient Local, depth 1로\n구독한다. `logger_timeout_s=3.0`은 상태 유효시간과 서비스 응답 제한의 기본값이다.\n서비스 의미와 단위는 [Logger 인터페이스](../../cleany_logger/docs/interfaces.md)를 따른다.\n\nMonitor와 logger의 `state_directory`는 같은 호스트의 같은 디렉터리여야 한다.\nHTTP `PUT /api/recording/settings`는 정지 상태에서 설정하거나 활성 녹화를 정지한다.\n`POST /api/recording/session`은 정지 후 새 세션을 시작하고, 이미 녹화 중이면 같은\n세션을 반환한다. Monitor 종료는 logger 서비스 호출 없이 자체 HTTP와 구독만 닫는다.\n"},"ros2_ws/src/cleany_display/README.md":{"title":"Cleany Jetson 디스플레이","body":"# Cleany Jetson 디스플레이\n\nJetson의 로컬 브라우저에서 얼굴과 안내 문구를 전체 화면으로 표시한다. 로봇 상태는 ROS 2 Humble로 구독하며 HTML, CSS, JavaScript는 설치 폴더에서 제공한다. 인터넷 연결은 필요하지 않다. 상세 구독과 화면 우선순위는 [인터페이스](docs/interfaces.md)를 따른다.\n\n## 독립 설치\n\n배포 폴더는 `/home/cleany/cleany-display`다. `cleany_display`와 사용하는 로봇 버전의 `cleany_interfaces` 사본을 이 폴더에서 독립적으로 빌드한다. 기존 로봇 checkout과 build/install은 수정하지 않는다.\n\n[개발환경 기준](../../../docs/DEVELOPMENT_SETUP.md#jetson-얼굴-디스플레이-환경)의 의존성과 그래픽 자동 로그인 세션이 필요하다. 이 패키지는 시스템 로그인 설정을 수정하지 않는다.\n\n1. Jetson에 준비한 이 구현 레포의 루트에서 배포 파일을 복사한다. 기본 설치 위치는 현재 사용자의 `~/cleany-display`다.\n\n   ```bash\n   display_root=\"$HOME/cleany-display\"\n   mkdir -p \"$display_root/ros2_ws/src\" \"$display_root/config\"\n   cp -R ros2_ws/src/cleany_display ros2_ws/src/cleany_interfaces \"$display_root/ros2_ws/src/\"\n   cp -R ros2_ws/src/cleany_display/scripts \"$display_root/\"\n   cp ros2_ws/src/cleany_display/scripts/standalone.Makefile \"$display_root/Makefile\"\n   cp ros2_ws/src/cleany_display/config/display.json \"$display_root/config/\"\n   ```\n\n2. 설치 폴더의 `config/display.json`에 실제 토픽 이름을 지정한다. `runtime.env`가 필요하면 `ROS_DOMAIN_ID=0`처럼 실제 로봇과 같은 DDS 환경을 넣는다. 별도 지정이 없으면 ROS 기본 domain 0을 사용한다.\n\n3. 독립 workspace와 브라우저를 설치하고 사용자 서비스를 시작한다. 그래픽 로그인한 Jetson 터미널에서 실행한다.\n\n   ```bash\n   cd \"$HOME/cleany-display\"\n   make build\n   scripts/install-browser.sh\n   scripts/install-autostart.sh\n   ```\n\n설치기는 다음 사용자 설정만 추가한다.\n\n- `~/.config/systemd/user/cleany-display.service`: ROS 구독 및 HTTP, 사용자 세션 시작 시 자동 실행\n- `~/.config/systemd/user/cleany-display-kiosk.service`: 전용 Chromium 프로필로 실행, 종료 시 재시작\n- `~/.config/autostart/cleany-display.desktop`: 그래픽 로그인 시 화면 환경을 전달하고 키오스크 시작\n\n자동 로그인 후 전체 화면이 켜진다. 브라우저 설치 경로는 `browser.path`, Chromium 프로필과 캐시는 설치 폴더의 `browser-profile/`, `browser-config/`, `browser-cache/`에 둔다. 브라우저 설치에만 다운로드가 필요하고 이후 화면 실행에는 인터넷이 필요하지 않다. 배포본 갱신 시 `install-browser.sh`의 Playwright 버전을 바꾸고 재설치한 뒤 키오스크를 재시작한다. 키오스크 실행 중에는 GNOME의 idle 동작을 억제한다. HDMI를 연결하면 데스크톱이 선택한 해상도에 맞춰 화면이 다시 배치된다.\n\n전용 브라우저는 [NVIDIA 안내](https://docs.nvidia.com/jetson/archives/r36.5/DeveloperGuide/SD/Graphics/GraphicsProgramming/OpenglEsProgrammingTips.html#graphics-driver-cpu-usage)에 따라 `__GL_YIELD=USLEEP`을 적용해 드라이버 대기 중 CPU 점유를 줄인다. 다른 값이 필요하면 `runtime.env`에서 지정한다.\n\n## 운영\n\n```bash\nsystemctl --user status cleany-display cleany-display-kiosk\njournalctl _SYSTEMD_USER_UNIT=cleany-display.service _SYSTEMD_USER_UNIT=cleany-display-kiosk.service -n 50\ncurl -s http://127.0.0.1:8770/api/state\n```\n\n설정 변경 후에는 `systemctl --user restart cleany-display`를 실행한다. HTTP 주소나 포트를 바꾸면 `runtime.env`의 `CLEANY_DISPLAY_URL`도 맞추고 키오스크를 재시작한다. 웹 자산을 갱신할 때는 독립 workspace의 소스를 교체하고 설치 루트에서 `make build` 후 두 서비스를 재시작한다. 화면 상태 입력 예시는 다음과 같다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource /home/cleany/cleany-display/ros2_ws/install/local_setup.bash\nros2 topic pub --once /cleany/display/state std_msgs/msg/String \\\n  '{data: \"{\\\"mode\\\":\\\"charging\\\",\\\"duration_seconds\\\":5}\"}'\n```\n\n화면을 끄고 자동 시작을 해제하려면 다음 명령을 사용한다.\n\n```bash\nsystemctl --user stop cleany-display-kiosk\nsystemctl --user disable --now cleany-display\nmv ~/.config/autostart/cleany-display.desktop /home/cleany/cleany-display/cleany-display.desktop.disabled\n```\n\n검증 방법은 [테스트 안내](../../../docs/TESTING.md#얼굴-디스플레이)를 따른다.\n"},"ros2_ws/src/cleany_display/docs/interfaces.md":{"title":"Cleany 디스플레이","body":"# Cleany 디스플레이\n\n```mermaid\nflowchart LR\n  ROS[\"미션 · 조작 · odom · 배터리\"] --> Display[\"cleany_display / 상태 매핑\"]\n  Display --> HTTP[\"로컬 HTTP\"]\n  HTTP --> Screen[\"얼굴 화면\"]\n```\n\n[실행과 자동 시작](../README.md) · [관측 도구 전체](../../../../docs/how-to/monitoring.md)\n\n`cleany_display`는 ROS 상태를 구독해 로컬 HTTP 화면에 전달한다. 로봇 제어 토픽을 발행하거나 서비스와 Action을 호출하지 않는다. 토픽 이름과 화면 정책은 `config/display.json`, DDS 환경은 별도 설치 폴더의 `runtime.env`로 설정한다.\n\n| 기본 구독 토픽 | 메시지 | QoS | 표시 의미 |\n|---|---|---|---|\n| `/mission/status` | `cleany_interfaces/msg/MissionStatus` | reliable, transient-local, depth 1 | IDLE → 대기, NAVIGATE_TO_TARGET/RETURN_HOME → 이동, WORKING → 확인, ExecuteOne 단계 → 수거, ERROR → 도움 요청 |\n| `/mission/result` | `cleany_interfaces/msg/MissionResult` | reliable, transient-local, depth 1 | 실행을 관측한 미션의 SUCCESS/PARTIAL_SUCCESS → 완료, 검토 필요 → 도움 요청 |\n| `/manipulation/execution_events` | `cleany_interfaces/msg/ManipulationExecutionRecord` | reliable, transient-local, depth 1 | ACTIVE → 수거 또는 준비 단계 확인, human_confirmation_required → 도움 요청, SUCCESS → 수거 완료 |\n| `/wheel/odom` | `nav_msgs/msg/Odometry` | sensor data | 선속도 크기 0.02 m/s 또는 각속도 절댓값 0.05 rad/s 초과 → 이동, 양의 z 각속도 → 왼쪽 |\n| `/battery_state` | `sensor_msgs/msg/BatteryState` | sensor data | CHARGING(1) → 충전, 유효한 percentage(0–1)만 백분율 표시 |\n| `/cleany/display/state` | `std_msgs/msg/String` | sensor data | JSON으로 제한 시간 동안 화면 상태만 지정 |\n\n충전 표시에는 실제 `BatteryState` 발행자가 필요하다. 이 패키지는 배터리 드라이버를 제공하지 않는다. 수거 실행 기록의 확인 단계는 기본적으로 ValidateRequest, EnsureReady, CaptureScene, SelectArmAndPath, ValidatePlan이며 `checking_substages`로 설정한다.\n\n표시 우선순위는 미션 오류/사람 확인 필요, 제한 시간 지정 화면, 충전, 진행 중 수거, 미션 진행, 측정된 이동, 완료 순서다. 이벤트 방식의 상태는 발행자가 존재하는 동안 유지한다. 주행 측정값은 1.5초, 배터리는 15초 후 만료한다. 완료는 6초 동안 표시하며 이전에 저장된 수거 성공은 timestamp로 걸러낸다. `MissionResult`는 timestamp가 없으므로 가장 최근 실행을 관측한 미션의 결과만 완료로 표시한다.\n\n처음 켰을 때 ROS 입력이 없으면 대기 얼굴을 표시한다. ROS 입력이 있었으나 모든 유효 입력이 사라지면 3초 후 도움 요청과 “연결을 확인해 주세요”를 표시한다. 로컬 HTTP 연결이 끊어져도 브라우저에서 같은 문구를 표시하고 재연결한다. 개별 입력이 없어도 다른 유효 입력이 있으면 그 상태를 사용한다.\n\n## 제한 시간 화면 지정\n\n```json\n{\"mode\":\"charging\",\"duration_seconds\":5,\"direction\":\"forward\"}\n```\n\n`mode`는 idle, moving, checking, collecting, complete, charging, help 중 하나다. `duration_seconds`는 기본 5초, 최대 60초이며 `direction`은 left, forward, right 중 하나다. 선택적인 `message`는 최대 120자의 일반 텍스트로 표시한다. 모드와 시간이 유효하지 않은 요청은 무시한다. 이 입력이 만료되면 관측된 로봇 상태로 돌아간다. 미션 오류와 사람 확인 필요 상태를 가리지 않는다.\n\n## HTTP\n\n기본 주소는 `http://127.0.0.1:8770`이다. `/`는 디스플레이, `/api/state`와 `/healthz`는 읽기 전용 JSON snapshot이다. `mode`, `direction`, `message`, `battery_percent`, `collected_count`, `connected`, `source`, `sources`, `poll_ms`, `rendering`을 반환한다. 알 수 없는 수치는 null이며 데모 값으로 대체하지 않는다. HTTP는 로봇 명령을 받지 않는다.\n\n화면은 16:9 영역을 화면 가운데 맞추고 남는 영역은 어두운 배경으로 채운다. 상태가 반복 수신되어도 애니메이션을 처음부터 다시 시작하지 않는다. 대기 중에는 10초 간격으로 웃기, 둘러보기, 끄덕이기를 반복한다. 충전 중에는 Zzz, 수거 중에는 땀방울을 표시한다. 확인과 수거 동작은 3.2초, 도움 요청은 3.6초를 한 주기로 반복한다.\n\n표정이 바뀌어도 진행 중인 눈 깜빡임과 얼굴 움직임을 이어간다. 눈과 입의 모양, 땀방울과 이동 효과는 현재 모습에서 점진적으로 바뀌며 Zzz는 옅어지면서 사라진다. 안내 문구는 이전 문구가 사라진 뒤 다음 문구를 표시한다. 도움 요청은 얼굴 아래에 배치하고, 이전 안내와 얼굴이 안내 영역을 벗어난 뒤 나타낸다. 모션 감소 설정에서는 전환 효과 없이 즉시 표시한다.\n\n## 렌더링 설정\n\n| 설정 | 기본값 | 브라우저 적용 범위 | 의미 |\n|---|---|---|---|\n| `rendering.max_canvas_width` | 1280 | 320–3840 | 얼굴 비트맵의 최대 가로 픽셀 수 |\n| `rendering.max_pixel_ratio` | 2 | 1–2 | 장치 픽셀 배율의 상한 |\n| `rendering.max_fps` | 60 | 15–60 | 얼굴의 초당 렌더링 횟수 상한 |\n\n기본값은 60fps이고 캔버스는 최대 1280×720이며 화면 크기에 맞춰 확대한다. 안내 글자는 DOM으로 원래 해상도에서 표시한다. 장치의 출력 해상도와 주사율은 별개다. 애니메이션 시간은 렌더링 간격으로 계산하므로 프레임 수를 낮춰도 동작 주기는 유지된다. 상태 변경과 크기 변경 시에는 즉시 다시 그린다.\n\n설정은 상태 응답에 포함되며 서버 재시작 후 브라우저 재실행 없이 적용된다. 브라우저의 requestAnimationFrame 콜백 수와 실제 캔버스 렌더링 횟수는 다르므로 성능 측정에서 구분한다.\n"},"ros2_ws/src/cleany_gazebo_sim/docs/interfaces.md":{"title":"cleany_gazebo_sim 노드 인터페이스","body":"# cleany_gazebo_sim 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## gazebo_command_guard\n\n실행 파일: `gazebo_command_guard`. 원본: [command_guard.py](../cleany_gazebo_sim/command_guard.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10 |\n| 토픽 발행 | `gazebo_cmd_vel` | `geometry_msgs/msg/Twist` | R10; 명령 수신 또는 timeout 정지 시 |\n\nTimeout 검사는 `timeout_check_rate_hz` 기본 20 Hz다.\n\n## gazebo_feedback_sampler\n\n실행 파일: `gazebo_feedback_sampler`. 원본: [feedback_sampler.py](../cleany_gazebo_sim/feedback_sampler.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/gazebo/raw_clock` | `rosgraph_msgs/msg/Clock` | Sensor |\n| 토픽 구독 | `/gazebo/raw_joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n| 토픽 발행 | `/clock` | `rosgraph_msgs/msg/Clock` | R10 |\n| 토픽 발행 | `/joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n\nRaw simulator feedback을 받아 샘플링한다. `publish_period_s` 기본 0.02초는 ROS stamp 간격 기준이며 wall-time 50 Hz를 보장하지 않는다.\n\n## gazebo_odom_tf_publisher\n\n실행 파일: `gazebo_odom_tf_publisher`. 원본: [odom_tf_publisher.py](../cleany_gazebo_sim/odom_tf_publisher.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `gazebo_odom` | `nav_msgs/msg/Odometry` | R10; `input_topic` |\n| 토픽 발행 | `odom` | `nav_msgs/msg/Odometry` | R10; `publish_odometry=true` |\n| 토픽 발행 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n입력 수신 시 `odom_frame_id → base_frame_id` TF를 발행한다. 기본 frame은 odom/base_link다.\n\n## gazebo_pan_tf_publisher\n\n실행 파일: `gazebo_pan_tf_publisher`. 원본: [pan_tf_publisher.py](../cleany_gazebo_sim/pan_tf_publisher.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n| 토픽 발행 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\nPan feedback에서 head camera TF를 발행한다. Frame 이름과 장착 geometry는 노드 parameter를 따른다.\n\n## gazebo_sensor_tf_publisher\n\n실행 파일: `gazebo_sensor_tf_publisher`. 원본: [sensor_tf_publisher.py](../cleany_gazebo_sim/sensor_tf_publisher.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n시작 시 설정된 sensor의 static TF를 보낸다. `parent_frame_id`와 sensor별 frame/translation/rotation parameter가 필요하다.\n\n## simulated_encoder\n\n실행 파일: `simulated_encoder_node`. 원본: [simulated_encoder_node.py](../cleany_gazebo_sim/simulated_encoder_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `joint_states` | `sensor_msgs/msg/JointState` | Sensor; `input_topic` |\n| 토픽 발행 | `wheel_encoder/joint_states` | `sensor_msgs/msg/JointState` | Sensor; 입력 수신 시, `output_topic` |\n\n## simulated_odometry_error\n\n실행 파일: `simulated_odometry_error_node`. 원본: [simulated_odometry_error_node.py](../cleany_gazebo_sim/simulated_odometry_error_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `wheel/odom_raw` | `nav_msgs/msg/Odometry` | R10; `input_topic` |\n| 토픽 발행 | `wheel/odom` | `nav_msgs/msg/Odometry` | R10; 입력 수신 시, `output_topic` |\n\n## ground_truth_route_follower\n\n실행 파일: `ground_truth_route_follower`. 원본: [ground_truth_route_follower.py](../cleany_gazebo_sim/ground_truth_route_follower.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `ground_truth/odom` | `nav_msgs/msg/Odometry` | R10 |\n| 토픽 발행 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10; `control_rate_hz` 기본 20 Hz |\n\n별도 GT 주행 시험용이다. Nav2와 같은 cmd_vel 명령원을 동시에 실행하지 않는다.\n\n## ros_gz_bridge\n\n외부 실행 파일은 `ros_gz_bridge/parameter_bridge`다. [Sensor profile](../cleany_gazebo_sim/launch_helpers/sensor_profile.py)이 `gazebo_\u003cgroup>_bridge`를 만들며 기본 `lidar_nav`는 core와 lidar 그룹을 사용한다. 아래는 [bridge 설정](../config/bridge)의 ROS 측 목록이다.\n\n| 그룹 | 종류 / 방향 | ROS 기본 이름 | ROS 타입 | 조건 |\n|---|---|---|---|---|\n| `core` | 토픽 구독 | `/gazebo_cmd_vel` | `geometry_msgs/msg/Twist` | 선택된 그룹에서 활성화 |\n| `core` | 토픽 발행 | `/gazebo_odom` | `nav_msgs/msg/Odometry` | 선택된 그룹에서 활성화 |\n| `core` | 토픽 발행 | `/ground_truth/odom` | `nav_msgs/msg/Odometry` | 선택된 그룹에서 활성화 |\n| `core` | 토픽 발행 | `/joint_states` | `sensor_msgs/msg/JointState` | Profile launch에서 `/gazebo/raw_joint_states`로 remap |\n| `core` | 토픽 발행 | `/clock` | `rosgraph_msgs/msg/Clock` | Profile launch에서 `/gazebo/raw_clock`로 remap |\n| `core` | 토픽 발행 | `/imu/data` | `sensor_msgs/msg/Imu` | 선택된 그룹에서 활성화 |\n| `lidar` | 토픽 발행 | `/scan` | `sensor_msgs/msg/LaserScan` | 선택된 그룹에서 활성화 |\n| `head_depth` | 토픽 발행 | `/camera/head/depth/image_raw` | `sensor_msgs/msg/Image` | `SENSOR_DATA` |\n| `head_depth` | 토픽 발행 | `/camera/head/depth/camera_info` | `sensor_msgs/msg/CameraInfo` | `SENSOR_DATA` |\n| `head_rgbd` | 토픽 발행 | `/camera/head/color/image_raw` | `sensor_msgs/msg/Image` | ROS 구독자가 있을 때 활성화 |\n| `head_rgbd` | 토픽 발행 | `/camera/head/depth/camera_info` | `sensor_msgs/msg/CameraInfo` | `SENSOR_DATA` |\n| `head_rgbd` | 토픽 발행 | `/camera/head/depth/image_raw` | `sensor_msgs/msg/Image` | 선택된 그룹에서 활성화 |\n| `left_wrist` | 토픽 발행 | `/camera/left_wrist/color/image_raw` | `sensor_msgs/msg/Image` | 선택된 그룹에서 활성화 |\n| `right_wrist` | 토픽 발행 | `/camera/right_wrist/color/image_raw` | `sensor_msgs/msg/Image` | 선택된 그룹에서 활성화 |\n\nQoS를 지정하지 않은 행은 설치된 bridge 기본값을 따른다. `/clock`과 `/joint_states`의 raw 입력은 `gazebo_feedback_sampler`가 정규 토픽으로 다시 발행한다. `bridge_config` override는 sampler와 이 remap을 사용하지 않고 지정 YAML로 단일 `gazebo_override_bridge`를 만든다.\n\n`bridge.yaml`, `navigation_bridge.yaml`은 별도 통합 설정이며 위 profile 표와 동시에 활성화되는 것은 아니다. Gazebo wire type은 Fortress의 `ignition.msgs`를 사용한다. 서비스와 액션 bridge는 현재 설정에 없다.\n\n생성된 Gazebo world의 손목 카메라는 description의\n`config/geometry/wrist_mount_v8.json`에서 렌즈 위치와 광학 방향을 읽는다.\nGazebo의 +X 전방 축을 optical frame의 +Z 전방 축으로 변환하며, SDF의\n`*_wrist_rgb_optical_frame`도 같은 위치와 방향을 사용한다. 이 SDF frame은\nROS TF 발행을 추가하지 않는다. 레거시 모델은 이전 카메라 케이스 visual을\n공유 v8 visual 6개로 교체하고 기존 주행용 상체 충돌 envelope를 유지한다.\nCAD 모델은 URDF의 v8 visual/collision을 사용한다. 기본 CAD 주행 설정은\n양팔과 손목 센서를 제외하며, 팔을 포함한 설정에서만 손목 센서가 생성된다.\nGazebo의 기존 손목 RGB 계약은 640×360이고 MuJoCo의 640×480과 별도다.\n원본 SDF는 입력 템플릿이므로 launch 또는 world generator로 생성해 실행한다.\n"},"ros2_ws/src/cleany_grasping/docs/interfaces.md":{"title":"cleany_grasping 노드 인터페이스","body":"# cleany_grasping 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## grasp_server\n\n실행 파일: `grasp_server`. 원본: [grasp_node.py](../cleany_grasping/grasp_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 서비스 제공 | `grasp/plan` | `cleany_interfaces/srv/PlanGrasp` | Service 기본값; `service_name` |\n| 토픽 발행 | `grasp/debug_image` | `sensor_msgs/msg/Image` | R/T1; 계획 요청 처리 시, `debug_image_topic` |\n| 토픽 구독 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n| 토픽 구독 | `/tf_static` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n`PlanGrasp`는 서비스다. 호출 의미는 [Scene와 Grasp 계약](../../cleany_interfaces/docs/scene-and-grasp.md)을 따른다.\n"},"ros2_ws/src/cleany_grasping/docs/predictors.md":{"title":"cleany_grasping","body":"# cleany_grasping\n\n```mermaid\nflowchart LR\n  Cloud[\"선택된 물체 점군\"] --> Workspace[\"workspace 계산\"]\n  Workspace --> Predictor[\"predictor 후보 생성\"]\n  Predictor --> Filter[\"폭 · 접촉 · 중복 필터\"]\n  Filter --> Rank[\"후보 순위\"]\n  Rank --> MoveIt[\"후속 도달성 / 충돌 검사\"]\n```\n\n후보 생성과 실제 팔 실행은 별도 단계입니다. [조작 경로](../../../../docs/how-to/manipulation.md)에서 실행 모드를 선택하세요.\n\n`GraspNode`가 target cloud의 workspace를 계산해 predictor를 호출하고,\n`core.selector.rank_grasps()`로 폭·접촉 위치·중복 후보를 걸러 순서대로 반환한다.\n이전 단일 후보용 `select_grasp()` wrapper는 제거했다.\n\n길이 방향 접촉 후보는 동일 품질일 때 관측된 체적 중심에 가까운 후보를 먼저\n검사한다. 마우스처럼 끝으로 갈수록 얇아지는 물체에서 가까운 끝부분을 먼저\n집어 손가락이 윗면을 스치는 문제를 줄이기 위한 순서다. 끝부분 후보도 남겨\n중앙 후보의 IK/충돌 검사가 실패하면 평가하며, 점수와 충돌 허용값은 바꾸지 않는다.\n\nsorting launch는 `publish_collision_geometry=true`로 같은 RGB-D target 점군의\n관측 볼록 외곽을 `/grasp/collision_geometry`에 발행한다(reliable/transient-local,\ndepth 16). 일반 node 기본은 false다. target OBB local XY에서 모든 관측점을\n포함하는 볼록 외곽을 만들고, 관측 Z와 OBB 바닥/상단을 포함하는 프리즘을 생성한다.\n숨은 뒷면/구멍을 복원한 실제 mesh가 아니며, cup 내부도 비어 있다고 가정하지 않는다.\n최대 512 vertices를 넘거나 퇴화한 형상은 축소하지 않고 요청을 실패시킨다.\n선택 후보와 동일한 snapshot/object/capture/frame/OBB pose를 별도 메시지로\n전달하여 기존 후보 메시지 및 과거 기록 포맷을 유지한다. collision geometry만\n개선하며 물리 시뮬레이터의 물체 mesh, 질량, 마찰은 변경하지 않는다.\n\n선택 객체에 대해 geometric 또는 AnyGrasp 후보를 필터링하고 score 내림차순\n`GraspCandidate[]`를 반환한다.\n팔 선택, IK, MoveIt collision, trajectory와 실행은 이 패키지의 범위가 아니다.\n\n`geometric.prefer_upward_closing_axis`는 기본 false인 비대칭 그리퍼 진단 옵션이다.\n동일 점수 후보끼리만 fixed-jaw 쪽(+closing)이 위를 향하는 방향을 먼저 둔다.\n점수나 형상은 변경하지 않으며, 실제 파지 성공을 보장하지 않는다. sorting launch의\n`prefer_upward_closing_axis:=true`로 시험할 수 있고 기본 실행은 기존 순서를 유지한다.\n\n`geometric.search_longitudinal_contacts`는 기본 false, sorting launch에서 true다.\n얇고 긴 객체는 중심 외에 긴 방향의 파지 지점도 생성한다. 점군의 지지면 높이/\n길이 비가 `longitudinal_max_height_ratio`(0.4) 이하이고 길이가 finger length보다\n클 때만 `longitudinal_offset_fractions`(0, -0.25, 0.25)를 적용한다. 전체 finger\n길이가 robust 관측 범위 안에 남도록 이동량을 제한한다. 일반 기본은 높이 유지이며,\nsorting의 `longitudinal_contact_height_offset_m=0.003`은 이 조건을 만족하는\n얇고 긴 물체에만 지지면 법선 방향으로 3mm 보정한다. 레고처럼 finger length보다\n짧거나 컵처럼 두꺼운 물체에는 높이 보정도 적용하지 않는다. 이 값은 비대칭 jaw의\n닫힘 구간 지지면 여유를 확보하기 위한 시뮬레이션 시험값이며 실제 로봇 교정값은 아니다.\n폭과 점수는 변경하지 않으며, 동점에서는 robot reference에 가까운 지점을 먼저\n제안한다. context 충돌 검사, 후속 NMS/IK/MoveIt 검사는 그대로다. 물체 라벨이나\n시뮬레이터 실제 위치를 사용하지 않으며, 파지 유지 성공은 별도 물리 검증이 필요하다.\n\nsorting launch의 `geometric.defer_support_plane_collision=true`는 간이 대칭\n손가락 모델에서 지지 평면의 inlier만 제외한다. 평면 위 장애물은 그대로 검사한다.\n이 옵션은 반드시 아래의 실행 계약과 함께 사용해야 하며 단독 실행용이 아니다.\nselector와 executor가 plane-aligned perception OBB의 바닥으로 유한 support\npatch를 등록하고, 실제 로봇 형상으로 열린 jaw 및 전체 닫힘 구간을 검사한다.\n기본 false는 기존 간이 지지면 충돌 검사다. sorting launch는 이 계약의 세 설정을\n함께 활성화하며, 지지면을 무시하거나 MuJoCo 정답 책상 위치를 주입하지 않는다.\n\n## 처리 경계\n\n`grasp/plan` (`cleany_interfaces/srv/PlanGrasp`)은 perception 2단계 결과의 RGB\n`target_cloud`, `context_cloud`, 원본 OBB를 받는다. predictor는 target bounds에 margin을\n더한 workspace에서 후보를 만들고 context를 이용해 충돌 후보를 제거한다. 결과는 score\n정렬, 선택 객체 접촉, gripper 최대 폭과 NMS 필터를 통과해야 한다. 남은 후보가\n없으면 `ERROR_NO_GRASP_CANDIDATE`이며 pose를 합성하지 않는다.\n\n기본 `geometric` predictor는 별도 모델 없이 다음 순서로 top-down parallel-jaw 후보를\n생성한다.\n\n1. context 점군에서 RANSAC으로 지지면 법선을 추정한다.\n2. target 점군을 지지면에 투영하고 최소 폭 방향을 탐색해 두 물체축을 구한다.\n3. 축별 robust extent 중점으로 visible surface 편향을 보정한 3D 중심을 복원한다.\n4. 설정된 support-normal tilt, 각 주축과 yaw offset마다 gripper 폭과 pose를 계산한다.\n5. finger/palm 부피가 target 외 context 점과 겹치는 후보를 제거한다.\n6. 폭 여유, 주축 정렬과 짧은 축 선호도를 점수화한다.\n\n이 방식은 상자·캔처럼 위에서 접근 가능한 단순 강체를 위한 deterministic MVP다. 복잡한\n형상, 변형 물체, 측면 접근과 최종 로봇 충돌 검사는 별도 predictor 또는 MoveIt 단계가\n필요하다.\n\nAnyGrasp import는 adapter가 첫 요청까지 지연한다. `predictor_type: geometric`에서는\ncheckpoint와 SDK license가 필요 없다. `GraspPredictor` port를 구현하면 다른 predictor도\n주입할 수 있다.\n\n## 물체별 접근각 탐색\n\n`geometric.search_approach_tilts=true`이면\n`geometric.approach_tilt_options`의 각도(기본 0/8/16/24도)를 평가한다.\n기존 단일 `approach_tilt_degrees` 경로는 기본값으로 유지한다.\n`include_reverse_closing_axis`는 비대칭 jaw 때문에 필요한 반대 closing\n방향 후보도 생성한다. 분리 수거 launch에서만 두 옵션을 활성화한다.\n각도 후보가 NMS에서 합쳐지지 않도록 이 launch의\n`nms_rotation_threshold_degrees`는 5도로 설정한다(기존 기본 20도).\n물리 그리퍼 최대 폭이나 충돌 검사는 완화하지 않는다.\n여러 tilt와 어깨 기준점을 함께 탐색할 때도 지지면 RANSAC, 물체축·중심,\ntarget 밖 장애물 점 추출은 요청당 한 번만 수행한다. 각 접근 조합은 이 공통\n기하 결과를 읽어 후보 자세만 계산하며 후보 순서·점수·충돌 기준은 유지한다.\n각 조합의 후보는 점수순으로 지연 평가한다. 전체 후보 제한에 도달하면 남은\n후보의 점군 충돌 검사를 실행하지 않으며, round-robin 접근 다양성과 최종 후보\n순서는 전체 후보를 검사한 뒤 자른 결과와 동일하게 유지한다.\n\n## 후보 이미지 확인\n\n각 `grasp/plan` 요청은 `grasp/debug_image`에 800x800 RGB 이미지를 발행한다. 원본 RGB와\ncamera intrinsics가 grasp request에 포함되지 않으므로 pixel overlay가 아니라 추정\n지지면 기준 top view를 사용한다. 주황색은 target, 회색은 context, 파란색 선은 후보 jaw,\n초록색은 최고 점수 후보이며 숫자 뒤 값은 후보 점수다. topic은 `TRANSIENT_LOCAL`이므로\n요청 뒤에 viewer를 열어도 마지막 결과를 받을 수 있다.\n\n```bash\nros2 run rqt_image_view rqt_image_view /grasp/debug_image\n```\n\nAnyGrasp import와 detector 생성은 adapter가 첫 요청까지 지연하므로 ROS 비의존 core와\nfake 테스트는 라이선스 SDK 없이 실행할 수 있다. Jetson service에서는 별도 entrypoint가\nnetwork identity, identity 파일의 SDK Feature ID와 read-only mount를 먼저 검사하고, run command가\nlicense validation과 detector 초기화를 마친 뒤 node를 시작한다. `GraspPredictor` port를\n구현하면 다른 predictor도 주입할 수 있다. adapter는 2026 aarch64 `dev` SDK의\n`create_detector()`와 region steering API를 사용한다.\n\n## 설정\n\n`config/anygrasp.yaml`에서 다음 값을 배포 환경에 맞게 설정한다.\n\n- `predictor_type`: 기본 `geometric`, SDK 사용 시 `anygrasp`\n- `debug_image_topic`: 후보 top-view 이미지 topic\n- `geometric.*`: gripper 형상, 충돌 여유, RANSAC, depth 경계 outlier trim,\n  yaw와 planning-frame 접근 tilt 설정. `reject_robot_opposite_approach`를\n  활성화하면 `robot_reference_position`에서 물체로 향하는 수평 방향과 반대인\n  approach 후보를 생성 단계에서 제거한다.\n- `checkpoint_path`, `license_path`: Jetson-local AnyGrasp SDK 파일\n- SDK 제약상 네 license 파일의 directory 이름은 `license`여야 한다.\n- `gripper_height_m`: SDK collision model의 finger height\n- `planning_frame`: MoveIt planning frame (기본 `base_link`)\n- `maximum_gripper_width_m`: 실제 gripper calibration 뒤 확정할 값\n- `canonical_to_tcp_rotation`: GraspNet canonical frame에서 Cleany\n  `*_grasp_tcp` frame으로의 3x3 row-major rotation\n- `tcp_approach_axis`: Cleany TCP frame에서의 접근 축\n\nCleany의 물리 TCP 접근축은 local `-Y`다. 기본 변환은 GraspNet canonical `+X`\napproach와 `+Y` closing을 각각 Cleany TCP `-Y`와 `+X`에 대응시킨다. 따라서 geometric과\nAnyGrasp 후보 모두 동일한 실제 gripper 접근축 기준의 pose와 방향을 반환한다.\n\n점군은 동일 optical frame/timestamp여야 하며 요청의 OBB pose도 그 frame을 사용한다.\nnode는 촬영 시점 TF를 한 번 조회해 최종 pose, 접근 방향과 OBB pose를 모두 planning\nframe으로 변환한다.\n\n## Jetson 첫 관문\n\n현재 공식 AnyGrasp `dev` branch의 aarch64 지원은 시험 단계이므로 배포 전 아래를 Jetson\nOrin NX에서 별도 확인해야 한다.\n\n1. JetPack 6.2 / CUDA 12.6 호환 PyTorch와 SDK가 요구하는 수정 MinkowskiEngine 설치\n2. 공식 example data로 SDK import, checkpoint/license load, collision-enabled inference\n3. MuJoCo box/can RGB point cloud 각각에서 후보가 하나 이상 생성되는지 확인\n4. `ros2 service call /grasp/plan ...`으로 planning-frame candidate와 RViz marker 검증\n\nSDK와 license는 이 저장소에 vendor하지 않는다. 검증하지 않은 Jetson 호환성을 구현\n사실로 간주하지 않는다. AnyGrasp 전용 고정 MAC service와 license 신청 절차는\n[`containers/vision`](../../../../containers/vision/README.md)을 따른다. host-native feature ID와\ncontainer feature ID는 서로 다르므로 실제 배포 container 안에서 검증한다. 배포 기준\nID는 root-owned identity 파일에만 두며, 다르면 node 시작을 거부한다.\n\n## 빌드와 테스트\n\n```bash\nsource /opt/ros/humble/setup.bash\ncd ros2_ws\ncolcon build --symlink-install --packages-up-to cleany_grasping\nsource install/setup.bash\ncolcon test --packages-select cleany_grasping\ncolcon test-result --verbose\nros2 run cleany_grasping grasp_server --ros-args \\\n  --params-file src/cleany_grasping/config/anygrasp.yaml\n```\n\n`geometric.approach_reference_positions`는 planning frame의 기준점 xyz를\n평탄화한 배열이다(기본 `[0.0]`은 비활성). 책상 정리 launch는 URDF의 두 어깨\n위치로부터 관측 물체 중심을 향하는 수평 접근 방향을 각각 생성한다.\n접근 tilt/어깨 기준점 후보를 교차 배분하며, 반대 closing-axis도 같은 short-axis\n점수를 받아 비대칭 그리퍼의 180도 방향이 후보 제한에서 사라지지 않게 한다.\n물체 위치는 RGB-D에서 오며 기준점은 로봇 기구학 정보다.\n\n## 큰 물체의 접촉 높이\n\nSorting launch는 기하 후보를 최대 96개 생성한다(일반 demo 24개).\n여러 접근 기울기와 closing 방향이 24개 상한에서 잘려 재관측 시 기존 방향과\n호환되는 후보가 사라지는 경우를 보완한다. 실행 selector의 IK 후보 예산은\n24개 그대로이며, 재관측에서는 기존 방향/중심 연속성 조건으로 먼저 선별한다.\n생성 후보의 증가는 파지나 충돌 안전성의 보장이 아니며 기존 검사를 모두 거친다.\n\n`geometric.maximum_top_contact_depth_m`은 기본 및 sorting에서 0(기존 체적 중심)이다.\nDemo launch의 `grasp_maximum_top_contact_depth_m` argument로 같은 값을 전달할\n수 있다(기본 0 유지). 현재 full-close/정밀 IK/관측 mesh 조건에서 0.035m\n높이 제한을 별도 컵 진단으로 시험한다. 과거 0.025m 실패를 성공으로 바꾸어\n기록하지 않으며, 검증 전에는 새로운 기본 운용값으로 채택하지 않는다.\n0.025m 실험에서는 RGB-D target cloud의 support-normal 방향 상단 percentile을\n기준으로 접촉점을 최대 25mm 아래에 둔다. 중심이 이미 더 높으면 그대로 유지해\n레고 같은 얇은 물체를 과도하게 높게 잡지 않는다. 컵에 깊게 들어가 그리퍼 몸체가\n윗부분을 누르던 경우를 줄이기 위한 후보 생성 설정이며 라벨/GT 좌표는 사용하지 않는다.\n로봇 TCP 보정과 충돌 검사, 관절/파지 허용오차는 별도로 그대로 적용한다.\n현재 컵에서는 움직이는 jaw가 빈 내부 공간으로 들어가 접촉하지 않아 이 실험 설정을\n채택하지 않았다. 단순히 높게 잡는 것이 파지 신뢰성을 높이는 것은 아니다.\n\n## 요청 검증과 설정 불변성\n\nTCP 회전과 접근 축은 입력 배열에서 복사한 읽기 전용 값으로 보관한다.\n설정 검증 뒤 외부 배열 변경이 계획 결과를 바꾸지 않게 하며, 반사 행렬은\nquaternion 변환 전에 거부한다. 기존 Cleany local -Y 접근 축 계약은 유지한다.\n\nTarget/context cloud의 촬영 timestamp는 같고 0이 아니어야 한다. 미지정 시각으로\n최신 TF를 사용해 과거 cloud를 계획하지 않도록 요청을 거부한다.\nXYZRGB cloud는 지원되는 field datatype, offset, point/row step 및 전체 data\n길이를 검사한다. 정상적인 organized cloud의 행 padding과 packed RGB는 유지한다.\n"},"ros2_ws/src/cleany_handeye_calibration/docs/frames-and-data.md":{"title":"Hand-eye 좌표와 데이터 계약","body":"# Hand-eye 좌표와 데이터 계약\n\nHand-eye 계산과 재현에 필요한 좌표, 동기화, 저장 조건을 정의한다. 모델, 상수, 허용 한계는 config와 core 코드가 원본이며, 작업 절차는 [CALIBRATION](../../../../docs/CALIBRATION.md)을 따른다.\n\n## 좌표와 동기화\n\n```mermaid\nflowchart LR\n    Target[\"target 좌표\"] -->|\"camera_T_target / PnP\"| Camera[\"camera 좌표\"]\n    Camera -->|\"gripper_T_camera / hand-eye 결과\"| Gripper[\"gripper 좌표\"]\n    Gripper -->|\"base_T_gripper / FK\"| Base[\"base 좌표\"]\n    Target -. \"base_T_target / 합성 변환\" .-> Base\n```\n\nparent_T_child는 child 좌표를 parent로 변환한다. Transform은 다음 식을 만족한다.\n\n`base_T_gripper @ gripper_T_camera @ camera_T_target = base_T_target`\n\n| 항목 | 계약 |\n|---|---|\n| 단위 / quaternion | m, rad, ns / xyzw |\n| 회전 행렬 | Orthogonal, det +1, 오차 1e-6 이내 |\n| Image/CameraInfo | 같은 nonzero stamp, optical frame |\n| FK / position IK | Canonical 12관절 feedback / 팔 5관절 검사 |\n| Capture / timeout | Settle 이후 stamp / monotonic 대기 시간 |\n\nPosition-only IK는 orientation 도달을 보장하지 않는다. 다른 입력의 camera calibration을 아래 fixture 값으로 덮어쓰지 않는다.\n\n| Fixture camera | 값 |\n|---|---|\n| Frame / image | left_wrist_rgb_optical_frame / RGB8 640×480, step 1920 |\n| Distortion / rectification | plumb_bob D=0 / R=I |\n| Intrinsics | fx=fy=227.751496, cx=319.5, cy=239.5 |\n\n## Board와 PnP\n\n| Fixture board | 값 |\n|---|---|\n| ChArUco | 7×5, square 30 mm, marker 15 mm |\n| Dictionary / legacy | DICT_5X5_100 / false |\n| Corner gate | 24개 중 최소 16개 + 4 quadrant coverage |\n\n평면 PnP는 IPPE를 사용하고 IPPE_SQUARE는 사용하지 않는다. Positive-depth 후보를 VVS refine한 뒤 ambiguity를 검사한다. 상위 두 오차 비가 1.05 미만이면 ambiguous이며, 영 오차 특수 기준은 코드의 1e-12를 따른다. 유효하지 않은 관측은 성공 표본으로 기록하지 않는다.\n\n## Dataset과 저장\n\n```mermaid\nflowchart TB\n    Request[\"고정 profile / 표본 요청\"] --> FK[\"FK → IK → state validity\"]\n    FK --> Motion[\"Motion → settle\"] --> Acquire[\"Acquire → PnP\"]\n    Acquire --> PNG[\"PNG 저장 / fsync\"] --> Journal[\"Journal 기록\"]\n    Journal --> JSONL[\"JSONL atomic rename\"] --> Row[\"Row / image hash 대조\"]\n    Journal -. \"부분 쓰기 복구\" .-> Recover[\"Image와 row 대조\u003cbr/>저장 표본 덮어쓰기 금지\"]\n    Recover --> Row\n    Row --> Valid{\"Image와 row가 일치?\"}\n    Valid -->|\"예\"| Evaluate[\"Calibration 20 / held-out 5\u003cbr/>solver별 평가\"]\n    Valid -->|\"아니오\"| Fail[\"누락 / 불일치 보존\u003cbr/>유효 표본으로 처리하지 않음\"]\n```\n\nMaterialized profile은 pose/runtime/URDF, camera K/D/R/P, source hash를 고정한다. 구성은 calibration 20개와 held-out 5개이며 실패 표본을 교체하지 않는다. Random seed, 탐색 제한, 선정 근거, row/image hash, capture provenance를 보존한다.\n\n수집은 요청 → FK → IK → state validity → motion → settle → acquire → PnP → record 순서다. 저장은 PNG fsync → journal → JSONL atomic rename 순서로 수행한다. 부분 쓰기 복구 시 image 없는 row를 유효 처리하지 않으며, 기존 dataset 일부 재사용을 fresh run으로 표시하지 않는다.\n\n## 평가와 적용\n\nTsai, Park, Horaud, Andreff, Daniilidis solver를 평가하고 method별 예외를 분리한다. GT 평가는 simulation 한정이며 held-out, solver 실패도 결과에 남긴다.\n\nOffset, 품질 gate는 명시한 실행 정책을 사용한다. 결과 생성은 자동 TF 게시나 실물 calibration 완료를 의미하지 않는다.\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n"},"ros2_ws/src/cleany_handeye_calibration/docs/interfaces.md":{"title":"cleany_handeye_calibration 노드 인터페이스","body":"# cleany_handeye_calibration 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## single_pose_handeye_orchestrator\n\n실행 파일: `single_pose_calibration`. 원본: [single_pose_runtime.py](../cleany_handeye_calibration/single_pose_runtime.py), [moveit_fk.py](../cleany_handeye_calibration/moveit_fk.py), [ik_port.py](../cleany_handeye_calibration/ik_port.py), [motion_port.py](../cleany_handeye_calibration/motion_port.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n| 토픽 구독 | `/left_wrist_camera/image_raw` | `sensor_msgs/msg/Image` | Sensor |\n| 토픽 구독 | `/left_wrist_camera/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor |\n| 서비스 호출 | `/get_planning_scene` | `moveit_msgs/srv/GetPlanningScene` | Service 기본값 |\n| 서비스 호출 | `/compute_fk` | `moveit_msgs/srv/GetPositionFK` | Service 기본값 |\n| 서비스 호출 | `/compute_ik` | `moveit_msgs/srv/GetPositionIK` | Service 기본값 |\n| 서비스 호출 | `/check_state_validity` | `moveit_msgs/srv/GetStateValidity` | Service 기본값 |\n| 액션 호출 | `/move_action` | `moveit_msgs/action/MoveGroup` | Action 기본값 |\n| 액션 호출 | `/execute_trajectory` | `moveit_msgs/action/ExecuteTrajectory` | Action 기본값 |\n\n`request_file`에서 실행 설정을 읽는다. Topic과 MoveIt endpoint는 코드 상수이므로 이름 변경에는 ROS remap을 사용한다.\n\n## multi_pose_handeye_orchestrator\n\n실행 파일: `multi_pose_calibration`. 원본: [multi_pose_runtime.py](../cleany_handeye_calibration/multi_pose_runtime.py), [single_pose_runtime.py](../cleany_handeye_calibration/single_pose_runtime.py), [moveit_fk.py](../cleany_handeye_calibration/moveit_fk.py), [ik_port.py](../cleany_handeye_calibration/ik_port.py), [motion_port.py](../cleany_handeye_calibration/motion_port.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/joint_states` | `sensor_msgs/msg/JointState` | Sensor |\n| 토픽 구독 | `/left_wrist_camera/image_raw` | `sensor_msgs/msg/Image` | Sensor |\n| 토픽 구독 | `/left_wrist_camera/camera_info` | `sensor_msgs/msg/CameraInfo` | Sensor |\n| 서비스 호출 | `/get_planning_scene` | `moveit_msgs/srv/GetPlanningScene` | Service 기본값 |\n| 서비스 호출 | `/compute_fk` | `moveit_msgs/srv/GetPositionFK` | Service 기본값 |\n| 서비스 호출 | `/compute_ik` | `moveit_msgs/srv/GetPositionIK` | Service 기본값 |\n| 서비스 호출 | `/check_state_validity` | `moveit_msgs/srv/GetStateValidity` | Service 기본값 |\n| 액션 호출 | `/move_action` | `moveit_msgs/action/MoveGroup` | Action 기본값 |\n| 액션 호출 | `/execute_trajectory` | `moveit_msgs/action/ExecuteTrajectory` | Action 기본값 |\n| 서비스 제공 | `/handeye/cancel_run` | `std_srvs/srv/Trigger` | Service 기본값 |\n\n`pose_manifest`와 `runtime_config`로 실행한다. SinglePoseRuntimeEffects를 재사용하며 cancel service 응답은 요청 접수이고 실제 정지 완료는 별도 확인한다.\n"},"ros2_ws/src/cleany_handeye_calibration/docs/offline-tools.md":{"title":"cleany_handeye_calibration","body":"# cleany_handeye_calibration\n\n\n[센서와 보정](../../../../docs/CALIBRATION.md) · [좌표와 데이터 계약](frames-and-data.md)\n\nROS-independent mathematical core and ROS adapters for Cleany's left wrist\neye-in-hand calibration workflow.\n\nThe current package contains immutable data models, frame-aware rigid\ntransforms, the version-1 synchronized sample record, and planar ChArUco\ndetection and PnP. It also provides a failure-isolated OpenCV hand-eye solver,\nevaluation metrics, bounded joint-feedback synchronization, a MoveIt\nfeedback-FK adapter, position-only IK/state-validity/motion adapters, a pure\nfeedback settle gate, exact wrist-camera acquisition, a recoverable dataset\nwriter and an exact nine-stage single-pose orchestrator. A pure deterministic pose generator and fresh-run 20-calibration plus\n5-held-out runner complete the collection workflow. It does not publish\ncalibration TF; generated transforms remain review-only artifacts.\n\nThe former MuJoCo calibration scenes, launches, rendered pose-generation\nadapter, and their runtime tests were removed. Mathematical calibration,\nROS camera/motion adapters, dataset validation, and offline evaluation remain.\nSimulation execution is maintained in the study-cafe packages.\n\n## Transform convention\n\n`RigidTransform(parent_frame, child_frame, ...)` represents\n`parent_T_child`: it maps a point expressed in the child frame into the parent\nframe. Composition checks frame names before multiplying transforms.\n\nFor left eye-in-hand calibration, every synchronized sample follows:\n\n```text\nbase_T_gripper @ gripper_T_camera @ camera_T_target = base_T_target\n```\n\n| Value | Direction | Source or owner |\n|---|---|---|\n| `base_T_gripper` | gripper coordinates to base coordinates | feedback-joint FK |\n| `camera_T_target` | target coordinates to camera coordinates | target PnP |\n| `gripper_T_camera` | camera coordinates to gripper coordinates | unknown calibration result |\n| `base_T_target` | target coordinates to base coordinates | fixed target relation/evaluation |\n\nTranslations use metres, joint and Rodrigues values use radians, timestamps\nuse integer nanoseconds, and serialized quaternions use ROS `xyzw` order.\nRotation matrices are accepted only when all values are finite,\n`||R^T R - I||_F \u003c= 1e-6`, and `|det(R) - 1| \u003c= 1e-6`.\n\n## Core models\n\n- `PositionTarget`: position and reference frame used by position-only IK\n- `JointPose`: ordered complete joint vector, used for seeds and solutions\n- `IkResult`: mutually exclusive success or failure result\n- `TimedJointSample`: timestamped feedback positions and optional velocities\n- `CalibrationSample`: one `base_T_gripper` / `camera_T_target` pair and split\n- `CalibrationSampleRecord`: complete versioned synchronized dataset row\n\nModels copy mutable input into immutable tuples, reject duplicate joint names,\nlength mismatches, invalid timestamps, and non-finite numeric values. A stored\nsample requires the canonical 12 dual-arm/gripper feedback joints, the five\nleft-arm IK seed and result joints, exact image/CameraInfo stamps,\ninterpolation provenance, FK and PnP transforms, and the ordered ChArUco\ncorrespondences used by PnP. The exact `K`, `D`, `R`, and `P` values and their\ncanonical SHA-256 are kept in every row so later experiments can perturb image\npoints and repeat PnP rather than perturbing a final transform.\n\n## Planar ChArUco and PnP contract\n\nThe fixed target has 7 x 5 squares, a 30 mm square length, a 15 mm marker\nlength, and uses `DICT_5X5_100` with `legacy_pattern: false`. The resulting\ninner chessboard contains 24 corners. A detection is valid only when at least\n16 unique, in-range ChArUco corner IDs cover all four object-space board\nquadrants.\n\nUbuntu 22.04 provides OpenCV 4.5.4, so the detector intentionally uses its\nlegacy Python API: `CharucoBoard_create`, `DetectorParameters_create`,\n`detectMarkers`, `interpolateCornersCharuco`, and `board.chessboardCorners`.\nIt does not use the newer `ArucoDetector` or `CharucoDetector` classes.\nFor the 640 x 480 wrist stream it performs detection on a deterministic 2x\ncubic-upscaled grayscale image with subpixel marker refinement, then divides\nthe detected ChArUco coordinates back into the original image pixel frame\nbefore PnP or recording. This does not relax the 16-corner/four-quadrant gate.\n\nPnP uses `solvePnPGeneric(..., flags=SOLVEPNP_IPPE)`, never the four-point\n`SOLVEPNP_IPPE_SQUARE` variant. Both candidates must contain finite values and\nplace every target point at positive camera Z. Each valid raw candidate is\nrefined independently with `solvePnPRefineVVS`; cheirality is checked again,\nand full-corner Euclidean reprojection RMSE is recomputed. Raw and refined\ncandidate transforms, minimum depth, RMSE, and failure reason remain in the\nresult for later artifact recording.\n\nThe lower-RMSE candidate is rejected as `ambiguous_pnp` when both candidate\nRMSE values are at most `1e-12 px`, or when the best RMSE is above that value\nand `second / best \u003c 1.05`. Ground truth is not an input to detection, PnP,\nrefinement, or candidate selection.\n\n## Hand-eye solver and metrics\n\nThe symbolic registry contains every method exposed by OpenCV's\n`calibrateHandEye`: Tsai, Park, Horaud, Andreff, and Daniilidis. Preflight\nfails if an expected constant is missing or a new `CALIB_HAND_EYE_*` constant\nappears without an explicit registry update. All five methods receive copied\nvalues from the same validated calibration samples; an exception or invalid\ntransform from one method is recorded without stopping the other methods.\nThe caller must also provide a positive finite `max_translation_norm_m` through\n`HandEyeTransformValidityPolicy`. This is an approved robot-specific physical\ncamera-offset envelope rather than a hidden solver constant; a finite estimate\noutside it is recorded as an invalid result for that method.\n\nThe OpenCV argument directions are intentionally explicit:\n\n```text\nR_gripper2base, t_gripper2base \u003c- base_T_gripper\nR_target2cam, t_target2cam     \u003c- camera_T_target\nR_cam2gripper, t_cam2gripper   -> gripper_T_camera\n```\n\nOnly samples in the `calibration` split are accepted by the solver. The\nexpected base, gripper, camera, and target frame names are checked before an\nOpenCV method is called, so an inverted transform cannot silently become a\ndifferent hand-eye problem. Ground truth is not part of the solver API.\n\nThe separate evaluator reports translation error in metres and rotation error\nin radians. Held-out consistency reconstructs `base_T_target` for every\nheld-out sample and reports the median and 95th percentile of all pairwise\ntranslation and rotation disagreements. The deterministic synthetic fixture\ncontains 20 calibration poses and 5 held-out poses with a known transform.\n\n## Joint feedback synchronization and FK\n\n`JointStateRingBuffer` stores a bounded, increasing sequence of feedback\nsamples. A valid sample contains the five arm joints and read-only gripper\njoint for both sides (12 revolute joints total). Additional joints may pass\nthrough the buffer but are not sent to MoveIt. Duplicate and small regressing\nstamps are rejected without changing the buffer. A regression at least the\nconfigured clock-reset threshold starts a new ROS-time epoch and discards the\nold one. Capacity and timing limits are explicit constructor inputs.\n\nFor an image header stamp, the buffer requires distinct samples bracketing that\nstamp and requires each source to be within `max_sample_distance_ns`. Position\nis interpolated linearly by joint name, so publisher ordering may change.\nVelocity is recorded and interpolated when both sources provide it, but it is\nnot an FK requirement. The result retains the original before/after ROS stamps\nand exact interpolation ratio. Missing, stale, incompatible, incomplete,\nduplicate, out-of-order, and clock-reset cases have explicit result statuses.\n\n`timed_joint_sample_from_message` obtains data time only from the\n`JointState.header.stamp`. `MoveItForwardKinematicsAdapter` sends exactly the\n12 known joints in canonical order to `/compute_fk`, with\n`RobotState.is_diff=false`, and requests\n`base_link -> left_gripper_frame`. It validates the MoveIt error code, returned\nlink, output frame, pose count, and rigid transform. Service readiness and\nresponse timeout use a monotonic wall clock, so paused or reset ROS simulation\ntime cannot disable the client deadline. Its client and executor poll hook are\ninjectable for tests that do not start a ROS graph.\n\n## Position IK, state validity, motion, and settle\n\nCommit 12 exposes four fixed Humble boundaries. Position IK calls\n`/compute_ik`, state validation calls `/check_state_validity`, plan-only motion\nuses `/move_action`, and execution uses `/execute_trajectory`. The calibration\nallowlist is exactly `left_arm` with `left_gripper_frame`; a right group or tip\nis rejected before a service or action client is contacted. IK targets must be\nexpressed in `base_link`.\n\n`validate_dual_arm_current_state` is the startup and per-motion safety gate. It\nrequires fresh ROS-stamped position and velocity feedback for the canonical 12\narm/gripper joints, then verifies the five right-arm joints are stationary at\nthe approved all-zero park state within the configured tolerance. Freshness,\nright-park position tolerance, and every IK, state-validity, plan, execute,\ncancel, and settle timeout are required `MujocoMotionConfig` inputs; there is no\nshared implicit timeout.\n\n`MoveItPositionIKAdapter` builds a full, non-diff `RobotState` in canonical\n12-joint order. It preserves feedback for the right arm and both grippers,\nreplaces the five left positions with the complete manifest seed, explicitly\nsets `ik_link_name=left_gripper_frame`, and enables collision avoidance. The\nidentity quaternion is only a valid placeholder: the configured KDL solver is\nposition-only and does not receive an orientation constraint. Successful\nresponses must contain a finite solution for all five left joints.\n\n`MoveItStateValidityAdapter` overlays the resolved left solution on the same\nfull feedback state and checks joint/state validity and collision. Only a\nsuccessful check yields a `ValidatedJointGoal`. `MoveItMotionAdapter` refuses a\nraw `JointPose`, stale/partial state, or right-arm park drift. It sends that\nvalidated joint goal to `MoveGroup` with `plan_only=true`, 0.10 velocity and\nacceleration scaling, and then sends only the returned trajectory to\n`ExecuteTrajectory`. Action status and the exact MoveIt error code are retained\nfor success, rejection, abort, cancel, transport failure, and timeout. Timeout\ncancellation has its own bounded monotonic-clock budget. A Humble cancel is\nconfirmed only when the response is `ERROR_NONE` and its `goals_canceling`\narray contains the exact requested goal UUID; a success code for another goal\ndoes not count as confirmation.\n\nThe controller baseline is a 0.05 rad path tolerance and 0.01 rad goal\ntolerance. The original 0.005 rad MuJoCo settle-position trial was below the\nmeasured gravity-loaded steady-state error; repeated runs reached 0.010403\nrad, so the reviewed MuJoCo post-execution settle default is 0.015 rad. The\n0.01 rad/s settle velocity and continuous 1.0 s interval are unchanged. These\nare simulation values, not approved real-robot tolerances. The pure\n`JointSettleDetector` uses only feedback ROS stamps. Every left joint must meet\nboth thresholds simultaneously; a threshold violation or ROS clock regression\nresets the interval. Successful PLAN/EXECUTE actions only arm this gate and\nnever authorize sample acquisition on their own. `MonotonicSettleMonitor`\napplies the separate settle-stage wall-clock timeout, so paused simulation time\ncannot leave the workflow waiting forever and timeout never authorizes a\nsample.\n\n## Camera acquisition and dataset artifacts\n\n`RosExactCameraPairAdapter` copies ROS `Image` and `CameraInfo` messages into a\nROS-independent bounded buffer. A pair is accepted only when both messages\nhave the same nonzero ROS stamp and use\n`left_wrist_rgb_optical_frame`. The fixed runtime contract is RGB8 640 x 480,\n`step=1920`, `plumb_bob`, zero five-coefficient distortion, identity `R`, and:\n\n```text\nK = [227.751496, 0, 319.5,\n     0, 227.751496, 239.5,\n     0, 0, 1]\n```\n\n`P` carries the same focal lengths and principal point with zero translation.\nThe focal length follows\n`fy = height / (2 * tan(vertical_fov / 2))` for the MuJoCo camera's vertical\nFOV of 93 degrees. Image dimensions, encoding, endianness, row step, payload\nlength, `K`, `D`, `R`, and `P` are all checked. Acquisition returns the\nearliest compatible frame whose ROS stamp is strictly later than settle\ncompletion. Queue capacity is explicit, while the wait deadline uses a\nmonotonic wall clock and therefore still expires if simulation time pauses.\n\n`DatasetWriter` writes to a caller-selected artifact root; the repository\ndefault layout is ignored by Git:\n\n```text\nartifacts/handeye/\u003crun_id>/\n├── manifest.yaml\n├── samples.jsonl\n└── images/\u003csample_id>.png\n```\n\nThe manifest is JSON-compatible YAML with its own hash. It records Git commit\nand dirty state; generated URDF, MJCF, and pose-manifest hashes; ROS, MoveIt,\nOpenCV, MuJoCo, `mujoco_ros2_control`, and vendor versions; the full camera and\ntarget contracts; board SVG/PDF hashes and size provenance; simulation,\ncontroller, image, and joint-state rates; every calibration parameter; and the\nrandom seed. Callers must supply these values explicitly.\n\nFor each sample, the lossless PNG is fsynced and renamed first, then a journal\nrecord is fsynced, and finally a complete replacement `samples.jsonl` is\nfsynced and renamed. Reopening the writer replays a valid journal, removes an\nunreferenced image left before journal creation, and verifies row, image,\ncamera, and manifest hashes. Thus a partial write cannot create a committed row\nwith a missing image, and samples committed before an interruption remain\nreadable. Run and sample identifiers reject traversal, dataset directories and\nimages may not be symlinks, and the writer never edits URDF/Xacro or a source\ncalibration profile.\n\n## Single-pose orchestration\n\n`SinglePoseOrchestrator` executes exactly this no-retry sequence:\n\n```text\nRESOLVE_POSITION_IK -> VALIDATE_RESOLVED_POSE -> PLAN -> EXECUTE\n-> WAIT_SETTLED -> ACQUIRE_IMAGE -> DETECT_TARGET\n-> COMPUTE_FEEDBACK_FK -> RECORD_SAMPLE\n```\n\nEvery stage has its own required positive monotonic timeout. A started and\nsucceeded row is appended to `orchestration.jsonl`; an exception appends the\nexact failed stage and reason and prevents every later effect. The validation\nstage requires canonical left-arm soft limits, a required collision margin,\nprecomputed clearance evidence tied to the expected resolved joint vector,\nand MoveIt state-validity success. There are deliberately no production\ndefaults for the still-unapproved safety values.\n\nThe single-pose runtime test uses a CAD-frame simulation fixture. Its target\nposition and 0.146088 m fixture clearance were re-measured with the MuJoCo 3.4\ncontrol scene; a regression test checks both against the current model before\nthe runtime integration test. The required 0.10 m margin and 1e-4 rad resolved\npose match tolerance remain unchanged. This is simulation evidence only.\n\nThe installed `config/single_pose_request.template.json` keeps unresolved\nvalues as `null`. It is documentation and a materialization starting point,\nnot a runnable profile: strict preflight rejects it until the artifact root,\npose, hashes, versions, soft limits, clearance evidence, right-park tolerance,\nand all stage timeouts have been supplied. The artifact root must be absolute\nand should be outside the source tree.\n\n## Pose sets and dataset validation\n\n`pose_generation.py` retains deterministic selection with caller-supplied\ncandidate evidence; `pose_manifest.py` and `pose_run.py` retain strict pose-set\nand run contracts. The old MuJoCo pose-generation profile and adapter are removed.\nThe single- and multi-pose ROS nodes remain available for separately configured\ncamera and motion backends; this package supplies no simulator launch.\n\nExisting datasets can be checked with `validate_handeye_dataset`. Run\n`ros2 run cleany_handeye_calibration validate_handeye_dataset --help` for the\nrequired sample, pose-manifest, runtime-config, URDF, evaluation ground-truth,\ntranslation-bound and output arguments. Evaluation remains review-only and\ndoes not apply a calibration transform.\n\n## Offline solver and timestamp evaluation\n\n`evaluate_handeye` consumes a completed 20 calibration + 5 held-out\n`samples.jsonl` together with its sibling `manifest.yaml`, a materialized\nURDF, an evaluation-only MuJoCo ground-truth artifact, and a separate\ncontinuous-motion observation log. It verifies the manifest's own hash and\nrequires its URDF hash to match before reading solver inputs. It executes\nexactly 5 OpenCV methods x 3 noise conditions x 10 recorded seeds = 150 solver\nruns. The fixed conditions are ideal `(0 px, 0 deg)`, nominal\n`(0.5 px, 0.05 deg)`, and stress `(1.0 px, 0.10 deg)`.\n\nFor a condition/seed, all five methods receive the same hashed PCG64 noise\nbundle. Pixel noise is applied to the recorded ordered ChArUco image points\nbefore IPPE PnP is rerun. Joint noise is applied only to the five left-arm\nfeedback positions before the materialized URDF chain reruns FK. Neither the\nmeasured transforms nor ground truth are perturbed directly. Only the 20\ncalibration rows enter `calibrateHandEye`; the 5 held-out rows are reserved for\nbase-target consistency.\n\nThe report includes valid-result rate, translation/rotation median and linear\n95th percentile, held-out consistency, runtime, every failure reason, and all\n150 rows. Methods below 0.95 valid rate are excluded. Selection uses the four\naccuracy metrics as a Pareto comparison, then held-out consistency; crossed\nresults remain `review_required`. A selected transform is always the clean\nideal result from the first recorded seed. Timestamp offsets are evaluated\nonly for that one selected method, using a separate continuous joint-state and\nimage-observation JSONL log. Static pose before/after stamps are not treated as\na continuous-trajectory sensitivity dataset.\n\nThe continuous JSONL uses two strict row kinds. `joint_state` carries a ROS\n`stamp_ns`, the canonical 12 names, positions, and optional velocities;\n`image_observation` carries a distinct calibration sample/pose ID, image\nstamp, and PnP-derived `camera_to_target`. The evaluator interpolates the\njoint series at `image_stamp_ns + offset_ns` and reruns URDF FK. This artifact\nis collected during continuous motion and is not synthesized from stationary\nsample brackets.\n\n`config/evaluation.template.yaml` intentionally leaves the robot-specific\ntranslation validity bound and timing settings unresolved. After review,\nmaterialize it and run:\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource ros2_ws/install/setup.bash\nros2 run cleany_handeye_calibration evaluate_handeye \\\n  --samples /absolute/run/samples.jsonl \\\n  --continuous-log /absolute/run/continuous_trajectory.jsonl \\\n  --urdf /absolute/run/cleany.urdf \\\n  --ground-truth /absolute/run/evaluation-only-ground-truth.yaml \\\n  --config /absolute/run/evaluation.yaml \\\n  --output-directory /absolute/run/evaluation\n```\n\nThe output directory contains `pnp_candidates.jsonl`, `solver_results.csv`,\n`timestamp_sensitivity.csv`, `metrics.yaml`, and `candidate_transform.yaml`.\nThe PnP journal retains both raw/refined IPPE candidates, depth, RMSE, and\nfailure details for every sample/noise bundle. Every result is marked\n`candidate_not_applied`;\nthe command never edits URDF/Xacro or an official calibration profile, and\npromotion always requires human review. Ground truth is accepted only by this\noffline evaluator and remains absent from solver, detector, PnP, ROS TF, and\ncollection interfaces.\n\n## Dependencies\n\nThe transform conversion functions use the Ubuntu/ROS system installations of\nNumPy, OpenCV, and PyYAML. On the target Ubuntu 22.04 / ROS 2 Humble\nenvironment these are provided through the `python3-numpy`, `python3-opencv`,\nand `python3-yaml` rosdep keys.\nThe mathematical, synchronization, configuration, and settle core does not\nimport `rclpy`. The FK, IK, validity, and motion adapters use `rclpy`,\n`action_msgs`, `moveit_msgs`, and `sensor_msgs`, but their focused tests use fake\nclients, goal handles, and futures without a running ROS graph. The single-\nand multi-pose nodes use the standard ROS action/message packages declared\nin the manifest. The multi-pose node exposes run cancellation through `std_srvs/Trigger`.\n\n## Verification\n\nRun the focused tests and package build in the ROS 2 Humble environment:\n\n```bash\nsource /opt/ros/humble/setup.bash\ncd ros2_ws/src/cleany_handeye_calibration\npython3 -m pytest \\\n  test/test_joint_state_sync.py test/test_moveit_fk.py \\\n  test/test_motion_config.py test/test_ik_adapter.py \\\n  test/test_motion_adapter.py test/test_settle_detector.py \\\n  test/test_camera_acquisition.py test/test_ros_camera_adapter.py \\\n  test/test_schema.py test/test_dataset_writer.py\npython3 -m pytest \\\n  test/test_single_pose_orchestrator.py \\\n  test/test_single_pose_runtime_config.py\npython3 -m pytest \\\n  test/test_pose_diversity.py test/test_pose_manifest.py \\\n  test/test_pose_generation.py test/test_pose_run.py \\\n  test/test_multi_pose_runtime.py\npython3 -m pytest \\\n  test/test_offline_fk.py test/test_experiment_evaluation.py \\\n  test/test_timestamp_sensitivity.py test/test_evaluation_artifacts.py\npython3 -m pytest test\ncd ../..\ncolcon build --symlink-install --packages-select cleany_handeye_calibration\nsource install/setup.bash\nPYTEST_DISABLE_PLUGIN_AUTOLOAD=1 colcon test --python-testing pytest \\\n  --packages-select cleany_handeye_calibration\ncolcon test-result \\\n  --test-result-base build/cleany_handeye_calibration --verbose\n```\n"},"ros2_ws/src/cleany_interfaces/docs/manipulation.md":{"title":"단일 객체 Manipulation 계약","body":"# 단일 객체 Manipulation 계약\n\nMission은 승인한 객체를 실행 서버에 전달하고, 서버 내부 BT는 executor가 소유한다. 이 실행 계약은 reachable-grasp plan-only action과 별개다.\n\n## 인터페이스\n\n| 항목 | 원본 / 기본 이름 |\n|---|---|\n| 실행 action | ExecuteManipulationSkill.action / mock/manipulation/execute_skill |\n| 진행, 결과 record | ManipulationExecutionRecord.msg |\n| 취소 service | CancelManipulation.srv / mock/manipulation/cancel; Mission은 ROS Action cancel 사용 |\n| 조회 service | GetManipulationExecution.srv / mock/manipulation/get_execution |\n| 요청 | mission/task/execution ID, skill_name, snapshot ID, uint32 object ID, destination ID |\n\n## 요청과 재전송\n\n```mermaid\nsequenceDiagram\n    participant R as Mission Runtime\n    participant J as SQLite journal\n    participant P as 조작 실행 서버\n    R->>R: 요청 검증 / execution UUID 발급\n    R->>J: 전체 요청 저장\n    R->>P: ExecuteManipulationSkill / 같은 goal UUID\n    alt 결과 수신\n        P-->>R: ROS terminal + payload\n        R->>R: ID / 출처 / placement / 팔 복귀 / 정지 검사\n        R->>J: 전체 결과 저장\n    else 결과 불명확 / 재시작\n        R->>P: 같은 execution ID 조회\n        Note over R,P: 재시작 취소는 저장된 goal UUID만 대상\n        P-->>R: 기록 / 진행 상태 / found=false\n        R->>R: 확인 전 gate 유지\n        Note over R,P: 새 ID로 자동 재전송하지 않음\n    end\n```\n\nRuntime은 wire object ID를 Planner 제안과 대조하며 표시 ID에서 숫자를 추정하지 않는다. Destination은 RuntimePolicy allowlist로 검사한다.\n\n행동마다 execution UUID를 발급하고 **전체 요청을 SQLite에 저장한 뒤 전송**한다. ROS goal UUID도 같은 값을 사용하므로 지연 수락, 재시작 취소는 정확한 goal만 대상으로 한다. 결과가 불명확하면 같은 execution ID로 조회하며 새 ID로 자동 재전송하지 않는다.\n\nAction 이름을 remap하면 Mission client와 서버가 해결된 Action 이름을 사용하며 CancelGoal 경로도 함께 맞춘다. Record의 `accepted_at_ns`, `updated_at_ns`, `evidence_at_ns`는 서버 wall 시각의 nanosecond다. 실행 timeout은 별도 steady clock으로 처리한다.\n\n## 성공 판정\n\n현재 peer는 BLOCKED도 ROS SUCCEEDED로 반환할 수 있다. 따라서 Runtime은 ROS terminal뿐 아니라 다음 payload 조건을 함께 검사한다.\n\n- SUCCESS, 일치하는 execution ID와 mock 출처\n- LEFT_GRIPPER, CONFIRMED, placement 검증 완료\n- 팔 복귀와 정지 확인\n\nFeedback stage는 완료 증거가 아니다. 전체 결과와 task/execution/destination ID는 journal, report_json.actions에 보존하며, peer CANCELED는 Runtime CANCELLED로 변환한다.\n\n## 주행과 복구\n\n| 상태 | 처리 |\n|---|---|\n| HELD/UNKNOWN, 팔 미복귀, 사람 확인 필요 | Home, 다음 미션 이동 차단; 취소 결과가 CANCELLED여도 FSM ERROR 유지 가능 |\n| reset_error | 주행 가능 조건 우회 금지 |\n| found=false | 저장 오류/기록 없음 미구분; 미실행, 정지 증거로 사용 금지 |\n| 진행 중, INTERRUPTED, 불일치 결과 | Gate 유지 |\n| 재시작 | 저장 UUID의 취소, 조회만 수행; 미션 자동 재개 금지 |\n\n현재 peer에는 수동 팔 복구, 해제 계약이 없으므로 Runtime은 임의 복구를 수행하지 않는다. 진단은 journal의 manipulation_boundary metadata에 남긴다.\n\n## 진단과 보고 호환\n\n[Action](../action/ExecuteManipulationSkill.action)의 Result에는 `failed_substage`, `cancel_mode`, Feedback에는 `substage`가 있다. [Record](../msg/ManipulationExecutionRecord.msg)는 현재와 완료 substage, 취소 방식을 포함한다. 모든 제공자와 호출자를 하나의 install prefix에서 재빌드한다.\n\n기존 `ManipulationOutcome`, `RuntimeReport.actions`, MissionResult와 Gateway payload는 유지한다. 추가 필드는 `manipulation_boundary`의 선택적 `details` metadata에 저장하고, 과거 metadata에 없으면 빈 값으로 읽는다. Mission DB schema는 바꾸지 않는다.\n\nTransport는 전송한 execution ID와 일치하는 최신 Feedback 하나만 보관한다. 새 실행 때 초기화하고 이전 실행이나 종료 후의 늦은 Feedback을 무시한다. `manipulation_feedback`, `manipulation_details`는 debug JSON의 선택적 정보이며 수신과 debug 발행 실패는 제어 흐름에 영향을 주지 않는다.\n\n취소는 정확한 Goal UUID의 기본 CHECKPOINT 모드를 사용한다. 취소 ACK는 완료나 정지 증거가 아니다. `IMMEDIATE`, `RETURN_ARM`을 선택하는 Mission API는 제공하지 않는다. FATAL이나 정지 미확인은 ERROR를 유지하며, 팔 미복귀 시 이미 안착한 결과를 보존하면서 주행을 차단한다. 손상된 DB는 오류로 처리하고 자동 초기화하지 않는다.\n\n관련 안내: [Mission](mission.md), [검증](../../../../docs/TESTING.md).\n"},"ros2_ws/src/cleany_interfaces/docs/mission.md":{"title":"Mission과 Gateway 계약","body":"# Mission과 Gateway 계약\n\nBackend는 queue와 배차를, Mission Runtime은 수락 이후 실행과 영속 결과를 소유한다. Runtime에는 별도 queue가 없으며 한 번에 미션 하나만 수락한다. 필드는 패키지 msg/srv, 설정은 cleany_mission_manager/config/runtime.yaml이 원본이다.\n\n## 인터페이스\n\n| 상대 이름 | 의미 |\n|---|---|\n| `mission/offer` | clean_desk, SEAT, canonical seat ID 요청 수락 |\n| `mission/cancel` | 비동기 취소 수락 |\n| `mission/snapshot` | 현재 상태와 보존된 최종 보고 |\n| `mission/reset_error` | 정지, 팔 주행 가능, Nav2 준비 확인 후 명시적 오류 해제 |\n| `mission/status`, `mission/result` | transient-local 상태와 최신 최종 보고 |\n| `mission/stop` | Supervisor의 정지 요청 Action. Runtime이 자기 동작의 정지를 확인한 뒤에만 stopped=true |\n| `system/check_permission`, `system/heartbeat`, `system/state`, `system/capabilities` | Supervisor 허가 lease와 가용성 입력 (`supervision_mode=required`) |\n| `robot/safety_fault`, `robot/safety_released` | 안전 소유자의 fault/release 알림 (`supervision_mode=disabled`일 때만) |\n\nOffer/Cancel의 accepted는 수락 응답이며 완료 증거가 아니다. 같은 ID로 같은 요청을 보내면 재실행하지 않고, 같은 ID에 다른 내용을 보내면 거절한다. Runtime 진단 sequence와 Backend 미션별 sequence는 별개다.\n\n## 수락과 완료\n\n```mermaid\nsequenceDiagram\n    participant B as Backend\n    participant G as Gateway bridge\n    participant M as Mission Runtime\n    participant J as SQLite journal\n    B->>G: mission.offer\n    G->>M: OfferMission\n    M->>M: 준비 / 요청 / 중복 검사\n    alt 새 요청 수락\n        M->>J: 수락 기록 영속 저장\n        M-->>G: accepted\n        G-->>B: mission.accepted\n        M->>M: 주행 / 작업 / 종료 정책 실행\n        M->>J: 최종 결과 영속 저장\n        M-->>G: MissionResult\n        G-->>B: mission.result\n    else 거절 또는 중복\n        M-->>G: 사유 또는 보존된 결과\n        G-->>B: 응답 / 상태 동기화\n    end\n```\n\n수신 ACK, 실행 수락, 최종 결과는 서로 다른 시점이다.\n\n## 정상 실행\n\n```mermaid\nstateDiagram-v2\n    [*] --> IDLE\n    state \"실행 중\" as Active {\n        NAVIGATE_TO_TARGET --> WORKING: 도착 / 정지 확인\n        WORKING --> POST_MISSION: 청소 BT 성공\n        POST_MISSION --> RETURN_HOME: return_home\n    }\n    IDLE --> NAVIGATE_TO_TARGET: 요청 수락\n    POST_MISSION --> IDLE: wait_for_next\n    RETURN_HOME --> IDLE: 복귀 / 정지 확인\n    Active --> CANCELLING: 취소 / 실패\n    CANCELLING --> RETURN_HOME: 취소 후 복귀 정책 / gate 통과\n    CANCELLING --> IDLE: 정지 / 주행 가능 확인\n    CANCELLING --> ERROR: 정지 미확인 / 치명적 오류 / 주행 차단\n    IDLE --> ERROR: 안전 fault / 복구 필요\n    ERROR --> IDLE: 조건 충족 / 명시적 reset\n```\n\n정상 실행은 대상 이동, 작업, 완료 후 정책 순서다. 종료 전 최종 보고를 저장한다. 취소 후 복귀에는 정지, 팔의 주행 가능 상태, 복귀 정책, Nav2 준비가 모두 필요하다. ERROR 해제 조건은 아래 표를 따른다.\n\n### 청소 BT\n\n```mermaid\nflowchart TB\n    Observe[\"ObserveBefore\"] --> Plan[\"PlanNext\"]\n    Plan --> Validate[\"ValidateProposal\u003cbr/>snapshot / object ID / capability 검사\"]\n    Validate --> Execute[\"ExecuteOne\u003cbr/>수거 실행 또는 done / skip / human_review 처리\"]\n    Execute --> Reobserve[\"Reobserve\u003cbr/>fresh 관측\"]\n    Reobserve --> Verify{\"VerifyCompletion\u003cbr/>done 제안과 잔여 대상 확인\"}\n    Verify -->|\"추가 작업\"| Plan\n    Verify -->|\"완료 확인\"| Done[\"BT 성공 / POST_MISSION\"]\n    Validate -->|\"거절 / 오류\"| Fail[\"실패 보존 / 정지 절차\"]\n    Execute -->|\"치명적 오류 / 주행 불가\"| Fail\n    Verify -->|\"실패 확정\"| Fail\n```\n\n청소 BT는 처음 장면을 관측한 뒤 계획, 제안 검증, 객체 하나의 실행, 재관측, 완료 검증을 반복한다. Snapshot/object ID와 capability를 검사하며, done 제안도 fresh 관측에서 잔여 대상을 확인한 뒤 완료한다. Skip과 human_review는 조작 명령 없이 기록하며 done도 조작 명령을 보내지 않는다.\n\n보고에는 skip, 사람 확인, 실패, 취소를 보존한다. Mock 관측 ID는 실제 사진이 아니다.\n\n## System Supervisor 감독\n\n`supervision_mode=required`(기본)에서는 System Supervisor가 시스템 Fault, Capability와 Nav2 lifecycle 가용성을 소유하고 Runtime은 실행, 정지, 재개와 journal을 소유한다. Supervisor 계약은 [System Supervisor](../../cleany_system_supervisor/docs/supervision.md)를 따른다.\n\n```mermaid\nsequenceDiagram\n    participant M as Mission Runtime\n    participant S as System Supervisor\n    participant N as Nav2 / 조작\n    M->>M: offer: 캐시된 Supervisor 가용성 확인\n    M->>S: CheckPermission (mission_id, supervision_capabilities)\n    S-->>M: lease (TTL, epoch, version)\n    M->>N: lease가 유효할 때만 첫 동작\n    loop TTL/3마다\n        M->>S: 갱신\n    end\n    S--)M: 철회 snapshot 또는 StopMission\n    M->>N: 취소\n    M->>M: 자기 동작의 정지 확인 / 최종 보고\n    M-->>S: StopMission stopped=true, 정상 종료면 release\n```\n\n| 상황 | 처리 |\n|---|---|\n| Offer | Runtime 준비 + Supervisor heartbeat, OPERATIONAL/DEGRADED, 요청 Capability AVAILABLE. 사유는 `SUPERVISOR_UNAVAILABLE`, `SYSTEM_\u003cstate>`, `CAPABILITY_UNAVAILABLE:\u003cnames>` |\n| 첫 동작 전 lease 대기 | `permission_timeout` 안에서만 대기, 초과 또는 거절이면 동작 없이 종료 |\n| 실행 중 lease 상실 | 만료, 철회, heartbeat 단절, epoch 변경 모두 즉시 정지. 최종 보고는 BLOCKED / `PERMISSION_REVOKED`, 조작 단계였으면 사람 확인 |\n| 상실 후 Runtime 상태 | 정지가 확인되면 IDLE. 시스템 Fault는 Runtime 실행 오류가 아니므로 ERROR가 아님 |\n| 정지 미확인 | 기존 규칙대로 ERROR. lease는 release하지 않고 abandon하여 Supervisor가 정지를 직접 재확인 |\n| StopMission | 해당 미션이면 정지를 시작한다. 이 Runtime에 실행 중인 미션이 없으면 정지 증거로만 답한다. 기한은 `cancel_timeout + 0.5 s` |\n| 독립 안전 fault | safety adapter → Supervisor ESTOP/SAFETY Fault → lease 철회. `robot/safety_*` 구독은 만들지 않음 |\n| 오류 해제 | Runtime ERROR는 `mission/reset_error`, Supervisor Fault는 `system/request_fault_reset`가 각각 소유 |\n\nAdmission의 가용성 확인은 snapshot 하나만큼 늦을 수 있는 사전 확인이며, 동작 권한은 lease만이 부여한다. 팔 상태에 따른 주행 허가(`safe_to_drive`)는 계속 Runtime이 조작 결과로 판단한다.\n\n## 취소, 안전, 재시작\n\nNav2는 설정된 lifecycle node 모두 active이고 lifecycle_timeout 이내 응답해야 준비 상태다. 감독 모드에서는 이 확인을 Supervisor의 NAVIGATION Capability가 대신하며 Runtime은 action server, odom, localization TF만 확인한다. 기본 목록은 map_server, amcl, planner_server, controller_server, bt_navigator, collision_monitor다. Deadline은 steady clock과 runtime.yaml 값을 사용한다.\n\n| 조건 | 처리 |\n|---|---|\n| Nav2 action server만 준비 | NAV2_NOT_READY, goal 미전송 |\n| 취소 요청 | Nav2 terminal + fresh odom 정지 확인; ACK만으로 IDLE 전이 금지 |\n| 정지 확인 기한 초과 | ERROR 유지 |\n| Safety fault (감독 해제 모드) | Producer가 실제 정지 먼저 수행; Runtime은 물리 E-stop 아님 |\n| Fault 해제 (감독 해제 모드) | 일치하는 release + 정지 확인 + 명시적 reset |\n| 재시작 당시 미완료 미션 | INTERRUPTED, 사람 확인 필요; 자동 재개 금지 |\n| Backend 단절 | 수락한 미션 계속 실행; 재연결 후 상태와 결과 동기화 |\n\nSQLite journal은 수락, 출처, goal UUID, 최종 결과, 오류를 저장한다. 재시작 시 저장된 UUID의 orphan goal만 취소하고 정지, 준비를 확인한다.\n\n## Gateway schema v1\n\ncontrol_bridge는 `ws(s)://\u003cbackend>/api/robots/cleany-01/gateway/ws`를 ROS에 연결한다. mission.offer의 clean_seat를 ROS clean_desk/SEAT로 변환하고 canonical seat ID를 보존한다.\n\n연결, 재연결, sync마다 fresh snapshot을 보내고 **snapshot ACK 이후** 해당 연결의 feedback, 명령을 허용한다. RPC timeout은 수락 여부가 불명확하므로 거절을 합성하지 않고 재동기화한다.\n\n| 항목 | 의미 |\n|---|---|\n| ACK / mission.accepted / mission.result | 수신 / 수락 / 최종 결과 |\n| SQLite outbox | Event ID, 미션별 sequence, payload를 ACK까지 보존하고 재전송 |\n| Snapshot | 최근 100개 최종 보고; IDLE이어도 port 미준비면 가용 ERROR |\n| Mock before/after_observation | null; outcome과 사람 확인은 보존 |\n| Schema, 인증, media 정책 | control-plane 저장소 소유 |\n| Parameter 기본값 | control_bridge node 기준 |\n\n## 개발 관측\n\n| 토픽 | 계약 |\n|---|---|\n| debug_snapshot | reliable/transient-local depth 1, schema v1 |\n| runtime_events | reliable/transient-local depth 2048, boot ID, 연속 sequence |\n\n관측 토픽은 명령 경로가 아니다. 소비자는 재시작과 sequence gap을 구분해야 한다.\n\n관련 안내: [실행](../../../../docs/RUNNING.md), [Manipulation](manipulation.md).\n"},"ros2_ws/src/cleany_interfaces/docs/mobile_base.md":{"title":"Mobile base 계약","body":"# Mobile base 계약\n\nMuJoCo, Gazebo, 실물 base는 차체 속도를 같은 ROS 계약으로 받는다. `/cmd_vel`은 연속 명령 스트림이며 성공 응답을 반환하지 않는다. 실제 이동은 `/odom` 등의 상태로 확인한다.\n\n## 인터페이스\n\n| 항목 | 계약 |\n|---|---|\n| 기본 토픽 / 타입 | /cmd_vel / geometry_msgs/msg/Twist |\n| 좌표계 | base_link; Twist에는 frame ID 없음 |\n| 구독 이름 | 상대 이름 cmd_vel; namespace/remapping 허용 |\n| linear.x / linear.y | 전진 / 좌측이 양수, m/s |\n| angular.z | 반시계 회전이 양수, rad/s |\n\n## 명령 처리\n\n수신자는 x/y/yaw를 각 축의 최대 절댓값으로 제한한다. 제한값과 timeout은 양의 유한 설정값이며, 실물 사양과 안전 검토로 결정한다.\n\nTwist에는 stamp가 없으므로 timeout은 수신 monotonic 시각으로 판단한다. 발행자는 timeout보다 충분히 짧은 주기로 명령을 반복해야 한다. 목표 0은 실제 정지 완료를 의미하지 않으며, 감속 거리와 시간은 backend별로 검증한다.\n\n| 입력 조건 | 처리 |\n|---|---|\n| linear.z / angular.x / angular.y가 nonzero | 경고 후 해당 축 무시; 발행자는 0 사용 |\n| 여섯 축 중 NaN/Inf 포함 | 메시지 전체 폐기, 정지 목표 적용 |\n| Timeout 동안 새 명령 없음 | 정지 목표 적용 |\n\n## 소유권\n\n한 시점에 명령원 하나만 cmd_vel을 제어한다. Nav2, teleop, 시험 명령의 선택은 별도 mux가 담당한다. Mission Manager는 cmd_vel을 직접 발행하지 않고 Navigator/Nav2에 주행을 위임한다.\n\n이 계약은 차체 Twist까지만 정의한다. Wheel 목표, MCU 통신, encoder, PID, PWM은 backend 내부 계약이다.\n"},"ros2_ws/src/cleany_interfaces/docs/observation-contracts.md":{"title":"cleany_interfaces","body":"# cleany_interfaces\n\n`ObservedObjectGeometry`는 `/grasp/collision_geometry`의 선택적 관측 형상\n인터페이스다. header의 capture stamp/frame, snapshot_id, object_id로 기존\nGraspCandidate와 연관하고, mesh_pose는 header frame 기준이며 Mesh vertices는\nmesh_pose의 local 좌표다. convex footprint를 인식된 지지면까지 돌출한 형상으로,\n실제 숨은 형상이나 시뮬레이터 정답을 의미하지 않는다. 별도 mesh 메시지이며,\n다른 인터페이스의 필드 변경과 호환성은 각각의 계약을 확인한다.\n메시 타입 의존성에 shape_msgs가 포함된다.\n\n`ObserveWristTarget.srv`는 RGB-only 손목 인계/확인 서비스다.\nHANDOFF는 head source ID, 원본 label/confidence와 예상 base-frame OBB를 전달받아\n손목 영상에서 segmentation reference를 만든다. 별도 손목 detection은 선택 옵션이다.\nCHECK는 같은 arm/source/reference의 새 RGB mask를 반환한다. CLEAR는 참조를 해제한다.\n`expected_pose`는 입력 추정치일 뿐 측정값이 아니며 응답은 촬영 header와 mask만\n포함한다. 손목에서 측정한 depth/3D 높이를 주장하지 않는다.\nHANDOFF의 `expected_pose.header.stamp`는 원본 head 관측 시각이다.\n`after_stamp_ns`보다 새로운 손목 image/CameraInfo 쌍만 처리한다.\n\n응답 `status`는 `ERROR=0`, `OK=1`, `NOT_DETECTED=2`를 구분한다.\n`OK`만 `success=true`다. `NOT_DETECTED`는 정상적인 새 RGB/CameraInfo와 TF로\n투영을 확인했지만 대응 물체가 검출되지 않은 경우다. CHECK 미검출에도 기존\nreference/source ID와 실제 촬영 header를 반환하며 mask는 비어 있다.\n호출자는 이 촬영 시각 이후의 프레임으로 재시도할 수 있다. 센서·TF·추론 오류,\n참조 불일치, 중복 후보와 잘못된 mask는 `ERROR`이며 미검출로 취급하지 않는다.\nHANDOFF 미검출은 파지 진행을 허용하는 참조를 만들지 않는다.\n이 status 필드 추가로 wire/CDR 형식이 바뀌므로 제공자와 호출자를 함께 재빌드하고\n재시작해야 한다. 이전 ObserveWristTarget CDR 기록은 이전 인터페이스로 읽는다.\n\n## VerifyPlacement\n\n`srv/VerifyPlacement.srv`는 label, destination_id, release 이후 기준\n`after_stamp_ns`를 받아 success/message로 실제 놓기 결과를 응답한다.\n그리퍼 열기 명령의 성공은 놓기 성공이 아니다. 현재 제공자는 시뮬레이션\n평가용 oracle이며 조작 코드에는 물체 정답 pose를 반환하지 않는다.\n실제 로봇에는 독립 센서 기반 검증 제공자가 필요하다.\n\nCleany perception snapshot, grasp candidate 생성과 MoveIt 도달 가능성 검증이\n공유하는 ROS 2 interface package다. 구현 내부 model이나 provider별 응답은 wire\ncontract로 노출하지 않는다. 커스텀 메시지뿐 아니라 표준 ROS 메시지를 사용하는\n프로젝트 공통 topic 계약도 이곳에 기록한다.\n\n## 객체 메시지\n\n`DetectedObject2D`와 `DetectedObject2DArray`는 Gemini detector가 반환한 RGB pixel\nbounding box, snapshot-local 번호와 후속 선택 요청에 사용할 `snapshot_id`를 표현한다.\n각 detection은 촬영 시점 depth와 TF로 계산한 configured target-frame 원점 기준\n`distance_m`과 유효 여부를 포함한다. 유효한 후보는 거리, confidence, detector 원본\n순서로 정렬되며 depth가 불충분한 후보는 자동 조작 대상으로 선택하지 않는다.\n`DetectedObject3D`와 `DetectedObject3DArray`는 선택 객체의 OBB와 동일 snapshot 문맥을\n표현한다.\n\n## Scene inspection action\n\n`InspectScene` 1차 단계는 동기화된 RGB-D snapshot에서 2D detection만 수행하고,\n2차 단계는 `snapshot_id`와 `selected_object_id`로 선택한 객체 하나의 YOLOE instance mask로 3D\n복원한다. 성공한 2차 결과는 같은 configured target frame과 capture timestamp의\n`target_cloud`, `context_cloud`와 선택 객체 OBB를 반환한다.\n\n## Grasp planning과 선택\n\n`PlanGrasp`는 score 내림차순 `GraspCandidate[] candidates`를 반환한다.\n`SelectReachableGrasp` action은 같은 snapshot/object/frame/OBB 후보를 받아 양팔 IK,\nstate validity, 2구간 plan-only 검증 후 선택 index, arm, endpoint joint state를 반환한다.\ntrajectory는 현재 RobotState에 종속되므로 result에 포함하지 않는다.\n`required_arm`은 `left`, `right` 또는 빈 문자열이며, 특정 팔을 유지해야 하는 재인식\n단계에서는 해당 팔만 평가한다. 빈 문자열은 기존의 가까운 팔 우선 양팔 fallback을\n그대로 사용하고 그 외 값은 `ERROR_INVALID_INPUT`이다.\n\n팔 선택, IK, robot collision과 trajectory 계획은 `SelectReachableGrasp` 경계이며,\ngripper 명령과 실제 trajectory 실행은 별도 Skill Executor coordinator가 담당한다.\n초기 `nearest_pregrasp_coordinator`는 `DetectedObject2D.distance_valid`와 `distance_m`을\n사용해 가까운 객체부터 시도한다.\n\n## Contracts\n\n- [Mobile base](../docs/mobile_base.md): `/cmd_vel` 차체 속도 명령\n\n## Mission Runtime 계약\n\n`OfferMission`은 `mission_id`, `mission_type=clean_desk`, `target_kind=SEAT`,\ncanonical `target_id`와 `requested_by`를 전달합니다. 응답의 `accepted`, `duplicate`,\n`reason`과 선택적 `report_json`은 수락 여부이며 작업 완료는 아닙니다.\n`CancelMission`도 취소 수락 응답이며 실제 종료는 최종 결과로 확인합니다.\n`GetRuntimeSnapshot`은 현재 상태와 보존된 결과를 `snapshot_json`으로 반환합니다.\n\n`MissionStatus`는 FSM 상태, 외부 phase, BT 단계, 준비 여부 및 진단 sequence를 제공합니다.\n이 sequence는 Backend wire의 미션별 sequence와 구분합니다. `MissionResult`는 outcome,\n실패 코드, 완료·skip 작업, 사람 확인 여부, 관측 참조, 주행·복귀 결과와 전체 `report_json`을\n제공합니다. 내부 Mock 관측 ID는 실제 사진을 의미하지 않습니다.\n공개 이름과 취소·복구 규칙은 [Mission Manager README](mission.md)를 따릅니다.\n\n\n## 개발 관측 메시지\n\n`DebugBTNode`는 노드 ID, 부모, 종류, 상태, 이번 tick 방문 여부와 operation ID를 전달한다. `RuntimeDebugSnapshot`은 header, boot/event sequence, mission/state/ready/reason, BT 노드와 versioned `snapshot_json`을 전달한다. `RuntimeEvent`는 boot/sequence, mission/task/execution 식별자와 kind, `data_json`을 전달한다.\n\n기본 토픽은 `/mission/debug_snapshot`과 `/mission/runtime_events`다. 메시지는 명령 의미를 갖지 않는다. 이 패키지의 빌드만으로 producer가 실행되지는 않으며 발행이 없는 환경에서는 미수신으로 표시한다.\n\n## 설정 및 검증\n\n인터페이스를 추가하거나 변경할 때는 해당 의존 패키지, `package.xml`, 빌드 및 메시지\n호환성 검증을 함께 갱신한다.\n\n```bash\nsource /opt/ros/humble/setup.bash\ncd ros2_ws\ncolcon build --symlink-install --packages-select cleany_interfaces\nsource install/setup.bash\ncolcon test --packages-select cleany_interfaces\ncolcon test-result --verbose\n```\n\n설치된 계약은 `ros2 interface show`로 `InspectScene`, `PlanGrasp`,\n`SelectReachableGrasp`와 관련 message를 확인한다.\n\n## 관련 KB\n\n`DetectedObject2D`는 모델이 반환한 `sorting_category`와 `sorting_reason`을\n포함한다. category는 `trash`, `lost_item`, `review` 또는 미제공 빈 문자열이다.\n빈 값은 이름 기반 폐기 허가가 아니다. 이 메시지 변경 후 모든 consumer를 재빌드한다.\n\n- [Technical Overview](../../../../docs/cleany-docs/20_TECHNICAL/00%20-%20Technical%20Overview.md)\n- [System Context](../../../../docs/cleany-docs/20_TECHNICAL/01%20-%20System%20Context.md)\n- [ROS 2 Software Architecture](../../../../docs/cleany-docs/20_TECHNICAL/11%20-%20ROS%202%20Software%20Architecture.md)\n\n## 단일 물체 Manipulation action\n\n실행·취소·조회 명령은 [Skill Executor 실행 안내](../../cleany_skill_executor/docs/manipulation_mock_usage.md)를\n따른다. 이 절은 ROS 필드와 종료·기록 상태의 의미를 정리한다.\n\n### 공개 인터페이스\n\n| 타입 | 기본 ROS 이름 | 역할 |\n|---|---|---|\n| `ExecuteManipulationSkill.action` | `/mock/manipulation/execute_skill` | 승인된 `collect_trash` 또는 `collect_lost_item` 물체 하나의 요청·Feedback·Result·취소 |\n| `GetManipulationExecution.srv` | `/mock/manipulation/get_execution` | execution_id를 받아 found와 최신 record 반환 |\n| `CancelManipulation.srv` | `/mock/manipulation/cancel` | 활성 execution_id와 취소 mode를 받아 accepted와 message 반환 |\n| `ManipulationExecutionRecord.msg` | `/mock/manipulation/execution_events` | 진행·종료·재시작 중단 이벤트 |\n\n[MuJoCo BT 서버](../../cleany_manipulation_bt/README.md)는 같은 계약을 `/sim/manipulation`에서 제공한다.\n\n이벤트 QoS는 Reliable·Transient Local, depth 100이다.\n상태·단계·오류의 전체 목록은 [Action 명세](../../cleany_skill_executor/docs/02_execute_manipulation_skill_action_spec.md)를 따른다.\n\n### Goal·Feedback·Result\n\n| 구분 | 확인할 내용 |\n|---|---|\n| Goal | 호출자가 execution_id 발급. snapshot_id/object_id 조합으로 대상 지정 |\n| Feedback | 큰 단계 `stage`, 세부 동작 `substage`, 선택 팔과 진행 설명 |\n| `substage` | Feedback·기록의 현재 세부 동작. 큰 단계 `stage`의 취소·timeout 계약은 유지 |\n| `completed_substages` | 기록에 저장된 완료 세부 동작 목록. 명령 완료와 물체 상태 확인을 구분 |\n| `failed_substage` | Result·기록의 실패 세부 동작. 기존 기록에는 빈 값일 수 있음 |\n| `cancel_mode` | Result·기록의 취소 정책. `IMMEDIATE`, `CHECKPOINT`, `RETURN_ARM`; 취소 요청이 없으면 빈 값 |\n| Result | 종료 status, 오류, 물체·놓은 결과·팔 복귀·정지 근거 |\n| `execution_profile` | 근거를 생성한 실행 환경. 모의 서버는 `mock`, BT MuJoCo 서버는 `mujoco` |\n\n세부 진행 필드 추가 후 서버·클라이언트·모니터를 함께 재빌드하고 재시작한다.\n이전 SQLite JSON 기록은 세부 진행 필드가 없어도 읽으며 빈 값으로 취급한다.\n\n`CancelManipulation`은 기본 Action 취소를 내부에서 전달해 ROS 상태도 `CANCELING`으로\n전환한다. 일반 Action cancel의 기본 정책은 `CHECKPOINT`다. 활성 실행 중 모드 선택은\n멱등이며, 이미 요청한 모드를 변경하려면 `IMMEDIATE`로 선점한다. 즉시 정지는 이후\n요청으로 완화되지 않는다. 잘못된 ID와 mode, 종료된 실행은 거절한다.\n\n### 실행 기록 읽기\n\n`ManipulationExecutionRecord`는 Goal, 최신 진행과 Result 필드를 함께 제공한다.\n\n| 필드 | 의미 |\n|---|---|\n| `record_state` | 아래 표의 기록 상태 |\n| `has_result` | 최종 Action Result 존재 여부 |\n| `human_confirmation_required` | 물리 상태에 대한 사람 확인 필요 여부 |\n| `revision` | 기록 갱신 버전 |\n| `accepted_at_ns`, `updated_at_ns`, `evidence_at_ns` | 수락·갱신·관측 근거 시각. Unix nanoseconds |\n\n| `record_state` | 해석 |\n|---|---|\n| `ACTIVE` | 진행 중 |\n| `FINISHED` | 실행 종료와 최종 Result 확정. 디스크 저장 완료를 보장하지 않음 |\n| `INTERRUPTED` | 재시작 시 발견한 미완료 실행. 가짜 Result를 만들지 않음 |\n| `RECORDING_FAILED` | 이전 구현의 저장 실패 진단. 현재 서버는 새 기록에 사용하지 않음 |\n\n`has_result=false`이면 status/error_code/failed_stage/retryable을 Result로 해석하지 않는다.\n중단 기록도 마지막 물리 상태와 완료 단계를 보존하며 사람 확인 필요를 표시한다.\n현재 서버의 조회는 메모리의 최신 기록을 반환한다. 실행 기록 저장 실패는 경고로 남기고\n실제 실행의 status와 error_code를 유지하며, 조회 성공이 디스크 저장 완료를 보장하지 않는다.\n단계 deadline은 기록 시각과 별개로 프로세스 단조 시계를 사용한다.\n\n### 개발 관측 인터페이스\n\n`RuntimeDebugSnapshot` (`mission/debug_snapshot`, reliable/transient-local depth 1)은\nheader, boot ID, 마지막 event sequence, mission ID, FSM state, ready/reason,\n`DebugBTNode[]`, schema version 1의 `snapshot_json`을 전달한다. JSON에는 FSM 정의,\n모듈별 ready/stopped/reason, 실행 profile, 현재 proposal, 조작 결과, navigation 진단이\n포함된다. `DebugBTNode`는 id/parent/kind/status/visited/operation_id로 구성된다.\n\n`RuntimeEvent` (`mission/runtime_events`, reliable/transient-local depth 2048)은\nheader, boot ID, 연속 sequence, mission/task/execution ID, kind, `data_json`을 전달한다.\nkind는 transition, bt_tick, action_start, action_result, action_cancel_requested,\ncancel_requested, mission_result다. 관측 데이터이며 명령 인터페이스가 아니다.\n기존 `MissionStatus`, `MissionResult`, 미션 service 계약은 변경하지 않는다.\n\n## 읽기 전용 snapshot 조회\n\n`GetSceneSnapshot.srv`는 `/perception/get_scene_snapshot`에서 `snapshot_id`를 받아\n`found`, `DetectedObject2DArray detections`, `message`를 반환한다. 기존 cache만 조회하고\nTTL, 촬영 시각과 객체 번호를 갱신하지 않는다. 누락/만료는 `found=false`다.\n\n\n## 관찰 간 추적\n\n`InspectScene.Goal.tracking_session_id`는 같은 고정 베이스 책상 작업에 재사용한다.\n2D 메시지의 `track_id`, `tracking_state`, `position_valid`, `representative_position`은\n관찰 간 연결에 쓰이며 3D 대표 위치 frame은 배열의 `representative_frame`에 명시한다.\n배열은 session/epoch와 마지막 참조를 보존한 `missing_objects`를 포함한다. 최초부터\n불확실한 대상의 missing 참조에는 빈 track ID가 있을
