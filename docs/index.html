추정과 IK에는 기존 오차 허용이 있으므로\n수학적으로 완벽한 수직 고정 제어는 아니다. 기본은 false이며 자동으로 사선 접근으로\n되돌아가지 않는다. GUI 유지가 필요하면 `shutdown_on_sorting_exit:=false`를 추가한다.\n\nStudy-cafe 파이프라인의 초기 손목 roll은 양팔 모두 `+1.58 rad`이다.\n오른손 카메라 장착부가 왼손과 같은 방향으로 시작하도록 하며, MuJoCo 초기\nkeyframe의 관절값과 actuator 유지 목표에 함께 적용된다. 카메라 TF/장착 형상이나\n실물 모터 캘리브레이션은 변경하지 않는다. 실행 중 파지 이후 손목 제한과는 별개다.\n\n### 파지 후 Depth 최신성\n\nMuJoCo sorting은 `cleany_scene_mapping/KnownGeometryOctomapUpdater`를 기본으로\n사용한다. 가려진 파지 대상 내부의 이전 OctoMap 점유를 정리하여, 들기 시작점에서\n잡은 물체와 자기 잔상 사이의 충돌로 중단되는 것을 줄인다. 관측에서 등록한 형상\n내부에 완전히 포함된 셀만 정리하며, 주변 장애물과 부분 겹침 셀은 유지한다.\n실물 및 sorting 이외 실행은 기존 updater를 유지한다. `depth_octomap_plugin`으로\n명시 변경할 수 있다. 로봇/물체 형상 오차가 있는 환경의 안전성을 보증하지 않는다.\n\n손목 카메라 사용 시 접근·그리퍼 닫기·들어올리기 구간에\n`/sorting_cameras`의 `head_depth_boost=true`를 설정한다. 손목 선택과 YOLOE-seg\n추적은 유지하며, 구간 종료(실패 포함)에 false로 복원한다. 물체 attachment 이후\n촬영된 Depth 및 최신 OctoMap 확인은 생략하지 않는다. 최신성 허용값 2초와\n실물 sorting의 attachment 대기 상한 10초는 유지한다. MuJoCo sorting은\nGUI·추적 부하로 시뮬레이션 진행이 느려지는 경우를 위해 실제 시간 기준 상한을\n30초로 둔다. `attachment_scene_timeout_sec` 실행 인수로 조절한다.\n최신 데이터가 도착하면 즉시 진행하므로 고정 30초 대기가 아니다.\nMuJoCo 장애물 점군은 `scene_cloud_pixel_stride=4`로 샘플링하여 기존 stride 2\n대비 최대 점 수를 1/4로 줄인다(640×480 기준 76,800 → 19,200).\n인식·YOLOE-seg 입력 해상도는 유지한다. 작은 장애물의 점 밀도가 줄어드는 절충이\n있으며, 비교 시 `scene_cloud_pixel_stride:=2`로 복원할 수 있다. 실물 기본은 2다.\n카메라 노드도 함께 빌드해야 하며 boost 설정 거부 시 이동을 시작하지 않는다.\n\n스터디카페 grasp 후보 생성의 어깨 기준점은 migrated CAD URDF의 좌우\nshoulder origin을 사용한다. 기존 모델의 기준점을 혼용하지 않는다.\n\n## Sorting 속도와 실행 설정\n\n다음 값은 simulation sorting launch의 기본값이다. 일반 demo와 실물 로봇의\n하드웨어 한계와 구분하며, 각 이름은 launch argument 및 ROS parameter다.\n\n| 설정 | 기본값 |\n| --- | ---: |\n| `velocity_scaling` / `acceleration_scaling` | 0.30 / 0.50 |\n| `sorting_payload_velocity_scaling` / `sorting_payload_acceleration_scaling` | 0.24 / 0.20 |\n| `cartesian_translation_speed_m_s` | 0.30 |\n| `approach_velocity_scaling` / `retreat_velocity_scaling` | 1.0 / 0.8 |\n| `cartesian_translation_acceleration_m_s2` | 0.80 |\n| `cartesian_joint_acceleration_rad_s2` | 4.0 |\n| `cartesian_rotation_speed_rad_s` | 1.50 |\n| `lin_acceleration_scaling` | 0.8 |\n| `corridor_time_margin` | 1.05 |\n| `gripper_motion_sec` (별도 닫기/놓기 명령) | 2.0 |\n\n접근 가속도 배율 `sorting_approach_acceleration_scaling=1.0`은 유지한다.\npregrasp와 그리퍼 열기는 기존 6관절 동시 계획을 유지하며, 별도 2초 대기를\n추가하지 않는다. 운반은 기본 이동 배율과 payload 배율의 최솟값을 적용한다.\n위 Cartesian 속도는 retiming 상한이지 실제 일정 속도를 보장하는 값이 아니다.\n충돌/FK/관절 위치·속도 한계, 추적·접촉 감시, timeout 취소는 유지한다.\n시뮬레이션 속도는 실제 경과 시간과 다를 수 있으며, 이 설정은 실물 성능 검증값이 아니다.\n\nsorting launch의 `use_observed_collision_geometry=true`는 grasp 서버가 발행한\n`/grasp/collision_geometry`를 target collision/attachment에 사용한다. 일반\n기본 false는 기존 OBB 경로다. 64개 bounded cache에서 snapshot/object ID,\ncapture header와 OBB pose가 정확히 일치하는 mesh만 사용한다. finite/closed/\noutward/convex 검사와 vertex/triangle 상한을 통과해야 하며, 활성화 상태에서\nmesh가 없으면 timeout 후 실패하고 OBB로 조용히 대체하지 않는다. support patch,\n전체 로봇 open/closure 검사는 유지한다. 운반/재관측/놓기 반경은 OBB 반대각선과\n관측 mesh의 최대 local vertex 거리 중 큰 값이다. trimmed OBB 바깥 관측점도\n포함하며 mesh 사용 모드에서 정확히 일치하는 geometry가 없으면 실패한다.\n관측 프리즘은 숨은 실제 형상의 보장이 아니며, geometry cache는 identity 검사다.\n시간 신선도 검사는 기존 sensor-scene/wrist 경로가 별도로 수행한다.\nsorting artifact에는 수신한 `collision_geometry` CDR도 함께 기록한다.\n헤드 재관측 후에는 기존 중심/방향 연속성 제한을 만족하는 후보만 동일 팔\nreachability selector에 전달한다. 새 후보의 점수 순위 변화로 방향이 크게\n다른 후보를 먼저 선택한 뒤 전체 작업을 중단하지 않도록 한다. 제한 자체는\n완화하지 않으며 호환 후보가 없으면 이동 전에 실패한다.\nLaunch argument `sorting_head_reference_refresh_age_sec` 기본값은 0초(비활성)다.\n양수 값으로 설정하면 단독 진단에서도 헤드 재관측 경로를 검증할 수 있다.\n활성화 시 simulation clock 기준 새 관측+재계획도 같은 신선도 상한을\n만족해야 하며, 설정값은 30초를 초과할 수 없다.\n\n`planning_scene_timeout_sec`는 응답 대기 상한이다. 일반 selector/executor는\n각각 1/2초, CPU sorting launch는 5초다. 고정 대기를 추가하지 않으며 timeout\n발생 시 해당 작업은 실패한다. 충돌 조건이나 관측 신선도 상한과는 별개다.\nselector의 `state_validity_timeout_sec`도 CPU sorting launch에서 5초로 설정한다\n(일반 기본값 1초). 이는 `/check_state_validity` 응답 상한이며 충돌 검사를\n생략하거나 실패 결과를 허용하지 않는다.\n`fk_timeout_sec`도 sorting에서 5초다. `ik_response_margin_sec`와\n`planning_response_margin_sec`는 각각 IK/MoveGroup 계산 예산 뒤에 더하는\n응답 여유이며 일반 1초, sorting 5초다. aim IK에도 같은 IK 응답 여유를 쓴다.\nIK 계산 예산 0.15초, aim IK 1초, MoveGroup 계획 예산 4초 자체는 늘리지 않는다.\nCartesian 실행 wall deadline은 `max(minimum_sec, trajectory_duration * factor +\nmargin_sec)`이다. `cartesian_execution_wall_timeout_` 접두사의 `minimum_sec`는\n60초, `margin_sec`는 10초, `factor`는 일반 2/sorting CPU simulation 10이다.\n이는 고정 대기나 동작 감속이 아니며 완료 결과가 도착하면 즉시 진행한다.\n접촉/추적 감시와 timeout 시 취소·종료 확인은 유지한다.\n\nSorting은 초기 양손 그리퍼 열기 단계를 실행하지 않는다. 선택된 팔만\n`*_pregrasp_open` 6관절 MoveIt group으로 pregrasp 이동과 열기를 함께 계획·실행한다.\n팔과 그리퍼를 별도 비동기 명령으로 겹치지 않고, 열린 jaw를 포함한 전체 경로를\n충돌 검사한다. Target contact 허용은 여전히 grasp 접근 단계에서만 적용한다.\nMoveIt이 기존 팔/그리퍼 controller에 궤적을 분배하며, 양쪽 action의 완료와\n선택한 6관절 feedback를 확인하기 전에는 손목 인계/접근으로 넘어가지 않는다.\n반대 팔 그리퍼는 움직이지 않는다. Grasp/retreat IK는 기존 5관절 계약을 유지한다.\n투입 완료 후에는 `*_return_close` 6관절 group으로 저장된 원래 팔 자세로 복귀하면서\n선택 그리퍼를 `sorting_return_gripper_position_rad=-0.30` rad로 함께 닫는다.\n의도한 release가 완료되고 attachment가 해제된 빈 팔에서만 허용하며,\n이 경로도 jaw를 포함해 충돌 검사하고 두 controller의 완료를 확인한다.\n`gripper_open_position_rad`는 동시 이동의 최종 열림 위치다.\n`gripper_motion_sec`는 별도 파지/놓기 명령에만 적용하며 동시 이동 시간은\nMoveIt의 속도·가속도 제한 및 경로가 결정한다. 시작 상태 표시는 `search`다.\n\nhead RGB-D로 물체/3D grasp를 선택하고 pregrasp에 도착하면 해당 손목 RGB로\n인계한다. 이때 head renderer는 10→2 Hz, 선택 손목은 10 Hz가 된다.\n기존 3D 추정과 경로를 보존하고 손목 RGB로 대상 일관성을 검사하며,\n이 분기에서 head 재검출/3D 재계산과 head 시야 복구 이동을 수행하지 않는다.\nRGB 인계가 실패하면 중단하며 이전 3D 위치를 새 측정값으로 포장하지 않는다.\nlift는 손목 mask·그리퍼 관절 feedback 기반 접촉 추정·kinematic clearance로 확인한다.\n접촉 추정은 닫힘 명령 대비 정지한 관절 상태를 사용하며 독립 힘 센서 측정이 아니다. 이것은 독립적인\ndepth 상승량 검증이 아니다. 수거함은 `robot_top_bins.yaml`의 초기 base_link 기준 위치를\n사용하고 운반 전후 접촉과 충돌·개구부 검사는 유지한다. 복귀 시작 전 head 활성 빈도로 복원한다.\n시뮬레이션 손목 TF는 nominal CAD mount이며 실제 로봇에서는 측정한 양팔 hand-eye\ncalibration이 필요하다. `sorting_wrist_cameras_config`로 simulation nominal YAML을\n지정하며 기본은 `cleany_mujoco_sim/config/sorting_wrist_cameras.yaml`이다.\n외부 로봇 실행은 아직 지원하지 않는다. 손목 영상 기반 연속 위치 보정(visual servo)은\n구현하지 않았으며 접근/운반 경로는 기존 head 3D 추정 및 관절 feedback에 의존한다.\n기존 head-only 비교 시험은 `sorting_use_wrist_camera:=false`로 실행한다.\n\n이전 캔·박스·무작위 pregrasp 데모는 제거했다. 스터디카페가 재사용하던\nMoveIt 실행·joint feedback helper는 `grasp_execution.py`의 `GraspExecutionNode`,\n카메라 투영·시각화 helper는 `core/rgbd_projection.py`로 분리했다.\n현재 launch와 테스트는 이 공통 코드를 사용한다.\n"},"ros2_ws/src/cleany_skill_executor/docs/study_cafe_sorting_contract.md":{"title":"스터디카페 분류·운반 실행 계약","body":"# 스터디카페 분류·운반 실행 계약\n\n[패키지 안내로 돌아가기](manipulation.md)\n\n## 분류·운반 실행 계약\n\n`study_cafe_sorting.launch.py`와 일반 파이프라인은 `robot_top_bins.yaml`의\n내부 후면 받침판·수거함을 기본 배치로 사용한다. 책상 양끝 분류 영역과 구분선은\n없으며 수거함의 고정 투하 위치만 사용한다.\n개별 물체 배치 성공 기록이 있지만 전체 정리 성공은 검증 중이다.\n`table_sorting_policy.yaml`의 destination으로 Gemini의 category/reason을\n연결한다. label allowlist로 category를 대체하지 않으며 위험 label은 보수적으로\n거부한다. RGB-D 거리순으로 시도하고 인식된 수거 구역 물체는 다시 집지 않는다.\n미처리/미확인 물체가 남으면 성공으로 보고하지 않는다. 관측한 작업 물체 수와\n완료 항목 수를 대조하므로 이전에 관측한 수량보다 완료 수가 적으면 중단한다.\n이는 수량 검사이며 객체 identity 추적이나 관찰 모드의 독립 안착 검증을 대신하지 않는다. 빈 작업 영역은 두 번\n재확인하며 최대 search/action 횟수 12에 도달하면 실패한다.\n\nMuJoCo oracle은 배치 후 전체 AABB가 수거함 안에 들어가 정지했는지 검증한다.\n기본 `sorting_exit_on_finish=true`; coordinator 종료 시 launch가 다른 노드도\n종료한다. GUI를 유지하려면 launch 인수 `shutdown_on_sorting_exit:=false`를 사용한다.\n현재 전체 물리 정리 성공은 아직 검증 중이다. 기록: `artifacts/table_sorting_20260908/`.\nsorting은 얇고 긴 객체의 RGB-D 점군에서 중심 외의 longitudinal contact 후보도\n생성한다. 자세/충돌 한계는 유지하며, 세부 범위는 cleany_grasping README를 따른다.\nsorting selector/executor는 `support_patch_margin_m=0.02`로 perception OBB\n바닥의 지지면을 유한 collision patch로 유지한다(일반 node 기본 0, 비활성).\npatch는 OBB XY 범위에 각 방향 2cm를 더하고, OBB 바닥 아래 1cm 두께로 만든다.\n2cm는 현재 target mask padding 1.5cm를 포함하는 로컬 범위다. 8cm 확장은\n가까운 물체에서 로봇 본체까지 가상의 면을 확장하는 문제가 있어 사용하지 않는다.\n이는 perception이 지지면 법선을 OBB Z축으로, 지지면을 바닥으로 쓰는 계약에\n의존한다. 수평에서 20°를 넘는 면/잘못된 pose는 거부한다. 새 테이블 정답은\n읽지 않으며, 관측 밖 연장 부분은 보수적인 로컬 평면 가정이다.\n물체/support pair만 접촉 허용하고 robot/support는 허용하지 않는다. attachment\n이후에도 patch가 남아 target OctoMap masking 아래의 지지면이 사라지지 않으며,\ntransaction 종료 시 target과 함께 제거하고 원래 ACM으로 복원한다.\n`require_gripper_closure_clearance=true`는 실제 full-robot 형상으로 open→close\n구간을 `gripper_sweep_step_rad=0.05` 이하 간격에서 검사한다. target 접촉만\n허용하고 환경/지지면 충돌은 거부한다. 이 검사는 기하학적 샘플 검사이며 접촉\n동역학/실제 파지 유지 성공을 보장하지 않는다. grasping의 support-plane 간이\n검사 위임은 이 support patch 및 open/closure 검사와 함께만 사용한다.\nseeded cubic 경로가 충돌로 거부되면 최대 8개 contact의 body pair, 위치/frame,\npenetration depth를 오류에 기록해 주변 물체/지지면/잔상 원인 분석에 사용한다.\n`sorting_head_reference_refresh_age_sec` 기본값은 `0.0`으로, pregrasp 도착 후\n시간 경과만을 이유로 하는 Gemini 재인식을 비활성화한다. `(0, 30]`초로 설정하면\n기존 ROS clock 기준 만료 검사와 재인식·위치 연관·동일 팔 재계획을 다시 활성화한다.\n손목 서비스 자체의 관측 유효성 검사는 유지하며 관측 timestamp를 갱신하지 않는다.\n\n고정 수거함 모드에서는 YOLOE-seg bbox/depth 거리로 정렬한 후보를 하나씩 처리한다.\n`fixed_jaw_clearance_m`은 고정 손가락 여유거리(수거 기본 0.003 m),\n`grasp_opening_margin_m`은 후보 벌림 여유폭(기본 0.008 m)이다. 여유거리는\n여유폭의 절반 이하여야 한다. 5 mm 시험은 각각 `0.005`, `0.010`으로 설정한다.\n벌림 여유폭은 후보 생성기와 두 TCP 보정 경로에 동일하게 전달된다.\n현재 후보의 YOLOE-seg mask에만 3D 복원을 수행하고 파지 가능한 팔을 찾으면 탐색을 끝낸다.\n복원·파지 계획·양팔 도달성 검사가 실패하면 다음 후보를 복원하며, 같은 주기의\n복원 결과는 캐시한다. review 분류 후보는 정밀 복원 없이 미해결 대상으로 남긴다.\n선택되지 않은 물체도 전체 depth 기반 OctoMap의 충돌 검사에는 계속 포함된다.\n다음 후보 처리 전 snapshot TTL이 만료되면 기존 cache 오류로 처리되며 과거 영상의\n시각을 갱신하지 않는다. 미해결 물체와 기존 관측 물체의 누락 검사는 유지한다.\nsorting selector의 `pose_refinement_iterations=30`은 runtime `/robot_description`\nURDF의 로컬 FK로 위치와 접근/closing 방향의 잔차를 함께 줄이는 bounded numerical\nrefinement를 사용한다. 매 후보 탐색 전 MoveIt FK와 일치하는지 대조한다.\n초기 자세 예산은 pregrasp에서 `pregrasp_aim_attempts`, grasp에서 0이 아닌\n`grasp_pose_seed_attempts`를 따른다(0이면 pregrasp 예산 재사용). 수치 보정도\n설정 예산 전체를 사용하며, 첫 유효 해에서 종료한다. seed 수 증가는 실패\n후보의 계획 시간을 늘릴 수 있으나 유효성 허용값을 변경하지 않는다.\n기본 adapter 값 0은 기존 탐색이다. 각도 오차 기준, 관절 여유, 충돌검사 및\n실행 전 경로 검증은 유지한다. 후보 보정 자체는 로봇에 명령을 보내지 않는다.\n실제 grasp는 `grasp_position_tolerance_m=0.0015`로 별도 검사한다. pregrasp의\n20mm 허용값을 grasp에도 공유하던 오류를 수정했으며, 관절 자세가 맞더라도\nTCP 위치 오차가 1.5mm를 넘는 후보는 거부한다. `pose_refinement_position_weight=10`\n으로 위치 잔차를 우선 줄인다. 각도/충돌/관절 한계는 완화하지 않는다.\n\n`grasp_use_aperture_centering=true`는 검출 폭에서 opening margin 8mm를 제외한\n물체 폭을 사용해 `폭/2 - fixed_jaw_inner_x(8mm)`로 TCP 옆방향 보정량을 정한다.\n계획과 실행이 같은 함수를 사용한다. 기존 30mm 고정 보정은 작은 물체가 두\n손가락 사이에서 벗어나는 문제가 있었다. 시뮬레이션 jaw mesh 기준으로 닫힘\n근방 aperture 기울기 0.065m/rad, command opening reduction 18mm를 사용한다.\n관절 정지로 파지를 확인하지 못하면 `gripper_contact_retry_steps`(기본 node 0,\nsorting launch 5; 허용 0–5)만큼 `gripper_contact_retry_step_rad=0.10`씩 더 닫는다.\n\n### 자동 sorting의 손목 미검출 보완\n\n파지 후 손목 CHECK의 단순 미검출(`ObserveWristTarget.NOT_DETECTED`)은 즉시\n종료하지 않는다. `sorting_wrist_check_attempts`는 기본 1회이며, 미검출이어도\n아래 그리퍼 확인을 통과하면 추가 카메라 요청 없이 운반으로 진행한다.\n1~5회로 설정할 수 있으며, 첫 요청은 lift 완료 시각, 추가 요청은 직전 응답의\n실제 촬영 시각보다 새로운 프레임을 요구한다. 실패 응답도 source/reference ID,\n선택한 팔의 frame, 촬영 시각을 확인한 뒤에만 보완 경로로 처리한다.\nHANDOFF는 성공해야 접근하며 CHECK의 센서·통신·TF·추론·참조 오류나 모호한\n검출은 이 보완 경로에 포함되지 않는다.\n\n각 CHECK 전후에는 요청 이후 도착한 그리퍼 위치·속도가 기존 접촉 조건을\n연속 만족해야 한다. 최소 3개의 서로 다른 샘플이\n`sorting_wrist_contact_confirmation_sec`(기본 0.3초)의 ROS 시간 구간을\n채워야 하며, 피드백 나이와 샘플 간격은\n`sorting_gripper_feedback_max_age_sec`(기본 0.5초) 이하여야 한다.\n대기 상한은 `gripper_contact_feedback_timeout_sec`(기본 wall time 5초)다.\n오래된 값·중복 시각·피드백 단절·빈손 완전 닫힘·접촉 상실은 성공 근거로 쓰지 않는다.\n관절 메시지가 `/clock`보다 먼저 도착하면 시계가 따라올 때까지 그 값을 세지 않고\n기다린다. 미래 시각이 계속되거나 시계가 멈추면 대기 상한에서 실패한다.\n모든 새 영상에서 미검출이어도 이 모터 확인을 통과하면 운반으로 진행한다.\n로그에는 시각적 파지 확인이 없고 그리퍼 피드백으로 진행했다는 사실을 남긴다.\n물체 중심의 lift 높이는 기존처럼 FK와 파지 offset으로 계산하며, 별도 실제 높이\n측정 또는 물체 식별 성공으로 표현하지 않는다. 전류·토크는 현재 판정에 사용하지 않는다.\n\n### 접촉 재시도와 운반 감시\n\n각 재시도는 `gripper_contact_retry_motion_sec=1.2`이며 닫힘 하한과 기존 토크 제한을\n넘지 않는다. 최초 열린 위치 기준의 접촉 판정을 유지하고, 실제 마지막 명령을\n운반 중 감시에도 사용한다. 한도 내에서 파지를 확인하지 못하면 lift 전에 실패한다.\n이는 실제 하드웨어 캘리브레이션 값이 아니며 물리 파지 성공은 별도 검사한다.\n\n연속 sorting에서는 `gripper_force_full_close=true`로 기존 닫힘 하한을 목표로\n유지한다. 접촉 때문에 실제 관절은 그 전에 멈출 수 있으며, 기존 토크 제한과\n관절 잔차/속도 기반 접촉 감시는 그대로 적용한다. 추정 폭의 중간 목표에서 멈춰\n물체 자세 변화 후 추가로 조여주지 못하는 현상을 피하기 위한 설정이다.\n목표까지 완전히 닫혀 잔차가 사라지면 파지 성공으로 간주하지 않는다.\n초기 파지에는 정지 속도 조건을 적용한다. 이미 확인된 파지의 비동기 운반 중에는\n닫히는 방향의 추가 조임을 허용하되, 목표 대비 최소 잔차/열리는 속도 상한,\n관절 피드백 신선도, 손목 추적과 접촉 상실 debounce는 계속 검사한다.\n이는 힘 센서 확인이 아니며 잔차가 사라지기 전의 미끄러짐을 완전히 판별하지 못한다.\nsorting의 attachment 후 지도 갱신 대기 상한은 10초다. CPU 저속 시뮬레이션에서\n새 지도 발행을 기다릴 시간을 확보하되, 신선도 2초와 attachment 이후 새 depth\ncapture 조건은 완화하지 않는다. 새 데이터가 준비되면 즉시 진행한다.\n변화 없는 OctoMap 전체 메시지가 재발행되지 않아도, tree 쓰기 뒤 발행되는\nprocessed-cloud receipt의 새로운 capture stamp로 지도 활동을 확인한다.\n기존 populated-map 확인과 capture/receipt 신선도 기준은 유지하고, 원본 cloud\n수신이나 중복 receipt만으로 갱신하지 않는다. 빈 지도도 통과시키지 않는다.\nsorting selector는 `require_open_grasp_clearance=true`로 실제 열림 각도의 grasp\n끝점도 검사한다. 센서 OBB에 대한 jaw 접촉 허용을 잠시 해제하고, 선택된 gripper\n관절만 열림 각도로 바꾼 전체 로봇 MoveIt validity를 확인한다. 기존 피드백/계획은\n변경하지 않고 ACM은 성공/실패/예외 모두 복구한다. 이 검사는 시작/중간 경로의\n추가 안전 검증을 대체하지 않으며, 보수적인 OBB 때문에 유효한 후보도 거절할 수 있다.\n고정 jaw에는 sorting에서 `grasp_fixed_jaw_clearance_m=0.003`을 적용해 경계를\n맞닿게 두지 않는다. selector와 coordinator에 동일하게 적용하며, 설정 여유는\nopening margin의 절반 이하여야 한다. 기존 비-sorting 기본값은 0이다.\n`direct_vertical_lift:=true`는 기본 false인 동작 진단 옵션이다. 접근 경로를\n역으로 물러나는 단계 대신 현재 TCP 위치에서 수직 lift를 계획한다.\n`direct_vertical_lift_extra_m`(기본 0, 허용 범위 0~0.05m)은 이 진단 경로의\nTCP 상승 거리에만 추가된다. 물체 중심의 기존 최소 상승 높이 검사와 경로\n충돌 검사는 그대로 적용되며, 높이가 부족하면 예측/요구 중심 높이를 오류에 남긴다.\n`sorting_release_edge_margin_m`(기본 0.005m)은 수거함 입구 안쪽의 추가\n가장자리 여유를 조절하는 MuJoCo BT Action의 launch 인자다. 자동 sorting은\n고정 위치·손목 feedback과 MoveIt 충돌을 확인하며 입구 fit 검사는 후속 과제다.\nsorting에서는 끝점 position IK/FK를 확인하고 기존 seeded 위치 corridor로 계획한다.\n기존 corridor 자세 한도(5°)를 넘는 끝점은 거절하고, 전체 경로의 FK/충돌/자세\n변화를 검사한다. 정확한 자세 고정 LIN으로 표현하지 않는다. 파지/손목 감시는\n유지하며 기본 전체 sorting 동작은 아직 역방향 retreat를 유지한다.\n\n- [System Context](../../../../docs/cleany-docs/20_TECHNICAL/01%20-%20System%20Context.md)\n- [Task Planning and Robot Capabilities](../../../../docs/cleany-docs/20_TECHNICAL/03%20-%20Task%20Planning%20and%20Robot%20Capabilities.md)\n## 수거함 운반\n\n### 분류된 수거함으로 직접 이동 / 손목 유지 (기본 모드)\n\n현재 수거 시뮬레이션은 공유 `robot_top_bins.yaml`의\n`simulation_ignore_mast_collision: true`로 고정 기둥 접촉을 MuJoCo에서 끄고\nMoveIt의 기둥–로봇 링크 충돌을 제외한다. 외형 및 self-filter용 TF/형상은 유지한다.\n이 편의 설정의 성공 결과는 실제 기둥을 피하는 실로봇 경로 검증이 아니다.\n\n빈손 복귀와 그리퍼 닫기는 계속 동시에 실행하되,\n`sorting_return_velocity_scaling: 0.12`, `sorting_return_acceleration_scaling: 0.15`로\n복귀 동작만 별도 상한을 적용한다(더 낮은 전역 설정은 유지).\n현 MJCF STS3215의 토크 한계 2.648Nm 및 감쇠 합 3.342Nm·s/rad에서는\n무부하 정상 속도조차 약 0.78rad/s 이하라 기존 30% 어깨 yaw 상한 1.274rad/s를\n지속 추종할 수 없다. 새 복귀 yaw 상한은 약 0.509rad/s이며 충돌 검사,\n모터 토크 한계 및 0.12rad 궤적 추종 허용치는 변경하지 않는다.\n이는 현재 시뮬레이터 모델용 설정이며 실제 모터 성능 인증값이 아니다.\n\n운반은 고정 투하 방식이다. `config/nearest_pregrasp.yaml`의\n고정 **물체 중심** 위치(base_link, m)는 다음과 같다. 수거함은 로봇 내부 후면에 부착된다.\n\n- `sorting_fixed_release_lost_items_left_m`: `[-0.075, 0.105, 0.50]`\n- `sorting_fixed_release_trash_right_m`: `[-0.075, -0.105, 0.50]`\n\n분류 → 파지 → 안전한 들어 올리기 → 선택된 수거함 위 고정 투하점 → 놓기 → 복귀 순서다.\n기본 모드에서는 파지 전 공통 경유점 IK 검사, 공동 손목 endpoint 검사 및 경유점 이동을\n모두 생략한다. 물체 크기/그리퍼 안의 실제 추정 offset을 반영한 최종 투하 자세만 구한다.\n도달 가능한 자세가 없으면 물체를 놓지 않고 중단한다. 직접 이동도 MoveIt의 현재\n부착 물체/장애물 충돌 검사를 거친 경로로 실행하며 무검증 직선 명령이 아니다.\n\n들어 올리기를 마치면 실제 손목 roll 각도를 캡처한다. 최종 투하 IK는 손목 roll만 변수에서\n제외하고 어깨 yaw/pitch·팔꿈치·손목 pitch의 네 관절을 푼다. 손목을 위아래로 꺾는\npitch는 고정하지 않는다. 실행 경로의 roll tracking 허용\n오차는 `sorting_fixed_release_wrist_tolerance_deg`(기본 0.5도)이며 자동 확대하지 않는다.\n고정 투하점에서 물체 중심·손목 feedback·함 입구를 확인한 뒤에만 그리퍼를 연다.\n물체 중심 도착 허용 오차는 1cm이고, IK의 위치 허용 오차는 축별 0.5mm다.\n\n검증된 최종 자세는 프로세스 내 캐시에 저장하며 동일 팔/손목 각도/물체 offset/투하점일 때\n재사용한다. 캐시 hit도 현재 부착 물체를 포함한 충돌 및 FK를 다시 확인한다.\n센서 feedback이 달라 정확히 같은 키가 아니면 재계산하므로 캐시 hit나 시간 단축을\n항상 보장하지 않는다. 직접 운반 중에는 넓은 영역 탐색이나 손목 완화로 우회하지 않는다.\n이 설정은 시뮬레이션용이며 실제 로봇의 고정 투하 자세가 검증됐다는 뜻은 아니다.\n\n### 파지 후 후퇴/들어 올리기의 손목 제약\n\n수거 중 손목 roll만 안정된 파지 접촉 시점의 실제 관절각을 기준으로 제한한다.\npitch는 위아래 동작을 위해 자유롭게 사용하되 기존 물리 관절 한계/충돌 검사는 유지한다.\n`config/nearest_pregrasp.yaml`의 ROS parameter `sorting_carry_wrist_tolerances_deg`\n기본값은 `[2.0, 5.0, 10.0, 20.0, 30.0]`이다. 파지 후 후퇴/수직 lift는 빈 팔의\n기존 pregrasp 관절 목표를 재사용하지 않고, 현재 허용 범위에서 새 endpoint IK와\n전체 Cartesian 경로를 계획한다. endpoint나 검증된 경로를 찾지 못할 때 다음 범위로\n넓힌다.\n기준각은 구간마다 바꾸지 않으며, 한 번 확대한 범위는 놓기까지 유지한다.\n관절 한계/FK/충돌 검사는 유지한다. 최대 범위에서도 실패하면 중단한다.\n\nMoveIt 이동에는 같은 관절 path constraint를 전달하고, 직접 생성하는 Cartesian\n궤적은 local IK/refinement 경계부터 손목 제약을 반영하고 실행 전 모든 waypoint를\n검사한다. 계획/검증과 실행을 분리해 계획 실패만 재시도하며, 서비스/URDF 오류나\n제어기 실패/접촉 상실 후에는 제한을 완화해 재실행하지 않는다. 일반 MoveIt 운반\n구간은 여전히 IK 성공 후 경로 계획 실패 시 중단한다.\n\n손목 유지 시 어깨/팔꿈치 움직임으로 그리퍼의 세계좌표 방향은 변할 수 있다.\n후퇴/lift의 새 도착 방향은 기존 빈 팔 방향을 강제하지 않고 구간 시작 방향 대비\n`sorting_carry_cartesian_rotation_limit_deg`(기본 30도)로 제한한다. 이 값은 시뮬레이션\n운용 설정이며 실제 로봇의 안전한 기울기 한계가 검증됐다는 뜻은 아니다. 새 방향을\n잇는 전체 FK corridor의 기존 자세 오차/속도/가속도/충돌 검사는 유지한다.\n그리퍼를 열고 scene attachment를 해제한 뒤에는 손목 제한을 해제해 복귀한다.\n손목 변화 최소화의 전역 최적해나 물체의 수평 자세 유지는 보장하지 않는다.\n\nMuJoCo BT Action은 고정 투하 위치에서도 물체의 bounding sphere가 수거함 입구 내부에 들어가는지 검사한다.\n벽 두께와 `sorting_release_edge_margin_m`(기본 0.005m)을 제외하고,\n물체 아래쪽 높이는 테두리보다 `sorting_release_clearance_m`(기본 0.06m)에서\n`sorting_release_maximum_clearance_m`(기본 0.21m) 사이여야 한다.\n위치가 이 범위에 맞지 않으면 이동하지 않고 중단한다. 놓기 직전에도 실제\nfeedback으로 물체 중심·손목·함 입구를 다시 검사한다. 자동 sorting은\n고정 위치·손목 검증을 유지하며 이 bounding sphere 검사를 적용하지 않는다.\n\nSAM 분할·기준 mask 추적·중앙 인계 상태는 제거했다. 현재 손목 검증은 YOLOE-seg의\nHANDOFF/CHECK 재검출이며 이동 전후 접촉·충돌 검사를 유지한다. 수거함 개구부\n검사는 위의 MuJoCo BT Action 계약을 따른다.\n\n예전 라벨 allowlist 정책, 테이블 배치 구역, 경유점/영역 탐색 운반은 제거했다.\n"},"ros2_ws/src/cleany_skill_executor/docs/study_cafe_sorting_usage.md":{"title":"스터디카페 실행과 진단","body":"# 스터디카페 실행과 진단\n\n[패키지 안내로 돌아가기](manipulation.md)\n\n## 센서 전용 study-cafe 검증\n\n`study_cafe_nearest_grasp_demo.launch.py`는 YOLOE-seg + Gemini,\naligned RGB-D/TF, AnyGrasp 후보와 MoveIt 검증을 연결한다.\n`cleany_perception/config/yoloe_seg_gemini.yaml`을 바탕으로 스터디카페\n전용 head/손목 체크포인트를 설정한다. `GEMINI_API_KEY`와 로컬 YOLOE 모델이 필요하다.\nDepth obstacle scene은 객체 검출과 별도로 유지하며 target 위치를 simulator에서 받지 않는다.\nGUI 기본은 `sim_viewer:=efficient`로 센서 snapshot을 공유하는 최대 20Hz 창이다.\n손목 전환을 사용하는 수거에는 `scheduled_cameras:=true`가 필요하다.\n\n```bash\nmake sim-mujoco-pipeline\nmake sim-mujoco-sorting\n```\n\n## 시뮬레이션 분리 수거 (통합 검증 진행 중)\n\n분리 수거 모드는 selector의 `require_pregrasp_visibility=true`를 사용한다.\n관측한 OBB 8개 모서리를 현재 camera TF 기준으로 원근 투영하고, 이를 포함하는\n16면 visibility cone을 구성한다. MoveIt `GetStateValidity`의\n`VisibilityConstraint`가 준비 자세의 로봇 CAD와 이 영역의 겹침을 검사한다.\n가리는 자세는 움직이기 전에 제외하고 다른 IK/후보를 검토한다. 반경은 물체\n정답 크기나 고정 컵 치수가 아니라 RGB-D OBB에서 계산하며 기본 padding은\n3 mm다. 동적 camera TF는 기본 0.5초 이내여야 하고, 검사 결과가 누락되면\n통과로 취급하지 않는다. 일반 selector의 기본값은 false다.\n\n`sorting_contact_diagnostics:=true`는 MuJoCo observer의 접촉 부위/힘\n출력만 켠다. 기본은 false이며, controller 오차와 실제 접촉을 대조하는\n진단용이다. coordinator나 grasp selector는 이 GT 토픽을 읽지 않는다.\n\n```bash\nmake sim-mujoco-sorting\n\n# 기본 sorting 실행은 headless이며 RViz/image_view를 시작하지 않는다.\n\n# 수거 완료/실패 후에도 시뮬레이터와 GUI 유지 (수거 동작을 자동 재시도하지 않음)\nmake sim-mujoco-sorting SORTING_ARGS='headless:=false use_rviz:=true use_image_view:=true shutdown_on_sorting_exit:=false'\n# 같은 실행에서 GUI 창만 생략 (vendor 카메라 렌더링에는 DISPLAY 필요)\nmake sim-mujoco-sorting SORTING_ARGS='headless:=true use_rviz:=false use_image_view:=false'\n```\n\nMoveIt adapter의 `First ranked grasp/pregrasp` 로그는 실제 반환 순서의 첫 IK\n해의 오차를 기록한다. 예전 `Accepted grasp` 로그는 joint-motion 우선 순서와 달리\n최소 방향 오차만 출력하므로 선택된 해의 자세로 해석하면 안 된다. 첫 해도 이후\n충돌/계획 검사에서 탈락할 수 있어 최종 선택은 action result의 joint state가 근거다.\n\nStudy-cafe launch의 `gripper_open_position_rad`(기본 1.2rad)로 실행 전 개방 폭을\n명시적으로 설정할 수 있다. Sorting은 홈에서 해당 개방까지의 sweep을 검사한 뒤,\n그 상태로 pregrasp와 접근을 계획한다. 큰 물체 진입 실험용이며 close command의\n보정식, 접촉 gate, joint/controller 허용치는 변경하지 않는다.\n\nSorting selector는 `joint_limit_margin_rad=0.005`로 arm IK endpoint에 관절 상한/하한\n여유를 둔다(일반 selector 기본 0). 경계에 포화된 해는 순위 목록과 state validity\n앞에서 제외한다. 43의 pregrasp가 손목 상한에 정확히 놓인 뒤 feedback가 12.44µrad\n넘어 Cartesian 시작 검증이 실패한 것을 방지하기 위한 선택 조건이다. 실제 feedback나\ntrajectory를 clipping하지 않으며 hard joint bounds/controller 허용치는 그대로다.\n\nStudy-cafe launch는 모든 child process 시작 전에 `fastdds_profiles_file`을\n`FASTRTPS_DEFAULT_PROFILES_FILE`로 전달한다. 이미 지정된 환경변수를 우선 보존하고,\n없으면 `cleany_perception/config/fastdds_rgbd.xml`(UDP + participant별 16 MiB SHM)을\n기본으로 쓴다. 빈 launch 값은 사용자 기본 middleware 설정으로 되돌리는 진단 옵션이다.\n다른 RMW의 동작을 바꾸는 설정이 아니며 QoS·freshness 기준은 변경하지 않는다.\n41의 실제 집기 구간에서 지도 receipt 2초 초과가 없었으나 모든 부하/장치에서의 보장은\n아니다. 별도로 띄우는 기록기/카메라는 같은 DDS 환경을 설정해야 비교할 수 있다.\n\n`sorting_reobserve_after_lift=true`는 head 재검출에 실패한 경우(기본 관측 경로에서는\n검출 대상이 없을 경우) 한 번의 카메라 재관측 이동을 허용한다. 정착한 실제 TCP와 관측 OBB로 파지\noffset을 잡고, CameraInfo/TF의 중앙 영상 ray 3개와 관측 높이 평면들의 교점을\n제안한다. 관측 OBB의 bounding sphere 전체가 화면 안에 들어오는 후보만 쓰며\n`sorting_reobserve_margin_px=24`, `sorting_reobserve_geometry_padding_m=0.01`,\n`sorting_reobserve_max_translation_m=0.20`으로 여백·최대 이동을 제한한다.\n현재 높이에서 맞지 않으면 `sorting_reobserve_max_lowering_m=0.10` 범위에서\n높이를 최대 3단계로 검사한다. 낮추더라도 필수 상대 상승량에\n`sorting_reobserve_height_clearance_m=0.02`를 더한 높이 아래로 내려가지 않는다.\nattached geometry를 보존하는 collision-aware IK와\n일반 MoveIt 경로 계획·실행을 통과해야 한다. 이동 전후 gripper contact를 확인하고\n이후 같은 선택된 관측 경로의 상대 상승량 검증을 다시 수행한다. 관측 재실패·재구성 실패·\n관측 높이 부족은 성공으로 처리하지 않는다. `sorting_held_association_tolerance_m=0.03`\n내에서 관측 중심과 파지 추정 중심이 일치해야 운반으로 넘어간다. 이 기능은\n센서 기반 재관측 동작이며 MuJoCo GT나 자동 물체 부착을 사용하지 않는다.\n실제 재관측 성공 여부는 실행 기록으로 별도 검증해야 한다.\n재관측/수거함 운반의 일반 joint-goal 이동에는 파지 중에만\nsorting launch에서는 `sorting_payload_velocity_scaling=0.24`,\n`sorting_payload_acceleration_scaling=0.20`를\n적용한다. 기존 속도·가속도보다 높이는 설정은 적용하지 않으며 열린 그리퍼로\n복귀할 때는 원래 값을 사용한다. 접근/역접근의 Cartesian retiming은 별도로\n유지한다. 노드 단독 기본값은 둘 다 0.01이며 launch 인수로 이전 값을 재현할 수 있다.\n이는 시뮬레이션 시험 설정이며, 지속 파지 성공이나 실제 하드웨어 적합성을 뜻하지 않는다.\n\n`config/table_sorting_policy.yaml`은 Gemini의 category/reason을 받아\n쓰레기를 `trash_right`, 분실물을 `lost_items_left`로 보낸다. 위험 라벨과 저신뢰,\ncategory/reason 미제공 결과는 review로 남기고 조작하지 않는다.\n\n현재 장면은 종이컵·마우스·휴지뭉치·확대한 레고를 사용한다. YOLOE의 명시 클래스는\n`cup`, `computer mouse`, `crumpled tissue`, `lego brick`이며 Gemini는 고정 목록 없이\n외형에 따른 자유 라벨을 생성한다. 모델 출력 category/reason으로 분류하고 위험·저신뢰\n결과는 review로 남긴다. 장면의 형상·크기와 평가용 body mapping은\n[MuJoCo README](../../cleany_mujoco_sim/docs/scenes.md)를 따른다.\n\n수거 위치는 로봇 뒤쪽 +Y(좌측)의 `lost_items_left`, -Y(우측)의\n`trash_right`다. `cleany_mujoco_sim/config/robot_top_bins.yaml`은\n수거 위치의 알려진 보정값/형상만 공유한다. 책상과 집을 물체의 위치/형상은\n카메라에서 얻으며 scene의 target 좌표를 planner에 전달하지 않는다.\n수거함은 바닥과 4개 벽으로 구성되고 MoveIt에도 같은 목적지 형상을 등록한다.\n내부 후면 받침판도 같은 설정으로 MoveIt 충돌 형상에 등록한다.\n이 좌표는 현재 고정 베이스 시뮬레이션 전용이며 이동 베이스 운용을 보장하지 않는다.\n\n분류 → 물체에 가까운 팔의 후보를 먼저 검사하고 실패하면 반대 팔 검사 → 재인식/집기/후퇴/들기 →\n부착 물체를 포함한 MoveIt 운반 → 수거함 개구부 확인 → 열기 → 복귀 →\n선택적 놓기 검증 순서다. 운반 실패 또는 비정상 물체 중심·반경이면 그리퍼를 열지 않는다.\nsorting 모드에서는 다각도 grasp 후보와 전체 팔 IK seed를 추가로 탐색하되\n기존 pose/충돌 허용 기준은 유지한다. 운반 IK에는 전체 joint feedback과\n`RobotState.is_diff=true`를 보내 부착한 OBB가 검사에서 빠지지 않도록 한다.\nSorting은 초기 양손 개방을 따로 명령하지 않는다. 선택된 팔의 pregrasp와\n그리퍼 개방을 6관절 경로로 함께 계획하고, 목표 도착 시 모든 관절 피드백을 검사한다.\n별도 닫기·놓기의 `gripper_motion_sec` 기본값은 2초이며 반환 시에도 팔 복귀와\n턱 닫기를 같은 경로로 계획한다. 속도는 [Sorting 속도 설정 표](study_cafe_sorting_configuration.md#sorting-속도와-실행-설정)를 따른다.\n재검출 후보를 selector에 전달하기 전 이전 snapshot의 target OBB를 제거해 중복\n충돌체를 방지한다. 닫기 후 잔여 각도·속도의 안정 구간이 확인돼야 attachment/lift로 진행한다.\n동작 실패 뒤 depth boost 복원까지 실패하면 두 오류를 기록하고 최초 동작 오류를 유지한다.\n\n재선택한 grasp가 현재 팔 위치에서 LIN 방향 기준을 넘으면, 반환된 새\npregrasp로 충돌 검사 이동한다. 이 이동 중 target 접촉은 허용하지 않는다.\n이후 새 RGB-D로 동일 물체의 OBB 모서리 집합이 기본 5 mm 이내에서 유지되는지\n확인해야 접근한다. 없거나, 오래됐거나, 여러 물체가 일치하면 중단한다.\n기존 LIN 10도 기준은 그대로이며, 보정 이동 후에도 다시 검사한다.\n\nSorting은 `use_joint_corridor_grasp=true`, `use_seeded_cartesian_grasp=true`로\n선택된 grasp **관절값**을 보존하는 접근을 사용한다. TCP는 실제 시작점과\n목표 사이의 반경 1 mm 원통 안으로 제한하고, 역접근은 실제 접근 시작 관절값을\n목표로 동일하게 계획한다. 두 끝 관절값의 보간을 seed로 기본 10 mm 간격\ncollision-aware IK를 구한 뒤 단조 cubic 곡선을 구성한다. 모든 중간 검사는\n전체 관절 피드백과 현재 attached body를 보존한다.\n이는 5-DOF 팔에서 임의의 6-DOF 방향을 정확히 보간하는 Pilz LIN과 동일하지 않다.\n반환된 모든 waypoint를 FK로 검사해 원통 이탈/역행을 거부하며, 시작·끝 방향은\n0.01 rad 이내, 중간 방향은 두 끝 자세의 SLERP에서 기본 5도 이내여야 한다.\n충돌·목표 접촉 허용 정책과 controller/contact 한계는 변경하지 않는다.\n관절 속도와 가속도의 곡선 전체 상한을 분석해 시간을 정하고, 실제 JTC cubic\n보간 곡선을 기본 1 mm 분할 및 관절별 0.005 rad 이하 간격으로 표본화해\nMoveIt 충돌/constraint/FK 검사를 거친다. 최대 2000점 초과 시 중단한다.\nJTC에 position+velocity를 전달하며 acceleration 필드는 비워 동일한 cubic\n보간을 유지한다. 모델 관절 한계는 `cartesian_joint_limits_file`(기본 MoveIt\n`joint_limits.yaml`)에서 읽는다. 가속도 미정 관절은 명시 파라미터\n`cartesian_joint_acceleration_rad_s2=1.0`에 실행 scaling을 적용한다. 이는\nMoveIt 기본 가속도와 같은 시험용 상한이지 하드웨어 검증값은 아니다.\n\n추가로 FK sample의 병진/회전 속도와 병진 가속도를 기준으로 trajectory\n시간만 균일하게 늘린다. 기본 Cartesian 상한은\n0.10 m/s, 0.50 rad/s, 0.20 m/s²에 실행 scaling을 적용하고, 추가 시간 여유는\n`corridor_time_margin=2.0`이다. 위치/경로는 바꾸지 않고 velocity/acceleration도\n같은 비율로 줄인다. 이 FK 표본 검사는 연속 시간 속도/충돌 또는 실제 하드웨어\n안전 인증을 대신하지 않는다. `use_seeded_cartesian_grasp=false`이고 joint\ncorridor만 켜면 기존 OMPL 계획+FK 검사 경로를 사용한다. 일반 데모의 두\n모드는 opt-in이며 수직 lift는\n여전히 endpoint 검사를 통과한 Pilz LIN을 사용한다.\n\nsorting launch의 현재 기본값은 `approach_velocity_scaling=1.0`,\n`retreat_velocity_scaling=0.8`, `corridor_time_margin=1.05`이다. 같은 이름의\nlaunch 인수로 조절하며 일반 데모는 기존 0.2/0.4/2.0을 유지한다.\n관절 속도·가속도 한계, 충돌/경로 검사, controller tolerance는 완화하지 않는다.\nsorting joint-corridor의 grasp 접근에만 `sorting_approach_acceleration_scaling=1.0`을\n적용한다(기존 0.4). 계획과 FK sample 시간 배율 검사에 같은 값을 사용한다.\n관절 자체 한계는 제거하지 않는다. sorting Cartesian fallback 가속도는 4 rad/s²,\n별도 gripper motion은 2초, LIN 가속 배율은 0.8이다. MoveIt TOTG의 URDF 미정\n관절 fallback과 Cartesian fallback은 서로 다른 경로다. 현재값 전체는 [Sorting 속도 설정 표](study_cafe_sorting_configuration.md#sorting-속도와-실행-설정)를 따른다. 실기 검증값은 아니다.\n\nsensor-scene 모드에서는 OBB attach 성공 뒤 **그 시점보다 새로운 촬영 시각**의\n처리 완료 depth receipt를 기다린다. `attachment_scene_timeout_sec=5.0` 안에\n오지 않으면 후퇴를 시작하지 않는다. 기존 capture/map age 2초 조건도 유지한다.\n이 barrier는 새 frame 통합 전 계획을 막지만 지도 잔상이 모두 없어졌음을\n보증하지는 않는다.\n\nSorting selector는 `align_grasp_wrist_roll=true`도 사용한다. 현재 Cleany\nURDF의 wrist-roll 축과 TCP offset이 local -Y로 일치하므로, position IK가\n찾은 해의 closing 방향을 이 축 둘레로 직접 맞춘 후보를 만든다. 관절 범위\n안의 동치 각도만 검사하며 비대칭 jaw의 180도 반전을 허용하지 않는다.\n회전한 후보는 전체 robot state 충돌 검사와 기존 FK 위치/approach/closing\n허용 기준을 다시 통과해야 한다. 회전은 **계획 후보**에만 적용하며 실제\n로봇/물체를 강제로 회전하지 않는다. 모델-parity 테스트가 축/TCP 가정을\n검사하며 일반 selector 기본값은 false다.\n부착 해제 시에는 MoveIt이 world에 다시 만든 임시 OBB까지 순차적으로\n제거한다. `/sorting/status`의 실패 메시지에는 별도 `error`가 포함된다.\n`sorting_artifact_directory:=/absolute/path`를 launch에 지정하면 실행마다\n새 `run-\u003cuuid>` 하위 폴더에 `inspection`(InspectScene.Result),\n`grasps`(PlanGrasp.Response), `selection`(SelectReachableGrasp.Result)을\nCDR로 저장한다. fresh depth/3D 추정과 실제 사용한 후보를 오프라인에서\n비교하기 위한 출력 전용 옵션이며, 저장 데이터를 제어 입력으로 재사용하지 않는다.\n기본값은 빈 문자열로 저장하지 않는다.\n접근/후퇴/lift의 `motion_request`(MoveGroup.Goal)와 `motion_result`\n(MoveGroup.Result)는 계획 실패/실행 전 거부 시에도 저장한다.\nseeded 방식에서는 요청의 pipeline/planner ID가 `cleany_seeded_cartesian` /\n`monotone_cubic`이며, 이는 계획 입력을 같은 형식으로 기록한 것이다.\n해당 가상 pipeline ID를 MoveGroup 서버에 전송하지 않는다. 결과의 trajectory와\nplanning_time은 실제 IK/검증 계산으로 작성하며 실패도 기록한다.\n실행 전 FK 검증을 통과한 trajectory는 `motion_plan` 이름의\n`moveit_msgs/RobotTrajectory` CDR로 저장한다. 이 출력에는 corridor 시간 보정이\n반영되며, 저장 자체가 물리 실행/파지 성공을 뜻하지는 않는다.\n`grasp_approach_offset_m` launch 인수(시뮬레이션 수거 0.018 m, 그 외 0.016 m)는 selector의 IK 목표와\ncoordinator의 실행/표시 보정에 동일하게 전달한다. 회전식 비대칭 jaw의\n벌림에 따른 실제 접촉 깊이를 보정하는 시험용 입력이며, 현재 기본값은\n실측 하드웨어 보정이나 지속 파지 성공으로 검증된 값이 아니다.\n같은 옵션은 selector의 출력 전용 service trace도 활성화한다. 별도\n`services-\u003cuuid>` 폴더에 각 MoveIt 서비스 요청/응답 CDR과 완료 시간,\n취소 여부 JSON을 저장한다. 실패한 IK 요청의 seed/목표를 재현하기 위한\n진단이며 응답이나 계획을 수정하지 않는다. 이 옵션의 파일 I/O가 포함된\n시간을 저장 기능을 끈 운용 성능으로 해석하지 않는다.\n`/sorting/status`는 단계, label, 분류, 목적지, 완료 항목을 JSON String으로\nlatched 발행한다. 기본은 관찰 모드이며 물체별 `placement_verified=false`와\n`mission_complete_unverified`를 기록한다. 자동 검증을 켜면 물체별 안착 확인 후\n`mission_complete`를 발행한다. 빈 작업영역은 연속 두 번 확인해야 한다.\n`sorting_require_category_coverage=true`일 때만 `sorting_required_categories`의\n모든 종류가 완료 항목에 포함됐는지 추가 검사한다.\n\n`/sorting/verify_placement`는 독립된 결과 검증 port다. 현재는 시뮬레이션\noracle이 release 이후의 새 물체 AABB가 올바른 수거함 내부에서 안정적으로\n정지했는지 확인한다. 이 oracle은 인식·분류·grasp·경로 계산에 사용하지\n않는다. 실제 로봇에는 별도의 센서 기반 결과 검증 구현이 필요하다.\n"},"ros2_ws/src/cleany_system_supervisor/docs/interfaces.md":{"title":"cleany_system_supervisor 노드 인터페이스","body":"# cleany_system_supervisor 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다. 동작 계약은 [System Supervisor](supervision.md)를 따른다.\n\n## system_supervisor\n\n실행 파일: `system_supervisor`. 원본: [node.py](../cleany_system_supervisor/node.py), [ros_transport.py](../cleany_system_supervisor/ros_transport.py). 설정: [system_supervisor.yaml](../config/system_supervisor.yaml)의 `ros`.\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `system/state` | `cleany_interfaces/msg/SystemState` | R/T1; 20 Hz; epoch, revision, 운영 상태, 전체 MissionPermission |\n| 토픽 발행 | `system/capabilities` | `cleany_interfaces/msg/SystemCapabilities` | R/T1; 20 Hz |\n| 토픽 발행 | `system/faults` | `cleany_interfaces/msg/SystemFaults` | R/T1; 20 Hz; 활성과 retention 중인 해제 Fault |\n| 토픽 발행 | `system/recoveries` | `cleany_interfaces/msg/SystemRecoveries` | R/T1; 20 Hz |\n| 토픽 발행 | `system/heartbeat` | `cleany_interfaces/msg/SystemHeartbeat` | R1; 20 Hz |\n| 토픽 발행 | `system/events` | `cleany_interfaces/msg/SystemEvent` | R100; 이벤트 발생 시 |\n| 토픽 발행 | `diagnostics` | `diagnostic_msgs/msg/DiagnosticArray` | R10; `diagnostics_period_s` 1초; `system_supervisor: ...` status |\n| 토픽 구독 | `diagnostics` | `diagnostic_msgs/msg/DiagnosticArray` | R10; `base_driver` status만 사용; `diagnostics_topic` |\n| 토픽 구독 | `scan` | `sensor_msgs/msg/LaserScan` | Sensor; `scan_topic` |\n| 토픽 구독 | `amcl_pose` | `geometry_msgs/msg/PoseWithCovarianceStamped` | Sensor; `pose_topic` |\n| 토픽 구독 | `camera/head/color/image_raw` | `sensor_msgs/msg/Image` | Sensor; `camera_topic` |\n| 토픽 구독 | `system/component_health` | `cleany_interfaces/msg/ComponentHealth` | R10; `component_sources`의 source만 수락 |\n| 토픽 구독 | `safety/status` | `cleany_interfaces/msg/SafetyStatus` | R10; `safety_topic` |\n| 서비스 호출 | `\u003cnav2 node>/get_state` | `lifecycle_msgs/srv/GetState` | Service 기본값; `lifecycle_poll_s` 0.5초; `navigation_nodes`, `localization_nodes` |\n| 서비스 제공 | `system/check_permission` | `cleany_interfaces/srv/CheckPermission` | Service 기본값 |\n| 서비스 제공 | `system/request_fault_reset` | `cleany_interfaces/srv/RequestFaultReset` | Service 기본값; `operator_id` 필수 |\n| 액션 제공 | `system/request_recovery` | `cleany_interfaces/action/RequestRecovery` | Action 기본값 |\n| 액션 호출 | `mission/stop` | `cleany_interfaces/action/StopMission` | Action 기본값; `stop_action`; 서버는 `mission_runtime` |\n| 액션 호출 | `\u003csource>/recover` | `cleany_interfaces/action/RecoverComponent` | Action 기본값; `recovery_policies.*.action` |\n\nGraph 조회로 `trusted_publishers`의 topic publisher를 1초마다 검사한다. 상태 snapshot의 retained 값은 허가가 아니며, client는 heartbeat freshness, epoch와 lease 만료를 별도로 검사한다.\n\n기동 복구를 사용하는 프로필은 `base_driver` diagnostics의 `disarmed`도 확인한다.\n키 누락, stale timestamp와 stale 피드백은 `base_disarmed` 정상 증거가 아니다.\n연결 단절 원인은 영속 Fault의 `cause`에 보존하고 복구 결과는 기존 `system/events`의\n`BASE_STARTUP_RECONCILED`로 발행한다. 기존 ROS 메시지와 서비스 형식은 유지한다.\n\n## supervisor_operator\n\n실행 파일: `supervisor_operator`. 원본: [operator_cli.py](../cleany_system_supervisor/operator_cli.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `system/heartbeat` | `cleany_interfaces/msg/SystemHeartbeat` | R1 |\n| 토픽 구독 | `system/faults` | `cleany_interfaces/msg/SystemFaults` | R/T1 |\n| 서비스 호출 | `system/request_fault_reset` | `cleany_interfaces/srv/RequestFaultReset` | Service 기본값; reset 인자가 있을 때만 |\n\n인자 없이 실행하면 활성 Fault를 나열하고, `\u003cFAULT_CODE> --operator \u003cname>`은 reset을 요청한다. 하드웨어를 해제하지 않는다.\n\n`tof_required=true`이면 `tof_proximity`를 component source와 `BASE_MOTION` 필수 근거에\n추가하고 `/proximity_guard`의 health 발행을 허용한다. source가 오래되거나 가용하지 않으면\n기존 lease 회수와 Mission stop 경로를 사용한다. 일반 장애물 정지는 health 불가용으로\n보고하지 않는다. ToF가 실제로 없는 구성에는 이 옵션을 적용하지 않는다.\n"},"ros2_ws/src/cleany_system_supervisor/docs/supervision.md":{"title":"System Supervisor 계약","body":"# System Supervisor 계약\n\n\n[감독 stack 실행](../../../../docs/how-to/mission.md#system-supervisor-감독-stack) · [인터페이스](interfaces.md)\n\nSystem Supervisor는 시스템 가용성, Fault, Capability, 운영 상태, Mission 실행 허가와 복구 조정을 소유한다. 실제 안전 정지 장치가 아니며 Mission 실행, 정지 확인, 재개, journal과 Nav2 BT Recovery를 대신하지 않는다. 책임 원칙은 KB의 [System Supervisor](\u003c../../../../docs/cleany-docs/20_TECHNICAL/14 - System Supervisor.md>)를 따른다. Endpoint 표는 [인터페이스](interfaces.md), 설정 원본은 [system_supervisor.yaml](../config/system_supervisor.yaml)이다.\n\n## 책임 경계\n\n```mermaid\nflowchart TB\n    Safety[\"Independent safety layer\u003cbr/>(하드웨어, 미구현)\"] -->|\"Bool 증거\"| Adapter[\"safety_adapter\u003cbr/>/safety/status\"]\n    Adapter --> Sup[\"System Supervisor\u003cbr/>Fault / Capability / 허가 / 복구 조정\"]\n    Owners[\"Base driver / Nav2 lifecycle / LiDAR / pose / camera\u003cbr/>arm_health_monitor / perception_inspector\"] -->|\"health\"| Sup\n    Sup -->|\"lease, 철회, StopMission\"| Runtime[\"Mission Runtime\u003cbr/>실행 / 정지 확인 / journal / 재개\"]\n    Runtime -->|\"취소\"| Ops[\"Nav2 / 조작\"]\n    Sup -->|\"RecoverComponent\"| Recovery[\"nav2_lifecycle_recovery\u003cbr/>→ Nav2 lifecycle manager\"]\n    Logger[\"cleany_logger / Monitor\"] -.->|\"관측, 기록\"| Sup\n```\n\n| 판단 | 소유자 |\n|---|---|\n| 시스템 Fault, Capability, 운영 상태, 실행 허가 | Supervisor |\n| 미션 수락, 실행, 취소, 자기 동작의 정지 완료, 재개, journal | Mission Runtime |\n| 현재 팔 상태로 주행해도 되는지(`safe_to_drive`) | Mission Runtime (조작 결과 기반) |\n| 실제 정지와 하드웨어 보호 | 독립 안전 계층 |\n| 정지 증거와 E-stop 해제 증거 보고 | `cleany_safety_adapter` |\n| 실제 복구 | 각 컴포넌트 owner (현재는 Nav2 lifecycle manager만) |\n| 영구 기록 | `cleany_logger`; Supervisor는 구조화 이벤트만 발행 |\n\nRuntime의 실행 오류(정지 기한 초과, adapter 예외, INTERRUPTED)는 Runtime ERROR와 `mission/reset_error`가 처리한다. 시스템 Fault는 Supervisor와 `system/request_fault_reset`가 처리한다. 허가 상실로 끝난 미션은 정지가 확인되면 Runtime ERROR로 가지 않는다.\n\n## 운영 상태\n\n| 상태 | 조건 |\n|---|---|\n| INITIALIZING | boot grace 중 필수 기능 또는 안전 증거가 아직 검증되지 않음 |\n| OPERATIONAL | 모든 Capability와 필수 안전 증거가 fresh, stable이고 운영 잠금 Fault 없음 |\n| DEGRADED | 필수 기능과 안전은 검증됐지만 일부 비필수 Capability 제한 |\n| FAULT_LOCKED | 운영 잠금 Fault, 필수 기능 불가, 또는 grace 이후 필수 정보 미확인 |\n\nSeverity만으로 상태를 정하지 않는다. 필수 Capability는 `BASE_MOTION`이다. 초기와 stale 상태는 UNKNOWN이다. Capability 차단은 Fault debounce 없이 즉시 적용하고, 정상 복귀에는 `clear_s` 동안 연속 정상 보고가 필요하다.\n\n### 부팅 유예와 hysteresis\n\n| 상황 | 처리 |\n|---|---|\n| 한 번도 AVAILABLE을 보고하지 않은 source의 UNKNOWN | `startup_grace_s`(source별 override, base 15초) 동안 Fault 아님. Capability는 UNKNOWN이라 허가 거부 |\n| 명시적 이상 보고 | grace와 무관하게 `raise_s` 뒤 Fault |\n| 확인된 뒤 상실 | grace와 무관하게 `raise_s` 뒤 Fault |\n| Base 첫 MCU 피드백 전 | `feedback_received=False`를 UNKNOWN으로 처리 |\n| Base 짧은 피드백 공백 | `raise_s` 0.3초 미만이면 BASE_MOTION만 즉시 차단, latch 없음 |\n| STOP 요청, `cmd_vel timeout` | base driver `fault`가 비어 있으므로 장애 아님 |\n\nGrace 값과 hysteresis는 미측정 초기값이다.\n\n## Capability와 Fault\n\n| Capability | 직접 증거 | 의존성 |\n|---|---|---|\n| BASE_MOTION | base diagnostics | 없음 |\n| NAVIGATION | 유효 scan, covariance 제한 내 pose와 localization lifecycle, Nav2 lifecycle(`planner_server`, `controller_server`, `bt_navigator`, `collision_monitor`) | BASE_MOTION |\n\n| MANIPULATION | `arm_health_monitor` | 없음 |\n| VISUAL_PERCEPTION | 유효 image, `perception_inspector` readiness | 없음 |\n| MOBILE_MANIPULATION | 없음 | NAVIGATION, MANIPULATION, VISUAL_PERCEPTION |\n\nPose 공분산의 대각 성분은 상한을 유지하며, AMCL 부동소수점 연산의 음수 잔차는 `-1e-9`까지 0으로 취급한다. 그보다 작은 음수, non-finite 값과 상한 초과는 여전히 거부한다.\n\n휴대폰 LiDAR 시연은 NAVIGATION에 `localization_alignment`도 요구한다.\n`localization_guard`의 unknown/unavailable은 공분산이 작아도 허가하지 않는다.\n검증된 위치에서 제한된 시간 동안 AMCL의 재정합을 기다리는 degraded는 AVAILABLE\nhealth와 별도 속도 제한을 함께 발행해 기존 허가를 유지한다. 이 프로필만 정지 후\n위치 복구를 자동 요청하며, 정지 증거는\nbase_driver의 fresh `base_disarmed`와 미확인 lease의 StopMission 완료를 사용한다.\n이는 물리 E-stop이나 팔을 포함한 전신 정지를 검증했다는 뜻이 아니다.\n\nKB 초기 분류는 BASE_MOTION에 \"이동을 허용할 팔 상태\"를 포함한다. 현재 구현은 이 판단을 Runtime의 `safe_to_drive`에 두고 Capability에서는 팔 가용성만 다룬다. 이 배치는 KB 검토가 필요하다.\n\n| Fault | 기본 처리 |\n|---|---|\n| BASE_UNAVAILABLE | base fault, 지속 피드백 상실, grace 후 미연결. CRITICAL, latched, 전체 잠금 |\n| LIDAR_UNAVAILABLE, CAMERA_UNAVAILABLE | 입력 중단 또는 무효. 해당 Capability 제한, 복구 unsupported |\n| LOCALIZATION_UNAVAILABLE, NAVIGATION_UNAVAILABLE | pose 또는 lifecycle 이상. NAVIGATION 제한, lifecycle 복구 가능 |\n| PERCEPTION_UNAVAILABLE, ARM_UNAVAILABLE | owner 보고 불가 또는 미확인. 해당 Capability 제한, 복구 unsupported |\n| SAFETY_UNVERIFIED, ESTOP | 보호 계층 또는 E-stop 해제 증거 없음. CRITICAL, latched, 전체 잠금 |\n| UNTRUSTED_PUBLISHER | 안전 또는 health topic에 allowlist 밖 publisher. CRITICAL, latched, 전체 잠금 |\n| MISSION_STOP_FAILED:\u003clease_id> | 정지 실패 또는 기한 초과. 확인된 stop 결과 전까지 잠금 |\n| SUPERVISOR_STATE_UNVERIFIED | 영속 상태 파일 읽기 또는 쓰기 실패. operator 확인 전까지 잠금 |\n\n일반 Latched Fault reset에는 원인 source의 fresh, stable 정상 보고와 `operator_id`가 모두 필요하다. E-stop reset은 하드웨어를 해제하지 않는다.\n\n## 허가와 정지\n\nMission Runtime과의 순서와 사유 코드는 [Mission 계약](../../cleany_interfaces/docs/mission.md#system-supervisor-감독)을 따른다.\n\n| 항목 | 계약 |\n|---|---|\n| Lease | 미션당 하나, `supervision_capabilities` 집합. TTL 1.5초, epoch와 version 일치, 갱신은 같은 집합만 |\n| 철회 | Capability 상실, 운영 잠금, TTL 만료. 철회 즉시 `mission/stop` 요청 |\n| 정지 확인 | Runtime이 자기 동작의 정지와 terminal 결과를 확인해야 stopped=true. Action 수락은 증거 아님 |\n| 정지 기한 | `stop_timeout_s` 6초. Runtime 응답 기한(`cancel_timeout` 5초 + 0.5초)보다 길어야 정상 정지가 잠금으로 확대되지 않음 |\n| 정지 서버 미발견 | 기한 안에서 재시도. 기한 초과 시 MISSION_STOP_FAILED |\n| 늦은 확인 | 기한 뒤라도 stopped 결과가 오면 해당 Fault 해제 |\n| Supervisor 종료 | 갱신이 끊겨 Runtime이 heartbeat timeout(1초)과 TTL로 스스로 정지 |\n\n## 재시작과 영속 상태\n\n`persistence.state_file`(기본 `~/.ros/cleany/system_supervisor_state.json`)에 활성 latched Fault와 정지 미확인 lease를 원자적으로 기록한다.\n\n| 재시작 시 | 처리 |\n|---|---|\n| Latched Fault | restored로 다시 활성. 현재 health가 정상이어도 operator reset 전 잠금 |\n| 정지 미확인 lease | granted=false로 복원하고 `mission/stop`으로 재확인. 확인 전에는 같은 mission의 새 허가와 복구 dispatch 차단 |\n| 파일 손상, format 불일치 | SUPERVISOR_STATE_UNVERIFIED |\n| 빈 `state_file` | 영속화 해제. 테스트 전용 |\n\n휴대폰 LiDAR 시연은 `startup_base_reconnect.enabled=true`, `stable_s=1.0`을 사용한다.\n기본 Supervisor 프로필에서는 꺼져 있다. 이 정책은 복원된 base Fault에 기록된\n`cause=base_feedback_lost`만 대상으로 한다. 현재 base와 모든 `safety_sources`,\n`base_disarmed`가 기동 이후 fresh, stable 상태를 유지해야 한다. 다른 운영 잠금,\n정지 미확인 lease와 진행 또는 격리 중인 복구가 있으면 해제하지 않는다.\n`base_disarmed`는 base driver의 검증된 휠 피드백으로 판단하며 독립적인 전신 안전이나\nSTOP ACK를 의미하지 않는다. 원인이 없는 이전 형식의 Fault, 모터/프로토콜 고장과\n현재 프로세스에서 생긴 Fault는 일반 operator reset을 유지한다. 복구는 기존 목표를\n재개하거나 새 구동 허가를 발행하지 않는다.\n\n## 정리와 이벤트\n\n`retention_s`(300초)가 지난 정지 확인 lease, terminal recovery job, 해제 Fault를 정리한다. Job은 해당 Fault episode가 끝난 뒤에만 정리하므로 재시도 예산은 사라지지 않는다.\n\n`system/events`는 상태 차이에서 이벤트를 만들기 때문에 어떤 전이도 기록을 건너뛰지 않는다. 영구 저장은 `cleany_logger`의 기록 대상에 추가해 처리하며, Supervisor는 파일을 쓰지 않는다. Node log에는 debug level로만 남긴다.\n\n| kind | 의미 |\n|---|---|\n| STATE_CHANGED | 운영 상태 전이 |\n| FAULT_RAISED, FAULT_CLEARED, FAULT_RESTORED | Fault 발생, 해제, 재시작 후 복원 |\n| FAULT_RESET_ACCEPTED, FAULT_RESET_REJECTED | reset 요청. `source`는 operator_id |\n| BASE_STARTUP_RECONCILED | 시연 프로필의 기동 후 통신 복구 및 base 정지 확인으로 이전 연결 Fault 해제 |\n| LEASE_GRANTED, LEASE_REVOKED, LEASE_RELEASED, LEASE_RESTORED | 허가 수명 |\n| MISSION_STOP_ACCEPTED, MISSION_STOPPED | 정지 요청 수락과 정지 확인 |\n| RECOVERY_REQUESTED, RECOVERY_\u003cstate>, RECOVERY_UNSUPPORTED | 복구 시도와 결과 |\n| STATE_RESTORE_FAILED, STATE_PERSIST_FAILED | 영속 상태 오류 |\n\n## 운영자 절차\n\n1. `ros2 run cleany_system_supervisor supervisor_operator`로 활성 Fault를, `system/events`로 이력을 확인한다.\n2. 물리 원인을 해소한다. CLI와 서비스는 하드웨어를 해제하지 않는다.\n3. `supervisor_operator \u003cFAULT_CODE> --operator \u003cname>`으로 reset을 요청한다. 거부 사유는 응답과 이벤트에 남는다.\n4. `MISSION_STOP_FAILED:\u003clease>` reset은 정지 Action을 다시 조회할 뿐이며 새 stopped 결과가 와야 해제된다.\n5. Runtime ERROR가 남아 있으면 `mission/reset_error`로 따로 해제한다.\n\n## 발신자 신뢰\n\nHumble rclpy는 메시지별 발신자를 알려 주지 않는다. Supervisor는 graph를 조회해 `trusted_publishers` topic에 allowlist 밖 node가 publish하면 잠근다. 잘못된 실행과 이름 충돌은 잡지만 같은 node 이름의 위조는 막지 못한다. `ComponentHealth.source`가 node와 묶이지 않으므로 allowlist 안 node의 source 사칭도 막지 못한다. 실제 접근 통제는 SROS2 enforce 모드에서 `safety/status`, `system/component_health` publish와 `system/request_fault_reset`, `mission/stop` 호출을 각 enclave에만 허용하는 방식으로 해야 하며, 이 저장소에서는 검증하지 않았다.\n\n## 복구 정책\n\n| source | owner | 상태 |\n|---|---|---|\n| navigation | `navigation/recover` → `lifecycle_manager_navigation` | 구현, 자동 off |\n| localization | `localization/recover` → `lifecycle_manager_localization` | 구현, 자동 off |\n\n| lidar, camera, perception, arm, base | 없음 | `UNSUPPORTED`, 예산 소모 없음 |\n\n휴대폰 시연의 `localization/recover` owner는 `localization_guard`이며 위 일반\nlifecycle 복구 owner와 동시에 실행하지 않는다. 정지 상태에서 제한된 scan/map\n후보를 검증해 initialpose를 갱신하며, 자동 목표 재개나 이동 명령은 발행하지 않는다.\n이 프로필은 `localization_alignment` Fault 하나에 복구 예산을 연결한다. 기본\n`localization` 감시도 계속 주행을 차단하지만 별도 복구 작업을 만들지 않는다.\n따라서 공분산과 정합 이상이 동시에 발생해도 중복 예산으로 재시도하지 않는다.\n\n일반 프로필의 lifecycle 자동 복구는 실제 Nav2 stack에서 reset이 검증되지 않아 꺼져 있다. 기본 max_attempts 2, attempt 15초, total 40초, verify 5초, cancel 2초다. 복구는 겹쳐 실행하지 않고, 같은 Fault episode의 중복 요청은 같은 job을 반환한다. 시작에는 safety adapter의 whole-robot `stopped`와 미확인 Mission 정지가 없을 것이 필요하다. Owner 성공 뒤에도 fresh health와 안정화 시간이 지나야 성공이다.\n\n## 검증 범위\n\n소프트웨어 검증 명령과 범위는 [테스트 가이드](../../../../docs/TESTING.md)를 따른다. 다음 항목은 하드웨어나 실제 stack에서 별도 검증이 필요하다.\n\n- E-stop 회로와 독립 보호 계층 상태를 내보내는 하드웨어. 현재 신호가 없어 기본 실행은 잠긴다.\n- ESP32 통신 차단 시 MCU watchdog의 모터 정지 시간과 실제 감속 거리.\n- 실제 Nav2 stack의 lifecycle RESET/STARTUP 복구, Jetson 다중 프로세스 지연, base grace 15초의 적정성.\n- 실물 arm controller 가용성 보고와 SROS2 enforce 모드.\n- Mission이나 하위 제어기 crash 뒤의 물리 안전. Lease는 이 Runtime만 제한하며 임의의 `cmd_vel` publisher나 sorting coordinator 같은 별도 실행기를 막지 않는다.\n"},"ros2_ws/src/cleany_telemetry/docs/interfaces.md":{"title":"cleany_telemetry 노드 인터페이스","body":"# cleany_telemetry 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리한다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/ROS_INTERFACES.md)을 따른다. 이름 설정이 없는 항목은 ROS remap으로 변경한다.\n\n## cleany_telemetry\n\n실행 파일: `telemetry_node`. 원본: [node.py](../cleany_telemetry/node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `/odom` | `nav_msgs/msg/Odometry` | B1; `odom_topic` |\n\nROS 발행, 서비스, action은 없다. `url`의 Backend pose WebSocket으로 전송하며 `rate` 기본 5 Hz와 `input_timeout` 기본 1.5초를 적용한다.\n"},"ros2_ws/src/cleany_teleop/README.md":{"title":"Cleany Teleop","body":"# Cleany Teleop\n\n폰 조종의 입력 유효시간, STOP과 ENABLE 확인 및 ROS 전송을 담당한다.\n매핑 상태의 수신 지연, 권한 RPC 거절 사유와 조종 사건 기록은\n[인터페이스와 진단 규약](docs/interfaces.md)에서 확인한다.\n\n공통 [실행 절차](../../../docs/RUNNING.md)를 따라 실행하고,\n저장소 루트에서 `make test-hardware-mapping-core`로 입력과 오류 처리 로직을 검증한다.\nROS 인터페이스를 변경한 경우 `make build-hardware-mapping`과\n`make test-hardware-mapping`을 실행한다.\n"},"ros2_ws/src/cleany_teleop/docs/interfaces.md":{"title":"휴대폰 조종","body":"# 휴대폰 조종\n\nNavigationBridge는 `navigation/slip`, `navigation/traction_recovery`의\n`std_msgs/msg/String` JSON을 읽고 `/api/navigation/status`에 `slip`,\n`traction_recovery`로 제공한다. 화면의 감지 및 재시도 표시는 이 상태를 사용하며\n구동 권한이나 명령 소유권을 추가하지 않는다. 기존 서버 프로세스에는 새\nsubscription이 자동 추가되지 않으므로 코드 반영 시 해당 서버를 다시 실행한다.\n\n`phone_remote`는 만료하는 브라우저 입력을 base driver에 전달한다. MCU 휠 명령은 발행하지 않는다.\n단일 브라우저가 입력 lease를 소유하며 70ms 갱신, 250ms 입력 만료와 기존 해제 경계를 유지한다.\n\n| 종류 | 기본 이름 | 타입 | 계약 |\n|---|---|---|---|\n| 발행 | `cmd_vel` | `Twist` | 차체 속도, 50Hz 상한. driver의 축별 한도와 휠 한도 적용 |\n| 구독 | `base/wheel_state` | `WheelState` | sensor data QoS. 상태는 fresh MCU 응답 기준 |\n| 서비스 호출 | `base/set_enabled` | `SetBaseEnabled` | 순서가 있는 구동 허가 요청. 응답만으로 구동 완료 판정 금지 |\n| 서비스 제공 | `teleop/pause` | `SetBool` | true: 새 입력 차단과 STOP 요청. false: 차단 해제만 수행 |\n| 발행 | `teleop/status` | `TeleopStatus` | Reliable depth 10. ready, pause, 연결, 정지 확인과 boot |\n| 구독 | `mapping/status` | `MappingStatus` | Reliable transient local depth 1 |\n| 서비스 호출 | `mapping/control` | `MappingControl` | 인증된 웹 초기화 요청을 매핑 관리자에 전달 |\n\n`base/wheel_command` publisher와 `cmd_vel` publisher가 각각 하나여야 조종을 허용한다.\n`--base-config`는 실행 중인 driver와 같은 설정이어야 한다. UI의 최대 휠 속도는 의도 상한이며\n실제 전송 목표는 MCU `target_rad_s`다. 축별 한도 때문에 더 낮아질 수 있다.\n\n브라우저 연결이 끊기면 정지한다. 같은 눌림을 유지하면 연결 복구 후 STOP 확인, 새 ENABLE과\n새 입력으로 재개한다. 해제, STOP, pointer cancel, 화면 이탈은 자동 재개를 취소한다.\n재시작한 서버는 이전 브라우저 lease를 복원하지 않으며 눌림 없는 자동 ENABLE은 하지 않는다.\n\n임시 전후진 및 회전 모드는 `--token-file`과 같은 디렉터리의 `teleop-motion.json`에\n`{\"forward_only\": true}`를 저장하고 조종 서버를 재시작하면 적용된다. 파일이 없으면\n기존 전체 방향 모드다. 복원하려면 값을 false로 바꾸고 조종 서버를 재시작한다.\n이 모드에서는 UI의 횡이동 입력을 숨기고 이동 스틱은 전후 축만 사용한다. 회전 스틱과 a/d 키는 유지한다.\n서버도 횡이동과 대각이동 명령을 거부하므로 이전 UI에서도 제한이 적용된다.\n기존 설정 키 이름 `forward_only`는 유지하며 회전은 허용한다.\n`GET /api/status`의 `forward_only`가 적용 상태를 나타낸다. STOP, 입력 만료와\n기존 구동 허가 검증은 유지하며, 이 설정은 base driver나 다른 제어기를 변경하지 않는다.\n\n| HTTP | 계약 |\n|---|---|\n| `GET /`와 `/assets/` | 설치된 shadcn UI. 자산 디렉터리 밖의 파일은 제공하지 않음 |\n| `GET /api/status` | `X-Control-Token` 필수. 목표, 측정 속도, PWM, 진단과 최근 정지 사유 |\n| `POST /api/control` | token과 동일 Origin, `ui_version=2`, client와 증가하는 sequence 필요 |\n| `GET /api/mapping/status` | token 필수. 매핑 상태 조회 |\n| `POST /api/reset` | token과 동일 Origin, `request_id` 필요. 202는 접수이며 running이 완료 |\n\n키는 `#token=...`에서 읽고 저장하지 않는다. STOP 요청도 인증하며, stale request의 409를\n최신 통신 단절과 구분한다. 초기화 응답이 지연되면 같은 request_id로 재시도한다.\n\n`commission_wheels`는 기존 protocol-v2 독립 시험 CLI다. base driver와 함께 실행하지 않는다.\n운영 launch와 휴대폰 조종은 이 경로를 사용하지 않는다. MCU 펌웨어는 이 패키지가 변경하지 않는다.\n\n## 진단 상태와 이벤트 기록\n\n`GET /api/mapping/status`는 마지막 ROS heartbeat의 `status_age_ms`와 `connected`를 제공한다.\n수신 간격이 `--mapping-status-timeout`(기본 1초)을 넘으면 `phase=unavailable`을 반환한다.\n마지막 세션 경로와 식별자는 유지하며 이전 단계는 `last_phase`에서 확인한다.\nHTTP 연결이 유지되는 것만으로 매핑 관리자가 정상이라고 판단하지 않는다.\n\n`GET /api/status`의 `permission`은 현재 권한 요청의 단계, client, request_sequence와\n응답 boot_id, command_sequence를 제공한다. `last_permission_error`는 마지막 RPC 거절 또는\n예외의 code, reason, exception_type과 traceback을 다음 요청 이후에도 보존한다. MCU ACK 대기와\nboot 불일치는 각각 `mcu_ack_pending`, `mcu_boot_mismatch`로 구분한다.\n\n조종 상태 전환과 정지 사건은 JSON Lines로 기록한다. 각 행에는 UTC, 단조 시각 `at`,\n실행별 `run_id`, 증가하는 `event_id`, PID와 관련 요청 정보가 포함된다. 파일 쓰기는\n별도 스레드가 처리하며 큐가 차거나 저장에 실패해도 조종 루프를 기다리게 하지 않는다.\nAPI의 `event_log`에서 경로, 저장 수, 누락 수와 마지막 저장 오류를 확인한다.\n`event_sink_error`는 이벤트 전달 자체의 예외를 나타낸다.\n\n직접 실행 시 `--event-log`의 기본값은 `~/.local/state/cleany/teleop/events.jsonl`이다.\n통합 launch는 state_root의 `teleop-events.jsonl`을 사용한다. 파일은 기본 2 MB마다 회전하며\n백업 3개를 유지한다. 크기와 개수는 `--event-log-max-bytes`, `--event-log-backups`로 바꾼다.\n기록은 장기 보관을 보장하지 않으며 강제 종료, 디스크 장애나 큐 포화 시 누락될 수 있다.\n\n## 지도 클릭 주행 (명시적 선택)\n\n`phone_remote --navigation`은 `/motion/cmd_vel`로 선택된 속도를 보내며 기존 안전 체인의 최종 `/cmd_vel`을 사용한다. 일반 조종 실행은 변경하지 않는다. `GET /api/navigation/map`, `GET /api/navigation/status`는 토큰으로 보호된 지도/상태 조회다. `POST /api/navigation/{initial-pose,goal,cancel,heartbeat}`는 기존 Origin/토큰 검증을 사용한다. goal은 map_id, x/y(m), yaw(rad), request_id를 받는다. 초기 위치는 정지 상태에서만 설정하며, goal은 Supervisor NAVIGATION 허가, fresh map TF/scan, 안전 입력 subscriber와 단일 최종 출력 publisher를 요구한다. 수락된 자동 목표는 화면 잠금·앱 전환과 무관하게 로봇 쪽 Supervisor와 센서 감시 아래 계속 실행된다. 수동 조종의 입력 만료와 화면 이탈 정지는 유지한다.\n\n센서 갱신 지연으로 자동 목표가 취소되면 상태 응답의 `last_input_failure`와 event log의 `navigation_input_failure`에 입력별 수신 나이를 기록한다. 정지 완료 후에도 구체적인 취소 사유를 유지한다.\n\n하드웨어 실행의 `phone_motion_profile=omni`는 상태의 `forward_only=false`와 Omni MPPI를 함께 선택한다. 수동 조이스틱과 자동 주행 모두 body frame의 +Y 좌측 이동을 허용하며, 전후·횡이동·회전이 섞인 자동 명령은 네 휠의 최대 절댓값을 기준으로 같은 비율로 제한한다. `longitudinal`은 기존 횡이동 차단을 유지한다.\n\n실물 자동 주행은 아직 별도 통합 검증이 필요하다. 플러그인 로딩이나 mock 테스트만으로 실물 구동이 검증됐다고 해석하지 않는다.\n\nROS 연결: `/map` (OccupancyGrid, transient-local), `/plan` (Path), `/scan` (LaserScan), `/odom` (Odometry), `/nav2/cmd_vel` (Twist)을 구독한다. `/initialpose`를 발행하며, 자동 주행은 `navigate_to_pose` Action과 기존 Supervisor NAVIGATION lease를 사용한다. `navigation/stop` (StopMission Action)은 소유 session의 epoch/lease를 검증하고 MCU STOP 확인 뒤에만 성공한다. 일반 조종과 자동 주행은 같은 DriverControl을 사용한다.\n\n재기동 직후 목표가 없는 idle bridge는 현재 Supervisor epoch의 이전 lease 정지 요청도\n수락한다. 새 목표나 구동 허가를 만들지 않고 STOP을 요청하며, 신선한 MCU ACK,\n측정 휠 속도 0.05rad/s 미만, 출력 정지와 진행 중인 목표 전송/취소 완료를 확인한\n뒤에만 stopped를 반환한다. 다른 epoch나 새 목표 실행 중의 무관한 lease는 거부한다.\n기동 직후 STOP 응답의 MCU boot_id가 아직 0이면 실제 피드백을 받은 뒤 새 STOP을\n요청한다. boot_id 0 응답을 정지 ACK로 인정하거나 복구를 위해 ENABLE하지 않는다.\n\n`localization/status`(std_msgs/String)를 구독해 지도 정합과 위치 복구 상태를\n`/api/navigation/status`의 `localization`에 포함한다. Supervisor가 정합 미확인으로\nNAVIGATION을 거부하면 화면에 그 원인을 표시한다. 수동 조종과 초기 위치 지정은\n가능하지만 자동 목표는 새 위치 정합과 새 Supervisor 허가가 확인돼야 수락한다.\n\nLiDAR 전용 시연에서 자동 intent는 `/motion/cmd_vel` → Collision Monitor → `/navigation/safe_cmd_vel`로 흐른다. `phone_remote`가 소유 자동 goal과 구동 상태를 확인해 최종 `/cmd_vel`로 전달한다. 수동 조작은 기존 operator-controlled 경로를 유지하고 자동 goal 취소·정지 확인 후에만 전환한다. 최종 `/cmd_vel` 발행자는 하나다.\n\nNav2 전역 계획 `/plan` (`nav_msgs/Path`, reliable/volatile)을 map 좌표의 파란 선으로 표시한다. 준비 중과 대기 중 계산된 경로도 수신한다. 다른 frame 또는 non-finite 점은 무시하고, 빈 경로·지도 변경·새 목표·취소는 기존 경로를 지운다. 상태 API는 `global_path_topic`, `global_path_points`, `global_path_age_s`를 함께 제공한다. 화면에서 경로 표시를 켜고 끌 수 있으며 계획이 없으면 “경로 생성 대기”로 표시한다.\n\n`POST /api/navigation/preview`는 map_id, x/y(m), yaw(rad), request_id를 받아 `ComputePathToPose`만 호출한다. Supervisor lease 취득, base ENABLE, 속도 발행은 하지 않는다. 상태 API의 `preview_request_id`, `preview_phase`, `preview_path`, `preview_error`, `preview_target`(반환 경로 끝점의 x/y/yaw)로 결과를 제공한다. 화면은 미리보기 완료 시 빨간 목표를 반환 끝점으로 갱신하고 이 자세를 이동 요청에 사용한다. 순정 Lattice의 격자/방향 양자화 결과를 사용자가 이동 전에 확인하며, 도착 판정의 3cm/0.1rad 허용오차는 그대로 유지한다. 초기 위치 설정은 이 변환을 사용하지 않는다. 목적지 변경, 지도 변경, 취소와 실제 이동 시작은 이전 미리보기를 무효화한다. 늦은 응답은 요청 generation으로 배제한다.\n\n휴대폰의 HTTP LAN 접속에서도 목적지 선택과 이동 요청을 지원한다. 요청 식별자는 secure context 전용 API에 의존하지 않는다.\n\n`config/phone_navigation.yaml`의 `navigation.max_wheel_rad_s`는 자동 intent의 최종\n휠 상한이다. 현재 10rad/s이며 혼합 명령도 같은 비율로 축소해 드라이버 구동 범위에\n맞춘다. Omni의 주행 속도는 MPPI의 병진 합성 0.5m/s와 회전 0.7rad/s가 결정한다.\n뒤의 `phone_collision_monitor`는 주황 영역에서 병진 0.16m/s와 회전 0.3rad/s를\n적용한다. 작은 명령을 상한까지 키우지 않는다.\n\n조종 UI의 `/` 응답은 요청마다 현재 `index.html`을 읽는다. 서버가 실행된 동안\nUI를 다시 빌드해 해시가 포함된 asset 이름이 바뀌어도 이전 HTML을 계속 제공하지 않는다.\n파일 교체 중 entrypoint가 없으면 503을 반환하며, UI와 asset 응답은 `no-store` 정책을 유지한다.\n"},"ros2_ws/src/cleany_tof/docs/interfaces.md":{"title":"ToF 근접 감지와 책상 접근","body":"# ToF 근접 감지와 책상 접근\n\nToF는 유효한 거리 return으로 근거리 장애물을 보완 감지하고 책상 전면까지의 거리와\n방향을 측정한다. 정상 `NO_RETURN`은 장애물 미검출이며 주행 차단 사유가 아니다.\n모든 Zone의 유효성이나 RGB-D free-space 증명을 요구하지 않는다. 미검출이 실제 빈\n공간을 보장하지는 않으며 ToF와 다른 센서가 같은 장애물을 모두 놓칠 수 있다.\n\n## 명령 경로와 책임\n\n```mermaid\nflowchart TD\n  Input[\"Nav2 / 공식 teleop\"] --> Select[\"desk_approach / 명령 선택\"]\n  Select --> Existing[\"기존 pan / Collision Monitor / voxel · reactive guard\"]\n  Existing --> Guard[\"proximity_guard\"]\n  Guard --> Base[\"cmd_vel → Base driver → MCU\"]\n  USB[\"USB JSONL\"] --> Driver[\"tof_driver / tof/frame\"]\n  Driver --> Obs[\"공통 Observation\"]\n  Obs --> Guard\n  Obs --> Select\n  Mission[\"Mission / staging · 정지 확인\"] -->|\"desk/approach\"| Select\n```\n\n기존 LiDAR, RGB-D와 Nav2 Collision Monitor의 보호, 최종 속도 경계와 모터 watchdog을\n유지한다. ToF 미검출을 costmap clearing ray로 발행하지 않는다. 기존 head-pan\n`depth_coverage` observer는 원래 설정과 책임을 유지하며 ToF에 의존하지 않는다.\nToF 전용 `tof/depth_coverage`, 모델 hash와 sweep proof 경로는 제거했다.\n\n드라이버는 통신과 센서 세션을, guard는 순간 속도 제한을, approach는 명령 선택과\n접근 Action을 소유한다. Supervisor는 가용성, Fault, lease와 Mission stop을 관리한다.\n정상 미검출과 실제 장애물에 따른 정지는 System Fault가 아니다. `tof_required=true`는\n`tof_proximity`를 기존 `BASE_MOTION`의 필수 가용성 근거에 추가한다. 센서 복구만으로\nMission을 자동 재개하지 않는다.\n\n## 측정과 장애 구분\n\n| 상태 | 조건 | 근접 감지와 평면 처리 |\n|---|---|---|\n| `RANGE` | count>0, status5/9, firmware valid=true, 유한 양수 거리와 허용 sigma | ROI 안의 실제 거리점으로 사용 |\n| `NO_RETURN` | count=0, target_status255, valid=false | 정상 미검출. 잔여 거리/sigma 슬롯은 사용하지 않음 |\n| `UNRELIABLE` | 불량 품질, 허용하지 않은 상태, 범위 위반 또는 불일치 | 해당 Zone 제외. 다른 Zone까지 무효화하지 않음 |\n| `NOT_UPDATED` | target_status0 | 해당 Zone 제외 |\n| 세션/입력 불가용 | sensor_ready=false, 통신/형식 오류, stale frame/odom, 전부 불신뢰/미갱신 | zero와 가용성 철회 |\n\n전체 Zone이 NO_RETURN이어도 정상 관측이다. 전부 품질 불량인 frame은 미검출과 구별해\n사용 불가능으로 처리한다. 개별 불량 Zone은 무시하므로 해당 방향의 검출 능력은 줄어든다.\n`ComponentHealth`는 입력과 guard의 가용성이지 공간 전체의 안전 증명이 아니다.\n\nfirmware의 valid(status5/9) 의미는 바꾸지 않는다. Zone target_status255와 firmware\n오류 event status255는 별개다. 후자는 sensor_ready를 즉시 false로 발행하고 세션을\n닫는다. 통신 순서, backlog, acquisition 추정과 재연결 검사를 유지한다. 연결 시\n`stop` 확인 후 `cnh off`, `config 64 15 400000`, `start`를 사용한다. 부분 read를 누적하며\n재부팅 기본 10Hz frame은 주행 입력으로 수락하지 않는다. read 완료에서 read 시간과\n한 주기를 빼 stamp를 추정하므로 첫 frame부터 존재한 일정 USB 지연은 실측이 필요하다.\n\n## ROI 장애물 필터와 속도 제한\n\n`guard_rows`와 `guard_columns`는 native 8×8 인덱스의 감시 ROI다. 기본은 전체 Zone이며\n장착 후 바닥, 로봇 몸체와 필요한 보호 높이를 보고 조정한다. flip과 extrinsic은 거리\n투영에 적용한다. 센서 +x는 전방, +y는 영상 왼쪽, +z는 위쪽이다. 별도 TF를 발행하지 않는다.\n\n거리 임계값은 raw sensor range가 아니라 직사각형 footprint까지의 평면 거리에서\n`margin + 3*max_sigma_m`를 뺀 clearance다. 높이는 ROI로 선택하며 3D 몸체 충돌 모델을\n새로 만들지 않는다. 다음 값은 미장착 상태의 조정 가능한 초기 후보다.\n\n| 설정 | 기본 후보 | 의미 |\n|---|---|---|\n| `obstacle_clearance_m` | 0.75m | 일반 장애물 검출 범위 |\n| `min_cluster_zones` / `cluster_distance_m` | 2 / 0.20m | 상하좌우 인접하고 실제 점 간 거리도 가까운 cluster |\n| `confirm_s` | 0.12s | 같은 Zone의 공간 support 지속 시간, 15Hz에서 보통 3 frames |\n| `emergency_clearance_m` | 0.03m | 유효한 단일 Zone도 첫 frame부터 정지 |\n| `hysteresis_m` / `release_s` | 0.05m / 0.20s | 검출 해제 거리와 시간 여유 |\n| `max_speed` / `max_yaw_rate` | 0.25m/s / 0.3rad/s | 최종 명령 상한 |\n\nguard의 30Hz timer가 같은 frame을 여러 번 확인한 것으로 세지 않는다. 수신한 새\nframe마다 monotonic 시각으로 갱신하며 긴 입력 공백, 시간 역행 또는 불가용 입력이면\n필터 이력을 폐기한다. 서로 떨어진 cluster나 반복 flash가 같은 Zone에서 지속된 것으로\n누적되지 않는다. 확인된 Zone은 해제 거리 이내의 유효 return이 남으면 유지된다.\n\n일부 확인된 Zone이 미검출되면 남은 실제 거리점을 계속 사용한다. 확인된 거리점이 모두\n미검출되거나 해제 거리 바깥으로 사라지면 최대 release_s 동안\n`OBSTACLE_HOLD`로 정지한다. 이동한 base frame에서 이전 점을 재사용하지 않는다.\n비상 정지는 emergency_clearance+hysteresis 안의 return이 사라진 후 release_s 뒤 해제한다.\n미검출만 있는 초기/정상 frame은 이 정지 이력을 새로 만들지 않는다.\n\n확정된 거리점에 명령과 실제 odom의 접근 속도를 검사한다. x/y 중 접근하는 성분이\n있으면 병진 norm을, 회전에는 footprint 외접반경을 사용한다. 허용 속도는 다음 식으로\n구하고 x/y/yaw 전체를 같은 비율로 줄인다. 이미 실제 속도가 envelope를 넘으면 zero다.\n\n```text\nclearance >= closing_speed * (reaction_s + confirm_s + sample_age)\n             + closing_speed^2 / (2 * deceleration)\n```\n\n`PROXIMITY_STOP`, `BRAKING_ENVELOPE`, `OBSTACLE_HOLD`는 장애물 대응이다. `LIMITED`는\n감속, `CLEAR`는 검출에 의한 추가 제한 없음이다. 센서/odom/명령 지연, 미보정,\nSupervisor 상실과 명령 graph 충돌은 별도의 정지 사유다. 매우 가까운 return과 해제\nhold는 이동 방향에 관계없이 정지한다. 그 외에는 멀어지는 방향을 허용한다.\n\n일반 검출의 지연, ROI 밖 물체, 기준보다 작은 cluster와 불량 return은 놓칠 수 있다.\n제동 식에 confirm_s를 포함해도 그 지연과 센서 관측 한계의 물리 안전성을 보장하지 않는다.\n\n## 책상 접근\n\nNav2 staging와 실제 정지 확인 후 `DeskApproach`를 요청한다. `approach_rows`(기본2–5)와\n`approach_columns`(기본0–7)의 RANGE만 사용한다. 미검출/불량 Zone은 보간하지 않는다.\n각 `min_plane_rows=2`개 이상의 실제 sample이 있는 `min_plane_columns=4`개 이상의\ncolumns와 `min_plane_span_m=0.15m` 폭을 요구한다. column median으로\n`x=distance+slope*y`를 fit하고 전체 선택 sample의 residual와 yaw 한계를 검사한다.\n일부 불량 Zone만으로 실패하지 않지만 실제 support가 적거나 전면이 모호하면 시작을\n거부하거나 진행 중 zero를 내고 abort한다. 미검출만으로 책상이나 도착을 추정하지 않는다.\n\n정렬 후 최대0.04m/s, 0.08rad/s로 접근한다. 목표는 base_link 원점에서 평면 y=0 교점까지의\n거리이며 범퍼 gap이 아니다. 좌우 중심은 staging pose에 의존한다. 목표 오차 내 실제\nodom 정지가 settle_s=0.6초 유지되어야 성공한다. Mission도 정지 feedback을 확인한다.\n취소, timeout, overshoot, no progress, Nav2 동시 goal, 센서/평면 소실과 lease 회수는\n성공이 아니다. 서버는 기존 Mission lease의 epoch/version/lifetime만 검증하며 신규\n권한을 발급하거나 연장하지 않는다. 재시작 journal의 해당 Action goal만 취소한다.\n\n## ROS endpoint와 배포\n\n| 노드 | 기본 endpoint | 타입과 조건 |\n|---|---|---|\n| tof_driver | 발행 `tof/frame` | TofFrame, R1, sensor_ready, 64 native Zone, tof_link, 거리/sigma m, 15Hz |\n| guard / approach | 구독 `tof/frame`, `odom` | TofFrame R1 / Odometry Sensor, ROS와 monotonic freshness |\n| proximity_guard | 구독 `proximity/input`, 발행 `cmd_vel` | Twist R1, 출력30Hz steady timer |\n| proximity_guard | 발행 `proximity/status` | String R1, 제한/정지 사유 |\n| proximity_guard | 발행 `system/component_health` | ComponentHealth R10, source=tof_proximity, 분류 개수와 pending/obstacle/emergency/held |\n| desk_approach | 구독 `nav2/cmd_vel`, 발행 `motion/cmd_vel` | Twist R1, 단일 명령 선택 |\n| desk_approach | 구독 `navigate_to_pose/_action/status` | GoalStatusArray, Action status QoS |\n| guard / approach | 구독 `system/heartbeat`, `system/state` | 기존 메시지, R1 / R/T1, 시각과 epoch 검사 |\n| desk_approach | 제공 `desk/approach` | DeskApproach Action, 기존 lease 식별자, feedback/result/cancel |\n\n두 제어 노드에 동일한 ToF YAML을 적용하고 Mission과 기존 안전 경로의 canonical odom도\n일치시킨다. navigation의 tof_enabled, Supervisor의 tof_required, Mission의\ndesk_approach_enabled는 별도 옵션이다. 기본은 opt-in과 calibrated=false다.\n예전 min_valid/required_zones, no_return_max_*와 ToF coverage proof 설정은 제거한다.\nTofFrame의 sensor_ready 계약은 유지되므로 외부 publisher도 정상 frame에 true를 설정한다.\n\n아직 센서는 로봇에 미장착이다. FOV/extrinsic/ROI, 표면/조명별 검출, 실제 지연과 제동,\n필터 오탐/미탐, 접근 정확도와 독립 정지를 장착 후 측정해야 한다. 기존 독립 안전 장치를\n활성 상태로 유지하고 후보 설정을 물리 안전 검증 결과로 해석하지 않는다.\n"},"tools/odometry_evaluation/README.md":{"title":"Holonomic Odometry Evaluation (실물 바닥 오도메트리 검증)","body":"# Holonomic Odometry Evaluation (실물 바닥 오도메트리 검증)\n\n메카넘 4륜 홀로노믹 베이스의 실물 바닥 주행 시 누적 휠 오도메트리 오차를 정량 계측·검증하는 도구입니다.\n\n- **속도 기준**: 설정 상한 최고 속도 ($v_x = 0.5\\text{ m/s}, v_y = 0.5\\text{ m/s}, \\omega_z = 1.0\\text{ rad/s}$)\n- **작업 공간 한계**: 시작 원점 기준 최대 변위 $\\le 3.0\\text{ m}$\n- **기준점 방식**: 바닥 마킹 테이프(십자선 및 정렬 기준선)를 이용한 폐루프 복귀 잔류 오차 계측\n- **실행 환경**: `distrobox` (`ros2-humble`) 자동 전환 지원\n\n---\n\n## 1. 사전 준비 및 바닥 마킹\n\n1. **테스트 영역 확보**: 최소 $3.5\\text{ m} \\times 3.5\\text{ m}$ 이상의 평탄하고 장애물이 없는 바닥 구역을 확보합니다.\n2. **원점 마킹 (출발점)**:\n   - 바닥에 마스킹 테이프로 십자(+) 선을 부착합니다.\n   - 로봇의 외곽 기준점(예: 범퍼 중앙 또는 휠 접지점 모서리)이 십자선 교차점과 정렬되도록 표시합니다.\n3. **편도 기준 마킹 (선택)**:\n   - 직진 2.5m 지점 및 횡이동 2.0m 지점에 보조 테이프를 부착하면 편도 도달 시의 스케일 오차도 함께 관측할 수 있습니다.\n4. **안전 장치**: 물리적 Emergency Stop 스위치를 즉시 조작할 수 있도록 준비합니다.\n\n---\n\n## 2. 노드 기동\n\n실물 로봇 및 Micro-ROS Agent가 기동되어 있어야 합니다.\n\n```bash\n# 터미널 1: Micro-ROS Agent (DDS domain 0)\nsource /opt/ros/humble/setup.bash\nsource esp32/micro_ros/agent/install/local_setup.bash\nexport ROS_DOMAIN_ID=0\nros2 run micro_ros_agent micro_ros_agent serial --dev \"$CLEANY_ESP_PORT\" -b 115200\n\n# 터미널 2: Base Driver & Odometry Node\nsource /opt/ros/humble/setup.bash\nsource ros2_ws/install/setup.bash\nexport ROS_DOMAIN_ID=0\nros2 launch cleany_base_driver base_driver.launch.py \\\n  mock:=false config:=\"$(pwd)/ros2_ws/src/cleany_base_driver/config/base_hardware.yaml\"\n```\n\n---\n\n## 3. 평가 스크립트 실행\n\n호스트 또는 컨테이너 내부에서 [run_eval.sh](run_eval.sh)를 실행할 수 있습니다.\nUbuntu 22.04가 아닌 호스트에서는 `ros2-humble` Distrobox로 진입합니다.\n\n### 3.1 드라이 런 (궤적 검증)\n```bash\n# X축 직진 왕복 (기본 2.5m)\nbash tools/odometry_evaluation/run_eval.sh --pattern surge --dry-run\n\n# 횡이동 왕복 (기본 2.0m)\nbash tools/odometry_evaluation/run_eval.sh --pattern sway --dry-run\n\n# 사각 폐루프 (기본 2.0m x 2.0m)\nbash tools/odometry_evaluation/run_eval.sh --pattern box --dry-run\n```\n\n### 3.2 실물 검증 주행\n\n#### 패턴 1: X축 전후진 왕복 (Surge)\n```bash\nbash tools/odometry_evaluation/run_eval.sh --pattern surge --distance 2.5\n```\n- 동작: $+X$ 방향으로 2.5m 전진 ($0.5\\text{ m/s}$) $\\to$ 2초 정지 $\\to$ $-X$ 방향으로 2.5m 후진하여 원점 복귀.\n- 검증: 바퀴 반경($r$) 오차 및 전후 가감속 슬립.\n\n#### 패턴 2: Y축 횡이동 왕복 (Sway)\n```bash\nbash tools/odometry_evaluation/run_eval.sh --pattern sway --distance 2.0\n```\n- 동작: $+Y$ 방향(좌측)으로 2.0m 이동 ($0.5\\text{ m/s}$) $\\to$ 2초 정지 $\\to$ $-Y$ 방향(우측)으로 2.0m 이동하여 원점 복귀.\n- 검증: 메카넘 45° 롤러의 고유 횡슬립 계측.\n\n#### 패턴 3: 제자리 순수 회전 (Yaw)\n```bash\nbash tools/odometry_evaluation/run_eval.sh --pattern yaw --turns 2.0\n```\n- 동작: 제자리 좌회전 2바퀴($720^\\circ$, $1.0\\text{ rad/s}$) $\\to$ 2초 정지 $\\to$ 우회전 2바퀴 복귀.\n- 검증: 휠베이스·트랙폭 기구학 계수 $\\frac{L+W}{2}$ 및 회전 마찰 슬립.\n\n#### 패턴 4: 사각 폐루프 주행 (Holonomic Box)\n```bash\nbash tools/odometry_evaluation/run_eval.sh --pattern box --distance 2.0\n```\n- 동작: 회전 없이 전진 2m $\\to$ 좌측 2m $\\to$ 후진 2m $\\to$ 우측 2m 이동 (대각 최대 반경 $2.828\\text{ m} \\le 3.0\\text{ m}$).\n- 검증: 4개 휠의 복합 주행 후 최종 2D 위치 드리프트 누적치 계측.\n\n#### 단방향 원위치 복귀 (Return X / Return Y)\n- `--pattern return_x --distance \u003cm>`: 직진 후 원점으로 복귀\n- `--pattern return_y --distance \u003cm>`: 횡이동 후 원점으로 복귀\n\n---\n\n## 4. Ground-Truth 계측 방식 (LiDAR ICP vs 바닥 테이프 수동 측정)\n\n### 4.1 2D LiDAR ICP 자동 계측 (기본 활성화)\nRPLIDAR A1 또는 호환 2D LiDAR이 `/scan`을 발행하면 출발 전 기준 스캔과\n복귀 후 스캔을 Point-to-Line ICP로 정합하여 상대 변위를 추정합니다.\nRMSE, 인라이어 비율과 관측성 판정을 통과한 결과만 유효한 계측으로 사용합니다.\n\n- **원리**: 실내 벽면 및 고정 구조물을 기준으로 360° 포인트 클라우드를 다중 버스트(1초) 수집 후 최적 강체 변환 $(\\Delta x, \\Delta y, \\Delta \\theta)$를 계산.\n- **신뢰성 지표**: RMSE (잔차 표준편차), 인라이어 비율(Inlier Ratio), 헤시안 조건수(Condition Number)를 자동 계산하여 신뢰도 평가.\n- **결과 플롯**: 평가 JSON과 같은 이름의 `.png`에 스캔 오버레이 및 ICP 결과 저장.\n- **비활성화 옵션**: LiDAR가 없거나 수동 마킹 테이프 입력이 필요한 경우 `--no-lidar` 플래그를 전달합니다.\n\n#### ICP 수렴과 관측성\n\n`lidar_scan_matcher.py`는 `p_ref = R(yaw) p_target + t`와 일치하는 additive\npose Jacobian을 사용합니다. 최종 30 mm inlier에서 같은 robust Jacobian으로\n병진·전체 SE(2) 관측성을 다시 계산합니다.\n\n수렴은 correspondence 거리의 annealing이 40 mm 최종 단계에 도달한 뒤만\n판정합니다. 병진 `1e-5 m`와 회전 `1e-5 rad`의 strict step 조건을 각각 확인하며,\n작은 반복 진동은 다음 조건을 모두 만족할 때 별도로 종료합니다.\n\n- 주기 2~6의 pose가 세 주기 연속 반복.\n- 대응하는 모든 pose 쌍이 strict 병진·회전 공차 안에서 일치.\n- 전체 반복 구간의 pose 간 최대 차이가 1 mm·0.02° 이하.\n\n반환값은 마지막 pose이며, 평균 pose나 odometry 값으로 대체하지 않습니다.\n수렴 후에도 inlier·RMSE·관측성 검사를 통과해야 유효합니다.\n`ScanMatchResult`는 `convergence_reason`(`step_tolerance`, `bounded_cycle` 등),\n마지막 보정량과 적용한 `convergence_settings`를 기록합니다.\n`LidarScanMatcher(convergence_config=...)`로 병진·회전 strict 공차,\n최대 반복 진동 폭과 주기를 각각 설정합니다.\n\n#### 저장 스캔 재검증\n\n`replay_scan_matches.py`는 저장된 `response_summary.json`과 NPZ만 읽어\noutbound·inbound·직접 loop 정합을 다시 계산합니다. ROS나 장치를 사용하지\n않습니다. 저장된 extrinsic과 odometry로 laser-axis 초기값을 재구성하며,\nloop 초기값은 두 편도의 SE(2) 합성으로 계산합니다.\n\n```bash\n# 레포 루트, Ubuntu 22.04 외 호스트의 Distrobox 환경\ndistrobox enter --name ros2-humble --no-tty --clean-path -- \\\n  env PYTHONNOUSERSITE=1 /usr/bin/python3 \\\n  tools/odometry_evaluation/replay_scan_matches.py \\\n  artifacts/odometry_evaluation/all_axis_validation/*/response_summary.json \\\n  --min-inlier-ratio .30 \\\n  --output artifacts/odometry_evaluation/icp_replay_new.json\n```\n\n`--min-inlier-ratio`를 생략하면 각 원본 결과의 적용값(없으면 40%)을 사용합니다.\n새 JSON에는 기존·새 품질 판정, 수렴 사유, 적용 설정, pose 변화량과 회귀 건수를\n기록합니다. 원본을 수정하지 않으며 기존 출력 파일도 덮어쓰지 않습니다.\nPose 변화량은 알고리즘 간 차이이며 실제 위치 오차가 아닙니다.\n\n2026-10-21 저장 정합 87건을 inlier 하한 30%로 재검증한 결과, 기존 유효 79건을\n모두 유지하고 기존 무효 8건 중 7건이 유효해졌습니다. 이 중 4건은 미수렴\n수정, 3건은 40%→30% 하한 변경에 해당합니다. Inlier 25.6%인 1건은 계속\n거부했습니다. 기존 유효 정합의 최대 pose 변화는 병진 2.45 mm·yaw 0.029° 미만입니다.\n원본과 상세 비교는 Git 제외 경로\n`artifacts/odometry_evaluation/icp_regression/20261021_bounded_cycle/`에 있습니다.\n\n### 4.2 바닥 마킹 테이프 수동 입력 (Fallback 또는 `--no-lidar`)\nLiDAR를 사용하지 않거나 ICP가 거부되면 명시적인 수동 측정이 필요합니다.\n`--manual-fallback`을 지정하면 바닥 테이프 기준의 측정치를 프롬프트로 입력받습니다.\n빈 입력을 0으로 간주하지 않습니다.\n\n```text\nEnter physical X error relative to tape mark in mm (forward/overshoot + / undershoot -):\nEnter physical Y error relative to tape mark in mm (left + / right -):\nEnter physical Yaw error relative to tape mark in deg (CCW + / CW -):\n```\n\n입력 또는 LiDAR 추정 완료 시 요약 분석표가 출력되며, `artifacts/odometry_evaluation/odom_eval_\u003cpattern>_\u003ctimestamp>.json`에 상세 기록이 저장됩니다.\n\n`--tape-error-x`, `--tape-error-y`, `--tape-error-yaw`를 모두 지정해 직접\n측정값을 전달할 수도 있습니다. 유효한 ICP나 완전한 수동 측정이 없으면\n성공으로 처리하지 않습니다. 시작·종료 스캔은 같은 이름의 `_start.npz`,\n`_end.npz`로 저장하며, 기존 평가 JSON을 덮어쓰지 않습니다.\n\n## 5. 제어 설정과 보조 도구\n\n- `motion_settings.json`: 병진·yaw P 이득, 허용오차, 감속 및 정지 설정.\n  순수 X/Y는 `linear_x_kp`, `linear_y_kp`를 사용하고, 생략하면 `linear_kp`를\n  사용합니다. 대각선 병진은 `linear_kp`, 회전은 `yaw_kp`를 사용합니다.\n  `--motion-config`로 다른 JSON을 지정합니다. 현재 기본값의\n  `candidate_settings: true`는 실물 재검증 대상임을 나타냅니다.\n  현재 X/Y/yaw와 대각선 P는 모두 6.0입니다. 이 P 제어는 각 시험 구간의\n  거리·각도 정지를 위한 일시적인 평가 제어입니다. 휠 odom의 기구학 보정\n  계수나 상시 주행 controller 설정으로 사용하지 않습니다.\n- `motion_control.py`, `motion_runtime.py`: 평가와 휠 진단의 공통 주행 경로.\n  stale·역행·중복 stamp 또는 비정상 odometry는 STOP과 disable을 요청하며,\n  안전 중단 후 같은 실행에서 주행을 재개하지 않습니다.\n- `run_oneway_eval.py`: 편도 이동의 목표 정지 잔차와\n  `odom − LiDAR` 추정 오차를 분리합니다. `--extrinsic-config`의 평면 보정값을\n  ICP 초기 추정과 결과 변환에 함께 사용하며, `--odom-topic`으로 평가할\n  odometry 입력을 선택합니다.\n- `run_wheel_only_eval.sh`, `run_wheel_only_eval.py`: ROS 환경을 준비하고\n  Agent·base driver·LiDAR를 준비한 뒤 config 기반 편도 평가를 반복합니다.\n  준비 실패·주행 실패·중단 시 후속 반복을 시작하지 않습니다.\n- `run_multi_speed_eval.py`: 속도별 반복 평가와 비교 플롯.\n- `tune_yaw_p.py`: yaw P 후보별 스텝 응답 및 정착·오버슛 분석.\n- `run_motion_response.sh`, `run_motion_response.py`: 현재 편도 평가 제어기를\n  그대로 사용하는 X/Y/yaw 실물 P 응답 측정. 기존 `tune_yaw_p.py`의 독립 제어기나\n  합성 응답이 아닌 실제 wheel odom trace를 저장합니다.\n- `capture_preflight.py`: 정지 상태 odometry·WheelState·스캔 점검.\n- [휠 진단](../wheel_calibration/README.md): 정상상태 휠 속도·PWM 분석.\n\n주행 도구들은 `/tmp/cleany_odom_eval.lock`으로 중복 실행을 막습니다.\n실제 이동 전 다른 `/cmd_vel` publisher가 있는지도 검사합니다.\n기존 평가의 기본 LiDAR → base 변환은 yaw `-7.85°`, x lever arm `0.029 m`입니다.\n변경된 장착 상태의 편도 평가는 아래처럼 새 보정 파일을 명시적으로 선택합니다.\n`run_eval.sh`와 `run_multi_speed_eval.py`에는 이 선택 옵션이 없으므로,\n아래 재측정에는 config 기반 전용 launcher를 사용합니다.\n측정 결과는 Git 제외 경로인 `artifacts/odometry_evaluation/`에 저장됩니다.\n\n### 속도별 3회 휠 odom 재측정\n\n실험 설정은 [`configs/mission/wheel_odometry_evaluation.json`](../../configs/mission/wheel_odometry_evaluation.json)에\n모읍니다. 기본값은 ±X/±Y와 두 대각선 각각 편도 총거리 0.5 m, ±90° 회전,\n병진 0.20/0.35/0.50 m/s와 회전 0.30/0.60/1.00 rad/s 각각 3회입니다.\n현재 `motion_settings.json`의 X/Y/yaw와 대각선 P=6.0을 사용합니다.\n`--dry-run`에서 패턴 목록, 적용 P와 전체 편도 수를 확인합니다. 긴 거리 실험은 config의\n`translation_distance_m`를 `1.0` 또는 `2.0`으로 바꿉니다.\n\n레포 루트에서 실행합니다. MCU와 LiDAR를 연결하고 시험 공간과 물리 emergency\nstop을 준비합니다. Launcher는 `runtime_config`의 설정으로 필요한 실물 노드를\n자동 기동합니다. 정상 실행 중인 노드는 재사용하며 다른 `/cmd_vel` 명령원이\n있으면 주행 전에 중단합니다.\n기본 config는 명시적으로 `/wheel/odom`을 구독하여 IMU·localization 융합 출력을\n평가 입력으로 사용하지 않습니다. LiDAR ICP는 비교 기준이며 odom에 융합하지 않습니다.\n\n```bash\n# 이동 없이 config 검증과 전체 계획 확인\nbash tools/odometry_evaluation/run_wheel_only_eval.sh --dry-run\n\n# 노드 자동 기동 → 준비 확인 → 기본 config로 실물 반복 실험\nbash tools/odometry_evaluation/run_wheel_only_eval.sh\n\n# 다른 config로 실험\nbash tools/odometry_evaluation/run_wheel_only_eval.sh \\\n  --config configs/mission/wheel_odometry_evaluation.json\n```\n\nUbuntu 22.04 외 호스트에서는 `ros2-humble` Distrobox로 자동 진입하고 ROS overlay를\n적용합니다. 설치된 micro-ROS Agent overlay도 함께 적용합니다.\n별도 터미널에서 노드를 기동하거나 source할 필요가 없습니다.\nConfig의 파일 경로와 `output_dir`는 레포 루트 기준이며, 작업 디렉터리와 무관합니다.\n`--dry-run`은 ROS 노드·주행 프로세스를 실행하거나 결과 디렉터리를 만들지 않습니다.\n\n#### 자동 기동과 준비 확인\n\n[`ros2_ws/src/cleany_base_driver/config/wheel_evaluation_runtime.json`](../../ros2_ws/src/cleany_base_driver/config/wheel_evaluation_runtime.json)에서\nMCU·LiDAR by-id USB 경로, base hardware profile, LiDAR 옵션과 대기 시간을 바꿉니다.\n\n- Agent가 없으면 연결된 MCU에 serial Agent를 시작하고, base driver가 없으면\n  `mock:=false`로 wheel odometry를 함께 시작합니다.\n- LiDAR가 정상 스캔을 발행하면 재사용합니다. USB 재연결 후 스캔이 끊긴 기존\n  프로세스는 같은 사용자·설정된 serial 경로·허용 node 이름까지 식별되는 경우만\n  종료하고 by-id 경로로 다시 시작합니다. 식별되지 않는 프로세스를 임의 종료하거나\n  중복 driver를 추가하지 않습니다.\n- `/base/enable` service와 timestamp가 진행하는 실제 odom·scan·WheelState를\n  확인합니다. MCU가 disabled·fault-free이고 wheel 목표/PWM이 0이며,\n  차체 필터 뒤 외부 환경 반사점이 충분히 수신되어야 주행을 시작합니다.\n- 기본 30초 안에 준비되지 않으면 누락·정체 원인을 기록하고 평가 프로세스를\n  시작하지 않습니다. 자체 기동 프로세스의 로그는 배치 결과 디렉터리에 남깁니다.\n- 완료·실패·Ctrl+C에서는 평가 프로세스의 STOP·disable 정리 후 자체 기동한\n  프로세스만 종료합니다. 재사용한 정상 프로세스는 유지합니다.\n\nMCU에는 micro-ROS **모터 제어 펌웨어**가 실행되어야 합니다.\n독립 IMU 캘리브레이션 펌웨어는 `cleany.imu_calibration/v1` JSON만 응답하며\n`/base/wheel_state`를 발행하지 않습니다. 이 경우 Agent를 켜도 odom은 생성되지\n않습니다. Launcher는 이 누락을 보고하며 펌웨어를 자동으로 덮어쓰지 않습니다.\n모터 펌웨어 복원은 [IMU 진단의 복원 절차](../../esp32/imu_calibration/README.md#hardware-acceptance-and-restoration)를 따릅니다.\n\n한 번의 pattern·speed 실행은 outbound와 inbound 두 편도를 각각 평가합니다.\n전체는 45회 왕복, 90개 편도이며, 이동 실패나 ICP 거부 시 다음 실행으로\n넘어가지 않습니다. 거리의 정지 목표는 wheel odom 기준이고 실제 변위는\nLiDAR ICP로 별도 추정합니다.\n\n`lidar_min_range_m: 0.45`는 이번 장착의 프로파일 반사점(관측 거리 약 0.23~0.39 m)을\n평가용 ICP에서 제외하는 거리 필터입니다. `/scan` 자체나 장애물 회피 입력을\n변경하지 않습니다. 필터 후에도 서로 다른 방향의 고정 구조물이 충분히 보여야 합니다.\n이는 보정용 프로파일 정합과 달리 외부 환경 스캔을 비교하는 주행 평가입니다.\n새 센서 위치에서 필터를 재사용하려면 차체 반사점의 최대 거리를 다시 확인합니다.\n\n보정 파일은 `yaw_deg`, `lever_arm_x_m`, `lever_arm_y_m`의 유한한 수치 세 개를\n필수로 포함하는 JSON입니다. 추가 provenance 필드는 허용합니다. 적용한 보정값과\n파일 식별 정보, odom 입력 및 최소 거리는 개별 결과와 summary에 기록합니다.\n배치 실행은 config·motion·extrinsic 파일을 사전 검증하고 config 사본과 전체 실행\n결과를 `output_dir/batch_\u003c시각>_\u003cpid>/`에 보존합니다. `config_snapshot.json`은\n실험 설정과 원본 파일 식별 정보, `motion_config.json`과 `extrinsic_config.json`은\n각 반복에 적용하는 고정 사본, `batch_summary.json`은 배치 종료 상태입니다.\n각 반복의 측정 결과는 `run_1/`, `run_2/`, `run_3/` 아래에 저장합니다.\n런타임 설정과 hardware profile 사본은 `runtime_config.json`, `base_hardware.yaml`,\n자체 기동 프로세스 로그는 `runtime_logs/agent.log`, `base.log`, `lidar.log`에 저장합니다.\n중단 신호는 실행 중인 주행 프로세스에 전달하여 STOP·disable\n정리를 기다리고 후속 반복을 시작하지 않습니다.\n하위 `run_oneway_eval.py`를 직접 사용할 때 보정 파일을 생략하면 이전 장착의\n기본값을 사용하므로 현재 장착에는 생략하지 않습니다.\n\n### 전 축 P=6 검증 프로토콜\n\n[전 축 검증 프로토콜](VALIDATION_PROTOCOL.md)은 X/Y/yaw와 두 대각선의\n시험 행렬, 파라미터 조정, 준비·중단 절차와 결과 판정을 정리합니다.\n설정 파일은\n[`configs/mission/all_axis_validation.json`](../../configs/mission/all_axis_validation.json)이며\n`run_motion_response.sh`의 기본값입니다. 각 축·속도의 `kp`와 `speed`,\n`repetitions`, 거리·각도 및 `guards`를 한 파일에서 조정합니다.\nP는 각 trial에만 적용하며, 기본 motion 파일에 되쓰지 않습니다.\n\n```bash\n# P=6, 45회 왕복 / 90개 편도 계획 확인. ROS 기동과 이동 없음.\nbash tools/odometry_evaluation/run_motion_response.sh --dry-run\n\n# 시험 준비 확인 후 전체 검증\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/all_axis_validation.json\n```\n\n기본 `require_valid_icp=true`는 외부 비교 거부 시 후속 시험을 중단합니다.\n전 축 preset의 `icp_min_inlier_ratio=0.30`은 최소 inlier 비율 30%를 뜻하며,\n적용값을 결과에 기록합니다. 생략한 config는 40%를 사용합니다.\n제어 응답 완료와 외부 정확도 판정은 별도로 확인합니다.\n\n2026-10-21 수정된 ICP로 **45회 왕복·90개 편도 전체를 완료**했습니다.\n`response_summary.status=success`이며 편도 90개와 직접 loop 45개, 총 135개\n정합이 모두 유효했습니다. 수렴 사유는 `step_tolerance` 133개,\n`bounded_cycle` 2개이며 최대 반복 수는 33회였습니다. 최소 inlier 비율은\n42.78%, 최대 RMSE는 17.21 mm였습니다. 적용한 strict 공차는 병진 `1e-5 m`·\n회전 `1e-5 rad`, cycle 폭은 1 mm·0.02°입니다.\n종료 후 STOP·disable과 자체 기동 프로세스·serial 해제를 확인했습니다.\n전체 기록과 그래프:\n[`20261021_163717/response_summary.json`](../../artifacts/odometry_evaluation/all_axis_validation/20261021_163717/response_summary.json),\n[`response.png`](../../artifacts/odometry_evaluation/all_axis_validation/20261021_163717/response.png).\n\n### X/Y/yaw P 응답 측정과 현재 적용값\n\n실험 config는\n[`configs/mission/motion_response_tuning.json`](../../configs/mission/motion_response_tuning.json)입니다.\n`trials`에 축(`x`, `y`, `yaw`), P 계수와 속도 상한을 지정합니다.\n각 trial은 같은 계수로 정·역방향을 각각 측정합니다. 현재 세션의 범위는 편도\n0.5 m·90° 이하이며, 실물 공간과 비상정지 준비 후 실행합니다.\n\n```bash\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/motion_response_tuning.json --dry-run\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/motion_response_tuning.json\n```\n\n- Agent·base·LiDAR 자동 준비와 실제 데이터 수신 확인 후, disabled 상태에서\n  service handshake를 마칩니다. 150 ms odom watchdog은 유지합니다.\n- `guards`는 세션 시작점 기준 이동 반경, 횡방향 이탈, 병진 중 yaw 변화,\n  이동·회전 과도 변위를 제한하는 **시험용 중단값**입니다.\n- raw trace에는 위치·각도, 오차, 명령 속도와 odom 속도를 기록합니다.\n  정착 진입 시간은 위치와 속도가 모두 허용범위 안에 들어와 이후 유지되는\n  시각입니다. 0.5초 hold 완료 시간, 별도 1.5초 dwell과 구분합니다.\n- `response.png`는 주행 응답이며 종료 후 dwell·스캔 수집 시간은 제외합니다.\n  정·역방향 진행량을 같은 양의 목표로 정규화하고 속도는 크기로 표시합니다.\n- `require_valid_icp` 기본값은 `true`입니다. 제어 응답만 검증하는 세션에서\n  `false`로 설정하면 정상 주행 trace는 유지하되 미수렴 ICP 비교값은 무효로\n  남깁니다. 주행 실패·watchdog·경계 이탈 시에는 항상 후속 시험을 중단합니다.\n  일반 wheel-odom 평가의 ICP 실패 처리와 별개입니다.\n\n2026-10-15 실물 응답 39회 왕복(78개 편도)으로 `motion_settings.json`에\n**X=6.0, Y=6.0, yaw=6.0**을 적용했습니다. X/Y는 1·2·3·4·6,\nyaw는 2·3·4·6을 비교했습니다. 선택 계수의 중·고속 제어 응답은\n정·역방향 각각 최소 3회 검증했습니다.\n\n| 축 | 저속 비교 P | 마지막 20% 구간 평균 시간 |\n|---|---|---|\n| X | 1 → 6 | 마지막 10 cm: 3.289 → 0.690 s |\n| Y | 1 → 6 | 마지막 10 cm: 3.301 → 0.689 s |\n| yaw | 2 → 6 | 마지막 18°: 1.620 → 1.251 s |\n\n선택 계수의 종료 잔차는 wheel odom 기준 병진 3.13~4.63 mm,\nyaw 0.56~0.75°였고 목표 초과는 관측되지 않았습니다. 이 값은 제어기 피드백\n잔차이며 외부 기준 절대 위치 정확도가 아닙니다. 중·고속 yaw에서 P=6은 P=4와\n정착 시간이 비슷하면서 종료 잔차가 작아 선택했습니다. 감속 envelope,\n최소속도, 정지 허용오차와 hold/dwell은 유지했습니다.\n\n측정 데이터·그래프·선택 근거는 Git 제외 경로\n[`artifacts/odometry_evaluation/p_response_tuning/REPORT.md`](../../artifacts/odometry_evaluation/p_response_tuning/REPORT.md)에 있습니다.\nICP 3건은 미수렴으로 외부 정확도 비교에서 제외했으며 원본과 거부 사유를 보존합니다.\n\n### 대각선 P 튜닝과 외부 오차 측정\n\n`diagonal_left`는 전좌↔후우(+45°/−135°), `diagonal_right`는\n전우↔후좌(−45°/+135°) 왕복입니다. 속도와 목표 거리는 **벡터 크기**입니다.\n편도 0.5 m의 X/Y 성분은 각각 약 0.354 m이며, 각 축을 0.5 m씩 이동하지 않습니다.\n`run_oneway_eval.py --patterns`와 wheel 평가 config의 `patterns`에도\n두 대각선 이름을 사용할 수 있습니다.\n\n```bash\n# 계획 확인\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/diagonal_response_tuning.json --dry-run\n\n# 0.20 m/s에서 P=1/3/4/6 비교, 두 대각선 왕복\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/diagonal_response_tuning.json\n\n# P=6, 속도상한 0.20/0.35/0.50 m/s, 각 대각선 3회 왕복\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/diagonal_response_validation.json\n```\n\n대각선 제어는 **진행방향에 투영한 위치 오차**로 속도를 정합니다.\n횡방향 위치·yaw 편차는 별도 측정과 경계 이탈 중단 대상입니다.\n5 mm 정지 허용오차도 진행방향 투영값이며 2D 위치오차 norm과 구분합니다.\n대각선 후보는 fallback `linear_kp`만 바꾸며 X/Y/yaw 전용 계수는 유지합니다.\n\n2026-10-15 대각선 실물 28회 왕복(56개 편도) 측정 후\n**`linear_kp=6.0`**을 적용했습니다. 현재 설정 파일의 fallback·X·Y·yaw P는\n모두 6.0입니다. 검증한 대각선 방향은 ±45°입니다.\n\n| 저속 조건 | 마지막 10 cm 시간, P=1 → P=6 |\n|---|---|\n| 전좌↔후우 | 3.502 → 0.666 s |\n| 전우↔후좌 | 3.653 → 0.662 s |\n\n선택 P의 wheel-odom 진행방향 종료 잔차는 1.30~4.51 mm, 횡방향 잔차 최대\n2.82 mm, 2D 종료 잔차 최대 5.17 mm였습니다. 진행방향 목표 초과는 없었습니다.\n저·중·고속 상한 각각 방향별 최소 3회 검증했으며 실측 최고 속도는\n약 0.384 m/s입니다.\n\n`endpoint_errors`는 다음 세 값을 분리합니다.\n\n- `wheel_goal`: wheel odom의 목표 잔차·횡편차·yaw 변화.\n- `icp_goal`: 유효 ICP로 추정한 변위와 명령 목표의 차이.\n- `odom_minus_icp`: wheel odom 변위와 ICP 변위의 차이.\n\n56개 편도 중 ICP 52개가 유효했습니다. 무효 4개는 `null`로 보존하며 오차 평균에\n포함하지 않습니다. 대각선 config의 `require_valid_icp=false`는 이 무효 처리를\n유지하면서 제어 응답을 계속 측정하는 설정입니다.\n\n**빠른 제어 응답과 외부 위치 정확도는 구분합니다.** P=6에서 ICP 목표 차이의\n조건별 평균은 6.53~20.32 mm였고, 전우↔후좌의 고속 상한 조건에서 최대\n43.21 mm가 관측됐습니다. 휠 odom 피드백으로 보이지 않는 편차와 ICP 측정\n불확실성을 포함하며, 원인을 P 또는 휠 슬립만으로 확정하지 않았습니다.\n\n그래프·편도별 원본·선택 근거:\n[`artifacts/odometry_evaluation/diagonal_p_tuning/REPORT.md`](../../artifacts/odometry_evaluation/diagonal_p_tuning/REPORT.md).\n시험 중 LiDAR 종료 후 재기동에서 장치 정보/health 응답과 별개로 scan 시작이\n실패하는 현상이 발생했습니다. 이 경우 주행 전에 중단됐고, PC 쪽 LiDAR USB를\n완전히 재연결해 실제 스캔 수신을 확인한 후 재개했습니다. 재기동 문제의 원인은\n아직 확정되지 않았습니다.\n\n---\n\n## 6. 단위 테스트\n\n```bash\nmake test-odometry-evaluation\n```\n\n이 target은 배치 config, 변환, ICP, 공통 주행 로직과 휠 진단의 pytest 및\n배치 launcher의 Bash 문법 검사를 실행합니다. 장치나 실물 주행 없이 검증합니다.\n"},"tools/odometry_evaluation/VALIDATION_PROTOCOL.md":{"title":"전 축 실물 검증 프로토콜","body":"# 전 축 실물 검증 프로토콜\n\nX/Y, yaw와 두 대각선의 정지 응답 및 wheel odom과 LiDAR ICP의 차이를\n같은 절차로 측정한다. 기본 시험용 P는 모든 축에서 **6.0**이다.\n\nP는 각 편도의 거리·각도 정지를 위한 일시적인 평가 제어다. trial에만 적용하며\n실행 후 설정 파일에 되쓰지 않는다. MCU 휠 속도 PI·FF, 휠 odom geometry와\n상시 주행 controller의 튜닝과 구분한다.\n\n## 1. 설정과 시험 행렬\n\n편집할 파일은\n[`configs/mission/all_axis_validation.json`](../../configs/mission/all_axis_validation.json)이다.\n`run_motion_response.sh`의 기본 config이며, 기존 후보 sweep과 별개다.\n\n| `axis` | outbound → inbound | 편도 목표 | 속도 상한 |\n|---|---|---|---|\n| `x` | 전진 → 후진 | 0.5 m | 0.20 / 0.35 / 0.50 m/s |\n| `y` | 좌측 → 우측 | 0.5 m | 0.20 / 0.35 / 0.50 m/s |\n| `yaw` | 반시계 → 시계 | 90° | 0.30 / 0.60 / 1.00 rad/s |\n| `diagonal_left` | 전좌 → 후우 | 벡터 총거리 0.5 m | 0.20 / 0.35 / 0.50 m/s |\n| `diagonal_right` | 전우 → 후좌 | 벡터 총거리 0.5 m | 0.20 / 0.35 / 0.50 m/s |\n\n각 속도·축에서 3회 왕복, 총 **45회 왕복 / 90개 편도**다. 반복마다 저속의\n다섯 축, 중속의 다섯 축, 고속의 다섯 축 순서로 실행한다.\n대각선의 각 X/Y 성분은 약 0.354 m다. 속도는 명령 상한이며, 짧은 구간의\n가감속과 휠 속도 제한 때문에 실측 최고 속도와 다를 수 있다.\n\n### 파라미터 편집\n\n| 위치 | 의미와 적용 범위 |\n|---|---|\n| `trials[].axis` | `x`, `y`, `yaw`, `diagonal_left`, `diagonal_right` |\n| `trials[].kp` | 해당 왕복의 P. 허용 범위 `0 \u003c kp \u003c= 8`. 기본 6.0 |\n| `trials[].speed` | 해당 왕복의 속도 상한. 병진 최대 0.5 m/s, yaw 최대 1 rad/s |\n| `repetitions` | 전체 trial 목록 반복 수. 1~10 |\n| `translation_distance_m` | 모든 병진 편도의 벡터 총거리. 최대 0.5 m |\n| `rotation_angle_deg` | 회전 편도 각도. 최대 90° |\n| `require_valid_icp` | 기본 `true`. 외부 비교가 거부되면 후속 trial 중단 |\n| `icp_min_inlier_ratio` | 유효 ICP의 최소 inlier 비율. 현재 preset은 `0.30`(30%), 생략 시 `0.40` |\n| `icp_convergence` | 병진·회전 strict 공차, bounded cycle의 최대 폭과 주기. 아래 기본값 참조 |\n| `guards` | 아래 시험용 중단 경계 |\n| `output_dir` | 결과 묶음의 상위 디렉터리 |\n\n동일 축의 P를 모든 속도에서 바꾸려면 해당 축의 세 trial을 함께 편집한다.\n특정 조건만 재시험하려면 복사한 config의 `trials`에 필요한 행만 남긴다.\n튜닝 때는 P, 속도와 감속 설정을 동시에 바꾸지 않고 원본과 변경 결과를 구분한다.\n현재 전 축 preset은 inlier 하한을 30%로 사용한다. 적용값은 결과에 기록한다.\nICP 최대 50회, 병진 `1e-5 m`·회전 `1e-5 rad`의 strict 공차를 사용한다.\n수렴은 correspondence 거리의 annealing이 최종 40 mm 단계에 도달한 뒤만\n판정한다. 주기 2~6이 세 주기 반복되고 반복 구간의 pose 차이가 1 mm·0.02°\n이하인 bounded cycle도 수렴으로 기록한다. 수렴 후 inlier·RMSE·관측성 검사를\n통과해야 유효하다. 알고리즘과 저장 스캔 재검증은\n[ICP 수렴과 관측성](README.md#icp-수렴과-관측성)을 따른다.\n\n`icp_convergence`의 설정 키는 `translation_tolerance_m`, `rotation_tolerance_rad`,\n`max_translation_span_m`, `max_rotation_span_rad`, `max_period`다.\n현재 기본값은 각각 `1e-5`, `1e-5`, `0.001`, `0.00034906585039886593`(0.02°), `6`이다.\n적용값과 각 정합의 `convergence_reason`은 결과에 기록한다.\n\n`evaluation_config`가 가리키는\n[`wheel_odometry_evaluation.json`](../../configs/mission/wheel_odometry_evaluation.json)에서는\nodom topic, timeout, LiDAR 필터·extrinsic, runtime과 기본 motion 파일을 읽는다.\n이 프로토콜의 축·P·속도·거리·반복 수는 **validation config가 우선**하며,\nwheel config의 `patterns`나 속도 목록을 수정해도 이 trial 행렬은 바뀌지 않는다.\n경로는 레포 루트 기준이며 절대 경로도 사용할 수 있다.\n\n기본 motion의 정지 공차, 최소속도, 감속과 hold는\n[`motion_settings.json`](motion_settings.json)에서 관리한다.\nX/Y trial은 축별 P, 두 대각선 trial은 fallback `linear_kp`, yaw trial은\n`yaw_kp`만 실행 중 덮어쓴다. 다른 축의 설정은 보존한다.\n\n## 2. 시험 전 준비\n\n1. 평탄하고 사람·장애물이 없는 3.5 m × 3.5 m 이상 구역과 물리 emergency\n   stop을 준비한다. 센서·프로파일과 적재 상태를 고정한다.\n2. 시작 위치와 heading을 표시한다. 대각선 0.5 m가 각 축 0.5 m가 아님을\n   확인하고 전체 차체의 회전 공간을 확보한다.\n3. MCU의 모터 제어 펌웨어, MCU·LiDAR USB 연결과\n   [`wheel_evaluation_runtime.json`](../../ros2_ws/src/cleany_base_driver/config/wheel_evaluation_runtime.json)의\n   by-id 경로를 확인한다. 다른 teleop·Nav2·평가 명령원을 종료한다.\n4. 장착 상태와\n   [`lidar_extrinsic_20261015.json`](../../ros2_ws/src/cleany_base_driver/config/lidar_extrinsic_20261015.json)을\n   대조한다. 거리 필터 0.45 m 밖에 서로 다른 방향의 고정 구조물이 보여야 한다.\n5. 아래 offline 검사와 dry-run에서 모든 P=6, 90개 편도와 결과 경로를 확인한다.\n   dry-run은 장치 준비 확인을 대신하지 않으며 ROS 노드나 이동을 시작하지 않는다.\n\n```bash\nmake test-odometry-evaluation\n\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/all_axis_validation.json --dry-run\n```\n\n## 3. 실물 실행과 중단\n\n새 장착·노면·적재 또는 변경한 계수의 첫 시험은 config를 복사해 저속 다섯\ntrial과 `repetitions: 1`만 남겨 먼저 확인한다. 정상 응답을 확인한 뒤 전체\n행렬을 실행한다.\n\n```bash\n# 시험 공간과 emergency stop 준비를 확인한 뒤 실행\nbash tools/odometry_evaluation/run_motion_response.sh \\\n  --config configs/mission/all_axis_validation.json\n```\n\nLauncher는 Agent·base·LiDAR를 준비하고 진행하는 odom·scan·WheelState,\ndisabled·fault-free MCU와 `/base/enable`을 확인한다.\n주행 전 passive STOP handshake를 완료하며, 주행 중 odom watchdog은 150 ms다.\n정상 실행 중인 stack은 재사용한다.\n\n| `guards` 기본값 | 중단 조건 |\n|---|---|\n| `session_radius_m: 0.75` | 세션 시작 위치에서 wheel-odom 변위 반경 초과 |\n| `cross_track_m: 0.08` | 병진 경로 수직 이탈 또는 회전 중심 병진 이탈 초과 |\n| `translation_overshoot_m: 0.025` | 편도 시작 기준 진행축 변위의 절댓값이 목표 + 25 mm 초과 |\n| `translation_yaw_drift_deg: 10.0` | 병진 중 yaw 변화 절댓값 초과 |\n| `rotation_overshoot_deg: 5.0` | 회전 변화 절댓값이 목표 + 5° 초과 |\n\n경계는 wheel odom 기반 **시험 중단값**이며 외부 정확도의 합격 기준이 아니다.\n주행 실패, watchdog, 경계 이탈, STOP·disable 미확인이나 유효하지 않은 ICP는\n후속 시험을 중단한다. Ctrl+C도 STOP·disable 정리를 요청한다.\n세션 누적 이탈로 중단되면 원인과 실제 위치를 확인하고 새 실행으로 재시험한다.\n\nLiDAR health 응답만 있고 실제 scan이 없으면 시작하지 않는다. 재기동 실패 시\n로그를 보존하고 USB 연결과 scan 수신을 확인한 뒤 새 실행을 시작한다.\n\n## 4. 기록과 판정\n\n결과는 `artifacts/odometry_evaluation/all_axis_validation/\u003c시각>/`에 저장한다.\n\n- `config.json`, `evaluation_config.json`, `base_motion_config.json`: 적용 설정.\n- `runtime_ready.json`, `runtime_logs/`: stack 준비 근거와 자체 기동 로그.\n- `rep*_*.json`: 왕복별 제어 trace, 편도·loop ICP, 응답 지표와 endpoint 오차.\n- `*_start.npz`, `*_destination.npz`, `*_returned.npz`, `*_scans.npz`: 원본 스캔.\n- `response_summary.json`, `response.png`: 전체 실행 상태와 응답 비교.\n\n각 축·속도·방향을 분리해 완료 수, 유효 ICP 수, 평균·표준편차·최대값과\n중단 사유를 보고한다. 서로 다른 P의 결과를 같은 통계에 섞지 않는다.\n\n1. **제어 응답:** 두 편도의 `is_valid`, `reached_tolerance`와 `metrics.valid`를\n   확인한다. 현재 병진 진행축 공차 5 mm 또는 yaw 공차 1°와 정지 속도 조건을\n   0.5초 유지해야 한다. 정착 진입, hold 완료와 1.5초 dwell은 구분한다.\n   오버슛과 실측 최고 속도도 기록한다.\n2. **외부 비교:** outbound·inbound·직접 loop ICP의 품질 판정을 확인한다.\n   병진의 `endpoint_errors`는 wheel 목표 잔차, ICP 목표 차이와\n   `odom_minus_icp`를 구분한다. yaw는 각 편도의\n   `one_way_error.error_yaw_deg`와 병진 드리프트를 확인한다.\n   무효 ICP는 `null`과 거부 사유를 유지하고 통계에서 제외한다.\n3. **전체 완료:** 45개
