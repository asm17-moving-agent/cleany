31.3초이며 원본 실시간 화면 녹화나 현재 실행의 성공 증거가 아닙니다. \u003ca href=\"../../assets/visuals/imported.json\">입력과 출처\u003c/a>\u003c/figcaption>\n\u003c/figure>\n\n### 확장 중단 조건\n\n아래 조건이면 odom 전달을 차단하고 현재 세션을 종료 저장합니다. 장치 재시작이나 odom 원점 초기화 후 기존 궤적을 이어 쓰지 않습니다.\n\n| 원본 `/odom` 조건 | 기본 중단값 |\n|---|---:|\n| 수신 공백 | 2초 이상 |\n| 샘플 간 이동 | 0.25 m 초과 |\n| 샘플 간 회전 | 0.35 rad 초과 |\n| 촬영 시각 | 역행 |\n\n`extend.py --odom-max-*`로 지정합니다. 문제 해결 후 원본 또는 마지막 정상 저장 상태로 새 확장을 시작합니다.\n"},"docs/implementation/how-to/mission.md":{"title":"Mission Runtime 연결하기","body":"# Mission Runtime 연결하기\n\n외부 요청을 Runtime과 연결하고, 실행 허가와 완료·취소 결과를 확인합니다.\n\n| 현재 준비된 것 | 선택할 실행 | 주행 / 조작 |\n|---|---|---|\n| 새 Gazebo 환경과 Backend | [통합 실행](#주행-구성을-함께-실행) | Gazebo/Nav2 / 기본 mock |\n| 이미 실행 중인 AMCL/Nav2 | [Runtime만 연결](#기존-주행-구성에-runtime-연결) | 기존 Nav2 / 설정한 adapter |\n| Backend 없이 연동 시험 | [Gazebo + Mock Action](#gazebo-주행과-mock-조작) | Gazebo/Nav2 / Action mock |\n| 장치와 시뮬레이터 없는 시험 | [모두 Mock](#주행도-mock으로-action-연결-확인) | mock / Action mock |\n\n[공통 환경](../running.md#공통-준비)을 모든 터미널에 적용합니다. 같은 robot의 Runtime, bridge, canonical odometry producer는 하나씩만 실행합니다.\n\n```mermaid\nsequenceDiagram\n  participant Client as Backend 또는 수동 요청\n  participant Runtime as Mission Runtime\n  participant Supervisor\n  participant Task as Navigator / 조작 adapter\n  Client->>Runtime: OfferMission (새 mission ID)\n  Runtime->>Supervisor: 실행 허가 확인 (required 모드)\n  Supervisor-->>Runtime: 허가 또는 거절 사유\n  Runtime-->>Client: 수락 / 거절\n  Runtime->>Task: 실행 요청\n  Task-->>Runtime: 진행 / 최종 결과\n  Runtime-->>Client: mission/result\n  Note over Client,Runtime: 수락 응답과 완료 결과는 별개\n```\n\n## Mission Runtime과 Backend\n\n### 주행 구성을 함께 실행\n\n빌드와 overlay 적용 후 Gazebo, Nav2, Runtime, Gateway를 함께 실행합니다.\n\n```bash\nmake build-mission-sim\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 launch cleany_bringup mission_sim.launch.py \\\n  gateway_url:=ws://127.0.0.1:8080/api/robots/cleany-01/gateway/ws \\\n  post_mission:=wait_for_next\n```\n\nBackend는 별도 `cleany-control-plane` 저장소에서 실행합니다. 같은 robot에 Runtime, bridge, canonical odometry producer를 중복 실행하지 않습니다. 책상 작업은 기본 mock이며 관측 ID에는 실제 사진이 포함되지 않습니다.\n\n### 기존 주행 구성에 Runtime 연결\n\nAMCL/Nav2가 이미 실행 중이면 아래 명령으로 Runtime을 연결합니다.\n\n```bash\nmake build-mission-runtime\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 launch cleany_mission_manager mission_runtime.launch.py \\\n  gateway_url:=ws://127.0.0.1:8080/api/robots/cleany-01/gateway/ws \\\n  post_mission:=wait_for_next\n```\n\n`mission_runtime.launch.py`의 기본 `supervision_mode:=required`는 아래 System Supervisor 감독 stack이 함께 실행 중이어야 미션을 받습니다. 감독 없이 실행하면 `SUPERVISOR_UNAVAILABLE` 사유로 거절합니다.\n\n| 실행 조건 | 설정과 동작 |\n|---|---|\n| 감독 없이 단독 실험 | `supervision_mode:=disabled`; snapshot의 `supervision`에 기록. 시스템 Fault와 E-stop 증거를 확인하지 않음 |\n| Nav2 없이 구조 확인 | `navigation_backend:=mock` 추가 |\n| 완료 후 동작 선택 | `post_mission:=return_home\\|wait_for_next`; 제품 복귀 정책은 별도 결정 |\n| 독립 실험 | 별도 `journal_path`, `bridge_journal_path` 사용 |\n| 동일 미션 복구 | 기존 journal DB 유지 |\n\n재연결, 중복, 취소, 재시작 동작은 [Mission 계약](../../../ros2_ws/src/cleany_interfaces/docs/mission.md)을 따릅니다.\n\n### System Supervisor 감독 stack\n\nSupervisor, safety adapter, Nav2 lifecycle 복구 owner를 Runtime 옆에 실행합니다. 센서, Nav2와 Runtime은 각자의 launch가 소유합니다.\n\n```bash\nmake build-supervision\nsource \"$(make -s print-navigation-install-base)/setup.bash\"\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 launch cleany_system_supervisor supervision.launch.py \\\n  \"estop_released_topic:=\u003c하드웨어 해제 Bool>\" \"protection_ready_topic:=\u003c보호 계층 Bool>\"\n\n# 별도 터미널: 활성 Fault 확인\nros2 run cleany_system_supervisor supervisor_operator\nros2 run cleany_system_supervisor supervisor_operator ESTOP --operator \"\u003cname>\"\n```\n\n| 실행 조건 | 설정과 동작 |\n|---|---|\n| 안전 증거 topic 미지정 | 의도된 `FAULT_LOCKED`; Runtime은 `SYSTEM_FAULT_LOCKED`로 거절 |\n| 팔 controller가 있는 구성 | `arm_health:=true`로 `arm_health_monitor` 추가 |\n| Gazebo 통합 실행 | `mission_sim.launch.py supervision:=true`; 시뮬레이션에는 안전 하드웨어가 없어 evidence topic을 주지 않으면 잠김 |\n| 상태 파일 | 기본 `~/.ros/cleany/system_supervisor_state.json`; latched Fault가 재시작 뒤에도 유지 |\n\nFault, 복구와 운영자 절차는 [System Supervisor](../../../ros2_ws/src/cleany_system_supervisor/docs/supervision.md)를 따릅니다. 영구 기록이 필요하면 `cleany_logger` 기록 대상에 `/system/events`, `/system/state`, `/system/faults`, `/safety/status`를 추가합니다.\n\n### Gazebo 주행과 Mock 조작\n\n베이스 주행은 Gazebo/Nav2, 인식과 계획 및 팔 조작은 Mock입니다. 모든 터미널에 같은 overlay와 DDS domain을 적용합니다. 기본 로컬 Mock 실행과 별도로 사용합니다.\n\n1. 통합 package를 빌드하고 환경을 적용합니다.\n\n```bash\nmake build-mission-sim\nsource \"$(make -s print-install-base)/setup.bash\"\nexport ROS_DOMAIN_ID=186\n```\n\n2. 터미널 1에서 Gateway 없이 시작합니다. 세 DB 경로는 분리하고 재시작 시험에서는 보존합니다.\n\n```bash\nros2 launch cleany_bringup mission_sim.launch.py \\\n  profile:=fortress headless:=true \\\n  runtime_config:=$PWD/ros2_ws/src/cleany_mission_manager/config/runtime_gazebo_manipulation_mock.yaml \\\n  start_manipulation_mock:=true manipulation_scenario:=success \\\n  post_mission:=wait_for_next enable_bridge:=false enable_telemetry:=false \\\n  journal_path:=$HOME/.local/state/cleany/mission-mock/missions.db \\\n  bridge_journal_path:=$HOME/.local/state/cleany/mission-mock/bridge.db \\\n  manipulation_database_path:=$HOME/.local/state/cleany/mission-mock/manipulation.sqlite3\n```\n\n3. 터미널 2에서 `ros2 topic echo /mission/status`로 `ready: true`를 확인한 뒤 요청합니다. 새 미션에는 새 ID를 사용합니다. `NAV2_NOT_READY`이면 Nav2 lifecycle, odom과 TF를 먼저 확인합니다.\n\n```bash\nros2 service call /mission/offer cleany_interfaces/srv/OfferMission \\\n  \"{mission_id: gazebo-mock-demo-001, mission_type: clean_desk, target_kind: SEAT, target_id: seat-12, requested_by: manual-test}\"\nros2 topic echo /mission/result\n```\n\n수락 응답은 완료 결과가 아닙니다. 정상 실행은 두 물체를 서로 다른 execution ID로 처리한 뒤 추가 빈 관측을 확인합니다. 물체당 정상 조작 시간은 약 40초입니다. [개발 Monitor](monitoring.md#개발-monitor)의 실행 → BT에서 ExecuteOne을 선택하거나 매니퓰레이션 화면을 엽니다. 같은 domain과 overlay를 사용합니다.\n\nBackend 조합과 주행 설정은 [Mock 연결 reference](../../../ros2_ws/src/cleany_mission_manager/docs/manipulation-mock-integration.md)를 따릅니다. 기본 종료 정책은 `return_home`이며 위 명령의 첫 시험은 `wait_for_next`를 명시합니다.\n\n### 주행도 Mock으로 Action 연결 확인\n\n두 터미널에서 같은 overlay와 `ROS_DOMAIN_ID=186`을 사용합니다. 첫 터미널에서 서버를 시작합니다.\n\n```bash\nmake build-mission-mock\nsource \"$(make -s print-install-base)/setup.bash\"\nexport ROS_DOMAIN_ID=186\nros2 launch cleany_skill_executor manipulation_mock.launch.py \\\n  mock_config:=$PWD/ros2_ws/src/cleany_mission_manager/config/manipulation_server_fixture.yaml \\\n  database_path:=$HOME/.local/state/cleany/mission-mock/manipulation.sqlite3\n```\n\n두 번째 터미널에서 Runtime을 시작한 뒤 위의 준비 확인과 미션 요청을 수행합니다. 이 구성의 주행 성공은 Gazebo 주행 증거가 아닙니다.\n\n```bash\nros2 run cleany_mission_manager mission_runtime --ros-args \\\n  --params-file ros2_ws/src/cleany_mission_manager/config/runtime_manipulation_mock.yaml \\\n  -p targets_file:=$PWD/ros2_ws/src/cleany_mission_manager/config/study_cafe_targets.yaml \\\n  -p post_mission:=wait_for_next \\\n  -p journal_path:=$HOME/.local/state/cleany/mission-mock/missions.db\n```\n\n## 요청 결과를 해석하기\n\n| 관측 | 의미 / 다음 확인 |\n|---|---|\n| `/mission/status`의 `ready: true` | 요청을 받을 준비. 새 요청에는 새 mission ID 사용 |\n| `SUPERVISOR_UNAVAILABLE` | required 모드에 Supervisor 없음 |\n| `SYSTEM_FAULT_LOCKED` | 안전 증거 또는 latched Fault 확인; 재시작만으로 해제되지 않음 |\n| `NAV2_NOT_READY` | Nav2 lifecycle, 새 odom과 TF 확인 |\n| OfferMission 수락 | 실행 접수. `/mission/result`를 기다림 |\n| Mock 조작 완료 | fixture의 진행·결과; 실제 사진이나 물리 수거 근거는 아님 |\n\n재시작 시험은 journal을 보존하고 독립 실험은 DB 경로를 분리합니다. 종료·재전송·취소의 상세 의미는 [Mission 계약](../../../ros2_ws/src/cleany_interfaces/docs/mission.md)을 따릅니다.\n"},"docs/implementation/how-to/monitoring.md":{"title":"상태를 보고 기록하기","body":"# 상태를 보고 기록하기\n\nMonitor는 상태를 표시하고, 독립 Logger는 기록을 소유합니다. 화면을 닫는 것과 기록 종료를 구분합니다.\n\n[공통 환경 준비](../running.md#공통-준비) · [검증 선택](../testing.md)\n\n| 작업 | 도구 | 시작 위치 |\n|---|---|---|\n| 현재 상태 보기 | Dev Monitor / RViz | [화면 실행](#개발-monitor) |\n| 원본 저장 | 독립 Logger + CLI | [녹화 시작·종료](#독립-logger) |\n| 완료된 기록 다시 보기 | ArchiveReader / rosbag2 / RViz | [기록 재생](#완료된-bag-재생) |\n| 로봇 얼굴 표시 | Jetson 독립 앱 | [얼굴 디스플레이](#jetson-얼굴-디스플레이) |\n\n## 화면과 기록의 소유권\n\n```mermaid\nflowchart TD\n  ROS[\"ROS 입력\"] --> Logger[\"독립 Logger / 녹화 소유\"]\n  Logger --> Bag[\"rosbag2 / 원본\"]\n  Logger --> DB[\"SQLite / 가공 관측과 색인\"]\n  ROS --> Monitor[\"Monitor / live 관측\"]\n  ROS --> Camera[\"telemetry camera_preview\"]\n  Camera --> Monitor\n  Camera --> Backend[\"Dashboard Backend\"]\n  DB --> Monitor\n  CLI[\"CLI\"] -->|\"시작 / 종료 / 설정\"| Logger\n  Monitor -->|\"서비스로 기록 제어\"| Logger\n```\n\n화면에서 보이는 카메라 preview와 원본 녹화 정책은 별개입니다. 기록 시작·종료는 Logger 상태로 확인하고, 과거 자료는 읽기 전용 조회 경로를 사용합니다.\n\n## 카메라 미리보기\n\n카메라 드라이버가 영상을 발행하는 ROS 환경에서 별도 터미널로 실행합니다.\nBackend와 위치 relay는 필요하지 않습니다.\n\n```bash\nmake build-telemetry\nmake run-camera-preview\n```\n\n미리보기 노드는 `127.0.0.1:8769`에서 요청된 영상 토픽만 구독합니다. 예를 들어\n`curl 'http://127.0.0.1:8769/api/cameras'`로 목록을 확인하고\n`curl 'http://127.0.0.1:8769/api/camera?topic=/camera/color/image_raw/compressed' -o /tmp/head.jpg`로\n조회합니다. 첫 응답은 구독 준비 중인 202일 수 있으므로 상태와 Content-Type을 확인합니다.\n화면을 닫으면 조회 lease가 만료되어 구독을 해제합니다. 녹화는 시작하지 않습니다.\n\nMonitor는 같은 주소를 기본으로 사용합니다. 변경 시 `camera_preview_url`을 지정합니다.\n드라이버와 camera_preview의 DDS domain과 네트워크 설정이 같아야 합니다.\n해상도, 처리 빈도, 상태 코드는 [카메라 계약](../../../ros2_ws/src/cleany_telemetry/docs/interfaces.md#camera_preview)을 따릅니다.\n\n## 개발 Monitor\n\n\u003cfigure class=\"visual-slot\" data-visual-id=\"monitor-ui\">\n\u003cp>\u003cstrong>시각자료 자리 · 비워 둠\u003c/strong>\u003c/p>\n\u003cfigcaption>\u003cstrong>필요한 자료:\u003c/strong> 현재 Monitor의 연결 상태, live/replay 모드, Logger 기록 상태가 함께 보이는 화면.\u003cbr>\u003cstrong>빈 이유:\u003c/strong> 기존 캡처는 이전 UI이며 현재 UI와 대응하는 기록 입력이 없습니다.\u003c/figcaption>\n\u003c/figure>\n\n```bash\nmake build-dev-monitor\nmake run-dev-monitor\n```\n\n브라우저에서 `http://127.0.0.1:8768`을 엽니다. Monitor는 관측 전용이며, 관측 대상과 같은 DDS domain과 메시지 overlay가 필요합니다. Frontend 준비는 [개발환경](../development-setup.md)을 따릅니다.\n\n실시간 입력과 logger 연결은 [monitor.yaml](../../../ros2_ws/src/cleany_dev_monitor/config/monitor.yaml)에서\n설정합니다. `make build-dev-monitor`는 logger도 빌드하지만 Monitor 실행은 logger를\n자동 시작하지 않습니다. 기록은 아래 절차로 별도 실행합니다. 웹 자산 갱신 후에는\n`make build-dev-monitor-ros`로 설치 자산도 갱신합니다.\n\n## 독립 Logger\n\n1. 웹 없이 logger만 빌드하려면 `make build-logger`를 실행합니다.\n2. 빌드 overlay를 source한 별도 터미널에서 logger를 시작합니다.\n   CLI에서 토픽을 먼저 설정하려면 녹화 대기 상태로 실행합니다.\n\n   ```bash\n   ros2 launch cleany_logger logger.launch.py record_on_start:=false\n   ```\n\n   기본값인 `record_on_start:=true`는 즉시 녹화하며, 시뮬레이션에서는\n   `use_sim_time:=true`를 지정합니다. `make run-logger LOGGER_LAUNCH_ARGS='record_on_start:=true'`도\n   사용할 수 있습니다.\n3. 같은 DDS domain과 빌드 overlay를 사용하는 다른 터미널에서 CLI로 설정하고\n   녹화합니다. 설정을 먼저 바꾸려면 logger를 `record_on_start:=false`로 실행합니다.\n   이미 녹화 중이면 `stop` 후 설정합니다.\n\n   ```bash\n   ros2 run cleany_logger logger status\n   ros2 run cleany_logger logger topics\n   ros2 run cleany_logger logger topics set camera --topic /camera/head/color/image_raw --hz 2 --enable\n   ros2 run cleany_logger logger topics set path_topic --topic /plan --hz 1 --enable\n   ros2 run cleany_logger logger start\n   ros2 run cleany_logger logger stop\n   ```\n\n   녹화 중에는 설정을 변경할 수 없습니다. 먼저 `stop`하고 아래 옵션을 적용합니다.\n\n   | CLI 옵션 | 의미 |\n   |---|---|\n   | `topics set \u003cID> --disable` | `topics`에서 확인한 항목 끄기 |\n   | `velocity_topics --topic /first --topic /second` | 속도 체인 전체 설정; `velocity_topics:0`은 한 항목 |\n   | `--hz all` | 출처별 수신마다 기록; 카메라와 점군 원본에는 숫자 Hz 지정 |\n   | `--node /robot/logger`, `--timeout 3`, `--json` | 대상, 요청 대기, 자동화 출력; 하위 명령 앞/뒤 모두 허용 |\n\n   루트의 `make logger LOGGER_ARGS='status'`도 같은 CLI입니다. CLI 종료 후에도 Logger는 계속 실행됩니다.\n\n4. 대시보드를 사용하려면 별도 터미널에서 `make run-dev-monitor`를 실행합니다.\n   기본 저장 위치는 두 프로세스 모두 `~/.local/state/cleany/recordings`입니다.\n   다른 경로는 logger YAML의 `state_directory`와 Monitor의\n   `MONITOR_ROS_ARGS='-p state_directory:=/absolute/path'`에 동일하게 지정합니다.\n   이전 기록은 기존 디렉터리를 명시해 조회합니다. 대시보드나 브라우저를 종료해도\n   logger는 같은 세션을 녹화합니다.\n\n`mission_sim.launch.py`는 `enable_logger:=true record_on_start:=true`로 logger를\n함께 실행할 수 있습니다. 기본은 비활성이며 `logger_config:=/absolute/logger.yaml`로\n설정을 지정합니다. 이 launch 구성은 시뮬레이션 시계를 logger에 전달합니다.\n\n기록 구조는 [Logger 데이터 계약](../../../ros2_ws/src/cleany_logger/docs/data.md),\nHTTP와 stale 처리는 [Monitor 계약](../../../ros2_ws/src/cleany_dev_monitor/docs/data.md)을 따릅니다.\n\n## 완료된 bag 재생\n\n상세 SLAM, LiDAR, 점군과 costmap은 같은 domain의 RViz에서 확인합니다. 완료된 원본 bag ZIP을 내려받아 압축을 푼 뒤 다음과 같이 재생합니다. Bag에 기록된 토픽, TF와 CameraInfo만 사용할 수 있으며 SQLite 가공 기록은 RViz 입력이 아닙니다.\n\n```bash\nros2 bag info \"\u003cbag-directory>\"\nros2 bag play \"\u003cbag-directory>\" --clock\nrviz2 --ros-args -p use_sim_time:=true\n```\n\nFixed Frame은 `map_frame`에 맞추고 Cartographer Submaps display에는 해당 plugin을 설치합니다.\n\n진단 토픽은 `\u003cbag-directory>/diagnostics`의 별도 bag에 있습니다. 센서와 함께\n보려면 동일한 시작 시각 기준으로 두 bag을 재생합니다. 센서 bag은 `/clock`을\n발행하고 진단 bag은 `--clock` 없이 재생합니다. 정밀 비교에는 각 bag의 첫 메시지\n시각 차이도 맞춰야 합니다.\n\n## 매핑 분석용 기록 선택\n\n| 데이터 | 권장 선택과 이유 |\n|---|---|\n| `/scan_raw`, `/odom`, `/base/wheel_state`, TF | full-rate 원본; 당시 scan 필터와 휠 변환 설정도 보존 |\n| `/scan`, `/wheel/odom`, `/joint_states` | 중복이면 생략 가능; 필요한 원본이 있는지 먼저 확인 |\n| 궤적 / 제약선 | 각각 1 Hz / 0.5 Hz |\n| submap, matched points, map, 가공 관측 | 기존 정책 유지 |\n| 카메라 / depth 점군 | 필요한 토픽과 주기를 별도 선택 |\n\n정지 상태에서 정책을 바꿉니다. 기록 주기는 실시간 RViz나 센서 발행 빈도를 바꾸지 않습니다. 용량은 실제 입력으로 측정하며 `limit_mib`는 시간당 속도가 아닌 **세션 총량**입니다.\n\n| 남은 결과 | 읽는 방법 |\n|---|---|\n| SQLite 가공 기록 | Monitor / ArchiveReader; RViz 입력은 아님 |\n| 센서 rosbag2 | `ros2 bag info`로 토픽·메시지 수 확인 후 재생 |\n| `diagnostics/` bag | 센서 bag과 첫 메시지 시각 차이를 맞춰 재생 |\n| 종료된 세션 | Logger stop/flush와 파일을 확인; 화면 종료만으로 녹화가 끝나지 않음 |\n\n## Jetson 얼굴 디스플레이\n\n전용 앱은 `/home/cleany/cleany-display`에 독립 설치합니다. 자동 로그인 후 로컬 Chromium 키오스크를 실행하고 ROS 상태를 구독합니다. 설치, 서비스 재시작과 자동 시작 해제는 [디스플레이 운영](../../../ros2_ws/src/cleany_display/README.md)을 따릅니다. 기존 `/home/cleany/cleany` checkout과 그 실행 프로세스를 변경하지 않습니다.\n\n## 읽기 전용 위치 관측과 Backend 전송\n\nSLAM 지도 위치를 관측할 때는 localization이 제공하는 `map -> base_link` TF를 사용합니다.\n아래 관측 노드는 Nav2나 센서 드라이버를 시작하지 않습니다.\n\n```bash\nros2 run cleany_telemetry pose_observer --ros-args -p source:=tf\nros2 topic echo /telemetry/pose --qos-reliability best_effort\n```\n\nBackend에 연결할 때만 별도 터미널에서 adapter를 실행합니다. 지도 ID와 토큰 파일은\n현재 Backend에 등록한 값을 지정합니다.\n\n```bash\nros2 run cleany_control_bridge pose_backend_bridge --ros-args \\\n  -p map_id:=\"$CLEANY_MAP_ID\" -p device_token_file:=\"$CLEANY_DEVICE_TOKEN_FILE\"\n```\n\n로컬 odometry만 확인하려면 관측 노드의 `source:=odom`과 `odom_topic:=/odom`을\n사용합니다. 이 좌표는 map 위치로 표시하지 않습니다. 시뮬레이션은 두 노드에 모두\n`use_sim_time:=true`를 설정합니다. 위치가 멈추면 원본 TF/odom의 좌표계와 시각을 먼저\n확인하고, ROS 위치는 정상인데 Dashboard만 끊기면 bridge의 장치 인증과 URL을 확인합니다.\n자세한 계약은 [관측 제공자](../../../ros2_ws/src/cleany_telemetry/docs/interfaces.md#pose_observer)와\n[Backend adapter](../../../ros2_ws/src/cleany_control_bridge/docs/interfaces.md#pose_backend_bridge)를 따릅니다.\n\n두 노드는 다음 launch로 함께 실행할 수도 있습니다. 기본 `enable_backend=false`는\n관측만 실행합니다. 이 launch는 주행이나 localization을 시작하지 않습니다.\n\n```bash\nros2 launch cleany_bringup pose_observation.launch.py enable_backend:=true \\\n  map_id:=\"$CLEANY_MAP_ID\" device_token_file:=\"$CLEANY_DEVICE_TOKEN_FILE\"\n```\n\n### Jetson 운영 UI와 작업 승인\n\n1. `make build-dev-monitor`로 웹과 ROS 패키지를 빌드한다. 처음 구성할 때는\n   [개발환경](../development-setup.md)의 의존성과 실물 런타임 빌드를 먼저 준비한다.\n2. `make dev-monitor-start`로 사용자 systemd 서비스를 시작한다.\n   `http://\u003cJetson 주소>:8768/#manipulation`에서 관측한다.\n   `make dev-monitor-status`, `make dev-monitor-stop`으로 상태 조회와 종료를 수행한다.\n   로그는 `journalctl --user -u cleany-dev-monitor.service`에서 확인한다.\n   시작만으로 로봇 런타임이나 조작 Goal을 실행하지 않는다.\n3. 실물 동작을 사용할 때는 실행 중인 작업이 없는 상태에서 로봇별\n   `CLEANY_MANIPULATION_COLLECTION_CONFIG`, `CLEANY_FEETECH_CONTROL_CONFIG`,\n   `CLEANY_HARDWARE_MONITOR_CONFIG`를 지정하고 웹 제어를 켠다.\n\n   ```bash\n   make dev-monitor-control-on\n   make dev-monitor-control-key\n   ```\n\n4. 웹에서 운영자 이름과 조작키로 연결한다. `로봇 준비`의 토크 활성화를 확인한 뒤\n   `다음 작업 제안받기`를 선택한다. 이미지, 대상과 행동을 검토하고\n   `승인하여 1회 실행` 또는 `이 물체 건너뛰기`를 선택한다.\n   정지 물체로 설정한 `pick_return_release` 시험의 승인은 원본 관측과 물체 번호를 사용합니다.\n   제안 후 물체를 옮겼다면 새 제안을 받습니다. 그 밖의 설정은 승인 후 새 영상에서 대상을 재확인합니다.\n   다음 제안도 승인 전에는 실행하지 않는다. `물체 1개 실행`은 기존\n   `make manipulation-run`의 자동 대상 선택과 즉시 실행을 호출한다.\n5. 중단 요청 후에는 실행 기록의 실제 정지와 물체 상태를 확인한다.\n   복귀 시 그리퍼가 먼저 열리는 점을 확인하고, 차단 해제는 정지, 빈 그리퍼와\n   검토한 실행 기록의 revision을 확인한 뒤 요청한다.\n6. 유휴 상태에서 `make dev-monitor-control-off`로 관측 전용으로 되돌린다.\n   전환은 모니터만 재시작하며 로봇을 종료하거나 작업을 자동 재개하지 않는다.\n   로봇 종료는 웹의 `로봇 종료·토크 해제` 또는 기존 CLI에서 별도로 요청한다.\n\n기본 ROS domain은 `CLEANY_COLLECTION_ROS_DOMAIN_ID=0`이다. Loopback 접속은\n`ssh -N -L 8768:127.0.0.1:8768 cleany@\u003cJetson 주소>`로 터널을 연결한다.\n포그라운드 Jetson 실행은 `tools/dev-monitor run`을 사용한다.\n\n제어 활성화 시 허용된 터미널 옵션을 0600 `runtime-settings.json`에 저장한다.\n다시 활성화하면 명시한 옵션만 덮어쓰고 나머지 저장값을 유지한다. 저장값을 제거하려면\n유휴 상태에서 해당 항목을 삭제한다. 저장 경로, 인증, 중복 실행 방지와 결과 해석은\n[운영 제어 계약](../../../ros2_ws/src/cleany_dev_monitor/docs/interfaces.md#운영-제어와-상태)을 따른다.\n\n공유 인식 구성은 `CLEANY_COLLECTION_USE_EXISTING_PERCEPTION=true`와\n`CLEANY_COLLECTION_SHARED_RMW_IMPLEMENTATION`으로 선택합니다. 시작 전 읽기 전용\n준비 검사와 RPC 응답을 확인하고, 종료 시 기존 인식 제공자를 유지합니다.\n[공유 인식 계약](../../../ros2_ws/src/cleany_dev_monitor/docs/interfaces.md)을 따릅니다.\n"},"docs/implementation/how-to/phone-navigation.md":{"title":"휴대폰으로 지도 위 목표까지 이동하기","body":"# 휴대폰으로 지도 위 목표까지 이동하기\n\n저장 지도를 불러오고, 휴대폰에서 현재 위치와 목적지를 지정합니다. 이 안내는 **LiDAR 주행 구성**을 다룹니다.\n\n```mermaid\nflowchart LR\n  Stop[\"STOP / 정지 확인\"] --> Pose[\"현재 위치와 방향 지정\"]\n  Pose --> Preview[\"목표 선택 / 경로 미리보기\"]\n  Preview -->|\"이동 버튼 + 실행 허가\"| Move[\"자동 목표 실행\"]\n  Move -->|\"취소\"| Stop\n```\n\n## 1. 준비하기\n\n| 준비물 | 확인 |\n|---|---|\n| ROS 환경 | Ubuntu 22.04 / ROS 2 Humble. 호스트 실행 도구는 `ros2-humble` Distrobox 사용 |\n| 빌드 | 저장소 루트에서 `make build-hardware-mapping` 완료 |\n| 하드웨어 프로필 | 현재 장치와 포트에 맞춘 YAML. [매핑 프로필 안내](../../../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md) |\n| 저장 지도 | `map.yaml`과 그 파일이 참조하는 이미지 |\n| DDS 설정 | 현재 네트워크에 맞는 Fast DDS XML |\n| 작업 공간 | 실제 로봇 주변을 확인하고 정지 수단 확보 |\n\n이 프로필은 LiDAR 평면 장애물을 감시합니다. 높이가 다른 장애물, 팔과 카메라의 전신 충돌, 물리 E-stop의 동작을 보장하지 않습니다. [감시 범위](../../../ros2_ws/src/cleany_navigation/docs/safety.md)를 확인하세요.\n\n## 2. 실행하고 접속하기\n\n저장소 루트에서 아래 경로를 현재 환경에 맞게 바꿉니다. 출력 폴더는 이번 실행의 저장 위치입니다.\n\n```bash\npython3 tools/ros2/run-navigation \\\n  --run-root /path/to/local-data/runs/navigation/traction/YYYY-MM-DD_HHMMSS_phone-navigation \\\n  --profile /path/to/hardware-profile.yaml \\\n  --map /path/to/map.yaml \\\n  --dds-profile /path/to/fastdds.xml\n```\n\n기본 프로필은 전후·횡이동을 허용하는 `omni`입니다. 횡이동을 차단하려면 `--motion-profile longitudinal`을 추가합니다. 이 도구는 초기 위치나 이동 목표를 자동 전송하지 않습니다.\n\n휴대폰을 접속 가능한 네트워크에 연결하고 **실행 로그에 표시된 URL**을 엽니다. 주소의 `127.0.0.1`은 로봇 서버가 실행 중인 PC의 접속 가능한 IP로 바꾸고, `#token=...`은 유지하세요. 기본 포트는 `8766`입니다. 화면에서 지도가 보이는지 확인하고 STOP으로 정지 상태를 확인합니다.\n\n## 3. 현재 위치 지정하기\n\n1. **초기 위치 설정 모드**를 켭니다.\n2. 지도에서 로봇의 실제 위치를 누르고, 로봇이 바라보는 방향으로 드래그합니다.\n3. **현재 위치 지정**을 누릅니다.\n4. 위치 정합과 주행 준비 상태가 정상인지 확인합니다.\n\n초기 위치는 정지 상태에서만 설정합니다. 위치가 틀리거나 준비되지 않았다면 목표를 보내기 전에 다시 확인하세요.\n\n## 4. 목표와 경로 확인하기\n\n\u003cdiv class=\"screen-example\">\n\u003cfigure>\u003cimg src=\"../../assets/navigation/phone-preview.png\" alt=\"지도에서 이동 패널과 파란 경로 미리보기\" width=\"460\">\u003cfigcaption>합성 입력을 사용하는 UI 캡처. 이 화면은 실물 이동의 검증 결과가 아닙니다.\u003c/figcaption>\u003c/figure>\n\u003cdiv>\n\u003ch3>화면 읽기\u003c/h3>\n\u003cp>\u003cstrong>녹색\u003c/strong>은 로봇 위치, \u003cstrong>빨강\u003c/strong>은 이동 목표, \u003cstrong>파랑\u003c/strong>은 Nav2 전역 경로입니다.\u003c/p>\n\u003cp>초기 위치 설정 모드를 끄고 목적지에서 드래그하면 방향을 지정할 수 있습니다.\u003c/p>\n\u003cp>미리보기가 완료되면 빨간 목표가 계획 경로의 끝점으로 조정됩니다. 표시된 좌표와 방향을 확인하세요.\u003c/p>\n\u003cp>현재 UI는 캡처와 일부 문구가 다를 수 있습니다. 버튼과 상태는 현재 실행 화면을 기준으로 확인합니다.\u003c/p>\n\u003c/div>\n\u003c/div>\n\n지도 클릭은 `ComputePathToPose` 미리보기만 요청합니다. 구동 허가를 얻거나 속도를 발행하지 않습니다. 계획이 준비되고 주행 조건을 만족해야 **이동** 버튼이 활성화됩니다.\n\n## 5. 이동하고 멈추기\n\n| 조작 | 동작 |\n|---|---|\n| **이동** | 표시된 목표를 실행. 로봇 주변과 주행 상태 관찰 |\n| **이동 취소 / 정지** 또는 **STOP** | 자동 목표 취소와 정지 요청. 정지 완료 확인 후 수동 조종 재개 |\n| 휴대폰 화면 끄기·다른 앱으로 전환 | 수락된 자동 목표는 로봇 측 감시 아래 계속 실행 |\n| 수동 조종에서 입력 해제·화면 이탈 | 입력 만료에 따라 정지 |\n\n자동주행 중 화면을 닫는 것으로 정지를 대신하지 마세요. 위치 복구 뒤에도 이전 목표는 자동 재개하지 않습니다.\n\n## 문제가 생겼을 때\n\n| 화면·증상 | 먼저 확인할 것 |\n|---|---|\n| 지도 수신 대기 | 저장 지도 경로와 이미지, 로봇 서버와 네트워크 연결 |\n| 파란 경로가 나오지 않음 | 초기 위치, 지도 안의 목표, 장애물. 경로 오류 확인 후 목표 재선택 |\n| 이동 버튼 비활성 | 경로 미리보기 완료 여부와 위치·센서·Supervisor 준비 사유 |\n| 위치 정합 회복 중 · 감속 주행 | 위치와 지도 일치 여부. 회복되지 않으면 정지·복구하며 새 목표 필요 |\n| 자동 목표가 취소됨 | `/api/navigation/status`의 `last_input_failure`와 실행 로그 |\n| 재기동 뒤 잠금 유지 | `supervisor_operator`로 원인 확인. 원인 미상·실제 고장은 자동 해제 대상이 아님 |\n\n## 실행 옵션과 상세 규약\n\n| 바꾸려는 것 | 위치 |\n|---|---|\n| Omni / longitudinal, 슬립 재시도 | `--motion-profile`, `--slip-recovery true/false` |\n| 지도·입력·출력 경로 | `tools/ros2/run-navigation --help` |\n| 속도·footprint·계획 비용 | [경로 계획과 주행 설정](../../../ros2_ws/src/cleany_navigation/docs/planning.md#기본-튜닝과-전후진-전용-설정) |\n| 위치 정합과 복구 조건 | [위치 정합 정책](../../../ros2_ws/src/cleany_navigation/docs/localization.md) |\n| 버튼·API·취소 계약 | [휴대폰 인터페이스](../../../ros2_ws/src/cleany_teleop/docs/interfaces.md#지도-클릭-주행-명시적-선택) |\n| Nav2·안전·구동 연결 | [Navigation 구성](../../../ros2_ws/src/cleany_navigation/README.md) |\n\n실행 파일은 지정한 run의 `runtime/`과 `ros-log/`에 저장됩니다. 팀에 결과를 공유할 때는 팀이 접근할 수 있는 위치를 사용합니다.\n\n\n## Omni 주행의 슬립 복구\n\nLiDAR 전용 `lidar_navigation.launch.py`의 Omni 프로필은 `slip_recovery:=true`가\n기본입니다. `config/slip_recovery.yaml`에서 감지와 복구 시간을 조정합니다.\n`slip_recovery:=false`는 기존 기본 BT와 명령 경로를 사용합니다. 명시적 `longitudinal`\n프로필과 다른 launch에는 이 복구가 자동 적용되지 않습니다.\n\n약 1초의 LiDAR/휠 이동 비교가 2개 연속 의심이면 BT가 현재 추종을 취소하고\n감속 정지합니다. fresh odom과 감속 게이트의 0 출력으로 0.5초 연속 정지를 확인한 뒤 `Longitudinal`\n플래너와 컨트롤러로 같은 목표를 한 번 재시도합니다. 해당 목표가 종료될 때까지\n종방향 모드를 유지하며, 정지 중 신호가 사라져도 Omni로 복귀하지 않습니다.\n재시도 이후 새 비교 창에서 슬립이 다시 확인되거나 재시도가 실패하면 정지 후\n목표를 실패 처리합니다. 슬립 분기에는 costmap 초기화나 무조건적인 회전, 후진\n복구가 없습니다. 일반 탐색 실패에는 기존 기본 BT 복구를 유지합니다.\n\n재시도 플래너는 `/traction_retry/compute_path_to_pose`를 제공하는 별도\n프로세스로 실행합니다. 두 Lattice 모델이 내부 static motion table을 공유하는\n간섭을 피하고, 동일한 지도와 안전 footprint를 쓰는 별도 global costmap을 갖습니다.\n종방향 MPPI 컨트롤러는 기존 controller server의 `Longitudinal` plugin입니다.\n\n감지의 `unknown`은 정상 판정이 아닙니다. 유효한 측정이 3초 이상 없으면 정지 후\n실패합니다. 첫 측정 전에는 명령을 허용하지 않습니다. 정지 확인은 5초 제한이며,\n확인 실패도 목표 실패로 끝납니다. 센서 비교와 BT tick 주기로 인해 즉시 감지나\n물리 정지 거리를 보장하지 않습니다.\n\n명령 흐름은 `motion/cmd_vel → traction_brake → motion/traction_cmd_vel →\ncollision_monitor → navigation/safe_cmd_vel → 기존 최종 구동 소유자`입니다.\nBT 요청에 따른 감속은 충돌 검사 전에 수행합니다. 충돌 STOP과 기존 Supervisor,\nMCU 허가 및 정지 확인은 계속 우선합니다. BT heartbeat가 0.5초 또는 명령이\n0.3초 이상 끊기면 게이트는 0을 출력합니다. 수동 조종 경로에는 게이트를 삽입하지 않습니다.\n"},"docs/implementation/how-to/sensors.md":{"title":"센서 입력과 장애물 관측 확인하기","body":"# 센서 입력과 장애물 관측 확인하기\n\n카메라, LiDAR, IMU와 ToF의 입력, 좌표계와 유효 시간을 확인합니다. 장착 보정은 캘리브레이션 가이드로 이어집니다.\n\n```mermaid\nflowchart LR\n  Input[\"RGB-D · LiDAR · 관절 피드백\"] --> Time[\"촬영 시각과 frame 확인\"]\n  Time --> TF[\"TF로 좌표 변환\"]\n  TF --> Output[\"점군 · OBB · 보정 결과\"]\n  Output --> Check[\"장착 조건과 정확도 검증\"]\n```\n\n[공통 환경 준비](../running.md#공통-준비) · [검증 선택](../testing.md)\n\n## 깊이 영상 읽기\n\n![D435에서 관측한 optical depth 영상, 단위 m](../../assets/examples/d435-depth.png)\n\n색은 카메라 optical depth의 거리(m)를 나타냅니다. 이 그림만으로 바닥 위 높이나 작은 장애물 검출 성공을 판단하지 않습니다. 차체 좌표의 높이 필터를 확인하려면 TF를 적용한 점군과 비교하세요.\n\n## 실물 IMU\n\nMCU의 표준 Imu 입력에 host 고정 gyro bias와 공분산을 적용한다.\n빌드와 실행은 [IMU 안내](../../../ros2_ws/src/cleany_base_driver/docs/imu.md)를 따른다.\n\nWheel과 IMU 융합은 기존 base bringup을 종료하고 실제 장착 TF가 제공되는\n환경에서 실행한다. 같은 overlay를 사용하며 기본 `mode=shadow`는 wheel\n`odom`과 TF를 유지하고 융합 결과를 `odometry/filtered`에 발행한다.\n\n```bash\nmake build-base\nsource \"$(make -s print-install-base)/setup.bash\"\nros2 launch cleany_base_driver base_ekf.launch.py --show-args\nros2 launch cleany_base_driver base_ekf.launch.py mode:=shadow\n```\n\nAgent와 robot description은 별도로 준비한다. 이 launch는 ENABLE이나 이동\n목표를 요청하지 않는다. 융합 결과를 canonical odom으로 선택할 때는\n`mode:=canonical`로 재시작한다. [입력과 TF 계약](../../../ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md#wheel과-imu-융합)을 따른다.\n\n## ToF 근접 보호와 책상 접근\n\n[ToF 계약](../../../ros2_ws/src/cleany_tof/docs/interfaces.md)의 명령 경로와 보정 항목을 먼저\n확인합니다. 기본 프로파일은 주행을 차단합니다. 이 절차는 물리 시험 통과를 의미하지 않습니다.\n\n1. `make build-tof`를 실행합니다. 공통 navigation은 Ubuntu/Humble 환경에서\n   `make build-navigation`으로 빌드합니다. 호스트에서는 `distrobox enter --name ros2-humble\n   --no-tty --clean-path -- make build-navigation`을 사용할 수 있습니다.\n2. navigation overlay와 `make print-install-base`의 overlay를 순서대로 source합니다.\n   기존 로봇 센서, localization, base와 독립 safety evidence를 구성합니다.\n3. 공통 `cleany_navigation navigation.launch.py`에 기존 map/robot 프로필 인자와 함께\n   `tof_enabled:=true tof_params_file:=/absolute/path/to/commissioned-tof.yaml`을 전달합니다.\n4. `cleany_system_supervisor supervision.launch.py`는 `tof_required:=true`로 실행합니다.\n   실제 estop/protection evidence 인자는 기존 절차를 따릅니다. ToF 가용성만으로 하드웨어\n   estop 해제나 arm 가용성을 만들어내지 않습니다.\n5. Mission launch에 `desk_approach_enabled:=true desk_distance_m:=0.75`를 전달합니다.\n   목표는 base 원점 기준 거리이며 현장 좌석과 guard envelope에 맞게 조정합니다.\n   Mission, 두 ToF 제어 노드와 기존 안전 경로가 동일한 canonical odom을 보도록 remap합니다.\n6. 좌석 pose는 책상 전면을 바라보는 staging pose로 설정합니다. Mission이 Nav2 도착과\n   정지를 확인한 뒤 접근을 요청하며, home 복귀에는 접근을 수행하지 않습니다.\n\n`tof_driver`의 serial port는 기본적으로 공급 펌웨어 보드의 by-id 경로입니다. 다른 보드는\n해당 노드의 `port`를 별도 설정합니다. 재연결 시 64 zone, 15Hz로 재설정합니다. 별도\nteleop도 `nav2/cmd_vel` 입력을 사용하며 ToF 활성 상태에서 `cmd_vel`에 직접 발행하지 않습니다.\n\n정상 NO_RETURN은 장애물 미검출로 처리하며 RGB-D proof 없이 주행 입력을 허용합니다.\nToF 전용 coverage observer 설정과 no_return_max_*, min_valid/required_zones는 제거합니다.\n기존 head-pan depth coverage는 기존 설정에 따릅니다. 감시 ROI, 인접 검출 수, 확인/해제\n시간과 비상 거리는 ToF YAML의 조정 가능한 후보입니다. sensor_ready=false나 오래된 좌표계은\n계속 정지하며, 정상 미검출을 센서 fault로 보고하지 않습니다. 미검출이 빈 공간을 보장하지\n않으므로 기존 독립 안전 계층을 활성 상태로 유지합니다.\n\nvoxel guard의 충돌 검사와 속도 출력 기본은 `update_period_s: 0.10`(10Hz)입니다.\n이 값은 voxel 지도 갱신 주기와 별개이며 명시적 robot 프로필 override가 있으면 그 값을\n사용합니다. 주기를 조정할 때 상류 출력과 ToF의 command_timeout_s를 함께 확인합니다.\n\n## D435 장애물 미리보기\n\n실제 head TF와 카메라가 실행된 ROS 환경에서 다음 명령을 사용합니다.\n`FILTER_JSON`은 실행 폴더의 `obstacle-filter.json`, `BODY_JSON`은\n`ros2_ws/src/cleany_navigation/config/d435_fixed_body_boxes.json` 경로입니다.\n\n```bash\nros2 run cleany_navigation depth_obstacles_preview --ros-args -p filter_file:=\"$FILTER_JSON\" -p body_boxes_file:=\"$BODY_JSON\"\nros2 run rviz2 rviz2 -d tools/validation/config/d435_obstacles.rviz\n```\n\nLiDAR 아래를 제외하려면 filter JSON에 `min_base_z: 0.192`를 지정하고 미리보기 노드만 재시작합니다.\n초록 점이 장애물 후보, 주황 점이 CAD 높이의 LiDAR입니다. 원본 점군은 별도 토픽에 보존합니다.\n현재 미리보기는 Nav2 costmap과 Collision Monitor에 연결하지 않습니다.\n\n## 실물 depth local costmap 연결\n\n`tools/ros2/run-navigation`에 `--depth-params ros2_ws/src/cleany_navigation/config/depth_local.yaml`을 추가합니다. 기존 map, 프로필, DDS와 slip-recovery 선택은 유지합니다. 하위 launch의 `depth_params_file`과 hardware runtime의 `--depth-params`로 전달됩니다. 생략하면 LiDAR 전용입니다. D435 카메라와 실제 head encoder TF는 별도로 실행돼 있어야 합니다.\n\n이 overlay는 local VoxelLayer, depth 투영 노드와 기존 Collision Monitor의 depth 입력만 추가합니다. global costmap과 3D 누적 장애물 지도, voxel guard는 추가하지 않습니다. 원본 유효 광선은 제거용, LiDAR 높이 이상의 필터 점은 표시용입니다.\n\n적용 전 조종을 pause하고 MCU 정지 확인, 현재 지도와 pose를 보존합니다. 실행 관리자를 정상 종료해 logger를 마무리한 뒤 같은 설정에 overlay를 추가하여 재시작합니다. 저장한 pose는 로봇이 움직이지 않은 경우에만 초기 추정으로 복원하고 지도 정합을 확인합니다. `tools/validation/check_depth_navigation.py --output /path/to/run/state.json`으로 점군 및 costmap 상태를 기록할 수 있습니다. 실물 적용 후 위치 복원은 이 도구의 `--restore-pose /path/to/before/state.json`을 명시적으로 사용합니다.\n\n롤백은 `--depth-params`를 제거한 뒤 같은 절차로 재시작합니다. systemd 실행에서는 해당 인자를 추가한 drop-in만 제거 또는 비활성 이름으로 바꾸고 daemon-reload합니다. 카메라가 꺼진 채 depth 프로파일을 유지하면 자동주행 속도 출력은 0으로 제한됩니다.\n\n## Jetson USB 카메라 회전\n\n[호스트 설정](../development-setup.md#jetson-orin-usb-카메라-회전)을 설치하면\nDECXIN `0bda:5844` 연결마다 카메라의 UVC Roll을 `3`으로 설정합니다. 이 모듈에서 `3`은\n180도 회전이며 각도가 아닙니다. 영상 변환 프로세스를 상시 실행하지 않습니다.\n\n초기화는 USB 부모 장치의 연결 이벤트로 실행합니다. helper가 `uvcvideo`를 잠시\n분리하고 복구하면서 생기는 video node 이벤트는 다시 초기화를 요청하지 않습니다.\n`/dev/video0` 같은 번호 대신 해당 연결의 USB 장치를 지정하므로 다른 카메라로\n대체하지 않습니다.\n\n1. 캡처 프로그램을 닫고 카메라를 연결합니다.\n2. 초기화 결과를 확인한 뒤 ROS 카메라 노드나 캡처 프로그램을 시작합니다.\n\n```bash\njournalctl -b -u 'cleany-camera-orientation@*.service' --no-pager\n```\n\n정상 완료된 oneshot unit은 `inactive (dead)`로 돌아갑니다. 상시 `active` 상태인지를\n성공 조건으로 사용하지 않습니다. 장치 준비는 최대 10초 기다리고 USB 요청에도\ntimeout을 적용합니다. 실패한 unit은 자동 반복하지 않습니다. 원인을 해결한 뒤 수동으로\n다시 시작하거나 USB를 재연결합니다. 잦은 재연결이 start-rate 제한에 걸리지 않도록\nunit의 시작 횟수 제한은 사용하지 않습니다.\n\n연결된 모듈의 USB 이름을 조회할 수 있습니다.\n\n```bash\nfor device in /sys/bus/usb/devices/*; do\n  if grep -qx 0bda \"$device/idVendor\" 2>/dev/null &&\n     grep -qx 5844 \"$device/idProduct\" 2>/dev/null; then\n    printf '%s\\n' \"${device##*/}\"\n  fi\ndone\n```\n\n캡처를 닫은 상태에서 위 출력 중 대상 이름을 지정해 조회하거나 다시 적용합니다.\n예시의 `1-2.3`은 실제 출력으로 바꿉니다.\n\n```bash\nUSB_DEVICE=1-2.3\nsudo /usr/bin/python3 -I /usr/local/libexec/cleany/camera-orientation.py \\\n  --usb-device \"$USB_DEVICE\"\nsudo systemctl reset-failed \"cleany-camera-orientation@${USB_DEVICE}.service\"\nsudo systemctl start \"cleany-camera-orientation@${USB_DEVICE}.service\"\n```\n\nhelper는 이미 사용 중인 video node를 발견하면 드라이버를 분리하지 않고 일시 실패로\n종료합니다. 수동 조회도 USB 인터페이스 확보가 필요하므로 캡처를 먼저 닫습니다.\n초기화 중 카메라를 여는 경쟁을 피하도록 캡처 시작을 초기화 완료 뒤로 배치합니다.\n자동 시작하는 캡처 서비스에는 실제 USB 이름에 대한 다음 의존성을 함께 둡니다.\n\n```ini\n[Unit]\nRequires=cleany-camera-orientation@1-2.3.service\nAfter=cleany-camera-orientation@1-2.3.service\n```\n\n| 실패 | 확인과 조치 |\n|---|---|\n| 장치 준비 timeout | USB 연결과 `uvcvideo` probe 로그 확인 후 재시도 |\n| 사용 중인 video node 또는 접근 확인 실패 | 캡처 종료와 native host 실행 여부 확인 후 재시도 |\n| 지원하지 않는 Roll 범위 또는 장치 ID | 다른 기종에 적용하지 말고 해당 카메라의 제어 규약 확인 |\n| USB 분리 또는 readback 실패 | 연결을 확인하고 journal의 드라이버 복구 결과 확인 |\n"},"docs/implementation/how-to/simulation.md":{"title":"시뮬레이터 실행하기","body":"# 시뮬레이터 실행하기\n\nGazebo에서 센서와 주행을 확인하고, 시설 도구로 시험 환경을 준비합니다. MuJoCo 조작은 별도 작업 가이드를 따릅니다.\n\n```mermaid\nflowchart TD\n  Env[\"Humble 환경과 같은 DDS domain\"] --> Mode{\"실행할 대상\"}\n  Mode -->|\"주행과 센서\"| Gazebo[\"Gazebo\"]\n  Mode -->|\"팔과 물체 조작\"| Mujoco[\"MuJoCo + MoveIt\"]\n  Gazebo --> Observe[\"센서 · odom · TF 확인\"]\n  Mujoco --> Observe\n  Observe --> Run[\"시나리오 실행과 종료 확인\"]\n```\n\n[공통 환경 준비](../running.md#공통-준비) · [검증 선택](../testing.md)\n\n## Gazebo\n\n\u003cfigure class=\"visual-slot\" data-visual-id=\"gazebo-run\">\n\u003cp>\u003cstrong>시각자료 자리 · 비워 둠\u003c/strong>\u003c/p>\n\u003cfigcaption>\u003cstrong>필요한 자료:\u003c/strong> 본문 launch의 현재 Gazebo 월드와 로봇, RViz 센서 화면.\u003cbr>\u003cstrong>빈 이유:\u003c/strong> 과거 Gazebo 캡처의 모델과 실행 옵션이 현재 구성과 일치하는지 확인되지 않았습니다.\u003c/figcaption>\n\u003c/figure>\n\n1. 의존성과 실행 환경을 확인합니다.\n2. Headless base, study-cafe GUI, 전체 시설 GUI 중 하나를 실행합니다.\n\n```bash\nmake deps-gazebo\nmake check-gazebo-env\nmake sim-gazebo                 # headless base\nmake sim-gazebo-study-cafe      # study-cafe GUI; 위 실행과 별도로 사용\nmake sim-gazebo-facility        # 전체 시설 GUI; 위 실행과 별도로 사용\n```\n\nGUI renderer는 `GAZEBO_GUI_RENDER_ENGINE=ogre|ogre2`로 선택합니다. 센서 서버는 OGRE2를 사용하므로 GPU LiDAR와 camera는 headless에서도 OpenGL context가 필요합니다. 지원 환경은 Fortress/Humble입니다.\n\n3. 같은 overlay/domain의 별도 터미널에서 sensor와 odometry를 확인합니다.\n\n```bash\nros2 topic hz /clock\nros2 topic hz /scan\nros2 topic echo /odom --once\nros2 run tf2_ros tf2_echo odom base_link\n```\n\n저장 지도 주행을 연결할 때는 [Gazebo 주행 연동](../../../ros2_ws/src/cleany_gazebo_sim/docs/navigation.md)의 진입점과 설정 계약을 따릅니다.\n\nTopic 등록 이후 실제 발행, 이동, 정지를 각각 확인합니다. 실행별 sensor와 odometry 소유권은 [연동 가이드](../integration.md)를 따릅니다.\n\n## 시설 생성 도구와 종료\n\n`ros2 run cleany_gazebo_sim \u003c스크립트명> --help`로 각 도구의 입력을 확인합니다.\n\n| CLI | 출력 |\n|---|---|\n| `generate_mission_targets.py` | 접근 목표 YAML과 검증 JSON |\n| `render_layout_overlay.py` | 명시한 layout, reference image로 배치 SVG |\n| `generate_felt_texture.py` | 명시한 PNG 경로에 펠트 질감 |\n| `generate_roly_textures.py` | 명시한 폴더에 seat/back PNG |\n\n시설 reference 이미지와 입력 fixture는 실행 전에 준비하고 각 도구의 입력 경로로 지정합니다. Clone에 포함되지 않은 자료를 팀에서 사용할 경우 공유 위치와 파일 식별자를 함께 안내합니다. 목표 생성은 정적 footprint 여유를 검사하며, 전체 경로와 팔 도달성은 별도 검증이 필요합니다.\n\nLaunch는 `Ctrl-C`로 종료한 뒤 센서와 명령의 발행 중단과 해당 실행의 자식 종료를 확인합니다. 시나리오 runner의 실패, cleanup 판정은 [테스트 가이드](../testing.md)를 따릅니다.\n\n## FreeCAD 형상 미리보기\n\n`model_variant:=freecad_final`은 새 FreeCAD 파일에 저장된 정적 조립 형상입니다.\n관절이나 모터를 명령하지 않으며, RViz의 Fixed Frame은 `base_link`로 지정합니다.\n기존 동작 모델과 [미확정 값의 범위](../../../ros2_ws/src/cleany_description/docs/freecad-model.md)를\n구분합니다. 실행 중인 로봇의 `/robot_description`과 섞이지 않도록 별도 터미널과\nDDS domain에서 확인합니다.\n\n```bash\nmake build COLCON_BUILD_ARGS='--packages-select cleany_description'\nsource \"$(make -s print-install-base)/setup.bash\"\nROS_DOMAIN_ID=173 ros2 launch cleany_description description.launch.py model_variant:=freecad_final use_sim_time:=false\n```\n\n실물 ROS graph와 함께 형상을 확인하려면 `namespace:=cad_reference`와\n`frame_prefix:=cad_reference/`를 지정합니다. 모델과 관절 상태, TF 토픽은\n`/cad_reference/` 아래에 생성됩니다. RViz도 `/tf`와 `/tf_static`을 각각\n`/cad_reference/tf`, `/cad_reference/tf_static`으로 remap하고 Fixed Frame을\n`cad_reference/base_link`로 설정합니다. 실물 base와의 위치 관계는 별도 보정이\n필요하며, `freecad_final`의 팔 자세는 CAD에 저장된 기준 자세입니다.\n\n```bash\nros2 launch cleany_description description.launch.py use_sim_time:=false \\\n  model_variant:=freecad_final namespace:=cad_reference frame_prefix:=cad_reference/\n```\n\n기존 관절 모델을 표시하려면 `model_variant:=legacy_runtime`을 지정합니다.\n기존 카메라 보정 비교에는 이 선택과 `calibration_profile:=jetson_20261009`를\n함께 사용합니다. `freecad_final`에는 이전 조립체의 보정 프로파일을 적용할 수\n없습니다. 별도 MuJoCo 뷰어의 정적 기준 모델은 다음 경로입니다.\n\n```bash\npython3 -m mujoco.viewer --mjcf=ros2_ws/src/cleany_description/mjcf/cleany_freecad_final.xml\n```\n\n관절축을 확인하려면 `model_variant:=freecad_kinematic`을 선택합니다. 관절 상태의\n이름은 `cad_delta_*`이며 값은 저장된 자세에서의 변화량입니다. 별도 터미널의\n`joint_state_publisher`로 초기 변화량 0 상태를 표시할 수 있습니다.\n\n```bash\nROS_DOMAIN_ID=173 ros2 launch cleany_description description.launch.py model_variant:=freecad_kinematic use_sim_time:=false\nROS_DOMAIN_ID=173 ros2 run joint_state_publisher joint_state_publisher\n```\n\nROS와 모터 없이 동작을 확인하는 예시는 아래와 같습니다. 지정한 각도는 표시용\n입력이며 가동 한계나 실제 안전한 동작 각도가 아닙니다. Python 환경에는 기존\nCAD 도구의 NumPy, VTK와 Pillow가 필요합니다.\n\n```bash\npython3 tools/validation/preview_freecad_kinematics.py \\\n  --delta cad_delta_right_shoulder_yaw=-15 \\\n  --delta cad_delta_left_shoulder_yaw=15 \\\n  --delta cad_delta_head_pan=15 \\\n  --output /tmp/cleany-cad-motion.gif\n```\n\nGIF, 최대 변화량의 PNG와 입력·출처 JSON을 생성합니다.\n집게의 명목 연동은 `--delta cad_delta_right_gripper_cam=-25 --focus-gripper right`로\n확인할 수 있습니다. 집게 종속 관절은 해석기가 계산하며 개별 입력을 받지 않습니다.\n실물 보정과 접촉은 [집게 미확정 항목](../../../ros2_ws/src/cleany_description/docs/freecad-gripper.md)에\n따라 별도로 연결합니다. MuJoCo의 운동학 미리보기는 `cleany_freecad_kinematic.xml`의\nmocap body를 같은 FK로 배치하며 물리 actuator를 사용하지 않습니다.\n\n\n## FreeCAD MoveIt와 OctoMap 검사\n\nHumble 환경에서 `cleany_description`과 `cleany_moveit_config`를 빌드한 overlay를\n사용합니다. Jetson 기본 MoveIt의 OctoMap 플러그인과 라이브러리 버전이 다르면\nJetson에 설치된 `moveit-scene-runtime`과 `moveit-octomap-lock`의\n`local_setup.bash`를 overlay 뒤에 읽습니다.\n\n```bash\nexport ROS_LOCALHOST_ONLY=1 ROS_DOMAIN_ID=177\nros2 launch cleany_moveit_config freecad_inspection.launch.py\n```\n\n같은 환경의 별도 터미널에서 [검사 명령](../reference/testing.md#freecad-moveit와-octomap-curobo-검사)을\n실행합니다. 실물 운영 전 필요한 값은\n[FreeCAD 형상 검사 계약](../../../ros2_ws/src/cleany_moveit_config/docs/planning.md#freecad-형상-검사)에 둡니다.\n\n인덱싱한 충돌 메시를 쓰려면 NumPy, SciPy와 trimesh가 있는 Python으로\n저장소 밖의 새 디렉터리에 캐시를 생성합니다. Jetson의 cuRobo 환경도 사용할\n수 있습니다. 생성한 디렉터리를 검사 launch의 `collision_cache`에 지정합니다.\n\n```bash\ncollision_cache=\"$HOME/cleany-data/freecad-collision-indexed\"\n\"$HOME/cleany/runtime/curobo-venv/bin/python\" tools/prepare_freecad_collision_cache.py \\\n  ros2_ws/src/cleany_description \"$collision_cache\"\nros2 launch cleany_moveit_config freecad_inspection.launch.py collision_cache:=\"$collision_cache\"\n```\n\n삼각형도 줄이려면 VTK가 있는 오프라인 도구 환경에서 허용할 표면 차이를\n명시합니다. 아래 값은 검사 캐시의 수치 오차 한도이며 실물 보정값이나\n충돌 여유가 아닙니다. 경계와 비다양체 edge, Euler characteristic을 보존하고,\n원본과 결과 표면의 양방향 거리 상한을 검사합니다. 실패한 후보는 더 엄격하게\n다시 만들며, 끝까지 확인되지 않으면 해당 원본 메시를 유지합니다.\n\n```bash\npython3 tools/prepare_freecad_collision_cache.py ros2_ws/src/cleany_description \\\n  \"$HOME/cleany-data/freecad-collision-reduced\" --max-surface-error-m 0.0001 \\\n  --preserve-link cad_snapshot_LeftCameraComponents --jobs 4\n```\n\nGPU 대조에서 내부와 외부 판정이 달라지는 링크는 `--preserve-link`로 원본을\n유지합니다. 위 예시는 왼팔 카메라 묶음을 보존하며 두 URDF에 함께 적용됩니다.\n\nMoveIt 검사에서 몸통, 마스트와 마운트를 단순 입체로 바꾸고 팔과 헤드 메시를\n추가 감면하려면 기존 캐시로부터 새 캐시를 만듭니다. 생성 Python에는 NumPy,\nSciPy, trimesh와 VTK가 필요합니다. 부품 선택과 표면 상한은\n`configs/robot/freecad_moveit_collision.json`으로 관리합니다. 몸통은 채우되\n뒤쪽 상판 투입구와 그 아래 공간을 남깁니다. 원본 시각 모델과 관절 좌표는\n입력과 같으며, MoveIt에서는 `freecad_kinematic`으로 읽습니다.\n팔은 기존 분할 외피 방식으로, 마스트는 높이별 8개 외피로 생성합니다.\n카메라 하우징, 집게 구동 로드와 외측 링크도 닫힌 외피로 줄이고, 팁의\n쉘과 삽입부는 같은 링크 안에서 묶습니다. 손목 본체, 서보, 집게 상하판과\n캠 조립부는 구멍과 틈을 유지하는 표면 감면 대상으로 지정합니다.\n`preserve_collision_parts`의 접촉 패드, 운반 링크, 내측 링크와 광학 부품은\n입력 캐시 메시를 유지합니다. 결합부의 구멍과 포크 틈을 채우지 않습니다.\n외피 상한과 입구 보존 조건은\n[형상 검사 계약](../../../ros2_ws/src/cleany_moveit_config/docs/planning.md#freecad-형상-검사)을 따릅니다.\n검사 launch는 이 외피를 내부가 찬 형상으로 읽기 위해\n`cleany/CADInspectionFCL`과 detector 확인 capability를 자동 선택합니다.\n변경된 `cleany_moveit_collision`, `cleany_moveit_config`를 빌드한 overlay를\n읽은 뒤 실행합니다.\n\n```bash\nmoveit_cache=\"$HOME/cleany-data/freecad-moveit-primitives\"\nPYTHONPATH=ros2_ws/src/cleany_moveit_config python3 tools/prepare_freecad_moveit_cache.py \\\n  ros2_ws/src/cleany_description \"$HOME/cleany-data/freecad-collision-reduced\" \"$moveit_cache\" --jobs 4\nros2 launch cleany_moveit_config freecad_inspection.launch.py collision_cache:=\"$moveit_cache\"\n```\n\ncuRobo의 정적 mesh world는 링크별 합치기를 미리 수행할 수 있습니다.\n같은 overlay를 읽고 cuRobo 환경에서 아래 명령으로 별도 캐시를 만듭니다.\n이 캐시에는 현재 CAD 저장 자세가 들어가며 관절 움직임을 표현하지 않습니다.\n단순 입체와 추가 감면을 함께 반영하려면 위에서 만든 `moveit_cache`를 입력합니다.\n박스는 기본 cuboid로 저장합니다. 박스를 삼각형으로 변환한 성능 대조 캐시가\n필요하면 `--write-world-cache`와 함께 `--mesh-boxes`를 지정합니다.\n\n```bash\npython3 tools/validation/check_freecad_curobo.py ros2_ws/src/cleany_description \\\n  --collision-cache \"$moveit_cache\" \\\n  --write-world-cache \"$HOME/cleany-data/freecad-curobo-world\"\npython3 tools/validation/check_freecad_curobo.py ros2_ws/src/cleany_description \\\n  --world-cache \"$HOME/cleany-data/freecad-curobo-world\"\n```\n\ncuRobo 검사 도구는 캐시 형상에서 거리 검색 범위를 계산합니다. 외부 solver에\n연결할 때도 manifest의 `required_mesh_query_distance_m`을 적용하는\n[검사 계약](../../../ros2_ws/src/cleany_moveit_config/docs/planning.md#freecad-형상-검사)을 따릅니다.\n\n## 공통 CAD 미리보기와 파지 프로파일\n\n`tools/robot-model check`는 설치된 CAD와 manifest의 일치 여부를 검사한다.\n`tools/robot-model preview`는 CAD 표시와 피드백 모니터링을 시작하며,\n`tools/robot-model moveit`은 궤적 실행을 끈 상태에서 MoveIt을 시작한다.\n[공통 CAD 런타임](../../../ros2_ws/src/cleany_description/docs/runtime-model.md)에 모델 갱신과 상태 토픽을 설명한다.\n\n실물 파지의 CAD 바인딩은 `CLEANY_ROBOT_STATE_PROFILE`에\n`configs/robot/cad_grasp.json`을 명시하거나 `tools/left-grasp`로 선택한다.\n로봇별 보정 파일과 수거, Feetech 제어, 모션 감시 설정은 운영자가 제공한다.\n`configs/robot/collection_cad.json`은 시운전 승인 전의 설정 예시다.\n이미 실행 중인 RGB-D와 인식을 쓰는 경우에는\n`CLEANY_COLLECTION_USE_EXISTING_PERCEPTION=true`와 운영 DDS 설정을 사용한다.\n자세한 조건은 [공유 인식과 CAD 파지](../../../ros2_ws/src/cleany_skill_executor/docs/shared-grasp-policy.md)를 따른다.\n"},"docs/implementation/index.md":{"title":"Cleany 개발 문서","body":"# Cleany 개발 문서\n\n\u003cdiv class=\"hero\">\n\u003cdiv>\n\u003cp class=\"eyebrow\">ROBOT SOFTWARE / ROS 2 HUMBLE\u003c/p>\n\u003cp class=\"hero-title\">구조를 보고.\u003cbr>로봇을 실행하고.\u003cbr>상태를 확인하세요.\u003c/p>\n\u003cp>주행과 매핑, 인식과 조작, MCU 제어, 시뮬레이션과 관측을 연결하는 프로젝트 문서입니다.\u003c/p>\n\u003ca class=\"button\" href=\"running.md\">실행할 작업 선택 →\u003c/a>\n\u003ca class=\"secondary\" href=\"development-setup.md\">처음 환경 준비하기\u003c/a>\n\u003c/div>\n\u003c/div>\n\n## 작업에서 시작하기\n\n\u003cdiv class=\"cards\">\n\u003ca class=\"card\" href=\"how-to/simulation.md\">\u003cspan class=\"card-number\">01 / SIMULATE\u003c/span>\u003cstrong>가상 로봇 실행\u003c/strong>\u003cspan>Gazebo 환경과 센서, 주행 확인\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/mapping.md\">\u003cspan class=\"card-number\">02 / MAP &amp; NAVIGATE\u003c/span>\u003cstrong>지도와 주행\u003c/strong>\u003cspan>LiDAR 지도 생성·저장, 목표 주행\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/sensors.md\">\u003cspan class=\"card-number\">03 / PERCEIVE\u003c/span>\u003cstrong>센서와 인식\u003c/strong>\u003cspan>RGB-D, LiDAR, IMU와 ToF 관측\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/manipulation.md\">\u003cspan class=\"card-number\">04 / MANIPULATE\u003c/span>\u003cstrong>관찰·계획·조작\u003c/strong>\u003cspan>물체 선택, MoveIt 계획, Mock·MuJoCo 실행\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/base.md\">\u003cspan class=\"card-number\">05 / CONTROL\u003c/span>\u003cstrong>구동과 펌웨어\u003c/strong>\u003cspan>MCU 연결, 휠 피드백, STOP 확인\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"how-to/monitoring.md\">\u003cspan class=\"card-number\">06 / OBSERVE\u003c/span>\u003cstrong>기록과 상태 관측\u003c/strong>\u003cspan>Logger, Monitor와 얼굴 디스플레이\u003c/span>\u003c/a>\n\u003c/div>\n\n## 세부 작업 바로가기\n\n| 필요한 작업 | 안내 |\n|---|---|\n| 처음 설치·빌드 | [개발환경](development-setup.md) |\n| 휴대폰으로 목표 주행 | [화면으로 따라 하기](how-to/phone-navigation.md) |\n| 외부 요청과 Mission 연결 | [Mission Runtime](how-to/mission.md) |\n| 카메라·헤드·ToF 보정 | [캘리브레이션](calibration.md) |\n| 변경한 코드 검증 | [검사 선택](testing.md) |\n\n## 구조에서 찾아보기\n\n| 궁금한 것 | 문서 |\n|---|---|\n| 명령과 데이터가 어떻게 연결되는가? | [시스템 연결](integration.md) |\n| 각 패키지가 무엇을 맡는가? | [기능별 패키지 지도](packages.md) |\n| 토픽·서비스·액션의 타입과 방향은? | [ROS 인터페이스](ros-interfaces.md) |\n| 로봇 소프트웨어 개념부터 배우려면? | [학습 가이드](../guide/index.html) |\n| 제품 범위와 설계 결정은? | [팀 KB](../cleany-docs/README.md) |\n\n실물·시뮬레이션·합성 입력은 각 문서에서 구분합니다. 기능이 존재하거나 자동 검사가 통과한 것과 실물 성능이 검증된 것은 구분해서 확인합니다.\n"},"docs/implementation/integration.md":{"title":"연동과 계약","body":"# 연동과 계약\n\n\n아래 연결 흐름은 실제 실행 경로와 미구현 경계를 구분합니다.\n\n| 살펴볼 경계 | 상세 안내 |\n|---|---|\n| Mission·Supervisor·Backend | [Mission 연결](how-to/mission.md) |\n| 센서·SLAM·주행 | [매핑](how-to/mapping.md), [Navigation 구성](../../ros2_ws/src/cleany_navigation/README.md) |\n| 관측·계획·조작 | [조작 경로 선택](how-to/manipulation.md) |\n| MCU·휠·오도메트리 | [베이스](how-to/base.md) |\n| 저장·화면·진단 | [관측과 기록](how-to/monitoring.md) |\n\n이 문서는 연결 흐름과 각 계약의 소유 위치를 안내합니다. 제품 책임과 안전 원칙은 [KB Technical](../cleany-docs/README.md), 정확한 wire type과 실행 옵션은 현재 코드를 기준으로 확인합니다.\n\n## 연결 흐름\n\n```mermaid\nflowchart TB\n    subgraph Cloud[\"외부 control-plane\"]\n        Gateway[\"Backend Gateway\u003cbr/>대기열과 배차\"]\n    end\n    subgraph Runtime[\"현재 Mission 실행 경로\"]\n        Bridge[\"control_bridge\u003cbr/>WebSocket ↔ ROS\"]\n        Mission[\"Mission Runtime\u003cbr/>수락 / 실행\u003cbr/>영속 결과\"]\n        Nav[\"Navigator adapter\u003cbr/>Nav2\"]\n        Safety[\"직렬 안전 경로\"]\n        Base[\"활성 base backend\"]\n        Manip[\"Manipulation transport\"]\n        Sup[\"System Supervisor\u003cbr/>가용성 / 허가 / 복구 조정\"]\n        Evidence[\"Safety adapter\u003cbr/>독립 안전 증거\"]\n    end\n    Peer[\"Python Mock 조작 서버 / 별도 실행 서버\"]\n    Gateway \u003c-->|\"요청 / 상태 / 결과\"| Bridge\n    Bridge \u003c--> Mission\n    Mission --> Nav --> Safety --> Base\n    Mission --> Manip --> Peer\n    Sup \u003c-->|\"lease / 정지 요청과 확인\"| Mission\n    Evidence --> Sup\n    subgraph Grasp[\"별도 Scene / Grasp 경로\"]\n        RGBD[\"RGB-D snapshot\"] --> Scene[\"Scene / OBB\"]\n        Scene --> Candidates[\"Grasp 후보 생성\"]\n        Candidates --> Select[\"MoveIt 도달성 선택\u003cbr/>plan-only\"]\n    end\n```\n\n실선은 현재 연결 경로입니다. Mission은 lifecycle과 최종 결과를, Backend는 대기열과 배차를 관리합니다. 감독 모드(`supervision_mode=required`)에서는 System Supervisor가 시스템 Fault와 Capability를 판단하고, Mission은 Supervisor lease가 있을 때만 움직이며 정지 완료는 Mission이 확인합니다. Safety adapter는 증거를 보고할 뿐 독립 안전 계층이 아닙니다.\n\n`grasp/select_reachable`은 plan-only 후보 선택입니다. Trajectory 실행과 수거 완료는 별도 단계이며, 외부 조작 실행 서버와 MuJoCo 접근 데모도 서로 다른 실행 경로입니다.\n\n## Robot interface의 예정 경계\n\n```mermaid\nflowchart TB\n    subgraph Goal[\"설계 목표 / 공통 backend adapter는 아직 미구현\"]\n        Consumer[\"Mission / Skill\u003cbr/>공통 robot port\"]\n        Interface[\"robot_interface 경계\"]\n        Mock[\"Mock adapter\"]\n        Sim[\"Sim adapter\"]\n        Real[\"Real adapter\"]\n        Consumer -.-> Interface\n        Interface -.-> Mock\n        Interface -.-> Sim\n        Interface -.-> Real\n    end\n```\n\n점선은 예정된 공통 adapter 구조입니다. 공통 Mock/Sim/Real adapter는 아직 미구현입니다. 실물 상태 조회와 제어 가드는 [cleany_robot_interface](../../ros2_ws/src/cleany_robot_interface/docs/interfaces.md)가 제공하며, 현재 구체적인 adapter는 [`cleany_mission_manager/adapters/`](../../ros2_ws/src/cleany_mission_manager/cleany_mission_manager/adapters)에 있습니다. 하드웨어 좌표계와 안전 한계는 adapter와 설정이 소유합니다.\n\n설계 경계의 근거는 KB의 [ROS 2 Software Architecture](\u003c../cleany-docs/20_TECHNICAL/11 - ROS 2 Software Architecture.md>)에서 확인합니다.\n\n## 노드별 통신 목록\n\n발행, 구독, 서비스와 액션의 방향, 타입, QoS와 조건은 [ROS 인터페이스 색인](ros-interfaces.md)에서 찾습니다. 각 패키지의 `docs/interfaces.md`가 노드별 표를 관리합니다. 아래 계약 원본은 통신의 의미와 안전 규칙을 설명합니다.\n\n## 계약 원본\n\n| 경계 | 문서와 원본 |\n|---|---|\n| Mission 수락, 중복, 취소, 복구, Gateway | [Mission](../../ros2_ws/src/cleany_interfaces/docs/mission.md) |\n| 시스템 가용성, 실행 허가, 복구 조정, 운영자 reset | [System Supervisor](../../ros2_ws/src/cleany_system_supervisor/docs/supervision.md) |\n| 독립 안전 증거 보고 | [Safety adapter](../../ros2_ws/src/cleany_safety_adapter/docs/interfaces.md) |\n| Gazebo와 Mock 조작 프로필, fixture | [Mock 연결](../../ros2_ws/src/cleany_mission_manager/docs/manipulation-mock-integration.md) |\n| Scene, Grasp snapshot/frame/후보 | [Scene와 Grasp](../../ros2_ws/src/cleany_interfaces/docs/scene-and-grasp.md) |\n| Manipulation ID, timeout, 중복, 결과 | [Manipulation](../../ros2_ws/src/cleany_interfaces/docs/manipulation.md) |\n| 공통 base Twist | [Mobile base](../../ros2_ws/src/cleany_interfaces/docs/mobile-base.md) |\n| ROS driver, odometry, 구동 허가 | [Base driver](../../ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md) |\n| ROS↔MCU wheel protocol | [Protocol v2](../../ros2_ws/src/cleany_base_interfaces/docs/protocol.md) |\n| Gazebo와 Navigation 연결 | [주행 연동](../../ros2_ws/src/cleany_gazebo_sim/docs/navigation.md) |\n| Navigation 경로 계획과 주행 제어 | [Planning](../../ros2_ws/src/cleany_navigation/docs/planning.md) |\n| Navigation 위치 정합과 복구 | [Localization](../../ros2_ws/src/cleany_navigation/docs/localization.md) |\n| Navigation 직렬 안전, 관측, 정지 | [Safety](../../ros2_ws/src/cleany_navigation/docs/safety.md) |\n| Robot model, 좌표, 형상 | [Model](../../ros2_ws/src/cleany_description/docs/model.md) |\n| joint, TCP, MoveIt 그룹 | [Planning](../../ros2_ws/src/cleany_moveit_config/docs/planning.md) |\n| MuJoCo backend, 시간, sensor | [Backends](../../ros2_ws/src/cleany_mujoco_sim/docs/backends.md) |\n| Logger ROS 제어와 상태 | [인터페이스](../../ros2_ws/src/cleany_logger/docs/interfaces.md) |\n| Logger 저장, 세션, 시간과 원본 | [기록 데이터](../../ros2_ws/src/cleany_logger/docs/data.md) |\n| Monitor 수집, HTTP, 화면과 stale | [관측 데이터](../../ros2_ws/src/cleany_dev_monitor/docs/data.md) |\n| Calibration 좌표계, 동기화, dataset | [Frames and data](../../ros2_ws/src/cleany_handeye_calibration/docs/frames-and-data.md) |\n\n메시지 필드는 [cleany_interfaces](../../ros2_ws/src/cleany_interfaces)와 [cleany_base_interfaces](../../ros2_ws/src/cleany_base_interfaces)의 `.msg/.srv/.action`을 기준으로 확인합니다. 위 reference는 필드 목록을 복제하지 않고 단위, 소유권, 오류, 멱등성을 설명합니다.\n\n## 실행과 설정\n\n실행 절차는 [RUNNING](running.md), 시험 선택은 [TESTING](testing.md)를 따릅니다.\n\n| 영역 | 설정 원본 |\n|---|---|\n| Mission deadline, port, 정책 | [runtime.yaml](../../ros2_ws/src/cleany_mission_manager/config/runtime.yaml) |\n| Supervisor Fault, Capability, deadline, 신뢰 publisher | [system_supervisor.yaml](../../ros2_ws/src/cleany_system_supervisor/config/system_supervisor.yaml) |\n| 좌석 ID→map pose | [study_cafe_targets.yaml](../../ros2_ws/src/cleany_mission_manager/config/study_cafe_targets.yaml) |\n| ToF, 근접 제동과 책상 접근 | [ToF 계약](../../ros2_ws/src/cleany_tof/docs/interfaces.md) |\n| Navigation | [config](../../ros2_ws/src/cleany_navigation/config) |\n| Grasp predictor | [anygrasp.yaml](../../ros2_ws/src/cleany_grasping/config/anygrasp.yaml) |\n| 후보 선택 | [grasp_selection.yaml](../../ros2_ws/src/cleany_skill_executor/config/grasp_selection.yaml) |\n| 실물, mock base | [Base driver config](../../ros2_ws/src/cleany_base_driver/config) |\n\n| 조건 | 연동 규칙 |\n|---|---|\n| Simulation 접근 목표 | Dock, 팔 도달성, 실환경 좌표는 별도 검증 |\n| 초기 `base_hardware.yaml` | 바퀴를 띄운 시험용; 바닥 주행은 별도 허가 |\n| 한 실행의 명령과 위치 정보 | 명령원과 canonical odom/TF 소유자를 각각 하나만 유지 |\n| 재연결, 재시작 | Cached motion과 미션을 자동 재개하지 않음 |\n\n외부 Backend의 schema, 인증, media 정책은 별도 control-plane 저장소가 관리합니다.\n\n## 실물 매핑과 휴대폰 조종\n\n- [휴대폰 조종 계약](../../ros2_ws/src/cleany_teleop/docs/interfaces.md)\n- [매핑 세션과 저장](../../ros2_ws/src/cleany_navigation/docs/mapping.md)\n- [실물 구성과 보정 프로필](../../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md)\n\n## 로컬 얼굴 디스플레이\n\n로봇의 미션과 수거 실행 상태를 표시하는 전용 앱은 제어 경로와 독립적으로 구독합니다. [디스플레이 인터페이스](../../ros2_ws/src/cleany_display/docs/interfaces.md)에 상태 매핑, QoS, 연결 단절과 배터리 데이터 만료 규칙이 있습니다.\n\n실물 수거, 팔 복귀와 복구는 [실행 계약](../../ros2_ws/src/cleany_skill_executor/docs/physical-collection.md)과 [BT 인터페이스](../../ros2_ws/src/cleany_manipulation_bt/docs/interfaces.md)를 따릅니다.\n"},"docs/implementation/packages.md":{"title":"기능별 패키지 지도","body":"# 기능별 패키지 지도\n\n\n패키지 이름보다 작업 영역에서 시작하세요. 각 링크는 역할과 실행 조건, 인터페이스 또는 상세 설정으로 이어집니다.\n\n| 영역 | 구성과 실행 | 상세 계약 |\n|---|---|---|\n| 매핑·주행 | [Navigation](../../ros2_ws/src/cleany_navigation/README.md), [Bringup](../../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md) | [계획](../../ros2_ws/src/cleany_navigation/docs/planning.md), [매핑](../../ros2_ws/src/cleany_navigation/docs/mapping.md), [안전](../../ros2_ws/src/cleany_navigation/docs/safety.md) |\n| 인식·파지 후보 | [Perception](../../ros2_ws/src/cleany_perception/docs/runtime.md), [Grasping](../../ros2_ws/src/cleany_grasping/docs/predictors.md) | [관측 계약](../../ros2_ws/src/cleany_interfaces/docs/observation-contracts.md), [Scene·Grasp](../../ros2_ws/src/cleany_interfaces/docs/scene-and-grasp.md) |\n| 조작 실행 | [Skill Executor](../../ros2_ws/src/cleany_skill_executor/docs/manipulation.md), [MuJoCo BT](../../ros2_ws/src/cleany_manipulation_bt/README.md) | [실행 계약](../../ros2_ws/src/cleany_manipulation_bt/docs/execution-contract.md), [MoveIt](../../ros2_ws/src/cleany_moveit_config/docs/planning.md) |\n| Mission·허가 | [Mission](../../ros2_ws/src/cleany_mission_manager/docs/manipulation-mock-integration.md), [Supervisor](../../ros2_ws/src/cleany_system_supervisor/docs/supervision.md) | [미션 계약](../../ros2_ws/src/cleany_interfaces/docs/mission.md), [Safety adapter](../../ros2_ws/src/cleany_safety_adapter/docs/interfaces.md) |\n| Host·Backend 연결 | [Control bridge](../../ros2_ws/src/cleany_control_bridge/docs/interfaces.md) | [로봇 관측](../../ros2_ws/src/cleany_telemetry/docs/interfaces.md) |\n| 구동·펌웨어 | [Base driver](../../ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md), [ESP32](../../esp32/README.md) | [Wheel protocol](../../ros2_ws/src/cleany_base_interfaces/docs/protocol.md), [Wheel odometry](../../ros2_ws/src/cleany_base_odometry/docs/interfaces.md) |\n| 센서·보정 | [IMU](../../ros2_ws/src/cleany_base_driver/docs/imu.md), [ToF](../../ros2_ws/src/cleany_tof/docs/interfaces.md), [Hand-eye](../../ros2_ws/src/cleany_handeye_calibration/docs/offline-tools.md) | [좌표](../../ros2_ws/src/cleany_handeye_calibration/docs/frames-and-data.md) |\n| 모델·시뮬레이션 | [Robot model](../../ros2_ws/src/cleany_description/docs/model.md), [Gazebo](../../ros2_ws/src/cleany_gazebo_sim/docs/interfaces.md), [MuJoCo](../../ros2_ws/src/cleany_mujoco_sim/docs/scenes.md) | [Model runtime](../../ros2_ws/src/cleany_description/docs/model-runtime.md), [Backend](../../ros2_ws/src/cleany_mujoco_sim/docs/backends.md) |\n| 기록·관측 | [Logger](../../ros2_ws/src/cleany_logger/docs/runtime.md), [Monitor](../../ros2_ws/src/cleany_dev_monitor/docs/data.md), [Display](../../ros2_ws/src/cleany_display/docs/interfaces.md) | [Logger data](../../ros2_ws/src/cleany_logger/docs/data.md), [Monitor API](../../ros2_ws/src/cleany_dev_monitor/docs/interfaces.md) |\n\n패키지별 목록은 사이드 메뉴에서도 찾을 수 있습니다. 모든 노드가 동시에 실행되는 것은 아니므로 실제 구성은 [시스템 연결](integration.md)에서 확인하세요.\n"},"docs/implementation/reference/testing.md":{"title":"테스트 상세 참조","body":"# 테스트 상세 참조\n\n명령은 저장소 루트의 Humble/Fortress 환경에서 실행합니다. 변경 범위를 확인한 뒤 가장 작은 관련 검사부터 선택합니다. Make target의 실제 동작은 [Makefile](../../../Makefile)을 기준으로 확인합니다.\n\n## 검사 선택\n\n```mermaid\nflowchart TB\n    Change{\"바뀐 경계\"}\n    Change -->|\"순수 logic / 도구\"| Unit[\"해당 core / host test\"]\n    Change -->|\"ROS type / manifest / launch\"| Package[\"관련 package build + test\"]\n    Change -->|\"여러 package 연결\"| ROS[\"합성 ROS runtime 검사\"]\n    Change -->|\"센서 / 주행 / 조작\"| Sim[\"해당 simulator runtime 검사\"]\n    Change -->|\"UI\"| UI[\"served app + refresh / reconnect / replay\"]\n    Change -->|\"문서\"| Docs[\"링크 / 경로 / Make dry-run / KB 무결성\"]\n    Unit --> Evidence[\"실행 조건과 결과 원본 보존\"]\n    Package --> Evidence\n    ROS --> Evidence\n    Sim --> Evidence\n    UI --> Evidence\n    Docs --> Evidence\n```\n\n아래 표에서 변경 범위에 맞는 명령을 선택합니다. Simulator, mock 통과는 해당 입력과 backend의 증거이며, 실물 검증은 별도로 수행합니다.\n\n| 변경 범위 | 명령 | 확인 범위 |\n|---|---|---|\n| 전체 ROS workspace | `make test` | build, colcon package test와 결과 집계 |\n| Mission, Gateway core | `make test-mission-core` | ROS 없는 lifecycle, 영속성, 중복, 재전송 |\n| Mock 조작 core | `make test-manipulation-core` | 서버 실행, 취소, 영속 기록과 모니터 |\n| Mission과 Mock Action | `make test-mission-mock BASE_TEST_ROS_DOMAIN_ID=186` | 공통 타입, Action, 조회, 취소와 재시작; 주행은 Mock |\n| Gazebo와 Mock Action | `make test-gazebo-manipulation BASE_TEST_ROS_DOMAIN_ID=186` | Nav2 도착과 정지, 두 수거, 추가 빈 관측과 보고 |\n| Mission ROS 설치, 연동 | `make test-mission-runtime` | 관련 package build/test |\n| Supervisor core | `make test-supervision-core` | ROS 없는 Fault, 허가, 복구, 영속성, Runtime 감독 port, 안전 증거 |\n| Supervisor와 Runtime 연동 | `make test-supervision` | Supervisor ROS graph와 실제 Runtime, base driver, safety adapter, lifecycle 복구의 E2E; 센서, Nav2와 안전 하드웨어는 합성. 장애→정지 지연을 `$(CLEANY_DATA_ROOT)/runs/supervision/latency.json`에 기록 |\n| Navigation core, plugin | `make test-navigation` | Python core와 C++ plugin |\n| 합성 Navigation runtime | `make test-navigation-runtime` | ROS lifecycle, goal, 취소, sensor 단절과 보정 CAD/시뮬레이션 모델 선택 경계 |\n| Gazebo, Navigation | `make test-gazebo` | package 검사와 C++ plugin; 선택 runtime은 제외 |\n| Gazebo sensor runtime | `make test-gazebo-nav-runtime` | 실제 simulator의 sensor, odom, TF |\n| 시설 목표 생성 | `make test-gazebo-facility-tools` | simulator 없는 ID, 여유, 제거 의자 처리 |\n| MuJoCo | `make test-mujoco` | scene loader; 모든 조작 runtime을 뜻하지 않음 |\n| Mock Manipulation Action | `make test-manipulation` | ROS Action, 취소, 조회와 재시작 복구 |\n| MuJoCo BT 경계 | `make test-manipulation-bt` | native BT, Action, 관련 인식과 수거 회귀; 실제 물리 수거 성공은 별도 |\n| Hand-eye 경계 | `make test-handeye` | description, MuJoCo, MoveIt, calibration |\n| Base ROS | `make test-base` | interface, driver, odometry; mock MCU |\n| IMU 고정 보정 | `make test-imu-runtime` | 기존 계수 적용 core, 합성 IMU 각속도와 가속도 전달, 오류와 수신 회복 |\n| Wheel/IMU EKF | `make test-base-ekf` | mock wheel, 합성 IMU, covariance에 따른 융합, 장착 회전 변환과 실제 TF 발행자 |\n| ESP32 준비, motor core | `make test-micro-ros-setup test-motor-core` | Python 준비 도구와 장치 없는 C++ |\n| Logger | `make test-logger` | CLI 정책 편집과 종료 코드, 기록 정책, 읽기 전용 archive, 디렉터리 독점, 세션과 복구 경계 |\n| Monitor와 Logger | `make test-dev-monitor` | Logger 검사와 ROS 수집, 저장, HTTP와 UI 데이터 경계 |\n| Telemetry | `make test-telemetry` | odom relay |\n| CI 준비 도구 | `make test-ci-tools` | 의존성 이미지 무효화, build context와 명령 전달 |\n| Jetson USB 카메라 초기화 | `make test-camera-orientation` | 장치 식별, USB 제어와 복구, 설치 경로, unit과 udev 규칙; 실제 장치는 열지 않음 |\n\nFedora에서는 native ROS target을 Humble Distrobox에서 실행합니다. `test-micro-ros-setup`, `test-motor-core`는 Makefile의 `BASE_EXEC`가 환경을 선택합니다.\n\nCI는 `PYTEST_DISABLE_PLUGIN_AUTOLOAD=1`로 runtime 의존성이 설치한 외부 pytest plugin의 자동 로드를 끕니다. 프로젝트의 `conftest.py`와 pytest 기본 plugin은 유지하며, 로컬에서는 `PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 make test`로 같은 설정을 적용합니다.\n\n`make test`는 package test가 실패해도 `colcon test-result --verbose`로 실패 상세를 출력하고 실패 상태를 반환합니다.\n\n## CI 실행과 재사용\n\nCI는 Ubuntu 22.04 amd64에서 전체 workspace 검사, ESP32 motor core와 합성 Navigation runtime을 실행합니다. 베이스의 pytest는 colcon에 직접 등록하며 전체 workspace 검사에서 한 번 실행합니다. Navigation runtime은 같은 실행에서 이미 빌드한 workspace를 사용합니다. Gazebo 환경 점검과 `cleany_gazebo_sim` 패키지 검사를 포함하며, 실제 시뮬레이터를 실행하는 Gazebo runtime은 별도 명시 검사입니다.\n\n전체 빌드 이후 검사를 아래 단계로 분리합니다. 한 검사 단계가 실패해도 빌드가 성공했다면 나머지 독립 검사를 실행합니다. 주요 패키지와 runtime 검사는 실패 표시를 유지하면서 후속 검사를 계속 실행합니다. UI와 카메라 검사에 사용하는 `continue-on-error`도 마지막 집계에서 실제 실패로 반영합니다. 마지막 집계는 실패, 중단과 결과 누락을 모두 실패로 처리합니다.\n\nCI는 실시간 mock MCU watchdog을 사용하는 `cleany_base_driver` 검사를 단독으로 먼저 실행합니다. 나머지 패키지는 runner CPU 수에 따라 최대 4개까지 병렬 실행합니다. 패키지 내부의 CTest는 순차 실행하고 BLAS와 OpenMP thread는 하나로 제한해 중첩 병렬화를 막습니다. 빌드는 기존 병렬 설정을 유지하며, 별도 ROS runtime은 workspace 검사가 끝난 뒤 실행합니다.\n\n각 패키지는 ROS domain, ROS 로그와 임시 디렉터리, Gazebo transport partition을 분리합니다. 기본 domain은 40–99를 사용하고, 사례별 domain은 ToF에 10–25, 베이스 EKF에 26–28, Supervisor에 190–224를 배정합니다. 테스트가 고정값이나 무작위 domain을 선택하던 경우에는 `CLEANY_TEST_ROS_DOMAIN_ID`를 우선 사용합니다. TCP 서버 검사는 OS가 선택한 빈 포트를 사용합니다.\n\n| 단계 | 범위 |\n|---|---|\n| ui / camera | 조작 UI 빌드와 입력 처리, 장치 없는 USB 카메라 초기화 검사 |\n| environment | 도구, Pillow 이미지 API, 의존성 버전과 시뮬레이터 환경 |\n| build | 전체 workspace 컴파일과 설치 |\n| workspace | 전체 패키지 병렬 실행과 실패 집계 |\n| navigation | Navigation 패키지 결과 묶음 |\n| manipulation | Skill executor와 manipulation BT 결과 묶음 |\n| workspace-rest | 위 그룹에 없는 모든 패키지 결과; 새 패키지도 자동 포함 |\n| motor | ESP32 motor core |\n| ros-runtime | 합성 ROS 통합 검사 |\n\n[workspace_tests.py](../../../tools/ci/workspace_tests.py)는 전체 패키지, 그룹별 선택 목록과 명시적 제외 목록을 보존합니다. 제외 사유는 [workspace_test_exclusions.json](../../../tools/ci/workspace_test_exclusions.json)에서 관리합니다. `checks/workspace/schedule.json`에 동시 실행 수, 패키지별 시작과 종료 시각, 격리 환경을 기록하며 상세 로그와 진단은 `checks/\u003c그룹>/packages/`에 둡니다. 그룹별 시간은 병렬 실행 기간이 겹치므로 합산하지 않습니다. 마지막 집계에서 세 그룹의 합집합이 명시적 제외 목록을 뺀 전체 패키지와 같은지 확인하고, 중복이나 추가 누락을 실패로 처리합니다. `cleany_manipulation_bt`는 `test/test_*.py`를 파일별 CTest 검사로 등록합니다. DDS Action runtime은 MuJoCo/Jetson 서버별로 분리하며 각 실행에 60초 제한을 적용합니다. 개별 Action 응답과 종료 대기 조건은 기존 테스트가 검사합니다.\n\n[check.py](../../../tools/ci/check.py)는 검사별 명령, 커밋과 미커밋 변경 여부, 경과 시간, 로그와 종료 상태를 `checks/\u003c단계>/`에 저장합니다. Python 검사가 40초 동안 끝나지 않으면 pytest faulthandler가 스택을 출력합니다. 자식 프로세스가 45초 이상 유지되면 해당 프로세스 상태와 C++ 스레드 스택을 수집합니다. GDB 수집 자체는 5초로 제한하고, 실패 정보도 보존합니다. 전체 단계 제한을 넘기면 해당 검사 process group과 관찰한 자식 프로세스를 종료합니다. ROS launch가 별도 session을 만든 경우도 PID와 시작 시각을 대조해 정리합니다.\n\nMPPI 단위 검사는 실제 costmap executor의 시작을 확인한 뒤 진행합니다. 이는 짧은 검사 종료 시 Humble `NodeThread`의 시작과 취소가 엇갈리는 상황을 막으며 비용 계산이나 기대값을 변경하지 않습니다.\n\n로컬에서 특정 검사를 같은 방식으로 실행할 수 있습니다.\n\n```bash\npython3 tools/ci/check.py --root /path/to/ci-results run navigation \\\n  --kind contract --timeout 600 -- make test-navigation\n```\n\n동시 실행 수를 지정해 전체 패키지를 검증하려면 빌드한 workspace를 source한 뒤 실행합니다. `--workers 1`로 같은 검사를 순차 실행할 수 있습니다.\n\n```bash\nsource \"$CLEANY_BUILD_ROOT/install/setup.bash\"\ncd ros2_ws\npython3 ../tools/ci/workspace_tests.py all --workers 4\n```\n\nCI 환경에는 스택 수집용 GDB와 컨테이너 내부 프로세스 추적 권한이 필요합니다. Runner의 GDB와 전용 라이브러리를 읽기 전용으로 연결하며 고정 ROS 이미지의 라이브러리는 교체하지 않습니다. 진단 도구의 버전은 `debugger-version.txt`에 남깁니다. 테스트 결과는 캐시하지 않으며, 재시도로 첫 실패를 성공으로 바꾸지 않습니다.\n\n| 재사용 대상 | 갱신 조건 | 검증 경계 |\n|---|---|---|\n| GHCR 의존성 이미지 | 모든 `package.xml`, rosdep YAML, `containers/ci/`, 이미지 준비 도구, platform 변경 | ROS, apt, pip 의존성만 포함하며 응용 소스와 빌드 결과는 포함하지 않음 |\n| ccache | compiler 내용, 소스, header와 옵션에 따라 hit/miss 결정 | 빌드 명령은 매번 실행하며 CTest/pytest 결과는 캐시하지 않음 |\n| 같은 실행의 workspace | 전체 빌드 완료 후 runtime 검사에서 재사용 | 다른 실행의 `build/`, `install/`, test result는 복원하지 않음 |\n\n이미지 key가 없으면 digest로 고정한 [기존 이미지 후보](../../../containers/ci/compatible-image.json)를 검사합니다.\n설치 스크립트, 저장소 시점, Python 버전, rosdep 규칙과 platform이 같아야 후보로 선택합니다.\n후보 컨테이너에서 현재 manifest의 `rosdep check`와 현재 버전 검사를 모두 통과한 경우에만\n새 의존성 key로 등록합니다. 필요한 패키지가 없으면 고정된 ROS 저장소의 index만 갱신해\n추가 설치하고 다시 검사합니다. Ubuntu 기본 패키지는 기존 이미지의 버전을 유지합니다.\n의존성을 만족시키지 못하거나 버전이 다르면 후보를 사용하지 않습니다.\n후보가 없거나 검사에 실패하면 고정한 저장소 snapshot과 Python 버전으로 이미지를 만듭니다.\n이 재사용은 응용 소스나 빌드 결과를 포함하지 않으며 전체 빌드와 테스트는 매번 실행합니다.\n기하 검사의 Python 패키지는 [검증용 버전 목록](../../../tests/requirements-geometry.txt)으로\n실행 컨테이너에 설치합니다. NumPy와 ROS Python 버전은 변경하지 않습니다.\n같은 저장소의 실행은 환경 확인 후 의존성 이미지를 게시합니다. 응용 테스트의 성공 여부와 별개로 의존성 이미지와 compiler cache를 보존해 실패 수정 시에도 재사용하며, 다음 실행의 전체 검사와 실패 판정은 그대로 유지합니다. Fork PR은 이미지를 게시하지 않습니다. 매주 월요일 실행도 동일한 의존성 이미지를 재사용합니다.\n\n기준은 2026-11-02에 조회한 Jetson의 system Python과 설치된 ROS 패키지입니다.\n[repository-snapshots.env](../../../containers/ci/repository-snapshots.env)는 Ubuntu와 ROS 저장소의 시점을,\n[pip-constraints.txt](../../../containers/ci/pip-constraints.txt)는 MuJoCo와 google-genai 및 전이 의존성 버전을 고정합니다.\n베이스에 이미 설치된 ROS 패키지도 선택한 snapshot으로 갱신한 뒤 workspace 의존성을 설치합니다.\nCI는 설치 후와 검사 시작 전에 [버전 검사](../../../containers/ci/verify-versions.py)를 실행합니다.\n공통 ROS 패키지는 아키텍처별 빌드 시각을 제외한 upstream 버전을 비교하며,\nJetson에만 설치된 패키지를 CI에 추가로 설치하지 않습니다. JetPack, GPU 라이브러리와 실물 동작은 이 검사 범위가 아닙니다.\nBT.CPP `4.9.1`의 amd64 패키지는 라이브러리 설치 위치와 CMake 검색 경로가 달라, CI 이미지에서 같은 바이너리를 가리키는 호환 링크를 추가합니다.\n\n외부 의존성 갱신은 snapshot, Python constraints와 Jetson ROS 버전 기준을 명시적으로 변경하고 전체 CI로 검증합니다.\nDockerfile의 `DEPENDENCY_REVISION`만 올리면 같은 버전으로 이미지를 다시 만들며 패키지 버전은 갱신하지 않습니다.\n저장소와 서명 키 갱신은 [ROS snapshot 안내](https://github.com/ros2/ros2_documentation/blob/rolling/source/Get-Started/Installation/Snapshot-Repository.rst)와 [Ubuntu snapshot 안내](https://snapshot.ubuntu.com/)를 따릅니다.\n\n패키지 빌드는 최대 2개, 패키지 내부 컴파일은 runner CPU 수의 절반으로 제한해 두 병렬화 계층의 경합을 줄입니다. 최적화 수준은 기존 `RelWithDebInfo`를 유지합니다. 모델 검사에서는 같은 인자의 xacro 출력 bytes만 재사용하고 각 검사는 독립 XML tree를 받습니다.\n\n`MAKEFLAGS`도 함께 지정해 colcon이 전체 CPU 수의 `-j` 옵션으로 CMake의 병렬 제한을 덮어쓰지 않도록 합니다.\n\nMPPI는 CPU별 allocator ABI가 달라지는 `-march=native`와 xsimd SSE2 수학 결과를\n손상시키는 `-ffast-math`를 사용하지 않습니다. `-O3`와 SIMD는 유지합니다.\namd64 CI는 `CLEANY_MPPI_PORTABLE_BUILD=ON`으로 MPPI 라이브러리와 이를 링크하는 대상에 같은 `-march=x86-64-v2`를 적용합니다.\n`mppi_simd_math_test`는 라이브러리와 동일한 최적화 옵션에서 반올림, critic 비용의\n거듭제곱과 optimizer 가중치의 지수 함수를 scalar 결과와 비교합니다.\n\nCI artifact에는 test XML, CTest 기록, 단계별 로그와 스택, 재현 명령, 설치된 apt/pip 버전과 ccache 통계를 남깁니다. 속도는 이미지 생성과 compiler cache miss가 있는 최초 실행, 이미지와 cache를 재사용하는 실행으로 구분해 비교합니다. 이미지 pull과 cache 복원 시간도 포함한 GitHub job 전체 시간을 기준으로 판단합니다.\n\n전체 job 제한은 40분이며 이미지 생성은 별도로 15분 안에 완료해야 합니다.\nAPT는 서명을 검증한 snapshot index에서 버전, 파일 경로와 SHA256을 결정합니다.\nUbuntu 패키지 파일은 동일한 pool 경로의 archive 미러, Launchpad의 동일 파일, 원래 snapshot 순서로 받습니다.\n일반 archive에서 제거된 과거 버전도 snapshot의 크기와 SHA256에 일치하는 경우에만 사용합니다.\n다운로드는 최대 8개씩 수행하고 SHA256과 크기가 일치하는 파일만 APT cache에 보관하며 설치 시 APT가 다시 검증합니다.\n`rosdep` 설치 계획의 일반 APT 요구사항은 16개씩 먼저 설치해 패키지별 반복 호출을 줄입니다.\n이후 기존 `rosdep install`과 `rosdep check`로 pip, 대체 패키지와 전체 의존성 충족 여부를 확인합니다.\n미러의 최신 index나 다른 버전으로 대체하지 않습니다.\n연결 timeout은 15초, 파일 다운로드는 60초, 한 설치 명령의 다운로드 준비는 5분으로 제한합니다.\nAPT 자체 재시도는 1회, 의존성 준비 명령은 10초 대기 후 최대 2회 실행합니다.\n계속 실패하면 CI를 실패 처리합니다. 빌드와 테스트는 이 재시도 대상에 포함하지 않습니다.\n\n## 선택 runtime과 UI\n\n### 카메라 영상 수집\n\n현재 workspace를 빌드한 뒤 `tools/validation/capture_cameras.py`로 실제 ROS\n카메라 영상을 수집합니다. 각 출력 경로는 아직 없는 새 디렉터리여야 합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/local_setup.bash\"\npython3 tools/validation/capture_cameras.py --backend mujoco \\\n  --output /absolute/new-camera-run/mujoco\npython3 tools/validation/capture_cameras.py --backend gazebo --gazebo-model cad-with-arms \\\n  --output /absolute/new-camera-run/gazebo\nPYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q tests/tools/test_capture_cameras.py\n```\n\nGUI가 없는 환경에서는 촬영 명령 앞에 `xvfb-run --auto-servernum`을 붙입니다.\nVM에서 GPU 렌더링이 불안정하면 `LIBGL_ALWAYS_SOFTWARE=1`을 지정합니다.\nGazebo의 `--gazebo-model legacy`로 레거시 모델도 선택할 수 있습니다.\n\n| 카메라 수집 결과 | 해석 |\n|---|---|\n| 검사 | Head / 양손목 크기, encoding, 좌표계, buffer, simulation clock와 상태 |\n| 출력 | PNG, report.json, launch.log |\n| 누락 / timeout / 조기 종료 | 실패 코드, 도구가 시작한 process group 종료 |\n| 모델 | CAD 주행 기본은 팔 제외; cad-with-arms는 촬영 검사에만 팔 포함 |\n| 한계 | 촬영 성공은 전체 집기 미션 성공 아님 |\n\n### 선택 실행 조건\n\nGazebo package의 `--run-sim-runtime`, `--run-evaluation-tests`와 Mission core의 `CLEANY_RUN_ROS_TESTS=1`은 별도로 활성화하는 검사입니다. 실행 결과에서 통과와 skip을 구분합니다.\n\nLogger의 `CLEANY_RUN_ROS_TESTS=1 make test-logger`는 native rosbag2의 활성 읽기,\n센서와 진단 bag 분리, CDR 조회, 합산 용량과 ZIP 내보내기도 검사합니다.\n실물 ROS domain과 분리해서 실행하며, 이 검사는 실물 주행의 누락률이나\n시간당 저장 용량을 보장하지 않습니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\nROS_DOMAIN_ID=82 CLEANY_RUN_ROS_TESTS=1 make test-mission-core\n```\n\n### 독립 Logger\n\n```mermaid\nflowchart LR\n    Synth[\"합성 경로 / 영상 / 점군\"] --> Logger[\"독립 Logger\"]\n    Logger --> Storage[\"SQLite + native bag\"]\n    Monitor[\"Monitor 종료 / 재접속 / HTTP start-stop\"] --> Check[\"같은 세션의 저장 증가와 writer 소유 확인\"]\n    Storage --> Check\n```\n\n| 준비 / 확인 | 조건 |\n|---|---|\n| 준비 | Build overlay, 빈 출력 경로, Logger와 Monitor 별도 프로세스 |\n| 검사 | SQLite 증가, 원문 CDR / stamp, 재접속, HTTP 시작 / 정지, Logger 단절, writer 대체 금지 |\n| 제외 | 실제 로봇 구동과 센서 성능 |\n\n```bash\nROS_DOMAIN_ID=218 ROS_LOCALHOST_ONLY=1 make test-logger-independence \\\n  LOGGER_TEST_OUTPUT=/absolute/new-logger-run LOGGER_BASE_COMMIT='\u003cbase-commit>'\nCLEANY_RUN_ROS_TESTS=1 ROS_DOMAIN_ID=217 ROS_LOCALHOST_ONLY=1 make test-dev-monitor\n```\n\n### Logger CLI\n\n| CLI 연결 검사 | 확인 |\n|---|---|\n| 실행 | 별도 Logger에 설치된 logger CLI로 조회 / 토픽 설정 / 시작 / 정지 |\n| 저장 | 합성 경로와 이미지를 native bag에서 다시 읽기 |\n| 경계 | CLI 종료 뒤 녹화 유지, 활성 설정 거부, 세션 보호, 연결 실패 |\n\n```bash\nROS_DOMAIN_ID=219 ROS_LOCALHOST_ONLY=1 make test-logger-cli \\\n  LOGGER_TEST_OUTPUT=/absolute/new-cli-run LOGGER_BASE_COMMIT='\u003cbase-commit>'\n```\n\n### Monitor와 웹\n\nMonitor smoke는 같은 domain에서 Monitor를 먼저 실행한 뒤 호출합니다.\n\n```bash\nROS_DOMAIN_ID=187 python3 ros2_ws/src/cleany_dev_monitor/runtime_test/smoke.py --output /absolute/new-run\n# frontend의 현재 Playwright 설정과 package scripts:\ncat ros2_ws/src/cleany_dev_monitor/web/package.json\n```\n\nFrontend 검사는 `ros2_ws/src/cleany_dev_monitor/web`에서 `pnpm exec tsc --noEmit`과 `pnpm exec playwright test`를 실행합니다. 실제 Monitor가 필요한 검사는 `MONITOR_URL`을 지정하고 해당 ROS 입력도 준비합니다. 기본 fixture 검사는 로컬 Vite를 시작합니다.\n\nUI 변경은 실제 served app에서 새로고침, 재연결, 기록 재생까지 확인합니다. Playwright browser가 없으면 configured browser를 설치한 뒤 다시 실행합니다.\n\nMission Gateway smoke는 `tests/integration/mission_runtime/`, Monitor smoke는 `ros2_ws/src/cleany_dev_monitor/runtime_test/`에 있습니다. 실제 Backend, ROS, Gazebo 입력 조건을 준비한 경우에 명시적으로 실행합니다.\n\n## 결과와 증거\n\n| 증거 | 의미 |\n|---|---|\n| 소스, manifest, 단위 검사 | 구현과 검사된 입력의 계약 |\n| mock / 합성 ROS | 합성 backend의 lifecycle과 메시지 경계 |\n| Gazebo, MuJoCo runtime | 해당 시뮬레이터, 입력, 버전의 동작 |\n| 장치 통신 | 실제 USB, UART, DDS 등 확인한 계층 |\n| 물리 시험 | 실제 sensor, actuator, 정지, 시나리오 결과 |\n\n결과에는 다음 항목을 남깁니다.\n\n- Code commit와 dirty 상태, 환경, overlay\n- 입력, config, asset hash\n- 요청 범위와 실제 완료 범위, 실패, skip, 중단\n- 로그와 출력 위치\n\nCTest wrapper와 pytest 집계가 겹치면 중복 합산하지 않습니다. 변경별 검증 결과는 PR과 CI 결과에 남깁니다. 별도 보고서나 대용량 원본을 공유할 때는 팀이 합의한 위치와 접근 방법을 함께 안내합니다. 개인 로컬 출력 경로만으로 팀이 결과를 재현할 수 있다고 가정하지 않습니다.\n\n## 문서 변경 검사\n\n내부 파일 링크, anchor, 코드, 설정, launch 경로, Make target의 존재와 native dry-run을 확인합니다. 문서 검증만을 위해 실제 로봇을 움직이거나 새 calibration을 수행하지 않습니다.\n\nKB를 변경한 경우에는 KB의 `kb-quality-checks`도 실행합니다. 검사 통과와 내용 승인은 별도로 기록합니다.\n\n## 실물 매핑 패키지 경계\n\n| 명령 | 경계 |\n|---|---|\n| make test-hardware-mapping-core | Lease / ordered permission의 MCU 확인 / scan filter / config / map origin yaw / 원자적 저장 |\n| 같은 core 묶음 | 초기화 직렬화, 저장 실패, heartbeat 만료·복귀, RPC 원인, 실패 로그·traceback, 이벤트 회전·재시작, 큐 포화·디스크 장애 |\n| make test-base BASE_TEST_ROS_DOMAIN_ID=174 | Base 회귀와 구동 허가 계약 |\n\n같은 domain에서 ROS graph 검사를 동시에 실행하지 않습니다.\n\n설치된 패키지의 모의 통합은 다음 명령으로 실행합니다. 새 출력 디렉터리를 지정합니다.\n\n```bash\nmake build-hardware-mapping\nmake test-hardware-mapping-runtime MAPPING_TEST_OUTPUT=/absolute/path/to/new-artifact-dir\n```\n\n| 설치 패키지 통합 검사 | 범위 |\n|---|---|\n| 환경 | Domain 173, synthetic MCU / LiDAR, 저장소 밖 /tmp에서 설치 launch |\n| 제어 | 단일 휠 publisher, 휴대폰 명령과 해제, 초기화와 중복 요청 |\n| 저장 / 종료 | 두 세션 map / pbstream / Logger bag, 최종 저장 후 종료 |\n| 종료 뒤 | 관리자 heartbeat 만료, 조종 이벤트 저장 |\n| 실물 제외 | USB를 열지 않음; 정지 거리 / 장착 TF / 지도 품질은 별도 |\n\n`make test-hardware-mapping`은 관련 ROS 패키지를 domain 174에서 순서대로 검사합니다.\nBase graph fixture는 BASE_TEST_ROS_DOMAIN_ID도 따르므로 두 domain 변수를 함께 설정합니다.\n위 통합 결과의 bag은 domain 175에서 실제 ROS 재생으로 확인할 수 있습니다.\n\n```bash\nmake test-hardware-mapping-replay \\\n  MAPPING_BAG=/absolute/path/to/recordings/bags/session-id \\\n  MAPPING_TEST_OUTPUT=/absolute/path/to/replay-verification.json\n```\n\n## ToF와 Supervisor 통합\n\n| 명령 | 확인 범위 |\n|---|---|\n| make test-tof-core | 거리 투영, 평면 fit, 제동 envelope, timeout, navigation 경로 |\n| make test-tof | Interface / ToF / Mission / safety adapter / Supervisor build와 package 검사 |\n| ToF ROS | 격리 DDS domain의 합성 좌표계 / odom / lease와 pseudo-terminal; 실제 센서 / 모터 미사용 |\n\n기존 navigation C++/Python 회귀 검사는 Humble 환경에서 `make test-navigation`으로\n실행합니다. Mission의 선택 ROS 시나리오는 `CLEANY_RUN_ROS_TESTS=1`과 독립\n`ROS_DOMAIN_ID`에서 별도 실행합니다. colcon의 선택 시나리오 skip은 성공으로 해석하지 않습니다.\n실물 검증 항목은 [CALIBRATION](../calibration.md#tof-근접-보호-commissioning)을 따릅니다.\n\n| 회귀 입력 / 단계 | 확인 항목 |\n|---|---|\n| 단독 보드 로그 3 좌표계 + 합성 입력 | 정상 미검출 허용, 부분 불량 제외, 전부 불량 정지 |\n| 필터 | 인접 / 물리 cluster, 15 Hz 지속, flash / 고립 noise, 비상 단일 검출, 해제 hysteresis, reset |\n| ROS | 센서 fault / stale 정지, 일부 불량 Zone 접근, 평면 소실, lease / cancel |\n| Navigation | ToF on/off와 독립 head-pan observer 조합 |\n| 검증 한계 | 합성 graph는 기존 안전 chain을 identity로 대체; 실제 Nav2 / 모터 주행 아님 |\n\n원본 측정 로그를 ROS 개발환경에서 오프라인 감사하려면 다음을 사용합니다. 장치를 열지 않습니다.\n\n```bash\nPYTHONPATH=\"$PWD/ros2_ws/src/cleany_tof\" python3 tools/validation/tof/replay.py \\\n  /absolute/path/to/range-15hz-2min.jsonl --output /absolute/path/to/audit.json\n```\n\n\n## 얼굴 디스플레이\n\n상태 로직은 Jetson의 독립 설치 폴더에서 `make test`로 검사합니다. 저장소의 `make test`가 실행하는 colcon 검사에도 같은 pytest가 등록됩니다.\n\nROS→HTTP 전환, 결과 수량과 연결 복구는 구현 레포 루트에서 다음 명령으로 검사합니다. `/cleany_display_validation/` 토픽과 domain 173을 사용하며 로봇 제어기는 실행하지 않습니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource /home/cleany/cleany-display/ros2_ws/install/local_setup.bash\nROS_DOMAIN_ID=173 python3 tools/validation/verify_cleany_display_ros.py \\\n  --config /home/cleany/cleany-display/config/display.json \\\n  --output output/cleany-display-jetson/ros-verification.json\n```\n\n| 얼굴 UI 검사 | 명령 / 항목 |\n|---|---|\n| 환경 | [웹 의존성](../development-setup.md#monitor-웹)과 로컬 Chrome |\n| 명령 | 노드 tools/validation/verify_cleany_display_web.cjs |\n| 렌더링 | 7개 표정 60 fps, Zzz 주기, 화면 비율 / 720p 상한 |\n| 갱신 | 설정 변경, 60.01 Hz 입력의 균등 30 fps, 같은 상태 DOM 변경 없음 |\n| 접근성 / 복구 | 모션 감소, HTTP 복구 |\n| 출력 | Git 제외 output/cleany-display-jetson/ |\n\n| 얼굴 전환 검사 | 내용 |\n|---|---|\n| 명령 | 노드 tools/validation/verify_cleany_display_transitions.cjs |\n| 입력 | HTTP 상태 변경 + 제어된 60 Hz 프레임 |\n| 확인 | 깜빡임 연속성, 눈 / 입 중간 모양, 얼굴 위치, 땀방울 / Zzz 소멸 |\n| 경합 | 안내 교체 중 새 상태, 도움과 일반 안내 겹침, 모션 감소 |\n| 출력 / 한계 | output/cleany-display-jetson/transitions/; 실제 장치 fps 측정 아님 |\n\n실물 성능 측정은 Jetson에서 다음 순서로 실행합니다.\n\n1. `systemctl --user set-environment CLEANY_DISPLAY_DEBUG_PORT=9223`과 `systemctl --user restart cleany-display-kiosk`로 전용 브라우저의 로컬 디버깅 포트를 엽니다.\n2. 설치 폴더의 `browser-tools/bin/python`으로 `tools/validation/measure_cleany_display.py --output \u003c결과.json>`을 실행합니다. `--modes idle moving checking collecting complete charging help`를 추가하면 브라우저 응답만 임시로 바꿔 표정별로 측정하고 실제 ROS 상태 화면으로 복구합니다.\n3. 측정 종료 후 `systemctl --user unset-environment CLEANY_DISPLAY_DEBUG_PORT`와 키오스크 재시작으로 디버깅 포트를 닫습니다.\n\n결과의 `frames.canvas.fps`는 실제 캔버스 렌더링 빈도이고 `frames.raf.fps`는 브라우저 콜백 빈도입니다. CPU 수치는 단일 코어 기준이며 GPU 사용률이 아닙니다. 실물 화면, 장시간 동시 운용과 재부팅 후 자동 시작은 별도 검증합니다.\n## MoveIt 충돌 형상과 MuJoCo 동등성 검사\n\n| 모델 검사 | 조건 |\n|---|---|\n| 명령 | make test-description-models |\n| 환경 | ROS 2, MuJoCo, NumPy, SciPy |\n| 원본 URDF / MJCF 비교 | optimized_arm_collision_meshes:=false head_collision_meshes:=false |\n| 기본 최적화 모델 | 시각 형상 / 관성 / 관절 보존, motor collision mesh 배치 |\n| 물리와 계획 | MuJoCo 접촉은 기존 MJCF, MoveIt 계획은 최적화 URDF |\n| 추가 인수 | COLLISION_TEST_ARGS로 -k, --junitxml 등 전달 |\n\n## 충돌 메시와 내부 장애물 검사\n\n```bash\nmake build COLCON_BUILD_ARGS=\"--packages-up-to cleany_moveit_config\"\nmake test-moveit-collision\n```\n\n첫 명령은 description, 충돌 플러그인과 기존 scene mapping 의존성을 함께\n빌드합니다. Jetson의 MoveIt 2.5.9 전용 환경을 사용하는 경우 해당 overlay를\n먼저 source합니다. 검사 시 불러오는 설치 경로는 `INSTALL_BASE`를 따릅니다.\n\n| 충돌 검사 | 확인 |\n|---|---|\n| 묶음 | 형상, SolidFCL 단위, 계획 설정, 실제 MoveIt service |\n| Service | 기본 detector가 내부 장애물 36개 검출, 표면 FCL은 같은 입력 누락 |\n| 오류 | 없는 detector 선택 시 프로세스 종료 |\n| 구동 경계 | 가상 장애물만, trajectory execution OFF, motor driver 미실행 |\n\n## 지도 확장 검증\n\n병행 지도 확장 도구의 원점 변환과 지도 저장 형식은 ROS Python 환경에서\n`PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q tests/tools/test_map_extension.py`로 검사합니다.\n실행 시 `/map`과 `/tf` 발행자에 확장 Cartographer가 없는지, `/map_extension/map`\n및 `/map_extension/tracked_pose`가 수신되는지 확인합니다. 실물 확장 품질은\n연결 통로 왕복 관측과 복귀 시 벽 정합으로 별도 평가합니다.\n\n### 순정 Lattice와 Omni 기본 튜닝 비교\n\n`tools/validation/native_lattice_mppi`는 설치된 Smac Lattice와 통합 MPPI를 격리 실행합니다. 실제 로봇에 속도를 발행하지 않습니다. 입력 폴더에는 `map.txt`(크기, 해상도, 원점), `map.bin`(Nav2 cost byte 배열), `poses.txt`(시작/목표 x y yaw)가 필요합니다. 설정은 controller_server, planner_server와 local_costmap의 합성 YAML입니다.\n\n```bash\ncmake -S tools/validation/native_lattice_mppi -B /tmp/cleany-lattice-validation\ncmake --build /tmp/cleany-lattice-validation -j2\npython3 tools/validation/native_lattice_mppi/compare.py \\\n  /tmp/cleany-lattice-validation/closed_loop '\u003cartifact-root>' '\u003cconfig-stem>' '\u003ccase>'\n```\n\n| 격리 Lattice / MPPI 비교 | 기준 |\n|---|---|\n| 입력 / 출력 | case 폴더 + config-stem.yaml; 결과, 초기 경로, 20 Hz 명령 저장 |\n| --preview-goal | 최초 미리보기 끝점을 실제 목표로 사용 |\n| Domain | 188, 운영 domain과 같으면 거부 |\n| 운동 모사 | 1 Hz 재계획, 1.5 m 지역 경로, 이상적 평면 적분 |\n| 완료 | 120 s simulation 안에 반환 끝점 3 cm / 0.1 rad 이내 + footprint 충돌 검사 |\n| 별도 출력 | 클릭한 목표와 오차 |\n| 미재현 | 실제 PathHandler TF / 지역 지도 갱신, AMCL 오차, 통신, 모터 응답, 슬립 |\n\n실물 주행 성공 근거로 사용하지 않습니다.\n\n`balance_primitives.py SOURCE DESTINATION`은 직선 primitive의 좌표를 변경하지 않고 길이 metadata를 재계산합니다. `test_motion_profile.py`는 번들 원본과의 차이가 오른쪽 횡이동 16개의 길이 필드뿐인지, 모든 직선 길이가 기하와 일치하는지 검사합니다.\n\n\n| 자동 검사 | 범위 |\n|---|---|\n| mppi_critics_tests의 Directional*, mppi_critic_manager_test | 부호 대칭, 거리당 각도 비용 / 봉우리, 시간 적분, DiffDrive 비활성, plugin 로딩 |\n| test_slip_context.py | 과거 TF / 명령, stale / null, bounded history, 지도 식별 |\n| cleany_logger/tests/test_logger_policy.py | 문맥 토픽 기록 / 제외 / remap |\n| 격리 compare.py | 실제 planner/controller + 이상적 운동학의 도착 / 명령 한계; 실물 슬립 개선 아님 |\n\n\n`tools/validation/slip_context_recording.py --output \u003c새 결과 폴더>`는 설치된 logger에\n합성 String 메시지를 보내고 저장된 CDR을 다시 읽어 문맥을 비교합니다. hardware domain 0에서는\n실행을 거부합니다. runner 환경 설정 뒤 별도 `ROS_DOMAIN_ID`를 지정해 실행합니다.\n\n\n### 기록된 Nav2 조건과 MPPI reset 검사\n\n| Bag fixture 추출 | 계약 |\n|---|---|\n| 도구 | tools/validation/native_lattice_mppi/extract_bag_fixture.py |\n| 시각 선택 | 지정 시각 이전 수신 global costmap / odom / plan / map→odom TF |\n| 거부 | 수신 / header 미래 값, stale, 좌표계 불일치 |\n| 비용 역변환 | OccupancyGrid 비용 구간 상한, lethal / unknown 보존 |\n| 검사 | tests/tools/test_bag_navigation_fixture.py의 비용 변환 / SE(2) 합성 |\n\n`compare.py`의 폐루프는 정적 비용 지도에서 정지 출발하는 이상적 운동 모사입니다.\n실제 scan의 시간 변화, SLAM/AMCL 오차, BT 복구, 마찰과 슬립을 재현하지 않습니다.\n`--preview-goal` 사용 시 반환된 Lattice 끝점을 도착 기준으로 사용하고 요청 좌표와의\n오차를 별도로 기록합니다. 실패한 과제도 결과에 보존해야 합니다.\n\n`noise_reset_probe`는 1000×60 후보의 reset 직후 잡음과 실행 시간을 100회 측정합니다.\n`mppi_noise_generator_test`는 비동기 생성 요청과 reset이 겹칠 때의 완전한 첫 묶음,\n운동 모델 전환, 독립 controller 난수열과 종료를 검사합니다. ROS domain은 실제 로봇과\n분리합니다. 헤더의 객체 배치가 바뀌면 비교용 바이너리도 해당 라이브러리와 함께 재빌드합니다.\n\n메모리 사용을 제한하는 격리 빌드는 패키지 수와 C++ 컴파일 작업 수를 모두 제한합니다.\n`CMAKE_BUILD_PARALLEL_LEVEL`은 CMake `-D` 인수가 아니라 환경 변수입니다.\n\n```bash\nCMAKE_BUILD_PARALLEL_LEVEL=2 MAKEFLAGS=-j2 make build \\\n  CLEANY_BUILD_ROOT=/path/to/isolated-build \\\n  COLCON_BUILD_ARGS='--packages-select cleany_navigation --parallel-workers 1'\n```\n\n\n## D435 높이 필터 검증\n\n```bash\npython3 -m pytest -q   ros2_ws/src/cleany_navigation/test/test_depth_obstacles.py   ros2_ws/src/cleany_navigation/test/test_depth_obstacle_preview_transport.py\n# 실물 미리보기가 이미 실행 중인 경우의 읽기 전용 확인\npython3 tools/validation/probe_depth_obstacle_cutoff.py   --min-z .192 --output /path/to/run/live-check.json\n```\n\n| 검사 | 근거 |\n|---|---|\n| 자동 | 높이 경계, 기울어진 바닥과 독립 고정 하한, TF 소실 시 오래된 점군 제거 |\n| 실행 중 probe | Fresh 비어 있지 않은 출력의 좌표계 / 최소 높이 |\n| 한계 | 물체 검출률이나 주행 안전 입증 아님 |\n\n## 실물 depth costmap과 Monitor 격리 회귀\n\n| Depth 회귀 | 격리 범위 |\n|---|---|\n| test_depth_local_costmap.py | Domain 192, 실제 VoxelLayer의 marking / 미관측 유지 / 재관측 clearing |\n| test_collision_monitor.py | Domain 191, LiDAR / depth 정지 우선순위, 절대 상한, required depth 단절 / 복구 |\n| test_depth_transport.py | 실제 형식의 depth, capture TF, 무효 영상 차단, floor clearing |\n| test_lidar_navigation_launch.py | Depth 옵션이 global costmap / slip 설정을 바꾸지 않음 |\n\n로봇 domain 0에 속도를 보내지 않습니다.\n\n```bash\npython3 -m pytest -q ros2_ws/src/cleany_navigation/test/test_depth_local_costmap.py ros2_ws/src/cleany_navigation/test/test_collision_monitor.py ros2_ws/src/cleany_navigation/test/test_depth_transport.py ros2_ws/src/cleany_navigation/test/test_lidar_navigation_launch.py\n```\n\n격리 합성 입력 검사는 실물 의자 이동이나 실제 제동 거리의 검증과 구분합니다. 실물에서는 조종 pause 상태에서 의자를 놓고 치운 관측과 costmap을 기록한 후 별도 주행 시험으로 진행합니다.\n\n\n## 기록 분석 도구\n\n| 목적 | 도구 | 결과 해석 |\n|---|---|---|\n| 과거 정책 재생 비교 | `validate_recorded_localization.py` | 고정된 AMCL/TF 입력의 정책 차이 |\n| 기록 점수 시각화 | `plot_localization_history.py` | 점수 재계산 없이 PNG/PDF/CSV/HTML |\n| 복구 하한과 흐름 비교 | `localization_policy_experiment.py` | 기록 기반 비교; 물리 복구율 아님 |\n\n```mermaid\nflowchart LR\n    Bag[\"완료 bag / 원본 + diagnostics\"] --> Fixed[\"읽기 전용 또는 SQLite backup 고정\"]\n    Fixed --> Policy[\"Guard 정책 재생 / 복구 후보 비교\"]\n    Fixed --> Plot[\"기록 점수 그대로 시각화\"]\n    Policy --> Report[\"원본 식별 / 실패 포함 보고\"]\n    Plot --> Report\n```\n\n### 기존 정책 재생\n\n```bash\npython3 tools/validation/validate_recorded_localization.py --help\n```\n\n| 인수 / 실행 | 의미 |\n|---|---|\n| --bag 반복 | 원본과 diagnostics DB가 있는 완료 bag |\n| --settings | 비교 localization 설정 |\n| --old-source-tar / --draft-source | 이전 정지 정책 snapshot / 비교할 수정 전 감속 정책 Python |\n| --output | 해당 실행 결과 폴더 |\n| 보존 | 원본 DB read-only, 전후 hash 확인 |\n| 재생 | DDS domain 196의 실제 Guard; 기록 AMCL / TF 고정 |\n| 누락 | 없는 initialpose는 AMCL 수신 로그로 보수적 신뢰 초기화; 저장 주기 / 입력 누락 유지 |\n\n변경 속도로 실제 이동했을 때의 위치 정확도나 최적 감속 비율은 입증하지 않습니다.\n\n### 기록된 점수 시각화\n\n```bash\npython3 tools/validation/plot_localization_history.py   --bag BAG --end ISO_TIME --minutes 10 --output RUN_DIR\n```\n\n| 항목 | 처리 |\n|---|---|\n| 종료 시각 | 시간대 포함 |\n| 입력 | Read-only transaction으로 정합 / 출력 속도 / 목표 취소 추출 |\n| 출력 | PNG, PDF, CSV, HTML |\n| 그래프 | 점수 재계산 안 함, 수신 공백 / 오래된 점수 연결 안 함 |\n\n### 복구 정책 비교\n\n```bash\npython3 tools/validation/localization_policy_experiment.py --bag BAG --output RUN_DIR\npython3 tools/validation/report_localization_policy_experiment.py RUN_DIR\n```\n\n| 항목 | 계약 |\n|---|---|\n| 복수 입력 / 시각 | --bag 반복, 필요 시 --end UNIX_SECONDS |\n| 기록 중 DB | SQLite backup으로 먼저 고정 |\n| 관측 창 | 원본 지도와 인과적 TF의 정지 구간 |\n| 비교 | 전체 참조 스트림에 위치 / 방향 오차를 유지한 채 기존 하한과 구조 후보 비교 |\n| 출력 / 검사 | HTML / CSV / 그래프, tests/tools/test_localization_policy_experiment.py |\n| 한계 | 기록 AMCL은 실측 정답 아님; 재초기화 뒤 AMCL / 물리 복구율 입증 안 함 |\n| 설정 영향 | 실행 프로필 자동 변경 없음 |\n\n## 테스트와 도구 위치\n\n테스트는 검사 대상을 소유한 위치에 둡니다. 루트 `tests/`에는 저장소 도구의 자동 검사와 패키지를 연결하는 통합 검사만 둡니다. 실행, 관찰과 보고 코드는 검증 도구로 분리합니다.\n\n| 위치 | 책임 |\n|---|---|\n| `ros2_ws/src/\u003cpackage>/test/`, `tests/` | 패키지 기능과 계약의 자동 검사 |\n| `ros2_ws/src/\u003cpackage>/runtime_test/` | 해당 패키지의 명시 실행 smoke와 runtime 검사 |\n| `tests/integration/` | Backend, Mission 등 여러 구성 요소의 연동 검사 |\n| `tests/tools/` | 저장소 검증 도구의 자동 검사 |\n| `tools/validation/` | Simulator 실행과 영상·로그 수집 |\n\n패키지 내부에도 통합 검사가 있을 수 있습니다. 파일의 책임과 실행 조건으로 위치를 정하며, runtime CLI를 `tests/`에 넣었다고 pytest가 자동 실행하는 것은 아닙니다.\n\n## FreeCAD 정적 기준 모델\n\n`make test-freecad-model`은 부품 해시, URDF의 시각·충돌 표면 일치, 단위와\n원점 변환, 560 mm 기둥, 화면 텍스처, 잘못된 보정 선택의 거부를 확인합니다.\nMuJoCo 로드 후 관절과 actuator가 없고 주요 부품 경계가 URDF 메시와 같은지도\n검사합니다. 기존 Make 변수 `GEOMETRY_PYTHON`으로 NumPy, pytest와 MuJoCo가 있는\nPython을 선택할 수 있으며 이 검사는 ROS나 모터를 실행하지 않습니다.\n내보내기 도구 검사는 메시 분할 경계의 삼각형 보존, 이전 manifest의 호환과\n재실행 시 중복 제거를 확인합니다. 출력 실패 후 재시도와 사용자 파일 보존도 검사합니다.\n\n`make test-description-models`와 패키지의 colcon test에도 새 모델 검사가\n포함됩니다. 기존 실행 모델의 FK와 관절 검사 통과는 새 CAD의 운동학이나\n실물 정확도를 검증한 결과가 아닙니다.\n\n`test_freecad_kinematics.py`는 서보·구동 혼·지지 혼의 공통 축 근거, 부품의 단일\n링크 소유, 저장 자세 재현과 임의 변화량의 독립 URDF FK 일치를 검사합니다.\nMuJoCo mocap 배치도 FK와 대조하며 질량이나 actuator가 생성되지 않는지 확인합니다.\n`test_freecad_gripper_linkage.py`는 양쪽 집게의 핀 거리, 폐쇄 링크 잔차,\nURDF FK에서 연결된 두 부품의 핀 일치와 해가 모호한 자세의 거부를 검사합니다.\n종속 관절을 독립 입력으로 지정하면 거부하며 물리 영점·운용 한계는
