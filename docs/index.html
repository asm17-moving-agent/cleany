null로 유지합니다.\n`test_freecad_tip_mounts.py`는 네 팁의 공통 체결축, 양방향 간섭 근거와 고정\n자식 링크를 검사합니다. 캠을 움직여도 운반 링크와 팁의 상대 배치가 유지되고\nURDF FK와 MuJoCo의 고정 자식 배치가 일치하는지 확인합니다. 체결력과 재질의\n탄성은 이 검사에서 확정하지 않습니다.\n변화량 표본은 수치 검사 입력이며 운용 제한이나 실물 정확도를 증명하지 않습니다.\n\n\n## FreeCAD MoveIt와 OctoMap, cuRobo 검사\n\n[검사 launch](../../RUNNING.md#freecad-moveit와-octomap-검사)를 실행하고 같은 ROS\ndomain에서 아래 명령으로 CAD 저장 자세와 합성 점군을 보냅니다. MoveIt의 모델\n이름, 관절 상태, OctoMap과 동작 인터페이스 비활성화를 확인합니다.\n\n```bash\npython3 ros2_ws/src/cleany_moveit_config/runtime_test/check_freecad_scene.py\n```\n\nJetson의 cuRobo CUDA 환경에서는 아래 명령으로 CAD 저장 자세의 메시 충돌을\n확인합니다. LiDAR 표면과 차체에서 떨어진 지점에 시험 구를 배치합니다.\n\n```bash\n\"$HOME/cleany/runtime/curobo-venv/bin/python\" tools/validation/check_freecad_curobo.py \\\n  ros2_ws/src/cleany_description\n```\n\n인덱스 캐시는 같은 overlay를 읽은 상태에서 cuRobo 검사에\n`--collision-cache \"$collision_cache\"`를 추가해 검증합니다. MoveIt과 OctoMap은\n동일한 점군으로 STL과 GLB를 각각 검사하고 결과 지도 해시를 대조합니다.\n캐시 생성기의 좌표, 모델 해시와 손상 검사에는 아래 명령을 사용합니다.\n\n```bash\npython3 -m pytest -q tests/tools/test_freecad_collision_cache.py \\\n  tests/tools/test_freecad_mesh_reduction.py tests/tools/test_freecad_moveit_cache.py\n```\n\n표면 감면 검사는 정점 일치만으로 판정하지 않습니다. 삼각형 내부까지 거리를\n확인하고, 검사량 제한에 도달하면 후보를 거부합니다. 테스트는 좁은 구멍,\n삼각형 내부 누락, 다른 대각선 분할, 오차 입력과 캐시 손상을 포함합니다.\n`manifest.json`에는 파일별 감면 수와 양방향 표면 거리 상한을 기록합니다.\n이 상한은 표본의 최대 거리나 실물 오차가 아니며, 감면 메시가 원본 입체를\n완전히 감싼다는 보증도 아닙니다. cuRobo 링크 캐시는 저장 전후 삼각형 배열의\n완전 일치를 확인합니다.\n\nMoveIt 하부 캐시 검사는 직렬화한 박스와 원통의 원본 포함, 바퀴축 보존,\n서로 움직이는 링크의 병합 거부와 비충돌 XML 보존을 확인합니다. 하부 primitive는\n작은 구멍과 홈을 채우므로 이 부분에 표면 감면의 거리 상한을 적용하지 않습니다.\n몸통 검사는 상판 투입구 추출, 기존 횡대 높이의 유지와 투입구를 가로지르는\n삼각형의 거부를 포함합니다. 모든 꼭짓점이 구멍 밖에 있어도 내부를 가로지르는\n삼각형은 거부합니다. cuRobo 검사는 CAD 저장 자세의 FK, 단순 입체별 객체 분리,\n저장 후 삼각형 일치와 관절 URDF 변경의 거부를 확인합니다. GPU 실행 시에는\n몸통의 깊은 내부와 투입구의 양쪽 경계도 검사해야 합니다.\n\n분할 외피 검사는 조각 사이 틈, 링크와 시각 모델 보존, GLB의 닫힘과 원본\n포함 관계를 확인합니다. 확장 상한은 원본 조각의 볼록 외피 기준입니다.\n`cleany_moveit_collision`의 native 테스트는 검사 전용 detector가 미선언\nCAD 표면을 유지하면서, 선언한 외피의 내부 장애물을 scene 복사 후에도\n검출하는지 확인합니다. 잘못된 외피는 거부해야 합니다. 실제 캐시에서는\n기둥 허리 바깥의 빈 공간과 각 외피 조각 내부를 자체 필터, MoveIt 접촉과\nGPU 구 쿼리로 대조합니다.\n추가 외장 감면에서는 보호 부품의 메시 해시, 동일 링크 안의 강체 묶음과\n다른 링크 병합의 거부도 검사합니다. cuRobo native cuboid는 관절 변환 후의\n위치와 quaternion, 미리보기 삼각형 일치와 박스 데이터 변조 거부를 확인합니다.\n실제 GPU에서는 같은 쿼리로 메시 박스와 native cuboid의 판정 및 시간을\n비교합니다. 삼각형 감소만으로 실행 시간이 개선됐다고 판단하지 않습니다.\n캠과 가동 링크 감면에서는 원본 삼각형 포함 외에 접촉 패드의 삼각형과 관절\n변환 일치를 검사합니다. CAD 비교 자세별로 패드 사이 입구 공간과 새 볼록\n외피의 교차 여부를 확인하고, 열린 자세의 점군과 접촉 쿼리를 전후 대조합니다.\n결합부 수정은 감면 전 표면 모델, 수정 전 외피와 수정 후 모델의 자기 접촉\n쌍을 같은 CAD 자세에서 비교합니다. 실제 MoveIt의 충돌 허용 행렬이 같은지\n확인하고, 대상 링크 사이의 최소 거리도 별도로 측정합니다. 접촉 허용 쌍\n추가나 접촉 조회 결과의 제외로 형상 수정 검사를 통과시키지 않습니다.\n원본 메시와 판정이 다른 쌍은 FreeCAD 원본 솔리드의 최소 거리와 교집합\n부피를 대조합니다. 표면 감면 후보는 구멍과 접촉 패드를 보존하면서 검증\n자세의 원본 체적 겹침과 조립 접촉 판정을 유지하는지 확인합니다.\n\n별도 inspection domain에서는 아래 검사로 합성 점군 자체 필터와 장애물 접촉을\n확인합니다. 입력 JSON의 `cloud`에는 `name`, CAD base frame의 `point`(m),\n필터 통과 여부 `keep`을 넣습니다. `contacts`에는 `name`, `point`, 박스의\n`size`(m), 예상 `collision`을 넣습니다. 검사는 저장 자세를 발행하고, 시험 박스를\n추가해 접촉을 조회한 뒤 제거합니다. 기존 CAD 자기 접촉은 시험 박스 접촉과\n구분합니다. 실행 프로필에는 사용하지 않습니다.\n선택적 `joint_positions_rad`는 CAD 관절 이름에서 rad 값으로의 매핑입니다.\n생략한 좌표는 0이며, 미등록 좌표와 비유한 값은 거부합니다. 집게의 열린 자세를\n검사할 때는 기존 명목 링크 해석기로 종속 관절까지 계산해서 넣습니다.\n이 입력은 실물 보정값이나 허용 가동 범위를 설정하지 않습니다.\n\n```bash\npython3 ros2_ws/src/cleany_moveit_config/runtime_test/check_freecad_lower_body.py \\\n  /path/to/lower-body-probes.json\n```\n\n| 준비할 입력 | 용도 | 생성 근거 |\n|---|---|---|\n| `lower-body-probes.json` | 하부 외피의 점군과 장애물 접촉 검사 | [생성 스크립트와 입력 목록](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/docs/EVIDENCE.md?plain=1#L1822) |\n| `body-probes.json`, `curobo-probes.json` | 몸통과 분할 외피의 점유·충돌 비교 | [입력과 생성 스크립트](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/docs/EVIDENCE.md?plain=1#L1928) |\n| `open-probes-final.json`, `aperture-geometry-final.json` | 열린 집게의 입구 보존 검사 | [자세와 입력 목록](https://github.com/asm17-moving-agent/cleany/blob/11fbb1f6aeeaf6acd920927425f9a6141ad4d56f/docs/EVIDENCE.md?plain=1#L1991) |\n\n저장 자세의 검사 통과는 모든 관절 자세나 실물 계획 검증을 대신하지 않습니다.\n\n## 인식과 파지 후보 검증\n\n```bash\nmake build-perception-candidates\nmake test-perception-candidates\n```\n\n인터페이스 직렬화, RGB-D 검사, 모델 어댑터, 파지 후보와 GPU 작업 잠금,\n비전 컨테이너 설정 및 모델 도구를 검사합니다. 모델 호출은 가짜 추론기로\n검증하며 실제 Gemini API나 AnyGrasp SDK 성능을 측정하지 않습니다.\nRealSense 실물 검사는 명시적으로 활성화할 때만 실행합니다.\n검사 경로와 옵션은 `PERCEPTION_TEST_PATHS`, `PERCEPTION_PYTEST_ARGS`,\nROS domain은 `PERCEPTION_TEST_DOMAIN_ID`로 바꿀 수 있습니다.\n운영 노드와 분리한 빌드 경로와 domain을 사용합니다.\n\n\n## Jetson 실물 변경 검증\n\n제어 패키지는 운영 install과 분리된 빌드 경로에서 검사합니다.\n\n```bash\nmake build-jetson-control\nmake test-jetson-control\nmake test-jetson-control-native\nmake test-jetson-controller\n```\n\n`test-jetson-control`은 상태 매핑, 제어 프로파일, 카메라,\nMoveIt의 실물 관절 한계 및 호스트 도구를 검사합니다.\n범위는 `JETSON_CONTROL_TEST_PATHS`, pytest 옵션은\n`JETSON_CONTROL_PYTEST_ARGS`로 지정합니다.\n\n`test-jetson-control-native`는 `cleany_robot_interface`의 C++ Feetech 드라이버와\nPython 검사, 모델과 MoveIt 패키지의 colcon 검사를 실행합니다.\n\n`test-jetson-controller`는 PTY 가상 시리얼과 실제 C++ 드라이버, ROS 컨트롤러를 연결합니다.\n실물 USB 포트를 열지 않으며 읽기 전용, 쓰기 제한, 정지와 통신 장애를 검증합니다.\n`JETSON_CONTROLLER_TEST_ARGS`로 검사 범위를 지정할 수 있습니다.\n이 검사는 실물 보정 정확도나 수거 성공의 근거가 아닙니다.\n\n\n## 배포한 소스와 설정 확인\n\n배포 receipt의 `files` 항목에 있는 `path`와 `after_sha256`을 현재 Python import\n경로와 ament share에 대조합니다. Python 소스, config, launch, URDF와 mesh가 검사 대상입니다.\n\n```bash\npython3 tools/validation/verify_installed_sources.py \\\n  --deployment /absolute/path/to/deployment.json --packages cleany_robot_interface\n```\n\n검사하지 않은 항목은 `skipped`로 표시하며, 요청한 패키지 기록이 없거나 파일이\n누락되거나 hash가 다르면 실패합니다. 복사 설치는 `--resolved-root`로 설치 루트를\n제한할 수 있습니다. Native symlink 설치에서는 생략합니다. ROS 노드나 모터를 시작하지 않습니다.\n\n\n## Jetson USB 카메라 인수검사\n\n`make test-camera-orientation`은 가짜 sysfs, 프로세스 정보와 USB ioctl을 사용합니다.\nPython 3.10에서 helper의 요청 형식, 대상 장치 제한, 사용 중인 장치 보호, readback과\n오류 시 드라이버 복구를 검사합니다. 설치 검사는 임시 디렉터리만 사용하며\n`systemd-analyze`가 있으면 unit 문법도 확인합니다. CI는 Ubuntu 22.04 환경에서 같은\ntarget을 실행합니다.\n\n실제 Jetson Orin에서는 [설치](../development-setup.md#jetson-orin-usb-카메라-회전) 후\n다음을 별도로 확인합니다.\n\n1. 캡처를 닫고 DECXIN 모듈을 연결해 journal의 설정값과 readback이 `3`인지 확인합니다.\n2. 영상을 열어 180도 방향을 확인하고 캡처를 종료합니다.\n3. USB를 분리하고 다시 연결한 뒤 같은 확인을 반복합니다.\n4. 카메라가 연결된 상태로 재부팅하고 초기화 완료 후 캡처 방향을 확인합니다.\n5. 다른 VID/PID 카메라에 unit이 요청되지 않는지 확인합니다. 같은 모델 여러 대는 각 USB\n   이름의 unit과 영상 방향을 따로 확인합니다.\n6. 캡처 중 수동 초기화를 요청하면 드라이버 분리 없이 실패하는지 확인합니다. 캡처를 닫고\n   `reset-failed`와 수동 시작으로 복구합니다.\n\n각 실행의 JetPack, kernel, Python 버전, USB 이름과 VID/PID, journal, 영상 방향 확인\n결과를 남깁니다. 장치 없는 자동 검사 통과는 Orin의 USB 재연결과 재부팅 검증을 대신하지\n않습니다.\n\n\n## 실물 계획과 실행 기반 검증\n\n운영 install과 다른 `CLEANY_BUILD_ROOT`를 지정한다. 모든 결과는 그 경로나 외부 보고서 디렉터리에 보관한다.\n\n```bash\nexport CLEANY_BUILD_ROOT=\"$CLEANY_DATA_ROOT/builds/motion-review\"\nmake build-motion-foundation\nmake test-motion-foundation MOTION_TEST_PYTHON=\"$CLEANY_BUILD_ROOT/test-env/bin/python3\"\nmake test-motion-native\nmake test-motion-runtime\nmake test-jetson-controller\n```\n\n| 명령 | 범위 |\n|---|---|\n| `test-motion-foundation` | Python 계획, 실행 core, 인식, 파지, 제어 호환성과 도구 검사. 합성 입력과 가짜 서비스 사용 |\n| `test-motion-native` | C++ 장면 필터, 배치 검사, 시간 배정, SolidFCL과 드라이버 |\n| `test-motion-runtime` | 별도 ROS domain의 MoveIt, 합성 장면, 머리 충돌, 배치, OctoMap 조회. 장치 드라이버를 시작하지 않음 |\n| `test-motion-gpu` | 모션 컨테이너의 CUDA FK/IK, 경로, mast 충돌과 양팔 예열 버퍼 재사용. 장치와 외부 ROS 서버 불필요 |\n| `test-jetson-controller` | PTY 가상 시리얼 controller. 실제 모터를 구동하지 않음 |\n\n테스트 Python은 [개발환경 안내](../development-setup.md#실물-모션-기반)에 따라 준비한다.\n`MOTION_TEST_PYTHON`, `MOTION_TEST_PATHS`, `MOTION_PYTEST_ARGS`, `MOTION_TEST_DOMAIN_ID`로\n실행 환경, 범위와 결과 파일을 지정한다.\nGPU 검사는 `cleany_skill_executor/runtime_test/`에 두며 고정 CUDA 환경에서\n`CLEANY_RUN_CUROBO=1` 등 각 파일의 실행 조건을 명시해야 한다. 일반 검사 통과는 GPU 성능,\n실물 동작이나 전체 수거 시나리오의 검증을 뜻하지 않는다.\n\n컨테이너 준비 후 `make test-motion-gpu`로 독립 실행 가능한 GPU 검사를 실행한다.\n`MOTION_GPU_PYTEST_ARGS`로 pytest 옵션을 전달하며 컨테이너 결과 파일은\n쓰기 가능한 `/opt/cleany-motion/cache/` 아래에 둔다. 나머지 GPU 런타임 검사는\n별도로 시작한 MoveIt과 GenericSystem mock controller가 필요하다.\n\n\n## 실물 수거 실행과 복귀 검사\n\n`make build-collection-execution`은 BT와 실물 실행 의존 패키지를 빌드한다.\n`make test-collection-execution`은 수거, 복귀, 복구와 직접 연결된 모션 및 안전 검사를 실행한다.\n`make test-collection-regression`은 인식, 파지 후보 생성과 저장소 도구를 포함한\n기존 모션 회귀 검사까지 함께 실행한다. 수거 코드를 수정할 때는 전자를 먼저 실행하고,\n여러 패키지를 함께 변경하거나 병합을 준비할 때는 후자로 범위를 넓힌다.\n`CLEANY_BUILD_ROOT`로 운영 install과 분리하고 `MOTION_TEST_PYTHON`,\n`COLLECTION_TEST_PATHS`, `MOTION_PYTEST_ARGS`로 Python, 검사 범위와 pytest 인자를 지정한다.\n\n실측 FK 재사용 검사는 `cleany_skill_executor/test/test_measured_fk_reuse.py`에 모은다.\n실제 `CollectionPipeline.pose`에 합성 관절 상태와 가짜 FK 응답을 넣어 재사용, 무효화,\n실시간 감시 실패와 서비스 오류 처리를 검증하며 `test-collection-execution`에 포함한다.\n\n검사는 합성 센서, 가상 모션 포트, 임시 SQLite와 독립 ROS domain을 사용한다.\n실물 시리얼 포트를 열거나 모터를 움직이지 않으며, 종료, 취소, 늦은 응답,\n복구 차단과 기존 MuJoCo BT 계약을 함께 확인한다.\n\n\n## 운영 UI와 승인 흐름 검증\n\n기존 실물 실행 기반을 빌드한 overlay에서 변경 패키지를 빌드하고 확인한다.\n웹 빌드 의존성과 Playwright browser는 [개발환경](../development-setup.md)을 따른다.\n\n```bash\nmake build-dev-monitor-web\nmake build-operator-workflow\nCLEANY_RUN_ROS_TESTS=1 make test-operator-workflow\nmake test-dev-monitor-web\n```\n\n`test-operator-workflow`는 localhost 독립 domain에서 Monitor, Logger와 대상 재확인을\n검사한다. `CLEANY_RUN_ROS_TESTS=1`은 합성 ROS 연결 검사를 활성화하며 장치를 구동하지 않는다.\n`MONITOR_TEST_PYTHON`으로 테스트 Python, `OPERATOR_TEST_DOMAIN_ID`로 domain을 지정한다.\n중복 실행, 인증, 불변 제안의 일회 소비, 오래된 관측과 이동 대상 거절, 취소 ACK와\n실물 정지 구분, 분류 사유 보존을 확인한다. 실물 모터와 실제 인식 모델 검증은 별도다.\n\n정지 물체 시험은 원본 번호와 추적 ID, 만료, 캐시 소실 및 취소를 검사합니다.\nROS fixture는 정지 물체 승인에서 새 관측을 요청하지 않는 경우와, 재관찰을 켠 승인에서\n새 관측을 확인한 뒤 원본 대상의 Goal을 한 번 전달하는 경우를 검사합니다.\n\nPlaywright는 기본 로컬 fixture 서버를 사용한다. `MONITOR_URL`이 필요한 실제 서버 검사는\n서버와 합성 입력을 준비한 경우에만 실행한다. `OPERATOR_VISUAL_DIR`을 저장소 밖 경로로\n지정하면 운영 UI의 라이트, 다크와 좁은 화면 근거 이미지를 저장한다.\n\n## Decision 실행 경로 검증\n\n`test_perception_container_model.py`는 실제 컨테이너 실행 스크립트의 ROS 명령을\n대체해 기본 real32/real53, 사용자 프로파일, 모델 override와 RGB-D QoS를 확인한다.\nDocker, 카메라, 모터와 실제 API를 사용하지 않는다. Docker Compose가 설치되어 있으면 구성 계약도 확인한다.\n\n```bash\npython3 -m pytest -q tests/tools/test_perception_container_model.py containers/vision/test/test_compose_contract.py\n```\n\n`tools/vision-container build-perception-workspace`는 인식 노드를 시작하지 않고\n설치본을 준비한다. 컨테이너 시작 검증은 별도 ROS domain, 외부 네트워크 차단,\n가짜 API 키와 USB 미전달 상태에서 수행하고 파라미터 RPC만 조회한다.\n이 검사는 실제 API 접근, 카메라 TF와 물리 집기 검증을 대신하지 않는다.\n\n명령은 저장소 루트의 Humble/Fortress 환경에서 실행합니다. 변경 범위를 확인한 뒤 가장 작은 관련 검사부터 선택합니다. Make target의 실제 동작은 [Makefile](../../../Makefile)을 기준으로 확인합니다.\n\n\n## 이벤트 결과 전달 검증\n\n[`benchmark_action_notifications.py`](../../../tools/validation/benchmark_action_notifications.py)는\n가상 모터 `mock_components/GenericSystem`과 실제 궤적 제어기를 연결한다.\n모터 드라이버는 로드하지 않으며, localhost ROS domain 219를 사용한다.\n\n1. Humble과 기존 의존 패키지의 overlay를 읽고 관련 패키지를 빌드한다.\n\n   ```bash\n   source /opt/ros/humble/setup.bash\n   # 별도 설치한 의존 패키지가 있으면 해당 setup.bash도 읽는다.\n   make build COLCON_BUILD_ARGS='--packages-select cleany_trajectory_controller cleany_robot_interface --parallel-workers 2'\n   source \"$(make -s print-install-base)/setup.bash\"\n   ```\n\n2. 프로파일의 제어기 선택과 종료 동작을 확인한다. `--functional-only`는\n   성능 비교를 생략하고 진행 상태를 1Hz로 낮춰 결과 전달을 검사한다.\n\n   ```bash\n   make test-jetson-control JETSON_CONTROL_TEST_PATHS='ros2_ws/src/cleany_robot_interface/test/test_control_profile.py'\n   export ROS_DOMAIN_ID=219 ROS_LOCALHOST_ONLY=1\n   python3 tools/validation/benchmark_action_notifications.py \\\n     --output /tmp/cleany-action-events-functional --functional-only\n   ```\n\n   정상 완료, 허용 오차 실패, 취소와 완료 경쟁, 명령 교체, 잘못된 목표 거부,\n   비활성화와 재활성화를 확인한다. 종료 결과가 1초 피드백 주기를 기다리거나\n   예상 상태와 다르게 도착하면 실패한다.\n\n3. 성능 비교가 필요하면 같은 도구를 전체 모드로 실행한다.\n\n   ```bash\n   python3 tools/validation/benchmark_action_notifications.py \\\n     --output /tmp/cleany-action-events-comparison --blocks 3 --trials 24\n   ```\n\n| 측정 항목 | 기준 |\n|---|---|\n| 비교 방식 | 기존 20Hz, 기존 100Hz, 이벤트 방식 20Hz; 블록별 실행 순서 변경 |\n| 입력 | 50Hz 제어 주기, 가상 제어기 4개 중 1개에 동일 난수 궤적 입력 |\n| 결과 전달 지연 | 제어기 성공 로그 시각부터 client 결과 callback까지 |\n| CPU | 제어기 프로세스 사용량; 논리 코어 하나가 100% |\n| 원본 | 출력 폴더의 `results.json`, 제어기 설정 YAML과 로그 |\n\n이 측정은 실물 이동 시간이나 전체 수거 주기 검증을 대신하지 않는다.\n\n\n## 공통 CAD 검증\n\n`tools/robot-model check`로 설치 CAD의 해시와 관절 구성을 확인한다.\n`cleany_description`의 `runtime_model`, `runtime_state`, `cad_coordinates`와\n`cleany_moveit_collision`의 `test_cad_linkage`는 모터 없이 실행한다.\n카메라 투영, 피드백 신선도와 소비자 간 모델 일치도도 Python 테스트로 확인한다.\n실제 카메라 정합, GPU를 사용하는 계획과 모터 구동은 별도 검증이다.\n\n\n## 통합 컨트롤러 PCB 검증\n\nPCB 검사는 [KiCad 호스트 환경](../development-setup.md#kicad-pcb-검증-환경)에서 실행합니다.\nPCB 검사는 로컬 전용이며 GitHub Actions CI에 포함하지 않습니다.\n`CI=true` 또는 `CI=1`이면 `make test-pcb`는 KiCad 검사와 보드 테스트를 실행하지 않고\nskip 메시지로 종료합니다. CI 컨테이너에도 `CI=true`를 전달합니다.\n\n```bash\nmake test-pcb\n```\n\n`esp32/pcb/integrated_controller/tests/`의 보드 전용 검사는 BOM, 핀맵, 회로도와 PCB의 일치,\n제조 규칙의 경계값, 패드와 비아 간격, 3D 모델의 출처와 배치를 확인합니다.\n이어서 저장된 설계의 ERC와 회로도 일치 검사를 포함한 DRC를 실행합니다.\n오류, 경고와 제외 항목을 모두 보고하며 KiCad가 위반 종료 코드를 반환하면 target도 실패합니다.\nKiCad 실행 파일이나 `pcbnew`가 없으면 테스트 전에 실패합니다.\n\n`PCB_PYTHON`으로 KiCad Python 실행 파일을 선택합니다. `PCB_TEST_OUTPUT`의 기본값은\n`CLEANY_BUILD_ROOT/pcb-validation`이며 `erc.json`, `drc.json`을 기록합니다.\n별도 실행의 근거를 보존할 때는 `make test-pcb PCB_TEST_OUTPUT=/path/to/run`으로 경로를 지정합니다.\n[Molex 모델](../../../esp32/pcb/integrated_controller/libraries/3dmodels/README.md)은 로컬 설치 항목이므로\n새 checkout에서는 원본 해시 검사 1건만 건너뛰며 메타데이터와 PCB 배치 검사는 수행합니다.\n\n이 검사는 통합 보드의 저장된 설계를 대상으로 합니다. 별도 `sensor_controller`는 배치와 배선이\n없는 초안입니다. 제조사 DFM, 실물 전원 부하, USB 신호 품질과 펌웨어 이식 검증은 포함하지 않습니다.\n"},"docs/implementation/ros-interfaces.md":{"title":"ROS 인터페이스 색인","body":"# ROS 인터페이스 색인\n\n## 기능 사이의 연결\n\n아래는 기능 경계 요약입니다. 실행별 안전 체인의 정확한 토픽과 QoS는 아래 색인 및 패키지 reference에서 확인합니다.\n\n```mermaid\nflowchart TB\n  Mission[\"Mission Runtime\"] -->|\"Navigation 목표\"| Nav[\"Navigator / Nav2\"]\n  Mission -->|\"단일 물체 Action\"| Skill[\"Skill Executor / BT\"]\n  Supervisor[\"System Supervisor\"] -->|\"실행 허가와 정지\"| Mission\n  Camera[\"RGB-D + 촬영 시각 TF\"] --> Perception[\"InspectScene / snapshot\"]\n  Perception -->|\"선택 물체\"| Skill\n  Skill -->|\"PlanGrasp / MoveIt\"| Arm[\"팔 controller\"]\n  Nav --> Safety[\"프로필별 안전 경로\"]\n  Safety -->|\"cmd_vel\"| Base[\"Base driver\"]\n  Base -->|\"wheel_command\"| MCU[\"MCU\"]\n  MCU -->|\"wheel_state\"| Base\n  Base -->|\"odom / joint_states\"| Nav\n```\n\n| 확인 질문 | 찾을 표 |\n|---|---|\n| 누가 이 값을 발행/구독하나? | [Topic](#topic-목록) |\n| 목표를 보내고 취소하려면? | [Action](#action-목록) |\n| 한 번 요청하고 응답받으려면? | [Service](#service-목록) |\n| 기본 통신 신뢰성 / 이름 해석은? | [표 읽기](#표-읽기) |\n\n| 찾을 기능 | 패키지 표 |\n|---|---|\n| 구동과 피드백 | [Base driver](../../ros2_ws/src/cleany_base_driver/docs/interfaces.md) |\n| 주행·SLAM·안전 노드 | [Navigation](../../ros2_ws/src/cleany_navigation/docs/interfaces.md) |\n| 인식과 조작 | [Perception](../../ros2_ws/src/cleany_perception/docs/runtime.md), [Manipulation](../../ros2_ws/src/cleany_skill_executor/docs/interfaces.md) |\n| 미션과 허가 | [Mission](../../ros2_ws/src/cleany_mission_manager/docs/interfaces.md), [Supervisor](../../ros2_ws/src/cleany_system_supervisor/docs/interfaces.md) |\n| 기록과 관측 | [Logger](../../ros2_ws/src/cleany_logger/docs/interfaces.md), [Monitor](../../ros2_ws/src/cleany_dev_monitor/docs/interfaces.md) |\n\n아래 표는 전체 이름 색인입니다. HTML 문서에서는 긴 표의 검색칸으로 이름·타입·노드를 좁혀 볼 수 있습니다.\n\n### 조건부 실행 경로\n\n| 경로 | 조건 / 참조 |\n|---|---|\n| `d435_head_encoder_tf` | 명시 진단 도구. `/head/joint_states` (JointState, R10)와 D435 TF; 제품 bringup 자동 포함 아님. [읽기 전용과 모터 시험](calibration.md#d435와-lidar-벽-비교-및-헤드-관절-관측) |\n| `slip_monitor`, `traction_brake`, `SlipRecovery` | [슬립 복구](../../ros2_ws/src/cleany_navigation/docs/interfaces.md#slip_monitor-traction_brake와-sliprecovery-bt) |\n| `localization_guard` | [상세 계약][ros-localization-guard]. `/initialpose` 발행과 `/request_nomotion_update` 호출은 검증된 정지 복구에서만 수행 |\n\n각 노드의 발행, 구독, 서비스 제공/호출, 액션 제공/호출을 찾는 색인입니다. 상세 표는 코드 옆 `docs/interfaces.md`가 관리하고, 동작과 안전 규칙은 [INTEGRATION](integration.md)의 계약 reference를 따릅니다.\n\n표는 현재 소스와 launch의 기본 이름을 기록합니다. 실행별 namespace, 노드 name, parameter와 remap에 따라 실제 graph는 달라집니다. 조건부 endpoint, 외부 server, 미구현 타입을 구분하며 모든 노드가 동시에 실행되는 것으로 해석하지 않습니다.\n\n\n## 인식과 파지 후보 준비\n\n| 실행 파일 | 변경 인터페이스 |\n|---|---|\n| `camera_privacy` | [헤드캠 비식별 영상과 QoS](../../ros2_ws/src/cleany_perception/docs/interfaces.md#헤드캠-비식별-영상) |\n| `inspection_node` | [새 RGB-D 입력 검사와 검출 결과 필드](../../ros2_ws/src/cleany_perception/docs/interfaces.md) |\n| `grasp_server` | [후보 요청의 OBB 좌표계와 AnyGrasp 준비 서비스](../../ros2_ws/src/cleany_grasping/docs/interfaces.md) |\n\n실행 파일 이름은 유지됩니다. `grasp_server` 진입점은 NumPy import 전에\nCPU 연산 스레드 설정을 적용하는 `cleany_grasping.runtime`을 거칩니다.\n\n## 표 읽기\n\n| 표기 | 뜻 |\n|---|---|\n| 토픽 발행 / 구독 | 해당 노드에서 나가는 데이터 / 들어오는 데이터 |\n| 서비스 제공 / 호출 | Server / client |\n| 액션 제공 / 호출 | Action server / client |\n| R10, R20, R1 | Reliable, volatile, keep-last depth 10 / 20 / 1 |\n| B1 | Best-effort, volatile, keep-last depth 1 |\n| Sensor | Humble `qos_profile_sensor_data`: best-effort, volatile, keep-last depth 5 |\n| R/T1, R/T2048 | Reliable, transient-local, keep-last depth 1 / 2048 |\n| Service 기본값 | Humble service QoS: reliable, volatile, keep-last depth 10 |\n| Action 기본값 | rclpy 기본 request/result/cancel service와 feedback/status QoS. Status는 reliable, transient-local, depth 1 |\n| TF 기본 QoS | tf2_ros broadcaster/listener 기본값. 응용 코드가 별도 QoS를 지정하지 않음 |\n| 상대 이름 / `/절대 이름` / `~/private` | Node namespace 적용 / root 이름 / 노드 namespace와 노드 name 적용 |\n| 주기 | 소스의 기본 timer 또는 콜백 조건. 실제 수신 빈도와 동일하지 않을 수 있음 |\n\n## 종류별 통합 목록\n\n[Topic](#topic-목록), [Action](#action-목록), [Service](#service-목록)에서 이름으로 찾습니다. 노드 링크는 패키지의 상세 표로 연결하며, 아직 표에 없는 runtime endpoint는 구현 소스로 연결합니다. QoS와 호출 조건은 연결된 문서와 소스를 따릅니다.\n\n아래 이름은 **root namespace에서 기본 이름을 해석한 값**입니다. 상대 이름을 절대 이름으로 고정하는 설정이 아니며, namespace, remap과 parameter override가 있으면 달라집니다. `cleany_dev_monitor`의 `runtime_namespace`는 기본 빈 값으로 표시했습니다. `\u003c...>`는 실행 시 결정되는 이름 패턴입니다.\n\n| 색인 읽기 | 의미 |\n|---|---|\n| 여러 발행자 | 실행 대안 또는 같은 토픽의 다른 데이터 생산자; 동시 실행 지시 아님 |\n| mock_*, Gazebo, MuJoCo, sorting_cameras | Mock / simulation 경로 |\n| 외부 Nav2 / MoveIt / controller | 별도 실행 필요 |\n| — | 이 색인에서 상대 노드를 지정하지 않음; endpoint 부재 / 미구현 의미 아님 |\n| sorting_observer | ObservedMujocoSystem이 사용하는 publisher 노드; 독립 구동 controller 아님 |\n| Monitor 동적 구독 | Discovery와 사용자 선택으로 생성 |\n\nROS 자동 인터페이스는 [별도 표](#ros가-자동-생성하는-인터페이스)에 둡니다. 응용 코드가 직접 호출하거나 관찰하는 action cancel/status와 카메라 parameter 서비스는 통합 목록에도 표시합니다. 외부 패키지 전체 API와 실행 중 동적으로 발견되는 모든 이름을 열거하지는 않습니다.\n\n### Topic 목록\n\n| 기본 이름 (root namespace) | ROS 타입 | 발행 노드 | 구독 노드 | 조건 / 연결 |\n|---|---|---|---|---|\n| `/amcl_pose` | `geometry_msgs/msg/PoseWithCovarianceStamped` | — | [`cleany_dev_monitor`][ros-cleany-dev-monitor], [`system_supervisor`][ros-system-supervisor] | — |\n| `/base/wheel_command` | `cleany_base_interfaces/msg/WheelCommand` | [`cleany_base_driver`][ros-cleany-base-driver] | [`mock_base_mcu`][ros-mock-base-mcu], [`cleany_motor_controller`][ros-cleany-motor-controller] | — |\n| `/base/wheel_state` | `cleany_base_interfaces/msg/WheelState` | [`mock_base_mcu`][ros-mock-base-mcu], [`cleany_motor_controller`][ros-cleany-motor-controller] | [`cleany_base_driver`][ros-cleany-base-driver] | — |\n| `/behavior_tree_log` | `nav2_msgs/msg/BehaviorTreeLog` | — | [`cleany_dev_monitor`][ros-cleany-dev-monitor], [`nav2_bt_trace`][ros-nav2-bt-trace] | — |\n| `/body_guard_3d/risk_voxels` | `sensor_msgs/msg/PointCloud2` | [`voxel_guard`][ros-voxel-guard] | [`cleany_dev_monitor`][ros-cleany-dev-monitor] | — |\n| `/body_guard_3d/state` | `std_msgs/msg/String` | [`voxel_guard`][ros-voxel-guard] | [`cleany_dev_monitor`][ros-cleany-dev-monitor] | — |\n| `/bt_navigator/transition_event` | `lifecycle_msgs/msg/TransitionEvent` | — | [`nav2_bt_trace`][ros-nav2-bt-trace] | — |\n| `/camera/aligned_depth_to_color/image_raw` | `sensor_msgs/msg/Image` | [`sorting_cameras`][ros-sorting-cameras] | — | 발행자는 MuJoCo 전용; 실물 camera 제공자는 별도 |\n| `/camera/color/camera_info` | `sensor_msgs/msg/CameraInfo` | [`sorting_cameras`][ros-sorting-cameras] | [`perception_inspector`][ros-perception-inspector] | 발행자는 MuJoCo 전용; 실물 ca truth_route_follower` | [표](../../ros2_ws/src/cleany_gazebo_sim/docs/interfaces.md#ground_truth_route_follower) |\n| `mujoco_sim` | `cleany_mujoco_sim` | `mujoco_sim_node` | [표](../../ros2_ws/src/cleany_mujoco_sim/docs/interfaces.md#mujoco_sim) |\n| `left_wrist_camera_contract_adapter` | `cleany_mujoco_sim` | `camera_contract_adapter` | [표](../../ros2_ws/src/cleany_mujoco_sim/docs/interfaces.md#left_wrist_camera_contract_adapter) |\n| `single_pose_handeye_orchestrator` | `cleany_handeye_calibration` | `single_pose_calibration` | [표](../../ros2_ws/src/cleany_handeye_calibration/docs/interfaces.md#single_pose_handeye_orchestrator) |\n| `multi_pose_handeye_orchestrator` | `cleany_handeye_calibration` | `multi_pose_calibration` | [표](../../ros2_ws/src/cleany_handeye_calibration/docs/interfaces.md#multi_pose_handeye_orchestrator) |\n| `cleany_logger` | `cleany_logger` | `logger_node` | [표](../../ros2_ws/src/cleany_logger/docs/interfaces.md#cleany_logger) |\n| `cleany_logger` | `cleany_logger_cli_\u003csuffix>` | `logger` | [CLI](../../ros2_ws/src/cleany_logger/docs/interfaces.md#cli) |\n| `cleany_dev_monitor` | `cleany_dev_monitor` | `dev_monitor` | [표](../../ros2_ws/src/cleany_dev_monitor/docs/interfaces.md#cleany_dev_monitor) |\n| `cleany_motor_controller` | ESP32 micro-ROS | `esp32/src/main.cpp` | [MCU 표](../../esp32/README.md#ros-인터페이스) |\n| `ekf_filter_node` | 외부 `robot_localization` | `ekf_node` | [Bringup 표](../../ros2_ws/src/cleany_base_driver/docs/interfaces.md#ekf_filter_node) |\n\n| 패키지 / bootstrap | 역할 |\n|---|---|\n| single_pose_handeye_config / multi_pose_handeye_config | 실행 전 설정만 읽는 임시 노드; 응용 endpoint 없음 |\n| cleany_description / cleany_bringup | Model / launch |\n| cleany_interfaces / cleany_base_interfaces | ROS 타입 |\n| cleany_planner | 등록된 자체 ROS 노드 없음 |\n| cleany_logger | [독립 기록 노드](../../ros2_ws/src/cleany_logger/docs/data.md) |\n\nPerception과 sorting의 현재 진입점은 아래 패키지 문서를 따릅니다.\n\n## Runtime integration에서 추가된 실행\n\n| 노드 이름 | 실행 파일 | 구현과 API 안내 |\n|---|---|---|\n| `perception_inspector` | `inspection_node` | [Perception](../../ros2_ws/src/cleany_perception/docs/runtime.md#ros-api) |\n| `depth_scene_node` | `depth_scene_node` | [Depth 점군](../../ros2_ws/src/cleany_perception/docs/runtime.md#전체-depth-환경-포인트클라우드) |\n| `scene_cloud_receipt` | `scene_cloud_receipt_node` | [점군 수신 확인](../../ros2_ws/src/cleany_perception/docs/runtime.md#필터링-점군-수신-확인) |\n| `nearest_pregrasp_coordinator` | `nearest_pregrasp_coordinator` | [조작 경로](../../ros2_ws/src/cleany_skill_executor/docs/manipulation.md#가까운-객체-자동-pre-grasp) |\n| 공통 연산의 기본 `nearest_pregrasp_coordinator` 이름 | `sorting_coordinator` | [분류와 수거](../../ros2_ws/src/cleany_skill_executor/docs/study-cafe-sorting-usage.md#시뮬레이션-분리-수거-통합-검증-진행-중); launch remap 적용 여부 확인 |\n| `simulation_placement_verifier` | `placement_verifier` | [MuJoCo 표](../../ros2_ws/src/cleany_mujoco_sim/docs/interfaces.md#simulation_placement_verifier) |\n| `manipulation_server` | `manipulation_server` | [Mock Action 서버](../../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#manipulation_server) |\n| `manipulation_monitor` | `manipulation_monitor` | [읽기 전용 트리 모니터](../../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#manipulation_monitor) |\n| `manipulation_test_client` | `manipulation_test_client` | [요청·취소·조회 CLI](../../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#manipulation_test_client) |\n| `manipulation_mujoco_server` | `manipulation_mujoco_server` | [MuJoCo BT Action 서버](../../ros2_ws/src/cleany_manipulation_bt/README.md#계약과-증거) |\n\n`perception_inspector`는 `GetSceneSnapshot` 타입의 `/perception/get_scene_snapshot`을\n제공해 기존 cache를 조회합니다. `simulation_placement_verifier`의\n`/sorting/register_placement_target`은 `RegisterPlacementTarget`으로 개체를 고정하며,\n`VerifyPlacement.verification_id`로 해당 개체만 검증합니다.\n상세 필드는 [관측 계약](../../ros2_ws/src/cleany_interfaces/docs/observation-contracts.md)을 따릅니다.\n\n## 외부 노드와 타입만 있는 계약\n\n| 경계 | 연결 위치와 현재 상태 |\n|---|---|\n| Gazebo `ros_gz_bridge` | [Bridge 표](../../ros2_ws/src/cleany_gazebo_sim/docs/interfaces.md#ros_gz_bridge). ROS/Gazebo sensor와 명령 변환 |\n| Nav2 / AMCL / Collision Monitor | [Navigation launch](../../ros2_ws/src/cleany_navigation/launch/navigation.launch.py)와 [설정](../../ros2_ws/src/cleany_navigation/config)이 조합을 선택. Mission이 호출하는 action/lifecycle 서비스는 Mission 노드 표에 포함 |\n| MoveIt `move_group` | `/compute_ik`, `/compute_fk`, `/check_state_validity`, `/get_planning_scene`, `/apply_planning_scene`, `/move_action`, `/execute_trajectory`를 이용. 자체 호출 노드 표와 [Planning 계약](../../ros2_ws/src/cleany_moveit_config/docs/planning.md)에서 연결 확인 |\n| FreeCAD 검사 `move_group` | `freecad_inspection.launch.py`에서 CAD 상태 검사와 OctoMap 제공. `runtime_test/check_freecad_lower_body.py`는 자체 필터와 시험 장애물 접촉을 조회하는 보조 노드. [검사 인터페이스](../../ros2_ws/src/cleany_moveit_config/docs/interfaces.md#freecad-검사) |\n| ros2_control | Arm/gripper의 FollowJointTrajectory와 joint_state_broadcaster. [Controller 설정](../../ros2_ws/src/cleany_moveit_config/config/mock_ros2_controllers.yaml)과 [MuJoCo backend launch](../../ros2_ws/src/cleany_mujoco_sim/launch/study_cafe_backend.launch.py)이 선택 |\n| `robot_state_publisher` | `joint_states` 구독, `/tf`, `/tf_static` 발행. `description.launch.py`의 선택형 `freecad_final`은 정적 프레임, `freecad_kinematic`은 `cad_delta_*` 입력과 CAD 링크 프레임, 기본 `freecad_calibrated`는 공통 `cleany.urdf`의 보정된 CAD 프레임, 선택형 `legacy_runtime`은 기존 `jetson_20261009` xacro 관절 프레임 제공. 선택형 namespace는 description, joint state, TF 토픽에, frame_prefix는 TF frame ID에 적용. [모델 계약](../../ros2_ws/src/cleany_description/docs/model.md)이 frame 의미를 관리 |\n| `InspectScene` | `perception_inspector`가 `perception/inspect_scene`을 제공. [Perception API](../../ros2_ws/src/cleany_perception/docs/runtime.md#ros-api) |\n| `ExecuteManipulationSkill` | Runtime의 action client와 [타입](../../ros2_ws/src/cleany_interfaces/action/ExecuteManipulationSkill.action)은 존재. 기본 mock는 process 내부 구현이며 `action_mock`은 선택형 Python Mock 서버에 연결 |\n\n위 표는 외부 패키지의 연결 경계입니다. 외부 패키지의 전체 API 목록은 해당 패키지 문서와 실행 graph를 기준으로 확인합니다. RViz, rqt, controller spawner와 검증용 probe 노드는 실행 보조 도구이며 자체 제품 endpoint 목록에 포함하지 않습니다.\n\n## ROS가 자동 생성하는 인터페이스\n\nParameter 서비스와 이벤트, rosout, sim clock 구독, action 내부 전송은 응용 표에서 반복하지 않습니다. 아래 패턴이 노드 옵션과 실행 상태에 따라 추가됩니다.\n\n| 항목 | 기본 패턴 / 타입 |\n|---|---|\n| Parameter 서비스 | `\u003cnode>/{describe_parameters,get_parameter_types,get_parameters,list_parameters,set_parameters,set_parameters_atomically}`; `rcl_interfaces/srv/*` |\n| Parameter 변경 이벤트 | `/parameter_events`; `rcl_interfaces/msg/ParameterEvent` |\n| 로그 | `/rosout`; `rcl_interfaces/msg/Log`, rosout 활성화 시 |\n| Simulation clock | `/clock`; `rosgraph_msgs/msg/Clock`, ROS time source 연결 시; `use_sim_time`으로 시간 적용 선택 |\n| Action 요청 / 결과 / 취소 | `\u003caction>/_action/{send_goal,get_result,cancel_goal}` 서비스 |\n| Action feedback / status | `\u003caction>/_action/{feedback,status}` 토픽 |\n\n명시적으로 만든 cancel client와 status subscription은 호출 노드의 표에도 표시합니다. ESP32 rclc 노드는 표에 적힌 wheel interface만 초기화하며 rclpy의 자동 parameter 서비스가 동일하게 생긴다고 가정하지 않습니다.\n\n## 실행 중 확인\n\n실행한 구성과 같은 DDS domain, 같은 overlay의 터미널에서 확인합니다.\n\n```bash\nros2 node list\nros2 node info /mission_runtime\nros2 topic list -t\nros2 topic info /cmd_vel --verbose\nros2 service list -t\nros2 action list -t\nros2 action info /grasp/select_reachable\n```\n\n실행 graph는 해당 실행의 증거입니다. 조건부 노드를 실행하지 않은 결과를 전체 소스의 인터페이스 목록으로 대체하지 않습니다. 코드를 변경할 때 해당 노드 표와 이 색인을 함께 갱신합니다.\n\n## Jetson 실물 상태와 제어\n\n| 실행 파일 | 역할과 인터페이스 |\n|---|---|\n| `arm_state_reader`, `robot_state_reader` | [실측 관절 상태 조회](../../ros2_ws/src/cleany_robot_interface/docs/interfaces.md) |\n| `runtime_model_state` | [공통 CAD 관절 미리보기](../../ros2_ws/src/cleany_description/docs/runtime-model.md) |\n| `calibrated_camera_pose` | [보정된 카메라 TF](../../ros2_ws/src/cleany_robot_interface/docs/interfaces.md#보정된-카메라-tf) |\n| `control_state_guard` | [관절 상태 검증과 컨트롤러 정지](../../ros2_ws/src/cleany_robot_interface/docs/interfaces.md) |\n| `wrist_rgb_camera`, `rgbd_frame_bridge` | [손목 영상과 헤드 RGB-D 좌표계](../../ros2_ws/src/cleany_robot_interface/docs/interfaces.md) |\n| `motor_telemetry_recorder` | [모터 상태 수동 기록](../../ros2_ws/src/cleany_robot_interface/docs/interfaces.md) |\n\n\n## 실물 계획과 준비 자세 실행\n\n| 실행 파일 | 패키지 | 계약 |\n|---|---|---|\n| `physical_grasp_selection_server` | `cleany_skill_executor` | [선택기](../../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#physical_grasp_selection_server) |\n| `validate_pick_server` | `cleany_skill_executor` | [Plan-only 검증](../../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#validate_pick_server) |\n| `pregrasp_pipeline`, `hardware_pregrasp`, `pregrasp_sim_ready` | `cleany_skill_executor` | [준비 자세 도구](../../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#준비-자세-실행-도구) |\n\n인식 노드의 추가 관찰 서비스, 상태 토픽은 [인식 인터페이스](../../ros2_ws/src/cleany_perception/docs/interfaces.md#기준-물체-재관찰과-예열-알림),\nMoveGroup 배치 서비스는 [계획 capability](../../ros2_ws/src/cleany_moveit_capabilities/README.md)를 따른다.\n\n## 실물 매핑과 휴대폰 조종\n\n| 패키지 | 실행 파일 | 인터페이스 |\n|---|---|---|\n| cleany_teleop | phone_remote | [조종과 웹 계약](../../ros2_ws/src/cleany_teleop/docs/interfaces.md) |\n| cleany_teleop | gamepad_input / gamepad_teleop / gamepad_head | [Jetson 패드 입력 및 조종](how-to/gamepad.md) |\n| cleany_teleop | commission_wheels | 같은 문서의 독립 시험 CLI |\n| cleany_navigation | mapping_scan_filter, mapping_session | [매핑 계약](../../ros2_ws/src/cleany_navigation/docs/mapping.md) |\n| cleany_bringup | hardware_runtime | [프로세스 수명](../../ros2_ws/src/cleany_bringup/docs/hardware-mapping.md) |\n\nBase driver의 `base/set_enabled`와 wheel odometry의 `~/reset`은 해당 패키지 reference에 설명합니다.\n\n## ToF 활성 구성\n\n[ToF reference][ros-tof]는 `tof_driver`, `proximity_guard`, `desk_approach` 실행 파일과\n조건부 Mission Action client를 관리합니다. `tof_enabled=false`인 구성에는 생성하지 않습니다.\n\n| Endpoint | 타입 | 발행 또는 제공 | 구독 또는 호출 |\n|---|---|---|---|\n| `/tof/frame` | `cleany_interfaces/msg/TofFrame` | tof_driver | proximity_guard, desk_approach |\n| `/motion/cmd_vel` | `geometry_msgs/msg/Twist` | desk_approach | 기존 navigation 안전 계층 |\n| `/proximity/input` | `geometry_msgs/msg/Twist` | 기존 최종 안전 계층 | proximity_guard |\n| `/proximity/status` | `std_msgs/msg/String` | proximity_guard | 관측 도구 |\n| `/system/component_health` | `cleany_interfaces/msg/ComponentHealth` | proximity_guard (추가 source) | system_supervisor |\n| `/desk/approach` | `cleany_interfaces/action/DeskApproach` | desk_approach | mission_runtime |\n\n[ros-tof]: ../../ros2_ws/src/cleany_tof/docs/interfaces.md\n\n## 로컬 얼굴 디스플레이\n\n`cleany_display` 패키지의 `cleany_display` 실행 파일은 같은 이름의 노드로 미션 상태, 미션 결과, 수거 실행 기록, 오도메트리, 배터리와 화면 지정 입력을 구독한다. 로봇 명령을 발행하지 않는다. 토픽 타입, QoS와 로컬 HTTP 규약은 [디스플레이 인터페이스](../../ros2_ws/src/cleany_display/docs/interfaces.md)를 따른다.\n\n## 실물 수거 실행과 복구\n\n| 실행 파일 | 패키지 | 참조 |\n|---|---|---|\n| `manipulation_jetson_server` | `cleany_manipulation_bt` | [BT Action, 복귀와 복구](../../ros2_ws/src/cleany_manipulation_bt/docs/interfaces.md) |\n| `arm_return`, `manipulation_recovery` | `cleany_manipulation_bt` | [명시 요청 client](../../ros2_ws/src/cleany_manipulation_bt/docs/interfaces.md) |\n| `collection_pipeline` | `cleany_skill_executor` | [설정 검사와 명시 실행](../../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#collection_pipeline) |\n| `manipulation_evidence` | `cleany_skill_executor` | [읽기 전용 실행 근거](../../ros2_ws/src/cleany_skill_executor/docs/interfaces.md#manipulation_evidence) |\n\n## 운영 UI와 승인 대상 재확인\n\n| 실행 또는 노드 | 계약 |\n|---|---|\n| `dev_monitor`와 `cleany_dev_monitor_operator_\u003cpid>_\u003cid>` | [관측, 인증과 작업 제안](../../ros2_ws/src/cleany_dev_monitor/docs/interfaces.md) |\n| `inspection_node`의 `perception/revalidate_target` | [승인 대상의 최신 기하와 원본 분류](../../ros2_ws/src/cleany_perception/docs/interfaces.md#승인-대상-재확인) |\n\n운영 adapter는 Monitor와 작업 worker에서 생성한다. 별도 ROS console 실행 파일을 추가하지 않는다.\n\n휴대폰 지도 주행 옵션(`phone_remote --navigation`): `/map`, `/plan`, `/scan`, `/odom`, `/nav2/cmd_vel` 구독, `/initialpose` 발행, `navigate_to_pose` Action client, `navigation/stop` Action server. 상세 계약은 [teleop interfaces](../../ros2_ws/src/cleany_teleop/docs/interfaces.md)를 따릅니다.\n\n- `tools/validation/map_extension/extend.py`: 독립 실험 실행 도구. 외부 Cartographer와\n  occupancy grid 노드를 `/map_extension`에서 실행하며 `/scan`, `/odom`, TF를 읽습니다.\n  `/map_extension/map` (`nav_msgs/OccupancyGrid`)과 `/map_extension/tracked_pose`\n  (`geometry_msgs/PoseStamped`), Cartographer 표준 서비스를 사용합니다. TF와 모터 명령은 발행하지 않습니다.\n- `tools/validation/map_extension/view_tf.py`: RViz 전용 `/map_extension/view_tf`\n  (`tf2_msgs/TFMessage`)를 발행합니다. 기존 odometry TF와 Cartographer\n  `/map_extension/tracked_pose`를 같은 시각에 결합하며 전역 `/tf`는 변경하지 않습니다.\n  같은 표시 도구의 `/map_extension/view_trajectory` (`visualization_msgs/MarkerArray`)는\n  원본 궤적 메시지를 복사해 기존 궤적은 파랑, 추가 궤적은 불투명 노랑으로 표시합니다.\n  원본 Cartographer marker의 투명도와 연결 상태 정보는 수정하지 않습니다.\n\n\n- `cleany_navigation/depth_obstacles_preview`: 촬영 시각 head TF 기반 D435 장애물 미리보기.\n  센서 구독, 점군 및 상태 발행, 별도 preview TF는\n  [미리보기 인터페이스](../../ros2_ws/src/cleany_navigation/docs/interfaces.md#depth_obstacles_preview)를 따릅니다.\n\n- 실물 depth overlay: 기존 `depth_clearance`가 `/perception/depth/nav_points`, `/perception/depth/nav_obstacle_points`를 발행하고 local costmap 및 `collision_monitor`가 소비합니다. 별도 실행 파일이나 3D 정지 가드는 추가하지 않습니다. [실물 depth 계약](../../ros2_ws/src/cleany_navigation/docs/interfaces.md#depth_clearance)을 따릅니다.\n\n[ros-ekf-filter-node]: ../../ros2_ws/src/cleany_base_driver/docs/interfaces.md#ekf_filter_node\n\n## 이벤트 궤적 제어기\n\n`cleany_trajectory_controller/JointTrajectoryController`는 팔과 그리퍼의 기존\n`FollowJointTrajectory` Action을 유지하면서 완료 결과를 이벤트로 전달한다.\n별도 노드 실행 파일은 추가하지 않는다. 설정과 취소 및 명령 교체 규약은\n[제어기 인터페이스](../../ros2_ws/src/cleany_trajectory_controller/docs/interfaces.md)를 따른다.\n"},"docs/implementation/running.md":{"title":"실행 가이드","body":"# 실행 가이드\n\n할 일을 선택하고 준비 → 실행 → 관측 → 종료 순서로 진행합니다. 각 가이드는 같은 저장소의 명령과 설정을 기준으로 합니다.\n\n| 하려는 일 | 가이드 | 확인할 결과 |\n|---|---|---|\n| 가상 환경에서 센서·주행 확인 | [시뮬레이션](how-to/simulation.md) | scan, odom, TF |\n| LiDAR로 지도 생성·저장 | [매핑](how-to/mapping.md) | map.yaml, PGM, pbstream |\n| Jetson 게임패드 수동 조종 | [리시버와 입력 시험](how-to/gamepad.md) | 스틱 중립과 입력 단절 후 MCU 정지 확인 |\n| 저장 지도에서 목표 주행 | [휴대폰 주행](how-to/phone-navigation.md) | 경로 미리보기와 정지 응답 |\n| 물체 관찰·후보 계획·조작 | [조작](how-to/manipulation.md) | snapshot, 계획, Action 결과 |\n| Backend 요청과 실행 연결 | [Mission](how-to/mission.md) | 요청 수락, 허가, 결과 |\n| 센서 입력과 장애물 관측 | [센서](how-to/sensors.md) | 영상·점군·좌표계·시각 |\n| MCU와 베이스 연결 | [베이스](how-to/base.md), [펌웨어](../../esp32/README.md) | 휠 피드백과 STOP ACK |\n| 기록과 화면 확인 | [관측·기록](how-to/monitoring.md) | Logger 세션과 Monitor 화면 |\n\n## 공통 준비\n\n명령은 저장소 루트의 Ubuntu 22.04 / Humble 터미널에서 실행합니다. [환경과 출력 경로](development-setup.md), [연동 계약](integration.md)을 확인한 뒤, 각 터미널에 같은 DDS domain과 같은 worktree overlay를 적용합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource \"$(make -s print-install-base)/setup.bash\"\n```\n\nNavigation 전용 빌드는 `print-navigation-install-base`로 overlay를 조회합니다. 빌드 때 바꾼 Make 변수는 경로 조회 때도 동일하게 전달합니다.\n\nJetson에서 Dashboard와 실물 Runtime을 연결하는 순서는 [관제 통합](how-to/control-plane-integration.md)을 따릅니다.\n\n### 헤드캠 비식별 프리뷰\n\nJetson의 모델 디렉터리는 `/var/opt/cleany/models/camera-privacy/active`다. YOLOE용 `privacy.engine`, YuNet용 `face.onnx`, 글자 위치 검출용 `text.plan`을 함께 둔다. 카메라와 같은 ROS 환경에서 native YOLOE Python으로 실행한다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource /opt/cleany/current/ros/local_setup.bash\n/opt/cleany/current/native/yolo-env/bin/python \\\n  \"$(ros2 pkg prefix cleany_perception)/lib/cleany_perception/camera_privacy\" \\\n  --ros-args -p gpu_lock_path:=/var/opt/cleany/state/cleany/gpu-work.lock\n```\n\n운영 프리뷰는 `cleany_telemetry camera_preview`에 `-p allowed_topic:=/camera/head/color/image_redacted`를 전달한다. 노드는 구독자가 생기면 추론을 시작한다. 기존 ROS 원본 구독자와 외부 장면 분류기 설정은 별도로 확인한다. [토픽 계약과 클라우드 입력 설정](../../ros2_ws/src/cleany_perception/docs/interfaces.md#헤드캠-비식별-영상)\n"},"docs/implementation/testing.md":{"title":"변경을 검증하기","body":"# 변경을 검증하기\n\n수정한 경계에 맞는 검사를 고르고, 자동 검사와 시뮬레이션, 실물 결과를 구분합니다.\n\n```mermaid\nflowchart TD\n  Change{\"변경한 경계\"}\n  Change -->|\"core 로직\"| Unit[\"패키지 단위 검사\"]\n  Change -->|\"ROS 인터페이스\"| ROS[\"빌드 + ROS 연동 검사\"]\n  Change -->|\"가상 센서·제어\"| Sim[\"시뮬레이션 시나리오\"]\n  Change -->|\"실물 설정·구동\"| Real[\"장치와 실물 시험\"]\n```\n\n## 먼저 고를 검사\n\n| 바꾼 것 | 첫 검사 | 추가로 확인할 것 |\n|---|---|---|\n| 순수 Python 로직 | 해당 패키지 pytest | 입력 오류, 상태 전이와 실패 경로 |\n| ROS 타입·launch·설치 데이터 | 관련 package build/test | 실제 topic·service 연결 |\n| 여러 패키지 연결 | 합성 ROS runtime | lifecycle, 취소, 재연결 |\n| 주행·인식·조작 | 관련 시뮬레이터 runtime | 실제 장치와 주행·정지는 별도 시험 |\n| UI | 실제 제공 페이지의 브라우저 검사 | 갱신, 재접속, 모바일 레이아웃 |\n| 문서 | 링크·명령 구문·생성 파일 검사 | 아래 문서 검증 명령 |\n\n## 자주 쓰는 명령\n\n| 범위 | 명령 |\n|---|---|\n| 전체 ROS workspace | `make test` |\n| Mission core / Supervisor core | `make test-mission-core`, `make test-supervision-core` |\n| Navigation / Gazebo | `make test-navigation`, `make test-gazebo` |\n| ROS Navigation runtime | `make test-navigation-runtime` |\n| 조작 Mock / MuJoCo BT | `make test-manipulation`, `make test-manipulation-bt` |\n| Base / ESP32 | `make test-base`, `make test-motor-core` |\n| 매핑 / 슬립 분석 | `make test-hardware-mapping-core`, `make test-slip-detection` |\n| Logger / Monitor | `make test-logger`, `make test-dev-monitor` |\n| Telemetry 카메라 | `make test-camera-preview-core`, ROS 환경의 `make test-telemetry` |\n\n환경과 선택 실행 조건, 전체 명령표는 [상세 참조](reference/testing.md#검사-선택)를 따릅니다. 장치가 없는 검사와 실물 실행 검사는 같은 성공으로 합산하지 않습니다.\n\n## 문서 사이트 검사\n\n```bash\npython3 tools/docs/build_site.py --check\npython3 docs/guide/build_standalone.py --check\ngit diff --check\n```\n\n브라우저에서는 데스크톱과 모바일에서 메뉴, 검색, 도표 확대와 내부 링크를 확인합니다.\n설정 기반 그림은 [재생성 검사](../../tools/README.md#문서-그림-재생성)로 입력 해시와 PNG 일치를 확인합니다.\nChromium의 로컬 CDP 포트가 열려 있고 `websockets`가 설치돼 있다면 다음 검사는 구현 문서와 학습 가이드의 모든 페이지를 1440 px / 390 px로 엽니다. 보고서와 그림별 화면은 사용자 캐시에 저장합니다.\n\n```bash\npython3 tools/docs/check_reader.py --endpoint http://localhost:9228\n```\n\n이 검사는 도식 렌더링, 이미지 로드, 문서 가로 넘침과 확대 동작을 확인합니다. 이미지가 본문의 질문에 맞는지는 별도로 검토합니다.\n\n## 상세 조건 찾기\n\n| 확인할 것 | 참조 |\n|---|---|\n| 전체 Make target와 준비 환경 | [검사 선택](reference/testing.md#검사-선택) |\n| CI 이미지와 캐시 | [CI 실행](reference/testing.md#ci-실행과-재사용) |\n| 명시 실행이 필요한 ROS / UI | [선택 runtime](reference/testing.md#선택-runtime과-ui) |\n| 실물 매핑 / ToF / 화면 / 모델 | [기능별 조건](reference/testing.md#실물-매핑-패키지-경계) |\n| 기록 분석과 주행 모델 비교 | [오프라인 분석](reference/testing.md#기록-분석-도구) |\n| 결과의 해석 | [결과와 증거](reference/testing.md#결과와-증거) |\n\n### 위치 관측과 Backend adapter 분리 검증\n\n`make build-pose-observation`으로 telemetry, control bridge와 bringup을 빌드한 뒤 해당\ninstall의 `setup.bash`를 적용합니다. `make test-pose-observation`은 원본 시각과 좌표계,\n오래된 입력, TF와 odom 관측, Backend payload와 인증 파일 갱신을 확인합니다. ROS 테스트는\n합성 입력을 사용하므로 실물 위치 정확도를 증명하지 않습니다.\n\n`tools/validation/telemetry_pose_pipeline.py`는 별도 ROS domain에서 메모리 DB를 사용하는\n실제 Backend 서버와 합성 위치 입력을 연결합니다. 관측 유지, 인증 전송, 입력 만료와\nBackend 재연결을 확인하며 운영 DB와 주행 명령은 사용하지 않습니다.\n\n```bash\nROS_DOMAIN_ID=181 ROS_LOCALHOST_ONLY=1 RMW_IMPLEMENTATION=rmw_fastrtps_cpp \\\npython3 tools/validation/telemetry_pose_pipeline.py \\\n  --backend-root \"$CLEANY_CONTROL_PLANE_ROOT\" \\\n  --backend-python \"$CLEANY_CONTROL_PLANE_ROOT/apps/backend/.venv/bin/python\" \\\n  --output \"$CLEANY_DATA_ROOT/runs/platform/$(date +%F)_telemetry-pose-separation\"\n```\n\n### 카메라 비식별화 재생 검증\n\n`tools/validation/camera_privacy_replay.py`는 촬영 영상을 지정한 시간 구간에서 샘플링하고, 음성 없는 H.264 영상과 프레임별 마스크 범위, 추론 시간을 기록한다. `--regions`로 원본에서 표시한 폴리곤을 넘기면 영역 전체 픽셀 수와 가려진 수를 함께 계산한다. 한 장의 사진에는 PNG 출력을 사용한다.\n\n```bash\nPRIVACY_MODELS=/var/opt/cleany/models/camera-privacy/active\n/opt/cleany/current/native/yolo-env/bin/python tools/validation/camera_privacy_replay.py \\\n  --weights \"$PRIVACY_MODELS/privacy.engine\" --face \"$PRIVACY_MODELS/face.onnx\" \\\n  --text \"$PRIVACY_MODELS/text.plan\" --device 0 --input \"$CLIP\" \\\n  --start 1 --duration 5 --fps 12 --output \"$RUN_DIR/preview.mp4\"\n```\n\n격리 ROS 도메인에서 카메라 노드의 입력을 `/privacy_fixture/raw`로 설정하고 프리뷰를 포트 18769에서 실행한다. `tools/validation/camera_privacy_ros.py --fixture staged-card.png`는 640×480 카드 시험 영상으로 ROS 출력의 원본 시각, 마스킹, 작업 물체 보존과 HTTP의 원본·만료 프레임 처리를 확인한다.\n"},"docs/index.md":{"title":"Cleany 문서","body":"# Cleany 문서\n\n현재 구현을 확인하거나, 로봇 소프트웨어를 처음부터 배울 수 있습니다.\n\n\u003cdiv class=\"cards doc-collections\">\n\u003ca class=\"card\" href=\"implementation/index.md\">\u003cspan class=\"card-number\">IMPLEMENTATION\u003c/span>\u003cstrong>설계·구현 문서\u003c/strong>\u003cspan>현재 시스템 구성, 실행 절차, 인터페이스와 검증 방법을 확인합니다.\u003c/span>\u003c/a>\n\u003ca class=\"card\" href=\"guide/index.html\">\u003cspan class=\"card-number\">LEARNING GUIDE\u003c/span>\u003cstrong>신입 학습 가이드\u003c/strong>\u003cspan>로봇 소프트웨어의 개념을 익히고, Cleany 코드와 작은 실습을 따라갑니다.\u003c/span>\u003c/a>\n\u003c/div>\n\n제품 요구사항과 설계 결정의 근거는 [팀 KB](cleany-docs/README.md)에서 관리합니다. 패키지별 구현 계약은 [설계·구현 문서의 패키지 지도](implementation/packages.md)에서 찾을 수 있습니다.\n"},"esp32/README.md":{"title":"ESP32-S3 micro-ROS motor controller","body":"# ESP32-S3 micro-ROS motor controller\n\n```mermaid\nflowchart LR\n  Cmd[\"차체 Twist + 구동 허가\"] --> Driver[\"Base driver / 휠 변환\"]\n  Driver -->|\"wheel_command\"| MCU[\"ESP32 / PI · FF · watchdog\"]\n  MCU -->|\"wheel_state\"| Driver\n  Driver --> Odom[\"joint_states → wheel odometry\"]\n```\n\n[베이스 연결부터 확인](../docs/implementation/how-to/base.md) · [빌드와 장치 없는 검사](#1-빌드와-장치-없는-검사) · [업로드와 통신](#2-upload와-통신) · [실물 인수](#3-실물-인수)\n\nNative USB micro-ROS와 encoder, PWM/DIR로 4륜을 제어하는 펌웨어입니다. Target은 ESP32-S3 N32R16V(octal flash 32 MB / PSRAM 16 MB), PlatformIO environment는 `esp32-s3-microros`입니다. GPIO는 [PINMAP](pinmap.md), 고정 버전은 `micro_ros.lock.json`에서 확인합니다.\n\n| 경로 | 역할 |\n|---|---|\n| src/ | firmware, motor core |\n| host_tests/ | 장치 없는 C++/Python 검사 |\n| scripts/ | PlatformIO, 고정 dependency bootstrap |\n| microros_smoke/ | micro-ROS/type-support 링크 검사 |\n| imu_calibration/ | MPU6050 정지 보정 진단과 USB JSON 결과 |\n| [tof_vl53l7ch/](tof_vl53l7ch/README.md) | 독립 16 MiB 센서 보드용 VL53L7CH USB 거리 측정 펌웨어 |\n| pcb/ | KiCad, 로컬 library |\n| micro_ros/, .venv/ | 생성 dependency, 빌드 도구 |\n\n도구 이동 후에는 `make firmware-setup`으로 Git wrapper 링크를 갱신합니다. Wrapper는 component root와 하위 폴더 clone 모두 revision을 고정합니다.\n\n## KiCad 보드\n\n[통합 컨트롤러 프로젝트](pcb/integrated_controller/integrated_controller.kicad_pro)는\nESP32-S3 모듈, BNO055, ToF 멀티플렉서와 전원 회로를 포함합니다.\nKiCad 10에서 프로젝트를 열고 [보드 핀맵](pcb/integrated_controller/PINMAP.md),\n[BOM](pcb/integrated_controller/BOM.md), [제작 규칙](pcb/integrated_controller/DESIGN_RULES.md)을 함께 확인합니다.\n검사는 저장소 루트의 `make test-pcb`로 실행하며 환경과 결과 경로는\n[개발환경](../docs/implementation/development-setup.md#kicad-pcb-검증-환경)과\n[검증 절차](../docs/implementation/reference/testing.md#통합-컨트롤러-pcb-검증)를 따릅니다.\n\n현재 펌웨어의 모터 GPIO와 MPU6050 드라이버는 기존 모터 보드 기준입니다.\n통합 보드에는 모터 GPIO 매핑과 BNO055 드라이버의 별도 이식이 필요합니다.\n[별도 USB 센서 캐리어](pcb/sensor_controller/sensor_controller.md)는\n회로도와 제작 설정 초안이며 부품 배치와 배선이 없는 상태입니다.\n\n## ROS 인터페이스\n\n노드 이름은 `cleany_motor_controller`, namespace는 기본 root입니다. [main.cpp](src/main.cpp)의 rclc entity 초기화를 기준으로 기록합니다.\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS와 주기 |\n|---|---|---|---|\n| 토픽 구독 | `base/wheel_command` | `cleany_base_interfaces/msg/WheelCommand` | Best-effort, volatile, keep-last 1 |\n| 토픽 발행 | `base/wheel_state` | `cleany_base_interfaces/msg/WheelState` | Best-effort, volatile, keep-last 1; 50 Hz |\n| 토픽 발행 | `imu_uncalibrated/data_raw` | `sensor_msgs/msg/Imu` | Best-effort, volatile, keep-last 1; 최대 100 Hz |\n\nMCU에 서비스와 액션은 없습니다. 구동 허가는 WheelCommand의 ENABLE/STOP으로 처리하고, ROS `base/enable` 서비스는 [base driver](../ros2_ws/src/cleany_base_driver/docs/interfaces.md)가 제공합니다. 전체 노드는 [ROS 인터페이스 색인](../docs/implementation/ros-interfaces.md)에서 찾습니다.\n\n## Runtime\n\n```mermaid\nflowchart TB\n    Driver[\"ROS base driver\"] -->|\"base/wheel_command\"| USB[\"USB XRCE-DDS\"]\n    subgraph Communication[\"통신 task\"]\n        Callback[\"rclc callback\"] --> Mailbox[\"최신 명령 mailbox\"]\n        Ping[\"Agent ping / 재연결\"]\n    end\n    USB --> Callback\n    subgraph Control[\"motor task / 5 ms\"]\n        Gate[\"ENABLE / deadline 검사\"] --> PI[\"PI + feed-forward\"] --> PWM[\"PWM / DIR\"]\n        Encoder[\"Encoder feedback\"] --> PI\n        Encoder --> State[\"Wheel state\"]\n    end\n    Mailbox --> Gate\n    Ping -->|\"단절 시 STOP latch\"| Gate\n    PWM --> Motor[\"네 휠\"]\n    Motor --> Encoder\n    State -->|\"base/wheel_state\"| USB\n    USB --> Driver\n```\n\n통신 task는 USB, ROS entity, Agent 재연결을 관리합니다. Motor task는 독립적으로 5 ms마다 실행하며, `motorMutex` 안에서 명령을 검사하고 PWM을 갱신합니다. 부팅 시 PWM은 0이고 구동은 disabled입니다. Zero ENABLE을 받은 뒤 VELOCITY를 허용합니다.\n\n| 조건 | 처리 |\n|---|---|\n| STOP, 재연결 | Sequence high-water 유지 |\n| 거부된 명령, 반복 ENABLE | Deadline과 이동 목표를 갱신하지 않음 |\n| STOP latch | 대기 명령 삭제; 새 sequence로 오래된 ENABLE 차단 |\n| Deadline | 수신 후 최대 250 ms; 명령 처리 전에 검사 |\n| 만료, 단절 | 허가 해제; 재개에는 새 ENABLE 필요 |\n| STOP, 만료, 단절 | Controller reset과 PWM 0 요청 |\n| Agent ping 실패 | STOP latch → entity teardown → 재연결 |\n\n| 항목 | 값과 규칙 |\n|---|---|\n| Wheel ceiling, 목표 반올림 | 10 rad/s, 0.1 rad/s 단위 |\n| PWM | 20 kHz, 명령 슬루는 20 ms당 가속 1%p, 감속 3%p |\n| 방향 반전 | 측정 속도 ≤0.5 rad/s를 50 ms 유지한 뒤 DIR 변경 |\n| Wheel 배열 | FL/FR/RL/RR → PCB M1/M2/M4/M3, mapping `{0,1,3,2}` |\n| 극성, encoder | 극성은 MCU에서만 적용; 출력축 1회전=3172 counts |\n| State | 50 Hz, best-effort/volatile/keep-last-1 |\n| MCU 시간, Boot ID | Monotonic µs; reboot baseline 식별 |\n| USB | Agent용 framed XRCE-DDS 전용 |\n| Agent ping | 100 ms 주기, 20 ms timeout |\n\n메시지와 명령 수락 규칙은 [protocol v2](../ros2_ws/src/cleany_base_interfaces/docs/protocol.md)를 따릅니다.\n\n## Runtime MPU6050 telemetry\n\n```mermaid\nflowchart LR\n    IMU[\"MPU6050 / data-ready\"] --> Task[\"독립 acquisition task / priority 2\"]\n    Task --> Queue[\"1-entry overwrite queue\"]\n    Queue --> Comm[\"Communication task / priority 4\"]\n    Comm --> ROS[\"base/imu_state\"]\n    Motor[\"Motor task / priority 6\"] -. motorMutex 독립 .-> Task\n```\n\n| 장치 / 설정 | 값 |\n|---|---|\n| 포트 | J_I2C1, SDA GPIO41 / SCL GPIO42; 모듈 또는 외부 pull-up 필요 |\n| I2C / 샘플 | 100 kHz / 100 Hz |\n| 센서 범위 | Gyro ±250 deg/s, accelerometer ±2 g, gyro DLPF 42 Hz |\n| 획득 | Data-ready 2 ms polling; motorMutex 미사용 |\n| 발행 | 새 표본으로 최대 100 Hz, Best-effort / Volatile / Keep-last 1; WheelState는 50 Hz |\n| 통신 정체 | 중간 표본 overwrite; 재연결 때 backlog 방출 안 함 |\n| 거부 | 100 ms 초과 획득값, 중복 / 역행 측정 시각 |\n| 센서 오류 | 최대 10 Hz fault heartbeat, saturation 별도 bit; 초기화 / 읽기 재시도 250 ms–5 s backoff |\n\n통신 task는 `sensor_msgs/msg/Imu`를 `imu_uncalibrated/data_raw`에 best effort, volatile,\nkeep last 1로 최대 100 Hz 발행한다. Gyro와 중력 포함 acceleration은 센서 축의\n보정 전 SI 값이다. Frame은 `imu_link`, orientation covariance 첫 원소는 -1,\n나머지 covariance는 unknown(0)이다. 오류, 포화, 비유한 값, 중복/역행 취득 시각과\n100 ms 초과 sample은 발행하지 않는다. 초기화와 읽기 오류는 250 ms에서 5초까지\nbackoff하며 재시도한다. 원인 log는 firmware가, 입력 단절 진단은 host가 제공한다.\n\nAgent 연결마다 session 시각을 동기화한 뒤 현재 epoch에서 sample age를 빼\nROS 취득 stamp를 만든다. 실패 시 1초 간격으로 재시도하고 동기화 전에는 IMU를\n발행하지 않는다. 시간 동기화와 IMU 처리는 독립 motor task에서 수행하지 않는다.\nWheelState는 50 Hz를 유지하며 USB/I2C 부하에서의 실제 주기와 시각 오차는 실측한다.\n\n### Host factory calibration\n\nMCU는 부팅 보정과 bias 차감을 수행하지 않는다. Jetson이\n[`imu_bringup.yaml`](../ros2_ws/src/cleany_base_driver/config/imu_bringup.yaml)의\n고정 gyro bias와 covariance를 적용해 `imu/data_raw`로 발행한다.\nEKF는 이 메시지의 각속도와 wheel odometry의 평면 속도를 융합한다.\n계수 변경에는 host bringup 재시작이 필요하다.\n\n부팅 시 모터는 disabled이며 정상 zero ENABLE 이후에만 속도 명령을 허용한다.\nIMU 보정 대기로 모터를 추가 차단하지 않는다. STOP, watchdog과 단절 규칙은\n위 Runtime 계약을 따른다.\n\nHost 실행과 상태는 [IMU 실시간 수신](../ros2_ws/src/cleany_base_driver/docs/imu.md),\n새 bench 측정은 독립 [진단 펌웨어](imu_calibration/README.md)를 따른다.\n\n`src/main.cpp`의 `kFl/Fr/Rl/RrControllerConfig`는 FF scale, Kp, Ki와 PWM limit을\n설정합니다. 변경 후 rebuild와 upload가 필요합니다. FF 출력은\n`target / FF scale × PWM limit`입니다. 진단 기준값은\n[`controller_baseline.json`](../tools/wheel_calibration/controller_baseline.json)에\n보존하며, 관련 테스트가 펌웨어 설정과의 일치를 확인합니다.\n\n| 휠 | FF scale (rad/s) | Kp | Ki | PWM 상한 (%) |\n|---|---:|---:|---:|---:|\n| FL | 11.9352 | 6.058 | 12.118 | 100 |\n| FR | 12.2596 | 6.030 | 12.058 | 100 |\n| RL | 11.7678 | 6.246 | 12.492 | 100 |\n| RR | 11.3872 | 6.154 | 12.309 | 100 |\n\nFF 초기 추정은 `PWM≈k×속도`, `FF scale=100/k`를 사용합니다. PI 초기 추정에는\n측정한 gain K, 시정수 τ와 delay L을 사용하며,\n`Kp=clamp(0.6/K,2,8)`, `Ki=Kp/max(0.5,4(τ+L))`로 계산합니다.\n추정값은 실제 하중과 속도 필터 설정에 맞춰 재검증합니다.\n\n명령 슬루는 가속 시 20 ms당 1%, 감속 시 20 ms당 3%로 설정합니다.\n속도 피드백 LPF 시상수는 `kVelocityFilterTimeConstantSeconds = 0.02`초입니다.\nSTOP, 만료 및 연결 단절은 슬루 감속을 기다리지 않고 PWM zero를 요청합니다.\n\n측정과 재검증 방법은 [휠 진단 안내](../tools/wheel_calibration/README.md)와\n[오도메트리 평가 안내](../tools/odometry_evaluation/README.md)를 따릅니다.\n오도메트리 내부 제어 잔차와 바닥 테이프 또는 LiDAR 기준의 실측 오차는\n별도 지표로 기록합니다. 측정 JSON과 PNG는 Git 제외 경로인 `artifacts/`에 저장합니다.\n\n## 1. 빌드와 장치 없는 검사\n\n명령은 저장소 루트에서 실행합니다. 호스트 호출 시 Ubuntu 22.04 `ros2-humble` Distrobox를 사용합니다.\n\n```bash\nmake firmware-setup\nmake test-micro-ros-setup test-motor-core\nmake firmware-smoke\nmake firmware-build\nmake build-base test-base\nmake micro-ros-agent-build\n```\n\nType support 원본은 `ros2_ws/src/cleany_base_interfaces`입니다. Smoke/runtime은 cache를 공유하므로 순차 빌드하며, interface, metadata, 환경을 변경하면 type support를 재생성합니다.\n\n| 빌드 경계 | 계약 |\n|---|---|\n| cmake/microros_python.cmake | IDF Python에 고정 generator 모듈 노출; PlatformIO가 비우는 PYTHONPATH를 SCons 설정만으로 대체하지 않음 |\n| Smoke / runtime | 같은 helper와 library cache 사용, 순차 빌드 |\n| sdkconfig.defaults | Octal memory, FreeRTOS 1000 Hz, USB transport |\n| DOUT image header | Bootloader의 OPI 활성화 |\n\nFor clangd, run inside Distrobox:\n\n```bash\nesp32/.venv/bin/platformio run -d esp32 -e esp32-s3-microros -t compiledb\n```\n\n## 2. Upload와 통신\n\nFor stationary gyro calibration on `J_I2C1`, use the separate\n[MPU6050 calibration diagnostic](imu_calibration/README.md).\nIt provides a calibration-only image, retained USB results, measured-limit\nconfiguration, and the motor-firmware restoration procedure.\n\nSelect the device and confirm upload:\n\n```bash\nmake firmware-upload CLEANY_ESP_PORT=/dev/serial/by-id/\u003cdevice> CONFIRM_UPLOAD=1\n```\n\nAgent/ROS overlay를 적용하고 DDS domain 0에서 통신을 확인합니다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nsource esp32/micro_ros/agent/install/local_setup.bash\nsource \"$(make -s print-install-base)/local_setup.bash\"\nexport ROS_DOMAIN_ID=0\nros2 run micro_ros_agent micro_ros_agent serial --dev \"$CLEANY_ESP_PORT\" -b 115200\n# 같은 overlay와 ROS 도메인을 설정한 다른 터미널에서 실행:\nros2 topic echo /base/wheel_state --qos-reliability best_effort\n```\n\nBare MCU 확인 항목은 다음과 같습니다.\n\n- Nonzero boot ID, 증가하는 sequence/timestamp\n- Disabled 상태, 목표, PWM 0, fault 없음\n\n## 3. 실물 인수\n\n1. 감독자, 사람 없는 구역, 검토한 제한값, 접근 가능한 물리 E-stop을 준비합니다.\n2. 바퀴를 띄워 startup 0, 회전 방향, encoder 부호를 확인합니다.\n3. Enable 후 새 저속 명령으로 전진, 좌측, yaw, PI, PWM slew, 반전 dwell을 확인합니다.\n4. STOP, 만료, driver/Agent 종료, USB 단절, MCU reboot의 정지 시간을 측정합니다.\n5. 재연결 후 새 enable과 새 명령이 필요한지 확인합니다.\n\nOdometry, TF 소유권은 [Base 계약](../ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md)을 따릅니다. 결과에는 revision, 설정, 하중/바닥, 부호, 주기, 정지 시간을 기록합니다.\n\n## KiCad\n\n프로젝트는 [motor_controller.kicad_pro](pcb/motor_controller.kicad_pro)이며 symbol/footprint는 project-local table에 등록됩니다. Espressif 출처와 라이선스는 [libraries](pcb/libraries/README.md)에서 확인합니다.\n"},"esp32/imu_calibration/README.md":{"title":"MPU6050 gyro calibration diagnostic","body":"# MPU6050 gyro calibration diagnostic\n\nStandalone ESP32-S3 firmware estimates three sensor-좌표계 gyro biases and\nchecks them against a separate stationary validation window. Results are\nJSON lines over native USB. The diagnostic holds motor PWM/DIR outputs LOW\nand runs without motor-control tasks or micro-ROS.\n\nNormal power-on calibration now runs inside the\n[motor firmware](../README.md#power-on-calibration), using its build-time\nrobot config. This standalone application is for acquiring bench reports.\n\n| Task | Section |\n|---|---|\n| Wire and isolate the board | [Hardware](#hardware-and-preparation) |\n| Build, upload, collect | [Build](#build-and-tests), [capture](#upload-and-capture) |\n| Interpret or accept a result | [Limits](#configure-measured-acceptance-limits), [protocol](#usb-protocol-and-results) |\n| Return to motor operation | [Restoration](#hardware-acceptance-and-restoration) |\n\n```mermaid\nstateDiagram-v2\n  [*] --> Settling: boot or calibrate\n  Settling --> Calibration: 5 s default\n  Calibration --> Validation: 1000 fresh samples\n  Validation --> Candidate: 500 new samples / limits not reviewed\n  Validation --> Accepted: both windows and reviewed limits pass\n  Validation --> Rejected: noise / temperature / residual failure\n  Calibration --> Rejected: I2C / timing / invalid sample\n  Candidate --> [*]: bias_rad_s = null\n  Accepted --> [*]: result in RAM only\n  Rejected --> [*]: no accepted bias\n```\n\n| Default report | Meaning |\n|---|---|\n| accepted=false | Motion and thermal acceptance limits are not reviewed |\n| error=limits_not_reviewed | Candidate acquisition completed without acceptance |\n| bias_rad_s=null | No accepted bias exposed |\n| Candidate fields | Bias, covariance, temperature and validation residuals remain available for selecting limits |\n\n## Hardware and preparation\n\n- ESP32-S3 N32R16V, matching the motor firmware's octal memory configuration.\n\n| J_I2C1 pin | MPU6050 connection |\n|---|---|\n| 1 | +3V3 |\n| 2 | GND |\n| 3 | SCL / GPIO42 |\n| 4 | SDA / GPIO41 |\n\nConfirm pin 1 using [pinmap.md](../pinmap.md).\n\n- Address `0x68`, `WHO_AM_I=0x68`; module/external 3.3 V I2C pull-ups required.\n- Disconnect motor-driver power during flashing and diagnostic runs. MCU/IMU\n  power can remain supplied over USB. Output LOW is established at `app_main`;\n  it is not a guarantee about hardware pin levels during boot/reset.\n- Rigidly mount the sensor and keep the entire robot physically stationary\n  throughout settling, calibration, and validation.\n- Stop the micro-ROS Agent, serial monitors, and other users of this USB port.\n\nGyro/acceleration variance checks supplement operator-confirmed rest. Constant\nslow rotation can look like gyro bias even with low sample variance.\n\n## Build and tests\n\nUse the existing PlatformIO installation prepared by `make firmware-setup`.\nFrom the repository root:\n\n```bash\nmake test-imu-calibration\nmake imu-calibration-build\n```\n\nMake uses the Ubuntu 22.04 `ros2-humble` Distrobox from the host. This standalone\nproject does not generate or link micro-ROS type support.\nHost tests cover decoding, calibration statistics and failure modes, fake\nserial capture, strict accepted-result validation, and configuration refresh.\n\n## Upload and capture\n\nUpload replaces the motor-controller application. Select the exact device and\nexplicitly confirm upload after completing hardware preparation:\n\n```bash\nexport CLEANY_ESP_PORT='/dev/serial/by-id/\u003cnative-USB-device>'\nmake imu-calibration-upload CLEANY_ESP_PORT=\"$CLEANY_ESP_PORT\" CONFIRM_UPLOAD=1\nmake imu-calibration-capture CLEANY_ESP_PORT=\"$CLEANY_ESP_PORT\" \\\n  IMU_CALIBRATION_OUTPUT=artifacts/imu_calibration/run1.json\n```\n\nCalibration starts once at boot. `status` returns progress or the retained\nterminal result, so attaching after completion works. To restart a stationary\nattempt explicitly:\n\n```bash\nmake imu-calibration-capture CLEANY_ESP_PORT=\"$CLEANY_ESP_PORT\" \\\n  IMU_CALIBRATION_ARGS=--calibrate \\\n  IMU_CALIBRATION_OUTPUT=artifacts/imu_calibration/run2.json\n```\n\n| Capture behavior | Contract |\n|---|---|\n| Serial ownership | Exclusive POSIX access; atomically deassert DTR/RTS to avoid resets |\n| `--calibrate` | One restart command, random request nonce, matching acknowledgement required |\n| Result recovery | Periodic status queries read the retained result; old buffered replies cannot complete a new capture |\n| Deadline | Bounded reads/writes; default overall 60 s, override `IMU_CALIBRATION_TIMEOUT` for longer windows |\n\n| Capture exit | Meaning |\n|---|---|\n| 0 | Accepted report |\n| 2 | Captured rejected/unreviewed report, saved atomically; Make returns nonzero |\n| 1 | Capture, serial or protocol error |\n\n\n## Configure measured acceptance limits\n\nAuthoritative overrides belong in this project's `sdkconfig.defaults`.\nChanging it or `main/Kconfig.projbuild` regenerates derived SDK configuration\non the next build; do not edit generated `sdkconfig.*` files.\n\n| Kconfig setting | Default / units |\n|---|---|\n| `CLEANY_IMU_SETTLING_MS` | 5000 ms |\n| `CLEANY_IMU_CALIBRATION_SECONDS` | 10 s |\n| `CLEANY_IMU_VALIDATION_SECONDS` | 5 s |\n| `CLEANY_IMU_I2C_TIMEOUT_MS` | 10 ms |\n| `CLEANY_IMU_MAX_SAMPLE_GAP_MS` | 30 ms |\n| `CLEANY_IMU_LIMITS_REVIEWED` | `n` |\n| `CLEANY_IMU_MAX_GYRO_STD_MICRORAD_S` | 0; microrad/s |\n| `CLEANY_IMU_MAX_ACCEL_STD_MM_S2` | 0; mm/s² |\n| `CLEANY_IMU_MAX_VALIDATION_MEAN_MICRORAD_S` | 0; microrad/s |\n| `CLEANY_IMU_MAX_TEMPERATURE_SPAN_MILLIC` | 0; millidegrees C |\n\n```mermaid\nflowchart LR\n    Capture[\"Repeated stationary candidates / operating temperatures\"] --> Review[\"Per-axis std / holdout residual / thermal span / repeatability\"]\n    Review --> Limits[\"Record positive measured limits\"]\n    Limits --> Build[\"Set LIMITS_REVIEWED=y and four limits / rebuild\"]\n    Build --> Validate[\"Both windows and corrected validation mean pass\"]\n```\n\nNo measured acceptance limits are supplied. Standard deviations are the square roots of the covariance diagonal.\n\n| Reviewed-limit gate | Requirement |\n|---|---|\n| Noise | Both gyro and acceleration windows pass |\n| Temperature | Combined window span passes |\n| Residual | Every absolute corrected validation mean passes |\n| Missing / nonpositive limits | invalid_config |\n| Failed attempt | Never exposes accepted bias |\n\n## Hardware acceptance and restoration\n\n| Hardware acceptance | Check |\n|---|---|\n| Stationary repeats | Inspect candidate consistency |\n| Reviewed limits | Deliberate motion, sensor disconnect and changing temperature must reject; then retry stationary |\n| PWM / DIR | Measure levels with motor-driver power disconnected |\n| Evidence boundary | Separate from host tests and firmware compilation |\n\nClose capture before restoring the motor firmware:\n\n```bash\nmake firmware-upload CLEANY_ESP_PORT=\"$CLEANY_ESP_PORT\" CONFIRM_UPLOAD=1\n```\n\nApply the normal [motor firmware acceptance procedure](../README.md#3-실물-인수)\nbefore restoring motor-driver power and enabling motion.\n\n## Acquisition and calculation\n\n```mermaid\nflowchart LR\n    Reset[\"MPU6050 reset / identity\"] --> Config[\"Axes + temperature / X-gyro PLL / verify ranges and divider\"]\n    Config --> Ready[\"Poll data-ready\"]\n    Ready --> Burst[\"One fresh 14-byte accel / temperature / gyro burst\"]\n    Burst --> Stats[\"Window statistics\"]\n```\n\nA missing-ready deadline or I2C error ends the attempt. Old samples are never substituted.\n\n| Setting | Value |\n|---|---|\n| I2C | 100 kHz, GPIO41 SDA / GPIO42 SCL |\n| Sensor sample rate | 100 Hz |\n| Accelerometer / gyro ranges | ±2g / ±250 degrees/s |\n| Gyro DLPF | 42 Hz (`DLPF_CFG=3`) |\n| Default settling interval | 5 seconds |\n| Default calibration | 1,000 fresh samples, approximately 10 seconds |\n| Default independent validation | 500 new samples, approximately 5 seconds |\n| Default I2C transaction timeout | 10 ms |\n| Default maximum fresh-sample gap | 30 ms |\n\nFive seconds is an experimental settling interval, not a claim of thermal\nequilibrium. Characterize temperature and bias on the actual module and\nincrease this interval when needed.\n\nAcceleration is decoded in m/s², including gravity; gyro in rad/s.\nAccelerometer offsets/scales are not estimated by this gyro calibration.\nEach window maintains vector means and full row-major 3×3 sample covariance\nusing Welford accumulation, without storing the sample history:\n\n```text\ncandidate_bias = calibration gyro mean\ncorrected gyro = measured gyro − candidate_bias\nvalidation_residual = independent validation gyro mean − candidate_bias\n```\n\n| Measurement contract | Rule |\n|---|---|\n| Timestamp | MCU monotonic acquisition µs, not ROS epoch |\n| Invalid samples | Nonfinite, saturated, non-increasing timestamps or excessive gaps reject |\n| Window duration | Less than 90% of nominal elapsed time rejects |\n| Covariance | Sample measurement covariance, not covariance of estimated mean |\n| Correlation | Filtered samples are temporally correlated |\n\n## USB protocol and results\n\nCommands are newline-terminated `status`, `calibrate`, or\n`calibrate \u003c16-lowercase-hex-digit-request-id>`. Capture uses the nonce form.\nMessages use `schema=\"cleany.imu_calibration/v1\"`.\n\n| Message | Payload |\n|---|---|\n| `started` | trigger boot/command, new run ID, request ID (empty for boot/nonce-free command) |\n| `status` | phase and calibration/validation sample counts |\n| `result` | retained terminal report |\n| `error` | malformed/unknown command |\n\n| Terminal report | Meaning |\n|---|---|\n| phase | completed or failed; completed means acquisition finished |\n| accepted / error | Only accepted=true indicates validated calibration |\n| Identity | Sensor identity, error and operation |\n| Windows | Means, covariances, timestamps and temperature ranges for calibration and validation |\n| Bias / residual | candidate_bias_rad_s, bias_rad_s, validation_residual_rad_s; accepted bias otherwise null |\n| Coordinates | Sensor X/Y/Z, covariance flat row-major 3×3 |\n\nResults remain in RAM until a new attempt or reset; no NVS calibration is\nwritten. Saved JSON is an inspection record, not automatically applied to\nfuture boots or firmware. A new power cycle requires a new bias estimate.\n\n### Task ownership\n\n```mermaid\nflowchart LR\n    IMU[\"Core 1 / exclusive driver and calibrator\"] -->|immutable snapshot / overwrite queue length 1| USB[\"Core 0 / USB parsing and JSON\"]\n    USB -->|bounded restart / acknowledgement queues| IMU\n```\n\nUSB backpressure never blocks acquisition.\n"},"esp32/tof_vl53l7ch/README.md":{"title":"VL53L7CH USB 거리 센서 펌웨어","body":"# VL53L7CH USB 거리 센서 펌웨어\n\n독립 ESP32-S3 DevKitC-1(플래시 16 MiB)이 ST VL53L7CH를 I²C로 읽고, 구역별 거리와 품질을 내장 USB CDC/JTAG로 전송한다. PlatformIO가 C++ 애플리케이션을 빌드한다. Arduino-ESP32의 `Wire`와 `Serial`을 사용하고, 센서 초기화와 측정은 ST C 드라이버 `VL53LMZ_2.0.10`을 직접 호출한다. 드라이버 버전과 부분 읽기 오류 수정은 [UPSTREAM.txt](lib/st-vl53lmz/UPSTREAM.txt)에 기록돼 있다.\n\n| 인터페이스 | 설정 |\n|---|---|\n| 센서 I²C | SDA GPIO8, SCL GPIO9, 7비트 주소 `0x29`, 기본 400 kHz |\n| 호스트 USB | 내장 USB D− GPIO19, D+ GPIO20. 명령과 응답은 줄바꿈으로 구분 |\n| 부팅 기본값 | 8×8, 10 Hz, 연속 측정, 구역당 타깃 1개 |\n| ROS 연결 후 | `tof_driver`가 `stop` 응답을 받은 뒤 `cnh off`, `config 64 15 400000`, `start`를 순서대로 전송 |\n\n센서 전원과 LPn, INT, I2C_RST 배선은 당시 실물 기록에서 확인한 범위 밖이다. 거리 배열은 센서 고유 순서이며 거리 단위는 mm다. 타깃이 검출되고 ST 상태가 5 또는 9인 구역만 `valid=true`로 표시한다. [ROS 인터페이스](../../ros2_ws/src/cleany_tof/docs/interfaces.md)\n\n## 빌드와 업로드\n\n저장소 루트에서 실행한다. 호스트에 Python 3과 venv, Make가 필요하다.\n\n```bash\npython3 -m venv esp32/tof_vl53l7ch/.venv\nsource esp32/tof_vl53l7ch/.venv/bin/activate\npython -m pip install -r esp32/tof_vl53l7ch/requirements.txt\nmake test-tof-firmware\nmake tof-firmware-build\n```\n\n부분 읽기 회귀 검사에는 ASan과 UBSan을 지원하는 C 컴파일러가 필요하다. 빌드 산출물은 `CLEANY_BUILD_ROOT/tof-firmware/pio/esp32s3/`에 생성된다. 업로드 전 ToF 보드의 USB by-id 경로를 확인하고, 같은 포트를 사용하는 ROS 드라이버나 시리얼 모니터를 닫는다.\n\n```bash\nls -l /dev/serial/by-id/\nmake tof-firmware-upload CLEANY_TOF_PORT=\"/dev/serial/by-id/\u003cToF 보드 ID>\" CONFIRM_UPLOAD=1\n```\n\n업로드 후 USB에서 `info`를 보내면 펌웨어 버전, 핀, 주소, 구역 수, 주파수를 확인할 수 있다. `stats`는 누적 I²C 오류, 읽기 오류, USB 드롭을 반환한다. ROS에서 확인할 때는 [ToF 실행 절차](../../docs/RUNNING.md#tof-근접-보호와-책상-접근)를 따라 `tof/frame`을 수신한다.\n\n## 실물 기록과 재생\n\n단독 보드 시험에서 8×8, 15 Hz로 설정한 센서의 프레임 1,816개를 120초 동안 수신했습니다. 이 구간에서 순번 누락, I²C 읽기 오류와 USB 드롭은 각각 0건이었습니다. 장착 후 감지 범위와 정지 거리는 [로봇 장착 검증](../../docs/implementation/calibration.md#tof-근접-보호-commissioning)에서 확인합니다.\n\n재생 입력은 `CLEANY_DATA_ROOT/runs/hardware/2026-10-25_tof/vl53l7ch-20261025/outputs/vl53l7ch-esp32/evidence/`에 있는 원본 JSONL입니다. [ROS 파서 재생 절차](../../docs/implementation/reference/testing.md#tof와-supervisor-통합)\n"},"ros2_ws/src/cleany_base_driver/docs/command-and-odometry.md":{"title":"Base 명령과 odometry","body":"# Base 명령과 odometry\n\n\n[베이스 실행](../../../../docs/implementation/how-to/base.md) · [MCU protocol](../../cleany_base_interfaces/docs/protocol.md) · [TF 소유권](#tf-소유권)\n\nBase driver는 차체 Twist를 wheel 명령으로 변환하고 MCU feedback을 ROS 상태로 제공합니다. 차체 명령은 [Mobile base](../../cleany_interfaces/docs/mobile-base.md), MCU 통신은 [protocol v2](../../cleany_base_interfaces/docs/protocol.md)를 따릅니다.\n\n## 명령과 구동 허가\n\n```mermaid\nsequenceDiagram\n    participant U as Enable 요청자\n    participant D as Base driver\n    participant M as MCU\n    U->>D: enable true\n    D->>D: 기존 cmd_vel 삭제\n    D->>M: 목표 0인 ENABLE\n    M-->>D: fresh enabled feedback\n    D->>D: 구동 허가 확인\n    alt 새 cmd_vel 수신\n        D->>M: 새 wheel VELOCITY\n    else 새 목표 없음\n        D->>M: zero VELOCITY\n    end\n    Note over D,M: STOP / 만료 / 단절 / reboot 후에는 새 ENABLE과 새 cmd_vel 필요\n```\n\nDriver는 enable 요청을 받으면 기존 cmd_vel을 버리고 목표가 0인 ENABLE을 보냅니다. Fresh feedback에서 MCU의 구동 허가를 확인한 뒤, enable 요청 이후에 수신한 새 목표만 전송합니다. 새 목표가 없으면 zero VELOCITY를 유지합니다.\n\nMecanum 변환 후 wheel limit을 넘으면 네 바퀴를 같은 비율로 축소해 이동 방향을 보존합니다.\n\n| 조건 | 처리 |\n|---|---|\n| 여섯 축 중 nonfinite 포함 | STOP |\n| 지원하지 않는 축 | 경고 후 무시 |\n| ENABLE 전달 손실 | 같은 sequence, deadline으로 재시도 |\n| STOP 전달 손실 | 같은 sequence로 재전송. 신선한 MCU ACK를 보기 전까지 STOP 전송 유지 |\n| STOP, 단절, 만료, reboot | 새 ENABLE과 새 cmd_vel 필요; 재연결만으로 재개 금지 |\n\nSTOP 재전송은 50Hz driver tick에서 수행하고 새 구동 허가를 만들지 않습니다.\n새 명시적 STOP 요청은 별도 sequence를 발급하므로 이전 ACK를 재사용하지 않습니다.\n명령 watchdog timeout bit만 설정된 disabled MCU가 출력 0과 STOP ACK를 보고하면\n안전한 비활성 상태로 분류합니다. 이 기록을 지우려고 ENABLE하지 않으며 다른 MCU fault,\n잘못된 프로토콜과 비정상 구동 상태는 기존 Fault를 유지합니다.\n\n## 설정과 시간\n\n| 항목 | 기준 |\n|---|---|\n| 설정 원본 | [base_hardware.yaml](../config/base_hardware.yaml), [base_synthetic.yaml](../config/base_synthetic.yaml) |\n| 실물 geometry | radius 0.0635 m / wheelbase 0.350 m / separation 0.610 m |\n| MCU 측정 시각 | MCU monotonic; ROS epoch 아님 |\n| JointState stamp | ROS 수신 시각 |\n| Driver deadline, cmd_vel timeout | 해당 설정값 사용 |\n\n실물 초기 속도 제한은 바퀴를 띄운 시험용이며 바닥 주행 승인값이 아닙니다. Mock geometry는 합성값이므로 실물 보정값으로 사용하지 않습니다. Feedback 단절 중 이동량은 관측할 수 없습니다.\n\n## Wheel과 IMU 융합\n\n`base_ekf.launch.py`는 base driver, wheel odometry, 고정 IMU 보정과\n`robot_localization` EKF를 실행한다. 기존 base bringup과 중복 실행하지 않는다.\n[`base_ekf.yaml`](../config/base_ekf.yaml)의 2D EKF는 wheel의 vx, vy, yaw rate와\n`imu/data_raw`의 보정된 yaw rate를 사용한다. Wheel pose, IMU orientation과\n가속도는 융합하지 않는다. Mecanum의 횡속도 vy는 실제 측정값을 사용한다.\n\n| `mode` | `odom` 및 `odom → base_link` 소유자 | EKF 출력 |\n|---|---|---|\n| `shadow` (기본) | Wheel relay | `odometry/filtered`; EKF TF 비활성 |\n| `canonical` | EKF; wheel relay 실행 안 함 | `odom`; EKF TF 활성 |\n\n`base_config`가 기구학 geometry를, `ekf_config`가 융합 선택과 wheel twist\ncovariance를 관리한다. 기본 wheel 분산 0.0025는 이전 비교 설정의 초기값이며\n실측 정확도가 아니다. 고정 gyro bias와 covariance는 기존 IMU 설정을 사용한다.\n\n`base_link → imu_link` 회전은 외부 TF가 제공한다. `publish_imu_tf=true`로\n회전 전용 static TF를 추가할 때는 `imu_roll`, `imu_pitch`, `imu_yaw`를 rad로\n모두 명시해야 하며 translation은 0이다. 기본값으로 장착 회전을 가정하지 않는다.\nURDF가 장착 TF를 제공하면 `publish_imu_tf=false`를 유지한다.\n\n입력 단절 시 EKF의 예측 출력은 계속될 수 있다. 출력 존재가 IMU 정상이나\n구동 허가를 뜻하지 않는다. `imu/status`와 wheel feedback 가용성은 별도로 확인한다.\nWheel ROS 수신 stamp와 IMU 취득 stamp의 시간 정렬, 실제 장착 축과 주행 오차는\n실물 검증 대상으로 남는다. 실행 명령은 [실행 가이드](../../../../docs/RUNNING.md#실물-imu)에 둔다.\n\n## Diagnostics와 장애 구분\n\n`base_driver` status의 `feedback_received`는 현재 유효한 MCU 피드백 연결 여부입니다. 피드백이 stale이면 driver가 수신 기록을 초기화하므로 부팅 전과 연결 상실 뒤 모두 `False`입니다. `fault`는 다음 acknowledged ENABLE까지 유지되는 실제 장애 이유입니다.\n\n| 비활성 이유 | `fault` | 의미 |\n|---|---|---|\n| STOP 요청, `cmd_vel timeout`, 비유한 `cmd_vel` 거부, driver 종료 | 빈 값 | 의도한 안전 비활성. level은 기존처럼 ERROR |\n| MCU fault bit, 계약 불일치, MCU 재부팅, 무허가 enable, ENABLE ack timeout, 구동 중 피드백 stale | 이유 | base 장애 |\n\nSTOP을 보낸 직후 MCU가 그 STOP을 처리하기 전에 보낸 피드백(`last_command_sequence`가 STOP보다 오래됨)은 0.25초까지 무허가 enable로 보지 않습니다. 그 뒤에도 enabled면 장애입니다. System Supervisor는 level 대신 `fault`와 `feedback_received`로 base 가용성을 판단합니다.\n\n## Wheel odometry\n\nWheel odometry는 joint position 차이를 적분해 `/wheel/odom`을 발행하며 TF는 발행하지 않습니다. Joint velocity는 필수 입력이 아닙니다. 실물 driver가 reboot, 단절 baseline과 encoder rollover를 처리해 연속 position을 제공합니다.\n\n`velocity_window_s=0`은 샘플 간 차분, 양수는 구간 평균 twist를 사용합니다. 시작, 시간 역행, 긴 공백 뒤에는 관측 구간이 준비될 때까지 발행하지 않으며, 미관측 속도를 0으로 보고하지 않습니다. 평균 속도의 지연은 제동, 도착 검증에 반영해야 합니다.\n\n`yaw_scale`은 유한한 양수의 회전 보정 계수이며 geometry를 바꾸지 않습니다. Sim 보정값은 독립 검증 없이 실물에 적용하지 않습니다. Covariance는 config/구현을 따르며 wheel odometry는 slip, 바닥 오차를 보정하지 않습니다.\n\n## TF 소유권\n\n```mermaid\nflowchart TB\n    Twist[\"cmd_vel / 차체 Twist\"] --> Driver[\"Base driver\u003cbr/>Mecanum 변환 / wheel limit\"]\n    Driver -->|\"wheel_command\"| MCU[\"MCU / 네 휠\"]\n    MCU -->|\"wheel_state\"| Driver\n    Driver -->|\"연속 position / ROS 수신 stamp\"| Joint[\"joint_states\"]\n    Joint --> Odom[\"Wheel odometry\u003cbr/>position 차이 적분\"]\n    Odom --> Wheel[\"wheel/odom\u003cbr/>TF 미발행\"]\n    Wheel --> Relay[\"base_odom_relay\u003cbr/>실물 / mock\"]\n    Relay --> Canonical[\"odom / odom → base_link\"]\n    Gazebo[\"Gazebo\u003cbr/>wheel_odom_raw → error adapter → wheel_odom\"] -->|\"simulator 소유\"| Canonical\n    AMCL[\"AMCL\"] --> Map[\"map → odom\"]\n    Joint --> RSP[\"robot_state_publisher\"] --> ModelTF[\"Fixed / joint TF\"]\n```\n\n| TF / 출력 | 소유자 |\n|---|---|\n| 실물, mock /odom, odom→base_link | base_odom_relay |\n| Gazebo wheel_odom_raw→error adapter→wheel_odom 및 canonical odom/TF | 시뮬레이터 |\n| map→odom | AMCL |\n| Robot fixed/joint TF | robot_state_publisher |\n\n실물/mock과 Gazebo는 대체 실행 경로입니다. Canonical odom/TF 소유자는 실행마다 하나만 둡니다. 외부 estimator를 사용할 때는 `relay_odom:=false`로 중복 publisher를 제거합니다.\n\n관련 안내: [ESP32](../../../../esp32/README.md), [실행](../../../../docs/implementation/running.md), [검증](../../../../docs/implementation/testing.md).\n\n노드별 통신 목록: [인터페이스 표](interfaces.md).\n"},"ros2_ws/src/cleany_base_driver/docs/imu.md":{"title":"IMU 실시간 수신","body":"# IMU 실시간 수신\n\nMCU는 MPU6050 각속도와 가속도를 `sensor_msgs/msg/Imu`로 발행한다. Jetson의\n`cleany_imu`가 기존 gyro bias와 공분산을 적용한다. EKF는 보정된 각속도와\nwheel odometry의 평면 속도를 융합한다.\n\n```text\nMCU → imu_uncalibrated/data_raw → cleany_imu → imu/data_raw → EKF\n                                                         wheel/odom ↗\n```\n\n## 데이터와 좌표계\n\n| 토픽 | 발행자 | 내용과 QoS |\n|---|---|---|\n| `imu_uncalibrated/data_raw` | MCU | 센서 축 gyro(rad/s), 중력 포함 가속도(m/s²); B1 |\n| `imu/data_raw` | `cleany_imu` | 고정 bias를 뺀 gyro, 원본 가속도; B1 |\n| `imu/status` | `cleany_imu` | 입력과 고정 bias 적용 상태; reliable, transient local, depth 1 |\n\nB1은 best effort, volatile, keep last 1이다. 모든 IMU 데이터는 동일한\n`imu_link` 센서 frame과 취득 stamp를 유지한다. 미보정 입력과 `imu/data_raw`의\n`orientation_covariance[0]=-1`은 자세 미제공을 뜻한다. 미보정 입력 covariance의\n0은 unknown이며, `imu/data_raw` gyro에는 설정한 전체 3×3 covariance를 적용한다.\n가속도는 수신값을 그대로 전달한다.\n\n[REP-145](https://github.com/ros-infrastructure/rep/blob/master/rep-0145.rst)의\n토픽 관례에 따라 `imu/data_raw`에는 gyro와 가속도를 담는다. Bias 미보정 입력은\n`imu_uncalibrated` namespace에 두고, EKF가 `imu/data_raw`의 Z축 각속도를 구독한다.\n`imu_link` 장착 TF는 실제 장착에 맞는 URDF 또는 명시적인 static TF로 제공한다.\nIMU bringup은 장착 회전을 추정하거나 TF를 만들지 않는다.\n\n## 실행\n\n1. [펌웨어 절차](../../../../esp32/README.md)에 따라 변경한 모터 이미지를 빌드,\n   업로드하고 같은 DDS domain에서 Agent를 실행한다.\n2. Jetson의 Humble 환경에 `make deps`로 의존성을 설치한다.\n3. Host 패키지를 빌드하고 실행한다. 브랜치 전환 전 생성물과 분리한 경로를 사용한다.\n\n```bash\nsource /opt/ros/humble/setup.bash\nexport CLEANY_BUILD_ROOT=\"$(dirname \"$PWD\")/cleany-data/builds/cleany-imu-factory\"\nmake build-base\nsource \"$(make -s print-install-base)/setup.bash\"\nexport ROS_DOMAIN_ID=0\nros2 launch cleany_base_driver imu_bringup.launch.py\n```\n\n4. 동일 overlay와 domain의 별도 터미널에서 각 단계를 확인한다.\n\n```bash\nros2 topic echo /imu_uncalibrated/data_raw --once --qos-reliability best_effort\nros2 topic hz /imu_uncalibrated/data_raw\nros2 topic echo /imu/data_raw --once --qos-reliability best_effort\nros2 topic echo /imu/status --once --qos-durability transient_local\n```\n\nLaunch는 host 보정 노드를 시작한다. Agent와 모터 driver는 별도로 실행한다.\n실물 IMU와 Gazebo IMU를 같은 namespace에서 동시에 발행하지 않는다.\n\n## 고정 factory 설정\n\n[`imu_bringup.yaml`](../config/imu_bringup.yaml)이 보정 계수와 입력 검사 설정의 단일 원본이다.\n기존 `bench_20261014T142933Z/run06_persistent`의 gyro bias와 covariance를\n고정값으로 사용한다. 적용 식은 센서 축에서 `gyro_calibrated = gyro_raw - bias`다.\n원본 bench 결과의 `accepted=false`는 자동 판정 한도 미검토 기록이며, 기존 계수\n재사용과 별개로 보존한다. 이 계수 사용을 새 실물 정확도 검증으로 해석하지 않는다.\n\n| Host parameter | 단위 또는 조건 |\n|---|---|\n| `gyro_bias_rad_s` | X/Y/Z의 유한한 3개 값; 필수 |\n| `gyro_covariance_rad2_s2` | 행 우선 9개 값, 대칭 양의 정부호; 필수 |\n| `calibration_source` | 측정 출처 |\n| `frame_id` | 입력과 일치하는 상대 frame명; 기본 `imu_link` |\n| `max_transport_delay_s` | 과거 지연과 미래 stamp 허용 한도; 기본 0.10 s |\n| `max_clock_jump_s` | ROS/steady 경과 차이 한도; 기본 0.05 s |\n| `stale_timeout_s` | 정상 입력 단절 한도; 기본 0.25 s |\n\nHost parameter는 실행 중 read-only다. 계수 변경은 YAML 수정 후 bringup 재시작으로\n적용하며 MCU 재빌드는 필요 없다. Agent, host 또는 MCU를 재시작해도 같은 계수를\n사용한다. 새 측정 절차는 [캘리브레이션 가이드](../../../../docs/CALIBRATION.md#imu-factory-gyro-bias)를 따른다.\n\n표준 Imu에는 MAC과 부팅 ID가 없다. 여러 장치는 namespace/remap으로 분리하고\n각 센서에 맞는 계수를 선택한다. 센서 교체 후 이전 계수를 그대로 사용하지 않는다.\n\n## 시각과 오류\n\nMCU는 Agent session 시각 동기화 후 `Agent epoch - 취득 이후 경과`를\n`header.stamp`에 기록한다. 동기화 실패 시 1초 간격으로 재시도하고 그동안 IMU를\n발행하지 않는다. 재연결마다 다시 동기화한다. Host는 수신 시각으로 restamp하지 않는다.\n\n| 검사 또는 상태 | 처리 |\n|---|---|\n| MCU 센서 오류, 포화, 비유한 값, 100 ms 초과 sample age | 해당 sample 미발행 |\n| Host frame 불일치, 비유한 값, gyro/가속도 unavailable | `imu/data_raw` 미발행, `ERROR` |\n| 중복/역순, backlog, 미래 stamp 한도 초과 | `imu/data_raw` 미발행, `ERROR` |\n| 첫 정상 입력 전 | `WAITING` (WARN), timeout 후 `ERROR` |\n| 정상 입력 | `RUNNING` (OK), `bias_source=factory` |\n| 정상 입력 단절 | `ERROR`; 입력 회복 시 같은 고정 계수로 재개 |\n| ROS clock jump | `ERROR` 유지; host 보정 노드를 재시작해 입력 시간 기준 초기화 |\n\n상태는 변경 즉시, 유지 시 1 Hz로 발행하고 `diagnostics`에도 복제한다.\n`imu/status`는 host 입력과 bias 적용 상태를 나타낸다. MCU 센서 오류의 세부 원인은\nfirmware log에서 확인한다.\n\nIMU 상태와 주행 정지의 연동, 장착 축 및 wheel 시간 정렬은 실물에서 확인한다.\n\n## 검증\n\n```bash\nmake test-imu-runtime\nmake test-motor-core\nmake test-base\nmake firmware-build\n```\n\n합성 ROS 검사는 host 보정 노드를 실행해 고정 bias와 공분산, acceleration 전달,\n취득 시각, 오류와 수신 회복을 검사한다. 실물에서는 수신율, 시각 오차,\n정지 잡음, Z축 부호와 USB/I2C 부하의 모터 주기 영향을 확인한다.\n"},"ros2_ws/src/cleany_base_driver/docs/interfaces.md":{"title":"cleany_base_driver 노드 인터페이스","body":"# cleany_base_driver 노드 인터페이스\n\n응용 인터페이스와 adapter에서 생성하는 endpoint를 노드별로 정리합니다. 이름과 QoS 표기, ROS 자동 인터페이스는 [전체 색인](../../../../docs/implementation/ros-interfaces.md)을 따릅니다. 이름 설정이 없는 항목은 ROS remap으로 변경합니다.\n\n## cleany_base_driver\n\n실행 파일: `base_driver_node`. 원본: [driver_node.py](../cleany_base_driver/driver_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `base/wheel_command` | `cleany_base_interfaces/msg/WheelCommand` | B1; 50 Hz |\n| 토픽 발행 | `joint_states` | `sensor_msgs/msg/JointState` | R10; fresh wheel feedback 수신 시 |\n| 토픽 발행 | `diagnostics` | `diagnostic_msgs/msg/DiagnosticArray` | R10; 10 Hz |\n| 토픽 구독 | `base/wheel_state` | `cleany_base_interfaces/msg/WheelState` | B1 |\n| 토픽 구독 | `cmd_vel` | `geometry_msgs/msg/Twist` | R10 |\n| 서비스 제공 | `base/enable` | `std_srvs/srv/SetBool` | Service 기본값 |\n\n이름은 ROS remap으로 변경합니다. 구동 허가와 정지 규칙은 [Base 계약](command-and-odometry.md)을 따릅니다.\n\n| disarmed 진단 | true 조건 |\n|---|---|\n| 권한 | Host와 MCU 모두 disabled |\n| 피드백 | 검증된 값, 0.25 s 이내 |\n| 출력 | 목표 / 명령 / PWM 모두 0 |\n| 측정 속도 | disarmed_velocity_rad_s 기본 0.02 rad/s 이하 |\n| Fault | Watchdog timeout bit만 남은 disabled는 허용; 다른 bit 또는 enabled는 거부 |\n\nBase 정지 관측이며 STOP ACK나 전신 안전의 대체물이 아닙니다. Timeout bit는 다음 명시 ENABLE 때 해제하며 정지 확인용 자동 ENABLE은 하지 않습니다.\n\n## mock_base_mcu\n\n실행 파일: `mock_mcu_node`. 원본: [mock_node.py](../cleany_base_driver/mock_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 발행 | `base/wheel_state` | `cleany_base_interfaces/msg/WheelState` | B1; 50 Hz, transport 허용 시 |\n| 토픽 구독 | `base/wheel_command` | `cleany_base_interfaces/msg/WheelCommand` | B1 |\n| 서비스 제공 | `mock/reboot` | `std_srvs/srv/Trigger` | Service 기본값 |\n| 서비스 제공 | `mock/transport` | `std_srvs/srv/SetBool` | Service 기본값 |\n| 서비스 제공 | `mock/drop_next_enable` | `std_srvs/srv/Trigger` | Service 기본값 |\n| 서비스 제공 | `mock/force_disarm` | `std_srvs/srv/Trigger` | Service 기본값 |\n\n실물 MCU 대신 실행하는 장치 없는 시험 노드입니다.\n\n## base_odom_relay\n\n실행 파일: `odom_relay_node`. 원본: [odom_relay.py](../cleany_base_driver/odom_relay.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `wheel/odom` | `nav_msgs/msg/Odometry` | R10 |\n| 토픽 발행 | `odom` | `nav_msgs/msg/Odometry` | R10; 입력 수신 시 |\n| 토픽 발행 | `/tf` | `tf2_msgs/msg/TFMessage` | TF 기본 QoS |\n\n`odom → base_link` TF를 발행합니다. 외부 estimator 또는 Gazebo canonical publisher와 중복 실행하지 않습니다.\n\n## cleany_imu\n\n실행 파일: `imu_driver_node`. 원본: [imu_node.py](../cleany_base_driver/imu_node.py).\n\n| 종류 / 방향 | 기본 이름 | ROS 타입 | QoS, 주기와 이름 설정 |\n|---|---|---|---|\n| 토픽 구독 | `imu_uncalibrated/data_raw` | `sensor_msgs/msg/Imu` | B1 |\n| 토픽 발행 | `imu/data_raw` | `sensor_msgs/msg/Imu` | B1; 정상 IMU 수신 시 고정 factory gyro bias 적용 |\n| 토픽 발행 | `imu/status` | `diagnostic_msgs/msg/DiagnosticArray` | R/T1; 상태 변경 시와 1 Hz |\n| 토픽 발행 | `diagnostics` | `diagnostic_msgs/msg/DiagnosticArray` | R10; 상태 변경 시와 1 Hz |\n\n이름은 ROS remap으로 변경합니다. 보정과 오류 상태는 [IMU 계약](imu.md)을 따릅니다.\n\n## ekf_filter_node\n\n외부 패키지 `robot_localization`의 `ekf_node`다. `base_ekf.launch.py`가 실행한다.\n\n| 종류 / 방향 | Bringup 기본 이름 | ROS 타입 | 조건 |\n|---|---|---|---|\n| 토픽 구독 | `wheel/odom` | `nav_msgs/msg/Odometry` | vx, vy, yaw rate; `odom0` 설정 |\n| 토픽 구독 | `imu/data_raw` | `sensor_msgs/msg/Imu` | 고정 bias 보정 yaw rate; `imu0` 설정 |\n| 토픽 발행 | `odometry/filtered` 또는 `odom` | `nav_msgs/msg/Odometry` | `shadow` / `canonical`; 50 Hz 설정 |\n| 토픽 발행 | `diagnostics` | `diagnostic_msgs/msg/DiagnosticArray` | `print_diagnostics=true` |\n| TF 발행 | `odom → base_link` | `tf2_msgs/msg/TFMessage` | `canonical`에서만 활성 |\n\n`shadow`에서는 기존 wheel relay가 canonical odom과 TF를 유지한다. 선택한\n입력과 TF 소유권은 [융합 계약](command-and-odometry.md#wheel과-imu-융합)을 따른다.\n\n## 순서가 있는 구동 허가\n\n`base/set_enabled`는 host 전용 `cleany_base_interfaces/srv/SetBaseEnabled` 서비스입니다.\nclient_id별 증가하는 request_sequence를 요구하며 늦게 도착한 ENABLE이 더 최신 STOP을\n덮지 못하게 합니다. accepted는 발행 접수이며 command_sequence, boot_id를 fresh MCU\nfeedback과 대조해야 구동/정지 완료입니다. 기존 `base/enable`은 그대로 제공합니다.\n"},"ros2_ws/src/cleany_base_interfaces/docs/protocol.md":{"title":"Wheel protocol v2","body":"# Wheel protocol v2\n\n\n[인터페이스와 단위](#인터페이스와-단위) · [명령 수락](#명령-수락) · [정지와 재개](#정지와-재개)\n\nROS driver와 MCU는 이 패키지의 msg/를 원본으로 같은 계약의 type support를 빌드합니다. 한 MCU의 command publisher는 driver 하나가 소유합니다.\n\n## 인터페이스와 단위\n\n| 토픽 | 방향 | QoS / 주기 |\n|---|---|---|\n| base/wheel_command | ROS → MCU | best effort, volatile, keep last 1 / 50 Hz |\n| base/wheel_state | MCU → ROS | best effort, volatile, keep last 1 / 50 Hz |\n\n| 항목 | 계약 |\n|---|---|\n| 배열 순서 | FL, FR, RL, RR |\n| PCB 매핑 | MCU에서만 M1, M2, M4, M3 및 극성 적용 |\n| 각도 / 속도 | 출력축 rad / rad/s |\n| Encoder / PWM | signed int32 count / signed percent |\n| Encoder scale | 출력축 1회전 = 3172 counts |\n\n## 명령 수락\n\n| Mode | 값 | 동작 |\n|---|---:|---|\n| STOP | 0 | 목표 삭제, 출력 0, 허가 해제 |\n| ENABLE | 1 | 네 목표가 0일 때 구동 허가 |\n| VELOCITY | 2 | 허가된 상태에서 유한한 [-10,10] rad/s 목표 적용 |\n\nProtocol version은 2입니다. Sequence는 uint32이며 `0 \u003c (new-old) mod 2^32 \u003c 2^31`일 때만 새 명령입니다. MCU는 정지, 단절 뒤에도 마지막 번호를 유지하고, driver는 fresh feedback의 last_command_sequence 다음 번호를 사용합니다.\n\n`valid_until_us`는 MCU monotonic µs입니다. Driver는 MCU stamp와 로컬 monotonic 경과로 계산합니다. ENABLE/VELOCITY는 `now \u003c deadline \u003c= now+250000`을 만족해야 합니다.\n\n| 예외 | 처리 |\n|---|---|\n| 중복, 거부, 이미 enabled인 ENABLE | 목표와 기한 갱신 없음 |\n| STOP | 버전, 목표, 기한에 관계없이 정지; 새 sequence일 때만 번호 갱신 |\n| Deadline 만료 | 목표, 허가 삭제 |\n\nSTOP의 새 sequence는 오래된 ENABLE의 재허가를 막습니다. 매 control tick에서 **명령 처리 전에** 기한을 검사합니다. watchdog_ms=250은 최대 유효기간이며 별도 watchdog 시각이 아닙니다.\n\n## 정지와 재개\n\n```mermaid\nstateDiagram-v2\n    [*] --> Disabled: 부팅 / 목표와 PWM 0\n    Disabled --> Enabled: 새 zero ENABLE / 버전과 기한 유효\n    Enabled --> Enabled: 새 VELOCITY / 유한한 목표와 유효 기한\n    Enabled --> Disabled: STOP / 기한 만료 / 단절\n    Disabled --> Disabled: STOP / 거부된 명령\n    note right of Enabled\n        중복, 거부, 이미 enabled인 ENABLE은\n        목표와
