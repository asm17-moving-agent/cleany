[platformio]
default_envs = esp32-s3-imu-calibration
src_dir = main

[env:esp32-s3-imu-calibration]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
; Match the motor controller N32R16V: DOUT header, OPI enabled by bootloader.
board_build.flash_mode = dout
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
upload_protocol = esptool
extra_scripts = pre:scripts/configure.py
