planner_server:
  ros__parameters:
    GridBased:
      plugin: cleany_navigation::StraightFirstPlanner
      tolerance: 0.05
      holonomic_direct_path: true
      require_exact_goal: true
      allow_unknown: false
      smooth_path: false
      allow_reverse_expansion: true
      max_planning_time: 80.0
      cache_obstacle_heuristic: false
      lattice_filepath: common://omni_lattice_2p5cm.json
      analytic_expansion_max_length: 0.0
      cost_penalty: 5.0
      lattice_collision_padding: 0.05
      body_heading_grid_bins: 32
    use_sim_time: true
    planner_plugins:
    - GridBased
    expected_planner_frequency: 1.0
