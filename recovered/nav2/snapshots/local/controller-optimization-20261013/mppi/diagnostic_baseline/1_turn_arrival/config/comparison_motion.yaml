controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.17453292519943295
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.25
      movement_time_allowance: 20.0
    FollowPath:
      plugin: cleany_benchmark::TimedController
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.1
      vy_std: 0.1
      wz_std: 0.2
      vx_max: 0.15
      vx_min: -0.15
      vy_max: 0.1
      wz_max: 0.14
      ax_max: 0.4
      ax_min: -0.4
      ay_max: 0.4
      ay_min: -0.4
      az_max: 0.6
      prune_distance: 1.5
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      motion_model: Omni
      visualize: false
      regenerate_noises: true
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - TwirlingCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0
      wrapped_plugin: nav2_mppi_controller::MPPIController
      benchmark_timing_file: /home/ehdrms/workspace/cleany/cleany-data/runs/controller-optimization-20261013/mppi/diagnostic_baseline/1_turn_arrival/compute_timing.csv
planner_server:
  ros__parameters:
    GridBased:
      plugin: cleany_navigation::StraightFirstPlanner
      tolerance: 0.05
      holonomic_direct_path: true
      require_exact_goal: true
      allow_unknown: false
      smooth_path: false
      allow_reverse_expansion: true
      max_planning_time: 2.0
      cache_obstacle_heuristic: false
      lattice_filepath: ''
      analytic_expansion_max_length: 0.0
      cost_penalty: 5.0
      lattice_collision_padding: 0.05
bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - cleany_yield_wait_bt_node
pan_motion_gate:
  ros__parameters:
    allow_reverse: true
    allow_lateral: true
    allow_mixed_motion: true
    translation_angle_deg: 0.0
