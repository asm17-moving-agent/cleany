    use_sim_time: true
    frame_id: map
    topic_name: map
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: odom
    controller_frequency: 20.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
      required_movement_angle: 0.25
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.17453292519943295
    FollowPath:
      plugin: cleany_benchmark::TimedController
      debug_trajectory_details: false
      trajectory_generator_name: cleany_navigation::HolonomicGenerator
      fine_translation_scale: 0.25
      goal_directed_radius: 4.5
      min_vel_x: -0.3175
      max_vel_x: 0.3175
      min_vel_y: -0.3175
      max_vel_y: 0.3175
      max_vel_theta: 0.665758020549
      min_speed_xy: 0.0
      max_speed_xy: 0.449012806054
      min_speed_theta: 0.0
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      acc_lim_theta: 0.6
      decel_lim_x: -0.4
      decel_lim_y: -0.4
      decel_lim_theta: -0.6
      vx_samples: 5
      vy_samples: 5
      vtheta_samples: 7
      sim_time: 2.0
      discretize_by_time: true
      time_granularity: 0.05
      include_last_point: true
      limit_vel_cmd_in_traj: true
      use_elapsed_command_time: true
      preserve_translation_direction: true
      continuity_samples: true
      continuity_timeout_s: 0.5
      transform_tolerance: 0.3
      prune_plan: true
      prune_distance: 1.5
      forward_prune_distance: 2.0
      shorten_transformed_plan: true
      stateful: true
      xy_goal_tolerance: 0.3
      trans_stopped_velocity: 0.01
      critics:
      - ObstacleFootprint
      - CommandBearing
      - PathOrientation
      - PathProgress
      - PathDist
      - GoalDist
      - RotateToGoal
      - Twirling
      ObstacleFootprint.scale: 0.05
      ObstacleFootprint.class: cleany_navigation::SweptFootprintCritic
      CommandBearing.class: cleany_navigation::CommandBearingCritic
      CommandBearing.scale: 2.0
      CommandBearing.switch_cost: 0.5
      CommandBearing.switch_angle: 0.04
      CommandBearing.near_goal_distance: 0.3
      CommandBearing.free_goal_distance: 0.1
      PathOrientation.class: cleany_navigation::PathOrientationCritic
      PathOrientation.scale: 8.0
      PathProgress.class: cleany_navigation::PathProgressCritic
      PathProgress.scale: 1.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      GoalDist.class: cleany_navigation::PreciseGoalDistCritic
      GoalDist.near_goal_distance: 0.3
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 1.0
      Twirling.scale: 1.0
      timing_trace_file: /home/donglee/workspace/cleany/cleany-data/runs/controller-planner-matrix-20261020/dwb_lattice/6_narrow_seat/controller_command_dt.json
      wrapped_plugin: cleany_navigation::GoalDirectedController
      benchmark_timing_file: /home/donglee/workspace/cleany/cleany-data/runs/controller-planner-matrix-20261020/dwb_lattice/6_narrow_seat/compute_timing.csv
      max_wheel_speed_rad_s: 4.99
      mecanum_wheel_radius_m: 0.0635
      mecanum_wheelbase_m: 0.35
      mecanum_wheel_separation_m: 0.6038
      prefer_target_translation_direction: true
    progress_checker_plugin: progress_checker
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[-0.238525, -0.327373], [-0.238525, 0.327427], [0.238475, 0.327427],
        [0.238475, -0.327373]]'
      footprint_padding: 0.0
      plugins:
      - obstacle_layer
      - memory_layer
      - depth_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        min_obstacle_height: -0.33
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: -0.33
          inf_is_valid: true
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0
          raytrace_min_range: 0.15
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 6.0
      always_send_full_costmap: true
      depth_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: -0.38
        z_resolution: 0.15
        z_voxels: 16
        mark_threshold: 0
        unknown_threshold: 15
        min_obstacle_height: -0.33
        max_obstacle_height: 1.62
        publish_voxel_map: true
        observation_sources: depth depth_clear
        depth:
          topic: /camera/head/depth/obstacle_points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.33
          max_obstacle_height: 1.62
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
        depth_clear:
          topic: /camera/head/depth/points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
      use_maximum: true
      memory_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /obstacle_memory/grid
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        use_maximum: true
