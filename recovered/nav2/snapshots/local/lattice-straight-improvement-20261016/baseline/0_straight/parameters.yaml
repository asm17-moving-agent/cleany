amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: scan
    robot_model_type: nav2_amcl::OmniMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.15
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 120
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.01
    update_min_a: 0.01
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    do_beamskip: false
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: -1.865
      y: -4.705
      z: 0.0
      yaw: 1.5708
map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: map
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: odom
    controller_frequency: 20.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
      required_movement_angle: 0.25
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.17453292519943295
    FollowPath:
      time_steps: 80
      PathAlignCritic:
        cost_weight: 12.0
        threshold_to_consider: 1.0
        cost_power: 1
        enabled: true
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 2
        trajectory_point_step: 4
        use_path_orientations: true
      PathFollowCritic:
        cost_weight: 15.0
        offset_from_furthest: 20
        threshold_to_consider: 1.0
        cost_power: 1
        enabled: true
      GoalCritic:
        cost_weight: 15.0
        threshold_to_consider: 1.0
        cost_power: 1
        enabled: true
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 1000000.0
        consider_footprint: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        enabled: true
        inflation_layer_name: ''
        near_goal_distance: 1.0
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        enabled: false
        forward_preference: true
        max_angle_to_furthest: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      TrajectoryVisualizer:
        time_step: 3
        trajectory_step: 5
      TwirlingCritic:
        cost_power: 1
        cost_weight: 10.0
        enabled: true
      batch_size: 1000
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - TwirlingCritic
      enforce_path_inversion: false
      gamma: 0.0003
      iteration_count: 1
      max_robot_pose_search_dist: 2.0
      model_dt: 0.05
      motion_model: Omni
      plugin: cleany_benchmark::TimedController
      prune_distance: 1.5
      regenerate_noises: true
      reset_period: 1.0
      retry_attempt_limit: 1
      temperature: 0.3
      transform_tolerance: 0.3
      visualize: false
      vx_max: 0.3175
      vx_min: -0.3175
      vx_std: 0.035
      vy_max: 0.3175
      vy_std: 0.025
      wz_max: 0.6657580205493815
      wz_std: 0.07
      goal_rotate_enter_radius: 0.025
      goal_rotate_exit_radius: 0.03
      wheel_max_rad_s: 5.0
      wheel_radius_m: 0.0635
      wheelbase_m: 0.35
      wheel_separation_m: 0.6038
      wrapped_plugin: nav2_mppi_controller::MPPIController
      benchmark_timing_file: /home/donglee/workspace/cleany/lattice-straight-improvement-20261016/baseline/0_straight/compute_timing.csv
      path_seed_count: 128
      path_seed_max_speed: 0.25
      path_progress_timeout: 12.0
      path_progress_distance: 0.08
      validate_output: true
    progress_checker_plugin: progress_checker
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[-0.238525, -0.327373], [-0.238525, 0.327427], [0.238475, 0.327427],
        [0.238475, -0.327373]]'
      footprint_padding: 0.0
      plugins:
      - obstacle_layer
      - memory_layer
      - depth_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        min_obstacle_height: -0.33
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: -0.33
          inf_is_valid: true
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0
          raytrace_min_range: 0.15
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 6.0
      always_send_full_costmap: true
      depth_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: -0.38
        z_resolution: 0.15
        z_voxels: 16
        mark_threshold: 0
        unknown_threshold: 15
        min_obstacle_height: -0.33
        max_obstacle_height: 1.62
        publish_voxel_map: true
        observation_sources: depth depth_clear
        depth:
          topic: /camera/head/depth/obstacle_points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.33
          max_obstacle_height: 1.62
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
        depth_clear:
          topic: /camera/head/depth/points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
      use_maximum: true
      memory_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /obstacle_memory/grid
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        use_maximum: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[-0.238525, -0.327373], [-0.238525, 0.327427], [0.238475, 0.327427],
        [0.238475, -0.327373]]'
      footprint_padding: 0.0
      plugins:
      - static_layer
      - memory_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        min_obstacle_height: -0.33
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: -0.33
          inf_is_valid: true
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0
          raytrace_min_range: 0.15
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 6.0
      always_send_full_costmap: true
      use_maximum: true
      memory_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /obstacle_memory/grid
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        use_maximum: true
planner_server:
  ros__parameters:
