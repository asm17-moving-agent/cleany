controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.17453292519943295
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.25
      movement_time_allowance: 20.0
    FollowPath:
      plugin: cleany_benchmark::TimedController
      max_vel_x: 0.15
      max_vel_x_backwards: 0.15
      max_vel_y: 0.1
      max_vel_theta: 0.14
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      acc_lim_theta: 0.6
      min_turning_radius: 0.0
      cmd_angle_instead_rotvel: false
      free_goal_vel: false
      weight_kinematics_nh: 0.0
      weight_kinematics_forward_drive: 0.0
      global_plan_overwrite_orientation: false
      penalty_epsilon: 0.01
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_global_plan_lookahead_dist: 3.0
      include_costmap_obstacles: true
      costmap_converter_plugin: ''
      enable_homotopy_class_planning: true
      enable_multithreading: true
      footprint_model:
        type: polygon
        vertices: '[[-0.338525, -0.42737300000024486], [-0.338525, 0.42742700000024486],
          [0.338475, 0.42742700000024486], [0.338475, -0.42737300000024486]]'
      min_obstacle_dist: 0.0
      inflation_dist: 0.2
      odom_topic: odom
      wrapped_plugin: teb_local_planner::TebLocalPlannerROS
      benchmark_timing_file: /home/donglee/workspace/cleany/controller-comparison-20261013/teb_rtf1/3_far_heading/compute_timing.csv
planner_server:
  ros__parameters:
    GridBased:
      plugin: cleany_navigation::StraightFirstPlanner
      tolerance: 0.05
      holonomic_direct_path: true
      require_exact_goal: true
      allow_unknown: false
      smooth_path: false
      allow_reverse_expansion: true
      max_planning_time: 2.0
      cache_obstacle_heuristic: false
      lattice_filepath: ''
      analytic_expansion_max_length: 0.0
      cost_penalty: 5.0
      lattice_collision_padding: 0.05
bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - cleany_yield_wait_bt_node
pan_motion_gate:
  ros__parameters:
    allow_reverse: true
    allow_lateral: true
    allow_mixed_motion: true
    translation_angle_deg: 0.0
