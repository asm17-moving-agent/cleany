controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: odom
    controller_frequency: 10.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: -1.0
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.01
      movement_time_allowance: 1200.0
      required_movement_angle: 0.01
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.17453292519943295
    FollowPath:
      plugin: teb_local_planner::TebLocalPlannerROS
      max_vel_x: 0.3175
      max_vel_x_backwards: 0.3175
      max_vel_y: 0.3175
      max_vel_theta: 0.6657580205493815
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      acc_lim_theta: 0.8
      min_turning_radius: 0.0
      cmd_angle_instead_rotvel: false
      free_goal_vel: false
      weight_kinematics_nh: 0.0
      weight_kinematics_forward_drive: 0.0
      global_plan_overwrite_orientation: false
      penalty_epsilon: 0.01
      dt_ref: 0.1
      dt_hysteresis: 0.02
      max_global_plan_lookahead_dist: 3.0
      include_costmap_obstacles: true
      costmap_converter_plugin: ''
      enable_homotopy_class_planning: false
      enable_multithreading: false
      footprint_model:
        type: polygon
        vertices: '[[-0.338525, -0.42737300000024486], [-0.338525, 0.42742700000024486],
          [0.338475, 0.42742700000024486], [0.338475, -0.42737300000024486]]'
      min_obstacle_dist: 0.05
      inflation_dist: 0.2
      odom_topic: odom
      no_inner_iterations: 5
      no_outer_iterations: 4
    progress_checker_plugin: progress_checker
