    use_sim_time: true
    frame_id: map
    topic_name: map
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: odom
    controller_frequency: 10.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: -1.0
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.01
      movement_time_allowance: 1200.0
      required_movement_angle: 0.01
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.17453292519943295
    FollowPath:
      time_steps: 80
      PathAlignCritic:
        cost_weight: 3.0
        threshold_to_consider: 1.0
      PathFollowCritic:
        cost_weight: 15.0
        offset_from_furthest: 20
        threshold_to_consider: 1.0
      GoalCritic:
        cost_weight: 15.0
        threshold_to_consider: 1.0
      plugin: cleany_benchmark::TimedController
      max_vel_x: 0.3175
      max_vel_x_backwards: 0.3175
      max_vel_y: 0.3175
      max_vel_theta: 0.6657580205493815
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      acc_lim_theta: 0.8
      min_turning_radius: 0.0
      cmd_angle_instead_rotvel: false
      free_goal_vel: false
      weight_kinematics_nh: 0.0
      weight_kinematics_forward_drive: 0.0
      global_plan_overwrite_orientation: false
      penalty_epsilon: 0.01
      dt_ref: 0.1
      dt_hysteresis: 0.02
      max_global_plan_lookahead_dist: 3.0
      include_costmap_obstacles: true
      costmap_converter_plugin: ''
      enable_homotopy_class_planning: false
      enable_multithreading: false
      footprint_model:
        type: polygon
        vertices: '[[-0.338525, -0.42737300000024486], [-0.338525, 0.42742700000024486],
          [0.338475, 0.42742700000024486], [0.338475, -0.42737300000024486]]'
      min_obstacle_dist: 0.05
      inflation_dist: 0.2
      odom_topic: odom
      wrapped_plugin: teb_local_planner::TebLocalPlannerROS
      benchmark_timing_file: /home/donglee/workspace/cleany/controller-comparison-8goals-20261014/teb/run_20261014_0029/final8/2_chair_gap_startup_retry/compute_timing.csv
      ObstacleFootprint.failure_snapshot_directory: /home/donglee/workspace/cleany/controller-comparison-8goals-20261014/teb/run_20261014_0029/final8/2_chair_gap_startup_retry/runtime/controller_failures
      no_inner_iterations: 5
      no_outer_iterations: 4
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.17453292519943295
    progress_checker_plugin: progress_checker
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: '[[-0.318525, -0.40737300000024484], [-0.318525, 0.40742700000024484],
        [0.318475, 0.40742700000024484], [0.318475, -0.40737300000024484]]'
      footprint_padding: 0.02
      plugins:
      - obstacle_layer
      - memory_layer
      - depth_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        min_obstacle_height: -0.33
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: -0.33
          inf_is_valid: true
          obstacle_min_range: 0.15
          obstacle_max_range: 8.0
          raytrace_min_range: 0.15
          raytrace_max_range: 10.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 6.0
      always_send_full_costmap: true
      depth_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: -0.38
        z_resolution: 0.15
        z_voxels: 16
        mark_threshold: 0
        unknown_threshold: 15
        min_obstacle_height: -0.33
        max_obstacle_height: 1.62
        publish_voxel_map: true
        observation_sources: depth depth_clear
        depth:
          topic: /camera/head/depth/obstacle_points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.33
          max_obstacle_height: 1.62
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
        depth_clear:
          topic: /camera/head/depth/points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
      use_maximum: true
      memory_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /obstacle_memory/grid
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        use_maximum: true
global_costmap:
