controller_server:
  ros__parameters:
    FollowPath:
      time_steps: 80
      PathAlignCritic:
        cost_weight: 3.0
        threshold_to_consider: 1.0
      PathFollowCritic:
        cost_weight: 15.0
        offset_from_furthest: 20
        threshold_to_consider: 1.0
      GoalCritic:
        cost_weight: 15.0
        threshold_to_consider: 1.0
      PathProgress.scale: 20.0
      critics:
      - ObstacleFootprint
      - ObstacleCenter
      - CommandBearing
      - PathOrientation
      - PathProgress
      - PathDist
      - GoalDist
      - RotateToGoal
      - Twirling
      ObstacleCenter.class: dwb_critics::BaseObstacleCritic
      ObstacleCenter.scale: 0.01
      ObstacleCenter.sum_scores: false
      ObstacleFootprint.command_hold_time: 0.2
      ObstacleFootprint.command_hold_step: 0.01
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[-0.318525, -0.40737300000024484], [-0.318525, 0.40742700000024484],
        [0.318475, 0.40742700000024484], [0.318475, -0.40737300000024484]]'
      inflation_layer:
        inflation_radius: 0.8
      plugins:
      - obstacle_layer
      - depth_layer
      - inflation_layer
      depth_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: -0.38
        z_resolution: 0.15
        z_voxels: 16
        mark_threshold: 0
        unknown_threshold: 15
        min_obstacle_height: -0.33
        max_obstacle_height: 1.62
        publish_voxel_map: true
        observation_sources: depth depth_clear
        depth:
          topic: /camera/head/depth/obstacle_points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.33
          max_obstacle_height: 1.62
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
        depth_clear:
          topic: /camera/head/depth/points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
      footprint_padding: 0.02
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[-0.318525, -0.40737300000024484], [-0.318525, 0.40742700000024484],
        [0.318475, 0.40742700000024484], [0.318475, -0.40737300000024484]]'
      inflation_layer:
        inflation_radius: 0.8
      footprint_padding: 0.02
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /nav2/cmd_vel
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.6
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - StopZone
    - SlowZone
    StopZone:
      type: polygon
      points: '[[-0.318525, -0.40737300000024484], [-0.318525, 0.40742700000024484],
        [0.318475, 0.40742700000024484], [0.318475, -0.40737300000024484]]'
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: /safety/stop_zone
    SlowZone:
      type: polygon
      points: '[[-0.438525, -0.5273730000002448], [-0.438525, 0.5274270000002448],
        [0.438475, 0.5274270000002448], [0.438475, -0.5273730000002448]]'
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: /safety/slow_zone
    observation_sources:
    - scan
    - depth
    scan:
      type: scan
      topic: /scan
    depth:
      type: pointcloud
      topic: /camera/head/depth/points
      min_height: -0.33
      max_height: 1.62
depth_camera_tf:
  translation:
  - 0.13575291981941817
  - -0.001999999999964942
  - 0.7907902750404355
  rotation_rpy:
  - 0.0
  - 0.3490658503988659
  - 4.136462142204289e-13
  pan_pivot:
  - 0.103
  - 2.1302780032352088e-14
  - 0.673
depth_clearance:
  ros__parameters:
    use_sim_time: true
    marking_min_z: -0.33
    marking_max_z: 1.62
    pixel_stride: 4
    positive_infinity_is_free: true
    clearing_distance: 5.0
    marking_max_range: 4.0
    sensor_far_clip: 10.0
bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - cleany_yield_wait_bt_node
pan_motion_gate:
  ros__parameters:
    pan_min_position_rad: -3.2
    pan_max_position_rad: 3.2
