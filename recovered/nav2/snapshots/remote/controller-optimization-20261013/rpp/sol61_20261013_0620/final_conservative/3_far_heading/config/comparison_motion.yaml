controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.17453292519943295
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.25
      movement_time_allowance: 20.0
    FollowPath:
      plugin: cleany_benchmark::TimedController
      desired_linear_vel: 0.15
      lookahead_dist: 0.6
      min_lookahead_dist: 0.18
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.14
      transform_tolerance: 0.3
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.03
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      max_angular_accel: 0.6
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      wrapped_plugin: cleany_navigation::CurvatureLimitedRPP
      benchmark_timing_file: /home/donglee/workspace/cleany/controller-optimization-20261013/rpp/sol61_20261013_0620/final_conservative/3_far_heading/compute_timing.csv
      tracking_yaw_limit: 0.14
planner_server:
  ros__parameters:
    GridBased:
      plugin: cleany_navigation::StraightFirstPlanner
      tolerance: 0.05
      holonomic_direct_path: true
      require_exact_goal: true
      allow_unknown: false
      smooth_path: false
      allow_reverse_expansion: true
      max_planning_time: 2.0
      cache_obstacle_heuristic: false
      lattice_filepath: ''
      analytic_expansion_max_length: 0.0
      cost_penalty: 5.0
      lattice_collision_padding: 0.05
bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - cleany_yield_wait_bt_node
pan_motion_gate:
  ros__parameters:
    allow_reverse: true
    allow_lateral: true
    allow_mixed_motion: true
    translation_angle_deg: 0.0
