controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: odom
    controller_frequency: 20.0
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
      required_movement_angle: 0.25
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.17453292519943295
    FollowPath:
      time_steps: 80
      PathAlignCritic:
        cost_weight: 3.0
        threshold_to_consider: 1.0
      PathFollowCritic:
        cost_weight: 15.0
        offset_from_furthest: 20
        threshold_to_consider: 1.0
      GoalCritic:
        cost_weight: 15.0
        threshold_to_consider: 1.0
      plugin: teb_local_planner::TebLocalPlannerROS
      max_vel_x: 0.15
      max_vel_x_backwards: 0.15
      max_vel_y: 0.1
      max_vel_theta: 0.14
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      acc_lim_theta: 0.6
      min_turning_radius: 0.0
      cmd_angle_instead_rotvel: false
      free_goal_vel: false
      weight_kinematics_nh: 0.0
      weight_kinematics_forward_drive: 0.0
      global_plan_overwrite_orientation: false
      penalty_epsilon: 0.01
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_global_plan_lookahead_dist: 3.0
      include_costmap_obstacles: true
      costmap_converter_plugin: ''
      enable_homotopy_class_planning: true
      enable_multithreading: true
      footprint_model:
        type: polygon
        vertices: '[[-0.338525, -0.42737300000024486], [-0.338525, 0.42742700000024486],
          [0.338475, 0.42742700000024486], [0.338475, -0.42737300000024486]]'
      min_obstacle_dist: 0.05
      inflation_dist: 0.2
      odom_topic: odom
      ObstacleFootprint.failure_snapshot_directory: /home/donglee/workspace/cleany/controller-optimization-20261013/teb/resume_20261013_01/final/0_straight/runtime/controller_failures
      max_number_classes: 5
      no_inner_iterations: 5
      no_outer_iterations: 4
      feasibility_check_no_poses: 5
      feasibility_check_lookahead_distance: -1.0
      min_resolution_collision_check_angular: 3.141592653589793
    progress_checker_plugin: progress_checker
