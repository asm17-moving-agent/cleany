controller_server:
  ros__parameters:
    FollowPath:
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 1000000.0
        consider_footprint: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        enabled: true
        inflation_layer_name: ''
        near_goal_distance: 1.0
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 15.0
        enabled: true
        threshold_to_consider: 1.0
      ObstacleFootprint.failure_snapshot_directory: /home/ehdrms/workspace/cleany/cleany-data/runs/lattice-mppi-gui-20261014/runtime-v3-restored/7_other_room/runtime/controller_failures
      PathAlignCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 2
        threshold_to_consider: 1.0
        trajectory_point_step: 4
        use_path_orientations: true
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        enabled: false
        forward_preference: true
        max_angle_to_furthest: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 15.0
        enabled: true
        offset_from_furthest: 20
        threshold_to_consider: 1.0
      TrajectoryVisualizer:
        time_step: 3
        trajectory_step: 5
      TwirlingCritic:
        cost_power: 1
        cost_weight: 10.0
        enabled: true
      batch_size: 1000
      benchmark_timing_file: /home/ehdrms/workspace/cleany/cleany-data/runs/lattice-mppi-gui-20261014/runtime-v3-restored/7_other_room/compute_timing.csv
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - TwirlingCritic
      enforce_path_inversion: false
      gamma: 0.0003
      goal_rotate_enter_radius: 0.1
      goal_rotate_exit_radius: 0.13
      iteration_count: 1
      max_robot_pose_search_dist: 2.0
      model_dt: 0.05
      motion_model: Omni
      path_seed_count: 64
      path_seed_max_speed: 0.25
      plugin: cleany_benchmark::TimedController
      prune_distance: 1.5
      regenerate_noises: false
      reset_period: 1.0
      retry_attempt_limit: 1
      temperature: 0.3
      time_steps: 80
      transform_tolerance: 0.3
      visualize: false
      vx_max: 0.3175
      vx_min: -0.3175
      vx_std: 0.035
      vy_max: 0.3175
      vy_std: 0.025
      wheel_max_rad_s: 5.0
      wheel_radius_m: 0.0635
      wheel_separation_m: 0.6038
      wheelbase_m: 0.35
      wrapped_plugin: nav2_mppi_controller::MPPIController
      wz_max: 0.6657580205493815
      wz_std: 0.07
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 1.0
    failure_tolerance: -1.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.17453292519943295
    goal_checker_plugins:
    - goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: odom
    progress_checker:
      movement_time_allowance: 1500.0
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.25
      required_movement_radius: 0.15
    progress_checker_plugin: progress_checker
    use_sim_time: false
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[-0.238525, -0.327373], [-0.238525, 0.327427], [0.238475, 0.327427],
        [0.238475, -0.327373]]'
      footprint_padding: 0.0
      global_frame: odom
      inflation_layer:
        cost_scaling_factor: 6.0
        inflation_radius: 0.8
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - inflation_layer
      resolution: 0.05
      robot_base_frame: base_link
      use_sim_time: false
