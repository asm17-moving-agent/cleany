global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[-0.238525, -0.327373], [-0.238525, 0.327427], [0.238475, 0.327427],
        [0.238475, -0.327373]]'
      footprint_padding: 0.0
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 6.0
        inflation_radius: 0.8
