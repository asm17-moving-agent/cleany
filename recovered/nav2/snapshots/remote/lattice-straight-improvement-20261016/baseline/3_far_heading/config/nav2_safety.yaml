controller_server:
  ros__parameters:
    FollowPath:
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 1000000.0
        consider_footprint: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        enabled: true
        inflation_layer_name: ''
        near_goal_distance: 1.0
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 15.0
        enabled: true
        threshold_to_consider: 1.0
      PathAlignCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 2
        threshold_to_consider: 1.0
        trajectory_point_step: 4
        use_path_orientations: true
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        enabled: false
        forward_preference: true
        max_angle_to_furthest: 1.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 15.0
        enabled: true
        offset_from_furthest: 20
        threshold_to_consider: 1.0
      TrajectoryVisualizer:
        time_step: 3
        trajectory_step: 5
      TwirlingCritic:
        cost_power: 1
        cost_weight: 10.0
        enabled: true
      batch_size: 1000
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - TwirlingCritic
      enforce_path_inversion: false
      gamma: 0.0003
      iteration_count: 1
      max_robot_pose_search_dist: 2.0
      model_dt: 0.05
      motion_model: Omni
      plugin: cleany_benchmark::TimedController
      prune_distance: 1.5
      regenerate_noises: true
      reset_period: 1.0
      retry_attempt_limit: 1
      temperature: 0.3
      time_steps: 80
      transform_tolerance: 0.3
      visualize: false
      vx_max: 0.3175
      vx_min: -0.3175
      vx_std: 0.035
      vy_max: 0.3175
      vy_std: 0.025
      wz_max: 0.6657580205493815
      wz_std: 0.07
      goal_rotate_enter_radius: 0.1
      goal_rotate_exit_radius: 0.13
      wheel_max_rad_s: 5.0
      wheel_radius_m: 0.0635
      wheelbase_m: 0.35
      wheel_separation_m: 0.6038
      wrapped_plugin: nav2_mppi_controller::MPPIController
      benchmark_timing_file: /home/donglee/workspace/cleany/lattice-straight-improvement-20261016/baseline/3_far_heading/compute_timing.csv
    failure_tolerance: -1.0
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.25
      movement_time_allowance: 1500.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.17453292519943295
    controller_frequency: 20.0
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[-0.238525,-0.32737300000024483],[-0.238525,0.32742700000024483],[0.238475,0.32742700000024483],[0.238475,-0.32737300000024483]]'
      inflation_layer:
        inflation_radius: 0.8
      plugins:
      - obstacle_layer
      - depth_layer
      - inflation_layer
      depth_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: -0.38
        z_resolution: 0.15
        z_voxels: 16
        mark_threshold: 0
        unknown_threshold: 15
        min_obstacle_height: -0.33
        max_obstacle_height: 1.62
        publish_voxel_map: true
        observation_sources: depth depth_clear
        depth:
          topic: /camera/head/depth/obstacle_points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.33
          max_obstacle_height: 1.62
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
        depth_clear:
          topic: /camera/head/depth/points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
      footprint_padding: 0.0
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[-0.238525,-0.32737300000024483],[-0.238525,0.32742700000024483],[0.238475,0.32742700000024483],[0.238475,-0.32737300000024483]]'
      inflation_layer:
        inflation_radius: 0.8
      footprint_padding: 0.0
      plugins:
      - static_layer
      - memory_layer
      - obstacle_layer
      - inflation_layer
      use_maximum: true
      memory_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /obstacle_memory/grid
        map_subscribe_transient_local: true
        subscribe_to_updates: false
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /nav2/cmd_vel
    cmd_vel_out_topic: /safety_2d/cmd_vel
    state_topic: /collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.6
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - StopZone
    - SlowZone
    StopZone:
      type: polygon
      points: '[[-0.238525, -0.32737300000024483], [-0.238525, 0.32742700000024483],
        [0.238475, 0.32742700000024483], [0.238475, -0.32737300000024483]]'
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: /safety/stop_zone
    SlowZone:
      type: polygon
      points: '[[-0.438525, -0.5273730000002448], [-0.438525, 0.5274270000002448],
        [0.438475, 0.5274270000002448], [0.438475, -0.5273730000002448]]'
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: /safety/slow_zone
    observation_sources:
    - scan
    - depth
    scan:
      type: scan
      topic: /scan
    depth:
      type: pointcloud
      topic: /camera/head/depth/points
      min_height: -0.33
      max_height: 1.62
depth_camera_tf:
  translation:
  - 0.13575291981941817
  - -0.001999999999964942
  - 0.7907902750404355
  rotation_rpy:
  - 0.0
  - 0.3490658503988659
  - 4.136462142204289e-13
  pan_pivot:
  - 0.103
  - 2.1302780032352088e-14
  - 0.673
depth_clearance:
  ros__parameters:
    use_sim_time: true
    marking_min_z: -0.33
    marking_max_z: 1.62
    pixel_stride: 4
    positive_infinity_is_free: true
    clearing_distance: 5.0
    marking_max_range: 4.0
    sensor_far_clip: 10.0
bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - cleany_yield_wait_bt_node
planner_server:
  ros__parameters:
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerLattice
      tolerance: 0.05
      allow_unknown: false
      smooth_path: false
      allow_reverse_expansion: true
      max_planning_time: 80.0
      max_iterations: -1
      cache_obstacle_heuristic: false
      lattice_filepath: /opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/omni/output.json
      cost_penalty: 2.0
