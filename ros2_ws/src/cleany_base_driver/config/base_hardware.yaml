# User-supplied geometry: 127 mm wheel diameter and 350 mm front/rear spacing.
# Initial lifted-wheel test profile, not a validated floor-driving limit.
mode: hardware
geometry:
  # 127 mm diameter -> 63.5 mm radius.
  wheel_radius_m: 0.0635
  wheelbase_m: 0.350
  # 2026-10-31 turn fit: 136.95 mm effective width, rounded to the nearest 5 mm.
  wheel_separation_m: 0.135
  # Confirmed on 2026-10-31: the standard +Y wheel pattern moves right.
  lateral_sign: -1
limits:
  # Input-axis ceilings; proportional wheel scaling still limits the targets.
  linear_x_mps: 0.5
  linear_y_mps: 0.5
  angular_z_rad_s: 1.0
  # Independent wheel ceiling, matching the MCU protocol maximum.
  wheel_rad_s: 10.0
  # Host cmd_vel freshness limit, separate from the MCU command deadline.
  command_timeout_s: 0.3
protocol:
  counts_per_revolution: 3172
  watchdog_ms: 250
