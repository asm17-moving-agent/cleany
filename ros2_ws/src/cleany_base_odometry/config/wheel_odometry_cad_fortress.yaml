# Simulation-only calibration for the CAD-frame Fortress facility profile.
# Physics step 0.0066667 s; no injected odometry noise. Not a physical-robot calibration.
# Two independent runs measured yaw gains 1.0465 and 1.0469 using stamp-aligned GT.
wheel_odometry:
  ros__parameters:
    base_frame_id: base_link
    velocity_window_s: 0.125
    front_left_joint: front_left_wheel_joint
    front_right_joint: front_right_wheel_joint
    input_topic: joint_states
    odom_frame_id: odom
    output_topic: wheel/odom
    rear_left_joint: rear_left_wheel_joint
    rear_right_joint: rear_right_wheel_joint
    wheel_radius_m: 0.0635
    wheel_separation_m: 0.6038
    wheelbase_m: 0.35
    yaw_scale: 1.047
