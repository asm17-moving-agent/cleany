<!doctype html>
<html lang="ko" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate"><title>Cleany</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/face.css"><script src="/face.js" defer></script></head>
<body><main id="cleany-display" aria-label="Cleany 로봇 디스플레이"><div class="cd-screen" data-mode="idle">
    <div class="cd-scene">
      <canvas role="img" aria-label="편안한 표정의 Cleany">Cleany의 움직이는 표정</canvas>
      <div class="cd-dreams" hidden aria-hidden="true"><span>Z</span><span>z</span><span>z</span></div>
      <div class="cd-caption" aria-live="polite" aria-atomic="true">
        <span class="cd-symbol" aria-hidden="true"></span>
        <span class="cd-message"></span>
        <span class="cd-result" hidden></span>
      </div>
      <div class="cd-help" hidden role="alert" aria-atomic="true">
        <div class="cd-help-heading">도움이 필요해요</div>
        <div class="cd-help-request">상태를 확인해 주세요</div>
      </div>
    </div>
</div></main></body></html>
