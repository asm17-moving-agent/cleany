gazebo_command_guard:
  ros__parameters:
    max_linear_x: 0.3
    max_linear_y: 0.3
    max_angular_z: 0.8
    cmd_vel_timeout_sec: 0.5
    timeout_check_rate_hz: 20.0

gazebo_odom_tf_publisher:
  ros__parameters:
    odom_frame_id: odom
    base_frame_id: base_link

gazebo_sensor_tf_publisher:
  ros__parameters:
    parent_frame_id: base_link
    lidar_frame_id: lidar_link
    lidar_translation: [0.32, 0.0, -0.18]
    lidar_rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
    imu_frame_id: imu_link
    imu_translation: [0.0, 0.0, 0.0]
    imu_rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
