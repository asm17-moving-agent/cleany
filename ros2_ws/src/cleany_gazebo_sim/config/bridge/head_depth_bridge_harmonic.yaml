# Project the undistorted depth image using this sensor's CameraInfo.
- ros_topic_name: /camera/head/depth/image_raw
  gz_topic_name: /model/cleany_mecanum/head_camera/depth/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA

- ros_topic_name: /camera/head/depth/camera_info
  gz_topic_name: /model/cleany_mecanum/head_camera/depth/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
