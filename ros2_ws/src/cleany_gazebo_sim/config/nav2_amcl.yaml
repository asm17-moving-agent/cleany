# 공통 설정을 복제하지 않고 환경별 차이만 유지합니다. cleany_navigation/config/nav2_amcl.yaml 위에 적용합니다.
amcl:
  ros__parameters:
    use_sim_time: true
    set_initial_pose: true
    always_reset_initial_pose: true
map_server:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /wheel/odom
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    FollowPath:
      vy_max: 0.25
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      obstacle_layer:
        min_obstacle_height: -0.33
        scan:
          min_obstacle_height: -0.33
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      obstacle_layer:
        min_obstacle_height: -0.33
        scan:
          min_obstacle_height: -0.33
planner_server:
  ros__parameters:
    use_sim_time: true
behavior_server:
  ros__parameters:
    use_sim_time: true
bt_navigator:
  ros__parameters:
    use_sim_time: true
    odom_topic: /wheel/odom
