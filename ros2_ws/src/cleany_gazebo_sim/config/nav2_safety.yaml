# SCRUM-306 simulation evaluation values, not approved physical safety limits.
# odom z=0 is base_link at world z=0.38 m. Floor is odom z=-0.38 m.
controller_server:
  ros__parameters:
    FollowPath:
      # Four seconds at 0.25 m/s lets the optimizer see beyond a desk corner.
      time_steps: 80
      PathAlignCritic:
        cost_weight: 3.0
        threshold_to_consider: 1.0
      PathFollowCritic:
        cost_weight: 15.0
        offset_from_furthest: 20
        # Hand off after the obstacle, at the 4 s * 0.25 m/s prediction range.
        threshold_to_consider: 1.0
      GoalCritic:
        cost_weight: 15.0
        threshold_to_consider: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      # Plan with the stop envelope so a geometrically valid base path does
      # not repeatedly enter the independent monitor's larger stop region.
      footprint: "[[-0.48, -0.40], [-0.48, 0.40], [0.48, 0.40], [0.48, -0.40]]"
      inflation_layer:
        inflation_radius: 0.8
      plugins: [obstacle_layer, depth_layer, inflation_layer]
      depth_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: -0.38
        z_resolution: 0.15
        z_voxels: 16
        mark_threshold: 0
        unknown_threshold: 15
        min_obstacle_height: -0.33
        max_obstacle_height: 1.62
        publish_voxel_map: true
        observation_sources: depth
        depth:
          topic: /camera/head/depth/points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: true
          clearing: true
          # Keep floor/ceiling endpoints for clearing rays. The layer above
          # separately restricts the height of points marked as obstacles.
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[-0.48, -0.40], [-0.48, 0.40], [0.48, 0.40], [0.48, -0.40]]"
      inflation_layer:
        inflation_radius: 0.8

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /nav2/cmd_vel
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.6
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [StopZone, SlowZone]
    StopZone:
      type: polygon
      points: "[[0.48, 0.40], [0.48, -0.40], [-0.48, -0.40], [-0.48, 0.40]]"
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: /safety/stop_zone
    SlowZone:
      type: polygon
      points: "[[0.80, 0.55], [0.80, -0.55], [-0.80, -0.55], [-0.80, 0.55]]"
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: /safety/slow_zone
    observation_sources: [scan, depth]
    scan:
      type: scan
      topic: /scan
    depth:
      type: pointcloud
      topic: /camera/head/depth/points
      min_height: -0.33
      max_height: 1.62

# Fixed, level head pose from the Gazebo model's top/head mount chain.
# This frame uses Gazebo XYZ camera axes; it is not an optical frame.
depth_camera_tf:
  translation: [0.127, -0.002, 0.80115]
  rotation_rpy: [0.0, 0.0, 0.0]

depth_clearance:
  ros__parameters:
    use_sim_time: true
    pixel_stride: 4
    # Gazebo Ogre2: +inf = beyond far clip; -inf = too near. Never use this
    # assumption for physical RGB-D invalid pixels without a sensor contract.
    positive_infinity_is_free: true
    clearing_distance: 5.0
    marking_max_range: 4.0
    sensor_far_clip: 10.0

bt_navigator:
  ros__parameters:
    plugin_lib_names: [cleany_yield_wait_bt_node]
