# SCRUM-306 시뮬레이션 평가값이며 승인된 실물 안전 한계가 아닙니다.
# odom의 z=0은 world z=0.38m의 base_link입니다. 바닥은 odom z=-0.38m입니다.
controller_server:
  ros__parameters:
    FollowPath:
      # 0.25m/s로 4초를 예측하면 최적화기가 책상 모서리 너머를 고려할 수 있습니다.
      time_steps: 80
      PathAlignCritic:
        cost_weight: 3.0
        threshold_to_consider: 1.0
      PathFollowCritic:
        cost_weight: 15.0
        offset_from_furthest: 20
        # 장애물을 지난 뒤 4초 × 0.25m/s의 예측 거리에서 제어를 넘깁니다.
        threshold_to_consider: 1.0
      GoalCritic:
        cost_weight: 15.0
        threshold_to_consider: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      # 정지 외곽을 기준으로 계획해 기하학적으로 유효한 베이스 경로가 독립된
      # 모니터의 더 큰 정지 영역에 반복해서 진입하지 않게 합니다.
      footprint: "[[-0.48, -0.40], [-0.48, 0.40], [0.48, 0.40], [0.48, -0.40]]"
      inflation_layer:
        inflation_radius: 0.8
      plugins: [obstacle_layer, depth_layer, inflation_layer]
      depth_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        origin_z: -0.38
        z_resolution: 0.15
        z_voxels: 16
        mark_threshold: 0
        unknown_threshold: 15
        min_obstacle_height: -0.33
        max_obstacle_height: 1.62
        publish_voxel_map: true
        observation_sources: depth depth_clear
        depth:
          topic: /camera/head/depth/obstacle_points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.33
          max_obstacle_height: 1.62
          obstacle_min_range: 0.15
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 5.0
        depth_clear:
          topic: /camera/head/depth/points
          sensor_frame: head_camera_depth_frame
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -10.0
          max_obstacle_height: 10.0
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[-0.48, -0.40], [-0.48, 0.40], [0.48, 0.40], [0.48, -0.40]]"
      inflation_layer:
        inflation_radius: 0.8

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /nav2/cmd_vel
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.6
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [StopZone, SlowZone]
    StopZone:
      type: polygon
      points: "[[0.48, 0.40], [0.48, -0.40], [-0.48, -0.40], [-0.48, 0.40]]"
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: /safety/stop_zone
    SlowZone:
      type: polygon
      points: "[[0.80, 0.55], [0.80, -0.55], [-0.80, -0.55], [-0.80, 0.55]]"
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: /safety/slow_zone
    observation_sources: [scan, depth]
    scan:
      type: scan
      topic: /scan
    depth:
      type: pointcloud
      topic: /camera/head/depth/points
      min_height: -0.33
      max_height: 1.62

# Gazebo 모델의 상단과 헤드 장착 체인에 따른 고정 수평 헤드 자세입니다.
# Gazebo XYZ 카메라 축을 사용하는 좌표계이며 광학 좌표계가 아닙니다.
depth_camera_tf:
  translation: [0.127, -0.002, 0.80115]
  rotation_rpy: [0.0, 0.0, 0.0]

depth_clearance:
  ros__parameters:
    use_sim_time: true
    marking_min_z: -0.33
    marking_max_z: 1.62
    pixel_stride: 4
    # Gazebo Ogre2에서 +inf는 원거리 절단면 밖, -inf는 너무 가까운 값입니다.
    # 센서 계약을 확인하지 않고 실물 RGB-D의 무효 픽셀에 이 가정을 적용하지 않습니다.
    positive_infinity_is_free: true
    clearing_distance: 5.0
    marking_max_range: 4.0
    sensor_far_clip: 10.0

bt_navigator:
  ros__parameters:
    plugin_lib_names: [cleany_yield_wait_bt_node]
