simulated_encoder:
  ros__parameters:
    input_topic: joint_states
    output_topic: wheel_encoder/joint_states
    ticks_per_revolution: 3172
    tick_noise_stddev: 0.0
    random_seed: 42
    front_left_joint: front_left_wheel_joint
    front_right_joint: front_right_wheel_joint
    rear_left_joint: rear_left_wheel_joint
    rear_right_joint: rear_right_wheel_joint
    front_left_scale: 1.0
    front_right_scale: 1.0
    rear_left_scale: 1.0
    rear_right_scale: 1.0
