ground_truth_route_follower:
  ros__parameters:
    max_linear_speed: 0.20
    max_angular_speed: 0.30
    max_linear_acceleration: 0.20
    heading_gain: 1.2
    position_tolerance: 0.09
    heading_tolerance: 0.08
    turn_in_place_threshold: 0.15
    control_rate_hz: 20.0
    odom_timeout_sec: 0.5
    # 측정된 48석 데모 공간의 경로입니다. 수평 통로 네 개를 순회하고
    # 수직 통로 두 개로 연결한 뒤
    # 시작점으로 돌아옵니다.
    waypoints_xy: [
      -1.865, -4.705,
      -5.65, -4.705,
      5.65, -4.705,
      1.865, -4.705,
      1.865, -1.585,
      5.65, -1.585,
      -5.65, -1.585,
      -1.865, -1.585,
      -1.865, 1.585,
      -5.65, 1.585,
      5.65, 1.585,
      1.865, 1.585,
      1.865, 4.705,
      5.65, 4.705,
      -5.65, 4.705,
      -1.865, 4.705,
      -1.865, -4.705
    ]
