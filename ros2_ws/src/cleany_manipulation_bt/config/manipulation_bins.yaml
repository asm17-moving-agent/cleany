# BT 시뮬레이션 전용 배치이며 쓰레기 수거함 입구를 Y 방향으로 10mm 넓힙니다.
# 장착 강도와 실제 수거 궤적은 검증되지 않았습니다.
# +X는 전방, +Y는 로봇 왼쪽입니다. 이 배치에는 테이블 구역이나 구분선이 없습니다.
# 차체 내부 후방 장착 트레이이며 launch 호환성을 위해 파일명을 유지합니다.
schema_version: 1
frame_id: base_link
# 시뮬레이션 전용 단순화입니다. 기둥 외형은 유지하되 물리적 접촉은 무시합니다.
simulation_ignore_mast_collision: true
internal_tray:
  center_xy_m: [-0.075, 0.0]
  size_xy_m: [0.21, 0.46]
  top_z_m: 0.22
  board_thickness_m: 0.012
  board_rgba: [0.28, 0.30, 0.33, 1.0]
bins:
  - id: lost_items_left
    label: LOST ITEMS
    center_xy_m: [-0.075, 0.105]
    bottom_z_m: 0.22
    outside_size_m: [0.18, 0.17, 0.12]
    wall_thickness_m: 0.008
    rgba: [0.15, 0.19, 0.26, 1.0]
    rim_rgba: [0.27, 0.58, 0.67, 1.0]
  - id: trash_right
    label: TRASH
    center_xy_m: [-0.075, -0.105]
    bottom_z_m: 0.22
    outside_size_m: [0.18, 0.18, 0.12]
    wall_thickness_m: 0.008
    rgba: [0.15, 0.19, 0.26, 1.0]
    rim_rgba: [0.78, 0.49, 0.26, 1.0]
