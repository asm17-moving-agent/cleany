planning_plugin: ompl_interface/OMPLPlanner
request_adapters: >-
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.1
# Joint-space rounding bound; this is not a Cartesian clearance guarantee.
path_tolerance: 0.0001

planner_configs:
  RRTConnectkConfigDefault:
    type: geometric::RRTConnect
    range: 0.0
  # The return executor already shortens and validates its executable cubic.
  # Skip OMPL's additional simplification pass; keep collision interpolation
  # and the request adapters, including time parameterization, unchanged.
  RRTConnectReturnkConfigDefault:
    type: geometric::RRTConnect
    range: 0.0
    # MoveIt 2.5.9 parses this planner option with lexical_cast<bool>.
    simplify_solutions: 0

left_arm:
  planner_configs:
    - RRTConnectkConfigDefault

right_arm:
  planner_configs:
    - RRTConnectkConfigDefault
left_grasp_arm:
  longest_valid_segment_fraction: 0.001
  planner_configs:
    - RRTConnectkConfigDefault
    - RRTConnectReturnkConfigDefault
right_grasp_arm:
  longest_valid_segment_fraction: 0.001
  planner_configs:
    - RRTConnectkConfigDefault
    - RRTConnectReturnkConfigDefault
left_pregrasp_aim_arm:
  planner_configs:
    - RRTConnectkConfigDefault
right_pregrasp_aim_arm:
  planner_configs:
    - RRTConnectkConfigDefault
left_pregrasp_open:
  longest_valid_segment_fraction: 0.001
  planner_configs:
    - RRTConnectkConfigDefault
right_pregrasp_open:
  longest_valid_segment_fraction: 0.001
  planner_configs:
    - RRTConnectkConfigDefault
left_return_close:
  longest_valid_segment_fraction: 0.001
  planner_configs:
    - RRTConnectkConfigDefault
right_return_close:
  longest_valid_segment_fraction: 0.001
  planner_configs:
    - RRTConnectkConfigDefault
