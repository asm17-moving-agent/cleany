controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_yaw_joint
      - left_shoulder_pitch_joint
      - left_elbow_pitch_joint
      - left_wrist_pitch_joint
      - left_wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      left_shoulder_yaw_joint: {trajectory: 0.05, goal: 0.01}
      left_shoulder_pitch_joint: {trajectory: 0.05, goal: 0.01}
      left_elbow_pitch_joint: {trajectory: 0.05, goal: 0.01}
      left_wrist_pitch_joint: {trajectory: 0.05, goal: 0.01}
      left_wrist_roll_joint: {trajectory: 0.05, goal: 0.01}

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_yaw_joint
      - right_shoulder_pitch_joint
      - right_elbow_pitch_joint
      - right_wrist_pitch_joint
      - right_wrist_roll_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 2.0
      right_shoulder_yaw_joint: {trajectory: 0.05, goal: 0.01}
      right_shoulder_pitch_joint: {trajectory: 0.05, goal: 0.01}
      right_elbow_pitch_joint: {trajectory: 0.05, goal: 0.01}
      right_wrist_pitch_joint: {trajectory: 0.05, goal: 0.01}
      right_wrist_roll_joint: {trajectory: 0.05, goal: 0.01}

