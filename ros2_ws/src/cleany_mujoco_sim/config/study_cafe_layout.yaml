schema_version: 1

scene:
  ambient_rgba: [0.65, 0.65, 0.65, 1.0]
  background_rgba: [0.82, 0.83, 0.84, 1.0]

robot:
  # 월드 좌표계의 x, y, z, roll, pitch, yaw입니다.
  spawn_pose: [-1.865, -4.705, 0.38, 0.0, 0.0, 1.5708]

mujoco:
  # 의자 중심을 책상 쪽으로 0.10m 옮긴 뒤에도 로봇 자세는 유지합니다.
  robot_center_rearward_offset_m: 0.32
  # 물체 네 개가 모두 tilt 1.00rad의 640×480 헤드 RGB 카메라 안에 들어오게 합니다.
  # 이 로봇 시작 yaw에서는 책상 -X가 로봇 왼쪽입니다. 분실물은 왼쪽, 쓰레기는 오른쪽입니다.
  # 시험 배치일 뿐이며 분류와 팔 선택은 여전히 인식 결과를 사용합니다.
  tabletop_objects:
    - name: cup
      xy_offset_from_desk_center_m: [0.12, -0.175]
      yaw_rad: 0.20
      # 빈 종이컵입니다. 질량은 시뮬레이션 가정이며 측정 표본이 아닙니다.
      mass_kg: 0.008
      rgba: [0.92, 0.87, 0.74, 1.0]
      visual_type: paper_cup
      geometry:
        bottom_diameter_m: 0.0396
        wall_thickness_m: 0.000504
        segments: 32
        # 같은 평면의 벽 접촉 32개 대신 바닥 원판이 컵을 받치게 합니다.
        # 충돌에만 적용하며 RGB 메시와 위쪽 파지 표면은 유지합니다.
        collision_bottom_clearance_m: 0.00025
      collision:
        type: compound
        # 추가로 0.9배 축소하며 원본의 0.72배입니다. 질량과 마찰은 유지합니다.
        # 상단 지름과 높이이며 열린 경사 중공 벽과 바닥으로 구성합니다.
        size_m: [0.0612, 0.0684]
    - name: mouse
      # 왼쪽 배치를 유지하면서 로봇 쪽으로 8cm 옮깁니다.
      xy_offset_from_desk_center_m: [-0.14, -0.095]
      yaw_rad: -0.18
      mass_kg: 0.12
      rgba: [1.0, 1.0, 1.0, 1.0]
      collision:
        # 무선 마우스이며 가져온 렌더링 메시의 볼록 껍질을 사용합니다.
        type: mesh
        size_m: [0.110, 0.065, 0.035]
    - name: tissue
      xy_offset_from_desk_center_m: [0.11, -0.070]
      yaw_rad: 0.12
      mass_kg: 0.001
      rgba: [0.96, 0.96, 0.94, 1.0]
      visual_type: crumpled_tissue
      geometry:
        latitude_segments: 10
        longitude_segments: 24
        wrinkle_amplitude: 0.24
      collision:
        type: mesh
        size_m: [0.060, 0.050, 0.045]
    - name: lego
      xy_offset_from_desk_center_m: [-0.16, -0.205]
      yaw_rad: -0.25
      mass_kg: 0.0023
      rgba: [0.92, 0.035, 0.025, 1.0]
      visual_type: lego_brick
      geometry:
        studs_x: 4
        studs_y: 2
        stud_pitch_m: 0.016
        stud_diameter_m: 0.0096
        stud_height_m: 0.00396
      collision:
        type: compound
        # 표준 2×4 footprint의 2배이며 높이는 10% 증가합니다. 돌기 포함 25.08mm입니다.
        # 파지 비교에서 형상의 영향만 분리하도록 질량을 유지합니다.
        size_m: [0.0636, 0.0316, 0.02112]

room:
  inside_size_m: [12.26, 10.94]
  wall_thickness_m: 0.16
  wall_height_m: 2.5
  wall_rgba: [0.97, 0.97, 0.96, 1.0]
  wall_roughness: 0.92

desk_layout:
  # 8개 열을 측정 배치에 따라 3-2-3 블록으로 구성합니다.
  x_positions_m: [-5.53, -4.33, -3.13, -0.60, 0.60, 3.13, 4.33, 5.53]
  row_pair_centers_y_m: [3.17, 0.0, -3.17]
  rows:
    - desk_y_offset_m: 0.385
      chair_y_offset_from_desk_m: 0.285
    - desk_y_offset_m: -0.385
      chair_y_offset_from_desk_m: -0.285
  partition_center_z_m: 0.62
  monitor_y_offset_from_desk_center_m: 0.285
