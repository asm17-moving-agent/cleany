# CAD 바퀴 외곽 0.477 × 0.6548m에 footprint 여유 0.05m를 적용합니다.
# Cleany-final.FCStd 기준이며 깊이나 상체 여유는 표현하지 않습니다.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: '[[-0.2385,-0.3274],[-0.2385,0.3274],[0.2385,0.3274],[0.2385,-0.3274]]'
      footprint_padding: 0.05
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        inflation_radius: 0.8
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: '[[-0.2385,-0.3274],[-0.2385,0.3274],[0.2385,0.3274],[0.2385,-0.3274]]'
      footprint_padding: 0.05
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        inflation_radius: 0.8
