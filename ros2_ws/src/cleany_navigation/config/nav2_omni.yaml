# 공통 전방향 planner와 controller 계약입니다. 운용별 overlay와 함께 적용합니다.
controller_server:
  ros__parameters:
    goal_checker:
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.1
    FollowPath:
      plugin: cleany_navigation::MPPIController
      motion_model: Omni
      PathAlignCritic:
        # Follow path positions; motion and goal costs select body yaw.
        use_path_orientations: false
        offset_from_furthest: 2
      PathAngleCritic:
        enabled: false
planner_server:
  ros__parameters:
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerLattice
      allow_unknown: false
      smooth_path: false
      allow_reverse_expansion: true
      cache_obstacle_heuristic: false
      lattice_filepath: ''
      analytic_expansion_max_length: 0.0
      cost_penalty: 2.0
