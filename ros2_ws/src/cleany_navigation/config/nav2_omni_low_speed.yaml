# Low-speed Omni tuning; apply over nav2_omni.yaml.
controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.25
      movement_time_allowance: 20.0
    FollowPath:
      vx_max: 0.15
      vx_min: -0.15
      vy_max: 0.15
      wz_max: 0.3
      vx_std: 0.035
      vy_std: 0.025
      wz_std: 0.13
      CostCritic:
        consider_footprint: true
planner_server:
  ros__parameters:
    GridBased:
      tolerance: 0.05
      max_planning_time: 80.0
bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - cleany_yield_wait_bt_node
pan_motion_gate:
  ros__parameters:
    allow_reverse: true
    allow_lateral: true
    allow_mixed_motion: true
    translation_angle_deg: 0.0
