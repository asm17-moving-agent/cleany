# Holonomic DWB: simultaneous X/Y translation and yaw; camera follows atan2(vy, vx).
controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    goal_checker:
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.10
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.25
      movement_time_allowance: 20.0
    FollowPath:
      plugin: cleany_navigation::GoalDirectedController
      debug_trajectory_details: true
      trajectory_generator_name: cleany_navigation::HolonomicGenerator
      fine_translation_scale: 0.25
      # Same candidate-only controller used in the GUI 43/13 roundtrip checks.
      goal_directed_radius: 0.75
      min_vel_x: -0.15
      max_vel_x: 0.15
      min_vel_y: -0.15
      max_vel_y: 0.15
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      acc_lim_theta: 0.6
      decel_lim_x: -0.4
      decel_lim_y: -0.4
      decel_lim_theta: -0.6
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 11
      sim_time: 2.0
      discretize_by_time: true
      time_granularity: 0.05
      include_last_point: true
      # Publish the first acceleration-limited rollout velocity, not its target.
      limit_vel_cmd_in_traj: true
      use_elapsed_command_time: true
      preserve_translation_direction: true
      continuity_samples: true
      continuity_timeout_s: 0.5
      transform_tolerance: 0.3
      prune_plan: true
      prune_distance: 1.5
      forward_prune_distance: 2.0
      shorten_transformed_plan: true
      stateful: true
      xy_goal_tolerance: 0.03
      trans_stopped_velocity: 0.01
      critics:
      - ObstacleFootprint
      - CommandBearing
      - PathOrientation
      - PathDist
      - GoalDist
      - RotateToGoal
      - Twirling
      ObstacleFootprint.scale: 0.05
      ObstacleFootprint.class: cleany_navigation::SweptFootprintCritic
      CommandBearing.class: cleany_navigation::CommandBearingCritic
      CommandBearing.scale: 2.0
      CommandBearing.switch_cost: 0.5
      CommandBearing.switch_angle: 0.04
      CommandBearing.near_goal_distance: 0.3
      CommandBearing.free_goal_distance: 0.1
      PathOrientation.class: cleany_navigation::PathOrientationCritic
      PathOrientation.scale: 8.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      GoalDist.class: cleany_navigation::PreciseGoalDistCritic
      GoalDist.near_goal_distance: 0.3
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      Twirling.scale: 1.0
planner_server:
  ros__parameters:
    GridBased:
      plugin: cleany_navigation::StraightFirstPlanner
      tolerance: 0.05
      holonomic_direct_path: true
      require_exact_goal: true
      allow_unknown: false
      smooth_path: false
      allow_reverse_expansion: true
      max_planning_time: 2.0
      cache_obstacle_heuristic: false
      lattice_filepath: ''
      analytic_expansion_max_length: 0.0
      cost_penalty: 5.0
      lattice_collision_padding: 0.05
bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - cleany_yield_wait_bt_node
pan_motion_gate:
  ros__parameters:
    allow_reverse: true
    allow_lateral: true
    allow_mixed_motion: true
    translation_angle_deg: 0.0
