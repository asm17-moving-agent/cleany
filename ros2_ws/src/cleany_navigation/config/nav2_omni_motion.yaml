# Default holonomic Theta* + MPPI profile; camera follows atan2(vy, vx).
controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    goal_checker:
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.10
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.25
      movement_time_allowance: 20.0
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      vx_max: 0.15
      vx_min: -0.15
      vy_max: 0.15
      wz_max: 0.3
      vx_std: 0.035
      vy_std: 0.025
      wz_std: 0.13
      PathAlignCritic:
        use_path_orientations: false
        offset_from_furthest: 2
      PathAngleCritic:
        enabled: false
      CostCritic:
        consider_footprint: true
planner_server:
  ros__parameters:
    GridBased:
      plugin: nav2_theta_star_planner::ThetaStarPlanner
      allow_unknown: false
      w_traversal_cost: 5.0

bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - cleany_yield_wait_bt_node
pan_motion_gate:
  ros__parameters:
    allow_reverse: true
    allow_lateral: true
    allow_mixed_motion: true
    translation_angle_deg: 0.0
