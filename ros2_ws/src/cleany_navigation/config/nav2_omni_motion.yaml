# Holonomic DWB: simultaneous X/Y translation and yaw; camera follows atan2(vy, vx).
controller_server:
  ros__parameters:
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.15
      required_movement_angle: 0.25
      movement_time_allowance: 20.0
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: dwb_plugins::StandardTrajectoryGenerator
      min_vel_x: -0.15
      max_vel_x: 0.15
      min_vel_y: -0.15
      max_vel_y: 0.15
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.4
      acc_lim_y: 0.4
      acc_lim_theta: 0.6
      decel_lim_x: -0.4
      decel_lim_y: -0.4
      decel_lim_theta: -0.6
      vx_samples: 7
      vy_samples: 7
      vtheta_samples: 11
      sim_time: 2.0
      discretize_by_time: true
      time_granularity: 0.05
      include_last_point: true
      limit_vel_cmd_in_traj: false
      transform_tolerance: 0.3
      prune_plan: true
      prune_distance: 1.5
      forward_prune_distance: 2.0
      shorten_transformed_plan: true
      stateful: true
      xy_goal_tolerance: 0.12
      trans_stopped_velocity: 0.01
      critics:
      - ObstacleFootprint
      - PathDist
      - GoalDist
      - RotateToGoal
      ObstacleFootprint.scale: 0.05
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
planner_server:
  ros__parameters:
    GridBased:
      plugin: cleany_navigation::StraightFirstPlanner
      tolerance: 0.12
      allow_unknown: false
      smooth_path: false
      allow_reverse_expansion: true
      max_planning_time: 2.0
      cache_obstacle_heuristic: false
      lattice_filepath: ''
      analytic_expansion_max_length: 0.0
      cost_penalty: 5.0
      lattice_collision_padding: 0.05
bt_navigator:
  ros__parameters:
    plugin_lib_names:
    - cleany_yield_wait_bt_node
pan_motion_gate:
  ros__parameters:
    allow_reverse: true
    allow_lateral: true
    allow_mixed_motion: true
    translation_angle_deg: 0.0
