# Phone Omni: native Smac Lattice global planning and cost-based MPPI tracking.
controller_server:
  ros__parameters:
    speed_limit_topic: navigation/localization_speed_limit
    goal_checker:
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.1
    FollowPath:
      plugin: cleany_navigation::MPPIController
      motion_model: Omni
      time_steps: 60
      vx_max: 0.5
      vx_min: -0.5
      vy_max: 0.5
      wz_max: 0.7
      translation_max: 0.5
      vx_std: 0.1
      vy_std: 0.1
      wz_std: 0.2
      temperature: 0.1
      validate_output: true
      # Final actuator bound; body speeds are the operational limits.
      wheel_max_rad_s: 10.0
      acceleration_limits: true
      ax_max: 0.2
      ay_max: 0.15
      az_max: 0.4
      wheel_acceleration_max: 3.0
      path_velocity_weight: 0.0
      control_variation_weight: 1.0
      proximity_wheel_limit: 0.0
      proximity_translation_max: 0.16
      proximity_yaw_max: 0.3
      goal_translation_max: 0.06
      goal_yaw_max: 0.15
      goal_slow_radius: 0.2
      speed_limit_reaction_time: 0.3
      proximity_clearance: 0.11
      wheel_radius_m: 0.0635
      wheelbase_m: 0.35
      wheel_separation_m: 0.59
      goal_rotate_enter_radius: 0.0
      goal_rotate_exit_radius: 0.0
      path_rotate_enabled: false
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - TwirlingCritic
        - DirectionalMotionCritic
      DirectionalMotionCritic:
        enabled: true
        lateral_weight: 1.0
        diagonal_weight: 20.0
      GoalCritic:
        cost_weight: 40.0
        threshold_to_consider: 0.5
      GoalAngleCritic:
        cost_weight: 12.0
        threshold_to_consider: 0.15
      PathFollowCritic:
        cost_weight: 30.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        # Follow the path position; choose body yaw using motion and goal costs.
        use_path_orientations: false
        offset_from_furthest: 2
        cost_weight: 5.0
        threshold_to_consider: 0.15
      PathAngleCritic:
        enabled: false
      TwirlingCritic:
        enabled: true
        cost_weight: 1.0
      CostCritic:
        cost_weight: 3.81
        near_goal_distance: 0.3
planner_server:
  ros__parameters:
    GridBased:
      allow_reverse_expansion: true
      allow_unknown: false
      analytic_expansion_max_length: 0.0
      cache_obstacle_heuristic: false
      change_penalty: 0.05
      cost_penalty: 2.0
      lattice_filepath: ''
      max_planning_time: 2.0
      non_straight_penalty: 1.2
      plugin: nav2_smac_planner::SmacPlannerLattice
      reverse_penalty: 1.2
      rotation_penalty: 5.0
      smooth_path: false
      tolerance: 0.0
