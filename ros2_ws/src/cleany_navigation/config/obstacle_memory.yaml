obstacle_memory:
  ros__parameters:
    use_sim_time: false
    publish_3d: true
    mark_all_depth_points: true
    z_resolution: 0.05
    update_period: 0.2
    source_timeout_s: 0.8
    output_directory: ''
    restore_path: ''
    # Prototype tuning values: validate against the actual body/braking envelope.
    shared_voxel_costmap: true
    near_radius: 3.0
    local_radius: 4.0
    far_update_period: 1.0
    world_publish_period: 1.0
    memory_ttl_s: 300.0
    expiry_period: 1.0
