# Attended LiDAR-only demo. Depth and physical E-stop observations remain unverified, not fabricated.
startup_grace_s: 5.0
lease_s: 1.5
heartbeat_timeout_s: 1.0
stop_timeout_s: 6.0
retention_s: 300.0
startup_base_reconnect:
  enabled: true
  stable_s: 1.0
persistence:
  state_file: ~/.local/state/cleany/phone-nav2-supervisor.json
essential_capabilities:
- BASE_MOTION
safety_sources:
- base
- lidar
- navigation
- publisher_trust
recovery_safety_sources:
- base_disarmed
sources:
  localization_alignment:
    stale_s: 0.5
    raise_s: 0.2
    clear_s: 1.0
    startup_grace_s: 20.0
    fault_code: LOCALIZATION_ALIGNMENT_UNAVAILABLE
    severity: ERROR
    latched: false
    locks_operation: false
    recovery: localization
  base_disarmed:
    stale_s: 0.3
    raise_s: 0.0
    clear_s: 1.0
    fault_code: BASE_DISARM_UNVERIFIED
    severity: WARNING
    latched: false
    locks_operation: false
    recovery: ''
    monitor_only: true
  base:
    stale_s: 0.3
    raise_s: 0.3
    clear_s: 0.5
    startup_grace_s: 15.0
    fault_code: BASE_UNAVAILABLE
    severity: CRITICAL
    latched: true
    locks_operation: true
    recovery: ''
  lidar:
    stale_s: 0.5
    raise_s: 0.1
    clear_s: 0.5
    fault_code: LIDAR_UNAVAILABLE
    severity: ERROR
    latched: false
    locks_operation: false
    recovery: ''
  localization:
    stale_s: 1.0
    raise_s: 0.2
    clear_s: 1.0
    startup_grace_s: 20.0
    fault_code: LOCALIZATION_UNAVAILABLE
    severity: ERROR
    latched: false
    locks_operation: false
    # The alignment owner also checks covariance; one fault owns the retry budget.
    recovery: ''
  navigation:
    stale_s: 1.5
    raise_s: 0.2
    clear_s: 0.5
    fault_code: NAVIGATION_UNAVAILABLE
    severity: ERROR
    latched: false
    locks_operation: false
    recovery: navigation
  publisher_trust:
    stale_s: 3.0
    raise_s: 0.0
    clear_s: 0.5
    fault_code: UNTRUSTED_PUBLISHER
    severity: CRITICAL
    latched: true
    locks_operation: true
    recovery: ''
  stopped:
    stale_s: 0.3
    raise_s: 0.0
    clear_s: 0.5
    fault_code: STOP_UNVERIFIED
    severity: WARNING
    latched: false
    locks_operation: false
    recovery: ''
    monitor_only: true
  camera:
    stale_s: 1.0
    raise_s: 0.2
    clear_s: 0.5
    fault_code: CAMERA_UNAVAILABLE
    severity: ERROR
    latched: false
    locks_operation: false
    recovery: ''
    monitor_only: true
  perception:
    stale_s: 1.0
    raise_s: 0.2
    clear_s: 0.5
    fault_code: PERCEPTION_UNAVAILABLE
    severity: ERROR
    latched: false
    locks_operation: false
    recovery: ''
    monitor_only: true
  arm:
    stale_s: 0.5
    raise_s: 0.1
    clear_s: 0.5
    fault_code: ARM_UNAVAILABLE
    severity: ERROR
    latched: false
    locks_operation: false
    recovery: ''
    monitor_only: true
  safety:
    stale_s: 0.3
    raise_s: 0.0
    clear_s: 0.5
    fault_code: SAFETY_UNVERIFIED
    severity: CRITICAL
    latched: true
    locks_operation: true
    recovery: ''
    monitor_only: true
  estop:
    stale_s: 0.3
    raise_s: 0.0
    clear_s: 0.5
    fault_code: ESTOP
    severity: CRITICAL
    latched: true
    locks_operation: true
    recovery: ''
    monitor_only: true
capabilities:
  BASE_MOTION:
    sources:
    - base
    depends_on: []
  NAVIGATION:
    sources:
    - lidar
    - localization
    - localization_alignment
    - navigation
    depends_on:
    - BASE_MOTION
recovery_policies:
  localization:
    action: localization/recover
    automatic: true
    max_attempts: 2
    attempt_timeout_s: 15.0
    total_timeout_s: 40.0
    verify_timeout_s: 5.0
    cancel_timeout_s: 2.0
  navigation:
    action: navigation/recover
    automatic: false
    max_attempts: 2
    attempt_timeout_s: 15.0
    total_timeout_s: 40.0
    verify_timeout_s: 5.0
    cancel_timeout_s: 2.0
ros:
  scan_topic: scan
  pose_topic: amcl_pose
  camera_topic: camera/head/color/image_raw
  diagnostics_topic: diagnostics
  component_health_topic: system/component_health
  component_sources:
  - localization_alignment
  safety_topic: safety/status
  stop_action: navigation/stop
  navigation_nodes:
  - planner_server
  - controller_server
  - bt_navigator
  - collision_monitor
  localization_nodes:
  - map_server
  - amcl
  lifecycle_poll_s: 0.5
  localization_max_variance: 0.5
  minimum_scan_valid_ratio: 0.1
  max_sensor_age_s: 1.0
  diagnostics_period_s: 1.0
  trusted_publishers:
    safety/status:
    - /safety_adapter
    system/component_health:
    - /arm_health_monitor
    - /perception_inspector
    - /localization_guard
