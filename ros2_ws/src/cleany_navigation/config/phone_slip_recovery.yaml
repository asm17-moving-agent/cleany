# Experimental traction recovery; independent collision STOP remains downstream.
recovery:
  unknown_timeout: 3.0
  observation_timeout: 1.5
  stop_timeout: 5.0
  settle: 0.5
  stop_linear: 0.01
  stop_angular: 0.03
slip_monitor:
  ros__parameters:
    window_s: 1.0
    stride_s: 0.5
    minimum_consecutive_windows: 2
    translation_error_m: 0.03
    translation_error_fraction: 0.35
    rotation_error_rad: 0.07
    rotation_error_fraction: 0.35
    maximum_input_age_s: 0.5
traction_brake:
  ros__parameters:
    linear_deceleration: 0.2
    angular_deceleration: 0.4
    wheel_acceleration: 3.0
    wheel_radius: 0.0635
    wheel_arm: 0.47
    heartbeat_timeout_s: 0.5
    command_timeout_s: 0.3
