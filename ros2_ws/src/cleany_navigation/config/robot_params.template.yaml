# 패키지 밖으로 복사하고 백엔드 형상과 측정된 보수적 제동 한계로
# 모든 null을 채웁니다. 이 템플릿은 의도적으로 그대로 실행할 수 없습니다.
voxel_guard:
  ros__parameters:
    profile: body_profile.yaml
    max_speed: null
    max_yaw_rate: null
    reaction_s: null
    linear_deceleration: null
    angular_deceleration: null
obstacle_memory:
  ros__parameters:
    floor_z: null  # map의 바닥 높이이며 미터 단위입니다.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: null  # base_link의 [[x,y], ...] 형식 문자열입니다.
      obstacle_layer:
        min_obstacle_height: null
        scan:
          min_obstacle_height: null
      depth_layer:
        origin_z: null  # 로컬 costmap 좌표계의 바닥 높이입니다.
        min_obstacle_height: null
        max_obstacle_height: null
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: null
      obstacle_layer:
        min_obstacle_height: null
        scan:
          min_obstacle_height: null
collision_monitor:
  ros__parameters:
    StopZone:
      points: null  # base_link의 [[x,y], ...] 형식 문자열입니다.
    SlowZone:
      points: null
    depth:
      min_height: null
      max_height: null
depth_clearance:
  ros__parameters:
    camera_frame: head_camera_depth_frame
    optical_frame: head_camera_depth_optical_frame
    positive_infinity_is_free: false
    allow_simulation_limits: false
# 제어기 속도 및 가속도 한계와 깊이 범위도 백엔드에 맞춰 조정합니다.
# AMCL은 초기 자세를 추측하지 않고 시작하며 활성화 후 initialpose를 발행해야 합니다.
