# Physical tabletop vocabulary extended with 21 fixed text prompts.
perception_inspector:
  ros__parameters:
    detector_type: yoloe_gemini
    segmenter_type: yoloe_seg
    preload_models: true
    yoloe_model_path: yoloe/yoloe-26m-seg.pt
    yoloe_text_encoder_directory: yoloe
    yoloe_classes:
    - cup
    - bottle
    - can
    - lid
    - straw
    - paper
    - bag
    - food container
    - utensil
    - box
    - book
    - pen
    - eraser
    - case
    - phone
    - tablet
    - laptop
    - computer mouse
    - earbuds
    - cable
    - power bank
    - wallet
    - keys
    - eyeglasses
    - charger
    - tape
    - card
    - scissors
    - remote
    - lighter
    - cigarette
    - keyboard
    - speaker
    - camera
    - clock
    - watch
    - toilet paper roll
    - face mask
    - battery
    - screwdriver
    - hammer
    - measuring tape
    - comb
    - mirror
    - nail clipper
    - lipstick
    - hair clip
    - rubber band
    - cotton swab
    - plate
    - doll
    - vase
    - picture frame
    yoloe_device: auto
    yoloe_image_size: 640
    yoloe_iou_threshold: 0.5
    minimum_detection_confidence: 0.25
    maximum_detections: 10
    default_query: Detect visible movable objects on the tabletop.
    gemini_model: gemini-decision-1
    gemini_api_key_environment: GEMINI_API_KEY
    gemini_jpeg_quality: 95
    detector_timeout_seconds: 30.0
