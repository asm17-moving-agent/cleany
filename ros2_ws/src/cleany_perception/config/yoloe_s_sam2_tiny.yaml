# Shared learned perception profile for simulated and real aligned RGB-D.
# Paths are relative to model_directory (default: $CLEANY_MODEL_DIR or ~/models).
perception_inspector:
  ros__parameters:
    detector_type: yoloe
    segmenter_type: sam2
    preload_models: true
    enable_reference_observation: true
    reference_ttl_seconds: 120.0
    reference_maximum_mask_fraction: 0.5
    reference_minimum_depth_fraction: 0.8
    reference_border_margin_px: 2
    reference_trim_fraction: 0.01
    yoloe_model_path: yoloe/yoloe-26s-seg.pt
    yoloe_text_encoder_directory: yoloe
    yoloe_classes: [cup, wallet, crumpled tissue, lego brick]
    yoloe_device: auto
    yoloe_image_size: 640
    yoloe_iou_threshold: 0.5
    minimum_detection_confidence: 0.25
    sam2_model_config: configs/sam2.1/sam2.1_hiera_t.yaml
    sam2_checkpoint: sam2/sam2.1_t.pt
    sam2_device: auto
    default_query: Detect the paper cup, wallet, crumpled tissue, and LEGO brick.
