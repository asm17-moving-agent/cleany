# YOLOE instance masks with Gemini category and reason.
perception_inspector:
  ros__parameters:
    detector_type: yoloe_gemini
    segmenter_type: yoloe_seg
    preload_models: true
    yoloe_model_path: yoloe/yoloe-26s-seg.pt
    yoloe_text_encoder_directory: yoloe
    yoloe_classes:
    - cup
    - computer mouse
    - crumpled tissue
    - lego brick
    yoloe_device: auto
    yoloe_image_size: 640
    yoloe_iou_threshold: 0.5
    minimum_detection_confidence: 0.25
    default_query: Detect visible movable objects on the tabletop. Describe each object
      with a concise label based on its visible appearance, without assuming an expected
      set of objects. If its identity is unclear, use a general description rather
      than guessing a specific object type. Exclude the table itself, fixed fixtures,
      and robot parts. Do not invent hidden or absent objects. Return an empty objects
      list if none are visible.
    gemini_model: gemini-3.1-flash-lite
    gemini_api_key_environment: GEMINI_API_KEY
    detector_timeout_seconds: 30.0
