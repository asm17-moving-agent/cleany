# VISUALIZATION ONLY: directions and URDF zero offsets need physical verification.
# Present_Position already includes motor EEPROM homing_offset; do not add it twice.
port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B14033435-if00
baudrate: 1000000
rate_hz: 20.0
calibration_dir: ~/.cache/huggingface/lerobot/calibration/robots/so_follower
arms:
  left: {first_id: 1, calibration: cleany_so101_left.json}
  right: {first_id: 7, calibration: cleany_so101_right.json}
joints:
  shoulder_pan: {suffix: shoulder_yaw_joint, direction: -1, zero_tick: 2048, offset_rad: 0.0}
  shoulder_lift: {suffix: shoulder_pitch_joint, direction: -1, zero_tick: 2048, offset_rad: 1.5707963267948966}
  elbow_flex: {suffix: elbow_pitch_joint, direction: 1, zero_tick: 2048, offset_rad: 1.5707963267948966}
  wrist_flex: {suffix: wrist_pitch_joint, direction: 1, zero_tick: 2048, offset_rad: 0.0}
  wrist_roll: {suffix: wrist_roll_joint, direction: 1, zero_tick: 2048, offset_rad: 1.5707963267948966}
  gripper: {suffix: gripper_joint, direction: 1, zero_tick: range_min, offset_rad: -0.37453297762778586}
# Left reference: configs/robot/poses/left_arm_ros_reference_20261005.json.
# Right reference: configs/robot/poses/right_arm_ros_reference_20261006.json.
# Manual CAD alignment does not establish precise angle or force calibration.
overrides:
  left:
    # 2026-10-05: user aligned the physical arm to the CAD zero pose.
    # ID 5 recentered by 611 ticks; user reports matching rotation directions.
    shoulder_pan: {direction: -1, zero_tick: 2044.0, offset_rad: 0.0}
    shoulder_lift: {direction: -1, zero_tick: 3104.0, offset_rad: 0.0}
    elbow_flex: {direction: 1, zero_tick: 1049.0, offset_rad: 0.0}
    # Straight-wrist reference refined separately: 60 stable samples at ID 4.
    wrist_flex: {direction: 1, zero_tick: 2008.0, offset_rad: 0.0}
    wrist_roll: {direction: -1, zero_tick: 2513.0, offset_rad: 0.0}
    gripper: {direction: 1, zero_tick: 1345.0, offset_rad: -0.37453297762778587}
  right:
    # 2026-10-06: user aligned the physical arm to the CAD zero pose.
    # ID 11 recentered by 674 ticks after a separate operating-range measurement.
    shoulder_pan: {direction: -1, zero_tick: 2043.0, offset_rad: 0.0}
    shoulder_lift: {direction: -1, zero_tick: 3108.0, offset_rad: 0.0}
    # Folded-parallel reference: ID 9 raw 3100 is 180 degrees (60 stable samples).
    elbow_flex: {direction: 1, zero_tick: 1052.0, offset_rad: 0.0}
    wrist_flex: {direction: 1, zero_tick: 2053.0, offset_rad: 0.0}
    wrist_roll: {direction: -1, zero_tick: 2467.0, offset_rad: 0.0}
    gripper: {direction: 1, zero_tick: 1359.0, offset_rad: -0.37453297762778587}
