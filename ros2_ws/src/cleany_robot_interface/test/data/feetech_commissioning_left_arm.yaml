# SYNTHETIC TEST INPUT ONLY. No commissioning or deployment claim.
# Supported left-arm commissioning. ID 6 holds its current opening, no grasp goal.
# Provisional physical limits; coarse motion acceptance does not validate precision.
status: left_arm_motion_not_validated
command_joints:
  - left_shoulder_yaw_joint
  - left_shoulder_pitch_joint
  - left_elbow_pitch_joint
  - left_wrist_pitch_joint
  - left_wrist_roll_joint
  - left_gripper_joint
update_rate: 50
serial_timeout_ms: 20
max_state_age_s: 0.1
temperature_limit_c: 60
temperature_fault_confirmation_samples: 3
joint_defaults:
  max_velocity: 0.04
  max_acceleration: 0.15
  tracking_error: 0.04
  speed_raw: 1
  acceleration_raw: 5
  torque_limit_raw: 250
controller:
  trajectory_tolerance: 0.03
  goal_tolerance: 0.015   # Existing full-arm coarse tolerance, 0.859 degrees.
  goal_time: 3.0
