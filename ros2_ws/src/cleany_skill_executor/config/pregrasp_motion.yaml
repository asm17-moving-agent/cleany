# Physical pregrasp limits shared by the CPU and GPU candidate IK backends.
# Alignment limits match the geometric/CAD plan-only trial on 2026-10-13.
grasp_selection_server:
  ros__parameters:
    maximum_candidates: 32
    grasp_ik_first: true
    grasp_approach_offset_m: 0.0
    # Try shorter preparation poses only after the preceding endpoint IK fails.
    pregrasp_fallback_offsets_m: [0.06, 0.04]
    position_tolerance_m: 0.010
    pregrasp_position_tolerance_m: 0.010
    approach_tolerance_degrees: 30.0
    closing_tolerance_degrees: 30.0
    stop_after_first_feasible: true
    deduplicate_candidates: true
    # Reorder only equivalent 180-degree pairs using local measured-state FK.
    # Prefer the fixed jaw toward base_link +Y when estimated roll travel ties.
    prefer_near_wrist_grasp_direction: true
    wrist_direction_tie_tolerance_degrees: 5.0
    # MoveIt's plan-only result also includes trajectory processing and scene
    # locking. A measured 11.5s successful response exceeded the old 5s wait.
    planning_response_margin_sec: 20.0
    action_timeout_sec: 480.0
    robot_description_startup_timeout_sec: 30.0
    validate_motion_paths: true
    # Validate a direct joint cubic first; keep RRT for obstructed connections.
    pregrasp_joint_shortcut_enabled: true
    cartesian_approach_first: true
    # Check the final joint cubic and corridor before asking Cartesian IK/RRT.
    approach_joint_shortcut_enabled: true
    cartesian_approach_step_m: 0.005
    # Do not reject physical candidates solely for head-camera self-occlusion.
    require_pregrasp_visibility: false
    use_verified_local_fk: true
    pose_refinement_iterations: 10
    align_wrist_roll: true
    # Keep the +20mm asymmetric bias without clearance-based shifts.
    fixed_jaw_clearance_enabled: false
    fixed_jaw_minimum_clearance_m: 0.005
    fixed_jaw_maximum_correction_m: 0.010
    fixed_jaw_collision_meshes: ['Fixed_Jaw_part2.ply.convex.stl']
