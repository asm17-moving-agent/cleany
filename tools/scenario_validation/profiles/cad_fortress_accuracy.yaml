# Candidate under continuous-60 validation. Simulation-only, not hardware calibration.
# CAD facility / physics step 0.0066667 s / no injected wheel noise.
# Unlisted collision, arrival, freshness, velocity and deadline settings are inherited.
config/wheel_odometry.yaml:
  wheel_odometry:
    ros__parameters:
      yaw_scale: 1.047
config/nav2_safety.yaml:
  controller_server:
    ros__parameters:
      FollowPath:
        PathProgress.scale: 20.0
        critics:
        - ObstacleFootprint
        - ObstacleCenter
        - CommandBearing
        - PathOrientation
        - PathProgress
        - PathDist
        - GoalDist
        - RotateToGoal
        - Twirling
        ObstacleCenter.class: dwb_critics::BaseObstacleCritic
        ObstacleCenter.scale: 0.01
        ObstacleCenter.sum_scores: false
